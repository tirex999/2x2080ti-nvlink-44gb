<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Poly Hamster Playground</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 14px;
            pointer-events: none;
        }
        #info h1 { font-size: 18px; margin-bottom: 4px; color: #ffd93d; }
    </style>
</head>
<body>
<div id="info">
    <h1>🐹 Low-Poly Hamster Playground</h1>
    <span>Drag to rotate • Scroll to zoom</span>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 20, 50);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8, 7, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 1, 0);
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 5;
controls.maxDistance = 20;

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff4e0, 1.2);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 30;
dirLight.shadow.camera.left = -8;
dirLight.shadow.camera.right = 8;
dirLight.shadow.camera.top = 8;
dirLight.shadow.camera.bottom = -8;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xaaddff, 0.3);
fillLight.position.set(-3, 5, -3);
scene.add(fillLight);

// Materials
const matBody = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.8 });
const matPink = new THREE.MeshStandardMaterial({ color: 0xffb6c1, flatShading: true, roughness: 0.6 });
const matBlack = new THREE.MeshStandardMaterial({ color: 0x222222, flatShading: true });
const matWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
const matWood = new THREE.MeshStandardMaterial({ color: 0xdeb887, flatShading: true, roughness: 0.9 });
const matDarkWood = new THREE.MeshStandardMaterial({ color: 0x8b6914, flatShading: true, roughness: 0.9 });
const matMetal = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, flatShading: true, metalness: 0.6, roughness: 0.3 });
const matGlass = new THREE.MeshStandardMaterial({ color: 0xaaddff, flatShading: true, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
const matFood = new THREE.MeshStandardMaterial({ color: 0xff8c00, flatShading: true });
const matSeed = new THREE.MeshStandardMaterial({ color: 0xdaa520, flatShading: true });
const matTunnel = new THREE.MeshStandardMaterial({ color: 0x66bb6a, flatShading: true, roughness: 0.7 });

// ===== FLOOR / TRAY =====
function buildFloor() {
    const group = new THREE.Group();

    // Base tray
    const trayGeo = new THREE.BoxGeometry(10, 0.3, 8);
    const tray = new THREE.Mesh(trayGeo, matDarkWood);
    tray.position.y = -0.15;
    tray.receiveShadow = true;
    group.add(tray);

    // Wood shavings / bedding
    const bedGeo = new THREE.BoxGeometry(9.6, 0.2, 7.6);
    const bedMat = new THREE.MeshStandardMaterial({ color: 0xf5deb3, flatShading: true, roughness: 1.0 });
    const bed = new THREE.Mesh(bedGeo, bedMat);
    bed.position.y = 0.1;
    bed.receiveShadow = true;
    group.add(bed);

    // Scattered bedding bits
    for (let i = 0; i < 30; i++) {
        const size = 0.1 + Math.random() * 0.15;
        const bitGeo = new THREE.BoxGeometry(size, size * 0.5, size);
        const bit = new THREE.Mesh(bitGeo, bedMat);
        bit.position.set((Math.random() - 0.5) * 9, 0.22, (Math.random() - 0.5) * 7);
        bit.rotation.y = Math.random() * Math.PI;
        group.add(bit);
    }

    return group;
}
scene.add(buildFloor());

// ===== CAGE WALLS =====
function buildCage() {
    const group = new THREE.Group();
    const W = 10, H = 4, D = 8;
    const barRadius = 0.04;
    const barMat = matMetal;

    function makeBar(x1, y1, z1, x2, y2, z2) {
        const dir = new THREE.Vector3(x2 - x1, y2 - y1, z2 - z1);
        const len = dir.length();
        const geo = new THREE.CylinderGeometry(barRadius, barRadius, len, 6);
        const mesh = new THREE.Mesh(geo, barMat);
        mesh.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
        mesh.lookAt(new THREE.Vector3(x2, y2, z2));
        mesh.rotateX(Math.PI / 2);
        return mesh;
    }

    // Vertical bars - front (z = D/2)
    for (let i = 0; i <= 10; i++) {
        const x = -W/2 + i * (W / 10);
        group.add(makeBar(x, 0, D/2, x, H, D/2));
    }
    // Back (z = -D/2)
    for (let i = 0; i <= 10; i++) {
        const x = -W/2 + i * (W / 10);
        group.add(makeBar(x, 0, -D/2, x, H, -D/2));
    }
    // Left (x = -W/2)
    for (let i = 0; i <= 8; i++) {
        const z = -D/2 + i * (D / 8);
        group.add(makeBar(-W/2, 0, z, -W/2, H, z));
    }
    // Right (x = W/2)
    for (let i = 0; i <= 8; i++) {
        const z = -D/2 + i * (D / 8);
        group.add(makeBar(W/2, 0, z, W/2, H, z));
    }

    // Horizontal bars - top frame
    group.add(makeBar(-W/2, H, D/2, W/2, H, D/2));
    group.add(makeBar(-W/2, H, -D/2, W/2, H, -D/2));
    group.add(makeBar(-W/2, H, D/2, -W/2, H, -D/2));
    group.add(makeBar(W/2, H, D/2, W/2, H, -D/2));

    // Middle horizontal bars (front and back)
    group.add(makeBar(-W/2, H * 0.5, D/2, W/2, H * 0.5, D/2));
    group.add(makeBar(-W/2, H * 0.5, -D/2, W/2, H * 0.5, -D/2));

    // Corner posts (thicker)
    const postGeo = new THREE.CylinderGeometry(0.08, 0.08, H, 8);
    [[-W/2, D/2], [W/2, D/2], [-W/2, -D/2], [W/2, -D/2]].forEach(([x, z]) => {
        const post = new THREE.Mesh(postGeo, barMat);
        post.position.set(x, H/2, z);
        group.add(post);
    });

    // Glass panels (back and sides - subtle)
    const glassBack = new THREE.Mesh(new THREE.PlaneGeometry(W, H), matGlass);
    glassBack.position.set(0, H/2, -D/2 + 0.01);
    group.add(glassBack);

    const glassLeft = new THREE.Mesh(new THREE.PlaneGeometry(D, H), matGlass);
    glassLeft.position.set(-W/2 + 0.01, H/2, 0);
    glassLeft.rotation.y = Math.PI / 2;
    group.add(glassLeft);

    const glassRight = new THREE.Mesh(new THREE.PlaneGeometry(D, H), matGlass);
    glassRight.position.set(W/2 - 0.01, H/2, 0);
    glassRight.rotation.y = -Math.PI / 2;
    group.add(glassRight);

    return group;
}
scene.add(buildCage());

// ===== EXERCISE WHEEL =====
const wheelGroup = new THREE.Group();
const wheelCenter = new THREE.Vector3(-3, 0.8, -2);

function buildWheel() {
    const group = new THREE.Group();
    const radius = 1.2;

    // Outer ring
    const ringGeo = new THREE.TorusGeometry(radius, 0.06, 8, 24);
    const ring = new THREE.Mesh(ringGeo, matMetal);
    group.add(ring);

    // Spokes
    for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const spokeGeo = new THREE.CylinderGeometry(0.03, 0.03, radius, 6);
        const spoke = new THREE.Mesh(spokeGeo, matMetal);
        spoke.position.set(Math.cos(angle) * radius / 2, Math.sin(angle) * radius / 2, 0);
        spoke.rotation.z = angle - Math.PI / 2;
        group.add(spoke);
    }

    // Center hub
    const hubGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.15, 8);
    const hub = new THREE.Mesh(hubGeo, matMetal);
    hub.rotation.x = Math.PI / 2;
    group.add(hub);

    // Runners (small bumps inside)
    for (let i = 0; i < 16; i++) {
        const angle = (i / 16) * Math.PI * 2;
        const bumpGeo = new THREE.BoxGeometry(0.08, 0.08, 0.06);
        const bump = new THREE.Mesh(bumpGeo, matMetal);
        bump.position.set(Math.cos(angle) * (radius - 0.08), Math.sin(angle) * (radius - 0.08), 0);
        bump.rotation.z = angle;
        group.add(bump);
    }

    // Stand
    const standGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.6, 6);
    const stand = new THREE.Mesh(standGeo, matMetal);
    stand.position.set(0, -radius - 0.3, 0);
    group.add(stand);

    const baseGeo = new THREE.CylinderGeometry(0.4, 0.5, 0.1, 8);
    const base = new THREE.Mesh(baseGeo, matMetal);
    base.position.set(0, -radius - 0.6, 0);
    group.add(base);

    return group;
}

const wheel = buildWheel();
wheelGroup.add(wheel);
wheelGroup.position.copy(wheelCenter);
wheelGroup.rotation.y = Math.PI / 3;
scene.add(wheelGroup);

// ===== TUNNEL =====
function buildTunnel() {
    const group = new THREE.Group();
    const length = 2.5;
    const radius = 0.5;

    // Half cylinder
    const tunnelGeo = new THREE.CylinderGeometry(radius, radius, length, 12, 1, false, 0, Math.PI);
    const tunnelMesh = new THREE.Mesh(tunnelGeo, matTunnel);
    tunnelMesh.rotation.z = Math.PI / 2;
    tunnelMesh.position.y = radius;
    group.add(tunnelMesh);

    // Floor of tunnel
    const floorGeo = new THREE.BoxGeometry(length, 0.05, radius * 2);
    const floorMesh = new THREE.Mesh(floorGeo, matTunnel);
    floorMesh.position.y = 0.025;
    group.add(floorMesh);

    // End caps (rings)
    const capGeo = new THREE.RingGeometry(radius * 0.7, radius, 12, 1, 0, Math.PI);
    const cap1 = new THREE.Mesh(capGeo, matTunnel);
    cap1.position.set(length/2, radius, 0);
    cap1.rotation.x = -Math.PI / 2;
    cap1.rotation.z = Math.PI / 2;
    group.add(cap1);

    const cap2 = new THREE.Mesh(capGeo.clone(), matTunnel);
    cap2.position.set(-length/2, radius, 0);
    cap2.rotation.x = -Math.PI / 2;
    cap2.rotation.z = -Math.PI / 2;
    group.add(cap2);

    return group;
}

const tunnel = buildTunnel();
tunnel.position.set(2.5, 0.2, 1.5);
tunnel.rotation.y = -Math.PI / 5;
scene.add(tunnel);

// ===== FOOD BOWL =====
function buildBowl() {
    const group = new THREE.Group();

    // Bowl
    const bowlGeo = new THREE.CylinderGeometry(0.5, 0.35, 0.25, 12);
    const bowl = new THREE.Mesh(bowlGeo, new THREE.MeshStandardMaterial({ color: 0xe74c3c, flatShading: true }));
    bowl.position.y = 0.125;
    group.add(bowl);

    // Food pellets
    for (let i = 0; i < 8; i++) {
        const pelletGeo = new THREE.SphereGeometry(0.08, 6, 4);
        const pellet = new THREE.Mesh(pelletGeo, matFood);
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * 0.25;
        pellet.position.set(Math.cos(angle) * r, 0.28, Math.sin(angle) * r);
        group.add(pellet);
    }

    // Water droplet (little blue sphere on side)
    const dropGeo = new THREE.SphereGeometry(0.12, 8, 6);
    const dropMat = new THREE.MeshStandardMaterial({ color: 0x4fc3f7, flatShading: true, transparent: true, opacity: 0.8 });
    const drop = new THREE.Mesh(dropGeo, dropMat);
    drop.position.set(0.4, 0.35, 0.3);
    group.add(drop);

    return group;
}

const bowl = buildBowl();
bowl.position.set(3.5, 0.2, -2.5);
scene.add(bowl);

// ===== HAMSTERS =====
const hamsterColors = [0xffb347, 0xf4a460, 0xffdab9, 0xdeb887, 0xffaa5c];
const hamsters = [];

function buildHamster(color) {
    const group = new THREE.Group();
    const bodyColor = matBody(color);

    // Body
    const bodyGeo = new THREE.SphereGeometry(0.35, 8, 6);
    bodyGeo.scale(1.2, 0.9, 1);
    const body = new THREE.Mesh(bodyGeo, bodyColor);
    body.position.y = 0.35;
    body.castShadow = true;
    group.add(body);

    // Head
    const headGeo = new THREE.SphereGeometry(0.25, 8, 6);
    const head = new THREE.Mesh(headGeo, bodyColor);
    head.position.set(0.3, 0.45, 0);
    head.castShadow = true;
    group.add(head);

    // Belly (lighter)
    const bellyGeo = new THREE.SphereGeometry(0.25, 6, 4);
    bellyGeo.scale(1, 0.7, 0.8);
    const bellyMat = new THREE.MeshStandardMaterial({ color: 0xfff5e6, flatShading: true });
    const belly = new THREE.Mesh(bellyGeo, bellyMat);
    belly.position.set(0.1, 0.25, 0);
    group.add(belly);

    // Ears
    const earGeo = new THREE.ConeGeometry(0.08, 0.15, 5);
    const earL = new THREE.Mesh(earGeo, bodyColor);
    earL.position.set(0.3, 0.68, 0.15);
    earL.rotation.z = -0.2;
    group.add(earL);

    const earR = new THREE.Mesh(earGeo, bodyColor);
    earR.position.set(0.3, 0.68, -0.15);
    earR.rotation.z = -0.2;
    group.add(earR);

    // Inner ears
    const innerEarGeo = new THREE.ConeGeometry(0.04, 0.1, 4);
    const innerEarL = new THREE.Mesh(innerEarGeo, matPink);
    innerEarL.position.set(0.32, 0.67, 0.15);
    innerEarL.rotation.z = -0.2;
    group.add(innerEarL);

    const innerEarR = new THREE.Mesh(innerEarGeo, matPink);
    innerEarR.position.set(0.32, 0.67, -0.15);
    innerEarR.rotation.z = -0.2;
    group.add(innerEarR);

    // Eyes
    const eyeGeo = new THREE.SphereGeometry(0.04, 6, 4);
    const eyeL = new THREE.Mesh(eyeGeo, matBlack);
    eyeL.position.set(0.48, 0.5, 0.1);
    group.add(eyeL);

    const eyeR = new THREE.Mesh(eyeGeo, matBlack);
    eyeR.position.set(0.48, 0.5, -0.1);
    group.add(eyeR);

    // Eye shine
    const shineGeo = new THREE.SphereGeometry(0.015, 4, 3);
    const shineL = new THREE.Mesh(shineGeo, matWhite);
    shineL.position.set(0.5, 0.52, 0.11);
    group.add(shineL);

    const shineR = new THREE.Mesh(shineGeo, matWhite);
    shineR.position.set(0.5, 0.52, -0.09);
    group.add(shineR);

    // Nose
    const noseGeo = new THREE.SphereGeometry(0.03, 5, 4);
    const nose = new THREE.Mesh(noseGeo, matPink);
    nose.position.set(0.55, 0.42, 0);
    group.add(nose);

    // Whiskers (thin lines)
    const whiskerMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
    for (let side of [-1, 1]) {
        for (let i = -1; i <= 1; i++) {
            const points = [
                new THREE.Vector3(0.52, 0.42 + i * 0.03, side * 0.05),
                new THREE.Vector3(0.75, 0.4 + i * 0.06, side * 0.2)
            ];
            const whiskerGeo = new THREE.BufferGeometry().setFromPoints(points);
            const whisker = new THREE.Line(whiskerGeo, whiskerMat);
            group.add(whisker);
        }
    }

    // Feet
    const footGeo = new THREE.SphereGeometry(0.06, 5, 4);
    const footPositions = [[0.2, 0.1, 0.15], [0.2, 0.1, -0.15], [-0.15, 0.1, 0.15], [-0.15, 0.1, -0.15]];
    footPositions.forEach(pos => {
        const foot = new THREE.Mesh(footGeo, matPink);
        foot.position.set(...pos);
        group.add(foot);
    });

    // Tiny tail
    const tailGeo = new THREE.SphereGeometry(0.04, 4, 3);
    const tail = new THREE.Mesh(tailGeo, bodyColor);
    tail.position.set(-0.4, 0.35, 0);
    group.add(tail);

    return group;
}

// Create hamsters with AI state
class HamsterAI {
    constructor(mesh, colorIndex) {
        this.mesh = mesh;
        this.state = 'wander';
        this.speed = 0.5 + Math.random() * 0.5;
        this.direction = new THREE.Vector3(1, 0, 0);
        this.timer = 0;
        this.stateDuration = 2 + Math.random() * 3;
        this.turnSpeed = 0.02 + Math.random() * 0.02;
        this.bobPhase = Math.random() * Math.PI * 2;
        this.targetPos = null;
        this.wheelActive = false;

        // Assign one hamster to the wheel
        if (colorIndex === 0) {
            this.state = 'goToWheel';
            this.targetPos = wheelCenter.clone().add(new THREE.Vector3(0, 0, 0.5));
        } else if (colorIndex === 1) {
            this.state = 'goToBowl';
            this.targetPos = bowl.position.clone().add(new THREE.Vector3(0, 0, 0.8));
        }
    }

    update(dt, time) {
        this.timer += dt;

        switch (this.state) {
            case 'wander':
                this.mesh.position.addScaledVector(this.direction, this.speed * dt);
                this.mesh.rotation.y = Math.atan2(this.direction.x, this.direction.z);
                // Bob animation
                this.mesh.position.y = 0.2 + Math.sin(time * 8 + this.bobPhase) * 0.02;
                break;

            case 'pause':
                this.mesh.position.y = 0.2 + Math.sin(time * 3 + this.bobPhase) * 0.03;
                // Slight head tilt
                this.mesh.rotation.z = Math.sin(time * 2 + this.bobPhase) * 0.05;
                break;

            case 'turn':
                this.mesh.rotation.y += this.turnSpeed * (Math.random() > 0.5 ? 1 : -1);
                break;

            case 'goToWheel':
            case 'goToBowl': {
                const target = this.targetPos;
                const toTarget = target.clone().sub(this.mesh.position);
                toTarget.y = 0;
                const dist = toTarget.length();

                if (dist < 0.5) {
                    // Arrived - interact
                    if (this.state === 'goToWheel') {
                        this.state = 'atWheel';
                        this.wheelActive = true;
                    } else {
                        this.state = 'eating';
                    }
                } else {
                    toTarget.normalize();
                    this.mesh.position.addScaledVector(toTarget, this.speed * dt);
                    this.mesh.rotation.y = Math.atan2(toTarget.x, toTarget.z);
                    this.mesh.position.y = 0.2 + Math.sin(time * 8 + this.bobPhase) * 0.02;
                }
                break;
            }

            case 'atWheel':
                // Stay near wheel, bob up and down
                const wheelAngle = time * 2;
                this.mesh.position.set(
                    wheelCenter.x + Math.cos(wheelAngle) * 0.3,
                    0.2 + Math.abs(Math.sin(wheelAngle)) * 0.3,
                    wheelCenter.z + Math.sin(wheelAngle) * 0.3
                );
                this.mesh.rotation.y = wheelAngle + Math.PI;
                break;

            case 'eating':
                // Bob at bowl
                this.mesh.position.y = 0.2 + Math.sin(time * 6 + this.bobPhase) * 0.04;
                this.mesh.rotation.z = Math.sin(time * 4) * 0.1;
                break;

            case 'goToTunnel': {
                const tunnelEntry = new THREE.Vector3(
                    tunnel.position.x + Math.sin(tunnel.rotation.y) * 1.2,
                    0.2,
                    tunnel.position.z + Math.cos(tunnel.rotation.y) * 1.2
                );
                const toTarget = tunnelEntry.clone().sub(this.mesh.position);
                toTarget.y = 0;
                const dist = toTarget.length();

                if (dist < 0.4) {
                    this.state = 'inTunnel';
                    this.tunnelTimer = 0;
                } else {
                    toTarget.normalize();
                    this.mesh.position.addScaledVector(toTarget, this.speed * dt);
                    this.mesh.rotation.y = Math.atan2(toTarget.x, toTarget.z);
                    this.mesh.position.y = 0.2 + Math.sin(time * 8 + this.bobPhase) * 0.02;
                }
                break;
            }

            case 'inTunnel':
                this.tunnelTimer += dt;
                // Move through tunnel
                const tunnelDir = new THREE.Vector3(
                    Math.sin(tunnel.rotation.y), 0, Math.cos(tunnel.rotation.y)
                );
                const progress = (this.tunnelTimer / 2) * 2.5 - 1.25;
                this.mesh.position.set(
                    tunnel.position.x + tunnelDir.x * progress,
                    0.2,
                    tunnel.position.z + tunnelDir.z * progress
                );
                this.mesh.rotation.y = Math.atan2(tunnelDir.x, tunnelDir.z);

                if (this.tunnelTimer > 2.5) {
                    this.state = 'wander';
                    this.direction = tunnelDir.clone();
                    this.timer = 0;
                    this.stateDuration = 2 + Math.random() * 3;
                }
                break;
        }

        // State transitions
        if (['wander', 'pause', 'turn'].includes(this.state)) {
            if (this.timer > this.stateDuration) {
                this.timer = 0;
                this.stateDuration = 1 + Math.random() * 3;
                const nextStates = ['wander', 'pause', 'turn'];
                if (Math.random() < 0.15) {
                    this.state = 'goToTunnel';
                } else {
                    this.state = nextStates[Math.floor(Math.random() * nextStates.length)];
                }
                if (this.state === 'wander') {
                    this.direction.x = (Math.random() - 0.5) * 2;
                    this.direction.z = (Math.random() - 0.5) * 2;
                    this.direction.normalize();
                }
            }
        }

        if (this.state === 'atWheel' && this.timer > 4) {
            this.state = 'wander';
            this.wheelActive = false;
            this.timer = 0;
            this.stateDuration = 2 + Math.random() * 3;
            this.direction.set((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2).normalize();
        }

        if (this.state === 'eating' && this.timer > 3) {
            this.state = 'wander';
            this.timer = 0;
            this.stateDuration = 2 + Math.random() * 3;
            this.direction.set((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2).normalize();
        }

        // Boundary clamping
        const margin = 0.5;
        this.mesh.position.x = THREE.MathUtils.clamp(this.mesh.position.x, -4.5 + margin, 4.5 - margin);
        this.mesh.position.z = THREE.MathUtils.clamp(this.mesh.position.z, -3.5 + margin, 3.5 - margin);
    }
}

// Spawn hamsters
for (let i = 0; i < 5; i++) {
    const color = hamsterColors[i];
    const hamsterMesh = buildHamster(color);
    hamsterMesh.position.set(
        (Math.random() - 0.5) * 6,
        0.2,
        (Math.random() - 0.5) * 5
    );
    scene.add(hamsterMesh);

    const ai = new HamsterAI(hamsterMesh, i);
    hamsters.push(ai);
}

// ===== DECORATIONS =====
// Little plants
function buildPlant(x, z) {
    const group = new THREE.Group();
    const potGeo = new THREE.CylinderGeometry(0.15, 0.12, 0.2, 6);
    const pot = new THREE.Mesh(potGeo, new THREE.MeshStandardMaterial({ color: 0xd2691e, flatShading: true }));
    pot.position.y = 0.1;
    group.add(pot);

    const leafGeo = new THREE.ConeGeometry(0.12, 0.3, 5);
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, flatShading: true });
    for (let i = 0; i < 3; i++) {
        const leaf = new THREE.Mesh(leafGeo, leafMat);
        leaf.position.set(Math.cos(i * 2) * 0.06, 0.35, Math.sin(i * 2) * 0.06);
        leaf.rotation.z = (Math.random() - 0.5) * 0.3;
        group.add(leaf);
    }

    group.position.set(x, 0.2, z);
    return group;
}
scene.add(buildPlant(-4, 3));
scene.add(buildPlant(4, -3));
scene.add(buildPlant(-2, -3.2));

// Little hideout house
function buildHouse() {
    const group = new THREE.Group();
    const houseMat = new THREE.MeshStandardMaterial({ color: 0xcd853f, flatShading: true });

    // Base
    const baseGeo = new THREE.BoxGeometry(0.8, 0.6, 0.7);
    const base = new THREE.Mesh(baseGeo, houseMat);
    base.position.y = 0.3;
    group.add(base);

    // Roof
    const roofGeo = new THREE.ConeGeometry(0.6, 0.4, 4);
    const roof = new THREE.Mesh(roofGeo, new THREE.MeshStandardMaterial({ color: 0xb22222, flatShading: true }));
    roof.position.y = 0.8;
    roof.rotation.y = Math.PI / 4;
    group.add(roof);

    // Door
    const doorGeo = new THREE.CircleGeometry(0.15, 8, 0, Math.PI);
    const door = new THREE.Mesh(doorGeo, new THREE.MeshStandardMaterial({ color: 0x2f1b0e, flatShading: true }));
    door.position.set(0, 0.2, 0.36);
    group.add(door);

    return group;
}
const house = buildHouse();
house.position.set(-3.5, 0.2, 2.5);
house.rotation.y = 0.5;
scene.add(house);

// Scattered seeds on floor
for (let i = 0; i < 15; i++) {
    const seedGeo = new THREE.SphereGeometry(0.04, 5, 3);
    const seed = new THREE.Mesh(seedGeo, matSeed);
    seed.position.set((Math.random() - 0.5) * 8, 0.22, (Math.random() - 0.5) * 6);
    scene.add(seed);
}

// ===== ANIMATION LOOP =====
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    const time = clock.getElapsedTime();

    // Update hamsters
    let anyOnWheel = false;
    hamsters.forEach(h => {
        h.update(dt, time);
        if (h.wheelActive) anyOnWheel = true;
    });

    // Rotate wheel if hamster is on it
    if (anyOnWheel) {
        wheel.rotation.z -= dt * 3;
    } else {
        wheel.rotation.z -= dt * 0.2; // slow idle spin
    }

    // Gentle plant sway
    scene.traverse(obj => {
        if (obj.geometry && obj.geometry.type === 'ConeGeometry' && obj.material.color && obj.material.color.g > 0.4) {
            obj.rotation.z = Math.sin(time * 1.5 + obj.position.x) * 0.05;
        }
    });

    controls.update();
    renderer.render(scene, camera);
}

animate();

// Resize handler
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
