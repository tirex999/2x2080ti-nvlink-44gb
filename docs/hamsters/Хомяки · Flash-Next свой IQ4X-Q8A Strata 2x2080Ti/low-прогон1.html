<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Poly Hamster Playground</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        #info span { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>
    <div id="info">🐹 <span>Low-Poly Hamster Playground</span> — Drag to rotate, scroll to zoom</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
// ============ SCENE SETUP ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2d1b69);
scene.fog = new THREE.Fog(0x2d1b69, 18, 35);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8, 7, 10);
camera.lookAt(0, 0.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ============ LIGHTS ============
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 30;
dirLight.shadow.camera.left = -8;
dirLight.shadow.camera.right = 8;
dirLight.shadow.camera.top = 8;
dirLight.shadow.camera.bottom = -8;
scene.add(dirLight);

const pointLight = new THREE.PointLight(0xff9944, 0.5, 15);
pointLight.position.set(-3, 4, -2);
scene.add(pointLight);

const pointLight2 = new THREE.PointLight(0x4488ff, 0.3, 12);
pointLight2.position.set(3, 3, 3);
scene.add(pointLight2);

// ============ MATERIALS ============
function mat(color) {
    return new THREE.MeshLambertMaterial({ color, flatShading: true });
}

const matWood = mat(0x8B6914);
const matWoodDark = mat(0x6B4E0A);
const matBedding = mat(0xF5DEB3);
const matBedding2 = mat(0xDEB887);
const matMetal = mat(0x888888);
const matMetalDark = mat(0x555555);
const matWheel = mat(0x44cc88);
const matWheelSpoke = mat(0x33aa66);
const matBowl = mat(0xff6688);
const matFood = mat(0xcc8833);
const matFood2 = mat(0x99cc33);

// ============ FLOOR / TRAY ============
const trayGeo = new THREE.BoxGeometry(10, 0.4, 8);
const tray = new THREE.Mesh(trayGeo, mat(0x6B4E0A));
tray.position.y = -0.2;
tray.receiveShadow = true;
scene.add(tray);

// Bedding floor
const beddingGeo = new THREE.BoxGeometry(9.4, 0.15, 7.4);
const bedding = new THREE.Mesh(beddingGeo, mat(0xF5DEB3));
bedding.position.y = 0.08;
bedding.receiveShadow = true;
scene.add(bedding);

// Scattered bedding pieces
for (let i = 0; i < 40; i++) {
    const size = 0.1 + Math.random() * 0.2;
    const piece = new THREE.Mesh(
        new THREE.BoxGeometry(size, 0.05, size * 0.5),
        Math.random() > 0.5 ? matBedding : matBedding2
    );
    piece.position.set(
        (Math.random() - 0.5) * 8.5,
        0.18,
        (Math.random() - 0.5) * 6.5
    );
    piece.rotation.y = Math.random() * Math.PI;
    piece.receiveShadow = true;
    scene.add(piece);
}

// ============ CAGE ============
function createCage() {
    const cage = new THREE.Group();
    const barGeo = new THREE.CylinderGeometry(0.04, 0.04, 4, 6);
    const barMat = mat(0xaaaaaa);

    // Vertical bars
    const spacing = 0.6;
    const width = 10;
    const depth = 8;

    // Front and back bars
    for (let x = -width / 2; x <= width / 2; x += spacing) {
        const bar1 = new THREE.Mesh(barGeo, barMat);
        bar1.position.set(x, 2, depth / 2);
        cage.add(bar1);
        const bar2 = new THREE.Mesh(barGeo, barMat);
        bar2.position.set(x, 2, -depth / 2);
        cage.add(bar2);
    }

    // Left and right bars
    for (let z = -depth / 2; z <= depth / 2; z += spacing) {
        const bar1 = new THREE.Mesh(barGeo, barMat);
        bar1.position.set(width / 2, 2, z);
        cage.add(bar1);
        const bar2 = new THREE.Mesh(barGeo, barMat);
        bar2.position.set(-width / 2, 2, z);
        cage.add(bar2);
    }

    // Top frame
    const frameGeo = new THREE.BoxGeometry(width + 0.2, 0.12, 0.12);
    const frameGeo2 = new THREE.BoxGeometry(0.12, 0.12, depth + 0.2);
    const frameMat = mat(0x999999);

    const f1 = new THREE.Mesh(frameGeo, frameMat);
    f1.position.set(0, 4, depth / 2);
    cage.add(f1);
    const f2 = new THREE.Mesh(frameGeo, frameMat);
    f2.position.set(0, 4, -depth / 2);
    cage.add(f2);
    const f3 = new THREE.Mesh(frameGeo2, frameMat);
    f3.position.set(width / 2, 4, 0);
    cage.add(f3);
    const f4 = new THREE.Mesh(frameGeo2, frameMat);
    f4.position.set(-width / 2, 4, 0);
    cage.add(f4);

    // Bottom frame
    const f5 = new THREE.Mesh(frameGeo, frameMat);
    f5.position.set(0, 0.05, depth / 2);
    cage.add(f5);
    const f6 = new THREE.Mesh(frameGeo, frameMat);
    f6.position.set(0, 0.05, -depth / 2);
    cage.add(f6);
    const f7 = new THREE.Mesh(frameGeo2, frameMat);
    f7.position.set(width / 2, 0.05, 0);
    cage.add(f7);
    const f8 = new THREE.Mesh(frameGeo2, frameMat);
    f8.position.set(-width / 2, 0.05, 0);
    cage.add(f8);

    // Top cross bars
    for (let x = -width / 2; x <= width / 2; x += spacing * 2) {
        const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, depth, 6), barMat);
        bar.rotation.x = Math.PI / 2;
        bar.position.set(x, 4, 0);
        cage.add(bar);
    }

    return cage;
}
scene.add(createCage());

// ============ HAMSTER WHEEL ============
let wheelGroup;
let wheelAngle = 0;
let wheelSpeed = 0;

function createWheel() {
    wheelGroup = new THREE.Group();

    // Stand
    const standGeo = new THREE.BoxGeometry(0.15, 2.2, 0.15);
    const stand1 = new THREE.Mesh(standGeo, matMetalDark);
    stand1.position.set(0, 1.1, 0.8);
    wheelGroup.add(stand1);
    const stand2 = new THREE.Mesh(standGeo, matMetalDark);
    stand2.position.set(0, 1.1, -0.8);
    wheelGroup.add(stand2);

    // Base
    const baseGeo = new THREE.BoxGeometry(0.8, 0.15, 2);
    const base = new THREE.Mesh(baseGeo, matMetalDark);
    base.position.y = 0.08;
    wheelGroup.add(base);

    // Wheel ring
    const ringGeo = new THREE.TorusGeometry(1.1, 0.12, 8, 16);
    const ring = new THREE.Mesh(ringGeo, matWheel);
    ring.position.y = 1.8;
    ring.castShadow = true;
    wheelGroup.add(ring);

    // Inner ring
    const innerRingGeo = new THREE.TorusGeometry(0.85, 0.06, 6, 16);
    const innerRing = new THREE.Mesh(innerRingGeo, matWheelSpoke);
    innerRing.position.y = 1.8;
    wheelGroup.add(innerRing);

    // Spokes
    for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const spokeGeo = new THREE.CylinderGeometry(0.03, 0.03, 1.1, 4);
        const spoke = new THREE.Mesh(spokeGeo, matWheelSpoke);
        spoke.position.set(
            Math.cos(angle) * 0.55,
            1.8 + Math.sin(angle) * 0.55,
            0
        );
        spoke.rotation.z = angle - Math.PI / 2;
        wheelGroup.add(spoke);
    }

    // Steps on wheel
    for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        const stepGeo = new THREE.BoxGeometry(0.5, 0.06, 0.15);
        const step = new THREE.Mesh(stepGeo, mat(0x55ddaa));
        step.position.set(
            Math.cos(angle) * 1.0,
            1.8 + Math.sin(angle) * 1.0,
            0
        );
        step.rotation.z = angle;
        wheelGroup.add(step);
    }

    wheelGroup.position.set(3.5, 0, -2.5);
    scene.add(wheelGroup);
}
createWheel();

// ============ FOOD BOWL ============
function createFoodBowl() {
    const bowlGroup = new THREE.Group();

    const bowlGeo = new THREE.SphereGeometry(0.5, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2);
    const bowl = new THREE.Mesh(bowlGeo, matBowl);
    bowl.rotation.x = Math.PI;
    bowl.position.y = 0.5;
    bowl.castShadow = true;
    bowlGroup.add(bowl);

    // Food pieces
    for (let i = 0; i < 5; i++) {
        const foodGeo = new THREE.SphereGeometry(0.08 + Math.random() * 0.05, 5, 4);
        const food = new THREE.Mesh(foodGeo, Math.random() > 0.5 ? matFood : matFood2);
        food.position.set(
            (Math.random() - 0.5) * 0.3,
            0.35 + Math.random() * 0.1,
            (Math.random() - 0.5) * 0.3
        );
        bowlGroup.add(food);
    }

    bowlGroup.position.set(-3, 0, 2);
    scene.add(bowlGroup);
    return bowlGroup;
}
const foodBowl = createFoodBowl();

// ============ TUNNEL ============
function createTunnel() {
    const tunnelGroup = new THREE.Group();

    const tunnelGeo = new THREE.CylinderGeometry(0.6, 0.6, 2.5, 8, 1, true);
    const tunnelMat = new THREE.MeshLambertMaterial({ color: 0xff8844, flatShading: true, side: THREE.DoubleSide });
    const tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
    tunnel.rotation.z = Math.PI / 2;
    tunnel.position.y = 0.6;
    tunnel.castShadow = true;
    tunnelGroup.add(tunnel);

    // Rings
    for (let i = -1; i <= 1; i++) {
        const ringGeo = new THREE.TorusGeometry(0.65, 0.06, 6, 12);
        const ring = new THREE.Mesh(ringGeo, mat(0xcc6622));
        ring.rotation.y = Math.PI / 2;
        ring.position.set(i * 0.8, 0.6, 0);
        tunnelGroup.add(ring);
    }

    tunnelGroup.position.set(-2.5, 0, -2);
    tunnelGroup.rotation.y = 0.4;
    scene.add(tunnelGroup);
}
createTunnel();

// ============ WATER BOTTLE ============
function createWaterBottle() {
    const group = new THREE.Group();

    const bottleGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.2, 8);
    const bottleMat = new THREE.MeshLambertMaterial({ color: 0x88ccff, flatShading: true, transparent: true, opacity: 0.7 });
    const bottle = new THREE.Mesh(bottleGeo, bottleMat);
    bottle.position.y = 2.5;
    group.add(bottle);

    const capGeo = new THREE.CylinderGeometry(0.1, 0.15, 0.2, 8);
    const cap = new THREE.Mesh(capGeo, mat(0x666666));
    cap.position.y = 1.8;
    group.add(cap);

    const tubeGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.4, 6);
    const tube = new THREE.Mesh(tubeGeo, mat(0xaaaaaa));
    tube.position.y = 1.55;
    group.add(tube);

    group.position.set(4.8, 0, 1);
    scene.add(group);
}
createWaterBottle();

// ============ HAMSTER CREATION ============
const hamsterColors = [
    { body: 0xF4A460, belly: 0xFFF8DC, name: "Sandy" },
    { body: 0x8B4513, belly: 0xDEB887, name: "Coco" },
    { body: 0xFFFFFF, belly: 0xFFE4E1, name: "Snow" },
    { body: 0x696969, belly: 0xC0C0C0, name: "Shadow" },
    { body: 0xFFD700, belly: 0xFFFACD, name: "Goldie" }
];

const hamsters = [];

function createHamster(colorScheme, startPos) {
    const group = new THREE.Group();

    // Body
    const bodyGeo = new THREE.SphereGeometry(0.35, 7, 5);
    bodyGeo.scale(1.2, 0.9, 1);
    const body = new THREE.Mesh(bodyGeo, mat(colorScheme.body));
    body.position.y = 0.35;
    body.castShadow = true;
    group.add(body);

    // Belly
    const bellyGeo = new THREE.SphereGeometry(0.28, 6, 5);
    bellyGeo.scale(1, 0.8, 0.9);
    const belly = new THREE.Mesh(bellyGeo, mat(colorScheme.belly));
    belly.position.set(0.05, 0.3, 0);
    group.add(belly);

    // Head
    const headGeo = new THREE.SphereGeometry(0.22, 7, 5);
    headGeo.scale(1, 0.9, 0.9);
    const head = new THREE.Mesh(headGeo, mat(colorScheme.body));
    head.position.set(0.35, 0.45, 0);
    head.castShadow = true;
    group.add(head);

    // Cheeks
    const cheekGeo = new THREE.SphereGeometry(0.1, 5, 4);
    const cheek1 = new THREE.Mesh(cheekGeo, mat(colorScheme.belly));
    cheek1.position.set(0.45, 0.38, 0.12);
    group.add(cheek1);
    const cheek2 = new THREE.Mesh(cheekGeo, mat(colorScheme.belly));
    cheek2.position.set(0.45, 0.38, -0.12);
    group.add(cheek2);

    // Ears
    const earGeo = new THREE.SphereGeometry(0.08, 5, 4);
    const earMat = mat(0xFFB6C1);
    const ear1 = new THREE.Mesh(earGeo, earMat);
    ear1.position.set(0.3, 0.65, 0.12);
    group.add(ear1);
    const ear2 = new THREE.Mesh(earGeo, earMat);
    ear2.position.set(0.3, 0.65, -0.12);
    group.add(ear2);

    // Eyes
    const eyeGeo = new THREE.SphereGeometry(0.04, 5, 4);
    const eyeMat = mat(0x111111);
    const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
    eye1.position.set(0.52, 0.5, 0.08);
    group.add(eye1);
    const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
    eye2.position.set(0.52, 0.5, -0.08);
    group.add(eye2);

    // Eye shine
    const shineGeo = new THREE.SphereGeometry(0.015, 4, 4);
    const shineMat = mat(0xffffff);
    const shine1 = new THREE.Mesh(shineGeo, shineMat);
    shine1.position.set(0.54, 0.52, 0.09);
    group.add(shine1);
    const shine2 = new THREE.Mesh(shineGeo, shineMat);
    shine2.position.set(0.54, 0.52, -0.07);
    group.add(shine2);

    // Nose
    const noseGeo = new THREE.SphereGeometry(0.03, 4, 4);
    const nose = new THREE.Mesh(noseGeo, mat(0xFF69B4));
    nose.position.set(0.57, 0.43, 0);
    group.add(nose);

    // Legs
    const legGeo = new THREE.CylinderGeometry(0.05, 0.04, 0.15, 5);
    const legMat = mat(colorScheme.body);
    const legPositions = [
        [0.15, 0.08, 0.15],
        [0.15, 0.08, -0.15],
        [-0.2, 0.08, 0.15],
        [-0.2, 0.08, -0.15]
    ];
    const legs = [];
    legPositions.forEach(pos => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(...pos);
        group.add(leg);
        legs.push(leg);
    });

    // Tail (tiny nub)
    const tailGeo = new THREE.SphereGeometry(0.05, 4, 4);
    const tail = new THREE.Mesh(tailGeo, mat(colorScheme.body));
    tail.position.set(-0.42, 0.35, 0);
    group.add(tail);

    group.position.copy(startPos);
    scene.add(group);

    return {
        group,
        legs,
        body,
        head,
        name: colorScheme.name,
        state: 'idle',
        stateTimer: Math.random() * 2,
        targetAngle: Math.random() * Math.PI * 2,
        speed: 0.8 + Math.random() * 0.5,
        walkTime: 0,
        bobPhase: Math.random() * Math.PI * 2,
        onWheel: false,
        eating: false,
        targetPoint: null
    };
}

// Create hamsters
const positions = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(-2, 0, 1),
    new THREE.Vector3(2, 0, 2),
    new THREE.Vector3(1, 0, -1),
    new THREE.Vector3(-1, 0, -2)
];

for (let i = 0; i < 5; i++) {
    hamsters.push(createHamster(hamsterColors[i], positions[i]));
}

// ============ HAMSTER BEHAVIOR ============
const WHEEL_POS = new THREE.Vector3(3.5, 0, -2.5);
const BOWL_POS = new THREE.Vector3(-3, 0, 2);
const BOUNDS = { x: 4.2, z: 3.2 };

function updateHamster(h, dt, time) {
    h.stateTimer -= dt;

    switch (h.state) {
        case 'idle':
            if (h.stateTimer <= 0) {
                const roll = Math.random();
                if (roll < 0.3) {
                    h.state = 'walking';
                    h.targetAngle = Math.random() * Math.PI * 2;
                    h.stateTimer = 1 + Math.random() * 3;
                } else if (roll < 0.5) {
                    h.state = 'goToWheel';
                    h.targetPoint = WHEEL_POS.clone();
                    h.stateTimer = 8;
                } else if (roll < 0.7) {
                    h.state = 'goToBowl';
                    h.targetPoint = BOWL_POS.clone();
                    h.stateTimer = 6;
                } else {
                    h.state = 'idle';
                    h.stateTimer = 0.5 + Math.random() * 2;
                }
            }
            // Idle bobbing
            h.group.position.y = Math.sin(time * 2 + h.bobPhase) * 0.02;
            break;

        case 'walking':
            h.group.rotation.y += (h.targetAngle - h.group.rotation.y) * 0.05;
            const dx = Math.cos(h.group.rotation.y) * h.speed * dt;
            const dz = Math.sin(h.group.rotation.y) * h.speed * dt;
            h.group.position.x += dx;
            h.group.position.z += dz;

            // Bounce off walls
            if (Math.abs(h.group.position.x) > BOUNDS.x) {
                h.targetAngle = Math.PI - h.group.rotation.y;
                h.group.position.x = Math.sign(h.group.position.x) * BOUNDS.x;
            }
            if (Math.abs(h.group.position.z) > BOUNDS.z) {
                h.targetAngle = -h.group.rotation.y;
                h.group.position.z = Math.sign(h.group.position.z) * BOUNDS.z;
            }

            // Leg animation
            h.walkTime += dt * 8;
            h.legs.forEach((leg, i) => {
                leg.position.y = 0.08 + Math.sin(h.walkTime + i * Math.PI) * 0.04;
            });

            // Body bob
            h.group.position.y = Math.abs(Math.sin(h.walkTime * 0.5)) * 0.03;

            if (h.stateTimer <= 0) {
                h.state = 'idle';
                h.stateTimer = 0.5 + Math.random() * 2;
                h.legs.forEach(leg => leg.position.y = 0.08);
            }
            break;

        case 'goToWheel':
            const toWheel = WHEEL_POS.clone().sub(h.group.position);
            toWheel.y = 0;
            const distWheel = toWheel.length();

            if (distWheel > 0.8) {
                const angleToWheel = Math.atan2(toWheel.z, toWheel.x);
                h.group.rotation.y += (angleToWheel - h.group.rotation.y) * 0.08;
                h.group.position.x += Math.cos(h.group.rotation.y) * h.speed * dt;
                h.group.position.z += Math.sin(h.group.rotation.y) * h.speed * dt;

                h.walkTime += dt * 8;
                h.legs.forEach((leg, i) => {
                    leg.position.y = 0.08 + Math.sin(h.walkTime + i * Math.PI) * 0.04;
                });
                h.group.position.y = Math.abs(Math.sin(h.walkTime * 0.5)) * 0.03;
            } else {
                h.state = 'onWheel';
                h.stateTimer = 4 + Math.random() * 4;
                h.onWheel = true;
                h.legs.forEach(leg => leg.position.y = 0.08);
            }

            if (h.stateTimer <= 0) {
                h.state = 'idle';
                h.stateTimer = 1;
            }
            break;

        case 'onWheel':
            // Position on wheel
            const wheelLocal = new THREE.Vector3(0, 1.8, 0);
            h.group.position.x = WHEEL_POS.x;
            h.group.position.z = WHEEL_POS.z;
            h.group.position.y = 1.2;
            h.group.rotation.y = Math.PI / 2;

            // Running animation
            h.walkTime += dt * 12;
            h.legs.forEach((leg, i) => {
                leg.position.y = 0.08 + Math.sin(h.walkTime + i * Math.PI) * 0.06;
            });

            wheelSpeed = 3;

            if (h.stateTimer <= 0) {
                h.state = 'idle';
                h.stateTimer = 1;
                h.onWheel = false;
                h.group.position.y = 0;
                h.legs.forEach(leg => leg.position.y = 0.08);
            }
            break;

        case 'goToBowl':
            const toBowl = BOWL_POS.clone().sub(h.group.position);
            toBowl.y = 0;
            const distBowl = toBowl.length();

            if (distBowl > 0.7) {
                const angleToBowl = Math.atan2(toBowl.z, toBowl.x);
                h.group.rotation.y += (angleToBowl - h.group.rotation.y) * 0.08;
                h.group.position.x += Math.cos(h.group.rotation.y) * h.speed * dt;
                h.group.position.z += Math.sin(h.group.rotation.y) * h.speed * dt;

                h.walkTime += dt * 8;
                h.legs.forEach((leg, i) => {
                    leg.position.y = 0.08 + Math.sin(h.walkTime + i * Math.PI) * 0.04;
                });
                h.group.position.y = Math.abs(Math.sin(h.walkTime * 0.5)) * 0.03;
            } else {
                h.state = 'eating';
                h.stateTimer = 2 + Math.random() * 3;
                h.eating = true;
                h.legs.forEach(leg => leg.position.y = 0.08);
            }

            if (h.stateTimer <= 0) {
                h.state = 'idle';
                h.stateTimer = 1;
            }
            break;

        case 'eating':
            h.group.position.y = Math.sin(time * 6 + h.bobPhase) * 0.03;
            // Head bobbing (eating motion)
            h.head.position.y = 0.45 + Math.sin(time * 8) * 0.03;
            h.head.position.x = 0.35 + Math.sin(time * 8) * 0.02;

            if (h.stateTimer <= 0) {
                h.state = 'idle';
                h.stateTimer = 1;
                h.eating = false;
                h.head.position.y = 0.45;
                h.head.position.x = 0.35;
            }
            break;
    }
}

// ============ ORBIT CONTROLS (Simple) ============
let isDragging = false;
let previousMouse = { x: 0, y: 0 };
let spherical = { theta: 0.8, phi: 1.0, radius: 14 };

function updateCamera() {
    camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
    camera.position.y = spherical.radius * Math.cos(spherical.phi);
    camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
    camera.lookAt(0, 1, 0);
}

renderer.domElement.addEventListener('mousedown', (e) => {
    isDragging = true;
    previousMouse = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - previousMouse.x;
    const dy = e.clientY - previousMouse.y;
    spherical.theta -= dx * 0.005;
    spherical.phi = Math.max(0.3, Math.min(1.4, spherical.phi + dy * 0.005));
    previousMouse = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('mouseup', () => isDragging = false);
renderer.domElement.addEventListener('mouseleave', () => isDragging = false);

renderer.domElement.addEventListener('wheel', (e) => {
    spherical.radius = Math.max(6, Math.min(25, spherical.radius + e.deltaY * 0.01));
});

// Touch support
renderer.domElement.addEventListener('touchstart', (e) => {
    isDragging = true;
    previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});

renderer.domElement.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - previousMouse.x;
    const dy = e.touches[0].clientY - previousMouse.y;
    spherical.theta -= dx * 0.005;
    spherical.phi = Math.max(0.3, Math.min(1.4, spherical.phi + dy * 0.005));
    previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});

renderer.domElement.addEventListener('touchend', () => isDragging = false);

// ============ ANIMATION LOOP ============
let lastTime = performance.now();

function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    const time = now / 1000;

    // Update hamsters
    hamsters.forEach(h => updateHamster(h, dt, time));

    // Wheel rotation
    if (wheelSpeed > 0) {
        wheelAngle += wheelSpeed * dt;
        wheelSpeed *= 0.98;
        if (wheelSpeed < 0.01) wheelSpeed = 0;
    }
    if (wheelGroup) {
        wheelGroup.children.forEach(child => {
            if (child.position.y > 1 && child.geometry &&
                (child.geometry.type === 'TorusGeometry' ||
                 child.geometry.type === 'CylinderGeometry' ||
                 child.geometry.type === 'BoxGeometry')) {
                // Rotate wheel parts around center
            }
        });
        // Rotate the wheel ring and steps
        const wheelParts = wheelGroup.children.filter(c =>
            c.position.y > 1.0 && c.position.y < 3.0
        );
        wheelParts.forEach(part => {
            const origY = part.position.y - 1.8;
            const origX = part.position.x;
            const cos = Math.cos(wheelSpeed * dt);
            const sin = Math.sin(wheelSpeed * dt);
            part.position.x = origX * cos - origY * sin;
            part.position.y = 1.8 + origX * sin + origY * cos;
            part.rotation.z += wheelSpeed * dt;
        });
    }

    // Gentle camera auto-rotate when not dragging
    if (!isDragging) {
        spherical.theta += 0.001;
    }

    updateCamera();
    renderer.render(scene, camera);
}

// ============ RESIZE ============
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ START ============
updateCamera();
animate();
    </script>
