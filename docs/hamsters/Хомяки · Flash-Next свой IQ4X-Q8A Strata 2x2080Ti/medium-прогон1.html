<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe9d6; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 16px; left: 16px; pointer-events: none;
    font-family: "Comic Sans MS", "Segoe UI", sans-serif; color: #6d4c41;
    text-shadow: 0 1px 0 #fff;
  }
  #ui h1 { margin: 0; font-size: 22px; }
  #ui p  { margin: 4px 0 0; font-size: 13px; opacity: .85; }
</style>
</head>
<body>
<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; Click a hamster to make it hop!</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
//  SETUP
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe9d6);
scene.fog = new THREE.Fog(0xffe9d6, 22, 40);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.HemisphereLight(0xfff3e0, 0xc9a86a, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9;   sun.shadow.camera.bottom = -9;
scene.add(sun);

const mat = (color) => new THREE.MeshLambertMaterial({ color, flatShading: true });

// ============================================================
//  CAGE: tray, bedding, bars
// ============================================================
const R_TRAY = 6;

const tray = new THREE.Mesh(new THREE.CylinderGeometry(R_TRAY, R_TRAY * 0.96, 0.5, 24), mat(0x9cd6a8));
tray.position.y = -0.25;
tray.receiveShadow = true;
scene.add(tray);

// bedding specks
const beddingGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.03, 5);
const beddingMat = mat(0xe8cfa0);
for (let i = 0; i < 60; i++) {
  const b = new THREE.Mesh(beddingGeo, beddingMat);
  const r = Math.sqrt(Math.random()) * (R_TRAY - 0.5), a = Math.random() * Math.PI * 2;
  b.position.set(Math.cos(a) * r, 0.015, Math.sin(a) * r);
  b.rotation.y = Math.random() * 3;
  scene.add(b);
}

// bars + rings
const barMat = mat(0xfdfdfd);
const N_BARS = 26, WALL_R = R_TRAY - 0.15;
for (let i = 0; i < N_BARS; i++) {
  const a = (i / N_BARS) * Math.PI * 2;
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 3.6, 6), barMat);
  bar.position.set(Math.cos(a) * WALL_R, 1.8, Math.sin(a) * WALL_R);
  bar.castShadow = true;
  scene.add(bar);
}
[0.15, 1.8, 3.6].forEach(y => {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(WALL_R, 0.07, 6, 40), barMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = y;
  scene.add(ring);
});

// ============================================================
//  FOOD BOWL
// ============================================================
const BOWL_POS = new THREE.Vector3(3.1, 0, 2.1);
const bowl = new THREE.Group();
const bowlBody = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.42, 0.34, 10), mat(0xff8a65));
bowlBody.position.y = 0.17;
bowl.add(bowlBody);
const rim = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.08, 6, 12), mat(0xff7043));
rim.rotation.x = Math.PI / 2; rim.position.y = 0.34;
bowl.add(rim);
for (let i = 0; i < 4; i++) {
  const pellet = new THREE.Mesh(new THREE.IcosahedronGeometry(0.13, 0), mat(0xd9a066));
  pellet.position.set(Math.cos(i * 1.7) * 0.22, 0.4, Math.sin(i * 1.7) * 0.22);
  bowl.add(pellet);
}
bowl.position.copy(BOWL_POS);
scene.add(bowl);

// ============================================================
//  RUNNING WHEEL  (interactive object)
// ============================================================
const WHEEL_POS = new THREE.Vector3(-4.1, 1.25, 0);
const wheelGroup = new THREE.Group();
wheelGroup.position.copy(WHEEL_POS);
wheelGroup.rotation.y = Math.PI / 2;   // wheel plane = world YZ, hamster runs along Z
scene.add(wheelGroup);

const wheelSpin = new THREE.Group();   // this part rotates
wheelGroup.add(wheelSpin);

const wheelBlue = mat(0x4fc3f7), wheelPink = mat(0xf48fb1);
[-0.45, 0.45].forEach(z => {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.1, 6, 22), wheelBlue);
  ring.position.z = z;
  wheelSpin.add(ring);
});
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2;
  const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1.1, 5), wheelBlue);
  spoke.position.set(Math.cos(a) * 0.55, Math.sin(a) * 0.55, 0);
  spoke.rotation.z = a - Math.PI / 2;
  wheelSpin.add(spoke);
}
for (let i = 0; i < 10; i++) {          // rungs
  const a = (i / 10) * Math.PI * 2;
  const rung = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.9, 5), wheelPink);
  rung.rotation.x = Math.PI / 2;
  rung.position.set(Math.cos(a) * 1.15, Math.sin(a) * 1.15, 0);
  wheelSpin.add(rung);
}
// stand
const standMat = mat(0x90a4ae);
[-0.65, 0.65].forEach(z => {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.3, 0.16), standMat);
  leg.position.set(0.15, -0.6, z);
  leg.rotation.z = -0.12;
  wheelGroup.add(leg);
});

// ============================================================
//  HAMSTERS
// ============================================================
const HAMSTER_COLORS = [0xf6c453, 0xf5e6c8, 0xb0a99f, 0xc98d5b, 0xf9d5e5];
const hamsters = [];
const clickables = [];

function makeHamster(color, x, z) {
  const g = new THREE.Group();
  const skin = mat(color);

  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 1), skin);
  body.scale.set(1.05, 0.92, 1.3);
  body.position.y = 0.34;
  body.castShadow = true;
  g.add(body);

  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.3, 1), skin);
  head.position.set(0, 0.52, 0.48);
  head.castShadow = true;
  g.add(head);

  const nose = new THREE.Mesh(new THREE.IcosahedronGeometry(0.06, 0), mat(0xff9aa2));
  nose.position.set(0, 0.48, 0.76);
  g.add(nose);

  const eyeMat = mat(0x2b2b2b);
  [-1, 1].forEach(s => {
    const eye = new THREE.Mesh(new THREE.IcosahedronGeometry(0.045, 0), eyeMat);
    eye.position.set(0.13 * s, 0.58, 0.68);
    g.add(eye);
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.1, 5, 4), mat(0xe8a5a5));
    ear.position.set(0.18 * s, 0.76, 0.38);
    g.add(ear);
    const cheek = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1, 1), skin);
    cheek.position.set(0.2 * s, 0.44, 0.55);
    g.add(cheek);
  });

  const tail = new THREE.Mesh(new THREE.IcosahedronGeometry(0.07, 0), skin);
  tail.position.set(0, 0.32, -0.55);
  g.add(tail);

  const legs = [];
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx, sz]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.22, 5), skin);
    leg.position.set(0.2 * sx, 0.11, 0.24 * sz);
    g.add(leg);
    legs.push(leg);
  });

  g.position.set(x, 0, z);
  scene.add(g);
  body.userData.hamsterIndex = hamsters.length;
  head.userData.hamsterIndex = hamsters.length;
  clickables.push(body, head);

  hamsters.push({
    group: g, body, head, nose, legs,
    state: 'idle', t: Math.random() * 2, goal: null,
    heading: Math.random() * Math.PI * 2, turn: 0,
    speed: 1.1 + Math.random() * 0.5,
    phase: Math.random() * 10,
    hopV: 0, hopY: 0
  });
}
HAMSTER_COLORS.forEach((c, i) => {
  const a = (i / HAMSTER_COLORS.length) * Math.PI * 2;
  makeHamster(c, Math.cos(a) * 2.4, Math.sin(a) * 2.4);
});

// ============================================================
//  TINY SQUEAK (WebAudio)
// ============================================================
let actx = null;
function squeak() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(950, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(420, actx.currentTime + 0.12);
    gn.gain.setValueAtTime(0.12, actx.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.14);
    o.connect(gn).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.15);
  } catch (e) {}
}

// ============================================================
//  HAMSTER AI
// ============================================================
let wheelUser = null;

function angLerp(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

function chooseNext(h) {
  const r = Math.random();
  if (r < 0.3 && !wheelUser) {
    h.goal = 'wheel'; h.state = 'walk'; h.t = 8; h.turn = 0;
  } else if (r < 0.6) {
    h.goal = 'bowl'; h.state = 'walk'; h.t = 8; h.turn = 0;
  } else {
    h.goal = null; h.state = 'walk';
    h.heading += (Math.random() - 0.5) * 2.5;
    h.turn = (Math.random() - 0.5) * 1.2;
    h.t = 2 + Math.random() * 3;
  }
}

function updateHamster(h, dt, time) {
  const p = h.group.position;
  h.t -= dt;

  // --- hop physics (from clicking) ---
  if (h.hopY > 0 || h.hopV > 0) {
    h.hopV -= 12 * dt;
    h.hopY += h.hopV * dt;
    if (h.hopY <= 0) { h.hopY = 0; h.hopV = 0; }
  }

  switch (h.state) {

    case 'idle':
      h.nose.scale.setScalar(1 + Math.sin(time * 9) * 0.2);          // sniffy nose
      h.head.rotation.y = Math.sin(time * 1.8 + h.phase) * 0.4;      // look around
      h.head.rotation.x = 0;
      if (h.t <= 0) chooseNext(h);
      break;

    case 'walk': {
      let targetAng = null;
      if (h.goal === 'wheel') targetAng = Math.atan2(WHEEL_POS.x - p.x, WHEEL_POS.z - p.z);
      else if (h.goal === 'bowl') targetAng = Math.atan2(BOWL_POS.x - p.x, BOWL_POS.z - p.z);

      if (targetAng !== null) h.heading = angLerp(h.heading, targetAng, Math.min(1, dt * 4));
      else h.heading += h.turn * dt;

      // stay inside the cage
      const distC = Math.hypot(p.x, p.z);
      if (distC > WALL_R - 0.9) {
        const toC = Math.atan2(-p.x, -p.z);
        h.heading = angLerp(h.heading, toC, Math.min(1, dt * 5));
      }
      // avoid the wheel stand
      if (h.goal !== 'wheel') {
        const dw = Math.hypot(p.x - WHEEL_POS.x, p.z - WHEEL_POS.z);
        if (dw < 1.7) {
          const away = Math.atan2(p.x - WHEEL_POS.x, p.z - WHEEL_POS.z);
          h.heading = angLerp(h.heading, away, Math.min(1, dt * 6));
        }
      }

      p.x += Math.sin(h.heading) * h.speed * dt;
      p.z += Math.cos(h.heading) * h.speed * dt;
      h.group.rotation.y = h.heading;

      // walk cycle
      h.phase += dt * 11;
      h.legs.forEach((leg, i) => leg.rotation.x = Math.sin(h.phase + (i % 2 === (i < 2 ? 0 : 1) ? 0 : Math.PI)) * 0.7);
      h.body.position.y = 0.34 + Math.abs(Math.sin(h.phase)) * 0.03;
      h.head.rotation.y *= 0.8;

      // arrived?
      if (h.goal === 'wheel' && Math.hypot(p.x - WHEEL_POS.x, p.z - WHEEL_POS.z) < 1.0) {
        if (!wheelUser) { wheelUser = h; h.state = 'wheel'; h.t = 3 + Math.random() * 4; }
        else { h.goal = null; }
      }
      if (h.goal === 'bowl' && Math.hypot(p.x - BOWL_POS.x, p.z - BOWL_POS.z) < 0.9) {
        h.state = 'eat'; h.t = 2 + Math.random() * 2;
        h.heading = Math.atan2(-BOWL_POS.x, -BOWL_POS.z); // face bowl outward, cute
        h.group.rotation.y = h.heading;
      }
      if (h.t <= 0) { h.state = 'idle'; h.t = 1 + Math.random() * 2; }
      break;
    }

    case 'eat':
      h.head.rotation.x = 0.45 + Math.sin(time * 7) * 0.3;  // peck-peck
      h.nose.scale.setScalar(1 + Math.sin(time * 12) * 0.25);
      if (h.t <= 0) {
        h.head.rotation.x = 0;
        h.state = 'idle'; h.t = 1 + Math.random() * 2;
        h.heading += Math.PI * (0.5 + Math.random() * 0.5);
      }
      break;

    case 'wheel': {
      // snap into the wheel
      p.x = angLerp(p.x, WHEEL_POS.x + 0.55, dt * 6); // slightly off-center, inside
      p.x = WHEEL_POS.x + 0.35;
      p.z = angLerp(p.z, 0, dt * 6) * 0 + WHEEL_POS.z;
      p.y = 0.42;
      h.group.rotation.y = -Math.PI / 2;   // facing along run direction
      h.phase += dt * 22;
      h.legs.forEach((leg, i) => leg.rotation.x = Math.sin(h.phase + i * Math.PI) * 1.1);
      h.body.position.y = 0.34 + Math.abs(Math.sin(h.phase)) * 0.04;
      wheelSpin.rotation.z += dt * 9;
      if (h.t <= 0) {
        wheelUser = null;
        p.y = 0;
        p.x = WHEEL_POS.x + 1.6; p.z = 0.8;
        h.legs.forEach(l => l.rotation.x = 0);
        h.state = 'idle'; h.t = 1 + Math.random() * 2;
        h.heading = Math.random() * Math.PI * 2;
      }
      break;
    }
  }

  if (h.state !== 'wheel') h.group.position.y = h.hopY;
}

// ============================================================
//  CAMERA ORBIT (simple custom controls)
// ============================================================
let theta = 0.7, phi = 1.05, radius = 15;
let dragging = false, moved = false, px = 0, py = 0;
const lookAt = new THREE.Vector3(0, 1.1, 0);

function updateCamera() {
  camera.position.set(
    lookAt.x + radius * Math.sin(phi) * Math.sin(theta),
    lookAt.y + radius * Math.cos(phi),
    lookAt.z + radius * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(lookAt);
}

renderer.domElement.addEventListener('pointerdown', e => {
  dragging = true; moved = false; px = e.clientX; py = e.clientY;
});
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - px, dy = e.clientY - py;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  theta -= dx * 0.006;
  phi = Math.max(0.25, Math.min(1.45, phi - dy * 0.005));
  px = e.clientX; py = e.clientY;
});
addEventListener('pointerup', e => {
  if (dragging && !moved) tryHop(e);
  dragging = false;
});
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  radius = Math.max(7, Math.min(26, radius + e.deltaY * 0.01));
}, { passive: false });

// click a hamster -> hop + squeak
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
function tryHop(e) {
  mouseNDC.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects(clickables);
  if (hits.length) {
    const h = hamsters[hits[0].object.userData.hamsterIndex];
    if (h.state !== 'wheel') { h.hopV = 3.2; squeak(); }
  }
}

// ============================================================
//  MAIN LOOP
// ============================================================
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  if (!dragging) theta += dt * 0.06;   // gentle auto-rotate
  updateCamera();

  hamsters.forEach(h => updateHamster(h, dt, time));

  // idle wheel drift
  if (!wheelUser) wheelSpin.rotation.z += dt * 0.15;

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
