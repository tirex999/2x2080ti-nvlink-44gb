<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Low-Poly Hamster Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2a1e17;
    --cream:#fff4e4;
    --sand:#f2ddc0;
    --butter:#ffc94a;
    --tang:#ff8a3d;
    --cherry:#f2545b;
    --mint:#3ec9a3;
    --sky:#3fa9dd;
    --shadow: 5px 5px 0 rgba(42,30,23,.9);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; color:var(--ink);
    font-family:'Outfit',system-ui,sans-serif;
    background:
      radial-gradient(90% 70% at 12% 0%, #fff1d4 0%, rgba(255,241,212,0) 60%),
      radial-gradient(80% 80% at 92% 90%, #cdeae6 0%, rgba(205,234,230,0) 55%),
      linear-gradient(165deg, #ffe9c6 0%, #f6ddba 40%, #cfe6ea 100%);
    transition: filter .6s ease;
  }
  body.night{ filter: saturate(.72) brightness(.86) contrast(1.05); }
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:3;
    background: radial-gradient(120% 95% at 50% 45%, rgba(0,0,0,0) 45%, rgba(42,30,23,.28) 100%);
    mix-blend-mode:multiply;
  }
  #c{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none;}
  .grain{
    position:fixed; inset:0; z-index:2; pointer-events:none; opacity:.45;
    background-image: radial-gradient(rgba(42,30,23,.22) 1px, transparent 1.4px);
    background-size: 24px 24px;
    -webkit-mask-image: radial-gradient(70% 60% at 50% 45%, #000 10%, transparent 85%);
            mask-image: radial-gradient(70% 60% at 50% 45%, #000 10%, transparent 85%);
  }

  /* ---------- layout ---------- */
  .ui{
    position:fixed; inset:0; z-index:5; pointer-events:none;
    display:grid; gap:14px;
    grid-template-columns: minmax(0,320px) 1fr minmax(0,300px);
    grid-template-rows:auto 1fr auto;
    padding: clamp(14px, 2.2vw, 28px);
  }
  .panel{
    pointer-events:auto;
    background:var(--cream);
    border:2.5px solid var(--ink);
    border-radius:16px;
    box-shadow: var(--shadow);
  }
  .brand{ grid-area:1/1; padding:16px 18px 18px; background:transparent; border:none; box-shadow:none;}
  .tag{
    display:inline-block; font-family:'Bungee',cursive; font-size:.6rem; letter-spacing:.18em;
    background:var(--ink); color:var(--butter); padding:5px 9px; border-radius:99px; transform:rotate(-1.5deg);
  }
  .brand h1{
    font-family:'Bungee',cursive; margin:.5rem 0 .35rem; line-height:.86;
    font-size:clamp(1.9rem, 4.4vw, 3.15rem); letter-spacing:-.01em; text-transform:uppercase;
  }
  .brand h1 span{ display:block; color:var(--tang); -webkit-text-stroke:1.5px var(--ink); }
  .brand p{ margin:0; font-size:.92rem; line-height:1.35; max-width:26ch; opacity:.85; font-weight:500;}
  .brand .stats{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .stat{
    background:#fff; border:2px solid var(--ink); border-radius:12px; padding:5px 10px 6px; line-height:1;
    box-shadow:3px 3px 0 rgba(42,30,23,.85); transform:rotate(1deg);
  }
  .stat b{ display:block; font-family:'Bungee',cursive; font-size:1.15rem; }
  .stat i{ font-style:normal; font-size:.55rem; letter-spacing:.13em; text-transform:uppercase; opacity:.6; font-weight:700;}

  .dock{ grid-area:1/3; grid-row: 1 / span 3; align-self:start; padding:14px; }
  .dock h2, .roster h2{
    font-family:'Bungee',cursive; font-size:.72rem; letter-spacing:.14em; margin:2px 4px 10px; text-transform:uppercase;
  }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 4px; }
  .row + .row{ border-top:2px dashed rgba(42,30,23,.18); }
  .row label{ font-weight:700; font-size:.88rem; }
  .row output{ font-family:'Bungee',cursive; font-size:.85rem; color:var(--cherry); min-width:3.2ch; text-align:right;}
  input[type=range]{ -webkit-appearance:none; appearance:none; width:112px; height:8px; border-radius:99px; background:var(--sand); border:2px solid var(--ink); outline:none;}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--tang);
    border:2.5px solid var(--ink); cursor:grab; box-shadow:1px 1px 0 rgba(42,30,23,.8);
  }
  input[type=range]::-moz-range-thumb{ width:15px;height:15px;border-radius:50%;background:var(--tang);border:2.5px solid var(--ink);cursor:grab;}
  .btns{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:8px 4px 4px; }
  button{
    font-family:'Bungee',cursive; font-size:.66rem; letter-spacing:.04em; text-transform:uppercase;
    background:var(--butter); color:var(--ink); border:2.5px solid var(--ink); border-radius:12px;
    padding:9px 6px; cursor:pointer; box-shadow:3px 3px 0 var(--ink);
    transition: transform .13s ease, box-shadow .13s ease, background .2s;
  }
  button:hover{ transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink); background:var(--tang); color:#fff;}
  button:active{ transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink);}
  button.wide{ grid-column:1 / -1; background:var(--mint); }
  button.wide:hover{ background:#2bb693; }
  button[aria-pressed=true]{ background:var(--ink); color:var(--butter); }

  .roster{ grid-area:3/1; align-self:end; padding:12px; }
  .roster ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .chip{
    display:flex; align-items:center; gap:9px; padding:6px 9px; border:2px solid var(--ink); border-radius:11px;
    background:#fff; cursor:pointer; transition:transform .14s ease, background .2s;
  }
  .chip:hover{ transform:translateX(4px); background:var(--butter); }
  .chip.on{ background:var(--ink); color:var(--cream); }
  .chip.on em{ color:var(--butter); }
  .dot{ width:14px; height:14px; border-radius:50%; background:var(--c); border:2px solid var(--ink); flex:none;}
  .chip b{ font-size:.85rem; }
  .chip em{ margin-left:auto; font-style:normal; font-size:.7rem; opacity:.75; font-weight:700; letter-spacing:.02em;}

  .hint{
    grid-area:3/3; justify-self:end; align-self:end; pointer-events:none;
    font-size:.72rem; font-weight:700; letter-spacing:.04em; text-align:right; line-height:1.7;
    background:rgba(255,244,228,.72); border-left:3px solid var(--ink); padding:8px 12px; border-radius:0 12px 12px 0;
  }
  .hint span{ color:var(--cherry); }
  .fade{ animation: pop .7s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes pop{ from{opacity:0; transform:translateY(14px) scale(.96)} to{opacity:1; transform:none} }

  @media (max-width: 900px){
    .ui{ grid-template-columns:1fr; grid-template-rows:auto auto 1fr auto; overflow:hidden;}
    .brand{grid-area:1/1} .dock{grid-area:2/1; align-self:start; max-height:38vh; overflow:auto}
    .roster{grid-area:3/1; align-self:end; max-height:32vh; overflow:auto} .hint{display:none}
    .brand h1{font-size:1.9rem}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="grain"></div>

<div class="ui">
  <header class="brand fade">
    <span class="tag">Low-poly · three.js</span>
    <h1>Hamster<span>Playground</span></h1>
    <p>Four chunky potatoes, one extremely loud exercise wheel. Drag to orbit, click a hamster to pet it.</p>
    <div class="stats">
      <div class="stat"><b id="sLaps">0</b><i>wheel laps</i></div>
      <div class="stat"><b id="sSeeds">0</b><i>seeds eaten</i></div>
      <div class="stat"><b id="sRpm">0</b><i>rpm</i></div>
    </div>
  </header>

  <section class="panel dock fade" style="animation-delay:.08s">
    <h2>Tank controls</h2>
    <div class="row"><label for="count">Hamsters</label><input id="count" type="range" min="1" max="6" step="1" value="4"><output id="oCount">4</output></div>
    <div class="row"><label for="speed">Waddle speed</label><input id="speed" type="range" min="0.2" max="2.2" step="0.1" value="1"><output id="oSpeed">1.0×</output></div>
    <div class="btns">
      <button id="bSeed">Toss seed</button>
      <button id="bSpin">Spin wheel</button>
      <button id="bOrbit" aria-pressed="false">Auto-orbit</button>
      <button id="bNight" aria-pressed="false">Lights out</button>
      <button id="bReset" class="wide">Reset camera</button>
    </div>
  </section>

  <section class="panel roster fade" style="animation-delay:.16s">
    <h2>Roommates</h2>
    <ul id="roster"></ul>
  </section>

  <div class="hint fade" style="animation-delay:.24s">
    <span>drag</span> orbit · <span>scroll</span> zoom<br>
    <span>click</span> a hamster to pet it
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const angLerp = (a,b,t) => { let d = ((b-a+Math.PI*3)%(Math.PI*2))-Math.PI; return a + d*t; };
const mat = (c, extra={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.94, metalness:0, flatShading:true}, extra));

const C = { ink:0x2a1e17, cream:0xfff4e4, sand:0xf2ddc0, butter:0xffc94a, tang:0xff8a3d, cherry:0xf2545b, mint:0x3ec9a3, sky:0x3fa9dd, wood:0xd8a06a, wire:0xbfa98d };

/* ============================ core ============================ */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf2e0c6, 16, 48);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 140);
camera.position.set(6.6, 5.0, 9.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.enablePan = false; controls.minDistance = 4.2; controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI*0.49; controls.minPolarAngle = 0.25;
controls.target.set(0, .9, 0); controls.rotateSpeed = .8; controls.zoomSpeed = .8;
controls.autoRotateSpeed = .9;

const amb   = new THREE.AmbientLight(0xffffff, .5);
const hemi  = new THREE.HemisphereLight(0xfff0d0, 0xc9a274, .95);
const key   = new THREE.DirectionalLight(0xfff3de, 2.6);
const fill  = new THREE.DirectionalLight(0x9fd8ff, .8);
const lamp  = new THREE.PointLight(0xffb35c, 6, 14, 2);
scene.add(amb, hemi, key, fill, lamp);
key.position.set(6.5, 10, 7); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, {left:-9, right:9, top:9, bottom:-9, near:1, far:44});
key.shadow.bias = -0.0009; key.shadow.radius = 2;
fill.position.set(-7, 4.5, -5.5);
lamp.position.set(0, 2.9, 0);

/* ============================ table + bedding ============================ */
const table = new THREE.Mesh(new THREE.CylinderGeometry(8.6, 9.1, .7, 8), mat(0xe6cfa6));
table.position.y = -1.55; table.receiveShadow = true; scene.add(table);
const tableRim = new THREE.Mesh(new THREE.CylinderGeometry(8.6, 9.1, .18, 8), mat(C.butter));
tableRim.position.y = -1.15; tableRim.receiveShadow = true; scene.add(tableRim);

const cage = new THREE.Group(); scene.add(cage);

const tray = new THREE.Mesh(new THREE.BoxGeometry(9.5, 1.6, 7.0), mat(C.sky));
tray.position.y = -.6; tray.castShadow = tray.receiveShadow = true; cage.add(tray);

const rim = new THREE.Group(); rim.position.y = .22; cage.add(rim);
[[0, 3.5, 9.7, .18, .3],[0,-3.5, 9.7, .18, .3]].forEach(([x,z,w,h,d])=>{
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(C.butter)); m.position.set(x,0,z); m.castShadow=true; rim.add(m);
});
[[4.85,0],[ -4.85,0]].forEach(([x,z])=>{
  const m = new THREE.Mesh(new THREE.BoxGeometry(.3,.22,7.0), mat(C.butter)); m.position.set(x,0,z); m.castShadow=true; rim.add(m);
});

const floor = new THREE.Mesh(new THREE.BoxGeometry(9.0, .22, 6.5), mat(0xf4e3c8));
floor.position.y = -.06; floor.receiveShadow = true; cage.add(floor);

/* wire bars (instanced) */
{
  const geo = new THREE.CylinderGeometry(.05,.05,2.4,5);
  const pts = [];
  for (let x=-4.7; x<=4.71; x+=.53){ pts.push([x, 3.5],[x,-3.5]); }
  for (let z=-2.95; z<=2.96; z+=.53){ pts.push([4.85, z],[-4.85, z]); }
  const inst = new THREE.InstancedMesh(geo, mat(C.wire, {roughness:.6, metalness:.35}), pts.length);
  inst.castShadow = true;
  const d = new THREE.Object3D();
  pts.forEach(([x,z],i)=>{ d.position.set(x, 1.38, z); d.rotation.set(0,0,0); d.updateMatrix(); inst.setMatrixAt(i, d.matrix); });
  inst.instanceMatrix.needsUpdate = true; cage.add(inst);

  const rail = (w,h,dp,x,y,z)=>{ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,dp), mat(C.ink)); m.position.set(x,y,z); m.castShadow=true; cage.add(m); };
  rail(9.9,.16,.16, 0, 2.58, 3.5); rail(9.9,.16,.16, 0, 2.58,-3.5);
  rail(.16,.16,7.1, 4.85, 2.58, 0); rail(.16,.16,7.1,-4.85, 2.58, 0);
  [[4.85,3.5],[-4.85,3.5],[4.85,-3.5],[-4.85,-3.5]].forEach(([x,z])=>{
    const p = new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,2.6,6), mat(C.cream)); p.position.set(x,1.35,z); p.castShadow=true; cage.add(p);
  });
}

/* wood shavings */
{
  const geo = new THREE.BoxGeometry(.26,.07,.07);
  const n = 190; const inst = new THREE.InstancedMesh(geo, mat(0xffffff), n);
  const d = new THREE.Object3D(); const cols = [0xe8cfa4, 0xf6e6c8, 0xd8b485, 0xffd98a, 0xc79a68];
  for (let i=0;i<n;i++){
    d.position.set(rnd(-4.3,4.3), rnd(0,.1), rnd(-2.9,2.9));
    d.rotation.set(rnd(0,6.3), rnd(0,6.3), rnd(0,6.3));
    d.updateMatrix(); inst.setMatrixAt(i, d.matrix);
    inst.setColorAt(i, new THREE.Color(cols[(Math.random()*cols.length)|0]));
  }
  inst.instanceMatrix.needsUpdate = true; inst.receiveShadow = true; cage.add(inst);
}

/* ============================ objects ============================ */
const pickList = [];

/* --- wheel --- */
const WHEEL = {x:3.25, z:-1.45, y:1.15, r:.98};
const wheelG = new THREE.Group(); wheelG.position.set(WHEEL.x, 0, WHEEL.z);
wheelG.userData.pick = {type:'wheel'}; cage.add(wheelG); pickList.push(wheelG);
{
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,1.5,6), mat(0x8f8f96,{metalness:.6,roughness:.4}));
  axle.rotation.x = Math.PI/2; axle.position.y = WHEEL.y; axle.castShadow = true; wheelG.add(axle);
  [-.62,.62].forEach(z=>{
    const leg = new THREE.Mesh(new THREE.BoxGeometry(.16,1.25,.16), mat(C.cream)); leg.position.set(0,.6,z); leg.castShadow=true; wheelG.add(leg);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(.9,.14,.22), mat(C.butter)); foot.position.set(0,.07,z); wheelG.add(foot);
  });
  const spin = new THREE.Group(); spin.position.y = WHEEL.y; spin.name='spin'; wheelG.add(spin);
  const drum = new THREE.Mesh(new THREE.CylinderGeometry(WHEEL.r, WHEEL.r, .78, 20, 1, true), mat(C.cherry,{side:THREE.DoubleSide}));
  drum.rotation.x = Math.PI/2; drum.castShadow = true; spin.add(drum);
  [.42,-.42].forEach(z=>{ const t = new THREE.Mesh(new THREE.TorusGeometry(WHEEL.r,.085,5,20), mat(C.butter)); t.position.z=z; t.castShadow=true; spin.add(t); });
  for (let i=0;i<12;i++){
    const a = i/12*Math.PI*2;
    const s = new THREE.Mesh(new THREE.BoxGeometry(.16,.06,.62), mat(C.cream));
    s.position.set(Math.cos(a)*.82, Math.sin(a)*.82, 0); s.rotation.z = a + Math.PI/2; spin.add(s);
  }
  for (let i=0;i<3;i++){
    const a = i/3*Math.PI;
    const sp = new THREE.Mesh(new THREE.BoxGeometry(WHEEL.r*1.9,.06,.06), mat(0x9a9aa2,{metalness:.4,roughness:.5}));
    sp.rotation.z = a; spin.add(sp);
  }
  wheelG.userData.spinRef = spin;
}

/* --- house --- */
const house = new THREE.Group(); house.position.set(-3.0, 0, -1.5); cage.add(house);
{
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.9,.95,1.7), mat(C.wood)); body.position.y=.45; body.castShadow=true; house.add(body);
  const roof = new THREE.Mesh(new THREE.SphereGeometry(1.15, 7, 4, 0, Math.PI*2, 0, Math.PI/2), mat(C.tang));
  roof.scale.set(1,.78,1); roof.position.y=.86; roof.castShadow=true; house.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(.62,.72,.1), mat(0x4a3728)); door.position.set(0,.4,.86); house.add(door);
  const knob = new THREE.Mesh(new THREE.IcosahedronGeometry(.09,0), mat(C.butter)); knob.position.set(.2,.5,1.02); house.add(knob);
}

/* --- tunnel --- */
const tunnel = new THREE.Group(); tunnel.position.set(-2.5, 0, 2.05); cage.add(tunnel);
{
  const t = new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,2.7,9,1,true), mat(C.mint,{side:THREE.DoubleSide}));
  t.rotation.z = Math.PI/2; t.position.y=.42; t.castShadow=true; tunnel.add(t);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(.6,.1,5,14), mat(C.butter));
  rim.rotation.y = Math.PI/2; rim.position.set(1.35,.42,0); tunnel.add(rim);
}

/* --- bowl + pellets --- */
const bowlG = new THREE.Group(); bowlG.position.set(1.25, 0, 2.2); cage.add(bowlG);
const pellets = [];
{
  const b = new THREE.Mesh(new THREE.CylinderGeometry(.5,.34,.36,8,1), mat(C.sky));
  b.position.y=.18; b.castShadow=true; bowlG.add(b);
  const inn = new THREE.Mesh(new THREE.CircleGeometry(.36,8), mat(0x2f4a58)); inn.rotation.x=-Math.PI/2; inn.position.y=.3; bowlG.add(inn);
  for (let i=0;i<5;i++){
    const p = new THREE.Mesh(new THREE.IcosahedronGeometry(.1,0), mat(C.tang));
    p.position.set(rnd(-.22,.22), .3, rnd(-.16,.16)); p.rotation.set(rnd(0,6),rnd(0,6),rnd(0,6)); bowlG.add(p); pellets.push(p);
  }
}

/* --- water bottle --- */
{
  const g = new THREE.Group(); g.position.set(4.35, 0, 1.7); cage.add(g);
  const b = new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,1.15,8), mat(0xcfeaf5,{roughness:.25,metalness:.05,opacity:.85,transparent:true}));
  b.position.y = 1.55; b.castShadow=true; g.add(b);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(.3,.34,8), mat(C.cherry)); cap.position.y=2.25; g.add(cap);
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.55,5), mat(0xa8a8ae,{metalness:.7,roughness:.3})); tube.position.set(-.22,.9,0); tube.rotation.z=.5; g.add(tube);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(.06,6,5), mat(0xb9b9c0,{metalness:.8,roughness:.25})); ball.position.set(-.4,.66,0); g.add(ball);
}

/* --- rolling ball toy --- */
const toy = new THREE.Mesh(new THREE.IcosahedronGeometry(.33,0), mat(C.mint));
toy.position.set(-.4,.32,.3); toy.castShadow = true; cage.add(toy);
const toyVel = new THREE.Vector2(0,0);

/* ============================ sparks ============================ */
const sparkGeo = new THREE.TetrahedronGeometry(.09, 0);
const sparkMats = {}; [C.butter, C.cherry, C.mint, C.tang, C.sky].forEach(c => sparkMats[c] = mat(c));
const sparks = [];
for (let i=0;i<80;i++){ const m = new THREE.Mesh(sparkGeo, sparkMats[C.butter]); m.visible=false; scene.add(m); sparks.push({m, v:new THREE.Vector3(), life:0}); }
let sparkIdx = 0;
function burst(x,y,z,color,count=9, power=2.2){
  for (let i=0;i<count;i++){
    const s = sparks[sparkIdx]; sparkIdx = (sparkIdx+1)%sparks.length;
    s.m.material = sparkMats[color] || sparkMats[C.butter];
    s.m.position.set(x,y,z);
    s.v.set(rnd(-1,1), rnd(.6,1.9), rnd(-1,1)).normalize().multiplyScalar(rnd(.9,power));
    s.life = rnd(.55,.95); s.m.visible = true; s.m.scale.setScalar(rnd(.7,1.5)); s.max = s.life;
  }
}

/* ============================ hamsters ============================ */
const NAMES = ['Nori','Peanut','Biscuit','Mochi','Waffle','Pickle'];
const SKINS = [
  {body:0xe8a55c, patch:0xfff2dd, css:'#e8a55c'},
  {body:0x9fb0c0, patch:0xf4f7fb, css:'#9fb0c0'},
  {body:0xf3d9b4, patch:0xc07a44, css:'#d8a469'},
  {body:0x4a3f37, patch:0xffe6c2, css:'#6b5a4d'},
  {body:0xfbf1e2, patch:0xf6b9c8, css:'#f2cdd6'},
  {body:0x8b5f3c, patch:0xffe9c9, css:'#8b5f3c'},
];
const G = {
  body: new THREE.IcosahedronGeometry(.4,0),
  head: new THREE.DodecahedronGeometry(.28,0),
  snout:new THREE.ConeGeometry(.16,.26,5),
  ball: new THREE.IcosahedronGeometry(.1,0),
  eye:  new THREE.SphereGeometry(.062,6,5),
  ear:  new THREE.SphereGeometry(.12,5,4),
  paw:  new THREE.BoxGeometry(.1,.09,.14),
};
const hamsters = [];
const seeds = [];
let focus = null, laps = 0, seedsEaten = 0;

function addHamster(i){
  const cfg = SKINS[i % SKINS.length];
  const fur = mat(cfg.body), soft = mat(cfg.patch);
  const dark = mat(0x241a14,{roughness:.4});
  const pink = mat(0xf7a8b8,{roughness:.7});

  const root = new THREE.Group();
  const core = new THREE.Group(); root.add(core);
  root.userData.pick = {type:'hamster'};

  const body = new THREE.Mesh(G.body, fur); body.scale.set(1.05,.92,1.32); body.position.y=.4; body.castShadow=true; core.add(body);
  const bib  = new THREE.Mesh(G.ball, soft); bib.scale.set(1,.7,.9); bib.position.set(0,.3,.24); core.add(bib);
  const head = new THREE.Mesh(G.head, soft); head.scale.set(1,.95,1.05); head.position.set(0,.66,.3); head.castShadow=true; core.add(head);
  const snout= new THREE.Mesh(G.snout, soft); snout.rotation.x = Math.PI/2; snout.position.set(0,.5,.5); core.add(snout);
  const nose = new THREE.Mesh(new THREE.OctahedronGeometry(.055,0), pink); nose.position.set(0,.52,.66); core.add(nose);
  const tail = new THREE.Mesh(G.ball, soft); tail.position.set(0,.42,-.6); core.add(tail);

  const eyes=[], ears=[], feet=[], paws=[];
  for (const s of [-1,1]){
    const e = new THREE.Mesh(G.eye, dark); e.position.set(s*.19,.7,.46); core.add(e); eyes.push(e);
    const w = new THREE.Mesh(G.eye, dark); w.position.set(s*.055,.7,.5); w.scale.setScalar(.55); core.add(w);
    const ear = new THREE.Mesh(G.ear, fur); ear.scale.set(1,1,.45); ear.position.set(s*.21,.86,.16); ear.rotation.z = s*.3; core.add(ear);
    const ear2= new THREE.Mesh(G.ear, pink); ear2.scale.set(.6,.6,.28); ear2.position.set(s*.22,.85,.2); core.add(ear2);
    ears.push(ear);
    const chk = new THREE.Mesh(G.ball, soft); chk.scale.set(.85,.85,.85); chk.position.set(s*.27,.44,.24); core.add(chk);
    const f = new THREE.Mesh(G.ball, soft); f.scale.set(.85,.55,1.15); f.position.set(s*.2,.08,-.1); core.add(f); feet.push(f);
    const p = new THREE.Mesh(G.paw, soft); p.position.set(s*.15,.28,.42); core.add(p); paws.push(p);
  }

  root.userData.pick.h = null;
  const h = {
    root, core, eyes, feet, paws, idx:i, name:NAMES[i % NAMES.length], css:cfg.css,
    heading: rnd(0,6.3), phase: rnd(0,6.3), speed: rnd(1.15,1.75),
    inWheel:false, act:null, walk:0, bob:0
  };
  root.userData.pick.h = h;
  root.rotation.y = h.heading;
  pickList.push(root);
  cage.add(root);
  hamsters.push(h);
  const p = randPoint(); root.position.set(p.x, 0, p.z);
  h.act = {type:'wander', target:randPoint(), dwell:rnd(.2,.9), t:0, arrived:false};
  renderRoster();
  return h;
}
function removeHamster(){
  const h = hamsters.pop(); if (!h) return;
  pickList.splice(pickList.indexOf(h.root),1);
  scene.remove(h.root);
  h.root.traverse(o=>{ if(o.material && o.material.dispose) o.material.dispose(); });
  if (focus === h) focus = null;
  renderRoster();
}
function setCount(n){ while (hamsters.length < n) addHamster(hamsters.length); while (hamsters.length > n) removeHamster(); }

function randPoint(){
  for (let i=0;i<24;i++){
    const x = rnd(-3.5,3.5), z = rnd(-2.1,2.1);
    if (!blocked(x,z)) return {x,z};
  }
  return {x:0, z:.4};
}
const BLOCKS = [
  {x:WHEEL.x, z:WHEEL.z, r:1.35},
  {x:-3.0, z:-1.5, r:1.5},
  {x:-2.5, z:2.05, r:1.35},
  {x:1.25, z:2.2, r:.62},
  {x:4.35, z:1.7, r:.7},
];
function blocked(x,z){ return BLOCKS.some(b => (x-b.x)**2 + (z-b.z)**2 < b.r*b.r); }

function chooseAction(h){
  if (seeds.length){
    const s = seeds[0];
    h.act = {type:'seed', ref:s, target:{x:s.pos.x, z:s.pos.z}, dwell:.5, t:0, arrived:false};
    return;
  }
  const r = Math.random();
  if (r < .2)      h.act = {type:'idle',   dwell:rnd(.8,2.2), t:0, arrived:true};
  else if (r < .5) h.act = {type:'wander', target:randPoint(), dwell:rnd(.2,.9), t:0, arrived:false};
  else if (r < .72)h.act = {type:'wheel',  target:{x:WHEEL.x, z:WHEEL.z}, dwell:rnd(4,8), t:0, arrived:false};
  else if (r < .88)h.act = {type:'eat',    target:{x:1.25, z:1.55}, dwell:rnd(2.5,4.5), t:0, arrived:false};
  else if (r < .95)h.act = {type:'burrow', target:{x:-1.0, z:2.05}, dwell:rnd(3.5,6.5), t:0, arrived:false};
  else             h.act = {type:'groom',  dwell:rnd(1.8,3.2), t:0, arrived:true};
  h.act.timer = 0;
}
function endAction(h){
  const a = h.act;
  if (a.type === 'seed'){
    const i = seeds.indexOf(a.ref); if (i>=0) seeds.splice(i,1);
    a.ref.userData.dead = true;
    scene.remove(a.ref.mesh); burst(a.ref.pos.x, .35, a.ref.pos.z, C.butter, 8, 1.8);
    seedsEaten++; $('#sSeeds').textContent = seedsEaten;
  }
  if (a.type === 'burrow'){ h.root.visible = true; burst(h.root.position.x, .5, h.root.position.z, C.mint, 7, 1.6); }
  if (a.type === 'wheel'){ h.inWheel = false; }
  h.act = null;
  setTimeout(()=>{ if (h.act === null) chooseAction(h); }, 0);
}

/* ============================ loop ============================ */
let simSpeed = 1, spin = 0, spinTarget = 0, T = 0, frame = 0, night = false;
const L = {key:2.6, fill:.8, hemi:.95, lamp:6, amb:.5, exp:1.05, fog:new THREE.Color(0xf2e0c6)};
const clock = new THREE.Clock();
const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2();
let downAt = null;

function stepHamster(h, dt){
  const a = h.act || (h.act = {type:'idle', dwell:1, t:0, arrived:true});
  const p = h.root.position;
  let moving = false;

  if (!a.arrived && a.target){
    const dx = a.target.x - p.x, dz = a.target.z - p.z, d = Math.hypot(dx,dz);
    if (d < .1){
      a.arrived = true; a.t = 0;
      if (a.type === 'wheel'){ h.inWheel = true; }
      if (a.type === 'burrow'){ h.root.visible = false; }
      if (a.type === 'eat') burst(p.x, .5, p.z, C.tang, 4, 1.2);
    } else {
      const sp = h.speed * (a.type==='wheel' ? 1.3 : 1);
      p.x += dx/d*sp*dt; p.z += dz/d*sp*dt;
      h.heading = angLerp(h.heading, Math.atan2(dx,dz), 1-Math.pow(.0009, dt));
      h.root.rotation.y = h.heading;
      moving = true;
    }
  }
  if (a.arrived){
    a.t += dt;
    if (a.type === 'eat'){
      a.timer += dt;
      if (a.timer > .65){
        a.timer = 0;
        const p2 = pellets.find(m=>m.visible);
        if (p2){ p2.visible=false; burst(p2.parent.position.x, .4, p2.parent.position.z, C.butter, 6, 1.4);
                 if (!pellets.some(x=>x.visible)) setTimeout(()=>pellets.forEach(m=>m.visible=true), 2600); }
      }
    }
    if (a.type === 'idle' || a.type === 'groom'){
      if (Math.random() < dt*.35) burst(p.x, .95, p.z, C.cherry, 3, 1.1);
    }
    if (a.t > a.dwell) endAction(h);
  }

  /* obstacle push-out */
  if (!h.inWheel){
    for (const b of BLOCKS){
      const dx = p.x-b.x, dz = p.z-b.z, d = Math.hypot(dx,dz);
      if (d < b.r && d > 1e-4){ const push = (b.r - d); p.x += dx/d*push*Math.min(dt*12,1); p.z += dz/d*push*Math.min(dt*12,1); }
    }
  }
  /* separation */
  for (const o of hamsters){ if (o===h) continue;
    const dx = p.x-o.root.position.x, dz = p.z-o.root.position.z, d2 = dx*dx+dz*dz;
    if (d2 < .64 && d2 > 1e-5){ const d = Math.sqrt(d2); p.x += dx/d*dt*2.4; p.z += dz/d*dt*2.4; }
  }
  p.x = clamp(p.x, -4.1, 4.1); p.z = clamp(p.z, -2.9, 2.9);

  /* toy push */
  const tb = new THREE.Vector2(p.x - toy.position.x, p.z - toy.position.z);
  if (tb.length() < .55 && !h.inWheel){ const l = tb.length()||1; toyVel.x += -tb.x/l*2.2*dt*8; toyVel.y += -tb.y/l*2.2*dt*8; }

  /* animation */
  h.walk += (moving ? 11*h.speed : 3.2) * dt;
  const asleep = h.act.type==='idle' && h.act.dwell > 1.4;
  const groom  = h.act.type==='groom';
  h.phase = h.walk;
  const hop = moving ? Math.abs(Math.sin(h.walk))*0.115 : 0;
  const baseY = h.inWheel ? .14 : 0;
  p.y += (baseY + hop - p.y) * Math.min(dt*14,1);
  h.core.position.y += ((asleep? -.02 : 0) - h.core.position.y)*Math.min(dt*8,1);
  const targetScale = asleep ? .84 : 1;
  h.core.scale.y += (targetScale - h.core.scale.y)*Math.min(dt*7,1);
  h.core.rotation.x += (((groom? -.55 : 0) + (moving? -0.1*Math.cos(h.walk) : 0)) - h.core.rotation.x)*Math.min(dt*9,1);
  h.core.rotation.z += ((Math.sin(T*2.1 + h.idx)*0.04 + (groom? .12:0)) - h.core.rotation.z)*Math.min(dt*8,1);
  const eyeS = asleep || groom ? .18 : 1;
  h.eyes.forEach(e=> e.scale.y += (eyeS - e.scale.y)*Math.min(dt*8,1));
  h.feet.forEach((f,i)=>{ f.position.z = -.1 + (moving ? Math.sin(h.walk + i*Math.PI)*0.11 : 0); });
  h.paws.forEach((pw,i)=>{ pw.position.y = .28 + (groom ? Math.sin(T*14 + i*Math.PI)*0.05 : 0); });
  if (h.inWheel) h.root.rotation.y += (Math.PI/2 - h.root.rotation.y)*Math.min(dt*6,1);
}

function updateSparks(dt){
  for (const s of sparks){
    if (!s.m.visible) continue;
    s.life -= dt;
    if (s.life <= 0){ s.m.visible=false; continue; }
    s.v.y -= 2.4*dt; s.m.position.addScaledVector(s.v, dt);
    s.m.rotation.x += dt*6; s.m.rotation.y += dt*4;
    const k = Math.max(s.life/s.max, 0); s.m.scale.setScalar(k*1.4);
  }
}

function loop(){
  const raw = Math.min(clock.getDelta(), .05);
  const dt = raw * simSpeed;
  T += dt; frame++;

  /* lights day/night lerp */
  const tgt = night ? {key:.55, fill:.22, hemi:.32, lamp:24, amb:.16, exp:.86, fog:new THREE.Color(0x1e2c3d)}
                   : {key:2.6, fill:.8, hemi:.95, lamp:6, amb:.5, exp:1.05, fog:new THREE.Color(0xf2e0c6)};
  const k = Math.min(raw*2.4,1);
  L.key += (tgt.key-L.key)*k; L.fill += (tgt.fill-L.fill)*k; L.hemi += (tgt.hemi-L.hemi)*k;
  L.lamp += (tgt.lamp-L.lamp)*k; L.amb += (tgt.amb-L.amb)*k; L.exp += (tgt.exp-L.exp)*k;
  L.fog.lerp(tgt.fog, k);
  key.intensity = L.key; fill.intensity = L.fill; hemi.intensity = L.hemi; lamp.intensity = L.lamp; amb.intensity = L.amb;
  renderer.toneMappingExposure = L.exp; scene.fog.color.copy(L.fog);

  /* hamsters */
  for (const h of hamsters) stepHamster(h, dt);

  /* wheel */
  const running = hamsters.filter(h=>h.inWheel).length;
  spinTarget = running ? 12 + running*3 : .8;
  spin += (spinTarget - spin) * Math.min(raw*2.2,1);
  const spinObj = wheelG.userData.spinRef;
  spinObj.rotation.z -= spin * dt;
  laps += Math.abs(spin*dt)/(Math.PI*2);
  if (frame % 12 === 0) $('#sRpm').textContent = Math.round(spin/(Math.PI*2)*60);
  if (frame % 20 === 0) $('#sLaps').textContent = Math.floor(laps);

  /* toy ball */
  if (toyVel.lengthSq() > 1e-5){
    const v = toyVel.clone();
    toy.position.x = clamp(toy.position.x + v.x*dt, -4.0, 4.0);
    toy.position.z = clamp(toy.position.z + v.y*dt, -2.8, 2.8);
    if (toy.position.x <= -4.0 || toy.position.x >= 4.0) toyVel.x *= -.55;
    if (toy.position.z <= -2.8 || toy.position.z >= 2.8) toyVel.y *= -.55;
    const axis = new THREE.Vector3(-v.y, 0, v.x).normalize();
    toy.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(axis, v.length()*dt/.33));
    toyVel.multiplyScalar(1 - Math.min(dt*2.2, .9));
  }

  updateSparks(raw);
  if (focus) controls.target.lerp(focus.root.position, Math.min(raw*4,1));
  controls.update();
  renderer.render(scene, camera);
  if (frame % 10 === 0) renderStates();
}
renderer.setAnimationLoop(loop);

/* ============================ picking ============================ */
function findPick(obj){ let o = obj; while(o){ if (o.userData && o.userData.pick) return o.userData.pick; o = o.parent; } return null; }
canvas.addEventListener('pointerdown', e => { downAt = {x:e.clientX, y:e.clientY}; });
canvas.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y); downAt = null;
  if (moved > 6) return;
  ptr.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(pickList, true);
  let got = null; for (const h of hits){ const p = findPick(h.object); if (p){ got = p; break; } }
  if (!got){ focus = null; renderStates(); return; }
  if (got.type === 'wheel'){ spin += 16; burst(WHEEL.x, 1.6, WHEEL.z, C.butter, 10, 2.4); }
  if (got.type === 'hamster'){
    focus = got.h;
    const p = got.h.root.position;
    got.h.root.scale.setScalar(1.18);
    setTimeout(()=>got.h.root.scale.setScalar(1), 160);
    burst(p.x, .9, p.z, C.cherry, 10, 2.1);
    renderStates();
  }
});

/* ============================ UI ============================ */
const rosterEl = $('#roster');
function renderRoster(){
  rosterEl.innerHTML = '';
  hamsters.forEach((h,i)=>{
    const li = document.createElement('li');
    li.className = 'chip' + (focus===h?' on':'');
    li.innerHTML = `<span class="dot" style="--c:${h.css}"></span><b>${h.name}</b><em>—</em>`;
    li.onclick = ()=>{ focus = (focus===h? null : h); renderStates(); };
    rosterEl.appendChild(li);
  });
  renderStates();
}
const LABEL = {wander:'exploring', idle:'loafing', wheel:'wheel cardio', eat:'munching', groom:'grooming', burrow:'burrowed', seed:'snack chase'};
function renderStates(){
  const chips = rosterEl.children;
  for (let i=0;i<chips.length;i++){
    const h = hamsters[i]; if (!h) continue;
    chips[i].classList.toggle('on', focus===h);
    const em = chips[i].querySelector('em');
    const txt = (!h.root.visible) ? 'in the tunnel' : (LABEL[h.act?.type] || '…');
    if (em.textContent !== txt) em.textContent = txt;
  }
}
$('#count').addEventListener('input', e => { setCount(+e.target.value); $('#oCount').textContent = e.target.value; });
$('#speed').addEventListener('input', e => { simSpeed = +e.target.value; $('#oSpeed').textContent = (+e.target.value).toFixed(1)+'×'; });
$('#bSeed').onclick = ()=>{
  if (seeds.length > 3) return;
  const g = new THREE.Mesh(new THREE.OctahedronGeometry(.11,0), mat(C.butter));
  const p = randPoint(); const pos = new THREE.Vector3(p.x, .18, p.z);
  g.position.copy(pos); g.castShadow = true; cage.add(g);
  const seed = {mesh:g, pos}; seeds.push(seed);
  g.userData.t = 0;
  burst(pos.x, .3, pos.z, C.cherry, 5, 1.2);
  const free = hamsters.find(h=>h.act && h.act.type!=='seed' && !h.inWheel && h.root.visible);
  if (free){ free.inWheel=false; free.root.visible=true; free.act = {type:'seed', ref:seed, target:{x:p.x,z:p.z}, dwell:.5, t:0, arrived:false, timer:0}; }
};
$('#bSpin').onclick = ()=>{ spin += 18; burst(WHEEL.x, 1.6, WHEEL.z, C.butter, 10, 2.4); };
$('#bOrbit').onclick = e => { controls.autoRotate = !controls.autoRotate; e.currentTarget.setAttribute('aria-pressed', String(controls.autoRotate)); };
$('#bNight').onclick = e => { night = !night; document.body.classList.toggle('night', night); e.currentTarget.setAttribute('aria-pressed', String(night)); };
$('#bReset').onclick = ()=>{ focus = null; controls.target.set(0,.9,0); camera.position.set(6.6,5,9.8); renderStates(); };
addEventListener('keydown', e => { if (e.code==='Space'){ e.preventDefault(); } });

/* seed bobbing + cleanup */
setInterval(()=>{ for (const s of seeds) if (s.mesh) s.mesh.rotation.y += .2; }, 40);

/* resize */
function resize(){ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); }
addEventListener('resize', resize);

/* boot */
setCount(4);
for (let i=0;i<3;i++) chooseAction(hamsters[i]);
</script>
</body>
