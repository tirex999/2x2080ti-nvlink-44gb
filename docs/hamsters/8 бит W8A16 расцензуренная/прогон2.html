<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe9d6; }
  canvas { display: block; }
  #hud {
    position: absolute; top: 14px; left: 14px;
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    color: #7a4a2b; background: rgba(255,255,255,.75);
    padding: 10px 16px; border-radius: 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,.12);
    pointer-events: none; user-select: none;
  }
  #hud h1 { margin: 0 0 4px; font-size: 18px; }
  #hud p  { margin: 0; font-size: 12px; }
</style>
</head>
<body>
<div id="hud">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &bull; Scroll to zoom &bull; Watch the hamsters goof off</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------- setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe9d6);
scene.fog = new THREE.Fog(0xffe9d6, 30, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9, 7, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.49;

// lights
scene.add(new THREE.HemisphereLight(0xfff4e0, 0xd9a877, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;   sun.shadow.camera.bottom = -12;
scene.add(sun);

// --------------------------------------------------------------- helpers
const mat = (color, opts = {}) =>
  new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85, ...opts });

function shadowMesh(geo, material) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// --------------------------------------------------------------- cage
const CAGE_R = 5.2;

// floor tray
const tray = shadowMesh(
  new THREE.CylinderGeometry(CAGE_R, CAGE_R * 0.92, 0.5, 12),
  mat(0xf5c26b)
);
tray.position.y = 0.25;
scene.add(tray);

// bedding
const bedding = shadowMesh(
  new THREE.CylinderGeometry(CAGE_R * 0.96, CAGE_R * 0.96, 0.18, 12),
  mat(0xe8a855)
);
bedding.position.y = 0.52;
scene.add(bedding);

// scattered wood shavings (tiny flat boxes)
const shavingMat = mat(0xd99a4e);
for (let i = 0; i < 40; i++) {
  const s = shadowMesh(new THREE.BoxGeometry(0.25, 0.05, 0.12), shavingMat);
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * CAGE_R * 0.85;
  s.position.set(Math.cos(a) * r, 0.63, Math.sin(a) * r);
  s.rotation.y = Math.random() * Math.PI;
  scene.add(s);
}

// cage bars
const barMat = mat(0x9aa5b1, { metalness: 0.4, roughness: 0.4 });
const barCount = 22, barH = 3.4;
for (let i = 0; i < barCount; i++) {
  const a = (i / barCount) * Math.PI * 2;
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, barH, 6), barMat);
  bar.position.set(Math.cos(a) * CAGE_R, 0.5 + barH / 2, Math.sin(a) * CAGE_R);
  scene.add(bar);
}
// rings (bottom + top)
const ringGeo = new THREE.TorusGeometry(CAGE_R, 0.08, 6, 24);
[0.55, 0.5 + barH].forEach(y => {
  const ring = new THREE.Mesh(ringGeo, barMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = y;
  scene.add(ring);
});
// mid decorative ring
const midRing = new THREE.Mesh(new THREE.TorusGeometry(CAGE_R, 0.05, 6, 24), barMat);
midRing.rotation.x = Math.PI / 2;
midRing.position.y = 0.5 + barH * 0.55;
scene.add(midRing);

// ground plane under everything
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(40, 32),
  mat(0xf7d9b8, { roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// ----------------------------------------------------------- wheel
const wheelGroup = new THREE.Group();
wheelGroup.position.set(-3.2, 0.6, -2.4);
scene.add(wheelGroup);

// stand
const stand = shadowMesh(new THREE.CylinderGeometry(0.12, 0.2, 1.1, 6), mat(0x8895a5));
stand.position.y = 0.55;
wheelGroup.add(stand);
const base = shadowMesh(new THREE.CylinderGeometry(0.55, 0.65, 0.15, 8), mat(0x8895a5));
base.position.y = 0.07;
wheelGroup.add(base);

// spinning part
const wheelSpin = new THREE.Group();
wheelSpin.position.y = 1.35;
wheelGroup.add(wheelSpin);

const rimMat = mat(0xff6f91);
const rim = shadowMesh(new THREE.TorusGeometry(0.85, 0.09, 6, 18), rimMat);
wheelSpin.add(rim);
// rungs
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  const rung = shadowMesh(new THREE.CylinderGeometry(0.035, 0.035, 1.6, 5), rimMat);
  rung.rotation.z = a;
  wheelSpin.add(rung);
}
// hub
const hub = shadowMesh(new THREE.CylinderGeometry(0.14, 0.14, 0.2, 8), mat(0xffb3c6));
hub.rotation.x = Math.PI / 2;
wheelSpin.add(hub);

let wheelSpeed = 0; // eased toward target

// ----------------------------------------------------------- food bowl
const bowlPos = new THREE.Vector3(3.4, 0.6, -2.6);
const bowl = shadowMesh(new THREE.CylinderGeometry(0.55, 0.4, 0.3, 8), mat(0x5ec8a2));
bowl.position.copy(bowlPos);
scene.add(bowl);
const pelletMat = mat(0xc46a2e);
for (let i = 0; i < 6; i++) {
  const p = shadowMesh(new THREE.IcosahedronGeometry(0.09, 0), pelletMat);
  const a = Math.random() * Math.PI * 2, r = Math.random() * 0.25;
  p.position.set(bowlPos.x + Math.cos(a) * r, 0.75, bowlPos.z + Math.sin(a) * r);
  scene.add(p);
}

// ----------------------------------------------------------- tunnel
const tunnel = shadowMesh(
  new THREE.CylinderGeometry(0.55, 0.55, 2.2, 8, 1, false, 0, Math.PI),
  mat(0x6fc2ff, { side: THREE.DoubleSide })
);
tunnel.rotation.z = Math.PI / 2;
tunnel.rotation.y = Math.PI * 0.3;
tunnel.position.set(1.2, 0.6, 2.8);
scene.add(tunnel);

// -------------------------------------------------------- hamsters
const HAMSTER_COLORS = [
  { body: 0xf5b971, belly: 0xfff1dc }, // classic golden
  { body: 0xffffff, belly: 0xffe3ee }, // snowball
  { body: 0xb07a4f, belly: 0xf3ddc2 }, // chocolate
];

function makeHamster(colorSet) {
  const g = new THREE.Group();

  const body = shadowMesh(
    new THREE.IcosahedronGeometry(0.42, 1),
    mat(colorSet.body)
  );
  body.scale.set(1.25, 0.95, 1);
  body.position.y = 0.42;
  g.add(body);

  const belly = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.3, 1),
    mat(colorSet.belly)
  );
  belly.scale.set(1.1, 0.7, 0.9);
  belly.position.set(0.1, 0.34, 0);
  g.add(belly);

  // ears
  [-1, 1].forEach(side => {
    const ear = shadowMesh(new THREE.ConeGeometry(0.11, 0.18, 5), mat(colorSet.body));
    ear.position.set(0.28, 0.82, side * 0.22);
    ear.rotation.z = -0.4;
    g.add(ear);
  });

  // eyes
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x2b2b2b });
  [-1, 1].forEach(side => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), eyeMat);
    eye.position.set(0.55, 0.55, side * 0.2);
    g.add(eye);
  });

  // nose
  const nose = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0xff7fa5 })
  );
  nose.position.set(0.68, 0.42, 0);
  g.add(nose);

  // cheek pouches (chubby!)
  [-1, 1].forEach(side => {
    const cheek = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.13, 0),
      mat(colorSet.belly)
    );
    cheek.position.set(0.48, 0.36, side * 0.3);
    g.add(cheek);
  });

  // stubby feet
  const footMat = mat(colorSet.body);
  [[0.3, 0.1], [0.3, -0.1], [-0.25, 0.1], [-0.25, -0.1]].forEach(([x, z]) => {
    const foot = shadowMesh(new THREE.SphereGeometry(0.08, 5, 5), footMat);
    foot.position.set(x, 0.08, z);
    g.add(foot);
  });

  return g;
}

// -------------------------------------------------------- hamster AI
const FLOOR_Y = 0.62;
const WHEEL_POS = new THREE.Vector3(-3.2, FLOOR_Y, -2.4);
const BOWL_POS  = new THREE.Vector3(3.4,  FLOOR_Y, -2.6);
const TUNNEL_POS = new THREE.Vector3(1.2, FLOOR_Y, 2.8);

const hamsters = [];
HAMSTER_COLORS.forEach((c, i) => {
  const mesh = makeHamster(c);
  const a = (i / HAMSTER_COLORS.length) * Math.PI * 2;
  mesh.position.set(Math.cos(a) * 2, FLOOR_Y, Math.sin(a) * 2);
  scene.add(mesh);
  hamsters.push({
    mesh,
    state: 'wander',
    target: new THREE.Vector3(),
    stateTimer: 0,
    speed: 1.1 + Math.random() * 0.5,
    wobble: Math.random() * 10,
    facing: 0,
  });
  pickWanderTarget(hamsters[i]);
});

function randPointInTray(radius = CAGE_R * 0.78) {
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * radius;
  return new THREE.Vector3(Math.cos(a) * r, FLOOR_Y, Math.sin(a) * r);
}

function pickWanderTarget(h) {
  h.target.copy(randPointInTray());
  h.state = 'wander';
}

function updateHamster(h, dt, t) {
  h.stateTimer -= dt;
  const pos = h.mesh.position;
  const toTarget = h.target.clone().sub(pos);
  toTarget.y = 0;
  const dist = toTarget.length();

  let moving = false;

  switch (h.state) {
    case 'wander':
      if (dist > 0.15) {
        moving = true;
        pos.addScaledVector(toTarget.normalize(), h.speed * dt);
        h.facing = Math.atan2(toTarget.x, toTarget.z);
      } else if (h.stateTimer <= 0) {
        // decide next action
        const roll = Math.random();
        if (roll < 0.22) {
          h.state = 'wheel';
          h.target.copy(WHEEL_POS).add(new THREE.Vector3(0.9, 0, 0));
          h.stateTimer = 12;
        } else if (roll < 0.4) {
          h.state = 'eat';
          h.target.copy(BOWL_POS).add(new THREE.Vector3(0, 0, 0.9));
          h.stateTimer = 10;
        } else if (roll < 0.55) {
          h.state = 'pause';
          h.stateTimer = 1 + Math.random() * 2.5;
        } else {
          pickWanderTarget(h);
          h.stateTimer = 8 + Math.random() * 6;
        }
      }
      break;

    case 'pause':
      if (h.stateTimer <= 0) pickWanderTarget(h);
      break;

    case 'wheel':
      if (dist > 0.5) {
        moving = true;
        pos.addScaledVector(toTarget.normalize(), h.speed * 1.3 * dt);
        h.facing = Math.atan2(toTarget.x, toTarget.z);
      } else {
        // face the wheel and run in place!
        h.facing = Math.atan2(WHEEL_POS.x - pos.x, WHEEL_POS.z - pos.z);
        wheelSpeed = Math.max(wheelSpeed, 6);
        if (h.stateTimer <= 0) pickWanderTarget(h);
      }
      break;

    case 'eat':
      if (dist > 0.5) {
        moving = true;
        pos.addScaledVector(toTarget.normalize(), h.speed * dt);
        h.facing = Math.atan2(toTarget.x - pos.x, toTarget.z - pos.z);
      } else {
        h.facing = Math.atan2(BOWL_POS.x - pos.x, BOWL_POS.z - pos.z);
        if (h.stateTimer <= 0) pickWanderTarget(h);
      }
      break;
  }

  // keep inside cage
  const rr = Math.hypot(pos.x, pos.z);
  if (rr > CAGE_R * 0.85) {
    pos.x *= (CAGE_R * 0.85) / rr;
    pos.z *= (CAGE_R * 0.85) / rr;
  }

  // smooth turn
  let dAng = h.facing - h.mesh.rotation.y;
  while (dAng > Math.PI) dAng -= Math.PI * 2;
  while (dAng < -Math.PI) dAng += Math.PI * 2;
  h.mesh.rotation.y += dAng * Math.min(1, dt * 8);

  // cute animation: hop-waddle while moving, idle bob otherwise
  h.wobble += dt * (moving ? 14 : 4);
  const bob = moving ? Math.abs(Math.sin(h.wobble)) * 0.09 : Math.sin(h.wobble) * 0.03;
  h.mesh.position.y = FLOOR_Y + bob;
  h.mesh.rotation.z = moving ? Math.sin(h.wobble) * 0.08 : 0;

  // eating munch animation
  if (h.state === 'eat' && dist <= 0.5) {
    h.mesh.scale.y = 1 + Math.sin(t * 12) * 0.05;
  } else {
    h.mesh.scale.y += (1 - h.mesh.scale.y) * Math.min(1, dt * 6);
  }
}

// -------------------------------------------------------- loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  hamsters.forEach(h => updateHamster(h, dt, t));

  // wheel eases back to rest
  wheelSpeed += (0 - wheelSpeed) * Math.min(1, dt * 1.5);
  wheelSpin.rotation.x -= wheelSpeed * dt;

  // gentle cage sway? no — keep it stable. Just controls + render.
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
