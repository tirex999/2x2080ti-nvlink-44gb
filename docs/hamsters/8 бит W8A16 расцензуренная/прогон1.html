<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
  #ui {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    color: #fff; text-align: center; pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  #ui h1 { margin: 0; font-size: 26px; letter-spacing: 1px; }
  #ui p  { margin: 4px 0 0; font-size: 14px; opacity: 0.9; }
</style>
</head>
<body>
<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; Watch them waddle!</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================== SETUP ============================== */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8e6f0); // sky pastel
scene.fog = new THREE.Fog(0xa8e6f0, 20, 40);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7, 6, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 1, 0);
controls.minDistance = 5;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.49;

/* ============================== LIGHTS ============================= */

scene.add(new THREE.HemisphereLight(0xfff6e0, 0x9db8ff, 0.9));

const sun = new THREE.DirectionalLight(0xfff2d0, 1.4);
sun.position.set(6, 10, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;   sun.shadow.camera.bottom = -8;
scene.add(sun);

/* ============================ HELPERS ============================== */

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85, ...opts });
}
function mesh(geo, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
const rand = (a, b) => a + Math.random() * (b - a);

/* ============================ THE CAGE ============================= */

const CAGE = { w: 6.4, d: 6.4, h: 3.2 };
const BOUND = 2.7; // hamster roaming bound

// Table the cage sits on
const tableTop = mesh(new THREE.BoxGeometry(CAGE.w + 1.2, 0.3, CAGE.d + 1.2),
                      mat(0xd9a066), 0, -0.35, 0);
scene.add(tableTop);
[[-2.6, -2.6], [2.6, -2.6], [-2.6, 2.6], [2.6, 2.6]].forEach(([x, z]) => {
  scene.add(mesh(new THREE.CylinderGeometry(0.18, 0.24, 2.6, 6),
                 mat(0xb07a45), x, -1.75, z));
});

// Wood base / tray
scene.add(mesh(new THREE.BoxGeometry(CAGE.w, 0.5, CAGE.d), mat(0xc98d5a), 0, 0.1, 0));
// Bedding floor
const bedding = mesh(new THREE.BoxGeometry(CAGE.w - 0.3, 0.22, CAGE.d - 0.3),
                     mat(0xf2d8a7, { roughness: 1 }), 0, 0.38, 0);
scene.add(bedding);

// Glass walls (translucent, low-poly vibe from the frame)
const glassMat = new THREE.MeshStandardMaterial({
  color: 0xcfeeff, transparent: true, opacity: 0.18,
  roughness: 0.1, metalness: 0.1, side: THREE.DoubleSide
});
const wallGeoH = new THREE.PlaneGeometry(CAGE.w, CAGE.h);
const wallGeoW = new THREE.PlaneGeometry(CAGE.d, CAGE.h);
[[0, 0, -CAGE.d/2, 0], [0, 0, CAGE.d/2, 0],
 [-CAGE.w/2, 0, 0, Math.PI/2], [CAGE.w/2, 0, 0, Math.PI/2]].forEach(([x, , z, ry]) => {
  const g = (ry === 0 ? wallGeoH : wallGeoW).clone();
  const wall = new THREE.Mesh(g, glassMat);
  wall.position.set(x, 0.35 + CAGE.h/2, z);
  wall.rotation.y = ry;
  scene.add(wall);
});

// Metal frame (edges)
const frameMat = mat(0x8a9bb0, { metalness: 0.6, roughness: 0.4 });
const fw = CAGE.w/2, fd = CAGE.d/2, fy0 = 0.35, fy1 = 0.35 + CAGE.h;
const bar = (x1, y1, z1, x2, y2, z2) => {
  const a = new THREE.Vector3(x1, y1, z1), b = new THREE.Vector3(x2, y2, z2);
  const len = a.distanceTo(b);
  const m = mesh(new THREE.CylinderGeometry(0.05, 0.05, len, 6), frameMat);
  m.position.copy(a.clone().add(b).multiplyScalar(0.5));
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  scene.add(m);
};
for (const sx of [-fw, fw]) for (const sz of [-fd, fd]) bar(sx, fy0, sz, sx, fy1, sz);
for (const sy of [fy0, fy1]) {
  bar(-fw, sy, -fd, fw, sy, -fd); bar(fw, sy, -fd, fw, sy, fd);
  bar(fw, sy, fd, -fw, sy, fd);   bar(-fw, sy, fd, -fw, sy, -fd);
}
// A few vertical "bars" on the front for cage flavor
for (let i = 1; i < 8; i++) {
  const x = -fw + (CAGE.w * i) / 8;
  bar(x, fy1, fd, x, fy1 - 0.9, fd);
}

/* ========================= INTERACTIVE TOYS ======================== */

// --- Exercise wheel (top-right corner) ---
const WHEEL_POS = new THREE.Vector3(2.1, 0, -2.1);
const wheel = new THREE.Group();
const rimMat = mat(0xff6f91, { roughness: 0.5 });
const rim = mesh(new THREE.TorusGeometry(0.72, 0.07, 6, 18), rimMat);
wheel.add(rim);
const spokeMat = mat(0xffffff, { roughness: 0.4 });
for (let i = 0; i < 6; i++) {
  const s = mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.36, 5), spokeMat);
  s.rotation.z = (i / 6) * Math.PI;
  wheel.add(s);
}
wheel.add(mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.14, 8), spokeMat).rotateX(Math.PI/2));
wheel.position.set(WHEEL_POS.x, 1.15, WHEEL_POS.z);
wheel.rotation.y = Math.PI * 0.75;
scene.add(wheel);
// stand
const standMat = mat(0x8a9bb0, { metalness: 0.6, roughness: 0.4 });
scene.add(mesh(new THREE.BoxGeometry(0.5, 0.1, 0.5), standMat, WHEEL_POS.x, 0.55, WHEEL_POS.z));
scene.add(mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6, 6), standMat, WHEEL_POS.x, 0.9, WHEEL_POS.z));
let wheelSpeed = 0;

// --- Food bowl (left side) ---
const BOWL_POS = new THREE.Vector3(-2.1, 0, 1.6);
const bowl = new THREE.Group();
bowl.add(mesh(new THREE.CylinderGeometry(0.42, 0.3, 0.22, 10), mat(0x6c8cff), 0, 0.11, 0));
bowl.add(mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.05, 10), mat(0xe8b04b), 0, 0.22, 0));
for (let i = 0; i < 7; i++) {
  const pellet = mesh(new THREE.SphereGeometry(0.055, 5, 4), mat(0xc9803a),
    rand(-0.18, 0.18), 0.27, rand(-0.18, 0.18));
  bowl.add(pellet);
}
bowl.position.set(BOWL_POS.x, 0.45, BOWL_POS.z);
scene.add(bowl);

// --- Tunnel (center) ---
const tunnel = new THREE.Group();
const tunnelMat = mat(0x7ed957, { roughness: 0.9, side: THREE.DoubleSide });
const tubeGeo = new THREE.CylinderGeometry(0.42, 0.42, 1.8, 10, 1, false, 0, Math.PI);
tunnel.add(mesh(tubeGeo, tunnelMat, 0, 0.42, 0).rotateZ(Math.PI / 2));
tunnel.children[0].castShadow = true;
// little flag on top for charm
tunnel.add(mesh(new THREE.ConeGeometry(0.14, 0.2, 4), mat(0xff5252), 0.4, 1.05, 0));
tunnel.add(mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.35, 4), mat(0xffffff), 0.4, 0.9, 0));
tunnel.position.set(0.3, 0.45, 0.6);
tunnel.rotation.y = -0.5;
scene.add(tunnel);

// --- Scattered seed snacks ---
for (let i = 0; i < 10; i++) {
  scene.add(mesh(new THREE.SphereGeometry(0.05, 5, 4), mat(0xd9a441),
    rand(-2.4, 2.4), 0.52, rand(-2.4, 2.4)));
}

/* ============================ HAMSTERS ============================= */

const PALETTES = [
  { body: 0xf5c06e, belly: 0xfff3dc, cheek: 0xff9e9e }, // golden
  { body: 0xfdf6ec, belly: 0xffffff, cheek: 0xffb3b3 }, // cream
  { body: 0xd9a066, belly: 0xfbe8cf, cheek: 0xff8f8f }, // cinnamon
  { body: 0x9fd8ef, belly: 0xeafaff, cheek: 0xffa0a0 }, // blueberry (why not!)
];

function makeHamster() {
  const p = PALETTES[Math.floor(Math.random() * PALETTES.length)];
  const g = new THREE.Group();

  const body = mesh(new THREE.SphereGeometry(0.42, 8, 6), mat(p.body));
  body.scale.set(1.15, 0.95, 1.25);
  body.position.y = 0.42;
  g.add(body);

  const belly = mesh(new THREE.SphereGeometry(0.3, 7, 5), mat(p.belly));
  belly.scale.set(1.0, 0.8, 1.1);
  belly.position.set(0, 0.36, 0.12);
  g.add(belly);

  // Ears
  for (const s of [-1, 1]) {
    const ear = mesh(new THREE.ConeGeometry(0.11, 0.16, 5), mat(p.body),
      0.18 * s, 0.82, -0.08);
    ear.rotation.z = -0.3 * s;
    g.add(ear);
    const inner = mesh(new THREE.ConeGeometry(0.05, 0.09, 5), mat(p.cheek),
      0.18 * s, 0.8, -0.02);
    inner.rotation.z = -0.3 * s;
    g.add(inner);
  }

  // Eyes
  for (const s of [-1, 1]) {
    g.add(mesh(new THREE.SphereGeometry(0.055, 6, 5), mat(0x222222),
      0.16 * s, 0.55, 0.36));
    g.add(mesh(new THREE.SphereGeometry(0.02, 4, 3), mat(0xffffff),
      0.15 * s, 0.58, 0.4));
  }

  // Nose + snout bump
  g.add(mesh(new THREE.SphereGeometry(0.05, 5, 4), mat(0xff7fa5), 0, 0.46, 0.5));

  // Cheeks
  for (const s of [-1, 1]) {
    const cheek = mesh(new THREE.SphereGeometry(0.1, 6, 5), mat(p.cheek),
      0.3 * s, 0.42, 0.28);
    cheek.scale.set(1, 0.8, 0.6);
    g.add(cheek);
  }

  // Whiskers
  const whiskMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });
  for (const s of [-1, 1]) {
    for (let i = 0; i < 2; i++) {
      const pts = [
        new THREE.Vector3(0.12 * s, 0.46 + i * 0.03, 0.48),
        new THREE.Vector3(0.4 * s, 0.44 + i * 0.05, 0.55)
      ];
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), whiskMat));
    }
  }

  // Feet
  for (const [fx, fz] of [[-0.18, 0.28], [0.18, 0.28], [-0.18, -0.25], [0.18, -0.25]]) {
    const foot = mesh(new THREE.SphereGeometry(0.07, 5, 4), mat(p.cheek), fx, 0.1, fz);
    foot.scale.set(1, 0.5, 1.4);
    g.add(foot);
  }

  // Tiny tail
  g.add(mesh(new THREE.SphereGeometry(0.06, 5, 4), mat(p.body), 0, 0.35, -0.52));

  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(g);
  return g;
}

/* ======================= BEHAVIOR STATE MACHINE ==================== */

const hamsters = [];

class Hamster {
  constructor() {
    this.group = makeHamster();
    this.group.position.set(rand(-2.3, 2.3), 0.45, rand(-2.3, 2.3));
    this.heading = rand(0, Math.PI * 2);
    this.speed = rand(0.8, 1.2);
    this.state = 'wander';
    this.timer = rand(0.5, 2);
    this.target = this.randomPoint();
    this.walkPhase = rand(0, 10);
    this.baseY = 0.45;
  }

  randomPoint() {
    return new THREE.Vector3(rand(-BOUND, BOUND), 0.45, rand(-BOUND, BOUND));
  }

  update(dt) {
    const pos = this.group.position;

    switch (this.state) {

      case 'wander': {
        this.moveTo(this.target, dt);
        if (pos.distanceTo(this.target) < 0.25) {
          // Decide next action: rest, keep wandering, or interact
          const r = Math.random();
          if (r < 0.35) { this.state = 'pause'; this.timer = rand(1, 3); }
          else if (r < 0.5) { this.state = 'toWheel'; this.timer = 0; }
          else if (r < 0.65) { this.state = 'toBowl'; this.timer = 0; }
          else { this.state = 'wander'; this.target = this.randomPoint(); }
        }
        break;
      }

      case 'pause':
        // Idle wiggle — sniffing the air
        this.group.rotation.y += Math.sin(performance.now() * 0.003 + this.walkPhase) * dt * 0.8;
        this.timer -= dt;
        if (this.timer <= 0) { this.state = 'wander'; this.target = this.randomPoint(); }
        break;

      case 'toWheel': {
        const spot = new THREE.Vector3(WHEEL_POS.x - 0.35, 0.45, WHEEL_POS.z + 0.35);
        this.moveTo(spot, dt);
        if (pos.distanceTo(spot) < 0.3) {
          this.state = 'atWheel'; this.timer = rand(3, 5);
          this.faceToward(WHEEL_POS);
        }
        break;
      }

      case 'atWheel':
        wheelSpeed = THREE.MathUtils.lerp(wheelSpeed, 6, dt * 2); // hamster powers the wheel!
        this.walkPhase += dt * 14;
        this.group.position.y = this.baseY + Math.abs(Math.sin(this.walkPhase)) * 0.07; // running in place
        this.timer -= dt;
        if (this.timer <= 0) { this.state = 'wander'; this.target = this.randomPoint(); }
        break;

      case 'toBowl': {
        const spot = new THREE.Vector3(BOWL_POS.x + 0.15, 0.45, BOWL_POS.z - 0.55);
        this.moveTo(spot, dt);
        if (pos.distanceTo(spot) < 0.3) {
          this.state = 'eating'; this.timer = rand(2, 4);
          this.faceToward(BOWL_POS);
        }
        break;
      }

      case 'eating':
        this.walkPhase += dt * 10;
        this.group.position.y = this.baseY + Math.sin(this.walkPhase * 2) * 0.04; // munch-munch
        this.group.rotation.x = Math.sin(this.walkPhase * 2) * 0.06;
        this.timer -= dt;
        if (this.timer <= 0) {
          this.group.rotation.x = 0;
          this.state = 'wander'; this.target = this.randomPoint();
        }
        break;
    }

    // Walk bob (applies to walking states)
    if (['wander', 'toWheel', 'toBowl'].includes(this.state)) {
      this.walkPhase += dt * 10;
      this.group.position.y = this.baseY + Math.abs(Math.sin(this.walkPhase)) * 0.05;
    }
  }

  moveTo(target, dt) {
    const pos = this.group.position;
    const dir = target.clone().sub(pos);
    dir.y = 0;
    if (dir.lengthSq() < 0.0001) return;
    dir.normalize();
    const desired = Math.atan2(dir.x, dir.z);
    this.faceTowardAngle(desired, dt);
    pos.addScaledVector(dir, this.speed * dt);
    // Keep inside the cage
    pos.x = THREE.MathUtils.clamp(pos.x, -BOUND, BOUND);
    pos.z = THREE.MathUtils.clamp(pos.z, -BOUND, BOUND);
  }

  faceToward(point) {
    this.faceTowardAngle(Math.atan2(point.x - this.group.position.x,
                                    point.z - this.group.position.z), 0.016);
  }

  faceTowardAngle(angle, dt) {
    let diff = angle - this.heading;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    this.heading += diff * Math.min(1, dt * 8);
    this.group.rotation.y = this.heading;
  }
}

for (let i = 0; i < 4; i++) hamsters.push(new Hamster());

/* ============================ MAIN LOOP ============================ */

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  for (const h of hamsters) h.update(dt);

  // Wheel coasts to a stop when no hamster is on it
  const anyoneOnWheel = hamsters.some(h => h.state === 'atWheel');
  if (!anyoneOnWheel) wheelSpeed *= Math.pow(0.2, dt);
  wheel.rotation.z += wheelSpeed * dt;

  // Flag wave
  tunnel.children[1].rotation.y = performance.now() * 0.002;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
