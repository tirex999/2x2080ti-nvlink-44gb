<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Аквариум с Реалистичными Рыбками</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #0a1628 0%, #1a3a5c 100%);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        .panel {
            position: fixed;
            background: rgba(10, 30, 60, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.3);
            border-radius: 12px;
            padding: 16px;
            color: #e0f0ff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .info-panel {
            top: 20px;
            left: 20px;
            width: 280px;
        }

        .stats-panel {
            top: 20px;
            right: 20px;
            width: 200px;
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #4fc3f7, #81d4fa, #b3e5fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .panel p {
            font-size: 12px;
            line-height: 1.6;
            color: #a0c4e8;
            margin-bottom: 8px;
        }

        .btn {
            display: inline-block;
            padding: 8px 14px;
            margin: 4px 4px 4px 0;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .btn-fish {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
        }

        .btn-fish:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.6);
        }

        .btn-bubble {
            background: linear-gradient(135deg, #4fc3f7, #29b6f6);
            box-shadow: 0 4px 15px rgba(79, 195, 247, 0.4);
        }

        .btn-bubble:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 195, 247, 0.6);
        }

        .btn-light {
            background: linear-gradient(135deg, #ffd54f, #ffb300);
            box-shadow: 0 4px 15px rgba(255, 213, 79, 0.4);
        }

        .btn-light:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 213, 79, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(100, 180, 255, 0.15);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-size: 12px;
            color: #80b0d0;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 700;
            color: #4fc3f7;
        }

        .instructions {
            font-size: 11px;
            color: #7ab0d4;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(100, 180, 255, 0.2);
        }

        .instructions span {
            color: #4fc3f7;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .info-panel {
                width: 220px;
                padding: 12px;
            }
            .stats-panel {
                width: 160px;
                padding: 12px;
            }
            .panel h2 {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="panel info-panel">
        <h2>🐠 3D Аквариум</h2>
        <p>Интерактивный подводный мир с реалистичными рыбками</p>
        <button class="btn btn-fish" id="btnAddFish">🐟 Добавить рыбку</button>
        <button class="btn btn-bubble" id="btnAddBubble">💨 Больше пузырей</button>
        <button class="btn btn-light" id="btnLight">💡 Свет</button>
        <div class="instructions">
            <span>ЛКМ + движение</span> — вращение<br>
            <span>ПКМ + движение</span> — панорама<br>
            <span>Колесо мыши</span> — зум<br>
            <span>Клик по аквариуму</span> — кормление
        </div>
    </div>

    <div class="panel stats-panel">
        <h2>📊 Статистика</h2>
        <div class="stat-row">
            <span class="stat-label">Рыбки</span>
            <span class="stat-value" id="fishCount">15</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Пузыри</span>
            <span class="stat-value" id="bubbleCount">30</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Корм</span>
            <span class="stat-value" id="foodCount">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">FPS</span>
            <span class="stat-value" id="fpsCounter">60</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // ==================== SCENE SETUP ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1628);
        scene.fog = new THREE.FogExp2(0x0a2a4a, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(25, 18, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // ==================== CONTROLS ====================
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 10;
        controls.maxDistance = 60;
        controls.maxPolarAngle = Math.PI / 1.8;
        controls.target.set(0, 5, 0);

        // ==================== LIGHTING ====================
        const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xfff4e0, 1.0);
        directionalLight.position.set(15, 30, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 80;
        directionalLight.shadow.camera.left = -25;
        directionalLight.shadow.camera.right = 25;
        directionalLight.shadow.camera.top = 25;
        directionalLight.shadow.camera.bottom = -25;
        directionalLight.shadow.bias = -0.001;
        scene.add(directionalLight);

        const pointLight1 = new THREE.PointLight(0x4488ff, 0.6, 40);
        pointLight1.position.set(-10, 15, -5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x2266cc, 0.4, 35);
        pointLight2.position.set(10, 12, 8);
        scene.add(pointLight2);

        // ==================== AQUARIUM ====================
        const AQUARIUM = { width: 36, height: 24, depth: 20 };

        // Glass container
        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x88ccff,
            transparent: true,
            opacity: 0.15,
            transmission: 0.95,
            roughness: 0.05,
            metalness: 0,
            side: THREE.DoubleSide
        });

        const glassGeometry = new THREE.BoxGeometry(AQUARIUM.width, AQUARIUM.height, AQUARIUM.depth);
        const glassMesh = new THREE.Mesh(glassGeometry, glassMaterial);
        glassMesh.position.y = AQUARIUM.height / 2;
        scene.add(glassMesh);

        // Wireframe edges
        const edgesGeometry = new THREE.EdgesGeometry(glassGeometry);
        const edgesMaterial = new THREE.LineBasicMaterial({ color: 0x4488cc, transparent: true, opacity: 0.6 });
        const edgesMesh = new THREE.LineSegments(edgesGeometry, edgesMaterial);
        edgesMesh.position.y = AQUARIUM.height / 2;
        scene.add(edgesMesh);

        // Sandy bottom
        const sandGeometry = new THREE.PlaneGeometry(AQUARIUM.width, AQUARIUM.depth, 40, 40);
        const sandPositions = sandGeometry.attributes.position;
        for (let i = 0; i < sandPositions.count; i++) {
            sandPositions.setZ(i, Math.random() * 0.3 - 0.15);
        }
        sandGeometry.computeVertexNormals();

        const sandMaterial = new THREE.MeshStandardMaterial({
            color: 0xc4a46c,
            roughness: 0.9,
            metalness: 0.0
        });
        const sandMesh = new THREE.Mesh(sandGeometry, sandMaterial);
        sandMesh.rotation.x = -Math.PI / 2;
        sandMesh.position.y = 0.1;
        sandMesh.receiveShadow = true;
        scene.add(sandMesh);

        // ==================== ROCKS ====================
        const rocks = [];
        for (let i = 0; i < 8; i++) {
            const rockGeometry = new THREE.DodecahedronGeometry(1 + Math.random() * 1.5, 1);
            const rockPositions = rockGeometry.attributes.position;
            for (let j = 0; j < rockPositions.count; j++) {
                rockPositions.setX(j, rockPositions.getX(j) + (Math.random() - 0.5) * 0.4);
                rockPositions.setY(j, rockPositions.getY(j) + (Math.random() - 0.5) * 0.4);
                rockPositions.setZ(j, rockPositions.getZ(j) + (Math.random() - 0.5) * 0.4);
            }
            rockGeometry.computeVertexNormals();

            const rockMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 0.3, 0.3 + Math.random() * 0.2),
                roughness: 0.85,
                metalness: 0.1
            });
            const rock = new THREE.Mesh(rockGeometry, rockMaterial);
            rock.position.set(
                (Math.random() - 0.5) * (AQUARIUM.width - 6),
                0.5 + Math.random() * 1,
                (Math.random() - 0.5) * (AQUARIUM.depth - 6)
            );
            rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            rock.castShadow = true;
            rock.receiveShadow = true;
            scene.add(rock);
            rocks.push(rock);
        }

        // ==================== SEAWEED ====================
        const seaweeds = [];
        for (let i = 0; i < 12; i++) {
            const height = 3 + Math.random() * 5;
            const points = [];
            const baseX = (Math.random() - 0.5) * (AQUARIUM.width - 4);
            const baseZ = (Math.random() - 0.5) * (AQUARIUM.depth - 4);

            for (let j = 0; j < 8; j++) {
                const t = j / 7;
                points.push(new THREE.Vector3(
                    baseX + Math.sin(t * 2 + i) * 0.5,
                    t * height,
                    baseZ + Math.cos(t * 1.5 + i) * 0.5
                ));
            }

            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeometry = new THREE.TubeGeometry(curve, 12, 0.15 + Math.random() * 0.1, 6, false);
            const tubeMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(0.3 + Math.random() * 0.15, 0.7, 0.3 + Math.random() * 0.2),
                roughness: 0.7,
                metalness: 0.0,
                side: THREE.DoubleSide
            });
            const seaweed = new THREE.Mesh(tubeGeometry, tubeMaterial);
            seaweed.castShadow = true;
            seaweed.userData = { baseX, baseZ, height, phase: Math.random() * Math.PI * 2 };
            scene.add(seaweed);
            seaweeds.push(seaweed);
        }

        // ==================== FISH CREATION ====================
        const fishArray = [];
        const fishColors = [
            { body: 0xff6b35, fin: 0xff8c42, eye: 0xffffff },
            { body: 0x2196f3, fin: 0x64b5f6, eye: 0xffffff },
            { body: 0xffeb3b, fin: 0xff5722, eye: 0xffffff },
            { body: 0x9c27b0, fin: 0xce93d8, eye: 0xffffff },
            { body: 0xf44336, fin: 0xef9a9a, eye: 0xffffff },
            { body: 0x4caf50, fin: 0xa5d6a7, eye: 0xffffff },
            { body: 0xe91e63, fin: 0xf48fb1, eye: 0xffffff },
            { body: 0xffc107, fin: 0xffd54f, eye: 0xffffff }
        ];

        function createFish() {
            const fishGroup = new THREE.Group();
            const colorScheme = fishColors[Math.floor(Math.random() * fishColors.length)];
            const scale = 0.6 + Math.random() * 0.6;

            // Body - elongated sphere
            const bodyGeometry = new THREE.SphereGeometry(1, 16, 12);
            bodyGeometry.scale(1.4, 0.7, 0.5);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: colorScheme.body,
                roughness: 0.4,
                metalness: 0.2
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            fishGroup.add(body);

            // Tail
            const tailGeometry = new THREE.ConeGeometry(0.5, 1.2, 8);
            tailGeometry.rotateZ(Math.PI / 2);
            const tailMaterial = new THREE.MeshStandardMaterial({
                color: colorScheme.fin,
                roughness: 0.5,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            const tail = new THREE.Mesh(tailGeometry, tailMaterial);
            tail.position.x = -1.5;
            tail.castShadow = true;
            fishGroup.add(tail);

            // Top fin
            const topFinGeometry = new THREE.ConeGeometry(0.3, 0.8, 6);
            const topFinMaterial = new THREE.MeshStandardMaterial({
                color: colorScheme.fin,
                roughness: 0.5,
                side: THREE.DoubleSide
            });
            const topFin = new THREE.Mesh(topFinGeometry, topFinMaterial);
            topFin.position.set(0, 0.6, 0);
            topFin.rotation.z = -0.2;
            fishGroup.add(topFin);

            // Left fin
            const leftFinGeometry = new THREE.ConeGeometry(0.25, 0.6, 6);
            leftFinGeometry.rotateZ(-Math.PI / 2);
            const leftFinMaterial = new THREE.MeshStandardMaterial({
                color: colorScheme.fin,
                roughness: 0.5,
                side: THREE.DoubleSide
            });
            const leftFin = new THREE.Mesh(leftFinGeometry, leftFinMaterial);
            leftFin.position.set(0.2, -0.1, 0.5);
            fishGroup.add(leftFin);

            // Right fin
            const rightFinGeometry = new THREE.ConeGeometry(0.25, 0.6, 6);
            rightFinGeometry.rotateZ(Math.PI / 2);
            const rightFinMaterial = new THREE.MeshStandardMaterial({
                color: colorScheme.fin,
                roughness: 0.5,
                side: THREE.DoubleSide
            });
            const rightFin = new THREE.Mesh(rightFinGeometry, rightFinMaterial);
            rightFin.position.set(0.2, -0.1, -0.5);
            fishGroup.add(rightFin);

            // Eyes
            const eyeGeometry = new THREE.SphereGeometry(0.15, 8, 8);
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: colorScheme.eye, roughness: 0.2 });
            const pupilGeometry = new THREE.SphereGeometry(0.08, 8, 8);
            const pupilMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });

            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(1.1, 0.15, 0.25);
            fishGroup.add(leftEye);
            const leftPupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
            leftPupil.position.set(1.2, 0.15, 0.25);
            fishGroup.add(leftPupil);

            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(1.1, 0.15, -0.25);
            fishGroup.add(rightEye);
            const rightPupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
            rightPupil.position.set(1.2, 0.15, -0.25);
            fishGroup.add(rightPupil);

            // Mouth
            const mouthGeometry = new THREE.SphereGeometry(0.12, 8, 6);
            const mouthMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6 });
            const mouth = new THREE.Mesh(mouthGeometry, mouthMaterial);
            mouth.position.set(1.35, -0.05, 0);
            fishGroup.add(mouth);

            fishGroup.scale.set(scale, scale, scale);
            fishGroup.position.set(
                (Math.random() - 0.5) * (AQUARIUM.width - 6),
                3 + Math.random() * (AQUARIUM.height - 8),
                (Math.random() - 0.5) * (AQUARIUM.depth - 6)
            );

            scene.add(fishGroup);

            const fishData = {
                mesh: fishGroup,
                tail: tail,
                leftFin: leftFin,
                rightFin: rightFin,
                topFin: topFin,
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 2
                ),
                speed: 1.5 + Math.random() * 2,
                tailSpeed: 3 + Math.random() * 4,
                phase: Math.random() * Math.PI * 2,
                targetFood: null,
                avoidanceRadius: 3 + Math.random() * 2,
                scale: scale,
                wanderTimer: Math.random() * 3,
                wanderInterval: 2 + Math.random() * 4
            };

            fishArray.push(fishData);
            return fishData;
        }

        // Create initial fish
        for (let i = 0; i < 15; i++) {
            createFish();
        }

        // ==================== BUBBLES ====================
        const bubbles = [];
        const bubbleMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.3,
            transmission: 0.9,
            roughness: 0.1,
            metalness: 0,
            clearcoat: 1.0
        });

        function createBubble() {
            const size = 0.15 + Math.random() * 0.35;
            const geometry = new THREE.SphereGeometry(size, 12, 12);
            const bubble = new THREE.Mesh(geometry, bubbleMaterial);
            bubble.position.set(
                (Math.random() - 0.5) * (AQUARIUM.width - 4),
                Math.random() * AQUARIUM.height,
                (Math.random() - 0.5) * (AQUARIUM.depth - 4)
            );
            bubble.userData = {
                speed: 0.5 + Math.random() * 1.5,
                wobblePhase: Math.random() * Math.PI * 2,
                wobbleSpeed: 1 + Math.random() * 2,
                wobbleAmp: 0.3 + Math.random() * 0.5
            };
            scene.add(bubble);
            bubbles.push(bubble);
        }

        for (let i = 0; i < 30; i++) {
            createBubble();
        }

        // ==================== FOOD SYSTEM ====================
        const foods = [];
        const foodMaterial = new THREE.MeshStandardMaterial({
            color: 0x8B4513,
            roughness: 0.8,
            metalness: 0.0
        });

        function createFood(point) {
            const foodGroup = new THREE.Group();
            const numParticles = 3 + Math.floor(Math.random() * 4);

            for (let i = 0; i < numParticles; i++) {
                const size = 0.15 + Math.random() * 0.2;
                const geometry = new THREE.SphereGeometry(size, 8, 8);
                const particle = new THREE.Mesh(geometry, foodMaterial);
                particle.position.set(
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5
                );
                particle.castShadow = true;
                foodGroup.add(particle);
            }

            foodGroup.position.copy(point);
            foodGroup.userData = {
                velocity: new THREE.Vector3(0, 0, 0),
                gravity: -2.5,
                eaten: false
            };
            scene.add(foodGroup);
            foods.push(foodGroup);
        }

        // ==================== RAYCASTER FOR CLICKING ====================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isMouseDown = false;
        let mouseDownTime = 0;

        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isMouseDown = true;
                mouseDownTime = Date.now();
            }
        });

        renderer.domElement.addEventListener('mouseup', (e) => {
            if (e.button === 0 && isMouseDown) {
                const elapsed = Date.now() - mouseDownTime;
                if (elapsed < 200) {
                    // Short click - create food
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);

                    const intersects = raycaster.intersectObject(glassMesh);
                    if (intersects.length > 0) {
                        const point = intersects[0].point.clone();
                        point.y = Math.min(point.y, AQUARIUM.height - 1);
                        point.y = Math.max(point.y, 2);
                        createFood(point);
                    }
                }
                isMouseDown = false;
            }
        });

        // ==================== UI BUTTONS ====================
        document.getElementById('btnAddFish').addEventListener('click', () => {
            createFish();
            updateStats();
        });

        document.getElementById('btnAddBubble').addEventListener('click', () => {
            for (let i = 0; i < 10; i++) {
                createBubble();
            }
            updateStats();
        });

        let lightOn = true;
        document.getElementById('btnLight').addEventListener('click', () => {
            lightOn = !lightOn;
            directionalLight.intensity = lightOn ? 1.0 : 0.1;
            ambientLight.intensity = lightOn ? 0.4 : 0.15;
            document.getElementById('btnLight').textContent = lightOn ? '💡 Свет' : '🌙 Темнота';
        });

        // ==================== ANIMATION LOOP ====================
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsTime = 0;
        let currentFPS = 60;

        function updateStats() {
            document.getElementById('fishCount').textContent = fishArray.length;
            document.getElementById('bubbleCount').textContent = bubbles.length;
            document.getElementById('foodCount').textContent = foods.length;
        }

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            // FPS counter
            frameCount++;
            fpsTime += delta;
            if (fpsTime >= 1) {
                currentFPS = Math.round(frameCount / fpsTime);
                document.getElementById('fpsCounter').textContent = currentFPS;
                frameCount = 0;
                fpsTime = 0;
            }

            const time = now * 0.001;

            // ==================== FISH BEHAVIOR ====================
            for (let i = 0; i < fishArray.length; i++) {
                const fish = fishArray[i];
                const pos = fish.mesh.position;

                // Wandering behavior
                fish.wanderTimer += delta;
                if (fish.wanderTimer > fish.wanderInterval) {
                    fish.wanderTimer = 0;
                    fish.wanderInterval = 2 + Math.random() * 4;
                    fish.velocity.x += (Math.random() - 0.5) * 2;
                    fish.velocity.y += (Math.random() - 0.5) * 0.8;
                    fish.velocity.z += (Math.random() - 0.5) * 2;
                }

                // Food seeking
                fish.targetFood = null;
                let closestFoodDist = 15;
                for (let f = 0; f < foods.length; f++) {
                    if (foods[f].userData.eaten) continue;
                    const dist = pos.distanceTo(foods[f].position);
                    if (dist < closestFoodDist) {
                        closestFoodDist = dist;
                        fish.targetFood = foods[f];
                    }
                }

                if (fish.targetFood) {
                    const dir = new THREE.Vector3().subVectors(fish.targetFood.position, pos).normalize();
                    fish.velocity.lerp(dir.multiplyScalar(fish.speed * 2), 0.05);

                    // Eat food
                    if (closestFoodDist < 1.5) {
                        fish.targetFood.userData.eaten = true;
                        scene.remove(fish.targetFood);
                        const idx = foods.indexOf(fish.targetFood);
                        if (idx > -1) foods.splice(idx, 1);
                        fish.scale *= 1.05;
                        fish.mesh.scale.set(fish.scale, fish.scale, fish.scale);
                        fish.targetFood = null;
                        updateStats();
                    }
                }

                // Collision avoidance
                for (let j = 0; j < fishArray.length; j++) {
                    if (i === j) continue;
                    const other = fishArray[j];
                    const dist = pos.distanceTo(other.mesh.position);
                    if (dist < fish.avoidanceRadius && dist > 0.1) {
                        const repel = new THREE.Vector3().subVectors(pos, other.mesh.position).normalize();
                        repel.multiplyScalar((fish.avoidanceRadius - dist) * 0.5);
                        fish.velocity.add(repel);
                    }
                }

                // Wall reflection
                const halfW = AQUARIUM.width / 2 - 2;
                const halfD = AQUARIUM.depth / 2 - 2;
                const minY = 2;
                const maxY = AQUARIUM.height - 2;

                if (pos.x > halfW) { fish.velocity.x -= 2 * delta; pos.x = halfW; }
                if (pos.x < -halfW) { fish.velocity.x += 2 * delta; pos.x = -halfW; }
                if (pos.z > halfD) { fish.velocity.z -= 2 * delta; pos.z = halfD; }
                if (pos.z < -halfD) { fish.velocity.z += 2 * delta; pos.z = -halfD; }
                if (pos.y > maxY) { fish.velocity.y -= 2 * delta; pos.y = maxY; }
                if (pos.y < minY) { fish.velocity.y += 2 * delta; pos.y = minY; }

                // Speed limiting
                const speed = fish.velocity.length();
                if (speed > fish.speed * 2) {
                    fish.velocity.normalize().multiplyScalar(fish.speed * 2);
                }

                // Apply velocity
                pos.add(fish.velocity.clone().multiplyScalar(delta));

                // Damping
                fish.velocity.multiplyScalar(0.995);

                // Rotation - face direction of movement
                if (fish.velocity.length() > 0.1) {
                    const targetAngle = Math.atan2(fish.velocity.z, fish.velocity.x);
                    const currentAngle = fish.mesh.rotation.y;
                    let angleDiff = targetAngle - currentAngle;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    fish.mesh.rotation.y += angleDiff * 3 * delta;

                    // Slight tilt based on vertical velocity
                    const targetTilt = Math.atan2(fish.velocity.y, Math.sqrt(fish.velocity.x * fish.velocity.x + fish.velocity.z * fish.velocity.z));
                    fish.mesh.rotation.z += (targetTilt - fish.mesh.rotation.z) * 2 * delta;
                }

                // Tail animation
                fish.phase += delta * fish.tailSpeed;
                fish.tail.rotation.y = Math.sin(fish.phase) * 0.6;

                // Fin animation
                fish.leftFin.rotation.x = Math.sin(fish.phase * 0.7) * 0.3;
                fish.rightFin.rotation.x = Math.sin(fish.phase * 0.7 + Math.PI) * 0.3;
                fish.topFin.rotation.x = Math.sin(fish.phase * 0.5) * 0.15;

                // Slight body undulation
                fish.mesh.rotation.x = Math.sin(fish.phase * 0.3) * 0.05;
            }

            // ==================== BUBBLE ANIMATION ====================
            for (let i = 0; i < bubbles.length; i++) {
                const bubble = bubbles[i];
                const data = bubble.userData;

                bubble.position.y += data.speed * delta;
                bubble.position.x += Math.sin(time * data.wobbleSpeed + data.wobblePhase) * data.wobbleAmp * delta;
                bubble.position.z += Math.cos(time * data.wobbleSpeed * 0.7 + data.wobblePhase) * data.wobbleAmp * delta;

                // Reset if reaches top
                if (bubble.position.y > AQUARIUM.height - 1) {
                    bubble.position.y = 1;
                    bubble.position.x = (Math.random() - 0.5) * (AQUARIUM.width - 4);
                    bubble.position.z = (Math.random() - 0.5) * (AQUARIUM.depth - 4);
                }
            }

            // ==================== FOOD PHYSICS ====================
            for (let i = foods.length - 1; i >= 0; i--) {
                const food = foods[i];
                if (food.userData.eaten) continue;

                food.userData.velocity.y += food.userData.gravity * delta;
                food.position.add(food.userData.velocity.clone().multiplyScalar(delta));

                // Slight horizontal drift
                food.position.x += Math.sin(time * 2 + i) * 0.01;
                food.position.z += Math.cos(time * 1.5 + i) * 0.01;

                // Remove if hits bottom
                if (food.position.y < 0.5) {
                    scene.remove(food);
                    foods.splice(i, 1);
                    updateStats();
                }
            }

            // ==================== SEAWEED ANIMATION ====================
            for (let i = 0; i < seaweeds.length; i++) {
                const sw = seaweeds[i];
                const data = sw.userData;
                sw.rotation.x = Math.sin(time * 0.8 + data.phase) * 0.08;
                sw.rotation.z = Math.cos(time * 0.6 + data.phase) * 0.06;
            }

            // ==================== RENDER ====================
            controls.update();
            renderer.render(scene, camera);
        }

        // ==================== RESIZE HANDLER ====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==================== START ====================
        updateStats();
        animate();
    </script>
</body>
</html>
