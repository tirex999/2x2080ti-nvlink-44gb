<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐠 3D Аквариум</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  #canvas-container { position: fixed; inset: 0; }

  .glass-panel {
    position: fixed;
    background: rgba(10, 30, 60, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(120, 200, 255, 0.3);
    border-radius: 14px;
    padding: 16px 20px;
    color: #d8f0ff;
    box-shadow: 0 8px 32px rgba(0, 40, 90, 0.5);
    z-index: 10;
  }

  #info-panel { top: 20px; left: 20px; max-width: 280px; }
  #info-panel h1 {
    font-size: 22px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #6fd3ff, #b388ff, #ff8a65);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #info-panel p { font-size: 12.5px; line-height: 1.6; opacity: 0.85; margin-bottom: 12px; }

  .btn {
    display: inline-block;
    margin: 4px 4px 4px 0;
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #1e88e5, #0d47a1);
    box-shadow: 0 3px 10px rgba(30, 136, 229, 0.4);
    transition: all .25s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(30, 136, 229, 0.65);
    filter: brightness(1.15);
  }
  .btn:active { transform: translateY(0); }
  .btn.green { background: linear-gradient(135deg, #43a047, #1b5e20); box-shadow: 0 3px 10px rgba(67,160,71,.4); }
  .btn.green:hover { box-shadow: 0 6px 18px rgba(67,160,71,.65); }
  .btn.amber { background: linear-gradient(135deg, #fb8c00, #e65100); box-shadow: 0 3px 10px rgba(251,140,0,.4); }
  .btn.amber:hover { box-shadow: 0 6px 18px rgba(251,140,0,.65); }

  #stats-panel { top: 20px; right: 20px; text-align: right; font-size: 13px; }
  #stats-panel .stat { margin: 4px 0; }
  #stats-panel .num { color: #6fd3ff; font-weight: 700; font-size: 16px; }

  #hint {
    position: fixed; bottom: 16px; left: 50%;
    transform: translateX(-50%);
    font-size: 12px; color: rgba(200, 235, 255, 0.6);
    background: rgba(10, 30, 60, 0.45);
    backdrop-filter: blur(8px);
    padding: 8px 18px; border-radius: 20px;
    z-index: 10; pointer-events: none;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div class="glass-panel" id="info-panel">
  <h1>🐠 3D Аквариум</h1>
  <p>
    🖱️ ЛКМ + движение — вращение камеры<br>
    🖱️ ПКМ + движение — панорамирование<br>
    🖱️ Колесо — зум<br>
    🍽️ Клик по аквариуму — бросить корм
  </p>
  <button class="btn green" id="btnAddFish">➕ Добавить рыбку</button>
  <button class="btn" id="btnBubbles">🫧 Больше пузырей</button>
  <button class="btn amber" id="btnLight">💡 Свет</button>
</div>

<div class="glass-panel" id="stats-panel">
  <div class="stat">Рыбки: <span class="num" id="fishCount">15</span></div>
  <div class="stat">Корм: <span class="num" id="foodCount">0</span></div>
  <div class="stat">FPS: <span class="num" id="fps">--</span></div>
</div>

<div id="hint">Кликните в аквариум, чтобы покормить рыбок 🍤</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============================================================
   БАЗОВАЯ СЦЕНА
============================================================ */
const TANK = { x: 36, y: 24, z: 20 }; // размеры аквариума
const HALF = { x: TANK.x/2, y: TANK.y/2, z: TANK.z/2 };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x062144);
scene.fog = new THREE.FogExp2(0x0a3a6b, 0.012);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
camera.position.set(28, 18, 34);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 1.8;
controls.target.set(0, 0, 0);

/* ============================================================
   ОСВЕЩЕНИЕ
============================================================ */
const ambient = new THREE.AmbientLight(0x404040, 0.4);
scene.add(ambient);

const sunLight = new THREE.DirectionalLight(0xfff4d6, 1.0);
sunLight.position.set(20, 40, 15);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -30;
sunLight.shadow.camera.right = 30;
sunLight.shadow.camera.top = 30;
sunLight.shadow.camera.bottom = -30;
sunLight.shadow.camera.far = 100;
scene.add(sunLight);

const blueLight1 = new THREE.PointLight(0x3fa9f5, 0.8, 40);
blueLight1.position.set(-12, 8, -6);
scene.add(blueLight1);

const blueLight2 = new THREE.PointLight(0x1565c0, 0.7, 40);
blueLight2.position.set(12, -6, 6);
scene.add(blueLight2);

let lightOn = true;

/* ============================================================
   АКВАРИУМ: СТЕКЛО
============================================================ */
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xaad4ee,
  transparent: true,
  opacity: 0.12,
  transmission: 0.95,
  roughness: 0.05,
  metalness: 0,
  side: THREE.DoubleSide,
  depthWrite: false
});

const glassBox = new THREE.Mesh(new THREE.BoxGeometry(TANK.x, TANK.y, TANK.z), glassMat);
scene.add(glassBox);

// рамка (wireframe edges)
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(TANK.x, TANK.y, TANK.z)),
  new THREE.LineBasicMaterial({ color: 0x8ecdf0, transparent: true, opacity: 0.7 })
);
scene.add(edges);

/* ============================================================
   ПЕСЧАНОЕ ДНО (с procedural неровностями)
============================================================ */
const sandGeo = new THREE.PlaneGeometry(TANK.x, TANK.z, 40, 24);
const posAttr = sandGeo.attributes.position;
for (let i = 0; i < posAttr.count; i++) {
  const x = posAttr.getX(i), y = posAttr.getY(i);
  const h = Math.sin(x * 0.7) * 0.25 + Math.cos(y * 0.9) * 0.2 + Math.sin(x*1.7 + y*1.3) * 0.12;
  posAttr.setZ(i, h);
}
sandGeo.computeVertexNormals();
const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({
  color: 0xd9b98a, roughness: 0.95
}));
sand.rotation.x = -Math.PI / 2;
sand.position.y = -HALF.y + 0.1;
sand.receiveShadow = true;
scene.add(sand);

/* ============================================================
   КАМНИ (деформированные додекаэдры)
============================================================ */
const rocks = [];
for (let i = 0; i < 8; i++) {
  const geo = new THREE.DodecahedronGeometry(0.8 + Math.random() * 1.4, 0);
  const p = geo.attributes.position;
  for (let j = 0; j < p.count; j++) {
    p.setXYZ(j,
      p.getX(j) * (0.75 + Math.random() * 0.5),
      p.getY(j) * (0.75 + Math.random() * 0.5),
      p.getZ(j) * (0.75 + Math.random() * 0.5));
  }
  geo.computeVertexNormals();
  const rock = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.07, 0.15, 0.28 + Math.random() * 0.2),
    roughness: 0.9
  }));
  rock.position.set(
    (Math.random() - 0.5) * (TANK.x - 5),
    -HALF.y + 0.6,
    (Math.random() - 0.5) * (TANK.z - 5)
  );
  rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
  rocks.push(rock);
}

/* ============================================================
   ВОДОРОСЛИ (TubeGeometry + CatmullRomCurve3)
============================================================ */
const plants = [];
for (let i = 0; i < 12; i++) {
  const baseX = (Math.random() - 0.5) * (TANK.x - 4);
  const baseZ = (Math.random() - 0.5) * (TANK.z - 4);
  const height = 3 + Math.random() * 5;
  const strands = 3 + Math.floor(Math.random() * 3);

  const group = new THREE.Group();
  const hue = 0.28 + Math.random() * 0.18;
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(hue, 0.65, 0.32 + Math.random() * 0.15),
    roughness: 0.8, side: THREE.DoubleSide
  });

  for (let s = 0; s < strands; s++) {
    const pts = [];
    const segs = 6;
    const offX = (Math.random() - 0.5) * 0.8, offZ = (Math.random() - 0.5) * 0.8;
    for (let k = 0; k <= segs; k++) {
      const t = k / segs;
      pts.push(new THREE.Vector3(
        offX + Math.sin(t * 3 + s) * 0.5 * t,
        t * height,
        offZ + Math.cos(t * 2.5 + s * 2) * 0.4 * t
      ));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.09 + Math.random()*0.07, 5, false), mat);
    tube.castShadow = true;
    group.add(tube);
  }

  group.position.set(baseX, -HALF.y + 0.2, baseZ);
  group.userData = {
    phase: Math.random() * Math.PI * 2,
    ampX: 0.04 + Math.random() * 0.06,
    ampZ: 0.04 + Math.random() * 0.06,
    speed: 0.6 + Math.random() * 0.8
  };
  scene.add(group);
  plants.push(group);
}

/* ============================================================
   РЫБКИ
============================================================ */
const COLOR_SCHEMES = [
  { body: 0xff7a1a, fin: 0xffb066 }, // оранжевая
  { body: 0x2266ff, fin: 0x7fb2ff }, // синяя
  { body: 0xffcc00, fin: 0xff4422 }, // желто-красная
  { body: 0x9944dd, fin: 0xc99af5 }, // фиолетовая
  { body: 0xe02222, fin: 0xff7766 }, // красная
  { body: 0x2fae4a, fin: 0x8de89b }, // зеленая
  { body: 0xff5fa2, fin: 0xffa8c8 }, // розовая
  { body: 0xd4a017, fin: 0xf5d76e }  // золотая
];

const fishArray = [];

function createFish() {
  const scheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];
  const scale = 0.6 + Math.random() * 0.6;

  const group = new THREE.Group();

  // Тело — вытянутая сфера
  const bodyGeo = new THREE.SphereGeometry(1, 18, 14);
  bodyGeo.scale(1.6, 0.85, 0.65);
  const bodyMat = new THREE.MeshStandardMaterial({ color: scheme.body, roughness: 0.45, metalness: 0.15 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true;
  group.add(body);

  // Глаза
  const eyeGeo = new THREE.SphereGeometry(0.16, 10, 8);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
  const pupilGeo = new THREE.SphereGeometry(0.08, 8, 6);
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });

  [-1, 1].forEach(side => {
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(1.35, 0.18, side * 0.34);
    group.add(eye);
    const pupil = new THREE.Mesh(pupilGeo, pupilMat);
    pupil.position.set(1.48, 0.18, side * 0.36);
    group.add(pupil);
  });

  const finMat = new THREE.MeshStandardMaterial({
    color: scheme.fin, roughness: 0.5, side: THREE.DoubleSide, transparent: true, opacity: 0.9
  });

  // Хвост (вращается вокруг локальной оси Y — махание)
  const tailGeo = new THREE.ConeGeometry(0.55, 1.1, 6);
  tailGeo.scale(0.35, 1, 1);
  const tail = new THREE.Mesh(tailGeo, finMat);
  tail.position.set(-1.85, 0, 0);
  tail.rotation.z = Math.PI / 2;
  group.add(tail);

  // Верхний плавник
  const topFinGeo = new THREE.ConeGeometry(0.45, 0.8, 5);
  topFinGeo.scale(1.4, 1, 0.25);
  const topFin = new THREE.Mesh(topFinGeo, finMat);
  topFin.position.set(0.1, 0.75, 0);
  group.add(topFin);

  // Боковые плавники
  const sideFinGeo = new THREE.ConeGeometry(0.3, 0.6, 5);
  sideFinGeo.scale(1, 1, 0.2);
  const leftFin = new THREE.Mesh(sideFinGeo, finMat);
  leftFin.position.set(0.2, -0.15, 0.55);
  leftFin.rotation.x = 0.5;
  group.add(leftFin);

  const rightFin = new THREE.Mesh(sideFinGeo.clone(), finMat);
  rightFin.position.set(0.2, -0.15, -0.55);
  rightFin.rotation.x = -0.5;
  group.add(rightFin);

  group.scale.setScalar(scale);
  group.position.set(
    (Math.random() - 0.5) * (TANK.x - 6),
    (Math.random() - 0.5) * (TANK.y - 6),
    (Math.random() - 0.5) * (TANK.z - 6)
  );
  scene.add(group);

  fishArray.push({
    mesh: group,
    tail, topFin, leftFin, rightFin,
    velocity: new THREE.Vector3(Math.random()-0.5, (Math.random()-0.5)*0.3, Math.random()-0.5).normalize(),
    speed: 1.5 + Math.random() * 2.5,
    tailSpeed: 4 + Math.random() * 5,
    phase: Math.random() * Math.PI * 2,
    targetFood: null,
    avoidanceRadius: 2.5 + Math.random() * 1.5,
    wanderTimer: Math.random() * 3,
    baseScale: scale
  });
  updateFishCount();
}

for (let i = 0; i < 15; i++) createFish();

/* ============================================================
   ПУЗЫРИ
============================================================ */
const bubbles = [];
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, transparent: true, opacity: 0.35,
  transmission: 0.9, roughness: 0.1, metalness: 0,
  clearcoat: 1.0
});

function createBubble() {
  const r = 0.12 + Math.random() * 0.28;
  const b = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), bubbleMat);
  b.position.set(
    (Math.random() - 0.5) * (TANK.x - 2),
    -HALF.y + Math.random() * (TANK.y - 2),
    (Math.random() - 0.5) * (TANK.z - 2)
  );
  b.userData = {
    speed: 1.2 + Math.random() * 2,
    wobblePhase: Math.random() * Math.PI * 2,
    wobbleAmp: 0.3 + Math.random() * 0.6,
    baseX: b.position.x, baseZ: b.position.z
  };
  scene.add(b);
  bubbles.push(b);
}
for (let i = 0; i < 30; i++) createBubble();

/* ============================================================
   КОРМ
============================================================ */
const foods = [];
const foodMat = new THREE.MeshStandardMaterial({ color: 0xc9622e, roughness: 0.8 });

function createFood(x, y, z) {
  const count = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) {
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.18 + Math.random()*0.12, 8, 6), foodMat);
    f.position.set(
      THREE.MathUtils.clamp(x + (Math.random()-0.5)*0.8, -HALF.x+0.5, HALF.x-0.5),
      THREE.MathUtils.clamp(y + (Math.random()-0.5)*0.5, -HALF.y+1, HALF.y-0.5),
      THREE.MathUtils.clamp(z + (Math.random()-0.5)*0.8, -HALF.z+0.5, HALF.z-0.5)
    );
    f.userData = { vy: 0 };
    f.castShadow = true;
    scene.add(f);
    foods.push(f);
  }
  updateFoodCount();
}

/* ============================================================
   КЛИК — КОРМЛЕНИЕ (Raycaster)
============================================================ */
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
let mouseDownPos = null;

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button === 0) mouseDownPos = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('pointerup', e => {
  if (e.button !== 0 || !mouseDownPos) return;
  const dx = e.clientX - mouseDownPos.x, dy = e.clientY - mouseDownPos.y;
  mouseDownPos = null;
  if (dx*dx + dy*dy > 25) return; // это было вращение камеры, не клик

  mouseNDC.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObject(glassBox);
  if (hits.length > 0) {
    const p = hits[0].point.clone();
    p.y = Math.min(p.y, HALF.y - 1);
    createFood(p.x, p.y, p.z);
  } else {
    // если не попали в стекло — бросаем корм сверху в центре луча
    const p = raycaster.ray.at(camera.position.distanceTo(controls.target), new THREE.Vector3());
    p.x = THREE.MathUtils.clamp(p.x, -HALF.x+1, HALF.x-1);
    p.z = THREE.MathUtils.clamp(p.z, -HALF.z+1, HALF.z-1);
    p.y = HALF.y - 1;
    createFood(p.x, p.y, p.z);
  }
});

/* ============================================================
   UI КНОПКИ
============================================================ */
document.getElementById('btnAddFish').onclick = () => createFish();
document.getElementById('btnBubbles').onclick = () => { for (let i = 0; i < 10; i++) createBubble(); };
document.getElementById('btnLight').onclick = () => {
  lightOn = !lightOn;
  sunLight.intensity = lightOn ? 1.0 : 0.12;
  ambient.intensity = lightOn ? 0.4 : 0.15;
};

function updateFishCount() { document.getElementById('fishCount').textContent = fishArray.length; }
function updateFoodCount() { document.getElementById('foodCount').textContent = foods.length; }

/* ============================================================
   АНИМАЦИЯ И ИИ РЫБОК
============================================================ */
const clock = new THREE.Clock();
let fpsFrames = 0, fpsTime = 0;
const _tmp = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // --- РЫБКИ ---
  for (let i = fishArray.length - 1; i >= 0; i--) {
    const f = fishArray[i];
    const pos = f.mesh.position;

    // --- Поиск корма (радиус 15) ---
    if (!f.targetFood || !foods.includes(f.targetFood)) {
      f.targetFood = null;
      let best = 15;
      for (const food of foods) {
        const d = pos.distanceTo(food.position);
        if (d < best) { best = d; f.targetFood = food; }
      }
    }

    // --- Направление движения ---
    let desired;
    if (f.targetFood) {
      desired = _tmp.copy(f.targetFood.position).sub(pos).normalize();
      // съедание
      if (pos.distanceTo(f.targetFood.position) < 1.2 * f.mesh.scale.x) {
        scene.remove(f.targetFood);
        foods.splice(foods.indexOf(f.targetFood), 1);
        f.targetFood = null;
        // рост +5%
        f.baseScale = Math.min(f.baseScale * 1.05, 2.0);
        f.mesh.scale.setScalar(f.baseScale);
        updateFoodCount();
      }
    } else {
      // случайное блуждание
      f.wanderTimer -= dt;
      if (f.wanderTimer <= 0) {
        f.wanderTimer = 1.5 + Math.random() * 3;
        f.velocity.x += (Math.random() - 0.5) * 0.8;
        f.velocity.y += (Math.random() - 0.5) * 0.4;
        f.velocity.z += (Math.random() - 0.5) * 0.8;
      }
      desired = f.velocity.clone().normalize();
    }

    // --- Избегание столкновений ---
    const avoid = new THREE.Vector3();
    for (const other of fishArray) {
      if (other === f) continue;
      const d = pos.distanceTo(other.mesh.position);
      if (d < f.avoidanceRadius && d > 0.001) {
        _tmp.copy(pos).sub(other.mesh.position).normalize().multiplyScalar((f.avoidanceRadius - d) / f.avoidanceRadius);
        avoid.add(_tmp);
      }
    }
    desired.add(avoid.multiplyScalar(1.6));
    if (desired.lengthSq() > 0) desired.normalize();

    // --- Отражение от стен (плавное) ---
    const margin = 2.5;
    const wallPush = new THREE.Vector3();
    if (pos.x >  HALF.x - margin) wallPush.x -= (pos.x - (HALF.x - margin)) / margin;
    if (pos.x < -HALF.x + margin) wallPush.x += ((-HALF.x + margin) - pos.x) / margin;
    if (pos.y >  HALF.y - margin) wallPush.y -= (pos.y - (HALF.y - margin)) / margin;
    if (pos.y < -HALF.y + margin) wallPush.y += ((-HALF.y + margin) - pos.y) / margin;
    if (pos.z >  HALF.z - margin) wallPush.z -= (pos.z - (HALF.z - margin)) / margin;
    if (pos.z < -HALF.z + margin) wallPush.z += ((-HALF.z + margin) - pos.z) / margin;
    desired.add(wallPush.multiplyScalar(2.5));
    if (desired.lengthSq() > 0) desired.normalize();

    // --- Сглаживание скорости ---
    f.velocity.lerp(desired, 1 - Math.exp(-2.5 * dt));
    if (f.velocity.lengthSq() < 0.0001) f.velocity.set(1, 0, 0);
    f.velocity.normalize();

    // --- Движение ---
    const spd = f.targetFood ? f.speed * 1.8 : f.speed;
    pos.addScaledVector(f.velocity, spd * dt);

    // жёсткий кламп на всякий случай
    pos.x = THREE.MathUtils.clamp(pos.x, -HALF.x + 1, HALF.x - 1);
    pos.y = THREE.MathUtils.clamp(pos.y, -HALF.y + 1, HALF.y - 1);
    pos.z = THREE.MathUtils.clamp(pos.z, -HALF.z + 1, HALF.z - 1);

    // --- Поворот в направлении движения ---
    const yaw = Math.atan2(-f.velocity.z, f.velocity.x);
    const pitch = Math.asin(THREE.MathUtils.clamp(f.velocity.y, -1, 1)) * 0.6;
    f.mesh.rotation.y += (yaw - f.mesh.rotation.y) * Math.min(1, 4 * dt);
    f.mesh.rotation.z += (-pitch - f.mesh.rotation.z) * Math.min(1, 4 * dt);

    // --- Анимация хвоста и плавников ---
    const tailAmp = f.targetFood ? 0.85 : 0.55;
    f.tail.rotation.y = Math.sin(t * f.tailSpeed + f.phase) * tailAmp;
    f.leftFin.rotation.z = Math.sin(t * f.tailSpeed * 0.8 + f.phase) * 0.35;
    f.rightFin.rotation.z = -Math.sin(t * f.tailSpeed * 0.8 + f.phase + 0.5) * 0.35;
    f.topFin.rotation.z = Math.sin(t * f.tailSpeed * 0.5 + f.phase) * 0.12;

    // лёгкое покачивание тела
    f.mesh.rotation.x = Math.sin(t * 1.2 + f.phase) * 0.05;
  }

  // --- КОРМ (гравитация) ---
  for (let i = foods.length - 1; i >= 0; i--) {
    const fd = foods[i];
    fd.userData.vy -= 4.0 * dt;
    fd.position.y += fd.userData.vy * dt;
    fd.position.x += Math.sin(t * 2 + i) * 0.15 * dt;
    if (fd.position.y <= -HALF.y + 0.4) {
      scene.remove(fd);
      foods.splice(i, 1);
      // если кто-то целится в этот корм — сброс
      for (const f of fishArray) if (f.targetFood === fd) f.targetFood = null;
      updateFoodCount();
    }
  }

  // --- ПУЗЫРИ ---
  for (const b of bubbles) {
    const u = b.userData;
    b.position.y += u.speed * dt;
    b.position.x = u.baseX + Math.sin(t * 1.5 + u.wobblePhase) * u.wobbleAmp;
    b.position.z = u.baseZ + Math.cos(t * 1.2 + u.wobblePhase) * u.wobbleAmp;
    if (b.position.y > HALF.y - 0.4) {
      b.position.y = -HALF.y + 0.5;
      u.baseX = (Math.random() - 0.5) * (TANK.x - 2);
      u.baseZ = (Math.random() - 0.5) * (TANK.z - 2);
    }
  }

  // --- ВОДОРОСЛИ (покачивание) ---
  for (const p of plants) {
    const u = p.userData;
    p.rotation.x = Math.sin(t * u.speed + u.phase) * u.ampX;
    p.rotation.z = Math.cos(t * u.speed * 0.8 + u.phase) * u.ampZ;
  }

  // --- Лёгкое мерцание подводных огней ---
  blueLight1.intensity = 0.7 + Math.sin(t * 0.8) * 0.15;
  blueLight2.intensity = 0.6 + Math.cos(t * 0.6) * 0.15;

  controls.update();
  renderer.render(scene, camera);

  // FPS
  fpsFrames++;
  fpsTime += dt;
  if (fpsTime >= 0.5) {
    document.getElementById('fps').textContent = Math.round(fpsFrames / fpsTime);
    fpsFrames = 0; fpsTime = 0;
  }
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
