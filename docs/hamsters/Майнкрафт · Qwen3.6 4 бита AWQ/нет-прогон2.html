<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Clone</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        /* Start Screen */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; pointer-events: auto; cursor: pointer; z-index: 10;
        }
        h1 { font-size: 4rem; margin-bottom: 0.5rem; text-shadow: 2px 2px 0 #000; }
        .controls { font-size: 1.2rem; line-height: 1.6; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 8px; }
        
        /* Hotbar */
        #hotbar {
            display: flex; justify-content: center; gap: 4px;
            margin-bottom: 20px; padding: 4px;
            background: rgba(0, 0, 0, 0.5); border-radius: 4px; pointer-events: auto;
        }
        .slot {
            width: 50px; height: 50px; border: 2px solid rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; text-shadow: 1px 1px 0 #000;
            position: relative;
        }
        .slot.selected { border-color: white; transform: scale(1.1); }
        .slot span { position: absolute; top: 2px; left: 4px; font-size: 12px; }

    </style>
</head>
<body>

<div id="game-container"></div>

<div id="ui-layer">
    <div style="flex-grow: 1;"></div> <!-- Spacer -->
    <div id="crosshair"></div>
    <div id="hotbar">
        <!-- Slots generated by JS -->
    </div>
</div>

<div id="start-screen">
    <h1>Voxel World</h1>
    <div class="controls">
        <b>WASD</b> Move &nbsp;|&nbsp; <b>SPACE</b> Jump<br>
        <b>Mouse</b> Look<br>
        <b>Left Click</b> Break Block<br>
        <b>Right Click</b> Place Block<br>
        <b>1-7 / Scroll</b> Select Block
    </div>
    <p style="margin-top: 20px; font-size: 1.5rem;">Click to Play</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/**
 * MINECRAFT CLONE - SINGLE FILE
 */

// --- CONSTANTS ---
const BLOCKS = {
    AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, SAND: 4, WOOD: 5, LEAVES: 6, SNOW: 7
};

const COLORS = [
    null, 
    0x4caf50, // Grass
    0x795548, // Dirt
    0x9e9e9e, // Stone
    0xe7d9a8, // Sand
    0x8d6e63, // Wood
    0x2e7d32, // Leaves
    0xffffff  // Snow
];

const CHUNK_W = 16;
const CHUNK_H = 80;
const RENDER_DIST = 5; // Generate radius
const MESH_DIST = 4;   // Render radius
const CLEANUP_DIST = 7;

// --- NOISE GENERATOR ---
class SimpleNoise {
    constructor() {
        this.perm = new Uint8Array(512);
        const p = new Uint8Array(256);
        for(let i=0; i<256; i++) p[i] = i;
        // Shuffle
        for(let i=255; i>0; i--) {
            const r = Math.floor(Math.random() * (i + 1));
            [p[i], p[r]] = [p[r], p[i]];
        }
        for(let i=0; i<512; i++) this.perm[i] = p[i & 255];
    }

    fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    lerp(t, a, b) { return a + t * (b - a); }
    grad(hash, x, y, z) {
        const h = hash & 15;
        const u = h < 8 ? x : y;
        const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
    }

    noise3D(x, y, z) {
        const X = Math.floor(x) & 255;
        const Y = Math.floor(y) & 255;
        const Z = Math.floor(z) & 255;
        x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
        const u = this.fade(x), v = this.fade(y), w = this.fade(z);
        const A = this.perm[X] + Y, AA = this.perm[A] + Z, AB = this.perm[A + 1] + Z;
        const B = this.perm[X + 1] + Y, BA = this.perm[B] + Z, BB = this.perm[B + 1] + Z;
        return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.perm[AA], x, y, z), this.grad(this.perm[BA], x - 1, y, z)), this.lerp(u, this.grad(this.perm[AB], x, y - 1, z), this.grad(this.perm[BB], x - 1, y - 1, z))), this.lerp(v, this.lerp(u, this.grad(this.perm[AA + 1], x, y, z - 1), this.grad(this.perm[BA + 1], x - 1, y, z - 1)), this.lerp(u, this.grad(this.perm[AB + 1], x, y - 1, z - 1), this.grad(this.perm[BB + 1], x - 1, y - 1, z - 1))));
    }

    // 2D Noise wrapper
    noise2D(x, y) { return this.noise3D(x, y, 0); }

    // Hash for trees
    hashCoord(x, z) {
        let h = x * 374761393 + z * 668265263;
        h = (h ^ (h >> 13)) * 1274126177;
        return (h ^ (h >> 16)) >>> 0; // Unsigned 32-bit
    }
}

const noise = new SimpleNoise();

// --- GAME ENGINE SETUP ---
const container = document.getElementById('game-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 40, 110);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 400);
camera.rotationOrder = "YXZ";

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(100, 200, 50);
scene.add(dirLight);

// Materials
const blockMaterial = new THREE.MeshLambertMaterial({ vertexColors: true });

// Global State
let chunks = new Map(); // Key: "cx,cz", Value: { data: Uint8Array, mesh: Mesh }
let meshesList = []; // Array of active meshes for raycasting
let activeChunks = new Set();
let selectedSlot = 0;
let isLocked = false;

// Player State
const player = {
    pos: new THREE.Vector3(8, 50, 8),
    vel: new THREE.Vector3(),
    yaw: 0,
    pitch: 0,
    onGround: false,
    height: 1.8,
    width: 0.3
};

// Water Plane
const waterGeo = new THREE.PlaneGeometry(600, 600);
waterGeo.rotateX(-Math.PI / 2);
const waterMat = new THREE.MeshBasicMaterial({ color: 0x336699, transparent: true, opacity: 0.6 });
const waterPlane = new THREE.Mesh(waterGeo, waterMat);
waterPlane.position.y = 14.3;
scene.add(waterPlane);

// Clouds
const cloudGroup = new THREE.Group();
scene.add(cloudGroup);
for(let i=0; i<25; i++) {
    const geo = new THREE.BoxGeometry(10 + Math.random()*10, 1, 10 + Math.random()*10);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
    const m = new THREE.Mesh(geo, mat);
    m.position.set((Math.random()-0.5)*300, 85 + Math.random()*5, (Math.random()-0.5)*300);
    cloudGroup.add(m);
}

// Highlight Box (Wireframe)
const highlightGeo = new THREE.BoxGeometry(1.005, 1.005, 1.005);
const highlightEdges = new THREE.EdgesGeometry(highlightGeo);
const highlightLine = new THREE.LineSegments(highlightEdges, new THREE.LineBasicMaterial({ color: 0x000000 }));
highlightLine.visible = false;
scene.add(highlightLine);

// Raycaster
const raycaster = new THREE.Raycaster();
raycaster.far = 6;

// --- WORLD GENERATION LOGIC ---

function getChunkKey(cx, cz) { return `${cx},${cz}`; }

function getBlock(x, y, z) {
    if (y < 0 || y >= CHUNK_H) return BLOCKS.AIR;
    const cx = Math.floor(x / CHUNK_W);
    const cz = Math.floor(z / CHUNK_W);
    const key = getChunkKey(cx, cz);
    const chunk = chunks.get(key);
    if (!chunk) return BLOCKS.AIR;
    
    // Local coordinates handling negatives
    let lx = x - cx * CHUNK_W;
    let lz = z - cz * CHUNK_W;
    if (lx < 0) lx += CHUNK_W;
    if (lz < 0) lz += CHUNK_W;

    return chunk.data[lx + lz * CHUNK_W + y * CHUNK_W * CHUNK_W];
}

function setBlock(x, y, z, id) {
    if (y < 0 || y >= CHUNK_H) return;
    const cx = Math.floor(x / CHUNK_W);
    const cz = Math.floor(z / CHUNK_W);
    const key = getChunkKey(cx, cz);
    const chunk = chunks.get(key);
    if (!chunk) return; // Should not happen if logic is correct
    
    let lx = x - cx * CHUNK_W;
    let lz = z - cz * CHUNK_W;
    if (lx < 0) lx += CHUNK_W;
    if (lz < 0) lz += CHUNK_W;

    const idx = lx + lz * CHUNK_W + y * CHUNK_W * CHUNK_W;
    chunk.data[idx] = id;
    
    rebuildChunkMesh(cx, cz);
    // Rebuild neighbors if on edge
    if (lx === 0) rebuildChunkMesh(cx - 1, cz);
    if (lx === CHUNK_W - 1) rebuildChunkMesh(cx + 1, cz);
    if (lz === 0) rebuildChunkMesh(cx, cz - 1);
    if (lz === CHUNK_W - 1) rebuildChunkMesh(cx, cz + 1);
}

function generateChunkData(cx, cz) {
    const key = getChunkKey(cx, cz);
    if (chunks.has(key)) return;

    const data = new Uint8Array(CHUNK_W * CHUNK_W * CHUNK_H);
    
    // Base Terrain
    for (let x = 0; x < CHUNK_W; x++) {
        for (let z = 0; z < CHUNK_W; z++) {
            const wx = cx * CHUNK_W + x;
            const wz = cz * CHUNK_W + z;

            // Fractal Noise
            const m = (noise.noise2D(wx * 0.004, wz * 0.004) + 1) / 2; // 0-1
            const h = (noise.noise2D(wx * 0.02, wz * 0.02) + 1) / 2;  // 0-1
            let height = Math.floor(5 + m * m * 58 + h * 10);
            
            // Fill column
            for (let y = 0; y < CHUNK_H; y++) {
                let type = BLOCKS.AIR;
                
                if (y === 0) {
                    type = BLOCKS.STONE; // Bedrock-ish
                } else if (y < height - 3) {
                    type = BLOCKS.STONE;
                } else if (y < height) {
                    // Dirt or Sand based on height
                    type = (height <= 16) ? BLOCKS.SAND : BLOCKS.DIRT;
                } else if (y === height) {
                    // Surface
                    if (height >= 46) type = BLOCKS.SNOW;
                    else if (height >= 37) type = BLOCKS.STONE;
                    else if (height <= 16) type = BLOCKS.SAND;
                    else type = BLOCKS.GRASS;
                }

                // Caves (3D noise)
                if (type !== BLOCKS.AIR && y > 3 && y < height - 2) {
                    const caveVal = noise.noise3D(wx * 0.09, y * 0.09, wz * 0.09);
                    if (caveVal > 0.67) type = BLOCKS.AIR;
                }

                data[x + z * CHUNK_W + y * CHUNK_W * CHUNK_W] = type;
            }

            // Trees
            if (height > 16 && height < 46) {
                // Check hash for tree placement
                if ((noise.hashCoord(wx, wz) % 100) < 2) { 
                    const treeH = 4 + (noise.hashCoord(wx+1, wz+1) % 2); // 4 or 5
                    // Ensure inside chunk bounds to avoid complexity, though spec says "fits inside chunk"
                    // We'll just place if x,z allow.
                    
                    // Trunk
                    for(let ty=1; ty<=treeH; ty++) {
                        if(height+ty < CHUNK_H) data[x + z * CHUNK_W + (height+ty) * CHUNK_W * CHUNK_W] = BLOCKS.WOOD;
                    }
                    // Leaves
                    // 5x5 layer twice, 3x3, 1
                    // Simplified generation centered at top of trunk
                    const leafStart = height + treeH - 1;
                    for(let ly=0; ly<3; ly++) {
                        let size = (ly===0) ? 2 : (ly===1) ? 2 : 1; // Radius
                        for(let ox=-size; ox<=size; ox++) {
                            for(let oz=-size; oz<=size; oz++) {
                                // Check bounds
                                if(x+ox >=0 && x+ox < CHUNK_W && z+oz >=0 && z+oz < CHUNK_W) {
                                    let y = leafStart + ly + 1;
                                    if(y < CHUNK_H) {
                                        // Only place in air
                                        if(data[x+ox + (z+oz) * CHUNK_W + y * CHUNK_W * CHUNK_W] === BLOCKS.AIR) {
                                            data[x+ox + (z+oz) * CHUNK_W + y * CHUNK_W * CHUNK_W] = BLOCKS.LEAVES;
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }

    chunks.set(key, { data: data, mesh: null });
}

// --- MESHING ---

function rebuildChunkMesh(cx, cz) {
    const key = getChunkKey(cx, cz);
    const chunk = chunks.get(key);
    if (!chunk) return;

    // Dispose old mesh
    if (chunk.mesh) {
        scene.remove(chunk.mesh);
        chunk.mesh.geometry.dispose();
        meshesList = meshesList.filter(m => m !== chunk.mesh);
    }

    // If out of render distance, don't build mesh yet
    const dx = cx - Math.floor(player.pos.x / CHUNK_W);
    const dz = cz - Math.floor(player.pos.z / CHUNK_W);
    if (dx*dx + dz*dz > MESH_DIST * MESH_DIST) {
        chunk.mesh = null;
        return;
    }

    // Arrays for geometry
    const positions = [];
    const normals = [];
    const colors = [];

    // Face definitions: [dx, dy, dz, normal, shadeMultiplier]
    // Order: Top, Bottom, North, South, West, East
    // Note: standard winding order for visibility
    const faces = [
        { dir: [0, 1, 0], norm: [0, 1, 0], shade: 1.0 }, // Top
        { dir: [0, -1, 0], norm: [0, -1, 0], shade: 0.55 }, // Bottom
        { dir: [0, 0, 1], norm: [0, 0, 1], shade: 0.8 }, // South (positive Z)
        { dir: [0, 0, -1], norm: [0, 0, -1], shade: 0.8 }, // North (negative Z)
        { dir: [-1, 0, 0], norm: [-1, 0, 0], shade: 0.8 }, // West (negative X)
        { dir: [1, 0, 0], norm: [1, 0, 0], shade: 0.8 }  // East (positive X)
    ];

    const wx_base = cx * CHUNK_W;
    const wz_base = cz * CHUNK_W;

    for (let y = 0; y < CHUNK_H; y++) {
        for (let z = 0; z < CHUNK_W; z++) {
            for (let x = 0; x < CHUNK_W; x++) {
                const idx = x + z * CHUNK_W + y * CHUNK_W * CHUNK_W;
                const type = chunk.data[idx];
                if (type === BLOCKS.AIR) continue;

                const colorHex = COLORS[type];
                const r = (colorHex >> 16 & 0xff) / 255;
                const g = (colorHex >> 8 & 0xff) / 255;
                const b = (colorHex & 0xff) / 255;

                const wx = wx_base + x;
                const wz = wz_base + z;

                for (const face of faces) {
                    const nx = wx + face.dir[0];
                    const ny = y + face.dir[1];
                    const nz = wz + face.dir[2];

                    if (getBlock(nx, ny, nz) === BLOCKS.AIR) {
                        // Add Face
                        // Vertices order for counter-clockwise winding looking from outside
                        // This is tricky manually, let's hardcode relative offsets for each face
                        
                        // Using a generic generator for cube faces
                        const p = [wx, y, wz];
                        let v = [];
                        
                        // Simple vertex generation based on direction
                        // 0 1
                        // 3 2
                        const u = face.dir[0] ? 0 : (face.dir[1] ? 1 : 2);
                        const v_axis = face.dir[0] ? 1 : (face.dir[1] ? 2 : 0);
                        const w = 3 - u - v_axis; // Normal axis index
                        
                        // Coordinates
                        // We need 4 corners.
                        // Corner 0: p
                        // Corner 1: p + axis_u
                        // Corner 2: p + axis_u + axis_v
                        // Corner 3: p + axis_v
                        
                        // Helper to get coord
                        const get = (offU, offV) => {
                            let res = [...p];
                            if(u===0) res[0]+=offU; else if(u===1) res[1]+=offU; else res[2]+=offU;
                            if(v_axis===0) res[0]+=offV; else if(v_axis===1) res[1]+=offV; else res[2]+=offV;
                            return res;
                        };

                        const c0 = get(0,0);
                        const c1 = get(1,0);
                        const c2 = get(1,1);
                        const c3 = get(0,1);

                        // Two triangles: 0-1-2, 0-2-3
                        const verts = [c0, c1, c2, c0, c2, c3];
                        
                        for(let i=0; i<6; i++) {
                            positions.push(verts[i][0], verts[i][1], verts[i][2]);
                            normals.push(face.norm[0], face.norm[1], face.norm[2]);
                            colors.push(r * face.shade, g * face.shade, b * face.shade);
                        }
                    }
                }
            }
        }
    }

    if (positions.length === 0) {
        chunk.mesh = null;
        return;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const mesh = new THREE.Mesh(geometry, blockMaterial);
    scene.add(mesh);
    chunk.mesh = mesh;
    meshesList.push(mesh);
}

// --- INPUT & CONTROLS ---

const keys = {};
document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

// Pointer Lock
const startScreen = document.getElementById('start-screen');
startScreen.addEventListener('click', () => {
    document.body.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
    isLocked = document.pointerLockElement === document.body;
    startScreen.style.display = isLocked ? 'none' : 'flex';
});

document.addEventListener('mousemove', e => {
    if (!isLocked) return;
    player.yaw -= e.movementX * 0.002;
    player.pitch -= e.movementY * 0.002;
    player.pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, player.pitch));
    
    camera.rotation.set(player.pitch, player.yaw, 0);
});

// Mouse Buttons
document.addEventListener('mousedown', e => {
    if (!isLocked) return;
    if (e.button === 0) breakBlock();
    if (e.button === 2) placeBlock();
});
document.addEventListener('contextmenu', e => e.preventDefault());

// Hotbar Selection
document.addEventListener('wheel', e => {
    if (!isLocked) return;
    if (e.deltaY > 0) selectedSlot = (selectedSlot + 1) % 7;
    else selectedSlot = (selectedSlot + 6) % 7;
    updateHotbarUI();
});
document.addEventListener('keydown', e => {
    if (e.key >= '1' && e.key <= '7') {
        selectedSlot = parseInt(e.key) - 1;
        updateHotbarUI();
    }
});

// UI Generation
const hotbarEl = document.getElementById('hotbar');
const hotbarItems = [BLOCKS.GRASS, BLOCKS.DIRT, BLOCKS.STONE, BLOCKS.SAND, BLOCKS.WOOD, BLOCKS.LEAVES, BLOCKS.SNOW];
hotbarItems.forEach((id, i) => {
    const div = document.createElement('div');
    div.className = 'slot';
    div.style.backgroundColor = '#' + COLORS[id].toString(16).padStart(6, '0');
    div.innerHTML = `<span>${i+1}</span>`;
    hotbarEl.appendChild(div);
});

function updateHotbarUI() {
    const slots = hotbarEl.children;
    for(let i=0; i<slots.length; i++) {
        if(i === selectedSlot) slots[i].classList.add('selected');
        else slots[i].classList.remove('selected');
    }
}
updateHotbarUI();

// --- INTERACTION ---

function getTargetInfo() {
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const intersects = raycaster.intersectObjects(meshesList);
    
    if (intersects.length > 0) {
        const hit = intersects[0];
        const p = hit.point;
        const n = hit.face.normal;
        
        // Break target: inside the block
        const bx = Math.floor(p.x - n.x * 0.5);
        const by = Math.floor(p.y - n.y * 0.5);
        const bz = Math.floor(p.z - n.z * 0.5);
        
        // Place target: adjacent empty space
        const px = Math.floor(p.x + n.x * 0.5);
        const py = Math.floor(p.y + n.y * 0.5);
        const pz = Math.floor(p.z + n.z * 0.5);
        
        return { break: {x:bx, y:by, z:bz}, place: {x:px, y:py, z:pz} };
    }
    return null;
}

function breakBlock() {
    const info = getTargetInfo();
    if (info) {
        const b = info.break;
        if (b.y > 0) { // Don't break bedrock
            setBlock(b.x, b.y, b.z, BLOCKS.AIR);
        }
    }
}

function placeBlock() {
    const info = getTargetInfo();
    if (info) {
        const p = info.place;
        // Check collision with player
        const px = player.pos.x, py = player.pos.y, pz = player.pos.z;
        // AABB check simplified: is block center inside player box?
        // Player box: x-0.3 to x+0.3, y to y+1.8, z-0.3 to z+0.3
        
        const blockMinX = p.x - 0.5, blockMaxX = p.x + 0.5;
        const blockMinY = p.y - 0.5, blockMaxY = p.y + 0.5;
        const blockMinZ = p.z - 0.5, blockMaxZ = p.z + 0.5;
        
        const overlapX = px + player.width > blockMinX && px - player.width < blockMaxX;
        const overlapY = py + player.height > blockMinY && py < blockMaxY;
        const overlapZ = pz + player.width > blockMinZ && pz - player.width < blockMaxZ;
        
        if (overlapX && overlapY && overlapZ) return; // Collides with player

        if (getBlock(p.x, p.y, p.z) === BLOCKS.AIR) {
            setBlock(p.x, p.y, p.z, hotbarItems[selectedSlot]);
        }
    }
}


// --- PHYSICS & UPDATE ---

const clock = new THREE.Clock();

function updatePhysics(dt) {
    if (!isLocked) return;

    // Gravity
    player.vel.y -= 25 * dt;
    
    // Movement Input
    const speed = 5.5;
    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
    const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
    
    const moveDir = new THREE.Vector3();
    if (keys['KeyW']) moveDir.add(forward);
    if (keys['KeyS']) moveDir.sub(forward);
    if (keys['KeyA']) moveDir.sub(right);
    if (keys['KeyD']) moveDir.add(right);
    
    if (moveDir.lengthSq() > 0) moveDir.normalize().multiplyScalar(speed);
    
    // Jump
    if (player.onGround && keys['Space']) {
        player.vel.y = 8.5;
        player.onGround = false;
    }

    // Apply Velocity with Collision
    // Axis separated collision
    const axes = ['x', 'y', 'z'];
    player.onGround = false;

    for (const axis of axes) {
        player.pos[axis] += player.vel[axis] * dt;
        
        // Check collisions
        // Scan bounding box
        const minX = Math.floor(player.pos.x - player.width);
        const maxX = Math.floor(player.pos.x + player.width);
        const minY = Math.floor(player.pos.y);
        const maxY = Math.floor(player.pos.y + player.height);
        const minZ = Math.floor(player.pos.z - player.width);
        const maxZ = Math.floor(player.pos.z + player.width);

        let collided = false;
        
        for(let x = minX; x <= maxX; x++) {
            for(let y = minY; y <= maxY; y++) {
                for(let z = minZ; z <= maxZ; z++) {
                    if (getBlock(x, y, z) !== BLOCKS.AIR) {
                        collided = true;
                        // Resolve
                        if (axis === 'x') player.pos.x = player.vel.x > 0 ? x - player.width - 0.001 : x + 1 + player.width + 0.001;
                        if (axis === 'y') {
                            if (player.vel.y < 0) { player.pos.y = y + 1; player.onGround = true; }
                            else { player.pos.y = y - player.height - 0.001; }
                        }
                        if (axis === 'z') player.pos.z = player.vel.z > 0 ? z - player.width - 0.001 : z + 1 + player.width + 0.001;
                        player.vel[axis] = 0;
                    }
                }
            }
        }
        if(collided) break; // Optimization: stop checking if hit
    }

    // Void kill
    if (player.pos.y < -20) {
        player.pos.set(8, 50, 8);
        player.vel.set(0,0,0);
    }

    camera.position.copy(player.pos);
    camera.position.y += 1.62; // Eye height
}

// --- MAIN LOOP ---

function updateChunks() {
    const pcx = Math.floor(player.pos.x / CHUNK_W);
    const pcz = Math.floor(player.pos.z / CHUNK_W);

    // 1. Generate Data
    let genCount = 0;
    for (let x = -RENDER_DIST; x <= RENDER_DIST; x++) {
        for (let z = -RENDER_DIST; z <= RENDER_DIST; z++) {
            const cx = pcx + x;
            const cz = pcz + z;
            if (!chunks.has(getChunkKey(cx, cz))) {
                generateChunkData(cx, cz);
                genCount++;
                if (genCount >= 4) break;
            }
        }
        if (genCount >= 4) break;
    }

    // 2. Build Meshes
    let meshCount = 0;
    for (const [key, chunk] of chunks) {
        const [cx, cz] = key.split(',').map(Number);
        const dx = cx - pcx;
        const dz = cz - pcz;
        const distSq = dx*dx + dz*dz;

        if (distSq <= MESH_DIST * MESH_DIST) {
            if (!chunk.mesh) {
                // Check neighbors
                const neighbors = [
                    getChunkKey(cx-1, cz), getChunkKey(cx+1, cz),
                    getChunkKey(cx, cz-1), getChunkKey(cx, cz+1)
                ];
                if (neighbors.every(n => chunks.has(n))) {
                    rebuildChunkMesh(cx, cz);
                    meshCount++;
                    if (meshCount >= 2) break;
                }
            }
        } else if (distSq > CLEANUP_DIST * CLEANUP_DIST) {
            // Cleanup
            if (chunk.mesh) {
                scene.remove(chunk.mesh);
                chunk.mesh.geometry.dispose();
                meshesList = meshesList.filter(m => m !== chunk.mesh);
                chunk.mesh = null;
            }
            chunks.delete(key);
        }
    }
}

function updateHighlight() {
    const info = getTargetInfo();
    if (info) {
        highlightLine.visible = true;
        highlightLine.position.set(info.break.x + 0.5, info.break.y + 0.5, info.break.z + 0.5);
    } else {
        highlightLine.visible = false;
    }
}

function animate() {
    requestAnimationFrame(animate);
    
    const dt = Math.min(clock.getDelta(), 0.1);
    
    if (isLocked) {
        updatePhysics(dt);
        updateChunks();
        updateHighlight();
        
        // Move water plane to follow player (fake infinite ocean)
        waterPlane.position.x = player.pos.x;
        waterPlane.position.z = player.pos.z;
        
        // Move clouds
        cloudGroup.position.x = player.pos.x;
        cloudGroup.position.z = player.pos.z;
        // Drift
        cloudGroup.children.forEach(c => {
            c.position.x += dt * 2;
            if (c.position.x > 150) c.position.x = -150;
        });
    }

    renderer.render(scene, camera);
}

// Initial Spawn
generateChunkData(0, 0);
rebuildChunkMesh(0, 0);
player.pos.set(8, 40, 8); // Safe spawn roughly

animate();

// Resize handler
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
