<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Аквариум с Реалистичными Рыбками</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #0a1628 0%, #1a3a5c 100%);
        }

        canvas {
            display: block;
        }

        .panel {
            position: fixed;
            background: rgba(10, 30, 60, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            color: #e0f0ff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .panel:hover {
            transform: translateY(-2px);
        }

        .info-panel {
            top: 20px;
            left: 20px;
            max-width: 280px;
        }

        .stats-panel {
            top: 20px;
            right: 20px;
            min-width: 160px;
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #64b5f6, #4dd0e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .panel p {
            font-size: 12px;
            line-height: 1.6;
            opacity: 0.85;
            margin-bottom: 8px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px 16px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .btn-fish {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
        }

        .btn-fish:hover {
            box-shadow: 0 6px 25px rgba(255, 107, 53, 0.6);
            transform: translateY(-2px);
        }

        .btn-bubble {
            background: linear-gradient(135deg, #4dd0e1, #26c6da);
            box-shadow: 0 4px 15px rgba(77, 208, 225, 0.4);
        }

        .btn-bubble:hover {
            box-shadow: 0 6px 25px rgba(77, 208, 225, 0.6);
            transform: translateY(-2px);
        }

        .btn-light {
            background: linear-gradient(135deg, #ffd54f, #ffb300);
            box-shadow: 0 4px 15px rgba(255, 213, 79, 0.4);
            color: #333;
        }

        .btn-light:hover {
            box-shadow: 0 6px 25px rgba(255, 213, 79, 0.6);
            transform: translateY(-2px);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(100, 180, 255, 0.15);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.7;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #4dd0e1;
        }

        .instructions {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(100, 180, 255, 0.2);
        }

        .instructions p {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        @media (max-width: 600px) {
            .info-panel {
                max-width: 200px;
                padding: 12px;
            }
            .stats-panel {
                min-width: 120px;
                padding: 12px;
            }
            .panel h2 {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="panel info-panel">
        <h2>🐠 3D Аквариум</h2>
        <p>Интерактивный подводный мир с реалистичными рыбками</p>
        <button class="btn btn-fish" id="btnAddFish">🐟 Добавить рыбку</button>
        <button class="btn btn-bubble" id="btnAddBubble">💨 Больше пузырей</button>
        <button class="btn btn-light" id="btnLight">💡 Свет Вкл/Выкл</button>
        <div class="instructions">
            <p>🖱️ ЛКМ + движение — вращение</p>
            <p>🖱️ ПКМ + движение — панорама</p>
            <p>⚙️ Колесо мыши — зум</p>
            <p>🎯 Клик по аквариуму — кормление</p>
        </div>
    </div>

    <div class="panel stats-panel">
        <h2>📊 Статистика</h2>
        <div class="stat-row">
            <span class="stat-label">Рыбки:</span>
            <span class="stat-value" id="fishCount">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Пузыри:</span>
            <span class="stat-value" id="bubbleCount">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Корм:</span>
            <span class="stat-value" id="foodCount">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">FPS:</span>
            <span class="stat-value" id="fpsCounter">60</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // === SCENE SETUP ===
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1e3d);
        scene.fog = new THREE.FogExp2(0x0a2a4a, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(25, 18, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // === CONTROLS ===
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 10;
        controls.maxDistance = 60;
        controls.maxPolarAngle = Math.PI / 1.8;
        controls.target.set(0, 2, 0);

        // === AQUARIUM DIMENSIONS ===
        const AQUARIUM = { width: 36, height: 24, depth: 20 };
        const HALF = { x: AQUARIUM.width / 2, y: AQUARIUM.height / 2, z: AQUARIUM.depth / 2 };

        // === LIGHTING ===
        const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffeedd, 1.0);
        directionalLight.position.set(10, 30, 15);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 1;
        directionalLight.shadow.camera.far = 80;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        directionalLight.shadow.bias = -0.001;
        scene.add(directionalLight);

        const pointLight1 = new THREE.PointLight(0x4488ff, 0.6, 40);
        pointLight1.position.set(-10, 8, 0);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x2266cc, 0.5, 35);
        pointLight2.position.set(10, 5, -5);
        scene.add(pointLight2);

        // === GLASS CONTAINER ===
        const glassGeometry = new THREE.BoxGeometry(AQUARIUM.width, AQUARIUM.height, AQUARIUM.depth);
        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x88ccff,
            transparent: true,
            opacity: 0.08,
            roughness: 0.05,
            metalness: 0.1,
            side: THREE.BackSide
        });
        const glassBox = new THREE.Mesh(glassGeometry, glassMaterial);
        glassBox.position.y = HALF.y;
        scene.add(glassBox);

        // Wireframe edges
        const edgesGeometry = new THREE.EdgesGeometry(glassGeometry);
        const edgesMaterial = new THREE.LineBasicMaterial({ color: 0x66aaff, transparent: true, opacity: 0.5 });
        const edges = new THREE.LineSegments(edgesGeometry, edgesMaterial);
        edges.position.y = HALF.y;
        scene.add(edges);

        // === SANDY BOTTOM ===
        const sandGeometry = new THREE.PlaneGeometry(AQUARIUM.width, AQUARIUM.depth, 40, 40);
        const sandPositions = sandGeometry.attributes.position;
        for (let i = 0; i < sandPositions.count; i++) {
            const x = sandPositions.getX(i);
            const y = sandPositions.getY(i);
            sandPositions.setZ(i, Math.sin(x * 0.5) * 0.15 + Math.cos(y * 0.7) * 0.1 + (Math.random() - 0.5) * 0.08);
        }
        sandGeometry.computeVertexNormals();
        const sandMaterial = new THREE.MeshStandardMaterial({
            color: 0xd4a76a,
            roughness: 0.9,
            metalness: 0.0
        });
        const sand = new THREE.Mesh(sandGeometry, sandMaterial);
        sand.rotation.x = -Math.PI / 2;
        sand.position.y = 0.05;
        sand.receiveShadow = true;
        scene.add(sand);

        // === ROCKS ===
        function createRock() {
            const geometry = new THREE.DodecahedronGeometry(1 + Math.random() * 1.2, 1);
            const positions = geometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                positions.setX(i, positions.getX(i) * (0.7 + Math.random() * 0.6));
                positions.setY(i, positions.getY(i) * (0.5 + Math.random() * 0.4));
                positions.setZ(i, positions.getZ(i) * (0.7 + Math.random() * 0.6));
            }
            geometry.computeVertexNormals();
            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 0.2, 0.3 + Math.random() * 0.15),
                roughness: 0.95,
                metalness: 0.05
            });
            const rock = new THREE.Mesh(geometry, material);
            rock.castShadow = true;
            rock.receiveShadow = true;
            return rock;
        }

        for (let i = 0; i < 8; i++) {
            const rock = createRock();
            rock.position.set(
                (Math.random() - 0.5) * (AQUARIUM.width - 6),
                0.5 + Math.random() * 0.5,
                (Math.random() - 0.5) * (AQUARIUM.depth - 6)
            );
            rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            scene.add(rock);
        }

        // === SEAWEED ===
        const seaweeds = [];
        function createSeaweed() {
            const group = new THREE.Group();
            const height = 3 + Math.random() * 5;
            const segments = 8;
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                points.push(new THREE.Vector3(
                    Math.sin(t * 2) * 0.3,
                    t * height,
                    Math.cos(t * 1.5) * 0.2
                ));
            }
            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeometry = new THREE.TubeGeometry(curve, 16, 0.15 + Math.random() * 0.1, 6, false);
            const hue = 0.25 + Math.random() * 0.15;
            const tubeMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(hue, 0.7, 0.3 + Math.random() * 0.15),
                roughness: 0.7,
                metalness: 0.0
            });
            const tube = new THREE.Mesh(tubeGeometry, tubeMaterial);
            tube.castShadow = true;
            group.add(tube);

            // Additional leaves
            for (let i = 0; i < 3; i++) {
                const leafHeight = height * (0.4 + Math.random() * 0.5);
                const leafPoints = [];
                const angle = (i / 3) * Math.PI * 2;
                for (let j = 0; j <= 6; j++) {
                    const t = j / 6;
                    leafPoints.push(new THREE.Vector3(
                        Math.sin(angle) * t * 1.2 + Math.sin(t * 3) * 0.2,
                        t * leafHeight,
                        Math.cos(angle) * t * 1.2 + Math.cos(t * 2) * 0.15
                    ));
                }
                const leafCurve = new THREE.CatmullRomCurve3(leafPoints);
                const leafGeo = new THREE.TubeGeometry(leafCurve, 10, 0.08, 4, false);
                const leaf = new THREE.Mesh(leafGeo, tubeMaterial.clone());
                leaf.material.color.offsetHSL(0, 0, -0.05);
                group.add(leaf);
            }

            return { group, phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 1.0 };
        }

        for (let i = 0; i < 12; i++) {
            const sw = createSeaweed();
            sw.group.position.set(
                (Math.random() - 0.5) * (AQUARIUM.width - 4),
                0,
                (Math.random() - 0.5) * (AQUARIUM.depth - 4)
            );
            scene.add(sw.group);
            seaweeds.push(sw);
        }

        // === FISH COLOR SCHEMES ===
        const colorSchemes = [
            { body: 0xff6b35, fin: 0xff8c5a, eye: 0xffffff },   // Orange
            { body: 0x2196f3, fin: 0x64b5f6, eye: 0xffffff },   // Blue
            { body: 0xffeb3b, fin: 0xff5722, eye: 0xffffff },   // Yellow-Red
            { body: 0x9c27b0, fin: 0xce93d8, eye: 0xffffff },   // Purple
            { body: 0xf44336, fin: 0xef9a9a, eye: 0xffffff },   // Red
            { body: 0x4caf50, fin: 0xa5d6a7, eye: 0xffffff },   // Green
            { body: 0xe91e63, fin: 0xf48fb1, eye: 0xffffff },   // Pink
            { body: 0xffc107, fin: 0xffe082, eye: 0xffffff }    // Gold
        ];

        // === FISH CREATION ===
        const fishArray = [];

        function createFish(position) {
            const scheme = colorSchemes[Math.floor(Math.random() * colorSchemes.length)];
            const scale = 0.6 + Math.random() * 0.6;
            const group = new THREE.Group();

            // Body
            const bodyGeometry = new THREE.SphereGeometry(1, 16, 12);
            bodyGeometry.scale(1.4, 0.7, 0.6);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: scheme.body,
                roughness: 0.3,
                metalness: 0.2
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            group.add(body);

            // Eyes
            const eyeGeometry = new THREE.SphereGeometry(0.18, 8, 8);
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: scheme.eye, roughness: 0.1 });
            const pupilGeometry = new THREE.SphereGeometry(0.1, 8, 8);
            const pupilMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });

            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(0.9, 0.15, 0.35);
            group.add(leftEye);
            const leftPupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
            leftPupil.position.set(1.02, 0.15, 0.42);
            group.add(leftPupil);

            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.9, 0.15, -0.35);
            group.add(rightEye);
            const rightPupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
            rightPupil.position.set(1.02, 0.15, -0.42);
            group.add(rightPupil);

            // Tail
            const tailGeometry = new THREE.ConeGeometry(0.5, 1.2, 6);
            const tailMaterial = new THREE.MeshStandardMaterial({
                color: scheme.fin,
                roughness: 0.4,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            const tail = new THREE.Mesh(tailGeometry, tailMaterial);
            tail.position.set(-1.6, 0, 0);
            tail.rotation.z = Math.PI / 2;
            tail.scale.set(1, 0.3, 1.5);
            group.add(tail);

            // Top fin (dorsal)
            const dorsalGeometry = new THREE.ConeGeometry(0.3, 0.8, 4);
            const dorsalMaterial = new THREE.MeshStandardMaterial({
                color: scheme.fin,
                roughness: 0.4,
                side: THREE.DoubleSide
            });
            const dorsalFin = new THREE.Mesh(dorsalGeometry, dorsalMaterial);
            dorsalFin.position.set(0.2, 0.65, 0);
            dorsalFin.scale.set(1.5, 1, 0.3);
            group.add(dorsalFin);

            // Side fins (pectoral)
            const finGeometry = new THREE.ConeGeometry(0.25, 0.7, 4);
            const finMaterial = new THREE.MeshStandardMaterial({
                color: scheme.fin,
                roughness: 0.4,
                side: THREE.DoubleSide
            });

            const leftFin = new THREE.Mesh(finGeometry, finMaterial);
            leftFin.position.set(0.3, -0.2, 0.5);
            leftFin.rotation.x = Math.PI / 4;
            leftFin.scale.set(1, 1, 0.3);
            group.add(leftFin);

            const rightFin = new THREE.Mesh(finGeometry, finMaterial.clone());
            rightFin.position.set(0.3, -0.2, -0.5);
            rightFin.rotation.x = -Math.PI / 4;
            rightFin.scale.set(1, 1, 0.3);
            group.add(rightFin);

            // Mouth
            const mouthGeometry = new THREE.SphereGeometry(0.12, 6, 6);
            const mouthMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const mouth = new THREE.Mesh(mouthGeometry, mouthMaterial);
            mouth.position.set(1.35, -0.1, 0);
            group.add(mouth);

            group.scale.setScalar(scale);
            group.position.copy(position);
            scene.add(group);

            const fish = {
                mesh: group,
                tail: tail,
                leftFin: leftFin,
                rightFin: rightFin,
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 2
                ),
                speed: 1.5 + Math.random() * 2.5,
                tailSpeed: 3 + Math.random() * 4,
                phase: Math.random() * Math.PI * 2,
                targetFood: null,
                avoidanceRadius: 2.5 + Math.random() * 1.5,
                scale: scale,
                wanderTimer: Math.random() * 3,
                wanderDir: new THREE.Vector3((Math.random() - 0.5), (Math.random() - 0.5) * 0.3, (Math.random() - 0.5))
            };

            fishArray.push(fish);
            return fish;
        }

        // Create initial fish
        for (let i = 0; i < 15; i++) {
            const pos = new THREE.Vector3(
                (Math.random() - 0.5) * (AQUARIUM.width - 8),
                2 + Math.random() * (AQUARIUM.height - 6),
                (Math.random() - 0.5) * (AQUARIUM.depth - 6)
            );
            createFish(pos);
        }

        // === BUBBLES ===
        const bubbles = [];

        function createBubble(position) {
            const size = 0.15 + Math.random() * 0.35;
            const geometry = new THREE.SphereGeometry(size, 12, 12);
            const material = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.3,
                roughness: 0.0,
                metalness: 0.0,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });
            const bubble = new THREE.Mesh(geometry, material);
            bubble.position.copy(position || new THREE.Vector3(
                (Math.random() - 0.5) * (AQUARIUM.width - 4),
                Math.random() * AQUARIUM.height,
                (Math.random() - 0.5) * (AQUARIUM.depth - 4)
            ));
            scene.add(bubble);

            const b = {
                mesh: bubble,
                speed: 0.5 + Math.random() * 1.5,
                wobblePhase: Math.random() * Math.PI * 2,
                wobbleSpeed: 1 + Math.random() * 3,
                wobbleAmount: 0.3 + Math.random() * 0.8
            };
            bubbles.push(b);
            return b;
        }

        for (let i = 0; i < 30; i++) {
            createBubble();
        }

        // === FOOD SYSTEM ===
        const foods = [];

        function createFood(position) {
            const geometry = new THREE.SphereGeometry(0.25, 8, 8);
            const material = new THREE.MeshStandardMaterial({
                color: 0x8B4513,
                roughness: 0.8
            });
            const food = new THREE.Mesh(geometry, material);
            food.position.copy(position);
            scene.add(food);

            const f = {
                mesh: food,
                velocityY: 0,
                gravity: -2.5,
                active: true
            };
            foods.push(f);
            return f;
        }

        // === RAYCASTER FOR CLICKING ===
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isMouseDown = false;
        let mouseDownTime = 0;
        let mouseDownPos = { x: 0, y: 0 };

        renderer.domElement.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            mouseDownTime = Date.now();
            mouseDownPos.x = e.clientX;
            mouseDownPos.y = e.clientY;
        });

        renderer.domElement.addEventListener('mouseup', (e) => {
            if (!isMouseDown) return;
            isMouseDown = false;
            const elapsed = Date.now() - mouseDownTime;
            const dx = e.clientX - mouseDownPos.x;
            const dy = e.clientY - mouseDownPos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (elapsed < 300 && dist < 5) {
                // It's a click, not a drag
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);

                // Create food at intersection point or along ray
                const foodPos = new THREE.Vector3();
                const targetPoint = new THREE.Vector3();
                raycaster.ray.at(25, targetPoint);

                // Clamp to aquarium bounds
                foodPos.set(
                    Math.max(-HALF.x + 2, Math.min(HALF.x - 2, targetPoint.x)),
                    Math.max(1, Math.min(AQUARIUM.height - 1, targetPoint.y)),
                    Math.max(-HALF.z + 2, Math.min(HALF.z - 2, targetPoint.z))
                );

                createFood(foodPos);
            }
        });

        // === UI BUTTONS ===
        document.getElementById('btnAddFish').addEventListener('click', () => {
            const pos = new THREE.Vector3(
                (Math.random() - 0.5) * (AQUARIUM.width - 8),
                2 + Math.random() * (AQUARIUM.height - 6),
                (Math.random() - 0.5) * (AQUARIUM.depth - 6)
            );
            createFish(pos);
        });

        document.getElementById('btnAddBubble').addEventListener('click', () => {
            for (let i = 0; i < 10; i++) {
                createBubble(new THREE.Vector3(
                    (Math.random() - 0.5) * (AQUARIUM.width - 4),
                    0.5,
                    (Math.random() - 0.5) * (AQUARIUM.depth - 4)
                ));
            }
        });

        let lightOn = true;
        document.getElementById('btnLight').addEventListener('click', () => {
            lightOn = !lightOn;
            directionalLight.intensity = lightOn ? 1.0 : 0.15;
            ambientLight.intensity = lightOn ? 0.4 : 0.15;
        });

        // === ANIMATION LOOP ===
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            // FPS counter
            frameCount++;
            fpsTime += delta;
            if (fpsTime >= 0.5) {
                document.getElementById('fpsCounter').textContent = Math.round(frameCount / fpsTime);
                frameCount = 0;
                fpsTime = 0;
            }

            const time = now * 0.001;

            // === UPDATE FISH ===
            for (let i = 0; i < fishArray.length; i++) {
                const fish = fishArray[i];
                const pos = fish.mesh.position;

                // Wandering behavior
                fish.wanderTimer -= delta;
                if (fish.wanderTimer <= 0) {
                    fish.wanderDir.set(
                        (Math.random() - 0.5),
                        (Math.random() - 0.5) * 0.4,
                        (Math.random() - 0.5)
                    ).normalize();
                    fish.wanderTimer = 2 + Math.random() * 4;
                }

                // Apply wander force
                const wanderForce = fish.wanderDir.clone().multiplyScalar(0.3);
                fish.velocity.add(wanderForce.multiplyScalar(delta));

                // Food seeking
                let closestFood = null;
                let closestDist = 15;
                for (let f = 0; f < foods.length; f++) {
                    if (!foods[f].active) continue;
                    const dist = pos.distanceTo(foods[f].mesh.position);
                    if (dist < closestDist) {
                        closestDist = dist;
                        closestFood = foods[f];
                    }
                }

                if (closestFood) {
                    const toFood = closestFood.mesh.position.clone().sub(pos).normalize();
                    fish.velocity.add(toFood.multiplyScalar(3.0 * delta));
                    fish.targetFood = closestFood;

                    // Eat food
                    if (pos.distanceTo(closestFood.mesh.position) < 1.5) {
                        closestFood.active = false;
                        scene.remove(closestFood.mesh);
                        fish.scale *= 1.05;
                        fish.mesh.scale.setScalar(fish.scale);
                    }
                } else {
                    fish.targetFood = null;
                }

                // Avoidance between fish
                for (let j = 0; j < fishArray.length; j++) {
                    if (i === j) continue;
                    const other = fishArray[j];
                    const dist = pos.distanceTo(other.mesh.position);
                    if (dist < fish.avoidanceRadius && dist > 0.01) {
                        const repel = pos.clone().sub(other.mesh.position).normalize();
                        repel.multiplyScalar((fish.avoidanceRadius - dist) * 2.0);
                        fish.velocity.add(repel.multiplyScalar(delta));
                    }
                }

                // Boundary avoidance (soft walls)
                const margin = 3;
                if (pos.x > HALF.x - margin) fish.velocity.x -= (pos.x - (HALF.x - margin)) * delta * 2;
                if (pos.x < -HALF.x + margin) fish.velocity.x -= (pos.x - (-HALF.x + margin)) * delta * 2;
                if (pos.y > AQUARIUM.height - margin) fish.velocity.y -= (pos.y - (AQUARIUM.height - margin)) * delta * 2;
                if (pos.y < margin) fish.velocity.y -= (pos.y - margin) * delta * 2;
                if (pos.z > HALF.z - margin) fish.velocity.z -= (pos.z - (HALF.z - margin)) * delta * 2;
                if (pos.z < -HALF.z + margin) fish.velocity.z -= (pos.z - (-HALF.z + margin)) * delta * 2;

                // Speed limiting
                const speed = fish.velocity.length();
                if (speed > fish.speed) {
                    fish.velocity.multiplyScalar(fish.speed / speed);
                }

                // Apply velocity
                pos.add(fish.velocity.clone().multiplyScalar(delta));

                // Hard clamp
                pos.x = Math.max(-HALF.x + 1, Math.min(HALF.x - 1, pos.x));
                pos.y = Math.max(1, Math.min(AQUARIUM.height - 1, pos.y));
                pos.z = Math.max(-HALF.z + 1, Math.min(HALF.z - 1, pos.z));

                // Rotate to face movement direction
                if (speed > 0.1) {
                    const targetAngle = Math.atan2(fish.velocity.x, fish.velocity.z);
                    const currentAngle = fish.mesh.rotation.y;
                    let diff = targetAngle - currentAngle;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    fish.mesh.rotation.y += diff * 3 * delta;

                    // Pitch based on vertical velocity
                    const pitch = Math.atan2(fish.velocity.y, Math.sqrt(fish.velocity.x * fish.velocity.x + fish.velocity.z * fish.velocity.z));
                    fish.mesh.rotation.z += (pitch * 0.5 - fish.mesh.rotation.z) * 2 * delta;
                }

                // Tail animation
                const tailAngle = Math.sin(time * fish.tailSpeed + fish.phase) * 0.6;
                fish.tail.rotation.y = tailAngle;

                // Fin animation
                const finAngle = Math.sin(time * fish.tailSpeed * 0.7 + fish.phase + 1) * 0.4;
                fish.leftFin.rotation.z = finAngle;
                fish.rightFin.rotation.z = -finAngle;

                // Slight body undulation
                fish.mesh.children[0].rotation.y = Math.sin(time * fish.tailSpeed + fish.phase) * 0.05;
            }

            // === UPDATE BUBBLES ===
            for (let i = 0; i < bubbles.length; i++) {
                const b = bubbles[i];
                b.mesh.position.y += b.speed * delta;
                b.mesh.position.x += Math.sin(time * b.wobbleSpeed + b.wobblePhase) * b.wobbleAmount * delta;
                b.mesh.position.z += Math.cos(time * b.wobbleSpeed * 0.7 + b.wobblePhase) * b.wobbleAmount * 0.5 * delta;

                if (b.mesh.position.y > AQUARIUM.height - 1) {
                    b.mesh.position.y = 0.5;
                    b.mesh.position.x = (Math.random() - 0.5) * (AQUARIUM.width - 4);
                    b.mesh.position.z = (Math.random() - 0.5) * (AQUARIUM.depth - 4);
                }
            }

            // === UPDATE FOOD ===
            for (let i = foods.length - 1; i >= 0; i--) {
                const f = foods[i];
                if (!f.active) {
                    foods.splice(i, 1);
                    continue;
                }
                f.velocityY += f.gravity * delta;
                f.mesh.position.y += f.velocityY * delta;

                // Slight horizontal drift
                f.mesh.position.x += Math.sin(time * 2 + i) * 0.3 * delta;
                f.mesh.position.z += Math.cos(time * 1.5 + i) * 0.2 * delta;

                if (f.mesh.position.y < 0.3) {
                    scene.remove(f.mesh);
                    foods.splice(i, 1);
                }
            }

            // === UPDATE SEAWEED ===
            for (let i = 0; i < seaweeds.length; i++) {
                const sw = seaweeds[i];
                sw.group.rotation.x = Math.sin(time * sw.speed + sw.phase) * 0.08;
                sw.group.rotation.z = Math.cos(time * sw.speed * 0.7 + sw.phase) * 0.06;
            }

            // === UPDATE UI STATS ===
            document.getElementById('fishCount').textContent = fishArray.length;
            document.getElementById('bubbleCount').textContent = bubbles.length;
            document.getElementById('foodCount').textContent = foods.filter(f => f.active).length;

            // === RENDER ===
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // === RESIZE ===
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
