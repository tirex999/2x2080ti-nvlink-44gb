<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#1a2a3a}
canvas{display:block}
#ui{position:fixed;top:20px;left:20px;z-index:100;max-width:280px}
#title{font-size:2.2rem;font-weight:300;color:#fff;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.5)}

.panel{background:rgba(10,20,35,.75);backdrop-filter:blur(12px);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid rgba(255,255,255,.1)}
.panel h3{font-size:.75rem;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.5);margin-bottom:10px}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:7px 12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:6px;font-size:.75rem;cursor:pointer;transition:all .2s}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.active{background:rgba(100,200,255,.3);border-color:rgba(100,200,255,.5)}

.slider-row label{font-size:.7rem;color:rgba(255,255,255,.7);min-width:50px}

#audio-panel{display:flex;align-items:center;gap:8px}
#collapse-btn{display:none;position:fixed;top:20px;left:20px;z-index:101;background:rgba(10,20,35,.8);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 12px;border-radius:8px;font-size:1rem;cursor:pointer}

#ui.collapsed .panel{display:none}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ─── GLOBALS ────────────────────────────────────────────────────────────
let scene, camera, renderer, controls, clock;
let paused = false, timeOfDay = 0.3, windStrength = 0.4, tideLevel = 2.5;
let kayakState = 'moored', kayakAngle = 0;
let rayJumping = false, rayJumpTime = 0;
let musicOn = false, audioCtx = null, masterGain = null;
let sunLight, ambientLight, hemiLight, cabinLight, lanternLights = [];
let waterSurface, seabed, glassFront, glassRight;
let kayak, rays = [], fishMesh, bubbleMesh, foamMesh;
let treeTops = [], plantsUnderwater = [];
let splashParticles = [], rippleRings = [];
let cameraTarget = new THREE.Vector3(0, 2, 0);
let cameraGoal = {pos: new THREE.Vector3(16, 14, 16), target: new THREE.Vector3(0, 2, 0)};
let cameraTransition = 1;

const BASIN = {w: 26, d: 22, h: 10};
const ISLAND_R = 7;
const WATER_BASE = 2.5;

// ─── INIT ───────────────────────────────────────────────────────────────
function init() {
  clock = new THREE.Clock();
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 40, 80);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(16, 14, 16);

  renderer = new THREE.WebGLRenderer({antialias: true, alpha: false});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 2, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 5;
  controls.maxDistance = 50;
  controls.maxPolarAngle = Math.PI * 0.85;

  setupLighting();
  buildBasin();
  buildIsland();
  buildCabin();
  buildPier();
  buildWater();
  buildUnderwaterLife();
  buildKayak();
  buildDetails();
  setupUI();
  animate();
}

// ─── LIGHTING ───────────────────────────────────────────────────────────
function setupLighting() {
  ambientLight = new THREE.AmbientLight(0x404060, 0.4);
  scene.add(ambientLight);

  hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x8B7355, 0.6);
  scene.add(hemiLight);

  sunLight = new THREE.DirectionalLight(0xfff4e0, 1.2);
  sunLight.position.set(10, 15, 8);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  sunLight.shadow.camera.near = 1;
  sunLight.shadow.camera.far = 50;
  sunLight.shadow.camera.left = -18;
  sunLight.shadow.camera.right = 18;
  sunLight.shadow.camera.top = 18;
  sunLight.shadow.camera.bottom = -18;
  sunLight.shadow.bias = -0.001;
  scene.add(sunLight);

  cabinLight = new THREE.PointLight(0xffaa44, 0, 8);
  cabinLight.position.set(0, 3.5, 1);
  scene.add(cabinLight);
}

function updateLighting(t) {
  // t: 0=night, 0.5=sunset, 1=day
  const dayColor = new THREE.Color(0xfff4e0);
  const sunsetColor = new THREE.Color(0xff8844);
  const nightColor = new THREE.Color(0x223355);
  const skyDay = new THREE.Color(0x87CEEB);
  const skySunset = new THREE.Color(0xff7744);
  const skyNight = new THREE.Color(0x0a1525);

  let sunColor, skyColor, sunIntensity, ambIntensity;
  if (t < 0.5) {
    const f = t * 2;
    sunColor = nightColor.clone().lerp(sunsetColor, f);
    skyColor = skyNight.clone().lerp(skySunset, f);
    sunIntensity = 0.1 + f * 1.2;
    ambIntensity = 0.15 + f * 0.25;
  } else {
    const f = (t - 0.5) * 2;
    sunColor = sunsetColor.clone().lerp(dayColor, f);
    skyColor = skySunset.clone().lerp(skyDay, f);
    sunIntensity = 1.3 + f * 0.4;
    ambIntensity = 0.4 + f * 0.3;
  }

  sunLight.color.copy(sunColor);
  sunLight.intensity = sunIntensity;
  sunLight.position.set(10, 5 + t * 12, 8);
  ambientLight.intensity = ambIntensity;
  hemiLight.color.copy(skyColor);
  hemiLight.groundColor.copy(new THREE.Color(0x8B7355).lerp(new THREE.Color(0x222233), 1 - t));
  scene.background.copy(skyColor);
  scene.fog.color.copy(skyColor);

  // Cabin & lantern glow at night
  const glow = Math.max(0, 1 - t * 2);
  cabinLight.intensity = glow * 2.5;
  lanternLights.forEach(l => l.intensity = glow * 1.5);
}

// ─── BASIN (DIORAMA CONTAINER) ──────────────────────────────────────────
function buildBasin() {
  const {w, d, h} = BASIN;

  // Solid back wall
  const backGeo = new THREE.BoxGeometry(w, h, 0.3);
  const wallMat = new THREE.MeshStandardMaterial({color: 0x2a3a4a, roughness: 0.8});
  const back = new THREE.Mesh(backGeo, wallMat);
  back.position.set(0, h / 2, -d / 2);
  back.receiveShadow = true;
  scene.add(back);

  // Solid left wall
  const leftGeo = new THREE.BoxGeometry(0.3, h, d);
  const left = new THREE.Mesh(leftGeo, wallMat);
  left.position.set(-w / 2, h / 2, 0);
  left.receiveShadow = true;
  scene.add(left);

  // Glass front panel
  const glassMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: {uTide: {value: WATER_BASE}},
    vertexShader: `varying vec3 vPos; void main(){vPos=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader: `uniform float uTide; varying vec3 vPos;
    void main(){
      float below=smoothstep(uTide+0.15,uTide-0.15,vPos.y);
      vec3 col=mix(vec3(0.92,0.96,1.0),vec3(0.25,0.55,0.65),below*0.5);
      float a=mix(0.04,0.2,below);
      // water line highlight
      float line=smoothstep(0.08,0.0,abs(vPos.y-uTide));
      col+=vec3(1.0)*line*0.5; a+=line*0.3;
      gl_FragColor=vec4(col,a);
    }`
  });
  const gfGeo = new THREE.PlaneGeometry(w, h);
  glassFront = new THREE.Mesh(gfGeo, glassMat);
  glassFront.position.set(0, h / 2, d / 2);
  glassFront.renderOrder = 5;
  scene.add(glassFront);

  // Glass right panel
  const grGeo = new THREE.PlaneGeometry(d, h);
  glassRight = new THREE.Mesh(grGeo, glassMat.clone());
  glassRight.position.set(w / 2, h / 2, 0);
  glassRight.rotation.y = -Math.PI / 2;
  glassRight.renderOrder = 5;
  scene.add(glassRight);

  // Frame edges
  const frameMat = new THREE.MeshStandardMaterial({color: 0x4a3a2a, roughness: 0.6});
  const frameGeo = new THREE.BoxGeometry(0.2, h, 0.2);
  [[-w/2, h/2, d/2], [w/2, h/2, d/2], [w/2, h/2, -d/2], [-w/2, h/2, -d/2]].forEach(p => {
    const f = new THREE.Mesh(frameGeo, frameMat);
    f.position.set(...p);
    scene.add(f);
  });
  // Top frame
  const topFrameGeo = new THREE.BoxGeometry(w, 0.15, 0.2);
  const tf1 = new THREE.Mesh(topFrameGeo, frameMat);
  tf1.position.set(0, h, d/2);
  scene.add(tf1);
  const tf2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, d), frameMat);
  tf2.position.set(w/2, h, 0);
  scene.add(tf2);
}

// ─── ISLAND TERRAIN ─────────────────────────────────────────────────────
function islandHeight(x, z) {
  const d = Math.sqrt(x * x + z * z);
  if (d > ISLAND_R) return -0.5;
  const h = Math.max(0, (1 - d / ISLAND_R)) * 4;
  // Add some noise
  const n = Math.sin(x * 2.3) * Math.cos(z * 1.7) * 0.3 + Math.sin(x * 5.1 + z * 3.2) * 0.15;
  return h + n * (1 - d / ISLAND_R);
}

function buildIsland() {
  // Main terrain
  const geo = new THREE.BufferGeometry();
  const segs = 60;
  const verts = [], indices = [], colors = [];
  const cSand = new THREE.Color(0xd4a95a);
  const cGrass = new THREE.Color(0x4a8c3f);
  const cDirt = new THREE.Color(0x6b5a3a);

  for (let i = 0; i <= segs; i++) {
    for (let j = 0; j <= segs; j++) {
      const x = (i / segs - 0.5) * 18;
      const z = (j / segs - 0.5) * 18;
      const h = islandHeight(x, z);
      verts.push(x, h, z);
      const d = Math.sqrt(x * x + z * z);
      let c;
      if (h < 0.5) c = cSand;
      else if (h < 2) c = cSand.clone().lerp(cDirt, (h - 0.5) / 1.5);
      else c = cDirt.clone().lerp(cGrass, Math.min(1, (h - 2) / 1.5));
      colors.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < segs; j++) {
      const a = i * (segs + 1) + j, b = a + 1, c2 = a + (segs + 1), d2 = c2 + 1;
      indices.push(a, c2, b, b, c2, d2);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const terrainMat = new THREE.MeshStandardMaterial({vertexColors: true, roughness: 0.9});
  const terrain = new THREE.Mesh(geo, terrainMat);
  terrain.receiveShadow = true;
  terrain.castShadow = true;
  scene.add(terrain);

  // Rocks (instanced)
  const rockGeo = new THREE.DodecahedronGeometry(0.4, 0);
  const rockMat = new THREE.MeshStandardMaterial({color: 0x7a7a72, roughness: 0.9});
  const rockCount = 20;
  const rocks = new THREE.InstancedMesh(rockGeo, rockMat, rockCount);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < rockCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 4 + Math.random() * 3.5;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const h = islandHeight(x, z);
    dummy.position.set(x, h + 0.1, z);
    dummy.scale.setScalar(0.5 + Math.random() * 1.2);
    dummy.rotation.set(Math.random(), Math.random() * Math.PI, Math.random());
    dummy.updateMatrix();
    rocks.setMatrixAt(i, dummy.matrix);
  }
  rocks.castShadow = true;
  scene.add(rocks);

  // Trees
  const trunkGeo = new THREE.CylinderGeometry(0.08, 0.12, 1.2, 6);
  const trunkMat = new THREE.MeshStandardMaterial({color: 0x5a3a1a, roughness: 0.9});
  const leafGeo = new THREE.SphereGeometry(0.7, 8, 6);
  const leafMat = new THREE.MeshStandardMaterial({color: 0x3a7a2a, roughness: 0.8});

  const treePositions = [
    [-3, 2.5, -1], [2, 2.8, -2], [-1, 3.2, 2.5], [3, 2.2, 1.5],
    [-4, 2.0, 1], [1, 2.6, -3.5], [-2.5, 2.4, -3]
  ];
  treePositions.forEach(([x, _, z]) => {
    const h = islandHeight(x, z);
    if (h < 1.5) return;
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.set(x, h + 0.6, z);
    trunk.castShadow = true;
    scene.add(trunk);
    const leaves = new THREE.Mesh(leafGeo, leafMat);
    leaves.position.set(x, h + 1.6, z);
    leaves.scale.set(1, 0.8, 1);
    leaves.castShadow = true;
    treeTops.push(leaves);
    scene.add(leaves);
  });

  // Grass tufts (instanced)
  const grassGeo = new THREE.ConeGeometry(0.08, 0.4, 4);
  const grassMat = new THREE.MeshStandardMaterial({color: 0x5a9a3a, roughness: 0.9});
  const grassCount = 120;
  const grass = new THREE.InstancedMesh(grassGeo, grassMat, grassCount);
  for (let i = 0; i < grassCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 5.5;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const h = islandHeight(x, z);
    if (h < 1.2) { i--; continue; }
    dummy.position.set(x, h + 0.2, z);
    dummy.scale.set(1, 0.8 + Math.random() * 0.6, 1);
    dummy.rotation.set(0, Math.random() * Math.PI, (Math.random() - 0.5) * 0.3);
    dummy.updateMatrix();
    grass.setMatrixAt(i, dummy.matrix);
  }
  scene.add(grass);
}

// ─── CABIN ──────────────────────────────────────────────────────────────
function buildCabin() {
  const cx = 0, cz = 0.5, baseH = islandHeight(cx, cz);
  const group = new THREE.Group();
  group.position.set(cx, baseH, cz);

  // A-frame walls
  const wallMat = new THREE.MeshStandardMaterial({color: 0x8B6914, roughness: 0.8});
  const roofMat = new THREE.MeshStandardMaterial({color: 0xB87333, roughness: 0.4, metalness: 0.6});

  // Floor
  const floor = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.1, 2.2), wallMat);
  floor.position.y = 0.05;
  floor.castShadow = true; floor.receiveShadow = true;
  group.add(floor);

  // A-frame shape (triangular prism)
  const shape = new THREE.Shape();
  shape.moveTo(-1.2, 0);
  shape.lineTo(0, 2.2);
  shape.lineTo(1.2, 0);
  shape.lineTo(-1.2, 0);
  const extrudeSettings = {depth: 2.2, bevelEnabled: false};
  const frameGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
  frameGeo.translate(0, 0, -1.1);

  // Front wall (with window cutout simulated by emissive plane)
  const frontWall = new THREE.Mesh(frameGeo, wallMat);
  frontWall.position.y = 0.1;
  frontWall.castShadow = true;
  group.add(frontWall);

  // Roof overlay (slightly larger, copper colored)
  const roofShape = new THREE.Shape();
  roofShape.moveTo(-1.3, 0);
  roofShape.lineTo(0, 2.35);
  roofShape.lineTo(1.3, 0);
  roofShape.lineTo(-1.3, 0);
  const roofGeo = new THREE.ExtrudeGeometry(roofShape, {depth: 2.4, bevelEnabled: false});
  roofGeo.translate(0, 0, -1.2);
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.y = 0.15;
  roof.castShadow = true;
  group.add(roof);

  // Windows (emissive planes)
  const winMat = new THREE.MeshStandardMaterial({color: 0xffcc66, emissive: 0xffaa33, emissiveIntensity: 0.8});
  const winGeo = new THREE.PlaneGeometry(0.5, 0.7);
  const win1 = new THREE.Mesh(winGeo, winMat);
  win1.position.set(0.35, 1.0, 1.11);
  group.add(win1);
  const win2 = new THREE.Mesh(winGeo, winMat);
  win2.position.set(-0.35, 1.0, 1.11);
  group.add(win2);
  // Side windows
  const win3 = new THREE.Mesh(winGeo, winMat);
  win3.position.set(1.21, 0.8, 0);
  win3.rotation.y = Math.PI / 2;
  group.add(win3);
  const win4 = new THREE.Mesh(winGeo, winMat);
  win4.position.set(-1.21, 0.8, 0);
  win4.rotation.y = -Math.PI / 2;
  group.add(win4);

  // Deck
  const deckMat = new THREE.MeshStandardMaterial({color: 0x9a7a4a, roughness: 0.85});
  const deck = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.08, 1.5), deckMat);
  deck.position.set(0, 0.02, 2.0);
  deck.receiveShadow = true; deck.castShadow = true;
  group.add(deck);

  // Deck railing posts
  const postGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.6, 4);
  [[-1.5, 2.7], [1.5, 2.7], [-1.5, 1.3], [1.5, 1.3]].forEach(([x, z]) => {
    const p = new THREE.Mesh(postGeo, deckMat);
    p.position.set(x, 0.35, z);
    group.add(p);
  });

  scene.add(group);
  cabinLight.position.set(cx, baseH + 1.5, cz);
}

// ─── PIER ───────────────────────────────────────────────────────────────
function buildPier() {
  const woodMat = new THREE.MeshStandardMaterial({color: 0x7a5a2a, roughness: 0.85});
  const pierGroup = new THREE.Group();
  const startZ = 5;
  const pierLen = 7;

  // Planks
  const plankGeo = new THREE.BoxGeometry(1.2, 0.08, 0.3);
  for (let i = 0; i < 20; i++) {
    const plank = new THREE.Mesh(plankGeo, woodMat);
    plank.position.set(0, 2.8, startZ + i * 0.35);
    plank.castShadow = true; plank.receiveShadow = true;
    pierGroup.add(plank);
  }

  // Posts
  const postGeo = new THREE.CylinderGeometry(0.08, 0.1, 3.5, 6);
  for (let i = 0; i < 5; i++) {
    const z = startZ + i * 1.4;
    [-0.55, 0.55].forEach(x => {
      const post = new THREE.Mesh(postGeo, woodMat);
      post.position.set(x, 1.0, z);
      post.castShadow = true;
      pierGroup.add(post);
    });
  }

  // Ladder
  const ladderMat = new THREE.MeshStandardMaterial({color: 0x6a4a1a, roughness: 0.8});
  const rungGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.9, 4);
  for (let i = 0; i < 4; i++) {
    const rung = new THREE.Mesh(rungGeo, ladderMat);
    rung.position.set(0.7, 2.2 - i * 0.45, startZ + 3);
    rung.rotation.z = Math.PI / 2;
    pierGroup.add(rung);
  }
  // Ladder sides
  const sideGeo = new THREE.CylinderGeometry(0.03, 0.03, 2.2, 4);
  [-0.4, 0.4].forEach(offset => {
    const side = new THREE.Mesh(sideGeo, ladderMat);
    side.position.set(0.7 + offset * 0.5, 1.3, startZ + 3);
    side.rotation.x = 0.1;
    pierGroup.add(side);
  });

  // Lanterns
  const lanternGeo = new THREE.SphereGeometry(0.12, 8, 6);
  const lanternMat = new THREE.MeshStandardMaterial({color: 0xffdd88, emissive: 0xffaa44, emissiveIntensity: 0});
  const lanternPositions = [[0.6, 3.1, startZ + 1], [-0.6, 3.1, startZ + 3], [0.6, 3.1, startZ + 5]];
  lanternPositions.forEach(([x, y, z]) => {

// ─── WATER SYSTEM ───────────────────────────────────────────────────────
function buildWater() {
  // Water surface plane
  const waterGeo = new THREE.PlaneGeometry(BASIN.w - 0.5, BASIN.d - 0.5, 80, 80);
  const waterMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: {
      uTime: {value: 0}, uWind: {value: 0.4}, uTide: {value: WATER_BASE},
      uIslandCenter: {value: new THREE.Vector2(0, 0)}, uIslandRadius: {value: ISLAND_R}
    },
    vertexShader: `
      uniform float uTime; uniform float uWind;
      varying vec2 vUv; varying vec3 vWorldPos; varying float vWave;
      void main(){
        vUv=uv;
        vec3 pos=position;
        float w1=sin(pos.x*0.8+uTime*1.5)*0.12*uWind;
        float w2=sin(pos.y*1.1+uTime*1.0)*0.08*uWind;
        float w3=sin((pos.x+pos.y)*0.5+uTime*2.0)*0.06*uWind;
        float w4=sin(pos.x*2.0-pos.y*1.5+uTime*3.0)*0.04*uWind;
        pos.z+=w1+w2+w3+w4;
        vWave=w1+w2+w3+w4;
        vWorldPos=vec3(pos.x,0.0,pos.y);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.0);
      }`,
    fragmentShader: `
      uniform float uTime; uniform float uWind; uniform vec2 uIslandCenter; uniform float uIslandRadius;
      varying vec2 vUv; varying vec3 vWorldPos; varying float vWave;
      void main(){
        float dist=length(vWorldPos.xz-uIslandCenter);
        float foam=smoothstep(uIslandRadius+0.5,uIslandRadius-1.0,dist);
        foam*=0.5+0.5*sin(vWorldPos.x*4.0+uTime*3.0)*sin(vWorldPos.y*3.5+uTime*2.5);
        foam*=uWind*1.5+0.3;
        vec3 deep=vec3(0.1,0.45,0.55);
        vec3 shallow=vec3(0.3,0.7,0.65);
        float depthFactor=smoothstep(uIslandRadius+2.0,uIslandRadius-2.0,dist);
        vec3 col=mix(deep,shallow,depthFactor);
        col+=vec3(0.1,0.15,0.1)*vWave*3.0;
        col=mix(col,vec3(0.95,0.98,1.0),clamp(foam,0.0,1.0)*0.7);
        float alpha=0.55+foam*0.3+abs(vWave)*2.0;
        alpha=clamp(alpha,0.3,0.85);
        gl_FragColor=vec4(col,alpha);
      }`
  });
  waterSurface = new THREE.Mesh(waterGeo, waterMat);
  waterSurface.rotation.x = -Math.PI / 2;
  waterSurface.position.y = WATER_BASE;
  waterSurface.renderOrder = 3;
  scene.add(waterSurface);

  // Seabed with caustics
  const seabedGeo = new THREE.PlaneGeometry(BASIN.w - 0.5, BASIN.d - 0.5, 40, 40);
  const seabedMat = new THREE.ShaderMaterial({
    uniforms: {uTime: {value: 0}, uWind: {value: 0.4}},
    vertexShader: `varying vec2 vUv; varying vec3 vPos;
    void main(){vUv=uv;vPos=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader: `
      uniform float uTime; uniform float uWind; varying vec2 vUv; varying vec3 vPos;
      void main(){
        vec3 sand=vec3(0.72,0.62,0.45);
        // Caustic pattern
        float c=0.0;
        for(int i=0;i<4;i++){
          float fi=float(i);
          vec2 p=vUv*(4.0+fi*2.0)+uTime*(0.2+fi*0.08);
          c+=sin(p.x*3.0+sin(p.y*2.0+uTime*0.3))*0.25;
        }
        c=c*uWind*0.4+0.05;
        // Depth darkening
        float depth=smoothstep(0.0,1.0,vUv.y);
        vec3 col=sand+vec3(c*0.8,c*0.9,c*0.6);
        col*=mix(0.6,1.0,depth);
        gl_FragColor=vec4(col,1.0);
      }`
  });
  seabed = new THREE.Mesh(seabedGeo, seabedMat);
  seabed.rotation.x = -Math.PI / 2;
  seabed.position.y = 0.05;
  seabed.receiveShadow = true;
  scene.add(seabed);

  // Foam ring at shoreline
  const foamGeo = new THREE.SphereGeometry(0.08, 4, 4);
  const foamMat = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.6});
  const foamCount = 80;
  foamMesh = new THREE.InstancedMesh(foamGeo, foamMat, foamCount);
  foamMesh.renderOrder = 4;
  scene.add(foamMesh);
}

function updateFoam(time) {
  const dummy = new THREE.Object3D();
  for (let i = 0; i < 80; i++) {
    const a = (i / 80) * Math.PI * 2 + time * 0.1;
    const r = ISLAND_R - 0.3 + Math.sin(a * 5 + time * 2) * 0.4;
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    dummy.position.set(x, tideLevel + 0.05, z);
    dummy.scale.setScalar(0.5 + Math.sin(time * 3 + i) * 0.3);
    dummy.updateMatrix();
    foamMesh.setMatrixAt(i, dummy.matrix);
  }
  foamMesh.instanceMatrix.needsUpdate = true;
}

// ─── UNDERWATER LIFE ────────────────────────────────────────────────────
function createRayGeometry() {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0.7);
  shape.bezierCurveTo(0.4, 0.4, 1.0, 0.3, 1.6, 0.05);
  shape.bezierCurveTo(1.0, -0.1, 0.3, -0.15, 0.05, -0.15);
  shape.lineTo(0.03, -1.4);
  shape.lineTo(-0.03, -1.4);
  shape.lineTo(-0.05, -0.15);
  shape.bezierCurveTo(-0.3, -0.15, -1.0, -0.1, -1.6, 0.05);
  shape.bezierCurveTo(-1.0, 0.3, -0.4, 0.4, 0, 0.7);
  const geo = new THREE.ShapeGeometry(shape, 16);
  // Flip to XZ plane
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    pos.setX(i, x);
    pos.setY(i, 0);
    pos.setZ(i, y);
  }
  geo.computeVertexNormals();
  return geo;
}

function buildUnderwaterLife() {
  // Rays
  const rayGeo = createRayGeometry();
  const rayMat = new THREE.MeshStandardMaterial({color: 0x2a4a5a, roughness: 0.6, side: THREE.DoubleSide});
  const rayPositions = [[-4, 1.2, -3], [3, 1.5, -4], [-2, 1.0, 4]];
  rayPositions.forEach(([x, y, z], idx) => {
    const ray = new THREE.Mesh(rayGeo, rayMat.clone());
    ray.position.set(x, y, z);
    ray.scale.setScalar(1.2 + idx * 0.3);
    ray.userData = {basePos: new THREE.Vector3(x, y, z), phase: idx * 2.1, speed: 0.3 + idx * 0.1};
    rays.push(ray);
    scene.add(ray);
  });

  // Fish school (instanced)
  const fishGeo = new THREE.BoxGeometry(0.2, 0.08, 0.06);
  const fishMat = new THREE.MeshStandardMaterial({color: 0xff8844, roughness: 0.5});
  const fishCount = 40;
  fishMesh = new THREE.InstancedMesh(fishGeo, fishMat, fishCount);
  fishMesh.userData = {offsets: [], radii: [], speeds: [], centers: []};
  for (let i = 0; i < fishCount; i++) {
    fishMesh.userData.offsets.push(Math.random() * Math.PI * 2);
    fishMesh.userData.radii.push(3 + Math.random() * 4);
    fishMesh.userData.speeds.push(0.3 + Math.random() * 0.4);
    fishMesh.userData.centers.push(new THREE.Vector3(
      (Math.random() - 0.5) * 6,
      0.8 + Math.random() * 1.5,
      (Math.random() - 0.5) * 6
    ));
  }
  scene.add(fishMesh);

  // Aquatic plants (instanced)
  const plantGeo = new THREE.ConeGeometry(0.15, 1.2, 5);
  const plantMat = new THREE.MeshStandardMaterial({color: 0x2a6a3a, roughness: 0.8, transparent: true, opacity: 0.85});
  const plantCount = 30;
  const plants = new THREE.InstancedMesh(plantGeo, plantMat, plantCount);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < plantCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 3 + Math.random() * 7;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.sqrt(x * x + z * z) < ISLAND_R - 1) { i--; continue; }
    dummy.position.set(x, 0.6, z);
    dummy.scale.set(1, 0.8 + Math.random() * 1.2, 1);
    dummy.rotation.set(0, Math.random() * Math.PI, (Math.random() - 0.5) * 0.4);
    dummy.updateMatrix();
    plants.setMatrixAt(i, dummy.matrix);
  }
  scene.add(plants);
  plantsUnderwater.push(plants);

  // Underwater rocks
  const uRockGeo = new THREE.DodecahedronGeometry(0.5, 0);
  const uRockMat = new THREE.MeshStandardMaterial({color: 0x4a5a5a, roughness: 0.9});
  const uRockCount = 15;
  const uRocks = new THREE.InstancedMesh(uRockGeo, uRockMat, uRockCount);
  for (let i = 0; i < uRockCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 4 + Math.random() * 6;
    dummy.position.set(Math.cos(a) * r, 0.2, Math.sin(a) * r);
    dummy.scale.setScalar(0.4 + Math.random() * 0.8);
    dummy.rotation.set(Math.random(), Math.random() * Math.PI, Math.random());
    dummy.updateMatrix();
    uRocks.setMatrixAt(i, dummy.matrix);
  }
  uRocks.castShadow = true;
  scene.add(uRocks);

  // Bubbles
  const bubbleGeo = new THREE.SphereGeometry(0.04, 6, 4);
  const bubbleMat = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.4});
  const bubbleCount = 40;
  bubbleMesh = new THREE.InstancedMesh(bubbleGeo, bubbleMat, bubbleCount);
  bubbleMesh.userData = {data: []};
  for (let i = 0; i < bubbleCount; i++) {
    bubbleMesh.userData.data.push({
      x: (Math.random() - 0.5) * 16,
      z: (Math.random() - 0.5) * 14,
      y: Math.random() * 2,
      speed: 0.3 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2
    });
  }
  scene.add(bubbleMesh);
}

function updateUnderwaterLife(time, dt) {
  // Rays
  rays.forEach(ray => {
    const d = ray.userData;
    const pos = ray.position;
    pos.x = d.basePos.x + Math.sin(time * d.speed) * 3;
    pos.z = d.basePos.z + Math.cos(time * d.speed * 0.7) * 3;
    pos.y = Math.max(0.5, Math.min(tideLevel - 0.5, d.basePos.y + Math.sin(time * 0.5 + d.phase) * 0.3));
    ray.rotation.y = Math.atan2(Math.cos(time * d.speed) * 3 * d.speed, -Math.sin(time * d.speed * 0.7) * 3 * d.speed * 0.7);
    // Wing undulation
    const posAttr = ray.geometry.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i), z = posAttr.getZ(i);
      const wingFactor = Math.abs(x) / 1.6;
      posAttr.setY(i, Math.sin(time * 3 + d.phase + x * 2) * 0.1 * wingFactor);
    }
    posAttr.needsUpdate = true;
  });

  // Fish
  const dummy = new THREE.Object3D();
  for (let i = 0; i < 40; i++) {
    const o = fishMesh.userData.offsets[i];
    const r = fishMesh.userData.radii[i];
    const s = fishMesh.userData.speeds[i];
    const c = fishMesh.userData.centers[i];
    const angle = time * s + o;
    dummy.position.set(
      c.x + Math.cos(angle) * r,
      c.y + Math.sin(time * 1.5 + o) * 0.3,
      c.z + Math.sin(angle) * r
    );
    dummy.rotation.y = angle + Math.PI / 2;
    dummy.rotation.z = Math.sin(time * 4 + o) * 0.1;
    dummy.scale.setScalar(0.8 + Math.sin(o) * 0.4);
    dummy.updateMatrix();
    fishMesh.setMatrixAt(i, dummy.matrix);
  }
  fishMesh.instanceMatrix.needsUpdate = true;

  // Bubbles
  for (let i = 0; i < 40; i++) {
    const b = bubbleMesh.userData.data[i];
    b.y += b.speed * dt;
    if (b.y > tideLevel - 0.2) {
      b.y = 0.1;
      b.x = (Math.random() - 0.5) * 16;
      b.z = (Math.random() - 0.5) * 14;
    }
    dummy.position.set(b.x + Math.sin(time * 2 + b.phase) * 0.2, b.y, b.z);
    dummy.scale.setScalar(0.5 + Math.sin(time * 3 + b.phase) * 0.3);
    dummy.updateMatrix();
    bubbleMesh.setMatrixAt(i, dummy.matrix);
  }
  bubbleMesh.instanceMatrix.needsUpdate = true;

  // Aquatic plants sway
  plantsUnderwater.forEach(plants => {
    const mat = new THREE.Matrix4();
    const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();
    for (let i = 0; i < 30; i++) {
      plants.getMatrixAt(i, mat);
      mat.decompose(pos, quat, scl);
      const sway = Math.sin(time * 1.5 + i * 0.7) * 0.1 * windStrength;
      quat.setFromEuler(new THREE.Euler(sway, 0, sway * 0.5));
      mat.compose(pos, quat, scl);
      plants.setMatrixAt(i, mat);
    }
    plants.instanceMatrix.needsUpdate = true;
  });
}

// ─── RAY LEAP ───────────────────────────────────────────────────────────
function triggerRayLeap() {
  if (rayJumping) return;
  rayJumping = true;
  rayJumpTime = 0;
}

function updateRayLeap(dt) {
  if (!rayJumping) return;
  rayJumpTime += dt;
  const ray = rays[0];
  const duration = 3.5;
  const t = rayJumpTime / duration;

  if (t >= 1) {
    rayJumping = false;
    ray.position.copy(ray.userData.basePos);
    ray.rotation.set(0, 0, 0);
    return;
  }

  // Jump arc
  const jumpHeight = 4;
  const startY = 1.2;
  const peakY = startY + jumpHeight;
  let y;
  if (t < 0.4) {
    // Rising
    const lt = t / 0.4;
    y = startY + (peakY - startY) * Math.sin(lt * Math.PI / 2);
  } else if (t < 0.6) {
    // Airborne turn
    y = peakY + Math.sin((t - 0.4) / 0.2 * Math.PI) * 0.5;
  } else {
    // Falling
    const lt = (t - 0.6) / 0.4;
    y = peakY - (peakY - startY) * lt * lt;
  }

  ray.position.y = y;
  ray.position.x = ray.userData.basePos.x + Math.sin(t * Math.PI) * 2;
  ray.position.z = ray.userData.basePos.z + Math.cos(t * Math.PI * 0.5) * 1;

  // Rotation during jump
  if (t < 0.4) ray.rotation.x = -Math.sin(t / 0.4 * Math.PI / 2) * 0.5;
  else if (t < 0.6) ray.rotation.x = -0.5 + (t - 0.4) / 0.2 * 1.0;
  else ray.rotation.x = 0.5 - (t - 0.6) / 0.4 * 0.5;

  // Splash at entry/exit
  if (t > 0.35 && t < 0.45 && !ray.userData.splashed) {
    createSplash(ray.position.x, tideLevel, ray.position.z);
    ray.userData.splashed = true;
  }
  if (t > 0.85 && t < 0.95 && !ray.userData.splashed2) {
    createSplash(ray.position.x, tideLevel, ray.position.z);
    ray.userData.splashed2 = true;
  }
  if (t > 0.5) { ray.userData.splashed = false; }
  if (t > 0.95) { ray.userData.splashed2 = false; }
}

function createSplash(x, y, z) {
  // Droplets
  for (let i = 0; i < 12; i++) {
    const geo = new THREE.SphereGeometry(0.05, 4, 4);
    const mat = new THREE.MeshBasicMaterial({color: 0xaaddff, transparent: true, opacity: 0.8});
    const drop = new THREE.Mesh(geo, mat);
    drop.position.set(x, y, z);
    drop.userData = {
      vel: new THREE.Vector3((Math.random() - 0.5) * 3, 2 + Math.random() * 3, (Math.random() - 0.5) * 3),
      life: 1.0
    };
    scene.add(drop);
    splashParticles.push(drop);
  }
  // Ripple ring
  const ringGeo = new THREE.RingGeometry(0.1, 0.3, 16);
  const ringMat = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide});
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.set(x, y + 0.02, z);
  ring.rotation.x = -Math.PI / 2;
  ring.userData = {life: 1.0};
  scene.add(ring);
  rippleRings.push(ring);
}

function updateSplash(dt) {
  for (let i = splashParticles.length - 1; i >= 0; i--) {
    const p = splashParticles[i];
    p.userData.life -= dt * 1.5;
    p.userData.vel.y -= 9.8 * dt;
    p.position.add(p.userData.vel.clone().multiplyScalar(dt));
    p.material.opacity = p.userData.life * 0.8;
    if (p.userData.life <= 0) {
      scene.remove(p);
      p.geometry.dispose();
      p.material.dispose();
      splashParticles.splice(i, 1);
    }
  }
  for (let i = rippleRings.length - 1; i >= 0; i--) {
    const r = rippleRings[i];
    r.userData.life -= dt * 0.8;
    const scale = (1 - r.userData.life) * 5 + 0.5;
    r.scale.setScalar(scale);
    r.material.opacity = r.userData.life * 0.5;
    if (r.userData.life <= 0) {
      scene.remove(r);
      r.geometry.dispose();
      r.material.dispose();
      rippleRings.splice(i, 1);
    }
  }
}

// ─── KAYAK ──────────────────────────────────────────────────────────────
function buildKayak() {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0.8);
  shape.bezierCurveTo(0.25, 0.6, 0.3, 0.2, 0.3, 0);
  shape.bezierCurveTo(0.3, -0.2, 0.25, -0.6, 0, -0.8);
  shape.bezierCurveTo(-0.25, -0.6, -0.3, -0.2, -0.3, 0);
  shape.bezierCurveTo(-0.3, 0.2, -0.25, 0.6, 0, 0.8);
  const kayakGeo = new THREE.ExtrudeGeometry(shape, {depth: 0.2, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05});
  // Rotate to lie flat
  kayakGeo.rotateX(-Math.PI / 2);
  const kayakMat = new THREE.MeshStandardMaterial({color: 0xcc4422, roughness: 0.5});
  kayak = new THREE.Mesh(kayakGeo, kayakMat);
  kayak.position.set(0.8, 2.7, 11);
  kayak.rotation.y = 0.1;
  kayak.castShadow = true;
  scene.add(kayak);
}

function updateKayak(dt, time) {
  if (kayakState === 'moored') {
    kayak.position.y = tideLevel + 0.15 + Math.sin(time * 1.5) * 0.05 * windStrength;
    kayak.rotation.z = Math.sin(time * 1.2) * 0.05 * windStrength;
    kayak.position.x = 0.8;
    kayak.position.z = 11;
    kayak.rotation.y = 0.1;
  } else {
    kayakAngle += dt * 0.4;
    const r = 9;
    kayak.position.x = Math.cos(kayakAngle) * r;
    kayak.position.z = Math.sin(kayakAngle) * r;
    kayak.position.y = tideLevel + 0.15 + Math.sin(time * 2) * 0.08 * windStrength;
    kayak.rotation.y = kayakAngle + Math.PI / 2;
    kayak.rotation.z = Math.sin(time * 1.5 + kayakAngle) * 0.06 * windStrength;
  }
}

// ─── DETAILS ────────────────────────────────────────────────────────────
function buildDetails() {
  // Plants around cabin
  const potGeo = new THREE.CylinderGeometry(0.15, 0.12, 0.2, 6);

  [[1.5, 1.8], [-1.5, 1.8], [1.8, -0.5], [-1.8, -0.5]].forEach(([x, z]) => {

    const plant = new THREE.Mesh(plantGeo, plantMat);
    plant.position.set(x, h + 0.35, z);
    plant.scale.set(1, 1.2, 1);
    plant.castShadow = true;
    scene.add(plant);
  });
}

// ─── CAMERA SYSTEM ──────────────────────────────────────────────────────
function setCamera(preset) {
  document.querySelectorAll('#cam-iso,#cam-cabin,#cam-under').forEach(b => b.classList.remove('active'));
  if (preset === 'iso') {
    cameraGoal = {pos: new THREE.Vector3(16, 14, 16), target: new THREE.Vector3(0, 2, 0)};
    document.getElementById('cam-iso').classList.add('active');
  } else if (preset === 'cabin') {
    cameraGoal = {pos: new THREE.Vector3(6, 5, 8), target: new THREE.Vector3(0, 2.5, 2)};
    document.getElementById('cam-cabin').classList.add('active');
  } else if (preset === 'under') {
    cameraGoal = {pos: new THREE.Vector3(8, 1.5, 10), target: new THREE.Vector3(0, 1.2, 0)};
    document.getElementById('cam-under').classList.add('active');
  }
  cameraTransition = 0;
}

function updateCamera(dt) {
  if (cameraTransition < 1) {
    cameraTransition += dt * 1.5;
    cameraTransition = Math.min(1, cameraTransition);
    const t = smoothstep(cameraTransition);
    camera.position.lerp(cameraGoal.pos, t * 0.08);
    controls.target.lerp(cameraGoal.target, t * 0.08);
  }
  controls.update();
}

function smoothstep(t) { return t * t * (3 - 2 * t); }

// ─── AUDIO ──────────────────────────────────────────────────────────────
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.6;
  masterGain.connect(audioCtx.destination);
}

let musicInterval = null;
function startMusic() {
  if (!audioCtx) initAudio();
  if (musicInterval) return;
  const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
  const playNote = () => {
    if (!musicOn) return;
    const freq = scale[Math.floor(Math.random() * scale.length)];
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sine';
    osc.frequency.value = freq * (Math.random() > 0.5 ? 1 : 0.5);
    filter.type = 'lowpass';
    filter.frequency.value = 2000;
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    osc.start();
    osc.stop(audioCtx.currentTime + 2.5);

    // Occasional harmony
    if (Math.random() > 0.6) {
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.value = freq * 1.5;
      gain2.gain.setValueAtTime(0, audioCtx.currentTime);
      gain2.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.2);
      gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3);
      osc2.connect(gain2);
      gain2.connect(masterGain);
      osc2.start();
      osc2.stop(audioCtx.currentTime + 3);
    }
  };
  musicInterval = setInterval(playNote, 800 + Math.random() * 600);
  playNote();

  // Ambient pad
  const padOsc = audioCtx.createOscillator();
  const padGain = audioCtx.createGain();
  padOsc.type = 'sine';
  padOsc.frequency.value = 130;
  padGain.gain.value = 0.03;
  padOsc.connect(padGain);
  padGain.connect(masterGain);
  padOsc.start();
  musicInterval.padOsc = padOsc;
  musicInterval.padGain = padGain;
}

function stopMusic() {
  if (musicInterval) {
    clearInterval(musicInterval);
    if (musicInterval.padOsc) { musicInterval.padOsc.stop(); musicInterval.padGain.disconnect(); }
    musicInterval = null;
  }
}

function playWaterSound() {
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * 0.5;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
  }
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 800;
  filter.Q.value = 0.5;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.15;
  source.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  source.start();
}

// ─── UI SETUP ───────────────────────────────────────────────────────────
function setupUI() {
  document.getElementById('cam-iso').onclick = () => setCamera('iso');
  document.getElementById('cam-cabin').onclick = () => setCamera('cabin');
  document.getElementById('cam-under').onclick = () => setCamera('under');

  document.getElementById('btn-kayak').onclick = () => {
    if (kayakState === 'moored') {
      kayakState = 'sailing';
      kayakAngle = Math.atan2(kayak.position.z, kayak.position.x);
      document.getElementById('btn-kayak').textContent = 'Return Kayak';
    } else {
      kayakState = 'moored';
      document.getElementById('btn-kayak').textContent = 'Launch Kayak';
    }
  };

  document.getElementById('btn-ray').onclick = () => {
    triggerRayLeap();
    playWaterSound();
  };

  document.getElementById('btn-pause').onclick = () => {
    paused = !paused;
    document.getElementById('btn-pause').textContent = paused ? 'Resume' : 'Pause';
    document.getElementById('btn-pause').classList.toggle('active', paused);
  };

  document.getElementById('btn-reset').onclick = () => {
    timeOfDay = 0.3; windStrength = 0.4; tideLevel = WATER_BASE;
    kayakState = 'moored'; kayakAngle = 0; rayJumping = false;
    paused = false;
    document.getElementById('sl-tide').value = 50;
    document.getElementById('sl-wind').value = 40;
    document.getElementById('sl-time').value = 30;
    document.getElementById('v-tide').textContent = '50%';
    document.getElementById('v-wind').textContent = '40%';
    document.getElementById('v-time').textContent = 'Day';
    document.getElementById('btn-kayak').textContent = 'Launch Kayak';
    document.getElementById('btn-pause').textContent = 'Pause';
    document.getElementById('btn-pause').classList.remove('active');
    setCamera('iso');
  };

  document.getElementById('sl-tide').oninput = (e) => {
    tideLevel = 1.5 + (e.target.value / 100) * 2.5;
    document.getElementById('v-tide').textContent = e.target.value + '%';
  };

  document.getElementById('sl-wind').oninput = (e) => {
    windStrength = e.target.value / 100;
    document.getElementById('v-wind').textContent = e.target.value + '%';
  };

  document.getElementById('sl-time').oninput = (e) => {
    timeOfDay = e.target.value / 100;
    const labels = ['Night', 'Sunset', 'Day'];
    const idx = timeOfDay < 0.33 ? 0 : timeOfDay < 0.66 ? 1 : 2;
    document.getElementById('v-time').textContent = labels[idx];
  };

  document.getElementById('btn-music').onclick = () => {
    initAudio();
    musicOn = !musicOn;
    document.getElementById('btn-music').textContent = musicOn ? '♪ Music On' : '♪ Music Off';
    document.getElementById('btn-music').classList.toggle('active', musicOn);
    if (musicOn) startMusic(); else stopMusic();
  };

  document.getElementById('sl-vol').oninput = (e) => {
    if (masterGain) masterGain.gain.value = e.target.value / 100;
  };

  document.getElementById('collapse-btn').onclick = () => {
    document.getElementById('ui').classList.toggle('collapsed');
  };

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ─── ANIMATION LOOP ─────────────────────────────────────────────────────
let animTime = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!paused) {
    animTime += dt;

    // Update water
    waterSurface.material.uniforms.uTime.value = animTime;
    waterSurface.material.uniforms.uWind.value = windStrength;
    waterSurface.position.y = tideLevel;
    seabed.material.uniforms.uTime.value = animTime;
    seabed.material.uniforms.uWind.value = windStrength;
    glassFront.material.uniforms.uTide.value = tideLevel;
    glassRight.material.uniforms.uTide.value = tideLevel;

    // Update systems
    updateLighting(timeOfDay);
    updateUnderwaterLife(animTime, dt);
    updateKayak(dt, animTime);
    updateRayLeap(dt);
    updateSplash(dt);
    updateFoam(animTime);

    // Tree sway
    treeTops.forEach((tree, i) => {
      tree.rotation.x = Math.sin(animTime * 1.2 + i) * 0.04 * windStrength;
      tree.rotation.z = Math.cos(animTime * 0.9 + i * 1.5) * 0.03 * windStrength;
    });
  }

  updateCamera(dt);
  renderer.render(scene, camera);
}

// ─── START ──────────────────────────────────────────────────────────────
init();
</script>
