<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
#info {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  color: #fff; background: rgba(0,0,0,0.45); padding: 10px 24px;
  border-radius: 20px; font-size: 14px; pointer-events: none;
  text-align: center; backdrop-filter: blur(6px); letter-spacing: 0.3px;
}
#info span { opacity: 0.7; font-size: 12px; }
</style>
</head>
<body>
<div id="info">🐹 Low-Poly Hamster Playground — drag to rotate · scroll to zoom<span><br>Watch the hamsters explore!</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── SCENE SETUP ───────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.FogExp2(0x1a1a2e, 0.012);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(12, 10, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 1.5, 0);
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 6;
controls.maxDistance = 30;

// ─── LIGHTING ──────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0xffeedd, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff4e0, 1.4);
dirLight.position.set(8, 14, 6);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 1;
dirLight.shadow.camera.far = 40;
dirLight.shadow.camera.left = -12;
dirLight.shadow.camera.right = 12;
dirLight.shadow.camera.top = 12;
dirLight.shadow.camera.bottom = -12;
dirLight.shadow.bias = -0.001;
scene.add(dirLight);

const pointLight1 = new THREE.PointLight(0xff9966, 0.6, 20);
pointLight1.position.set(-5, 6, -5);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0x6699ff, 0.4, 20);
pointLight2.position.set(5, 6, 5);
scene.add(pointLight2);

// ─── MATERIALS ─────────────────────────────────────────────────
const mat = (color, opts = {}) => new THREE.MeshStandardMaterial({
  color, flatShading: true, roughness: 0.7, metalness: 0.05, ...opts
});

const hamsterColors = [
  { body: 0xf5c67a, belly: 0xfff0d4, ear: 0xe8a060 },
  { body: 0xd4a574, belly: 0xffecd4, ear: 0xc08050 },
  { body: 0xe8d5b8, belly: 0xfff8ee, ear: 0xd0b890 },
  { body: 0xc89060, belly: 0xffe8c0, ear: 0xb07040 },
  { body: 0xf0d8a8, belly: 0xfff4e0, ear: 0xe0b878 },
];

// ─── CAGE FLOOR / TRAY ────────────────────────────────────────
const cageSize = 8;
const floorGeo = new THREE.BoxGeometry(cageSize + 0.4, 0.3, cageSize + 0.4);
const floorMat = mat(0x5a3e28);
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.position.y = -0.15;
floor.receiveShadow = true;
scene.add(floor);

// Bedding layer
const beddingGeo = new THREE.BoxGeometry(cageSize, 0.15, cageSize);
const beddingMat = mat(0xf5deb3);
const bedding = new THREE.Mesh(beddingGeo, beddingMat);
bedding.position.y = 0.075;
bedding.receiveShadow = true;
scene.add(bedding);

// Colorful bedding patches
for (let i = 0; i < 12; i++) {
  const patchGeo = new THREE.CircleGeometry(0.3 + Math.random() * 0.4, 6);
  const patchColor = [0xffcc80, 0xffab91, 0xffcdd2, 0xc8e6c9, 0xbbdefb, 0xfff9c4][i % 6];
  const patchMat = mat(patchColor);
  const patch = new THREE.Mesh(patchGeo, patchMat);
  patch.rotation.x = -Math.PI / 2;
  patch.position.set(
    (Math.random() - 0.5) * cageSize * 0.8,
    0.17,
    (Math.random() - 0.5) * cageSize * 0.8
  );
  scene.add(patch);
}

// ─── CAGE BARS ─────────────────────────────────────────────────
const barMat = mat(0x888899, { metalness: 0.3, roughness: 0.4 });
const barRadius = 0.06;
const halfCage = cageSize / 2;
const barHeight = 5;
const barSpacing = 1.2;

function createBar(x, z, w, h, d) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, barMat);
  mesh.position.set(x, barHeight / 2, z);
  mesh.castShadow = true;
  return mesh;
}

// Vertical bars on all 4 sides
for (let i = -halfCage; i <= halfCage; i += barSpacing) {
  // Front & back
  scene.add(createBar(i, halfCage, barRadius, barHeight, barRadius));
  scene.add(createBar(i, -halfCage, barRadius, barHeight, barRadius));
  // Left & right
  scene.add(createBar(halfCage, i, barRadius, barHeight, barRadius));
  scene.add(createBar(-halfCage, i, barRadius, barHeight, barRadius));
}

// Top horizontal bars
for (let i = -halfCage; i <= halfCage; i += barSpacing) {
  scene.add(createBar(i, halfCage, barRadius, 0.08, barRadius));
  scene.add(createBar(i, -halfCage, barRadius, 0.08, barRadius));
}
// Top cross bars
scene.add(createBar(0, halfCage, barRadius, 0.08, cageSize + 0.2));
scene.add(createBar(0, -halfCage, barRadius, 0.08, cageSize + 0.2));
scene.add(createBar(halfCage, 0, cageSize + 0.2, 0.08, barRadius));
scene.add(createBar(-halfCage, 0, cageSize + 0.2, 0.08, barRadius));

// Corner posts
for (let cx of [-1, 1]) {
  for (let cz of [-1, 1]) {
    const post = createBar(cx * halfCage, cz * halfCage, 0.14, barHeight + 0.3, 0.14);
    post.position.y = barHeight / 2 + 0.15;
    scene.add(post);
  }
}

// ─── HAMSTER WHEEL ─────────────────────────────────────────────
const wheelGroup = new THREE.Group();
const wheelRadius = 1.4;
const wheelWidth = 0.6;

// Wheel rim (torus)
const wheelRimGeo = new THREE.TorusGeometry(wheelRadius, 0.08, 6, 24);
const wheelRimMat = mat(0xff8c42);
const wheelRim = new THREE.Mesh(wheelRimGeo, wheelRimMat);
wheelRim.castShadow = true;
wheelGroup.add(wheelRim);

// Second rim
const wheelRim2 = new THREE.Mesh(wheelRimGeo, wheelRimMat);
wheelRim2.position.z = wheelWidth;
wheelRim2.castShadow = true;
wheelGroup.add(wheelRim2);

// Spokes
for (let i = 0; i < 8; i++) {
  const angle = (i / 8) * Math.PI * 2;
  const spokeGeo = new THREE.CylinderGeometry(0.04, 0.04, wheelRadius * 2, 5);
  const spoke = new THREE.Mesh(spokeGeo, mat(0xffaa60));
  spoke.rotation.z = angle;
  spoke.position.z = wheelWidth / 2;
  spoke.castShadow = true;
  wheelGroup.add(spoke);
}

// Side panels
for (let side of [-1, 1]) {
  const panelGeo = new THREE.CylinderGeometry(wheelRadius, wheelRadius, wheelWidth, 8, 1, true);
  const panel = new THREE.Mesh(panelGeo, mat(0xff9955, { transparent: true, opacity: 0.3 }));
  panel.rotation.x = Math.PI / 2;
  panel.position.set(side * wheelWidth / 2, 0, wheelWidth / 2);
  wheelGroup.add(panel);
}

// Axle
const axleGeo = new THREE.CylinderGeometry(0.08, 0.08, wheelWidth + 0.4, 8);
const axle = new THREE.Mesh(axleGeo, mat(0xaaaaaa, { metalness: 0.5 }));
axle.rotation.x = Math.PI / 2;
axle.position.z = wheelWidth / 2;
wheelGroup.add(axle);

// Stand
const standGeo = new THREE.BoxGeometry(0.15, 2.2, 0.15);
for (let sx of [-0.5, 0.5]) {
  const stand = new THREE.Mesh(standGeo, mat(0x777788));
  stand.position.set(sx * 0.5, -1.1, wheelWidth);
  stand.castShadow = true;
  wheelGroup.add(stand);
}
const standBase = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.8), mat(0x777788));
standBase.position.set(0, -2.15, wheelWidth);
standBase.castShadow = true;
wheelGroup.add(standBase);

wheelGroup.position.set(3, 2.2, -2);
scene.add(wheelGroup);

// ─── TUNNEL ────────────────────────────────────────────────────
const tunnelGroup = new THREE.Group();
const tunnelLength = 3;
const tunnelRadius = 0.6;

// Create tunnel from segments
const tunnelSegments = 12;
for (let i = 0; i < tunnelSegments; i++) {
  const t = i / tunnelSegments;
  const x = (t - 0.5) * tunnelLength;
  const ringGeo = new THREE.TorusGeometry(tunnelRadius, 0.06, 4, 8);
  const ring = new THREE.Mesh(ringGeo, mat(0x66bb6a));
  ring.position.x = x;
  ring.rotation.y = Math.PI / 2;
  ring.castShadow = true;
  tunnelGroup.add(ring);
}

// Tunnel fabric
const tunnelFabricGeo = new THREE.CylinderGeometry(tunnelRadius, tunnelRadius, tunnelLength, 8, 1, true);
const tunnelFabric = new THREE.Mesh(tunnelFabricGeo, mat(0x4caf50, { transparent: true, opacity: 0.25 }));
tunnelFabric.rotation.z = Math.PI / 2;
tunnelFabric.castShadow = true;
tunnelGroup.add(tunnelFabric);

tunnelGroup.position.set(-2, 0.8, 2);
tunnelGroup.rotation.y = 0.3;
scene.add(tunnelGroup);

// ─── FOOD BOWL ─────────────────────────────────────────────────
const bowlGroup = new THREE.Group();

const bowlGeo = new THREE.SphereGeometry(0.5, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2);
const bowl = new THREE.Mesh(bowlGeo, mat(0x42a5f5));
bowl.rotation.x = Math.PI;
bowl.castShadow = true;
bowlGroup.add(bowl);

// Food pellets
for (let i = 0; i < 8; i++) {
  const pelletGeo = new THREE.SphereGeometry(0.06, 4, 4);
  const pelletMat = mat([0x8d6e63, 0xa1887f, 0x6d4c41][i % 3]);
  const pellet = new THREE.Mesh(pelletGeo, pelletMat);
  const angle = (i / 8) * Math.PI * 2;
  const r = 0.15 + Math.random() * 0.2;
  pellet.position.set(Math.cos(angle) * r, 0.02 + Math.random() * 0.04, Math.sin(angle) * r);
  pellet.castShadow = true;
  bowlGroup.add(pellet);
}

bowlGroup.position.set(-3, 0.2, -2);
scene.add(bowlGroup);

// ─── WATER BOTTLE ──────────────────────────────────────────────
const waterGroup = new THREE.Group();
const bottleGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 6);
const bottle = new THREE.Mesh(bottleGeo, mat(0x90caf9, { transparent: true, opacity: 0.5 }));
bottle.castShadow = true;
waterGroup.add(bottle);

const capGeo = new THREE.CylinderGeometry(0.18, 0.15, 0.1, 6);
const cap = new THREE.Mesh(capGeo, mat(0xff7043));
cap.position.y = 0.45;
cap.castShadow = true;
waterGroup.add(cap);

// Metal spout
const spoutGeo = new THREE.CylinderGeometry(0.04, 0.06, 0.3, 5);
const spout = new THREE.Mesh(spoutGeo, mat(0x999999, { metalness: 0.6 }));
spout.rotation.z = Math.PI / 2;
spout.position.set(0.15, -0.1, 0);
waterGroup.add(spout);

// Clip
const clipGeo = new THREE.BoxGeometry(0.25, 0.15, 0.1);
const clip = new THREE.Mesh(clipGeo, mat(0x888899, { metalness: 0.4 }));
clip.position.set(0, 0.55, 0);
waterGroup.add(clip);

waterGroup.position.set(3.5, 2, 1.5);
scene.add(waterGroup);

// ─── HIDE HOUSE ────────────────────────────────────────────────
const houseGroup = new THREE.Group();
const houseBodyGeo = new THREE.BoxGeometry(1.2, 1, 1);
const houseBody = new THREE.Mesh(houseBodyGeo, mat(0x8d6e63));
houseBody.position.y = 0.5;
houseBody.castShadow = true;
houseGroup.add(houseBody);

// Roof
const roofGeo = new THREE.ConeGeometry(1, 0.6, 4);
const roof = new THREE.Mesh(roofGeo, mat(0xd84315));
roof.position.y = 1.3;
roof.rotation.y = Math.PI / 4;
roof.castShadow = true;
houseGroup.add(roof);

// Door hole
const doorGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.1, 8);
const doorMat = mat(0x2a1a0a);
const door = new THREE.Mesh(doorGeo, doorMat);
door.rotation.x = Math.PI / 2;
door.position.set(0, 0.35, 0.51);
houseGroup.add(door);

houseGroup.position.set(-3, 0.15, 2);
scene.add(houseGroup);

// ─── CREATE HAMSTER ────────────────────────────────────────────
function createHamster(colorSet, scale = 0.6) {
  const group = new THREE.Group();

  // Body
  const bodyGeo = new THREE.BoxGeometry(1, 0.7, 0.6);
  // Round the edges a bit by using a sphere merged conceptually
  const body = new THREE.Mesh(bodyGeo, mat(colorSet.body));
  body.scale.set(1, 1, 0.9);
  body.position.y = 0.55;
  body.castShadow = true;
  group.add(body);

  // Belly
  const bellyGeo = new THREE.BoxGeometry(0.7, 0.4, 0.35);
  const belly = new THREE.Mesh(bellyGeo, mat(colorSet.belly));
  belly.position.set(0, 0.35, 0.15);
  group.add(belly);

  // Head
  const headGeo = new THREE.BoxGeometry(0.6, 0.55, 0.5);
  const head = new THREE.Mesh(headGeo, mat(colorSet.body));
  head.position.set(0.35, 0.7, 0);
  head.castShadow = true;
  group.add(head);

  // Snout
  const snoutGeo = new THREE.BoxGeometry(0.25, 0.2, 0.25);
  const snout = new THREE.Mesh(snoutGeo, mat(colorSet.belly));
  snout.position.set(0.6, 0.6, 0);
  group.add(snout);

  // Nose
  const noseGeo = new THREE.SphereGeometry(0.05, 4, 4);
  const nose = new THREE.Mesh(noseGeo, mat(0xff6b8a));
  nose.position.set(0.72, 0.62, 0);
  group.add(nose);

  // Eyes
  for (let side of [-1, 1]) {
    const eyeGeo = new THREE.SphereGeometry(0.07, 4, 4);
    const eye = new THREE.Mesh(eyeGeo, mat(0x1a1a1a));
    eye.position.set(0.5, 0.8, side * 0.2);
    group.add(eye);

    // Eye shine
    const shineGeo = new THREE.SphereGeometry(0.025, 3, 3);
    const shine = new THREE.Mesh(shineGeo, mat(0xffffff));
    shine.position.set(0.55, 0.83, side * 0.22);
    group.add(shine);
  }

  // Ears
  for (let side of [-1, 1]) {
    const earGeo = new THREE.ConeGeometry(0.12, 0.2, 4);
    const ear = new THREE.Mesh(earGeo, mat(colorSet.ear));
    ear.position.set(0.3, 1.05, side * 0.2);
    ear.rotation.z = side * 0.2;
    ear.castShadow = true;
    group.add(ear);

    // Inner ear
    const innerEarGeo = new THREE.ConeGeometry(0.07, 0.12, 4);
    const innerEar = new THREE.Mesh(innerEarGeo, mat(0xffb0b0));
    innerEar.position.set(0.3, 1.0, side * 0.2);
    innerEar.rotation.z = side * 0.2;
    group.add(innerEar);
  }

  // Cheeks (puffy!)
  for (let side of [-1, 1]) {
    const cheekGeo = new THREE.SphereGeometry(0.15, 5, 4);
    const cheek = new THREE.Mesh(cheekGeo, mat(colorSet.belly));
    cheek.position.set(0.45, 0.55, side * 0.3);
    cheek.scale.set(1, 0.7, 0.8);
    group.add(cheek);
  }

  // Feet
  for (let fx of [-0.3, 0.2]) {
    for (let fz of [-0.2, 0.2]) {
      const footGeo = new THREE.BoxGeometry(0.15, 0.1, 0.12);
      const foot = new THREE.Mesh(footGeo, mat(colorSet.ear));
      foot.position.set(fx, 0.12, fz);
      group.add(foot);
    }
  }

  // Tail (tiny!)
  const tailGeo = new THREE.SphereGeometry(0.08, 4, 4);
  const tail = new THREE.Mesh(tailGeo, mat(colorSet.ear));
  tail.position.set(-0.55, 0.45, 0);
  tail.scale.set(0.7, 0.8, 0.6);
  group.add(tail);

  group.scale.setScalar(scale);
  return group;
}

// ─── HAMSTER AI ────────────────────────────────────────────────
class HamsterAI {
  constructor(mesh, colorIndex) {
    this.mesh = mesh;
    this.colorIndex = colorIndex;
    this.state = 'idle';
    this.stateTimer = 0;
    this.targetPos = new THREE.Vector3();
    this.targetRotation = 0;
    this.speed = 0.8 + Math.random() * 0.6;
    this.walkPhase = Math.random() * Math.PI * 2;
    this.bobPhase = Math.random() * Math.PI * 2;
    this.cheekPuff = 0;
    this.interactingWith = null;
    this.interactTimer = 0;
    this.wheelAngle = 0;

    // Pick initial random position
    this.pickNewTarget();
    this.state = 'walking';
    this.stateTimer = 2 + Math.random() * 3;

    // Personality
    this.curious = Math.random(); // how likely to interact with objects
    this.energy = 0.5 + Math.random() * 0.5; // activity level
  }

  pickNewTarget() {
    const halfCage = cageSize / 2 - 0.5;
    this.targetPos.set(
      (Math.random() - 0.5) * 2 * halfCage,
      0,
      (Math.random() - 0.5) * 2 * halfCage
    );
  }

  update(dt, time) {
    this.stateTimer -= dt;
    this.walkPhase += dt * this.speed * 8;
    this.bobPhase += dt * this.speed * 4;

    switch (this.state) {
      case 'walking':
        this.doWalk(dt, time);
        if (this.stateTimer <= 0) {
          // Decide next action
          if (this.curious > 0.6 && Math.random() < 0.3) {
            this.startInteract();
          } else {
            this.state = 'paused';
            this.stateTimer = 1 + Math.random() * 2;
          }
        }
        break;

      case 'paused':
        this.mesh.position.y = Math.sin(this.bobPhase) * 0.02;
        if (this.stateTimer <= 0) {
          this.state = 'walking';
          this.stateTimer = 2 + Math.random() * 3;
          this.pickNewTarget();
        }
        break;

      case 'turning':
        this.targetRotation += dt * 2.5;
        this.mesh.rotation.y = this.targetRotation;
        if (this.stateTimer <= 0) {
          this.state = 'walking';
          this.stateTimer = 1.5 + Math.random() * 2;
          this.pickNewTarget();
        }
        break;

      case 'interacting':
        this.doInteract(dt, time);
        if (this.stateTimer <= 0) {
          this.state = 'walking';
          this.stateTimer = 2 + Math.random() * 2;
          this.interactingWith = null;
          this.pickNewTarget();
        }
        break;
    }

    // Keep within cage bounds
    const halfCage = cageSize / 2 - 0.3;
    this.mesh.position.x = Math.max(-halfCage, Math.min(halfCage, this.mesh.position.x));
    this.mesh.position.z = Math.max(-halfCage, Math.min(halfCage, this.mesh.position.z));
  }

  doWalk(dt, time) {
    const dir = new THREE.Vector3().subVectors(this.targetPos, this.mesh.position);
    dir.y = 0;
    const dist = dir.length();

    if (dist < 0.15) {
      this.state = 'paused';
      this.stateTimer = 0.5 + Math.random() * 1;
      return;
    }

    dir.normalize();
    const targetAngle = Math.atan2(dir.x, dir.z);

    // Smooth rotation
    let diff = targetAngle - this.mesh.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    this.mesh.rotation.y += diff * Math.min(1, dt * 5);

    const moveSpeed = this.speed * this.energy * 1.5;
    this.mesh.position.add(dir.multiplyScalar(moveSpeed * dt));

    // Walking bob
    this.mesh.position.y = Math.abs(Math.sin(this.bobPhase)) * 0.06;

    // Slight body tilt while walking
    this.mesh.children[0].rotation.z = Math.sin(this.walkPhase) * 0.05;
  }

  startInteract() {
    const objects = ['wheel', 'bowl', 'tunnel', 'house'];
    const weights = [0.35, 0.3, 0.2, 0.15];
    let r = Math.random(), cumulative = 0;
    let chosen = 'wheel';
    for (let i = 0; i < objects.length; i++) {
      cumulative += weights[i];
      if (r < cumulative) { chosen = objects[i]; break; }
    }

    this.interactingWith = chosen;
    this.state = 'interacting';

    switch (chosen) {
      case 'wheel':
        this.targetPos.copy(wheelGroup.position).add(new THREE.Vector3(-0.5, 0, 0));
        this.stateTimer = 3 + Math.random() * 3;
        break;
      case 'bowl':
        this.targetPos.copy(bowlGroup.position).add(new THREE.Vector3(0.5, 0, 0));
        this.stateTimer = 2 + Math.random() * 3;
        this.cheekPuff = 1;
        break;
      case 'tunnel':
        this.targetPos.copy(tunnelGroup.position).add(new THREE.Vector3(0, 0, 0.5));
        this.stateTimer = 2 + Math.random() * 2;
        break;
      case 'house':
        this.targetPos.copy(houseGroup.position).add(new THREE.Vector3(0, 0, 0.5));
        this.stateTimer = 3 + Math.random() * 3;
        break;
    }
  }

  doInteract(dt, time) {
    const dir = new THREE.Vector3().subVectors(this.targetPos, this.mesh.position);
    dir.y = 0;
    const dist = dir.length();

    if (dist > 0.15) {
      dir.normalize();
      const targetAngle = Math.atan2(dir.x, dir.z);
      let diff = targetAngle - this.mesh.rotation.y;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      this.mesh.rotation.y += diff * Math.min(1, dt * 5);
      this.mesh.position.add(dir.multiplyScalar(this.speed * 0.8 * dt));
      this.mesh.position.y = Math.abs(Math.sin(this.bobPhase)) * 0.04;
    } else {
      // At interaction point
      switch (this.interactingWith) {
        case 'wheel':
          this.mesh.rotation.y = Math.PI * 0.3;
          this.mesh.position.y = 1.5 + Math.sin(time * 3) * 0.05;
          // Spin the wheel!
          wheelGroup.rotation.x += dt * 3 * this.energy;
          break;
        case 'bowl':
          this.mesh.rotation.y = Math.PI * 0.5;
          this.mesh.position.y = 0.15;
          // Nibble animation
          this.mesh.position.y += Math.sin(time * 6) * 0.02;
          // Cheek puff animation
          if (this.cheekPuff > 0) {
            const cheekScale = 1 + Math.sin(time * 2) * 0.3 * this.cheekPuff;
            // We'd scale cheek meshes here if we had references
          }
          break;
        case 'tunnel':
          this.mesh.rotation.y = -0.3;
          this.mesh.position.y = 0.3 + Math.sin(time * 2) * 0.1;
          break;
        case 'house':
          this.mesh.rotation.y = -Math.PI * 0.5;
          this.mesh.position.y = 0.1 + Math.sin(time * 1.5) * 0.03;
          break;
      }
    }
  }
}

// ─── CREATE HAMSTERS ──────────────────────────────────────────
const hamsters = [];
const hamsterMeshes = [];

const positions = [
  { x: 0, z: 0 },
  { x: 2, z: -1 },
  { x: -1.5, z: 1.5 },
  { x: 1, z: 2 },
  { x: -2, z: -1.5 },
];

for (let i = 0; i < 5; i++) {
  const colorSet = hamsterColors[i % hamsterColors.length];
  const mesh = createHamster(colorSet, 0.55 + Math.random() * 0.15);
  mesh.position.set(positions[i].x, 0, positions[i].z);
  mesh.rotation.y = Math.random() * Math.PI * 2;
  scene.add(mesh);
  hamsterMeshes.push(mesh);
  hamsters.push(new HamsterAI(mesh, i));
}

// ─── DECORATIONS ───────────────────────────────────────────────
// Small hay bales
for (let i = 0; i < 4; i++) {
  const hayGeo = new THREE.CylinderGeometry(0.2, 0.25, 0.15, 6);
  const hay = new THREE.Mesh(hayGeo, mat(0xc8b060));
  hay.position.set(
    (Math.random() - 0.5) * 6,
    0.15,
    (Math.random() - 0.5) * 6
  );
  hay.rotation.y = Math.random() * Math.PI;
  hay.castShadow = true;
  scene.add(hay);
}

// Tiny toys
const toyColors = [0xff5252, 0xffd740, 0x40c4ff, 0x69f0ae];
for (let i = 0; i < 3; i++) {
  const toyGeo = new THREE.OctahedronGeometry(0.12, 0);
  const toy = new THREE.Mesh(toyGeo, mat(toyColors[i]));
  toy.position.set(
    (Math.random() - 0.5) * 5,
    0.3,
    (Math.random() - 0.5) * 5
  );
  toy.castShadow = true;
  scene.add(toy);

  // Animate toys gently
  toy.userData.floatOffset = Math.random() * Math.PI * 2;
  toy.userData.isToy = true;
  scene.userData = scene.userData || {};
  if (!scene.userData.toys) scene.userData.toys = [];
  scene.userData.toys.push(toy);
}

// ─── CEILING LIGHT ─────────────────────────────────────────────
const ceilingLightGeo = new THREE.CylinderGeometry(0.4, 0.6, 0.15, 8);
const ceilingLight = new THREE.Mesh(ceilingLightGeo, mat(0xfff9c4, { emissive: 0xfff9c4, emissiveIntensity: 0.5 }));
ceilingLight.position.set(0, 5.1, 0);
scene.add(ceilingLight);

const lightCord = new THREE.Mesh(
  new THREE.CylinderGeometry(0.02, 0.02, 0.5, 4),
  mat(0x666666)
);
lightCord.position.set(0, 5.4, 0);
scene.add(lightCord);

// ─── ANIMATION LOOP ───────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.getElapsedTime();

  controls.update();

  // Update hamsters
  for (const hamster of hamsters) {
    hamster.update(dt, time);
  }

  // Animate toys
  if (scene.userData && scene.userData.toys) {
    for (const toy of scene.userData.toys) {
      toy.rotation.y += dt * 1.5;
      toy.position.y = 0.3 + Math.sin(time * 2 + toy.userData.floatOffset) * 0.08;
    }
  }

  // Gentle wheel slowdown (friction)
  if (Math.abs(wheelGroup.rotation.x) > 0.001) {
    let anyHamsterOnWheel = false;
    for (const h of hamsters) {
      if (h.interactingWith === 'wheel') { anyHamsterOnWheel = true; break; }
    }
    if (!anyHamsterOnWheel) {
      wheelGroup.rotation.x *= (1 - dt * 2);
    }
  }

  // Subtle point light animation
  pointLight1.intensity = 0.6 + Math.sin(time * 0.5) * 0.1;
  pointLight2.intensity = 0.4 + Math.cos(time * 0.7) * 0.1;

  renderer.render(scene, camera);
}

animate();

// ─── RESIZE ────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>
