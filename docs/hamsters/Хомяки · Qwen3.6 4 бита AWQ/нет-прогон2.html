<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Poly Hamster Playground</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #aaddff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #4a4a4a;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { margin: 0 0 5px 0; font-size: 1.2rem; }
        p { margin: 0; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>🐹 Low-Poly Hamster Playground</h1>
        <p>Left Click + Drag to Rotate</p>
        <p>Scroll to Zoom</p>
    </div>

    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const CAGE_SIZE = 12;
        const HAMSTER_COUNT = 3;
        const COLORS = {
            hamster: [0xffaa88, 0xeeccaa, 0xffddbb], // Skin tones
            cage: 0x88ccff,
            floor: 0xffffff,
            wood: 0xd2b48c,
            wheel: 0xeeeeee,
            grass: 0xccffcc
        };

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue
        scene.fog = new THREE.Fog(0x87CEEB, 20, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 15, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.1; // Prevent going under floor
        controls.minDistance = 10;
        controls.maxDistance = 40;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- Helper: Create Low Poly Mesh ---
        function createMesh(geometry, color, x, y, z, castShadow = true) {
            const material = new THREE.MeshStandardMaterial({ 
                color: color, 
                flatShading: true 
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = castShadow;
            mesh.receiveShadow = true;
            return mesh;
        }

        // --- Build Environment ---
        
        // 1. Floor (Wood Tray)
        const floorGeo = new THREE.BoxGeometry(CAGE_SIZE, 0.5, CAGE_SIZE);
        const floor = createMesh(floorGeo, COLORS.floor, 0, -0.25, 0);
        scene.add(floor);

        // 2. Cage Bars (Wireframe look)
        const barGroup = new THREE.Group();
        const barMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, flatShading: true });
        const barGeo = new THREE.CylinderGeometry(0.1, 0.1, 4, 6);
        
        // Vertical bars
        for(let i = -CAGE_SIZE/2; i <= CAGE_SIZE/2; i+=2) {
            // Front and Back
            let b1 = new THREE.Mesh(barGeo, barMat);
            b1.position.set(i, 2, -CAGE_SIZE/2);
            barGroup.add(b1);
            
            let b2 = new THREE.Mesh(barGeo, barMat);
            b2.position.set(i, 2, CAGE_SIZE/2);
            barGroup.add(b2);

            // Sides
            let b3 = new THREE.Mesh(barGeo, barMat);
            b3.rotation.z = Math.PI/2;
            b3.position.set(-CAGE_SIZE/2, 2, i);
            barGroup.add(b3);

            let b4 = new THREE.Mesh(barGeo, barMat);
            b4.rotation.z = Math.PI/2;
            b4.position.set(CAGE_SIZE/2, 2, i);
            barGroup.add(b4);
        }
        scene.add(barGroup);

        // --- Interactive Object: The Wheel ---
        const wheelGroup = new THREE.Group();
        wheelGroup.position.set(4, 2, -4);
        
        // Rim
        const torusGeo = new THREE.TorusGeometry(1.5, 0.1, 8, 16);
        const rim = createMesh(torusGeo, COLORS.wheel, 0, 0, 0);
        wheelGroup.add(rim);

        // Spokes
        const spokeGeo = new THREE.CylinderGeometry(0.05, 0.05, 3, 6);
        for(let i=0; i<4; i++) {
            const spoke = createMesh(spokeGeo, COLORS.wheel, 0, 0, 0);
            spoke.rotation.z = i * (Math.PI/4);
            wheelGroup.add(spoke);
        }

        // Stand
        const standGeo = new THREE.CylinderGeometry(0.2, 0.2, 3, 6);
        const standL = createMesh(standGeo, COLORS.wood, -1.5, 0, 0);
        const standR = createMesh(standGeo, COLORS.wood, 1.5, 0, 0);
        wheelGroup.add(standL);
        wheelGroup.add(standR);
        
        // Base of stand
        const baseGeo = new THREE.BoxGeometry(3.5, 0.2, 1);
        const base = createMesh(baseGeo, COLORS.wood, 0, -1.4, 0);
        wheelGroup.add(base);

        scene.add(wheelGroup);

        // --- Decor: Grass Bedding ---
        const grassGeo = new THREE.BoxGeometry(3, 0.1, 3);
        const grass = createMesh(grassGeo, COLORS.grass, -3, 0.05, -3);
        scene.add(grass);

        // --- Create Hamsters ---
        class Hamster {
            constructor(id) {
                this.mesh = new THREE.Group();
                
                // Colors
                const colorIndex = id % COLORS.hamster.length;
                const mainColor = COLORS.hamster[colorIndex];
                const bellyColor = 0xffffff;

                // Body (Sphere-ish)
                const bodyGeo = new THREE.SphereGeometry(0.6, 8, 6);
                this.body = createMesh(bodyGeo, mainColor, 0, 0.6, 0);
                this.mesh.add(this.body);

                // Belly (Smaller sphere in front)
                const bellyGeo = new THREE.SphereGeometry(0.4, 8, 6);
                const belly = createMesh(bellyGeo, bellyColor, 0, 0.4, 0.3);
                this.mesh.add(belly);

                // Head
                const headGeo = new THREE.SphereGeometry(0.45, 8, 6);
                this.head = createMesh(headGeo, mainColor, 0, 0.9, 0.3);
                this.mesh.add(this.head);

                // Ears
                const earGeo = new THREE.ConeGeometry(0.15, 0.2, 4);
                const earL = createMesh(earGeo, 0xffaaaa, -0.2, 1.2, 0.2);
                const earR = createMesh(earGeo, 0xffaaaa, 0.2, 1.2, 0.2);
                this.mesh.add(earL);
                this.mesh.add(earR);

                // Eyes
                const eyeGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
                const eyeMat = new THREE.MeshBasicMaterial({color: 0x000000});
                const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
                const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
                eyeL.position.set(-0.15, 0.95, 0.6);
                eyeR.position.set(0.15, 0.95, 0.6);
                this.mesh.add(eyeL);
                this.mesh.add(eyeR);

                // Tail (Tiny ball)
                const tailGeo = new THREE.SphereGeometry(0.15, 6, 4);
                const tail = createMesh(tailGeo, mainColor, 0, 0.5, -0.5);
                this.mesh.add(tail);

                scene.add(this.mesh);

                // State
                this.x = (Math.random() - 0.5) * 8;
                this.z = (Math.random() - 0.5) * 8;
                this.mesh.position.set(this.x, 0, this.z);
                
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 0.02 + Math.random() * 0.02;
                this.state = 'idle'; // idle, walk, wheel
                this.timer = Math.random() * 100;
                this.wheelRotationSpeed = 0;
            }

            update(dt) {
                this.timer -= dt;

                // State Machine
                if (this.state === 'idle') {
                    // Wiggle slightly while sleeping/idle
                    this.body.scale.y = 1 + Math.sin(Date.now() * 0.005) * 0.05;
                    
                    if (this.timer <= 0) {
                        this.state = 'walk';
                        this.timer = 100 + Math.random() * 100;
                        // Decide direction
                        this.angle += (Math.random() - 0.5) * 1.5;
                        
                        // Check if we are near wheel and decide to run
                        const distToWheel = this.mesh.position.distanceTo(new THREE.Vector3(4, 0, -4));
                        if (distToWheel < 2.5 && Math.random() > 0.5) {
                            this.state = 'wheel';
                            this.timer = 200 + Math.random() * 200;
                        }
                    }
                } else if (this.state === 'walk') {
                    // Move forward
                    this.mesh.position.x += Math.sin(this.angle) * this.speed;
                    this.mesh.position.z += Math.cos(this.angle) * this.speed;
                    
                    // Bobbing animation
                    this.mesh.position.y = Math.abs(Math.sin(Date.now() * 0.01)) * 0.1;

                    // Bounce head
                    this.head.position.y = 0.9 + Math.abs(Math.sin(Date.now() * 0.02)) * 0.1;

                    // Wall collision (Simple bounds check)
                    const limit = CAGE_SIZE / 2 - 1;
                    if (Math.abs(this.mesh.position.x) > limit || Math.abs(this.mesh.position.z) > limit) {
                        this.angle += Math.PI; // Turn around
                    }

                    if (this.timer <= 0) {
                        this.state = 'idle';
                        this.timer = 50 + Math.random() * 50;
                    }
                } else if (this.state === 'wheel') {
                    // Snap to wheel position facing inward
                    this.mesh.position.lerp(new THREE.Vector3(4, 0, -4), 0.05);
                    
                    // Face center
                    this.angle = Math.atan2(4 - this.mesh.position.x, -4 - this.mesh.position.z);
                    this.mesh.rotation.y = this.angle;

                    // Spin the wheel
                    wheelGroup.rotation.x += 0.1;
                    
                    // Vibrate body
                    this.mesh.position.y = Math.abs(Math.sin(Date.now() * 0.05)) * 0.05;

                    if (this.timer <= 0) {
                        this.state = 'idle';
                        this.timer = 100;
                        // Jump off wheel
                        this.mesh.position.z += 0.5; 
                    }
                }

                // Apply Rotation
                this.mesh.rotation.y = this.angle;
            }
        }

        const hamsters = [];
        for(let i=0; i<HAMSTER_COUNT; i++) {
            hamsters.push(new Hamster(i));
        }

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta() * 60; // Normalize to ~60fps

            hamsters.forEach(h => h.update(dt));

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
