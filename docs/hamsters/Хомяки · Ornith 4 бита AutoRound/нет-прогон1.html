<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#ffe9c4;font-family:'Segoe UI',system-ui,sans-serif}
canvas{display:block}
#ui{position:fixed;top:16px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}
#ui h1{font-size:26px;color:#7a4a2b;text-shadow:0 2px 6px rgba(255,255,255,.7);letter-spacing:.5px}
#ui .sub{font-size:13px;color:#a07850;margin-top:3px}
#info{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.82);backdrop-filter:blur(6px);padding:9px 20px;border-radius:22px;font-size:12.5px;color:#6b4f37;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.12);white-space:nowrap}
#tip{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:rgba(255,235,196,.9);padding:6px 16px;border-radius:14px;font-size:12px;color:#8a5a2b;z-index:10;transition:opacity 1s;box-shadow:0 3px 10px rgba(0,0,0,.1)}
@media(max-width:520px){#ui h1{font-size:20px}#info{font-size:11px;padding:7px 12px}}
</style>
</head>
<body>
<div id="ui"><h1>🐹 Low-Poly Hamster Playground</h1><div class="sub">a cozy little cage full of fuzzy friends</div></div>
<div id="tip">Click a hamster to watch it go 🥰</div>
<div id="info">🖱️ Drag to rotate · Scroll to zoom · Right-drag to pan · Click a hamster!</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"}}
</script>

<script type="module">
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   LOW-POLY HAMSTER PLAYGROUND
   A cozy 3D cage with autonomous low-poly hamsters.
   ========================================================= */

// ---------- Scene, Renderer, Lights ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe9c4);
scene.fog = new THREE.Fog(0xffe9c4, 22, 48);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 100);
camera.position.set(11, 9.5, 14);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(0, 1.2, 0);
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 6;
controls.maxDistance = 34;

// Lighting — warm & friendly
scene.add(new THREE.HemisphereLight(0xffffff, 0xcfa06a, 0.75));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.35);
sun.position.set(9, 17, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.camera.near = 1; sun.camera.far = 50;
sun.camera.left=-18; sun.camera.right=18; sun.camera.top=18; sun.camera.bottom=-18;
sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0xbfd8ff, 0.35)).position.set(-10, 8, -6);

// ---------- Materials ----------
const mat = (color, opts={}) => new THREE.MeshStandardMaterial({color, flatShading:true, roughness:opts.rough??0.85, metalness:opts.metal??0, transparent:opts.transparent??false, opacity:opts.opacity??1, ...opts.extra});

// =========================================================
//  CAGE
// =========================================================
const CAGE = 8, WALL_H = 4.2, BAR_SP = 0.55;
const cageGroup = new THREE.Group();
scene.add(cageGroup);

// Base tray
const tray = new THREE.Mesh(new THREE.BoxGeometry(CAGE+0.8, 0.5, CAGE+0.8), mat(0xd94f3b,{rough:0.6}));
tray.position.y = -0.25; tray.receiveShadow = true; cageGroup.add(tray);

// Wood shavings bedding
const shavMat = mat(0xf0d9a8,{rough:0.95});
for(let i=0;i<260;i++){
  const s = new THREE.Mesh(new THREE.BoxGeometry(0.34+Math.random()*0.35, 0.06, 0.08+Math.random()*0.12), shavMat);
  s.position.set((Math.random()-0.5)*(CAGE-0.6), 0.03+Math.random()*0.08, (Math.random()-0.5)*(CAGE-0.6));
  s.rotation.y = Math.random()*Math.PI;
  cageGroup.add(s);
}

// Glass walls (semi-transparent)
const glassMat = mat(0xbfe4ff,{transparent:true,opacity:0.14,rough:0.05,extra:{side:THREE.DoubleSide,depthWrite:false}});
function makeWall(w,h,x,z,ry){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.08), glassMat);
  m.position.set(x, h/2, z); m.rotation.y = ry; cageGroup.add(m);
}
makeWall(CAGE, WALL_H, 0, -CAGE/2, 0);
makeWall(CAGE, WALL_H, 0, CAGE/2, 0);
makeWall(CAGE, WALL_H, -CAGE/2, 0, Math.PI/2);
makeWall(CAGE, WALL_H, CAGE/2, 0, Math.PI/2);

// Metal top bars
const barMat = mat(0xcfd6dc,{metal:0.85,rough:0.25});
const topY = WALL_H;
for(let x=-CAGE/2; x<=CAGE/2; x+=BAR_SP){
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,CAGE,8), barMat);
  b.rotation.x = Math.PI/2; b.position.set(x, topY, 0); cageGroup.add(b);
}
[−CAGE/2, CAGE/2].forEach(z=>{
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,CAGE,8), barMat);
  r.rotation.x = Math.PI/2; r.position.set(0, topY, z); cageGroup.add(r);
});
[-CAGE/2, CAGE/2].forEach(x=>{
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,CAGE,8), barMat);
  r.rotation.z = Math.PI/2; r.position.set(x, topY, 0); cageGroup.add(r);
});

// =========================================================
//  OBJECTS
// =========================================================

// --- Exercise wheel ---
const wheelGroup = new THREE.Group();
const W_R = 1.9, W_TUBE = 0.11;
const wheelMat = mat(0x43a047,{rough:0.5});
const hub = new THREE.Mesh(new THREE.CylinderGeometry(W_TUBE*1.4,W_TUBE*1.4,W_R*2,10), wheelMat);
hub.rotation.x = Math.PI/2; wheelGroup.add(hub);
for(let i=0;i<14;i++){
  const a = i/14*Math.PI*2;
  const rung = new THREE.Mesh(new THREE.CylinderGeometry(W_TUBE,W_TUBE,W_R*2-0.15,8), wheelMat);
  rung.rotation.x = Math.PI/2;
  rung.position.set(Math.cos(a)*W_R, Math.sin(a)*W_R, 0);
  wheelGroup.add(rung);
}
const supportMat = mat(0x90a4ae,{metal:0.6,rough:0.35});
[-W_R-0.1, W_R+0.1].forEach(dx=>{
  const s = new THREE.Mesh(new THREE.BoxGeometry(0.14, W_R+0.4, 0.14), supportMat);
  s.position.set(dx, (W_R+0.4)/2-0.05, 0); wheelGroup.add(s);
  const foot = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.08, 0.4), supportMat);
  foot.position.set(dx, 0.02, 0); wheelGroup.add(foot);
});
wheelGroup.position.set(-4.6, W_R+0.5, 3);
scene.add(wheelGroup);

// --- Food bowl ---
const bowlGroup = new THREE.Group();
const bowl = new THREE.Mesh(new THREE.CylinderGeometry(1.0,0.7,0.5,14), mat(0x29b6f6,{rough:0.4}));
bowl.position.y = 0.25; bowl.castShadow = true; bowlGroup.add(bowl);
const foodMat = mat(0xf4a300,{rough:0.9});
for(let i=0;i<16;i++){
  const seed = new THREE.Mesh(new THREE.SphereGeometry(0.11+Math.random()*0.06,6,5), foodMat);
  seed.position.set((Math.random()-0.5)*0.7, 0.5+Math.random()*0.12,(Math.random()-0.5)*0.7);
  bowlGroup.add(seed);
}
bowlGroup.position.set(4.2, 0, -3.2);
scene.add(bowlGroup);

// --- Tunnel (two connected cones) ---
const tunnelMat = mat(0xff8a65,{rough:0.6,extra:{side:THREE.DoubleSide}});
const t1 = new THREE.Mesh(new THREE.ConeGeometry(1.1,3,16,1,true), tunnelMat);
t1.rotation.z = Math.PI/2; t1.position.set(0,1.1,-2); t1.castShadow=true;
const t2 = new THREE.Mesh(new THREE.ConeGeometry(1.1,3,16,1,true), tunnelMat);
t2.rotation.z = -Math.PI/2; t2.position.set(0,1.1,2); t2.castShadow=true;
scene.add(t1,t2);

// --- Toy ball ---
const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(0.6,0), mat(0xffd54f,{rough:0.4}));
ball.position.set(2.5,0.6,3); ball.castShadow=true; scene.add(ball);
const band = new THREE.Mesh(new THREE.TorusGeometry(0.6,0.06,8,20), mat(0xef5350,{rough:0.5}));
band.rotation.x = Math.PI/3; scene.add(band);
const band2 = band.clone(); band2.rotation.z = Math.PI/2; band2.rotation.x=0.5; scene.add(band2);

// =========================================================
//  HAMSTERS
// =========================================================
const hamsters = [];
const RADIUS = 6.0; // path radius for wandering

function makeHamster(color, name){
  const g = new THREE.Group();
  const body = mat(color,{rough:0.88});
  const bellyM = mat(0xfff5e6,{rough:0.9});
  const dark = mat(0x2a2a2a,{rough:0.4});
  const pink = mat(0xffb0b0,{rough:0.7});
  const noseM = mat(0xff8a80,{rough:0.6});

  // Body
  const bodyMesh = new THREE.Mesh(new THREE.SphereGeometry(1,12,10), body);
  bodyMesh.scale.set(1,0.82,1.28); bodyMesh.position.y = 0.95;
  bodyMesh.castShadow = true; g.add(bodyMesh);

  // Belly
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.82,10,8), bellyM);
  belly.scale.set(0.92,0.72,1.08); belly.position.set(0,0.78,0.28); g.add(belly);

  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.72,12,10), body);
  head.position.set(0,1.28,0.72); head.castShadow=true; g.add(head);

  // Cheeks
  [-0.42,0.42].forEach(x=>{
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.28,8,6), bellyM);
    c.position.set(x,1.06,0.56); g.add(c);
  });

  // Ears
  [-0.34,0.34].forEach(x=>{
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.2,8,6), body);
    e.scale.set(1,0.7,0.7); e.position.set(x,1.82,0.66); g.add(e);
    const inE = new THREE.Mesh(new THREE.SphereGeometry(0.12,6,5), pink);
    inE.position.set(x,1.82,0.72); g.add(inE);
  });

  // Eyes
  [-0.27,0.27].forEach(x=>{
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.13,10,8), dark);
    e.position.set(x,1.42,1.28); g.add(e);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.045,6,5), new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.2}));
    glint.position.set(x+0.03,1.46,1.36); g.add(glint);
  });

  // Nose
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.075,8,6), noseM);
  nose.position.set(0,1.28,1.42); g.add(nose);

  // Feet
  const feet=[];
  [[-0.42,-0.34],[0.42,-0.34],[-0.42,0.34],[0.42,0.34]].forEach(([fx,fz])=>{
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.17,8,6), pink);
    f.scale.set(1,0.55,1.25); f.position.set(fx,0.16,fz); g.add(f); feet.push(f);
  });

  // Tail
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.13,6,5), pink);
  tail.position.set(0,0.78,-1.15); g.add(tail);

  g.userData.feet = feet;
  return g;
}

// Build 5 hamsters with distinct personalities
const specs = [
  {color:0xffab91, x:0,   z:0,   name:'Tangerine'},
  {color:0xce93d8, x:3.2, z:2.6, name:'Grape'},
  {color:0xa1887f, x:-3.4,z:-2.6,name:'Choco'},
  {color:0xffd54f, x:-2.6,z:3.2, name:'Buttercup'},
  {color:0x80cbc4, x:2.6, z:-3.2, name:'Mint'},
];

specs.forEach((s,i)=>{
  const mesh = makeHamster(s.color, s.name);
  mesh.position.set(s.x, 0, s.z);
  scene.add(mesh);
  hamsters.push(makeBehavior(mesh, i));
});

function makeBehavior(mesh, idx){
  const b = {
    mesh,
    state:'wander',
    dir: Math.random()*Math.PI*2,
    speed: 0.9+Math.random()*0.6,
    timer: 2+Math.random()*4,
    pauseLen: 1.5+Math.random()*3,
    target:null,
    stateTimer:0,
    wiggle: Math.random()*Math.PI*2,
    hopPhase:0,
  };
  return b;
}

// ---------- Object definitions for interaction ----------
const WHEEL_POS = new THREE.Vector3(-4.6, 0, 3);
const BOWL_POS  = new THREE.Vector3(4.2, 0, -3.2);
const TUNNEL_POS= new THREE.Vector3(0, 0, 0);
const BALL_POS  = new THREE.Vector3(2.5, 0, 3);
let wheelAngle = 0, wheelSpeed = 0;

// ---------- Interaction helpers ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downX=0, downY=0;

renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(Math.hypot(e.clientX-downX, e.clientY-downY) > 6) return; // was a drag
  pointer.x = (e.clientX/innerWidth)*2-1;
  pointer.y = -(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(hamsters.map(h=>h.mesh), true);
  if(hits.length){
    const hitMesh = hits[0].object;
    const ham = hamsters.find(h=>h.mesh===hitMesh || h.mesh.children.includes(hitMesh));
    if(ham){
      // Choose a random fun target
      const targets=[[WHEEL_POS,'wheel'],[BOWL_POS,'food'],[TUNNEL_POS,'tunnel'],[BALL_POS,'ball']];
      const [tp,type] = targets[Math.floor(Math.random()*targets.length)];
      ham.state='goTo';
      ham.target = tp.clone();
      ham.action = type;
      ham.stateTimer = 0;
      showTip(`${ham.mesh.userData.name||'Hamster'} is going to ${type}! 🎉`);
    }
  }
});

const tipEl = document.getElementById('tip');
let tipTimer=null;
function showTip(t){
  tipEl.textContent=t; tipEl.style.opacity='1';
  clearTimeout(tipTimer);
  tipTimer=setTimeout(()=>tipEl.style.opacity='0', 2200);
}

// ---------- Update logic ----------
function updateHamster(b, dt){
  const m = b.mesh;
  const pos = m.position;

  // ---- State machine ----
  if(b.state==='wander'){
    b.timer -= dt;
    b.dir += (Math.random()-0.5)*0.06;
    // gentle attraction toward center so they stay in cage
    const toCenter = Math.atan2(-pos.z, -pos.x);
    b.dir += (toCenter - b.dir)*0.002;
    pos.x += Math.sin(b.dir)*b.speed*dt;
    pos.z += Math.cos(b.dir)*b.speed*dt;
    clampToBounds(pos);
    if(b.timer<=0){ b.state='pause'; b.stateTimer=b.pauseLen*(0.6+Math.random()*0.8); }
  } else if(b.state==='pause'){
    b.stateTimer -= dt;
    // small idle bobbing
    b.wiggle += dt*2;
    if(b.stateTimer<=0){ b.state='wander'; b.timer=2+Math.random()*5; }
  } else if(b.state==='goTo'){
    const d = new THREE.Vector2(pos.x-b.target.x, pos.z-b.target.z);
    const dist = d.length();
    if(dist>0.3){
      const desired = Math.atan2(-d.y, d.x);
      // smooth turn
      let diff = desired - b.dir;
      while(diff>Math.PI) diff-=Math.PI*2;
      while(diff<-Math.PI) diff+=Math.PI*2;
      b.dir += Math.max(-0.06, Math.min(0.06, diff));
      pos.x += Math.sin(b.dir)*b.speed*1.3*dt;
      pos.z += Math.cos(b.dir)*b.speed*1.*dt;
      clampToBounds(pos);
    } else {
      // arrived
      b.state='interact'; b.stateTimer = 1.8+Math.random()*1.5;
      b.bounceT = 0;
    }
  } else if(b.state==='interact'){
    b.stateTimer -= dt;
    b.bounceT += dt*6;
    const bounce = Math.abs(Math.sin(b.bounceT))*0.35;
    m.position.y = bounce;
    // interact visuals
    if(b.action==='wheel'){
      wheelSpeed = Math.min(wheelSpeed + 0.05, 0.5);
    } else if(b.action==='food'){
      bowlGroup.scale.setScalar(1 + Math.sin(b.bounceT*2)*0.04);
    }
    if(b.stateTimer<=0){
      m.position.y=0;
      // pick a new wander or continue
      b.state='wander'; b.timer=2+Math.random()*4;
    }
  }

  // ---- Face movement direction ----
  const facing = b.state==='goTo'||b.state==='wander' ? b.dir : b.dir;
  m.rotation.y = facing;

  // ---- Walk animation (leg swing + body bob) ----
  const moving = (b.state==='wander'||b.state==='goTo');
  if(moving){
    b.hopPhase += dt*b.speed*3.2;
    const legSwing = Math.sin(b.hopPhase);
    const feet = m.userData.feet;
    feet.forEach((f,i)=>{
      const ph = i%2===0?1:-1;
      f.position.y = 0.16 + Math.abs(Math.sin(b.hopPhase + ph*Math.PI))*0.06;
      f.position.z = (i<2?-1:1)*0.34 + Math.sin(b.hopPhase+ph*Math.PI)*0.08*(i<2?1:1)*0.0 + ((i%2)?0.06:-0.06);
    });
    // little body bob
    m.position.y += Math.abs(Math.sin(b.hopPhase))*0.03;
  } else {
    // ease feet back
    const feet = m.userData.feet;
    feet.forEach(f=>{ f.position.y += (0.16-f.position.y)*0.1; });
  }

  // idle wiggle when paused
  if(b.state==='pause'){
    b.wiggle += dt*1.5;
    m.rotation.z = Math.sin(b.wiggle)*0.03;
  } else {
    m.rotation.z *= 0.9;
  }
}

function clampToBounds(p){
  const lim = RADIUS;
  p.x = Math.max(-lim, Math.min(lim, p.x));
  p.z = Math.max(-lim, Math.min(lim, p.z));
}

// =========================================================
//  ANIMATION LOOP
// =========================================================
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  hamsters.forEach(h=>updateHamster(h, dt));

  // Spin the wheel based on speed (decays when nobody's using it)
  wheelSpeed *= 0.985;
  wheelAngle += wheelSpeed;
  wheelGroup.rotation.x = wheelAngle;

  // Ball gentle roll
  ball.position.y = 0.6 + Math.sin(t*1.5)*0.04;
  ball.rotation.y += dt*0.4;
  band.rotation.y += dt*0.3;
  band2.rotation.y -= dt*0.25;

  // Food bowl subtle bob
  bowlGroup.scale.setScalar(1 + Math.sin(t*2)*0.01);

  controls.update();
  renderer.render(scene, camera);
}

// ---------- Resize ----------
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
