<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fde7f0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  #app { width: 100%; height: 100%; display: block; }
  #title {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    color: #d6336c; font-size: 26px; font-weight: 800; letter-spacing: .5px;
    text-shadow: 0 2px 6px rgba(255,255,255,.8); pointer-events: none; white-space: nowrap;
  }
  #hint {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: #b06; font-size: 13px; background: rgba(255,255,255,.72);
    padding: 7px 16px; border-radius: 20px; pointer-events: none; white-space: nowrap;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  #info {
    position: absolute; top: 54px; left: 50%; transform: translateX(-50%);
    color: #a75; font-size: 12px; background: rgba(255,255,255,.6);
    padding: 5px 14px; border-radius: 16px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="title">🐹 Low-Poly Hamster Playground</div>
<div id="info"></div>
<div id="hint">Drag to rotate · Scroll to zoom · Click a hamster to pet it ✨</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ───────── renderer / scene / camera ───────── */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfce4f0);
scene.fog = new THREE.Fog(0xfce4f0, 30, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(15, 13, 17);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(0, 2, 0);
controls.minDistance = 8;
controls.maxDistance = 45;
controls.maxPolarAngle = Math.PI * 0.49;

/* ───────── lights ───────── */
scene.add(new THREE.HemisphereLight(0xffffff, 0xffe0b0, 0.75));
const sun = new THREE.DirectionalLight(0xfff5e0, 1.5);
sun.position.set(10, 22, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const s = 22;
sun.shadow.camera.left = -s; sun.shadow.camera.right = s;
sun.shadow.camera.top = s; sun.shadow.camera.bottom = -s;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0xffc0d0, 0.35)).position.set(-12, 10, -8);

/* ───────── constants ───────── */
const CAGE = 12, HALF = CAGE / 2, WALL_H = 4.2;

/* ───────── helpers ───────── */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.95, metalness: 0, ...opts });
}
const EYE_M = new THREE.MeshStandardMaterial({ color: 0x2b1a12, flatShading: true, roughness: 0.4 });
const PINK_M = new THREE.MeshStandardMaterial({ color: 0xff9cb6, flatShading: true, roughness: 0.8 });
const WHITE_M = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 0.8 });

/* ═══════════════════ THE CAGE ═══════════════════ */
const cage = new THREE.Group();
scene.add(cage);

// — tray (floor) —
const trayMat = mat(0xffd9e6);
const tray = new THREE.Mesh(new THREE.BoxGeometry(CAGE + 1.2, 0.6, CAGE + 1.2), trayMat);
tray.position.y = -0.3; tray.receiveShadow = true; cage.add(tray);

// — wood shavings —
const strawMat = new THREE.MeshStandardMaterial({ color: 0xf4d9a0, flatShading: true, roughness: 1 });
for (let i = 0; i < 160; i++) {
  const chip = new THREE.Mesh(new THREE.BoxGeometry(0.28 + Math.random() * 0.4, 0.07, 0.5 + Math.random() * 0.7), strawMat);
  chip.position.set((Math.random() - 0.5) * (CAGE - 0.8), 0.06, (Math.random() - 0.5) * (CAGE - 0.8));
  chip.rotation.y = Math.random() * Math.PI;
  chip.receiveShadow = true;
  cage.add(chip);
}

// — glass walls —
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xcfeeff, transparent: true, opacity: 0.14, roughness: 0.05,
  metalness: 0, transmission: 0.6, flatShading: true, side: THREE.DoubleSide
});
const frameMat = mat(0xff8fb8);
function wall(x, z, w, d, ry) {
  const g = new THREE.Group();
  const glass = new THREE.Mesh(new THREE.BoxGeometry(w, WALL_H, d), glassMat);
  glass.position.y = WALL_H / 2; g.add(glass);
  for (const hx of [-w / 2, w / 2]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.35, WALL_H + 0.3, 0.35), frameMat);
    post.position.set(hx, WALL_H / 2, 0); post.castShadow = true; g.add(post);
  }
  for (const zy of [0.25, WALL_H - 0.05]) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(w + 0.35, 0.3, 0.3), frameMat);
    bar.position.set(0, zy, 0); g.add(bar);
  }
  g.position.set(x, 0, z); g.rotation.y = ry;
  return g;
}
cage.add(wall(0, -HALF, CAGE, 0.3, 0));
cage.add(wall(0, HALF, CAGE, 0.3, 0));
cage.add(wall(-HALF, 0, 0.3, CAGE, Math.PI / 2));
cage.add(wall(HALF, 0, 0.3, CAGE, Math.PI / 2));

// — roof bars —
for (let i = -HALF + 1; i <= HALF - 1; i += 2) {
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, CAGE, 6), frameMat);
  bar.rotation.x = Math.PI / 2; bar.position.set(i, WALL_H + 0.2, 0); cage.add(bar);
}
for (let i = -HALF + 1; i <= HALF - 1; i += 2) {
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, CAGE, 6), frameMat);
  bar.rotation.z = Math.PI / 2; bar.position.set(0, WALL_H + 0.2, i); cage.add(bar);
}

/* ═══════════════════ INTERACTIVE OBJECTS ═══════════════════ */

// — exercise wheel —
const wheel = new THREE.Group();
const WHEEL_R = 2.4, RIBBON = 0.14;
const wheelMat = mat(0xff6b9d);
for (let i = 0; i < 14; i++) {
  const a = (i / 14) * Math.PI * 2;
  const rib = new THREE.Mesh(new THREE.CylinderGeometry(RIBBON, RIBBON, 1.5, 6), wheelMat);
  rib.rotation.x = Math.PI / 2;
  rib.position.set(Math.cos(a) * WHEEL_R, Math.sin(a) * WHEEL_R, 0);
  wheel.add(rib);
}
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.6, 8), wheelMat);
hub.rotation.x = Math.PI / 2; wheel.add(hub);
const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 2.6, 6), mat(0xd6336c));
axle.rotation.x = Math.PI / 2; wheel.add(axle);
wheel.position.set(-4.2, WHEEL_R + 0.4, -3.5);
scene.add(wheel);
// stand
const standMat = mat(0xd6336c);
for (const sx of [-1.1, 1.1]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.28, WHEEL_R + 0.6, 0.28), standMat);
  leg.position.set(-4.2 + sx * 1.1, (WHEEL_R + 0.6) / 2, -3.5); scene.add(leg);
}

// — food bowl —
const bowl = new THREE.Group();
const bowlMat = mat(0x4ecdc4);
const bowlMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 0.9, 0.7, 12, 1, true), bowlMat);
bowlMesh.position.y = 0.35; bowl.add(bowlMesh);
const bowlBase = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.12, 12), mat(0x3ba89f));
bowlBase.position.y = 0.06; bowl.add(bowlBase);
const foodMat = mat(0xd4a05a);
for (let i = 0; i < 10; i++) {
  const seed = new THREE.Mesh(new THREE.SphereGeometry(0.16 + Math.random() * 0.1, 5, 4), foodMat);
  seed.position.set((Math.random() - 0.5) * 1.2, 0.55 + Math.random() * 0.2, (Math.random() - 0.5) * 1.2);
  bowl.add(seed);
}
bowl.position.set(4, 0, 4);
scene.add(bowl);

// — tunnel —
const tunnelMat = mat(0xffe66d);
const tunnel = new THREE.Group();
const tunnelMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 5, 12, 1, true), tunnelMat);
tunnelMesh.rotation.z = Math.PI / 2; tunnel.add(tunnelMesh);
for (const x of [-2.5, 2.5]) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.14, 8, 16), mat(0xffcf3d));
  ring.position.x = x; ring.rotation.y = Math.PI / 2; tunnel.add(ring);
}
tunnel.position.set(1, 1.1, -3.5);
scene.add(tunnel);

// — little house —
const house = new THREE.Group();
const wallMatH = mat(0xa06fff);
const roofMatH = mat(0xff5e8a);
const hm = new THREE.Mesh(new THREE.BoxGeometry(3, 2.2, 2.6), wallMatH);
hm.position.y = 1.1; hm.castShadow = true; house.add(hm);
const roof = new THREE.Mesh(new THREE.CylinderGeometry(0, 2.3, 1.4, 4), roofMatH);
roof.rotation.y = Math.PI / 4; roof.position.y = 2.9; roof.castShadow = true; house.add(roof);
const door = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.3, 0.15), mat(0x5a3a7a));
door.position.set(0, 0.7, 1.32); house.add(door);
house.position.set(4.2, 0, -4);
scene.add(house);

// — chew toy (colored blocks on a stick) —
const toy = new THREE.Group();
const stickMat = mat(0xcaa060);
const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.2, 6), stickMat);
stick.rotation.z = 0.5; toy.add(stick);
const toyColors = [0xff6b6b, 4ecdc4, ffff6d, a06fff];
toyColors.forEach((c, i) => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), mat(c));
  const t = -0.6 + i * 0.4;
  b.position.set(Math.sin(0.5) * t, t * Math.cos(0.5) + 0.9, 0);
  b.rotation.y = i * 0.7; toy.add(b);
});
toy.position.set(-4, 0.4, 4);
scene.add(toy);

/* ═══════════════════ HAMSTERS ═══════════════════ */
const hamsters = [];

function makeHamster(bodyColor, bellyColor) {
  const h = new THREE.Group();

  const bodyMat = mat(bodyColor);
  const bellyMat = mat(bellyColor);

  // body
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), bodyMat);
  body.scale.set(1, 0.92, 1.18); body.position.y = 0.95; body.castShadow = true; h.add(body);
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.78, 10, 8), bellyMat);
  belly.scale.set(0.95, 0.85, 1.05); belly.position.set(0, 0.72, 0.28); h.add(belly);

  // head
  const head = new THREE.Group(); head.position.set(0, 1.15, 0.7);
  const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.62, 10, 8), bodyMat);
  headMesh.castShadow = true; head.add(headMesh);
  const snout = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 6), bellyMat);
  snout.scale.set(1, 0.8, 0.9); snout.position.set(0, -0.12, 0.46); head.add(snout);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 5), PINK_M);
  nose.position.set(0, -0.08, 0.7); head.add(nose);

  // ears
  for (const s of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 6), bodyMat);
    ear.scale.set(1, 1, 0.5); ear.position.set(s * 0.34, 0.52, 0.02); head.add(ear);
    const inner = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 5), PINK_M);
    inner.scale.set(1, 1, 0.4); inner.position.set(s * 0.34, 0.52, 0.08); head.add(inner);
  }

  // eyes
  for (const s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), WHITE_M);
    w.position.set(s * 0.28, 0.12, 0.46); head.add(w);
    const ey = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), EYE_M);
    ey.position.set(s * 0.28, 0.12, 0.56); head.add(ey);
    const gl = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 5), WHITE_M);
    gl.position.set(s * 0.26, 0.16, 0.62); head.add(gl);
  }

  // cheeks
  for (const s of [-1, 1]) {
    const ck = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 6), PINK_M);
    ck.scale.set(1, 0.9, 0.8); ck.position.set(s * 0.42, -0.06, 0.32); head.add(ck);
  }

  // feet
  const footMat = mat(bellyColor);
  for (const fx of [-0.4, 0.4]) for (const fz of [-0.35, 0.35]) {
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.16, 6, 5), footMat);
    f.scale.set(1, 0.6, 1.3); f.position.set(fx, 0.14, fz); h.add(f);
  }

  // tail
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.14, 6, 5), PINK_M);
  tail.position.set(0, 0.9, -1.05); h.add(tail);

  h.userData.head = head;
  h.userData.parts = { body, belly, head, snout, tail };
  return h;
}

const palette = [
  { body: 0xf4a878, belly: 0xfff3e6 },
  { body: 0xd9a066, belly: 0xffe8cc },
  { body: 0xc8a07a, belly: 0xfff0e0 },
  { body: 0xe8c8a0, belly: 0xfff6ee },
  { body: 0xc98b6b, belly: 0xffe0c8 },
];

const spawns = [
  { x: 2, z: 2 }, { x: -3, z: 3 }, { x: 3.5, z: -1 },
  { x: -2, z: -3.5 }, { x: 0.5, z: 4.5 },
];

spawns.forEach((p, i) => {
  const c = palette[i % palette.length];
  const m = makeHamster(c.body, c.belly);
  m.position.set(p.x, 0.15, p.z);
  m.userData.name = 'Hamster ' + (i + 1);
  scene.add(m);
  hamsters.push(m);
});

// a couple of scattered food pellets for flavour
const pelletMat = mat(0xcaa060);
for (let i = 0; i < 6; i++) {
  const p = new THREE.Mesh(new THREE.SphereGeometry(0.13, 6, 5), pelletMat);
  p.position.set((Math.random() - 0.5) * (CAGE - 2), 0.13, (Math.random() - 0.5) * (CAGE - 2));
  scene.add(p);
}

/* ═══════════════════ BEHAVIOUR ═══════════════════ */
const state = {
  idle: true, timer: 1 + Math.random() * 2,
  speed: 0, dir: Math.random() * Math.PI * 2,
  targetDir: 0, turnAmt: 0,
  objType: null, obj: null, objRadius: 0, objAngle: 0, objSpeed: 0, objDir: 1,
  pauseLen: 1.5 + Math.random() * 2, bobPhase: Math.random() * 10,
};

function chooseObject() {
  const opts = [wheel, bowl, tunnel, house];
  return opts[(Math.random() * opts.length) | 0];
}

function startMoving() {
  state.idle = false; state.speed = 1.4 + Math.random() * 1.4;
  state.targetDir = Math.random() * Math.PI * 2;
  state.turnAmt = 0; state.objType = null;
}

function startPause() {
  state.idle = true; state.speed = 0;
  state.pauseLen = 1.2 + Math.random() * 2.5;
  if (Math.random() < 0.45) {
    state.objType = 'spin'; state.obj = chooseObject();
    state.objAngle = Math.random() * Math.PI * 2;
    state.objSpeed = (1.4 + Math.random()) * (Math.random() < 0.5 ? 1 : -1);
    state.objDir = state.objSpeed > 0 ? 1 : -1;
  }
}

function boundaryCheck(pos) {
  const m = HALF - 1.4;
  if (pos.x > m) { pos.x = m; state.targetDir = Math.atan2(-pos.z, -pos.x); }
  if (pos.x < -m) { pos.x = -m; state.targetDir = Math.atan2(-pos.z, -pos.x); }
  if (pos.z > m) { pos.z = m; state.targetDir = Math.atan2(-pos.z, -pos.x); }
  if (pos.z < -m) { pos.z = -m; state.targetDir = Math.atan2(-pos.z, -pos.x); }
}

function hamStep(dt, h) {
  const u = h.userData, s = u.state;
  s.bobPhase += dt * (s.idle ? 1.5 : 5);

  if (!s.idle) {
    s.timer -= dt;
    if (s.timer <= 0) {
      if (Math.random() < 0.55) startPause(); else startMoving();
    }
    // random turns
    if (Math.random() < 0.02) s.targetDir += (Math.random() - 0.5) * 1.4;
    // occasional object visit while walking
    if (Math.random() < 0.004) {
      s.objType = 'walkTo'; s.obj = chooseObject();
      const p = s.obj.position;
      s.targetDir = Math.atan2(p.z - h.position.z, p.x - h.position.x);
      s.walkTarget = new THREE.Vector3(p.x + (Math.random() - 0.5) * 2, 0.15, p.z + (Math.random() - 0.5) * 2);
    }
    s.dir += (s.targetDir - s.dir) * Math.min(1, dt * 1.5);
    const dx = Math.sin(s.dir) * s.speed * dt;
    const dz = Math.cos(s.dir) * s.speed * dt;
    h.position.x += dx; h.position.z += dz;
    if (s.walkTarget && h.position.distanceTo(s.walkTarget) < 0.6) { startPause(); s.walkTarget = null; }
    boundaryCheck(h.position);
  } else {
    s.timer -= dt;
    if (s.timer <= 0) {
      if (s.objType === 'spin') { s.objType = null; startMoving(); }
      else startMoving();
    }
    if (s.objType === 'spin' && s.obj) {
      s.objAngle += s.objSpeed * dt;
      const r = s.objRadius;
      h.position.x = s.obj.position.x + Math.cos(s.objAngle) * r;
      h.position.z = s.obj.position.z + Math.sin(s.objAngle) * r;
      s.dir = s.objAngle + Math.PI / 2 * s.objDir;
      h.rotation.y = s.dir;
      const bp = s.bobPhase;
      u.parts.body.position.y = 0.95 + Math.sin(bp) * 0.05;
      u.parts.head.position.y = 1.15 + Math.sin(bp * 1.3) * 0.05;
      u.parts.head.rotation.x = Math.sin(bp * 0.7) * 0.12;
      u.parts.body.scale.y = 0.92 + Math.sin(bp) * 0.04;
    } else {
      // gentle idle bobbing
      const bp = s.bobPhase;
      u.parts.body.position.y = 0.95 + Math.sin(bp) * 0.02;
      u.parts.head.rotation.z = Math.sin(bp * 0.5) * 0.06;
      u.parts.head.rotation.x = Math.sin(bp * 0.8) * 0.05;
    }
  }

  // face movement direction when moving
  if (!s.idle) h.rotation.y += ((s.dir - h.rotation.y + Math.PI) % (Math.PI * 2)) - Math.PI;

  // little wiggle when idle
  if (s.idle && s.objType !== 'spin') u.parts.head.rotation.y = Math.sin(s.bobPhase * 0.4) * 0.15;
}

/* ═══════════════════ INTERACTION ═══════════════════ */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let selected = null, happyTimer = 0;

renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(hamsters, true);
  if (hits.length) {
    let root = hits[0].object;
    while (root.parent && !root.userData.name) root = root.parent;
    selected = root; happyTimer = 2.5;
    const s = root.userData.state;
    s.idle = false; s.speed = 2.4; s.objType = null; s.timer = 1.5;
    s.targetDir = Math.random() * Math.PI * 2;
  } else { selected = null; }
});

const infoEl = document.getElementById('info');

/* ═══════════════════ ANIMATION LOOP ═══════════════════ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // wheel spin
  wheel.rotation.z += dt * 3;

  hamsters.forEach(h => hamStep(dt, h));

  // happy bounce on selected hamster
  if (selected) {
    happyTimer -= dt;
    const bounce = Math.abs(Math.sin(t * 12)) * 0.35;
    selected.position.y = 0.15 + bounce;
    if (happyTimer <= 0) { selected = null; }
  } else {
    // ease selected hamsters back to ground
    hamsters.forEach(h => {
      if (h !== selected) h.position.y += (0.15 - h.position.y) * Math.min(1, dt * 6);
    });
  }

  // info text
  if (selected && happyTimer > 0) infoEl.textContent = '✨ ' + selected.userData.name + ' is happy!';
  else infoEl.textContent = hamsters.filter(h => !h.userData.state.idle).length + ' hamster(s) running right now 🏃';

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
