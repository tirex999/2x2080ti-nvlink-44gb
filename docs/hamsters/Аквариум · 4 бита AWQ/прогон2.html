<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>3D Аквариум</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #001a33; }
  canvas { display: block; }

  .panel {
    position: absolute;
    background: rgba(10, 30, 60, 0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(100, 200, 255, 0.25);
    border-radius: 14px;
    padding: 16px 20px;
    color: #cfeaff;
    box-shadow: 0 8px 32px rgba(0, 20, 60, 0.5), 0 0 20px rgba(0, 150, 255, 0.1);
    z-index: 10;
  }

  #infoPanel { top: 20px; left: 20px; width: 260px; }
  #infoPanel h1 {
    font-size: 20px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #4dd0ff, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #infoPanel ul { list-style: none; font-size: 12px; line-height: 1.7; opacity: 0.85; }
  #infoPanel li::before { content: "▸ "; color: #4dd0ff; }

  #statsPanel { top: 20px; right: 20px; text-align: right; min-width: 150px; }
  #statsPanel .stat { font-size: 14px; margin-bottom: 4px; }
  #statsPanel .stat b { color: #4dd0ff; font-size: 16px; }

  .btn-row { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  button {
    padding: 9px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #0e7490, #1d4ed8);
    box-shadow: 0 4px 12px rgba(0, 100, 200, 0.4);
    transition: all 0.2s ease;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 180, 255, 0.6);
    background: linear-gradient(135deg, #06b6d4, #3b82f6);
  }
  button:active { transform: translateY(0); }
</style>
</head>
<body>

<div id="infoPanel" class="panel">
  <h1>🐠 3D Аквариум</h1>
  <ul>
    <li>ЛКМ + движение — вращение</li>
    <li>ПКМ + движение — панорама</li>
    <li>Колесо — зум</li>
    <li>Клик по воде — кормить</li>
  </ul>
  <div class="btn-row">
    <button id="btnFish">➕ Добавить рыбку</button>
    <button id="btnBubbles">🫧 Больше пузырей</button>
    <button id="btnLight">💡 Свет: Вкл</button>
  </div>
</div>

<div id="statsPanel" class="panel">
  <div class="stat">Рыбок: <b id="fishCount">0</b></div>
  <div class="stat">FPS: <b id="fpsCounter">0</b></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ==================== БАЗА ====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x001a33);
scene.fog = new THREE.FogExp2(0x002a55, 0.012);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(30, 22, 40);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 1.8;
controls.target.set(0, 11, 0);

// Границы аквариума (36 x 24 x 20)
const TANK = { hx: 18, hy: 12, hz: 10, floorY: 0 };

// ==================== ОСВЕЩЕНИЕ ====================
const ambient = new THREE.AmbientLight(0x404040, 0.4);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xaaddff, 1.1);
sun.position.set(15, 35, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
sun.shadow.camera.top = 25;  sun.shadow.camera.bottom = -25;
sun.shadow.camera.far = 100;
scene.add(sun);

const pl1 = new THREE.PointLight(0x00ccff, 0.6, 50);
pl1.position.set(10, 16, 5);
scene.add(pl1);

const pl2 = new THREE.PointLight(0x2244ff, 0.6, 50);
pl2.position.set(-10, 16, -5);
scene.add(pl2);

// ==================== АКВАРИУМ ====================
// Стеклянный корпус
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x88ccff, metalness: 0, roughness: 0.05,
  transmission: 0.95, thickness: 0.5, transparent: true, opacity: 0.25,
  side: THREE.DoubleSide
});
const glassBox = new THREE.Mesh(new THREE.BoxGeometry(TANK.hx*2, TANK.hy*2, TANK.hz*2), glassMat);
glassBox.position.y = TANK.hy;
scene.add(glassBox);

// Рамка
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(TANK.hx*2, TANK.hy*2, TANK.hz*2)),
  new THREE.LineBasicMaterial({ color: 0x66bbff, transparent: true, opacity: 0.6 })
);
edges.position.copy(glassBox.position);
scene.add(edges);

// Песчаное дно
const sandGeo = new THREE.PlaneGeometry(TANK.hx*2, TANK.hz*2, 40, 30);
{
  const pos = sandGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    pos.setZ(i, Math.sin(x*0.5)*Math.cos(y*0.7)*0.35 + (Math.random()-0.5)*0.25);
  }
  sandGeo.computeVertexNormals();
}
const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({ color: 0xd8c07a, roughness: 0.95 }));
sand.rotation.x = -Math.PI/2;
sand.receiveShadow = true;
scene.add(sand);

// Камни
for (let i = 0; i < 8; i++) {
  const geo = new THREE.DodecahedronGeometry(0.8 + Math.random()*1.2, 0);
  const p = geo.attributes.position;
  for (let j = 0; j < p.count; j++) {
    p.setXYZ(j,
      p.getX(j)*(0.7 + Math.random()*0.6),
      p.getY(j)*(0.7 + Math.random()*0.6),
      p.getZ(j)*(0.7 + Math.random()*0.6));
  }
  geo.computeVertexNormals();
  const rock = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.08 + Math.random()*0.05, 0.15, 0.3 + Math.random()*0.15),
    roughness: 0.9
  }));
  rock.position.set((Math.random()-0.5)*TANK.hx*1.7, 0.5, (Math.random()-0.5)*TANK.hz*1.7);
  rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
  rock.castShadow = rock.receiveShadow = true;
  scene.add(rock);
}

// Водоросли
const algaeList = [];
for (let i = 0; i < 12; i++) {
  const h = 3 + Math.random()*5;
  const bx = (Math.random()-0.5)*TANK.hx*1.7;
  const bz = (Math.random()-0.5)*TANK.hz*1.7;
  const pts = [];
  for (let s = 0; s <= 6; s++) {
    const t = s/6;
    pts.push(new THREE.Vector3(bx + Math.sin(t*4+i)*0.4*t, t*h, bz + Math.cos(t*3+i)*0.4*t));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 12, 0.18 - h*0.012, 6),
    new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.33 + Math.random()*0.08, 0.7, 0.35), roughness: 0.8 })
  );
  mesh.castShadow = true;
  scene.add(mesh);
  algaeList.push({ mesh, baseRotX: 0, baseRotZ: 0, speed: 0.5 + Math.random(), phase: Math.random()*Math.PI*2, amp: 0.06 + Math.random()*0.06 });
}

// ==================== БУБЫРИ ====================
const bubbleGeo = new THREE.SphereGeometry(0.18, 10, 8);
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0,
  transmission: 0.9, transparent: true, opacity: 0.35
});
const bubbles = [];
function addBubble() {
  const b = new THREE.Mesh(bubbleGeo, bubbleMat);
  b.position.set((Math.random()-0.5)*TANK.hx*1.8, Math.random()*TANK.hy*1.8, (Math.random()-0.5)*TANK.hz*1.8);
  scene.add(b);
  bubbles.push({
    mesh: b, baseX: b.position.x, baseZ: b.position.z,
    speed: 1 + Math.random()*2, phase: Math.random()*Math.PI*2,
    scale: 0.5 + Math.random()
  });
}
for (let i = 0; i < 30; i++) addBubble();

// ==================== РЫБКИ ====================
const COLOR_SCHEMES = [
  { body: 0xff7722, fin: 0xffaa44 },   // оранжевая
  { body: 0x2266ff, fin: 0x66aaff },   // синяя
  { body: 0xffdd00, fin: 0xff3322 },   // жёлто-красная
  { body: 0x9933ff, fin: 0xcc88ff },   // фиолетовая
  { body: 0xdd2222, fin: 0xff6666 },   // красная
  { body: 0x22cc66, fin: 0x88ffaa },   // зелёная
  { body: 0xff77cc, fin: 0xffbbee },   // розовая
  { body: 0xffc040, fin: 0xffe088 },   // золотая
];

const fishArray = [];
const eyeWhiteGeo = new THREE.SphereGeometry(0.13, 8, 6);
const pupilGeo = new THREE.SphereGeometry(0.06, 6, 5);
const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

function createFish() {
  const scheme = COLOR_SCHEMES[Math.floor(Math.random()*COLOR_SCHEMES.length)];
  const g = new THREE.Group();
  const scale = 0.6 + Math.random()*0.6;

  // Тело
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(1, 16, 12),
    new THREE.MeshStandardMaterial({ color: scheme.body, roughness: 0.4, metalness: 0.15 })
  );
  body.scale.set(0.65, 0.85, 1.6);
  body.castShadow = true;
  g.add(body);

  // Хвост (пивот для вращения по Z)
  const tailPivot = new THREE.Group();
  tailPivot.position.set(0, 0, -1.5);
  const tail = new THREE.Mesh(
    new THREE.ConeGeometry(0.55, 1.1, 8),
    new THREE.MeshStandardMaterial({ color: scheme.fin, roughness: 0.5 })
  );
  tail.rotation.x = -Math.PI/2;
  tail.position.z = -0.55;
  tail.castShadow = true;
  tailPivot.add(tail);
  g.add(tailPivot);

  // Верхний плавник
  const topFin = new THREE.Mesh(
    new THREE.ConeGeometry(0.35, 0.9, 6),
    new THREE.MeshStandardMaterial({ color: scheme.fin, roughness: 0.5 })
  );
  topFin.position.set(0, 0.85, -0.2);
  g.add(topFin);

  // Боковые плавники
  const finGeo = new THREE.SphereGeometry(0.3, 8, 6);
  const finMat = new THREE.MeshStandardMaterial({ color: scheme.fin, roughness: 0.5 });
  const leftFin = new THREE.Mesh(finGeo, finMat);
  leftFin.scale.set(0.35, 0.9, 1.4);
  leftFin.position.set(0.55, -0.25, 0.2);
  leftFin.rotation.z = 0.4;
  g.add(leftFin);
  const rightFin = new THREE.Mesh(finGeo.clone(), finMat);
  rightFin.scale.set(0.35, 0.9, 1.4);
  rightFin.position.set(-0.55, -0.25, 0.2);
  rightFin.rotation.z = -0.4;
  g.add(rightFin);

  // Глаза (рыбка смотрит вдоль +Z)
  [[0.32, 0.25], [-0.32, 0.25]].forEach(([ex, ey]) => {
    const ew = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
    ew.position.set(ex, ey, 1.25);
    g.add(ew);
    const pu = new THREE.Mesh(pupilGeo, pupilMat);
    pu.position.set(ex, ey, 1.36);
    g.add(pu);
  });

  g.scale.setScalar(scale);
  g.position.set(
    (Math.random()-0.5)*TANK.hx*1.5,
    2 + Math.random()*(TANK.hy*2 - 4),
    (Math.random()-0.5)*TANK.hz*1.5
  );
  scene.add(g);

  const v = new THREE.Vector3(Math.random()-0.5, (Math.random()-0.5)*0.3, Math.random()-0.5).normalize();
  fishArray.push({
    mesh: g, tail: tailPivot, topFin, leftFin, rightFin,
    velocity: v.multiplyScalar(0.01),
    speed: 0.03 + Math.random()*0.03,
    tailSpeed: 6 + Math.random()*5,
    phase: Math.random()*Math.PI*2,
    targetFood: null,
    avoidanceRadius: 2 + Math.random()*1.5,
    wanderTimer: 0,
    baseScale: scale
  });
}
for (let i = 0; i < 15; i++) createFish();

// ==================== КОРМ ====================
const foods = [];
const foodGeo = new THREE.SphereGeometry(0.22, 8, 6);
const foodMat = new THREE.MeshStandardMaterial({ color: 0xff8833, emissive: 0x442200 });

function spawnFood(point) {
  const f = new THREE.Mesh(foodGeo, foodMat);
  f.position.copy(point);
  f.position.y = Math.min(f.position.y, TANK.hy*2 - 1);
  scene.add(f);
  foods.push({ mesh: f, vy: 0 });
}

// Клик по аквариуму (различаем клик и drag)
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downPos = null;
renderer.domElement.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPos) return;
  const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
  downPos = null;
  if (dx*dx + dy*dy > 25) return; // это было вращение камеры
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(glassBox);
  if (hits.length) {
    const p = hits[0].point;
    p.x = THREE.MathUtils.clamp(p.x, -TANK.hx+1, TANK.hx-1);
    p.z = THREE.MathUtils.clamp(p.z, -TANK.hz+1, TANK.hz-1);
    spawnFood(p);
  }
});

// ==================== UI ====================
const btnLight = document.getElementById('btnLight');
document.getElementById('btnFish').onclick = () => createFish();
document.getElementById('btnBubbles').onclick = () => { for (let i = 0; i < 10; i++) addBubble(); };
btnLight.onclick = () => {
  sun.intensity = sun.intensity > 0 ? 0 : 1.1;
  btnLight.textContent = sun.intensity > 0 ? '💡 Свет: Вкл' : '💡 Свет: Выкл';
};

// FPS
let frames = 0, lastFpsTime = performance.now();

// ==================== ЦИКЛ ====================
const clock = new THREE.Clock();
const tmpVec = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // --- Рыбки ---
  for (const fish of fishArray) {
    const m = fish.mesh;
    const pos = m.position;

    // Поиск корма
    let bestFood = null, bestDist = 15;
    for (const f of foods) {
      const d = pos.distanceTo(f.mesh.position);
      if (d < bestDist) { bestDist = d; bestFood = f; }
    }
    fish.targetFood = bestFood;

    // Случайное блуждание
    fish.wanderTimer -= dt;
    if (fish.wanderTimer <= 0) {
      fish.wanderTimer = 2 + Math.random()*4;
      if (!bestFood) {
        fish.velocity.add(tmpVec.set(Math.random()-0.5, (Math.random()-0.5)*0.4, Math.random()-0.5).multiplyScalar(0.015));
      }
    }

    // Избегание других рыбок
    for (const other of fishArray) {
      if (other === fish) continue;
      const d = pos.distanceTo(other.mesh.position);
      if (d < fish.avoidanceRadius && d > 0.001) {
        tmpVec.copy(pos).sub(other.mesh.position).normalize().multiplyScalar(0.02 * (1 - d/fish.avoidanceRadius));
        fish.velocity.add(tmpVec);
      }
    }

    // Стремление к корму
    if (bestFood) {
      tmpVec.copy(bestFood.mesh.position).sub(pos).normalize().multiplyScalar(0.03);
      fish.velocity.add(tmpVec);
    }

    // Отражение от стен
    const mx = TANK.hx - 1.5, mz = TANK.hz - 1.5;
    if (pos.x >  mx) fish.velocity.x -= 0.01;
    if (pos.x < -mx) fish.velocity.x += 0.01;
    if (pos.z >  mz) fish.velocity.z -= 0.01;
    if (pos.z < -mz) fish.velocity.z += 0.01;
    if (pos.y > TANK.hy*2 - 1.5) fish.velocity.y -= 0.01;
    if (pos.y < 1.5)             fish.velocity.y += 0.01;

    // Ограничение скорости
    const sp = fish.velocity.length();
    if (sp > fish.speed) fish.velocity.multiplyScalar(fish.speed / sp);
    if (sp < fish.speed * 0.3) fish.velocity.multiplyScalar(1.05);

    pos.add(fish.velocity);

    // Поворот в направлении движения
    if (sp > 0.001) {
      const lookTarget = tmpVec.copy(pos).add(fish.velocity);
      const prevQ = m.quaternion.clone();
      m.lookAt(lookTarget);
      m.rotateY(Math.PI / 2); // модель смотрит вдоль +Z, lookAt ориентирует +Z -> корректировка
      m.quaternion.slerp(prevQ, 0.08);
    }

    // Анимация хвоста и плавников
    fish.tail.rotation.z = Math.sin(t * fish.tailSpeed + fish.phase) * 0.6;
    fish.leftFin.rotation.z  =  0.4 + Math.sin(t * fish.tailSpeed * 0.7 + fish.phase) * 0.25;
    fish.rightFin.rotation.z = -0.4 - Math.sin(t * fish.tailSpeed * 0.7 + fish.phase) * 0.25;
    fish.topFin.rotation.z   =  Math.sin(t * fish.tailSpeed * 0.5 + fish.phase) * 0.15;

    // Съедание корма
    if (bestFood && bestDist < 0.9) {
      scene.remove(bestFood.mesh);
      foods.splice(foods.indexOf(bestFood), 1);
      fish.baseScale *= 1.05; // рост на 5%
      m.scale.setScalar(fish.baseScale);
      fish.targetFood = null;
    }
  }

  // --- Корм ---
  for (let i = foods.length - 1; i >= 0; i--) {
    const f = foods[i];
    f.vy -= 0.03 * dt * 60; // гравитация
    f.mesh.position.y += f.vy * dt * 60 * 0.02;
    f.mesh.rotation.y += dt;
    if (f.mesh.position.y <= 0.3) {
      scene.remove(f.mesh);
      foods.splice(i, 1);
    }
  }

  // --- Пузыри ---
  for (const b of bubbles) {
    const m = b.mesh;
    m.position.y += b.speed * dt;
    m.position.x = b.baseX + Math.sin(t * 1.5 + b.phase) * 0.6;
    m.position.z = b.baseZ + Math.cos(t * 1.2 + b.phase) * 0.6;
    m.scale.setScalar(b.scale);
    if (m.position.y > TANK.hy*2 - 0.5) {
      m.position.y = 0.5;
      b.baseX = (Math.random()-0.5)*TANK.hx*1.8;
      b.baseZ = (Math.random()-0.5)*TANK.hz*1.8;
    }
  }

  // --- Водоросли ---
  for (const a of algaeList) {
    a.mesh.rotation.x = a.baseRotX + Math.sin(t * a.speed + a.phase) * a.amp;
    a.mesh.rotation.z = a.baseRotZ + Math.cos(t * a.speed * 0.8 + a.phase) * a.amp;
  }

  controls.update();
  renderer.render(scene, camera);

  // Статистика
  frames++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    document.getElementById('fpsCounter').textContent = frames;
    document.getElementById('fishCount').textContent = fishArray.length;
    frames = 0;
    lastFpsTime = now;
  }
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
