<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐠 3D Аквариум</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif;
           background: linear-gradient(#050d1f, #0a2a4a); }
    canvas { display: block; }

    .panel {
        position: absolute; padding: 16px 18px; border-radius: 14px;
        background: rgba(10, 30, 60, 0.45);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(120, 200, 255, 0.25);
        color: #dff2ff; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        z-index: 10;
    }
    #info   { top: 16px; left: 16px; max-width: 260px; }
    #stats  { top: 16px; right: 16px; text-align: center; min-width: 130px; }

    h1 {
        font-size: 20px; margin-bottom: 10px;
        background: linear-gradient(90deg, #4dd0ff, #7effc0);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .hint { font-size: 12px; line-height: 1.6; opacity: 0.85; margin-bottom: 12px; }
    .hint b { color: #7effc0; }

    .stat-line { font-size: 14px; margin: 4px 0; }
    .stat-val  { color: #7effc0; font-weight: bold; }

    button {
        display: block; width: 100%; margin-top: 8px; padding: 9px 12px;
        border: none; border-radius: 8px; cursor: pointer;
        font-size: 13px; font-weight: 600; color: #fff;
        background: linear-gradient(135deg, #1e6fd9, #35b8e8);
        box-shadow: 0 3px 12px rgba(40, 150, 230, 0.4);
        transition: transform .15s, box-shadow .15s, filter .15s;
    }
    button:hover {
        transform: translateY(-2px); filter: brightness(1.15);
        box-shadow: 0 6px 18px rgba(60, 190, 255, 0.6);
    }
    button:active { transform: translateY(0); }
    button.off { background: linear-gradient(135deg, #555, #777); }
</style>
</head>
<body>

<div class="panel" id="info">
    <h1>🐠 3D Аквариум</h1>
    <div class="hint">
        <b>ЛКМ + движение</b> — вращение<br>
        <b>ПКМ + движение</b> — панорама<br>
        <b>Колесо</b> — зум<br>
        <b>Клик по аквариуму</b> — кормить 🍤
    </div>
    <button id="btnFish">➕ Добавить рыбку</button>
    <button id="btnBubbles">🫧 Больше пузырей</button>
    <button id="btnLight">💡 Свет: ВКЛ</button>
</div>

<div class="panel" id="stats">
    <div class="stat-line">🐟 Рыбки: <span class="stat-val" id="fishCount">0</span></div>
    <div class="stat-line">⚡ FPS: <span class="stat-val" id="fps">0</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ================= ОСНОВА ================= */
const TANK = { w: 36, h: 24, d: 20 };
const HALF = { x: TANK.w / 2, y: TANK.h / 2, z: TANK.d / 2 };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x081830);
scene.fog = new THREE.FogExp2(0x0a2a4a, 0.011);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 10, 42);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, HALF.y - 2, 0);
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 1.8;
controls.enableDamping = true;
controls.dampingFactor = 0.06;

/* ================= СВЕТ ================= */
scene.add(new THREE.AmbientLight(0x404040, 0.4));

const sun = new THREE.DirectionalLight(0xfff4e0, 1.0);
sun.position.set(15, 35, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
sun.shadow.camera.top = 25;   sun.shadow.camera.bottom = -25;
sun.shadow.camera.far = 80;
scene.add(sun);

const pLight1 = new THREE.PointLight(0x4488ff, 0.5, 50);
pLight1.position.set(-12, 6, 6);
scene.add(pLight1);
const pLight2 = new THREE.PointLight(0x2266aa, 0.5, 50);
pLight2.position.set(12, 6, -6);
scene.add(pLight2);

/* ================= АКВАРИУМ ================= */
// Стеклянный корпус
const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0x99d5ff, metalness: 0, roughness: 0.05,
    transmission: 0.95, transparent: true, opacity: 0.25,
    side: THREE.DoubleSide, depthWrite: false
});
const glass = new THREE.Mesh(new THREE.BoxGeometry(TANK.w, TANK.h, TANK.d), glassMat);
glass.position.y = HALF.y;
scene.add(glass);
const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(glass.geometry),
    new THREE.LineBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.5 })
);
edges.position.copy(glass.position);
scene.add(edges);

// Песчаное дно с процедурными неровностями
{
    const g = new THREE.PlaneGeometry(TANK.w, TANK.d, 40, 30);
    const pos = g.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        pos.setZ(i, Math.random() * 0.5 +
            Math.sin(pos.getX(i) * 0.5) * 0.15);
    }
    g.computeVertexNormals();
    const sand = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
        color: 0xc2a25f, roughness: 0.95
    }));
    sand.rotation.x = -Math.PI / 2;
    sand.receiveShadow = true;
    scene.add(sand);
}

// Камни
for (let i = 0; i < 8; i++) {
    const size = 0.8 + Math.random() * 1.2;
    const g = new THREE.DodecahedronGeometry(size, 0);
    const pos = g.attributes.position;
    for (let v = 0; v < pos.count; v++) {
        pos.setXYZ(v,
            pos.getX(v) * (0.8 + Math.random() * 0.4),
            pos.getY(v) * (0.8 + Math.random() * 0.4),
            pos.getZ(v) * (0.8 + Math.random() * 0.4));
    }
    g.computeVertexNormals();
    const rock = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 0.15, 0.3 + Math.random() * 0.2),
        roughness: 0.9, flatShading: true
    }));
    rock.position.set(
        (Math.random() - 0.5) * (TANK.w - 6),
        size * 0.35,
        (Math.random() - 0.5) * (TANK.d - 6)
    );
    rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    rock.castShadow = rock.receiveShadow = true;
    scene.add(rock);
}

// Водоросли (TubeGeometry + CatmullRomCurve3)
const seaweeds = [];
for (let i = 0; i < 12; i++) {
    const bush = new THREE.Group();
    const blades = 3 + Math.floor(Math.random() * 3);
    for (let b = 0; b < blades; b++) {
        const h = 3 + Math.random() * 4;
        const pts = [];
        const ox = (Math.random() - 0.5) * 1.2;
        const oz = (Math.random() - 0.5) * 1.2;
        for (let s = 0; s <= 4; s++) {
            const t = s / 4;
            pts.push(new THREE.Vector3(
                ox + Math.sin(t * 3 + b) * 0.6 * t,
                t * h,
                oz + Math.cos(t * 2.5 + b) * 0.6 * t
            ));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const blade = new THREE.Mesh(
            new THREE.TubeGeometry(curve, 8, 0.16 * (1 - 0.4 * (blades - 1) / 4), 5, false),
            new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(0.33 + Math.random() * 0.08, 0.7, 0.3 + Math.random() * 0.2),
                roughness: 0.8
            })
        );
        blade.castShadow = true;
        bush.add(blade);
    }
    bush.position.set(
        (Math.random() - 0.5) * (TANK.w - 8),
        0.3,
        (Math.random() - 0.5) * (TANK.d - 8)
    );
    bush.userData.phase = Math.random() * Math.PI * 2;
    scene.add(bush);
    seaweeds.push(bush);
}

/* ================= БУБЫРИ ================= */
const bubbles = [];
function addBubble(x, y, z) {
    const r = 0.1 + Math.random() * 0.25;
    const m = new THREE.Mesh(
        new THREE.SphereGeometry(r, 10, 8),
        new THREE.MeshPhysicalMaterial({
            color: 0xaaddff, metalness: 0, roughness: 0,
            transmission: 0.9, transparent: true, opacity: 0.35
        })
    );
    m.position.set(
        x !== undefined ? x : (Math.random() - 0.5) * (TANK.w - 4),
        y !== undefined ? y : Math.random() * TANK.h,
        z !== undefined ? z : (Math.random() - 0.5) * (TANK.d - 4)
    );
    scene.add(m);
    bubbles.push({ mesh: m, speed: 1.5 + Math.random() * 2.5,
                   phase: Math.random() * Math.PI * 2, amp: 0.3 + Math.random() * 0.5 });
}
for (let i = 0; i < 30; i++) addBubble();

/* ================= РЫБКИ ================= */
const SCHEMES = [
    { body: 0xff7f2a, tail: 0xffa040, fin: 0xffc060 }, // оранжевая
    { body: 0x2277ff, tail: 0x3399ff, fin: 0x66bbff }, // синяя
    { body: 0xffcc00, tail: 0xff3300, fin: 0xff6600 }, // жёлто-красная
    { body: 0x9944ff, tail: 0xbb66ff, fin: 0xcc88ff }, // фиолетовая
    { body: 0xff2233, tail: 0xff5566, fin: 0xff8899 }, // красная
    { body: 0x33cc55, tail: 0x55ee77, fin: 0x88ffaa }, // зелёная
    { body: 0xff77aa, tail: 0xffaacc, fin: 0xffccee }, // розовая
    { body: 0xffc030, tail: 0xffd860, fin: 0xffe890 }  // золотая
];

const fishArray = [];
const tmpObj = new THREE.Object3D();
const tmpV = new THREE.Vector3();

function createFish(scale) {
    scale = scale || 0.6 + Math.random() * 0.6;
    const s = SCHEMES[Math.floor(Math.random() * SCHEMES.length)];
    const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, metalness: 0.1 });

    const g = new THREE.Group();

    // Тело (масштабированная сфера, нос в +Z)
    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 12), mat(s.body));
    body.scale.set(0.55, 0.45, 1.2);
    body.castShadow = true;
    g.add(body);

    // Глаза
    [[-1], [1]].forEach(([side]) => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 8), mat(0xffffff));
        eye.position.set(side * 0.24, 0.14, 0.72);
        g.add(eye);
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), mat(0x111111));
        pupil.position.set(side * 0.26, 0.14, 0.82);
        g.add(pupil);
    });

    // Хвост (пирамидка, вращается по Z)
    const tail = new THREE.Group();
    tail.position.set(0, 0, -1.15);
    const tailMesh = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.9, 8), mat(s.tail));
    tailMesh.geometry.rotateX(-Math.PI / 2);
    tailMesh.position.z = -0.45;
    tailMesh.scale.z = 0.35;
    tailMesh.castShadow = true;
    tail.add(tailMesh);
    g.add(tail);

    // Верхний плавник
    const dorsal = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.7, 8), mat(s.fin));
    dorsal.position.set(0, 0.45, 0);
    dorsal.scale.z = 0.3;
    g.add(dorsal);

    // Боковые плавники
    const leftFin = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.6, 8), mat(s.fin));
    leftFin.position.set(-0.5, -0.1, 0.1);
    leftFin.rotation.set(Math.PI / 2.5, 0, 0.3);
    leftFin.scale.set(0.3, 1, 1);
    g.add(leftFin);
    const rightFin = leftFin.clone();
    rightFin.position.x = 0.5;
    rightFin.rotation.z = -0.3;
    g.add(rightFin);

    g.scale.setScalar(scale);
    g.position.set(
        (Math.random() - 0.5) * (TANK.w - 8),
        2 + Math.random() * (TANK.h - 5),
        (Math.random() - 0.5) * (TANK.d - 8)
    );
    scene.add(g);

    const v = new THREE.Vector3(Math.random() - 0.5, (Math.random() - 0.5) * 0.3, Math.random() - 0.5).normalize();
    fishArray.push({
        mesh: g, tail, leftFin, rightFin,
        velocity: v,
        speed: 2 + Math.random() * 2,
        tailSpeed: 6 + Math.random() * 5,
        phase: Math.random() * Math.PI * 2,
        targetFood: null,
        avoidanceRadius: 1.5 * scale,
        wanderTimer: Math.random() * 3
    });
}
for (let i = 0; i < 15; i++) createFish();

/* ================= КОРМ ================= */
const foods = [];
function spawnFood(point) {
    const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0xd9772a, emissive: 0x552200, roughness: 0.7 })
    );
    m.position.copy(point);
    scene.add(m);
    foods.push({ mesh: m, vel: new THREE.Vector3((Math.random() - 0.5), -1, (Math.random() - 0.5)), active: true });
}
function removeFood(f) {
    scene.remove(f.mesh);
    f.mesh.geometry.dispose();
    f.active = false;
}

/* ================= ИИ РЫБОК ================= */
function updateFish(f, dt, t) {
    // Поиск корма (радиус 15)
    if (!f.targetFood || !f.targetFood.active) {
        f.targetFood = null;
        let best = 15;
        for (const fd of foods) {
            if (!fd.active) continue;
            const d = f.mesh.position.distanceTo(fd.mesh.position);
            if (d < best) { best = d; f.targetFood = fd; }
        }
    }

    const p = f.mesh.position;
    const desired = tmpV.copy(f.velocity);

    // Случайное блуждание
    f.wanderTimer -= dt;
    if (f.wanderTimer <= 0) {
        f.wanderTimer = 2 + Math.random() * 4;
        desired.x += (Math.random() - 0.5);
        desired.y += (Math.random() - 0.5) * 0.5;
        desired.z += (Math.random() - 0.5);
    }

    // Избегание соседей
    for (const o of fishArray) {
        if (o === f) continue;
        const d = p.distanceTo(o.mesh.position);
        const r = (f.avoidanceRadius + o.avoidanceRadius) * 1.2;
        if (d < r && d > 0.001) {
            desired.addScaledVector(tmpV.copy(p).sub(o.mesh.position).normalize(), (r - d) / r * 3);
        }
    }

    // Отталкивание от стен
    const m = 2;
    if (p.x >  HALF.x - m) desired.x -= (p.x - (HALF.x - m)) * 2;
    if (p.x < -HALF.x + m) desired.x += ((-HALF.x + m) - p.x) * 2;
    if (p.y >  HALF.y - m) desired.y -= (p.y - (HALF.y - m)) * 2;
    if (p.y <  m)          desired.y += (m - p.y) * 2;
    if (p.z >  HALF.z - m) desired.z -= (p.z - (HALF.z - m)) * 2;
    if (p.z < -HALF.z + m) desired.z += ((-HALF.z + m) - p.z) * 2;

    // Преследование корма
    let speed = f.speed;
    if (f.targetFood) {
        desired.addScaledVector(tmpV.copy(f.targetFood.mesh.position).sub(p).normalize(), 4);
        speed = f.speed * 1.8;
    }

    desired.normalize();
    f.velocity.lerp(desired, 0.05).normalize();
    p.addScaledVector(f.velocity, speed * dt);

    // Жёсткий кламп
    p.x = THREE.MathUtils.clamp(p.x, -HALF.x + 1, HALF.x - 1);
    p.y = THREE.MathUtils.clamp(p.y, 1, HALF.y - 1);
    p.z = THREE.MathUtils.clamp(p.z, -HALF.z + 1, HALF.z - 1);

    // Поворот в направлении движения (плавный)
    tmpObj.position.copy(p);
    tmpObj.lookAt(p.x + f.velocity.x, p.y + f.velocity.y, p.z + f.velocity.z);
    f.mesh.quaternion.slerp(tmpObj.quaternion, 0.12);

    // Анимация хвоста и плавников
    f.tail.rotation.z = Math.sin(t * f.tailSpeed + f.phase) * 0.6;
    f.leftFin.rotation.y  =  Math.sin(t * f.tailSpeed * 0.8 + f.phase) * 0.3;
    f.rightFin.rotation.y = -Math.sin(t * f.tailSpeed * 0.8 + f.phase) * 0.3;
}

/* ================= ЕДА: ФИЗИКА + ПОДАЧА ================= */
function updateFoods(dt) {
    for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        if (!f.active) continue;
        f.vel.y -= 4.5 * dt;              // замедленная гравитация (вода)
        f.vel.multiplyScalar(1 - 0.8 * dt); // сопротивление воды
        f.mesh.position.addScaledVector(f.vel, dt);

        // Съедена?
        let eaten = false;
        for (const fish of fishArray) {
            if (fish.mesh.position.distanceTo(f.mesh.position) < 1.3) {
                eaten = true;
                // Рост на 5%
                const s = Math.min(fish.mesh.scale.x * 1.05, 2.5);
                fish.mesh.scale.setScalar(s);
                fish.avoidanceRadius = 1.5 * s;
                fish.targetFood = null;
                // Пузырьки радости
                for (let b = 0; b < 3; b++) addBubble(f.mesh.position.x, f.mesh.position.y, f.mesh.position.z);
                break;
            }
        }
        // Достигла дна
        if (f.mesh.position.y < 0.6) eaten = true;
        if (eaten) { removeFood(f); foods.splice(i, 1); }
    }
}

/* ================= ВЗАИМОДЕЙСТВИЕ ================= */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downPos = null;

renderer.domElement.addEventListener('mousedown', e => {
    if (e.button === 0) downPos = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('mouseup', e => {
    if (e.button !== 0 || !downPos) return;
    if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 5) return; // это было вращение
    downPos = null;

    mouse.x =  (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hit = raycaster.intersectObject(glass)[0];
    if (hit) {
        const p = hit.point.clone();
        p.x = THREE.MathUtils.clamp(p.x, -HALF.x + 1.5, HALF.x - 1.5);
        p.y = THREE.MathUtils.clamp(p.y, 1.5, HALF.y - 1.5);
        p.z = THREE.MathUtils.clamp(p.z, -HALF.z + 1.5, HALF.z - 1.5);
        spawnFood(p);
    }
});

/* ================= КНОПКИ ================= */
document.getElementById('btnFish').onclick = () => createFish();
document.getElementById('btnBubbles').onclick = () => {
    for (let i = 0; i < 10; i++) addBubble(undefined, 0.5, undefined);
};
const btnLight = document.getElementById('btnLight');
let lightOn = true;
btnLight.onclick = () => {
    lightOn = !lightOn;
    sun.intensity = lightOn ? 1.0 : 0.15;
    btnLight.textContent = lightOn ? '💡 Свет: ВКЛ' : '💡 Свет: ВЫКЛ';
    btnLight.classList.toggle('off', !lightOn);
};

/* ================= UI / FPS ================= */
const fishCountEl = document.getElementById('fishCount');
const fpsEl = document.getElementById('fps');
let frames = 0, lastFps = performance.now();

/* ================= ЦИКЛ ================= */
const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // Рыбки
    for (const f of fishArray) updateFish(f, dt, t);
    updateFoods(dt);

    // Бузыри
    for (const b of bubbles) {
        b.mesh.position.y += b.speed * dt;
        b.mesh.position.x += Math.sin(t * 2 + b.phase) * b.amp * dt;
        b.mesh.position.z += Math.cos(t * 1.7 + b.phase) * b.amp * dt;
        if (b.mesh.position.y > TANK.h - 0.5) {
            b.mesh.position.y = 0.5;
            b.mesh.position.x = (Math.random() - 0.5) * (TANK.w - 4);
            b.mesh.position.z = (Math.random() - 0.5) * (TANK.d - 4);
        }
    }

    // Покачивание водорослей
    for (const s of seaweeds) {
        s.rotation.x = Math.sin(t * 0.8 + s.userData.phase) * 0.08;
        s.rotation.z = Math.cos(t * 0.6 + s.userData.phase) * 0.08;
    }

    // Пульсация подводных огней
    pLight1.intensity = 0.4 + Math.sin(t * 1.3) * 0.15;
    pLight2.intensity = 0.4 + Math.cos(t * 1.1) * 0.15;

    controls.update();
    renderer.render(scene, camera);

    // FPS
    frames++;
    const now = performance.now();
    if (now - lastFps >= 1000) {
        fpsEl.textContent = frames;
        fishCountEl.textContent = fishArray.length;
        frames = 0;
        lastFps = now;
    }
}
animate();

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
