<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>3D Аквариум</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #001a33; }
  #canvas-container { width: 100vw; height: 100vh; }

  .glass-panel {
    position: absolute;
    background: rgba(10, 30, 60, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(100, 200, 255, 0.25);
    border-radius: 14px;
    padding: 16px 20px;
    color: #cfeaff;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(80, 180, 255, 0.05);
    z-index: 10;
  }
  #info-panel { top: 20px; left: 20px; max-width: 300px; }
  #stats-panel { top: 20px; right: 20px; min-width: 180px; text-align: right; }

  h1 {
    font-size: 20px; margin-bottom: 10px;
    background: linear-gradient(90deg, #4dd0ff, #ffb347);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .instructions { font-size: 12px; line-height: 1.7; opacity: 0.85; margin-bottom: 12px; }
  .stat-line { font-size: 14px; margin: 4px 0; }
  .stat-value { color: #ffd75e; font-weight: bold; }

  .btn-row { display: flex; flex-direction: column; gap: 8px; }
  button {
    padding: 9px 14px;
    border: none; border-radius: 8px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #1e6fd9, #38b6ff);
    box-shadow: 0 4px 12px rgba(30, 111, 217, 0.4);
    transition: all 0.25s ease;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(56, 182, 255, 0.7), 0 0 15px rgba(56, 182, 255, 0.4);
  }
  button:active { transform: translateY(0); }
  button.toggled { background: linear-gradient(135deg, #d97a1e, #ffb347); }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="info-panel" class="glass-panel">
  <h1>🐠 3D Аквариум</h1>
  <div class="instructions">
    🖱️ ЛКМ + движение — вращение<br>
    🖱️ ПКМ + движение — панорама<br>
    🔍 Колесо — зум<br>
    🍽️ Клик по воде — покормить
  </div>
  <div class="btn-row">
    <button id="btn-fish">➕ Добавить рыбку</button>
    <button id="btn-bubbles">💧 Больше пузырей</button>
    <button id="btn-light">💡 Свет</button>
  </div>
</div>

<div id="stats-panel" class="glass-panel">
  <div class="stat-line">🐟 Рыбки: <span class="stat-value" id="fish-count">0</span></div>
  <div class="stat-line">⚡ FPS: <span class="stat-value" id="fps">0</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ==================== БАЗОВАЯ СЦЕНА ====================
const TANK = { w: 36, h: 24, d: 20 };          // размеры аквариума
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a2a4a, 0.012);

// Градиентный фон
(function makeBg() {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#0d3b66');
  g.addColorStop(1, '#04121f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c);
  scene.background = tex;
})();

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(30, 22, 42);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 1.8;
controls.target.set(0, TANK.h / 2, 0);

// ==================== ОСВЕЩЕНИЕ ====================
const ambient = new THREE.AmbientLight(0x404040, 0.4);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff2d9, 1.1);
sun.position.set(20, 40, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;  sun.shadow.camera.bottom = -30;
sun.shadow.camera.far = 120;
scene.add(sun);

const pl1 = new THREE.PointLight(0x2288ff, 0.8, 60);
pl1.position.set(-10, 8, 5);
const pl2 = new THREE.PointLight(0x1155cc, 0.7, 60);
pl2.position.set(10, 14, -5);
scene.add(pl1, pl2);

// ==================== АКВАРИУМ ====================
// Стеклянный корпус
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x88ccee, metalness: 0, roughness: 0.05,
  transmission: 0.95, transparent: true, opacity: 0.25,
  side: THREE.DoubleSide, depthWrite: false
});
const glassBox = new THREE.Mesh(new THREE.BoxGeometry(TANK.w, TANK.h, TANK.d), glassMat);
glassBox.position.y = TANK.h / 2;
scene.add(glassBox);

// Рамка
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(glassBox.geometry),
  new THREE.LineBasicMaterial({ color: 0x99ddff, transparent: true, opacity: 0.6 })
);
edges.position.copy(glassBox.position);
scene.add(edges);

// Песчаное дно
(function makeSand() {
  const geo = new THREE.PlaneGeometry(TANK.w, TANK.d, 60, 40);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    pos.setZ(i,
      Math.sin(x * 0.4) * Math.cos(y * 0.5) * 0.35 +
      Math.sin(x * 1.3 + y * 0.7) * 0.15 +
      Math.random() * 0.08
    );
  }
  geo.computeVertexNormals();
  const sand = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xd9b877, roughness: 0.95 }));
  sand.rotation.x = -Math.PI / 2;
  sand.receiveShadow = true;
  scene.add(sand);
})();

// Камни
for (let i = 0; i < 8; i++) {
  const r = 0.8 + Math.random() * 1.4;
  const geo = new THREE.DodecahedronGeometry(r, 0);
  const p = geo.attributes.position;
  for (let j = 0; j < p.count; j++) {
    p.setXYZ(j,
      p.getX(j) * (0.8 + Math.random() * 0.4),
      p.getY(j) * (0.8 + Math.random() * 0.4),
      p.getZ(j) * (0.8 + Math.random() * 0.4)
    );
  }
  geo.computeVertexNormals();
  const rock = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 0.15, 0.25 + Math.random() * 0.15),
    roughness: 0.9
  }));
  rock.position.set((Math.random() - 0.5) * (TANK.w - 6), r * 0.6, (Math.random() - 0.5) * (TANK.d - 6));
  rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  rock.castShadow = rock.receiveShadow = true;
  scene.add(rock);
}

// Водоросли
const algae = [];
for (let i = 0; i < 12; i++) {
  const h = 3 + Math.random() * 5;
  const pts = [];
  const bx = (Math.random() - 0.5) * (TANK.w - 8);
  const bz = (Math.random() - 0.5) * (TANK.d - 8);
  for (let s = 0; s <= 5; s++) {
    const t = s / 5;
    pts.push(new THREE.Vector3(bx + Math.sin(t * 4) * 0.5, t * h, bz + Math.cos(t * 3) * 0.5));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 12, 0.18, 6, false),
    new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.33 + Math.random() * 0.1, 0.6, 0.3), roughness: 0.8 })
  );
  mesh.castShadow = mesh.receiveShadow = true;
  // Пивот у основания
  const pivot = new THREE.Group();
  pivot.position.set(bx, 0, bz);
  mesh.position.sub(pivot.position);
  pivot.add(mesh);
  scene.add(pivot);
  algae.push({ pivot, phase: Math.random() * Math.PI * 2, amp: 0.03 + Math.random() * 0.04 });
}

// ==================== БУБЛЬЧИКИ ====================
const bubbles = [];
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color: 0xbbddff, metalness: 0, roughness: 0,
  transmission: 0.9, transparent: true, opacity: 0.35
});
function addBubble() {
  const r = 0.12 + Math.random() * 0.25;
  const b = {
    mesh: new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), bubbleMat),
    speed: 1.2 + Math.random() * 1.8,
    swayAmp: 0.3 + Math.random() * 0.6,
    swayFreq: 1 + Math.random() * 2,
    phase: Math.random() * Math.PI * 2,
    baseX: (Math.random() - 0.5) * (TANK.w - 4),
    baseZ: (Math.random() - 0.5) * (TANK.d - 4)
  };
  b.mesh.position.set(b.baseX, Math.random() * TANK.h, b.baseZ);
  scene.add(b.mesh);
  bubbles.push(b);
}
for (let i = 0; i < 30; i++) addBubble();

// ==================== РЫБКИ ====================
const COLOR_SCHEMES = [
  { body: 0xff7722, fin: 0xffaa44 },   // оранжевая
  { body: 0x2266ff, fin: 0x55aaff },   // синяя
  { body: 0xffcc00, fin: 0xff3333 },   // жёлто-красная
  { body: 0x9933ff, fin: 0xcc88ff },   // фиолетовая
  { body: 0xdd2233, fin: 0xff6677 },   // красная
  { body: 0x22bb55, fin: 0x77ee99 },   // зелёная
  { body: 0xff66aa, fin: 0xffaacc },   // розовая
  { body: 0xffb800, fin: 0xffe066 }    // золотая
];
const fishArray = [];
const tmpObj = new THREE.Object3D();

function createFish(scale) {
  const cs = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshPhongMaterial({ color: cs.body, shininess: 90 });
  const finMat = new THREE.MeshPhongMaterial({ color: cs.fin, shininess: 60, transparent: true, opacity: 0.85 });

  // Тело (вытянутая сфера вдоль Z — голова в +Z)
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), bodyMat);
  body.scale.set(0.75, 1, 1.7);
  body.castShadow = true;
  g.add(body);

  // Глаза
  const eyeGeo = new THREE.SphereGeometry(0.09, 8, 8);
  const pupilGeo = new THREE.SphereGeometry(0.045, 8, 8);
  const eyeMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
  const pupilMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
  [-1, 1].forEach(side => {
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(side * 0.28, 0.12, 0.55);
    const pupil = new THREE.Mesh(pupilGeo, pupilMat);
    pupil.position.set(side * 0.28, 0.12, 0.63);
    g.add(eye, pupil);
  });

  // Хвост (пивот для анимации)
  const tailPivot = new THREE.Group();
  tailPivot.position.set(0, 0, -0.85);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.7, 8), finMat);
  tail.rotation.x = -Math.PI / 2;
  tail.position.z = -0.35;
  tail.scale.set(0.4, 1, 1);
  tailPivot.add(tail);
  g.add(tailPivot);

  // Верхний плавник
  const topFin = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.5, 6), finMat);
  topFin.rotation.z = Math.PI / 2;
  topFin.rotation.y = Math.PI / 2;
  topFin.scale.set(1, 0.35, 1);
  topFin.position.set(0, 0.45, -0.1);
  g.add(topFin);

  // Боковые плавники
  const leftFin = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.45, 6), finMat);
  leftFin.rotation.z = Math.PI / 2.3;
  leftFin.scale.set(0.3, 1, 1);
  leftFin.position.set(-0.45, -0.05, 0.1);
  const rightFin = leftFin.clone();
  rightFin.position.x = 0.45;
  rightFin.rotation.z = -Math.PI / 2.3;
  g.add(leftFin, rightFin);

  const s = scale * (0.6 + Math.random() * 0.6);
  g.scale.setScalar(s);
  g.position.set(
    (Math.random() - 0.5) * (TANK.w - 6),
    3 + Math.random() * (TANK.h - 6),
    (Math.random() - 0.5) * (TANK.d - 6)
  );
  scene.add(g);

  fishArray.push({
    mesh: g,
    tail: tailPivot,
    leftFin, rightFin,
    velocity: new THREE.Vector3(Math.random() - 0.5, (Math.random() - 0.5) * 0.3, Math.random() - 0.5).normalize(),
    speed: 2.5 + Math.random() * 2.5,
    tailSpeed: 6 + Math.random() * 5,
    phase: Math.random() * Math.PI * 2,
    targetFood: null,
    avoidanceRadius: 2.5 + Math.random() * 1.5,
    wanderTimer: Math.random() * 3
  });
}
for (let i = 0; i < 15; i++) createFish(1);

// ==================== КОРМ ====================
const foods = [];
const foodMat = new THREE.MeshPhongMaterial({ color: 0xcc4422, emissive: 0x441100 });
function spawnFood(point) {
  const f = {
    mesh: new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), foodMat),
    velocity: new THREE.Vector3(0, 0, 0)
  };
  f.mesh.position.copy(point);
  scene.add(f.mesh);
  foods.push(f);
}

// ==================== ИИ РЫБОК ====================
const BOUND_X = TANK.w / 2 - 1.5, BOUND_Z = TANK.d / 2 - 1.5;
const BOUND_Y_MIN = 1.5, BOUND_Y_MAX = TANK.h - 1.5;
const GRAVITY = 6;

function updateFish(dt, time) {
  for (const f of fishArray) {
    // --- Поиск корма ---
    f.targetFood = null;
    let bestDist = 15;
    for (const fd of foods) {
      const d = f.mesh.position.distanceTo(fd.mesh.position);
      if (d < bestDist) { bestDist = d; f.targetFood = fd; }
    }
    // Съедание
    if (f.targetFood && bestDist < 0.8) {
      scene.remove(f.targetFood.mesh);
      foods.splice(foods.indexOf(f.targetFood), 1);
      f.mesh.scale.multiplyScalar(1.05);
      if (f.mesh.scale.x > 2.2) f.mesh.scale.setScalar(2.2);
      f.targetFood = null;
    }

    // --- Движение ---
    if (f.targetFood) {
      const dir = f.targetFood.mesh.position.clone().sub(f.mesh.position).normalize();
      f.velocity.lerp(dir, 0.08).normalize();
    } else {
      // Случайное блуждание
      f.wanderTimer -= dt;
      if (f.wanderTimer <= 0) {
        f.wanderTimer = 2 + Math.random() * 4;
        f.velocity.x += (Math.random() - 0.5) * 1.2;
        f.velocity.y += (Math.random() - 0.5) * 0.6;
        f.velocity.z += (Math.random() - 0.5) * 1.2;
      }
      f.velocity.normalize();
    }

    // Избегание других рыбок
    for (const o of fishArray) {
      if (o === f) continue;
      const diff = f.mesh.position.clone().sub(o.mesh.position);
      const d = diff.length();
      const r = (f.avoidanceRadius + o.avoidanceRadius) * 0.5;
      if (d < r && d > 0.001) {
        f.velocity.add(diff.normalize().multiplyScalar((r - d) / r * 2));
      }
    }

    // Отражение от стен
    const p = f.mesh.position;
    if (p.x > BOUND_X) f.velocity.x = -Math.abs(f.velocity.x);
    if (p.x < -BOUND_X) f.velocity.x = Math.abs(f.velocity.x);
    if (p.z > BOUND_Z) f.velocity.z = -Math.abs(f.velocity.z);
    if (p.z < -BOUND_Z) f.velocity.z = Math.abs(f.velocity.z);
    if (p.y > BOUND_Y_MAX) f.velocity.y = -Math.abs(f.velocity.y) * 0.5;
    if (p.y < BOUND_Y_MIN) f.velocity.y = Math.abs(f.velocity.y) * 0.5;
    f.velocity.normalize();

    p.addScaledVector(f.velocity, f.speed * dt);

    // Поворот в направлении движения
    tmpObj.position.copy(p);
    tmpObj.lookAt(p.clone().add(f.velocity));
    f.mesh.quaternion.slerp(tmpObj.quaternion, 0.08);

    // Анимация хвоста и плавников
    f.phase += f.tailSpeed * dt;
    f.tail.rotation.z = Math.sin(f.phase) * 0.5;
    f.leftFin.rotation.y = Math.sin(f.phase * 0.7) * 0.25;
    f.rightFin.rotation.y = -Math.sin(f.phase * 0.7) * 0.25;
  }

  // --- Физика корма ---
  for (let i = foods.length - 1; i >= 0; i--) {
    const fd = foods[i];
    fd.velocity.y -= GRAVITY * dt;
    fd.mesh.position.addScaledVector(fd.velocity, dt);
    if (fd.mesh.position.y < 0.35) {
      fd.mesh.position.y = 0.35;
      fd.velocity.y = 0;
      setTimeout(() => {
        const idx = foods.indexOf(fd);
        if (idx !== -1) { scene.remove(fd.mesh); foods.splice(idx, 1); }
      }, 3000);
    }
  }
}

// ==================== БУБЛЬЧИКИ / ВОДОРОСЛИ ====================
function updateEnvironment(dt, time) {
  for (const b of bubbles) {
    b.mesh.position.y += b.speed * dt;
    b.mesh.position.x = b.baseX + Math.sin(time * b.swayFreq + b.phase) * b.swayAmp;
    b.mesh.position.z = b.baseZ + Math.cos(time * b.swayFreq * 0.8 + b.phase) * b.swayAmp;
    if (b.mesh.position.y > TANK.h - 0.5) {
      b.mesh.position.y = 0.3;
      b.baseX = (Math.random() - 0.5) * (TANK.w - 4);
      b.baseZ = (Math.random() - 0.5) * (TANK.d - 4);
    }
  }
  for (const a of algae) {
    a.pivot.rotation.x = Math.sin(time * 0.8 + a.phase) * a.amp;
    a.pivot.rotation.z = Math.cos(time * 0.6 + a.phase) * a.amp;
  }
}

// ==================== КЛИК = ПОКорм ====================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downPos = null;

renderer.domElement.addEventListener('mousedown', e => { downPos = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('mouseup', e => {
  if (!downPos) return;
  const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
  downPos = null;
  if (Math.hypot(dx, dy) > 5) return; // это было вращение камеры

  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(glassBox);
  let point;
  if (hits.length) {
    point = hits[0].point;
    point.x = THREE.MathUtils.clamp(point.x, -BOUND_X, BOUND_X);
    point.y = THREE.MathUtils.clamp(point.y, BOUND_Y_MIN, BOUND_Y_MAX);
    point.z = THREE.MathUtils.clamp(point.z, -BOUND_Z, BOUND_Z);
  } else {
    point = new THREE.Vector3((Math.random() - 0.5) * 10, TANK.h - 2, (Math.random() - 0.5) * 8);
  }
  spawnFood(point);
});

// ==================== UI ====================
document.getElementById('btn-fish').onclick = () => createFish(1);
document.getElementById('btn-bubbles').onclick = () => { for (let i = 0; i < 10; i++) addBubble(); };
let lightOn = true;
document.getElementById('btn-light').onclick = function () {
  lightOn = !lightOn;
  sun.intensity = lightOn ? 1.1 : 0.15;
  ambient.intensity = lightOn ? 0.4 : 0.25;
  this.classList.toggle('toggled', !lightOn);
};

// ==================== ЦИКЛ ====================
const clock = new THREE.Clock();
let frames = 0, lastFpsTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  updateFish(dt, time);
  updateEnvironment(dt, time);
  controls.update();
  renderer.render(scene, camera);

  // FPS
  frames++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    document.getElementById('fps').textContent = frames;
    document.getElementById('fish-count').textContent = fishArray.length;
    frames = 0;
    lastFpsTime = now;
  }
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
