<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Аквариум</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a1628;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .panel {
            position: absolute;
            background: rgba(10, 25, 50, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            color: #e0f0ff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        #info-panel {
            top: 20px;
            left: 20px;
            max-width: 280px;
        }

        #info-panel h1 {
            font-size: 1.4em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        #info-panel p {
            font-size: 0.8em;
            line-height: 1.6;
            color: rgba(200, 230, 255, 0.8);
            margin-bottom: 8px;
        }

        #info-panel .controls-list {
            list-style: none;
            margin: 10px 0;
        }

        #info-panel .controls-list li {
            font-size: 0.75em;
            padding: 3px 0;
            color: rgba(180, 220, 255, 0.7);
        }

        #info-panel .controls-list li::before {
            content: "▸ ";
            color: #00d4ff;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-size: 0.75em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .btn:active::after {
            width: 200px;
            height: 200px;
        }

        .btn-fish {
            background: linear-gradient(135deg, #ff6b35, #f7c948);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-fish:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.5);
        }

        .btn-bubble {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
        }

        .btn-bubble:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.5);
        }

        .btn-light {
            background: linear-gradient(135deg, #7b2ff7, #f103a5);
            box-shadow: 0 4px 15px rgba(123, 47, 247, 0.3);
        }

        .btn-light:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 47, 247, 0.5);
        }

        #stats-panel {
            top: 20px;
            right: 20px;
            min-width: 160px;
            text-align: center;
        }

        #stats-panel .stat-item {
            margin-bottom: 10px;
        }

        #stats-panel .stat-label {
            font-size: 0.7em;
            color: rgba(150, 200, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #stats-panel .stat-value {
            font-size: 1.6em;
            font-weight: 700;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        #stats-panel .stat-value.fps {
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }

        .separator {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(100, 180, 255, 0.3), transparent);
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .panel {
                padding: 12px;
                border-radius: 12px;
            }

            #info-panel {
                max-width: 200px;
                top: 10px;
                left: 10px;
            }

            #info-panel h1 {
                font-size: 1.1em;
            }

            #stats-panel {
                top: 10px;
                right: 10px;
                min-width: 120px;
            }

            .btn {
                padding: 6px 10px;
                font-size: 0.7em;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="panel" id="info-panel">
        <h1>🐠 3D Аквариум</h1>
        <p>Интерактивный подводный мир</p>
        <ul class="controls-list">
            <li>ЛКМ — вращение камеры</li>
            <li>ПКМ — панорамирование</li>
            <li>Колесо — зум</li>
            <li>Клик по воде — кормление</li>
        </ul>
        <div class="btn-group">
            <button class="btn btn-fish" onclick="addFish()">+ Рыбка</button>
            <button class="btn btn-bubble" onclick="addBubbles()">+ Пузыри</button>
            <button class="btn btn-light" onclick="toggleLight()">💡 Свет</button>
        </div>
    </div>

    <div class="panel" id="stats-panel">
        <div class="stat-item">
            <div class="stat-label">Рыбки</div>
            <div class="stat-value" id="fish-count">15</div>
        </div>
        <div class="separator"></div>
        <div class="stat-item">
            <div class="stat-label">FPS</div>
            <div class="stat-value fps" id="fps-counter">60</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // ==================== SCENE SETUP ====================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a2a4a, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 5, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Background gradient
        const bgCanvas = document.createElement('canvas');
        bgCanvas.width = 2;
        bgCanvas.height = 512;
        const bgCtx = bgCanvas.getContext('2d');
        const bgGrad = bgCtx.createLinearGradient(0, 0, 0, 512);
        bgGrad.addColorStop(0, '#0a1628');
        bgGrad.addColorStop(0.5, '#0d2847');
        bgGrad.addColorStop(1, '#061520');
        bgCtx.fillStyle = bgGrad;
        bgCtx.fillRect(0, 0, 2, 512);
        const bgTexture = new THREE.CanvasTexture(bgCanvas);
        scene.background = bgTexture;

        // ==================== CONTROLS ====================
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 60;
        controls.maxPolarAngle = Math.PI / 1.8;
        controls.target.set(0, 0, 0);

        // ==================== LIGHTING ====================
        const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 60;
        dirLight.shadow.camera.left = -25;
        dirLight.shadow.camera.right = 25;
        dirLight.shadow.camera.top = 25;
        dirLight.shadow.camera.bottom = -25;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);

        const pointLight1 = new THREE.PointLight(0x00aaff, 0.6, 40);
        pointLight1.position.set(-10, 8, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x0055ff, 0.4, 35);
        pointLight2.position.set(10, -5, -5);
        scene.add(pointLight2);

        let lightOn = true;

        // ==================== AQUARIUM DIMENSIONS ====================
        const AQL = 36, AQH = 24, AQD = 20;
        const HALF_L = AQL / 2, HALF_H = AQH / 2, HALF_D = AQD / 2;

        // ==================== GLASS CONTAINER ====================
        function createAquarium() {
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0x88ccff,
                metalness: 0,
                roughness: 0.05,
                transmission: 0.95,
                thickness: 0.5,
                transparent: true,
                opacity: 0.15,
                side: THREE.DoubleSide
            });

            const glassGeo = new THREE.BoxGeometry(AQL, AQH, AQD);
            const glassMesh = new THREE.Mesh(glassGeo, glassMat);
            glassMesh.position.y = 0;
            scene.add(glassMesh);

            // Edges
            const edgesGeo = new THREE.EdgesGeometry(glassGeo);
            const edgesMat = new THREE.LineBasicMaterial({ color: 0x66aaff, linewidth: 2, transparent: true, opacity: 0.6 });
            const edges = new THREE.LineSegments(edgesGeo, edgesMat);
            edges.position.y = 0;
            scene.add(edges);
        }
        createAquarium();

        // ==================== SAND BOTTOM ====================
        function createSand() {
            const sandGeo = new THREE.PlaneGeometry(AQL - 0.5, AQD - 0.5, 40, 40);
            const positions = sandGeo.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                positions[i + 2] = Math.random() * 0.3;
            }
            sandGeo.computeVertexNormals();

            const sandMat = new THREE.MeshStandardMaterial({
                color: 0xc2a66b,
                roughness: 0.9,
                metalness: 0.05
            });

            const sand = new THREE.Mesh(sandGeo, sandMat);
            sand.rotation.x = -Math.PI / 2;
            sand.position.y = -HALF_H + 0.2;
            sand.receiveShadow = true;
            scene.add(sand);
        }
        createSand();

        // ==================== ROCKS ====================
        function createRocks() {
            const rockColors = [0x555555, 0x666666, 0x777777, 0x4a4a4a, 0x5a5a5a];
            for (let i = 0; i < 8; i++) {
                const size = 0.8 + Math.random() * 1.5;
                const geo = new THREE.DodecahedronGeometry(size, 1);
                const pos = geo.attributes.position.array;
                for (let j = 0; j < pos.length; j += 3) {
                    pos[j] += (Math.random() - 0.5) * size * 0.4;
                    pos[j + 1] += (Math.random() - 0.5) * size * 0.4;
                    pos[j + 2] += (Math.random() - 0.5) * size * 0.4;
                }
                geo.computeVertexNormals();

                const mat = new THREE.MeshStandardMaterial({
                    color: rockColors[Math.floor(Math.random() * rockColors.length)],
                    roughness: 0.8,
                    metalness: 0.1
                });

                const rock = new THREE.Mesh(geo, mat);
                rock.position.set(
                    (Math.random() - 0.5) * (AQL - 6),
                    -HALF_H + size * 0.5,
                    (Math.random() - 0.5) * (AQD - 6)
                );
                rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                rock.castShadow = true;
                rock.receiveShadow = true;
                scene.add(rock);
            }
        }
        createRocks();

        // ==================== SEAWEED ====================
        const seaweeds = [];
        function createSeaweed(x, z) {
            const height = 3 + Math.random() * 5;
            const segments = 8;
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                points.push(new THREE.Vector3(
                    Math.sin(t * 3) * 0.3,
                    t * height,
                    Math.cos(t * 2) * 0.2
                ));
            }
            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeo = new THREE.TubeGeometry(curve, 16, 0.15 + Math.random() * 0.1, 6, false);

            const greens = [0x2d8a4e, 0x3a9d5c, 0x1e7a3e, 0x45b06a, 0x2a7d4a];
            const mat = new THREE.MeshStandardMaterial({
                color: greens[Math.floor(Math.random() * greens.length)],
                roughness: 0.7,
                metalness: 0.05
            });

            const seaweed = new THREE.Mesh(tubeGeo, mat);
            seaweed.position.set(x, -HALF_H + 0.2, z);
            seaweed.castShadow = true;
            scene.add(seaweed);
            seaweeds.push({ mesh: seaweed, phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 0.5 });
        }

        for (let i = 0; i < 12; i++) {
            createSeaweed(
                (Math.random() - 0.5) * (AQL - 8),
                (Math.random() - 0.5) * (AQD - 8)
            );
        }

        // ==================== BUBBLES ====================
        const bubbles = [];
        const bubbleMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0,
            roughness: 0,
            transmission: 0.9,
            transparent: true,
            opacity: 0.4,
            clearcoat: 1
        });

        function createBubble(x, y, z) {
            const size = 0.1 + Math.random() * 0.25;
            const geo = new THREE.SphereGeometry(size, 8, 8);
            const bubble = new THREE.Mesh(geo, bubbleMat);
            bubble.position.set(
                x !== undefined ? x : (Math.random() - 0.5) * (AQL - 4),
                y !== undefined ? y : -HALF_H + Math.random() * 2,
                z !== undefined ? z : (Math.random() - 0.5) * (AQD - 4)
            );
            scene.add(bubble);
            bubbles.push({
                mesh: bubble,
                speed: 0.5 + Math.random() * 1.5,
                phase: Math.random() * Math.PI * 2,
                amplitude: 0.3 + Math.random() * 0.5
            });
        }

        for (let i = 0; i < 30; i++) createBubble();

        // ==================== FISH SYSTEM ====================
        const fishArray = [];
        const foodArray = [];
        const foodMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x553300, roughness: 0.5 });

        const colorSchemes = [
            { body: 0xff6633, fin: 0xff8855, name: 'orange' },
            { body: 0x3366ff, fin: 0x5588ff, name: 'blue' },
            { body: 0xffcc00, fin: 0xff4444, name: 'yellow-red' },
            { body: 0x9933ff, fin: 0xbb66ff, name: 'purple' },
            { body: 0xff2244, fin: 0xff5566, name: 'red' },
            { body: 0x22cc66, fin: 0x44ee88, name: 'green' },
            { body: 0xff66aa, fin: 0xff88cc, name: 'pink' },
            { body: 0xffaa00, fin: 0xffcc44, name: 'gold' }
        ];

        function createFish(x, y, z) {
            const scheme = colorSchemes[Math.floor(Math.random() * colorSchemes.length)];
            const scale = 0.6 + Math.random() * 0.6;
            const group = new THREE.Group();

            // Body
            const bodyGeo = new THREE.SphereGeometry(1, 16, 12);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: scheme.body,
                roughness: 0.4,
                metalness: 0.3
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.scale.set(1.5, 0.8, 0.6);
            group.add(body);

            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const pupilGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });

            const eyeL = new THREE.Mesh(eyeGeo, eyeWhiteMat);
            eyeL.position.set(1.0, 0.15, 0.3);
            group.add(eyeL);
            const pupilL = new THREE.Mesh(pupilGeo, pupilMat);
            pupilL.position.set(1.1, 0.15, 0.3);
            group.add(pupilL);

            const eyeR = new THREE.Mesh(eyeGeo, eyeWhiteMat);
            eyeR.position.set(1.0, 0.15, -0.3);
            group.add(eyeR);
            const pupilR = new THREE.Mesh(pupilGeo, pupilMat);
            pupilR.position.set(1.1, 0.15, -0.3);
            group.add(pupilR);

            // Tail
            const tailGeo = new THREE.ConeGeometry(0.5, 1.2, 4);
            const tailMat = new THREE.MeshStandardMaterial({
                color: scheme.fin,
                roughness: 0.5,
                metalness: 0.2,
                side: THREE.DoubleSide
            });
            const tail = new THREE.Mesh(tailGeo, tailMat);
            tail.position.set(-1.5, 0, 0);
            tail.rotation.z = Math.PI / 2;
            tail.scale.set(0.3, 1, 1);
            group.add(tail);

            // Top fin
            const topFinGeo = new THREE.ConeGeometry(0.4, 0.8, 3);
            const topFin = new THREE.Mesh(topFinGeo, tailMat.clone());
            topFin.position.set(0, 0.7, 0);
            topFin.rotation.z = -0.3;
            topFin.scale.set(1, 1, 0.3);
            group.add(topFin);

            // Side fins
            const sideFinGeo = new THREE.PlaneGeometry(0.5, 0.3);
            const sideFinMat = new THREE.MeshStandardMaterial({
                color: scheme.fin,
                roughness: 0.5,
                metalness: 0.2,
                side: THREE.DoubleSide
            });
            const leftFin = new THREE.Mesh(sideFinGeo, sideFinMat);
            leftFin.position.set(0.2, -0.1, 0.5);
            leftFin.rotation.x = 0.5;
            group.add(leftFin);

            const rightFin = new THREE.Mesh(sideFinGeo, sideFinMat.clone());
            rightFin.position.set(0.2, -0.1, -0.5);
            rightFin.rotation.x = -0.5;
            group.add(rightFin);

            group.scale.setScalar(scale);
            group.position.set(
                x !== undefined ? x : (Math.random() - 0.5) * (AQL - 8),
                y !== undefined ? y : (Math.random() - 0.5) * (AQH - 6),
                z !== undefined ? z : (Math.random() - 0.5) * (AQD - 8)
            );
            group.castShadow = true;
            scene.add(group);

            const fish = {
                mesh: group,
                tail: tail,
                leftFin: leftFin,
                rightFin: rightFin,
                topFin: topFin,
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 1,
                    (Math.random() - 0.5) * 2
                ),
                speed: 2 + Math.random() * 3,
                tailSpeed: 3 + Math.random() * 4,
                phase: Math.random() * Math.PI * 2,
                targetFood: null,
                avoidanceRadius: 3 + Math.random() * 2,
                wanderTimer: 0,
                wanderInterval: 2 + Math.random() * 4,
                baseScale: scale
            };

            fishArray.push(fish);
            updateStats();
            return fish;
        }

        // Initial fish
        for (let i = 0; i < 15; i++) createFish();

        // ==================== FOOD SYSTEM ====================
        function createFood(x, y, z) {
            const geo = new THREE.SphereGeometry(0.2, 8, 8);
            const food = new THREE.Mesh(geo, foodMat.clone());
            food.position.set(x, y, z);
            food.castShadow = true;
            scene.add(food);
            foodArray.push({
                mesh: food,
                velocity: new THREE.Vector3((Math.random() - 0.5) * 0.5, 0, (Math.random() - 0.5) * 0.5),
                eaten: false
            });
        }

        // ==================== RAYCASTER FOR CLICKING ====================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const clickPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

        renderer.domElement.addEventListener('click', (event) => {
            // Ignore if clicking on UI
            if (event.target.tagName === 'BUTTON') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Find intersection with a plane at z=0
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(clickPlane, intersectPoint);

            if (intersectPoint) {
                // Clamp to aquarium bounds
                intersectPoint.x = Math.max(-HALF_L + 2, Math.min(HALF_L - 2, intersectPoint.x));
                intersectPoint.y = Math.max(-HALF_H + 2, Math.min(HALF_H - 2, intersectPoint.y));
                intersectPoint.z = Math.max(-HALF_D + 2, Math.min(HALF_D - 2, intersectPoint.z));
                createFood(intersectPoint.x, intersectPoint.y, intersectPoint.z);
            }
        });

        // ==================== UI FUNCTIONS ====================
        function addFish() {
            createFish();
        }

        function addBubbles() {
            for (let i = 0; i < 10; i++) createBubble();
        }

        function toggleLight() {
            lightOn = !lightOn;
            dirLight.intensity = lightOn ? 0.8 : 0.1;
            ambientLight.intensity = lightOn ? 0.4 : 0.15;
            pointLight1.intensity = lightOn ? 0.6 : 1.2;
            pointLight2.intensity = lightOn ? 0.4 : 0.8;
        }

        function updateStats() {
            document.getElementById('fish-count').textContent = fishArray.length;
        }

        // ==================== ANIMATION LOOP ====================
        const clock = new THREE.Clock();
        let fpsFrames = 0;
        let fpsTime = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);
            const time = clock.elapsedTime;

            // FPS counter
            fpsFrames++;
            fpsTime += delta;
            if (fpsTime >= 0.5) {
                document.getElementById('fps-counter').textContent = Math.round(fpsFrames / fpsTime);
                fpsFrames = 0;
                fpsTime = 0;
            }

            // Update fish
            updateFish(delta, time);

            // Update food
            updateFood(delta);

            // Update bubbles
            updateBubbles(delta, time);

            // Update seaweed
            updateSeaweed(time);

            // Animate lights
            pointLight1.position.x = Math.sin(time * 0.3) * 12;
            pointLight1.position.z = Math.cos(time * 0.2) * 8;
            pointLight2.position.x = Math.cos(time * 0.25) * 10;
            pointLight2.position.z = Math.sin(time * 0.35) * 8;

            controls.update();
            renderer.render(scene, camera);
        }

        function updateFish(delta, time) {
            for (let i = 0; i < fishArray.length; i++) {
                const fish = fishArray[i];
                const pos = fish.mesh.position;

                // Wander
                fish.wanderTimer += delta;
                if (fish.wanderTimer > fish.wanderInterval) {
                    fish.wanderTimer = 0;
                    fish.wanderInterval = 2 + Math.random() * 4;
                    fish.velocity.x += (Math.random() - 0.5) * 2;
                    fish.velocity.y += (Math.random() - 0.5) * 1;
                    fish.velocity.z += (Math.random() - 0.5) * 2;
                }

                // Avoidance from other fish
                for (let j = 0; j < fishArray.length; j++) {
                    if (i === j) continue;
                    const other = fishArray[j].mesh.position;
                    const dx = pos.x - other.x;
                    const dy = pos.y - other.y;
                    const dz = pos.z - other.z;
                    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
                    if (dist < fish.avoidanceRadius && dist > 0.01) {
                        const force = (fish.avoidanceRadius - dist) / fish.avoidanceRadius;
                        fish.velocity.x += (dx / dist) * force * 5 * delta;
                        fish.velocity.y += (dy / dist) * force * 5 * delta;
                        fish.velocity.z += (dz / dist) * force * 5 * delta;
                    }
                }

                // Wall reflection
                const margin = 2;
                if (pos.x > HALF_L - margin) fish.velocity.x -= 3 * delta;
                if (pos.x < -HALF_L + margin) fish.velocity.x += 3 * delta;
                if (pos.y > HALF_H - margin) fish.velocity.y -= 3 * delta;
                if (pos.y < -HALF_H + margin) fish.velocity.y += 3 * delta;
                if (pos.z > HALF_D - margin) fish.velocity.z -= 3 * delta;
                if (pos.z < -HALF_D + margin) fish.velocity.z += 3 * delta;

                // Food seeking
                fish.targetFood = null;
                let closestDist = 15;
                for (let f = 0; f < foodArray.length; f++) {
                    if (foodArray[f].eaten) continue;
                    const fp = foodArray[f].mesh.position;
                    const fd = pos.distanceTo(fp);
                    if (fd < closestDist) {
                        closestDist = fd;
                        fish.targetFood = foodArray[f];
                    }
                }

                if (fish.targetFood) {
                    const fp = fish.targetFood.mesh.position;
                    const dir = new THREE.Vector3().subVectors(fp, pos).normalize();
                    fish.velocity.x += dir.x * 4 * delta;
                    fish.velocity.y += dir.y * 4 * delta;
                    fish.velocity.z += dir.z * 4 * delta;

                    // Eat food
                    if (closestDist < 1.0) {
                        fish.targetFood.eaten = true;
                        scene.remove(fish.targetFood.mesh);
                        const idx = foodArray.indexOf(fish.targetFood);
                        if (idx > -1) foodArray.splice(idx, 1);

                        // Grow
                        const newScale = fish.baseScale * 1.05;
                        fish.baseScale = Math.min(newScale, fish.baseScale * 1.5);
                        fish.mesh.scale.setScalar(fish.baseScale);
                    }
                }

                // Limit speed
                const speed = fish.velocity.length();
                if (speed > fish.speed) {
                    fish.velocity.multiplyScalar(fish.speed / speed);
                }
                if (speed < 0.5) {
                    fish.velocity.multiplyScalar(1.05);
                }

                // Move
                pos.add(fish.velocity.clone().multiplyScalar(delta));

                // Orient fish in direction of movement
                if (speed > 0.1) {
                    const targetQuat = new THREE.Quaternion();
                    const lookDir = fish.velocity.clone().normalize();
                    const m = new THREE.Matrix4().lookAt(pos, pos.clone().add(lookDir), new THREE.Vector3(0, 1, 0));
                    targetQuat.setFromRotationMatrix(m);
                    // Fish face along -Z in local space, so we need to rotate
                    const rotZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI);
                    targetQuat.premultiply(rotZ);
                    fish.mesh.quaternion.slerp(targetQuat, 3 * delta);
                }

                // Tail animation
                fish.phase += fish.tailSpeed * delta;
                fish.tail.rotation.y = Math.sin(fish.phase) * 0.6;

                // Fin animation
                fish.leftFin.rotation.x = 0.5 + Math.sin(fish.phase * 0.7) * 0.3;
                fish.rightFin.rotation.x = -0.5 - Math.sin(fish.phase * 0.7) * 0.3;
                fish.topFin.rotation.z = -0.3 + Math.sin(fish.phase * 0.5) * 0.15;
            }
        }

        function updateFood(delta) {
            for (let i = foodArray.length - 1; i >= 0; i--) {
                const food = foodArray[i];
                if (food.eaten) continue;

                // Gravity
                food.velocity.y -= 2 * delta;

                food.mesh.position.add(food.velocity.clone().multiplyScalar(delta));

                // Remove if hits bottom
                if (food.mesh.position.y < -HALF_H + 0.5) {
                    scene.remove(food.mesh);
                    foodArray.splice(i, 1);
                }
            }
        }

        function updateBubbles(delta, time) {
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                b.mesh.position.y += b.speed * delta;
                b.mesh.position.x += Math.sin(time * 2 + b.phase) * b.amplitude * delta;
                b.mesh.position.z += Math.cos(time * 1.5 + b.phase) * b.amplitude * delta;

                if (b.mesh.position.y > HALF_H - 0.5) {
                    b.mesh.position.y = -HALF_H + 0.5;
                    b.mesh.position.x = (Math.random() - 0.5) * (AQL - 4);
                    b.mesh.position.z = (Math.random() - 0.5) * (AQD - 4);
                }
            }
        }

        function updateSeaweed(time) {
            for (const s of seaweeds) {
                s.mesh.rotation.x = Math.sin(time * s.speed + s.phase) * 0.1;
                s.mesh.rotation.z = Math.cos(time * s.speed * 0.7 + s.phase) * 0.08;
            }
        }

        // ==================== RESIZE HANDLER ====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        animate();
    </script>
</body>
</html>
