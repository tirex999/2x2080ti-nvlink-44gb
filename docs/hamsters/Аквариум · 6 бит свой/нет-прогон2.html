<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аквариум · 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eafcff; --dim:#a7d6ec; --faint:#7fb6d4;
    --accent:#ffcf6b; --accent2:#5fe0ff;
    --line:rgba(120,210,255,.22);
    --panel:linear-gradient(160deg, rgba(10,38,58,.62), rgba(6,24,40,.72));
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#04121f;color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* ---------- UI ---------- */
  .ui{position:fixed;z-index:10}
  .glass{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 18px 50px -18px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25)}

  .panel{top:18px;left:18px;width:288px;padding:20px 20px 18px}
  .brand{font-family:"Space Grotesk";font-weight:700;font-size:30px;line-height:1;letter-spacing:-.02em;
    background:linear-gradient(92deg,#ffe08a 0%,#ffb85c 34%,#5fe0ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 14px rgba(95,224,255,.25))}
  .tag{margin-top:8px;font-size:12.5px;color:var(--dim);letter-spacing:.01em}
  .divider{height:1px;margin:16px 0 14px;background:linear-gradient(90deg,var(--line),transparent)}

  .sec-title{font-family:"Space Grotesk";font-size:11px;font-weight:600;letter-spacing:.22em;
    text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .hints{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:9px}
  .hints li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
  .hints b{color:var(--ink);font-weight:600}
  .key{flex:none;min-width:22px;height:22px;padding:0 7px;display:grid;place-items:center;border-radius:7px;
    font-family:"Space Grotesk";font-size:11px;font-weight:600;color:#05202f;
    background:linear-gradient(180deg,#bff0ff,#7fd6f2);box-shadow:0 2px 8px -2px rgba(95,224,255,.6)}

  .btns{display:flex;flex-direction:column;gap:9px}
  .btn{position:relative;overflow:hidden;cursor:pointer;border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;font-family:"Space Grotesk";font-weight:600;font-size:14px;
    color:var(--ink);background:rgba(255,255,255,.04);display:flex;align-items:center;gap:10px;
    transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s,border-color .25s}
  .btn .ico{font-size:16px;line-height:1;filter:saturate(1.2)}
  .btn::before{content:"";position:absolute;inset:0;transform:translateX(-120%);
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.18),transparent);transition:transform .6s}
  .btn:hover{transform:translateY(-2px);border-color:rgba(150,230,255,.5)}
  .btn:hover::before{transform:translateX(120%)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn.accent{background:linear-gradient(120deg,#ffcf6b,#ff9d4d);color:#3a1c05;border-color:transparent;
    box-shadow:0 10px 26px -10px rgba(255,170,80,.7)}
  .btn.accent:hover{box-shadow:0 14px 34px -10px rgba(255,170,80,.9)}
  .btn.cyan{background:linear-gradient(120deg,#5fe0ff,#3aa0ff);color:#04202f;border-color:transparent;
    box-shadow:0 10px 26px -10px rgba(90,200,255,.7)}
  .btn.cyan:hover{box-shadow:0 14px 34px -10px rgba(90,200,255,.9)}
  .btn.ghost.on{background:linear-gradient(120deg,#ffd76b,#ffb14d);color:#3a1c05;border-color:transparent;
    box-shadow:0 10px 26px -10px rgba(255,180,80,.7)}

  /* stats */
  .stats{top:18px;right:18px;width:196px;padding:16px 18px}
  .stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;
    border-bottom:1px dashed rgba(120,210,255,.14)}
  .stat-row:last-child{border-bottom:none}
  .stat-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .stat-val{font-family:"Space Grotesk";font-weight:700;font-size:24px;letter-spacing:-.01em}
  .stat-val.small{font-size:18px}
  .stat-val.fish{color:var(--accent)} .stat-val.fps{color:var(--accent2)}
  .stat-val.food{color:#ff8ea0} .stat-val.bub{color:#9fe8ff}

  /* toast */
  .toast{left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    padding:11px 20px;border-radius:999px;font-size:13.5px;color:var(--ink);
    transition:opacity .35s,transform .35s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* loading */
  .loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    background:radial-gradient(120% 120% at 50% 20%,#0a3350,#04121f);transition:opacity .7s}
  .loader.hide{opacity:0;pointer-events:none}
  .loader .ring{width:52px;height:52px;border-radius:50%;border:3px solid rgba(120,210,255,.2);
    border-top-color:var(--accent2);animation:spin 1s linear infinite;margin:0 auto 18px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader p{font-family:"Space Grotesk";letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:var(--dim)}

  @media(max-width:640px){
    .panel{width:calc(100vw - 36px);max-width:300px}
    .stats{width:auto;top:auto;bottom:18px;right:18px;display:flex;gap:14px;padding:10px 14px}
    .stat-row{border:none;padding:0} .stat-val{font-size:19px}
    .toast{bottom:76px}
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="ui glass panel">
  <div class="brand">Аквариум</div>
  <div class="tag">Живой 3D-танк · Three.js</div>
  <div class="divider"></div>
  <div class="sec-title">Управление</div>
  <ul class="hints">
    <li><span class="key">⟳</span><span><b>ЛКМ</b> — вращение камеры</span></li>
    <li><span class="key">⇢</span><span><b>ПКМ</b> — панорама</span></li>
    <li><span class="key">⤢</span><span><b>Колесо</b> — приближение</span></li>
    <li><span class="key">✦</span><span><b>Клик по воде</b> — корм</span></li>
  </ul>
  <div class="sec-title">Действия</div>
  <div class="btns">
    <button class="btn accent" id="addFish"><span class="ico">🐟</span> Добавить рыбку</button>
    <button class="btn cyan" id="moreBubbles"><span class="ico">💧</span> Больше пузырей</button>
    <button class="btn ghost on" id="toggleLight"><span class="ico">☀️</span> Свет</button>
  </div>
</div>

<div class="ui glass stats">
  <div class="stat-row"><span class="stat-label">Рыбки</span><span class="stat-val fish" id="stFish">0</span></div>
  <div class="stat-row"><span class="stat-label">FPS</span><span class="stat-val fps" id="stFps">—</span></div>
  <div class="stat-row"><span class="stat-label">Корм</span><span class="stat-val food" id="stFood">0</span></div>
  <div class="stat-row"><span class="stat-label">Пузыри</span><span class="stat-val small bub" id="stBub">0</span></div>
</div>

<div class="ui glass toast" id="toast"></div>

<div class="loader" id="loader"><div><div class="ring"></div><p>Загрузка…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============================================================
   3D АКВАРИУМ
============================================================ */
const TAU = Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];

// --- размеры аквариума ---
const W=36,H=24,D=20;
const BOUND={x:W/2-2,y:H/2-1.6,z:D/2-2};
const FLOOR_Y=-H/2+0.5, CEIL_Y=H/2-0.8;
const FOOD_Y=FLOOR_Y+0.35;

let scene,camera,renderer,controls,clock;
let sun,pointA,pointB,causticsMat;
let fishArray=[],bubbles=[],foods=[],algae=[];
let feedPlane,raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
let down=null,lightOn=true;

// --- цветовые схемы рыбок ---
const PALETTES=[
  {name:'Оранжевая',     body:0xff8a3d, fin:0xffb27a, belly:0xffd9a8},
  {name:'Синяя',         body:0x2f7bff, fin:0x63a8ff, belly:0xbcdcff},
  {name:'Жёлто-красная', body:0xffd23f, fin:0xff5a3c, belly:0xfff0b0},
  {name:'Фиолетовая',    body:0x9b5cff, fin:0xc39bff, belly:0xe6d4ff},
  {name:'Красная',       body:0xff3b52, fin:0xff7d8c, belly:0xffc2c9},
  {name:'Зелёная',       body:0x35d67f, fin:0x7ff0ab, belly:0xd4ffe6},
  {name:'Розовая',       body:0xff7bb0, fin:0xffb0d0, belly:0xffe0ee},
  {name:'Золотая',       body:0xf5b733, fin:0xffdd7a, belly:0xfff3c4},
];
const ALGAE_COLORS=[0x2fae6a,0x3fc48a,0x2b8f6f,0x49c9a0,0x57c98a];

/* ---------------- Сцена ---------------- */
function init(){
  scene=new THREE.Scene();
  scene.background=makeGradientTexture('#0a3350','#04121f');
  scene.fog=new THREE.FogExp2(0x0a2a42,0.011);

  camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,500);
  camera.position.set(0,7,50);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.getElementById('app').appendChild(renderer.domElement);

  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.target.set(0,0,0);
  controls.enableDamping=true; controls.dampingFactor=0.06;
  controls.minDistance=10; controls.maxDistance=60;
  controls.maxPolarAngle=Math.PI/1.8;
  controls.enablePan=true;

  clock=new THREE.Clock();

  buildLights();
  buildTank();
  buildFloor();
  buildRocks();
  buildAlgae();
  buildCaustics();

  for(let i=0;i<15;i++) spawnFish();
  for(let i=0;i<30;i++) spawnBubble();

  // плоскость для кликов по воде
  feedPlane=new THREE.Plane(new THREE.Vector3(0,0,1),0);

  bindUI();
  addEventListener('resize',onResize);
  addEventListener('pointerdown',e=>{ if(e.button===0) down={x:e.clientX,y:e.clientY,t:performance.now()}; });
  addEventListener('pointerup',e=>{ if(e.button===0&&down) tryFeed(e); });

  animate();
  setTimeout(()=>document.getElementById('loader').classList.add('hide'),350);
}

function makeGradientTexture(top,bot){
  const c=document.createElement('canvas');c.width=8;c.height=256;
  const g=c.getContext('2d').createLinearGradient(0,0,0,256);
  g.addColorStop(0,top);g.addColorStop(1,bot);
  const ctx=c.getContext('2d');ctx.fillStyle=g;ctx.fillRect(0,0,8,256);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

/* ---------------- Свет ---------------- */
function buildLights(){
  scene.add(new THREE.AmbientLight(0x404040,0.4));

  sun=new THREE.DirectionalLight(0xbfe6ff,1.15);
  sun.position.set(14,30,12);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near=1; sun.shadow.camera.far=120;
  sun.shadow.camera.left=-30;sun.shadow.camera.right=30;
  sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;
  sun.shadow.bias=-0.0004;
  scene.add(sun);

  pointA=new THREE.PointLight(0x3fd0ff,0.55,70);pointA.position.set(-10,6,-4);scene.add(pointA);
  pointB=new THREE.PointLight(0x2f6bff,0.5,70); pointB.position.set(10,-6,4); scene.add(pointB);
}

/* ---------------- Стекло ---------------- */
function buildTank(){
  const g=new THREE.BoxGeometry(W,H,D);
  const glass=new THREE.MeshPhysicalMaterial({
    color:0x9fdfff,metalness:0,roughness:0.04,
    transmission:0.95,thickness:1.6,ior:1.32,
    transparent:true,opacity:0.35,side:THREE.DoubleSide,
    envMapIntensity:0.6
  });
  const box=new THREE.Mesh(g,glass);
  box.renderOrder=2;
  scene.add(box);

  const edges=new THREE.LineSegments(
    new THREE.EdgesGeometry(g),
    new THREE.LineBasicMaterial({color:0x8fdcff,transparent:true,opacity:0.5})
  );
  scene.add(edges);
}

/* ---------------- Дно ---------------- */
function buildFloor(){
  const geo=new THREE.PlaneGeometry(W-0.6,D-0.6,48,36);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i);
    pos.setZ(i,Math.sin(x*0.5)*0.16+Math.cos(y*0.45)*0.14+Math.sin((x+y)*0.3)*0.08);
  }
  geo.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({color:0xd8bd82,roughness:0.95,metalness:0});
  const floor=new THREE.Mesh(geo,mat);
  floor.rotation.x=-Math.PI/2;
  floor.position.y=-H/2+0.05;
  floor.receiveShadow=true;
  scene.add(floor);
}

/* ---------------- Камни ---------------- */
function buildRocks(){
  const colors=[0x6b6f78,0x565b66,0x7a6a5c,0x4f5560,0x8a7f72];
  for(let i=0;i<8;i++){
    const s=rand(0.9,2.1);
    const geo=new THREE.DodecahedronGeometry(s,0);
    const p=geo.attributes.position;
    for(let j=0;j<p.count;j++){
      const n=1+rand(-0.28,0.28);
      p.setXYZ(j,p.getX(j)*n,p.getY(j)*n*rand(0.6,0.95),p.getZ(j)*n);
    }
    geo.computeVertexNormals();
    const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:pick(colors),roughness:0.9,metalness:0.05}));
    m.position.set(rand(-W/2+3,W/2-3),-H/2+s*0.45,rand(-D/2+3,D/2-3));
    m.rotation.set(rand(0,TAU),rand(0,TAU),rand(0,TAU));
    m.castShadow=true;m.receiveShadow=true;
    scene.add(m);
  }
}

/* ---------------- Водоросли ---------------- */
function buildAlgae(){
  for(let i=0;i<12;i++){
    const h=rand(2.5,6);
    const baseX=rand(-W/2+3,W/2-3),baseZ=rand(-D/2+3,D/2-3),baseY=-H/2+0.2;
    const pts=[];const seg=8;
    for(let k=0;k<=seg;k++){
      const t=k/seg;
      pts.push(new THREE.Vector3(
        Math.sin(t*4+i)*0.4*t,
        baseY+h*t,
        Math.cos(t*3+i*1.3)*0.4*t
      ));
    }
    const curve=new THREE.CatmullRomCurve3(pts);
    const tube=new THREE.Mesh(
      new THREE.TubeGeometry(curve,20,lerp(0.5,0.08,0),6,false),
      new THREE.MeshStandardMaterial({color:pick(ALGAE_COLORS),roughness:0.6,emissive:0x0a2a1a,emissiveIntensity:0.25})
    );
    const root=new THREE.Object3D();
    root.position.set(baseX,baseY,baseZ);
    root.add(tube);
    scene.add(root);
    algae.push({root,phase:rand(0,TAU),amp:rand(0.06,0.14)});
  }
}

/* ---------------- Каустики (анимация света на дне) ---------------- */
function buildCaustics(){
  const c=document.createElement('canvas');c.width=c.height=256;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,256,256);
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=3;
  for(let i=0;i<26;i++){
    ctx.beginPath();
    const x=rand(0,256),y=rand(0,256);
    for(let a=0;a<TAU+0.1;a+=0.3){
      const r=rand(8,26);
      const px=x+Math.cos(a)*r+Math.sin(a*3)*6;
      const py=y+Math.sin(a)*r+Math.cos(a*2)*6;
      a===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(3,2);
  causticsMat=new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.16,blending:THREE.AdditiveBlending,depthWrite:false});
  const m=new THREE.Mesh(new THREE.PlaneGeometry(W-1,D-1),causticsMat);
  m.rotation.x=-Math.PI/2;m.position.y=-H/2+0.12;
  scene.add(m);
}

/* ---------------- Рыбка ---------------- */
function createFish(palette){
  const group=new THREE.Group();
  const bodyMat=new THREE.MeshStandardMaterial({color:palette.body,roughness:0.35,metalness:0.15,emissive:new THREE.Color(palette.body).multiplyScalar(0.12)});
  const finMat=new THREE.MeshStandardMaterial({color:palette.fin,roughness:0.5,metalness:0.1,transparent:true,opacity:0.85,side:THREE.DoubleSide,emissive:new THREE.Color(palette.fin).multiplyScalar(0.1)});

  // тело
  const body=new THREE.Mesh(new THREE.SphereGeometry(1,20,16),bodyMat);
  body.scale.set(1.9,1,0.85);
  body.castShadow=true;
  group.add(body);

  // брюшко
  const belly=new THREE.Mesh(new THREE.SphereGeometry(0.82,16,12),new THREE.MeshStandardMaterial({color:palette.belly,roughness:0.5}));
  belly.scale.set(1.7,0.8,0.7);belly.position.set(0.1,-0.25,0);
  group.add(belly);

  // глаза
  const eyeGeo=new THREE.SphereGeometry(0.2,12,12);
  const pupilGeo=new THREE.SphereGeometry(0.1,10,10);
  const whiteMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.2});
  const pupilMat=new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:0.2});
  [0.55,-0.55].forEach(z=>{
    const e=new THREE.Mesh(eyeGeo,whiteMat);e.position.set(1.35,0.15,z);group.add(e);
    const p=new THREE.Mesh(pupilGeo,pupilMat);p.position.set(1.5,0.15,z*1.05);group.add(p);
  });

  // хвост (pivot у основания)
  const tail=new THREE.Group();tail.position.set(-1.7,0,0);
  const tailMesh=new THREE.Mesh(new THREE.ConeGeometry(0.7,1.2,10),finMat);
  tailMesh.rotation.z=Math.PI/2;tailMesh.position.x=-0.55;tailMesh.castShadow=true;
  tail.add(tailMesh);group.add(tail);

  // верхний плавник
  const topFin=new THREE.Mesh(new THREE.ConeGeometry(0.55,1.1,8),finMat);
  topFin.position.set(0.2,0.95,0);topFin.scale.z=0.3;
  group.add(topFin);

  // боковые плавники
  const mkFin=(z)=>{
    const f=new THREE.Mesh(new THREE.ConeGeometry(0.45,0.9,8),finMat);
    f.position.set(0.1,-0.15,z);f.rotation.z=z>0?-0.7:0.7;f.scale.set(1,1,0.25);
    return f;
  };
  const leftFin=mkFin(0.55),rightFin=mkFin(-0.55);
  group.add(leftFin,rightFin);

  const scale=rand(0.6,1.2);
  group.scale.setScalar(scale);
  group.position.set(rand(-BOUND.x,BOUND.x),rand(-BOUND.y,BOUND.y),rand(-BOUND.z,BOUND.z));
  group.rotation.y=rand(0,TAU);
  scene.add(group);

  const dir=new THREE.Vector3(Math.cos(group.rotation.y),0,-Math.sin(group.rotation.y)).normalize();
  return {
    mesh:group,tail,leftFin,rightFin,topFin,
    velocity:dir.clone().multiplyScalar(rand(0.5,1)),
    speed:rand(2.2,4),tailSpeed:rand(6,10),phase:rand(0,TAU),
    targetFood:null,avoidanceRadius:rand(3,5),
    wanderTimer:rand(1,4),wanderDir:new THREE.Vector3(),
    currentScale:scale,targetScale:scale
  };
}
function spawnFish(palette){
  palette=palette||pick(PALETTES);
  const f=createFish(palette);
  fishArray.push(f);
  return f;
}

/* ---------------- Пузырь ---------------- */
function spawnBubble(){
  const r=rand(0.12,0.4);
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,10),
    new THREE.MeshPhysicalMaterial({color:0xcdeeff,metalness:0,roughness:0,transmission:0.9,
      thickness:0.3,ior:1.2,transparent:true,opacity:0.5,clearcoat:1}));
  m.position.set(rand(-BOUND.x,BOUND.x),rand(-H/2+1,CEIL_Y),rand(-BOUND.z,BOUND.z));
  scene.add(m);
  bubbles.push({mesh:m,r,phase:rand(0,TAU),speed:rand(1.2,2.6),sway:rand(0.2,0.6)});
}

/* ---------------- Корм ---------------- */
function spawnFood(pos){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.28,10,10),
    new THREE.MeshStandardMaterial({color:0xffb060,emissive:0xff7a20,emissiveIntensity:0.5,roughness:0.4}));
  m.position.copy(pos);
  scene.add(m);
  foods.push({mesh:m,velocity:new THREE.Vector3(rand(-0.4,0.4),rand(-0.5,0.2),rand(-0.4,0.4))});
}

/* ---------------- Кормление (клик) ---------------- */
function tryFeed(e){
  const dt=performance.now()-down.t,dist=Math.hypot(e.clientX-down.x,e.clientY-down.y);
  down=null;
  if(dt>450||dist>6) return; // это было вращением
  pointer.x=(e.clientX/innerWidth)*2-1;
  pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hit=new THREE.Vector3();
  if(raycaster.ray.intersectPlane(feedPlane,hit)){
    hit.x=clamp(hit.x,-BOUND.x,BOUND.x);
    hit.y=clamp(hit.y,FLOOR_Y+1,CEIL_Y-1);
    hit.z=clamp(hit.z,-BOUND.z,BOUND.z);
    spawnFood(hit);
    toast('🍤 Корм брошен');
  }
}

/* ---------------- Обновление рыбок ---------------- */
function updateFish(dt,time){
  const tmp=new THREE.Vector3();
  for(const f of fishArray){
    // цель
    if(!f.targetFood||!foods.includes(f.targetFood)) f.targetFood=null;
    let goal=f.velocity.clone();
    if(f.targetFood){
      tmp.copy(f.targetFood.mesh.position).sub(f.mesh.position);
      if(tmp.length()<1.4){ eatFood(f,f.targetFood); f.targetFood=null; }
      else goal=tmp.normalize().multiplyScalar(f.speed*1.6);
    }else{
      f.wanderTimer-=dt;
      if(f.wanderTimer<=0){
        f.wanderDir.set(rand(-1,1),rand(-0.6,0.6),rand(-1,1)).normalize();
        f.wanderTimer=rand(2,5);
      }
      goal=f.wanderDir.clone().multiplyScalar(f.speed);
      // мягкая тяга к центру
      tmp.copy(f.mesh.position).multiplyScalar(-0.02);
      goal.add(tmp);
    }

    // избегание столкновений
    for(const o of fishArray){
      if(o===f) continue;
      tmp.copy(f.mesh.position).sub(o.mesh.position);
      const d=tmp.length();
      if(d<f.avoidanceRadius&&d>0.001){
        tmp.multiplyScalar((f.avoidanceRadius-d)/f.avoidanceRadius/d);
        goal.add(tmp.multiplyScalar(f.speed*2));
      }
    }

    // отражение от стен
    const p=f.mesh.position;
    if(p.x> BOUND.x) goal.x-=f.speed*2; if(p.x<-BOUND.x) goal.x+=f.speed*2;
    if(p.y> BOUND.y) goal.y-=f.speed*2; if(p.y<-BOUND.y) goal.y+=f.speed*2;
    if(p.z> BOUND.z) goal.z-=f.speed*2; if(p.z<-BOUND.z) goal.z+=f.speed*2;

    // плавное сглаживание скорости
    f.velocity.lerp(goal,0.05);
    f.velocity.clampLength(0.3,f.speed*1.8);
    f.mesh.position.addScaledVector(f.velocity,dt);

    // жёсткий ограничитель
    f.mesh.position.x=clamp(f.mesh.position.x,-BOUND.x,BOUND.x);
    f.mesh.position.y=clamp(f.mesh.position.y,-BOUND.y,BOUND.y);
    f.mesh.position.z=clamp(f.mesh.position.z,-BOUND.z,BOUND.z);

    // поворот в направлении движения
    if(f.velocity.lengthSq()>0.001){
      const yaw=Math.atan2(f.velocity.x,f.velocity.z);
      f.mesh.rotation.y=lerpAngle(f.mesh.rotation.y,yaw,0.12);
      f.mesh.rotation.x=clamp(-f.velocity.y*0.15,-0.5,0.5);
    }

    // анимация хвоста и плавников
    f.phase+=dt*f.tailSpeed;
    f.tail.rotation.y=Math.sin(f.phase)*0.6;
    f.leftFin.rotation.y=0.3+Math.sin(f.phase*0.9)*0.25;
    f.rightFin.rotation.y=-0.3-Math.sin(f.phase*0.9)*0.25;
    f.topFin.rotation.z=Math.sin(f.phase*0.5)*0.12;

    // рост
    f.currentScale=lerp(f.currentScale,f.targetScale,0.08);
    f.mesh.scale.setScalar(f.currentScale);
  }
}
function lerpAngle(a,b,t){
  let d=b-a; while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU;
  return a+d*t;
}
function eatFood(f,food){
  scene.remove(food.mesh);
  foods.splice(foods.indexOf(food),1);
  f.targetScale=Math.min(f.targetScale*1.05,2.4);
  toast('🐟 Рыбка выросла!');
}

/* ---------------- Обновление пузырей ---------------- */
function updateBubbles(dt,time){
  for(const b of bubbles){
    b.phase+=dt;
    b.mesh.position.y+=b.speed*dt;
    b.mesh.position.x+=Math.sin(time*1.5+b.phase)*b.sway*dt;
    b.mesh.position.z+=Math.cos(time*1.3+b.phase)*b.sway*dt;
    b.mesh.position.x=clamp(b.mesh.position.x,-BOUND.x,BOUND.x);
    b.mesh.position.z=clamp(b.mesh.position.z,-BOUND.z,BOUND.z);
    if(b.mesh.position.y>CEIL_Y){
      b.mesh.position.y=-H/2+rand(0.5,1.5);
      b.mesh.position.x=rand(-BOUND.x,BOUND.x);
      b.mesh.position.z=rand(-BOUND.z,BOUND.z);
    }
  }
}

/* ---------------- Обновление корма ---------------- */
function updateFoods(dt){
  for(let i=foods.length-1;i>=0;i--){
    const fd=foods[i];
    fd.velocity.y-=4*dt; // гравитация
    fd.mesh.position.addScaledVector(fd.velocity,dt);
    fd.mesh.rotation.x+=dt*2;fd.mesh.rotation.y+=dt*2.5;
    if(fd.mesh.position.y<=FOOD_Y){ fd.mesh.position.y=FOOD_Y; fd.velocity.y=0; }
    if(fd.mesh.position.y<=FOOD_Y+0.02 && Math.abs(fd.velocity.y)<0.1){
      // лежит на дне — через время исчезнет
      fd.rest=(fd.rest||0)+dt;
      if(fd.rest>4){ scene.remove(fd.mesh);foods.splice(i,1);continue; }
    }
    // рыбка-охотник
    for(const f of fishArray){
      if(!f.targetFood && fd.mesh.position.distanceTo(f.mesh.position)<15){ f.targetFood=fd; break; }
    }
  }
}

/* ---------------- Водоросли ---------------- */
function updateAlgae(time){
  for(const a of algae){
    a.root.rotation.x=Math.sin(time*0.8+a.phase)*a.amp;
    a.root.rotation.z=Math.cos(time*0.6+a.phase)*a.amp;
  }
}

/* ---------------- UI ---------------- */
function bindUI(){
  document.getElementById('addFish').onclick=()=>{ spawnFish(); toast('🐟 +1 рыбка'); };
  document.getElementById('moreBubbles').onclick=()=>{ for(let i=0;i<10;i++)spawnBubble(); toast('💧 +10 пузырей'); };
  const lightBtn=document.getElementById('toggleLight');
  lightBtn.onclick=()=>{
    lightOn=!lightOn;
    sun.intensity=lightOn?1.15:0.12;
    pointA.intensity=lightOn?0.55:0.9;
    pointB.intensity=lightOn?0.5:0.9;
    lightBtn.classList.toggle('on',lightOn);
    lightBtn.querySelector('.ico').textContent=lightOn?'☀️':'🌙';
  };
}
let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1600);
}

/* ---------------- Статистика ---------------- */
let frames=0,fpsTime=0;
function updateStats(dt){
  frames++;fpsTime+=dt;
  if(fpsTime>=0.5){
    document.getElementById('stFps').textContent=Math.round(frames/fpsTime);
    frames=0;fpsTime=0;
  }
  document.getElementById('stFish').textContent=fishArray.length;
  document.getElementById('stFood').textContent=foods.length;
  document.getElementById('stBub').textContent=bubbles.length;
}

/* ---------------- Цикл ---------------- */
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const time=clock.elapsedTime;

  updateFish(dt,time);
  updateBubbles(dt,time);
  updateFoods(dt);
  updateAlgae(time);
  causticsMat.map.offset.x=time*0.02;
  causticsMat.map.offset.y=time*0.015;
  causticsMat.opacity=0.12+Math.sin(time*0.7)*0.04;

  controls.update();
  updateStats(dt);
  renderer.render(scene,camera);
}

function onResize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}

init();
</script>
</body>
