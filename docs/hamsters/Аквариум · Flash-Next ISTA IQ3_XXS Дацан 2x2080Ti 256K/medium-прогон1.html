<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Аквариум</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
    #canvas-container { position: fixed; inset: 0; }

    .glass-panel {
        position: fixed;
        background: rgba(10, 30, 60, 0.55);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(120, 200, 255, 0.3);
        border-radius: 14px;
        padding: 16px 20px;
        color: #d8f0ff;
        box-shadow: 0 8px 32px rgba(0, 40, 80, 0.5);
        z-index: 10;
    }

    #info-panel { top: 20px; left: 20px; max-width: 290px; }
    #info-panel h1 {
        font-size: 22px;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #6fd3ff, #b388ff, #64ffc4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    #info-panel p { font-size: 12.5px; line-height: 1.55; opacity: 0.85; margin-bottom: 10px; }

    .btn {
        display: inline-block;
        margin: 4px 4px 4px 0;
        padding: 8px 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12.5px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #1e88e5, #0d47a1);
        box-shadow: 0 3px 10px rgba(30, 136, 229, 0.4);
        transition: all .2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(30,136,229,.6); filter: brightness(1.15); }
    .btn.green { background: linear-gradient(135deg, #00c853, #00796b); box-shadow: 0 3px 10px rgba(0,200,83,.4); }
    .btn.amber { background: linear-gradient(135deg, #ffb300, #ef6c00); box-shadow: 0 3px 10px rgba(255,179,0,.4); }

    #stats-panel { top: 20px; right: 20px; text-align: right; font-size: 13px; }
    #stats-panel .stat { margin-bottom: 4px; }
    #stats-panel b { color: #6fd3ff; }

    @media (max-width: 700px) {
        #info-panel { max-width: 200px; padding: 10px; }
        #info-panel h1 { font-size: 16px; }
    }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div class="glass-panel" id="info-panel">
    <h1>🐠 3D Аквариум</h1>
    <p>
        🖱️ ЛКМ + движение — вращение камеры<br>
        🖱️ ПКМ + движение — панорамирование<br>
        ⚙️ Колесо мыши — зум<br>
        🍽️ Клик по аквариуму — бросить корм
    </p>
    <button class="btn green" id="btnAddFish">➕ Добавить рыбку</button>
    <button class="btn" id="btnBubbles">🫧 Больше пузырей</button>
    <button class="btn amber" id="btnLight">💡 Свет</button>
</div>

<div class="glass-panel" id="stats-panel">
    <div class="stat">Рыбки: <b id="fishCount">15</b></div>
    <div class="stat">Корм: <b id="foodCount">0</b></div>
    <div class="stat">FPS: <b id="fps">0</b></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============================================================
   БАЗОВАЯ СЦЕНА
============================================================ */
const TANK = { x: 36, y: 24, z: 20 };
const HALF = { x: TANK.x / 2, y: TANK.y / 2, z: TANK.z / 2 };
const SAND_Y = -HALF.y + 0.5;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a2a4f, 0.014);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(28, 14, 34);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// Градиентный фон через canvas-текстуру на большой сфере
(function makeBackground() {
    const c = document.createElement('canvas');
    c.width = 2; c.height = 256;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, '#03102a');
    g.addColorStop(1, '#0d4d8c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 2, 256);
    const tex = new THREE.CanvasTexture(c);
    const bg = new THREE.Mesh(
        new THREE.SphereGeometry(90, 32, 32),
        new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide })
    );
    scene.add(bg);
})();

/* ============================================================
   ОСВЕЩЕНИЕ
============================================================ */
const ambient = new THREE.AmbientLight(0x404040, 0.4);
scene.add(ambient);

const sunLight = new THREE.DirectionalLight(0xfff4d6, 1.0);
sunLight.position.set(20, 35, 15);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -30; sunLight.shadow.camera.right = 30;
sunLight.shadow.camera.top = 30; sunLight.shadow.camera.bottom = -30;
sunLight.shadow.camera.near = 1; sunLight.shadow.camera.far = 100;
scene.add(sunLight);

const pointAqua1 = new THREE.PointLight(0x2288ff, 0.8, 45);
pointAqua1.position.set(-12, 6, 0);
scene.add(pointAqua1);

const pointAqua2 = new THREE.PointLight(0x0055cc, 0.7, 45);
pointAqua2.position.set(12, -4, 5);
scene.add(pointAqua2);

/* ============================================================
   АКВАРИУМ: СТЕКЛО, ПЕСОК
============================================================ */
const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xaaddee,
    transparent: true,
    opacity: 0.12,
    transmission: 0.95,
    roughness: 0.05,
    metalness: 0,
    side: THREE.DoubleSide,
    depthWrite: false
});
const tank = new THREE.Mesh(new THREE.BoxGeometry(TANK.x, TANK.y, TANK.z), glassMat);
scene.add(tank);

const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(TANK.x, TANK.y, TANK.z)),
    new THREE.LineBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.7 })
);
scene.add(edges);

// Песчаное дно с процедурными неровностями
const sandGeo = new THREE.PlaneGeometry(TANK.x, TANK.z, 40, 30);
sandGeo.rotateX(-Math.PI / 2);
const pos = sandGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, Math.sin(x * 0.6) * 0.25 + Math.cos(z * 0.8) * 0.2 + Math.random() * 0.15);
}
sandGeo.computeVertexNormals();
const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({ color: 0xd9c38a, roughness: 0.95 }));
sand.position.y = SAND_Y;
sand.receiveShadow = true;
scene.add(sand);

/* ============================================================
   КАМНИ
============================================================ */
const rocks = [];
for (let i = 0; i < 8; i++) {
    const geo = new THREE.DodecahedronGeometry(0.8 + Math.random() * 1.4, 0);
    const p = geo.attributes.position;
    for (let j = 0; j < p.count; j++) {
        p.setXYZ(j,
            p.getX(j) * (0.7 + Math.random() * 0.6),
            p.getY(j) * (0.5 + Math.random() * 0.5),
            p.getZ(j) * (0.7 + Math.random() * 0.6));
    }
    geo.computeVertexNormals();
    const rock = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.08, 0.15, 0.25 + Math.random() * 0.2),
        roughness: 0.9
    }));
    rock.position.set(
        (Math.random() - 0.5) * (TANK.x - 6),
        SAND_Y + 0.4,
        (Math.random() - 0.5) * (TANK.z - 5)
    );
    rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    rock.castShadow = true;
    rock.receiveShadow = true;
    scene.add(rock);
    rocks.push(rock);
}

/* ============================================================
   ВОДОРОСЛИ (TubeGeometry + CatmullRomCurve3)
============================================================ */
const plants = [];
for (let i = 0; i < 12; i++) {
    const height = 3 + Math.random() * 6;
    const baseX = (Math.random() - 0.5) * (TANK.x - 4);
    const baseZ = (Math.random() - 0.5) * (TANK.z - 4);
    const pts = [];
    const segments = 6;
    for (let s = 0; s <= segments; s++) {
        const t = s / segments;
        pts.push(new THREE.Vector3(
            Math.sin(t * 3 + i) * 0.5 * t,
            t * height,
            Math.cos(t * 2.5 + i) * 0.4 * t
        ));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const geo = new THREE.TubeGeometry(curve, 20, 0.12 + Math.random() * 0.1, 6, false);
    const hue = 0.28 + Math.random() * 0.15;
    const weed = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(hue, 0.7, 0.35),
        roughness: 0.7
    }));
    weed.position.set(baseX, SAND_Y, baseZ);
    weed.castShadow = true;
    weed.userData.phase = Math.random() * Math.PI * 2;
    weed.userData.speed = 0.4 + Math.random() * 0.5;
    scene.add(weed);
    plants.push(weed);
}

/* ============================================================
   РЫБКИ
============================================================ */
const COLOR_SCHEMES = [
    { body: 0xff7a1a, fin: 0xffb347 }, // оранжевая
    { body: 0x2266ff, fin: 0x88bbff }, // синяя
    { body: 0xffcc00, fin: 0xff4422 }, // желто-красная
    { body: 0x9944dd, fin: 0xcc99ff }, // фиолетовая
    { body: 0xdd2222, fin: 0xff7766 }, // красная
    { body: 0x22aa44, fin: 0x88dd99 }, // зеленая
    { body: 0xff66aa, fin: 0xffb8d4 }, // розовая
    { body: 0xd4a017, fin: 0xf5d76e }  // золотая
];

const fishArray = [];

function createFish(pos) {
    const scheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];
    const scale = 0.6 + Math.random() * 0.6;

    const group = new THREE.Group();

    // Тело — вытянутая сфера
    const bodyGeo = new THREE.SphereGeometry(1, 18, 12);
    bodyGeo.scale(1.5, 0.85, 0.7);
    const bodyMat = new THREE.MeshStandardMaterial({ color: scheme.body, roughness: 0.4, metalness: 0.15 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.castShadow = true;
    group.add(body);

    // Хвост — конус/плоскость, вращается вокруг Z
    const tailGeo = new THREE.ConeGeometry(0.65, 1.1, 8);
    tailGeo.rotateZ(Math.PI / 2);
    tailGeo.scale(0.4, 1.4, 0.15);
    const finMat = new THREE.MeshStandardMaterial({
        color: scheme.fin, roughness: 0.5, side: THREE.DoubleSide,
        transparent: true, opacity: 0.92
    });
    const tailPivot = new THREE.Group();
    const tail = new THREE.Mesh(tailGeo, finMat);
    tail.position.x = -1.9;
    tailPivot.position.x = -1.3;
    tailPivot.add(tail);
    group.add(tailPivot);

    // Верхний плавник
    const topFinGeo = new THREE.ConeGeometry(0.4, 0.9, 6);
    topFinGeo.scale(1.2, 1, 0.15);
    const topFin = new THREE.Mesh(topFinGeo, finMat);
    topFin.position.set(0.1, 0.85, 0);
    topFin.rotation.z = -0.2;
    group.add(topFin);

    // Боковые плавники (pivot для анимации)
    const sideFinGeo = new THREE.ConeGeometry(0.3, 0.7, 6);
    sideFinGeo.scale(1, 1, 0.15);
    const leftPivot = new THREE.Group();
    const rightPivot = new THREE.Group();
    const leftFin = new THREE.Mesh(sideFinGeo, finMat);
    const rightFin = new THREE.Mesh(sideFinGeo, finMat);
    leftFin.rotation.x = Math.PI / 2; leftFin.rotation.z = 0.8;
    rightFin.rotation.x = -Math.PI / 2; rightFin.rotation.z = -0.8;
    leftPivot.position.set(0.2, -0.1, 0.55);
    rightPivot.position.set(0.2, -0.1, -0.55);
    leftPivot.add(leftFin); rightPivot.add(rightFin);
    group.add(leftPivot, rightPivot);

    // Глаза с зрачками
    const eyeMatWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
    const eyeMatBlack = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
    [0.65, -0.65].forEach(zOff => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), eyeMatWhite);
        eye.position.set(1.15, 0.18, zOff);
        group.add(eye);
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), eyeMatBlack);
        pupil.position.set(1.32, 0.18, zOff * 1.05);
        group.add(pupil);
    });

    group.scale.setScalar(scale);
    group.position.copy(pos || new THREE.Vector3(
        (Math.random() - 0.5) * (TANK.x - 6),
        SAND_Y + 2 + Math.random() * (TANK.y - 6),
        (Math.random() - 0.5) * (TANK.z - 5)
    ));

    scene.add(group);

    const dir = new THREE.Vector3(Math.random() - 0.5, (Math.random() - 0.5) * 0.3, Math.random() - 0.5).normalize();

    fishArray.push({
        mesh: group,
        tail: tailPivot,
        leftFin: leftPivot,
        rightFin: rightPivot,
        velocity: dir.multiplyScalar(0.5),
        speed: 1.5 + Math.random() * 2.5,
        tailSpeed: 4 + Math.random() * 5,
        phase: Math.random() * Math.PI * 2,
        targetFood: null,
        avoidanceRadius: 2.5 + Math.random() * 1.5,
        wanderTimer: Math.random() * 3,
        scale: scale
    });
    updateFishCount();
}

function updateFishCount() {
    document.getElementById('fishCount').textContent = fishArray.length;
}

for (let i = 0; i < 15; i++) createFish();

/* ============================================================
   ПУЗЫРИ
============================================================ */
const bubbles = [];
const bubbleMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.35,
    transmission: 0.9,
    roughness: 0.1,
    metalness: 0
});

function createBubble() {
    const r = 0.15 + Math.random() * 0.35;
    const b = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), bubbleMat);
    b.position.set(
        (Math.random() - 0.5) * (TANK.x - 4),
        SAND_Y + Math.random() * TANK.y,
        (Math.random() - 0.5) * (TANK.z - 4)
    );
    b.userData.speed = 1.2 + Math.random() * 2;
    b.userData.wobblePhase = Math.random() * Math.PI * 2;
    b.userData.baseX = b.position.x;
    b.userData.baseZ = b.position.z;
    scene.add(b);
    bubbles.push(b);
}
for (let i = 0; i < 30; i++) createBubble();

/* ============================================================
   КОРМ
============================================================ */
const foods = [];
const foodMat = new THREE.MeshStandardMaterial({ color: 0xc97a2a, roughness: 0.8 });

function createFood(point) {
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 6), foodMat);
    // Корм появляется у поверхности
    f.position.set(
        THREE.MathUtils.clamp(point.x, -HALF.x + 1, HALF.x - 1),
        HALF.y - 1,
        THREE.MathUtils.clamp(point.z, -HALF.z + 1, HALF.z - 1)
    );
    f.userData.velocityY = 0;
    scene.add(f);
    foods.push(f);
    updateFoodCount();
}
function updateFoodCount() {
    document.getElementById('foodCount').textContent = foods.length;
}

// Raycaster для кликов
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();

renderer.domElement.addEventListener('click', (e) => {
    mouseNDC.x = (e.clientX / innerWidth) * 2 - 1;
    mouseNDC.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    const hits = raycaster.intersectObject(tank);
    if (hits.length > 0) {
        createFood(hits[0].point);
    } else {
        // Если стекло не поймано — проекция на середину аквариума
        const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const pt = new THREE.Vector3();
        raycaster.ray.intersectPlane(plane, pt);
        if (pt) createFood(pt);
    }
});

/* ============================================================
   КАМЕРА / OrbitControls
============================================================ */
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 1.8;
controls.target.set(0, 0, 0);

/* ============================================================
   КНОПКИ UI
============================================================ */
document.getElementById('btnAddFish').addEventListener('click', () => createFish());
document.getElementById('btnBubbles').addEventListener('click', () => {
    for (let i = 0; i < 10; i++) createBubble();
});
let lightOn = true;
document.getElementById('btnLight').addEventListener('click', () => {
    lightOn = !lightOn;
    sunLight.intensity = lightOn ? 1.0 : 0.15;
    ambient.intensity = lightOn ? 0.4 : 0.15;
});

/* ============================================================
   ЦИКЛ АНИМАЦИИ
============================================================ */
const clock = new THREE.Clock();
let fpsFrames = 0, fpsTime = 0;

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    /* --- Рыбки --- */
    for (const fish of fishArray) {
        const m = fish.mesh;

        // Случайное блуждание
        fish.wanderTimer -= dt;
        if (fish.wanderTimer <= 0 && !fish.targetFood) {
            fish.wanderTimer = 2 + Math.random() * 4;
            fish.velocity.x += (Math.random() - 0.5) * 1.5;
            fish.velocity.y += (Math.random() - 0.5) * 0.8;
            fish.velocity.z += (Math.random() - 0.5) * 1.5;
        }

        // Поиск корма (радиус 15)
        fish.targetFood = null;
        let bestDist = 15;
        for (const f of foods) {
            if (f.userData.eaten) continue;
            const d = m.position.distanceTo(f.position);
            if (d < bestDist) { bestDist = d; fish.targetFood = f; }
        }

        if (fish.targetFood) {
            const dir = fish.targetFood.position.clone().sub(m.position).normalize();
            fish.velocity.lerp(dir.multiplyScalar(fish.speed * 1.6), 0.05);
            // Съедание
            if (m.position.distanceTo(fish.targetFood.position) < 1.2) {
                fish.targetFood.userData.eaten = true;
                scene.remove(fish.targetFood);
                foods.splice(foods.indexOf(fish.targetFood), 1);
                updateFoodCount();
                // Рост +5%
                fish.scale = Math.min(fish.scale * 1.05, 2.0);
                m.scale.setScalar(fish.scale);
                fish.targetFood = null;
            }
        }

        // Избегание столкновений
        for (const other of fishArray) {
            if (other === fish) continue;
            const diff = m.position.clone().sub(other.mesh.position);
            const d = diff.length();
            if (d < fish.avoidanceRadius && d > 0.001) {
                fish.velocity.add(diff.normalize().multiplyScalar((fish.avoidanceRadius - d) * 0.15));
            }
        }

        // Ограничение скорости
        const velLen = fish.velocity.length();
        if (velLen > fish.speed) fish.velocity.multiplyScalar(fish.speed / velLen);
        if (velLen < 0.3) {
            fish.velocity.x += (Math.random() - 0.5) * 0.5;
            fish.velocity.z += (Math.random() - 0.5) * 0.5;
        }

        // Отражение от стен (плавное)
        const margin = 2;
        const softness = 0.12;
        if (m.position.x > HALF.x - margin) fish.velocity.x -= softness * (m.position.x - (HALF.x - margin));
        if (m.position.x < -HALF.x + margin) fish.velocity.x += softness * ((-HALF.x + margin) - m.position.x);
        if (m.position.y > HALF.y - margin) fish.velocity.y -= softness * (m.position.y - (HALF.y - margin));
        if (m.position.y < SAND_Y + 1.5) fish.velocity.y += softness * ((SAND_Y + 1.5) - m.position.y);
        if (m.position.z > HALF.z - margin) fish.velocity.z -= softness * (m.position.z - (HALF.z - margin));
        if (m.position.z < -HALF.z + margin) fish.velocity.z += softness * ((-HALF.z + margin) - m.position.z);

        // Движение
        m.position.addScaledVector(fish.velocity, dt);

        // Поворот в направлении движения
        if (fish.velocity.lengthSq() > 0.01) {
            const targetAngle = Math.atan2(-fish.velocity.z, fish.velocity.x);
            let cur = m.rotation.y;
            let diff = targetAngle - cur;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            m.rotation.y += diff * 0.06;
            // Небольшой тангаж
            m.rotation.z = THREE.MathUtils.lerp(m.rotation.z,
                Math.atan2(fish.velocity.y, Math.hypot(fish.velocity.x, fish.velocity.z)) * 0.5, 0.05);
        }

        // Анимация хвоста и плавников
        fish.phase += dt * fish.tailSpeed * (0.5 + fish.velocity.length() / fish.speed);
        fish.tail.rotation.y = Math.sin(fish.phase) * 0.55;
        fish.leftFin.rotation.z = Math.sin(fish.phase * 1.3) * 0.3;
        fish.rightFin.rotation.z = -Math.sin(fish.phase * 1.3) * 0.3;

        // Лёгкое покачивание тела
        m.rotation.x = Math.sin(fish.phase * 0.5) * 0.05;
    }

    /* --- Корм (физика падения) --- */
    for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        f.userData.velocityY -= 4 * dt; // гравитация
        f.position.y += f.userData.velocityY * dt;
        f.rotation.x += dt;
        if (f.position.y <= SAND_Y + 0.4) {
            scene.remove(f);
            foods.splice(i, 1);
            updateFoodCount();
        }
    }

    /* --- Пузыри --- */
    for (const b of bubbles) {
        b.position.y += b.userData.speed * dt;
        b.userData.wobblePhase += dt * 2;
        b.position.x = b.userData.baseX + Math.sin(b.userData.wobblePhase) * 0.4;
        b.position.z = b.userData.baseZ + Math.cos(b.userData.wobblePhase * 0.8) * 0.3;
        if (b.position.y > HALF.y - 0.5) {
            b.position.y = SAND_Y + 0.5;
            b.userData.baseX = (Math.random() - 0.5) * (TANK.x - 4);
            b.userData.baseZ = (Math.random() - 0.5) * (TANK.z - 4);
        }
    }

    /* --- Водоросли: покачивание --- */
    for (const p of plants) {
        const ph = p.userData.phase + t * p.userData.speed;
        p.rotation.x = Math.sin(ph) * 0.08;
        p.rotation.z = Math.cos(ph * 0.7) * 0.06;
    }

    /* --- Пульсация подводного света --- */
    pointAqua1.intensity = 0.7 + Math.sin(t * 0.8) * 0.2;
    pointAqua2.intensity = 0.6 + Math.cos(t * 0.6) * 0.15;

    controls.update();
    renderer.render(scene, camera);

    // FPS
    fpsFrames++;
    fpsTime += dt;
    if (fpsTime >= 0.5) {
        document.getElementById('fps').textContent = Math.round(fpsFrames / fpsTime);
        fpsFrames = 0; fpsTime = 0;
    }
}
animate();

/* --- Ресайз --- */
window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
