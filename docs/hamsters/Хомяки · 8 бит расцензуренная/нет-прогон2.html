<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Low-Poly Hamster Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4a3220; --ink-soft:#7c5f45;
    --cream:#fffaf0; --paper:#fff4e2;
    --coral:#ff6f61; --coral-d:#e2544a;
    --teal:#2fbfae; --amber:#ffb43d; --berry:#ff8fab;
    --shadow:0 10px 24px rgba(120,70,30,.20);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 700px at 82% -10%, #ffe9b0 0%, transparent 55%),
      linear-gradient(180deg,#fff3d6 0%, #ffe0c2 42%, #ffd0c2 100%);
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  /* ambient drifting shapes */
  .bg{position:absolute;pointer-events:none;z-index:0}
  .dot{border-radius:50%;filter:blur(.3px)}
  .ring{border:6px solid rgba(255,255,255,.5);border-radius:50%}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(18deg)}}
  @keyframes spinSlow{to{transform:rotate(360deg)}}

  /* HUD */
  .hud{position:absolute;z-index:10;pointer-events:none}
  .hud button,.hud .panel{pointer-events:auto}

  .topbar{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px clamp(16px,3vw,34px)}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(150deg,var(--coral),#ff9a6b);
    display:grid;place-items:center;font-size:30px;box-shadow:var(--shadow);animation:bob 3.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
  .brand h1{font-family:'Fredoka';font-weight:700;line-height:.92;letter-spacing:-.5px;
    font-size:clamp(26px,4.6vw,44px);color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.6)}
  .brand h1 span{color:var(--coral)}
  .brand p{font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}

  .stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .stat{background:var(--cream);border:2px solid rgba(255,255,255,.7);border-radius:16px;padding:8px 14px;
    box-shadow:var(--shadow);min-width:96px;transition:transform .2s}
  .stat b{display:block;font-family:'Fredoka';font-weight:700;font-size:22px;line-height:1;color:var(--ink)}
  .stat span{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .stat.bump{transform:scale(1.09)}

  .dock{left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
    background:var(--cream);padding:10px 12px;border-radius:20px;box-shadow:var(--shadow);
    border:2px solid rgba(255,255,255,.7);max-width:calc(100vw - 24px)}
  .btn{font-family:'Fredoka';font-weight:600;font-size:15px;color:var(--ink);cursor:pointer;
    background:var(--paper);border:2px solid #f3e2c4;border-radius:14px;padding:10px 16px;
    display:inline-flex;align-items:center;gap:8px;transition:transform .12s,box-shadow .2s,background .2s,border-color .2s;white-space:nowrap}
  .btn:hover{transform:translateY(-3px);box-shadow:0 8px 16px rgba(120,70,30,.18)}
  .btn:active{transform:translateY(0) scale(.96)}
  .btn .ic{font-size:18px;line-height:1}
  .btn.primary{background:linear-gradient(150deg,var(--coral),#ff8a5c);color:#fff;border-color:#ff8a5c}
  .btn.primary .ic{transition:transform .5s}
  .btn.primary:hover .ic{transform:rotate(180deg)}
  .btn.active{background:linear-gradient(150deg,var(--teal),#5fd6c8);color:#fff;border-color:#5fd6c8}

  .hint{right:20px;bottom:24px;background:rgba(255,250,240,.86);backdrop-filter:blur(4px);
    padding:10px 14px;border-radius:14px;font-size:12.5px;font-weight:700;color:var(--ink-soft);
    box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.6);max-width:230px;line-height:1.5}
  .hint b{color:var(--ink)}

  .toast{position:absolute;top:18px;left:50%;transform:translate(-50%,-160%);z-index:20;
    background:var(--ink);color:#fff;font-family:'Fredoka';font-weight:600;font-size:15px;
    padding:11px 20px;border-radius:16px;box-shadow:0 12px 26px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.2,1.3,.4,1);
    pointer-events:none}
  .toast.show{transform:translate(-50%,0)}

  .tip{position:absolute;z-index:15;pointer-events:none;background:var(--ink);color:#fff;
    font-family:'Fredoka';font-weight:600;font-size:14px;padding:7px 13px;border-radius:12px;
    transform:translate(-50%,-140%);opacity:0;transition:opacity .15s;white-space:nowrap;box-shadow:0 8px 18px rgba(0,0,0,.28)}
  .tip.show{opacity:1}
  .tip::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}

  .loader{position:absolute;inset:0;z-index:40;display:grid;place-items:center;
    background:linear-gradient(180deg,#fff3d6,#ffd0c2);transition:opacity .6s}
  .loader.hide{opacity:0;pointer-events:none}
  .loader .card{text-align:center}
  .loader .spin{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;
    border:7px solid rgba(255,255,255,.5);border-top-color:var(--coral);animation:spinSlow .9s linear infinite}
  .loader h2{font-family:'Fredoka';font-weight:700;font-size:26px}
  .loader p{color:var(--ink-soft);font-weight:700;margin-top:4px}

  @media (max-width:640px){
    .brand p{display:none}
    .stats .stat:nth-child(2){display:none}
    .hint{display:none}
    .dock{flex-wrap:wrap;justify-content:center}
  }
</style>
</head>
<body>
<div id="app"></div>

<!-- ambient background -->
<div class="bg dot" style="width:120px;height:120px;left:6%;top:14%;background:radial-gradient(circle at 35% 30%,#fff,#ffd9a0);opacity:.5;animation:floaty 9s ease-in-out infinite"></div>
<div class="bg ring" style="width:180px;height:180px;right:8%;top:22%;animation:spinSlow 40s linear infinite;opacity:.5"></div>
<div class="bg dot" style="width:70px;height:70px;left:20%;bottom:16%;background:radial-gradient(circle at 35% 30%,#fff,#ffb3c1);opacity:.55;animation:floaty 7s ease-in-out infinite reverse"></div>
<div class="bg ring" style="width:90px;height:90px;left:44%;top:8%;opacity:.4;animation:spinSlow 28s linear infinite reverse"></div>
<div class="bg dot" style="width:150px;height:150px;right:20%;bottom:10%;background:radial-gradient(circle at 35% 30%,#fff,#a6ece0);opacity:.4;animation:floaty 11s ease-in-out infinite"></div>

<header class="hud topbar">
  <div class="brand">
    <div class="logo">🐹</div>
    <div>
      <h1>HAMSTER<br><span>PLAYGROUND</span></h1>
      <p>low-poly &amp; very round</p>
    </div>
  </div>
  <div class="stats">
    <div class="stat" id="stat-ham"><b>0</b><span>hamsters</span></div>
    <div class="stat" id="stat-spin"><b>0</b><span>wheel spins</span></div>
    <div class="stat" id="stat-munch"><b>0</b><span>munches</span></div>
  </div>
</header>

<nav class="hud dock">
  <button class="btn primary" id="btn-feed"><span class="ic">🌰</span> Feed</button>
  <button class="btn" id="btn-wheel"><span class="ic">🎡</span> Spin wheel</button>
  <button class="btn" id="btn-tunnel"><span class="ic">🕳️</span> Peek tunnel</button>
  <button class="btn" id="btn-bowl"><span class="ic">🥣</span> Toss snack</button>
  <button class="btn" id="btn-pause"><span class="ic">⏸</span> Pause</button>
  <button class="btn" id="btn-reset"><span class="ic">↺</span> Reset view</button>
</nav>

<div class="hud hint"><b>Drag</b> to orbit · <b>scroll</b> to zoom<br>Click a hamster or the wheel to poke them.</div>
<div class="hud toast" id="toast"></div>
<div class="hud tip" id="tip"></div>

<div class="loader" id="loader">
  <div class="card">
    <div class="spin"></div>
    <h2>Waking up the hamsters…</h2>
    <p>fluffing fur &amp; polishing the wheel</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
if(!window.THREE){ document.getElementById('loader').querySelector('h2').textContent='Could not load Three.js'; return; }

/* ---------- helpers ---------- */
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lerpAngle=(a,b,t)=>{let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;return a+d*t;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0},o));

/* ---------- renderer / scene ---------- */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
app.appendChild(renderer.domElement);
const maxAniso=renderer.capabilities.getMaxAnisotropy();

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xffe0c2,22,44);

// gradient sky
function makeSky(){
  const c=document.createElement('canvas');c.width=4;c.height=256;
  const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#fff4d6');g.addColorStop(.45,'#ffe4c2');g.addColorStop(1,'#ffcdbd');
  x.fillStyle=g;x.fillRect(0,0,4,256);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  const m=new THREE.Mesh(new THREE.SphereGeometry(60,24,16),new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,fog:false,depthWrite:false}));
  m.renderOrder=-1;scene.add(m);
}
makeSky();

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,200);
camera.position.set(10,7.5,11);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;
controls.target.set(0,1.4,0);
controls.minDistance=7;controls.maxDistance=22;
controls.minPolarAngle=.2;controls.maxPolarAngle=1.46;
controls.enablePan=false;
controls.autoRotateSpeed=.5;
controls.update();

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xfff3e0,0xd8a888,.85));
const sun=new THREE.DirectionalLight(0xfff2df,1.15);
sun.position.set(8,14,7);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1;sun.shadow.camera.far=45;
sun.shadow.camera.left=-11;sun.shadow.camera.right=11;
sun.shadow.camera.top=11;sun.shadow.camera.bottom=-11;
sun.shadow.bias=-0.0004;sun.shadow.normalBias=.02;
scene.add(sun);
const fill=new THREE.DirectionalLight(0xbfe8ff,.35);fill.position.set(-7,6,-5);scene.add(fill);

/* ---------- ground + backdrop ---------- */
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),mat(0xf6c98a,{roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const ring=new THREE.Mesh(new THREE.RingGeometry(13,30,48),mat(0xffd9ad,{roughness:1}));
ring.rotation.x=-Math.PI/2;ring.position.y=.005;ring.receiveShadow=true;scene.add(ring);

function blob(x,z,r,c){
  const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),mat(c,{flatShading:true,roughness:1}));
  m.position.set(x,.15,z);m.scale.y=.4;m.rotation.y=rand(0,6.28);
  m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
blob(-11,-6,2.4,0x8fd6a0);blob(11,-7,3,0x7cc79b);blob(13,5,2.2,0xa9e0b0);blob(-12,7,2.6,0x8fd6a0);
// little trees
function tree(x,z,h,c){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.28,.36,h*.4,6),mat(0x9c6b3f));trunk.position.y=h*.2;trunk.castShadow=true;
  const cone=new THREE.Mesh(new THREE.ConeGeometry(h*.5,h,7),mat(c,{flatShading:true}));cone.position.y=h*.7;cone.castShadow=true;
  g.add(trunk,cone);g.position.set(x,0,z);scene.add(g);
}
tree(-10.5,-5.5,3.4,0x6bbf8a);tree(10.5,-6.5,4,0x57b07d);tree(12.5,4.5,3,0x79cc97);

/* ---------- cage ---------- */
const W=9,D=7,BH=3.2;
const cage=new THREE.Group();scene.add(cage);
const tray=new THREE.Mesh(new THREE.BoxGeometry(W+.5,.45,D+.5),mat(0x9c6b3f,{roughness:.9}));
tray.position.y=.225;tray.castShadow=true;tray.receiveShadow=true;cage.add(tray);
const sand=new THREE.Mesh(new THREE.BoxGeometry(W-.2,.16,D-.2),mat(0xf2cf9a,{roughness:1}));
sand.position.y=.5;sand.receiveShadow=true;cage.add(sand);

// glass walls (front-left + front-right so camera sees in)
const glassMat=new THREE.MeshPhysicalMaterial({color:0xcfeee9,transparent:true,opacity:.16,roughness:.05,metalness:0,clearcoat:1,clearcoatRoughness:.05,side:THREE.DoubleSide});
function wall(w,h,x,y,z,ry){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),glassMat);m.position.set(x,y,z);m.rotation.y=ry||0;m.renderOrder=2;cage.add(m);}
wall(W,BH,0,.45+BH/2,D/2,0);          // front
wall(D,BH,-W/2,.45+BH/2,0,Math.PI/2); // left
// back + right frames (posts)
const postMat=mat(0xffffff,{roughness:.6});
function post(x,z){const m=new THREE.Mesh(new THREE.BoxGeometry(.14,BH+.1,.14),postMat);m.position.set(x,.45+BH/2,z);m.castShadow=true;cage.add(m);}
[[-W/2,-D/2],[W/2,-D/2],[-W/2,D/2],[W/2,D/2]].forEach(p=>post(p[0],p[1]));
// top frame
function bar(x1,z1,x2,z2){const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);const m=new THREE.Mesh(new THREE.BoxGeometry(len,.14,.14),postMat);m.position.set((x1+x2)/2,.45+BH,(z1+z2)/2);m.rotation.y=Math.atan2(dz,dx);m.castShadow=true;cage.add(m);}
bar(-W/2,-D/2,W/2,-D/2);bar(-W/2,D/2,W/2,D/2);bar(-W/2,-D/2,-W/2,D/2);bar(W/2,-D/2,W/2,D/2);
// back wall slats (cute)
const slatMat=mat(0xffd98a,{roughness:.9});
for(let i=0;i<7;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(.5,.12,D-.3),slatMat);s.position.set(-W/2+.6+i*(W-1.2)/6,.45+BH*.5,-D/2+.06);cage.add(s);}

/* ---------- props ---------- */
// food bowl
const bowl=new THREE.Group();
const bowlBase=new THREE.Mesh(new THREE.CylinderGeometry(.7,.45,.4,16),mat(0x2fbfae,{roughness:.5}));bowlBase.position.y=.2;bowlBase.castShadow=true;bowl.add(bowlBase);
const food=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.12,16),mat(0xff8a3d,{roughness:.9}));food.position.y=.36;food.castShadow=true;bowl.add(food);
bowl.position.set(2.9,.45,-2.2);cage.add(bowl);
const BOWL_POS=bowl.position.clone();

// wheel
const wheel=new THREE.Group();
const hub=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.5,12),mat(0xff6f61));hub.rotation.z=Math.PI/2;hub.castShadow=true;wheel.add(hub);
const rimMat=mat(0xff8a5c,{roughness:.6});
const rim=new THREE.Mesh(new THREE.TorusGeometry(1.1,.1,10,28),rimMat);rim.castShadow=true;wheel.add(rim);
const spokes=[];
for(let i=0;i<6;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(.06,2.05,.06),rimMat);s.rotation.z=i*Math.PI/6;wheel.add(s);spokes.push(s);}
// runner platform
const plat=new THREE.Mesh(new THREE.TorusGeometry(1.1,.16,8,28,Math.PI),mat(0xffb43d,{roughness:.7}));plat.rotation.z=Math.PI;plat.castShadow=true;wheel.add(plat);
const legL=new THREE.Mesh(new THREE.BoxGeometry(.16,1.1,.16),mat(0xffffff));legL.position.set(-.5,.0,0);
const legR=legL.clone();legR.position.x=.5;
const basePlate=new THREE.Mesh(new THREE.BoxGeometry(1.4,.14,.9),mat(0xffffff));basePlate.position.y=-.5;
wheel.add(legL,legR,basePlate);
wheel.position.set(-2.9,1.75,2.1);cage.add(wheel);
const WHEEL_POS=wheel.position.clone();
const wheelSpin={v:0,boost:0,total:0,lastLap:0};

// tunnel (open pipe, ends face the two long walls)
const tunnel=new THREE.Group();
const pipe=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,2.4,14,1,true),
  new THREE.MeshStandardMaterial({color:0xff8fab,roughness:.8,side:THREE.DoubleSide,flatShading:true}));
pipe.rotation.z=Math.PI/2;pipe.castShadow=true;tunnel.add(pipe);
const ringMat=mat(0xffc2d4,{roughness:.7});
[[-1.2,0],[1.2,0]].forEach(p=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.55,.08,8,18),ringMat);r.rotation.y=Math.PI/2;r.position.x=p[0];tunnel.add(r);});
tunnel.position.set(0,1.0,-1.4);cage.add(tunnel);
const TUNNEL_POS=tunnel.position.clone();

// hay pile
const hay=new THREE.Group();
for(let i=0;i<16;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(rand(.12,.22),rand(.1,.16),rand(.5,.9)),mat(0xd9b25e,{roughness:1}));
  s.position.set(rand(-.7,.7),.1+i*.02,rand(-.5,.5));s.rotation.y=rand(0,6.28);s.rotation.x=rand(-.4,.4);s.castShadow=true;hay.add(s);}
hay.position.set(3.4,.45,2.3);cage.add(hay);

// scattered seed piles (decor)
for(let i=0;i<3;i++){const p=new THREE.Group();for(let j=0;j<6;j++){const s=new THREE.Mesh(new THREE.IcosahedronGeometry(.06,0),mat(0xff8a3d));s.position.set(rand(-.25,.25),.06,rand(-.25,.25));p.add(s);}
  p.position.set(rand(-3,3),.45,rand(-2,2));cage.add(p);}

/* ---------- hamster factory ---------- */
const PALETTE=[
  {body:0xffc46b,belly:0xfff2d6,ear:0xff9db0},
  {body:0xf2a35c,belly:0xffe6c2,ear:0xff9db0},
  {body:0xffb0b0,belly:0xffe0e0,ear:0xff8098},
  {body:0xe8c98f,belly:0xfff6e6,ear:0xffb0a0},
  {body:0xf6d488,belly:0xfff8ea,ear:0xff9db0},
];
const NAMES=['Biscuit','Mochi','Peanut','Clover','Noodle'];

function makeHamster(i){
  const P=PALETTE[i%PALETTE.length];
  const g=new THREE.Group();
  const bodyMat=mat(P.body,{flatShading:true,roughness:.9});
  const bellyMat=mat(P.belly,{flatShading:true,roughness:.9});
  const earMat=mat(P.ear,{flatShading:true,roughness:.9});
  const dark=mat(0x3a2a1e,{roughness:.5});
  const pink=mat(0xff9db0,{roughness:.8});

  const body=new THREE.Mesh(new THREE.IcosahedronGeometry(.5,1),bodyMat);
  body.scale.set(1.05,.85,1.3);body.position.y=.42;body.castShadow=true;g.add(body);
  const belly=new THREE.Mesh(new THREE.IcosahedronGeometry(.42,1),bellyMat);
  belly.scale.set(.95,.75,1.1);belly.position.set(0,.36,.14);g.add(belly);
  const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.36,1),bodyMat);
  head.scale.set(1.05,.95,1);head.position.set(0,.58,.46);head.castShadow=true;g.add(head);

  function ear(side){const e=new THREE.Mesh(new THREE.IcosahedronGeometry(.15,1),earMat);e.scale.set(1,.7,1);e.position.set(.24*side,.82,.4);g.add(e);
    const inE=new THREE.Mesh(new THREE.IcosahedronGeometry(.08,1),pink);inE.position.set(.24*side,.82,.46);g.add(inE);}
  ear(1);ear(-1);

  function eye(side){const e=new THREE.Mesh(new THREE.SphereGeometry(.055,10,10),dark);e.position.set(.14*side,.62,.76);g.add(e);
    const sh=new THREE.Mesh(new THREE.SphereGeometry(.02,8,8),mat(0xffffff,{roughness:.3}));sh.position.set(.12*side,.64,.8);g.add(sh);}
  eye(1);eye(-1);
  const nose=new THREE.Mesh(new THREE.SphereGeometry(.05,10,10),pink);nose.position.set(0,.52,.83);g.add(nose);

  function foot(side,sign){const f=new THREE.Mesh(new THREE.IcosahedronGeometry(.13,1),bodyMat);f.scale.set(1,.7,1.1);f.position.set(.2*side,.12,.3*sign);f.castShadow=true;g.add(f);}
  foot(1,1);foot(-1,1);foot(1,-1);foot(-1,-1);

  const tail=new THREE.Mesh(new THREE.IcosahedronGeometry(.1,1),bodyMat);tail.position.set(0,.4,-.62);g.add(tail);

  const legs=[];
  [[.2,.3],[-.2,.3],[.2,-.3],[-.2,-.3]].forEach(p=>{
    const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.18,3,6),bodyMat);
    leg.position.set(p[0],.2,p[1]);leg.castShadow=true;g.add(leg);
    legs.push({mesh:leg,phase:Math.random()*6.28});
  });

  g.userData={legs,name:NAMES[i%NAMES.length]};
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  return g;
}

/* ---------- hamster state ---------- */
const HAM_COUNT=5;
const hamsters=[];
const FLOOR_Y=.55, RADIUS=.5;
for(let i=0;i<HAM_COUNT;i++){
  const mesh=makeHamster(i);
  const h={mesh,mode:'wander',target:new THREE.Vector3(),heading:rand(0,6.28),speed:rand(.8,1.4),
    pauseT:0,wanderT:rand(1,4),bob:0,bobT:rand(0,6),blinkT:rand(2,6),blink:0,
    interactT:0,interact:null,munchT:0,cheek:1,
    spawn:rand(-1,0), // entrance stagger
    home:new THREE.Vector3(rand(-3.2,3.2),FLOOR_Y,rand(-2.2,2.2))};
  mesh.position.copy(h.home);
  mesh.scale.setScalar(0.001);
  scene.add(mesh);
  hamsters.push(h);
}

function randomPoint(){
  for(let k=0;k<12;k++){
    const x=rand(-3.4,3.4),z=rand(-2.4,2.4);
    if(Math.hypot(x-BOWL_POS.x,z-BOWL_POS.z)<1.1)continue;
    if(Math.hypot(x-WHEEL_POS.x,z-WHEEL_POS.z)<1.3)continue;
    if(Math.hypot(x-TUNNEL_POS.x,z-TUNNEL_POS.z)<.9)continue;
    return new THREE.Vector3(x,FLOOR_Y,z);
  }
  return new THREE.Vector3(rand(-3.4,3.4),FLOOR_Y,rand(-2.4,2.4));
}
function setMode(h,mode){
  h.mode=mode;
  if(mode==='wander'){h.wanderT=rand(1.5,4);h.speed=rand(.8,1.5);h.target=randomPoint();}
  else if(mode==='pause'){h.pauseT=rand(1,3);}
  else if(mode==='eat'){h.interact=BOWL_POS;h.munchT=0;h.interactT=rand(2,3.5);}
  else if(mode==='run'){h.interact=WHEEL_POS;h.interactT=rand(3,5);}
  else if(mode==='peek'){h.interact=TUNNEL_POS;h.interactT=rand(2.5,4);}
  else if(mode==='startle'){h.pauseT=.5;}
  else if(mode==='sleep'){h.pauseT=rand(3,6);}
}
function chooseNext(h){
  const r=Math.random();
  if(r<.5)setMode(h,'wander');
  else if(r<.7)setMode(h,'pause');
  else if(r<.84)setMode(h,'eat');
  else if(r<.94)setMode(h,'run');
  else setMode(h,'peek');
}

/* ---------- particles ---------- */
const parts=[];
function puff(pos,color,count){
  count=count||6;
  for(let i=0;i<count;i++){
    const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.07,0),mat(color,{flatShading:true,transparent:true,opacity:1}));
    m.position.copy(pos).add(new THREE.Vector3(rand(-.15,.15),rand(0,.1),rand(-.15,.15)));
    m.velocity=new THREE.Vector3(rand(-1,1),rand(1.2,2.4),rand(-1,1));
    m.life=rand(.6,1);m.max=m.life;scene.add(m);parts.push(m);
  }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){scene.remove(p);p.geometry.dispose();p.material.dispose();parts.splice(i,1);continue;}
    p.velocity.y-=4*dt;p.position.addScaledVector(p.velocity,dt);
    p.material.opacity=p.life/p.max;p.scale.setScalar(p.life/p.max);
  }
}

/* ---------- interaction ---------- */
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
let downPos=null,downTime=0;
const tip=document.getElementById('tip');
const toastEl=document.getElementById('toast');
let toastTimer;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1700);}

function findHamster(obj){while(obj){if(obj.userData&&obj.userData.legs)return obj.parent?obj.parent:obj;obj=obj.parent;}return null;}
function hamOf(group){return hamsters.find(h=>h.mesh===group);}

renderer.domElement.addEventListener('pointerdown',e=>{downPos={x:e.clientX,y:e.clientY};downTime=performance.now();});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downPos)return;
  const moved=Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y);
  if(moved<6 && performance.now()-downTime<450){handleTap(e);}
  downPos=null;
});
function handleTap(e){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(scene.children,true);
  for(const hit of hits){
    const grp=findHamster(hit.object);
    if(grp){const h=hamOf(grp);if(h){pokeHamster(h);return;}}
    if(hit.object===wheel||hit.object.parent===wheel||hit.object===rim||hit.object===hub){spinWheel();return;}
  }
}
function pokeHamster(h){
  setMode(h,'startle');
  h.bob=1.4;
  puff(h.mesh.position.clone().add(new THREE.Vector3(0,.7,0)),0xffffff,5);
  toast(h.mesh.userData.name+'!');
}
function spinWheel(){wheelSpin.boost+=6;toast('Round and round! 🎡');}

// hover
let hoverTarget=null;
renderer.domElement.addEventListener('pointermove',e=>{
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(scene.children,true);
  hoverTarget=null;
  for(const hit of hits){
    const grp=findHamster(hit.object);
    if(grp){hoverTarget=grp;break;}
    if(hit.object===wheel||hit.object.parent===wheel||hit.object===rim||hit.object===hub){hoverTarget=wheel;break;}
  }
  if(hoverTarget){
    let label='';
    if(hoverTarget===wheel)label='Run wheel · click to spin';
    else{const h=hamOf(hoverTarget);label=(h?h.mesh.userData.name:'')+' · click to poke';}
    tip.textContent=label;
    tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';
    tip.classList.add('show');
    renderer.domElement.style.cursor='pointer';
  }else{tip.classList.remove('show');renderer.domElement.style.cursor='grab';}
});
renderer.domElement.addEventListener('pointerleave',()=>{tip.classList.remove('show');});

/* ---------- buttons ---------- */
document.getElementById('btn-feed').onclick=()=>{
  for(const h of hamsters){if(h.mode==='wander'||h.mode==='pause')setMode(h,'eat');}
  puff(BOWL_POS.clone().add(new THREE.Vector3(0,.5,0)),0xff8a3d,8);
  toast('Snack time! 🌰');
};
document.getElementById('btn-wheel').onclick=spinWheel;
document.getElementById('btn-tunnel').onclick=()=>{
  for(const h of hamsters){if(h.mode==='wander'||h.mode==='pause')setMode(h,'peek');}
  toast('Peek-a-boo! 👀');
};
document.getElementById('btn-bowl').onclick=()=>{
  const s=new THREE.Mesh(new THREE.IcosahedronGeometry(.08,0),mat(0xff8a3d));
  s.position.set(rand(-2,2),3,rand(-1,1));s.velocity=new THREE.Vector3(rand(-.5,.5),0,rand(-.5,.5));
  s.life=1;scene.add(s);parts.push(Object.assign(s,{isSeed:true}));
  toast('Snack tossed!');
};
let paused=false;
document.getElementById('btn-pause').onclick=function(){
  paused=!paused;this.classList.toggle('active',paused);
  this.querySelector('.ic').textContent=paused?'▶':'⏸';
  this.lastChild.textContent=paused?' Play':' Pause';
};
document.getElementById('btn-reset').onclick=()=>{
  camera.position.set(10,7.5,11);controls.target.set(0,1.4,0);controls.update();toast('View reset');
};

/* ---------- stats ---------- */
const statHam=document.getElementById('stat-ham');
const statSpin=document.getElementById('stat-spin');
const statMunch=document.getElementById('stat-munch');
let spins=0,munches=0;
function bump(el,val){el.querySelector('b').textContent=val;el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),200);}
statHam.querySelector('b').textContent=HAM_COUNT;

/* ---------- update loop ---------- */
let last=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;
  const t=now/1000;

  // wheel physics
  wheelSpin.v+=wheelSpin.boost*dt;wheelSpin.boost*=Math.pow(.25,dt);
  wheelSpin.v*=Math.pow(.6,dt);
  wheel.rotation.x+=wheelSpin.v*dt;
  const lap=wheel.rotation.x/(Math.PI*2);
  if(lap-wheelSpin.lastLap>=1){wheelSpin.lastLap=Math.floor(lap);spins++;bump(statSpin,spins);
    // reward: nearest hamster gets a treat boost
    let best=null,bd=1e9;for(const h of hamsters){const d=h.mesh.position.distanceTo(WHEEL_POS);if(d<bd){bd=d;best=h;}}
    if(best&&bd<2.5){setMode(best,'eat');toast(best.mesh.userData.name+' earned a snack!');}
  }

  // hamsters
  for(const h of hamsters){
    if(h.spawn<0){h.spawn+=dt;if(h.spawn<0)continue;}
    const s=clamp(h.spawn,0,1);
    h.mesh.scale.setScalar(s*(1+Math.sin(s*Math.PI)*.06));

    if(paused){ // idle breathing only
      h.bobT+=dt;h.mesh.position.y=FLOOR_Y+Math.sin(h.bobT*3)*.01;
      continue;
    }

    // blink
    h.blinkT-=dt;if(h.blinkT<=0){h.blink=.12;h.blinkT=rand(2.5,6);}
    if(h.blink>0)h.blink-=dt;
    const blinkScale=Math.abs(h.blink)>0?.15:1;
    h.mesh.children.forEach(c=>{if(c.material===dark)c.scale.y=blinkScale;});

    // decay
    h.bob*=Math.pow(.15,dt);
    if(h.cheek>1)h.cheek+=(1-h.cheek)*Math.min(1,dt*1.5);

    let moving=0;
    switch(h.mode){
      case 'wander':{
        const dir=h.target.clone().sub(h.mesh.position);dir.y=0;
        if(dir.length()<.25){chooseNext(h);break;}
        dir.normalize();
        const want=Math.atan2(dir.x,dir.z);
        h.heading=lerpAngle(h.heading,want,Math.min(1,dt*6));
        h.mesh.position.addScaledVector(dir,h.speed*dt);
        moving=1;
        h.wanderT-=dt;if(h.wanderT<=0)chooseNext(h);
        break;
      }
      case 'pause':case 'sleep':{
        h.pauseT-=dt;if(h.pauseT<=0)chooseNext(h);
        break;
      }
      case 'eat':{
        const dir=h.interact.clone().sub(h.mesh.position);dir.y=0;
        if(dir.length()>.95){dir.normalize();const want=Math.atan2(dir.x,dir.z);
          h.heading=lerpAngle(h.heading,want,Math.min(1,dt*6));h.mesh.position.addScaledVector(dir,1.1*dt);moving=1;}
        else{h.interactT-=dt;h.munchT+=dt;h.cheek=1.35;
          if(h.munchT>.5){h.munchT=0;munches++;bump(statMunch,munches);
            puff(BOWL_POS.clone().add(new THREE.Vector3(0,.5,0)),0xff8a3d,3);}}
        if(h.interactT<=0)chooseNext(h);
        break;
      }
      case 'run':{
        const dir=h.interact.clone().sub(h.mesh.position);dir.y=0;
        if(dir.length()>1.1){dir.normalize();const want=Math.atan2(dir.x,dir.z);
          h.heading=lerpAngle(h.heading,want,Math.min(1,dt*6));h.mesh.position.addScaledVector(dir,1.3*dt);moving=1;}
        else{h.interactT-=dt;wheelSpin.boost+=1.5*dt;
          if(h.interactT<=0){setMode(h,'wander');toast(h.mesh.userData.name+' is dizzy! 💫');}}
        break;
      }
      case 'peek':{
        const dir=h.interact.clone().sub(h.mesh.position);dir.y=0;
        if(dir.length()>.7){dir.normalize();const want=Math.atan2(dir.x,dir.z);
          h.heading=lerpAngle(h.heading,want,Math.min(1,dt*6));h.mesh.position.addScaledVector(dir,1.1*dt);moving=1;}
        else{h.interactT-=dt;
          if(h.interactT<=0){puff(h.mesh.position.clone().add(new THREE.Vector3(0,.6,0)),0xffc2d4,4);
            setMode(h,'wander');toast('Boop! 👋');}}
        break;
      }
      case 'startle':{
        h.pauseT-=dt;if(h.pauseT<=0)chooseNext(h);
        break;
      }
    }

    // keep inside
    h.mesh.position.x=clamp(h.mesh.position.x,-3.6,3.6);
    h.mesh.position.z=clamp(h.mesh.position.z,-2.6,2.6);

    // orientation
    h.mesh.rotation.y=h.heading;
    // bob + hop
    h.bobT+=dt;
    let y=FLOOR_Y+Math.sin(h.bobT*3)*.015;
    if(moving)y+=Math.abs(Math.sin(t*10))*0.05*h.speed;
    y+=h.bob*.12;
    h.mesh.position.y=y;
    // squash & stretch
    const sq=1+h.bob*.15;
    h.mesh.scale.set(h.mesh.scale.x,sq,h.mesh.scale.z);

    // leg swing
    if(moving){
      for(const L of h.mesh.userData.legs){
        L.mesh.rotation.x=Math.sin(t*12+L.phase)*(0.5*h.speed);
      }
    }else{
      for(const L of h.mesh.userData.legs)L.mesh.rotation.x*=Math.pow(.1,dt);
    }
    // body lean forward when moving
    h.mesh.rotation.x=lerpAngle(h.mesh.rotation.x,moving?-0.12:0,Math.min(1,dt*4));
  }

  // particles (incl. seeds landing in bowl)
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.isSeed){
      p.velocity.y-=5*dt;p.position.addScaledVector(p.velocity,dt);
      if(p.position.y<=BOWL_POS.y+.4){p.position.copy(BOWL_POS).add(new THREE.Vector3(rand(-.3,.3),.42,rand(-.3,.3)));
        puff(p.position,0xff8a3d,2);scene.remove(p);p.geometry.dispose();p.material.dispose();parts.splice(i,1);continue;}
    }else{
      p.velocity.y-=4*dt;p.position.addScaledVector(p.velocity,dt);
    }
    if(p.life<=0){scene.remove(p);p.geometry.dispose();p.material.dispose();parts.splice(i,1);continue;}
    if(!p.isSeed){p.material.opacity=p.life/p.max;p.scale.setScalar(Math.max(.05,p.life/p.max));}
  }

  // hover highlight
  for(const h of hamsters){
    const target=(hoverTarget===h.mesh)?1.14:1;
    const cur=h.mesh.userData._hs||1;
    const ns=cur+(target-cur)*Math.min(1,dt*10);
    h.mesh.userData._hs=ns;
    // apply on top of squash (x,z)
    h.mesh.scale.x=ns;h.mesh.scale.z=ns;
  }

  controls.update();
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

/* ---------- resize ---------- */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ---------- intro ---------- */
setTimeout(()=>document.getElementById('loader').classList.add('hide'),650);
})();
</script>
</body>
</html>
