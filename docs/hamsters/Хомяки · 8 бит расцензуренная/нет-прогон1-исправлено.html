<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Low-Poly Hamster Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3b2a22;
    --panel:#fffaf2;
    --accent:#ff7d6b;
    --accent2:#ffb84d;
    --line:#f0d9c4;
    --shadow:0 10px 30px rgba(90,50,30,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#ffe0cf;color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  #scene{position:fixed;inset:0;display:block;touch-action:none;cursor:grab;}
  #scene:active{cursor:grabbing;}

  .hud{position:fixed;z-index:10;pointer-events:none;}
  .hud *{pointer-events:auto;}

  .topbar{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:22px 26px;gap:16px;}
  .brand{display:flex;align-items:center;gap:14px;}
  .logo{width:56px;height:56px;flex:none;filter:drop-shadow(0 6px 10px rgba(120,60,30,.25));animation:bob 3.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
  .brand h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(24px,3.4vw,38px);
    line-height:.9;margin:0;letter-spacing:-.5px;text-shadow:0 2px 0 #fff;}
  .brand h1 b{color:var(--accent);}
  .brand p{margin:3px 0 0;font-size:13px;font-weight:700;color:#a9795f;letter-spacing:.2px;}

  .stats{display:flex;gap:10px;align-items:stretch;}
  .stat{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:8px 14px;
    box-shadow:var(--shadow);min-width:96px;text-align:center;}
  .stat .num{font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;line-height:1;color:var(--ink);}
  .stat .lbl{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#b98a70;margin-top:3px;}
  .stat.bites .num{color:var(--accent);}

  .dock{bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;
    padding:20px 26px;gap:16px;flex-wrap:wrap;}
  .hint{background:rgba(255,250,242,.9);backdrop-filter:blur(4px);border:2px solid var(--line);
    border-radius:16px;padding:10px 16px;font-size:13px;font-weight:700;color:#8a5c45;box-shadow:var(--shadow);}
  .hint kbd{font-family:'Fredoka';background:#ffe4d3;border-radius:6px;padding:1px 7px;color:#a5502f;font-weight:700;}

  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;color:var(--ink);
    background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:11px 18px;cursor:pointer;
    box-shadow:0 5px 0 #e7cdb6, var(--shadow);transition:transform .12s ease, box-shadow .12s ease, background .12s;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #e7cdb6, var(--shadow);}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #e7cdb6, var(--shadow);}
  .btn.primary{background:linear-gradient(180deg,#ffd35a,#ff9f45);border-color:#f0a93e;color:#5a3410;
    box-shadow:0 5px 0 #d9832f, var(--shadow);}
  .btn.primary:hover{box-shadow:0 7px 0 #d9832f, var(--shadow);}
  .btn.primary:active{box-shadow:0 2px 0 #d9832f, var(--shadow);}

  .toggle{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);
    border-radius:16px;padding:9px 14px;cursor:pointer;box-shadow:var(--shadow);font-weight:800;font-size:13px;color:#8a5c45;
    transition:transform .12s;}
  .toggle:hover{transform:translateY(-2px);}
  .toggle .sw{width:40px;height:22px;border-radius:999px;background:#e6cbb8;position:relative;transition:background .2s;}
  .toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .2s;}
  .toggle.on .sw{background:#5cc46a;}
  .toggle.on .sw::after{left:20px;}

  .toast{position:fixed;top:96px;left:50%;transform:translateX(-50%) translateY(-14px);z-index:20;
    background:var(--ink);color:#fff5ec;font-family:'Fredoka';font-weight:600;font-size:16px;
    padding:12px 22px;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.28);opacity:0;pointer-events:none;
    transition:opacity .3s ease, transform .3s cubic-bezier(.2,1.4,.4,1);white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast b{color:#ffd35a;}

  @media(max-width:620px){
    .brand p{display:none}
    .stat{min-width:78px;padding:6px 10px}
    .stat .num{font-size:20px}
    .hint{font-size:11px}
    .btn{padding:10px 14px;font-size:14px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="20" cy="16" r="9" fill="#f2a86b"/><circle cx="44" cy="16" r="9" fill="#f2a86b"/>
      <circle cx="20" cy="16" r="4.5" fill="#f7cfa6"/><circle cx="44" cy="16" r="4.5" fill="#f7cfa6"/>
      <ellipse cx="32" cy="36" rx="21" ry="19" fill="#f2a86b"/>
      <ellipse cx="32" cy="44" rx="13" ry="12" fill="#ffe3c4"/>
      <circle cx="24" cy="33" r="3.4" fill="#3a2a22"/><circle cx="40" cy="33" r="3.4" fill="#3a2a22"/>
      <circle cx="25.4" cy="31.6" r="1.1" fill="#fff"/><circle cx="41.4" cy="31.6" r="1.1" fill="#fff"/>
      <ellipse cx="32" cy="40" rx="2.6" ry="2" fill="#ef8f6a"/>
      <path d="M32 42 v3 M32 45 l-3 2 M32 45 l3 2" stroke="#3a2a22" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>Hamster <b>Playground</b></h1>
      <p>low-poly &amp; very round</p>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="num" id="sHam">0</div><div class="lbl">hamsters</div></div>
    <div class="stat"><div class="num" id="sSpin">0</div><div class="lbl">wheel spins</div></div>
    <div class="stat bites"><div class="num" id="sBite">0</div><div class="lbl">snacks eaten</div></div>
  </div>
</div>

<div class="hud dock">
  <div class="hint">Drag to orbit · scroll to zoom · click a <b>hamster</b> to poke it</div>
  <div class="controls">
    <button class="btn primary" id="feed">🥕 Feed</button>
    <button class="btn" id="scatter">🌰 Scatter</button>
    <button class="btn" id="reset">↺ Reset</button>
    <div class="toggle" id="auto"><span class="sw"></span><span>Auto-orbit</span></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================ helpers ============================ */
const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function dampAngle(cur,target,lambda,dt){let d=((target-cur+Math.PI)%(2*Math.PI))-Math.PI;return cur+d*(1-Math.exp(-lambda*dt));}
function easeOutBack(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}

/* ============================ palette ============================ */
const FURS=[
  {body:0xf2a86b,belly:0xffe3c4,ear:0xef8f6a},
  {body:0xe7d3b8,belly:0xfff6ea,ear:0xd8b48f},
  {body:0x9aa6b6,belly:0xe9eef4,ear:0x7d8aa0},
  {body:0xf2c14e,belly:0xffedb0,ear:0xe0a52e},
  {body:0xcbb39a,belly:0xf4e7d6,ear:0xb39a80},
  {body:0xf6d9c4,belly:0xfff2e8,ear:0xe7b494},
];
const EYE=0x3a2a22, NOSE=0xef8f6a;

/* ============================ renderer / scene ============================ */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;

const scene=new THREE.Scene();
scene.background=makeBg();
scene.fog=new THREE.Fog(0xffd9c6,24,52);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
camera.position.set(13,11,14);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.enablePan=false;
controls.minDistance=8; controls.maxDistance=32;
controls.minPolarAngle=0.2; controls.maxPolarAngle=1.45;
controls.target.set(0,1.5,0);
controls.autoRotateSpeed=0.7;

/* ============================ lights ============================ */
scene.add(new THREE.HemisphereLight(0xfff0dd,0xffb391,0.9));
const sun=new THREE.DirectionalLight(0xfff1da,1.35);
sun.position.set(9,15,7); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1; sun.shadow.camera.far=50;
const S=14; Object.assign(sun.shadow.camera,{left:-S,right:S,top:S,bottom:-S});
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
scene.add(sun);
const fill=new THREE.DirectionalLight(0xffd0c0,0.35); fill.position.set(-8,6,-6); scene.add(fill);

/* ============================ materials ============================ */
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0},o));
const wood =std(0xc58a58);
const woodDark=std(0xa9744a);
const tray =std(0xffd9a0);
const sand =std(0xf6d59a);
const sand2=std(0xf0c884);
const glassMat=new THREE.MeshPhysicalMaterial({color:0xbfe6f2,transparent:true,opacity:0.14,roughness:0.05,metalness:0,side:THREE.DoubleSide,depthWrite:false});
const metal =std(0xdfe4ea,{metalness:0.7,roughness:0.35});
const bowlMat=std(0xff6f61,{roughness:0.5});
const bowlIn =std(0xff9a8f,{roughness:0.5});
const grass  =std(0x7fc24a);
const leaf   =std(0x6cb843);

/* ============================ geometry cache ============================ */
const G={
  sphere:(r,d=10)=>new THREE.SphereGeometry(r,d,d),
  box:(w,h,d)=>new THREE.BoxGeometry(w,h,d),
  cyl:(rt,rb,h,s=10)=>new THREE.CylinderGeometry(rt,rb,h,s),
  cone:(r,h,s=8)=>new THREE.ConeGeometry(r,h,s),
};
function mesh(geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);return m;}

/* ============================ cage / room ============================ */
const WALL={x:5.5,z:5.5,h:3.2};
const FLOOR_MIN={x:-WALL.x+0.25,z:-WALL.z+0.25};
const FLOOR_MAX={x: WALL.x-0.25,z: WALL.z-0.25};

// floor tray
scene.add(mesh(G.box(WALL.x*2+0.4,0.5,WALL.z*2+0.4),tray,0,-0.25,0));
const sandTop=mesh(G.box(WALL.x*2-0.2,0.2,WALL.z*2-0.2),sand,0,0.1,0);
sandTop.receiveShadow=true; scene.add(sandTop);
// sand texture dots
for(let i=0;i<40;i++){
  const d=mesh(G.cyl(0.05,0.07,0.06,6),i%2?sand:sand2,rand(FLOOR_MIN.x,FLOOR_MAX.x),0.21,rand(FLOOR_MIN.z,FLOOR_MAX.z));
  scene.add(d);
}
// baseboard
scene.add(mesh(G.box(WALL.x*2+0.4,0.3,WALL.z*2+0.4),woodDark,0,0.05,0));

// back + left walls
const wallGeo=G.box(0.2,WALL.h,WALL.z*2);
const wBack=mesh(wallGeo,wood,0,WALL.h/2+0.2,-WALL.z); wBack.receiveShadow=true; scene.add(wBack);
const wLeft=mesh(G.box(WALL.z*2,WALL.h,0.2),wood,-WALL.x,WALL.h/2+0.2,0); wLeft.receiveShadow=true; scene.add(wLeft);
// top frame
scene.add(mesh(G.box(WALL.x*2+0.4,0.25,WALL.z*2+0.4),wood,0,WALL.h+0.2,0));
// corner posts
[[-WALL.x,WALL.z],[WALL.x,WALL.z],[-WALL.x,-WALL.z],[WALL.x,-WALL.z]].forEach(([x,z])=>{
  scene.add(mesh(G.box(0.28,WALL.h+0.4,0.28),woodDark,x,(WALL.h+0.4)/2+0.1,z));
});
// front glass panes
const paneR=mesh(G.box(WALL.x*2,WALL.h,0.05),glassMat,0,WALL.h/2+0.2,WALL.z);
const paneL=mesh(G.box(0.05,WALL.h,WALL.z*2),glassMat,WALL.x,WALL.h/2+0.2,0);
paneR.renderOrder=2; paneL.renderOrder=2;
scene.add(paneR,paneL);

/* ---- wheel ---- */
const wheel=new THREE.Group();
const R=1.05;
const rim=new THREE.Mesh(new THREE.TorusGeometry(R,0.09,10,28),metal);
const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.5,10),metal); hub.rotation.x=Math.PI/2;
wheel.add(rim,hub);
for(let i=0;i<14;i++){
  const sp=mesh(G.cyl(0.035,0.035,R-0.05,6),metal);
  const ang=i/14*Math.PI*2;
  sp.position.set(Math.cos(ang)*(R/2),Math.sin(ang)*(R/2),0);
  sp.rotation.z=ang;
  sp.rotation.x=Math.PI/2;
  wheel.add(sp);
}
wheel.traverse(o=>{if(o.isMesh)o.castShadow=true;});
const wheelStand=new THREE.Group();
wheelStand.add(
  mesh(G.cyl(0.12,0.12,0.5,8),woodDark,0,0.25,-0.55),
  mesh(G.cyl(0.12,0.12,0.5,8),woodDark,0,0.25, 0.55),
  mesh(G.box(0.2,0.2,1.3),woodDark,0,0.5,0),
  mesh(G.cyl(0.1,0.1,0.35,8),woodDark,0,0.75,0)
);
wheel.position.y=R+0.35;
wheelStand.add(wheel);
wheelStand.position.set(-WALL.x+1.5,0.2,0);
wheelStand.traverse(o=>{if(o.isMesh)o.castShadow=true;});
scene.add(wheelStand);
let wheelVel=0, wheelSpins=0, lastWheelTurn=0;

/* ---- tunnel ---- */
const tunnel=new THREE.Group();
const tubeMat=std(0xff8fb3,{side:THREE.DoubleSide});
const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,2.4,12,1,true),tubeMat);
tube.rotation.x=Math.PI/2; tunnel.add(tube);
const capMat=std(0xff6f9c);
[-1.2,1.2].forEach(z=>{const c=new THREE.Mesh(new THREE.RingGeometry(0.4,0.58,12),capMat);c.position.z=z;tunnel.add(c);});
tunnel.traverse(o=>{if(o.isMesh)o.castShadow=true;});
tunnel.position.set(3.0,0.75,-2.8);
tunnel.rotation.y=-0.5;
scene.add(tunnel);

/* ---- food bowl ---- */
const bowlPos=new THREE.Vector3(2.6,0,3.0);
const bowl=new THREE.Group();
const bowlBase=mesh(G.cyl(0.55,0.42,0.28,14),bowlMat,0,0.14,0);
const bowlInner=mesh(G.cyl(0.46,0.4,0.1,14),bowlIn,0,0.28,0);
bowl.add(bowlBase,bowlInner);
bowl.traverse(o=>{if(o.isMesh)o.castShadow=true;});
bowl.position.copy(bowlPos); scene.add(bowl);

/* ---- hay pile ---- */
const hay=new THREE.Group();
for(let i=0;i<26;i++){
  const s=rand(0.05,0.12);
  const straw=mesh(G.cone(s,s*rand(3,5),5),std(i%3?0xd9b25a:0xe7c46a));
  straw.position.set(rand(-0.7,0.7),rand(0,0.3),rand(-0.5,0.5));
  straw.rotation.set(rand(-1,1),rand(0,6),rand(-1,1));
  hay.add(straw);
}
hay.traverse(o=>{if(o.isMesh)o.castShadow=true;});
hay.position.set(-3.2,0.2,3.2); scene.add(hay);

/* ---- grass tufts (decor) ---- */
for(let i=0;i<7;i++){
  const g=new THREE.Group();
  for(let j=0;j<5;j++){
    const bl=mesh(G.cone(0.05,rand(0.3,0.55),5),j%2?grass:leaf);
    bl.position.set(rand(-0.12,0.12),0.2,rand(-0.12,0.12));
    bl.rotation.set(rand(-0.4,0.4),0,rand(-0.4,0.4));
    g.add(bl);
  }
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  g.position.set(rand(FLOOR_MIN.x+0.5,FLOOR_MAX.x-0.5),0.2,rand(FLOOR_MIN.z+0.5,FLOOR_MAX.z-0.5));
  scene.add(g);
}

/* ---- floating dust motes ---- */
const moteCount=90;
const moteGeo=new THREE.BufferGeometry();
const motePos=new Float32Array(moteCount*3), moteVel=[];
for(let i=0;i<moteCount;i++){
  motePos[i*3]=rand(-WALL.x,WALL.x); motePos[i*3+1]=rand(0.3,WALL.h); motePos[i*3+2]=rand(-WALL.z,WALL.z);
  moteVel.push({x:rand(-0.05,0.05),y:rand(0.02,0.08),z:rand(-0.05,0.05)});
}
moteGeo.setAttribute('position',new THREE.BufferAttribute(motePos,3));
const motes=new THREE.Points(moteGeo,new THREE.PointsMaterial({color:0xfff2df,size:0.06,transparent:true,opacity:0.7,depthWrite:false}));
scene.add(motes);

/* ============================ hamsters ============================ */
function buildHamster(fur){
  const root=new THREE.Group();
  const bodyMat=std(fur.body,{flatShading:true});
  const bellyMat=std(fur.belly,{flatShading:true});
  const earMat=std(fur.ear,{flatShading:true});

  const body=mesh(G.sphere(0.5,10),bodyMat); body.scale.set(1.15,0.9,1.3); body.position.y=0.5;
  const belly=mesh(G.sphere(0.42,10),bellyMat); belly.scale.set(1.05,0.8,1.1); belly.position.set(0,0.42,0.18);
  const head=mesh(G.sphere(0.34,10),bodyMat); head.position.set(0,0.62,0.42);
  const snout=mesh(G.sphere(0.18,8),bellyMat); snout.position.set(0,0.56,0.72);
  const nose=mesh(G.sphere(0.05,8),std(NOSE)); nose.position.set(0,0.58,0.88);
  const eyeGeo=G.sphere(0.055,8), eyeMat=std(EYE), glintMat=std(0xffffff);
  const eL=mesh(eyeGeo,eyeMat,-0.14,0.72,0.66), eR=mesh(eyeGeo,eyeMat,0.14,0.72,0.66);
  const gL=mesh(G.sphere(0.02,6),glintMat,-0.15,0.74,0.71), gR=mesh(G.sphere(0.02,6),glintMat,0.15,0.74,0.71);
  const earGeo=G.sphere(0.14,8);
  const earL=mesh(earGeo,earMat,-0.2,0.9,0.28), earR=mesh(earGeo,earMat,0.2,0.9,0.28);
  const tail=mesh(G.sphere(0.08,8),bodyMat); tail.position.set(0,0.45,-0.62);
  const legGeo=G.sphere(0.11,8), armGeo=G.sphere(0.09,8);
  const fL=mesh(legGeo,bodyMat,-0.2,0.16,0.3), fR=mesh(legGeo,bodyMat,0.2,0.16,0.3);
  const bL=mesh(legGeo,bodyMat,-0.2,0.16,-0.3), bR=mesh(legGeo,bodyMat,0.2,0.16,-0.3);
  const aL=mesh(armGeo,bellyMat,-0.28,0.34,0.34), aR=mesh(armGeo,bellyMat,0.28,0.34,0.34);

  root.add(body,belly,head,snout,nose,eL,eR,gL,gR,earL,earR,tail,fL,fR,bL,bR,aL,aR);
  root.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  return {root,body,head,fL,fR,bL,bR,aL,aR};
}

class Hamster{
  constructor(){
    const fur=pick(FURS);
    const parts=buildHamster(fur);
    this.parts=parts; this.root=parts.root;
    this.pos=new THREE.Vector3(rand(FLOOR_MIN.x+0.6,FLOOR_MAX.x-0.6),0,rand(FLOOR_MIN.z+0.6,FLOOR_MAX.z-0.6));
    this.heading=rand(0,Math.PI*2);
    this.speed=0; this.state='wander'; this.timer=rand(0.4,1.6);
    this.walkPhase=rand(0,6); this.wobble=rand(0,6); this.excite=0;
    this.target=null; this.biteTimer=0; this.eatTimer=0;
    this.bobAmp=0; this.bobFreq=rand(6,9);
    this._dir=new THREE.Vector3(); this._t=new THREE.Vector3();
    this._to=new THREE.Vector3(); this._tmp=new THREE.Vector3();
    this._q=new THREE.Quaternion(); this._sq=new THREE.Quaternion();
    this.root.position.copy(this.pos);
    scene.add(this.root);
  }
  setTarget(p){this.target=p.clone();this.state='go';this.timer=10;this.excite=Math.max(this.excite,0.6);}
  poke(){
    this.excite=1; this.state='wander'; this.timer=rand(0.3,0.8);
    this.heading+=rand(0.6,1.4)*(Math.random()<0.5?-1:1);
  }
  update(dt,t){
    this.excite=Math.max(0,this.excite-dt*1.2);
    const speedMul=1+this.excite*0.9;
    switch(this.state){
      case 'wander':
        this.timer-=dt;
        if(this.timer<=0){this.state='pause';this.timer=rand(0.6,2.2);}
        break;
      case 'pause':
        this.timer-=dt;
        if(this.timer<=0){this.state='wander';this.timer=rand(1,3);
          if(Math.random()<0.22)this.decideActivity();}
        break;
      case 'go':
        this._to.subVectors(this.target,this.pos); this._to.y=0;
        if(this._to.lengthSq()<0.14){this.arrive();break;}
        this.heading=dampAngle(this.heading,Math.atan2(this._to.x,this._to.z),6,dt);
        break;
    }
    let want=0;
    if(this.state==='wander'||this.state==='go') want=1;
    this.speed+=(want-this.speed)*Math.min(1,dt*6);
    const sp=this.speed*1.6*speedMul;
    this._dir.set(Math.sin(this.heading),0,Math.cos(this.heading));
    this.pos.addScaledVector(this._dir,sp*dt);
    this.pos.x=clamp(this.pos.x,FLOOR_MIN.x+0.4,FLOOR_MAX.x-0.4);
    this.pos.z=clamp(this.pos.z,FLOOR_MIN.z+0.4,FLOOR_MAX.z-0.4);
    this.root.position.set(this.pos.x,0,this.pos.z);
    this._q.setFromAxisAngle(_UP,this.heading);
    this.root.quaternion.slerp(this._q,Math.min(1,dt*8));
    if(sp>0.05){
      this.walkPhase+=dt*sp*4;
      const s=Math.sin(this.walkPhase)*0.22;
      this.parts.fL.position.y=0.16+Math.max(0,s); this.parts.fR.position.y=0.16+Math.max(0,-s);
      this.parts.bL.position.y=0.16+Math.max(0,-s); this.parts.bR.position.y=0.16+Math.max(0,s);
      this.parts.aL.position.y=0.34+Math.max(0,s)*0.6; this.parts.aR.position.y=0.34+Math.max(0,-s)*0.6;
    }else{
      [this.parts.fL,this.parts.fR,this.parts.bL,this.parts.bR].forEach(l=>l.position.y=0.16);
      [this.parts.aL,this.parts.aR].forEach(l=>l.position.y=0.34);
    }
    const breathe=1+Math.sin(t*this.bobFreq+this.wobble)*0.03;
    this.parts.body.scale.set(1.15*breathe,0.9,1.3);
    this.bobAmp=lerp(this.bobAmp,sp*0.06,Math.min(1,dt*6));
    this.root.position.y=Math.abs(Math.sin(this.walkPhase))*this.bobAmp;
    this.root.rotation.z=Math.sin(t*1.5+this.wobble)*0.03;
    this.root.rotation.x=Math.sin(t*2+this.wobble)*0.02;
  }
  decideActivity(){
    const r=Math.random();
    if(r<0.4) this.setTarget(bowlPos);
    else if(r<0.7) this.setTarget(wheelStand.position);
    else if(r<0.88) this.setTarget(tunnel.position);
    else {this.state='pause';this.timer=rand(1,2);}
  }
  arrive(){
    if(this.target.distanceTo(bowlPos)<0.5){this.state='eat';this.timer=rand(1.6,2.6);this.biteTimer=0;this.eatTimer=0;}
    else if(this.target.distanceTo(wheelStand.position)<0.6){this.state='wheel';this.timer=rand(2.2,3.6);this.biteTimer=0;}
    else if(this.target.distanceTo(tunnel.position)<0.7){this.state='tunnel';this.timer=rand(1.6,2.8);this.biteTimer=0;}
    else {this.state='wander';this.timer=rand(1,2.5);}
  }
}
const _UP=new THREE.Vector3(0,1,0);

const hamsters=[];
const HAM_COUNT=5;
for(let i=0;i<HAM_COUNT;i++) hamsters.push(new Hamster());
document.getElementById('sHam').textContent=HAM_COUNT;

/* ============================ pellets ============================ */
const pellets=[];
const pelGeo=G.sphere(0.09,8), pelMat=std(0xd98a3a);
function spawnPellet(x,z){
  const m=new THREE.Mesh(pelGeo,pelMat); m.castShadow=true;
  m.position.set(x,0.28,z); scene.add(m);
  pellets.push({mesh:m,life:12,phase:rand(0,6)});
}
function scatterPellets(n){
  for(let i=0;i<n;i++){
    const px=rand(FLOOR_MIN.x+0.8,FLOOR_MAX.x-0.8), pz=rand(FLOOR_MIN.z+0.8,FLOOR_MAX.z-0.8);
    spawnPellet(px,pz);
    const near=hamsters.filter(h=>h.state==='wander'||h.state==='pause');
    if(near.length){const h=pick(near);h.setTarget(new THREE.Vector3(px,0,pz));}
  }
}

/* ============================ stats / toast ============================ */
let snacks=0, spinsShown=0;
const toastEl=document.getElementById('toast');
let toastT;
function toast(html){
  toastEl.innerHTML=html; toastEl.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1900);
}
const sSpin=document.getElementById('sSpin'), sBite=document.getElementById('sBite');

/* ============================ interaction ============================ */
const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
let downX=0,downY=0,downT=0;
canvas.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;downT=performance.now();});
canvas.addEventListener('pointerup',e=>{
  if(performance.now()-downT>260||Math.hypot(e.clientX-downX,e.clientY-downY)>7)return;
  pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(hamsters.map(h=>h.root),true);
  if(hits.length){
    const o=hits[0].object; let h=null;
    while(o){if(hamsters.includes(o))h=o;o=o.parent;}
    if(h){h.poke();toast('boop! 🐹');}
  }
});

/* buttons */
document.getElementById('feed').onclick=()=>{
  const n=randInt(4,7);
  for(let i=0;i<n;i++)spawnPellet(bowlPos.x+rand(-1.2,1.2),bowlPos.z+rand(-1.2,1.2));
  hamsters.forEach(h=>{if((h.state==='wander'||h.state==='pause')&&Math.random()<0.7)h.setTarget(bowlPos);});
  toast('Crunch time! 🥕');
};
document.getElementById('scatter').onclick=()=>{scatterPellets(randInt(5,9));toast('Snack scatter! 🌰');};
document.getElementById('reset').onclick=()=>{
  hamsters.forEach(h=>{h.pos.set(rand(FLOOR_MIN.x+0.6,FLOOR_MAX.x-0.6),0,rand(FLOOR_MIN.z+0.6,FLOOR_MAX.z-0.6));h.state='wander';h.timer=rand(0.3,1.5);});
  camera.position.set(13,11,14); controls.target.set(0,1.5,0);
  toast('Fresh start! ↺');
};
const autoBtn=document.getElementById('auto');
autoBtn.onclick=()=>{controls.autoRotate=!controls.autoRotate;autoBtn.classList.toggle('on',controls.autoRotate);};

/* ============================ background ============================ */
function makeBg(){
  const c=document.createElement('canvas');c.width=4;c.height=256;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#ffe6d6');g.addColorStop(0.55,'#ffd0b8');g.addColorStop(1,'#ffbf9c');
  x.fillStyle=g;x.fillRect(0,0,4,256);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

/* ============================ loop ============================ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;

  hamsters.forEach(h=>h.update(dt,t));

  // eating behaviour
  hamsters.forEach(h=>{
    if(h.state==='eat'){
      h.timer-=dt; h.biteTimer-=dt; h.eatTimer-=dt;
      if(h.biteTimer<=0){h.biteTimer=0.5;snacks++;sBite.textContent=snacks;}
      if(h.eatTimer<=0){h.eatTimer=0.6;
        if(pellets.length){const p=pellets.pop();scene.remove(p.mesh);p.mesh.geometry.dispose();}}
      if(h.timer<=0){h.state='wander';h.timer=rand(1,2.5);}
    }else if(h.state==='wheel'){
      h.timer-=dt; h.biteTimer-=dt;
      if(h.biteTimer<=0){h.biteTimer=0.28;wheelVel+=0.55;}
      if(h.timer<=0){h.state='wander';h.timer=rand(1,2.5);}
    }else if(h.state==='tunnel'){
      h.timer-=dt;
      if(h.timer<=0){h.state='wander';h.timer=rand(1,2.5);}
    }
  });

  // wheel physics
  wheelVel*=Math.pow(0.9,dt*60);
  const turn=wheelVel*dt;
  wheel.rotation.y+=turn;
  wheelSpins+=Math.abs(turn)/(Math.PI*2);
  if(wheelSpins-spinsShown>=1){spinsShown=Math.floor(wheelSpins);sSpin.textContent=spinsShown;}

  // pellets bob
  for(const p of pellets){
    p.life-=dt;
    p.mesh.position.y=0.28+Math.sin(t*3+p.phase)*0.03;
    p.mesh.rotation.y+=dt;
  }
  for(let i=pellets.length-1;i>=0;i--){if(pellets[i].life<=0){scene.remove(pellets[i].mesh);pellets.splice(i,1);}}

  // motes drift
  const arr=moteGeo.attributes.position.array;
  for(let i=0;i<moteCount;i++){
    const v=moteVel[i];
    arr[i*3]+=v.x*dt; arr[i*3+1]+=v.y*dt; arr[i*3+2]+=v.z*dt;
    if(arr[i*3+1]>WALL.h){arr[i*3+1]=0.3;arr[i*3]=rand(-WALL.x,WALL.x);arr[i*3+2]=rand(-WALL.z,WALL.z);}
  }
  moteGeo.attributes.position.needsUpdate=true;

  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
