<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #f0e6ff; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
#ui {
  position: absolute; top: 20px; left: 20px;
  background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
  padding: 16px 22px; border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}
#ui h1 { font-size: 18px; color: #5a3e8a; margin-bottom: 6px; }
#ui p { font-size: 13px; color: #7a6a9a; line-height: 1.5; }
</style>
</head>
<body>
<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate • Scroll to zoom<br>Watch them explore!</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- SCENE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8dff5);
scene.fog = new THREE.Fog(0xe8dff5, 20, 40);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7, 6, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 1, 0);
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 4;
controls.maxDistance = 18;

// --- LIGHTING ---
const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.7);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff8f0, 1.2);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.near = 1;
dirLight.shadow.camera.far = 30;
dirLight.shadow.camera.left = -8;
dirLight.shadow.camera.right = 8;
dirLight.shadow.camera.top = 8;
dirLight.shadow.camera.bottom = -8;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xd4c4ff, 0.3);
fillLight.position.set(-3, 4, -3);
scene.add(fillLight);

// --- MATERIALS HELPER ---
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color, flatShading: true, roughness: 0.8, metalness: 0.05, ...opts
  });
}

// --- CAGE ---
const CAGE_W = 8, CAGE_D = 6, CAGE_H = 3.5;

// Floor tray
const trayGeo = new THREE.BoxGeometry(CAGE_W, 0.3, CAGE_D);
const trayMat = mat(0xd4a574);
const tray = new THREE.Mesh(trayGeo, trayMat);
tray.position.y = -0.15;
tray.receiveShadow = true;
scene.add(tray);

// Substrate (bedding)
const beddingGeo = new THREE.BoxGeometry(CAGE_W - 0.2, 0.15, CAGE_D - 0.2);
const beddingMat = mat(0xf5deb3, { roughness: 1 });
const bedding = new THREE.Mesh(beddingGeo, beddingMat);
bedding.position.y = 0.075;
bedding.receiveShadow = true;
scene.add(bedding);

// Cage walls (wireframe style)
function makeWall(w, h, x, y, z, ry) {
  const geo = new THREE.PlaneGeometry(w, h, Math.ceil(w * 2), Math.ceil(h * 2));
  const edges = new THREE.EdgesGeometry(geo);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x888888 }));
  line.position.set(x, y, z);
  line.rotation.y = ry || 0;
  scene.add(line);

  // Glass panel
  const glass = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.08, side: THREE.DoubleSide })
  );
  glass.position.copy(line.position);
  glass.rotation.y = ry || 0;
  scene.add(glass);
}

makeWall(CAGE_W, CAGE_H, 0, CAGE_H / 2, -CAGE_D / 2, 0);
makeWall(CAGE_W, CAGE_H, 0, CAGE_H / 2, CAGE_D / 2, 0);
makeWall(CAGE_D, CAGE_H, -CAGE_W / 2, CAGE_H / 2, 0, Math.PI / 2);
makeWall(CAGE_D, CAGE_H, CAGE_W / 2, CAGE_H / 2, 0, Math.PI / 2);

// Top frame
const frameMat = new THREE.LineBasicMaterial({ color: 0x666666 });
const framePoints = [
  new THREE.Vector3(-CAGE_W/2, CAGE_H, -CAGE_D/2),
  new THREE.Vector3(CAGE_W/2, CAGE_H, -CAGE_D/2),
  new THREE.Vector3(CAGE_W/2, CAGE_H, CAGE_D/2),
  new THREE.Vector3(-CAGE_W/2, CAGE_H, CAGE_D/2),
  new THREE.Vector3(-CAGE_W/2, CAGE_H, -CAGE_D/2)
];
const frameGeo = new THREE.BufferGeometry().setFromPoints(framePoints);
scene.add(new THREE.Line(frameGeo, frameMat));

// Corner posts
const postGeo = new THREE.CylinderGeometry(0.04, 0.04, CAGE_H, 6);
const postMat = mat(0x555555);
[[-CAGE_W/2, -CAGE_D/2], [CAGE_W/2, -CAGE_D/2], [CAGE_W/2, CAGE_D/2], [-CAGE_W/2, CAGE_D/2]].forEach(([x, z]) => {
  const post = new THREE.Mesh(postGeo, postMat);
  post.position.set(x, CAGE_H / 2, z);
  scene.add(post);
});

// --- RUNNING WHEEL ---
const wheelGroup = new THREE.Group();
const wheelRadius = 0.8;
const wheelTorus = new THREE.Mesh(
  new THREE.TorusGeometry(wheelRadius, 0.06, 6, 12),
  mat(0xffffff, { roughness: 0.3 })
);
wheelTorus.castShadow = true;
wheelGroup.add(wheelTorus);

// Spokes
for (let i = 0; i < 6; i++) {
  const angle = (i / 6) * Math.PI * 2;
  const spoke = new THREE.Mesh(
    new THREE.CylinderGeometry(0.02, 0.02, wheelRadius * 2, 4),
    mat(0xdddddd)
  );
  spoke.position.set(0, 0, 0);
  spoke.rotation.z = angle;
  spoke.scale.z = 0.5;
  wheelGroup.add(spoke);
}

// Hub
const hub = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 4), mat(0xffcc00));
wheelGroup.add(hub);

// Stand
const standGeo = new THREE.CylinderGeometry(0.05, 0.08, 0.6, 6);
const standMat = mat(0x888888);
const standL = new THREE.Mesh(standGeo, standMat);
standL.position.set(0, -wheelRadius - 0.1, -0.4);
const standR = new THREE.Mesh(standGeo, standMat);
standR.position.set(0, -wheelRadius - 0.1, 0.4);
const axleBar = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8, 6), standMat);
axleBar.rotation.x = Math.PI / 2;
axleBar.position.set(0, -wheelRadius - 0.1, 0);
wheelGroup.add(standL, standR, axleBar);

wheelGroup.position.set(2.8, wheelRadius + 0.6, -1.5);
wheelGroup.rotation.y = Math.PI / 2;
scene.add(wheelGroup);

let wheelSpeed = 0;
let wheelTarget = 0;

// --- FOOD BOWL ---
const bowlGroup = new THREE.Group();
const bowlOuter = new THREE.Mesh(
  new THREE.CylinderGeometry(0.4, 0.3, 0.2, 8),
  mat(0xff6b6b)
);
bowlOuter.castShadow = true;
bowlGroup.add(bowlOuter);

// Food pellets
const pelletMat = mat(0x8B4513);
for (let i = 0; i < 5; i++) {
  const pellet = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 4), pelletMat);
  pellet.position.set(
    (Math.random() - 0.5) * 0.3,
    0.12,
    (Math.random() - 0.5) * 0.3
  );
  bowlGroup.add(pellet);
}

bowlGroup.position.set(-2.5, 0.1, 1.5);
scene.add(bowlGroup);

// --- TUNNEL ---
const tunnelGroup = new THREE.Group();
const tunnelGeo = new THREE.CylinderGeometry(0.35, 0.35, 1.8, 8, 1, true);
const tunnelMat = mat(0x7cfc00, { side: THREE.DoubleSide });
const tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
tunnel.rotation.z = Math.PI / 2;
tunnel.castShadow = true;
tunnelGroup.add(tunnel);

// End caps (openings)
const capGeo = new THREE.TorusGeometry(0.35, 0.04, 6, 8);
const capMat = mat(0x50c878);
const cap1 = new THREE.Mesh(capGeo, capMat);
cap1.position.x = 0.9;
cap1.rotation.y = Math.PI / 2;
const cap2 = cap1.clone();
cap2.position.x = -0.9;
tunnelGroup.add(cap1, cap2);

tunnelGroup.position.set(0, 0.35, 0);
tunnelGroup.rotation.y = 0.3;
scene.add(tunnelGroup);

// --- DECORATIONS ---
// Small plants
function addPlant(x, z, color) {
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.2, 6), mat(0xcc8855));
  pot.position.set(x, 0.1, z);
  pot.castShadow = true;
  scene.add(pot);

  const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(0.18, 0), mat(color));
  leaf.position.set(x, 0.35, z);
  leaf.castShadow = true;
  scene.add(leaf);
}
addPlant(-3.2, -2, 0x44bb44);
addPlant(3.2, 2, 0x66dd66);
addPlant(-1, -2.2, 0x33aa55);

// Scattered seeds
const seedMat = mat(0xffaa33);
for (let i = 0; i < 8; i++) {
  const seed = new THREE.Mesh(new THREE.SphereGeometry(0.04, 4, 3), seedMat);
  seed.position.set((Math.random()-0.5)*6, 0.17, (Math.random()-0.5)*4);
  scene.add(seed);
}

// --- HAMSTER FACTORY ---
const hamsterColors = [
  { body: 0xf5a623, belly: 0xfff5e0, ear: 0xffcc88 },
  { body: 0xd4a574, belly: 0xf5e6d0, ear: 0xe8c090 },
  { body: 0xb8a0d4, belly: 0xf0e8ff, ear: 0xd0b8e8 },
  { body: 0xff8866, belly: 0xffe0d0, ear: 0xffaa88 },
];

function createHamster(colorScheme) {
  const group = new THREE.Group();
  const { body, belly, ear } = colorScheme;

  // Body
  const bodyGeo = new THREE.SphereGeometry(0.25, 7, 5);
  bodyGeo.scale(1.3, 0.9, 1);
  const bodyMesh = new THREE.Mesh(bodyGeo, mat(body));
  bodyMesh.castShadow = true;
  group.add(bodyMesh);

  // Belly
  const bellyGeo = new THREE.SphereGeometry(0.18, 6, 4);
  bellyGeo.scale(1.1, 0.7, 0.8);
  const bellyMesh = new THREE.Mesh(bellyGeo, mat(belly));
  bellyMesh.position.set(0, -0.08, 0.05);
  group.add(bellyMesh);

  // Head
  const headGeo = new THREE.SphereGeometry(0.18, 6, 5);
  const headMesh = new THREE.Mesh(headGeo, mat(body));
  headMesh.position.set(0.3, 0.05, 0);
  headMesh.castShadow = true;
  group.add(headMesh);

  // Snout
  const snoutGeo = new THREE.SphereGeometry(0.08, 5, 4);
  snoutGeo.scale(1.2, 0.8, 0.9);
  const snoutMesh = new THREE.Mesh(snoutGeo, mat(belly));
  snoutMesh.position.set(0.45, 0.02, 0);
  group.add(snoutMesh);

  // Nose
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.03, 4, 3), mat(0xff6688));
  nose.position.set(0.53, 0.03, 0);
  group.add(nose);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.035, 4, 3);
  const eyeMat = mat(0x222222, { roughness: 0.2 });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  eyeL.position.set(0.38, 0.1, 0.1);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  eyeR.position.set(0.38, 0.1, -0.1);
  group.add(eyeL, eyeR);

  // Eye highlights
  const hlGeo = new THREE.SphereGeometry(0.012, 3, 2);
  const hlMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const hlL = new THREE.Mesh(hlGeo, hlMat);
  hlL.position.set(0.4, 0.12, 0.11);
  const hlR = new THREE.Mesh(hlGeo, hlMat);
  hlR.position.set(0.4, 0.12, -0.09);
  group.add(hlL, hlR);

  // Ears
  const earGeo = new THREE.ConeGeometry(0.06, 0.1, 5);
  const earMat = mat(ear);
  const earL = new THREE.Mesh(earGeo, earMat);
  earL.position.set(0.25, 0.2, 0.12);
  earL.rotation.z = -0.3;
  const earR = new THREE.Mesh(earGeo, earMat);
  earR.position.set(0.25, 0.2, -0.12);
  earR.rotation.z = 0.3;
  group.add(earL, earR);

  // Cheeks (fluffy)
  const cheekGeo = new THREE.SphereGeometry(0.06, 4, 3);
  const cheekMat = mat(belly);
  const cheekL = new THREE.Mesh(cheekGeo, cheekMat);
  cheekL.position.set(0.35, -0.02, 0.15);
  const cheekR = new THREE.Mesh(cheekGeo, cheekMat);
  cheekR.position.set(0.35, -0.02, -0.15);
  group.add(cheekL, cheekR);

  // Feet
  const footGeo = new THREE.SphereGeometry(0.04, 4, 3);
  const footMat = mat(0xffccaa);
  [[0.15, -0.2, 0.1], [0.15, -0.2, -0.1], [-0.15, -0.2, 0.1], [-0.15, -0.2, -0.1]].forEach(pos => {
    const foot = new THREE.Mesh(footGeo, footMat);
    foot.position.set(...pos);
    group.add(foot);
  });

  // Tail
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.1, 4), mat(body));
  tail.position.set(-0.35, 0, 0);
  tail.rotation.z = Math.PI / 2;
  group.add(tail);

  return group;
}

// --- HAMSTER AI ---
const WHEEL_POS = new THREE.Vector3(2.8, 0, -1.5);
const FOOD_POS = new THREE.Vector3(-2.5, 0, 1.5);
const TUNNEL_POS = new THREE.Vector3(0, 0, 0);

const STATES = { WANDER: 0, PAUSE: 1, GO_WHEEL: 2, GO_FOOD: 3, AT_WHEEL: 4, EATING: 5 };

class Hamster {
  constructor(index) {
    this.mesh = createHamster(hamsterColors[index % hamsterColors.length]);
    this.mesh.position.set(
      (Math.random() - 0.5) * 5,
      0.25,
      (Math.random() - 0.5) * 3.5
    );
    this.mesh.rotation.y = Math.random() * Math.PI * 2;
    scene.add(this.mesh);

    this.state = STATES.WANDER;
    this.stateTimer = Math.random() * 2;
    this.speed = 0.8 + Math.random() * 0.4;
    this.targetAngle = Math.random() * Math.PI * 2;
    this.walkPhase = 0;
    this.bobAmount = 0;
  }

  update(dt) {
    this.stateTimer -= dt;

    switch (this.state) {
      case STATES.WANDER:
        this.mesh.position.x += Math.cos(this.targetAngle) * this.speed * dt;
        this.mesh.position.z += Math.sin(this.targetAngle) * this.speed * dt;
        this.mesh.rotation.y = this.targetAngle + Math.PI / 2;
        this.walkPhase += dt * 10;
        this.bobAmount = Math.sin(this.walkPhase) * 0.03;
        this.mesh.position.y = 0.25 + this.bobAmount;

        if (this.stateTimer <= 0) {
          this.state = STATES.PAUSE;
          this.stateTimer = 1 + Math.random() * 2;
        }
        break;

      case STATES.PAUSE:
        this.bobAmount *= 0.9;
        this.mesh.position.y = 0.25 + this.bobAmount;
        // Look around
        this.mesh.rotation.y += Math.sin(this.stateTimer * 3) * dt * 0.5;

        if (this.stateTimer <= 0) {
          const r = Math.random();
          if (r < 0.25) {
            this.state = STATES.GO_WHEEL;
            this.targetAngle = Math.atan2(WHEEL_POS.z - this.mesh.position.z, WHEEL_POS.x - this.mesh.position.x);
          } else if (r < 0.45) {
            this.state = STATES.GO_FOOD;
            this.targetAngle = Math.atan2(FOOD_POS.z - this.mesh.position.z, FOOD_POS.x - this.mesh.position.x);
          } else {
            this.state = STATES.WANDER;
            this.targetAngle = Math.random() * Math.PI * 2;
            this.stateTimer = 2 + Math.random() * 3;
          }
        }
        break;

      case STATES.GO_WHEEL:
        this.moveTowards(WHEEL_POS, dt);
        const distW = this.mesh.position.distanceTo(WHEEL_POS);
        if (distW < 0.8) {
          this.state = STATES.AT_WHEEL;
          this.stateTimer = 3 + Math.random() * 3;
          wheelTarget = 4 + Math.random() * 3;
        }
        break;

      case STATES.AT_WHEEL:
        // Bob up and down (running in place)
        this.walkPhase += dt * 15;
        this.mesh.position.y = 0.25 + Math.abs(Math.sin(this.walkPhase)) * 0.08;
        this.mesh.rotation.y = Math.PI / 2; // face wheel
        if (this.stateTimer <= 0) {
          this.state = STATES.WANDER;
          this.targetAngle = Math.random() * Math.PI * 2;
          this.stateTimer = 2 + Math.random() * 3;
          wheelTarget = 0;
        }
        break;

      case STATES.GO_FOOD:
        this.moveTowards(FOOD_POS, dt);
        const distF = this.mesh.position.distanceTo(FOOD_POS);
        if (distF < 0.6) {
          this.state = STATES.EATING;
          this.stateTimer = 2 + Math.random() * 2;
        }
        break;

      case STATES.EATING:
        this.mesh.rotation.y = Math.atan2(FOOD_POS.x - this.mesh.position.x, FOOD_POS.z - this.mesh.position.z) + Math.PI / 2;
        // Chewing animation
        this.mesh.position.y = 0.25 + Math.sin(this.stateTimer * 8) * 0.02;
        this.mesh.scale.x = 1 + Math.sin(this.stateTimer * 10) * 0.03;
        this.mesh.scale.z = 1 + Math.sin(this.stateTimer * 10) * 0.03;
        if (this.stateTimer <= 0) {
          this.mesh.scale.set(1, 1, 1);
          this.state = STATES.WANDER;
          this.targetAngle = Math.random() * Math.PI * 2;
          this.stateTimer = 2 + Math.random() * 3;
        }
        break;
    }

    // Boundary clamping
    const bw = CAGE_W / 2 - 0.5;
    const bd = CAGE_D / 2 - 0.5;
    this.mesh.position.x = THREE.MathUtils.clamp(this.mesh.position.x, -bw, bw);
    this.mesh.position.z = THREE.MathUtils.clamp(this.mesh.position.z, -bd, bd);

    // Bounce off walls
    if (Math.abs(this.mesh.position.x) >= bw || Math.abs(this.mesh.position.z) >= bd) {
      this.targetAngle += Math.PI * (0.5 + Math.random());
      this.state = STATES.WANDER;
      this.stateTimer = 2 + Math.random() * 2;
    }
  }

  moveTowards(target, dt) {
    const dx = target.x - this.mesh.position.x;
    const dz = target.z - this.mesh.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist > 0.1) {
      this.targetAngle = Math.atan2(dz, dx);
      this.mesh.position.x += (dx / dist) * this.speed * 1.2 * dt;
      this.mesh.position.z += (dz / dist) * this.speed * 1.2 * dt;
      this.mesh.rotation.y = this.targetAngle + Math.PI / 2;
      this.walkPhase += dt * 12;
      this.mesh.position.y = 0.25 + Math.sin(this.walkPhase) * 0.03;
    }
  }
}

// Create hamsters
const hamsters = [];
for (let i = 0; i < 4; i++) {
  hamsters.push(new Hamster(i));
}

// --- ANIMATION LOOP ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // Update hamsters
  hamsters.forEach(h => h.update(dt));

  // Wheel animation
  wheelSpeed += (wheelTarget - wheelSpeed) * dt * 2;
  wheelGroup.children[0].rotation.x += wheelSpeed * dt;
  // Rotate spokes too
  for (let i = 1; i < 7; i++) {
    if (wheelGroup.children[i]) {
      wheelGroup.children[i].rotation.x += wheelSpeed * dt;
    }
  }

  // Gentle wheel wobble
  wheelGroup.rotation.z = Math.sin(Date.now() * 0.001) * 0.02 * (wheelSpeed / 5);

  // Tunnel gentle pulse
  tunnel.scale.x = 1 + Math.sin(Date.now() * 0.002) * 0.01;

  controls.update();
  renderer.render(scene, camera);
}

animate();

// --- RESIZE ---
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
