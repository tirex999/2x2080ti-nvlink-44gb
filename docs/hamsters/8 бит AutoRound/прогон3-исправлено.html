<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Low-Poly Hamster Playground</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;height:100%}
  #ui{position:absolute;top:16px;left:16px;z-index:10;
      font-family:"Segoe UI",system-ui,sans-serif;color:#5b4636;
      pointer-events:none;user-select:none}
  #ui h1{margin:0;font-size:22px;font-weight:700}
  #ui p{margin:4px 0 0;font-size:13px;opacity:.8}
  #err{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
       font-family:sans-serif;color#c0392b;font-size:18px;text-align:center}
</style>
</head>
<body>
<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &bull; Scroll to zoom &bull; Sit back and watch the little guys</p>
</div>
<div id="err">⚠️ Three.js failed to load.<br/>Check your internet connection and refresh.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(typeof THREE==='undefined'){document.getElementById('err').style.display='block';throw new Error('Three.js not loaded');}

/* ============ SIMPLE ORBIT CONTROLS (inline) ============ */
(function(){
  var canvas=document.querySelector('canvas');
  var dragging=false,px=0,py=0;
  var theta=0.65,phi=0.75,radius=14;
  var target=new THREE.Vector3(0,1.2,0);
  function upd(){
    camera.position.x=target.x+radius*Math.sin(phi)*Math.sin(theta);
    camera.position.y=target.y+radius*Math.cos(phi);
    camera.position.z=target.z+radius*Math.sin(phi)*Math.cos(theta);
    camera.lookAt(target);
  }
  window.addEventListener('mousedown',function(e){dragging=true;px=e.clientX;py=e.clientY;});
  window.addEventListener('mousemove',function(e){
    if(!dragging)return;
    theta-=(e.clientX-px)*0.005;
    phi-=(e.clientY-py)*0.005;
    phi=Math.max(0.15,Math.min(Math.PI*0.49,phi));
    px=e.clientX;py=e.clientY;upd();
  });
  window.addEventListener('mouseup',function(){dragging=false;});
  window.addEventListener('wheel',function(e){
    radius+=e.deltaY*0.012;
    radius=Math.max(5,Math.min(22,radius));upd();
  },{passive:true});
  // touch
  window.addEventListener('touchstart',function(e){if(e.touches.length===1){dragging=true;px=e.touches[0].clientX;py=e.touches[0].clientY;}},{passive:true});
  window.addEventListener('touchmove',function(e){
    if(!dragging||e.touches.length!==1)return;
    theta-=(e.touches[0].clientX-px)*0.005;
    phi-=(e.touches[0].clientY-py)*0.005;
    phi=Math.max(0.15,Math.min(Math.PI*0.49,phi));
    px=e.touches[0].clientX;py=e.touches[0].clientY;upd();
  },{passive:true});
  window.addEventListener('touchend',function(){dragging=false;});
  window.__orbitUpd=upd;
})();

/* ============ SCENE ============ */
var scene=new THREE.Scene();
scene.background=new THREE.Color(0xbfe3ff);
scene.fog=new THREE.Fog(0xbfe3ff,25,45);

var camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// initial camera via orbit helper
window.__orbitUpd();

/* Lights */
scene.add(new THREE.HemisphereLight(0xffffff,0xffd9a0,0.9));
var sun=new THREE.DirectionalLight(0xfff2dd,1.1);
sun.position.set(6,10,5);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-8;sun.shadow.camera.right=8;
sun.shadow.camera.top=8;sun.shadow.camera.bottom=-8;
scene.add(sun);

/* Material helper */
function mat(color,opts){
  var o={color:color,flatShading:true,roughness:0.9};
  if(opts)for(var k in opts)o[k]=opts[k];
  return new THREE.MeshStandardMaterial(o);
}

/* ============ CAGE ============ */
var CW=10,CD=7,CH=3.2;

var table=new THREE.Mesh(new THREE.BoxGeometry(CW+2,0.6,CD+2),mat(0xc98d5f));
table.position.y=-0.9;table.castShadow=table.receiveShadow=true;scene.add(table);
[[-4.6,-2.6],[4.6,-2.6],[-4.6,2.6],[4.6,2.6]].forEach(function(p){
  var leg=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,1.2,6),mat(0xa9714b));
  leg.position.set(p[0],-2,p[1]);leg.castShadow=true;scene.add(leg);
});

var tray=new THREE.Mesh(new THREE.BoxGeometry(CW,0.5,CD),mat(0xe0a96d));
tray.position.y=-0.25;tray.receiveShadow=true;scene.add(tray);

var bedding=new THREE.Mesh(new THREE.BoxGeometry(CW-0.2,0.18,CD-0.2),mat(0xf5e3c0));
bedding.position.y=0.02;bedding.receiveShadow=true;scene.add(bedding);

var glass=new THREE.Mesh(
  new THREE.BoxGeometry(CW,CH,CD),
  new THREE.MeshStandardMaterial({color:0xcdeeff,transparent:true,opacity:0.14,roughness:0.1,metalness:0,side:THREE.DoubleSide,depthWrite:false})
);
glass.position.y=CH/2;scene.add(glass);

var frame=new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(CW,CH,CD)),
  new THREE.LineBasicMaterial({color:0x8fa3ad})
);
frame.position.y=CH/2;scene.add(frame);

var grid=new THREE.GridHelper(Math.max(CW,CD),14,0x8fa3ad,0xb8c9d1);
grid.scale.set(CW/Math.max(CW,CD),1,CD/Math.max(CW,CD));
grid.position.y=CH+0.01;scene.add(grid);

/* ============ WHEEL ============ */
var WHEEL_POS=new THREE.Vector3(-3.2,0,-1.6);
var wheelGroup=new THREE.Group();
var wheelStatic=new THREE.Group();
wheelStatic.position.copy(WHEEL_POS);

var postMat=mat(0x9fb2bd);
[-0.75,0.75].forEach(function(dx){
  var post=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,1.15,6),postMat);
  post.position.set(dx,0.575,0);post.castShadow=true;wheelStatic.add(post);
});
var base=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.15,1.2),postMat);
base.position.y=0.075;base.castShadow=true;wheelStatic.add(base);

var RIM_R=0.95;
var rim=new THREE.Mesh(new THREE.TorusGeometry(RIM_R,0.09,6,14),mat(0xff8fab));
rim.rotation.y=Math.PI/2;rim.castShadow=true;wheelGroup.add(rim);
var hub=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.3,8),mat(0xff8fab));
hub.rotation.z=Math.PI/2;wheelGroup.add(hub);
for(var si=0;si<4;si++){
  var spoke=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,RIM_R*2,5),mat(0xffc2d1));
  spoke.rotation.z=(si/4)*Math.PI;spoke.castShadow=true;wheelGroup.add(spoke);
}
wheelGroup.position.y=1.15;
wheelStatic.add(wheelGroup);
scene.add(wheelStatic);
var wheelSpin=0;

/* ============ FOOD BOWL ============ */
var FOOD_POS=new THREE.Vector3(3.1,0,1.9);
var bowl=new THREE.Group();
var bowlBody=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.4,0.3,10),mat(0x7ec8e3));
bowlBody.position.y=0.15;bowlBody.castShadow=true;bowl.add(bowlBody);
var seedColors=[0xd9a441,0xc0392b,0x8d6e63,0xf6e58d];
for(var si2=0;si2<9;si2++){
  var seed=new THREE.Mesh(new THREE.SphereGeometry(0.07,5,4),mat(seedColors[si2%4]));
  seed.position.set((Math.random()-0.5)*0.55,0.32,(Math.random()-0.5)*0.55);
  bowl.add(seed);
}
bowl.position.copy(FOOD_POS);scene.add(bowl);

/* ============ TUNNEL ============ */
var tunnel=new THREE.Group();
var tunnelMesh=new THREE.Mesh(
  new THREE.CylinderGeometry(0.75,0.75,2.2,10,1,true,0,Math.PI),
  mat(0xb39ddb,{side:THREE.DoubleSide})
);
tunnelMesh.rotation.x=Math.PI/2;tunnel.add(tunnelMesh);
tunnel.rotation.z=Math.PI/2;
tunnel.position.set(1.2,0,-2.2);
tunnel.traverse(function(o){o.castShadow=true;});
scene.add(tunnel);

/* ============ HAY PILE ============ */
var hay=new THREE.Group();
for(var hi=0;hi<14;hi++){
  var blade=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.5+Math.random()*0.35,4),mat(hi%2?0xe6c35c:0xd4a836));
  blade.position.set((Math.random()-0.5)*1.2,0.2,(Math.random()-0.5)*0.9);
  blade.rotation.set((Math.random()-0.5)*0.7,Math.random()*Math.PI,(Math.random()-0.5)*0.7);
  blade.castShadow=true;hay.add(blade);
}
hay.position.set(-3.6,0,2.3);scene.add(hay);

/* Scattered seeds */
for(var si3=0;si3<12;si3++){
  var s=new THREE.Mesh(new THREE.SphereGeometry(0.05,5,4),mat(seedColors[si3%4]));
  s.position.set((Math.random()-0.5)*8,0.1,(Math.random()-0.5)*5.5);
  scene.add(s);
}

/* ============ HAMSTERS ============ */
var LOOKS=[
  {body:0xf2b263,belly:0xffe8c8,name:'Biscuit'},
  {body:0x9aa0a6,belly:0xe8eaed,name:'Mochi'},
  {body:0xf7f3ea,belly:0xffffff,name:'Puff'},
  {body:0xa9714b,belly:0xd9b38c,name:'Cocoa'}
];

function makeHamster(look){
  var g=new THREE.Group();
  var mB=mat(look.body),mBe=mat(look.belly);

  var body=new THREE.Mesh(new THREE.SphereGeometry(0.42,7,5),mB);
  body.scale.set(1.1,0.9,1.3);body.position.y=0.42;body.castShadow=true;g.add(body);

  var belly=new THREE.Mesh(new THREE.SphereGeometry(0.3,6,4),mBe);
  belly.scale.set(1,0.85,1.1);belly.position.set(0,0.34,0.12);g.add(belly);

  var snout=new THREE.Mesh(new THREE.SphereGeometry(0.18,6,4),mB);
  snout.position.set(0,0.42,0.55);g.add(snout);
  var nose=new THREE.Mesh(new THREE.SphereGeometry(0.05,5,4),mat(0xf06292));
  nose.position.set(0,0.44,0.72);g.add(nose);

  [-1,1].forEach(function(sx){
    var eye=new THREE.Mesh(new THREE.SphereGeometry(0.05,5,4),mat(0x2b2b2b));
    eye.position.set(sx*0.18,0.55,0.42);g.add(eye);
    var ear=new THREE.Mesh(new THREE.ConeGeometry(0.11,0.2,5),mB);
    ear.position.set(sx*0.22,0.82,-0.1);ear.rotation.z=-sx*0.3;ear.castShadow=true;g.add(ear);
    var earIn=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.12,5),mat(0xf06292));
    earIn.position.set(sx*0.22,0.8,-0.08);earIn.rotation.z=-sx*0.3;g.add(earIn);
  });

  [[-0.2,0.35],[0.2,0.35],[-0.2,-0.3],[0.2,-0.3]].forEach(function(fp){
    var foot=new THREE.Mesh(new THREE.SphereGeometry(0.08,5,4),mBe);
    foot.scale.set(1,0.6,1.4);foot.position.set(fp[0],0.08,fp[1]);g.add(foot);
  });

  var tail=new THREE.Mesh(new THREE.SphereGeometry(0.07,5,4),mB);
  tail.position.set(0,0.35,-0.58);g.add(tail);

  g.userData.body=body;
  return g;
}

function createHamster(look,pos){
  var grp=makeHamster(look);
  grp.position.copy(pos);
  grp.rotation.y=Math.random()*Math.PI*2;
  scene.add(grp);
  return {group:grp,name:look.name,state:'wander',timer:1+Math.random()*2,
          target:new THREE.Vector3(),speed:1.1+Math.random()*0.4,phase:Math.random()*10};
}

var hamsters=[
  createHamster(LOOKS[0],new THREE.Vector3(-1.5,0,1.0)),
  createHamster(LOOKS[1],new THREE.Vector3(1.8,0,-0.5)),
  createHamster(LOOKS[2],new THREE.Vector3(0.2,0,2.0)),
  createHamster(LOOKS[3],new THREE.Vector3(-2.8,0,-0.2))
];

/* ============ BEHAVIOR ============ */
var BX=CW/2-0.8,BZ=CD/2-0.8;
var WHEEL_SPOT=new THREE.Vector3(WHEEL_POS.x,0,WHEEL_POS.z+1.3);
var WHEEL_FACE=Math.PI;
var FOOD_SPOT=new THREE.Vector3(FOOD_POS.x,0,FOOD_POS.z-1.1);
var FOOD_FACE=0;
var wheelOwner=null;

function rand(a,b){return a+Math.random()*(b-a);}
function randomPoint(){return new THREE.Vector3(rand(-BX,BX),0,rand(-BZ,BZ));}

function pickAction(h){
  var r=Math.random();
  if(r<0.5){h.target=randomPoint();h.state='wander';h.timer=rand(2,5);}
  else if(r<0.65&&!wheelOwner){h.state='toWheel';h.timer=10;}
  else if(r<0.8){h.state='toFood';h.timer=10;}
  else{h.state='pause';h.timer=rand(0.6,2.2);}
}

function angleLerp(a,b,t){
  var d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;
  return a+d*t;
}

function moveToward(h,dest,dt,arrive){
  arrive=arrive||0.25;
  var dx=dest.x-h.group.position.x,dz=dest.z-h.group.position.z;
  var dist=Math.sqrt(dx*dx+dz*dz);
  if(dist<arrive)return true;
  var desired=Math.atan2(dx,dz);
  h.group.rotation.y=angleLerp(h.group.rotation.y,desired,Math.min(1,dt*8));
  var step=Math.min(h.speed*dt,dist);
  h.group.position.x+=(dx/dist)*step;
  h.group.position.z+=(dz/dist)*step;
  h.group.position.x=Math.max(-BX,Math.min(BX,h.group.position.x));
  h.group.position.z=Math.max(-BZ,Math.min(BZ,h.group.position.z));
  return false;
}

function faceAngle(h,angle,dt){
  h.group.rotation.y=angleLerp(h.group.rotation.y,angle,Math.min(1,dt*8));
}

function updateHamster(h,dt,t){
  h.timer-=dt;
  var arrived=false;
  switch(h.state){
    case 'wander':
      arrived=moveToward(h,h.target,dt);
      if(arrived||h.timer<=0){h.state='pause';h.timer=rand(0.4,1.8);}break;
    case 'pause':
      if(h.timer<=0)pickAction(h);break;
    case 'toWheel':
      if(wheelOwner&&wheelOwner!==h){h.state='pause';h.timer=rand(0.5,1.5);break;}
      arrived=moveToward(h,WHEEL_SPOT,dt,0.15);
      if(arrived){wheelOwner=h;h.state='atWheel';h.timer=rand(3,6);}
      else if(h.timer<=0){h.state='pause';h.timer=1;}break;
    case 'atWheel':
      faceAngle(h,WHEEL_FACE,dt);
      h.group.position.copy(WHEEL_SPOT);
      if(h.timer<=0){wheelOwner=null;h.state='pause';h.timer=rand(0.5,1.5);}break;
    case 'toFood':
      arrived=moveToward(h,FOOD_SPOT,dt,0.15);
      if(arrived){h.state='eat';h.timer=rand(2,4.5);}
      else if(h.timer<=0){h.state='pause';h.timer=1;}break;
    case 'eat':
      faceAngle(h,FOOD_FACE,dt);
      if(h.timer<=0){h.state='pause';h.timer=rand(0.3,1);}break;
  }

  var moving=(h.state==='wander'||h.state==='toWheel'||h.state==='toFood')&&!arrived;
  var running=h.state==='atWheel';
  var eating=h.state==='eat';

  var bobY=0;
  if(moving)bobY=Math.abs(Math.sin(t*10+h.phase))*0.06;
  else if(running)bobY=Math.abs(Math.sin(t*16+h.phase))*0.1;
  else if(eating)bobY=Math.abs(Math.sin(t*8+h.phase))*0.04;
  h.group.position.y=bobY;

  var squash=moving?1+Math.sin(t*10+h.phase)*0.05:running?1+Math.sin(t*16+h.phase)*0.08:1;
  h.group.scale.y=squash;
  h.group.scale.x=h.group.scale.z=2-squash;
}

/* ============ MAIN LOOP ============ */
var clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05);
  var t=clock.elapsedTime;

  var targetSpin=wheelOwner?9:0;
  wheelSpin+=(targetSpin-wheelSpin)*Math.min(1,dt*2.5);
  wheelGroup.rotation.x+=wheelSpin*dt;

  for(var i=0;i<hamsters.length;i++)updateHamster(hamsters[i],dt,t);

  renderer.render(scene,camera);
}
animate();

addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
