<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #bfe3ff; }
  #ui {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #5b4636; pointer-events: none; user-select: none;
  }
  #ui h1 { margin: 0; font-size: 22px; font-weight: 700; }
  #ui p  { margin: 4px 0 0; font-size: 13px; opacity: 0.8; }
</style>
</head>
<body>
<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &bull; Scroll to zoom &bull; Sit back and watch the little guys</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   SIMPLE ORBIT CONTROLS (inline, no external dependency)
============================================================ */
class SimpleOrbit {
  constructor(camera, dom) {
    this.camera = camera;
    this.dom = dom;
    this.target = new THREE.Vector3(0, 1.2, 0);
    this.minDist = 5;
    this.maxDist = 22;
    this.maxPolar = Math.PI * 0.49;
    this.damping = 0.08;

    const offset = new THREE.Vector3().subVectors(camera.position, this.target);
    this.sph = new THREE.Spherical().setFromVector3(offset);
    this.thetaVel = 0;
    this.phiVel = 0;

    this.dragging = false;
    this.px = 0; this.py = 0;

    dom.addEventListener('mousedown', e => {
      this.dragging = true;
      this.px = e.clientX; this.py = e.clientY;
    });
    window.addEventListener('mousemove', e => {
      if (!this.dragging) return;
      const dx = e.clientX - this.px;
      const dy = e.clientY - this.py;
      this.px = e.clientX; this.py = e.clientY;
      this.thetaVel -= dx * 0.005;
      this.phiVel   -= dy * 0.005;
    });
    window.addEventListener('mouseup', () => this.dragging = false);

    dom.addEventListener('wheel', e => {
      e.preventDefault();
      this.sph.radius *= (e.deltaY > 0) ? 1.06 : 0.94;
      this.sph.radius = Math.max(this.minDist, Math.min(this.maxDist, this.sph.radius));
    }, { passive: false });

    // Touch support
    dom.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        this.dragging = true;
        this.px = e.touches[0].clientX;
        this.py = e.touches[0].clientY;
      }
    }, { passive: true });
    dom.addEventListener('touchmove', e => {
      if (!this.dragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - this.px;
      const dy = e.touches[0].clientY - this.py;
      this.px = e.touches[0].clientX;
      this.py = e.touches[0].clientY;
      this.thetaVel -= dx * 0.005;
      this.phiVel   -= dy * 0.005;
    }, { passive: true });
    dom.addEventListener('touchend', () => this.dragging = false);
  }

  update() {
    this.sph.theta += this.thetaVel;
    this.sph.phi   += this.phiVel;
    this.sph.phi = Math.max(0.05, Math.min(this.maxPolar, this.sph.phi));

    const offset = new THREE.Vector3().setFromSpherical(this.sph);
    this.camera.position.copy(this.target).add(offset);
    this.camera.lookAt(this.target);

    this.thetaVel *= (1 - this.damping);
    this.phiVel   *= (1 - this.damping);
  }
}

/* ============================================================
   BASIC SETUP
============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3ff);
scene.fog = new THREE.Fog(0xbfe3ff, 25, 45);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8, 6.5, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new SimpleOrbit(camera, renderer.domElement);

/* Lights */
scene.add(new THREE.HemisphereLight(0xffffff, 0xffd9a0, 0.9));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.1);
sun.position.set(6, 10, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;   sun.shadow.camera.bottom = -8;
scene.add(sun);

/* Helper materials */
const mat = (color, opts = {}) =>
  new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.9, ...opts });

/* ============================================================
   CAGE
============================================================ */
const CAGE = { w: 10, d: 7, h: 3.2 };

// Table
const table = new THREE.Mesh(new THREE.BoxGeometry(CAGE.w + 2, 0.6, CAGE.d + 2), mat(0xc98d5f));
table.position.y = -0.9;
table.castShadow = table.receiveShadow = true;
scene.add(table);
for (const [lx, lz] of [[-4.6, -2.6], [4.6, -2.6], [-4.6, 2.6], [4.6, 2.6]]) {
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 1.2, 6), mat(0xa9714b));
  leg.position.set(lx, -2, lz);
  leg.castShadow = true;
  scene.add(leg);
}

// Wooden tray
const tray = new THREE.Mesh(new THREE.BoxGeometry(CAGE.w, 0.5, CAGE.d), mat(0xe0a96d));
tray.position.y = -0.25;
tray.receiveShadow = true;
scene.add(tray);

// Bedding
const bedding = new THREE.Mesh(new THREE.BoxGeometry(CAGE.w - 0.2, 0.18, CAGE.d - 0.2), mat(0xf5e3c0));
bedding.position.y = 0.02;
bedding.receiveShadow = true;
scene.add(bedding);

// Glass walls
const glass = new THREE.Mesh(
  new THREE.BoxGeometry(CAGE.w, CAGE.h, CAGE.d),
  new THREE.MeshStandardMaterial({
    color: 0xcdeeff, transparent: true, opacity: 0.14,
    roughness: 0.1, metalness: 0, side: THREE.DoubleSide, depthWrite: false
  })
);
glass.position.y = CAGE.h / 2;
scene.add(glass);

// Frame edges
const frame = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(CAGE.w, CAGE.h, CAGE.d)),
  new THREE.LineBasicMaterial({ color: 0x8fa3ad })
);
frame.position.y = CAGE.h / 2;
scene.add(frame);

// Top grid
const grid = new THREE.GridHelper(Math.max(CAGE.w, CAGE.d), 14, 0x8fa3ad, 0xb8c9d1);
grid.scale.set(CAGE.w / Math.max(CAGE.w, CAGE.d), 1, CAGE.d / Math.max(CAGE.w, CAGE.d));
grid.position.y = CAGE.h + 0.01;
scene.add(grid);

/* ============================================================
   INTERACTIVE OBJECTS
============================================================ */
// --- Running wheel ---
const WHEEL_POS = new THREE.Vector3(-3.2, 0, -1.6);
const wheelGroup = new THREE.Group();
const wheelStatic = new THREE.Group();
wheelStatic.position.copy(WHEEL_POS);

const postMat = mat(0x9fb2bd);
for (const dx of [-0.75, 0.75]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.15, 6), postMat);
  post.position.set(dx, 0.575, 0);
  post.castShadow = true;
  wheelStatic.add(post);
}
const base = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.15, 1.2), postMat);
base.position.y = 0.075;
base.castShadow = true;
wheelStatic.add(base);

const RIM_R = 0.95;
const rim = new THREE.Mesh(new THREE.TorusGeometry(RIM_R, 0.09, 6, 14), mat(0xff8fab));
rim.rotation.y = Math.PI / 2;
rim.castShadow = true;
wheelGroup.add(rim);
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.3, 8), mat(0xff8fab));
hub.rotation.z = Math.PI / 2;
wheelGroup.add(hub);
for (let i = 0; i < 4; i++) {
  const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, RIM_R * 2, 5), mat(0xffc2d1));
  spoke.rotation.z = (i / 4) * Math.PI;
  spoke.castShadow = true;
  wheelGroup.add(spoke);
}
wheelGroup.position.y = 1.15;
wheelStatic.add(wheelGroup);
scene.add(wheelStatic);

let wheelSpin = 0;

// --- Food bowl ---
const FOOD_POS = new THREE.Vector3(3.1, 0, 1.9);
const bowl = new THREE.Group();
const bowlBody = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.4, 0.3, 10), mat(0x7ec8e3));
bowlBody.position.y = 0.15;
bowlBody.castShadow = true;
bowl.add(bowlBody);
const seedColors = [0xd9a441, 0xc0392b, 0x8d6e63, 0xf6e58d];
for (let i = 0; i < 9; i++) {
  const seed = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 4), mat(seedColors[i % 4]));
  seed.position.set((Math.random() - 0.5) * 0.55, 0.32, (Math.random() - 0.5) * 0.55);
  bowl.add(seed);
}
bowl.position.copy(FOOD_POS);
scene.add(bowl);

// --- Tunnel ---
const tunnel = new THREE.Group();
const tunnelMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(0.75, 0.75, 2.2, 10, 1, true, 0, Math.PI),
  mat(0xb39ddb, { side: THREE.DoubleSide })
);
tunnelMesh.rotation.x = Math.PI / 2;
tunnel.add(tunnelMesh);
tunnel.rotation.z = Math.PI / 2;
tunnel.position.set(1.2, 0, -2.2);
tunnel.traverse(o => o.castShadow = true);
scene.add(tunnel);

// --- Hay pile ---
const hay = new THREE.Group();
for (let i = 0; i < 14; i++) {
  const blade = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.5 + Math.random() * 0.35, 4),
    mat(i % 2 ? 0xe6c35c : 0xd4a836));
  blade.position.set((Math.random() - 0.5) * 1.2, 0.2, (Math.random() - 0.5) * 0.9);
  blade.rotation.set((Math.random() - 0.5) * 0.7, Math.random() * Math.PI, (Math.random() - 0.5) * 0.7);
  blade.castShadow = true;
  hay.add(blade);
}
hay.position.set(-3.6, 0, 2.3);
scene.add(hay);

// Scattered seeds
for (let i = 0; i < 12; i++) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.05, 5, 4), mat(seedColors[i % 4]));
  s.position.set((Math.random() - 0.5) * 8, 0.1, (Math.random() - 0.5) * 5.5);
  scene.add(s);
}

/* ============================================================
   HAMSTERS
============================================================ */
const HAMSTER_LOOKS = [
  { body: 0xf2b263, belly: 0xffe8c8, name: 'Biscuit' },
  { body: 0x9aa0a6, belly: 0xe8eaed, name: 'Mochi'   },
  { body: 0xf7f3ea, belly: 0xffffff, name: 'Puff'    },
  { body: 0xa9714b, belly: 0xd9b38c, name: 'Cocoa'   },
];

function makeHamster(look) {
  const g = new THREE.Group();
  const mBody = mat(look.body);
  const mBelly = mat(look.belly);

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 7, 5), mBody);
  body.scale.set(1.1, 0.9, 1.3);
  body.position.y = 0.42;
  body.castShadow = true;
  g.add(body);

  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.3, 6, 4), mBelly);
  belly.scale.set(1, 0.85, 1.1);
  belly.position.set(0, 0.34, 0.12);
  g.add(belly);

  const snout = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 4), mBody);
  snout.position.set(0, 0.42, 0.55);
  g.add(snout);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 5, 4), mat(0xf06292));
  nose.position.set(0, 0.44, 0.72);
  g.add(nose);

  for (const sx of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 5, 4), mat(0x2b2b2b));
    eye.position.set(sx * 0.18, 0.55, 0.42);
    g.add(eye);
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.2, 5), mBody);
    ear.position.set(sx * 0.22, 0.82, -0.1);
    ear.rotation.z = -sx * 0.3;
    ear.castShadow = true;
    g.add(ear);
    const earIn = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.12, 5), mat(0xf06292));
    earIn.position.set(sx * 0.22, 0.8, -0.08);
    earIn.rotation.z = -sx * 0.3;
    g.add(earIn);
  }

  for (const [fx, fz] of [[-0.2, 0.35], [0.2, 0.35], [-0.2, -0.3], [0.2, -0.3]]) {
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.08, 5, 4), mBelly);
    foot.scale.set(1, 0.6, 1.4);
    foot.position.set(fx, 0.08, fz);
    g.add(foot);
  }

  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 4), mBody);
  tail.position.set(0, 0.35, -0.58);
  g.add(tail);

  g.userData.body = body;
  return g;
}

function createHamster(look, pos) {
  const group = makeHamster(look);
  group.position.copy(pos);
  group.rotation.y = Math.random() * Math.PI * 2;
  scene.add(group);
  return {
    group,
    name: look.name,
    state: 'wander',
    timer: 1 + Math.random() * 2,
    target: new THREE.Vector3(),
    speed: 1.1 + Math.random() * 0.4,
    phase: Math.random() * 10,
  };
}

const hamsters = [
  createHamster(HAMSTER_LOOKS[0], new THREE.Vector3(-1.5, 0,  1.0)),
  createHamster(HAMSTER_LOOKS[1], new THREE.Vector3( 1.8, 0, -0.5)),
  createHamster(HAMSTER_LOOKS[2], new THREE.Vector3( 0.2, 0,  2.0)),
  createHamster(HAMSTER_LOOKS[3], new THREE.Vector3(-2.8, 0, -0.2)),
];

/* ============================================================
   BEHAVIOR
============================================================ */
const BOUNDS = { x: CAGE.w / 2 - 0.8, z: CAGE.d / 2 - 0.8 };
const WHEEL_SPOT = new THREE.Vector3(WHEEL_POS.x, 0, WHEEL_POS.z + 1.3);
const WHEEL_FACE = Math.PI;
const FOOD_SPOT  = new THREE.Vector3(FOOD_POS.x, 0, FOOD_POS.z - 1.1);
const FOOD_FACE  = 0;

let wheelOwner = null;

const rand = (a, b) => a + Math.random() * (b - a);

function randomPoint() {
  return new THREE.Vector3(rand(-BOUNDS.x, BOUNDS.x), 0, rand(-BOUNDS.z, BOUNDS.z));
}

function pickAction(h) {
  const roll = Math.random();
  if (roll < 0.5) {
    h.target = randomPoint();
    h.state = 'wander';
    h.timer = rand(2, 5);
  } else if (roll < 0.65 && !wheelOwner) {
    h.state = 'toWheel';
    h.timer = 10;
  } else if (roll < 0.8) {
    h.state = 'toFood';
    h.timer = 10;
  } else {
    h.state = 'pause';
    h.timer = rand(0.6, 2.2);
  }
}

function angleLerp(a, b, t) {
  const d = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  return a + d * t;
}

function moveToward(h, dest, dt, arriveDist = 0.25) {
  const dx = dest.x - h.group.position.x;
  const dz = dest.z - h.group.position.z;
  const dist = Math.hypot(dx, dz);
  if (dist < arriveDist) return true;

  const desired = Math.atan2(dx, dz);
  h.group.rotation.y = angleLerp(h.group.rotation.y, desired, Math.min(1, dt * 8));

  const step = Math.min(h.speed * dt, dist);
  h.group.position.x += (dx / dist) * step;
  h.group.position.z += (dz / dist) * step;

  h.group.position.x = THREE.MathUtils.clamp(h.group.position.x, -BOUNDS.x, BOUNDS.x);
  h.group.position.z = THREE.MathUtils.clamp(h.group.position.z, -BOUNDS.z, BOUNDS.z);
  return false;
}

function faceAngle(h, angle, dt) {
  h.group.rotation.y = angleLerp(h.group.rotation.y, angle, Math.min(1, dt * 8));
}

function updateHamster(h, dt, t) {
  h.timer -= dt;
  const arrived = false;

  switch (h.state) {
    case 'wander':
      if (moveToward(h, h.target, dt) || h.timer <= 0) { h.state = 'pause'; h.timer = rand(0.4, 1.8); }
      break;

    case 'pause':
      if (h.timer <= 0) pickAction(h);
      break;

    case 'toWheel':
      if (wheelOwner && wheelOwner !== h) { h.state = 'pause'; h.timer = rand(0.5, 1.5); break; }
      if (moveToward(h, WHEEL_SPOT, dt, 0.15)) {
        wheelOwner = h;
        h.state = 'atWheel';
        h.timer = rand(3, 6);
      } else if (h.timer <= 0) {
        h.state = 'pause'; h.timer = 1;
      }
      break;

    case 'atWheel':
      faceAngle(h, WHEEL_FACE, dt);
      h.group.position.copy(WHEEL_SPOT);
      if (h.timer <= 0) {
        wheelOwner = null;
        h.state = 'pause'; h.timer = rand(0.5, 1.5);
      }
      break;

    case 'toFood':
      if (moveToward(h, FOOD_SPOT, dt, 0.15)) { h.state = 'eat'; h.timer = rand(2, 4.5); }
      else if (h.timer <= 0) { h.state = 'pause'; h.timer = 1; }
      break;

    case 'eat':
      faceAngle(h, FOOD_FACE, dt);
      if (h.timer <= 0) { h.state = 'pause'; h.timer = rand(0.3, 1); }
      break;
  }

  const moving = (h.state === 'wander' || h.state === 'toWheel' || h.state === 'toFood');
  const running = h.state === 'atWheel';
  const eating  = h.state === 'eat';

  let bobY = 0;
  if (moving)       bobY = Math.abs(Math.sin(t * 10 + h.phase)) * 0.06;
  else if (running) bobY = Math.abs(Math.sin(t * 16 + h.phase)) * 0.1;
  else if (eating)  bobY = Math.abs(Math.sin(t * 8  + h.phase)) * 0.04;
  h.group.position.y = bobY;

  const squash = moving ? 1 + Math.sin(t * 10 + h.phase) * 0.05
               : running ? 1 + Math.sin(t * 16 + h.phase) * 0.08
               : 1;
  h.group.scale.y = squash;
  h.group.scale.x = h.group.scale.z = 2 - squash;
}

/* ============================================================
   MAIN LOOP
============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  const targetSpin = wheelOwner ? 9 : 0;
  wheelSpin += (targetSpin - wheelSpin) * Math.min(1, dt * 2.5);
  wheelGroup.rotation.x += wheelSpin * dt;

  for (const h of hamsters) updateHamster(h, dt, t);

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
