<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Poly Hamster Playground</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #fff; background: rgba(0,0,0,0.6);
            padding: 15px 20px; border-radius: 12px;
            font-size: 14px; pointer-events: none;
            backdrop-filter: blur(5px);
        }
        #ui h1 { font-size: 18px; margin-bottom: 5px; color: #ffb347; }
        #ui p { opacity: 0.8; font-size: 12px; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>🐹 Hamster Playground</h1>
        <p>Drag to rotate • Scroll to zoom</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    // ============================================================
    // SCENE SETUP
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 30, 60);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(8, 7, 10);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // ============================================================
    // LIGHTING
    // ============================================================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 30;
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x88ccff, 0.3);
    fillLight.position.set(-5, 3, -5);
    scene.add(fillLight);

    // ============================================================
    // MATERIALS
    // ============================================================
    const mat = {
        floor: new THREE.MeshLambertMaterial({ color: 0xf5e6d3 }),
        tray: new THREE.MeshLambertMaterial({ color: 0xe8d5b7 }),
        cage: new THREE.MeshLambertMaterial({ color: 0x888888 }),
        cageTop: new THREE.MeshLambertMaterial({ color: 0x666666 }),
        wheel: new THREE.MeshLambertMaterial({ color: 0xff6b6b }),
        wheelSpokes: new THREE.MeshLambertMaterial({ color: 0xff8e8e }),
        bowl: new THREE.MeshLambertMaterial({ color: 0x4ecdc4 }),
        food: new THREE.MeshLambertMaterial({ color: 0xd4a574 }),
        tunnel: new THREE.MeshLambertMaterial({ color: 0x95e1d3 }),
        wood: new THREE.MeshLambertMaterial({ color: 0xc4956a }),
        bedding: new THREE.MeshLambertMaterial({ color: 0xf0e0c0 }),
    };

    // ============================================================
    // FLOOR & TRAY
    // ============================================================
    const groundGeo = new THREE.PlaneGeometry(40, 40);
    const ground = new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({ color: 0x90c695 }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    // Tray
    const trayGeo = new THREE.BoxGeometry(7, 0.6, 5);
    const tray = new THREE.Mesh(trayGeo, mat.tray);
    tray.position.y = 0.3;
    tray.receiveShadow = true;
    tray.castShadow = true;
    scene.add(tray);

    // Tray inner (bedding)
    const beddingGeo = new THREE.BoxGeometry(6.4, 0.1, 4.4);
    const bedding = new THREE.Mesh(beddingGeo, mat.bedding);
    bedding.position.y = 0.65;
    bedding.receiveShadow = true;
    scene.add(bedding);

    // Tray walls
    function createWall(w, h, d, x, y, z) {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat.tray);
        wall.position.set(x, y, z);
        wall.castShadow = true;
        scene.add(wall);
    }
    createWall(7, 0.8, 0.3, 0, 1.0, 2.35);
    createWall(7, 0.8, 0.3, 0, 1.0, -2.35);
    createWall(0.3, 0.8, 5, 3.35, 1.0, 0);
    createWall(0.3, 0.8, 5, -3.35, 1.0, 0);

    // ============================================================
    // CAGE BARS
    // ============================================================
    const cageGroup = new THREE.Group();
    const barGeo = new THREE.CylinderGeometry(0.04, 0.04, 4, 6);
    const barCount = 14;

    for (let i = 0; i < barCount; i++) {
        const bar = new THREE.Mesh(barGeo, mat.cage);
        const x = -3 + (6 / (barCount - 1)) * i;
        bar.position.set(x, 3.4, 2.5);
        bar.castShadow = true;
        cageGroup.add(bar);

        const bar2 = bar.clone();
        bar2.position.z = -2.5;
        cageGroup.add(bar2);
    }

    const sideBarCount = 10;
    for (let i = 0; i < sideBarCount; i++) {
        const bar = new THREE.Mesh(barGeo, mat.cage);
        const z = -2 + (4 / (sideBarCount - 1)) * i;
        bar.position.set(3.5, 3.4, z);
        bar.castShadow = true;
        cageGroup.add(bar);

        const bar2 = bar.clone();
        bar2.position.x = -3.5;
        cageGroup.add(bar2);
    }

    // Top frame
    const topFrame = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.15, 5.2), mat.cageTop);
    topFrame.position.y = 5.4;
    topFrame.castShadow = true;
    cageGroup.add(topFrame);

    // Top bars
    for (let i = 0; i < 10; i++) {
        const tb = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 5, 6), mat.cage);
        tb.rotation.x = Math.PI / 2;
        tb.position.set(-3 + (6 / 9) * i, 5.4, 0);
        cageGroup.add(tb);
    }
    for (let i = 0; i < 8; i++) {
        const tb = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 7, 6), mat.cage);
        tb.rotation.z = Math.PI / 2;
        tb.position.set(0, 5.4, -2 + (4 / 7) * i);
        cageGroup.add(tb);
    }

    scene.add(cageGroup);

    // ============================================================
    // HAMSTER WHEEL
    // ============================================================
    const wheelGroup = new THREE.Group();
    const wheelRadius = 1.2;

    // Outer ring
    const torusGeo = new THREE.TorusGeometry(wheelRadius, 0.08, 8, 16);
    const torus = new THREE.Mesh(torusGeo, mat.wheel);
    torus.castShadow = true;
    wheelGroup.add(torus);

    // Inner ring
    const innerTorus = new THREE.Mesh(new THREE.TorusGeometry(wheelRadius * 0.7, 0.05, 8, 12), mat.wheelSpokes);
    wheelGroup.add(innerTorus);

    // Spokes
    for (let i = 0; i < 8; i++) {
        const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, wheelRadius * 2, 4), mat.wheelSpokes);
        spoke.rotation.z = (Math.PI / 8) * i;
        wheelGroup.add(spoke);
    }

    // Axle
    const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.4, 8), mat.cage);
    axle.rotation.x = Math.PI / 2;
    wheelGroup.add(axle);

    // Stand
    const standGeo = new THREE.BoxGeometry(0.15, 1.5, 0.15);
    const stand1 = new THREE.Mesh(standGeo, mat.cage);
    stand1.position.set(0, -0.75, 0.25);
    wheelGroup.add(stand1);
    const stand2 = stand1.clone();
    stand2.position.z = -0.25;
    wheelGroup.add(stand2);

    wheelGroup.position.set(-2.2, 2.1, 0);
    scene.add(wheelGroup);

    // ============================================================
    // FOOD BOWL
    // ============================================================
    const bowlGroup = new THREE.Group();
    const bowlGeo = new THREE.CylinderGeometry(0.4, 0.25, 0.3, 8);
    const bowl = new THREE.Mesh(bowlGeo, mat.bowl);
    bowl.castShadow = true;
    bowlGroup.add(bowl);

    // Food pieces
    for (let i = 0; i < 5; i++) {
        const foodPiece = new THREE.Mesh(new THREE.SphereGeometry(0.08, 4, 4), mat.food);
        foodPiece.position.set(
            (Math.random() - 0.5) * 0.3,
            0.15,
            (Math.random() - 0.5) * 0.3
        );
        bowlGroup.add(foodPiece);
    }
    bowlGroup.position.set(1.5, 0.8, 1.2);
    scene.add(bowlGroup);

    // ============================================================
    // TUNNEL
    // ============================================================
    const tunnelGroup = new THREE.Group();
    const tunnelGeo = new THREE.CylinderGeometry(0.45, 0.45, 1.8, 8, 1, true);
    const tunnel = new THREE.Mesh(tunnelGeo, new THREE.MeshLambertMaterial({
        color: 0x95e1d3, side: THREE.DoubleSide
    }));
    tunnel.rotation.z = Math.PI / 2;
    tunnel.castShadow = true;
    tunnelGroup.add(tunnel);

    // Tunnel rings
    for (let i = -1; i <= 1; i++) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.47, 0.04, 6, 12), mat.tunnel);
        ring.position.x = i * 0.6;
        ring.rotation.y = Math.PI / 2;
        tunnelGroup.add(ring);
    }
    tunnelGroup.position.set(0.5, 1.05, -1.2);
    scene.add(tunnelGroup);

    // ============================================================
    // WOODEN BLOCK (toy)
    // ============================================================
    const blockGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
    const block = new THREE.Mesh(blockGeo, mat.wood);
    block.position.set(2.0, 0.9, -0.8);
    block.rotation.y = 0.5;
    block.castShadow = true;
    scene.add(block);

    // ============================================================
    // HAMSTER FACTORY
    // ============================================================
    function createHamster(color, x, z) {
        const hamster = new THREE.Group();
        const bodyMat = new THREE.MeshLambertMaterial({ color: color });
        const bellyMat = new THREE.MeshLambertMaterial({ color: 0xffeedd });
        const eyeMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
        const noseMat = new THREE.MeshLambertMaterial({ color: 0xff8899 });
        const earInnerMat = new THREE.MeshLambertMaterial({ color: 0xffaaaa });

        // Body
        const bodyGeo = new THREE.SphereGeometry(0.28, 6, 5);
        bodyGeo.scale(1, 0.85, 1.2);
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.28;
        body.castShadow = true;
        hamster.add(body);

        // Belly
        const bellyGeo = new THREE.SphereGeometry(0.2, 5, 4);
        bellyGeo.scale(0.8, 0.7, 0.9);
        const belly = new THREE.Mesh(bellyGeo, bellyMat);
        belly.position.set(0, 0.2, 0.08);
        hamster.add(belly);

        // Head
        const headGeo = new THREE.SphereGeometry(0.18, 6, 5);
        const head = new THREE.Mesh(headGeo, bodyMat);
        head.position.set(0, 0.38, 0.22);
        head.castShadow = true;
        hamster.add(head);

        // Cheeks (puffy!)
        const cheekGeo = new THREE.SphereGeometry(0.1, 5, 4);
        const cheekL = new THREE.Mesh(cheekGeo, bodyMat);
        cheekL.position.set(0.12, 0.32, 0.3);
        hamster.add(cheekL);
        const cheekR = cheekL.clone();
        cheekR.position.x = -0.12;
        hamster.add(cheekR);

        // Eyes
        const eyeGeo = new THREE.SphereGeometry(0.035, 5, 4);
        const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeL.position.set(0.08, 0.42, 0.35);
        hamster.add(eyeL);
        const eyeR = eyeL.clone();
        eyeR.position.x = -0.08;
        hamster.add(eyeR);

        // Eye shine
        const shineGeo = new THREE.SphereGeometry(0.015, 4, 4);
        const shineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const shineL = new THREE.Mesh(shineGeo, shineMat);
        shineL.position.set(0.09, 0.435, 0.37);
        hamster.add(shineL);
        const shineR = shineL.clone();
        shineR.position.x = -0.07;
        hamster.add(shineR);

        // Nose
        const noseGeo = new THREE.SphereGeometry(0.03, 4, 4);
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.position.set(0, 0.37, 0.4);
        hamster.add(nose);

        // Ears
        const earGeo = new THREE.SphereGeometry(0.07, 5, 4);
        earGeo.scale(1, 1, 0.5);
        const earL = new THREE.Mesh(earGeo, bodyMat);
        earL.position.set(0.1, 0.52, 0.15);
        hamster.add(earL);
        const earR = earL.clone();
        earR.position.x = -0.1;
        hamster.add(earR);

        // Ear inner
        const earInnerGeo = new THREE.SphereGeometry(0.04, 4, 4);
        earInnerGeo.scale(1, 1, 0.3);
        const earInnerL = new THREE.Mesh(earInnerGeo, earInnerMat);
        earInnerL.position.set(0.1, 0.52, 0.18);
        hamster.add(earInnerL);
        const earInnerR = earInnerL.clone();
        earInnerR.position.x = -0.1;
        hamster.add(earInnerR);

        // Legs
        const legGeo = new THREE.CylinderGeometry(0.04, 0.035, 0.12, 5);
        const legPositions = [
            [0.12, 0.06, 0.15], [-0.12, 0.06, 0.15],
            [0.12, 0.06, -0.15], [-0.12, 0.06, -0.15]
        ];
        const legs = [];
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(legGeo, bodyMat);
            leg.position.set(...pos);
            hamster.add(leg);
            legs.push(leg);
        });

        // Tail
        const tailGeo = new THREE.SphereGeometry(0.05, 4, 4);
        tailGeo.scale(1, 1, 0.6);
        const tail = new THREE.Mesh(tailGeo, bodyMat);
        tail.position.set(0, 0.25, -0.32);
        hamster.add(tail);

        hamster.position.set(x, 0.7, z);
        scene.add(hamster);

        return { group: hamster, legs, body, head, tail, state: 'idle', timer: 0, targetAngle: Math.random() * Math.PI * 2, speed: 0.02 + Math.random() * 0.015 };
    }

    // Create hamsters with different colors
    const hamsters = [
        createHamster(0xf4a460, -1, 0.5),   // Sandy
        createHamster(0xdeb887, 1, -0.5),   // Burlywood
        createHamster(0xffcc99, 0, 1.5),    // Cream
        createHamster(0xd2691e, -0.5, -1.5), // Chocolate
        createHamster(0xfff8dc, 2, 0),      // Cornsilk (white)
    ];

    // ============================================================
    // BEDDING PARTICLES (small scattered bits)
    // ============================================================
    const beddingBits = [];
    for (let i = 0; i < 30; i++) {
        const bitGeo = new THREE.BoxGeometry(
            0.05 + Math.random() * 0.08,
            0.02,
            0.05 + Math.random() * 0.08
        );
        const bitMat = new THREE.MeshLambertMaterial({
            color: new THREE.Color().setHSL(0.1, 0.3 + Math.random() * 0.2, 0.7 + Math.random() * 0.15)
        });
        const bit = new THREE.Mesh(bitGeo, bitMat);
        bit.position.set(
            (Math.random() - 0.5) * 5.5,
            0.72,
            (Math.random() - 0.5) * 3.5
        );
        bit.rotation.y = Math.random() * Math.PI;
        scene.add(bit);
        beddingBits.push(bit);
    }

    // ============================================================
    // ORBIT CONTROLS (manual implementation)
    // ============================================================
    let isDragging = false;
    let previousMouse = { x: 0, y: 0 };
    let spherical = { theta: 0.6, phi: 1.1, radius: 12 };

    function updateCamera() {
        camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
        camera.position.y = spherical.radius * Math.cos(spherical.phi);
        camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
        camera.lookAt(0, 1.5, 0);
    }

    renderer.domElement.addEventListener('mousedown', (e) => {
        isDragging = true;
        previousMouse = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - previousMouse.x;
        const dy = e.clientY - previousMouse.y;
        spherical.theta -= dx * 0.005;
        spherical.phi = Math.max(0.3, Math.min(1.4, spherical.phi + dy * 0.005));
        previousMouse = { x: e.clientX, y: e.clientY };
        updateCamera();
    });

    renderer.domElement.addEventListener('mouseup', () => { isDragging = false; });
    renderer.domElement.addEventListener('mouseleave', () => { isDragging = false; });

    renderer.domElement.addEventListener('wheel', (e) => {
        spherical.radius = Math.max(6, Math.min(20, spherical.radius + e.deltaY * 0.01));
        updateCamera();
    });

    // Touch support
    renderer.domElement.addEventListener('touchstart', (e) => {
        isDragging = true;
        previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });
    renderer.domElement.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const dx = e.touches[0].clientX - previousMouse.x;
        const dy = e.touches[0].clientY - previousMouse.y;
        spherical.theta -= dx * 0.005;
        spherical.phi = Math.max(0.3, Math.min(1.4, spherical.phi + dy * 0.005));
        previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        updateCamera();
    });
    renderer.domElement.addEventListener('touchend', () => { isDragging = false; });

    updateCamera();

    // ============================================================
    // HAMSTER BEHAVIOR
    // ============================================================
    const BOUNDS = { x: 2.8, z: 1.8 };
    const WHEEL_POS = new THREE.Vector3(-2.2, 0.7, 0);
    const BOWL_POS = new THREE.Vector3(1.5, 0.7, 1.2);

    let wheelSpeed = 0;

    function updateHamster(h, time) {
        h.timer -= 1;

        switch (h.state) {
            case 'idle':
                // Bob slightly
                h.group.position.y = 0.7 + Math.sin(time * 3 + h.group.position.x) * 0.02;
                if (h.timer <= 0) {
                    const roll = Math.random();
                    if (roll < 0.4) {
                        h.state = 'walking';
                        h.timer = 60 + Math.random() * 120;
                        h.targetAngle = Math.random() * Math.PI * 2;
                    } else if (roll < 0.6) {
                        h.state = 'wheel';
                        h.timer = 120 + Math.random() * 180;
                    } else if (roll < 0.75) {
                        h.state = 'eating';
                        h.timer = 80 + Math.random() * 60;
                    } else {
                        h.timer = 30 + Math.random() * 60;
                    }
                }
                break;

            case 'walking':
                // Move forward
                const dx = Math.sin(h.group.rotation.y) * h.speed;
                const dz = Math.cos(h.group.rotation.y) * h.speed;
                h.group.position.x += dx;
                h.group.position.z += dz;

                // Leg animation
                h.legs.forEach((leg, i) => {
                    leg.position.y = 0.06 + Math.sin(time * 10 + i * Math.PI) * 0.03;
                });

                // Body bob
                h.group.position.y = 0.7 + Math.abs(Math.sin(time * 8)) * 0.02;

                // Boundary check
                if (Math.abs(h.group.position.x) > BOUNDS.x || Math.abs(h.group.position.z) > BOUNDS.z) {
                    h.targetAngle = Math.atan2(-h.group.position.x, -h.group.position.z);
                }

                // Smooth turn
                let angleDiff = h.targetAngle - h.group.rotation.y;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                h.group.rotation.y += angleDiff * 0.05;

                // Random direction change
                if (Math.random() < 0.01) {
                    h.targetAngle += (Math.random() - 0.5) * 1.5;
                }

                if (h.timer <= 0) {
                    h.state = 'idle';
                    h.timer = 40 + Math.random() * 80;
                    h.legs.forEach(leg => leg.position.y = 0.06);
                }
                break;

            case 'wheel':
                // Move toward wheel
                const toWheel = new THREE.Vector3().subVectors(WHEEL_POS, h.group.position);
                const distToWheel = toWheel.length();

                if (distToWheel > 0.5) {
                    toWheel.normalize();
                    h.group.position.x += toWheel.x * h.speed * 1.5;
                    h.group.position.z += toWheel.z * h.speed * 1.5;
                    h.group.rotation.y = Math.atan2(toWheel.x, toWheel.z);
                    h.legs.forEach((leg, i) => {
                        leg.position.y = 0.06 + Math.sin(time * 12 + i * Math.PI) * 0.04;
                    });
                } else {
                    // Running on wheel!
                    h.group.position.y = 0.7 + Math.sin(time * 15) * 0.03;
                    h.legs.forEach((leg, i) => {
                        leg.position.y = 0.06 + Math.sin(time * 20 + i * Math.PI) * 0.05;
                    });
                    wheelSpeed = Math.min(0.15, wheelSpeed + 0.005);
                }

                if (h.timer <= 0) {
                    h.state = 'idle';
                    h.timer = 30 + Math.random() * 50;
                    h.legs.forEach(leg => leg.position.y = 0.06);
                    h.group.position.x = (Math.random() - 0.5) * 4;
                    h.group.position.z = (Math.random() - 0.5) * 3;
                }
                break;

            case 'eating':
                // Move toward bowl
                const toBowl = new THREE.Vector3().subVectors(BOWL_POS, h.group.position);
                const distToBowl = toBowl.length();

                if (distToBowl > 0.4) {
                    toBowl.normalize();
                    h.group.position.x += toBowl.x * h.speed;
                    h.group.position.z += toBowl.z * h.speed;
                    h.group.rotation.y = Math.atan2(toBowl.x, toBowl.z);
                    h.legs.forEach((leg, i) => {
                        leg.position.y = 0.06 + Math.sin(time * 8 + i * Math.PI) * 0.02;
                    });
                } else {
                    // Eating animation - head bobs
                    h.group.position.y = 0.7 + Math.sin(time * 6) * 0.015;
                    h.head.position.y = 0.38 + Math.sin(time * 8) * 0.02;
                    h.head.position.z = 0.22 + Math.sin(time * 8) * 0.01;
                }

                if (h.timer <= 0) {
                    h.state = 'idle';
                    h.timer = 30 + Math.random() * 40;
                    h.head.position.y = 0.38;
                    h.head.position.z = 0.22;
                    h.legs.forEach(leg => leg.position.y = 0.06);
                }
                break;
        }

        // Keep in bounds
        h.group.position.x = Math.max(-BOUNDS.x, Math.min(BOUNDS.x, h.group.position.x));
        h.group.position.z = Math.max(-BOUNDS.z, Math.min(BOUNDS.z, h.group.position.z));

        // Tail wiggle
        h.tail.position.x = Math.sin(time * 4 + h.group.position.x * 3) * 0.02;
    }

    // ============================================================
    // ANIMATION LOOP
    // ============================================================
    let time = 0;

    function animate() {
        requestAnimationFrame(animate);
        time += 0.016;

        // Update hamsters
        hamsters.forEach(h => updateHamster(h, time));

        // Wheel rotation (driven by hamsters on it)
        wheelSpeed *= 0.98; // friction
        wheelGroup.rotation.z += wheelSpeed;

        // Gentle camera auto-rotate when not dragging
        if (!isDragging) {
            spherical.theta += 0.001;
            updateCamera();
        }

        // Bowl gentle bob
        bowlGroup.position.y = 0.8 + Math.sin(time * 2) * 0.01;

        // Block slow spin
        block.rotation.y += 0.005;

        renderer.render(scene, camera);
    }

    // ============================================================
    // RESIZE
    // ============================================================
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start!
    animate();
    </script>
</body>
</html>
