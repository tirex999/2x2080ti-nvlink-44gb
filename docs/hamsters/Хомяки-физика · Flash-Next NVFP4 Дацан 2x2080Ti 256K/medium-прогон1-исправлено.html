<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Хомяки — честная физика</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a202c;font-family:Arial,sans-serif}
  #ui{position:fixed;left:12px;top:12px;width:230px;background:rgba(15,20,30,.82);
      color:#e8eef7;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5;
      user-select:none;z-index:10}
  #ui h3{margin:0 0 6px;font-size:14px;color:#ffd27a}
  .row{display:flex;align-items:center;gap:7px;margin:3px 0}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid #0008}
  .st{color:#9fd0a0;font-size:12px}
  #phys{position:fixed;left:12px;bottom:12px;background:rgba(15,20,30,.85);color:#cfe3ff;
        border-radius:10px;padding:10px 14px;font:12px/1.6 monospace;z-index:10;white-space:pre}
  #hint{position:fixed;right:12px;top:12px;color:#8fa4c0;font-size:12px;z-index:10}
</style>
</head>
<body>
<div id="ui"><h3>Хомяки сейчас</h3><div id="names"></div></div>
<div id="phys"></div>
<div id="hint">ЛКМ — вращать камеру · клик по хомяку — прыжок</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =====================================================================
   ГАБАРИТЫ ЗВЕРЯ И ПРЕДМЕТОВ (п.1.2): радиус колеса считается ОТ зверя
   ===================================================================== */
const BODY_LEN = 1.5, BODY_H = 0.85, BODY_W = 0.75;   // габарит хомяка
const HR       = 0.45;                                 // радиус тела для столкновений
const STEP_LEN = 0.42;                                 // длина шага (фаза от пути!)
const FLOOR_Y  = 0.06;                                 // поверхность подстилки (локально)

const WHEEL_R   = BODY_H * 2.4;      // внутр. радиус ≈ 2.04 — зверь (0.85) входит с запасом ×2.4
const WHEEL_GAP = BODY_W * 2.2;      // ширина барабана — шире боков в 2.2 раза
console.assert(WHEEL_R > BODY_H*1.8, 'колесо должно быть заметно выше зверя');
console.assert(WHEEL_GAP > BODY_W*1.4, 'зазор между ободами должен быть шире боков');

const TUBE_RT = BODY_H + 0.45;       // внутр. радиус трубы — зверь проходит с запасом
console.assert(TUBE_RT > BODY_H*1.2, 'труба должна быть больше зверя');

/* =====================================================================
   СЦЕНА
   ===================================================================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222a38);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(17, 16, 21);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6.5, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI*0.49;
controls.minDistance = 8; controls.maxDistance = 60;

/* --- свет: направленный (тени 2048) + мягкий фон ------------------- */
const hemi = new THREE.HemisphereLight(0xfff1da, 0x3d4a5c, 0.5); scene.add(hemi);
const dir  = new THREE.DirectionalLight(0xfff4e0, 1.05);
dir.position.set(14, 24, 10);
dir.castShadow = true;
dir.shadow.mapSize.set(2048,2048);
dir.shadow.camera.left=-18; dir.shadow.camera.right=18;
dir.shadow.camera.top=16;   dir.shadow.camera.bottom=-16;
dir.shadow.bias = -0.0005;
scene.add(dir);
const fill = new THREE.DirectionalLight(0xbcd0ff, 0.25);
fill.position.set(-12, 10, -8); scene.add(fill);

/* --- комната: пол, стены, окно -------------------------------------- */
const roomFloor = new THREE.Mesh(new THREE.PlaneGeometry(80,80),
    new THREE.MeshStandardMaterial({color:0x6b4a30, roughness:0.9}));
roomFloor.rotation.x = -Math.PI/2; roomFloor.receiveShadow = true; scene.add(roomFloor);

function wall(w,h,c,x,y,z,ry){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h),
      new THREE.MeshStandardMaterial({color:c, roughness:0.95}));
  m.position.set(x,y,z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m); return m;
}
wall(80,30,0x3a4f68, 0,15,-18, 0);
wall(80,30,0x33455c, -18,15,0, Math.PI/2);
const win = new THREE.Mesh(new THREE.PlaneGeometry(9,7),
    new THREE.MeshStandardMaterial({color:0xbfd8ee, emissive:0x9db8cf, emissiveIntensity:0.8}));
win.position.set(-6,12,-17.9); scene.add(win);

/* --- стол ----------------------------------------------------------- */
const TABLE_Y = 4;
const tableMat = new THREE.MeshStandardMaterial({color:0x8a5a33, roughness:0.7});
const tableTop = new THREE.Mesh(new THREE.BoxGeometry(24,0.8,17), tableMat);
tableTop.position.y = TABLE_Y-0.4; tableTop.castShadow = tableTop.receiveShadow = true; scene.add(tableTop);
for(const sx of [-1,1]) for(const sz of [-1,1]){
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.9, TABLE_Y-0.8, 0.9), tableMat);
  leg.position.set(sx*10.8,(TABLE_Y-0.8)/2, sz*7.4);
  leg.castShadow = true; scene.add(leg);
}

const cage = new THREE.Group(); cage.position.y = TABLE_Y; scene.add(cage);

/* --- поддон --------------------------------------------------------- */
const panMat = new THREE.MeshStandardMaterial({color:0x2e7d8c, roughness:0.55});
const IX=9.0, IZ=6.0;   // внутренняя граница прутьев
const pan = new THREE.Mesh(new THREE.BoxGeometry(2*IX+0.8, 0.35, 2*IZ+0.8), panMat);
pan.position.y = -0.17; pan.receiveShadow = true; cage.add(pan);
function panWall(w,d,x,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,1.2,d), panMat);
  m.position.set(x,0.45,z); m.castShadow=m.receiveShadow=true; cage.add(m);
}
panWall(2*IX+0.8,0.35, 0,-IZ-0.17); panWall(2*IX+0.8,0.35, 0,IZ+0.17);
panWall(0.35,2*IZ+0.8,-IX-0.17,0);  panWall(0.35,2*IZ+0.8, IX+0.17,0);

/* --- прутья: ОДИН InstancedMesh ------------------------------------- */
(function bars(){
  const g = new THREE.CylinderGeometry(0.05,0.05,4.9,6);
  const m = new THREE.MeshStandardMaterial({color:0xc7ccd6, metalness:0.7, roughness:0.35});
  const pts=[];
  for(let x=-IX; x<=IX+0.01; x+=0.55){ pts.push([x,-IZ],[x,IZ]); }
  for(let z=-IZ+0.55; z<=IZ-0.5; z+=0.55){ pts.push([-IX,z],[IX,z]); }
  const im = new THREE.InstancedMesh(g,m,pts.length);
  const d = new THREE.Object3D();
  pts.forEach((p,i)=>{ d.position.set(p[0], 2.9, p[1]); d.updateMatrix(); im.setMatrixAt(i,d.matrix); });
  im.castShadow = true; cage.add(im);
  // рамки по верху и угловые стойки
  const fm = new THREE.MeshStandardMaterial({color:0x9aa3b2, metalness:0.6, roughness:0.4});
  const railX = new THREE.Mesh(new THREE.BoxGeometry(2*IX+0.5,0.14,0.14), fm);
  const r1=railX.clone(); r1.position.set(0,5.4,-IZ-0.05); cage.add(r1);
  const r2=railX.clone(); r2.position.set(0,5.4, IZ+0.05); cage.add(r2);
  const railZ = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.14,2*IZ+0.5), fm);
  const r3=railZ.clone(); r3.position.set(-IX-0.05,5.4,0); cage.add(r3);
  const r4=railZ.clone(); r4.position.set( IX+0.05,5.4,0); cage.add(r4);
  for(const sx of[-1,1])for(const sz of[-1,1]){
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,5,8),fm);
    post.position.set(sx*(IX+0.05),2.9,sz*(IZ+0.05)); cage.add(post);
  }
})();

/* --- подстилка: ОДИН InstancedMesh щепок ---------------------------- */
(function bedding(){
  const g = new THREE.BoxGeometry(0.34,0.05,0.11);
  const m = new THREE.MeshStandardMaterial({color:0xd9b878, roughness:0.95});
  const N = 900, im = new THREE.InstancedMesh(g,m,N), d = new THREE.Object3D();
  const c = new THREE.Color();
  for(let i=0;i<N;i++){
    d.position.set((Math.random()*2-1)*8.5, Math.random()*0.06-0.02, (Math.random()*2-1)*5.5);
    d.rotation.set(Math.random()*0.4, Math.random()*Math.PI, Math.random()*0.4);
    d.scale.setScalar(0.6+Math.random()*0.9);
    d.updateMatrix(); im.setMatrixAt(i,d.matrix);
    c.setHSL(0.09+Math.random()*0.04, 0.45, 0.55+Math.random()*0.2); im.setColorAt(i,c);
  }
  im.receiveShadow = true; cage.add(im);
})();

/* =====================================================================
   КОЛЕСО (п.1.1, 1.2). Ось — горизонтальна, вдоль X.
   ===================================================================== */
const WHEEL = { R: WHEEL_R, omega: 0, user: null, facing: 1,   // facing=+1: зверь смотрит в +Z
                x: 5.6, z: -3.4, cy: WHEEL_R + FLOOR_Y };
WHEEL.runPos  = { x: WHEEL.x, y: FLOOR_Y, z: WHEEL.z };                       // нижняя точка обода
WHEEL.entryPos= { x: WHEEL.x + WHEEL_GAP/2 + 0.95, y: FLOOR_Y, z: WHEEL.z };  // площадка у торца

(function buildWheel(){
  const g = new THREE.Group(); g.position.set(WHEEL.x, WHEEL.cy, WHEEL.z); cage.add(g);
  const spin = new THREE.Group(); g.add(spin); WHEEL.spin = spin;
  const woodM = new THREE.MeshStandardMaterial({color:0xcf9f5f, roughness:0.7, side:THREE.DoubleSide});
  // обод (беговая дорожка)
  const band = new THREE.Mesh(new THREE.CylinderGeometry(WHEEL_R,WHEEL_R,WHEEL_GAP,40,1,true), woodM);
  band.rotation.z = Math.PI/2; band.castShadow = true; spin.add(band);
  // поперечные планки — видно вращение
  const rungG = new THREE.BoxGeometry(WHEEL_GAP*0.92, 0.05, 0.2);
  for(let i=0;i<18;i++){
    const a = i/18*Math.PI*2;
    const r = new THREE.Mesh(rungG, new THREE.MeshStandardMaterial({color:0xb8874a, roughness:0.8}));
    r.position.set(0, Math.cos(a)*(WHEEL_R-0.05), Math.sin(a)*(WHEEL_R-0.05));
    r.rotation.x = -a; spin.add(r);
  }
  // спицы
  const spG = new THREE.BoxGeometry(0.1, WHEEL_R-0.1, 0.12);
  for(let i=0;i<6;i++){
    const a=i/6*Math.PI;
    const s=new THREE.Mesh(spG, woodM);
    s.position.set(0, Math.cos(a)*(WHEEL_R-0.1)/2, Math.sin(a)*(WHEEL_R-0.1)/2);
    s.rotation.x = -a+Math.PI/2; spin.add(s);
  }
  // прозрачные боковины (зверь виден)
  const discM = new THREE.MeshStandardMaterial({color:0xcfe6ff, transparent:true, opacity:0.22, side:THREE.DoubleSide});
  for(const s of [-1,1]){
    const dsc=new THREE.Mesh(new THREE.CylinderGeometry(WHEEL_R,WHEEL_R,0.06,40), discM);
    dsc.rotation.z = Math.PI/2; dsc.position.x = s*(WHEEL_GAP/2+0.05); g.add(dsc);
  }
  // ступица + стойка (не вращаются)
  const metalM = new THREE.MeshStandardMaterial({color:0x8f97a3, metalness:0.6, roughness:0.4});
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,WHEEL_GAP+0.5,12), metalM);
  hub.rotation.z=Math.PI/2; g.add(hub);
  const standM = new THREE.MeshStandardMaterial({color:0x7a8494, metalness:0.4, roughness:0.6});
  const st=new THREE.Mesh(new THREE.BoxGeometry(WHEEL_GAP+1.0, WHEEL.cy, 0.35), standM);
  st.position.set(0, WHEEL.cy/2, -WHEEL_R*0.55); st.castShadow=true; g.add(st);
})();

/* =====================================================================
   ТРУБА (п.1.3): полый цилиндр на подстилке, вход только через торцы
   ===================================================================== */
const TUBE = { rt: TUBE_RT, axisZ: 1.6, cy: TUBE_RT + 0.14, x0: -6.9, x1: -1.7,
               floorY: FLOOR_Y, user: null };
TUBE.mouthA = { x: TUBE.x0 - 1.25, y: FLOOR_Y, z: TUBE.axisZ };  // у левого торца (снаружи)
TUBE.mouthB = { x: TUBE.x1 + 1.25, y: FLOOR_Y, z: TUBE.axisZ };  // у правого торца

(function buildTube(){
  const m = new THREE.MeshStandardMaterial({color:0xcf8a3a, roughness:0.6, side:THREE.DoubleSide});
  const body = new THREE.Mesh(new THREE.CylinderGeometry(TUBE_RT,TUBE_RT, TUBE.x1-TUBE.x0, 28, 1, true), m);
  body.rotation.z = Math.PI/2;
  body.position.set((TUBE.x0+TUBE.x1)/2, TUBE.cy, TUBE.axisZ);
  body.castShadow = true; cage.add(body);
  const rimM = new THREE.MeshStandardMaterial({color:0xb06f28, roughness:0.6});
  for(const x of [TUBE.x0, TUBE.x1]){
    const rim = new THREE.Mesh(new THREE.TorusGeometry(TUBE_RT, 0.07, 8, 28), rimM);
    rim.rotation.y = Math.PI/2; rim.position.set(x, TUBE.cy, TUBE.axisZ); cage.add(rim);
  }
})();

/* =====================================================================
   МИСКА + ЗЁРНА, ПОИЛКА
   ===================================================================== */
const BOWL = { x: 2.6, z: 3.9, r: 0.95 };
(function buildBowl(){
  const m = new THREE.MeshStandardMaterial({color:0xb0413e, roughness:0.5});
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.6,0.34,20), m);
  base.position.set(BOWL.x, 0.17, BOWL.z); base.castShadow=base.receiveShadow=true; cage.add(base);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.82,0.09,8,20), m);
  rim.rotation.x = Math.PI/2; rim.position.set(BOWL.x,0.34,BOWL.z); cage.add(rim);
  const seedG = new THREE.SphereGeometry(0.07,6,5);
  const seedM = new THREE.MeshStandardMaterial({color:0xd8b94f, roughness:0.8});
  const N=26, im=new THREE.InstancedMesh(seedG,seedM,N), d=new THREE.Object3D();
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2, rr=Math.random()*0.55;
    d.position.set(BOWL.x+Math.cos(a)*rr, 0.34+Math.random()*0.04, BOWL.z+Math.sin(a)*rr);
    d.scale.set(1,0.7,1); d.updateMatrix(); im.setMatrixAt(i,d.matrix);
  }
  cage.add(im);
})();

(function buildDrinker(){
  const metalM = new THREE.MeshStandardMaterial({color:0xa8b2c0, metalness:0.8, roughness:0.25});
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,1.5,14), metalM);
  body.position.set(IX+0.75, 3.6, 1.5); body.castShadow=true; cage.add(body);
  const spout = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.045,1.6,8), metalM);
  spout.rotation.z = Math.PI/2.6; spout.position.set(IX-0.1, 2.7, 1.5); cage.add(spout);
  const drop = new THREE.Mesh(new THREE.SphereGeometry(0.07,8,6),
      new THREE.MeshStandardMaterial({color:0x7fc4ff, transparent:true, opacity:0.8}));
  drop.position.set(IX-0.52, 2.1, 1.5); cage.add(drop);
})();

/* =====================================================================
   ХОМЯК: тело, живот, голова (отдельной группой), глаза+зрачки, щёки,
   нос, уши с внутренней частью, 4 лапы, хвост. Морда смотрит в +X.
   ===================================================================== */
function makeHamster(fur){
  const g = new THREE.Group();
  const furM  = new THREE.MeshStandardMaterial({color:fur, roughness:0.85});
  const bellyM= new THREE.MeshStandardMaterial({color:new THREE.Color(fur).lerp(new THREE.Color(0xffffff),0.55), roughness:0.9});
  const pinkM = new THREE.MeshStandardMaterial({color:0xe8a0a8, roughness:0.7});

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.52,16,12), furM);
  body.scale.set(1.5,0.95,1.0); body.position.y = 0.6; g.add(body);
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.45,14,10), bellyM);
  belly.scale.set(1.25,0.7,0.85); belly.position.set(0.05,0.48,0); g.add(belly);

  const head = new THREE.Group(); head.position.set(0.72,0.72,0); g.add(head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.33,16,12), furM);
  skull.scale.set(1.05,0.95,0.9); head.add(skull);
  for(const s of [-1,1]){
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06,10,8),
        new THREE.MeshStandardMaterial({color:0x121216, roughness:0.2}));
    eye.position.set(0.23,0.05,s*0.17); head.add(eye);
    const pup = new THREE.Mesh(new THREE.SphereGeometry(0.018,6,5),
        new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xbbbbbb}));
    pup.position.set(0.28,0.075,s*0.16); head.add(pup);
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.14,10,8), pinkM.clone());
    cheek.material.color = new THREE.Color(fur).lerp(new THREE.Color(0xf0b0b6),0.45);
    cheek.position.set(0.12,-0.09,s*0.17); head.add(cheek);
    // ухо: группа (чтобы дёргать) — внешняя часть + внутренняя
    const ear = new THREE.Group(); ear.position.set(-0.03,0.27,s*0.17);
    ear.rotation.z = -s*0.5;
    const out = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.04,12), furM);
    out.rotation.x = Math.PI/2; ear.add(out);
    const inn = new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,0.05,12), pinkM);
    inn.rotation.x = Math.PI/2; inn.position.z = -s*0.01; inn.position.y=0; ear.add(inn);
    head.add(ear);
    if(s>0) g.userData.earR = ear; else g.userData.earL = ear;
  }
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.045,8,6), pinkM);
  nose.position.set(0.34,-0.02,0); head.add(nose);

  const legs = [];
  const legM = new THREE.MeshStandardMaterial({color:new THREE.Color(fur).multiplyScalar(0.85), roughness:0.9});
  // [x,z,фаза]: диагональные пары — ПЛ+ЗЗ и ПЗ+ЗЛ (п.1.5)
  const cfg = [[0.45, 0.3, 0],[0.45,-0.3, Math.PI],[-0.45, 0.3, Math.PI],[-0.45,-0.3, 0]];
  for(const [lx,lz,ph] of cfg){
    const grp = new THREE.Group(); grp.position.set(lx,0.3,lz); g.add(grp);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.07,0.28,8), legM);
    m.position.y = -0.14; grp.add(m);
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.07,8,6), pinkM);
    foot.position.set(0.03,-0.27,0); grp.add(foot);
    legs.push({grp, ph});
  }
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.1,8,6), furM);
  tail.scale.set(0.55,0.55,0.55); tail.position.set(-0.85,0.52,0); g.add(tail);

  g.traverse(o=>{ if(o.isMesh){ o.castShadow = true; } });
  return { g, body, belly, head, legs, tail };
}

/* =====================================================================
   ХОМЯКИ + КОНЕЧНЫЙ АВТОМАТ
   ===================================================================== */
const NAMES = [
  {n:'Пух',    c:0xd9a55a}, {n:'Стрелка', c:0xe8d8b0}, {n:'Кекс', c:0x8a5a33},
  {n:'Бублик', c:0x9a9aa8}, {n:'Нора',    c:0xf2ede4}
];
const hamsters = [];
NAMES.forEach((sp,i)=>{
  const parts = makeHamster(sp.c);
  const h = Object.assign({
    name: sp.n, idx:i, state:'idle', plan:null, t:0, dur:1+Math.random()*2,
    phase: Math.random()*6.28, ry: Math.random()*6.28, runV:0, rtune: Math.random()*10,
    vy:0, airborne:false, hopT:-9, twitchT: 1+Math.random()*4,
    claims:null, tubeDir:1, roamLeft:0, seed: Math.random()*10, lerp:null
  }, parts);
  parts.g.position.set(-2+i*1.6, FLOOR_Y, -0.5+i%2*1.4);
  parts.g.userData.hi = i;
  cage.add(parts.g);
  hamsters.push(h);
});
window.hamsters = hamsters; window.WHEEL = WHEEL; window.TUBE = TUBE;

const TXT = {
  idle:'стоит', wheel_enter:'вбегает в колесо', wheel_run:'бежит в колесе',
  wheel_exit:'выходит из колеса', tube_enter:'забирается в трубу',
  tube_inside:'ползёт по трубе', tube_exit:'вылезает из трубы', eat:'грызёт зёрна',
  walk: { wheel:'идёт к колесу', tube:'идёт к трубе', eat:'идёт к миске', roam:'гуляет' }
};
function statusText(h){
  return h.state==='walk' ? (TXT.walk[h.plan]||'гуляет') : (TXT[h.state]||h.state);
}

function setState(h,s,dur){ h.state=s; h.t=0; if(dur!==undefined) h.dur=dur; }
function releaseClaims(h){
  if(h.claims==='wheel' && WHEEL.user===h) WHEEL.user=null;
  if(h.claims==='tube'  && TUBE.user ===h) TUBE.user=null;
  h.claims=null;
}
function chooseActivity(h){
  releaseClaims(h);
  const opts = ['roam','roam','eat','eat'];
  if(!WHEEL.user) opts.push('wheel','wheel');
  if(!TUBE.user)  opts.push('tube','tube');
  const act = opts[(Math.random()*opts.length)|0];
  h.plan = act;
  if(act==='wheel'){ WHEEL.user = h; h.claims='wheel'; h.runV=0;
    setWalkTarget(h, WHEEL.entryPos.x, WHEEL.entryPos.z); }
  else if(act==='tube'){ TUBE.user = h; h.claims='tube';
    h.tubeDir = Math.random()<0.5 ? 1 : -1;   // +1: вход с левого торца (движение к +X)
    const m = h.tubeDir>0 ? TUBE.mouthA : TUBE.mouthB;
    setWalkTarget(h, m.x, m.z); }
  else if(act==='eat'){ setWalkTarget(h, BOWL.x, BOWL.z + 1.45); }
  else { h.roamLeft = 2+(Math.random()*3|0); pickRoam(h); }
  setState(h,'walk',25);
}
function setWalkTarget(h,x,z){ h.tx=x; h.tz=z; }
function pickRoam(h){
  for(let k=0;k<20;k++){
    const x=(Math.random()*2-1)*7.6, z=(Math.random()*2-1)*4.6;
    if(Math.hypot(x-WHEEL.x,z-WHEEL.z) > WHEEL.R+1.2 &&
       !(x>TUBE.x0-1 && x<TUBE.x1+1 && Math.abs(z-TUBE.axisZ)<TUBE.rt+1.2) &&
       Math.hypot(x-BOWL.x,z-BOWL.z) > BOWL.r+1.2){ setWalkTarget(h,x,z); return; }
  }
  setWalkTarget(h,0,0);
}

/* --- движение к цели -------------------------------------------------- */
function faceToward(h,dx,dz,dt){
  const tr = Math.atan2(-dz,dx);
  let d = tr - h.ry;
  while(d> Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  h.ry += Math.max(-5*dt, Math.min(5*dt, d));
}
function walkTo(h,tx,tz,speed,dt){
  const dx=tx-h.g.position.x, dz=tz-h.g.position.z, d=Math.hypot(dx,dz);
  if(d>0.01){ faceToward(h,dx,dz,dt);
    const step=Math.min(speed*dt,d);
    h.g.position.x+=dx/d*step; h.g.position.z+=dz/d*step; }
  return d;
}
/* --- плавные переходы без телепортов (п.1.6) ------------------------- */
function startLerp(h,to,dur){ const p=h.g.position;
  h.lerp={fx:p.x,fy:p.y,fz:p.z,tx:to.x,ty:to.y,tz:to.z,t:0,dur}; }
function stepLerp(h,dt){ const L=h.lerp; L.t=Math.min(1,L.t+dt/L.dur);
  const e=L.t*L.t*(3-2*L.t);
  h.g.position.set(L.fx+(L.tx-L.fx)*e, L.fy+(L.ty-L.fy)*e, L.fz+(L.tz-L.fz)*e);
  return L.t>=1; }

/* =====================================================================
   ОБНОВЛЕНИЕ ОДНОГО ХОМЯКА
   ===================================================================== */
function updateHamster(h,dt,t){
  const p=h.g.position;
  h.t+=dt;
  const inGround = (s)=>['idle','walk','eat'].includes(s);

  switch(h.state){
    case 'idle':
      if(h.t>h.dur) chooseActivity(h);
      break;

    case 'walk':
      if(h.t>h.dur){ // заблудился — сменить план
        if(h.plan!=='roam'){ releaseClaims(h); setState(h,'idle',0.5); h.plan=null; break; }
        pickRoam(h); h.t=0;
      }
      const d = walkTo(h,h.tx,h.tz,1.35,dt);
      if(d<0.09){
        if(h.plan==='wheel'){ setState(h,'wheel_enter'); h.runV=0; h.lt=0; }
        else if(h.plan==='tube'){ setState(h,'tube_enter'); h.lt=0; }
        else if(h.plan==='eat'){ setState(h,'eat',4+Math.random()*3); }
        else { h.roamLeft--; if(h.roamLeft<=0){ releaseClaims(h); setState(h,'idle',1+Math.random()*2); h.plan=null; }
               else pickRoam(h); }
      }
      break;

    /* ---- КОЛЕСО: вход, бег (ω = v/R), выход ------------------------ */
    case 'wheel_enter':
      faceToward(h,0,1,dt*2.5);
      { const L=0.9; h.lt=Math.min(1,h.lt+dt/L); const e=h.lt*h.lt*(3-2*h.lt);
        p.set(WHEEL.entryPos.x+(WHEEL.runPos.x-WHEEL.entryPos.x)*e, FLOOR_Y, WHEEL.z);
        h.runV = 0.6*e; }
      if(h.lt>=1) setState(h,'wheel_run',4+Math.random()*5);
      break;

    case 'wheel_run':
      // зверь стоит на нижней точке обода
      p.set(WHEEL.runPos.x, WHEEL.runPos.y, WHEEL.runPos.z);
      h.rtune+=dt;
      const target = 1.7 + 1.1*Math.sin(h.rtune*0.8) + 0.35*Math.sin(t*2.7+h.seed);
      h.runV += (Math.max(0.4,target)-h.runV)*Math.min(1,dt*2.2);
      // фаза шага от пути лап = скорости обода (п.1.5)
      h.phase += (h.runV*dt/STEP_LEN)*Math.PI*2;
      if(h.t>h.dur){ setState(h,'wheel_exit'); h.lt=0; }
      break;

    case 'wheel_exit':
      { const L=1.0; h.lt=Math.min(1,h.lt+dt/L); const e=h.lt*h.lt*(3-2*h.lt);
        p.set(WHEEL.runPos.x+(WHEEL.entryPos.x-WHEEL.runPos.x)*e, FLOOR_Y, WHEEL.z);
        h.runV = 0.6*(1-e); }
      h.runV=Math.max(0,h.runV-dt*1.5);
      h.phase += (h.runV*dt/STEP_LEN)*Math.PI*2;
      if(h.lt>=1){ h.runV=0; WHEEL.user=null; h.claims=null; h.plan=null;
                   setState(h,'idle',0.8+Math.random()*1.5); }
      break;

    /* ---- ТРУБА: вход только через торец, вдоль оси ----------------- */
    case 'tube_enter':
      { const inner = { x: h.tubeDir>0 ? TUBE.x0+1.0 : TUBE.x1-1.0, y:TUBE.floorY, z:TUBE.axisZ };
        const mouth = h.tubeDir>0 ? TUBE.mouthA : TUBE.mouthB;
        faceToward(h, inner.x-p.x, 0, dt*2);
        if(!h.ltStarted){ startLerp(h, inner, 1.0); h.ltStarted=true; }
        if(stepLerp(h,dt)){ h.ltStarted=false; setState(h,'tube_inside'); } }
      break;

    case 'tube_inside':
      faceToward(h, h.tubeDir, 0, dt*3);
      // строго на оси трубы по XZ; стоит на внутреннем дне
      p.z = TUBE.axisZ; p.y = TUBE.floorY;
      const exitInnerX = h.tubeDir>0 ? TUBE.x1-1.0 : TUBE.x0+1.0;
      const dd = walkTo(h, exitInnerX, TUBE.axisZ, 0.85, dt);
      p.z = TUBE.axisZ;
      if(dd<0.06) setState(h,'tube_exit');
      break;

    case 'tube_exit':
      { const far = h.tubeDir>0 ? TUBE.mouthB : TUBE.mouthA;
        faceToward(h, h.tubeDir, 0, dt*2);
        if(!h.ltStarted){ startLerp(h, far, 0.9); h.ltStarted=true; }
        if(stepLerp(h,dt)){ h.ltStarted=false; TUBE.user=null; h.claims=null; h.plan=null;
                            setState(h,'idle',0.8+Math.random()*1.5); } }
      break;

    case 'eat':
      p.y = FLOOR_Y;
      faceToward(h, BOWL.x-p.x, BOWL.z-p.z, dt*3);
      if(h.t>h.dur){ releaseClaims(h); setState(h,'idle',0.5+Math.random()*1.5); h.plan=null; }
      break;
  }
  if(h.state!=='tube_enter' && h.state!=='tube_exit') h.ltStarted=false;

  /* --- прыжок по клику ------------------------------------------------ */
  if(h.airborne){
    h.vy -= 9.8*dt; p.y += h.vy*dt;
    const base = (h.state.startsWith('wheel'))?WHEEL.runPos.y:
                 (h.state.startsWith('tube'))?TUBE.floorY:FLOOR_Y;
    if(p.y<=base){ p.y=base; h.airborne=false; h.vy=0; h.hopT=t; }
  } else if(!h.lerp && !h.state.startsWith('wheel') && !h.state.startsWith('tube')){
    p.y = FLOOR_Y;
  }

  /* --- столкновения с телами предметов (п.1.4) для гуляющих ---------- */
  const groundLike = inGround(h.state);
  if(groundLike){
    // колесо — круг в плане XZ; обходим, если цель — само колесо
    if(h.plan!=='wheel'){
      const dx=p.x-WHEEL.x, dz=p.z-WHEEL.z, d=Math.hypot(dx,dz), mn=WHEEL.R+HR*0.7;
      if(d<mn && d>1e-4){ p.x=WHEEL.x+dx/d*mn; p.z=WHEEL.z+dz/d*mn; }
    }
    // труба — боковая стенка твёрдая; торцы открыты (нет столкновения вне [x0,x1])
    if(p.x>TUBE.x0 && p.x<TUBE.x1){
      const dz=p.z-TUBE.axisZ, mn=TUBE.rt+HR*0.7;
      if(Math.abs(dz)<mn){ p.z = TUBE.axisZ + (dz>=0?1:-1)*mn; }
    }
    // миска — круг
    { const dx=p.x-BOWL.x, dz=p.z-BOWL.z, d=Math.hypot(dx,dz), mn=BOWL.r+HR*0.45;
      if(d<mn && d>1e-4){ p.x=BOWL.x+dx/d*mn; p.z=BOWL.z+dz/d*mn; } }
  }
  // границы клетки
  p.x=Math.max(-8.3,Math.min(8.3,p.x));
  p.z=Math.max(-5.2,Math.min(5.2,p.z));

  /* --- фаза шага от ПРОЙДЕННОГО ПУТИ (п.1.5), кроме бега в колесе ---- */
  if(h.state!=='wheel_run' && h.state!=='wheel_exit' && h.state!=='wheel_enter'){
    const ddx=p.x-(h.px??p.x), ddz=p.z-(h.pz??p.z);
    const moved=Math.hypot(ddx,ddz);
    if(moved>1e-5) h.phase += (moved/STEP_LEN)*Math.PI*2;
  }
  h.px=p.x; h.pz=p.z;

  /* --- лапы: диагональные пары ---------------------------------------- */
  const amp = (h.state==='idle'||h.state==='eat')?0:0.65;
  for(const L of h.legs) L.grp.rotation.x = Math.sin(h.phase+L.ph)*amp;

  /* --- дыхание, голова, жуёт, дёргает ухом ---------------------------- */
  const breathe = (h.state==='idle'||h.state==='eat') ? 1+0.035*Math.sin(t*2.4+h.seed) : 1;
  h.body.scale.set(1.5*breathe,0.95*breathe,1.0*breathe);
  let headX = 0;
  if(h.state==='eat') headX = 0.5 + Math.sin(t*9)*0.16;          // наклонил голову и жуёт
  else if(h.state==='idle') headX = 0.08*Math.sin(t*1.3+h.seed);
  h.head.rotation.x += (headX-h.head.rotation.x)*Math.min(1,dt*6);
  h.tail.rotation.z = 0.25*Math.sin(t*3+h.seed);

  h.twitchT-=dt;
  if(h.twitchT<-0.4) h.twitchT = 2+Math.random()*4;
  const tw = h.twitchT<0 ? Math.sin(h.twitchT*40)*0.6*Math.max(0,1+h.twitchT/0.4) : 0;
  h.g.userData.earR.rotation.x = tw;
  h.g.userData.earL.rotation.x = tw*0.4;
}

/* =====================================================================
   КОЛЕСО: ω от бегуна, трение для пустого (п.1.1)
   ===================================================================== */
function updateWheel(dt){
  const u = WHEEL.user;
  if(u && (u.state==='wheel_run'||u.state==='wheel_enter'||u.state==='wheel_exit')){
    WHEEL.omega = u.runV * WHEEL.facing / WHEEL.R;   // ω = v / R — строго
  } else {
    // пустое колесо: трение гасит вращение к нулю
    const s=Math.sign(WHEEL.omega);
    WHEEL.omega -= s*1.2*dt;
    if(Math.sign(WHEEL.omega)!==s) WHEEL.omega=0;
  }
  WHEEL.spin.rotation.x += WHEEL.omega*dt;
}

/* --- расталкивание хомяков (п.1.4) ------------------------------------ */
function separateHamsters(){
  const locked = h => h.state.startsWith('wheel')||h.state.startsWith('tube');
  for(let i=0;i<hamsters.length;i++)for(let j=i+1;j<hamsters.length;j++){
    const a=hamsters[i],b=hamsters[j];
    if(locked(a)||locked(b)) continue;
    const pa=a.g.position, pb=b.g.position;
    const dx=pb.x-pa.x, dz=pb.z-pa.z; let d=Math.hypot(dx,dz);
    const mn=2*HR;
    if(d<mn){ if(d<1e-4){d=1e-4;}
      const push=(mn-d)/2, nx=dx/d, nz=dz/d;
      pa.x-=nx*push; pa.z-=nz*push; pb.x+=nx*push; pb.z+=nz*push; }
  }
}

/* =====================================================================
   КЛИК — ПРЫЖОК
   ===================================================================== */
const raycaster = new THREE.Raycaster(); const ptr = new THREE.Vector2();
let downX=0,downY=0;
renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;});
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>6) return;
  ptr.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(ptr,camera);
  const hits = raycaster.intersectObjects(hamsters.map(h=>h.g), true);
  if(!hits.length) return;
  let o=hits[0].object; while(o && o.userData.hi===undefined) o=o.parent;
  if(!o) return;
  const h=hamsters[o.userData.hi];
  if(!h.airborne && !h.state.startsWith('wheel') && !h.state.startsWith('tube')){
    h.airborne=true; h.vy=3.0;
  }
});

/* =====================================================================
   ПАНЕЛИ UI + ПРОВЕРКА ФИЗИКИ
   ===================================================================== */
const namesEl=document.getElementById('names'), physEl=document.getElementById('phys');
let uiT=0, lastRunner=null;
function updateUI(t){
  if(t-uiT<0.15) return; uiT=t;
  let html='';
  for(const h of hamsters){
    html+=`<div class="row"><span class="dot" style="background:#${NAMES[h.idx].c.toString(16).padStart(6,'0')}"></span>`+
          `<b>${h.name}</b>&nbsp;<span class="st">— ${statusText(h)}</span></div>`;
  }
  namesEl.innerHTML=html;

  const u = WHEEL.user && WHEEL.user.state==='wheel_run' ? WHEEL.user : lastRunner;
  if(WHEEL.user && WHEEL.user.state==='wheel_run') lastRunner=WHEEL.user;
  const v = u? u.runV : 0;
  const rimV = Math.abs(WHEEL.omega)*WHEEL.R;
  const err = v>0.05 ? Math.abs(rimV-v)/v*100 : 0;
  const inTube = hamsters.find(h=>h.state==='tube_inside');
  const dev = inTube ? Math.abs(inTube.g.position.z-TUBE.axisZ) : null;
  physEl.textContent =
    `КОЛЕСО  ω=${WHEEL.omega.toFixed(2)} рад/с   R=${WHEEL.R.toFixed(2)}\n`+
    `скорость лап v      = ${v.toFixed(2)} м/с\n`+
    `лин. скорость обода |ω|·R = ${rimV.toFixed(2)} м/с\n`+
    `расхождение        = ${err.toFixed(1)} %\n`+
    `бегун: ${WHEEL.user? WHEEL.user.name:'— (трение гасит)'}\n`+
    (dev!==null? `хомяк в трубе: отклонение от оси = ${dev.toFixed(3)}` : `труба: ${TUBE.user?TUBE.user.name:'свободна'}`);
}

/* =====================================================================
   ЦИКЛ
   ===================================================================== */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

let last=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-last)/1000, 0.05);   // ограничение дельты при просадках
  last=now; const t=now/1000;
  updateWheel(dt);
  for(const h of hamsters) updateHamster(h,dt,t);
  separateHamsters();
  updateUI(t);
  controls.update();
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
