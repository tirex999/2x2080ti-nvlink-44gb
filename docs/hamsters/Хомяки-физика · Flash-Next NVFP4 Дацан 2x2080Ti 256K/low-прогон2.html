<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Хомяки в клетке — честная физика</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { overflow:hidden; background:#1a1a2e; font-family:'Segoe UI',sans-serif; }
canvas { display:block; }
#panel {
  position:absolute; top:10px; right:10px; width:280px;
  background:rgba(0,0,0,0.85); color:#eee; padding:12px;
  border-radius:8px; font-size:12px; max-height:90vh; overflow-y:auto;
  border:1px solid #444;
}
#panel h3 { color:#f0a; margin-bottom:6px; font-size:13px; }
.ham-status { margin:4px 0; padding:4px 6px; background:rgba(255,255,255,0.05); border-radius:4px; }
.ham-name { font-weight:bold; }
#physics-panel {
  position:absolute; bottom:10px; left:10px; width:320px;
  background:rgba(0,0,0,0.85); color:#0f0; padding:10px;
  border-radius:8px; font-size:11px; font-family:monospace;
  border:1px solid #0a0;
}
#physics-panel h4 { color:#0ff; margin-bottom:4px; }
.val { color:#ff0; }
</style>
</head>
<body>
<div id="panel"><h3>🐹 Хомяки</h3><div id="ham-list"></div></div>
<div id="physics-panel"><h4>⚙ Физика колеса</h4><div id="phys-info"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
// КОНСТАНТЫ РАЗМЕРОВ (габарит зверя определяет размеры предметов)
// ============================================================
const HAM_LENGTH = 0.4;
const HAM_HEIGHT = 0.35;
const HAM_RADIUS = HAM_HEIGHT * 0.5;

// Колесо: радиус от габарита хомяка, с запасом
const WHEEL_R = HAM_HEIGHT * 2.2;          // ~0.77
const WHEEL_WIDTH = HAM_LENGTH * 1.8;      // ~0.72 (шире боков зверя)
const WHEEL_WALL = 0.04;
const WHEEL_INNER_R = WHEEL_R - WHEEL_WALL;
const WHEEL_FRICTION = 0.3;

// Труба: внутренний радиус > половины высоты хомяка
const TUBE_INNER_R = HAM_HEIGHT * 0.85;    // ~0.30
const TUBE_WALL = 0.05;
const TUBE_OUTER_R = TUBE_INNER_R + TUBE_WALL;
const TUBE_LENGTH = 2.8;

// Клетка
const CAGE_W = 7, CAGE_D = 5, CAGE_H = 3.5;

// Миска
const BOWL_R = 0.3, BOWL_H = 0.15;

// ============================================================
// THREE.JS SETUP
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a3e);
scene.fog = new THREE.Fog(0x2a2a3e, 15, 30);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 50);
camera.position.set(6, 5, 8);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Свет
const dirLight = new THREE.DirectionalLight(0xffeedd, 1.0);
dirLight.position.set(5, 8, 4);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048,2048);
dirLight.shadow.camera.left = -6; dirLight.shadow.camera.right = 6;
dirLight.shadow.camera.top = 6; dirLight.shadow.camera.bottom = -6;
dirLight.shadow.camera.near = 1; dirLight.shadow.camera.far = 20;
scene.add(dirLight);

const ambLight = new THREE.AmbientLight(0x404060, 0.6);
scene.add(ambLight);

const hemiLight = new THREE.HemisphereLight(0x8888cc, 0x443322, 0.4);
scene.add(hemiLight);

// ============================================================
// КОМНАТА (окружение)
// ============================================================
const floorGeo = new THREE.PlaneGeometry(20, 20);
const floorMat = new THREE.MeshStandardMaterial({color:0x8B7355, roughness:0.9});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.position.y = -0.01;
floor.receiveShadow = true;
scene.add(floor);

// Стены комнаты
const wallMat = new THREE.MeshStandardMaterial({color:0x6B5B4F, roughness:0.95});
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(20,10), wallMat);
backWall.position.set(0,5,-8); backWall.receiveShadow=true; scene.add(backWall);
const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(20,10), wallMat);
leftWall.position.set(-8,5,0); leftWall.rotation.y=Math.PI/2; leftWall.receiveShadow=true; scene.add(leftWall);

// Стол
const tableTop = new THREE.Mesh(
  new THREE.BoxGeometry(9, 0.15, 7),
  new THREE.MeshStandardMaterial({color:0x654321, roughness:0.8})
);
tableTop.position.set(0, 0.5, 0); tableTop.castShadow=true; tableTop.receiveShadow=true;
scene.add(tableTop);
const tableLegGeo = new THREE.CylinderGeometry(0.1,0.1,0.5,8);
const tableLegMat = new THREE.MeshStandardMaterial({color:0x4a3020});
[[-3.5,-2.5],[3.5,-2.5],[-3.5,2.5],[3.5,2.5]].forEach(([x,z])=>{
  const leg = new THREE.Mesh(tableLegGeo, tableLegMat);
  leg.position.set(x,0.25,z); leg.castShadow=true; scene.add(leg);
});

// ============================================================
// КЛЕТКА: поддон, прутья, рамка
// ============================================================
const cageGroup = new THREE.Group();
cageGroup.position.y = 0.575;
scene.add(cageGroup);

// Поддон
const trayMat = new THREE.MeshStandardMaterial({color:0x8B8B83, roughness:0.6, metalness:0.3});
const tray = new THREE.Mesh(new THREE.BoxGeometry(CAGE_W+0.4, 0.12, CAGE_D+0.4), trayMat);
tray.position.y = 0.06; tray.castShadow=true; tray.receiveShadow=true;
cageGroup.add(tray);

// Подстилка (стружка) — InstancedMesh
const chipGeo = new THREE.BoxGeometry(0.12, 0.03, 0.04);
const chipMat = new THREE.MeshStandardMaterial({color:0xDEB887, roughness:0.95});
const NUM_CHIPS = 600;
const chipMesh = new THREE.InstancedMesh(chipGeo, chipMat, NUM_CHIPS);
chipMesh.receiveShadow = true;
const chipDummy = new THREE.Object3D();
for(let i=0;i<NUM_CHIPS;i++){
  chipDummy.position.set(
    (Math.random()-0.5)*CAGE_W*0.92,
    0.14+Math.random()*0.02,
    (Math.random()-0.5)*CAGE_D*0.92
  );
  chipDummy.rotation.set(Math.random()*0.5-0.25, Math.random()*Math.PI, Math.random()*0.3-0.15);
  chipDummy.scale.set(0.7+Math.random()*0.6, 0.5+Math.random()*1.0, 0.8+Math.random()*0.5);
  chipDummy.updateMatrix();
  chipMesh.setMatrixAt(i, chipDummy.matrix);
}
cageGroup.add(chipMesh);

// Прутья
const barMat = new THREE.MeshStandardMaterial({color:0x666666, metalness:0.7, roughness:0.3});
const barGeo = new THREE.CylinderGeometry(0.025, 0.025, CAGE_H, 6);
function addBar(x,z){
  const b = new THREE.Mesh(barGeo, barMat);
  b.position.set(x, CAGE_H/2+0.12, z); b.castShadow=true;
  cageGroup.add(b);
}
const barSpacing = 0.35;
for(let x=-CAGE_W/2; x<=CAGE_W/2; x+=barSpacing){
  addBar(x, -CAGE_D/2); addBar(x, CAGE_D/2);
}
for(let z=-CAGE_D/2+barSpacing; z<=CAGE_D/2-barSpacing; z+=barSpacing){
  addBar(-CAGE_W/2, z); addBar(CAGE_W/2, z);
}

// Рамка верхняя и нижняя
const frameMat = new THREE.MeshStandardMaterial({color:0x555555, metalness:0.6, roughness:0.4});
function addFrame(w,h,d,x,y,z){
  const f = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), frameMat);
  f.position.set(x,y,z); f.castShadow=true; cageGroup.add(f);
}
addFrame(CAGE_W+0.2, 0.06, 0.06, 0, 0.12, -CAGE_D/2);
addFrame(CAGE_W+0.2, 0.06, 0.06, 0, 0.12, CAGE_D/2);
addFrame(0.06, 0.06, CAGE_D+0.2, -CAGE_W/2, 0.12, 0);
addFrame(0.06, 0.06, CAGE_D+0.2, CAGE_W/2, 0.12, 0);
addFrame(CAGE_W+0.2, 0.06, 0.06, 0, CAGE_H+0.12, -CAGE_D/2);
addFrame(CAGE_W+0.2, 0.06, 0.06, 0, CAGE_H+0.12, CAGE_D/2);
addFrame(0.06, 0.06, CAGE_D+0.2, -CAGE_W/2, CAGE_H+0.12, 0);
addFrame(0.06, 0.06, CAGE_D+0.2, CAGE_W/2, CAGE_H+0.12, 0);

// ============================================================
// КОЛЕСО
// ============================================================
const wheelObj = {
  radius: WHEEL_R,
  innerRadius: WHEEL_INNER_R,
  width: WHEEL_WIDTH,
  angularVelocity: 0,
  group: new THREE.Group(),
  position: new THREE.Vector3(-2.5, 0, -1.5),
  axisDir: new THREE.Vector3(0,0,1) // ось вдоль Z
};

(function buildWheel(){
  const g = wheelObj.group;
  const mat = new THREE.MeshStandardMaterial({color:0x4a90d9, roughness:0.4, metalness:0.2});
  const rimMat = new THREE.MeshStandardMaterial({color:0x3a7bc8, roughness:0.5});
  
  // Обод (тор)
  const rimGeo = new THREE.TorusGeometry(WHEEL_R - WHEEL_WALL/2, WHEEL_WALL/2, 8, 32);
  const rim1 = new THREE.Mesh(rimGeo, rimMat);
  rim1.position.z = WHEEL_WIDTH/2;
  const rim2 = new THREE.Mesh(rimGeo.clone(), rimMat);
  rim2.position.z = -WHEEL_WIDTH/2;
  g.add(rim1, rim2);
  
  // Ступица (центр)
  const hubGeo = new THREE.CylinderGeometry(0.06, 0.06, WHEEL_WIDTH+0.1, 12);
  const hub = new THREE.Mesh(hubGeo, new THREE.MeshStandardMaterial({color:0x333,metalness:0.8}));
  hub.rotation.x = Math.PI/2;
  g.add(hub);
  
  // Спиральные ступеньки (поверхность для бега)
  const stepMat = new THREE.MeshStandardMaterial({color:0x5a9fd4, roughness:0.6});
  for(let i=0; i<12; i++){
    const angle = (i/12)*Math.PI*2;
    const stepGeo = new THREE.BoxGeometry(WHEEL_INNER_R*0.7, 0.02, WHEEL_WIDTH-0.1);
    const step = new THREE.Mesh(stepGeo, stepMat);
    step.position.set(
      Math.cos(angle)*(WHEEL_INNER_R*0.5),
      Math.sin(angle)*(WHEEL_INNER_R*0.5),
      0
    );
    step.rotation.z = angle;
    g.add(step);
  }
  
  // Боковые стенки (прозрачные)
  const sideMat = new THREE.MeshStandardMaterial({color:0x88bbff, transparent:true, opacity:0.15, side:THREE.DoubleSide});
  const sideGeo = new THREE.CircleGeometry(WHEEL_R, 24);
  const side1 = new THREE.Mesh(sideGeo, sideMat);
  side1.position.z = WHEEL_WIDTH/2 + 0.01;
  const side2 = new THREE.Mesh(sideGeo.clone(), sideMat);
  side2.position.z = -WHEEL_WIDTH/2 - 0.01;
  side2.rotation.y = Math.PI;
  g.add(side1, side2);
  
  // Стойки (крепление)
  const standMat = new THREE.MeshStandardMaterial({color:0x444, metalness:0.5});
  const standGeo = new THREE.BoxGeometry(0.08, WHEEL_R+0.3, 0.08);
  const s1 = new THREE.Mesh(standGeo, standMat);
  s1.position.set(0, -(WHEEL_R+0.3)/2, WHEEL_WIDTH/2+0.06);
  const s2 = new THREE.Mesh(standGeo.clone(), standMat);
  s2.position.set(0, -(WHEEL_R+0.3)/2, -WHEEL_WIDTH/2-0.06);
  g.add(s1, s2);
  
  g.position.copy(wheelObj.position);
  g.position.y = WHEEL_R + 0.14; // центр колеса на высоте R от дна клетки
  cageGroup.add(g);
})();

// ============================================================
// ТРУБА (полая, открытый цилиндр)
// ============================================================
const tubeObj = {
  innerRadius: TUBE_INNER_R,
  outerRadius: TUBE_OUTER_R,
  length: TUBE_LENGTH,
  position: new THREE.Vector3(1.5, 0, 1.0),
  axisDir: new THREE.Vector3(1, 0, 0), // вдоль X
  group: new THREE.Group()
};

(function buildTube(){
  const g = tubeObj.group;
  const mat = new THREE.MeshStandardMaterial({color:0x9b59b6, roughness:0.5});
  
  // Внешняя стенка (открытый цилиндр — без торцов)
  const outerGeo = new THREE.CylinderGeometry(TUBE_OUTER_R, TUBE_OUTER_R, TUBE_LENGTH, 24, 1, true);
  const outer = new THREE.Mesh(outerGeo, mat);
  outer.rotation.z = Math.PI/2;
  outer.castShadow = true;
  g.add(outer);
  
  // Внутренняя стенка
  const innerMat = new THREE.MeshStandardMaterial({color:0xb87fd4, roughness:0.7, side:THREE.BackSide});
  const innerGeo = new THREE.CylinderGeometry(TUBE_INNER_R, TUBE_INNER_R, TUBE_LENGTH, 24, 1, true);
  const inner = new THREE.Mesh(innerGeo, innerMat);
  inner.rotation.z = Math.PI/2;
  g.add(inner);
  
  // Кольца на торцах (ободки)
  const ringGeo = new THREE.TorusGeometry(TUBE_OUTER_R, 0.03, 8, 24);
  const ringMat = new THREE.MeshStandardMaterial({color:0x7d3c98, roughness:0.4});
  const r1 = new THREE.Mesh(ringGeo, ringMat);
  r1.position.x = TUBE_LENGTH/2; r1.rotation.y = Math.PI/2;
  const r2 = new THREE.Mesh(ringGeo.clone(), ringMat);
  r2.position.x = -TUBE_LENGTH/2; r2.rotation.y = Math.PI/2;
  g.add(r1, r2);
  
  g.position.copy(tubeObj.position);
  g.position.y = TUBE_OUTER_R + 0.14; // центр трубы на высоте внешнего радиуса (лежит на подстилке)
  cageGroup.add(g);
})();

// ============================================================
// МИСКА С ЗЁРНАМИ
// ============================================================
const bowlObj = {
  radius: BOWL_R,
  height: BOWL_H,
  position: new THREE.Vector3(2.5, 0, -1.5),
  group: new THREE.Group()
};

(function buildBowl(){
  const g = bowlObj.group;
  const bowlMat = new THREE.MeshStandardMaterial({color:0xcc4444, roughness:0.5});
  
  // Миска (усечённый конус)
  const bowlGeo = new THREE.CylinderGeometry(BOWL_R, BOWL_R*0.6, BOWL_H, 16);
  const bowl = new THREE.Mesh(bowlGeo, bowlMat);
  bowl.position.y = BOWL_H/2;
  bowl.castShadow = true;
  g.add(bowl);
  
  // Внутренность (тёмная)
  const innerMat = new THREE.MeshStandardMaterial({color:0x8B0000, roughness:0.8, side:THREE.BackSide});
  const innerGeo = new THREE.CylinderGeometry(BOWL_R-0.02, BOWL_R*0.6-0.02, BOWL_H-0.02, 16, 1, true);
  const inner = new THREE.Mesh(innerGeo, innerMat);
  inner.position.y = BOWL_H/2;
  g.add(inner);
  
  // Зёрна
  const seedGeo = new THREE.SphereGeometry(0.025, 6, 4);
  const seedMat = new THREE.MeshStandardMaterial({color:0xDAA520, roughness:0.7});
  for(let i=0;i<15;i++){
    const s = new THREE.Mesh(seedGeo, seedMat);
    const a = Math.random()*Math.PI*2;
    const r = Math.random()*BOWL_R*0.6;
    s.position.set(Math.cos(a)*r, BOWL_H*0.7+Math.random()*0.03, Math.sin(a)*r);
    s.scale.set(0.8+Math.random()*0.4, 0.6+Math.random()*0.3, 0.8+Math.random()*0.4);
    g.add(s);
  }
  
  g.position.copy(bowlObj.position);
  g.position.y = 0.14;
  cageGroup.add(g);
})();

// ============================================================
// ПОИЛКА
// ============================================================
(function buildWaterBottle(){
  const bottleMat = new THREE.MeshStandardMaterial({color:0x87CEEB, transparent:true, opacity:0.6, roughness:0.2});
  const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.6, 12), bottleMat);
  bottle.position.set(CAGE_W/2 - 0.15, 1.2, 0);
  bottle.castShadow = true;
  cageGroup.add(bottle);
  
  // Ниппель
  const nipMat = new THREE.MeshStandardMaterial({color:0x999, metalness:0.8});
  const nip = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.01, 0.15, 6), nipMat);
  nip.position.set(CAGE_W/2 - 0.15, 0.85, 0);
  cageGroup.add(nip);
  
  // Крепление
  const capMat = new THREE.MeshStandardMaterial({color:0xcc3333});
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.05, 12), capMat);
  cap.position.set(CAGE_W/2 - 0.15, 1.5, 0);
  cageGroup.add(cap);
})();

// ============================================================
// СОЗДАНИЕ ХОМЯКА (полная модель)
// ============================================================
function createHamster(colorHex){
  const group = new THREE.Group();
  const furMat = new THREE.MeshStandardMaterial({color:colorHex, roughness:0.9});
  const bellyMat = new THREE.MeshStandardMaterial({color:0xFFF8DC, roughness:0.95});
  const eyeWhiteMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.3});
  const pupilMat = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.2});
  const noseMat = new THREE.MeshStandardMaterial({color:0xff9999, roughness:0.6});
  const earInnerMat = new THREE.MeshStandardMaterial({color:0xffaaaa, roughness:0.8});
  
  // Тело (эллипсоид)
  const bodyGeo = new THREE.SphereGeometry(1, 12, 10);
  const body = new THREE.Mesh(bodyGeo, furMat);
  body.scale.set(HAM_LENGTH*0.45, HAM_HEIGHT*0.4, HAM_HEIGHT*0.35);
  body.position.y = HAM_HEIGHT*0.4;
  body.castShadow = true;
  group.add(body);
  group.userData.body = body;
  
  // Живот
  const bellyGeo = new THREE.SphereGeometry(1, 10, 8);
  const belly = new THREE.Mesh(bellyGeo, bellyMat);
  belly.scale.set(HAM_LENGTH*0.35, HAM_HEIGHT*0.25, HAM_HEIGHT*0.28);
  belly.position.set(0, HAM_HEIGHT*0.25, 0);
  group.add(belly);
  
  // Голова (отдельная группа для кивания)
  const headGroup = new THREE.Group();
  headGroup.position.set(HAM_LENGTH*0.4, HAM_HEIGHT*0.5, 0);
  group.add(headGroup);
  group.userData.headGroup = headGroup;
  
  const headGeo = new THREE.SphereGeometry(1, 10, 8);
  const head = new THREE.Mesh(headGeo, furMat);
  head.scale.set(HAM_HEIGHT*0.28, HAM_HEIGHT*0.25, HAM_HEIGHT*0.25);
  head.castShadow = true;
  headGroup.add(head);
  
  // Глаза
  [-1,1].forEach(side=>{
    const ew = new THREE.Mesh(new THREE.SphereGeometry(0.035,8,6), eyeWhiteMat);
    ew.position.set(HAM_HEIGHT*0.15, HAM_HEIGHT*0.08, side*HAM_HEIGHT*0.15);
    headGroup.add(ew);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.02,6,4), pupilMat);
    pupil.position.set(HAM_HEIGHT*0.18, HAM_HEIGHT*0.08, side*HAM_HEIGHT*0.15);
    headGroup.add(pupil);
  });
  
  // Нос
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.025,6,4), noseMat);
  nose.position.set(HAM_HEIGHT*0.28, HAM_HEIGHT*0.0, 0);
  headGroup.add(nose);
  
  // Щёки
  [-1,1].forEach(side=>{
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.05,6,5), furMat);
    cheek.position.set(HAM_HEIGHT*0.12, -HAM_HEIGHT*0.02, side*HAM_HEIGHT*0.18);
    cheek.scale.set(1.2,0.9,1.0);
    headGroup.add(cheek);
  });
  
  // Уши
  group.userData.ears = [];
  [-1,1].forEach(side=>{
    const earOuter = new THREE.Mesh(new THREE.SphereGeometry(0.05,6,5), furMat);
    earOuter.scale.set(0.8,1.2,0.6);
    earOuter.position.set(-HAM_HEIGHT*0.05, HAM_HEIGHT*0.22, side*HAM_HEIGHT*0.15);
    headGroup.add(earOuter);
    const earInner = new THREE.Mesh(new THREE.SphereGeometry(0.035,6,5), earInnerMat);
    earInner.scale.set(0.6,1.0,0.4);
    earInner.position.set(-HAM_HEIGHT*0.02, HAM_HEIGHT*0.22, side*HAM_HEIGHT*0.16);
    headGroup.add(earInner);
    group.userData.ears.push(earOuter);
  });
  
  // Лапы (4)
  const legMat = new THREE.MeshStandardMaterial({color:colorHex, roughness:0.85});
  const pawMat = new THREE.MeshStandardMaterial({color:0xddccaa, roughness:0.7});
  const legs = [];
  const legPositions = [
    {x: HAM_LENGTH*0.25, z: HAM_HEIGHT*0.25},   // передняя правая
    {x: HAM_LENGTH*0.25, z: -HAM_HEIGHT*0.25},  // передняя левая
    {x:-HAM_LENGTH*0.25, z: HAM_HEIGHT*0.25},   // задняя правая
    {x:-HAM_LENGTH*0.25, z:-HAM_HEIGHT*0.25}    // задняя левая
  ];
  legPositions.forEach((lp,i)=>{
    const legGroup = new THREE.Group();
    legGroup.position.set(lp.x, HAM_HEIGHT*0.15, lp.z);
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.02,0.1,6), legMat);
    upper.position.y = -0.05;
    legGroup.add(upper);
    const paw = new THREE.Mesh(new THREE.SphereGeometry(0.025,5,4), pawMat);
    paw.position.y = -0.1;
    paw.scale.set(1,0.6,1.2);
    legGroup.add(paw);
    group.add(legGroup);
    legs.push(legGroup);
  });
  group.userData.legs = legs;
  
  // Хвост
  const tailMat = new THREE.MeshStandardMaterial({color:colorHex, roughness:0.85});
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.03,5,4), tailMat);
  tail.scale.set(1.5,0.8,0.8);
  tail.position.set(-HAM_LENGTH*0.45, HAM_HEIGHT*0.35, 0);
  group.add(tail);
  group.userData.tail = tail;
  
  return group;
}

// ============================================================
// КЛАСС ХОМЯКА С ФИЗИКОЙ И FSM
// ============================================================
const STATES = {IDLE:0, WALKING:1, ENTERING_WHEEL:2, RUNNING_IN_WHEEL:3, EXITING_WHEEL:4, ENTERING_TUBE:5, IN_TUBE:6, EATING:7};
const STATE_NAMES = ['стоит','идёт','входит в колесо','бежит в колесе','выходит из колеса','входит в трубу','ползёт по трубе','грызёт зёрна'];

const hamsters = [];
const HAMSTER_DATA = [
  {name:'Плюша', color:0xE8A838, pos:new THREE.Vector3(0,0,0)},
  {name:'Снежок', color:0xF5F5DC, pos:new THREE.Vector3(1,0,-0.5)},
  {name:'Уголёк', color:0x3a3a3a, pos:new THREE.Vector3(-1,0,0.5)},
  {name:'Рыжик', color:0xD2691E, pos:new THREE.Vector3(0.5,0,1)},
  {name:'Серый', color:0x888888, pos:new THREE.Vector3(-0.5,0,-1)}
];

HAMSTER_DATA.forEach((hd,i)=>{

    rotation: Math.random()*Math.PI*2,
    state: STATES.IDLE,
    stateTimer: Math.random()*3+1,
    target: new THREE.Vector3(),
    
    // Физика движения
    speed: 0,
    maxSpeed: 1.2 + Math.random()*0.4,
    pawPhase: 0,
    pawSpeed: 0,         // линейная скорость лап (для колеса)
    distanceTraveled: 0,
    strideLength: 0.15,
    
    // Колесо
    wheelAngle: 0,       // угол положения хомяка в колесе
    inWheel: false,
    wheelTransition: 0,  // 0=вне, 1=внутри
    
    // Труба
    tubeProgress: 0,     // 0..1 вдоль трубы
    inTube: false,
    
    // Еда
    eatingTimer: 0,
    
    // Анимация
    breathPhase: Math.random()*Math.PI*2,

// ============================================================
// ФИЗИКА КОЛЛИЗИЙ
// ============================================================
function getWheelWorldPos(){
  return new THREE.Vector3(
    wheelObj.position.x,
    WHEEL_R + 0.14,
    wheelObj.position.z
  );
}

function getTubeWorldPos(){
  return new THREE.Vector3(
    tubeObj.position.x,
    TUBE_OUTER_R + 0.14,
    tubeObj.position.z
  );
}

function getBowlWorldPos(){
  return new THREE.Vector3(bowlObj.position.x, 0.14, bowlObj.position.z);
}

// Проверка: находится ли точка внутри тела колеса (цилиндр вдоль Z)
function isInsideWheel(pos){
  const wc = getWheelWorldPos();
  const dx = pos.x - wc.x;
  const dz = pos.z - wc.z;
  const dist = Math.sqrt(dx*dx + dz*dz);
  return dist < WHEEL_R + 0.1 && Math.abs(pos.y - wc.y) < WHEEL_WIDTH/2 + 0.15;
}

// Выталкивание из колеса (для гуляющих)
function pushOutOfWheel(pos){
  const wc = getWheelWorldPos();
  const dx = pos.x - wc.x;
  const dz = pos.z - wc.z;
  const dist = Math.sqrt(dx*dx + dz*dz);
  if(dist < WHEEL_R + 0.15 && dist > 0.01){
    const pushDist = WHEEL_R + 0.15 - dist;
    pos.x += (dx/dist) * pushDist;
    pos.z += (dz/dist) * pushDist;
  }
}

// Выталкивание из трубы (для гуляющих — не входить сбоку)
function pushOutOfTube(pos){
  const tc = getTubeWorldPos();
  const dx = pos.x - tc.x;
  const dz = pos.z - tc.z;
  const distXZ = Math.sqrt(dx*dx + dz*dz);
  const alongAxis = Math.abs(pos.x - tc.x) < TUBE_LENGTH/2 + 0.2;
  
  if(alongAxis && distXZ < TUBE_OUTER_R + 0.15 && distXZ > 0.01){
    // Проверяем: если хомяк снаружи трубы (не на входе), выталкиваем
    const isNearEntry = Math.abs(Math.abs(pos.x - tc.x) - TUBE_LENGTH/2) < 0.3;
    if(!isNearEntry){
      const pushDist = TUBE_OUTER_R + 0.15 - distXZ;
      pos.z += (dz/distXZ) * pushDist;
    }
  }
}

// Выталкивание из миски
function pushOutOfBowl(pos){
  const bc = getBowlWorldPos();
  const dx = pos.x - bc.x;
  const dz = pos.z - bc.z;
  const dist = Math.sqrt(dx*dx + dz*dz);
  const minDist = BOWL_R + 0.15;
  if(dist < minDist && dist > 0.01){
    const pushDist = minDist - dist;
    pos.x += (dx/dist) * pushDist;
    pos.z += (dz/dist) * pushDist;
  }
}

// Границы клетки
function clampToCage(pos){
  const margin = 0.3;
  pos.x = Math.max(-CAGE_W/2+margin, Math.min(CAGE_W/2-margin, pos.x));
  pos.z = Math.max(-CAGE_D/2+margin, Math.min(CAGE_D/2-margin, pos.z));
}

// Столкновения между хомяками (мягкое расталкивание)
function resolveHamsterCollisions(){
  for(let i=0;i<hamsters.length;i++){
    for(let j=i+1;j<hamsters.length;j++){
      const a = hamsters[i], b = hamsters[j];
      if(a.inWheel || b.inWheel || a.inTube || b.inTube) continue;
      const dx = b.position.x - a.position.x;
      const dz = b.position.z - a.position.z;
      const dist = Math.sqrt(dx*dx + dz*dz);
      const minDist = (a.radius + b.radius)*1.5;
      if(dist < minDist && dist > 0.001){
        const push = (minDist - dist) * 0.5;
        const nx = dx/dist, nz = dz/dist;
        a.position.x -= nx*push;
        a.position.z -= nz*push;
        b.position.x += nx*push;
        b.position.z += nz*push;
      }
    }
  }
}

// ============================================================
// FSM — КОНЕЧНЫЙ АВТОМАТ ПОВЕДЕНИЯ
// ============================================================
function isWheelOccupied(){
  return hamsters.some(h => h.state === STATES.RUNNING_IN_WHEEL || h.state === STATES.ENTERING_WHEEL);
}

function isTubeOccupied(){
  return hamsters.some(h => h.state === STATES.IN_TUBE || h.state === STATES.ENTERING_TUBE);
}

function pickNewActivity(ham){
  const options = [];
  if(!isWheelOccupied()) options.push(STATES.ENTERING_WHEEL);
  if(!isTubeOccupied()) options.push(STATES.ENTERING_TUBE);
  options.push(STATES.WALKING);
  options.push(STATES.WALKING);
  options.push(STATES.EATING);
  
  const choice = options[Math.floor(Math.random()*options.length)];
  
  if(choice === STATES.ENTERING_WHEEL){
    const wc = getWheelWorldPos();
    // Подходим к колесу с стороны -Z (ближний вход)
    ham.target.set(wc.x, HAM_HEIGHT/2+0.14, wc.z + WHEEL_WIDTH/2 + 0.4);
    ham.state = STATES.WALKING;
    ham.stateTimer = 0;
    ham.nextStateAfterWalk = STATES.ENTERING_WHEEL;
  } else if(choice === STATES.ENTERING_TUBE){
    const tc = getTubeWorldPos();
    // Подходим к торцу трубы (левый вход)
    ham.target.set(tc.x - TUBE_LENGTH/2 - 0.3, HAM_HEIGHT/2+0.14, tc.z);
    ham.state = STATES.WALKING;
    ham.stateTimer = 0;
    ham.nextStateAfterWalk = STATES.ENTERING_TUBE;
  } else if(choice === STATES.EATING){
    const bc = getBowlWorldPos();
    ham.target.set(bc.x + BOWL_R + 0.2, HAM_HEIGHT/2+0.14, bc.z);
    ham.state = STATES.WALKING;
    ham.stateTimer = 0;
    ham.nextStateAfterWalk = STATES.EATING;
  } else {
    // Свободная прогулка
    ham.target.set(
      (Math.random()-0.5)*CAGE_W*0.7,
      HAM_HEIGHT/2+0.14,
      (Math.random()-0.5)*CAGE_D*0.7
    );
    ham.state = STATES.WALKING;
    ham.stateTimer = 0;
    ham.nextStateAfterWalk = STATES.IDLE;
  }
}

function updateFSM(ham, dt){
  switch(ham.state){
    case STATES.IDLE:
      ham.speed *= 0.9;
      ham.pawSpeed *= 0.9;
      ham.stateTimer -= dt;
      if(ham.stateTimer <= 0){
        pickNewActivity(ham);
      }
      break;
      
    case STATES.WALKING: {
      const dx = ham.target.x - ham.position.x;
      const dz = ham.target.z - ham.position.z;
      const dist = Math.sqrt(dx*dx + dz*dz);
      
      if(dist < 0.15){
        // Пришли к цели
        ham.speed = 0;
        ham.pawSpeed = 0;
        if(ham.nextStateAfterWalk === STATES.ENTERING_WHEEL){
          ham.state = STATES.ENTERING_WHEEL;
          ham.wheelTransition = 0;
          ham.stateTimer = 1.5;
        } else if(ham.nextStateAfterWalk === STATES.ENTERING_TUBE){
          ham.state = STATES.ENTERING_TUBE;
          ham.tubeProgress = 0;
          ham.stateTimer = 0.8;
        } else if(ham.nextStateAfterWalk === STATES.EATING){
          ham.state = STATES.EATING;
          ham.eatingTimer = 3 + Math.random()*4;
          ham.speed = 0;
          ham.pawSpeed = 0;
        } else {
          ham.state = STATES.IDLE;
          ham.stateTimer = 1 + Math.random()*3;
        }
      } else {
        // Идём к цели
        const targetRot = Math.atan2(dz, dx);
        let rotDiff = targetRot - ham.rotation;
        while(rotDiff > Math.PI) rotDiff -= Math.PI*2;
        while(rotDiff < -Math.PI) rotDiff += Math.PI*2;
        ham.rotation += rotDiff * Math.min(1, dt*5);
        
        ham.speed = Math.min(ham.maxSpeed, dist * 2);
        ham.pawSpeed = ham.speed;
        
        ham.position.x += Math.cos(ham.rotation) * ham.speed * dt;
        ham.position.z += Math.sin(ham.rotation) * ham.speed * dt;
        ham.distanceTraveled += ham.speed * dt;
      }
      break;
    }
    
    case STATES.ENTERING_WHEEL: {
      // Плавный переход внутрь колеса
      ham.wheelTransition = Math.min(1, ham.wheelTransition + dt*1.2);
      const wc = getWheelWorldPos();
      const startX = wc.x, startZ = wc.z + WHEEL_WIDTH/2 + 0.4;
      const endX = wc.x, endZ = wc.z;
      
      ham.position.x = startX + (endX-startX)*ham.wheelTransition;
      ham.position.z = startZ + (endZ-startZ)*ham.wheelTransition;
      ham.position.y = HAM_HEIGHT/2 + 0.14;
      
      ham.speed = 0.3 * (1-ham.wheelTransition);
      ham.pawSpeed = ham.speed;
      
      if(ham.wheelTransition >= 1){
        ham.state = STATES.RUNNING_IN_WHEEL;
        ham.inWheel = true;
        ham.wheelAngle = -Math.PI/2; // внизу колеса
        ham.stateTimer = 3 + Math.random()*5;
        ham.speed = 0;
      }
      break;
    }
    
    case STATES.RUNNING_IN_WHEEL: {
      const wc = getWheelWorldPos();
      
      // Хомяк бежит — его pawSpeed определяет угловую скорость колеса
      const runSpeed = 1.5 + Math.sin(ham.breathPhase*0.3)*0.3;
      ham.pawSpeed = runSpeed;
      ham.speed = 0; // позиция в мире не меняется
      
      // Хомяк на нижней точке обода
      ham.position.x = wc.x;
      ham.position.z = wc.z;
      ham.position.y = HAM_HEIGHT/2 + 0.14; // на уровне дна клетки (низ колеса)
      
      // Фаза шага привязана к pawSpeed
      ham.pawPhase += (ham.pawSpeed / ham.strideLength) * Math.PI * 2 * dt;
      
      // Угловая скорость колеса = pawSpeed / R
      // Направление: обод под лапами уходит назад (против направления взгляда хомяка)
      wheelObj.angularVelocity = -ham.pawSpeed / WHEEL_R;
      
      ham.stateTimer -= dt;
      if(ham.stateTimer <= 0){
        ham.state = STATES.EXITING_WHEEL;
        ham.wheelTransition = 1;
      }
      break;
    }
    
    case STATES.EXITING_WHEEL: {
      ham.wheelTransition = Math.max(0, ham.wheelTransition - dt*1.2);
      const wc = getWheelWorldPos();
      const startX = wc.x, startZ = wc.z;
      const endX = wc.x, endZ = wc.z + WHEEL_WIDTH/2 + 0.4;
      
      ham.position.x = startX + (endX-startX)*(1-ham.wheelTransition);
      ham.position.z = startZ + (endZ-startZ)*(1-ham.wheelTransition);
      ham.position.y = HAM_HEIGHT/2 + 0.14;
      
      ham.pawSpeed = 0.3 * ham.wheelTransition;
      ham.speed = ham.pawSpeed;
      
      if(ham.wheelTransition <= 0){
        ham.inWheel = false;
        ham.state = STATES.IDLE;
        ham.stateTimer = 1 + Math.random()*2;
        ham.pawSpeed = 0;
        wheelObj.angularVelocity = 0;
      }
      break;
    }
    
    case STATES.ENTERING_TUBE: {
      const tc = getTubeWorldPos();
      const entryX = tc.x - TUBE_LENGTH/2;
      const approachX = entryX - 0.3;
      
      ham.tubeProgress = Math.min(1, ham.tubeProgress + dt*1.5);
      ham.position.x = approachX + (entryX + 0.2 - approachX)*ham.tubeProgress;
      ham.position.z = tc.z;
      // Стоим на внутреннем дне трубы
      ham.position.y = 0.14 + TUBE_OUTER_R - TUBE_INNER_R + HAM_HEIGHT/2;
      
      ham.speed = 0.4 * (1-ham.tubeProgress*0.5);
      ham.pawSpeed = ham.speed;
      ham.distanceTraveled += ham.speed * dt;
      
      if(ham.tubeProgress >= 1){
        ham.state = STATES.IN_TUBE;
        ham.inTube = true;
        ham.tubeProgress = 0;
        ham.stateTimer = 2 + Math.random()*3;
      }
      break;
    }
    
    case STATES.IN_TUBE: {
      const tc = getTubeWorldPos();
      // Ползём вдоль оси трубы (X)
      const tubeSpeed = 0.5;
      ham.tubeProgress += tubeSpeed / TUBE_LENGTH * dt;
      ham.pawSpeed = tubeSpeed;
      ham.speed = tubeSpeed;
      ham.distanceTraveled += tubeSpeed * dt;
      
      ham.position.x = tc.x - TUBE_LENGTH/2 + 0.2 + ham.tubeProgress * (TUBE_LENGTH - 0.4);
      ham.position.z = tc.z;
      ham.position.y = 0.14 + TUBE_OUTER_R - TUBE_INNER_R + HAM_HEIGHT/2;
      ham.rotation = 0; // смотрим вдоль трубы
      
      if(ham.tubeProgress >= 1 || ham.stateTimer <= 0){
        ham.inTube = false;
        ham.state = STATES.IDLE;
        ham.stateTimer = 1 + Math.random()*2;
        ham.speed = 0;
        ham.pawSpeed = 0;
        // Выходим за торец
        ham.position.x = tc.x + TUBE_LENGTH/2 + 0.3;
      }
      ham.stateTimer -= dt;
      break;
    }
    
    case STATES.EATING: {
      ham.speed = 0;
      ham.pawSpeed = 0;
      ham.eatingTimer -= dt;
      
      // Жевание — голова наклоняется
      const chewPhase = performance.now()*0.008;
      if(ham.model.userData.headGroup){
        ham.model.userData.headGroup.rotation.x = Math.sin(chewPhase)*0.15 - 0.2;
      }
      
      if(ham.eatingTimer <= 0){
        ham.state = STATES.IDLE;
        ham.stateTimer = 1 + Math.random()*2;
      }
      break;
    }
  }
}

// ============================================================
// АНИМАЦИЯ ЛАП (фаза от пройденного пути)
// ============================================================
function updateLegAnimation(ham, dt){
  const legs = ham.model.userData.legs;
  if(!legs) return;
  
  // Фаза шага: привязана к пройденному пути
  if(ham.pawSpeed > 0.05){
    ham.pawPhase += (ham.pawSpeed / ham.strideLength) * Math.PI * 2 * dt;
  }
  // При остановке фаза не меняется — лапы замирают
  
  const phase = ham.pawPhase;
  // Диагональная пара: FL+RR, FR+RL
  const angles = [
    Math.sin(phase) * 0.5,           // FL
    Math.sin(phase + Math.PI) * 0.5, // FR
    Math.sin(phase + Math.PI) * 0.5, // RL
    Math.sin(phase) * 0.5            // RR
  ];
  
  for(let i=0;i<4;i++){
    legs[i].rotation.x = angles[i];
  }
}

// ============================================================
// АНИМАЦИЯ ДЫХАНИЯ И УШЕЙ
// ============================================================
function updateIdleAnimations(ham, dt){
  ham.breathPhase += dt * 2.5;
  const body = ham.model.userData.body;
  if(body){
    const breathScale = 1 + Math.sin(ham.breathPhase)*0.02;
    body.scale.x = HAM_LENGTH*0.45 * breathScale;
    body.scale.y = HAM_HEIGHT*0.4 * (1+Math.sin(ham.breathPhase)*0.015);
  }
  
  // Дёрганье ушей
  ham.earTwitchTimer -= dt;
  if(ham.earTwitchTimer <= 0){
    ham.earTwitch = 1;
    ham.earTwitchTimer = 3 + Math.random()*5;
  }
  if(ham.earTwitch > 0){
    ham.earTwitch -= dt*3;
    const ears = ham.model.userData.ears;
    if(ears){
      ears.forEach((ear,i)=>{
        ear.rotation.z = Math.sin(ham.earTwitch*10) * 0.3 * (i===0?1:-1);
      });
    }
  }
}

// ============================================================
// ПРЫЖОК ПО КЛИКУ
// ============================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (e)=>{
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  
  for(const ham of hamsters){
    const intersects = raycaster.intersectObjects(ham.model.children, true);
    if(intersects.length > 0 && !ham.inWheel && !ham.inTube){
      ham.jumpVel = 3.5;
      break;
    }
  }
});

function updateJump(ham, dt){
  if(ham.jumpVel !== 0 || ham.jumpY > 0){
    ham.jumpVel -= 12 * dt; // гравитация
    ham.jumpY += ham.jumpVel * dt;
    if(ham.jumpY <= 0){
      ham.jumpY = 0;
      ham.jumpVel = 0;
    }
  }
}

// ============================================================
// ОБНОВЛЕНИЕ КОЛЕСА (физика)
// ============================================================
function updateWheel(dt){
  // Если никто не бежит — трение замедляет колесо
  if(!isWheelOccupied()){
    const friction = WHEEL_FRICTION;
    if(Math.abs(wheelObj.angularVelocity) > 0.01){
      const sign = Math.sign(wheelObj.angularVelocity);
      wheelObj.angularVelocity -= sign * friction * dt;
      if(Math.sign(wheelObj.angularVelocity) !== sign) wheelObj.angularVelocity = 0;
    } else {
      wheelObj.angularVelocity = 0;
    }
  }
  
  // Визуальное вращение
  wheelObj.group.rotation.z += wheelObj.angularVelocity * dt;
}

// ============================================================
// ОБНОВЛЕНИЕ UI
// ============================================================
function updateUI(){
  let html = '';
  hamsters.forEach(h=>{
    const colorStr = '#' + h.model.userData.body.material.color.getHexString();
    html += `<div class="ham-status"><span class="ham-name" style="color:${colorStr}">${h.name}</span>: ${STATE_NAMES[h.state]}</div>`;
  });
  document.getElementById('ham-list').innerHTML = html;
  
  // Физика колеса
  const runningHam = hamsters.find(h=>h.state===STATES.RUNNING_IN_WHEEL);
  const pawSpd = runningHam ? runningHam.pawSpeed : 0;
  const wheelLinSpd = Math.abs(wheelObj.angularVelocity) * WHEEL_R;
  const discrepancy = pawSpd > 0.01 ? Math.abs(wheelLinSpd - pawSpd)/pawSpd * 100 : 0;
  
  let physHtml = `Скорость лап: <span class="val">${pawSpd.toFixed(3)} м/с</span><br>`;
  physHtml += `Лин. скорость обода (|ω|·R): <span class="val">${wheelLinSpd.toFixed(3)} м/с</span><br>`;
  physHtml += `Расхождение: <span class="val">${discrepancy.toFixed(2)}%</span><br>`;
  physHtml += `ω колеса: <span class="val">${wheelObj.angularVelocity.toFixed(4)} рад/с</span><br>`;
  physHtml += `R колеса: <span class="val">${WHEEL_R.toFixed(3)} м</span><br>`;
  physHtml += `Высота зверя: <span class="val">${HAM_HEIGHT.toFixed(3)} м</span><br>`;
  physHtml += `Запас R/высота: <span class="val">${(WHEEL_R/HAM_HEIGHT).toFixed(2)}x</span>`;
  document.getElementById('phys-info').innerHTML = physHtml;
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
let lastTime = performance.now();
let uiTimer = 0;

function animate(){
  requestAnimationFrame(animate);
  
  let dt = (performance.now() - lastTime) / 1000;
  lastTime = performance.now();
  dt = Math.min(dt, 0.05); // ограничение дельты
  
  // Обновление хомяков
  hamsters.forEach(ham=>{
    updateFSM(ham, dt);
    updateLegAnimation(ham, dt);
    updateIdleAnimations(ham, dt);
    updateJump(ham, dt);
    
    // Коллизии с предметами (только для гуляющих)
    if(!ham.inWheel && !ham.inTube && ham.state !== STATES.EATING){
      pushOutOfWheel(ham.position);
      pushOutOfTube(ham.position);
      pushOutOfBowl(ham.position);
    }
    clampToCage(ham.position);
    
    // Обновление модели
    ham.model.position.x = ham.position.x;
    ham.model.position.z = ham.position.z;
    ham.model.position.y = ham.position.y + ham.jumpY;
    ham.model.rotation.y = -ham.rotation + Math.PI/2;
    
    // В колесе: поворот тела вдоль касательной (бежит "вниз" по ободу)
    if(ham.state === STATES.RUNNING_IN_WHEEL){
      // Хомяк стоит на дне колеса, ориентация — вдоль касательной к ободу
      ham.model.rotation.y = -Math.PI/2;
      ham.model.rotation.z = 0;
    }
  });
  
  resolveHamsterCollisions();
  updateWheel(dt);
  
  // UI обновление не каждый кадр
  uiTimer += dt;
  if(uiTimer > 0.2){
    uiTimer = 0;
    updateUI();
  }
  
  controls.update();
  renderer.render(scene, camera);
}

animate();

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
