<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>3D Клетка с хомяками — честная физика</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: monospace; }
canvas { display: block; }
#panel {
  position: fixed; top: 10px; right: 10px; width: 280px;
  background: rgba(0,0,0,0.85); color: #0f0; padding: 12px;
  border-radius: 6px; font-size: 11px; line-height: 1.5;
  max-height: 90vh; overflow-y: auto; border: 1px solid #0a0;
}
#panel h3 { color: #0ff; margin-bottom: 4px; font-size: 12px; }
#panel .hamster-row { margin: 3px 0; padding: 2px 4px; border-left: 3px solid #555; }
#panel .physics-check { margin-top: 8px; padding: 6px; background: rgba(0,50,0,0.5); border: 1px solid #0a0; border-radius: 3px; }
#panel .ok { color: #0f0; }
#panel .warn { color: #ff0; }
</style>
</head>
<body>
<div id="panel"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
// CONSTANTS — габариты зверя и размеры предметов
// ============================================================
const HAMSTER_LENGTH = 0.7;
const HAMSTER_HEIGHT = 0.45;
const HAMSTER_WIDTH = 0.35;

// Радиус колеса вычислен ОТ размера хомяка
const WHEEL_INNER_RADIUS = Math.max(HAMSTER_LENGTH, HAMSTER_HEIGHT) * 1.4 + 0.2;
const WHEEL_THICKNESS = 0.08;
const WHEEL_WIDTH = HAMSTER_WIDTH * 2.5; // шире боков зверя

// Труба: радиус > габарит хомяка
const TUBE_INNER_RADIUS = HAMSTER_HEIGHT * 1.3 + 0.1;
const TUBE_LENGTH = 4.5;
const TUBE_WALL = 0.06;

// Миска
const BOWL_RADIUS = 0.4;
const BOWL_DEPTH = 0.2;

// Клетка
const CAGE_W = 9, CAGE_D = 7, CAGE_H = 4.5;

// Физика
const WHEEL_FRICTION = 2.0;
const HAMSTER_RUN_SPEED = 2.5;
const HAMSTER_WALK_SPEED = 1.2;
const STRIDE_LENGTH = 0.35;
const GRAVITY = 9.8;

// ============================================================
// SCENE SETUP
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 25, 60);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.set(8, 7, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Lights
const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 30;
dirLight.shadow.camera.left = -10;
dirLight.shadow.camera.right = 10;
dirLight.shadow.camera.top = 10;
dirLight.shadow.camera.bottom = -10;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
fillLight.position.set(-3, 5, -5);
scene.add(fillLight);

const pointLight = new THREE.PointLight(0xffaa44, 0.4, 15);
pointLight.position.set(0, 6, 0);
scene.add(pointLight);

// ============================================================
// ROOM ENVIRONMENT
// ============================================================
function buildRoom() {
  // Floor
  const floorGeo = new THREE.PlaneGeometry(40, 40);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.9 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Walls
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xE8DCC8, roughness: 0.95 });
  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 12), wallMat);
  backWall.position.set(0, 6, -15);
  backWall.receiveShadow = true;
  scene.add(backWall);

  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 12), wallMat);
  leftWall.position.set(-15, 6, 0);
  leftWall.rotation.y = Math.PI/2;
  leftWall.receiveShadow = true;
  scene.add(leftWall);

  const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 12), wallMat);
  rightWall.position.set(15, 6, 0);
  rightWall.rotation.y = -Math.PI/2;
  rightWall.receiveShadow = true;
  scene.add(rightWall);

  // Table
  const tableTop = new THREE.Mesh(
    new THREE.BoxGeometry(14, 0.3, 11),
    new THREE.MeshStandardMaterial({ color: 0x6B4226, roughness: 0.7 })
  );
  tableTop.position.set(0, 1.5, 0);
  tableTop.castShadow = true;
  tableTop.receiveShadow = true;
  scene.add(tableTop);

  // Table legs
  const legGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.5);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x4A2F1A });
  [[-6,-4],[6,-4],[-6,4],[6,4]].forEach(([x,z]) => {
    const leg = new THREE.Mesh(legGeo, legMat);
    leg.position.set(x, 0.75, z);
    leg.castShadow = true;
    scene.add(leg);
  });
}

// ============================================================
// CAGE
// ============================================================
function buildCage() {
  const cageGroup = new THREE.Group();
  cageGroup.position.set(0, 1.65, 0);

  // Tray (bottom)
  const trayMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.6, roughness: 0.3 });
  const trayBottom = new THREE.Mesh(new THREE.BoxGeometry(CAGE_W, 0.15, CAGE_D), trayMat);
  trayBottom.position.y = 0.075;
  trayBottom.receiveShadow = true;
  cageGroup.add(trayBottom);

  // Tray walls
  const wallThick = 0.1;
  const trayWallMat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.5, roughness: 0.4 });
  const tw1 = new THREE.Mesh(new THREE.BoxGeometry(CAGE_W, 0.8, wallThick), trayWallMat);
  tw1.position.set(0, 0.55, -CAGE_D/2 + wallThick/2);
  cageGroup.add(tw1);
  const tw2 = tw1.clone(); tw2.position.z = CAGE_D/2 - wallThick/2; cageGroup.add(tw2);
  const tw3 = new THREE.Mesh(new THREE.BoxGeometry(wallThick, 0.8, CAGE_D), trayWallMat);
  tw3.position.set(-CAGE_W/2 + wallThick/2, 0.55, 0); cageGroup.add(tw3);
  const tw4 = tw3.clone(); tw4.position.x = CAGE_W/2 - wallThick/2; cageGroup.add(tw4);

  // Bars (vertical)
  const barMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8, roughness: 0.2 });
  const barGeo = new THREE.CylinderGeometry(0.03, 0.03, CAGE_H);
  const barSpacing = 0.4;

  // Front and back bars
  for (let x = -CAGE_W/2 + barSpacing; x < CAGE_W/2; x += barSpacing) {
    let b = new THREE.Mesh(barGeo, barMat);
    b.position.set(x, CAGE_H/2 + 0.95, -CAGE_D/2);
    b.castShadow = true;
    cageGroup.add(b);
    b = b.clone(); b.position.z = CAGE_D/2; cageGroup.add(b);
  }
  // Left and right bars
  for (let z = -CAGE_D/2 + barSpacing; z < CAGE_D/2; z += barSpacing) {
    let b = new THREE.Mesh(barGeo, barMat);
    b.position.set(-CAGE_W/2, CAGE_H/2 + 0.95, z);
    b.castShadow = true;
    cageGroup.add(b);
    b = b.clone(); b.position.x = CAGE_W/2; cageGroup.add(b);
  }

  // Top frame
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.7, roughness: 0.3 });
  const topY = CAGE_H + 0.95;
  const tf1 = new THREE.Mesh(new THREE.BoxGeometry(CAGE_W + 0.1, 0.08, 0.08), frameMat);
  tf1.position.set(0, topY, -CAGE_D/2); cageGroup.add(tf1);
  const tf2 = tf1.clone(); tf2.position.z = CAGE_D/2; cageGroup.add(tf2);
  const tf3 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, CAGE_D + 0.1), frameMat);
  tf3.position.set(-CAGE_W/2, topY, 0); cageGroup.add(tf3);
  const tf4 = tf3.clone(); tf4.position.x = CAGE_W/2; cageGroup.add(tf4);

  // Top cross bars
  for (let x = -CAGE_W/2 + barSpacing; x < CAGE_W/2; x += barSpacing) {
    let b = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, CAGE_D), frameMat);
    b.position.set(x, topY, 0);
    b.rotation.x = Math.PI/2;
    cageGroup.add(b);
  }

  scene.add(cageGroup);
  return cageGroup;
}

// ============================================================
// BEDDING (InstancedMesh)
// ============================================================
function buildBedding() {
  const count = 600;
  const geo = new THREE.BoxGeometry(0.12, 0.02, 0.04);
  const mat = new THREE.MeshStandardMaterial({ color: 0xDEB887, roughness: 0.9 });
  const mesh = new THREE.InstancedMesh(geo, mat, count);
  mesh.receiveShadow = true;

  const dummy = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    dummy.position.set(
      (Math.random() - 0.5) * (CAGE_W - 1),
      0.16 + Math.random() * 0.05,
      (Math.random() - 0.5) * (CAGE_D - 1)
    );
    dummy.rotation.set(Math.random()*0.5, Math.random()*Math.PI*2, Math.random()*0.3);
    dummy.scale.set(0.5 + Math.random()*1.5, 0.5+Math.random(), 0.5+Math.random()*1.5);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }

  const cageGroup = scene.children.find(c => c.type === 'Group' && c.position.y > 1.5);
  if (cageGroup) cageGroup.add(mesh);
  else { mesh.position.y = 1.65; scene.add(mesh); }
  return mesh;
}

// ============================================================
// WHEEL
// ============================================================
const wheel = {
  position: new THREE.Vector3(-3, 1.65 + WHEEL_INNER_RADIUS + 0.2, -2.5),
  radius: WHEEL_INNER_RADIUS,
  width: WHEEL_WIDTH,
  thickness: WHEEL_THICKNESS,
  angularVelocity: 0,
  angle: 0,
  occupant: null,
  friction: WHEEL_FRICTION,
  group: null,

  // Get surface linear speed at bottom
  getSurfaceSpeed() { return Math.abs(this.angularVelocity) * this.radius; },

  update(dt) {
    if (!this.occupant) {
      // Friction: exponential decay
      this.angularVelocity *= Math.exp(-this.friction * dt);
      if (Math.abs(this.angularVelocity) < 0.005) this.angularVelocity = 0;
    }
    this.angle += this.angularVelocity * dt;

    if (this.group) {
      // Wheel rotates around its local Z axis (axis is along Z in world)
      this.group.rotation.z = this.angle;
    }
  },

  // Get world position of bottom inner surface point
  getBottomInnerPos() {
    return new THREE.Vector3(
      this.position.x,
      this.position.y - this.radius + HAMSTER_HEIGHT * 0.5,
      this.position.z
    );
  },

  // Collision: treat as cylinder in XZ plane (axis along Z)
  getCollisionRadius() { return this.radius + 0.1; },
};

function buildWheel() {
  const group = new THREE.Group();
  group.position.copy(wheel.position);

  const rimMat = new THREE.MeshStandardMaterial({ color: 0xCC6633, roughness: 0.6 });
  const spokeMat = new THREE.MeshStandardMaterial({ color: 0xAA5522, roughness: 0.7 });

  // Outer rim
  const rimGeo = new THREE.TorusGeometry(wheel.radius, wheel.thickness, 8, 40);
  const rim = new THREE.Mesh(rimGeo, rimMat);
  rim.castShadow = true;
  group.add(rim);

  // Inner rim (slightly smaller, for the running surface)
  const innerRimGeo = new THREE.TorusGeometry(wheel.radius - 0.05, wheel.thickness * 0.7, 8, 40);
  const innerRim = new THREE.Mesh(innerRimGeo, rimMat);
  group.add(innerRim);

  // Cross-bars (rungs) for the running surface
  const rungCount = 20;
  const rungGeo = new THREE.BoxGeometry(0.04, 0.04, wheel.width * 0.9);
  for (let i = 0; i < rungCount; i++) {
    const a = (i / rungCount) * Math.PI * 2;
    const rung = new THREE.Mesh(rungGeo, spokeMat);
    rung.position.set(
      Math.cos(a) * (wheel.radius - 0.05),
      Math.sin(a) * (wheel.radius - 0.05),
      0
    );
    rung.castShadow = true;
    group.add(rung);
  }

  // Side discs (transparent-ish to see inside)
  const discGeo = new THREE.RingGeometry(wheel.radius * 0.3, wheel.radius, 32);
  const discMat = new THREE.MeshStandardMaterial({ color: 0xDD8844, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
  const disc1 = new THREE.Mesh(discGeo, discMat);
  disc1.position.z = wheel.width / 2;
  group.add(disc1);
  const disc2 = new THREE.Mesh(discGeo, discMat);
  disc2.position.z = -wheel.width / 2;
  group.add(disc2);

  // Axle
  const axleGeo = new THREE.CylinderGeometry(0.05, 0.05, wheel.width + 0.5);
  const axleMat = new THREE.MeshStandardMaterial({ color: 0x666666, metalness: 0.8 });
  const axle = new THREE.Mesh(axleGeo, axleMat);
  axle.rotation.x = Math.PI / 2;
  group.add(axle);

  // Support stand
  const standMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.7 });
  const standGeo = new THREE.BoxGeometry(0.1, wheel.radius + 0.3, 0.1);
  const stand1 = new THREE.Mesh(standGeo, standMat);
  stand1.position.set(0, -(wheel.radius + 0.3)/2 + 0.15, wheel.width/2 + 0.15);
  stand1.castShadow = true;
  group.add(stand1);
  const stand2 = stand1.clone();
  stand2.position.z = -wheel.width/2 - 0.15;
  group.add(stand2);

  wheel.group = group;
  scene.add(group);
}

// ============================================================
// TUBE
// ============================================================
const tube = {
  position: new THREE.Vector3(2, 1.65 + TUBE_INNER_RADIUS + 0.1, 1.5),
  radius: TUBE_INNER_RADIUS,
  length: TUBE_LENGTH,
  axis: new THREE.Vector3(1, 0, 0), // along X
  wallThickness: TUBE_WALL,
  occupant: null,

  getStart() {
    return new THREE.Vector3(
      this.position.x - this.length/2,
      this.position.y,
      this.position.z
    );
  },
  getEnd() {
    return new THREE.Vector3(
      this.position.x + this.length/2,
      this.position.y,
      this.position.z
    );
  },

  // Inner floor Y (where hamster stands inside)
  getInnerFloorY() {
    return this.position.y - this.radius + HAMSTER_HEIGHT * 0.5;
  },

  update(dt) {}
};

function buildTube() {
  const group = new THREE.Group();
  group.position.copy(tube.position);
  group.rotation.y = Math.PI / 2; // axis along X

  // Open cylinder (no caps)
  const tubeGeo = new THREE.CylinderGeometry(
    tube.radius + tube.wallThickness,
    tube.radius + tube.wallThickness,
    tube.length,
    24, 1, true
  );
  const tubeMat = new THREE.MeshStandardMaterial({
    color: 0x4488AA, transparent: true, opacity: 0.7, side: THREE.DoubleSide, roughness: 0.3
  });
  const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
  tubeMesh.rotation.x = Math.PI / 2;
  tubeMesh.castShadow = true;
  group.add(tubeMesh);

  // Inner surface (slightly smaller, different color)
  const innerGeo = new THREE.CylinderGeometry(
    tube.radius, tube.radius, tube.length, 24, 1, true
  );
  const innerMat = new THREE.MeshStandardMaterial({
    color: 0x66AACC, transparent: true, opacity: 0.4, side: THREE.BackSide, roughness: 0.5
  });
  const innerMesh = new THREE.Mesh(innerGeo, innerMat);
  innerMesh.rotation.x = Math.PI / 2;
  group.add(innerMesh);

  // Rings at ends for visual clarity
  const ringGeo = new THREE.TorusGeometry(tube.radius + tube.wallThickness/2, tube.wallThickness/2, 8, 24);
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x3377AA });
  const ring1 = new THREE.Mesh(ringGeo, ringMat);
  ring1.position.y = tube.length / 2;
  group.add(ring1);
  const ring2 = ring1.clone();
  ring2.position.y = -tube.length / 2;
  group.add(ring2);

  scene.add(group);
}

// ============================================================
// BOWL
// ============================================================
const bowl = {
  position: new THREE.Vector3(3, 1.65 + BOWL_DEPTH * 0.5, -2),
  radius: BOWL_RADIUS,
  depth: BOWL_DEPTH,

  getCollisionRadius() { return this.radius + 0.15; }
};

function buildBowl() {
  const group = new THREE.Group();
  group.position.copy(bowl.position);

  // Bowl shape (lathe)
  const points = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    const r = bowl.radius * Math.sin(t * Math.PI * 0.5);
    const y = -bowl.depth + t * bowl.depth;
    points.push(new THREE.Vector2(r, y));
  }
  points.push(new THREE.Vector2(bowl.radius + 0.05, 0.02));
  points.push(new THREE.Vector2(bowl.radius + 0.05, -0.02));

  const bowlGeo = new THREE.LatheGeometry(points, 16);
  const bowlMat = new THREE.MeshStandardMaterial({ color: 0xCC4444, roughness: 0.4 });
  const bowlMesh = new THREE.Mesh(bowlGeo, bowlMat);
  bowlMesh.castShadow = true;
  group.add(bowlMesh);

  // Seeds inside
  const seedGeo = new THREE.SphereGeometry(0.04, 6, 6);
  const seedMat = new THREE.MeshStandardMaterial({ color: 0xFFCC00 });
  for (let i = 0; i < 15; i++) {
    const seed = new THREE.Mesh(seedGeo, seedMat);
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * bowl.radius * 0.6;
    seed.position.set(Math.cos(a)*r, -bowl.depth*0.3 + Math.random()*0.05, Math.sin(a)*r);
    seed.scale.set(0.8+Math.random()*0.4, 1.2+Math.random()*0.5, 0.6+Math.random()*0.3);
    group.add(seed);
  }

  scene.add(group);
}

// ============================================================
// WATER BOTTLE
// ============================================================
function buildWaterBottle() {
  const group = new THREE.Group();
  group.position.set(CAGE_W/2 - 0.3, 1.65 + 2.5, 0);

  const bottleGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.2, 12);
  const bottleMat = new THREE.MeshStandardMaterial({ color: 0x88CCFF, transparent: true, opacity: 0.5 });
  const bottle = new THREE.Mesh(bottleGeo, bottleMat);
  group.add(bottle);

  // Water level
  const waterGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.8, 12);
  const waterMat = new THREE.MeshStandardMaterial({ color: 0x4488FF, transparent: true, opacity: 0.6 });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.position.y = -0.1;
  group.add(water);

  // Metal cap + tube
  const capGeo = new THREE.CylinderGeometry(0.16, 0.12, 0.15, 12);
  const capMat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.8 });
  const cap = new THREE.Mesh(capGeo, capMat);
  cap.position.y = -0.65;
  group.add(cap);

  const spoutGeo = new THREE.CylinderGeometry(0.02, 0.015, 0.4);
  const spout = new THREE.Mesh(spoutGeo, capMat);
  spout.position.set(-0.25, -0.8, 0);
  spout.rotation.z = Math.PI / 2;
  group.add(spout);

  // Holder ring
  const holderGeo = new THREE.TorusGeometry(0.18, 0.02, 8, 12);
  const holder = new THREE.Mesh(holderGeo, capMat);
  holder.position.y = 0.3;
  group.add(holder);

  scene.add(group);
}

// ============================================================
// HAMSTER MODEL
// ============================================================
function createHamster(color) {
  const group = new THREE.Group();
  const furMat = new THREE.MeshStandardMaterial({ color, roughness: 0.85 });
  const bellyMat = new THREE.MeshStandardMaterial({ color: 0xFFF5E0, roughness: 0.9 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

  // Body
  const bodyGeo = new THREE.SphereGeometry(1, 12, 10);
  bodyGeo.scale(HAMSTER_LENGTH/2, HAMSTER_HEIGHT/2, HAMSTER_WIDTH/2);
  const body = new THREE.Mesh(bodyGeo, furMat);
  body.castShadow = true;
  group.add(body);

  // Belly
  const bellyGeo = new THREE.SphereGeometry(1, 10, 8);
  bellyGeo.scale(HAMSTER_LENGTH*0.4, HAMSTER_HEIGHT*0.35, HAMSTER_WIDTH*0.4);
  const belly = new THREE.Mesh(bellyGeo, bellyMat);
  belly.position.set(-0.02, -HAMSTER_HEIGHT*0.15, 0);
  group.add(belly);

  // Head group (for nodding)
  const headGroup = new THREE.Group();
  headGroup.position.set(HAMSTER_LENGTH * 0.45, HAMSTER_HEIGHT * 0.1, 0);

  const headGeo = new THREE.SphereGeometry(1, 10, 8);
  headGeo.scale(0.2, 0.18, 0.17);
  const head = new THREE.Mesh(headGeo, furMat);
  head.castShadow = true;
  headGroup.add(head);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.045, 8, 8);
  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  const eyeL = new THREE.Mesh(eyeGeo, eyeWhiteMat);
  eyeL.position.set(0.12, 0.05, 0.1);
  headGroup.add(eyeL);
  const eyeR = eyeL.clone();
  eyeR.position.z = -0.1;
  headGroup.add(eyeR);

  // Pupils
  const pupilGeo = new THREE.SphereGeometry(0.02, 6, 6);
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF });
  const pupilL = new THREE.Mesh(pupilGeo, pupilMat);
  pupilL.position.set(0.145, 0.06, 0.11);
  headGroup.add(pupilL);
  const pupilR = pupilL.clone();
  pupilR.position.z = -0.11;
  headGroup.add(pupilR);

  // Cheeks
  const cheekGeo = new THREE.SphereGeometry(0.08, 8, 6);
  const cheekMat = new THREE.MeshStandardMaterial({ color: 0xFFDDCC, roughness: 0.9 });
  const cheekL = new THREE.Mesh(cheekGeo, cheekMat);
  cheekL.position.set(0.08, -0.04, 0.12);
  cheekL.scale.set(1, 0.8, 0.7);
  headGroup.add(cheekL);
  const cheekR = cheekL.clone();
  cheekR.position.z = -0.12;
  headGroup.add(cheekR);

  // Nose
  const noseGeo = new THREE.SphereGeometry(0.03, 6, 6);
  const noseMat = new THREE.MeshStandardMaterial({ color: 0xFF8888 });
  const nose = new THREE.Mesh(noseGeo, noseMat);
  nose.position.set(0.19, 0.0, 0);
  headGroup.add(nose);

  // Ears
  const earOuterGeo = new THREE.SphereGeometry(0.07, 8, 6);
  earOuterGeo.scale(1, 1.2, 0.4);
  const earL = new THREE.Mesh(earOuterGeo, furMat);
  earL.position.set(-0.02, 0.15, 0.1);
  headGroup.add(earL);
  const earR = earL.clone();
  earR.position.z = -0.1;
  headGroup.add(earR);

  const earInnerGeo = new THREE.SphereGeometry(0.05, 6, 5);
  earInnerGeo.scale(1, 1.1, 0.3);
  const earInnerMat = new THREE.MeshStandardMaterial({ color: 0xFFAAAA });
  const earInnerL = new THREE.Mesh(earInnerGeo, earInnerMat);
  earInnerL.position.set(-0.02, 0.15, 0.11);
  headGroup.add(earInnerL);
  const earInnerR = earInnerL.clone();
  earInnerR.position.z = -0.11;
  headGroup.add(earInnerR);

  group.add(headGroup);

  // Legs (4)
  const legGeo = new THREE.CylinderGeometry(0.04, 0.035, 0.15, 6);
  const legs = [];
  const legPositions = [
    { x: HAMSTER_LENGTH*0.25, z: HAMSTER_WIDTH*0.35 },   // FL
    { x: HAMSTER_LENGTH*0.25, z: -HAMSTER_WIDTH*0.35 },  // FR
    { x: -HAMSTER_LENGTH*0.25, z: HAMSTER_WIDTH*0.35 },  // BL
    { x: -HAMSTER_LENGTH*0.25, z: -HAMSTER_WIDTH*0.35 }, // BR
  ];
  legPositions.forEach((pos, i) => {
    const leg = new THREE.Group();
    const mesh = new THREE.Mesh(legGeo, furMat);
    mesh.position.y = -HAMSTER_HEIGHT/2 - 0.07;
    mesh.castShadow = true;
    leg.add(mesh);
    leg.position.set(pos.x, 0, pos.z);
    group.add(leg);
    legs.push(leg);
  });

  // Tail
  const tailGeo = new THREE.CylinderGeometry(0.025, 0.015, 0.12, 6);
  const tail = new THREE.Mesh(tailGeo, furMat);
  tail.position.set(-HAMSTER_LENGTH/2 - 0.05, 0, 0);
  tail.rotation.z = Math.PI * 0.3;
  group.add(tail);

  return { group, body, belly, headGroup, legs, tail, cheekL, cheekR, earL, earR };
}

// ============================================================
// HAMSTER CLASS + STATE MACHINE
// ============================================================
const hamsters = [];

class Hamster {
  constructor(name, color, startPos) {
    this.name = name;
    this.color = color;
    this.pos = startPos.clone();
    this.vel = new THREE.Vector3();
    this.facing = Math.random() * Math.PI * 2;
    this.targetFacing = this.facing;
    this.state = 'idle';
    this.stateTimer = 0;
    this.target = null;
    this.pawPhase = 0;
    this.distanceTraveled = 0;
    this.runSpeed = HAMSTER_RUN_SPEED;
    this.breathPhase = Math.random() * Math.PI * 2;
    this.earTwitch = 0;
    this.earTwitchTimer = Math.random() * 3;
    this.jumpVel = 0;
    this.jumpY = 0;
    this.chewPhase = 0;
    this.headNod = 0;

    // State-specific data
    this.wheelEntryProgress = 0;
    this.tubeProgress = 0;
    this.tubeDirection = 1;

    const parts = createHamster(color);
    this.parts = parts;
    this.group = parts.group;
    this.group.position.copy(this.pos);
    scene.add(this.group);
  }

  get runSpeedCurrent() {
    if (this.state === 'in_wheel') return this.runSpeed;
    if (this.state === 'walking' || this.state === 'walking_to') return HAMSTER_WALK_SPEED;
    return 0;
  }

  update(dt) {
    this.stateTimer += dt;
    this.breathPhase += dt * 2.5;
    this.earTwitchTimer -= dt;
    if (this.earTwitchTimer <= 0) {
      this.earTwitch = 1;
      this.earTwitchTimer = 2 + Math.random() * 4;
    }
    if (this.earTwitch > 0) this.earTwitch *= Math.exp(-8 * dt);

    // Jump
    if (this.jumpY > 0 || this.jumpVel > 0) {
      this.jumpVel -= GRAVITY * dt;
      this.jumpY += this.jumpVel * dt;
      if (this.jumpY <= 0) { this.jumpY = 0; this.jumpVel = 0; }
    }

    // State machine
    switch(this.state) {
      case 'idle': this.updateIdle(dt); break;
      case 'walking_to': this.updateWalkingTo(dt); break;
      case 'walking': this.updateWalking(dt); break;
      case 'in_wheel': this.updateInWheel(dt); break;
      case 'entering_wheel': this.updateEnteringWheel(dt); break;
      case 'exiting_wheel': this.updateExitingWheel(dt); break;
      case 'in_tube': this.updateInTube(dt); break;
      case 'eating': this.updateEating(dt); break;
    }

    // Update paw phase from distance traveled
    const speed = this.getActualSpeed();
    if (speed > 0.01) {
      this.pawPhase += (speed * dt / STRIDE_LENGTH) * Math.PI * 2;
    }
    // When stopped, pawPhase doesn't change (requirement 1.5 & check #6)

    // Apply visual
    this.updateVisuals(dt);
  }

  getActualSpeed() {
    if (this.state === 'in_wheel') {
      return Math.abs(wheel.angularVelocity) * wheel.radius;
    }
    return this.vel.length();
  }

  updateIdle(dt) {
    if (this.stateTimer > 1.5 + Math.random() * 2) {
      this.chooseActivity();
    }
  }

  chooseActivity() {
    const activities = [];

    // Wheel: only if not occupied
    if (!wheel.occupant) {
      activities.push('wheel', 'wheel'); // higher weight
    }
    // Tube: only if not occupied
    if (!tube.occupant) {
      activities.push('tube', 'tube');
    }
    // Bowl: always available
    activities.push('bowl', 'bowl', 'bowl');
    // Walk around
    activities.push('walk', 'walk');

    const choice = activities[Math.floor(Math.random() * activities.length)];

    switch(choice) {
      case 'wheel':
        this.target = wheel.position.clone();
        this.target.y = 1.65 + 0.1; // ground level near wheel
        this.state = 'walking_to';
        this.stateTimer = 0;
        this.nextStateAfterArrive = 'entering_wheel';
        break;
      case 'tube':
        // Choose random entry end
        this.tubeDirection = Math.random() > 0.5 ? 1 : -1;
        this.target = this.tubeDirection === 1 ? tube.getStart().clone() : tube.getEnd().clone();
        this.target.y = 1.65 + 0.1;
        this.state = 'walking_to';
        this.stateTimer = 0;
        this.nextStateAfterArrive = 'in_tube';
        this.tubeProgress = 0;
        break;
      case 'bowl':
        this.target = bowl.position.clone();
        this.target.y = 1.65 + 0.1;
        // Offset slightly so not all hamsters at exact same spot
        this.target.x += (Math.random()-0.5) * 0.8;
        this.target.z += (Math.random()-0.5) * 0.8;
        this.state = 'walking_to';
        this.stateTimer = 0;
        this.nextStateAfterArrive = 'eating';
        break;
      case 'walk':
        this.target = new THREE.Vector3(
          (Math.random()-0.5) * (CAGE_W - 2),
          1.65 + 0.1,
          (Math.random()-0.5) * (CAGE_D - 2)
        );
        this.state = 'walking_to';
        this.stateTimer = 0;
        this.nextStateAfterArrive = 'idle';
        break;
    }
  }

  updateWalkingTo(dt) {
    const toTarget = new THREE.Vector3().subVectors(this.target, this.pos);
    toTarget.y = 0;
    const dist = toTarget.length();

    if (dist < 0.3) {
      // Arrived
      if (this.nextStateAfterArrive === 'entering_wheel') {
        this.state = 'entering_wheel';
        this.stateTimer = 0;
        this.wheelEntryProgress = 0;
      } else if (this.nextStateAfterArrive === 'in_tube') {
        this.state = 'in_tube';
        this.stateTimer = 0;
        tube.occupant = this;
      } else if (this.nextStateAfterArrive === 'eating') {
        this.state = 'eating';
        this.stateTimer = 0;
      } else {
        this.state = 'idle';
        this.stateTimer = 0;
      }
      this.vel.set(0,0,0);
      return;
    }

    // Move toward target
    const dir = toTarget.normalize();
    const speed = HAMSTER_WALK_SPEED;
    this.vel.copy(dir).multiplyScalar(speed);
    this.pos.add(this.vel.clone().multiplyScalar(dt));
    this.targetFacing = Math.atan2(dir.x, dir.z);

    // Apply collisions with objects
    this.applyObjectCollisions();
  }

  updateWalking(dt) {
    if (this.stateTimer > 2 + Math.random() * 3) {
      this.state = 'idle';
      this.stateTimer = 0;
      this.vel.set(0,0,0);
    }
    const speed = HAMSTER_WALK_SPEED * 0.7;
    this.vel.x = Math.cos(this.facing) * speed;
    this.vel.z = Math.sin(this.facing) * speed;
    this.pos.add(this.vel.clone().multiplyScalar(dt));
    this.applyObjectCollisions();
  }

  updateEnteringWheel(dt) {
    // Smoothly move from ground to wheel bottom position
    const targetPos = wheel.getBottomInnerPos();
    this.wheelEntryProgress += dt * 2.0; // takes ~0.5s

    if (this.wheelEntryProgress >= 1) {
      this.wheelEntryProgress = 1;
      this.state = 'in_wheel';
      this.stateTimer = 0;
      wheel.occupant = this;
      this.pos.copy(targetPos);
    } else {
      const t = this.smoothstep(this.wheelEntryProgress);
      const startPos = this.target.clone();
      startPos.y = 1.65 + 0.1;
      this.pos.lerpVectors(startPos, targetPos, t);
    }
  }

  updateInWheel(dt) {
    // Hamster stays at bottom of wheel, running
    const bottomPos = wheel.getBottomInnerPos();
    this.pos.copy(bottomPos);

    // Set wheel angular velocity from hamster's run speed
    // ω = -v/R (negative so surface moves backward relative to hamster's facing)
    const v = this.runSpeed;
    wheel.angularVelocity = -v / wheel.radius;

    // Hamster faces tangent direction at bottom (which is +X if axis is Z)
    // Actually, the hamster faces along the tangent. At the bottom of a wheel
    // with axis along Z, the tangent is along X.
    this.targetFacing = Math.PI / 2; // facing +X (or -X depending on rotation direction)
    // Since wheel rotates clockwise (ω < 0), bottom surface moves in -X,
    // so hamster faces +X to "run forward"
    this.targetFacing = Math.PI / 2;

    this.vel.set(0, 0, 0); // position doesn't change in world

    // Leave after a while
    if (this.stateTimer > 4 + Math.random() * 5) {
      wheel.occupant = null;
      this.state = 'exiting_wheel';
      this.stateTimer = 0;
      this.wheelEntryProgress = 0;
      // Set exit target to ground near wheel
      this.target = new THREE.Vector3(
        wheel.position.x + (Math.random()-0.5)*1,
        1.65 + 0.1,
        wheel.position.z + 1.5
      );
    }
  }

  updateExitingWheel(dt) {
    const startPos = wheel.getBottomInnerPos();
    this.wheelEntryProgress += dt * 2.0;

    if (this.wheelEntryProgress >= 1) {
      this.pos.copy(this.target);
      this.state = 'idle';
      this.stateTimer = 0;
    } else {
      const t = this.smoothstep(this.wheelEntryProgress);
      this.pos.lerpVectors(startPos, this.target, t);
    }
  }

  updateInTube(dt) {
    // Move along tube axis
    const speed = HAMSTER_WALK_SPEED * 0.8;
    this.tubeProgress += (speed / tube.length) * dt * this.tubeDirection;

    if (this.tubeProgress >= 1 || this.tubeProgress <= 0) {
      // Exit
      tube.occupant = null;
      const exitEnd = this.tubeDirection > 0 ? tube.getEnd() : tube.getStart();
      this.pos.copy(exitEnd);
      this.pos.y = 1.65 + 0.1;
      this.state = 'idle';
      this.stateTimer = 0;
      return;
    }

    // Position along axis, on inner floor
    const t = (this.tubeProgress + 0.5); // map [0,1] to [-0.5, 0.5] of tube length... 
    // Actually tubeProgress goes from 0 to 1 (or 1 to 0)
    // Map to world position
    const startPos = this.tubeDirection > 0 ? tube.getStart() : tube.getEnd();
    const endPos = this.tubeDirection > 0 ? tube.getEnd() : tube.getStart();
    this.pos.lerpVectors(startPos, endPos, this.tubeProgress);
    this.pos.y = tube.getInnerFloorY();

    // Face along axis
    this.targetFacing = this.tubeDirection > 0 ? 0 : Math.PI;

    this.vel.set(0,0,0);
  }

  updateEating(dt) {
    if (this.stateTimer > 3 + Math.random() * 3) {
      this.state = 'idle';
      this.stateTimer = 0;
      return;
    }
    this.chewPhase += dt * 8;
    this.headNod = Math.sin(this.chewPhase) * 0.1;
    this.vel.set(0,0,0);

    // Face bowl
    const toBowl = new THREE.Vector3().subVectors(bowl.position, this.pos);
    toBowl.y = 0;
    if (toBowl.length() > 0.01) {
      this.targetFacing = Math.atan2(toBowl.x, toBowl.z);
    }
  }

  applyObjectCollisions() {
    // Wheel collision (cylinder, axis along Z)
    this.collideWithWheel();
    // Tube collision (cylinder, axis along X)
    this.collideWithTube();
    // Bowl collision (sphere)
    this.collideWithBowl();
    // Hamster-hamster repulsion
    this.collideWithHamsters();
    // Cage walls
    this.constrainToCage();
  }

  collideWithWheel() {
    if (this.state === 'in_wheel' || this.state === 'entering_wheel' || this.state === 'exiting_wheel') return;

    const dx = this.pos.x - wheel.position.x;
    const dz = this.pos.z - wheel.position.z;
    const distXZ = Math.sqrt(dx*dx + dz*dz);
    const minDist = wheel.radius + 0.25;

    if (distXZ < minDist && Math.abs(this.pos.y - wheel.position.y) < wheel.width) {
      // Push out radially in XZ
      if (distXZ > 0.01) {
        const pushDir = new THREE.Vector2(dx, dz).normalize();
        this.pos.x = wheel.position.x + pushDir.x * minDist;
        this.pos.z = wheel.position.z + pushDir.y * minDist;
      }
    }
  }

  collideWithTube() {
    if (this.state === 'in_tube') return;

    // Tube axis is along X
    const dx = this.pos.x - tube.position.x;
    const dz = this.pos.z - tube.position.z;
    const halfLen = tube.length / 2;

    // Check if within tube's X range (with some margin for entry)
    const inXRange = Math.abs(dx) < halfLen + 0.3;

    if (inXRange) {
      const radialDist = Math.abs(dz);
      const minRadial = tube.radius + 0.2;
      if (radialDist < minRadial && Math.abs(this.pos.y - tube.position.y) < tube.radius + 0.3) {
        // Push out in Z
        const pushSign = dz >= 0 ? 1 : -1;
        this.pos.z = tube.position.z + pushSign * minRadial;
      }
    }
  }

  collideWithBowl() {
    const dx = this.pos.x - bowl.position.x;
    const dz = this.pos.z - bowl.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    const minDist = bowl.radius + 0.2;

    if (dist < minDist && dist > 0.01) {
      const pushDir = new THREE.Vector2(dx, dz).normalize();
      this.pos.x = bowl.position.x + pushDir.x * minDist;
      this.pos.z = bowl.position.z + pushDir.y * minDist;
    }
  }

  collideWithHamsters() {
    for (const other of hamsters) {
      if (other === this) continue;
      const dx = this.pos.x - other.pos.x;
      const dz = this.pos.z - other.pos.z;
      const dist = Math.sqrt(dx*dx + dz*dz);
      const minDist = HAMSTER_LENGTH * 0.7;

      if (dist < minDist && dist > 0.01) {
        const push = (minDist - dist) * 0.5;
        const nx = dx / dist, nz = dz / dist;
        this.pos.x += nx * push;
        this.pos.z += nz * push;
      }
    }
  }

  constrainToCage() {
    const margin = 0.5;
    const hw = CAGE_W/2 - margin, hd = CAGE_D/2 - margin;
    this.pos.x = Math.max(-hw, Math.min(hw, this.pos.x));
    this.pos.z = Math.max(-hd, Math.min(hd, this.pos.z));
  }

  smoothstep(t) {
    t = Math.max(0, Math.min(1, t));
    return t * t * (3 - 2 * t);
  }

  updateVisuals(dt) {
    // Smooth facing rotation
    let angleDiff = this.targetFacing - this.facing;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    this.facing += angleDiff * Math.min(1, dt * 8);

    // Position
    this.group.position.set(this.pos.x, this.pos.y + this.jumpY, this.pos.z);
    this.group.rotation.y = this.facing;

    // Breathing (idle)
    const breathScale = 1 + Math.sin(this.breathPhase) * 0.02;
    this.parts.body.scale.set(
      HAMSTER_LENGTH/2 * breathScale,
      HAMSTER_HEIGHT/2 * (1 + Math.sin(this.breathPhase) * 0.03),
      HAMSTER_WIDTH/2 * breathScale
    );

    // Head nod (eating)
    this.parts.headGroup.rotation.x = this.headNod;

    // Ear twitch
    const earAngle = this.earTwitch * 0.3;
    this.parts.earL.rotation.z = earAngle;
    this.parts.earR.rotation.z = -earAngle;

    // Paw animation (diagonal pairs)
    const phase = this.pawPhase;
    // FL & BR together, FR & BL together
    const swing1 = Math.sin(phase) * 0.4;
    const swing2 = Math.sin(phase + Math.PI) * 0.4;

    this.parts.legs[0].rotation.x = swing1; // FL
    this.parts.legs[1].rotation.x = swing2; // FR
    this.parts.legs[2].rotation.x = swing2; // BL
    this.parts.legs[3].rotation.x = swing1; // BR

    // Tail wiggle
    this.parts.tail.rotation.y = Math.sin(this.breathPhase * 1.5) * 0.15;

    // Chew animation (cheek puffing when eating)
    if (this.state === 'eating') {
      const chew = Math.abs(Math.sin(this.chewPhase * 0.5)) * 0.15;
      this.parts.cheekL.scale.set(1 + chew, 0.8 + chew*0.5, 0.7 + chew*0.3);
      this.parts.cheekR.scale.set(1 + chew, 0.8 + chew*0.5, 0.7 + chew*0.3);
    } else {
      this.parts.cheekL.scale.set(1, 0.8, 0.7);
      this.parts.cheekR.scale.set(1, 0.8, 0.7);
    }
  }

  getStateText() {
    switch(this.state) {
      case 'idle': return 'стоит';
      case 'walking_to': return 'идёт к ' + (this.nextStateAfterArrive === 'entering_wheel' ? 'колесу' : this.nextStateAfterArrive === 'in_tube' ? 'трубе' : this.nextStateAfterArrive === 'eating' ? 'миске' : 'цели');
      case 'walking': return 'гуляет';
      case 'entering_wheel': return 'забирается в колесо';
      case 'in_wheel': return 'бежит в колесе';
      case 'exiting_wheel': return 'выходит из колеса';
      case 'in_tube': return 'ползёт по трубе';
      case 'eating': return 'грызёт зёрна';
      default: return this.state;
    }
  }

  jump() {
    if (this.jumpY <= 0) {
      this.jumpVel = 3.5;
    }
  }
}

// CREATE HAMSTERS
// ============================================================
const hamsterDefs = [
  { name: 'Пушок', color: 0xFFAA44 },
  { name: 'Снежок', color: 0xF5F5DC },
  { name: 'Уголёк', color: 0x444444 },
  { name: 'Рыжик', color: 0xE07020 },
  { name: 'Серый', color: 0x888899 },
];

const startY = 1.65 + 0.1;
hamsterDefs.forEach((def, i) => {
  const angle = (i / hamsterDefs.length) * Math.PI * 2;
  const r = 1.5;
  const h = new Hamster(def.name, def.color, new THREE.Vector3(
    Math.cos(angle) * r,
    startY,
    Math.sin(angle) * r
  ));
  hamsters.push(h);
});

// ============================================================
// CLICK HANDLER
// ============================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  for (const h of hamsters) {
    const intersects = raycaster.intersectObjects(h.group.children, true);
    if (intersects.length > 0) {
      h.jump();
      break;
    }
  }
});

// ============================================================
// UI PANEL
// ============================================================
const panel = document.getElementById('panel');

function updatePanel() {
  let html = '<h3>🐹 Хомяки</h3>';
  for (const h of hamsters) {
    const stateColor = h.state === 'in_wheel' ? '#0f0' : h.state === 'in_tube' ? '#0af' : h.state === 'eating' ? '#ff0' : '#888';
    html += `<div class="hamster-row" style="border-color:${stateColor}"><b>${h.name}</b>: ${h.getStateText()}</div>`;
  }

  // Physics check
  const surfaceSpeed = wheel.getSurfaceSpeed();
  const runner = wheel.occupant;
  const runnerSpeed = runner ? runner.runSpeed : 0;
  const discrepancy = runner && runnerSpeed > 0.01 ? Math.abs(surfaceSpeed - runnerSpeed) / runnerSpeed * 100 : 0;

  html += '<div class="physics-check"><h3>⚙️ Физика колеса</h3>';
  html += `Скорость лап (v): ${runnerSpeed.toFixed(3)} м/с<br>`;
  html += `|ω|·R: ${surfaceSpeed.toFixed(3)} м/с<br>`;
  html += `ω: ${wheel.angularVelocity.toFixed(3)} рад/с<br>`;
  html += `Расхождение: <span class="${discrepancy < 5 ? 'ok' : 'warn'}">${discrepancy.toFixed(2)}%</span><br>`;
  html += `Занято: ${runner ? runner.name : 'нет'}<br>`;

  // Tube check
  if (tube.occupant) {
    const tOff = tube.occupant.pos.clone().sub(tube.position);
    const radialOffset = Math.sqrt(tOff.y*tOff.y + tOff.z*tOff.z);
    html += `<br><b>Труба</b>: ${tube.occupant.name}<br>`;
    html += `Отклонение от оси: ${radialOffset.toFixed(4)}<br>`;
  }

  // Paw phase check
  const movingHamsters = hamsters.filter(h => h.getActualSpeed() > 0.01);
  const stoppedHamsters = hamsters.filter(h => h.getActualSpeed() <= 0.01);
  html += `<br><b>Лапы</b>: движутся ${movingHamsters.length}, стоят ${stoppedHamsters.length}`;

  html += '</div>';
  panel.innerHTML = html;
}

// ============================================================
// ANIMATION LOOP
// ============================================================
let lastTime = performance.now();
let panelTimer = 0;

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  dt = Math.min(dt, 0.05); // cap delta

  // Update wheel physics
  wheel.update(dt);

  // Update hamsters
  for (const h of hamsters) {
    h.update(dt);
  }

  controls.update();
  renderer.render(scene, camera);

  // Update panel every 100ms
  panelTimer += dt;
  if (panelTimer > 0.1) {
    panelTimer = 0;
    updatePanel();
  }
}

animate();

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
