<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #bfe3f8; font-family: 'Segoe UI', Tahoma, sans-serif; }
  #app { position: fixed; inset: 0; }
  .hud {
    position: fixed; left: 16px; bottom: 16px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(8px);
    padding: 14px 20px; border-radius: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.13);
    max-width: 270px; line-height: 1.5;
    pointer-events: none; user-select: none;
  }
  .hud h1 { font-size: 18px; color: #c0392b; margin-bottom: 4px; }
  .hud p { font-size: 12px; color: #555; }
  .hud .tag { display:inline-block; background:#ffe0e6; color:#c0392b; font-weight:700; padding:1px 8px; border-radius:8px; font-size:11px; margin-top:6px;}
  .count { position: fixed; top: 16px; right: 16px; background: rgba(255,255,255,0.82); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 12px; font-size: 13px; color:#555; box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
</style>
</head>
<body>
<div id="app"></div>
<div class="count">🐹 <span id="hcount">0</span> hamsters</div>
<div class="hud">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to orbit · scroll to zoom · hamsters wander, snack &amp; race the wheel!</p>
  <span class="tag">click a hamster to pet it</span>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';

/* ───────── renderer / scene / camera ───────── */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3f8);
scene.fog = new THREE.Fog(0xbfe3f8, 14, 30);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(6.5, 6.5, 9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0.8, 0);
controls.minDistance = 5;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI / 2.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

/* ───────── lights ───────── */
scene.add(new THREE.HemisphereLight(0xffffff, 0xc9a0d0, 0.75));
const sun = new THREE.DirectionalLight(0xfff6e0, 1.55);
sun.position.set(6, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 40;
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.bias = 0.0004;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.35));

/* ───────── constants ───────── */
const CAGE = 7, WALL_H = 3.2, HALF = CAGE / 2;

/* ───────── floor / tray ───────── */
const trayGeo = new THREE.BoxGeometry(CAGE + 0.4, 0.3, CAGE + 0.4);
const trayMat = new THREE.MeshStandardMaterial({ color: 0x5fb8d8, roughness: 0.8 });
const tray = new THREE.Mesh(trayGeo, trayMat);
tray.position.y = -0.15; tray.receiveShadow = true;
scene.add(tray);

// bedding
const bedGeo = new THREE.PlaneGeometry(CAGE, CAGE, 22, 22);
const bedPos = bedGeo.attributes.position.array.slice();
for (let i = 0; i < bedPos.length; i += 3) {
  bedPos[i]  += (Math.random() - 0.5) * 0.25;
  bedPos[i+1] += (Math.random() - 0.5) * 0.25;
}
bedGeo.attributes.position.setArray(bedPos);
bedGeo.computeVertexNormals();
const bedMat = new THREE.MeshStandardMaterial({ color: 0xfde9c7, roughness: 1, flatShading: true });
const bed = new THREE.Mesh(bedGeo, bedMat);
bed.rotation.x = -Math.PI / 2; bed.position.y = 0.01; bed.receiveShadow = true;
scene.add(bed);

// scatter bedding clumps
const clumpMat = new THREE.MeshStandardMaterial({ color: 0xfcefcf, roughness: 1, flatShading: true });
for (let i = 0; i < 26; i++) {
  const c = new THREE.Mesh(new THREE.IcosahedronGeometry(0.09 + Math.random()*0.09, 0), clumpMat);
  c.position.set((Math.random()-0.5)*CAGE, 0.06, (Math.random()-0.5)*CAGE);
  c.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
  c.scale.setScalar(1, 0.4 + Math.random()*0.6, 1);
  scene.add(c);
}

/* ───────── cage walls (transparent acrylic) ───────── */
const wallMat = new THREE.MeshPhysicalMaterial({
  color: 0xbfe8ff, transmission: 0.85, transparent: true, opacity: 0.28,
  roughness: 0.2, thickness: 0.4, side: THREE.DoubleSide, ior: 1.2
});
function addWall(x, z, ry) {
  const w = new THREE.Mesh(new THREE.PlaneGeometry(CAGE, WALL_H), wallMat);
  w.position.set(x, WALL_H/2, z); w.rotation.y = ry; scene.add(w);
}
addWall(0,  HALF, Math.PI/2);
addWall(0, -HALF, -Math.PI/2);
addWall( HALF, 0, Math.PI);
addWall(-HALF, 0, 0);

// metal frame posts
const postMat = new THREE.MeshStandardMaterial({ color: 0xd0d5dd, metalness: 0.9, roughness: 0.3 });
for (const [px, pz] of [[HALF,HALF],[HALF,-HALF],[-HALF,HALF],[-HALF,-HALF]]) {
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, WALL_H, 8), postMat);
  p.position.set(px, WALL_H/2, pz); scene.add(p);
}

/* ───────── interactive object : running wheel ───────── */
const wheel = new THREE.Group();
const wheelMat = new THREE.MeshStandardMaterial({ color: 0xff8a5c, roughness: 0.5, metalness: 0.1, flatShading: true });
const rimMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.4, metalness: 0.1, flatShading: true });
const hub = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.35, 4, 8), wheelMat);
hub.rotation.z = Math.PI/2; wheel.add(hub);
for (const s of [-1, 1]) {
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.06, 20), rimMat);
  disc.rotation.x = Math.PI/2; disc.position.x = s * 0.2; wheel.add(disc);
}
const spokes = 10;
for (let i = 0; i < spokes; i++) {
  const a = (i / spokes) * Math.PI * 2;
  const sp = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.04, 0.04), wheelMat);
  sp.position.set(0, Math.cos(a) * 0.42, Math.sin(a) * 0.42);
  sp.rotation.x = a; wheel.add(sp);
}
const rungs = 24;
for (let i = 0; i < rungs; i++) {
  const a = (i / rungs) * Math.PI * 2;
  const r = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.82), wheelMat);
  r.position.set(Math.cos(a) * 0.5, 0, Math.sin(a) * 0.5);
  r.rotation.y = a; wheel.add(r);
}
wheel.position.set(-2.4, 0.9, -2);
const WHEEL_R = 0.55, WHEEL_Y = 0.9;
scene.add(wheel);

/* ───────── food bowl ───────── */
const bowl = new THREE.Group();
const bowlMat = new THREE.MeshStandardMaterial({ color: 0x7ec8e3, roughness: 0.4, flatShading: true });
const bowlMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.32, 0.28, 16, 1, true), bowlMat);
bowlMesh.castShadow = true; bowl.add(bowlMesh);
const btm = new THREE.Mesh(new THREE.CircleGeometry(0.32, 16), bowlMat);
btm.rotation.x = -Math.PI/2; btm.position.y = -0.14; bowl.add(btm);
const foodMat = new THREE.MeshStandardMaterial({ color: 0xc8863b, roughness: 1, flatShading: true });
for (let i = 0; i < 14; i++) {
  const seed = new THREE.Mesh(new THREE.IcosahedronGeometry(0.05 + Math.random()*0.03, 0), foodMat);
  const ang = Math.random()*Math.PI*2, rad = Math.random()*0.32;
  seed.position.set(Math.cos(ang)*rad, 0.06 + Math.random()*0.08, Math.sin(ang)*rad);
  bowl.add(seed);
}
bowl.position.set(2.6, 0.14, 2.2); bowl.castShadow = true;
scene.add(bowl);

/* ───────── tunnel ───────── */
const tunnel = new THREE.Group();
const tunMat = new THREE.MeshStandardMaterial({ color: 0xa0d468, roughness: 0.7, side: THREE.DoubleSide, flatShading: true });
const tSegs = 16;
for (let i = 0; i < tSegs; i++) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.05, 6, 14), tunMat);
  ring.position.z = -1 + (i/(tSegs-1))*2;
  ring.rotation.x = Math.PI/2; tunnel.add(ring);
}
const tunCover = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2, 16, 1, false, 0, Math.PI), tunMat);
tunCover.rotation.z = Math.PI/2; tunCover.scale.y = 0.3; tunnel.add(tunCover);
tunnel.position.set(1.8, 0.5, -2.2); tunnel.rotation.y = -0.4;
scene.add(tunnel);

/* ───────── chew toy ───────── */
const toy = new THREE.Group();
const toyMat = new THREE.MeshStandardMaterial({ color: 0xff6b9d, roughness: 0.6, flatShading: true });
const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 1), toyMat);
ball.castShadow = true; toy.add(ball);
for (let i = 0; i < 6; i++) {
  const spike = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.22, 6),
    new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.6, flatShading: true }));
  const dir = new THREE.Vector3(
    Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
  spike.position.copy(dir).multiplyScalar(0.35);
  spike.lookAt(0,0,0); toy.add(spike);
}
toy.position.set(-2.6, 0.42, 2.4); scene.add(toy);

/* ───────── hamster factory ───────── */
const PALETTE = [
  { body: 0xffb6c1, belly: 0xffe4e9, name: 'Blush' },
  { body: 0xffd93d, belly: 0xfff3b0, name: 'Mango' },
  { body: 0xc9aef0, belly: 0xf0e4ff, name: 'Grape' },
  { body: 0x8bd4e8, belly: 0xd6f2ff, name: 'Sky' },
  { body: 0xff9f43, belly: 0xffe4c4, name: 'Pumpkin' },
];

function makeHamster(def) {
  const g = new THREE.Group();
  const B = new THREE.MeshStandardMaterial({ color: def.body, roughness: 0.85, flatShading: true });
  const BY = new THREE.MeshStandardMaterial({ color: def.belly, roughness: 0.85, flatShading: true });
  const D = new THREE.MeshStandardMaterial({ color: 0x2b1a1a, roughness: 0.4 });
  const P = new THREE.MeshStandardMaterial({ color: 0xff8fa3, roughness: 0.8 });

  // body
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 12), B);
  body.scale.set(1, 0.92, 1.25); body.position.y = 0.4; body.castShadow = true; g.add(body);
  // belly
  const bel = new THREE.Mesh(new THREE.SphereGeometry(0.33, 12, 10), BY);
  bel.scale.set(0.95, 0.85, 1.05); bel.position.set(0, 0.34, 0.18); g.add(bel);
  // head
  const head = new THREE.Group(); head.position.y = 0.5; g.add(head);
  const hd = new THREE.Mesh(new THREE.SphereGeometry(0.32, 14, 12), B);
  hd.castShadow = true; head.add(hd);
  // cheeks
  for (const s of [-1, 1]) {
    const ck = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), B);
    ck.position.set(s*0.26, -0.03, 0.02); head.add(ck);
  }
  // ears
  for (const s of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.2, 8), B);
    ear.position.set(s*0.18, 0.28, 0.02); ear.rotation.z = s*-0.3; head.add(ear);
    const inr = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.14, 8), P);
    inr.position.set(s*0.18, 0.28, 0.04); inr.rotation.z = s*-0.3; head.add(inr);
  }
  // eyes
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.065, 10, 8), D);
    eye.position.set(s*0.14, 0.06, 0.26); head.add(eye);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.022, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    glint.position.set(s*0.13, 0.08, 0.3); head.add(glint);
  }
  // nose
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), P);
  nose.position.set(0, -0.04, 0.32); head.add(nose);
  // feet
  for (const s of [-1, 1]) for (const f of [-1, 1]) {
    const ft = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), P);
    ft.scale.set(1, 0.5, 1.4);
    ft.position.set(s*0.2, 0.08, f*0.18); g.add(ft);
  }
  // tail
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), P);
  tail.position.set(0, 0.34, -0.48); g.add(tail);

  g.userData.head = head;
  return g;
}

const hamsters = [];
const RADIUS = HALF - 0.9;
for (let i = 0; i < 5; i++) {
  const def = PALETTE[i % PALETTE.length];
  const h = makeHamster(def);
  const a = (i / 5) * Math.PI * 2;
  h.position.set(Math.cos(a)*RADIUS, 0.1, Math.sin(a)*RADIUS);
  h.userData.name = def.name;
  h.userData.state = 'idle';
  h.userData.timer = Math.random()*3;
  h.userData.wobble = Math.random()*Math.PI*2;
  h.userData.speed = 1 + Math.random()*0.6;
  h.userData.legPhase = Math.random()*Math.PI*2;
  scene.add(h);
  hamsters.push(h);
}
document.getElementById('hcount').textContent = hamsters.length;

/* ───────── behaviour state machine ───────── */
function pickState(h) {
  const r = Math.random();
  if (r < 0.42) {
    h.userData.state = 'walk';
    h.userData.dir = Math.random()*Math.PI*2;
    h.userData.walkDur = 2 + Math.random()*4;
    h.userData.timer = h.userData.walkDur;
  } else if (r < 0.72) {
    h.userData.state = 'snack';
    h.userData.timer = 1.5 + Math.random()*2;
    // find nearest snackable object
    let best = null, bd = 1e9;
    for (const o of [bowl, tunnel, toy]) {
      const d = h.position.distanceTo(o.position);
      if (d < bd) { bd = d; best = o; }
    }
    h.userData.target = best;
    h.userData.interactFace = Math.random() < 0.5 ? h.position.clone().sub(best).angleZ ? null : Math.atan2(h.position.z-best.position.z, h.position.x-best.position.x) : 0;
    h.userData.faceAngle = Math.atan2(h.position.z - best.position.z, h.position.x - best.position.x);
  } else if (r < 0.88) {
    h.userData.state = 'wheel';
    h.userData.timer = 2 + Math.random()*3;
  } else {
    h.userData.state = 'idle';
    h.userData.timer = 1 + Math.random()*2.5;
  }
}

/* ───────── pet feedback ───────── */
const petting = new Set();
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
addEventListener('pointerdown', e => {
  ndc.x = (e.clientX/innerWidth)*2 - 1;
  ndc.y = -(e.clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(hamsters, true);
  if (hits.length) {
    let obj = hits[0].object;
    while (obj.parent && !hamsters.includes(obj)) obj = obj.parent;
    if (hamsters.includes(obj)) {
      petting.add(obj);
      obj.userData.state = 'pet';
      obj.userData.timer = 1.6;
      obj.userData.pulse = 0;
      const idx = hamsters.indexOf(obj);
      document.getElementById('hcount').textContent = Math.max(1, hamsters.length - 1 + idx);
    }
  }
});

/* ───────── animation loop ───────── */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // wheel spin
  const wheelBusy = hamsters.some(h => h.userData.state === 'wheel');
  wheel.rotation.x += (wheelBusy ? 6 : 0.35) * dt;

  // bob toy
  toy.position.y = 0.42 + Math.sin(t*2)*0.04;
  toy.rotation.y += dt*0.5;

  for (const h of hamsters) {
    const u = h.userData;
    u.wobble += dt;

    // ---- state update ----
    u.timer -= dt;
    if (u.timer <= 0) pickState(h);

    let facing = h.rotation.y, moving = false, animSpeed = 0;

    if (u.state === 'walk') {
      moving = true; animSpeed = 7;
      const desired = u.dir;
      let diff = desired - facing;
      while (diff >  Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;
      facing += Math.max(-1.5*dt, Math.min(1.5*dt, diff));
      h.position.x += Math.cos(u.dir) * 1.6 * u.speed * dt;
      h.position.z += Math.sin(u.dir) * 1.6 * u.speed * dt;
      clampHam(h);
    }
    else if (u.state === 'snack') {
      if (u.target) {
        moving = true; animSpeed = 4;
        const dx = u.target.position.x - h.position.x;
        const dz = u.target.position.z - h.position.z;
        const dist = Math.hypot(dx, dz);
        if (dist > 0.15) {
          const da = Math.atan2(dx, dz);
          let dd = da - facing;
          while (dd > Math.PI) dd -= Math.PI*2;
          while (dd < -Math.PI) dd += Math.PI*2;
          facing += Math.max(-2*dt, Math.min(2*dt, dd));
          h.position.x += (dx/dist) * 1.2 * dt;
          h.position.z += (dz/dist) * 1.2 * dt;
        } else {
          facing = u.faceAngle; // face the object
        }
      }
    }
    else if (u.state === 'wheel') {
      facing = wheel.rotation.y + Math.PI/2; // orient to wheel rotation
      // position hamster on the running surface
      const wx = wheel.position.x, wz = wheel.position.z;
      const rr = WHEEL_R;
      const ang = t * 4; // follow wheel
      h.position.x = wx + Math.cos(ang) * rr;
      h.position.z = wz + Math.sin(ang) * rr;
      h.position.y = WHEEL_Y - 0.02;
      moving = true; animSpeed = 14;
    }
    else if (u.state === 'pet') {
      // happy little bounce handled below
    }

    h.rotation.y = facing;

    // ---- leg animation ----
    const lp = u.legPhase;
    const step = moving ? Math.sin(t*animSpeed + lp) : 0;
    h.children.forEach((child, i) => {
      // feet are the 4 last-added children (indices 12..15)
      if (i >= 12 && i <= 15) {
        const fx = (i===12||i===13) ? (i===12?-0.2:0.2) : 0;
        const fz = (i===14||i===15) ? (i===14?-0.18:0.18) : 0;
        const ph = (i-12) * Math.PI/2;
        child.position.y = 0.08 + Math.max(0, -step*0.12)*(i%2?1:0.6);
        child.position.z = fz + step*0.1*(i<14?1:-1);
      }
    });

    // ---- body bobble ----
    const bob = moving ? Math.abs(Math.sin(t*animSpeed+lp))*0.06 : 0;
    h.position.y = (h.userData.state==='wheel'?WHEEL_Y-0.02:0.1) + bob;
    h.rotation.z = moving ? Math.sin(t*animSpeed+lp)*0.05 : 0;

    // ---- head sniff when idle/snack ----
    if (u.head) {
      const sniff = (u.state==='snack'||u.state==='idle') ? Math.sin(t*3+lp)*0.06 : 0;
      u.head.rotation.x = sniff;
    }

    // ---- pet pulse ----
    if (u.state === 'pet') {
      u.pulse += dt;
      const p = Math.sin(u.pulse*12);
      h.scale.setScalar(1 + p*0.05);
      // hearts-ish sparkle via head tilt
      u.head.rotation.z = Math.sin(u.pulse*8)*0.15;
    } else {
      h.scale.lerp(new THREE.Vector3(1,1,1), 0.15);
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

function clampHam(h) {
  const lim = HALF - 0.5;
  h.position.x = Math.max(-lim, Math.min(lim, h.position.x));
  h.position.z = Math.max(-lim, Math.min(lim, h.position.z));
}

animate();

/* ───────── resize ───────── */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
