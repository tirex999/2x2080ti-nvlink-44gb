<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #cde4f0; font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; display: block; }
  canvas { display: block; }
  #title {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    color: #7a4a2b; font-size: clamp(18px, 4vw, 30px); font-weight: bold;
    text-shadow: 1px 1px 0 #fff, 2px 2px 4px rgba(0,0,0,.15);
    pointer-events: none; white-space: nowrap; z-index: 10; text-align: center;
  }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: #5a6b70; font-size: 13px; background: rgba(255,255,255,.55);
    padding: 6px 16px; border-radius: 20px; pointer-events: none; white-space: nowrap;
    z-index: 10; backdrop-filter: blur(4px);
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #cde4f0; color: #7a4a2b; font-size: 22px; z-index: 100; transition: opacity .6s;
  }
</style>
</head>
<body>
<div id="loading">🐹 Loading…</div>
<div id="title">🐹 Low-Poly Hamster Playground 🐹</div>
<div id="hint">🖱️ Drag to rotate · Scroll to zoom · Watch the hamsters go!</div>
<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
//  SCENE
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe6f5);
scene.fog = new THREE.Fog(0xbfe6f5, 30, 60);

// ============================================================
//  CAMERA  (perspective)
// ============================================================
const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(9, 8, 13);

// ============================================================
//  RENDERER
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// ============================================================
//  CONTROLS  (orbit — drag to rotate, scroll to zoom)
// ============================================================
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 1, 0);
controls.minDistance = 6;
controls.maxDistance = 32;
controls.maxPolarAngle = Math.PI * 0.49;   // keep above ground
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

// ============================================================
//  LIGHTS
// ============================================================
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const hemi = new THREE.HemisphereLight(0xffffff, 0xffe0b2, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff7e6, 1.05);
sun.position.set(8, 16, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 55;
sun.shadow.camera.left = -18; sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18;   sun.shadow.camera.bottom = -18;
sun.shadow.bias = -0.0006;
scene.add(sun);

// ============================================================
//  CAGE DIMENSIONS
// ============================================================
const W = 16, D = 12, H = 5, WALL = 0.35;
const playL = 14, playD = 10;   // inner play area

// ---- Floor / tray ----
const trayGeo = new THREE.BoxGeometry(W, 0.6, D);
const trayMat = new THREE.MeshStandardMaterial({ color: 0x4fc3f7, flatShading: true });
const tray = new THREE.Mesh(trayGeo, trayMat);
tray.position.y = -0.3;
tray.receiveShadow = true;
scene.add(tray);

// bedding
const bedGeo = new THREE.BoxGeometry(W - 0.8, 0.35, D - 0.8);
const bedMat = new THREE.MeshStandardMaterial({ color: 0xffcc80, flatShading: true, roughness: 1 });
const bedding = new THREE.Mesh(bedGeo, bedMat);
bedding.position.y = 0.05;
bedding.receiveShadow = true;
scene.add(bedding);

// ---- Walls ----
const wallMat = new THREE.MeshStandardMaterial({ color: 0x81d4fa, flatShading: true, side: THREE.DoubleSide });
function makeWall(w, h, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, WALL), wallMat);
  m.position.set(x, y, z); m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m); return m;
}
makeWall(W, H, 0, H / 2, -D / 2, 0);          // back
makeWall(W, H, 0, H / 2, D / 2, Math.PI);      // front (open-ish)
makeWall(D, H, -W / 2, H / 2, 0, Math.PI / 2); // left
makeWall(D, H, W / 2, H / 2, 0, -Math.PI / 2); // right

// decorative striped top rail
const railMat = new THREE.MeshStandardMaterial({ color: 0x4dd0e1, flatShading: true });
for (const side of [[-D / 2, 0, W + 0.7], [D / 2, 0, W + 0.7]]) {
  const r = new THREE.Mesh(new THREE.BoxGeometry(W + 0.7, 0.4, 0.5), railMat);
  r.position.set(0, H + 0.15, side[0]);
  scene.add(r);
}
for (const side of [[-W / 2, 0, D / 2, Math.PI / 2], [W / 2, 0, -D / 2, Math.PI / 2]]) {
  const r = new THREE.Mesh(new THREE.BoxGeometry(D + 0.7, 0.4, 0.5), railMat);
  r.position.set(side[0], H + 0.15, side[2]); r.rotation.y = side[3];
  scene.add(r);
}

// ============================================================
//  INTERACTIVE OBJECT — Running Wheel
// ============================================================
const wheelGroup = new THREE.Group();
wheelGroup.position.set(-5.2, 1.5, -2.8);
scene.add(wheelGroup);

const wheelRimMat = new THREE.MeshStandardMaterial({ color: 0xff8a65, flatShading: true, metalness: .25, roughness: .6 });
const wheelHubMat = new THREE.MeshStandardMaterial({ color: 0xffb74d, flatShading: true, metalness: .15, roughness: .7 });
const RUN_R = 1.7, RUN_THICK = 0.32;

// two rims
for (const zoff of [-0.62, 0.62]) {
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(RUN_R, RUN_R, RUN_THICK, 20, 1, false), wheelRimMat);
  rim.rotation.x = Math.PI / 2; rim.position.z = zoff;
  rim.castShadow = true;
  wheelGroup.add(rim);
}
// hub discs
for (const zoff of [-0.62, 0.62]) {
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, RUN_THICK + 0.06, 12), wheelHubMat);
  hub.rotation.x = Math.PI / 2; hub.position.z = zoff;
  wheelGroup.add(hub);
}
// spokes
for (let i = 0; i < 8; i++) {
  const sp = new THREE.Mesh(new THREE.BoxGeometry(0.12, RUN_R * 2, 0.12), wheelHubMat);
  sp.rotation.z = (i / 8) * Math.PI * 2;
  sp.position.y = 0; sp.position.z = 0;
  sp.rotation.y = Math.PI / 2;
  const g = new THREE.Group();
  sp.geometry = new THREE.BoxGeometry(0.12, RUN_R * 1.7, 0.12);
  sp.material = wheelHubMat;
  sp.rotation.z = (i / 8) * Math.PI * 2;
  g.add(sp);
  g.rotation.z = 0;
  wheelGroup.add(g);
}
// rungs (steps) between the two rims
const RUNG_COUNT = 26;
for (let i = 0; i < RUNG_COUNT; i++) {
  const ang = (i / RUNG_COUNT) * Math.PI * 2;
  const rung = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.14, 1.08), wheelRimMat);
  rung.position.set(Math.cos(ang) * RUN_R, Math.sin(ang) * RUN_R, 0);
  rung.rotation.z = ang;
  wheelGroup.add(rung);
}
// axle
const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 1.5, 8),
  new THREE.MeshStandardMaterial({ color: 0x607d8b, flatShading: true }));
axle.rotation.x = Math.PI / 2;
wheelGroup.add(axle);

// stand for the wheel
const standMat = new THREE.MeshStandardMaterial({ color: 0xffa726, flatShading: true });
for (const zoff of [-0.62, 0.62]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 3, 0.25), standMat);
  leg.position.set(0, -1.7, zoff);
  leg.castShadow = true;
  wheelGroup.add(leg);
}
const crossbar = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 1.4), standMat);
crossbar.position.set(0, -0.2, 0);
wheelGroup.add(crossbar);

// remember the rungs so we can animate them
const rungs = wheelGroup.children.filter(c => c.geometry && c.geometry.type === 'BoxGeometry'
  && Math.abs(c.geometry.parameters.width - 0.08) < 0.02 && c.geometry.parameters.height > 0.1);

// ============================================================
//  FOOD BOWL
// ============================================================
const bowlGroup = new THREE.Group();
bowlGroup.position.set(4.5, 0.35, 3.2);
scene.add(bowlGroup);
const bowlMat = new THREE.MeshStandardMaterial({ color: 0x66bb6a, flatShading: true, metalness: .2, roughness: .7 });
const bowlOuter = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.55, 0.5, 12, 1, true), bowlMat);
bowlGroup.add(bowlOuter);
const bowlBottom = new THREE.Mesh(new THREE.CircleGeometry(0.55, 12),
  new THREE.MeshStandardMaterial({ color: 0x43a047, flatShading: true }));
bowlBottom.rotation.x = -Math.PI / 2;
bowlGroup.add(bowlBottom);
// little seeds/grains
const grainMat = new THREE.MeshStandardMaterial({ color: 0xfff176, flatShading: true, roughness: 1 });
for (let i = 0; i < 10; i++) {
  const g = new THREE.Mesh(new THREE.DodecahedronGeometry(0.11), grainMat);
  const a = Math.random() * Math.PI * 2, r = Math.random() * 0.5;
  g.position.set(Math.cos(a) * r, 0.28 + Math.random() * 0.1, Math.sin(a) * r);
  g.scale.setScalar(0.7 + Math.random() * 0.6);
  bowlGroup.add(g);
}

// ============================================================
//  TUNNEL
// ============================================================
const tunnelGroup = new THREE.Group();
tunnelGroup.position.set(4.2, 0.6, -3.2);
tunnelGroup.rotation.y = -0.5;
scene.add(tunnelGroup);
const tunnelMat = new THREE.MeshStandardMaterial({ color: 0xba68c8, flatShading: true, side: THREE.DoubleSide, roughness: .8 });
const tunnelTube = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 4.5, 14, 1, true), tunnelMat);
tunnelTube.rotation.x = Math.PI / 2;
tunnelGroup.add(tunnelTube);
// rings at both ends
for (const zf of [-2.25, 2.25]) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.12, 6, 14),
    new THREE.MeshStandardMaterial({ color: 0xce93d8, flatShading: true }));
  ring.position.z = zf; ring.rotation.x = Math.PI / 2;
  tunnelGroup.add(ring);
}

// ============================================================
//  SMALL TOY — chew block
// ============================================================
const toyGroup = new THREE.Group();
toyGroup.position.set(-3.5, 0.45, 3.5);
scene.add(toyGroup);
const toyColors = [0xef5350, 0x42a5f5, 0xffee58, 0x66bb6a, 0xff7043];
for (let i = 0; i < 5; i++) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5),
    new THREE.MeshStandardMaterial({ color: toyColors[i], flatShading: true }));
  b.position.set((i - 2) * 0.55, 0, 0);
  b.rotation.y = (i % 2 ? 0.3 : -0.3);
  b.castShadow = true;
  toyGroup.add(b);
}

// ============================================================
//  HAMSTER FACTORY
// ============================================================
const hamsters = [];

const FUR_COLORS = [
  0xffcc99, 0xd7ccc0, 0xffe0b2, 0xfff3e0, 0xe0f7fa, 0xfff9c4, 0xffcddb, 0xc8e6c9
];
const BELLY_COLORS = [0xffffff, 0xfff8e1, 0xffeef3, 0xe8f5e9, 0xe3f2fd];

function makeHamster(furColorIdx) {
  const fur = new THREE.MeshStandardMaterial({
    color: FUR_COLORS[furColorIdx % FUR_COLORS.length], flatShading: true, roughness: .9
  });
  const belly = new THREE.MeshStandardMaterial({
    color: BELLY_COLORS[(furColorIdx + 2) % BELLY_COLORS.length], flatShading: true, roughness: .9
  });
  const dark = new THREE.MeshStandardMaterial({ color: 0x222222, flatShading: true, roughness: .5 });
  const pink = new THREE.MeshStandardMaterial({ color: 0xf48fb1, flatShading: true, roughness: .8 });

  const body = new THREE.Group();

  // torso
  const torso = new THREE.Mesh(new THREE.SphereGeometry(0.62, 12, 8), fur);
  torso.scale.set(1, 0.85, 1.25);
  torso.position.y = 0.55;
  torso.castShadow = true;
  body.add(torso);

  // belly
  const bell = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 8), belly);
  bell.scale.set(0.95, 0.85, 1.05);
  bell.position.set(0, 0.42, 0.18);
  body.add(bell);

  // head
  const head = new THREE.Group();
  head.position.set(0, 0.72, 0.55);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 8), fur);
  skull.castShadow = true;
  head.add(skull);

  // cheeks/blush
  for (const s of [-1, 1]) {
    const chk = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), pink);
    chk.position.set(s * 0.28, -0.06, 0.24);
    head.add(chk);
  }
  // ears
  for (const s of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.26, 8), fur);
    ear.position.set(s * 0.24, 0.34, -0.04);
    ear.rotation.z = s * -0.3;
    head.add(ear);
    const earIn = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.16, 8), pink);
    earIn.position.set(s * 0.24, 0.34, 0.02);
    earIn.rotation.z = s * -0.3;
    head.add(earIn);
  }
  // eyes
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 8), dark);
    eye.position.set(s * 0.17, 0.08, 0.34);
    head.add(eye);
    const shine = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0xffffff }));
    shine.position.set(s * 0.15, 0.11, 0.39);
    head.add(shine);
  }
  // nose
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), pink);
  nose.position.set(0, -0.02, 0.42);
  head.add(nose);
  // whiskers
  const whiskMat = new THREE.LineBasicMaterial({ color: 0x555555 });
  for (const s of [-1, 1]) {
    for (let k = 0; k < 2; k++) {
      const pts = [new THREE.Vector3(0, -0.02 + k * 0.05 - 0.02, 0.42),
        new THREE.Vector3(s * 0.35, -0.02 + k * 0.05 - 0.06, 0.44)];
      const wg = new THREE.BufferGeometry().setFromPoints(pts);
      head.add(new THREE.Line(wg, whiskMat));
    }
  }
  body.add(head);

  // feet
  const feetMat = pink;
  for (const s of [-1, 1]) {
    for (const z of [0.32, -0.32]) {
      const foot = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), feetMat);
      foot.scale.set(1, 0.6, 1.2);
      foot.position.set(s * 0.34, 0.12, z);
      body.add(foot);
    }
  }

  // tail
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 5), belly);
  tail.position.set(0, 0.45, -0.72);
  body.add(tail);

  scene.add(body);

  const baseScale = 0.85 + Math.random() * 0.28;
  body.scale.setScalar(baseScale);

  return {
    group: body, head, torso,
    furColorIdx,
    color: FUR_COLORS[furColorIdx % FUR_COLORS.length],
    // behaviour
    state: 'idle',
    timer: Math.random() * 3,
    speed: 1.4 + Math.random() * 1.2,
    turnRate: 0.8 + Math.random() * 1.5,
    target: null,
    phase: Math.random() * Math.PI * 2,
    bobT: 0,
    baseScale
  };
}

// spawn a few hamsters
const NUM = 4;
for (let i = 0; i < NUM; i++) {
  const h = makeHamster(i);
  const angle = (i / NUM) * Math.PI * 2 + 0.4;
  const rad = 2.5;
  h.group.position.set(Math.sin(angle) * rad, 0, Math.cos(angle) * rad);
  h.group.rotation.y = angle + Math.PI;
  hamsters.push(h);
}

// ============================================================
//  BEHAVIOUR
// ============================================================
function pickTarget() {
  const opts = [
    { pos: new THREE.Vector3(-5.2, 0, -2.8), obj: wheelGroup },   // wheel
    { pos: new THREE.Vector3(4.5, 0.35, 3.2), obj: bowlGroup },    // food
    { pos: new THREE.Vector3(4.2, 0, -3.2), obj: tunnelGroup },    // tunnel
    { pos: new THREE.Vector3(-3.5, 0, 3.5), obj: toyGroup },       // toy
  ];
  return opts[Math.floor(Math.random() * opts.length)];
}

function chooseState(h) {
  const r = Math.random();
  if (r < 0.34) {
    h.state = 'idle';
    h.vel = new THREE.Vector3();
  } else if (r < 0.6) {
    h.state = 'turn';
    h.turnDir = Math.random() < 0.5 ? 1 : -1;
    h.timer = 0.6 + Math.random() * 1.2;
    h.vel = new THREE.Vector3();
  } else {
    h.target = pickTarget();
    h.state = 'walk';
    const d = new THREE.Vector3().subVectors(h.target.pos, h.group.position);
    d.y = 0;
    if (d.lengthSq() < 0.6) { h.state = 'idle'; h.vel = new THREE.Vector3(); }
    else h.vel.copy(d).normalize().multiplyScalar(h.speed);
  }
}

function clampPlay(pos) {
  const m = 1.4;
  pos.x = THREE.MathUtils.clamp(pos.x, -playL / 2, playL / 2);
  pos.z = THREE.MathUtils.clamp(pos.z, -playD / 2, playD / 2);
  void m;
}

// ============================================================
//  ANIMATION LOOP
// ============================================================
const clock = new THREE.Clock();

function updateHamster(h, dt) {
  const p = h.group.position;
  h.timer -= dt;
  h.bobT += dt;

  switch (h.state) {
    case 'walk':
      if (h.target) {
        const dir = h.vel.clone();
        const dist = dir.length();
        dir.normalize();
        p.addScaledVector(dir, dt);
        // face movement direction
        const targetAngle = Math.atan2(dir.x, dir.z);
        let diff = targetAngle - h.group.rotation.y;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        h.group.rotation.y += diff * Math.min(1, dt * 8);
        // bob
        const bob = Math.sin(h.bobT * 10 + h.phase) * 0.05;
        h.torso.position.y = 0.55 + bob;
        // waddle
        h.torso.rotation.z = Math.sin(h.bobT * 10 + h.phase) * 0.06;
        // arrived?
        if ((p.distanceTo(h.target.pos) < 0.6) || h.timer <= 0) {
          h.state = 'idle'; h.timer = 1 + Math.random() * 2.5; h.vel.set(0, 0, 0);
        }
      }
      break;

    case 'idle':
      h.torso.rotation.z *= 0.9;
      if (h.timer <= 0) chooseState(h);
      break;

    case 'turn':
      h.group.rotation.y += h.turnDir * h.turnRate * dt;
      if (h.timer <= 0) chooseState(h);
      break;
  }

  clampPlay(p);

  // gentle idle breathing when idle
  if (h.state === 'idle') {
    const br = 1 + Math.sin(h.bobT * 2 + h.phase) * 0.02;
    h.torso.scale.set(br, 0.85, br);
  }
}

function animateWheel(dt) {
  // spin the whole wheel when a hamster is near it & walking toward it handled by visuals
  wheelGroup.rotation.x += dt * 3.2;
  // subtle bounce on rungs for extra life
  for (const r of rungs) { /* static, wheel rotation gives motion */ }
}

function render(time) {
  requestAnimationFrame(render);
  const dt = Math.min(clock.getDelta(), 0.05);

  for (const h of hamsters) updateHamster(h, dt);
  animateWheel(dt);

  // little idle wiggle on hamster heads
  for (const h of hamsters) {
    if (h.state === 'idle') h.head.rotation.z = Math.sin(time * 0.7 + h.phase) * 0.05;
  }

  controls.update();
  renderer.render(scene, camera);
}

// ============================================================
//  RESIZE
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// hide loader
const ld = document.getElementById('loading');
ld.style.opacity = '0';
setTimeout(() => ld.remove(), 700);

// go!
requestAnimationFrame(render);
</script>
</body>
</html>
