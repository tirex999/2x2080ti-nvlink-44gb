<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>🐠 3D Аквариум</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family:'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, #041830 0%, #0a3d6b 60%, #0d5a8f 100%);
  }
  canvas { display:block; }

  /* ---- Glass UI ---- */
  .panel {
    position:absolute;
    background: rgba(8,28,58,.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(90,190,255,.35);
    border-radius: 14px;
    color:#d9f2ff;
    padding: 14px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  #info  { top:16px; left:16px; width:272px; }
  #stats { top:16px; right:16px; text-align:right; font-size:13px; line-height:1.75; min-width:132px; }
  #stats b { color:#7fe3ff; font-size:15px; }

  #info h1 {
    font-size:20px; margin-bottom:8px;
    background: linear-gradient(90deg,#5fd9ff,#b38bff);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
  }
  #info ul { list-style:none; font-size:12.5px; line-height:1.6; margin-bottom:10px; color:#a8d8f5; }

  .btns { display:flex; flex-wrap:wrap; gap:8px; }
  button {
    border:none; cursor:pointer; color:#fff;
    font-size:12px; font-weight:600; padding:8px 12px;
    border-radius:9px;
    background: linear-gradient(135deg,#00c6ff,#0072ff);
    box-shadow: 0 3px 10px rgba(0,114,255,.4);
    transition: transform .2s, filter .2s;
  }
  button:hover  { transform: translateY(-2px); filter: brightness(1.15); }
  button:active { transform: scale(.96); }
</style>
</head>
<body>

<!-- ======== ИНФО-ПАНЕЛЬ ======== -->
<div id="info" class="panel">
  <h1>🐠 3D Аквариум</h1>
  <ul>
    <li>🖱️ ЛКМ + движение — вращение камеры</li>
    <li>✋&nbsp; ПКМ + движение — панорамирование</li>
    <li>🔍 Колесо мыши — зум</li>
    <li>🍽️ Клик по воде — бросить корм</li>
  </ul>
  <div class="btns">
    <button id="addFish">＋ Рыбка</button>
    <button id="moreBubbles">＋ Пузыри</button>
    <button id="toggleLight">💡 Свет</button>
  </div>
</div>

<!-- ======== СТАТИСТИКА ======== -->
<div id="stats" class="panel">
  🐟 Рыбок: <b id="fishCount">15</b><br>
  📊 FPS: <b id="fps">60</b>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
/* ================================================================
   1. СЦЕНА, КАМЕРА, РЕНДЕРЕР, УПРАВЛЕНИЕ
================================================================ */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a3d6b, 0.011); // имитация воды

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 300);
camera.position.set(27, 15, 31);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 1.8;

/* ================================================================
   2. ОСВЕЩЕНИЕ
================================================================ */
scene.add(new THREE.AmbientLight(0x404040, 0.4));

const sunLight = new THREE.DirectionalLight(0xfff4e0, 1.15);
sunLight.position.set(22, 32, 12);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -28;
sunLight.shadow.camera.right = 28;
sunLight.shadow.camera.top = 28;
sunLight.shadow.camera.bottom = -28;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 90;
scene.add(sunLight);

const pLight1 = new THREE.PointLight(0x33bbff, 0.7, 45);
pLight1.position.set(-10, 7, -5);
scene.add(pLight1);
const pLight2 = new THREE.PointLight(0x2266ff, 0.55, 45);
pLight2.position.set(11, -5, 6);
scene.add(pLight2);

/* ================================================================
   3. АКВАРИУМ: СТЕНЫ, ДНО, КАМНИ, ВОДОРОСЛИ
================================================================ */
const TANK = { w:36, h:24, d:20 };
const HALF = { x:TANK.w/2, y:TANK.h/2, z:TANK.d/2 };
const FLOOR_Y = -HALF.y; // -12

/* --- Стеклянный контейнер --- */
const glassMat = new THREE.MeshPhysicalMaterial({
  color:0xbfe8ff,
  transparent:true, opacity:0.16,
  roughness:0.06, metalness:0.1,
  transmission:0.95,                 // эффект преломления
  side:THREE.DoubleSide,
  depthWrite:false
});
const glass = new THREE.Mesh(new THREE.BoxGeometry(TANK.w, TANK.h, TANK.d), glassMat);
scene.add(glass);

/* --- Видимая рамка (wireframe edges) --- */
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(TANK.w, TANK.h, TANK.d)),
  new THREE.LineBasicMaterial({ color:0x8fd8ff, transparent:true, opacity:0.65 })
);
scene.add(edges);

/* --- Песчаное дно с процедурными неровностями --- */
{
  const g = new THREE.PlaneGeometry(TANK.w, TANK.d, 36, 22);
  const pos = g.attributes.position;
  for (let i=0; i<pos.count; i++){
    const x = pos.getX(i), y = pos.getY(i);
    pos.setZ(i,
      Math.sin(x*0.55) * Math.cos(y*0.7) * 0.28 +
      Math.sin(x*1.7 + y*1.3) * 0.09
    );
  }
  g.computeVertexNormals();
  const sand = new THREE.Mesh(g,
    new THREE.MeshStandardMaterial({ color:0xd8bd85, roughness:1 })
  );
  sand.rotation.x = -Math.PI/2;
  sand.position.y = FLOOR_Y;
  sand.receiveShadow = true;
  scene.add(sand);
}

/* --- Декоративные камни (8 деформированных додекаэдров) --- */
for (let i=0; i<8; i++){
  const size = 0.7 + Math.random()*1.1;
  const g = new THREE.DodecahedronGeometry(size, 0);
  const pos = g.attributes.position;
  for (let v=0; v<pos.count; v++){
    pos.setXYZ(v,
      pos.getX(v) * (0.8 + Math.random()*0.4),
      pos.getY(v) * (0.7 + Math.random()*0.5),
      pos.getZ(v) * (0.8 + Math.random()*0.4)
    );
  }
  g.computeVertexNormals();
  const rock = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.08 + Math.random()*0.05, 0.15, 0.3 + Math.random()*0.2),
    roughness:0.95,
    flatShading:true
  }));
  rock.position.set(
    (Math.random()-0.5) * (TANK.w - 6),
    FLOOR_Y + size*0.35,
    (Math.random()-0.5) * (TANK.d - 5)
  );
  rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
  rock.castShadow = rock.receiveShadow = true;
  scene.add(rock);
}

/* --- Водоросли (12 кустов: TubeGeometry + CatmullRomCurve3) --- */
const weeds = [];
for (let i=0; i<12; i++){
  const h  = 3 + Math.random()*4;
  const bx = (Math.random()-0.5) * (TANK.w - 8);
  const bz = (Math.random()-0.5) * (TANK.d - 6);

  const pts = [];
  for (let s=0; s<=6; s++){
    const t = s/6;
    pts.push(new THREE.Vector3(
      Math.sin(t*3 + i) * 0.5 * t,
      t * h,
      Math.cos(t*2.5 + i*1.7) * 0.5 * t
    ));
  }
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 18, 0.12 + Math.random()*0.14, 6),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.3 + Math.random()*0.12, 0.7, 0.25 + Math.random()*0.15),
      roughness:0.8
    })
  );
  tube.position.set(bx, FLOOR_Y, bz);
  tube.castShadow = true;
  scene.add(tube);
  weeds.push({ mesh:tube, phase:Math.random()*Math.PI*2 });
}

/* ================================================================
   4. ГЕОМЕТРИИ ПЛАВНИКОВ
================================================================ */
function tailGeo(){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([
     0,   0,   0,
    -0.55, 0,  -1.1,
     0.55, 0,  -1.1
  ], 3));
  g.computeVertexNormals();
  return g;
}
function dorsalGeo(){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([
     0,    0,    0.35,
    -0.32, 0.85, -0.15,
     0.32, 0.85, -0.15
  ], 3));
  g.computeVertexNormals();
  return g;
}
function sideFinGeo(){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([
     0,    0,     0,
    -0.45, -0.1,  -0.55,
     0.15, -0.15, -0.6
  ], 3));
  g.computeVertexNormals();
  return g;
}
function makeSideFin(mat, side){
  const pivot = new THREE.Group();
  pivot.position.set(side*0.66, -0.12, 0.32);
  pivot.rotation.y = side * 0.55;
  const fin = new THREE.Mesh(sideFinGeo(), mat);
  fin.scale.set(side, 1, 1);
  pivot.add(fin);
  return pivot;
}

/* ================================================================
   5. СОЗДАНИЕ РЫБОК
================================================================ */
const COLOR_SCHEMES = [
  { name:'оранжевая',     color:0xff7f2a },
  { name:'синяя',           color:0x2a7fff },
  { name:'жёлто-красная',     color:0xffa020 },
  { name:'фиолетовая',         color:0x9b4dff },
  { name:'красная',           color:0xff3b3b },
  { name:'зелёная',             color:0x3ddc84 },
  { name:'розовая',             color:0xff6fb5 },
  { name:'золотая',               color:0xffd24d }
];

const fishArray = [];

function createFish(scheme, pos, scale){
  const group  = new THREE.Group();
  const mat    = new THREE.MeshStandardMaterial({ color:scheme.color, roughness:0.45, metalness:0.15 });
  const finMat  = new THREE.MeshStandardMaterial({
    color:scheme.color, roughness:0.5, metalness:0.1,
    side:THREE.DoubleSide, transparent:true, opacity:0.85
  });

  /* --- Вытянутое тело --- */
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 14), mat);
  body.scale.set(0.75, 1.05, 1.9);
  body.castShadow = true;
  group.add(body);

  /* --- Реалистичные глаза с зрачками --- */
  const eyeMat   = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.25 });
  const pupilMat  = new THREE.MeshStandardMaterial({ color:0x101010, roughness:0.2 });
  [-1, 1].forEach(side => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), eyeMat);
    eye.position.set(side*0.5, 0.22, 1.25);
    group.add(eye);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 8), pupilMat);
    pupil.position.set(side*0.5, 0.22, 1.37);
    group.add(pupil);
  });

  /* --- Анимируемый хвост (вращение по оси Z) --- */
  const tailPivot = new THREE.Group();
  tailPivot.position.set(0, 0, -1.55);
  const tail = new THREE.Mesh(tailGeo(), finMat);
  tailPivot.add(tail);
  group.add(tailPivot);

  /* --- Спинной плавник --- */
  const dorsal = new THREE.Mesh(dorsalGeo(), finMat);
  dorsal.position.set(0, 0.95, 0.1);
  group.add(dorsal);

  /* --- Боковые плавники --- */
  const leftFin  = makeSideFin(finMat,  1);
  const rightFin = makeSideFin(finMat, -1);
  group.add(leftFin, rightFin);

  /* --- Параметры экземпляра --- */
  group.position.copy(pos);
  group.scale.setScalar(scale);
  group.rotation.y = Math.random() * Math.PI * 2;
  scene.add(group);

  const speed = 1.6 + Math.random()*1.6;
  const f = {
    mesh: group,
    tail: tailPivot,
    dorsal,
    leftFin,
    rightFin,
    velocity: new THREE.Vector3(
      Math.random()-0.5, (Math.random()-0.5)*0.3, Math.random()-0.5
    ).normalize().multiplyScalar(speed),
    speed,
    tailSpeed: 3.5 + Math.random()*3,
    phase: Math.random()*Math.PI*2,
    targetFood: null,
    avoidanceRadius: 2 + Math.random()*1.2,
    wanderTimer: 0,
    nextWander: 1 + Math.random()*3
  };
  fishArray.push(f);
  updateFishCounter();
  return f;
}

function updateFishCounter(){
  document.getElementById('fishCount').textContent = fishArray.length;
}

/* ================================================================
   6. ИИ И ПОВЕДЕНИЕ РЫБОК
================================================================ */
function updateFish(dt, time){
  const margin = 2.2;
  const hx = HALF.x - margin;
  const hz = HALF.z - margin;
  const hy = HALF.y - margin;

  for (let i=0; i<fishArray.length; i++){
    const f = fishArray[i];
    const p = f.mesh.position;
    const v = f.velocity;

    /* --- Случайное блуждание --- */
    f.wanderTimer += dt;
    if (f.wanderTimer > f.nextWander){
      f.wanderTimer = 0;
      f.nextWander = 1.5 + Math.random()*3;
      const ang = (Math.random()-0.5) * 1.2;
      const c = Math.cos(ang), s = Math.sin(ang);
      const nx = v.x*c + v.z*s;
      const nz = -v.x*s + v.z*c;
      v.x = nx; v.z = nz;
      v.y = THREE.MathUtils.clamp(v.y + (Math.random()-0.5)*0.6, -0.9, 0.9);
    }

    /* --- Избегание столкновений --- */
    for (let j=0; j<fishArray.length; j++){
      if (j === i) continue;
      const o = fishArray[j].mesh.position;
      const dx = p.x-o.x, dy = p.y-o.y, dz = p.z-o.z;
      const d2 = dx*dx + dy*dy + dz*dz;
      const minD = f.avoidanceRadius + fishArray[j].avoidanceRadius;
      if (d2 < minD*minD && d2 > 0.0001){
        const d = Math.sqrt(d2);
        const strength = (1 - d/minD) * 2.2;
        v.x += (dx/d) * strength;
        v.y += (dy/d) * strength;
        v.z += (dz/d) * strength;
      }
    }

    /* --- Отражение от стенок (плавное) --- */
    if (p.x >  hx) v.x -= (p.x - hx) * 1.4;
    if (p.x < -hx) v.x -= (p.x + hx) * 1.4;
    if (p.z >  hz) v.z -= (p.z - hz) * 1.4;
    if (p.z < -hz) v.z -= (p.z + hz) * 1.4;
    if (p.y >  hy) v.y -= (p.y - hy) * 1.4;
    if (p.y < FLOOR_Y + 1.2) v.y += ((FLOOR_Y + 1.2) - p.y) * 1.4;

    /* --- Поиск и преследование корма --- */
    if (f.targetFood){
      if (!f.targetFood.alive) f.targetFood = null;
    }
    if (!f.targetFood){
      let best = null, bestD = 15; // радиус обнаружения 15
      for (const fd of foodArray){
        if (!fd.alive) continue;
        const d = p.distanceTo(fd.mesh.position);
        if (d < bestD){ bestD = d; best = fd; }
      }
      f.targetFood = best;
    }
    if (f.targetFood && f.targetFood.alive){
      const fp = f.targetFood.mesh.position;
      const dx = fp.x-p.x, dy = fp.y-p.y, dz = fp.z-p.z;
      const d = Math.hypot(dx, dy, dz);
      if (d > 0.001){
        v.x += (dx/d) * 1.6;
        v.y += (dy/d) * 1.6;
        v.z += (dz/d) * 1.6;
      }
      if (d < 1.4){
        f.targetFood.alive = false;
        if (f.mesh.scale.x < 2.2) f.mesh.scale.multiplyScalar(1.05); // рост +5%
        f.targetFood = null;
      }
    }

    /* --- Ограничение скорости --- */
    const cur = v.length();
    if (cur > f.speed) v.multiplyScalar(f.speed/cur);
    else if (cur < f.speed*0.35 && cur > 0.001) v.multiplyScalar((f.speed*0.35)/cur);

    /* --- Интеграция позиции --- */
    p.addScaledVector(v, dt);
    p.x = THREE.MathUtils.clamp(p.x, -HALF.x+1, HALF.x-1);
    p.y = THREE.MathUtils.clamp(p.y, FLOOR_Y+0.8, HALF.y-0.8);
    p.z = THREE.MathUtils.clamp(p.z, -HALF.z+1, HALF.z-1);

    /* --- Поворот в направлении движения --- */
    f.mesh.rotation.y = Math.atan2(v.x, v.z);
    const hs = Math.hypot(v.x, v.z) || 0.001;
    f.mesh.rotation.x = THREE.MathUtils.clamp(-Math.atan2(v.y, hs)*0.55, -0.45, 0.45);

    /* --- Плавная анимация плавников --- */
    const w = time * f.tailSpeed + f.phase;
    f.tail.rotation.z  = Math.sin(w) * 0.55;
    f.dorsal.rotation.z = Math.sin(w*0.8) * 0.12;
    f.leftFin.rotation.x  =  Math.sin(w*1.2) * 0.28;
    f.rightFin.rotation.x = -Math.sin(w*1.2 + 0.6) * 0.28;
  }
}

/* ================================================================
   7. СИСТЕМА КОРМЛЕНИЯ
================================================================ */
const foodArray = [];
const foodMat = new THREE.MeshStandardMaterial({
  color:0x8fe34a, roughness:0.6, emissive:0x2a4d10
});

function spawnFood(point){
  if (foodArray.length > 40) return;
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 8), foodMat);
  m.position.copy(point);
  m.position.y += 0.4;
  m.castShadow = true;
  scene.add(m);
  foodArray.push({
    mesh: m,
    velocity: new THREE.Vector3(
      (Math.random()-0.5)*1.2,
      Math.random()*1.5,
      (Math.random()-0.5)*1.2
    ),
    life: 0,
    alive: true
  });
}

function updateFood(dt){
  for (let i=foodArray.length-1; i>=0; i--){
    const fd = foodArray[i];
    if (!fd.alive){                       // съедено
      fd.alive = false;
      scene.remove(fd.mesh);
      foodArray.splice(i, 1);
      continue;
    }
    fd.life += dt;
    fd.velocity.y -= 7.5 * dt;                // гравитация
    fd.mesh.position.addScaledVector(fd.velocity, dt);
    const mp = fd.mesh.position;
    if (mp.y < FLOOR_Y + 0.3){                  // дно
      mp.y = FLOOR_Y + 0.3;
      fd.velocity.y = 0;
      fd.velocity.x *= 0.92;
      fd.velocity.z *= 0.92;
    }
    if (fd.life > 7){                            // убрать осевший
      scene.remove(fd.mesh);
      foodArray.splice(i, 1);
    }
  }
}

/* ================================================================
   8. СИСТЕМА ПУЗЫРЕЙ
================================================================ */
const bubbleArray = [];
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color:0xcfeaff,
  transparent:true, opacity:0.4,
  roughness:0.15, metalness:0,
  transmission:0.5
});

function addBubble(){
  const r = 0.12 + Math.random()*0.3;
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), bubbleMat);
  const base = new THREE.Vector3(
    (Math.random()-0.5) * (TANK.w - 4),
    FLOOR_Y + 0.5 + Math.random()*2,
    (Math.random()-0.5) * (TANK.d - 4)
  );
  m.position.copy(base);
  scene.add(m);
  bubbleArray.push({
    mesh: m,
    base,
    speed: 1.2 + Math.random()*1.6,
    phase: Math.random()*Math.PI*2,
    amp: 0.25 + Math.random()*0.35
  });
}
for (let i=0; i<30; i++) addBubble();

function updateBubbles(dt, time){
  const topY = HALF.y - 0.6;
  for (const b of bubbleArray){
    b.base.y += b.speed * dt;
    if (b.base.y > topY){                        // сброс
      b.base.y = FLOOR_Y + 0.4 + Math.random()*1.5;
      b.base.x = (Math.random()-0.5) * (TANK.w - 4);
      b.base.z = (Math.random()-0.5) * (TANK.d - 4);
    }
    b.mesh.position.set(                             // покачивание
      b.base.x + Math.sin(time*1.8 + b.phase) * b.amp,
      b.base.y,
      b.base.z + Math.cos(time*1.5 + b.phase) * b.amp
    );
  }
}

/* ================================================================
   9. КЛИК ПО АКВАРИУМУ (RAYCASTER)
================================================================ */
const raycaster = new THREE.Raycaster();
const clickPlane = new THREE.Mesh(
  new THREE.BoxGeometry(TANK.w-1, TANK.h-1, TANK.d-1),
  new THREE.MeshBasicMaterial({ visible:false })
);
scene.add(clickPlane);

let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  downX = e.clientX; downY = e.clientY;
});
renderer.domElement.addEventListener('pointerup', e => {
  if (e.button !== 0) return;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
  const ndc = new THREE.Vector2(
    (e.clientX/innerWidth) * 2 - 1,
    -(e.clientY/innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(clickPlane);
  if (hits.length){
    const pt = hits[0].point;
    pt.y = Math.max(pt.y, FLOOR_Y + 0.6);
    spawnFood(pt);
  }
});

/* ================================================================
   10. НАЧАЛЬНОЕ НАСЕЛЕНИЕ
================================================================ */
for (let i=0; i<15; i++){
  const scheme = COLOR_SCHEMES[i % COLOR_SCHEMES.length];
  createFish(scheme, new THREE.Vector3(
    (Math.random()-0.5) * (TANK.w - 12),
    (Math.random()-0.5) * (TANK.h - 12),
    (Math.random()-0.5) * (TANK.d - 10)
  ), 0.6 + Math.random()*0.6);
}

/* ================================================================
   11. КНОПКИ UI
================================================================ */
document.getElementById('addFish').onclick = () => {
  const scheme = COLOR_SCHEMES[Math.floor(Math.random()*COLOR_SCHEMES.length)];
  createFish(scheme, new THREE.Vector3(
    (Math.random()-0.5) * (TANK.w - 10),
    (Math.random()-0.5) * (TANK.h - 10),
    (Math.random()-0.5) * (TANK.d - 8)
  ), 0.6 + Math.random()*0.6);
};

document.getElementById('moreBubbles').onclick = () => {
  for (let i=0; i<10; i++) addBubble();
};

let lightOn = true;
document.getElementById('toggleLight').onclick = () => {
  lightOn = !lightOn;
  sunLight.intensity = lightOn ? 1.15 : 0.15;
};

/* ================================================================
   12. ГЛАВНЫЙ ЦИКЛ + FPS
================================================================ */
const clock = new THREE.Clock();
let frames = 0, fpsTimer = performance.now();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  controls.update();
  updateFish(dt, time);
  updateFood(dt);
  updateBubbles(dt, time);

  /* Покачивание водорослей */
  for (const wd of weeds){
    wd.mesh.rotation.x = Math.sin(time*1.1 + wd.phase) * 0.07;
    wd.mesh.rotation.z = Math.cos(time*0.8 + wd.phase) * 0.07;
  }

  renderer.render(scene, camera);

  /* FPS counter */
  frames++;
  const now = performance.now();
  if (now - fpsTimer >= 500){
    document.getElementById('fps').textContent =
      Math.round(frames * 1000 / (now - fpsTimer));
    frames = 0;
    fpsTimer = now;
  }
}
animate();

/* ================================================================
   13. RESIZE
================================================================ */
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
