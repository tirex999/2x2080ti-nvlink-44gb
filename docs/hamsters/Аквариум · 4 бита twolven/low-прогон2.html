<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Аквариум — Three.js</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #0a1628 0%, #1a3a5c 50%, #0d2847 100%);
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        /* === INFO PANEL === */
        .panel {
            position: fixed;
            background: rgba(10, 25, 50, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.2);
            border-radius: 14px;
            padding: 18px 22px;
            color: #c8e0ff;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .panel-info {
            top: 20px; left: 20px;
            max-width: 280px;
        }

        .panel-info h1 {
            font-size: 1.3em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #64b5f6, #4dd0e1, #81c784);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .panel-info ul {
            list-style: none;
            font-size: 0.82em;
            line-height: 1.7;
        }

        .panel-info ul li::before {
            content: '▸ ';
            color: #4dd0e1;
        }

        /* === STATS PANEL === */
        .panel-stats {
            top: 20px; right: 20px;
            min-width: 160px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px rgba(100, 180, 255, 0.5);
        }

        .stat-label {
            font-size: 0.75em;
            color: #8ab4d6;
            margin-top: 2px;
        }

        .fps-display {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(100, 180, 255, 0.15);
        }

        .fps-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #81c784;
        }

        .fps-value.low { color: #ffb74d; }
        .fps-value.critical { color: #ef5350; }

        /* === BUTTONS === */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(100, 180, 255, 0.15);
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-size: 0.78em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #fff;
        }

        .btn-fish {
            background: linear-gradient(135deg, #ff9800, #f44336);
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }
        .btn-fish:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 152, 0, 0.5);
        }

        .btn-bubbles {
            background: linear-gradient(135deg, #42a5f5, #7e57c2);
            box-shadow: 0 4px 15px rgba(66, 165, 245, 0.3);
        }
        .btn-bubbles:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(66, 165, 245, 0.5);
        }

        .btn-light {
            background: linear-gradient(135deg, #ffd54f, #ff9800);
            box-shadow: 0 4px 15px rgba(255, 213, 79, 0.3);
        }
        .btn-light:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 213, 79, 0.5);
        }
        .btn-light.off {
            background: linear-gradient(135deg, #546e7a, #37474f);
        }

        /* === RESPONSIVE === */
        @media (max-width: 600px) {
            .panel-info { max-width: 200px; padding: 12px; }
            .panel-info h1 { font-size: 1.1em; }
            .panel-stats { min-width: 120px; padding: 12px; }
            .stat-value { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Info Panel -->
    <div class="panel panel-info">
        <h1>🐠 3D Аквариум</h1>
        <ul>
            <li>ЛКМ + движение — вращение</li>
            <li>ПКМ + движение — панорама</li>
            <li>Колесо — зум</li>
            <li>Клик по воде — кормление</li>
        </ul>
        <div class="btn-group">
            <button class="btn btn-fish" id="btnAddFish">+ Рыбка</button>
            <button class="btn btn-bubbles" id="btnBubbles">+ Пузыри</button>
            <button class="btn btn-light" id="btnLight">☀ Свет</button>
        </div>
    </div>

    <!-- Stats Panel -->
    <div class="panel panel-stats">
        <div class="stat-value" id="fishCount">15</div>
        <div class="stat-label">Рыбок в аквариуме</div>
        <div class="fps-display">
            <div class="fps-value" id="fpsCounter">60</div>
            <div class="stat-label">FPS</div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ============================================================
        //  GLOBALS & CONSTANTS
        // ============================================================
        const TANK_W = 36, TANK_H = 24, TANK_D = 20;
        const HALF_W = TANK_W / 2, HALF_H = TANK_H / 2, HALF_D = TANK_D / 2;

        let scene, camera, renderer, controls;
        let clock, raycaster, mouse;

        const fishArray = [];
        const bubbleArray = [];
        const foodArray = [];
        const seaweedArray = [];

        let dirLight, lightOn = true;
        let frameCount = 0, lastFpsTime = 0;

        // Fish color schemes: [body, fin, eye]
        const FISH_COLORS = [
            { body: 0xff8c00, fin: 0xffa726, eye: 0x222222 },   // Orange
            { body: 0x2196f3, fin: 0x64b5f6, eye: 0x1a1a1a },     // Blue
            { body: 0xffeb3b, fin: 0xf44336, eye: 0x333333 },    // Yellow-Red
            { body: 0x9c27b0, fin: 0xba68c8, eye: 0x2a2a2a },   // Purple
            { body: 0xe53935, fin: 0xef9a9a, eye: 0x1a1a1a },  // Red
            { body: 0x43a047, fin: 0xa5d6a7, eye: 0x222222 },   // Green
            { body: 0xec407a, fin: 0xf48fb1, eye: 0x333333 },  // Pink
            { body: 0xffd700, fin: 0xffe082, eye: 0x1a1a1a }   // Gold
        ];

        // ============================================================
        //  INITIALIZATION
        // ============================================================
        function init() {
            clock = new THREE.Clock();
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // --- Scene ---
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0d2847, 0.008);
            scene.background = new THREE.Color(0x0a1628);

            // --- Camera ---
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(28, 18, 32);
            camera.lookAt(0, 0, 0);

            // --- Renderer ---
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // --- Controls ---
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.minDistance = 10;
            controls.maxDistance = 60;
            controls.maxPolarAngle = Math.PI / 1.8;
            controls.target.set(0, 2, 0);

            // --- Build Scene ---
            buildLights();
            buildTank();
            buildSandBottom();
            buildRocks();
            buildSeaweed();
            createInitialFish();
            createInitialBubbles();

            // --- Events ---
            window.addEventListener('resize', onResize);
            renderer.domElement.addEventListener('click', onCanvasClick);
            document.getElementById('btnAddFish').addEventListener('click', () => {
                spawnRandomFish();
                updateFishCount();
            });
            document.getElementById('btnBubbles').addEventListener('click', () => {
                addBubbles(10);
            });
            document.getElementById('btnLight').addEventListener('click', toggleLight);

            // --- Start Loop ---
            animate();
        }

        // ============================================================
        //  LIGHTING
        // ============================================================
        function buildLights() {
            // Ambient
            const ambient = new THREE.AmbientLight(0x404040, 0.4);
            scene.add(ambient);

            // Directional (sun)
            dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
            dirLight.position.set(20, 35, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 1;
            dirLight.shadow.camera.far = 80;
            dirLight.shadow.camera.left = -25;
            dirLight.shadow.camera.right = 25;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -15;
            dirLight.shadow.bias = -0.001;
            scene.add(dirLight);

            // Underwater point lights
            const pLight1 = new THREE.PointLight(0x4488cc, 0.8, 30);
            pLight1.position.set(-8, 5, 4);
            scene.add(pLight1);

            const pLight2 = new THREE.PointLight(0x3366aa, 0.6, 25);
            pLight2.position.set(10, 3, -6);
            scene.add(pLight2);
        }

        function toggleLight() {
            lightOn = !lightOn;
            dirLight.intensity = lightOn ? 1.2 : 0.15;
            const btn = document.getElementById('btnLight');
            btn.textContent = lightOn ? '☀ Свет' : '🌙 Свет';
            btn.classList.toggle('off', !lightOn);
        }

        // ============================================================
        //  TANK (GLASS CONTAINER)
        // ============================================================
        function buildTank() {
            const geo = new THREE.BoxGeometry(TANK_W, TANK_H, TANK_D);

            // Glass material
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0xaaddff,
                metalness: 0.0,
                roughness: 0.05,
                transmission: 0.95,
                thickness: 0.5,
                ior: 1.5,
                transparent: true,
                opacity: 0.3,
                side: THREE.DoubleSide
            });

            const tank = new THREE.Mesh(geo, glassMat);
            tank.position.y = TANK_H / 2;
            scene.add(tank);

            // Wireframe edges
            const edgesGeo = new THREE.EdgesGeometry(geo);
            const edgesMat = new THREE.LineBasicMaterial({ color: 0x88bbdd, transparent: true, opacity: 0.4 });
            const edges = new THREE.LineSegments(edgesGeo, edgesMat);
            edges.position.copy(tank.position);
            scene.add(edges);
        }

        // ============================================================
        //  SAND BOTTOM
        // ============================================================
        function buildSandBottom() {
            const segX = 60, segZ = 40;
            const geo = new THREE.PlaneGeometry(TANK_W - 0.5, TANK_D - 0.5, segX, segZ);
            geo.rotateX(-Math.PI / 2);

            // Procedural bumps
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const z = pos.getZ(i);
                const h = Math.sin(x * 0.3) * Math.cos(z * 0.4) * 0.15
                        + Math.sin(x * 0.8 + z * 0.6) * 0.08
                        + (Math.random() - 0.5) * 0.06;
                pos.setY(i, h);
            }
            geo.computeVertexNormals();

            const mat = new THREE.MeshStandardMaterial({
                color: 0xd4b896,
                roughness: 0.9,
                metalness: 0.05
            });

            const sand = new THREE.Mesh(geo, mat);
            sand.position.y = 0.1;
            sand.receiveShadow = true;
            scene.add(sand);
        }

        // ============================================================
        //  DECORATIVE ROCKS (8 deformed dodecahedrons)
        // ============================================================
        function buildRocks() {
            for (let i = 0; i < 8; i++) {
                const size = 0.6 + Math.random() * 1.2;
                const geo = new THREE.DodecahedronGeometry(size, 1);

                // Deform vertices
                const pos = geo.attributes.position;
                for (let j = 0; j < pos.count; j++) {
                    const x = pos.getX(j), y = pos.getY(j), z = pos.getZ(j);
                    const noise = (Math.random() - 0.5) * 0.3 * size;
                    pos.setXYZ(j, x + noise * 0.5, y + noise * 0.3, z + noise * 0.5);
                }
                geo.computeVertexNormals();

                const hue = 0.05 + Math.random() * 0.1;
                const sat = 0.2 + Math.random() * 0.2;
                const light = 0.3 + Math.random() * 0.2;
                const mat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(hue, sat, light),
                    roughness: 0.85,
                    metalness: 0.1
                });

                const rock = new THREE.Mesh(geo, mat);
                rock.position.set(
                    (Math.random() - 0.5) * (TANK_W - 6),
                    0.3 + size * 0.3,
                    (Math.random() - 0.5) * (TANK_D - 4)
                );
                rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                rock.castShadow = true;
                rock.receiveShadow = true;
                scene.add(rock);
            }
        }

        // ============================================================
        //  SEAWEEED (12 bushes via TubeGeometry + CatmullRomCurve3)
        // ============================================================
        function buildSeaweed() {
            for (let i = 0; i < 12; i++) {
                const height = 2.5 + Math.random() * 3.5;
                const baseX = (Math.random() - 0.5) * (TANK_W - 6);
                const baseZ = (Math.random() - 0.5) * (TANK_D - 4);

                // Create wavy curve
                const points = [];
                const segments = 8;
                for (let s = 0; s <= segments; s++) {
                    const t = s / segments;
                    const y = t * height;
                    const sway = Math.sin(t * 3 + i) * 0.4 * t;
                    const sway2 = Math.cos(t * 2.5 + i * 0.7) * 0.3 * t;
                    points.push(new THREE.Vector3(baseX + sway, y, baseZ + sway2));
                }

                const curve = new THREE.CatmullRomCurve3(points);
                const tubeGeo = new THREE.TubeGeometry(curve, 12, 0.15 + Math.random() * 0.1, 6, false);

                const green = 0.3 + Math.random() * 0.3;
                const mat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color(0.1, green, 0.15),
                    roughness: 0.7,
                    metalness: 0.05,
                    side: THREE.DoubleSide
                });

                const weed = new THREE.Mesh(tubeGeo, mat);
                weed.castShadow = true;
                scene.add(weed);

                seaweedArray.push({
                    mesh: weed,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.5 + Math.random() * 0.5
                });
            }
        }

        // ============================================================
        //  FISH CREATION
        // ============================================================
        function createFish(colorIndex, scale) {
            const colors = FISH_COLORS[colorIndex % FISH_COLORS.length];
            const group = new THREE.Group();

            // --- Body (scaled sphere) ---
            const bodyGeo = new THREE.SphereGeometry(0.5, 12, 10);
            bodyGeo.scale(1.6, 0.75, 0.55);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: colors.body,
                roughness: 0.4,
                metalness: 0.3
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            group.add(body);

            // --- Eyes ---
            const eyeGeo = new THREE.SphereGeometry(0.09, 8, 8);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const pupilGeo = new THREE.SphereGeometry(0.05, 8, 8);
            const pupilMat = new THREE.MeshStandardMaterial({ color: colors.eye, roughness: 0.1 });

            [-1, 1].forEach(side => {
                const eye = new THREE.Mesh(eyeGeo, eyeMat);
                eye.position.set(0.55, 0.08, side * 0.2);
                group.add(eye);

                const pupil = new THREE.Mesh(pupilGeo, pupilMat);
                pupil.position.set(0.6, 0.08, side * 0.2);
                group.add(pupil);
            });

            // --- Tail (animated, rotation Z) ---
            const tailGeo = new THREE.ConeGeometry(0.35, 0.6, 6);
            tailGeo.rotateX(Math.PI / 2);
            const tailMat = new THREE.MeshStandardMaterial({
                color: colors.fin,
                roughness: 0.5,
                metalness: 0.2,
                transparent: true,
                opacity: 0.85
            });
            const tail = new THREE.Mesh(tailGeo, tailMat);
            tail.position.set(-0.9, 0, 0);
            group.add(tail);

            // --- Dorsal Fin (top) ---
            const dorsalGeo = new THREE.ConeGeometry(0.25, 0.4, 4);
            dorsalGeo.rotateZ(Math.PI);
            const dorsalMat = new THREE.MeshStandardMaterial({
                color: colors.fin,
                transparent: true,
                opacity: 0.7,
                roughness: 0.5
            });
            const dorsal = new THREE.Mesh(dorsalGeo, dorsalMat);
            dorsal.position.set(0, 0.35, 0);
            group.add(dorsal);

            // --- Side Fins (left & right) ---
            const finGeo = new THREE.ConeGeometry(0.2, 0.35, 4);
            finGeo.rotateZ(Math.PI / 2);
            const finMat = new THREE.MeshStandardMaterial({
                color: colors.fin,
                transparent: true,
                opacity: 0.7,
                roughness: 0.5
            });

            const leftFin = new THREE.Mesh(finGeo, finMat);
            leftFin.position.set(0.1, -0.1, -0.3);
            leftFin.rotation.x = 0.3;
            group.add(leftFin);

            const rightFin = new THREE.Mesh(finGeo, finMat);
            rightFin.position.set(0.1, -0.1, 0.3);
            rightFin.rotation.x = -0.3;
            group.add(rightFin);

            // Scale
            group.scale.setScalar(scale);

            return {
                mesh: group,
                tail: tail,
                leftFin: leftFin,
                rightFin: rightFin,
                velocity: new THREE.Vector3(),
                speed: 1.5 + Math.random() * 2,
                tailSpeed: 4 + Math.random() * 3,
                phase: Math.random() * Math.PI * 2,
                targetFood: null,
                avoidanceRadius: 1.5 + Math.random() * 1,
                wanderTimer: Math.random() * 3,
                baseScale: scale
            };
        }

        function createInitialFish() {
            for (let i = 0; i < 15; i++) {
                spawnRandomFish();
            }
        }

        function spawnRandomFish() {
            const colorIdx = Math.floor(Math.random() * FISH_COLORS.length);
            const scale = 0.6 + Math.random() * 0.6;
            const fish = createFish(colorIdx, scale);

            // Random position inside tank
            fish.mesh.position.set(
                (Math.random() - 0.5) * (TANK_W - 4),
                2 + Math.random() * (TANK_H - 4),
                (Math.random() - 0.5) * (TANK_D - 4)
            );

            // Random initial velocity
            fish.velocity.set(
                (Math.random() - 0.5) * 2,
                (Math.random() - 0.5) * 0.5,
                (Math.random() - 0.5) * 2
            );

            scene.add(fish.mesh);
            fishArray.push(fish);
        }

        function updateFishCount() {
            document.getElementById('fishCount').textContent = fishArray.length;
        }

        // ============================================================
        //  BUBBLES
        // ============================================================
        function createBubble() {
            const size = 0.08 + Math.random() * 0.2;
            const geo = new THREE.SphereGeometry(size, 8, 8);
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0xbbddff,
                metalness: 0.1,
                roughness: 0.1,
                transmission: 0.8,
                transparent: true,
                opacity: 0.5,
                ior: 1.33
            });

            const bubble = new THREE.Mesh(geo, mat);
            bubble.position.set(
                (Math.random() - 0.5) * (TANK_W - 2),
                0.5 + Math.random() * 2,
                (Math.random() - 0.5) * (TANK_D - 2)
            );
            scene.add(bubble);

            return {
                mesh: bubble,
                speed: 0.8 + Math.random() * 1.5,
                phase: Math.random() * Math.PI * 2,
                swayAmp: 0.2 + Math.random() * 0.4
            };
        }

        function createInitialBubbles() {
            for (let i = 0; i < 30; i++) {
                bubbleArray.push(createBubble());
            }
        }

        function addBubbles(count) {
            for (let i = 0; i < count; i++) {
                bubbleArray.push(createBubble());
            }
        }

        // ============================================================
        //  FOOD SYSTEM
        // ============================================================
        function spawnFood(worldPos) {
            const geo = new THREE.SphereGeometry(0.2, 8, 8);
            const mat = new THREE.MeshStandardMaterial({
                color: 0x8bc34a,
                roughness: 0.6,
                emissive: 0x33691e,
                emissiveIntensity: 0.3
            });
            const food = new THREE.Mesh(geo, mat);
            food.position.copy(worldPos);
            scene.add(food);

            foodArray.push({
                mesh: food,
                velocity: new THREE.Vector3(0, -0.5, 0),
                age: 0
            });
        }

        // ============================================================
        //  CLICK HANDLER (Raycasting)
        // ============================================================
        function onCanvasClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Check if click is within tank bounds (approximate plane)
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, intersectPoint);

            if (intersectPoint) {
                // Clamp to tank
                intersectPoint.x = THREE.MathUtils.clamp(intersectPoint.x, -HALF_W + 1, HALF_W - 1);
                intersectPoint.z = THREE.MathUtils.clamp(intersectPoint.z, -HALF_D + 1, HALF_D - 1);
                intersectPoint.y = TANK_H * 0.7;

                spawnFood(intersectPoint);
            }
        }

        // ============================================================
        //  FISH AI & BEHAVIOR
        // ============================================================
        const _tmpVec = new THREE.Vector3();
        const _tmpVec2 = new THREE.Vector3();

        function updateFishAI(dt) {
            for (let i = 0; i < fishArray.length; i++) {
                const fish = fishArray[i);

                // --- Collision Avoidance ---
                for (let j = i + 1; j < fishArray.length; j++) {
                    const other = fishArray[j];
                    _tmpVec.subVectors(other.mesh.position, fish.mesh.position);
                    const dist = _tmpVec.length();
                    const minDist = (fish.avoidanceRadius + other.avoidanceRadius) * 0.5;

                    if (dist < minDist && dist > 0.01) {
                        const push = _tmpVec.normalize().multiplyScalar((minDist - dist) * 2);
                        fish.velocity.add(push);
                        other.velocity.sub(push);
                    }
                }

                // --- Wall Reflection (smooth) ---
                const margin = 1.5;
                const wallForce = new THREE.Vector3();

                if (fish.mesh.position.x < -HALF_W + margin) wallForce.x += (HALF_W - margin - Math.abs(fish.mesh.position.x)) * 0.5;
                if (fish.mesh.position.x > HALF_W - margin) wallForce.x -= (HALF_W - margin - Math.abs(fish.mesh.position.x)) * 0.5;
                if (fish.mesh.position.y < 1.5) wallForce.y += 0.3;
                if (fish.mesh.position.y > TANK_H - margin) wallForce.y -= 0.3;
                if (fish.mesh.position.z < -HALF_D + margin) wallForce.z += (HALF_D - margin - Math.abs(fish.mesh.position.z)) * 0.5;
                if (fish.mesh.position.z > HALF_D - margin) wallForce.z -= (HALF_D - margin - Math.abs(fish.mesh.position.z)) * 0.5;

                fish.velocity.add(wallForce.multiplyScalar(dt));

                // --- Random Wandering ---
                fish.wanderTimer -= dt;
                if (fish.wanderTimer <= 0) {
                    fish.wanderTimer = 2 + Math.random() * 4;
                    fish.velocity.x += (Math.random() - 0.5) * 1.5;
                    fish.velocity.z += (Math.random() - 0.5) * 1.5;
                    fish.velocity.y += (Math.random() - 0.5) * 0.5;
                }

                // --- Food Chasing ---
                if (foodArray.length > 0) {
                    let closestFood = null;
                    let closestDist = 15; // detection radius

                    for (const food of foodArray) {
                        const d = fish.mesh.position.distanceTo(food.mesh.position);
                        if (d < closestDist) {
                            closestDist = d;
                            closestFood = food;
                        }
                    }

                    if (closestFood) {
                        _tmpVec.subVectors(closestFood.mesh.position, fish.mesh.position).normalize();
                        fish.velocity.lerp(_tmpVec.multiplyScalar(fish.speed * 1.5), 0.05);

                        // Eat!
                        if (closestDist < 0.6) {
                            scene.remove(closestFood.mesh);
                            closestFood.mesh.geometry.dispose();
                            closestFood.mesh.material.dispose();
                            foodArray.splice(foodArray.indexOf(closestFood), 1);

                            // Grow 5%
                            fish.baseScale *= 1.05;
                            fish.mesh.scale.setScalar(fish.baseScale);
                        }
                    }
                }

                // --- Speed Limit ---
                const maxSpeed = fish.speed * 2;
                if (fish.velocity.length() > maxSpeed) {
                    fish.velocity.normalize().multiplyScalar(maxSpeed);
                }

                // --- Update Position ---
                fish.mesh.position.add(_tmpVec2.copy(fish.velocity).multiplyScalar(dt));

                // --- Orient Fish in Direction of Movement ---
                if (fish.velocity.lengthSq() > 0.01) {
                    const targetQuat = new THREE.Quaternion();
                    _tmpVec.copy(fish.velocity).normalize();
                    targetQuat.setFromUnitVectors(new THREE.Vector3(1, 0, 0), _tmpVec);
                    fish.mesh.quaternion.slerp(targetQuat, 0.05);
                }
            }
        }

        // ============================================================
        //  ANIMATION LOOP
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.elapsedTime;

            // --- FPS ---
            frameCount++;
            if (elapsed - lastFpsTime >= 0.5) {
                const fps = Math.round(frameCount / (elapsed - lastFpsTime));
                const el = document.getElementById('fpsCounter');
                el.textContent = fps;
                el.className = 'fps-value' + (fps < 30 ? ' critical' : fps < 50 ? ' low' : '');
                frameCount = 0;
                lastFpsTime = elapsed;
            }

            // --- Fish Animation (tail, fins) ---
            for (const fish of fishArray) {
                const t = elapsed * fish.tailSpeed + fish.phase;
                fish.tail.rotation.z = Math.sin(t) * 0.5;
                fish.leftFin.rotation.x = 0.3 + Math.sin(t * 0.7) * 0.15;
                fish.rightFin.rotation.x = -0.3 + Math.cos(t * 0.7) * 0.15;
            }

            // --- Fish AI ---
            updateFishAI(dt);

            // --- Bubbles ---
            for (const b of bubbleArray) {
                b.mesh.position.y += b.speed * dt;
                b.mesh.position.x += Math.sin(elapsed * 2 + b.phase) * b.swayAmp * dt;
                b.mesh.position.z += Math.cos(elapsed * 1.5 + b.phase) * b.swayAmp * 0.5 * dt;

                // Reset at surface
                if (b.mesh.position.y > TANK_H - 1) {
                    b.mesh.position.y = 0.5 + Math.random();
                    b.mesh.position.x = (Math.random() - 0.5) * (TANK_W - 2);
                    b.mesh.position.z = (Math.random() - 0.5) * (TANK_D - 2);
                }
            }

            // --- Food Physics ---
            for (let i = foodArray.length - 1; i >= 0; i--) {
                const f = foodArray[i];
                f.velocity.y -= 3 * dt; // gravity
                f.mesh.position.addScaledVector(f.velocity, dt);
                f.age += dt;

                // Remove at bottom or old
                if (f.mesh.position.y < 0.3 || f.age > 20) {
                    scene.remove(f.mesh);
                    f.mesh.geometry.dispose();
                    f.mesh.material.dispose();
                    foodArray.splice(i, 1);
                }
            }

            // --- Seaweed Sway ---
            for (const s of seaweedArray) {
                const t = elapsed * s.speed + s.phase;
                s.mesh.rotation.x = Math.sin(t) * 0.04;
                s.mesh.rotation.z = Math.cos(t * 0.7) * 0.03;
            }

            // --- Controls ---
            controls.update();

            // --- Render ---
            renderer.render(scene, camera);
        }

        // ============================================================
        //  RESIZE
        // ============================================================
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================================
        //  START
        // ============================================================
        init();
    </script>
</body>
