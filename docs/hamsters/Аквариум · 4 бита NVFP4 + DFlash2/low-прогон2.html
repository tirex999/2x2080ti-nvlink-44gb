<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Аквариум</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #0a1628 0%, #1a3a5c 50%, #0d2b4a 100%);
        }

        canvas {
            display: block;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 25, 50, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            color: #e0f0ff;
            min-width: 260px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .ui-panel h1 {
            font-size: 1.4em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #64b5f6, #42a5f5, #90caf9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }

        .ui-panel .instructions {
            font-size: 0.8em;
            line-height: 1.6;
            color: rgba(180, 220, 255, 0.8);
            margin-bottom: 15px;
        }

        .ui-panel .instructions span {
            color: #64b5f6;
            font-weight: bold;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.3s ease;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-fish {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-fish:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.5);
        }

        .btn-bubbles {
            background: linear-gradient(135deg, #42a5f5, #64b5f6);
            box-shadow: 0 4px 15px rgba(66, 165, 245, 0.3);
        }

        .btn-bubbles:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 165, 245, 0.5);
        }

        .btn-light {
            background: linear-gradient(135deg, #ffd54f, #ffb300);
            box-shadow: 0 4px 15px rgba(255, 213, 79, 0.3);
        }

        .btn-light:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 213, 79, 0.5);
        }

        .stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 25, 50, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.2);
            border-radius: 16px;
            padding: 16px 20px;
            color: #e0f0ff;
            font-size: 0.85em;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .stats-panel .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .stats-panel .stat:last-child {
            margin-bottom: 0;
        }

        .stats-panel .stat-label {
            color: rgba(180, 220, 255, 0.7);
        }

        .stats-panel .stat-value {
            font-weight: bold;
            color: #64b5f6;
            font-size: 1.1em;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 25, 50, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(100, 180, 255, 0.15);
            border-radius: 20px;
            padding: 8px 20px;
            color: rgba(180, 220, 255, 0.7);
            font-size: 0.75em;
        }

        @media (max-width: 768px) {
            .ui-panel {
                min-width: 200px;
                padding: 14px;
            }
            .ui-panel h1 {
                font-size: 1.1em;
            }
            .stats-panel {
                padding: 10px 14px;
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <div class="ui-panel">
        <h1>🐠 3D Аквариум</h1>
        <div class="instructions">
            <span>ЛКМ</span> — вращение камеры<br>
            <span>ПКМ</span> — панорамирование<br>
            <span>Колесо</span> — зум<br>
            <span>Клик</span> — покормить рыбок
        </div>
        <div class="btn-group">
            <button class="btn btn-fish" id="btnAddFish">+ Добавить рыбку</button>
            <button class="btn btn-bubbles" id="btnBubbles">+ Больше пузырей</button>
            <button class="btn btn-light" id="btnLight">💡 Свет: ВКЛ</button>
        </div>
    </div>

    <div class="stats-panel">
        <div class="stat">
            <span class="stat-label">Рыбки:</span>
            <span class="stat-value" id="fishCount">15</span>
        </div>
        <div class="stat">
            <span class="stat-label">FPS:</span>
            <span class="stat-value" id="fpsCounter">60</span>
        </div>
        <div class="stat">
            <span class="stat-label">Корм:</span>
            <span class="stat-value" id="foodCount">0</span>
        </div>
    </div>

    <div class="hint">Кликайте по воде, чтобы бросить корм 🍽️</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // ===== SCENE SETUP =====
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a2a4a, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(30, 18, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // ===== CONTROLS =====
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 60;
        controls.maxPolarAngle = Math.PI / 1.8;
        controls.target.set(0, 5, 0);

        // ===== LIGHTING =====
        const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(15, 30, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 80;
        dirLight.shadow.camera.left = -25;
        dirLight.shadow.camera.right = 25;
        dirLight.shadow.camera.top = 25;
        dirLight.shadow.camera.bottom = -25;
        scene.add(dirLight);

        const pointLight1 = new THREE.PointLight(0x4488ff, 0.6, 40);
        pointLight1.position.set(-10, 12, -5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x2266cc, 0.5, 40);
        pointLight2.position.set(10, 8, 8);
        scene.add(pointLight2);

        // ===== AQUARIUM DIMENSIONS =====
        const AQ_W = 36, AQ_H = 24, AQ_D = 20;
        const HALF_W = AQ_W / 2, HALF_H = AQ_H / 2, HALF_D = AQ_D / 2;

        // ===== GLASS CONTAINER =====
        function createAquarium() {
            const group = new THREE.Group();

            // Glass walls
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0x88ccee,
                metalness: 0.0,
                roughness: 0.05,
                transmission: 0.95,
                thickness: 0.5,
                transparent: true,
                opacity: 0.3,
                side: THREE.DoubleSide
            });

            // Back wall
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(AQ_W, AQ_H), glassMat);
            backWall.position.set(0, HALF_H, -HALF_D);
            group.add(backWall);

            // Front wall
            const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(AQ_W, AQ_H), glassMat);
            frontWall.position.set(0, HALF_H, HALF_D);
            group.add(frontWall);

            // Left wall
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(AQ_D, AQ_H), glassMat);
            leftWall.position.set(-HALF_W, HALF_H, 0);
            leftWall.rotation.y = Math.PI / 2;
            group.add(leftWall);

            // Right wall
            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(AQ_D, AQ_H), glassMat);
            rightWall.position.set(HALF_W, HALF_H, 0);
            rightWall.rotation.y = Math.PI / 2;
            group.add(rightWall);

            // Top
            const topWall = new THREE.Mesh(new THREE.PlaneGeometry(AQ_W, AQ_D), glassMat);
            topWall.position.set(0, AQ_H, 0);
            topWall.rotation.x = Math.PI / 2;
            group.add(topWall);

            // Edges
            const edgeGeo = new THREE.BoxGeometry(AQ_W, AQ_H, AQ_D);
            const edges = new THREE.EdgesGeometry(edgeGeo);
            const edgeMat = new THREE.LineBasicMaterial({ color: 0x4488aa, linewidth: 2 });
            const edgeLines = new THREE.LineSegments(edges, edgeMat);
            edgeLines.position.y = HALF_H;
            group.add(edgeLines);

            scene.add(group);
            return group;
        }
        createAquarium();

        // ===== SANDY BOTTOM =====
        function createSand() {
            const geo = new THREE.PlaneGeometry(AQ_W, AQ_D, 32, 32);
            const positions = geo.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                positions.setZ(i, (Math.random() - 0.5) * 0.4);
            }
            geo.computeVertexNormals();

            const mat = new THREE.MeshStandardMaterial({
                color: 0xc2a66b,
                roughness: 0.9,
                metalness: 0.0
            });

            const sand = new THREE.Mesh(geo, mat);
            sand.rotation.x = -Math.PI / 2;
            sand.position.y = 0.2;
            sand.receiveShadow = true;
            scene.add(sand);
        }
        createSand();

        // ===== ROCKS =====
        function createRocks() {
            for (let i = 0; i < 8; i++) {
                const size = 0.5 + Math.random() * 1.2;
                const geo = new THREE.DodecahedronGeometry(size, 1);
                const pos = geo.attributes.position;
                for (let j = 0; j < pos.count; j++) {
                    pos.setX(j, pos.getX(j) + (Math.random() - 0.5) * 0.3);
                    pos.setY(j, pos.getY(j) + (Math.random() - 0.5) * 0.3);
                    pos.setZ(j, pos.getZ(j) + (Math.random() - 0.5) * 0.3);
                }
                geo.computeVertexNormals();

                const shade = 0.3 + Math.random() * 0.3;
                const mat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color(shade, shade * 0.9, shade * 0.8),
                    roughness: 0.85,
                    metalness: 0.1
                });

                const rock = new THREE.Mesh(geo, mat);
                rock.position.set(
                    (Math.random() - 0.5) * (AQ_W - 4),
                    size * 0.4 + 0.3,
                    (Math.random() - 0.5) * (AQ_D - 4)
                );
                rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                rock.castShadow = true;
                rock.receiveShadow = true;
                scene.add(rock);
            }
        }
        createRocks();

        // ===== SEAWEED =====
        const seaweeds = [];
        function createSeaweed() {
            for (let i = 0; i < 12; i++) {
                const height = 3 + Math.random() * 5;
                const points = [];
                const segments = 8;
                for (let j = 0; j <= segments; j++) {
                    const t = j / segments;
                    points.push(new THREE.Vector3(
                        Math.sin(t * 2) * 0.3,
                        t * height,
                        Math.cos(t * 3) * 0.2
                    ));
                }
                const curve = new THREE.CatmullRomCurve3(points);
                const tubeGeo = new THREE.TubeGeometry(curve, 12, 0.15 + Math.random() * 0.1, 6, false);

                const hue = 0.28 + Math.random() * 0.12;
                const sat = 0.5 + Math.random() * 0.3;
                const light = 0.25 + Math.random() * 0.2;
                const mat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(hue, sat, light),
                    roughness: 0.7,
                    side: THREE.DoubleSide
                });

                const weed = new THREE.Mesh(tubeGeo, mat);
                weed.position.set(
                    (Math.random() - 0.5) * (AQ_W - 6),
                    0.3,
                    (Math.random() - 0.5) * (AQ_D - 6)
                );
                weed.castShadow = true;
                scene.add(weed);
                seaweeds.push({ mesh: weed, phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 0.5 });
            }
        }
        createSeaweed();

        // ===== BUBBLES =====
        const bubbles = [];
        function createBubble(x, y, z) {
            const size = 0.08 + Math.random() * 0.15;
            const geo = new THREE.SphereGeometry(size, 8, 8);
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0xaaddff,
                metalness: 0.0,
                roughness: 0.1,
                transmission: 0.9,
                transparent: true,
                opacity: 0.4,
                clearcoat: 1.0
            });
            const bubble = new THREE.Mesh(geo, mat);
            bubble.position.set(
                x !== undefined ? x : (Math.random() - 0.5) * (AQ_W - 4),
                y !== undefined ? y : Math.random() * AQ_H,
                z !== undefined ? z : (Math.random() - 0.5) * (AQ_D - 4)
            );
            scene.add(bubble);
            bubbles.push({
                mesh: bubble,
                speed: 0.5 + Math.random() * 1.0,
                phase: Math.random() * Math.PI * 2,
                amplitude: 0.2 + Math.random() * 0.4
            });
        }

        for (let i = 0; i < 30; i++) createBubble();

        // ===== FISH SYSTEM =====
        const fishArray = [];
        const foodArray = [];

        const COLOR_SCHEMES = [
            { body: 0xff6600, fin: 0xff8833, name: 'orange' },
            { body: 0x2266ff, fin: 0x4488ff, name: 'blue' },
            { body: 0xffdd00, fin: 0xff3300, name: 'yellow-red' },
            { body: 0x9933ff, fin: 0xbb66ff, name: 'purple' },
            { body: 0xff2222, fin: 0xff5555, name: 'red' },
            { body: 0x22cc44, fin: 0x44ee66, name: 'green' },
            { body: 0xff66aa, fin: 0xff88cc, name: 'pink' },
            { body: 0xffaa00, fin: 0xffcc44, name: 'gold' }
        ];

        function createFish(x, y, z) {
            const scheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];
            const scale = 0.6 + Math.random() * 0.6;
            const group = new THREE.Group();

            // Body
            const bodyGeo = new THREE.SphereGeometry(0.5, 12, 10);
            bodyGeo.scale(1.4, 0.8, 0.6);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: scheme.body,
                roughness: 0.4,
                metalness: 0.3
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            group.add(body);

            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const pupilGeo = new THREE.SphereGeometry(0.04, 8, 8);
            const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });

            const leftEye = new THREE.Mesh(eyeGeo, eyeWhiteMat);
            leftEye.position.set(0.55, 0.1, 0.22);
            group.add(leftEye);

            const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
            leftPupil.position.set(0.6, 0.1, 0.22);
            group.add(leftPupil);

            const rightEye = new THREE.Mesh(eyeGeo, eyeWhiteMat);
            rightEye.position.set(0.55, 0.1, -0.22);
            group.add(rightEye);

            const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
            rightPupil.position.set(0.6, 0.1, -0.22);
            group.add(rightPupil);

            // Tail
            const tailGeo = new THREE.ConeGeometry(0.25, 0.5, 4);
            tailGeo.rotateZ(Math.PI / 2);
            const tailMat = new THREE.MeshStandardMaterial({
                color: scheme.fin,
                roughness: 0.5,
                metalness: 0.2,
                side: THREE.DoubleSide
            });
            const tail = new THREE.Mesh(tailGeo, tailMat);
            tail.position.set(-0.75, 0, 0);
            tail.castShadow = true;
            group.add(tail);

            // Top fin
            const topFinGeo = new THREE.ConeGeometry(0.15, 0.35, 4);
            topFinGeo.rotateX(-Math.PI / 4);
            const topFinMat = new THREE.MeshStandardMaterial({
                color: scheme.fin,
                roughness: 0.5,
                side: THREE.DoubleSide
            });
            const topFin = new THREE.Mesh(topFinGeo, topFinMat);
            topFin.position.set(0, 0.4, 0);
            group.add(topFin);

            // Left fin
            const leftFinGeo = new THREE.ConeGeometry(0.12, 0.3, 4);
            leftFinGeo.rotateZ(Math.PI / 2);
            const leftFin = new THREE.Mesh(leftFinGeo, tailMat.clone());
            leftFin.position.set(0.1, -0.1, 0.35);
            leftFin.rotation.x = Math.PI / 6;
            group.add(leftFin);

            // Right fin
            const rightFinGeo = new THREE.ConeGeometry(0.12, 0.3, 4);
            rightFinGeo.rotateZ(-Math.PI / 2);
            const rightFin = new THREE.Mesh(rightFinGeo, tailMat.clone());
            rightFin.position.set(0.1, -0.1, -0.35);
            rightFin.rotation.x = -Math.PI / 6;
            group.add(rightFin);

            group.scale.setScalar(scale);
            group.position.set(x || (Math.random() - 0.5) * (AQ_W - 6), y || 3 + Math.random() * (AQ_H - 6), z || (Math.random() - 0.5) * (AQ_D - 6));
            scene.add(group);

            const fish = {
                mesh: group,
                tail: tail,
                leftFin: leftFin,
                rightFin: rightFin,
                topFin: topFin,
                velocity: new THREE.Vector3((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 2),
                speed: 2 + Math.random() * 2,
                tailSpeed: 4 + Math.random() * 4,
                phase: Math.random() * Math.PI * 2,
                targetFood: null,
                avoidanceRadius: 2.5 + Math.random() * 1.5,
                baseScale: scale,
                wanderTimer: Math.random() * 3,
                wanderInterval: 2 + Math.random() * 4
            };

            fishArray.push(fish);
            updateStats();
            return fish;
        }

        // Create initial 15 fish
        for (let i = 0; i < 15; i++) {
            createFish();
        }

        // ===== FOOD SYSTEM =====
        function createFood(x, y, z) {
            const geo = new THREE.SphereGeometry(0.15, 8, 8);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xcc6600,
                emissive: 0x663300,
                roughness: 0.6
            });
            const food = new THREE.Mesh(geo, mat);
            food.position.set(x, y, z);
            food.castShadow = true;
            scene.add(food);

            const foodObj = {
                mesh: food,
                velocity: new THREE.Vector3(0, -1, 0),
                eaten: false
            };
            foodArray.push(foodObj);
            updateStats();
            return foodObj;
        }

        function removeFood(index) {
            scene.remove(foodArray[index].mesh);
            foodArray.splice(index, 1);
            updateStats();
        }

        // ===== RAYCASTER FOR CLICKING =====
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const intersectPoint = new THREE.Vector3();

        renderer.domElement.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            // Intersect with a virtual plane at mid-height
            const planeAtMid = new THREE.Plane(new THREE.Vector3(0, 1, 0), -AQ_H);
            if (raycaster.ray.intersectPlane(planeAtMid, intersectPoint)) {
                intersectPoint.x = THREE.MathUtils.clamp(intersectPoint.x, -HALF_W + 1, HALF_W - 1);
                intersectPoint.z = THREE.MathUtils.clamp(intersectPoint.z, -HALF_D + 1, HALF_D - 1);
                intersectPoint.y = AQ_H - 1;
                createFood(intersectPoint.x, intersectPoint.y, intersectPoint.z);
            }
        });

        // ===== FISH BEHAVIOR =====
        function updateFish(dt, time) {
            for (let i = fishArray.length - 1; i >= 0; i--) {
                const fish = fishArray[i];
                const pos = fish.mesh.position;

                // Wander
                fish.wanderTimer += dt;
                if (fish.wanderTimer > fish.wanderInterval) {
                    fish.wanderTimer = 0;
                    fish.wanderInterval = 2 + Math.random() * 4;
                    fish.velocity.x += (Math.random() - 0.5) * 1.5;
                    fish.velocity.y += (Math.random() - 0.5) * 0.5;
                    fish.velocity.z += (Math.random() - 0.5) * 1.5;
                }

                // Food seeking
                fish.targetFood = null;
                let closestDist = 15;
                for (let f = 0; f < foodArray.length; f++) {
                    if (foodArray[f].eaten) continue;
                    const dist = pos.distanceTo(foodArray[f].mesh.position);
                    if (dist < closestDist) {
                        closestDist = dist;
                        fish.targetFood = foodArray[f];
                    }
                }

                if (fish.targetFood) {
                    const dir = new THREE.Vector3().subVectors(fish.targetFood.mesh.position, pos).normalize();
                    fish.velocity.lerp(dir.multiplyScalar(fish.speed * 1.5), 0.05);

                    // Eat food
                    if (closestDist < 0.8) {
                        fish.targetFood.eaten = true;
                        const idx = foodArray.indexOf(fish.targetFood);
                        if (idx !== -1) removeFood(idx);
                        // Grow
                        const newScale = fish.baseScale * 1.05;
                        fish.baseScale = Math.min(fish.baseScale * 1.05, 2.0);
                        fish.mesh.scale.setScalar(fish.baseScale);
                    }
                } else {
                    // Normalize speed
                    const speed = fish.velocity.length();
                    if (speed > 0.01) {
                        fish.velocity.normalize().multiplyScalar(fish.speed * 0.6);
                    }
                }

                // Separation
                for (let j = 0; j < fishArray.length; j++) {
                    if (i === j) continue;
                    const other = fishArray[j];
                    const diff = new THREE.Vector3().subVectors(pos, other.mesh.position);
                    const dist = diff.length();
                    if (dist < fish.avoidanceRadius && dist > 0.01) {
                        diff.normalize().multiplyScalar((fish.avoidanceRadius - dist) / fish.avoidanceRadius * 2);
                        fish.velocity.add(diff);
                    }
                }

                // Wall bouncing
                const margin = 2;
                if (pos.x > HALF_W - margin) fish.velocity.x -= 0.3;
                if (pos.x < -HALF_W + margin) fish.velocity.x += 0.3;
                if (pos.y > AQ_H - margin) fish.velocity.y -= 0.3;
                if (pos.y < margin) fish.velocity.y += 0.3;
                if (pos.z > HALF_D - margin) fish.velocity.z -= 0.3;
                if (pos.z < -HALF_D + margin) fish.velocity.z += 0.3;

                // Clamp position
                pos.x = THREE.MathUtils.clamp(pos.x, -HALF_W + 1, HALF_W - 1);
                pos.y = THREE.MathUtils.clamp(pos.y, 1, AQ_H - 1);
                pos.z = THREE.MathUtils.clamp(pos.z, -HALF_D + 1, HALF_D - 1);

                // Apply velocity
                pos.add(fish.velocity.clone().multiplyScalar(dt));

                // Orient fish toward movement direction
                if (fish.velocity.length() > 0.1) {
                    const targetQuat = new THREE.Quaternion();
                    const lookDir = fish.velocity.clone().normalize();
                    const m = new THREE.Matrix4();
                    m.lookAt(new THREE.Vector3(), lookDir, new THREE.Vector3(0, 1, 0));
                    targetQuat.setFromRotationMatrix(m);
                    fish.mesh.quaternion.slerp(targetQuat, 0.05);
                }

                // Animate tail
                fish.phase += fish.tailSpeed * dt;
                fish.tail.rotation.y = Math.sin(fish.phase) * 0.5;

                // Animate fins
                const finAngle = Math.sin(fish.phase * 0.7) * 0.3;
                fish.leftFin.rotation.y = finAngle;
                fish.rightFin.rotation.y = -finAngle;
                fish.topFin.rotation.z = Math.sin(fish.phase * 0.5) * 0.2;
            }
        }

        // ===== UPDATE FOOD =====
        function updateFood(dt) {
            for (let i = foodArray.length - 1; i >= 0; i--) {
                const food = foodArray[i];
                if (food.eaten) continue;

                // Gravity
                food.velocity.y -= 3 * dt;
                food.mesh.position.add(food.velocity.clone().multiplyScalar(dt));

                // Remove if hits bottom
                if (food.mesh.position.y < 0.5) {
                    removeFood(i);
                }
            }
        }

        // ===== UPDATE BUBBLES =====
        function updateBubbles(dt, time) {
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                b.mesh.position.y += b.speed * dt;
                b.mesh.position.x += Math.sin(time * 2 + b.phase) * b.amplitude * dt;
                b.mesh.position.z += Math.cos(time * 1.5 + b.phase) * b.amplitude * dt;

                if (b.mesh.position.y > AQ_H - 0.5) {
                    b.mesh.position.y = 0.5;
                    b.mesh.position.x = (Math.random() - 0.5) * (AQ_W - 4);
                    b.mesh.position.z = (Math.random() - 0.5) * (AQ_D - 4);
                }
            }
        }

        // ===== UPDATE SEAWEED =====
        function updateSeaweed(time) {
            for (const s of seaweeds) {
                s.mesh.rotation.x = Math.sin(time * s.speed + s.phase) * 0.05;
                s.mesh.rotation.z = Math.cos(time * s.speed * 0.7 + s.phase) * 0.04;
            }
        }

        // ===== UI BUTTONS =====
        let lightOn = true;

        document.getElementById('btnAddFish').addEventListener('click', () => {
            createFish();
        });

        document.getElementById('btnBubbles').addEventListener('click', () => {
            for (let i = 0; i < 10; i++) createBubble();
        });

        document.getElementById('btnLight').addEventListener('click', function () {
            lightOn = !lightOn;
            dirLight.intensity = lightOn ? 1.0 : 0.1;
            this.textContent = lightOn ? '💡 Свет: ВКЛ' : '💡 Свет: ВЫКЛ';
        });

        // ===== STATS =====
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let currentFps = 60;

        function updateStats() {
            document.getElementById('fishCount').textContent = fishArray.length;
            document.getElementById('foodCount').textContent = foodArray.length;
        }

        function updateFps() {
            frameCount++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                currentFps = Math.round(frameCount * 1000 / (now - lastFpsTime));
                document.getElementById('fpsCounter').textContent = currentFps;
                frameCount = 0;
                lastFpsTime = now;
            }
        }

        // ===== ANIMATION LOOP =====
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const time = clock.elapsedTime;

            updateFish(dt, time);
            updateFood(dt);
            updateBubbles(dt, time);
            updateSeaweed(time);

            // Subtle light animation
            pointLight1.intensity = 0.5 + Math.sin(time * 0.5) * 0.15;
            pointLight2.intensity = 0.4 + Math.cos(time * 0.7) * 0.1;

            controls.update();
            renderer.render(scene, camera);
            updateFps();
        }

        animate();

        // ===== RESIZE =====
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
