<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐠 3D Аквариум</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #0a1628; }
    #canvas-container { width: 100vw; height: 100vh; }

    .panel {
        position: absolute;
        background: rgba(10, 25, 50, 0.55);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(100, 180, 255, 0.25);
        border-radius: 16px;
        padding: 18px 20px;
        color: #dceeff;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        z-index: 10;
    }
    #info-panel { top: 20px; left: 20px; max-width: 290px; }
    #stats-panel { top: 20px; right: 20px; min-width: 180px; text-align: right; }

    h1 {
        font-size: 22px;
        margin-bottom: 10px;
        background: linear-gradient(90deg, #4fc3f7, #81d4fa, #ffd54f);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .instructions { font-size: 12.5px; line-height: 1.65; opacity: 0.85; margin-bottom: 14px; }
    .instructions b { color: #81d4fa; }

    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
        flex: 1;
        padding: 9px 12px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        white-space: nowrap;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(79, 195, 247, 0.45); }
    button:active { transform: translateY(0); }
    .btn-fish  { background: linear-gradient(135deg, #ff8a65, #ff5252); }
    .btn-bubble{ background: linear-gradient(135deg, #4fc3f7, #29b6f6); }
    .btn-light { background: linear-gradient(135deg, #ffd54f, #ffb300); }

    .stat-line { font-size: 14px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 16px; }
    .stat-value { font-weight: 700; color: #ffd54f; font-variant-numeric: tabular-nums; }
    #fps { color: #69f0ae; }

    @media (max-width: 640px) {
        #info-panel { max-width: 220px; padding: 12px; }
        #stats-panel { min-width: 130px; padding: 12px; }
        h1 { font-size: 17px; }
    }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div class="panel" id="info-panel">
    <h1>🐠 3D Аквариум</h1>
    <div class="instructions">
        <b>ЛКМ + движение</b> — вращение камеры<br>
        <b>ПКМ + движение</b> — панорамирование<br>
        <b>Колесо мыши</b> — зум<br>
        <b>Клик по воде</b> — покормить рыбок 🍽️
    </div>
    <div class="btn-row">
        <button class="btn-fish" onclick="addFish()">+ Рыбка</button>
        <button class="btn-bubble" onclick="addBubbles(10)">+ Пузыри</button>
        <button class="btn-light" onclick="toggleLight()">💡 Свет</button>
    </div>
</div>

<div class="panel" id="stats-panel">
    <div class="stat-line"><span>🐟 Рыбок:</span><span class="stat-value" id="fish-count">15</span></div>
    <div class="stat-line"><span>📊 FPS:</span><span class="stat-value" id="fps">--</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
// ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ============================================================
const TANK_W = 36, TANK_H = 24, TANK_D = 20; // ширина(X), высота(Y), глубина(Z)
const MARGIN = 1.5;                          // отступ рыбок от стенок

let scene, camera, renderer, controls, clock;
let sunLight, lightOn = true;
let raycaster, mouseNDC;

const fishArray = [];
const bubbleArray = [];
const foodArray = [];
const weedArray = [];

const FISH_COLORS = [
    { body: 0xff8c42, fin: 0xffb07a },   // оранжевая
    { body: 0x2196f3, fin: 0x64b5f6 },   // синяя
    { body: 0xffeb3b, fin: 0xf44336 },   // жёлто-красная
    { body: 0x9c27b0, fin: 0xce93d8 },   // фиолетовая
    { body: 0xe53935, fin: 0xef9a9a },   // красная
    { body: 0x43a047, fin: 0xa5d6a7 },   // зелёная
    { body: 0xec407a, fin: 0xf8bbd0 },   // розовая
    { body: 0xffc107, fin: 0xffe082 }    // золотая
];

// ============================================================
// ИНИЦИАЛИЗАЦИЯ СЦЕНЫ
// ============================================================
function init() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d2137, 0.012);

    // Градиентный фон
    const canvasGrad = document.createElement('canvas');
    canvasGrad.width = 2; canvasGrad.height = 256;
    const gctx = canvasGrad.getContext('2d');
    const grad = gctx.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#1a4a7a');
    grad.addColorStop(1, '#061224');
    gctx.fillStyle = grad;
    gctx.fillRect(0, 0, 2, 256);
    const bgTex = new THREE.CanvasTexture(canvasGrad);
    scene.background = bgTex;

    camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
    camera.position.set(28, 14, 34);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 10;
    controls.maxDistance = 60;
    controls.maxPolarAngle = Math.PI / 1.8;
    controls.target.set(0, TANK_H / 2 - 2, 0);

    raycaster = new THREE.Raycaster();
    mouseNDC = new THREE.Vector2();
    clock = new THREE.Clock();

    setupLights();
    buildTank();
    buildSand();
    buildRocks();
    buildWeeds();

    for (let i = 0; i < 15; i++) addFish();
    addBubbles(30);

    renderer.domElement.addEventListener('click', onCanvasClick);
    window.addEventListener('resize', onResize);

    animate();
}

// ============================================================
// ОСВЕЩЕНИЕ
// ============================================================
function setupLights() {
    scene.add(new THREE.AmbientLight(0x404040, 0.4));

    sunLight = new THREE.DirectionalLight(0xfff4e0, 1.1);
    sunLight.position.set(20, 40, 15);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -25;
    sunLight.shadow.camera.right = 25;
    sunLight.shadow.camera.top = 25;
    sunLight.shadow.camera.bottom = -25;
    sunLight.shadow.camera.far = 100;
    sunLight.shadow.bias = -0.001;
    scene.add(sunLight);

    const p1 = new THREE.PointLight(0x4fc3f7, 0.6, 60);
    p1.position.set(-TANK_W / 3, TANK_H / 2, TANK_D / 4);
    scene.add(p1);

    const p2 = new THREE.PointLight(0x2962ff, 0.5, 60);
    p2.position.set(TANK_W / 3, TANK_H / 2, -TANK_D / 4);
    scene.add(p2);
}

function toggleLight() {
    lightOn = !lightOn;
    sunLight.intensity = lightOn ? 1.1 : 0.15;
}

// ============================================================
// АКВАРИУМ (СТЕКЛЯННЫЙ КОНТЕЙНЕР)
// ============================================================
function buildTank() {
    const geo = new THREE.BoxGeometry(TANK_W, TANK_H, TANK_D);
    const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xbfe8ff,
        transmission: 0.95,
        transparent: true,
        opacity: 0.15,
        roughness: 0.05,
        metalness: 0,
        side: THREE.DoubleSide,
        depthWrite: false
    });
    const tank = new THREE.Mesh(geo, glassMat);
    tank.position.y = TANK_H / 2;
    scene.add(tank);

    const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color: 0x8ecdf0, transparent: true, opacity: 0.6 })
    );
    edges.position.copy(tank.position);
    scene.add(edges);
}

// ============================================================
// ПЕСЧАНОЕ ДНО
// ============================================================
function buildSand() {
    const geo = new THREE.PlaneGeometry(TANK_W, TANK_D, 48, 48);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i);
        pos.setZ(i,
            Math.sin(x * 0.5) * Math.cos(y * 0.4) * 0.35 +
            Math.sin(x * 1.7 + y * 1.3) * 0.15
        );
    }
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({ color: 0xd9c08a, roughness: 0.95 });
    const sand = new THREE.Mesh(geo, mat);
    sand.rotation.x = -Math.PI / 2;
    sand.position.y = 0.4;
    sand.receiveShadow = true;
    scene.add(sand);
}

// ============================================================
// КАМНИ
// ============================================================
function buildRocks() {
    for (let i = 0; i < 8; i++) {
        const size = 0.7 + Math.random() * 1.4;
        const geo = new THREE.DodecahedronGeometry(size, 1);
        // Деформация вершин
        const pos = geo.attributes.position;
        for (let v = 0; v < pos.count; v++) {
            const n = 1 + (Math.random() - 0.5) * 0.5;
            pos.setXYZ(v, pos.getX(v) * n, pos.getY(v) * n * 0.8, pos.getZ(v) * n);
        }
        geo.computeVertexNormals();

        const rock = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 0.15, 0.25 + Math.random() * 0.2),
            roughness: 0.9
        }));
        rock.position.set(
            (Math.random() - 0.5) * (TANK_W - 6),
            size * 0.45,
            (Math.random() - 0.5) * (TANK_D - 6)
        );
        rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        rock.castShadow = true;
        rock.receiveShadow = true;
        scene.add(rock);
    }
}

// ============================================================
// ВОДОРОСЛИ
// ============================================================
function buildWeeds() {
    for (let i = 0; i < 12; i++) {
        const h = 3 + Math.random() * 5;
        const points = [];
        const baseX = (Math.random() - 0.5) * (TANK_W - 8);
        const baseZ = (Math.random() - 0.5) * (TANK_D - 8);
        for (let s = 0; s <= 5; s++) {
            const t = s / 5;
            points.push(new THREE.Vector3(
                baseX + Math.sin(t * 4) * 0.5 * t,
                0.5 + t * h,
                baseZ + Math.cos(t * 3) * 0.4 * t
            ));
        }
        const curve = new THREE.CatmullRomCurve3(points);
        const geo = new THREE.TubeGeometry(curve, 12, 0.18 + Math.random() * 0.1, 6, false);
        const mat = new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(0.3 + Math.random() * 0.1, 0.65, 0.3 + Math.random() * 0.15),
            roughness: 0.7
        });
        const weed = new THREE.Mesh(geo, mat);
        weed.castShadow = true;
        weed.userData = {
            baseRotX: 0,
            baseRotZ: 0,
            swaySpeed: 0.5 + Math.random(),
            swayPhase: Math.random() * Math.PI * 2
        };
        scene.add(weed);
        weedArray.push(weed);
    }
}

// ============================================================
// СОЗДАНИЕ РЫБКИ
// ============================================================
function createFishMesh(colors, scale) {
    const group = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: colors.body, roughness: 0.4, metalness: 0.15 });
    const finMat = new THREE.MeshStandardMaterial({
        color: colors.fin, roughness: 0.5, transparent: true, opacity: 0.85, side: THREE.DoubleSide
    });

    // Тело — вытянутая сфера
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), bodyMat);
    body.scale.set(1.7, 0.9, 0.75);
    body.castShadow = true;
    group.add(body);

    // Хвост — конус, анимируется по Z
    const tailGeo = new THREE.ConeGeometry(0.42, 0.9, 8);
    tailGeo.rotateZ(Math.PI / 2);
    const tail = new THREE.Mesh(tailGeo, finMat);
    tail.position.x = -1.05;
    group.add(tail);

    // Верхний плавник
    const topFinGeo = new THREE.ConeGeometry(0.28, 0.6, 4);
    const topFin = new THREE.Mesh(topFinGeo, finMat);
    topFin.position.set(0.1, 0.5, 0);
    topFin.rotation.z = -0.4;
    group.add(topFin);

    // Боковые плавники
    const sideFinGeo = new THREE.ConeGeometry(0.25, 0.55, 4);
    const leftFin = new THREE.Mesh(sideFinGeo, finMat);
    leftFin.position.set(0.2, -0.1, 0.5);
    leftFin.rotation.set(Math.PI / 2, 0, 0);
    group.add(leftFin);

    const rightFin = new THREE.Mesh(sideFinGeo.clone(), finMat);
    rightFin.position.set(0.2, -0.1, -0.5);
    rightFin.rotation.set(-Math.PI / 2, 0, 0);
    group.add(rightFin);

    // Глаза
    const eyeWhiteGeo = new THREE.SphereGeometry(0.11, 10, 8);
    const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
    const pupilGeo = new THREE.SphereGeometry(0.055, 8, 6);
    const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });

    [-1, 1].forEach(side => {
        const ew = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
        ew.position.set(0.75, 0.12, side * 0.32);
        group.add(ew);
        const pu = new THREE.Mesh(pupilGeo, pupilMat);
        pu.position.set(0.83, 0.12, side * 0.36);
        group.add(pu);
    });

    group.scale.setScalar(scale);
    return { group, tail, leftFin, rightFin, topFin };
}

function addFish() {
    const colors = FISH_COLORS[Math.floor(Math.random() * FISH_COLORS.length)];
    const scale = 0.6 + Math.random() * 0.6;
    const parts = createFishMesh(colors, scale);

    const fish = {
        mesh: parts.group,
        tail: parts.tail,
        leftFin: parts.leftFin,
        rightFin: parts.rightFin,
        topFin: parts.topFin,
        velocity: new THREE.Vector3((Math.random()-0.5)*2, (Math.random()-0.5)*2, (Math.random()-0.5)*2).normalize(),
        speed: 2.5 + Math.random() * 3,
        tailSpeed: 6 + Math.random() * 5,
        phase: Math.random() * Math.PI * 2,
        wanderTimer: Math.random() * 3,
        targetFood: null,
        avoidanceRadius: 2.2 + Math.random() * 1.5,
        scale: scale
    };

    fish.mesh.position.set(
        (Math.random() - 0.5) * (TANK_W - 6),
        3 + Math.random() * (TANK_H - 7),
        (Math.random() - 0.5) * (TANK_D - 6)
    );
    scene.add(fish.mesh);
    fishArray.push(fish);
    updateStats();
}

// ============================================================
// ПОВЕДЕНИЕ РЫБОК
// ============================================================
function updateFish(fish, dt, time) {
    const pos = fish.mesh.position;

    // --- Поиск корма ---
    if (!fish.targetFood || !scene.children.includes(fish.targetFood)) {
        fish.targetFood = null;
        for (const f of foodArray) {
            if (pos.distanceTo(f.position) < 15) {
                fish.targetFood = f;
                break;
            }
        }
    }

    let desiredDir;
    if (fish.targetFood) {
        desiredDir = fish.targetFood.position.clone().sub(pos).normalize();
        // Съедание
        if (pos.distanceTo(fish.targetFood.position) < 0.9) eatFood(fish);
    } else {
        // Случайное блуждание
        fish.wanderTimer -= dt;
        if (fish.wanderTimer <= 0) {
            fish.wanderTimer = 2 + Math.random() * 4;
            fish.velocity.x += (Math.random() - 0.5) * 1.2;
            fish.velocity.y += (Math.random() - 0.5) * 0.6;
            fish.velocity.z += (Math.random() - 0.5) * 1.2;
        }
        desiredDir = fish.velocity.clone().normalize();
    }

    // --- Избегание других рыбок ---
    for (const other of fishArray) {
        if (other === fish) continue;
        const diff = pos.clone().sub(other.mesh.position);
        const dist = diff.length();
        if (dist < fish.avoidanceRadius && dist > 0.001) {
            desiredDir.add(diff.normalize().multiplyScalar((fish.avoidanceRadius - dist) / fish.avoidanceRadius * 2.5));
        }
    }

    // --- Отражение от стенок (плавный поворот) ---
    const wallForce = new THREE.Vector3();
    const halfW = TANK_W / 2 - MARGIN, halfD = TANK_D / 2 - MARGIN;
    const minY = 1.5, maxY = TANK_H - 1.5;
    if (pos.x >  halfW) wallForce.x -= (pos.x - halfW) * 2;
    if (pos.x < -halfW) wallForce.x += (-halfW - pos.x) * 2;
    if (pos.z >  halfD) wallForce.z -= (pos.z - halfD) * 2;
    if (pos.z < -halfD) wallForce.z += (-halfD - pos.z) * 2;
    if (pos.y >  maxY)  wallForce.y -= (pos.y - maxY) * 2;
    if (pos.y <  minY)  wallForce.y += (minY - pos.y) * 2;
    desiredDir.add(wallForce);

    if (desiredDir.lengthSq() > 0.0001) desiredDir.normalize();

    // Плавный поворот скорости к целевому направлению
    fish.velocity.lerp(desiredDir, Math.min(1, dt * 2.5)).normalize();

    // Движение (ускорение при погоне за едой)
    const spd = fish.speed * (fish.targetFood ? 1.6 : 1);
    pos.addScaledVector(fish.velocity, spd * dt);

    // Жёсткий клампинг
    pos.x = THREE.MathUtils.clamp(pos.x, -halfW, halfW);
    pos.y = THREE.MathUtils.clamp(pos.y, minY, maxY);
    pos.z = THREE.MathUtils.clamp(pos.z, -halfD, halfD);

    // Поворот рыбки в направлении движения
    const lookTarget = pos.clone().add(fish.velocity);
    fish.mesh.lookAt(lookTarget);

    // Анимация хвоста и плавников
    const t = time * fish.tailSpeed + fish.phase;
    fish.tail.rotation.z = Math.sin(t) * 0.55;
    fish.leftFin.rotation.x = Math.PI / 2 + Math.sin(t * 0.8 + 1) * 0.35;
    fish.rightFin.rotation.x = -Math.PI / 2 + Math.sin(t * 0.8 + 2) * 0.35;
    fish.topFin.rotation.z = -0.4 + Math.sin(t * 0.6) * 0.15;
}

function eatFood(fish) {
    const idx = foodArray.indexOf(fish.targetFood);
    if (idx !== -1) {
        scene.remove(foodArray[idx]);
        foodArray.splice(idx, 1);
        // Рост на 5%
        fish.scale *= 1.05;
        fish.mesh.scale.setScalar(fish.scale);
        fish.targetFood = null;
    }
}

// ============================================================
// БУБЬРЕЧКИ
// ============================================================
function addBubbles(count) {
    for (let i = 0; i < count; i++) {
        const r = 0.1 + Math.random() * 0.22;
        const geo = new THREE.SphereGeometry(r, 10, 8);
        const mat = new THREE.MeshPhysicalMaterial({
            color: 0xcdeeff, transmission: 0.9, transparent: true,
            opacity: 0.35, roughness: 0.1, metalness: 0
        });
        const b = new THREE.Mesh(geo, mat);
        b.position.set(
            (Math.random() - 0.5) * (TANK_W - 4),
            0.8 + Math.random() * (TANK_H - 2),
            (Math.random() - 0.5) * (TANK_D - 4)
        );
        b.userData = {
            speed: 1.5 + Math.random() * 2.5,
            amp: 0.2 + Math.random() * 0.4,
            freq: 1 + Math.random() * 2,
            phase: Math.random() * Math.PI * 2,
            baseX: b.position.x,
            baseZ: b.position.z
        };
        scene.add(b);
        bubbleArray.push(b);
    }
}

function updateBubbles(dt, time) {
    for (const b of bubbleArray) {
        const u = b.userData;
        b.position.y += u.speed * dt;
        b.position.x = u.baseX + Math.sin(time * u.freq + u.phase) * u.amp;
        b.position.z = u.baseZ + Math.cos(time * u.freq * 0.8 + u.phase) * u.amp;
        if (b.position.y > TANK_H - 0.6) {
            b.position.y = 0.7;
            u.baseX = (Math.random() - 0.5) * (TANK_W - 4);
            u.baseZ = (Math.random() - 0.5) * (TANK_D - 4);
        }
    }
}

// ============================================================
// СИСТЕМА КОРМЛЕНИЯ
// ============================================================
function onCanvasClick(e) {
    mouseNDC.x = (e.clientX / innerWidth) * 2 - 1;
    mouseNDC.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);

    // Пересечение с плоскостью Y = 0.5 внутри аквариума
    const ray = raycaster.ray;
    if (ray.direction.y >= -0.0001) return;
    const t = (0.5 - ray.origin.y) / ray.direction.y;
    if (t < 0) return;
    const hit = ray.origin.clone().addScaledVector(ray.direction, t);
    if (Math.abs(hit.x) > TANK_W/2 || Math.abs(hit.z) > TANK_D/2) return;

    spawnFood(hit.x, TANK_H - 2, hit.z);
}

function spawnFood(x, y, z) {
    const geo = new THREE.SphereGeometry(0.18, 8, 6);
    const mat = new THREE.MeshStandardMaterial({ color: 0xff7043, emissive: 0x331100, roughness: 0.6 });
    const food = new THREE.Mesh(geo, mat);
    food.position.set(x, y, z);
    food.userData = { vy: 0 };
    scene.add(food);
    foodArray.push(food);
}

function updateFood(dt) {
    for (let i = foodArray.length - 1; i >= 0; i--) {
        const f = foodArray[i];
        f.userData.vy -= 4 * dt;          // гравитация
        f.position.y += f.userData.vy * dt;
        if (f.position.y < 0.6) {         // упала на дно — убираем
            scene.remove(f);
            foodArray.splice(i, 1);
        }
    }
}

// ============================================================
// ВОДОРОСЛИ — ПОКАЧИВАНИЕ
// ============================================================
function updateWeeds(time) {
    for (const w of weedArray) {
        const u = w.userData;
        w.rotation.x = Math.sin(time * u.swaySpeed + u.swayPhase) * 0.06;
        w.rotation.z = Math.cos(time * u.swaySpeed * 0.9 + u.swayPhase) * 0.06;
    }
}

// ============================================================
// СТАТИСТИКА / UI
// ============================================================
let fpsFrames = 0, fpsTime = 0;
function updateStats() {
    document.getElementById('fish-count').textContent = fishArray.length;
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const time = clock.elapsedTime;

    for (const fish of fishArray) updateFish(fish, dt, time);
    updateBubbles(dt, time);
    updateFood(dt);
    updateWeeds(time);

    controls.update();
    renderer.render(scene, camera);

    // FPS
    fpsFrames++;
    fpsTime += dt;
    if (fpsTime >= 0.5) {
        document.getElementById('fps').textContent = Math.round(fpsFrames / fpsTime);
        fpsFrames = 0; fpsTime = 0;
    }
}

function onResize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
}

init();
</script>
</body>
</html>
