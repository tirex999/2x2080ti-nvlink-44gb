<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Аквариум</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #0a1628 0%, #1a3a5c 50%, #0d2847 100%);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
        }

        .panel {
            position: absolute;
            background: rgba(10, 25, 50, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 180, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            color: #e0f0ff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        #info-panel {
            top: 20px;
            left: 20px;
            max-width: 300px;
            z-index: 100;
        }

        #info-panel h1 {
            font-size: 1.5em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #00d4ff, #7b2fff, #ff6bcb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #info-panel .instructions {
            font-size: 0.85em;
            line-height: 1.7;
            color: #a0c8e8;
            margin-bottom: 15px;
        }

        #info-panel .instructions span {
            color: #00d4ff;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.3s ease;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-fish {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
        }

        .btn-fish:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.6);
        }

        .btn-bubbles {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
        }

        .btn-bubbles:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.6);
        }

        .btn-light {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .btn-light:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }

        .btn-light.off {
            background: linear-gradient(135deg, #555, #333);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        #stats-panel {
            top: 20px;
            right: 20px;
            min-width: 160px;
            z-index: 100;
        }

        #stats-panel h2 {
            font-size: 1em;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 0.9em;
            border-bottom: 1px solid rgba(100, 180, 255, 0.1);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-value {
            font-weight: 700;
            color: #00ff88;
            font-size: 1.1em;
        }

        #notification {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 25, 50, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 12px 24px;
            color: #00d4ff;
            font-size: 0.9em;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 100;
            pointer-events: none;
        }

        #notification.show {
            opacity: 1;
        }

        @media (max-width: 768px) {
            #info-panel {
                max-width: 250px;
                padding: 15px;
            }
            #info-panel h1 {
                font-size: 1.2em;
            }
            .btn {
                padding: 8px 12px;
                font-size: 0.8em;
            }
            #stats-panel {
                min-width: 130px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="panel" id="info-panel">
        <h1>🐠 3D Аквариум</h1>
        <div class="instructions">
            <span>ЛКМ</span> — вращение камеры<br>
            <span>ПКМ</span> — панорамирование<br>
            <span>Колесо</span> — зум<br>
            <span>Клик</span> — покормить рыбок 🍽️
        </div>
        <div class="btn-group">
            <button class="btn btn-fish" onclick="addFish()">+ Рыбка</button>
            <button class="btn btn-bubbles" onclick="addBubbles()">+ Пузыри</button>
            <button class="btn btn-light" id="light-btn" onclick="toggleLight()">☀️ Свет</button>
        </div>
    </div>

    <div class="panel" id="stats-panel">
        <h2>📊 Статистика</h2>
        <div class="stat-item">
            <span>Рыбки</span>
            <span class="stat-value" id="fish-count">15</span>
        </div>
        <div class="stat-item">
            <span>Пузыри</span>
            <span class="stat-value" id="bubble-count">30</span>
        </div>
        <div class="stat-item">
            <span>FPS</span>
            <span class="stat-value" id="fps-counter">60</span>
        </div>
    </div>

    <div id="notification"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // ============ GLOBAL VARIABLES ============
        let scene, camera, renderer, controls;
        let fishArray = [];
        let bubbleArray = [];
        let foodArray = [];
        let seaweedArray = [];
        let clock = new THREE.Clock();
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let lightOn = true;
        let directionalLight;
        let frameCount = 0;
        let lastFPSTime = 0;

        const AQUARIUM_WIDTH = 36;
        const AQUARIUM_HEIGHT = 24;
        const AQUARIUM_DEPTH = 20;
        const HALF_W = AQUARIUM_WIDTH / 2;
        const HALF_H = AQUARIUM_HEIGHT / 2;
        const HALF_D = AQUARIUM_DEPTH / 2;

        const FISH_COLORS = [
            { body: 0xff6b35, fin: 0xff8c42, name: 'Оранжевая' },
            { body: 0x2196f3, fin: 0x64b5f6, name: 'Синяя' },
            { body: 0xffeb3b, fin: 0xf44336, name: 'Жёлто-красная' },
            { body: 0x9c27b0, fin: 0xba68c8, name: 'Фиолетовая' },
            { body: 0xf44336, fin: 0xef9a9a, name: 'Красная' },
            { body: 0x4caf50, fin: 0x81c784, name: 'Зелёная' },
            { body: 0xff69b4, fin: 0xf8bbd0, name: 'Розовая' },
            { body: 0xffd700, fin: 0xffab00, name: 'Золотая' }
        ];

        // ============ INITIALIZATION ============
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a1e3d, 0.012);
            scene.background = new THREE.Color(0x0a1628);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 5, 35);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.minDistance = 10;
            controls.maxDistance = 60;
            controls.maxPolarAngle = Math.PI / 1.8;
            controls.target.set(0, 0, 0);

            // Build scene
            createLighting();
            createAquarium();
            createSandBottom();
            createRocks();
            createSeaweed();
            createBubbles(30);

            // Create initial fish
            for (let i = 0; i < 15; i++) {
                addFish(true);
            }

            // Events
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onClickAquarium);

            // Start
            animate();
        }

        // ============ LIGHTING ============
        function createLighting() {
            // Ambient
            const ambient = new THREE.AmbientLight(0x404040, 0.4);
            scene.add(ambient);

            // Directional (sun)
            directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 60;
            directionalLight.shadow.camera.left = -25;
            directionalLight.shadow.camera.right = 25;
            directionalLight.shadow.camera.top = 25;
            directionalLight.shadow.camera.bottom = -25;
            scene.add(directionalLight);

            // Point lights (underwater effect)
            const pointLight1 = new THREE.PointLight(0x0066ff, 0.8, 40);
            pointLight1.position.set(-10, 5, 5);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x00ccff, 0.6, 40);
            pointLight2.position.set(10, -5, -5);
            scene.add(pointLight2);
        }

        // ============ AQUARIUM GLASS ============
        function createAquarium() {
            const geometry = new THREE.BoxGeometry(AQUARIUM_WIDTH, AQUARIUM_HEIGHT, AQUARIUM_DEPTH);

            // Glass material
            const glassMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x88ccff,
                metalness: 0,
                roughness: 0.05,
                transmission: 0.95,
                thickness: 0.5,
                transparent: true,
                opacity: 0.15,
                side: THREE.DoubleSide
            });

            const glassBox = new THREE.Mesh(geometry, glassMaterial);
            glassBox.receiveShadow = true;
            scene.add(glassBox);

            // Wireframe edges
            const edgesGeometry = new THREE.EdgesGeometry(geometry);
            const edgesMaterial = new THREE.LineBasicMaterial({ color: 0x4488cc, linewidth: 2 });
            const edges = new THREE.LineSegments(edgesGeometry, edgesMaterial);
            scene.add(edges);
        }

        // ============ SAND BOTTOM ============
        function createSandBottom() {
            const sandGeo = new THREE.PlaneGeometry(AQUARIUM_WIDTH - 0.5, AQUARIUM_DEPTH - 0.5, 32, 32);

            // Procedural bumps
            const positions = sandGeo.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const x = positions.getX(i);
                const y = positions.getY(i);
                const z = Math.sin(x * 0.5) * Math.cos(y * 0.3) * 0.15 +
                          Math.sin(x * 1.2 + y * 0.8) * 0.08;
                positions.setZ(i, z);
            }
            sandGeo.computeVertexNormals();

            const sandMat = new THREE.MeshStandardMaterial({
                color: 0xc2a66b,
                roughness: 0.95,
                metalness: 0.0
            });

            const sand = new THREE.Mesh(sandGeo, sandMat);
            sand.rotation.x = -Math.PI / 2;
            sand.position.y = -HALF_H + 0.3;
            sand.receiveShadow = true;
            scene.add(sand);
        }

        // ============ ROCKS ============
        function createRocks() {
            const rockColors = [0x666666, 0x777777, 0x555555, 0x887766];

            for (let i = 0; i < 8; i++) {
                const size = 0.5 + Math.random() * 1.2;
                const geo = new THREE.DodecahedronGeometry(size, 1);

                // Deform vertices
                const pos = geo.attributes.position;
                for (let j = 0; j < pos.count; j++) {
                    const x = pos.getX(j);
                    const y = pos.getY(j);
                    const z = pos.getZ(j);
                    const noise = 0.8 + Math.random() * 0.4;
                    pos.setX(j, x * noise);
                    pos.setY(j, y * noise * 0.7);
                    pos.setZ(j, z * noise);
                }
                geo.computeVertexNormals();

                const mat = new THREE.MeshStandardMaterial({
                    color: rockColors[i % rockColors.length],
                    roughness: 0.85,
                    metalness: 0.1
                });

                const rock = new THREE.Mesh(geo, mat);
                rock.position.set(
                    (Math.random() - 0.5) * (AQUARIUM_WIDTH - 4),
                    -HALF_H + 0.5 + Math.random() * 0.3,
                    (Math.random() - 0.5) * (AQUARIUM_DEPTH - 4)
                );
                rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                rock.castShadow = true;
                rock.receiveShadow = true;
                scene.add(rock);
            }
        }

        // ============ SEAWEEED ============
        function createSeaweed() {
            const weedColors = [0x228b22, 0x2e8b57, 0x006400, 0x3cb371, 0x008000];

            for (let i = 0; i < 12; i++) {
                const height = 2 + Math.random() * 4;
                const segments = 8;
                const points = [];

                for (let j = 0; j <= segments; j++) {
                    const t = j / segments;
                    const x = Math.sin(t * Math.PI * 2 + Math.random()) * 0.3 * t;
                    const y = t * height;
                    const z = Math.cos(t * Math.PI * 1.5) * 0.2 * t;
                    points.push(new THREE.Vector3(x, y, z));
                }

                const curve = new THREE.CatmullRomCurve3(points);
                const tubeGeo = new THREE.TubeGeometry(curve, 12, 0.08 + Math.random() * 0.06, 5, false);
                const mat = new THREE.MeshStandardMaterial({
                    color: weedColors[i % weedColors.length],
                    roughness: 0.7,
                    metalness: 0.0
                });

                const weed = new THREE.Mesh(tubeGeo, mat);
                weed.position.set(
                    (Math.random() - 0.5) * (AQUARIUM_WIDTH - 6),
                    -HALF_H + 0.3,
                    (Math.random() - 0.5) * (AQUARIUM_DEPTH - 6)
                );
                weed.castShadow = true;
                scene.add(weed);

                seaweedArray.push({
                    mesh: weed,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.5 + Math.random() * 0.5
                });
            }
        }

        // ============ BUBBLES ============
        function createBubbles(count) {
            const bubbleMat = new THREE.MeshPhysicalMaterial({
                color: 0xaaddff,
                metalness: 0,
                roughness: 0,
                transmission: 0.9,
                transparent: true,
                opacity: 0.4,
                clearcoat: 1.0
            });

            for (let i = 0; i < count; i++) {
                const size = 0.05 + Math.random() * 0.15;
                const geo = new THREE.SphereGeometry(size, 8, 8);
                const bubble = new THREE.Mesh(geo, bubbleMat.clone());

                bubble.position.set(
                    (Math.random() - 0.5) * (AQUARIUM_WIDTH - 2),
                    -HALF_H + Math.random() * AQUARIUM_HEIGHT,
                    (Math.random() - 0.5) * (AQUARIUM_DEPTH - 2)
                );

                scene.add(bubble);
                bubbleArray.push({
                    mesh: bubble,
                    speed: 0.5 + Math.random() * 1.5,
                    wobblePhase: Math.random() * Math.PI * 2,
                    wobbleAmp: 0.1 + Math.random() * 0.3
                });
            }
        }

        // ============ FISH CREATION ============
        function createFishMesh(colorScheme) {
            const group = new THREE.Group();

            // Body
            const bodyGeo = new THREE.SphereGeometry(0.5, 12, 10);
            bodyGeo.scale(1.8, 1.0, 0.7);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: colorScheme.body,
                roughness: 0.3,
                metalness: 0.2
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            group.add(body);

            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const pupilGeo = new THREE.SphereGeometry(0.04, 8, 8);
            const pupilMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.1 });

            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.55, 0.1, 0.3);
            group.add(rightEye);

            const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
            rightPupil.position.set(0.58, 0.1, 0.35);
            group.add(rightPupil);

            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(0.55, 0.1, -0.3);
            group.add(leftEye);

            const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
            leftPupil.position.set(0.58, 0.1, -0.35);
            group.add(leftPupil);

            // Tail
            const tailGeo = new THREE.ConeGeometry(0.3, 0.6, 6);
            tailGeo.rotateZ(Math.PI / 2);
            const tailMat = new THREE.MeshStandardMaterial({
                color: colorScheme.fin,
                roughness: 0.4,
                metalness: 0.1,
                transparent: true,
                opacity: 0.85
            });
            const tail = new THREE.Mesh(tailGeo, tailMat);
            tail.position.set(-0.9, 0, 0);
            tail.castShadow = true;
            group.add(tail);

            // Top fin
            const topFinGeo = new THREE.ConeGeometry(0.2, 0.4, 4);
            topFinGeo.rotateX(Math.PI / 6);
            const topFin = new THREE.Mesh(topFinGeo, tailMat.clone());
            topFin.position.set(0, 0.45, 0);
            group.add(topFin);

            // Left fin
            const leftFinGeo = new THREE.ConeGeometry(0.15, 0.35, 4);
            leftFinGeo.rotateZ(-Math.PI / 3);
            const leftFin = new THREE.Mesh(leftFinGeo, tailMat.clone());
            leftFin.position.set(0.1, 0, 0.4);
            group.add(leftFin);

            // Right fin
            const rightFinGeo = new THREE.ConeGeometry(0.15, 0.35, 4);
            rightFinGeo.rotateZ(Math.PI / 3);
            const rightFin = new THREE.Mesh(rightFinGeo, tailMat.clone());
            rightFin.position.set(0.1, 0, -0.4);
            group.add(rightFin);

            return { group, tail, leftFin, rightFin };
        }

        function addFish(initial = false) {
            const colorScheme = FISH_COLORS[Math.floor(Math.random() * FISH_COLORS.length)];
            const { group, tail, leftFin, rightFin } = createFishMesh(colorScheme);

            const scale = 0.6 + Math.random() * 0.6;
            group.scale.setScalar(scale);

            if (initial) {
                group.position.set(
                    (Math.random() - 0.5) * (AQUARIUM_WIDTH - 6),
                    (Math.random() - 0.5) * (AQUARIUM_HEIGHT - 6),
                    (Math.random() - 0.5) * (AQUARIUM_DEPTH - 6)
                );
            } else {
                group.position.set(0, 0, 0);
            }

            const dir = new THREE.Vector3(
                Math.random() - 0.5,
                Math.random() - 0.5,
                Math.random() - 0.5
            ).normalize();

            scene.add(group);

            const fish = {
                mesh: group,
                tail: tail,
                leftFin: leftFin,
                rightFin: rightFin,
                velocity: dir.multiplyScalar(0.5 + Math.random() * 0.5),
                speed: 1.5 + Math.random() * 2.0,
                tailSpeed: 3 + Math.random() * 4,
                phase: Math.random() * Math.PI * 2,
                targetFood: null,
                avoidanceRadius: 1.5 + Math.random() * 1.0,
                wanderTimer: Math.random() * 5,
                baseScale: scale
            };

            fishArray.push(fish);
            updateStats();

            if (!initial) {
                showNotification(`🐠 Новая рыбка! (${colorScheme.name})`);
            }
        }

        // ============ FOOD SYSTEM ============
        function createFood(position) {
            const geo = new THREE.SphereGeometry(0.15, 6, 6);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xff8800,
                emissive: 0xff4400,
                emissiveIntensity: 0.3,
                roughness: 0.5
            });
            const food = new THREE.Mesh(geo, mat);
            food.position.copy(position);
            food.castShadow = true;
            scene.add(food);

            foodArray.push({
                mesh: food,
                velocity: new THREE.Vector3(0, 0, 0),
                active: true
            });
        }

        // ============ INTERACTION ============
        function onClickAquarium(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Check intersection with a plane at z=0 or the aquarium bounds
            const intersects = raycaster.intersectObjects(scene.children);

            // Find a valid position within aquarium
            let clickPos = null;

            // Try to find intersection with the sand or any object
            for (const hit of intersects) {
                if (hit.object.isMesh && hit.object.geometry.type === 'PlaneGeometry') {
                    clickPos = hit.point.clone();
                    break;
                }
            }

            if (!clickPos) {
                // Project onto a plane facing the camera
                const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                const target = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, target);

                if (target) {
                    // Clamp to aquarium bounds
                    target.x = THREE.MathUtils.clamp(target.x, -HALF_W + 2, HALF_W - 2);
                    target.y = THREE.MathUtils.clamp(target.y, -HALF_H + 2, HALF_H - 2);
                    target.z = THREE.MathUtils.clamp(target.z, -HALF_D + 2, HALF_D - 2);
                    clickPos = target;
                }
            }

            if (clickPos) {
                createFood(clickPos);
                showNotification('🍽️ Корм брошен!');
            }
        }

        // ============ BEHAVIOR AI ============
        function updateFishBehavior(fish, dt) {
            const pos = fish.mesh.position;
            const vel = fish.velocity;

            // --- Food seeking ---
            if (foodArray.length > 0) {
                let closestFood = null;
                let closestDist = Infinity;

                for (const food of foodArray) {
                    if (!food.active) continue;
                    const dist = pos.distanceTo(food.mesh.position);
                    if (dist < 15 && dist < closestDist) {
                        closestDist = dist;
                        closestFood = food;
                    }
                }

                if (closestFood) {
                    fish.targetFood = closestFood;
                    const dir = closestFood.mesh.position.clone().sub(pos).normalize();
                    vel.lerp(dir.multiplyScalar(fish.speed * 1.5), dt * 3);

                    // Eat food
                    if (closestDist < 0.5) {
                        closestFood.active = false;
                        scene.remove(closestFood.mesh);
                        foodArray.splice(foodArray.indexOf(closestFood), 1);
                        fish.targetFood = null;

                        // Growth
                        const newScale = fish.mesh.scale.x * 1.05;
                        fish.baseScale = Math.min(newScale, 2.5);
                        fish.mesh.scale.setScalar(fish.baseScale);
                        showNotification('😋 Рыбка поела! Рост +5%');
                    }
                } else {
                    fish.targetFood = null;
                }
            }

            // --- Wall avoidance ---
            const margin = 2;
            const wallForce = new THREE.Vector3();

            if (pos.x > HALF_W - margin) wallForce.x -= (pos.x - (HALF_W - margin)) * 2;
            if (pos.x < -HALF_W + margin) wallForce.x += ((-HALF_W + margin) - pos.x) * 2;
            if (pos.y > HALF_H - margin) wallForce.y -= (pos.y - (HALF_H - margin)) * 2;
            if (pos.y < -HALF_H + margin) wallForce.y += ((-HALF_H + margin) - pos.y) * 2;
            if (pos.z > HALF_D - margin) wallForce.z -= (pos.z - (HALF_D - margin)) * 2;
            if (pos.z < -HALF_D + margin) wallForce.z += ((-HALF_D + margin) - pos.z) * 2;

            vel.add(wallForce.multiplyScalar(dt));

            // --- Collision avoidance with other fish ---
            for (const other of fishArray) {
                if (other === fish) continue;
                const diff = pos.clone().sub(other.mesh.position);
                const dist = diff.length();
                if (dist < fish.avoidanceRadius && dist > 0.01) {
                    const push = diff.normalize().multiplyScalar((fish.avoidanceRadius - dist) * 2);
                    vel.add(push.multiplyScalar(dt));
                }
            }

            // --- Random wandering ---
            fish.wanderTimer -= dt;
            if (fish.wanderTimer <= 0) {
                fish.wanderTimer = 2 + Math.random() * 4;
                const wanderDir = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.3,
                    (Math.random() - 0.5) * 0.5
                );
                vel.add(wanderDir);
            }

            // --- Speed limit ---
            const maxSpeed = fish.speed;
            if (vel.length() > maxSpeed) {
                vel.normalize().multiplyScalar(maxSpeed);
            }
            if (vel.length() < 0.3) {
                vel.add(new THREE.Vector3(
                    (Math.random() - 0.5) * 0.1,
                    (Math.random() - 0.5) * 0.1,
                    (Math.random() - 0.5) * 0.1
                ));
            }

            // --- Apply movement ---
            pos.add(vel.clone().multiplyScalar(dt));

            // Hard clamp
            pos.x = THREE.MathUtils.clamp(pos.x, -HALF_W + 0.5, HALF_W - 0.5);
            pos.y = THREE.MathUtils.clamp(pos.y, -HALF_H + 0.5, HALF_H - 0.5);
            pos.z = THREE.MathUtils.clamp(pos.z, -HALF_D + 0.5, HALF_D - 0.5);

            // --- Face direction of movement ---
            if (vel.lengthSq() > 0.001) {
                const targetQuat = new THREE.Quaternion();
                const lookAtMatrix = new THREE.Matrix4();
                const lookTarget = pos.clone().add(vel);
                lookAtMatrix.lookAt(pos, lookTarget, new THREE.Vector3(0, 1, 0));
                targetQuat.setFromRotationMatrix(lookAtMatrix);
                fish.mesh.quaternion.slerp(targetQuat, dt * 5);
            }
        }

        // ============ ANIMATION ============
        function updateFishAnimation(fish, time) {
            const t = time * fish.tailSpeed + fish.phase;

            // Tail wagging
            fish.tail.rotation.y = Math.sin(t) * 0.5;
            fish.tail.rotation.z = Math.sin(t * 0.7) * 0.2;

            // Fin movement
            fish.leftFin.rotation.y = Math.sin(t + 0.5) * 0.3;
            fish.rightFin.rotation.y = Math.sin(t + 0.5) * 0.3;

            // Slight body undulation
            fish.mesh.rotation.z = Math.sin(t * 0.5) * 0.03;
        }

        function updateBubbles(dt, time) {
            for (const bubble of bubbleArray) {
                bubble.mesh.position.y += bubble.speed * dt;
                bubble.mesh.position.x += Math.sin(time * 2 + bubble.wobblePhase) * bubble.wobbleAmp * dt;
                bubble.mesh.position.z += Math.cos(time * 1.5 + bubble.wobblePhase) * bubble.wobbleAmp * dt;

                // Reset if reached surface
                if (bubble.mesh.position.y > HALF_H - 0.5) {
                    bubble.mesh.position.y = -HALF_H + 0.5;
                    bubble.mesh.position.x = (Math.random() - 0.5) * (AQUARIUM_WIDTH - 2);
                    bubble.mesh.position.z = (Math.random() - 0.5) * (AQUARIUM_DEPTH - 2);
                }
            }
        }

        function updateFood(dt) {
            for (let i = foodArray.length - 1; i >= 0; i--) {
                const food = foodArray[i];
                if (!food.active) continue;

                // Gravity
                food.velocity.y -= 3.0 * dt;
                food.mesh.position.add(food.velocity.clone().multiplyScalar(dt));

                // Remove if hits bottom
                if (food.mesh.position.y < -HALF_H + 0.5) {
                    scene.remove(food.mesh);
                    foodArray.splice(i, 1);
                }
            }
        }

        function updateSeaweed(time) {
            for (const weed of seaweedArray) {
                weed.mesh.rotation.x = Math.sin(time * weed.speed + weed.phase) * 0.08;
                weed.mesh.rotation.z = Math.cos(time * weed.speed * 0.7 + weed.phase) * 0.06;
            }
        }

        // ============ UI FUNCTIONS ============
        function updateStats() {
            document.getElementById('fish-count').textContent = fishArray.length;
            document.getElementById('bubble-count').textContent = bubbleArray.length;
        }

        function showNotification(text) {
            const el = document.getElementById('notification');
            el.textContent = text;
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), 2500);
        }

        function toggleLight() {
            lightOn = !lightOn;
            directionalLight.intensity = lightOn ? 1.2 : 0.1;
            const btn = document.getElementById('light-btn');
            btn.textContent = lightOn ? '☀️ Свет' : '🌙 Тьма';
            btn.classList.toggle('off', !lightOn);
        }

        function addBubbles() {
            createBubbles(10);
            updateStats();
            showNotification('💭 +10 пузырей!');
        }

        // ============ RESIZE ============
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============ MAIN LOOP ============
        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);
            const time = clock.elapsedTime;

            // FPS counter
            frameCount++;
            if (time - lastFPSTime >= 1) {
                document.getElementById('fps-counter').textContent = frameCount;
                frameCount = 0;
                lastFPSTime = time;
            }

            // Update systems
            for (const fish of fishArray) {
                updateFishBehavior(fish, dt);
                updateFishAnimation(fish, time);
            }

            updateBubbles(dt, time);
            updateFood(dt);
            updateSeaweed(time);

            controls.update();
            renderer.render(scene, camera);
        }

        // ============ START ============
        init();
    </script>
</body>
</html>
