<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>ГЛУБИНА · 3D аквариум</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Unbounded:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --line: rgba(125,216,255,.22);
    --aqua:#54d8ff; --aqua-soft:#9fe4ff;
    --coral:#ff7a4d; --gold:#ffc857;
    --text:#ddf2ff; --dim:#8fb6cf;
    --font-display:'Unbounded',sans-serif;
    --font-body:'Rubik',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:var(--font-body); color:var(--text); user-select:none;
    background:radial-gradient(120% 90% at 50% 0%, #0e4a75 0%, #062c4c 45%, #02101f 100%);
  }
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;cursor:crosshair;opacity:0;transition:opacity 1.2s ease}
  #stage.ready canvas{opacity:1}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(1,8,18,.5) 100%)}

  /* ---------- панели ---------- */
  .panel{position:fixed;z-index:10;
    background:linear-gradient(155deg, rgba(10,38,62,.78), rgba(4,17,30,.62));
    border:1px solid var(--line);border-radius:16px;
    backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
    box-shadow:0 20px 45px rgba(0,8,20,.5), inset 0 1px 0 rgba(170,235,255,.14);}
  .panel::before{content:'';position:absolute;top:0;left:18px;right:18px;height:2px;border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--aqua), var(--gold), transparent);opacity:.7}
  .panel-left{top:22px;left:22px;width:308px;padding:20px 22px 18px;animation:drop .8s cubic-bezier(.2,.9,.3,1.2) both .15s}
  .panel-stats{top:22px;right:22px;padding:16px 20px;min-width:172px;text-align:right;animation:drop .8s cubic-bezier(.2,.9,.3,1.2) both .3s}

  .brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .badge{font-family:var(--font-display);font-weight:900;font-size:13px;letter-spacing:.5px;color:#fff;
    background:linear-gradient(135deg,var(--coral),#ff4d6d);padding:7px 9px;border-radius:9px;
    transform:rotate(-7deg);box-shadow:0 4px 14px rgba(255,90,80,.45)}
  h1{font-family:var(--font-display);font-weight:900;font-size:24px;line-height:1;letter-spacing:.5px;
    background:linear-gradient(92deg,#6fe3ff 10%,#bdf3ff 45%,#ffd166 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 10px rgba(80,200,255,.35))}
  .brand small{display:block;margin-top:6px;font-size:10px;font-weight:600;letter-spacing:2.6px;text-transform:uppercase;color:var(--dim)}

  .legend{list-style:none;display:grid;gap:7px;margin:4px 0 16px;padding-top:14px;border-top:1px dashed rgba(125,216,255,.18)}
  .legend li{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim)}
  kbd{font-family:var(--font-body);font-weight:600;font-size:10px;letter-spacing:.8px;min-width:56px;text-align:center;
    background:rgba(125,216,255,.1);border:1px solid rgba(125,216,255,.3);border-bottom-width:2px;
    border-radius:6px;padding:3px 7px;color:var(--aqua-soft)}

  .btn-row{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:.4px;padding:10px 13px;
    border-radius:10px;border:1px solid transparent;cursor:pointer;color:#fff;
    transition:transform .16s ease, box-shadow .2s ease, background .2s ease, filter .2s ease}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0) scale(.96)}
  .btn-primary{background:linear-gradient(135deg,#25c4ff,#2f6bff);box-shadow:0 6px 18px rgba(40,150,255,.4)}
  .btn-primary:hover{box-shadow:0 10px 26px rgba(40,170,255,.55);filter:brightness(1.08)}
  .btn-ghost{background:rgba(125,216,255,.07);border-color:rgba(125,216,255,.35);color:var(--aqua-soft)}
  .btn-ghost:hover{background:rgba(125,216,255,.16);border-color:rgba(125,216,255,.6)}
  .btn-warm{background:linear-gradient(135deg,#ffc857,#ff8a3d);color:#3a2405;box-shadow:0 6px 18px rgba(255,170,60,.35)}
  .btn-warm.off{background:rgba(125,216,255,.07);border-color:rgba(125,216,255,.3);color:var(--dim);box-shadow:none}

  .stat{display:flex;align-items:baseline;justify-content:flex-end;gap:9px;padding:6px 0}
  .stat + .stat{border-top:1px solid rgba(125,216,255,.12)}
  .stat-num{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1;color:#fff;
    text-shadow:0 0 18px rgba(84,216,255,.45);display:inline-block}
  .stat-num.pop{animation:pop .45s ease}
  .stat-label{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
  .stat-mini{margin-top:10px;padding-top:9px;border-top:1px dashed rgba(125,216,255,.18);
    font-size:11px;color:var(--dim);letter-spacing:.4px}
  .stat-mini b{color:var(--gold);font-weight:700}
  @keyframes pop{0%{transform:scale(1.35);color:#7df3ff}100%{transform:scale(1)}}

  .hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:10;pointer-events:none;
    display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;
    background:rgba(6,24,40,.6);border:1px solid var(--line);backdrop-filter:blur(12px);
    font-size:13px;font-weight:500;letter-spacing:.3px;color:var(--aqua-soft);
    animation:rise .8s ease both .6s;transition:opacity .6s, transform .6s}
  .hint.gone{opacity:0;transform:translate(-50%,14px)}
  .pulse-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);position:relative;box-shadow:0 0 10px var(--gold)}
  .pulse-dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--gold);animation:ping 1.6s ease-out infinite}
  @keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.2);opacity:0}}

  .toasts{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:20;
    display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{display:flex;gap:9px;align-items:center;padding:9px 16px;border-radius:12px;
    background:rgba(8,32,54,.85);border:1px solid rgba(125,216,255,.3);backdrop-filter:blur(10px);
    font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,10,25,.5);
    opacity:0;transform:translateY(12px) scale(.94);transition:all .35s cubic-bezier(.2,.9,.3,1.3)}
  .toast.show{opacity:1;transform:none}
  .toast.hide{opacity:0;transform:translateY(-8px) scale(.95)}
  .toast span{font-size:16px}

  .credit{position:fixed;right:22px;bottom:18px;z-index:9;pointer-events:none;
    font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(140,190,220,.4)}

  @keyframes drop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

  @media (max-width:820px){
    .panel-left{width:auto;max-width:calc(100vw - 130px);padding:14px 16px;top:14px;left:14px}
    h1{font-size:19px}
    .legend{display:none}
    .btn{padding:9px 10px;font-size:11px}
    .panel-stats{top:auto;bottom:14px;right:14px;padding:12px 14px;min-width:132px}
    .stat-num{font-size:22px}
    .hint{bottom:88px;font-size:12px}
    .credit{display:none}
  }
</style>
</head>
<body>

<div id="stage"></div>
<div class="vignette"></div>

<header class="panel panel-left">
  <div class="brand">
    <span class="badge">3D</span>
    <div>
      <h1>ГЛУБИНА</h1>
      <small>аквариум-симулятор</small>
    </div>
  </div>
  <ul class="legend">
    <li><kbd>ЛКМ</kbd> вращение камеры</li>
    <li><kbd>ПКМ</kbd> панорамирование</li>
    <li><kbd>КОЛЕСО</kbd> зум</li>
    <li><kbd>КЛИК ПО ВОДЕ</kbd> бросить корм</li>
  </ul>
  <div class="btn-row">
    <button id="btn-fish" class="btn btn-primary">+ Рыбка</button>
    <button id="btn-bubbles" class="btn btn-ghost">Пузыри +10</button>
    <button id="btn-light" class="btn btn-warm">☀ Свет: вкл</button>
  </div>
</header>

<aside class="panel panel-stats">
  <div class="stat"><span class="stat-num" id="stat-fish">15</span><span class="stat-label">рыбок</span></div>
  <div class="stat"><span class="stat-num" id="stat-fps">60</span><span class="stat-label">fps</span></div>
  <div class="stat-mini" id="stat-eaten">съедено корма: <b>0</b></div>
</aside>

<div class="hint" id="hint"><span class="pulse-dot"></span>Кликните по воде — бросьте корм</div>
<div class="toasts" id="toasts"></div>
<div class="credit">three.js r128 · webgl</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';

/* ================= утилиты и константы ================= */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const $ = id => document.getElementById(id);

const TANK_W = 36, TANK_H = 24, TANK_D = 20;          // размеры аквариума
const BX = 16.6, BZ = 8.6, BY_MIN = -10.2, BY_MAX = 10.5; // границы плавания
const SAND_Y = -11.6, SURFACE_Y = 11.7;
const FWD = new THREE.Vector3(0, 0, 1);

/* ================= рендерер / сцена / камера ================= */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07304e, 0.011);       // имитация толщи воды

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);
camera.position.set(4, 7, 33);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, -1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 1.8;
controls.rotateSpeed = 0.85;
controls.panSpeed = 0.6;

/* ---------- окружение для отражений (PMREM) ---------- */
{
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(60, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0x0d4a6e, side: THREE.BackSide })));
  const top = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshBasicMaterial({ color: 0xdff4ff }));
  top.position.y = 45; top.rotation.x = Math.PI / 2; env.add(top);
  const side = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({ color: 0x1e7fae }));
  side.position.set(-45, 4, 0); side.rotation.y = Math.PI / 2; env.add(side);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.06).texture;
  pmrem.dispose();
}

/* ================= освещение ================= */
const ambLight = new THREE.AmbientLight(0x404040, 0.4);
scene.add(ambLight);
const hemi = new THREE.HemisphereLight(0x8fd8ff, 0x0a2a45, 0.35);
scene.add(hemi);

const dirLight = new THREE.DirectionalLight(0xfff1d6, 1.15);
dirLight.position.set(16, 30, 14);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -26;  dirLight.shadow.camera.right = 26;
dirLight.shadow.camera.top = 22;    dirLight.shadow.camera.bottom = -22;
dirLight.shadow.camera.near = 5;    dirLight.shadow.camera.far = 80;
dirLight.shadow.bias = -0.0008;
dirLight.shadow.normalBias = 0.02;
scene.add(dirLight);

const p1 = new THREE.PointLight(0x4fc3f7, 0.6, 70);  p1.position.set(-13, 5, 2);
const p2 = new THREE.PointLight(0x3d5afe, 0.55, 70); p2.position.set(13, -4, 5);
scene.add(p1, p2);

/* ================= корпус аквариума ================= */
const tank = new THREE.Group();
scene.add(tank);

const glassGeo = new THREE.BoxGeometry(TANK_W, TANK_H, TANK_D);
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xbfe6ff, metalness: 0, roughness: 0.06,
  transmission: 0.95, ior: 1.33, thickness: 1.2,
  clearcoat: 0.5, clearcoatRoughness: 0.2,
  side: THREE.DoubleSide
});
tank.add(new THREE.Mesh(glassGeo, glassMat));
tank.add(new THREE.LineSegments(
  new THREE.EdgesGeometry(glassGeo),
  new THREE.LineBasicMaterial({ color: 0x8fd8ff, transparent: true, opacity: 0.55 })
));

const frameMat = new THREE.MeshStandardMaterial({ color: 0x101d2b, roughness: 0.8, metalness: 0.25 });
const rimTop = new THREE.Mesh(new THREE.BoxGeometry(TANK_W + 0.9, 0.9, TANK_D + 0.9), frameMat);
rimTop.position.y = TANK_H / 2 + 0.45;
const rimBot = rimTop.clone(); rimBot.position.y = -TANK_H / 2 - 0.45;
const ped = new THREE.Mesh(new THREE.BoxGeometry(TANK_W + 2.6, 1.8, TANK_D + 2.6), frameMat);
ped.position.y = -TANK_H / 2 - 1.35; ped.receiveShadow = true;
tank.add(rimTop, rimBot, ped);

/* ================= песчаное дно ================= */
const sandGeo = new THREE.PlaneGeometry(TANK_W - 1.2, TANK_D - 1.2, 46, 28);
sandGeo.rotateX(-Math.PI / 2);
{
  const sp = sandGeo.attributes.position;
  for (let i = 0; i < sp.count; i++){
    const x = sp.getX(i), z = sp.getZ(i);
    sp.setY(i, Math.sin(x * 0.55) * Math.cos(z * 0.7) * 0.32
             + Math.sin(x * 1.7 + z * 1.3) * 0.1 + Math.random() * 0.07);
  }
  sandGeo.computeVertexNormals();
}
const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({ color: 0xd9c48f, roughness: 1 }));
sand.position.y = SAND_Y;
sand.receiveShadow = true;
scene.add(sand);

/* ================= камни ================= */
const rockCols = [0x6b7078, 0x7d7468, 0x5c6b73, 0x8a7f6d, 0x59606b];
for (let i = 0; i < 8; i++){
  const r = rand(0.7, 1.6);
  const g = new THREE.DodecahedronGeometry(r, 0);
  const p = g.attributes.position;
  for (let v = 0; v < p.count; v++){
    const x = p.getX(v), y = p.getY(v), z = p.getZ(v);
    // детерминированная деформация по координате — без «разрывов» граней
    const n = 0.78 + 0.34 * (Math.sin(x * 2.3 + r) * 0.5
             + Math.cos(y * 2.9 + r * 1.7) * 0.3 + Math.sin(z * 3.1 + r) * 0.2);
    p.setXYZ(v, x * n, y * n, z * n);
  }
  g.computeVertexNormals();
  const rock = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: pick(rockCols), roughness: 0.95 }));
  rock.position.set(rand(-15, 15), SAND_Y + r * 0.4, rand(-7.5, 7.5));
  rock.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3));
  rock.castShadow = rock.receiveShadow = true;
  scene.add(rock);
}

/* ================= водоросли (TubeGeometry + CatmullRom) ================= */
const weedGroups = [];
const weedCols = [0x1f9d55, 0x2fbf6b, 0x157a45, 0x3edc84, 0x0f6b3a];
for (let i = 0; i < 12; i++){
  const tuft = new THREE.Group();
  const blades = 3 + ((Math.random() * 3) | 0);
  for (let b = 0; b < blades; b++){
    const h = rand(2.5, 7), ox = rand(-0.3, 0.3), oz = rand(-0.3, 0.3);
    const lx = rand(-0.9, 0.9), lz = rand(-0.9, 0.9);
    const pts = [];
    for (let s = 0; s <= 4; s++){
      const k = s / 4;
      pts.push(new THREE.Vector3(ox + lx * k * k, k * h, oz + lz * k * k));
    }
    const blade = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 10, rand(0.09, 0.17), 6, false),
      new THREE.MeshStandardMaterial({ color: pick(weedCols), roughness: 0.7 })
    );
    tuft.add(blade);
  }
  tuft.position.set(rand(-15, 15), SAND_Y + 0.25, rand(-7.5, 7.5));
  scene.add(tuft);
  weedGroups.push({ g: tuft, ph: rand(0, 6.28), sp: rand(0.5, 1.1) });
}

/* ================= поверхность воды ================= */
const surfGeo = new THREE.PlaneGeometry(TANK_W - 0.6, TANK_D - 0.6, 34, 20);
const surf = new THREE.Mesh(surfGeo, new THREE.MeshPhysicalMaterial({
  color: 0x8fdcff, transparent: true, opacity: 0.2, roughness: 0.12,
  metalness: 0.25, side: THREE.DoubleSide, depthWrite: false
}));
surf.rotation.x = -Math.PI / 2;
surf.position.y = SURFACE_Y;
scene.add(surf);
const surfPos = surfGeo.attributes.position;
const sx = new Float32Array(surfPos.count), sy = new Float32Array(surfPos.count);
for (let i = 0; i < surfPos.count; i++){ sx[i] = surfPos.getX(i); sy[i] = surfPos.getY(i); }

/* ================= лучи света ================= */
const shafts = [];
for (let i = 0; i < 3; i++){
  const m = new THREE.Mesh(
    new THREE.ConeGeometry(rand(4, 7), 26, 10, 1, true),
    new THREE.MeshBasicMaterial({ color: 0x9fdcff, transparent: true, opacity: 0.05,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })
  );
  m.position.set(rand(-10, 10), 0, rand(-4, 4));
  m.rotation.z = rand(-0.15, 0.15);
  m.rotation.x = rand(-0.1, 0.1);
  scene.add(m);
  shafts.push({ m, ph: rand(0, 6.28), sp: rand(0.25, 0.55) });
}

/* ================= взвесь (планктон) ================= */
const MOTES = 240;
const motesGeo = new THREE.BufferGeometry();
const mpArr = new Float32Array(MOTES * 3), moteSpd = new Float32Array(MOTES);
for (let i = 0; i < MOTES; i++){
  mpArr[i*3] = rand(-16, 16); mpArr[i*3+1] = rand(-10.5, 10.4); mpArr[i*3+2] = rand(-8.4, 8.4);
  moteSpd[i] = rand(0.15, 0.5);
}
motesGeo.setAttribute('position', new THREE.BufferAttribute(mpArr, 3));
scene.add(new THREE.Points(motesGeo, new THREE.PointsMaterial({
  color: 0xbfe9ff, size: 0.13, transparent: true, opacity: 0.4, depthWrite: false
})));

/* ================= пузыри ================= */
const bubbles = [];
const bubbleGeo = new THREE.SphereGeometry(1, 12, 10);
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.05,
  transmission: 0.9, transparent: true, opacity: 0.45, depthWrite: false
});
function addBubbles(n, fromBottom){
  for (let i = 0; i < n; i++){
    const b = {
      mesh: new THREE.Mesh(bubbleGeo, bubbleMat),
      x0: rand(-15, 15), z0: rand(-8, 8),
      y: fromBottom ? rand(-11, -10) : rand(-10.5, 10.5),
      r: rand(0.1, 0.28), spd: rand(1.1, 2.6),
      amp: rand(0.15, 0.5), freq: rand(1.2, 2.6), ph: rand(0, 6.28)
    };
    b.mesh.scale.setScalar(b.r);
    scene.add(b.mesh);
    bubbles.push(b);
  }
}
addBubbles(30, false);

/* ================= рыбки ================= */
const SCHEMES = [
  { body: 0xff7a1f, fin: 0xffb066, accent: 0xffffff, stripe: true, name: 'Оранжевая' },
  { body: 0x2f7bff, fin: 0x8fc1ff, accent: 0xeaf4ff,              name: 'Синяя' },
  { body: 0xffc93c, fin: 0xff4d3d, accent: 0xfff3c4,              name: 'Жёлто-красная' },
  { body: 0x9b4dff, fin: 0xcf9bff, accent: 0xf2e3ff, stripe: true, name: 'Фиолетовая' },
  { body: 0xff3b4e, fin: 0xff9aa2, accent: 0xffe3e5,              name: 'Красная' },
  { body: 0x35d07f, fin: 0x9dffc4, accent: 0xe4ffee,              name: 'Зелёная' },
  { body: 0xff7ac8, fin: 0xffc9e8, accent: 0xffeaf7,              name: 'Розовая' },
  { body: 0xffc93c, fin: 0xffe08a, accent: 0xfff6d8, metal: 0.55, name: 'Золотая' }
];
const GEO = {
  body:   new THREE.SphereGeometry(1, 20, 14),
  tail:   new THREE.ConeGeometry(0.55, 1.05, 7),
  dorsal: new THREE.ConeGeometry(0.5, 0.75, 6),
  fin:    new THREE.ConeGeometry(0.34, 0.6, 6),
  eye:    new THREE.SphereGeometry(0.15, 10, 8),
  pupil:  new THREE.SphereGeometry(0.065, 8, 6),
  stripe: new THREE.TorusGeometry(1.0, 0.14, 8, 18)
};
const eyeMat   = new THREE.MeshStandardMaterial({ color: 0xf4f9ff, roughness: 0.25 });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x0a0f14, roughness: 0.15 });
const fishArray = [];

function makeFish(scheme){
  const s = scheme || pick(SCHEMES);
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({
    color: s.body, roughness: s.metal ? 0.3 : 0.45,
    metalness: s.metal || 0.05, envMapIntensity: 0.9
  });
  const finMat = new THREE.MeshStandardMaterial({
    color: s.fin, roughness: 0.5, metalness: 0.05,
    side: THREE.DoubleSide, transparent: true, opacity: 0.92
  });

  // тело (вытянутая сфера, нос смотрит в +Z)
  const body = new THREE.Mesh(GEO.body, bodyMat);
  body.scale.set(0.55, 0.72, 1.35);
  body.castShadow = true;
  g.add(body);

  if (s.stripe){
    const st = new THREE.Mesh(GEO.stripe, new THREE.MeshStandardMaterial({ color: s.accent, roughness: 0.4 }));
    st.scale.set(0.55, 0.72, 1);
    st.position.z = 0.1;
    g.add(st);
  }

  // хвост: пивот на заднем конце, махание вокруг вертикальной оси
  const tailPivot = new THREE.Group();
  tailPivot.position.set(0, 0, -1.2);
  const tail = new THREE.Mesh(GEO.tail, finMat);
  tail.rotation.x = Math.PI / 2;      // остриё конуса к телу
  tail.scale.set(0.3, 1, 1);          // высокий тонкий «веер»
  tail.position.z = -0.52;
  tail.castShadow = true;
  tailPivot.add(tail);
  g.add(tailPivot);

  // спинной плавник
  const dorsal = new THREE.Mesh(GEO.dorsal, finMat);
  dorsal.scale.set(0.24, 1, 0.9);
  dorsal.position.set(0, 0.85, -0.15);
  dorsal.rotation.x = -0.45;
  dorsal.castShadow = true;
  g.add(dorsal);

  // грудные плавники
  const finBaseR = -Math.PI / 2 - 0.5, finBaseL = Math.PI / 2 + 0.5;
  const rightFin = new THREE.Mesh(GEO.fin, finMat);
  rightFin.scale.set(1, 1, 0.18);
  rightFin.rotation.z = finBaseR;
  rightFin.position.set(0.5, -0.1, 0.45);
  const leftFin = new THREE.Mesh(GEO.fin, finMat);
  leftFin.scale.set(1, 1, 0.18);
  leftFin.rotation.z = finBaseL;
  leftFin.position.set(-0.5, -0.1, 0.45);
  g.add(rightFin, leftFin);

  // глаза с зрачками
  for (const sgn of [-1, 1]){
    const eye = new THREE.Mesh(GEO.eye, eyeMat);
    eye.position.set(0.3 * sgn, 0.16, 0.92);
    const pup = new THREE.Mesh(GEO.pupil, pupilMat);
    pup.position.set(0.31 * sgn, 0.17, 1.0);
    g.add(eye, pup);
  }

  const baseScale = rand(0.6, 1.2);
  g.position.set(rand(-14, 14), rand(-8, 8), rand(-7, 7));
  g.scale.setScalar(baseScale);
  g.rotation.y = rand(0, 6.28);

  const fish = {
    mesh: g, tail: tailPivot, leftFin, rightFin,
    finBaseL, finBaseR,
    velocity: new THREE.Vector3(rand(-1,1), rand(-0.4,0.4), rand(-1,1)).normalize().multiplyScalar(2),
    speed: rand(2.2, 3.9),
    tailSpeed: rand(5.5, 9),
    flapSpeed: rand(4, 7),
    phase: rand(0, 6.28),
    wander: new THREE.Vector3(rand(-1,1), rand(-0.5,0.5), rand(-1,1)).normalize(),
    wanderT: 0,
    targetFood: null,
    avoidanceRadius: rand(2.3, 3.6),
    baseScale, grow: 1, pulse: 0
  };
  scene.add(g);
  fishArray.push(fish);
  return fish;
}
for (let i = 0; i < 15; i++) makeFish();

/* ================= корм ================= */
const foods = [];
const foodGeo = new THREE.SphereGeometry(0.22, 10, 8);
const foodMat = new THREE.MeshStandardMaterial({ color: 0xb06a2c, roughness: 0.85, emissive: 0x2a1503 });
let eaten = 0;
const statEaten = $('stat-eaten');

function spawnFood(pos){
  if (foods.length >= 25) removeFood(foods[0]);
  const mesh = new THREE.Mesh(foodGeo, foodMat);
  mesh.position.copy(pos);
  mesh.castShadow = true;
  scene.add(mesh);
  foods.push({ mesh, vy: -0.6, landed: false, life: 3, seed: rand(0, 10) });
}
function removeFood(fd){
  scene.remove(fd.mesh);
  const i = foods.indexOf(fd);
  if (i > -1) foods.splice(i, 1);
  for (const f of fishArray) if (f.targetFood === fd) f.targetFood = null;
}
function eatFood(f, fd){
  f.grow = Math.min(2.3, f.grow * 1.05);   // рост +5%
  f.pulse = 0.5;                            // «глоток»
  burst(fd.mesh.position);
  removeFood(fd);
  eaten++;
  statEaten.innerHTML = 'съедено корма: <b>' + eaten + '</b>';
}
function updateFoods(dt, t){
  for (let i = foods.length - 1; i >= 0; i--){
    const fd = foods[i], p = fd.mesh.position;
    if (!fd.landed){
      fd.vy -= 3.2 * dt;                    // гравитация (с сопротивлением воды)
      fd.vy *= Math.exp(-0.85 * dt);
      p.y += fd.vy * dt;
      p.x += Math.sin(t * 1.7 + fd.seed) * 0.25 * dt;
      p.z += Math.cos(t * 1.4 + fd.seed) * 0.25 * dt;
      if (p.y <= SAND_Y + 0.5){ p.y = SAND_Y + 0.5; fd.landed = true; }
    } else {
      fd.life -= dt;                        // на дне держится 3 с, потом «тонет»
      fd.mesh.scale.setScalar(Math.max(0.001, fd.life / 3));
      if (fd.life <= 0) removeFood(fd);
    }
  }
}

/* ================= всплески при поедании ================= */
const effects = [];
const burstGeo = new THREE.SphereGeometry(0.08, 8, 6);
function burst(pos){
  for (let i = 0; i < 6; i++){
    const m = new THREE.Mesh(burstGeo, new THREE.MeshBasicMaterial({
      color: 0xbff3ff, transparent: true, opacity: 0.9, depthWrite: false
    }));
    m.position.copy(pos);
    scene.add(m);
    effects.push({ mesh: m, life: 0.55, max: 0.55,
      vel: new THREE.Vector3(rand(-1.6,1.6), rand(0.8,2.4), rand(-1.6,1.6)) });
  }
}
function updateEffects(dt){
  for (let i = effects.length - 1; i >= 0; i--){
    const e = effects[i];
    e.life -= dt;
    if (e.life <= 0){
      scene.remove(e.mesh); e.mesh.material.dispose();
      effects.splice(i, 1); continue;
    }
    e.vel.y += 2.2 * dt;
    e.mesh.position.addScaledVector(e.vel, dt);
    const k = e.life / e.max;
    e.mesh.scale.setScalar(k);
    e.mesh.material.opacity = k;
  }
}

/* ================= поведение рыбок ================= */
const _desired = new THREE.Vector3(), _dir = new THREE.Vector3(), _q = new THREE.Quaternion();

function updateFish(dt, t){
  const n = fishArray.length;
  for (let i = 0; i < n; i++){
    const f = fishArray[i];
    const p = f.mesh.position;

    // случайное блуждание
    f.wanderT -= dt;
    if (f.wanderT <= 0){
      f.wanderT = rand(2, 5);
      f.wander.set(rand(-1,1), rand(-0.5,0.5), rand(-1,1)).normalize();
    }
    _desired.copy(f.wander);

    // избегание столкновений
    for (let j = 0; j < n; j++){
      if (j === i) continue;
      const o = fishArray[j].mesh.position;
      const dx = p.x - o.x, dy = p.y - o.y, dz = p.z - o.z;
      const d2 = dx*dx + dy*dy + dz*dz;
      const rr = f.avoidanceRadius;
      if (d2 < rr * rr && d2 > 1e-6){
        const d = Math.sqrt(d2), k = (1 - d / rr) / d;
        _desired.x += dx * k; _desired.y += dy * k; _desired.z += dz * k;
      }
    }

    // мягкое отражение от стенок
    const M = 2.2;
    if (p.x >  BX - M) _desired.x -= (p.x - (BX - M)) * 1.5;
    if (p.x < -BX + M) _desired.x += ((-BX + M) - p.x) * 1.5;
    if (p.z >  BZ - M) _desired.z -= (p.z - (BZ - M)) * 1.5;
    if (p.z < -BZ + M) _desired.z += ((-BZ + M) - p.z) * 1.5;
    if (p.y < BY_MIN + M) _desired.y += ((BY_MIN + M) - p.y) * 1.7;
    if (p.y > BY_MAX - M) _desired.y -= (p.y - (BY_MAX - M)) * 1.5;

    // преследование корма (радиус 15)
    f.targetFood = null;
    let best = 225;
    for (let k = 0; k < foods.length; k++){
      const fp = foods[k].mesh.position;
      const d2 = (p.x-fp.x)*(p.x-fp.x) + (p.y-fp.y)*(p.y-fp.y) + (p.z-fp.z)*(p.z-fp.z);
      if (d2 < best){ best = d2; f.targetFood = foods[k]; }
    }
    let spd = f.speed;
    if (f.targetFood){
      const fp = f.targetFood.mesh.position;
      _dir.subVectors(fp, p);
      const dl = _dir.length();
      _dir.divideScalar(dl || 1);
      _desired.copy(_dir);
      spd *= 1.9;
      if (dl < 0.8 + f.baseScale * f.grow * 0.45) eatFood(f, f.targetFood);
    }

    if (_desired.lengthSq() < 1e-6) _desired.copy(f.velocity);
    _desired.normalize();
    f.velocity.lerp(_desired.multiplyScalar(spd), 1 - Math.exp(-3 * dt));
    p.addScaledVector(f.velocity, dt);

    p.x = THREE.MathUtils.clamp(p.x, -BX, BX);
    p.y = THREE.MathUtils.clamp(p.y, BY_MIN, BY_MAX);
    p.z = THREE.MathUtils.clamp(p.z, -BZ, BZ);

    // плавный поворот в направлении движения
    if (f.velocity.lengthSq() > 1e-4){
      _dir.copy(f.velocity).normalize();
      _q.setFromUnitVectors(FWD, _dir);
      f.mesh.quaternion.slerp(_q, 1 - Math.exp(-4 * dt));
    }

    // анимация хвоста и плавников (амплитуда зависит от скорости)
    const act = 0.6 + 0.4 * Math.min(1, f.velocity.length() / (f.speed || 1));
    f.tail.rotation.y = Math.sin(t * f.tailSpeed + f.phase) * 0.55 * act;
    const flap = Math.sin(t * f.flapSpeed + f.phase) * 0.4;
    f.rightFin.rotation.z = f.finBaseR + flap;
    f.leftFin.rotation.z = f.finBaseL - flap;

    // размер + «глоток»
    if (f.pulse > 0) f.pulse -= dt * 2;
    f.mesh.scale.setScalar(f.baseScale * f.grow * (1 + Math.max(0, f.pulse) * 0.55));
  }
}

/* ================= кормление по клику ================= */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const feedPlane = new THREE.Plane();
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();
let downX = 0, downY = 0, downT = 0;
const el = renderer.domElement;
el.addEventListener('contextmenu', e => e.preventDefault());
el.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; downT = performance.now(); });
el.addEventListener('pointerup', e => {
  const dx = e.clientX - downX, dy = e.clientY - downY;
  if (dx*dx + dy*dy < 49 && performance.now() - downT < 400) tryFeed(e); // клик, а не драг
});
function tryFeed(e){
  const r = el.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  let pt = null;
  const hit = raycaster.intersectObject(sand, false);
  if (hit.length) pt = hit[0].point;
  else {
    camera.getWorldDirection(_v1).negate();
    feedPlane.setFromNormalAndCoplanarPoint(_v1, new THREE.Vector3(0, 0, 0));
    if (raycaster.ray.intersectPlane(feedPlane, _v2)) pt = _v2;
  }
  if (!pt) return;
  spawnFood(new THREE.Vector3(
    THREE.MathUtils.clamp(pt.x, -16, 16),
    THREE.MathUtils.clamp(pt.y + 5, -8.5, 10.4),   // падает сверху от точки клика
    THREE.MathUtils.clamp(pt.z, -8.4, 8.4)
  ));
  toast('🫧', 'Корм брошен');
  hideHint();
}

/* ================= UI ================= */
const statFish = $('stat-fish'), statFps = $('stat-fps');
function setNum(elm, v){
  const s = String(v);
  if (elm.textContent !== s){
    elm.textContent = s;
    elm.classList.remove('pop'); void elm.offsetWidth; elm.classList.add('pop');
  }
}
function toast(icon, msg){
  const box = $('toasts');
  if (box.children.length > 3) box.removeChild(box.firstChild);
  const d = document.createElement('div');
  d.className = 'toast';
  d.innerHTML = '<span>' + icon + '</span>' + msg;
  box.appendChild(d);
  requestAnimationFrame(() => d.classList.add('show'));
  setTimeout(() => { d.classList.add('hide'); setTimeout(() => d.remove(), 450); }, 2200);
}
const hint = $('hint');
let hintHidden = false;
function hideHint(){ if (!hintHidden){ hintHidden = true; hint.classList.add('gone'); } }
setTimeout(hideHint, 16000);

$('btn-fish').addEventListener('click', () => {
  if (fishArray.length >= 40){ toast('⚠️', 'Максимум 40 рыбок'); return; }
  makeFish();
  setNum(statFish, fishArray.length);
  toast('🐠', 'Новая рыбка в аквариуме');
});
$('btn-bubbles').addEventListener('click', () => {
  if (bubbles.length >= 120){ toast('⚠️', 'Пузырей уже довольно много'); return; }
  addBubbles(10, true);
  toast('🫧', 'Добавлено 10 пузырей');
});
let sunOn = true;
$('btn-light').addEventListener('click', function(){
  sunOn = !sunOn;
  dirLight.intensity = sunOn ? 1.15 : 0.05;
  ambLight.intensity  = sunOn ? 0.4  : 0.2;
  hemi.intensity      = sunOn ? 0.35 : 0.16;
  this.classList.toggle('off', !sunOn);
  this.textContent = sunOn ? '☀ Свет: вкл' : '🌙 Свет: выкл';
  toast(sunOn ? '☀️' : '🌙', sunOn ? 'Свет включён' : 'Свет выключен');
});
setTimeout(() => toast('🐟', 'Кликните по воде — бросьте корм'), 1300);

/* ================= главный цикл ================= */
const clock = new THREE.Clock();
let frames = 0, fpsAcc = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  controls.update();
  updateFish(dt, t);
  updateFoods(dt, t);

  // пузыри
  for (const b of bubbles){
    b.y += b.spd * dt;
    if (b.y > SURFACE_Y - 0.4){ b.y = -10.8; b.x0 = rand(-15,15); b.z0 = rand(-8,8); }
    b.mesh.position.set(
      b.x0 + Math.sin(t * b.freq + b.ph) * b.amp,
      b.y,
      b.z0 + Math.cos(t * b.freq * 0.83 + b.ph) * b.amp
    );
  }

  // водоросли
  for (const w of weedGroups){
    w.g.rotation.x = Math.sin(t * w.sp + w.ph) * 0.09;
    w.g.rotation.z = Math.cos(t * w.sp * 0.9 + w.ph) * 0.09;
  }

  // волны на поверхности
  for (let i = 0; i < surfPos.count; i++){
    surfPos.setZ(i,
      Math.sin(sx[i] * 0.45 + t * 1.3) * 0.22 +
      Math.cos(sy[i] * 0.55 + t * 1.05) * 0.18 +
      Math.sin((sx[i] + sy[i]) * 0.3 + t * 0.7) * 0.1
    );
  }
  surfPos.needsUpdate = true;

  // лучи света и мерцание подводных огней
  const shaftK = sunOn ? 1 : 0.15;
  for (const s of shafts)
    s.m.material.opacity = (0.03 + 0.035 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph))) * shaftK;
  p1.intensity = 0.55 + Math.sin(t * 0.8) * 0.12;
  p2.intensity = 0.5 + Math.cos(t * 0.65 + 2) * 0.12;

  // планктон
  const mpa = motesGeo.attributes.position;
  for (let i = 0; i < MOTES; i++){
    let y = mpa.getY(i) + moteSpd[i] * dt;
    if (y > 10.4) y = -10.6;
    mpa.setY(i, y);
  }
  mpa.needsUpdate = true;

  updateEffects(dt);
  renderer.render(scene, camera);

  frames++; fpsAcc += dt;
  if (fpsAcc >= 0.5){
    setNum(statFps, Math.round(frames / fpsAcc));
    frames = 0; fpsAcc = 0;
  }
}

setNum(statFish, fishArray.length);
animate();
stage.classList.add('ready');

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
})();
</script>
