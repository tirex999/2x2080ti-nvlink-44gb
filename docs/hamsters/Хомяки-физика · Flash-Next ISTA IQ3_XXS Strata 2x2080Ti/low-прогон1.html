<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>3D Клетка с хомяками — честная физика</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
#debug-panel {
    position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.85);
    color: #0f0; font-family: 'Courier New', monospace; font-size: 11px;
    padding: 10px; border-radius: 6px; border: 1px solid #0f0;
    max-width: 320px; z-index: 100; line-height: 1.5;
}
#status-panel {
    position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.85);
    color: #fff; font-size: 12px; padding: 10px; border-radius: 6px;
    border: 1px solid #555; z-index: 100; min-width: 200px;
}
#status-panel h3 { color: #ffcc00; margin-bottom: 6px; font-size: 13px; }
.hamster-status { margin: 3px 0; padding: 2px 4px; border-radius: 3px; }
</style>
</head>
<body>
<div id="debug-panel">
    <b>⚙ ФИЗИКА КОЛЕСА</b><br>
    <span id="wheel-info">Ожидание...</span>
</div>
<div id="status-panel">
    <h3>🐹 Хомяки</h3>
    <div id="hamster-statuses"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
// КОНСТАНТЫ — ГАБАРИТЫ И СВЯЗИ
// ============================================================
const HAMSTER_LENGTH = 0.35;
const HAMSTER_HEIGHT = 0.22;
const HAMSTER_WIDTH = 0.20;
const HAMSTER_CRAWL_HEIGHT = 0.14;

// Колесо: радиус вычислен ОТ размера хомяка
const WHEEL_RADIUS = HAMSTER_HEIGHT * 2.0; // 0.44 — хомяк помещается с запасом
const WHEEL_WIDTH = HAMSTER_WIDTH * 1.8;   // 0.36 — шире боков хомяка
const WHEEL_RIM_THICKNESS = 0.035;
const WHEEL_FRICTION = 1.2; // коэффициент трения для пустого колеса

// Труба: внутренний радиус > половины высоты хомяка при ползании
const TUBE_INNER_RADIUS = HAMSTER_CRAWL_HEIGHT * 1.4; // 0.196
const TUBE_LENGTH = 1.3;
const TUBE_WALL_THICKNESS = 0.03;

// Клетка
const CAGE_W = 3.2;
const CAGE_D = 2.2;
const CAGE_H = 1.6;
const BAR_RADIUS = 0.015;
const BAR_SPACING = 0.12;

// Миска
const BOWL_RADIUS = 0.22;
const BOWL_DEPTH = 0.10;

// ============================================================
// СЦЕНА
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a3a);
scene.fog = new THREE.Fog(0x2a2a3a, 8, 20);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(3.5, 3.0, 4.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 2;
controls.maxDistance = 12;

// ============================================================
// ОСВЕЩЕНИЕ
// ============================================================
const dirLight = new THREE.DirectionalLight(0xfff5e0, 0.9);
dirLight.position.set(3, 5, 2);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 15;
dirLight.shadow.camera.left = -4;
dirLight.shadow.camera.right = 4;
dirLight.shadow.camera.top = 4;
dirLight.shadow.camera.bottom = -4;
dirLight.shadow.bias = -0.001;
scene.add(dirLight);

const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
scene.add(ambientLight);

const fillLight = new THREE.PointLight(0x8888ff, 0.3, 10);
fillLight.position.set(-2, 2, -1);
scene.add(fillLight);

// ============================================================
// КОМНАТА
// ============================================================
function createRoom() {
    // Пол комнаты
    const floorGeo = new THREE.PlaneGeometry(12, 12);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.01;
    floor.receiveShadow = true;
    scene.add(floor);

    // Стол
    const tableGeo = new THREE.BoxGeometry(4.5, 0.08, 3.2);
    const tableMat = new THREE.MeshStandardMaterial({ color: 0x6B4423, roughness: 0.6 });
    const table = new THREE.Mesh(tableGeo, tableMat);
    table.position.y = -0.04;
    table.receiveShadow = true;
    table.castShadow = true;
    scene.add(table);

    // Ножки стола
    const legGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.8, 8);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x4a3015 });
    [[-2, -1.4], [2, -1.4], [-2, 1.4], [2, 1.4]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(x, -0.44, z);
        leg.castShadow = true;
        scene.add(leg);
    });

    // Стены
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x5a5a6a, roughness: 0.9 });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), wallMat);
    backWall.position.set(0, 2.5, -6);
    backWall.receiveShadow = true;
    scene.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), wallMat);
    leftWall.position.set(-6, 2.5, 0);
    leftWall.rotation.y = Math.PI / 2;
    leftWall.receiveShadow = true;
    scene.add(leftWall);
}
createRoom();

// ============================================================
// КЛЕТКА
// ============================================================
const cageGroup = new THREE.Group();
scene.add(cageGroup);

// Поддон
const trayGeo = new THREE.BoxGeometry(CAGE_W, 0.08, CAGE_D);
const trayMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.4, metalness: 0.3 });
const tray = new THREE.Mesh(trayGeo, trayMat);
tray.position.y = 0.04;
tray.receiveShadow = true;
tray.castShadow = true;
cageGroup.add(tray);

// Стенки поддона
const wallMat2 = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.5 });
[[-CAGE_W/2, 0, 0, 0.08, 0.15, CAGE_D], [CAGE_W/2, 0, 0, 0.08, 0.15, CAGE_D],
 [0, 0, -CAGE_D/2, CAGE_W, 0.15, 0.08], [0, 0, CAGE_D/2, CAGE_W, 0.15, 0.08]].forEach(([x, y, z, w, h, d]) => {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat2);
    wall.position.set(x, 0.155, z);
    wall.castShadow = true;
    cageGroup.add(wall);
});

// Прутья
const barMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.3, metalness: 0.7 });
const barGeo = new THREE.CylinderGeometry(BAR_RADIUS, BAR_RADIUS, CAGE_H, 6);

function addBarsAlongX(z, count) {
    for (let i = 0; i < count; i++) {
        const x = -CAGE_W/2 + (i + 0.5) * (CAGE_W / count);
        const bar = new THREE.Mesh(barGeo, barMat);
        bar.position.set(x, CAGE_H/2 + 0.15, z);
        bar.castShadow = true;
        cageGroup.add(bar);
    }
}
function addBarsAlongZ(x, count) {
    for (let i = 0; i < count; i++) {
        const z = -CAGE_D/2 + (i + 0.5) * (CAGE_D / count);
        const bar = new THREE.Mesh(barGeo, barMat);
        bar.position.set(x, CAGE_H/2 + 0.15, z);
        bar.castShadow = true;
        cageGroup.add(bar);
    }
}
addBarsAlongX(-CAGE_D/2, Math.floor(CAGE_W / BAR_SPACING));
addBarsAlongX(CAGE_D/2, Math.floor(CAGE_W / BAR_SPACING));
addBarsAlongZ(-CAGE_W/2, Math.floor(CAGE_D / BAR_SPACING));
addBarsAlongZ(CAGE_W/2, Math.floor(CAGE_D / BAR_SPACING));

// Рамки по верху
const frameMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.3, metalness: 0.6 });
const frameGeoX = new THREE.BoxGeometry(CAGE_W + 0.06, 0.04, 0.04);
const frameGeoZ = new THREE.BoxGeometry(0.04, 0.04, CAGE_D + 0.06);
[[-CAGE_D/2, frameGeoX], [CAGE_D/2, frameGeoX]].forEach(([z, geo]) => {
    const f = new THREE.Mesh(geo, frameMat);
    f.position.set(0, CAGE_H + 0.15, z);
    cageGroup.add(f);
});
[[-CAGE_W/2, frameGeoZ], [CAGE_W/2, frameGeoZ]].forEach(([x, geo]) => {
    const f = new THREE.Mesh(geo, frameMat);
    f.position.set(x, CAGE_H + 0.15, 0);
    cageGroup.add(f);
});

// ============================================================
// ПОДСТИЛКА (InstancedMesh)
// ============================================================
function createBedding() {
    const chipGeo = new THREE.BoxGeometry(0.04, 0.008, 0.015);
    const chipMat = new THREE.MeshStandardMaterial({ color: 0xC4A35A, roughness: 0.9 });
    const count = 600;
    const chips = new THREE.InstancedMesh(chipGeo, chipMat, count);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < count; i++) {
        dummy.position.set(
            (Math.random() - 0.5) * (CAGE_W - 0.2),
            0.09 + Math.random() * 0.02,
            (Math.random() - 0.5) * (CAGE_D - 0.2)
        );
        dummy.rotation.set(
            Math.random() * 0.3 - 0.15,
            Math.random() * Math.PI * 2,
            Math.random() * 0.3 - 0.15
        );
        dummy.scale.set(0.7 + Math.random() * 0.6, 0.5 + Math.random() * 1.0, 0.7 + Math.random() * 0.6);
        dummy.updateMatrix();
        chips.setMatrixAt(i, dummy.matrix);
    }
    chips.receiveShadow = true;
    cageGroup.add(chips);
}
createBedding();

// ============================================================
// КОЛЕСО
// ============================================================
const wheelObj = {
    group: new THREE.Group(),
    angle: 0,
    angularVelocity: 0,
    radius: WHEEL_RADIUS,
    occupant: -1,
    position: new THREE.Vector3(-0.9, WHEEL_RADIUS + 0.1, -0.4)
};

function createWheel() {
    const g = wheelObj.group;
    const rimMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.5 });
    const spokeMat = new THREE.MeshStandardMaterial({ color: 0x6B3410, roughness: 0.6 });

    // Обод (тор)
    const rimGeo = new THREE.TorusGeometry(WHEEL_RADIUS, WHEEL_RIM_THICKNESS, 12, 48);
    const rim = new THREE.Mesh(rimGeo, rimMat);
    rim.castShadow = true;
    g.add(rim);

    // Внутренняя поверхность (для бега)
    const innerRimGeo = new THREE.TorusGeometry(WHEEL_RADIUS - WHEEL_RIM_THICKNESS, 0.01, 8, 48);
    const innerRim = new THREE.Mesh(innerRimGeo, new THREE.MeshStandardMaterial({ color: 0x5a2d0c }));
    g.add(innerRim);

    // Спицы
    for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        const spokeGeo = new THREE.CylinderGeometry(0.012, 0.012, WHEEL_RADIUS * 2 - 0.04, 6);
        const spoke = new THREE.Mesh(spokeGeo, spokeMat);
        spoke.rotation.z = a;
        spoke.castShadow = true;
        g.add(spoke);
    }

    // Ступица
    const hubGeo = new THREE.CylinderGeometry(0.04, 0.04, WHEEL_WIDTH + 0.04, 12);
    const hub = new THREE.Mesh(hubGeo, new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.5 }));
    hub.rotation.x = Math.PI / 2;
    g.add(hub);

    // Боковые диски
    const discGeo = new THREE.CylinderGeometry(WHEEL_RADIUS + 0.02, WHEEL_RADIUS + 0.02, 0.015, 32);
    const discMat = new THREE.MeshStandardMaterial({ color: 0x7a3d10, roughness: 0.5, transparent: true, opacity: 0.3 });
    const disc1 = new THREE.Mesh(discGeo, discMat);
    disc1.rotation.x = Math.PI / 2;
    disc1.position.z = WHEEL_WIDTH / 2;
    g.add(disc1);
    const disc2 = new THREE.Mesh(discGeo, discMat);
    disc2.rotation.x = Math.PI / 2;
    disc2.position.z = -WHEEL_WIDTH / 2;
    g.add(disc2);

    // Подставка
    const standMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.4 });
    const standGeo = new THREE.BoxGeometry(0.06, WHEEL_RADIUS + 0.1, 0.06);
    const stand1 = new THREE.Mesh(standGeo, standMat);
    stand1.position.set(0, -(WHEEL_RADIUS + 0.1) / 2, WHEEL_WIDTH / 2 + 0.03);
    stand1.castShadow = true;
    g.add(stand1);
    const stand2 = new THREE.Mesh(standGeo, standMat);
    stand2.position.set(0, -(WHEEL_RADIUS + 0.1) / 2, -WHEEL_WIDTH / 2 - 0.03);
    stand2.castShadow = true;
    g.add(stand2);

    g.position.copy(wheelObj.position);
    cageGroup.add(g);
}
createWheel();

// ============================================================
// ТРУБА
// ============================================================
const tubeObj = {
    group: new THREE.Group(),
    innerRadius: TUBE_INNER_RADIUS,
    length: TUBE_LENGTH,
    position: new THREE.Vector3(0.6, TUBE_INNER_RADIUS + 0.1, 0.3),
    axis: new THREE.Vector3(1, 0, 0), // вдоль X
    occupant: -1
};

function createTube() {
    const g = tubeObj.group;
    const tubeMat = new THREE.MeshStandardMaterial({ color: 0x8B6914, roughness: 0.6 });

    // Внешняя стенка (открытый цилиндр)
    const outerGeo = new THREE.CylinderGeometry(
        TUBE_INNER_RADIUS + TUBE_WALL_THICKNESS,
        TUBE_INNER_RADIUS + TUBE_WALL_THICKNESS,
        TUBE_LENGTH, 24, 1, true
    );
    const outer = new THREE.Mesh(outerGeo, tubeMat);
    outer.rotation.z = Math.PI / 2;
    outer.castShadow = true;
    g.add(outer);

    // Внутренняя стенка
    const innerGeo = new THREE.CylinderGeometry(
        TUBE_INNER_RADIUS, TUBE_INNER_RADIUS,
        TUBE_LENGTH, 24, 1, true
    );
    const innerMat = new THREE.MeshStandardMaterial({ color: 0x6B4F10, roughness: 0.7, side: THREE.BackSide });
    const inner = new THREE.Mesh(innerGeo, innerMat);
    inner.rotation.z = Math.PI / 2;
    g.add(inner);

    // Торцы (кольца)
    const ringGeo = new THREE.TorusGeometry(TUBE_INNER_RADIUS + TUBE_WALL_THICKNESS / 2, TUBE_WALL_THICKNESS / 2, 8, 24);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x7a5a12 });
    const ring1 = new THREE.Mesh(ringGeo, ringMat);
    ring1.position.x = -TUBE_LENGTH / 2;
    ring1.rotation.y = Math.PI / 2;
    g.add(ring1);
    const ring2 = new THREE.Mesh(ringGeo, ringMat);
    ring2.position.x = TUBE_LENGTH / 2;
    ring2.rotation.y = Math.PI / 2;
    g.add(ring2);

    g.position.copy(tubeObj.position);
    cageGroup.add(g);
}
createTube();

// ============================================================
// МИСКА
// ============================================================
const bowlObj = {
    group: new THREE.Group(),
    radius: BOWL_RADIUS,
    position: new THREE.Vector3(0.8, 0.1, -0.5),
    occupant: -1
};

function createBowl() {
    const g = bowlObj.group;
    const bowlMat = new THREE.MeshStandardMaterial({ color: 0xCC4444, roughness: 0.4 });

    // Миска (полусфера)
    const bowlGeo = new THREE.SphereGeometry(BOWL_RADIUS, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2);
    const bowl = new THREE.Mesh(bowlGeo, bowlMat);
    bowl.rotation.x = Math.PI;
    bowl.position.y = BOWL_DEPTH;
    bowl.castShadow = true;
    g.add(bowl);

    // Дно
    const bottomGeo = new THREE.CircleGeometry(BOWL_RADIUS * 0.7, 16);
    const bottom = new THREE.Mesh(bottomGeo, new THREE.MeshStandardMaterial({ color: 0xAA3333 }));
    bottom.rotation.x = -Math.PI / 2;
    bottom.position.y = 0.01;
    g.add(bottom);

    // Зёрна
    const seedGeo = new THREE.SphereGeometry(0.02, 6, 6);
    const seedMat = new THREE.MeshStandardMaterial({ color: 0xDAA520 });
    for (let i = 0; i < 12; i++) {
        const seed = new THREE.Mesh(seedGeo, seedMat);
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * BOWL_RADIUS * 0.5;
        seed.position.set(Math.cos(angle) * r, 0.04 + Math.random() * 0.03, Math.sin(angle) * r);
        seed.scale.set(1, 0.6, 1);
        g.add(seed);
    }

    g.position.copy(bowlObj.position);
    cageGroup.add(g);
}
createBowl();

// ============================================================
// ПОИЛКА
// ============================================================
function createWaterBottle() {
    const g = new THREE.Group();
    const bottleMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.6, roughness: 0.2 });
    const bottleGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.25, 12);
    const bottle = new THREE.Mesh(bottleGeo, bottleMat);
    bottle.position.y = 0.125;
    g.add(bottle);

    const capGeo = new THREE.CylinderGeometry(0.03, 0.04, 0.04, 8);
    const cap = new THREE.Mesh(capGeo, new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.5 }));
    cap.position.y = 0.27;
    g.add(cap);

    const tubeGeo = new THREE.CylinderGeometry(0.008, 0.008, 0.12, 6);
    const tube = new THREE.Mesh(tubeGeo, new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.7 }));
    tube.position.y = -0.06;
    g.add(tube);

    // Крепление к стенке
    const holderGeo = new THREE.BoxGeometry(0.04, 0.04, 0.04);
    const holder = new THREE.Mesh(holderGeo, new THREE.MeshStandardMaterial({ color: 0x666666 }));
    holder.position.set(0, 0.2, -0.06);
    g.add(holder);

    g.position.set(CAGE_W / 2 - 0.1, 0.5, 0.2);
    cageGroup.add(g);
}
createWaterBottle();

// ============================================================
// ХОМЯК — МОДЕЛЬ
// ============================================================
const hamsters = [];
const HAMSTER_NAMES = ['Жорик', 'Пушок', 'Рыжик', 'Снежок', 'Уголёк'];
const HAMSTER_COLORS = [0xF4A460, 0xFFFACD, 0xD2691E, 0xF5F5F5, 0x4a4a4a];
const HAMSTER_EYE_COLORS = [0x111111, 0x111111, 0x111111, 0x222222, 0x111111];

function createHamsterModel(color, eyeColor) {
    const group = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
    const bellyMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(1.3), roughness: 0.8 });

    // Тело
    const bodyGeo = new THREE.SphereGeometry(1, 16, 12);
    bodyGeo.scale(HAMSTER_LENGTH / 2, HAMSTER_HEIGHT / 2, HAMSTER_WIDTH / 2);
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.castShadow = true;
    group.add(body);
    group.userData.body = body;

    // Живот (чуть ниже)
    const bellyGeo = new THREE.SphereGeometry(1, 12, 10);
    bellyGeo.scale(HAMSTER_LENGTH * 0.4, HAMSTER_HEIGHT * 0.35, HAMSTER_WIDTH * 0.4);
    const belly = new THREE.Mesh(bellyGeo, bellyMat);
    belly.position.y = -HAMSTER_HEIGHT * 0.15;
    group.add(belly);

    // Голова (отдельная группа для кивания)
    const headGroup = new THREE.Group();
    headGroup.position.set(HAMSTER_LENGTH * 0.38, HAMSTER_HEIGHT * 0.12, 0);
    group.add(headGroup);
    group.userData.headGroup = headGroup;

    const headGeo = new THREE.SphereGeometry(HAMSTER_HEIGHT * 0.42, 12, 10);
    const head = new THREE.Mesh(headGeo, bodyMat);
    head.castShadow = true;
    headGroup.add(head);

    // Щёки
    const cheekGeo = new THREE.SphereGeometry(HAMSTER_HEIGHT * 0.22, 8, 8);
    const cheekMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(1.15), roughness: 0.8 });
    const cheekL = new THREE.Mesh(cheekGeo, cheekMat);
    cheekL.position.set(HAMSTER_LENGTH * 0.15, -HAMSTER_HEIGHT * 0.05, HAMSTER_WIDTH * 0.25);
    headGroup.add(cheekL);
    const cheekR = new THREE.Mesh(cheekGeo, cheekMat);
    cheekR.position.set(HAMSTER_LENGTH * 0.15, -HAMSTER_HEIGHT * 0.05, -HAMSTER_WIDTH * 0.25);
    headGroup.add(cheekR);

    // Нос
    const noseGeo = new THREE.SphereGeometry(0.025, 8, 8);
    const noseMat = new THREE.MeshStandardMaterial({ color: 0xFF69B4, roughness: 0.5 });
    const nose = new THREE.Mesh(noseGeo, noseMat);
    nose.position.set(HAMSTER_LENGTH * 0.42, -HAMSTER_HEIGHT * 0.02, 0);
    headGroup.add(nose);

    // Глаза
    const eyeGeo = new THREE.SphereGeometry(0.03, 8, 8);
    const eyeMat = new THREE.MeshStandardMaterial({ color: eyeColor, roughness: 0.2 });
    const pupilGeo = new THREE.SphereGeometry(0.015, 6, 6);
    const pupilMat = new THREE.MeshStandardMaterial({ color: 0x000000 });

    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(HAMSTER_LENGTH * 0.35, HAMSTER_HEIGHT * 0.15, HAMSTER_WIDTH * 0.2);
    headGroup.add(eyeL);
    const pupilL = new THREE.Mesh(pupilGeo, pupilMat);
    pupilL.position.set(HAMSTER_LENGTH * 0.38, HAMSTER_HEIGHT * 0.15, HAMSTER_WIDTH * 0.22);
    headGroup.add(pupilL);

    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR.position.set(HAMSTER_LENGTH * 0.35, HAMSTER_HEIGHT * 0.15, -HAMSTER_WIDTH * 0.2);
    headGroup.add(eyeR);
    const pupilR = new THREE.Mesh(pupilGeo, pupilMat);
    pupilR.position.set(HAMSTER_LENGTH * 0.38, HAMSTER_HEIGHT * 0.15, -HAMSTER_WIDTH * 0.22);
    headGroup.add(pupilR);

    // Уши
    const earGeo = new THREE.SphereGeometry(0.04, 8, 8);
    earGeo.scale(1, 1.3, 0.5);
    const earMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(0.8), roughness: 0.7 });
    const earInnerMat = new THREE.MeshStandardMaterial({ color: 0xFFB6C1, roughness: 0.6 });
    const earInnerGeo = new THREE.SphereGeometry(0.025, 6, 6);
    earInnerGeo.scale(1, 1.2, 0.4);

    const earL = new THREE.Group();
    const earLMesh = new THREE.Mesh(earGeo, earMat);
    earL.add(earLMesh);
    const earLInner = new THREE.Mesh(earInnerGeo, earInnerMat);
    earLInner.position.z = 0.015;
    earL.add(earLInner);
    earL.position.set(HAMSTER_LENGTH * 0.25, HAMSTER_HEIGHT * 0.35, HAMSTER_WIDTH * 0.25);
    headGroup.add(earL);
    group.userData.earL = earL;

    const earR = new THREE.Group();
    const earRMesh = new THREE.Mesh(earGeo, earMat);
    earR.add(earRMesh);
    const earRInner = new THREE.Mesh(earInnerGeo, earInnerMat);
    earRInner.position.z = -0.015;
    earR.add(earRInner);
    earR.position.set(HAMSTER_LENGTH * 0.25, HAMSTER_HEIGHT * 0.35, -HAMSTER_WIDTH * 0.25);
    headGroup.add(earR);
    group.userData.earR = earR;

    // Лапы (4)
    const legMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(0.7), roughness: 0.7 });
    const legs = [];
    const legPositions = [
        { x: HAMSTER_LENGTH * 0.25, z: HAMSTER_WIDTH * 0.3, name: 'FL' },
        { x: HAMSTER_LENGTH * 0.25, z: -HAMSTER_WIDTH * 0.3, name: 'FR' },
        { x: -HAMSTER_LENGTH * 0.25, z: HAMSTER_WIDTH * 0.3, name: 'BL' },
        { x: -HAMSTER_LENGTH * 0.25, z: -HAMSTER_WIDTH * 0.3, name: 'BR' }
    ];

    legPositions.forEach(lp => {
        const legGroup = new THREE.Group();
        legGroup.position.set(lp.x, -HAMSTER_HEIGHT * 0.35, lp.z);

        const thighGeo = new THREE.CylinderGeometry(0.025, 0.02, 0.08, 6);
        const thigh = new THREE.Mesh(thighGeo, legMat);
        thigh.position.y = -0.04;
        legGroup.add(thigh);

        const pawGeo = new THREE.SphereGeometry(0.025, 6, 6);
        const paw = new THREE.Mesh(pawGeo, legMat);
        paw.position.y = -0.09;
        legGroup.add(paw);

        group.add(legGroup);
        legs.push(legGroup);
    });
    group.userData.legs = legs;

    // Хвост
    const tailGeo = new THREE.CylinderGeometry(0.015, 0.008, 0.06, 6);
    const tail = new THREE.Mesh(tailGeo, legMat);
    tail.position.set(-HAMSTER_LENGTH * 0.45, -HAMSTER_HEIGHT * 0.1, 0);
    tail.rotation.z = Math.PI * 0.3;
    group.add(tail);
    group.userData.tail = tail;

    return group;
}

// ============================================================
// СОЗДАНИЕ ХОМЯКОВ
// ============================================================
const FLOOR_Y = 0.12; // уровень подстилки

for (let i = 0; i < 5; i++) {
    const model = createHamsterModel(HAMSTER_COLORS[i], HAMSTER_EYE_COLORS[i]);
    const hamster = {
        index: i,
        name: HAMSTER_NAMES[i],
        color: HAMSTER_COLORS[i],
        model: model,
        position: new THREE.Vector3(
            (i - 2) * 0.5,
            FLOOR_Y + HAMSTER_HEIGHT / 2,
            (Math.random() - 0.5) * 0.8
        ),
        rotation: 0,
        targetRotation: 0,
        state: 'IDLE',
        stateTimer: Math.random() * 3 + 1,
        target: null,
        speed: 0,
        maxSpeed: 0.4 + Math.random() * 0.2,
        stepPhase: 0,
        stepLength: 0.08,
        breathPhase: Math.random() * Math.PI * 2,
        earTwitchTimer: Math.random() * 5,
        earTwitching: false,
        jumpVel: 0,
        jumping: false,
        // Колесо
        wheelEntryProgress: 0,
        wheelRunSpeed: 0,
        // Труба
        tubeProgress: 0,
        tubeDirection: 1,
        // Миска
        eatPhase: 0,
        // Путь
        distanceTraveled: 0
    };
    model.position.copy(hamster.position);
    cageGroup.add(model);
    hamsters.push(hamster);
}

// ============================================================
// ФИЗИКА И ПОВЕДЕНИЕ
// ============================================================
const TARGETS = [
    { type: 'wheel', pos: new THREE.Vector3(wheelObj.position.x, FLOOR_Y + HAMSTER_HEIGHT / 2, wheelObj.position.z), radius: WHEEL_RADIUS + 0.3 },
    { type: 'tube', pos: new THREE.Vector3(tubeObj.position.x - tubeObj.length / 2 - 0.2, FLOOR_Y + HAMSTER_HEIGHT / 2, tubeObj.position.z), radius: 0.3 },
    { type: 'bowl', pos: new THREE.Vector3(bowlObj.position.x, FLOOR_Y + HAMSTER_HEIGHT / 2, bowlObj.position.z), radius: BOWL_RADIUS + 0.2 },
    { type: 'walk', pos: null, radius: 0 }
];

function pickTarget(hamster) {
    const available = TARGETS.filter(t => {
        if (t.type === 'wheel') return wheelObj.occupant === -1;
        if (t.type === 'tube') return tubeObj.occupant === -1;
        if (t.type === 'bowl') return bowlObj.occupant === -1;
        return true;
    });
    if (available.length === 0) return { type: 'walk', pos: null };
    const t = available[Math.floor(Math.random() * available.length)];
    if (t.type === 'walk') {
        return {
            type: 'walk',
            pos: new THREE.Vector3(
                (Math.random() - 0.5) * (CAGE_W - 0.6),
                FLOOR_Y + HAMSTER_HEIGHT / 2,
                (Math.random() - 0.5) * (CAGE_D - 0.6)
            )
        };
    }
    return t;
}

function updateState(hamster, dt) {
    hamster.stateTimer -= dt;

    switch (hamster.state) {
        case 'IDLE':
            hamster.speed = 0;
            if (hamster.stateTimer <= 0) {
                const target = pickTarget(hamster);
                hamster.target = target;
                hamster.state = 'WALKING';
                hamster.stateTimer = 8;
            }
            break;

        case 'WALKING':
            if (!hamster.target) { hamster.state = 'IDLE'; hamster.stateTimer = 2; break; }
            const targetPos = hamster.target.pos;
            const dx = targetPos.x - hamster.position.x;
            const dz = targetPos.z - hamster.position.z;
            const dist = Math.sqrt(dx * dx + dz * dz);

            if (dist < 0.15) {
                // Достиг цели
                if (hamster.target.type === 'wheel') {
                    hamster.state = 'ENTERING_WHEEL';
                    hamster.wheelEntryProgress = 0;
                    wheelObj.occupant = hamster.index;
                    hamster.stateTimer = 6 + Math.random() * 4;
                } else if (hamster.target.type === 'tube') {
                    hamster.state = 'ENTERING_TUBE';
                    hamster.tubeProgress = 0;
                    hamster.tubeDirection = 1;
                    tubeObj.occupant = hamster.index;
                    hamster.stateTimer = 8;
                } else if (hamster.target.type === 'bowl') {
                    hamster.state = 'EATING';
                    bowlObj.occupant = hamster.index;
                    hamster.eatPhase = 0;
                    hamster.stateTimer = 4 + Math.random() * 3;
                } else {
                    hamster.state = 'IDLE';
                    hamster.stateTimer = 1 + Math.random() * 3;
                }
                hamster.speed = 0;
            } else {
                // Идём к цели
                const dir = Math.atan2(dz, dx);
                hamster.targetRotation = dir;
                hamster.speed = hamster.maxSpeed;
            }

            if (hamster.stateTimer <= 0) {
                hamster.state = 'IDLE';
                hamster.stateTimer = 1 + Math.random() * 2;
                hamster.speed = 0;
            }
            break;

        case 'ENTERING_WHEEL':
            hamster.wheelEntryProgress += dt * 1.5;
            if (hamster.wheelEntryProgress >= 1) {
                hamster.state = 'IN_WHEEL';
                hamster.wheelEntryProgress = 1;
            }
            hamster.speed = 0;
            break;

        case 'IN_WHEEL':
            hamster.wheelRunSpeed = 0.5 + Math.sin(hamster.stateTimer * 0.7) * 0.2;
            hamster.speed = 0; // не перемещается в мире
            if (hamster.stateTimer <= 0) {
                hamster.state = 'EXITING_WHEEL';
                hamster.wheelEntryProgress = 1;
            }
            break;

        case 'EXITING_WHEEL':
            hamster.wheelEntryProgress -= dt * 1.5;
            hamster.wheelRunSpeed = 0;
            if (hamster.wheelEntryProgress <= 0) {
                hamster.wheelEntryProgress = 0;
                wheelObj.occupant = -1;
                hamster.state = 'IDLE';
                hamster.stateTimer = 1 + Math.random() * 2;
            }
            break;

        case 'ENTERING_TUBE':
            hamster.tubeProgress += dt * 0.8;
            if (hamster.tubeProgress >= 0.1) {
                hamster.state = 'IN_TUBE';
            }
            hamster.speed = 0;
            break;

        case 'IN_TUBE':
            hamster.tubeProgress += dt * 0.6;
            hamster.speed = 0;
            if (hamster.tubeProgress >= 1.0) {
                hamster.state = 'EXITING_TUBE';
            }
            break;

        case 'EXITING_TUBE':
            hamster.tubeProgress += dt * 0.8;
            if (hamster.tubeProgress >= 1.15) {
                tubeObj.occupant = -1;
                hamster.state = 'IDLE';
                hamster.stateTimer = 1 + Math.random() * 2;
            }
            hamster.speed = 0;
            break;

        case 'EATING':
            hamster.eatPhase += dt * 4;
            hamster.speed = 0;
            if (hamster.stateTimer <= 0) {
                bowlObj.occupant = -1;
                hamster.state = 'IDLE';
                hamster.stateTimer = 1 + Math.random() * 2;
            }
            break;
    }
}

// ============================================================
// ФИЗИКА КОЛЕСА
// ============================================================
function updateWheelPhysics(dt) {
    if (wheelObj.occupant >= 0) {
        const h = hamsters[wheelObj.occupant];
        if (h.state === 'IN_WHEEL') {
            // ω = v / R — угловая скорость из скорости бега
            const v = h.wheelRunSpeed;
            wheelObj.angularVelocity = v / WHEEL_RADIUS;
        } else {
            // Входит/выходит — колесо почти не крутится
            wheelObj.angularVelocity *= 0.9;
        }
    } else {
        // Пустое колесо: трение
        if (Math.abs(wheelObj.angularVelocity) > 0.01) {
            wheelObj.angularVelocity -= WHEEL_FRICTION * dt * Math.sign(wheelObj.angularVelocity);
        } else {
            wheelObj.angularVelocity = 0;
        }
    }
    wheelObj.angle += wheelObj.angularVelocity * dt;
}

// ============================================================
// ПОЗИЦИОНИРОВАНИЕ ХОМЯКОВ
// ============================================================
function updateHamsterPositions(dt) {
    for (const h of hamsters) {
        const model = h.model;

        // Поворот
        let angleDiff = h.targetRotation - h.rotation;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        h.rotation += angleDiff * Math.min(1, dt * 5);
        model.rotation.y = -h.rotation;

        // Позиция по состоянию
        switch (h.state) {
            case 'WALKING': {
                const dx = Math.cos(h.rotation) * h.speed * dt;
                const dz = Math.sin(h.rotation) * h.speed * dt;
                h.position.x += dx;
                h.position.z += dz;
                h.distanceTraveled += Math.sqrt(dx * dx + dz * dz);
                // Фаза шага от пройденного пути
                h.stepPhase += (Math.sqrt(dx * dx + dz * dz) / h.stepLength) * Math.PI * 2;
                // Ограничение клеткой
                h.position.x = Math.max(-CAGE_W / 2 + 0.2, Math.min(CAGE_W / 2 - 0.2, h.position.x));
                h.position.z = Math.max(-CAGE_D / 2 + 0.2, Math.min(CAGE_D / 2 - 0.2, h.position.z));
                h.position.y = FLOOR_Y + HAMSTER_HEIGHT / 2;
                break;
            }

            case 'ENTERING_WHEEL': {
                const t = h.wheelEntryProgress;
                const startPos = h.target.pos.clone();
                const endPos = new THREE.Vector3(
                    wheelObj.position.x,
                    wheelObj.position.y - WHEEL_RADIUS + HAMSTER_HEIGHT / 2,
                    wheelObj.position.z
                );
                h.position.lerpVectors(startPos, endPos, t);
                h.targetRotation = Math.atan2(
                    wheelObj.position.z - h.position.z,
                    wheelObj.position.x - h.position.x
                );
                break;
            }

            case 'IN_WHEEL': {
                // Хомяк на нижней точке колеса
                h.position.set(
                    wheelObj.position.x,
                    wheelObj.position.y - WHEEL_RADIUS + HAMSTER_HEIGHT / 2,
                    wheelObj.position.z
                );
                // Фаза шага от пройденного пути (путь = R * |Δangle|)
                const dist = WHEEL_RADIUS * Math.abs(wheelObj.angularVelocity) * dt;
                h.stepPhase += (dist / h.stepLength) * Math.PI * 2;
                h.targetRotation = 0; // смотрит вперёд (вдоль X)
                break;
            }

            case 'EXITING_WHEEL': {
                const t = 1 - h.wheelEntryProgress;
                const startPos = new THREE.Vector3(
                    wheelObj.position.x,
                    wheelObj.position.y - WHEEL_RADIUS + HAMSTER_HEIGHT / 2,
                    wheelObj.position.z
                );
                const endPos = new THREE.Vector3(
                    wheelObj.position.x - WHEEL_RADIUS - 0.3,
                    FLOOR_Y + HAMSTER_HEIGHT / 2,
                    wheelObj.position.z
                );
                h.position.lerpVectors(startPos, endPos, t);
                h.targetRotation = Math.PI; // смотрит от колеса
                break;
            }

            case 'ENTERING_TUBE': {
                const t = h.tubeProgress / 0.1;
                const entryPos = new THREE.Vector3(
                    tubeObj.position.x - tubeObj.length / 2 - 0.15,
                    FLOOR_Y + HAMSTER_HEIGHT / 2,
                    tubeObj.position.z
                );
                const insidePos = new THREE.Vector3(
                    tubeObj.position.x - tubeObj.length / 2 + 0.1,
                    tubeObj.position.y - tubeObj.innerRadius + HAMSTER_CRAWL_HEIGHT / 2,
                    tubeObj.position.z
                );
                h.position.lerpVectors(entryPos, insidePos, t);
                h.targetRotation = 0; // вдоль оси трубы (+X)
                break;
            }

            case 'IN_TUBE': {
                const t = h.tubeProgress;
                const x = tubeObj.position.x - tubeObj.length / 2 + t * tubeObj.length;
                h.position.set(
                    x,
                    tubeObj.position.y - tubeObj.innerRadius + HAMSTER_CRAWL_HEIGHT / 2,
                    tubeObj.position.z
                );
                h.targetRotation = 0;
                // Фаза шага
                const dist = 0.6 * dt;
                h.stepPhase += (dist / h.stepLength) * Math.PI * 2;
                break;
            }

            case 'EXITING_TUBE': {
                const t = (h.tubeProgress - 1.0) / 0.15;
                const exitPos = new THREE.Vector3(
                    tubeObj.position.x + tubeObj.length / 2 + 0.1,
                    tubeObj.position.y - tubeObj.innerRadius + HAMSTER_CRAWL_HEIGHT / 2,
                    tubeObj.position.z
                );
                const outsidePos = new THREE.Vector3(
                    tubeObj.position.x + tubeObj.length / 2 + 0.3,
                    FLOOR_Y + HAMSTER_HEIGHT / 2,
                    tubeObj.position.z
                );
                h.position.lerpVectors(exitPos, outsidePos, t);
                h.targetRotation = 0;
                break;
            }

            case 'EATING': {
                h.position.set(
                    bowlObj.position.x,
                    FLOOR_Y + HAMSTER_HEIGHT / 2,
                    bowlObj.position.z + BOWL_RADIUS + 0.1
                );
                h.targetRotation = Math.PI; // смотрит на миску
                break;
            }

            case 'IDLE': {
                h.position.y = FLOOR_Y + HAMSTER_HEIGHT / 2;
                break;
            }
        }

        // Прыжок
        if (h.jumping) {
            h.jumpVel -= 9.8 * dt;
            h.position.y += h.jumpVel * dt;
            if (h.position.y <= FLOOR_Y + HAMSTER_HEIGHT / 2) {
                h.position.y = FLOOR_Y + HAMSTER_HEIGHT / 2;
                h.jumping = false;
                h.jumpVel = 0;
            }
        }

        model.position.copy(h.position);
    }
}

// ============================================================
// КОЛЛИЗИИ (гуляющие хомяки не проходят сквозь предметы)
// ============================================================
function resolveCollisions() {
    for (const h of hamsters) {
        if (h.state !== 'WALKING' && h.state !== 'IDLE') continue;

        // Колесо — круг в XZ
        const wdx = h.position.x - wheelObj.position.x;
        const wdz = h.position.z - wheelObj.position.z;
        const wDist = Math.sqrt(wdx * wdx + wdz * wdz);
        const minDist = WHEEL_RADIUS + HAMSTER_WIDTH / 2;
        if (wDist < minDist && wDist > 0.01) {
            const push = (minDist - wDist) / wDist;
            h.position.x += wdx * push;
            h.position.z += wdz * push;
        }

        // Миска — круг
        const bdx = h.position.x - bowlObj.position.x;
        const bdz = h.position.z - bowlObj.position.z;
        const bDist = Math.sqrt(bdx * bdx + bdz * bdz);
        const bMinDist = BOWL_RADIUS + HAMSTER_WIDTH / 2;
        if (bDist < bMinDist && bDist > 0.01) {
            const push = (bMinDist - bDist) / bDist;
            h.position.x += bdx * push;
            h.position.z += bdz * push;
        }

        // Труба — прямоугольник в XZ
        const tMinX = tubeObj.position.x - tubeObj.length / 2 - HAMSTER_WIDTH / 2;
        const tMaxX = tubeObj.position.x + tubeObj.length / 2 + HAMSTER_WIDTH / 2;
        const tMinZ = tubeObj.position.z - tubeObj.innerRadius - HAMSTER_WIDTH / 2;
        const tMaxZ = tubeObj.position.z + tubeObj.innerRadius + HAMSTER_WIDTH / 2;
        if (h.position.x > tMinX && h.position.x < tMaxX && h.position.z > tMinZ && h.position.z < tMaxZ) {
            // Выталкиваем по кратчайшей нормали
            const dLeft = h.position.x - tMinX;
            const dRight = tMaxX - h.position.x;
            const dTop = h.position.z - tMinZ;
            const dBottom = tMaxZ - h.position.z;
            const minD = Math.min(dLeft, dRight, dTop, dBottom);
            if (minD === dLeft) h.position.x = tMinX;
            else if (minD === dRight) h.position.x = tMaxX;
            else if (minD === dTop) h.position.z = tMinZ;
            else h.position.z = tMaxZ;
        }

        // Хомяк-хомяк
        for (const other of hamsters) {
            if (other.index === h.index) continue;
            if (other.state !== 'WALKING' && other.state !== 'IDLE') continue;
            const dx = h.position.x - other.position.x;
            const dz = h.position.z - other.position.z;
            const d = Math.sqrt(dx * dx + dz * dz);
            const minD = HAMSTER_WIDTH * 1.2;
            if (d < minD && d > 0.01) {
                const push = (minD - d) / d * 0.5;
                h.position.x += dx * push;
                h.position.z += dz * push;
                other.position.x -= dx * push;
                other.position.z -= dz * push;
            }
        }
    }
}

// ============================================================
// АНИМАЦИЯ ХОМЯКОВ
// ============================================================
function animateHamsters(dt, time) {
    for (const h of hamsters) {
        const model = h.model;
        const legs = model.userData.legs;
        const body = model.userData.body;
        const headGroup = model.userData.headGroup;
        const earL = model.userData.earL;
        const earR = model.userData.earR;
        const tail = model.userData.tail;

        // Дыхание (в покое)
        if (h.state === 'IDLE') {
            h.breathPhase += dt * 2.5;
            const breathScale = 1 + 0.03 * Math.sin(h.breathPhase);
            body.scale.set(1, breathScale, 1);
        } else {
            body.scale.set(1, 1, 1);
        }

        // Дёрганье ухом
        h.earTwitchTimer -= dt;
        if (h.earTwitchTimer <= 0) {
            h.earTwitching = true;
            h.earTwitchTimer = 3 + Math.random() * 5;
        }
        if (h.earTwitching) {
            const twitch = Math.sin(time * 15) * 0.15;
            earL.rotation.x = twitch;
            earR.rotation.x = -twitch * 0.7;
            if (Math.abs(twitch) < 0.01) h.earTwitching = false;
        } else {
            earL.rotation.x = 0;
            earR.rotation.x = 0;
        }

        // Лапы — диагональные пары
        const isMoving = h.state === 'WALKING' || h.state === 'IN_WHEEL' || h.state === 'IN_TUBE';
        if (isMoving) {
            // FL и BR — одна фаза, FR и BL — фаза + π
            const phase1 = h.stepPhase;
            const phase2 = h.stepPhase + Math.PI;
            legs[0].rotation.x = Math.sin(phase1) * 0.5; // FL
            legs[1].rotation.x = Math.sin(phase2) * 0.5; // FR
            legs[2].rotation.x = Math.sin(phase2) * 0.5; // BL
            legs[3].rotation.x = Math.sin(phase1) * 0.5; // BR
        } else {
            // Стоят
            legs[0].rotation.x = 0;
            legs[1].rotation.x = 0;
            legs[2].rotation.x = 0;
            legs[3].rotation.x = 0;
        }

        // Голова
        if (h.state === 'EATING') {
            headGroup.rotation.x = -0.3 + Math.sin(h.eatPhase) * 0.15;
            headGroup.position.y = HAMSTER_HEIGHT * 0.05;
        } else if (h.state === 'IN_TUBE') {
            headGroup.rotation.x = 0.1;
            headGroup.position.y = HAMSTER_HEIGHT * 0.12;
        } else {
            headGroup.rotation.x = 0;
            headGroup.position.y = HAMSTER_HEIGHT * 0.12;
        }

        // Хвост
        tail.rotation.z = Math.PI * 0.3 + Math.sin(time * 2 + h.index) * 0.1;

        // В колесе — тело наклонено (бежит)
        if (h.state === 'IN_WHEEL') {
            model.rotation.x = -0.1;
        } else {
            model.rotation.x = 0;
        }
    }
}

// ============================================================
// ОТЛАДОЧНАЯ ПАНЕЛЬ
// ============================================================
function updateDebugPanel() {
    const wheelInfo = document.getElementById('wheel-info');
    let html = '';

    if (wheelObj.occupant >= 0) {
        const h = hamsters[wheelObj.occupant];
        const footSpeed = h.wheelRunSpeed;
        const wheelLinearSpeed = Math.abs(wheelObj.angularVelocity) * WHEEL_RADIUS;
        const discrepancy = footSpeed > 0.001 ? Math.abs(footSpeed - wheelLinearSpeed) / footSpeed * 100 : 0;

        html += `Хомяк: <b>${h.name}</b><br>`;
        html += `Скорость лап (v): <b>${footSpeed.toFixed(4)}</b> м/с<br>`;
        html += `|ω|·R: <b>${wheelLinearSpeed.toFixed(4)}</b> м/с<br>`;
        html += `ω: <b>${wheelObj.angularVelocity.toFixed(4)}</b> рад/с<br>`;
        html += `R: <b>${WHEEL_RADIUS.toFixed(3)}</b> м<br>`;
        html += `Расхождение: <b>${discrepancy.toFixed(2)}%</b><br>`;
        html += `Угол колеса: <b>${wheelObj.angle.toFixed(2)}</b> рад<br>`;
        html += `<br>Габарит хомяка: ${HAMSTER_HEIGHT.toFixed(2)} м<br>`;
        html += `Радиус колеса: ${WHEEL_RADIUS.toFixed(2)} м<br>`;
        html += `Запас: ${(WHEEL_RADIUS - HAMSTER_HEIGHT).toFixed(2)} м ✓`;
    } else {
        html += `Колесо свободно<br>`;
        html += `ω: <b>${wheelObj.angularVelocity.toFixed(4)}</b> рад/с<br>`;
        html += `|ω|·R: <b>${(Math.abs(wheelObj.angularVelocity) * WHEEL_RADIUS).toFixed(4)}</b> м/с<br>`;
        html += `Затухание: ${wheelObj.angularVelocity < 0.01 ? '✓ (≈0)' : 'идёт...'}`;
    }

    // Труба
    if (tubeObj.occupant >= 0) {
        const h = hamsters[tubeObj.occupant];
        const axisDeviation = Math.abs(h.position.z - tubeObj.position.z);
        html += `<br><br>📐 ТРУБА: ${h.name}<br>`;
        html += `Отклонение от оси: <b>${axisDeviation.toFixed(4)}</b> м<br>`;
        html += `Прогресс: <b>${h.tubeProgress.toFixed(2)}</b>`;
    }

    wheelInfo.innerHTML = html;
}

function updateStatusPanel() {
    const panel = document.getElementById('hamster-statuses');
    let html = '';
    const stateNames = {
        'IDLE': '🧍 стоит',
        'WALKING': '🚶 идёт',
        'ENTERING_WHEEL': '➡️ входит в колесо',
        'IN_WHEEL': '🏃 бежит в колесе',
        'EXITING_WHEEL': '⬅️ выходит из колеса',
        'ENTERING_TUBE': '➡️ входит в трубу',
        'IN_TUBE': '🐛 ползёт по трубе',
        'EXITING_TUBE': '⬅️ выходит из трубы',
        'EATING': '🌾 грызёт зёрна'
    };
    for (const h of hamsters) {
        const colorHex = '#' + new THREE.Color(h.color).getHexString();
        html += `<div class="hamster-status" style="color:${colorHex}">`;
        html += `<b>${h.name}</b>: ${stateNames[h.state] || h.state}`;
        html += `</div>`;
    }
    panel.innerHTML = html;
}

// ============================================================
// КЛИК ПО ХОМЯКУ
// ============================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    for (const h of hamsters) {
        const intersects = raycaster.intersectObjects(h.model.children, true);
        if (intersects.length > 0) {
            if (!h.jumping) {
                h.jumping = true;
                h.jumpVel = 2.5;
            }
            break;
        }
    }
});

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
let lastTime = performance.now();
let frameCount = 0;

function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    dt = Math.min(dt, 0.05); // ограничение дельты

    const time = now / 1000;

    // Обновление состояний
    for (const h of hamsters) {
        updateState(h, dt);
    }

    // Физика колеса
    updateWheelPhysics(dt);

    // Позиции
    updateHamsterPositions(dt);

    // Коллизии
    resolveCollisions();

    // Анимация
    animateHamsters(dt, time);

    // Визуальное вращение колеса
    wheelObj.group.rotation.z = wheelObj.angle;

    // UI (каждые 10 кадров)
    frameCount++;
    if (frameCount % 10 === 0) {
        updateDebugPanel();
        updateStatusPanel();
    }

    controls.update();
    renderer.render(scene, camera);
}

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// ЗАПУСК
// ============================================================
animate();
</script>
</body>
</html>
