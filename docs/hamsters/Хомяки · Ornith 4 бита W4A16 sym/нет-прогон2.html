<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐹 Low-Poly Hamster Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffe9d6; font-family: 'Comic Sans MS', 'Segoe UI', system-ui, sans-serif; }
  #app { width: 100%; height: 100%; display: block; }
  #title {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: clamp(20px, 4.4vw, 34px); font-weight: bold; color: #6b4423;
    text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,.12); pointer-events: none;
    white-space: nowrap; z-index: 10; letter-spacing: .5px;
  }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: clamp(11px, 2.2vw, 15px); color: #7a5c3e; background: rgba(255,255,255,.72);
    padding: 7px 16px; border-radius: 20px; pointer-events: none; z-index: 10;
    backdrop-filter: blur(3px); white-space: nowrap;
  }
  #info {
    position: fixed; top: 14px; right: 16px; z-index: 10;
    font-size: clamp(11px, 2vw, 14px); color: #6b4423; background: rgba(255,255,255,.8);
    padding: 8px 13px; border-radius: 14px; text-align: right; line-height: 1.5;
    box-shadow: 0 3px 12px rgba(0,0,0,.1); max-width: 190px;
  }
  #info b { color: #d4508a; }
</style>
</head>
<body>
<div id="app"></div>
<div id="title">🐹 Low-Poly Hamster Playground 🐹</div>
<div id="info"></div>
<div id="hint">🖱️ Drag to rotate · Scroll to zoom · Watch the hamsters!</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   SCENE / CAMERA / RENDERER
   ============================================================ */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe9d6);
scene.fog = new THREE.Fog(0xffe9d6, 20, 42);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 100);
camera.position.set(11, 9.5, 13);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(0, 1.3, 0);
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

/* ============================================================
   LIGHTS
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xfff6e0, 0xd0a070, 0.75));
scene.add(new THREE.AmbientLight(0xffffff, 0.22));

const sun = new THREE.DirectionalLight(0xfff0d8, 1.35);
sun.position.set(8, 15, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 45;
sun.shadow.camera.left = -16; sun.shadow.camera.right = 16;
sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16;
sun.shadow.bias = -0.0006;
sun.shadow.radius = 4;
scene.add(sun);

const warm = new THREE.PointLight(0xffa060, 0.4, 30);
warm.position.set(-5, 6, -4);
scene.add(warm);

/* ============================================================
   MATERIAL HELPERS
   ============================================================ */
const mat = (color, opts = {}) => new THREE.MeshStandardMaterial({
  color, flatShading: true, roughness: opts.rough ?? 0.85, metalness: opts.metal ?? 0.0, ...opts
});
const M = (geo, color, opts) => { const m = new THREE.Mesh(geo, mat(color, opts)); return m; };

/* ============================================================
   CAGE DIMENSIONS
   ============================================================ */
const CW = 14, CD = 10, CH = 5.2, WALL = 0.18;
const HALF = CW / 2;

/* ============================================================
   FLOOR TRAY (wooden base + bedding)
   ============================================================ */
const tray = new THREE.Group();

const woodBase = M(new THREE.BoxGeometry(CW + 0.8, 0.5, CD + 0.8), 0xc08a4a);
woodBase.position.y = 0.25;
woodBase.receiveShadow = true;
tray.add(woodBase);

const bedding = M(new THREE.BoxGeometry(CW - 0.4, 0.32, CD - 0.4), 0xf2d9a8);
bedding.position.y = 0.54;
bedding.receiveShadow = true;
tray.add(bedding);

// scattered bedding tufts
for (let i = 0; i < 40; i++) {
  const t = M(new THREE.ConeGeometry(0.10 + Math.random() * 0.09, 0.14 + Math.random() * 0.12, 4),
    Math.random() > 0.5 ? 0xf5e1b8 : 0xedcf96);
  t.position.set((Math.random() - 0.5) * (CW - 1.2), 0.72, (Math.random() - 0.5) * (CD - 1.2));
  t.rotation.y = Math.random() * Math.PI;
  tray.add(t);
}
scene.add(tray);

/* ============================================================
   WIRED CAGE WALLS
   ============================================================ */
const cage = new THREE.Group();
const barMat = mat(0xcfd6db, { rough: 0.35, metal: 0.65 });
const frameMat = mat(0xb8c0c8, { rough: 0.3, metal: 0.5 });

// vertical bars for each wall
function makeWallBars(nx, nz, dirX, dirZ, isEnd) {
  const g = new THREE.Group();
  const span = dirX ? CW : CD;
  const count = Math.floor(span / 0.55);
  for (let i = 0; i <= count; i++) {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, CH, 6), barMat);
    const along = -span / 2 + i * (span / count);
    b.position.set(
      nx + dirX * along,
      CH / 2 + 0.28,
      nz + dirZ * along
    );
    b.castShadow = true;
    g.add(b);
  }
  // horizontal rails
  for (const ry of [0.28, CH / 2 + 0.28, CH - 0.2]) {
    const rail = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.055, span + 0.3, 6), barMat);
    rail.rotation.z = Math.PI / 2;
    rail.rotation.y = dirX ? 0 : Math.PI / 2;
    rail.position.set(nx + dirX * (span / 2) * 0, ry, nz);
    if (dirX) rail.position.set(nx, ry, nz + dirZ * (span / 2));
    else rail.position.set(nx + dirX * (span / 2), ry, nz + dirZ * (span / 2));
    g.add(rail);
  }
  if (!isEnd) {
    // corner posts
    for (const [cx, cz] of [[0, -span/2], [0, span/2]]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, CH + 0.5, 6), frameMat);
      post.position.set(nx + (dirX ? cx : 0), CH/2 + 0.28, nz + (dirZ ? cz : 0));
      g.add(post);
    }
  }
  return g;
}

// Front & back walls (run along X)
cage.add(makeWallBars(0,  CD/2, 1, 0, false));
cage.add(makeWallBars(0, -CD/2, 1, 0, false));
// Left & right walls (run along Z)
cage.add(makeWallBars(-HALF, 0, 0, 1, false));
cage.add(makeWallBars( HALF, 0, 0, 1, false));

// frame posts at 4 corners (thicker)
const cornerGeo = new THREE.CylinderGeometry(0.11, 0.11, CH + 0.5, 7);
for (const [fx, fz] of [[-HALF,-CD/2],[HALF,-CD/2],[-HALF,CD/2],[HALF,CD/2]]) {
  const p = new THREE.Mesh(cornerGeo, frameMat);
  p.position.set(fx, CH/2 + 0.28, fz);
  p.castShadow = true;
  cage.add(p);
}
scene.add(cage);

/* ============================================================
   WHEEL (interactive) — at back-right
   ============================================================ */
const wheelGroup = new THREE.Group();
const WHEEL_R = 1.5, THICK = 0.55;
const wheelMat = mat(0xff6b6b, { rough: 0.5, metal: 0.15 });
const hubMat = mat(0xffd93d, { rough: 0.4, metal: 0.25 });

const rimMat1 = mat(0xff8fab, { rough: 0.5, metal: 0.1 });
// rear rim
const rearRim = M(new THREE.TorusGeometry(WHEEL_R, 0.13, 8, 26), wheelMat);
rearRim.position.z = -THICK / 2;
wheelGroup.add(rearRim);
// front rim
const frontRim = M(new THREE.TorusGeometry(WHEEL_R, 0.13, 8, 26), wheelMat);
frontRim.position.z = THICK / 2;
wheelGroup.add(frontRim);
// hub discs
for (const z of [-THICK/2, THICK/2]) {
  const h = M(new THREE.CylinderGeometry(WHEEL_R*0.32, WHEEL_R*0.32, 0.06, 14), hubMat);
  h.rotation.x = Math.PI/2; h.position.z = z; wheelGroup.add(h);
}
// rungs
const rungCount = 16;
for (let i = 0; i < rungCount; i++) {
  const a = (i / rungCount) * Math.PI * 2;
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, THICK, 6), hubMat);
  r.rotation.x = Math.PI/2;
  r.position.set(Math.cos(a) * WHEEL_R * 0.82, Math.sin(a) * WHEEL_R * 0.82, 0);
  wheelGroup.add(r);
}
// stand
const standMat = mat(0xb0bec5, { rough: 0.35, metal: 0.4 });
for (const sx of [-0.55, 0.55]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, WHEEL_R + 0.6, 0.12), standMat);
  leg.position.set(sx, -WHEEL_R/2 - 0.15, 0);
  wheelGroup.add(leg);
  const foot = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.08, 0.4), standMat);
  foot.position.set(sx, -WHEEL_R - 0.02, 0);
  wheelGroup.add(foot);
}
wheelGroup.position.set(HALF - 2.4, WHEEL_R + 0.75, -CD/2 + 2);
scene.add(wheelGroup);

/* ============================================================
   FOOD BOWL (interactive) — front-left
   ============================================================ */
const foodBowl = new THREE.Group();
const bowlMat = mat(0x4ecdc4, { rough: 0.4, metal: 0.1 });
const bowl = M(new THREE.CylinderGeometry(0.85, 0.55, 0.5, 14), bowlMat);
bowl.position.y = 0.28;
foodBowl.add(bowl);
const inner = M(new THREE.CylinderGeometry(0.62, 0.42, 0.34, 14), mat(0x3aa39b, {rough:0.6}));
inner.position.y = 0.38;
foodBowl.add(inner);
// food pellets
const pelletCols = [0xd4a373, 0xcc7f4f, 0xe0a866, 0x8B5E3C];
for (let i = 0; i < 14; i++) {
  const p = M(new THREE.IcosahedronGeometry(0.11 + Math.random()*0.05, 0),
    pelletCols[i % pelletCols.length]);
  const ang = Math.random() * Math.PI * 2, rr = Math.random() * 0.4;
  p.position.set(Math.cos(ang)*rr, 0.48 + Math.random()*0.12, Math.sin(ang)*rr);
  p.rotation.set(Math.random(), Math.random(), Math.random());
  foodBowl.add(p);
}
foodBowl.position.set(-HALF + 2.2, 0.6, CD/2 - 2);
scene.add(foodBowl);

/* ============================================================
   TUNNEL (interactive) — center-ish
   ============================================================ */
const tunnel = new THREE.Group();
const tunnelMat = mat(0xa06cd5, { rough: 0.7, metal: 0.0 });
const tube = M(new THREE.CylinderGeometry(0.95, 0.95, 4.2, 14, 1, true), tunnelMat);
tube.rotation.z = Math.PI/2;
tunnel.add(tube);
// ring accents
for (let i = -1; i <= 1; i++) {
  const ring = M(new THREE.TorusGeometry(0.95, 0.07, 8, 18), mat(0x8b5cf6, {rough:0.5}));
  ring.rotation.y = Math.PI/2;
  ring.position.x = i * 1.4;
  tunnel.add(ring);
}
// little feet
for (const fx of [-1.8, 1.8]) {
  const f = M(new THREE.BoxGeometry(0.14, 0.5, 0.14), mat(0x8b5cf6));
  f.position.set(fx, -0.85, 0); tunnel.add(f);
}
tunnel.position.set(0.5, 1.45, -0.5);
scene.add(tunnel);

/* ============================================================
   DECORATIONS: water bottle + little house + chew toy + plants
   ============================================================ */
// Water bottle on left wall
const bottle = new THREE.Group();
const bBody = M(new THREE.CylinderGeometry(0.3, 0.3, 1.4, 12), mat(0x90e0ef, {rough:0.2, metal:0.1, transparent:true, opacity:0.8}));
bBody.position.y = 0.7;
bottle.add(bBody);
const bCap = M(new THREE.CylinderGeometry(0.32, 0.32, 0.2, 12), mat(0x48cae4));
bCap.position.y = 1.5;
bottle.add(bCap);
const spout = M(new THREE.CylinderGeometry(0.06, 0.09, 0.5, 8), mat(0xd0d8dd,{metal:0.6,rough:0.3}));
spout.position.y = -0.15;
bottle.add(spout);
bottle.position.set(-HALF + 0.05, 3.0, 1.5);
scene.add(bottle);

// Little house / hidey-hole in back-left corner
const house = new THREE.Group();
const wallCol = 0xffb46b;
const houseMat = mat(wallCol, {rough:0.8});
const hw = 2.0, hh = 1.5, hd = 1.8;
const hFront = M(new THREE.BoxGeometry(hw, hh, 0.15), houseMat); hFront.position.set(0, hh/2, hd/2); house.add(hFront);
const hBack = M(new THREE.BoxGeometry(hw, hh, 0.15), houseMat); hBack.position.set(0, hh/2, -hd/2); house.add(hBack);
const hLeft = M(new THREE.BoxGeometry(0.15, hh, hd), houseMat); hLeft.position.set(-hw/2, hh/2, 0); house.add(hLeft);
const hRight = M(new THREE.BoxGeometry(0.15, hh, hd), houseMat); hRight.position.set(hw/2, hh/2, 0); house.add(hRight);
// door hole (dark)
const door = M(new THREE.CircleGeometry(0.5, 12), mat(0x5a3a22, {rough:1}));
door.position.set(0, 0.55, hd/2 + 0.08); house.add(door);
// roof
const roofMat = mat(0xe07a5f, {rough:0.7});
const roof = M(new THREE.CylinderGeometry(1.55, 1.65, 0.5, 4), roofMat);
roof.position.y = hh + 0.25; roof.rotation.y = Math.PI/4; house.add(roof);
house.position.set(-HALF + 2.2, 0.7, -CD/2 + 2.2);
scene.add(house);

// Chew toy (colored rings) near house
const toy = new THREE.Group();
const toyCols = [0xff595e, 0xffca34, 0x8ac926, 0x1982c4];
for (let i = 0; i < 4; i++) {
  const r = M(new THREE.TorusGeometry(0.28 + i*0.03, 0.06, 6, 12), mat(toyCols[i], {rough:0.6}));
  r.position.y = 0.12 + i * 0.13;
  r.rotation.set(i*0.5, i*0.8, 0);
  toy.add(r);
}
toy.position.set(-HALF + 4.6, 0.62, -CD/2 + 4.2);
scene.add(toy);

// Little low-poly plants
function makePlant(x, z, col) {
  const g = new THREE.Group();
  const pot = M(new THREE.CylinderGeometry(0.32, 0.24, 0.4, 8), mat(0xdda15e,{rough:0.7}));
  pot.position.y = 0.2; g.add(pot);
  for (let i = 0; i < 5; i++) {
    const leaf = M(new THREE.ConeGeometry(0.1, 0.7 + Math.random()*0.4, 4), mat(col,{rough:0.8}));
    const a = Math.random()*Math.PI*2;
    leaf.position.set((Math.random()-0.5)*0.2, 0.6 + Math.random()*0.2, (Math.random()-0.5)*0.2);
    leaf.rotation.z = (Math.random()-0.5)*0.5;
    leaf.rotation.x = (Math.random()-0.5)*0.5;
    g.add(leaf);
  }
  g.position.set(x, 0.62, z);
  return g;
}
scene.add(makePlant(HALF - 1.6, CD/2 - 1.6, 0x6ab04c));
scene.add(makePlant(HALF - 2.2, -CD/2 + 1.6, 0x90be6d));

// A couple of bones/treats on the floor
function makeTreat(x, z, col) {
  const t = M(new THREE.BoxGeometry(0.45, 0.13, 0.13), mat(col,{rough:0.7}));
  const g = new THREE.Group();
  const l1 = M(new THREE.SphereGeometry(0.09, 6, 6), mat(col,{rough:0.7})); l1.position.x = 0.24; g.add(l1);
  const l2 = M(new THREE.SphereGeometry(0.09, 6, 6), mat(col,{rough:0.7})); l2.position.x = -0.24; g.add(l2);
  t.position.y = 0.07; g.add(t);
  g.position.set(x, 0.62, z); g.rotation.y = Math.random()*Math.PI;
  return g;
}
scene.add(makeTreat(3, 2.5, 0xf4a261));
scene.add(makeTreat(-3, -2, 0xe9c46a));

/* ============================================================
   HAMSTER FACTORY
   ============================================================ */
const hamsters = [];
const hamColors = [
  { body: 0xffb703, belly: 0xfff3c7, name: 'Butterscotch' },
  { body: 0xf4a261, belly: 0xfff0d0, name: 'Pumpkin' },
  { body: 0xff8fab, belly: 0xffe0ec, name: 'Cotton Candy' },
  { body: 0xb5e48c, belly: 0xeaffd8, name: 'Sprout' },
  { body: 0xa0c4ff, belly: 0xdaf0ff, name: 'Sky' },
];

function buildHamster(cfg) {
  const group = new THREE.Group();
  const skin = mat(cfg.body, { rough: 0.88 });
  const bellyMat = mat(cfg.belly, { rough: 0.9 });
  const darkMat = mat(0x2b2220, { rough: 0.5 });
  const pinkMat = mat(0xff9aa2, { rough: 0.7 });

  // Body (squashed sphere)
  const body = M(new THREE.SphereGeometry(0.72, 12, 10), skin);
  body.scale.set(1, 0.92, 1.22);
  body.position.y = 0.62;
  body.castShadow = true; body.receiveShadow = true;
  group.add(body);

  // Belly
  const belly = M(new THREE.SphereGeometry(0.6, 10, 8), bellyMat);
  belly.scale.set(0.9, 0.75, 1.05);
  belly.position.set(0, 0.46, 0.16);
  group.add(belly);

  // Head
  const head = M(new THREE.SphereGeometry(0.5, 12, 10), skin);
  head.position.set(0, 0.78, 0.62);
  head.castShadow = true;
  group.add(head);

  // Cheeks
  for (const s of [-1, 1]) {
    const cheek = M(new THREE.SphereGeometry(0.26, 8, 8), skin);
    cheek.position.set(s * 0.32, 0.66, 0.55);
    group.add(cheek);
  }

  // Ears
  for (const s of [-1, 1]) {
    const ear = M(new THREE.CircleGeometry(0.17, 12), pinkMat);
    ear.position.set(s * 0.26, 1.16, 0.62);
    ear.rotation.x = -0.15;
    group.add(ear);
    const earInner = M(new THREE.CircleGeometry(0.1, 12), mat(0xffd6de, {rough:0.7}));
    earInner.position.set(s * 0.26, 1.16, 0.63);
    group.add(earInner);
  }

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.1, 10, 8);
  const eyeWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (const s of [-1, 1]) {
    const w = new THREE.Mesh(eyeGeo, eyeWhite);
    w.position.set(s * 0.2, 0.86, 0.98);
    group.add(w);
    const pupil = M(eyeGeo, darkMat);
    pupil.position.set(s * 0.2, 0.86, 1.03);
    pupil.scale.set(0.7, 0.75, 0.6);
    group.add(pupil);
    // glint
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6), new THREE.MeshBasicMaterial({color:0xffffff}));
    glint.position.set(s * 0.2 + 0.03, 0.89, 1.07);
    group.add(glint);
  }

  // Nose
  const nose = M(new THREE.SphereGeometry(0.06, 8, 6), pinkMat);
  nose.position.set(0, 0.76, 1.08);
  group.add(nose);

  // Feet (little pink pads)
  const footGeo = new THREE.SphereGeometry(0.13, 8, 6);
  const feetPos = [
    [-0.32, 0.16, 0.42], [0.32, 0.16, 0.42],
    [-0.34, 0.16, -0.34], [0.34, 0.16, -0.34]
  ];
  const feet = [];
  for (const [fx, fy, fz] of feetPos) {
    const f = M(footGeo, pinkMat);
    f.position.set(fx, fy, fz);
    f.scale.set(0.9, 0.6, 1.2);
    group.add(f);
    feet.push(f);
  }

  // Tail
  const tail = M(new THREE.SphereGeometry(0.1, 6, 6), pinkMat);
  tail.position.set(0, 0.5, -0.85);
  group.add(tail);

  group.userData = {
    body, head, feet,
    // per-hamster randomized behavior params
    state: 'idle',
    timer: Math.random() * 3,
    speed: 1.4 + Math.random() * 0.9,
    turnSpeed: 1.5 + Math.random(),
    nextDecision: 0,
    walkPhase: Math.random() * 10,
    homeX: 0, homeZ: 0,
    wanderTarget: null,
    size: 1,
    name: cfg.name,
  };

  group.scale.setScalar(cfg.size || 1);
  return group;
}

// spawn positions spread around the cage
const spawns = [
  { x: 0, z: 0, s: 1 },
  { x: 3, z: 1.5, s: 0.92 },
  { x: -3, z: -1.5, s: 1.05 },
  { x: 1.5, z: -3, s: 0.88 },
  { x: -2, z: 2.8, s: 0.96 },
];

for (let i = 0; i < 5; i++) {
  const c = hamColors[i % hamColors.length];
  const h = buildHamster(c);
  const sp = spawns[i];
  h.position.set(sp.x, 0.62, sp.z);
  scene.add(h);
  const d = h.userData;
  d.homeX = sp.x; d.homeZ = sp.z;
  hamsters.push(h);
}

/* ============================================================
   INTERACTION STATE
   ============================================================ */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredObj = null;
let hoveredName = '';

function pickAt(px, py) {
  mouse.x = (px / innerWidth) * 2 - 1;
  mouse.y = -(py / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const objs = [wheelGroup, foodBowl, tunnel];
  const hits = raycaster.intersectObjects(objs, true);
  if (hits.length) {
    let o = hits[0].object;
    while (o.parent && o.parent !== scene) o = o.parent;
    return o;
  }
  return null;
}

// highlight helper
let highlightMeshes = [];
function clearHighlight() {
  highlightMeshes.forEach(m => { if (m.parent) m.parent.remove(m); });
  highlightMeshes = [];
}
function doHighlight(obj) {
  clearHighlight();
  const emissive = new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: 0xffff88, emissiveIntensity: 0.5,
    transparent: true, opacity: 0.28, depthWrite: false
  });
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const m = new THREE.Mesh(new THREE.BoxGeometry(size.x*1.06, size.y*1.08, size.z*1.06), emissive);
  m.position.copy(center);
  scene.add(m);
  highlightMeshes.push(m);
}

renderer.domElement.addEventListener('pointermove', e => {
  const obj = pickAt(e.clientX, e.clientY);
  if (obj !== hoveredObj) {
    clearHighlight();
    hoveredObj = obj;
    hoveredName = '';
    if (obj === wheelGroup) { hoveredName = '🎡 Wheel'; }
    else if (obj === foodBowl) { hoveredName = '🥣 Food Bowl'; }
    else if (obj === tunnel) { hoveredName = '🟪 Tunnel'; }
    if (hoveredObj) doHighlight(hoveredObj);
    renderer.domElement.style.cursor = hoveredName ? 'pointer' : 'grab';
  }
});
renderer.domElement.addEventListener('pointerleave', () => {
  clearHighlight(); hoveredObj = null; hoveredName = '';
  renderer.domElement.style.cursor = 'grab';
});

// Click → command nearby hamster
let clickCooldown = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  const obj = pickAt(e.clientX, e.clientY);
  if (!obj) return;
  if (Date.now() < clickCooldown) return;
  clickCooldown = Date.now() + 400;
  const names = { wheelGroup:'wheel', foodBowl:'food', tunnel:'tunnel' };
  const target = names[obj.name];
  let closest = null, bestDist = 6;
  for (const h of hamsters) {
    const d = h.position.distanceTo(obj.position);
    if (d < bestDist) { bestDist = d; closest = h; }
  }
  if (closest) assignGoal(closest, target);
});

/* ============================================================
   HAMSTER BEHAVIOR
   ============================================================ */
const BOUND = HALF - 1.2, BOUNDZ = CD/2 - 1.2;

function randWander() {
  return new THREE.Vector2(
    (Math.random() - 0.5) * CW * 0.8,
    (Math.random() - 0.5) * CD * 0.8
  );
}

function assignGoal(h, target) {
  const d = h.userData;
  const pos = h.position;
  if (target === 'wheel') {
    const wp = wheelGroup.position;
    d.goal = new THREE.Vector3(wp.x + (Math.random()-0.5)*0.6, 0, wp.z + (Math.random()-0.5)*0.6);
    d.targetType = 'wheel';
    d.state = 'toPoint';
  } else if (target === 'food') {
    const fp = foodBowl.position;
    d.goal = new THREE.Vector3(fp.x + (Math.random()-0.5)*0.4, 0, fp.z - 0.9 - Math.random()*0.3);
    d.targetType = 'food';
    d.state = 'toPoint';
  } else if (target === 'tunnel') {
    const tp = tunnel.position;
    d.goal = new THREE.Vector3(tp.x + (Math.random()>0.5?2.2:-2.2), 0, tp.z);
    d.targetType = 'tunnel';
    d.state = 'toPoint';
  }
  d.timer = 0;
  d.nextDecision = 0;
}

function updateHamster(h, dt) {
  const d = h.userData;
  const pos = h.position;
  d.timer -= dt;
  d.nextDecision -= dt;

  // current velocity direction based on facing
  const facing = new THREE.Vector2(Math.sin(d.facing || 0), Math.cos(d.facing || 0));

  switch (d.state) {
    case 'idle': {
      if (d.timer <= 0) {
        d.state = 'wander';
        d.wanderTarget = randWander();
        d.timer = 1.5 + Math.random() * 3;
      }
      break;
    }
    case 'wander': {
      const tx = d.homeX + d.wanderTarget.x;
      const tz = d.homeZ + d.wanderTarget.y;
      moveTowards(h, tx, tz, d.speed * 0.7, dt);
      if (pos.distanceTo(new THREE.Vector3(tx, pos.y, tz)) < 0.5 || d.timer <= 0) {
        d.state = 'idle';
        d.timer = 1 + Math.random() * 3;
      }
      break;
    }
    case 'toPoint': {
      moveTowards(h, d.goal.x, d.goal.z, d.speed, dt);
      const arrived = pos.distanceTo(d.goal) < 0.5;
      if (arrived) {
        d.timer = 0;
        if (d.targetType === 'wheel') { d.state = 'wheelie'; }
        else if (d.targetType === 'food') { d.state = 'eating'; }
        else if (d.targetType === 'tunnel') { d.state = 'tunnelling'; }
      }
      break;
    }
    case 'wheelie': {
      // hop onto wheel and spin
      d.wheelSpin = (d.wheelSpin || 0) + dt * 7;
      wheelGroup.rotation.x = d.wheelSpin;
      // keep hamster on the rung at bottom
      const a = d.wheelSpin;
      h.position.set(wheelGroup.position.x, wheelGroup.position.y - 0.05,
                    wheelGroup.position.z + Math.sin(a) * 0.4);
      h.rotation.y = Math.PI; // face outward
      d.walkPhase += dt * 10;
      animateWalk(d, dt, 1.2);
      if (d.timer <= 0) {
        d.state = 'idle';
        d.timer = 1.5 + Math.random() * 2;
        h.position.y = 0.62;
      }
      break;
    }
    case 'eating': {
      d.nod = (d.nod || 0) + dt * 5;
      d.head.tilt.z = Math.sin(d.nod) * 0.18;
      d.head.position.y = 0.78 + Math.sin(d.nod*1.3) * 0.04;
      d.walkPhase += dt * 4;
      animateWalk(d, dt, 0.4);
      if (d.timer <= 0) {
        d.state = 'idle';
        d.timer = 1 + Math.random() * 2;
        d.head.tilt.z = 0; d.head.position.y = 0.78;
      }
      break;
    }
    case 'tunnelling': {
      // wiggle in place
      d.wiggle = (d.wiggle || 0) + dt * 8;
      h.rotation.y += Math.sin(d.wiggle) * 0.02;
      d.head.position.z = 0.62 + Math.sin(d.wiggle) * 0.12;
      d.walkPhase += dt * 9;
      animateWalk(d, dt, 1.0);
      if (d.timer <= 0) {
        d.state = 'idle';
        d.timer = 1 + Math.random() * 2;
        d.head.position.z = 0.62;
      }
      break;
    }
  }
}

function moveTowards(h, tx, tz, speed, dt) {
  const d = h.userData;
  const dx = tx - h.position.x;
  const dz = tz - h.position.z;
  const dist = Math.hypot(dx, dz);
  if (dist > 0.01) {
    const targetFacing = Math.atan2(dx, dz);
    // smooth turn
    let diff = targetFacing - (d.facing || 0);
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const maxTurn = d.turnSpeed * dt;
    d.facing = d.facing + Math.max(-maxTurn, Math.min(maxTurn, diff));
    const step = Math.min(speed * dt, dist);
    h.position.x += Math.sin(d.facing) * step;
    h.position.z += Math.cos(d.facing) * step;
    d.walkPhase += dt * speed * 6;
    animateWalk(d, dt, speed);
  }
  // clamp to cage bounds
  h.position.x = THREE.MathUtils.clamp(h.position.x, -BOUND, BOUND);
  h.position.z = THREE.MathUtils.clamp(h.position.z, -BOUNDZ, BOUNDZ);
}

function animateWalk(d, dt, amp) {
  const ph = d.walkPhase;
  const f = d.feet;
  f[0].position.y = 0.16 + Math.sin(ph) * 0.09 * amp;
  f[1].position.y = 0.16 + Math.sin(ph + Math.PI) * 0.09 * amp;
  f[2].position.y = 0.16 + Math.sin(ph + Math.PI) * 0.09 * amp;
  f[3].position.y = 0.16 + Math.sin(ph) * 0.09 * amp;
  // gentle body bob
  if (d.body) d.body.position.y = 0.62 + Math.abs(Math.sin(ph)) * 0.03 * amp;
}

// idle breathing / look-around for idle hamsters
function updateIdleLook(h, dt) {
  const d = h.userData;
  if (d.state === 'idle' && d.head) {
    d.head.rotation.y = Math.sin(Date.now() * 0.0008 + d.homeX) * 0.3;
  }
}

/* ============================================================
   INFO PANEL
   ============================================================ */
const infoEl = document.getElementById('info');
function renderInfo() {
  const lines = hamsters.map(h => {
    let act = '';
    switch (h.userData.state) {
      case 'idle': act = '😴 resting';
      case 'wander': act = '🚶 exploring';
      case 'toPoint': act = '🎯 heading somewhere';
      case 'wheelie': act = '🎡 spinning!';
      case 'eating': act = '🍽️ munching';
      case 'tunnelling': act = '🕳️ burrowing';
    }
    return `<b>${h.userData.name}</b><br>${act}`;
  }).join('<br><br>');
  infoEl.innerHTML = '<b>Hamsters</b><br><br>' + lines;
}
renderInfo();
let infoTimer = 0;

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // subtle wheel idle sway
  if (hamsters.every(h => h.userData.state !== 'wheelie')) {
    wheelGroup.rotation.x *= 0.98;
  }

  for (const h of hamsters) {
    updateHamster(h, dt);
    updateIdleLook(h, dt);
  }

  // gentle plant sway
  scene.traverse(o => {
    if (o.isMesh && o.material && o.material.color && o.geometry?.type === 'ConeGeometry'
        && o.material.color.getHex() !== 0xf2d9a8) {
      // skip — too broad; skip plant logic to avoid surprises
    }
  });

  // pulse highlight
  if (highlightMeshes.length) {
    const p = 0.18 + Math.sin(t * 6) * 0.12;
    highlightMeshes.forEach(m => m.material.opacity = p);
  }

  // update info every ~0.5s
  infoTimer += dt;
  if (infoTimer > 0.5) { infoTimer = 0; renderInfo(); }

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================================================
   RESIZE
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
