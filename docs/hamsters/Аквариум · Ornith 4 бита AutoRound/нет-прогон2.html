<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐠 3D Аквариум</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#041224}
canvas{display:block}
.glass{background:rgba(12,30,56,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.13);border-radius:16px;color:#eaf2ff;box-shadow:0 8px 32px rgba(0,0,0,.4)}
#info{position:fixed;top:18px;left:18px;padding:18px 20px;max-width:290px;z-index:10}
#info h1{font-size:20px;margin-bottom:10px;background:linear-gradient(90deg,#4dd0e1,#64ffda,#a0e8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800;line-height:1.25}
#info .sub{font-size:11.5px;color:rgba(180,215,255,.7);margin-bottom:11px;line-height:1.6}
#info .ins{font-size:11px;color:rgba(190,220,255,.6);line-height:1.85}
#info .ins b{color:#a0e8ff}
#stats{position:fixed;top:18px;right:18px;padding:16px 20px;z-index:10;min-width:178px}
#stats h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(160,200,255,.65);margin-bottom:11px}
.sr{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}
.sv{font-weight:700;color:#64ffda}
.btns{margin-top:14px;display:flex;flex-direction:column;gap:8px}
button{padding:9px 14px;border:none;border-radius:10px;background:linear-gradient(135deg,#1e5fa5,#2d8fd4);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:.25s;box-shadow:0 4px 14px rgba(30,95,165,.35);font-family:inherit}
button:hover{transform:translateY(-2px);box-shadow:0 7px 22px rgba(45,143,212,.55);filter:brightness(1.12)}
button:active{transform:translateY(0)}
button.on{background:linear-gradient(135deg,#1b7f5c,#2ec08a)}
.hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:9px 22px;font-size:12.5px;color:rgba(200,225,255,.8);z-index:10;text-align:center;animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
@media(max-width:640px){#info{max-width:210px;padding:13px 15px}#info h1{font-size:17px}}
</style>
</head>
<body>

<div id="info" class="glass">
  <h1>🐠 3D Аквариум</h1>
  <div class="sub">Интерактивный подводный мир с реалиичными рыбками</div>
  <div class="ins">
    🖱️ <b>ЛКМ</b> — вращение камеры<br>
    🖱️ <b>ПКМ</b> — перемещение<br>
    🖱️ <b>Колесо</b> — зум<br>
    🖱️ <b>Клик по воде</b> — накормить рыбок
  </div>
</div>

<div id="stats" class="glass">
  <h2>Статистика</h2>
  <div class="sr"><span>🐟 Рыбки</span><span class="sv" id="fc">0</span></div>
  <div class="sr"><span>🫧 Пузыри</span><span class="sv" id="bc">0</span></div>
  <div class="sr"><span>🍽️ Корм</span><span class="sv" id="fpc">0</span></div>
  <div class="sr"><span>📊 FPS</span><span class="sv" id="fps">0</span></div>
  <div class="btns">
    <button id="bfish">🐟 Добавить рыбку</button>
    <button id="bbubble">🫧 Больше пузырей</button>
    <button id="blight" class="on">💡 Свет: ВКЛ</button>
  </div>
</div>

<div class="hint" id="hint">🍽️ Кликните по аквариуму, чтобы накормить рыбок!</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';

/* ============================ SCENE ============================ */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a3a5c, 0.013);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 6, 46);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI/1.8;
controls.target.set(0, 3, 0);

/* ===================== GRADIENT BACKGROUND ===================== */
(function(){
  const c = document.createElement('canvas'); c.width=c.height=512;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#0d4f7a');
  g.addColorStop(0.45,'#0a3a5c');
  g.addColorStop(1,'#041224');
  x.fillStyle=g; x.fillRect(0,0,512,512);
  const t = new THREE.CanvasTexture(c);
  scene.background = t;
})();

/* ====================== LIGHTING ====================== */
const ambient = new THREE.AmbientLight(0x404040, 0.4);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(12, 30, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 90;
const s = 34;
sun.shadow.camera.left=-s; sun.shadow.camera.right=s;
sun.shadow.camera.top=s; sun.shadow.camera.bottom=-s;
sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(sun.target);

const pl1 = new THREE.PointLight(0x3399ff, 0.7, 80); pl1.position.set(-12, 10, 10); scene.add(pl1);
const pl2 = new THREE.PointLight(0x2266cc, 0.5, 80); pl2.position.set(12, -2, -10); scene.add(pl2);

/* ===================== TANK ===================== */
const TW=36, TH=24, TD=20;
const tank = new THREE.Group(); scene.add(tank);

const glassMat = new THREE.MeshPhysicalMaterial({
  color:0xbfe4ff, transparent:true, opacity:0.09, transmission:0.95,
  roughness:0.05, metalness:0, thickness:1.2, side:THREE.DoubleSide,
  clearcoat:1, clearcoatRoughness:0.05
});
const glass = new THREE.Mesh(new THREE.BoxGeometry(TW,TH,TD), glassMat);
tank.add(glass);

const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(TW,TH,TD)),
  new THREE.LineBasicMaterial({color:0x9ad4ff, transparent:true, opacity:0.5})
);
tank.add(edges);

// subtle inner glow shell
const glowMat = new THREE.MeshBasicMaterial({color:0x1a5a7a, transparent:true, opacity:0.06, side:THREE.BackSide});
tank.add(new THREE.Mesh(new THREE.BoxGeometry(TW-0.4,TH-0.4,TD-0.4), glowMat));

/* ===================== SAND FLOOR ===================== */
(function(){
  const geo = new THREE.PlaneGeometry(TW-0.5, TD-0.5, 46, 26);
  geo.rotateX(-Math.PI/2);
  const p = geo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), z=p.getZ(i);
    p.setY(i, Math.sin(x*0.5)*0.18 + Math.cos(z*0.6)*0.22 + Math.sin(x*1.3+z*0.9)*0.1);
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0xc2a668, roughness:1}));
  m.position.y = -TH/2+0.05;
  m.receiveShadow = true;
  tank.add(m);
})();

/* ===================== ROCKS ===================== */
(function(){
  const rv=[0x6b6b6b,0x7d7166,0x5c5c5c,0x8a7d6e,0x6f6f6f,0x78685a,0x636363,0x7a6a5c];
  for(let i=0;i<8;i++){
    const d=new THREE.DecahedronGeometry(1.1+Math.random()*1.4);
    const pos=d.attributes.position;
    for(let j=0;j<pos.count;j++){
      const f=0.72+Math.random()*0.5;
      pos.setXYZ(j, pos.getX(j)*f, pos.getY(j)*f*0.72, pos.getZ(j)*f);
    }
    d.computeVertexNormals();
    const r=new THREE.Mesh(d, new THREE.MeshStandardMaterial({color:rv[i%rv.length], roughness:0.95, flatShading:true}));
    r.position.set((Math.random()-0.5)*(TW-7), -TH/2+0.6, (Math.random()-0.5)*(TD-7));
    r.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
    r.castShadow=true; r.receiveShadow=true;
    tank.add(r);
  }
})();

/* ===================== SEAWEED ===================== */
let seaweed=[];
(function(){
  const gc=[0x1b7a3a,0x2e8b4a,0x17723a,0x3aa05a,0x258a45];
  for(let k=0;k<12;k++){
    const grp=new THREE.Group();
    const bx=(Math.random()-0.5)*(TW-7), bz=(Math.random()-0.5)*(TD-7);
    const segs=5+Math.floor(Math.random()*4);
    const h=3+Math.random()*4;
    const nm=8;
    for(let s=0;s<3+Math.floor(Math.random()*2);s++){
      const pts=[];
      const off=(s-1)*0.5;
      for(let i=0;i<=segs;i++){
        const t=i/segs;
        pts.push(new THREE.Vector3(off+Math.sin(t*2.2+s)*1.1*t*h*0.08, t*h, (s-1)*0.45+Math.cos(t*1.8)*0.4));
      }
      const curve=new THREE.CatmullRomCurve3(pts);
      const tube=new THREE.Mesh(
        new THREE.TubeGeometry(curve, nm, 0.16+Math.random()*0.12, 6, false),
        new THREE.MeshStandardMaterial({color:gc[k%gc.length], roughness:0.7, side:THREE.DoubleSide})
      );
      tube.castShadow=true;
      grp.add(tube);
    }
    grp.position.set(bx, -TH/2+0.3, bz);
    grp.userData.swayPhase=Math.random()*Math.PI*2;
    grp.userData.swaySpeed=0.6+Math.random()*0.6;
    seaweed.push(grp);
    tank.add(grp);
  }
})();

/* ===================== BUBBLES ===================== */
let bubbles=[];
function makeBubble(){
  const r=0.12+Math.random()*0.32;
  const m=new THREE.Mesh(
    new THREE.SphereGeometry(r,12,12),
    new THREE.MeshPhysicalMaterial({color:0xdff4ff,transparent:true,opacity:0.18,transmission:0.9,roughness:0.05,metalness:0,thickness:0.4,shininess:200})
  );
  m.position.set((Math.random()-0.5)*(TW-3), -TH/2+r+Math.random()*3, (Math.random()-0.5)*(TD-3));
  m.userData={vy:1.2+Math.random()*1.8, ph:Math.random()*Math.PI*2, ax:Math.random()*Math.PI*2, ar:0.4+Math.random()*0.9};
  tank.add(m); bubbles.push(m);
}
for(let i=0;i<30;i++) makeBubble();

/* ===================== FOOD ===================== */
let food=[];
const foodGeo=new THREE.SphereGeometry(0.28,8,8);
const foodMat=new THREE.MeshStandardMaterial({color:0xc8803a, roughness:0.6});
function dropFood(pos){
  const m=new THREE.Mesh(foodGeo, foodMat.clone());
  m.position.copy(pos);
  m.castShadow=true;
  m.userData={vy:0, life:0};
  tank.add(m); food.push(m);
}

/* ===================== FISH ===================== */
let fish=[];
const COLUMNS=['#ff8c1a','#1a7bff','#ffd700','#c0203a','#9b30ff','#3ac05a','#ff69b4','#daa520'];

function makeFish(){
  const g=new THREE.Group();
  const col=COLUMNS[Math.floor(Math.random()*COLUMNS.length)];
  const mat=new THREE.MeshStandardMaterial({color:col, roughness:0.35, metalness:0.08, flatShading:false});
  const dk=col.replace(/^#/,'');
  const matDk=new THREE.MeshStandardMaterial({color:'#'+dk, roughness:0.5, metalness:0.1});
  const scale=(0.6+Math.random()*0.6);

  // body
  const body=new THREE.Mesh(new THREE.SphereGeometry(1,20,16), mat);
  body.scale.set(1.5,0.82,0.72); body.castShadow=true; g.add(body);

  // belly lighter
  const belly=new THREE.Mesh(new THREE.SphereGeometry(0.9,16,12),
    new THREE.MeshStandardMaterial({color:new THREE.Color(col).lerp(new THREE.Color('#ffffff'),0.55), roughness:0.5}));
  belly.scale.set(1.25,0.6,0.6); belly.position.set(0.15,-0.28,0); g.add(belly);

  // head
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.55,16,12), mat);
  head.scale.set(1,0.9,0.9); head.position.set(1.15,0.05,0); head.castShadow=true; g.add(head);

  // eye sockets
  const eyeM=new THREE.MeshStandardMaterial({color:0xf4f8ff, roughness:0.2});
  const pupilM=new THREE.MeshStandardMaterial({color:0x0a0a12, roughness:0.4});
  [-1,1].forEach(s=>{
    const ew=new THREE.Mesh(new THREE.SphereGeometry(0.14,12,10), eyeM);
    ew.position.set(1.42,0.18,s*0.3); g.add(ew);
    const pw=new THREE.Mesh(new THREE.SphereGeometry(0.08,10,8), pupilM);
    pw.position.set(1.52,0.18,s*0.3); g.add(pw);
  });

  // tail
  const tg=new THREE.Shape();
  tg.moveTo(0,0); tg.lineTo(-0.7,0.55); tg.lineTo(-0.55,0); tg.lineTo(-0.7,-0.55); tg.closePath();
  const tail=new THREE.Mesh(new THREE.ShapeGeometry(tg),
    new THREE.MeshStandardMaterial({color:col, transparent:true, opacity:0.85, roughness:0.5, side:THREE.DoubleSide}));
  tail.scale.setScalar(0.9); tail.position.set(-1.45,0,0);
  g.add(tail);

  // dorsal fin
  const dg=new THREE.Shape();
  dg.moveTo(0,0); dg.quadraticCurveTo(0.2,0.55,-0.35,0.5); dg.lineTo(-0.45,0); dg.closePath();
  const dfin=new THREE.Mesh(new THREE.ShapeGeometry(dg), matDk);
  dfin.scale.set(0.75,0.9,0.12); dfin.position.set(-0.1,0.6,0); g.add(dfin);

  // side fins
  const lg=new THREE.Shape(); lg.moveTo(0,0); lg.quadraticCurveTo(0.4,-0.15,0.1,-0.55); lg.lineTo(-0.25,-0.15); lg.closePath();
  const lf=new THREE.Mesh(new THREE.ShapeGeometry(lg), new THREE.MeshStandardMaterial({color:col, transparent:true, opacity:0.7, roughness:0.5, side:THREE.DoubleSide}));
  lf.scale.set(0.8,0.8,0.1); lf.position.set(-0.15,-0.35,0.55); lf.rotation.z=-0.3; g.add(lf);
  const rf=lf.clone(); rf.position.z=-0.55; rf.rotation.y=Math.PI; g.add(rf);

  g.scale.setScalar(scale);
  g.userData={
    tail, leftFin:lf, rightFin:rf,
    velocity:new THREE.Vector3((Math.random()-0.5)*4,0,(Math.random()-0.5)*4),
    speed:2.2+Math.random()*2.2,
    tailSpeed:4+Math.random()*5,
    phase:Math.random()*Math.PI*2,
    targetFood:null, avoidanceRadius:2.8+Math.random()*2.2,
    baseScale:scale
  };
  return g;
}

function addFish(){
  const f=makeFish();
  f.position.set((Math.random()-0.5)*(TW-8), (Math.random()-0.5)*(TH-8), (Math.random()-0.5)*(TD-8));
  scene.add(f); fish.push(f);
}
for(let i=0;i<15;i++) addFish();

/* ===================== INTERACTION ===================== */
const raycaster=new THREE.Raycaster();
const ndc=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
let hintShown=true;

renderer.domElement.addEventListener('click', e=>{
  if(e.button!==0) return;
  ndc.x=(e.clientX/innerWidth)*2-1;
  ndc.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(ndc, camera);
  const hit=raycaster.intersectObject(glass,false);
  let pt;
  if(hit.length){ pt=hit[0].point; }
  else { const tp=new THREE.Vector3(); if(!raycaster.ray.intersectPlane(groundPlane,tp)) return; pt=tp; }
  pt.x=THREE.MathUtils.clamp(pt.x,-TW/2+1,TW/2-1);
  pt.y=THREE.MathUtils.clamp(pt.y,-TH/2+1,TH/2-1);
  pt.z=THREE.MathUtils.clamp(pt.z,-TD/2+1,TD/2-1);
  dropFood(pt);
  if(hintShown){document.getElementById('hint').style.display='none'; hintShown=false;}
});

/* ===================== BUTTONS ===================== */
document.getElementById('bfish').onclick=()=>{for(let i=0;i<3;i++)addFish();};
document.getElementById('bbubble').onclick=()=>{for(let i=0;i<10;i++)makeBubble();};
let lightOn=true;
document.getElementById('blight').onclick=function(){
  lightOn=!lightOn;
  sun.visible=lightOn;
  this.textContent='💡 Свет: '+(lightOn?'ВКЛ':'ВЫКЛ');
  this.classList.toggle('on',lightOn);
};

/* ===================== ANIMATION ===================== */
const clock=new THREE.Clock();
let fc=0, afps=0, lastFps=0;
const boxMin=new THREE.Vector3(-TW/2+1.2,-TH/2+1.2,-TD/2+1.2);
const boxMax=new THREE.Vector3(TW/2-1.2,TH/2-1.2,TD/2-1.2);

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  // ---- fish ----
  for(const f of fish){
    const u=f.userData, vel=u.velocity;
    // wander
    vel.x+= (Math.sin(t*0.3*u.phase+1)*0.06);
    vel.z+= (Math.cos(t*0.25*u.phase+2)*0.06);

    // seek food
    let nearest=null, nDist=15;
    for(const fd of food){
      const d=f.distanceTo(fd);
      if(d<nDist){nDist=d;nearest=fd;}
    }
    if(nearest){
      const dir=new THREE.Vector3().subVectors(nearest,f).normalize();
      vel.addScaledVector(dir, 0.12);
      u.targetFood=nearest;
    } else u.targetFood=null;

    // separation
    for(const o of fish){
      if(o===f) continue;
      const d=f.distanceTo(o);
      if(d<u.avoidanceRadius && d>0.001){
        const out=new THREE.Vector3().subVectors(f,o).normalize().divScalar(d);
        vel.addScaledVector(out, u.avoidanceRadius*0.02);
      }
    }

    // clamp speed
    const sp=vel.length();
    const mx=u.speed*1.6;
    if(sp>mx) vel.multiplyScalar(mx/sp);
    if(sp<0.6) vel.multiplyScalar(0.6/Math.max(sp,0.001));

    // move
    f.position.addScaledVector(vel, dt);

    // wall bounce
    ['x','y','z'].forEach(ax=>{
      if(f.position[ax]<boxMin[ax]){f.position[ax]=boxMin[ax]; vel[ax]=Math.abs(vel[ax])*0.8;}
      if(f.position[ax]>boxMax[ax]){f.position[ax]=boxMax[ax]; vel[ax]=-Math.abs(vel[ax])*0.8;}
    });

    // face direction
    if(sp>0.05){
      const ahead=new THREE.Vector3().copy(f.position).addScaledVector(vel,1);
      f.lookAt(ahead);
    }

    // tail wiggle
    u.tail.rotation.z=Math.sin(t*u.tailSpeed+u.phase)*0.45;
    // fins
    u.leftFin.rotation.z=-0.3+Math.sin(t*3.5+u.phase)*0.35;
    u.rightFin.rotation.z=0.3-Math.sin(t*3.5+u.phase)*0.35;
    u.leftFin.rotation.x=Math.sin(t*2+u.phase)*0.3;
    u.rightFin.rotation.x=-Math.sin(t*2+u.phase)*0.3;
  }

  // ---- food physics ----
  for(let i=food.length-1;i>=0;i--){
    const fd=food[i];
    fd.vy-=12*dt;
    fd.position.y+=fd.vy*dt;
    fd.userData.life+=dt;
    const floorY=-TH/2+0.4;
    if(fd.position.y<=floorY||fd.userData.life>25){
      tank.remove(fd); food.splice(i,1);
    }
  }

  // ---- fish eat ----
  for(const f of fish){
    for(let i=food.length-1;i>=0;i--){
      if(f.distanceTo(food[i])<1.1){
        const sc=f.userData.baseScale*(1.05);
        f.userData.baseScale=sc; f.scale.setScalar(sc);
        tank.remove(food[i]); food.splice(i,1);
      }
    }
  }

  // ---- bubbles ----
  for(const b of bubbles){
    b.position.y+=b.userData.vy*dt;
    b.position.x+=Math.sin(t*0.8+b.userData.ax)*b.userData.ar*dt;
    if(b.position.y>TH/2-0.5){
      b.position.y=-TH/2+0.3+Math.random()*3;
      b.position.x=(Math.random()-0.5)*(TW-3);
    }
  }

  // ---- seaweed sway ----
  for(const s of seaweed){
    const sw=Math.sin(t*s.userData.swaySpeed+s.userData.swayPhase)*0.12;
    s.rotation.x=sw; s.rotation.z=sw*0.7;
  }

  controls.update();
  renderer.render(scene,camera);

  // ---- stats ----
  fc++; afps+=1000/(clock.elapsedTime*1000-lastFps);
}
// simpler fps
let frames=0, acc=0, lastT=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  const dt=(now-lastT)/1000; lastT=now; frames++; acc+=dt;
  if(acc>=0.5){
    document.getElementById('fps').textContent=Math.round(frames/acc);
    document.getElementById('fc').textContent=fish.length;
    document.getElementById('bc').textContent=bubbles.length;
    document.getElementById('fpc').textContent=food.length;
    frames=0; acc=0;
  }
  const d=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;

  for(const f of fish){
    const u=f.userData, vel=u.velocity;
    vel.x+=(Math.sin(t*0.3*u.phase+1)*0.06);
    vel.z+=(Math.cos(t*0.25*u.phase+2)*0.06);
    let nearest=null, nDist=15;
    for(const fd of food){const d=f.distanceTo(fd); if(d<nDist){nDist=d;nearest=fd;}}
    if(nearest){const dir=new THREE.Vector3().subVectors(nearest,f).normalize(); vel.addScaledVector(dir,0.12); u.targetFood=nearest;} else u.targetFood=null;
    for(const o of fish){if(o===f)continue; const d=f.distanceTo(o); if(d<u.avoidanceRadius&&d>0.001){const out=new THREE.Vector3().subVectors(f,o).normalize().divScalar(d); vel.addScaledVector(out,u.avoidanceRadius*0.02);}}
    const sp=vel.length(), mx=u.speed*1.6; if(sp>mx) vel.multiplyScalar(mx/sp); if(sp<0.6) vel.multiplyScalar(0.6/Math.max(sp,0.001));
    f.position.addScaledVector(vel,d);
    ['x','y','z'].forEach(ax=>{ if(f.position[ax]<boxMin[ax]){f.position[ax]=boxMin[ax]; vel[ax]=Math.abs(vel[ax])*0.8;} if(f.position[ax]>boxMax[ax]){f.position[ax]=boxMax[ax]; vel[ax]=-Math.abs(vel[ax])*0.8;} });
    if(sp>0.05){const ahead=new THREE.Vector3().copy(f.position).addScaledVector(vel,1); f.lookAt(ahead);}
    u.tail.rotation.z=Math.sin(t*u.tailSpeed+u.phase)*0.45;
    u.leftFin.rotation.z=-0.3+Math.sin(t*3.5+u.phase)*0.35;
    u.rightFin.rotation.z=0.3-Math.sin(t*3.5+u.phase)*0.35;
    u.leftFin.rotation.x=Math.sin(t*2+u.phase)*0.3;
    u.rightFin.rotation.x=-Math.sin(t*2+u.phase)*0.3;
  }
  for(let i=food.length-1;i>=0;i--){const fd=food[i]; fd.vy-=12*d; fd.position.y+=fd.vy*d; fd.userData.life+=d; if(fd.position.y<=-TH/2+0.4||fd.userData.life>25){tank.remove(food[i]); food.splice(i,1);}}
  for(const f of fish){for(let i=food.length-1;i>=0;i--){if(f.distanceTo(food[i])<1.1){const sc=f.userData.baseScale*1.05; f.userData.baseScale=sc; f.scale.setScalar(sc); tank.remove(food[i]); food.splice(i,1);}}}
  for(const b of bubbles){b.position.y+=b.userData.vy*d; b.position.x+=Math.sin(t*0.8+b.userData.ax)*b.userData.ar*d; if(b.position.y>TH/2-0.5){b.position.y=-TH/2+0.3+Math.random()*3; b.position.x=(Math.random()-0.5)*(TW-3);}}
  for(const s of seaweed){const sw=Math.sin(t*s.userData.swaySpeed+s.userData.swayPhase)*0.12; s.rotation.x=sw; s.rotation.z=sw*0.7;}

  controls.update();
  renderer.render(scene,camera);
}
loop();

/* ===================== RESIZE ===================== */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

})();
</script>
