<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #ffe9f0; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; left: 16px; z-index: 10;
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    color: #7a4b2a; pointer-events: none;
    text-shadow: 0 2px 0 rgba(255,255,255,.7);
  }
  #hud h1 { margin: 0; font-size: 22px; }
  #hud p  { margin: 4px 0 0; font-size: 13px; opacity: .85; }
</style>
</head>
<body>
<div id="hud">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &nbsp;•&nbsp; Scroll / pinch to zoom</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   LOW-POLY HAMSTER PLAYGROUND
   One file. No build step. Just open and enjoy.
   ============================================================ */

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe3ee);
scene.fog = new THREE.Fog(0xffe3ee, 30, 70);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);

// ---------- Simple custom orbit camera ----------
const cam = { theta: 0.6, phi: 1.05, radius: 17, target: new THREE.Vector3(0, 1.5, 0) };
function updateCamera() {
  cam.phi = Math.max(0.25, Math.min(1.45, cam.phi));
  cam.radius = Math.max(8, Math.min(35, cam.radius));
  camera.position.set(
    cam.target.x + cam.radius * Math.sin(cam.phi) * Math.sin(cam.theta),
    cam.target.y + cam.radius * Math.cos(cam.phi),
    cam.target.z + cam.radius * Math.sin(cam.phi) * Math.cos(cam.theta)
  );
  camera.lookAt(cam.target);
}
updateCamera();

let dragging = false, px = 0, py = 0;
addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener('pointerup',   () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  cam.theta -= (e.clientX - px) * 0.008;
  cam.phi   -= (e.clientY - py) * 0.008;
  px = e.clientX; py = e.clientY;
  updateCamera();
});
addEventListener('wheel', e => { cam.radius += e.deltaY * 0.01; updateCamera(); }, { passive: true });
// pinch zoom
let pinchDist = 0;
addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    if (pinchDist) { cam.radius += (pinchDist - d) * 0.03; updateCamera(); }
    pinchDist = d;
  }
}, { passive: true });
addEventListener('touchend', () => pinchDist = 0);

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xfff3e0, 0xc9a86a, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14;   sun.shadow.camera.bottom = -14;
scene.add(sun);

// ---------- Materials helper (flat-shaded low-poly look) ----------
const mat = (color, extra = {}) =>
  new THREE.MeshStandardMaterial(Object.assign({ color, flatShading: true, roughness: 0.9 }, extra));

// ---------- Cage: tray, floor sand, bars ----------
const CAGE_R = 8;

const tray = new THREE.Mesh(new THREE.CylinderGeometry(CAGE_R + 0.6, CAGE_R + 0.3, 1.2, 10), mat(0x4fa3d1));
tray.position.y = -0.6;
tray.receiveShadow = true; tray.castShadow = true;
scene.add(tray);

const sand = new THREE.Mesh(new THREE.CylinderGeometry(CAGE_R, CAGE_R, 0.3, 12), mat(0xf2d78c));
sand.position.y = 0.15;
sand.receiveShadow = true;
scene.add(sand);

// cage bars
const barMat = mat(0xf7f7fa, { roughness: 0.4, metalness: 0.3 });
const cageGroup = new THREE.Group();
for (let i = 0; i < 26; i++) {
  const a = (i / 26) * Math.PI * 2;
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 6, 5), barMat);
  bar.position.set(Math.cos(a) * CAGE_R, 3.2, Math.sin(a) * CAGE_R);
  bar.castShadow = true;
  cageGroup.add(bar);
}
// top + bottom rings
for (const y of [0.5, 6.2]) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(CAGE_R, 0.16, 6, 40), barMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = y;
  ring.castShadow = true;
  cageGroup.add(ring);
}
scene.add(cageGroup);

// ---------- Hamster wheel (interactive object) ----------
const wheelGroup = new THREE.Group();      // whole wheel assembly
const wheelSpin = new THREE.Group();       // rotating disc part
wheelGroup.position.set(0, 2.2, -CAGE_R + 1.1);
scene.add(wheelGroup);

const wheelMat = mat(0xff7b54);
const rim = new THREE.Mesh(new THREE.TorusGeometry(1.9, 0.22, 5, 16), wheelMat);
wheelSpin.add(rim);
const rim2 = new THREE.Mesh(new THREE.TorusGeometry(1.9, 0.22, 5, 16), wheelMat);
rim2.position.z = 0.9; wheelSpin.add(rim2);
// spokes + rungs
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.12, 3.6, 0.12), mat(0xffa26b));
  spoke.position.z = 0.45;
  spoke.rotation.z = a;
  wheelSpin.add(spoke);
  const rung = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.9, 4), mat(0xfff0d9));
  rung.rotation.x = Math.PI / 2;
  rung.position.set(Math.cos(a) * 1.7, Math.sin(a) * 1.7, 0.45);
  wheelSpin.add(rung);
}
wheelGroup.add(wheelSpin);
// stand
for (const sx of [-0.7, 0.7]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.6, 0.2), mat(0x8a6f4d));
  leg.position.set(sx, -1.1, 0.45);
  leg.rotation.z = sx > 0 ? -0.15 : 0.15;
  wheelGroup.add(leg);
}
wheelGroup.traverse(o => { if (o.isMesh) o.castShadow = true; });

const WHEEL_STAND_POS = new THREE.Vector3(0, 0.35, -CAGE_R + 1.55); // where a hamster stands to run

// ---------- Food bowl ----------
const bowlGroup = new THREE.Group();
bowlGroup.position.set(3.5, 0.3, 3.2);
const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.6, 0.55, 8, 1, true), mat(0x66c66e));
bowl.material.side = THREE.DoubleSide;
bowl.position.y = 0.28;
bowlGroup.add(bowl);
const kibble = new THREE.Group();
for (let i = 0; i < 6; i++) {
  const k = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16, 0), mat(0xb5651d));
  const a = (i / 6) * Math.PI * 2;
  k.position.set(Math.cos(a) * 0.35, 0.42, Math.sin(a) * 0.35);
  kibble.add(k);
}
bowlGroup.add(kibble);
bowlGroup.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(bowlGroup);
const BOWL_POS = bowlGroup.position.clone();

// ---------- Tunnel ----------
const tunnel = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 3.4, 8, 1, true), mat(0xb084f5));
tunnel.material.side = THREE.DoubleSide;
tunnel.rotation.z = Math.PI / 2;
tunnel.rotation.y = 0.6;
tunnel.position.set(-3.6, 1.0, 2.6);
tunnel.castShadow = true;
scene.add(tunnel);

// ---------- Scatter toys / pebbles ----------
for (let i = 0; i < 14; i++) {
  const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 5;
  const pebble = new THREE.Mesh(new THREE.DodecahedronGeometry(0.18 + Math.random() * 0.15, 0),
    mat([0xf9d5e5, 0xa8d8b9, 0xaa96da, 0xf6e26b][i % 4]));
  pebble.position.set(Math.cos(a) * r, 0.35, Math.sin(a) * r);
  pebble.rotation.set(Math.random(), Math.random(), Math.random());
  pebble.castShadow = true;
  scene.add(pebble);
}

// ---------- Hamster builder ----------
function makeHamster(color) {
  const g = new THREE.Group();
  const bodyMat = mat(color);
  const creamMat = mat(0xfff4e0);

  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.62, 1), bodyMat);
  body.scale.set(1.25, 0.95, 1);
  body.position.y = 0.62;
  g.add(body);

  const belly = new THREE.Mesh(new THREE.IcosahedronGeometry(0.45, 1), creamMat);
  belly.scale.set(1.1, 0.8, 0.9);
  belly.position.set(0.25, 0.5, 0);
  g.add(belly);

  const head = new THREE.Group();
  head.position.set(0.75, 0.95, 0);
  const skull = new THREE.Mesh(new THREE.IcosahedronGeometry(0.4, 1), bodyMat);
  head.add(skull);
  const cheekL = new THREE.Mesh(new THREE.IcosahedronGeometry(0.17, 0), creamMat);
  cheekL.position.set(0.22, -0.05, 0.24); head.add(cheekL);
  const cheekR = cheekL.clone(); cheekR.position.z = -0.24; head.add(cheekR);
  const nose = new THREE.Mesh(new THREE.IcosahedronGeometry(0.08, 0), mat(0xff8fa3));
  nose.position.set(0.4, 0, 0); head.add(nose);
  const eyeGeo = new THREE.SphereGeometry(0.06, 6, 6);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(0.3, 0.12, 0.2); head.add(eyeL);
  const eyeR = eyeL.clone(); eyeR.position.z = -0.2; head.add(eyeR);
  const earGeo = new THREE.ConeGeometry(0.13, 0.2, 5);
  const earMat = mat(0xffb3c1);
  const earL = new THREE.Mesh(earGeo, earMat); earL.position.set(-0.05, 0.38, 0.22); head.add(earL);
  const earR = earL.clone(); earR.position.z = -0.22; head.add(earR);
  g.add(head);

  // nub tail
  const tail = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1, 0), creamMat);
  tail.position.set(-0.78, 0.65, 0); g.add(tail);

  // legs (4)
  const legs = [];
  const legGeo = new THREE.CylinderGeometry(0.09, 0.07, 0.3, 5);
  for (const [x, z] of [[0.4, 0.35], [0.4, -0.35], [-0.4, 0.35], [-0.4, -0.35]]) {
    const leg = new THREE.Mesh(legGeo, bodyMat);
    leg.position.set(x, 0.22, z);
    g.add(leg); legs.push(leg);
  }

  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.userData = { body, head, legs, tail, earL, earR };
  return g;
}

// ---------- Hamster AI ----------
const STATES = { WANDER: 0, IDLE: 1, TO_WHEEL: 2, RUN_WHEEL: 3, TO_BOWL: 4, EAT: 5 };
const hamsters = [];
const colors = [0xf4a259, 0xd9d4c7, 0x8d6e63, 0xf8c8dc];

colors.forEach((c, i) => {
  const h = makeHamster(c);
  const a = (i / colors.length) * Math.PI * 2;
  h.position.set(Math.cos(a) * 4, 0, Math.sin(a) * 4);
  scene.add(h);
  hamsters.push({
    mesh: h,
    state: STATES.IDLE,
    timer: Math.random() * 2,
    target: new THREE.Vector3(),
    speed: 1.2 + Math.random() * 0.8,
    phase: Math.random() * 10,
    wheelSpeed: 0,
    facing: Math.random() * Math.PI * 2
  });
});

function pickWanderTarget(h) {
  const a = Math.random() * Math.PI * 2, r = 1.5 + Math.random() * 5;
  h.target.set(Math.cos(a) * r, 0, Math.sin(a) * r);
}

function setState(h, s, t) { h.state = s; h.timer = t; }

function chooseNextAction(h) {
  const roll = Math.random();
  if (roll < 0.18)      { setState(h, STATES.TO_WHEEL, 8); }
  else if (roll < 0.36) { setState(h, STATES.TO_BOWL, 8); }
  else if (roll < 0.62) { setState(h, STATES.WANDER, 3 + Math.random() * 3); pickWanderTarget(h); }
  else                  { setState(h, STATES.IDLE, 1 + Math.random() * 2.5); }
}

function steerTo(h, dest, dt) {
  const m = h.mesh;
  const dir = new THREE.Vector3(dest.x - m.position.x, 0, dest.z - m.position.z);
  const dist = dir.length();
  if (dist < 0.05) return 0;
  const want = Math.atan2(dir.x, dir.z);   // model faces +X, so adjust below
  let diff = want - (m.rotation.y + Math.PI / 2);
  while (diff >  Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  m.rotation.y += THREE.MathUtils.clamp(diff, -6 * dt, 6 * dt);
  m.position.x += Math.sin(m.rotation.y + Math.PI / 2) * -h.speed * dt * (dir.x / dist > 0 ? 1 : 1);
  // simpler: move directly toward target once roughly facing
  if (Math.abs(diff) < 0.6) {
    m.position.x += (dir.x / dist) * h.speed * dt;
    m.position.z += (dir.z / dist) * h.speed * dt;
  }
  return dist;
}

let wheelAngularVel = 0;

function updateHamster(h, dt, time) {
  const m = h.mesh, u = m.userData;
  h.timer -= dt;

  switch (h.state) {
    case STATES.IDLE: {
      // wiggle ears & look around
      u.earL.rotation.z = Math.sin(time * 6 + h.phase) * 0.3;
      u.earR.rotation.z = Math.sin(time * 6 + h.phase + 1) * 0.3;
      u.head.rotation.y = Math.sin(time * 1.5 + h.phase) * 0.4;
      u.body.scale.y = 1 + Math.sin(time * 4 + h.phase) * 0.03; // breathing
      if (h.timer <= 0) chooseNextAction(h);
      break;
    }
    case STATES.WANDER: {
      const d = steerTo(h, h.target, dt);
      animateWalk(u, time, h.speed);
      m.position.x = THREE.MathUtils.clamp(m.position.x, -CAGE_R + 1, CAGE_R - 1);
      m.position.z = THREE.MathUtils.clamp(m.position.z, -CAGE_R + 1, CAGE_R - 1);
      if (d < 0.4 || h.timer <= 0) setState(h, STATES.IDLE, 0.8 + Math.random() * 1.5);
      break;
    }
    case STATES.TO_WHEEL: {
      const d = steerTo(h, WHEEL_STAND_POS, dt);
      animateWalk(u, time, h.speed);
      if (d < 0.5) setState(h, STATES.RUN_WHEEL, 4 + Math.random() * 5);
      else if (h.timer <= 0) setState(h, STATES.IDLE, 1);
      break;
    }
    case STATES.RUN_WHEEL: {
      m.position.lerp(WHEEL_STAND_POS, 0.2);
      m.rotation.y = Math.PI / 2 * 3; // face wheel
      animateWalk(u, time, 4);        // sprint legs
      h.wheelSpeed = THREE.MathUtils.lerp(h.wheelSpeed, 7, dt * 2);
      if (h.timer <= 0) { h.wheelSpeed = 0; setState(h, STATES.IDLE, 1.2); }
      break;
    }
    case STATES.TO_BOWL: {
      const d = steerTo(h, BOWL_POS, dt);
      animateWalk(u, time, h.speed);
      if (d < 1.3) setState(h, STATES.EAT, 2.5 + Math.random() * 2);
      else if (h.timer <= 0) setState(h, STATES.IDLE, 1);
      break;
    }
    case STATES.EAT: {
      // head bobs down into bowl, cheeks puff
      const bob = Math.abs(Math.sin(time * 8)) * 0.25;
      u.head.rotation.x = 0.6 + bob;
      u.head.position.y = 0.85 - bob * 0.3;
      const puff = 1 + Math.sin(time * 8) * 0.15;
      u.body.scale.x = 1 + (puff - 1) * 0.5;
      kibble.rotation.y = time;
      if (h.timer <= 0) { u.head.rotation.x = 0; chooseNextAction(h); }
      break;
    }
  }

  // tail wiggle for everyone
  u.tail.rotation.y = Math.sin(time * 5 + h.phase) * 0.5;
}

function animateWalk(u, time, speed) {
  const f = time * (4 + speed * 3);
  u.legs[0].rotation.x = Math.sin(f) * 0.7;
  u.legs[1].rotation.x = Math.sin(f + Math.PI) * 0.7;
  u.legs[2].rotation.x = Math.sin(f + Math.PI) * 0.7;
  u.legs[3].rotation.x = Math.sin(f) * 0.7;
  u.body.position.y = 0.62 + Math.abs(Math.sin(f)) * 0.06 * Math.min(speed, 2);
}

// ---------- Main loop ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  for (const h of hamsters) updateHamster(h, dt, time);

  // wheel physics: spins when a hamster runs, slowly friction-stops
  const runner = hamsters.find(h => h.state === STATES.RUN_WHEEL);
  const targetVel = runner ? runner.wheelSpeed : 0;
  wheelAngularVel = THREE.MathUtils.lerp(wheelAngularVel, targetVel, dt * 3);
  wheelSpin.rotation.z -= wheelAngularVel * dt;   // negative = running forward

  // gentle idle sway of the tunnel (it's a toy, it's allowed)
  tunnel.rotation.x = Math.sin(time * 0.7) * 0.02;

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
