<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Poly Hamster Playground</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        #info span { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>
    <div id="info">🐹 <span>Low-Poly Hamster Playground</span> — Drag to rotate, scroll to zoom</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============ SCENE SETUP ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2d1b69);
        scene.fog = new THREE.Fog(0x2d1b69, 20, 40);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(8, 7, 10);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ============ LIGHTS ============
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 30;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xff9944, 0.5, 15);
        pointLight.position.set(-3, 5, -3);
        scene.add(pointLight);

        const pointLight2 = new THREE.PointLight(0x44aaff, 0.3, 12);
        pointLight2.position.set(4, 3, 4);
        scene.add(pointLight2);

        // ============ MATERIALS ============
        function mat(color) {
            return new THREE.MeshLambertMaterial({ color, flatShading: true });
        }

        // ============ FLOOR / TRAY ============
        const trayGeo = new THREE.CylinderGeometry(5.5, 5.8, 0.6, 8);
        const tray = new THREE.Mesh(trayGeo, mat(0x8B4513));
        tray.position.y = -0.3;
        tray.receiveShadow = true;
        scene.add(tray);

        // Bedding (wood shavings look)
        const beddingGeo = new THREE.CylinderGeometry(5.2, 5.2, 0.15, 8);
        const bedding = new THREE.Mesh(beddingGeo, mat(0xDEB887));
        bedding.position.y = 0.08;
        bedding.receiveShadow = true;
        scene.add(bedding);

        // Scattered bedding pieces
        for (let i = 0; i < 40; i++) {
            const pieceGeo = new THREE.BoxGeometry(0.15 + Math.random() * 0.2, 0.05, 0.08);
            const piece = new THREE.Mesh(pieceGeo, mat(Math.random() > 0.5 ? 0xD2B48C : 0xC4A882));
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * 4.5;
            piece.position.set(Math.cos(angle) * r, 0.18, Math.sin(angle) * r);
            piece.rotation.y = Math.random() * Math.PI;
            piece.castShadow = true;
            scene.add(piece);
        }

        // ============ CAGE BARS ============
        const cageGroup = new THREE.Group();
        const barMat = mat(0x4488cc);
        const barGeo = new THREE.CylinderGeometry(0.04, 0.04, 4, 6);

        // Vertical bars
        for (let i = 0; i < 24; i++) {
            const angle = (i / 24) * Math.PI * 2;
            const bar = new THREE.Mesh(barGeo, barMat);
            bar.position.set(Math.cos(angle) * 5.5, 2, Math.sin(angle) * 5.5);
            bar.castShadow = true;
            cageGroup.add(bar);
        }

        // Horizontal rings
        for (let h = 0; h < 3; h++) {
            const ringGeo = new THREE.TorusGeometry(5.5, 0.04, 6, 24);
            const ring = new THREE.Mesh(ringGeo, barMat);
            ring.position.y = 0.5 + h * 1.5;
            ring.rotation.x = Math.PI / 2;
            cageGroup.add(ring);
        }

        // Top ring
        const topRingGeo = new THREE.TorusGeometry(5.5, 0.05, 6, 24);
        const topRing = new THREE.Mesh(topRingGeo, barMat);
        topRing.position.y = 4;
        topRing.rotation.x = Math.PI / 2;
        cageGroup.add(topRing);

        scene.add(cageGroup);

        // ============ HAMSTER WHEEL ============
        const wheelGroup = new THREE.Group();
        const wheelMat = mat(0xff6b6b);

        // Outer ring
        const wheelOuterGeo = new THREE.TorusGeometry(1.2, 0.12, 8, 16);
        const wheelOuter = new THREE.Mesh(wheelOuterGeo, wheelMat);
        wheelGroup.add(wheelOuter);

        // Inner ring
        const wheelInnerGeo = new THREE.TorusGeometry(0.3, 0.08, 6, 12);
        const wheelInner = new THREE.Mesh(wheelInnerGeo, mat(0xffaaaa));
        wheelGroup.add(wheelInner);

        // Spokes
        for (let i = 0; i < 8; i++) {
            const spokeGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.9, 4);
            const spoke = new THREE.Mesh(spokeGeo, mat(0xff8888));
            spoke.position.set(Math.cos(i * Math.PI / 4) * 0.6, Math.sin(i * Math.PI / 4) * 0.6, 0);
            spoke.rotation.z = i * Math.PI / 4 + Math.PI / 2;
            wheelGroup.add(spoke);
        }

        // Stand
        const standGeo = new THREE.BoxGeometry(0.15, 2.4, 0.15);
        const stand1 = new THREE.Mesh(standGeo, mat(0x666666));
        stand1.position.set(0, -1.2, 0.5);
        wheelGroup.add(stand1);
        const stand2 = new THREE.Mesh(standGeo, mat(0x666666));
        stand2.position.set(0, -1.2, -0.5);
        wheelGroup.add(stand2);

        wheelGroup.position.set(-3.5, 2.4, -2);
        wheelGroup.castShadow = true;
        scene.add(wheelGroup);

        // ============ FOOD BOWL ============
        const bowlGroup = new THREE.Group();
        const bowlGeo = new THREE.CylinderGeometry(0.6, 0.4, 0.4, 8, 1, true);
        const bowl = new THREE.Mesh(bowlGeo, mat(0x44cc88));
        bowlGroup.add(bowl);

        const bowlBottomGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.05, 8);
        const bowlBottom = new THREE.Mesh(bowlBottomGeo, mat(0x33aa77));
        bowlBottom.position.y = -0.18;
        bowlGroup.add(bowlBottom);

        // Food pellets
        for (let i = 0; i < 6; i++) {
            const pelletGeo = new THREE.SphereGeometry(0.08, 4, 4);
            const pellet = new THREE.Mesh(pelletGeo, mat(0x8B4513));
            pellet.position.set(
                (Math.random() - 0.5) * 0.4,
                0.05,
                (Math.random() - 0.5) * 0.4
            );
            bowlGroup.add(pellet);
        }

        bowlGroup.position.set(2.5, 0.25, 2);
        scene.add(bowlGroup);

        // ============ TUNNEL ============
        const tunnelGroup = new THREE.Group();
        const tunnelGeo = new THREE.CylinderGeometry(0.5, 0.5, 2.5, 8, 1, true);
        const tunnel = new THREE.Mesh(tunnelGeo, mat(0xffaa33));
        tunnel.rotation.z = Math.PI / 2;
        tunnelGroup.add(tunnel);

        // Tunnel rings
        for (let i = -1; i <= 1; i++) {
            const ringGeo2 = new THREE.TorusGeometry(0.55, 0.06, 6, 12);
            const ring2 = new THREE.Mesh(ringGeo2, mat(0xff8800));
            ring2.position.x = i * 0.8;
            ring2.rotation.y = Math.PI / 2;
            tunnelGroup.add(ring2);
        }

        tunnelGroup.position.set(1, 0.5, -3);
        tunnelGroup.rotation.y = 0.5;
        scene.add(tunnelGroup);

        // ============ WATER BOTTLE ============
        const bottleGroup = new THREE.Group();
        const bottleGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.2, 8);
        const bottle = new THREE.Mesh(bottleGeo, mat(0x88ccff));
        bottleGroup.add(bottle);
        const capGeo = new THREE.CylinderGeometry(0.1, 0.15, 0.2, 8);
        const cap = new THREE.Mesh(capGeo, mat(0xcccccc));
        cap.position.y = -0.7;
        bottleGroup.add(cap);
        const nozzleGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.3, 6);
        const nozzle = new THREE.Mesh(nozzleGeo, mat(0xaaaaaa));
        nozzle.position.y = -0.95;
        bottleGroup.add(nozzle);

        bottleGroup.position.set(4.5, 2.5, 0);
        bottleGroup.rotation.z = -0.3;
        scene.add(bottleGroup);

        // ============ HAMSTER CREATION ============
        const hamsterColors = [
            { body: 0xf5deb3, belly: 0xfff8dc, ear: 0xffb6c1 },
            { body: 0xd2691e, belly: 0xffdead, ear: 0xff9999 },
            { body: 0x808080, belly: 0xc0c0c0, ear: 0xffaaaa },
            { body: 0xffd700, belly: 0xfff8dc, ear: 0xffb6c1 },
        ];

        const hamsters = [];

        function createHamster(colorSet, name) {
            const group = new THREE.Group();

            // Body
            const bodyGeo = new THREE.SphereGeometry(0.4, 6, 5);
            bodyGeo.scale(1, 0.85, 1.2);
            const body = new THREE.Mesh(bodyGeo, mat(colorSet.body));
            body.castShadow = true;
            group.add(body);

            // Belly
            const bellyGeo = new THREE.SphereGeometry(0.3, 5, 4);
            bellyGeo.scale(0.8, 0.7, 0.9);
            const belly = new THREE.Mesh(bellyGeo, mat(colorSet.belly));
            belly.position.set(0, -0.05, 0.1);
            group.add(belly);

            // Head
            const headGeo = new THREE.SphereGeometry(0.28, 6, 5);
            headGeo.scale(1, 0.9, 1);
            const head = new THREE.Mesh(headGeo, mat(colorSet.body));
            head.position.set(0, 0.15, 0.4);
            head.castShadow = true;
            group.add(head);

            // Cheeks
            const cheekGeo = new THREE.SphereGeometry(0.12, 5, 4);
            const cheekL = new THREE.Mesh(cheekGeo, mat(colorSet.belly));
            cheekL.position.set(-0.18, 0.05, 0.5);
            group.add(cheekL);
            const cheekR = new THREE.Mesh(cheekGeo, mat(colorSet.belly));
            cheekR.position.set(0.18, 0.05, 0.5);
            group.add(cheekR);

            // Ears
            const earGeo = new THREE.SphereGeometry(0.1, 5, 4);
            earGeo.scale(1, 1, 0.5);
            const earL = new THREE.Mesh(earGeo, mat(colorSet.ear));
            earL.position.set(-0.18, 0.35, 0.3);
            group.add(earL);
            const earR = new THREE.Mesh(earGeo, mat(colorSet.ear));
            earR.position.set(0.18, 0.35, 0.3);
            group.add(earR);

            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.05, 5, 4);
            const eyeMat = mat(0x111111);
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.1, 0.2, 0.6);
            group.add(eyeL);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.1, 0.2, 0.6);
            group.add(eyeR);

            // Eye shine
            const shineGeo = new THREE.SphereGeometry(0.02, 4, 4);
            const shineMat = mat(0xffffff);
            const shineL = new THREE.Mesh(shineGeo, shineMat);
            shineL.position.set(-0.08, 0.22, 0.63);
            group.add(shineL);
            const shineR = new THREE.Mesh(shineGeo, shineMat);
            shineR.position.set(0.12, 0.22, 0.63);
            group.add(shineR);

            // Nose
            const noseGeo = new THREE.SphereGeometry(0.04, 4, 4);
            const nose = new THREE.Mesh(noseGeo, mat(0xff69b4));
            nose.position.set(0, 0.12, 0.65);
            group.add(nose);

            // Legs
            const legGeo = new THREE.CylinderGeometry(0.06, 0.05, 0.2, 5);
            const legMat = mat(colorSet.body);
            const legs = [];
            const legPositions = [
                [-0.2, -0.35, 0.2],
                [0.2, -0.35, 0.2],
                [-0.2, -0.35, -0.2],
                [0.2, -0.35, -0.2]
            ];
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, legMat);
                leg.position.set(...pos);
                group.add(leg);
                legs.push(leg);
            });

            // Tail
            const tailGeo = new THREE.SphereGeometry(0.06, 4, 4);
            const tail = new THREE.Mesh(tailGeo, mat(colorSet.body));
            tail.position.set(0, 0, -0.45);
            group.add(tail);

            group.userData = {
                name,
                legs,
                state: 'idle',
                stateTimer: Math.random() * 3,
                targetAngle: Math.random() * Math.PI * 2,
                speed: 0.8 + Math.random() * 0.5,
                bobPhase: Math.random() * Math.PI * 2,
                walkPhase: 0,
                targetPoint: null,
                interacting: false,
                interactionTarget: null
            };

            return group;
        }

        // Create hamsters
        const hamsterNames = ['Nibbles', 'Peanut', 'Coco', 'Biscuit'];
        for (let i = 0; i < 4; i++) {
            const h = createHamster(hamsterColors[i], hamsterNames[i]);
            const angle = (i / 4) * Math.PI * 2 + 0.5;
            const r = 2 + Math.random() * 1.5;
            h.position.set(Math.cos(angle) * r, 0.45, Math.sin(angle) * r);
            h.rotation.y = Math.random() * Math.PI * 2;
            scene.add(h);
            hamsters.push(h);
        }

        // ============ HAMSTER AI ============
        const interactionPoints = [
            { pos: new THREE.Vector3(2.5, 0.45, 2), type: 'bowl' },
            { pos: new THREE.Vector3(-3.5, 0.45, -2), type: 'wheel' },
            { pos: new THREE.Vector3(1, 0.45, -3), type: 'tunnel' },
        ];

        function updateHamster(h, dt, time) {
            const d = h.userData;
            d.stateTimer -= dt;
            d.bobPhase += dt * 3;

            switch (d.state) {
                case 'idle':
                    // Gentle bobbing
                    h.position.y = 0.45 + Math.sin(d.bobPhase) * 0.02;
                    // Occasional head turn
                    h.rotation.y += Math.sin(time * 2 + d.bobPhase) * 0.005;

                    if (d.stateTimer <= 0) {
                        const roll = Math.random();
                        if (roll < 0.4) {
                            d.state = 'walking';
                            d.targetAngle = Math.random() * Math.PI * 2;
                            d.stateTimer = 1.5 + Math.random() * 2.5;
                        } else if (roll < 0.6) {
                            d.state = 'interacting';
                            const target = interactionPoints[Math.floor(Math.random() * interactionPoints.length)];
                            d.targetPoint = target.pos.clone();
                            d.interactionTarget = target.type;
                            d.stateTimer = 4 + Math.random() * 3;
                        } else {
                            d.state = 'idle';
                            d.stateTimer = 1 + Math.random() * 2;
                        }
                    }
                    break;

                case 'walking':
                    // Walk animation
                    d.walkPhase += dt * 10;
                    d.legs.forEach((leg, i) => {
                        leg.rotation.x = Math.sin(d.walkPhase + i * Math.PI) * 0.4;
                    });

                    // Move forward
                    const moveX = Math.sin(h.rotation.y) * d.speed * dt;
                    const moveZ = Math.cos(h.rotation.y) * d.speed * dt;
                    h.position.x += moveX;
                    h.position.z += moveZ;

                    // Bob
                    h.position.y = 0.45 + Math.abs(Math.sin(d.walkPhase)) * 0.04;

                    // Boundary check (stay in cage)
                    const dist = Math.sqrt(h.position.x * h.position.x + h.position.z * h.position.z);
                    if (dist > 4.5) {
                        d.targetAngle = Math.atan2(-h.position.x, -h.position.z);
                        h.position.x = Math.cos(Math.atan2(h.position.x, h.position.z)) * 4.4;
                        h.position.z = Math.sin(Math.atan2(h.position.x, h.position.z)) * 4.4;
                    }

                    // Smooth turn toward target
                    let angleDiff = d.targetAngle - h.rotation.y;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    h.rotation.y += angleDiff * 2 * dt;

                    if (d.stateTimer <= 0) {
                        d.state = 'idle';
                        d.stateTimer = 1 + Math.random() * 2;
                        d.legs.forEach(leg => leg.rotation.x = 0);
                    }
                    break;

                case 'interacting':
                    // Move toward target
                    if (d.targetPoint) {
                        const dx = d.targetPoint.x - h.position.x;
                        const dz = d.targetPoint.z - h.position.z;
                        const distToTarget = Math.sqrt(dx * dx + dz * dz);

                        if (distToTarget > 0.8) {
                            const targetRot = Math.atan2(dx, dz);
                            let aDiff = targetRot - h.rotation.y;
                            while (aDiff > Math.PI) aDiff -= Math.PI * 2;
                            while (aDiff < -Math.PI) aDiff += Math.PI * 2;
                            h.rotation.y += aDiff * 3 * dt;

                            h.position.x += Math.sin(h.rotation.y) * d.speed * dt;
                            h.position.z += Math.cos(h.rotation.y) * d.speed * dt;

                            d.walkPhase += dt * 10;
                            d.legs.forEach((leg, i) => {
                                leg.rotation.x = Math.sin(d.walkPhase + i * Math.PI) * 0.4;
                            });
                            h.position.y = 0.45 + Math.abs(Math.sin(d.walkPhase)) * 0.04;
                        } else {
                            // At target - interact
                            d.legs.forEach(leg => leg.rotation.x = 0);
                            h.position.y = 0.45 + Math.sin(time * 4) * 0.03;

                            if (d.interactionTarget === 'bowl') {
                                // Nodding (eating)
                                h.rotation.x = Math.sin(time * 6) * 0.15;
                            } else if (d.interactionTarget === 'wheel') {
                                // Spin animation
                                h.rotation.x = Math.sin(time * 8) * 0.1;
                            } else {
                                // Tunnel sniffing
                                h.rotation.x = Math.sin(time * 3) * 0.1;
                            }
                        }
                    }

                    if (d.stateTimer <= 0) {
                        d.state = 'idle';
                        d.stateTimer = 1 + Math.random() * 2;
                        d.targetPoint = null;
                        h.rotation.x = 0;
                    }
                    break;
            }
        }

        // ============ ORBIT CONTROLS (Simple) ============
        let isDragging = false;
        let previousMouse = { x: 0, y: 0 };
        let spherical = { theta: 0.8, phi: 1.1, radius: 14 };

        function updateCamera() {
            camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
            camera.position.y = spherical.radius * Math.cos(spherical.phi);
            camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
            camera.lookAt(0, 1.5, 0);
        }
        updateCamera();

        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMouse = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - previousMouse.x;
            const dy = e.clientY - previousMouse.y;
            spherical.theta -= dx * 0.005;
            spherical.phi = Math.max(0.3, Math.min(1.4, spherical.phi + dy * 0.005));
            previousMouse = { x: e.clientX, y: e.clientY };
            updateCamera();
        });

        renderer.domElement.addEventListener('mouseup', () => isDragging = false);
        renderer.domElement.addEventListener('mouseleave', () => isDragging = false);

        renderer.domElement.addEventListener('wheel', (e) => {
            spherical.radius = Math.max(8, Math.min(25, spherical.radius + e.deltaY * 0.01));
            updateCamera();
        });

        // Touch support
        renderer.domElement.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });
        renderer.domElement.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const dx = e.touches[0].clientX - previousMouse.x;
            const dy = e.touches[0].clientY - previousMouse.y;
            spherical.theta -= dx * 0.005;
            spherical.phi = Math.max(0.3, Math.min(1.4, spherical.phi + dy * 0.005));
            previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            updateCamera();
        });
        renderer.domElement.addEventListener('touchend', () => isDragging = false);

        // ============ DECORATIONS ============
        // Small colorful balls
        const ballColors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa29bfe, 0xfd79a8];
        for (let i = 0; i < 5; i++) {
            const ballGeo = new THREE.IcosahedronGeometry(0.2, 0);
            const ball = new THREE.Mesh(ballGeo, mat(ballColors[i]));
            const angle = (i / 5) * Math.PI * 2 + 1;
            ball.position.set(Math.cos(angle) * 3.5, 0.3, Math.sin(angle) * 3.5);
            ball.castShadow = true;
            scene.add(ball);
        }

        // Small house/hideout
        const houseGroup = new THREE.Group();
        const houseBodyGeo = new THREE.BoxGeometry(1.2, 0.9, 1);
        const houseBody = new THREE.Mesh(houseBodyGeo, mat(0xe17055));
        houseBody.position.y = 0.45;
        houseBody.castShadow = true;
        houseGroup.add(houseBody);

        const roofGeo = new THREE.ConeGeometry(0.9, 0.6, 4);
        const roof = new THREE.Mesh(roofGeo, mat(0xd63031));
        roof.position.y = 1.2;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        houseGroup.add(roof);

        // Door
        const doorGeo = new THREE.CircleGeometry(0.25, 6);
        const door = new THREE.Mesh(doorGeo, mat(0x2d3436));
        door.position.set(0, 0.35, 0.51);
        houseGroup.add(door);

        houseGroup.position.set(-2, 0.15, 2.5);
        houseGroup.rotation.y = 0.8;
        scene.add(houseGroup);

        // ============ ANIMATION LOOP ============
        let lastTime = performance.now();
        let wheelSpeed = 0;

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;
            const time = now / 1000;

            // Update hamsters
            hamsters.forEach(h => updateHamster(h, dt, time));

            // Wheel rotation (spins when hamster is near)
            let nearWheel = false;
            hamsters.forEach(h => {
                const dist = h.position.distanceTo(new THREE.Vector3(-3.5, 0.45, -2));
                if (dist < 1.5 && h.userData.state === 'interacting') {
                    nearWheel = true;
                }
            });

            if (nearWheel) {
                wheelSpeed = Math.min(wheelSpeed + dt * 3, 5);
            } else {
                wheelSpeed = Math.max(wheelSpeed - dt * 2, 0);
            }
            wheelGroup.rotation.z += wheelSpeed * dt;

            // Gentle camera auto-rotation when not dragging
            if (!isDragging) {
                spherical.theta += dt * 0.05;
                updateCamera();
            }

            // Subtle light animation
            pointLight.intensity = 0.4 + Math.sin(time * 0.5) * 0.1;

            renderer.render(scene, camera);
        }

        animate();

        // ============ RESIZE ============
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
