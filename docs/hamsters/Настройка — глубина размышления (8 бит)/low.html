<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Poly Hamster Playground</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        #info h1 { font-size: 18px; margin-bottom: 2px; color: #ffb347; }
    </style>
</head>
<body>
    <div id="info">
        <h1>🐹 Low-Poly Hamster Playground</h1>
        <span>Drag to orbit • Scroll to zoom</span>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2d1b69);
        scene.fog = new THREE.Fog(0x2d1b69, 15, 30);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 5, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 1, 0);
        controls.maxPolarAngle = Math.PI * 0.48;
        controls.minDistance = 4;
        controls.maxDistance = 18;

        // --- LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffeedd, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        dirLight.position.set(5, 8, 4);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(1024, 1024);
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 20;
        dirLight.shadow.camera.left = -6;
        dirLight.shadow.camera.right = 6;
        dirLight.shadow.camera.top = 6;
        dirLight.shadow.camera.bottom = -6;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffaa44, 0.5, 10);
        pointLight.position.set(-2, 3, -2);
        scene.add(pointLight);

        // --- MATERIALS ---
        const mat = {
            sand: new THREE.MeshLambertMaterial({ color: 0xf4d03f }),
            cageWall: new THREE.MeshPhongMaterial({ color: 0xaaddff, transparent: true, opacity: 0.15, side: THREE.DoubleSide }),
            cageFrame: new THREE.MeshLambertMaterial({ color: 0x555555 }),
            wheel: new THREE.MeshLambertMaterial({ color: 0x88ccff }),
            wheelSpoke: new THREE.MeshLambertMaterial({ color: 0x66aadd }),
            bowl: new THREE.MeshLambertMaterial({ color: 0xe74c3c }),
            seed: new THREE.MeshLambertMaterial({ color: 0x8B4513 }),
            tunnel: new THREE.MeshLambertMaterial({ color: 0x9b59b6 }),
            platform: new THREE.MeshLambertMaterial({ color: 0x27ae60 }),
        };

        // --- CAGE ---
        function buildCage() {
            const group = new THREE.Group();
            const W = 8, D = 6, H = 4;

            // Floor / Sand tray
            const floor = new THREE.Mesh(new THREE.BoxGeometry(W, 0.3, D), mat.sand);
            floor.position.y = -0.15;
            floor.receiveShadow = true;
            group.add(floor);

            // Cage walls (transparent)
            const wallGeo = new THREE.PlaneGeometry(W, H);
            const backWall = new THREE.Mesh(wallGeo, mat.cageWall);
            backWall.position.set(0, H / 2, -D / 2);
            group.add(backWall);

            const frontWall = new THREE.Mesh(wallGeo, mat.cageWall);
            frontWall.position.set(0, H / 2, D / 2);
            frontWall.rotation.y = Math.PI;
            group.add(frontWall);

            const sideGeo = new THREE.PlaneGeometry(D, H);
            const leftWall = new THREE.Mesh(sideGeo, mat.cageWall);
            leftWall.position.set(-W / 2, H / 2, 0);
            leftWall.rotation.y = Math.PI / 2;
            group.add(leftWall);

            const rightWall = new THREE.Mesh(sideGeo, mat.cageWall);
            rightWall.position.set(W / 2, H / 2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            group.add(rightWall);

            // Top
            const topGeo = new THREE.PlaneGeometry(W, D);
            const topWall = new THREE.Mesh(topGeo, mat.cageWall);
            topWall.position.set(0, H, 0);
            topWall.rotation.x = Math.PI / 2;
            group.add(topWall);

            // Frame edges
            const frameMat = mat.cageFrame;
            const r = 0.06;
            const edges = [
                // Bottom
                [[-W/2, 0, -D/2], [W/2, 0, -D/2]],
                [[W/2, 0, -D/2], [W/2, 0, D/2]],
                [[W/2, 0, D/2], [-W/2, 0, D/2]],
                [[-W/2, 0, D/2], [-W/2, 0, -D/2]],
                // Top
                [[-W/2, H, -D/2], [W/2, H, -D/2]],
                [[W/2, H, -D/2], [W/2, H, D/2]],
                [[W/2, H, D/2], [-W/2, H, D/2]],
                [[-W/2, H, D/2], [-W/2, H, -D/2]],
                // Verticals
                [[-W/2, 0, -D/2], [-W/2, H, -D/2]],
                [[W/2, 0, -D/2], [W/2, H, -D/2]],
                [[W/2, 0, D/2], [W/2, H, D/2]],
                [[-W/2, 0, D/2], [-W/2, H, D/2]],
            ];

            edges.forEach(([a, b]) => {
                const va = new THREE.Vector3(...a);
                const vb = new THREE.Vector3(...b);
                const mid = va.clone().add(vb).multiplyScalar(0.5);
                const len = va.distanceTo(vb);
                const geo = new THREE.CylinderGeometry(r, r, len, 6);
                const mesh = new THREE.Mesh(geo, frameMat);
                mesh.position.copy(mid);
                mesh.lookAt(vb);
                mesh.rotateX(Math.PI / 2);
                group.add(mesh);
            });

            return group;
        }
        scene.add(buildCage());

        // --- RUNNING WHEEL ---
        const wheelGroup = new THREE.Group();
        const wheelPos = new THREE.Vector3(2.5, 0, -1.5);

        // Wheel ring
        const wheelRing = new THREE.Mesh(
            new THREE.TorusGeometry(0.8, 0.06, 6, 16),
            mat.wheel
        );
        wheelRing.castShadow = true;
        wheelGroup.add(wheelRing);

        // Spokes
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const spoke = new THREE.Mesh(
                new THREE.CylinderGeometry(0.025, 0.025, 1.6, 4),
                mat.wheelSpoke
            );
            spoke.position.set(0, 0, 0);
            spoke.rotation.z = angle;
            spoke.castShadow = true;
            wheelGroup.add(spoke);
        }

        // Center hub
        const hub = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 4), mat.wheelSpoke);
        wheelGroup.add(hub);

        // Stand
        const standLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2, 5), mat.cageFrame);
        standLeft.position.set(0, -0.6, 0.8);
        wheelGroup.add(standLeft);
        const standRight = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2, 5), mat.cageFrame);
        standRight.position.set(0, -0.6, -0.8);
        wheelGroup.add(standRight);
        const standBase = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 1.9), mat.cageFrame);
        standBase.position.set(0, -1.2, 0);
        wheelGroup.add(standBase);

        wheelGroup.position.copy(wheelPos);
        wheelGroup.position.y = 0.8;
        wheelGroup.rotation.y = Math.PI / 2;
        scene.add(wheelGroup);

        let wheelSpeed = 0;
        let wheelTargetSpeed = 0;

        // --- FOOD BOWL ---
        function buildFoodBowl(x, z) {
            const group = new THREE.Group();
            const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.3, 0.2, 8), mat.bowl);
            bowl.position.y = 0.1;
            bowl.castShadow = true;
            group.add(bowl);

            // Seeds
            for (let i = 0; i < 5; i++) {
                const seed = new THREE.Mesh(new THREE.SphereGeometry(0.05, 4, 3), mat.seed);
                seed.position.set(
                    (Math.random() - 0.5) * 0.4,
                    0.2,
                    (Math.random() - 0.5) * 0.4
                );
                group.add(seed);
            }
            group.position.set(x, 0, z);
            return group;
        }
        scene.add(buildFoodBowl(-2.5, 1.5));
        scene.add(buildFoodBowl(-1, -2));

        // --- TUNNEL ---
        function buildTunnel(x, z, rotY) {
            const group = new THREE.Group();
            const tunnel = new THREE.Mesh(
                new THREE.CylinderGeometry(0.35, 0.35, 1.5, 8, 1, true),
                mat.tunnel
            );
            tunnel.rotation.z = Math.PI / 2;
            tunnel.position.y = 0.35;
            tunnel.material.side = THREE.DoubleSide;
            tunnel.castShadow = true;
            group.add(tunnel);
            group.position.set(x, 0, z);
            group.rotation.y = rotY;
            return group;
        }
        scene.add(buildTunnel(0, 2, 0.3));
        scene.add(buildTunnel(-2, -0.5, -0.8));

        // --- PLATFORM ---
        function buildPlatform(x, y, z) {
            const group = new THREE.Group();
            const plat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.8), mat.platform);
            plat.position.y = y;
            plat.castShadow = true;
            group.add(plat);
            // Legs
            const legGeo = new THREE.CylinderGeometry(0.03, 0.03, y, 4);
            [[-0.5, 0, -0.3], [0.5, 0, -0.3], [-0.5, 0, 0.3], [0.5, 0, 0.3]].forEach(p => {
                const leg = new THREE.Mesh(legGeo, mat.cageFrame);
                leg.position.set(p[0], y / 2, p[2]);
                group.add(leg);
            });
            group.position.set(x, 0, z);
            return group;
        }
        scene.add(buildPlatform(1, 0.5, 1.5));
        scene.add(buildPlatform(-1.5, 0.8, 0));

        // --- HAMSTER FACTORY ---
        function buildHamster(bodyColor, bellyColor) {
            const group = new THREE.Group();

            const bodyMat = new THREE.MeshLambertMaterial({ color: bodyColor });
            const bellyMat = new THREE.MeshLambertMaterial({ color: bellyColor });
            const earMat = new THREE.MeshLambertMaterial({ color: 0xffaaaa });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const noseMat = new THREE.MeshLambertMaterial({ color: 0xff6699 });

            // Body
            const body = new THREE.Mesh(new THREE.SphereGeometry(0.25, 6, 5), bodyMat);
            body.scale.set(1.3, 1, 1);
            body.position.y = 0.25;
            body.castShadow = true;
            group.add(body);

            // Belly
            const belly = new THREE.Mesh(new THREE.SphereGeometry(0.18, 5, 4), bellyMat);
            belly.scale.set(1.1, 0.8, 0.9);
            belly.position.set(0.05, 0.18, 0);
            group.add(belly);

            // Head
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 5), bodyMat);
            head.position.set(0.3, 0.35, 0);
            head.castShadow = true;
            group.add(head);

            // Snout
            const snout = new THREE.Mesh(new THREE.SphereGeometry(0.08, 5, 4), bellyMat);
            snout.position.set(0.42, 0.3, 0);
            group.add(snout);

            // Nose
            const nose = new THREE.Mesh(new THREE.SphereGeometry(0.03, 4, 3), noseMat);
            nose.position.set(0.48, 0.32, 0);
            group.add(nose);

            // Eyes
            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.035, 4, 3), eyeMat);
            eyeL.position.set(0.38, 0.4, 0.1);
            group.add(eyeL);
            const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.035, 4, 3), eyeMat);
            eyeR.position.set(0.38, 0.4, -0.1);
            group.add(eyeR);

            // Ears
            const earGeo = new THREE.ConeGeometry(0.06, 0.1, 4);
            const earL = new THREE.Mesh(earGeo, earMat);
            earL.position.set(0.25, 0.5, 0.12);
            earL.rotation.z = -0.3;
            group.add(earL);
            const earR = new THREE.Mesh(earGeo, earMat);
            earR.position.set(0.25, 0.5, -0.12);
            earR.rotation.z = -0.3;
            group.add(earR);

            // Feet
            const footGeo = new THREE.SphereGeometry(0.05, 4, 3);
            const footPositions = [
                [0.15, 0.05, 0.12], [0.15, 0.05, -0.12],
                [-0.15, 0.05, 0.12], [-0.15, 0.05, -0.12]
            ];
            footPositions.forEach(p => {
                const foot = new THREE.Mesh(footGeo, bodyMat);
                foot.position.set(...p);
                group.add(foot);
            });

            // Tiny tail
            const tail = new THREE.Mesh(new THREE.SphereGeometry(0.04, 4, 3), bodyMat);
            tail.position.set(-0.35, 0.25, 0);
            group.add(tail);

            return group;
        }

        // --- HAMSTER BEHAVIOR ---
        const HAMSTER_COUNT = 5;
        const hamsters = [];
        const hamsterColors = [
            { body: 0xf5a623, belly: 0xfff5e6 },
            { body: 0xe67e22, belly: 0xfdebd0 },
            { body: 0xd4a574, belly: 0xfff8f0 },
            { body: 0xf8c471, belly: 0xffffff },
            { body: 0xc0392b, belly: 0xffd4d4 },
        ];

        const states = { WALKING: 0, PAUSED: 1, AT_WHEEL: 2, EXPLORING: 3 };

        const bounds = { minX: -3.5, maxX: 3.5, minZ: -2.5, maxZ: 2.5 };

        for (let i = 0; i < HAMSTER_COUNT; i++) {
            const hamsterMesh = buildHamster(
                hamsterColors[i].body,
                hamsterColors[i].belly
            );
            const x = (Math.random() - 0.5) * 5;
            const z = (Math.random() - 0.5) * 4;
            hamsterMesh.position.set(x, 0, z);
            hamsterMesh.rotation.y = Math.random() * Math.PI * 2;
            scene.add(hamsterMesh);

            hamsters.push({
                mesh: hamsterMesh,
                state: states.WALKING,
                speed: 0.4 + Math.random() * 0.4,
                direction: Math.random() * Math.PI * 2,
                timer: 0,
                stateDuration: 2 + Math.random() * 3,
                bobPhase: Math.random() * Math.PI * 2,
                isOnWheel: false,
            });
        }

        // Assign one hamster to the wheel initially
        hamsters[0].state = states.AT_WHEEL;
        hamsters[0].isOnWheel = true;
        hamsters[0].mesh.position.set(wheelPos.x, 0, wheelPos.z);
        hamsters[0].mesh.rotation.y = Math.PI;
        wheelSpeed = 3;
        wheelTargetSpeed = 3;

        // --- UPDATE LOOP ---
        const clock = new THREE.Clock();

        function updateHamsters(dt) {
            const time = clock.getElapsedTime();

            hamsters.forEach((h, idx) => {
                h.timer += dt;

                // Bob animation
                const bob = Math.sin(time * 8 + h.bobPhase) * 0.02;
                h.mesh.position.y = bob;

                switch (h.state) {
                    case states.WALKING:
                        h.mesh.position.x += Math.sin(h.direction) * h.speed * dt;
                        h.mesh.position.z += Math.cos(h.direction) * h.speed * dt;
                        h.mesh.rotation.y = h.direction;

                        // Clamp to bounds
                        h.mesh.position.x = THREE.MathUtils.clamp(h.mesh.position.x, bounds.minX, bounds.maxX);
                        h.mesh.position.z = THREE.MathUtils.clamp(h.mesh.position.z, bounds.minZ, bounds.maxZ);

                        if (h.timer > h.stateDuration) {
                            h.timer = 0;
                            h.stateDuration = 1 + Math.random() * 3;
                            if (Math.random() < 0.3 && !h.isOnWheel) {
                                h.state = states.PAUSED;
                            } else {
                                h.direction += (Math.random() - 0.5) * 2;
                            }
                        }
                        break;

                    case states.PAUSED:
                        // Slight head movement
                        h.mesh.rotation.y += Math.sin(time * 2 + idx) * 0.003;
                        if (h.timer > h.stateDuration) {
                            h.timer = 0;
                            h.stateDuration = 2 + Math.random() * 3;
                            h.state = states.WALKING;
                            h.direction = Math.random() * Math.PI * 2;
                        }
                        break;

                    case states.AT_WHEEL:
                        // Face the wheel
                        h.mesh.lookAt(wheelPos.x, 0, wheelPos.z);
                        // Small running animation
                        h.mesh.position.y = Math.abs(Math.sin(time * 12)) * 0.03;
                        wheelTargetSpeed = 4;

                        // Occasionally leave the wheel
                        if (h.timer > 5 + Math.random() * 5) {
                            h.timer = 0;
                            h.state = states.WALKING;
                            h.isOnWheel = false;
                            h.direction = Math.random() * Math.PI * 2;
                            wheelTargetSpeed = 0;
                        }
                        break;

                    case states.EXPLORING:
                        h.mesh.position.x += Math.sin(h.direction) * h.speed * 0.5 * dt;
                        h.mesh.position.z += Math.cos(h.direction) * h.speed * 0.5 * dt;
                        h.mesh.rotation.y = h.direction;
                        h.mesh.position.x = THREE.MathUtils.clamp(h.mesh.position.x, bounds.minX, bounds.maxX);
                        h.mesh.position.z = THREE.MathUtils.clamp(h.mesh.position.z, bounds.minZ, bounds.maxZ);
                        if (h.timer > h.stateDuration) {
                            h.timer = 0;
                            h.stateDuration = 2 + Math.random() * 4;
                            h.state = states.WALKING;
                        }
                        break;
                }
            });

            // Check if any non-wheel hamster should go to wheel
            const wheelHamster = hamsters.find(h => h.isOnWheel);
            if (!wheelHamster) {
                const candidates = hamsters.filter(h => h.state === states.WALKING || h.state === states.PAUSED);
                if (candidates.length > 0 && Math.random() < 0.002) {
                    const chosen = candidates[Math.floor(Math.random() * candidates.length)];
                    chosen.state = states.AT_WHEEL;
                    chosen.isOnWheel = true;
                    chosen.mesh.position.set(wheelPos.x, 0, wheelPos.z);
                    wheelTargetSpeed = 4;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            updateHamsters(dt);

            // Wheel rotation
            wheelSpeed += (wheelTargetSpeed - wheelSpeed) * dt * 2;
            wheelGroup.children[0].rotation.x += wheelSpeed * dt;
            for (let i = 1; i <= 6; i++) {
                wheelGroup.children[i].rotation.x += wheelSpeed * dt;
            }

            // Gentle light pulse
            pointLight.intensity = 0.4 + Math.sin(clock.getElapsedTime() * 0.5) * 0.15;

            controls.update();
            renderer.render(scene, camera);
        }

        // --- RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
