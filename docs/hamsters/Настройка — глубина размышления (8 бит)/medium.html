<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe9f2; }
  #info {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    background: rgba(255,255,255,.85); padding: 10px 22px; border-radius: 20px;
    color: #6b4a3a; box-shadow: 0 4px 12px rgba(0,0,0,.12); text-align: center;
    pointer-events: none; user-select: none;
  }
  #info b { color: #ff7eb6; }
</style>
</head>
<body>
<div id="info"><b>🐹 Low-Poly Hamster Playground</b><br>drag to rotate · scroll to zoom · watch them zoom!</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------- SETUP ---------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe9f2);
scene.fog = new THREE.Fog(0xffe9f2, 30, 60);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9, 8, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 5;
controls.maxDistance = 25;

/* --------------------------------- LIGHTING --------------------------------- */
scene.add(new THREE.HemisphereLight(0xfff0f5, 0xd9b8ff, 0.9));
const sun = new THREE.DirectionalLight(0xfff2d9, 1.4);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;  sun.shadow.camera.bottom = -12;
scene.add(sun);

/* ------------------------------ SHARED MATERIALS ---------------------------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85, ...opts });
}

/* ----------------------------------- CAGE ----------------------------------- */
const CAGE = { w: 12, d: 12, h: 3.6 }; // interior half-extents handled below
const cage = new THREE.Group();
scene.add(cage);

// Floor / bedding tray
const floor = new THREE.Mesh(new THREE.BoxGeometry(12, 0.5, 12), mat(0xffd9a0));
floor.position.y = 0.25;
floor.receiveShadow = true;
cage.add(floor);

// Colorful bedding patches (fun low-poly blobs)
for (let i = 0; i < 26; i++) {
  const s = 0.25 + Math.random() * 0.35;
  const blob = new THREE.Mesh(
    new THREE.DodecahedronGeometry(s, 0),
    mat([0xffc46b, 0xffe6b3, 0xf5b971][i % 3])
  );
  blob.position.set((Math.random() - 0.5) * 11, 0.52, (Math.random() - 0.5) * 11);
  blob.scale.y = 0.35;
  blob.rotation.y = Math.random() * Math.PI;
  blob.castShadow = true;
  cage.add(blob);
}

// Glass walls
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xcfefff, transmission: 0.9, transparent: true, opacity: 0.35,
  roughness: 0.1, side: THREE.DoubleSide
});
[
  [0, 1.8, -6, 12, 3.6, 0.1], [0, 1.8, 6, 12, 3.6, 0.1],
  [-6, 1.8, 0, 0.1, 3.6, 12], [6, 1.8, 0, 0.1, 3.6, 12]
].forEach(([x, y, z, w, h, d]) => {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glassMat);
  wall.position.set(x, y, z);
  cage.add(wall);
});

// Pink frame: vertical posts + top rim
const frameMat = mat(0xff7eb6);
const postGeo = new THREE.CylinderGeometry(0.16, 0.16, 3.8, 6);
[[-6,-6],[6,-6],[6,6],[-6,6]].forEach(([x, z]) => {
  const p = new THREE.Mesh(postGeo, frameMat);
  p.position.set(x, 1.9, z);
  p.castShadow = true;
  cage.add(p);
});
[
  [0, 3.75, -6, 12.3, 0.3, 0.3], [0, 3.75, 6, 12.3, 0.3, 0.3],
  [-6, 3.75, 0, 0.3, 0.3, 12.3], [6, 3.75, 0, 0.3, 0.3, 12.3]
].forEach(([x, y, z, w, h, d]) => {
  const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMat);
  bar.position.set(x, y, z);
  bar.castShadow = true;
  cage.add(bar);
});

/* -------------------------------- EXERCISE WHEEL ----------------------------- */
const wheelGroup = new THREE.Group();
wheelGroup.position.set(-4, 0.5, -4);
scene.add(wheelGroup);

const legMat = mat(0x9b6bff);
[[-0.55, 0], [0.55, 0]].forEach(([x]) => {
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 1.0, 6), legMat);
  leg.position.set(x, 0.5, 0);
  leg.castShadow = true;
  wheelGroup.add(leg);
});
const axleBar = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.3, 6), legMat);
axleBar.rotation.z = Math.PI / 2;
axleBar.position.y = 1.0;
wheelGroup.add(axleBar);

const wheelSpin = new THREE.Group(); // rotates
wheelSpin.position.y = 1.0;
wheelGroup.add(wheelSpin);

const rimMat = mat(0xffd93d);
const rim = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.09, 6, 24), rimMat);
rim.castShadow = true;
wheelSpin.add(rim);
const hub = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.06, 6, 16), rimMat);
wheelSpin.add(hub);
for (let i = 0; i < 8; i++) {
  const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.1, 5), rimMat);
  spoke.rotation.x = (i / 8) * Math.PI * 2;
  wheelSpin.add(spoke);
}
let wheelSpeed = 0;

/* ----------------------------------- TUNNEL ---------------------------------- */
const tunnel = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 3.2, 8, 1, true), mat(0x6bd4ff, { side: THREE.DoubleSide }));
tunnel.rotation.z = Math.PI / 2;
tunnel.position.set(3.2, 0.8, 3.5);
tunnel.rotation.y = -0.35;
tunnel.castShadow = true;
scene.add(tunnel);

/* ---------------------------------- FOOD BOWL -------------------------------- */
const bowl = new THREE.Group();
bowl.position.set(4.2, 0.5, -3.6);
scene.add(bowl);
const bowlBase = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.5, 0.35, 8), mat(0xff6b6b));
bowlBase.position.y = 0.18;
bowlBase.castShadow = true;
bowl.add(bowlBase);
const seedMat = mat(0xc98a4b);
for (let i = 0; i < 8; i++) {
  const seed = new THREE.Mesh(new THREE.SphereGeometry(0.11, 5, 4), seedMat);
  seed.scale.y = 0.7;
  const a = (i / 8) * Math.PI * 2;
  seed.position.set(Math.cos(a) * 0.3, 0.38, Math.sin(a) * 0.3);
  bowl.add(seed);
}

/* ------------------------------- HAMSTER FACTORY ----------------------------- */
const HAMSTER_PALETTES = [
  { fur: 0xffb347, belly: 0xfff3e0, name: 'Peanut' },
  { fur: 0xf5f0e8, belly: 0xffffff, name: 'Mochi' },
  { fur: 0xd8a078, belly: 0xffe8d1, name: 'Biscuit' },
];

function buildHamster(palette) {
  const g = new THREE.Group();
  const fur = mat(palette.fur);
  const belly = mat(palette.belly);

  // Body (squashed sphere)
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.55, 7, 6), fur);
  body.scale.set(1.15, 0.85, 0.95);
  body.position.y = 0.55;
  body.castShadow = true;
  g.add(body);

  // Belly patch
  const bellyMesh = new THREE.Mesh(new THREE.SphereGeometry(0.42, 6, 5), belly);
  bellyMesh.scale.set(1.0, 0.6, 0.8);
  bellyMesh.position.set(0.15, 0.42, 0);
  g.add(bellyMesh);

  // Head
  const head = new THREE.Group();
  head.position.set(0.5, 0.75, 0);
  g.add(head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.38, 7, 6), fur);
  skull.castShadow = true;
  head.add(skull);

  // Ears
  [-1, 1].forEach(side => {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.22, 5), fur);
    ear.position.set(-0.05, 0.35, side * 0.22);
    head.add(ear);
    const inner = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.14, 5), mat(0xff9ec4));
    inner.position.set(-0.03, 0.36, side * 0.22);
    head.add(inner);
  });

  // Eyes
  [-1, 1].forEach(side => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 4), mat(0x2b2b2b, { roughness: 0.3 }));
    eye.position.set(0.28, 0.08, side * 0.24);
    head.add(eye);
  });

  // Nose
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 4), mat(0xff6b9d));
  nose.position.set(0.42, -0.05, 0);
  head.add(nose);

  // Cheeks (chubby!)
  [-1, 1].forEach(side => {
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.16, 5, 4), belly);
    cheek.position.set(0.28, -0.15, side * 0.26);
    head.add(cheek);
  });

  // Feet
  const footGeo = new THREE.SphereGeometry(0.11, 5, 4);
  [[0.3, 0.12, 0.2], [0.3, 0.12, -0.2], [-0.3, 0.12, 0.2], [-0.3, 0.12, -0.2]].forEach(p => {
    const f = new THREE.Mesh(footGeo, belly);
    f.position.set(...p);
    g.add(f);
  });

  // Tail nub
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.09, 5, 4), fur);
  tail.position.set(-0.62, 0.55, 0);
  g.add(tail);

  // Store references for animation
  g.userData.head = head;
  g.userData.body = body;
  return g;
}

/* ------------------------------- HAMSTER BRAINS ------------------------------ */
const STATES = { WANDER: 0, PAUSE: 1, TO_WHEEL: 2, AT_WHEEL: 3, TO_BOWL: 4, EATING: 5 };
const hamsters = [];
const wheelPoint = new THREE.Vector3(-4, 0.5, -2.6);
const bowlPoint  = new THREE.Vector3(4.2, 0.5, -2.4);

HAMSTER_PALETTES.forEach((p, i) => {
  const mesh = buildHamster(p);
  mesh.position.set((Math.random() - 0.5) * 6, 0.5, (Math.random() - 0.5) * 6);
  scene.add(mesh);
  hamsters.push({
    mesh,
    state: STATES.WANDER,
    target: new THREE.Vector3(),
    timer: 2 + Math.random() * 3,
    speed: 1.2 + Math.random() * 0.5,
    bobPhase: Math.random() * 10,
  });
});

const tmpVec = new THREE.Vector3();

function pickTarget(h) {
  h.target.set(
    (Math.random() - 0.5) * 9.5,
    0.5,
    (Math.random() - 0.5) * 9.5
  );
}

function updateHamster(h, dt) {
  const m = h.mesh;
  h.timer -= dt;

  switch (h.state) {
    case STATES.WANDER:
      if (h.timer <= 0) {
        // Occasionally decide to visit the wheel or bowl
        const r = Math.random();
        if (r < 0.18) { h.state = STATES.TO_WHEEL; h.target.copy(wheelPoint); }
        else if (r < 0.32) { h.state = STATES.TO_BOWL; h.target.copy(bowlPoint); }
        else { h.state = STATES.PAUSE; h.timer = 1 + Math.random() * 2.5; }
      }
      break;

    case STATES.PAUSE:
      // Idle wiggle — sniffing the air
      m.userData.head.position.x = 0.5 + Math.sin(clockTime * 6 + h.bobPhase) * 0.06;
      if (h.timer <= 0) { h.state = STATES.WANDER; h.timer = 2 + Math.random() * 3; pickTarget(h); }
      break;

    case STATES.TO_WHEEL:
      if (m.position.distanceTo(h.target) < 0.5) {
        h.state = STATES.AT_WHEEL;
        h.timer = 2.5 + Math.random() * 2;
        wheelSpeed = 6;
      }
      break;

    case STATES.AT_WHEEL:
      // Run in place: bounce + face wheel center
      m.lookAt(wheelPoint.x, 0.5, wheelPoint.z);
      m.position.y = 0.5 + Math.abs(Math.sin(clockTime * 14)) * 0.12;
      if (h.timer <= 0) {
        wheelSpeed *= 0.5;
        h.state = STATES.WANDER;
        h.timer = 3 + Math.random() * 3;
        pickTarget(h);
      }
      break;

    case STATES.TO_BOWL:
      if (m.position.distanceTo(h.target) < 0.6) {
        h.state = STATES.EATING;
        h.timer = 2 + Math.random() * 1.5;
      }
      break;

    case STATES.EATING:
      m.lookAt(bowl.position.x, 0.5, bowl.position.z);
      m.userData.head.position.y = 0.75 - Math.abs(Math.sin(clockTime * 10 + h.bobPhase)) * 0.15; // head bob nibble
      if (h.timer <= 0) {
        h.state = STATES.WANDER;
        h.timer = 2 + Math.random() * 3;
        pickTarget(h);
      }
      break;
  }

  // Movement (only when actively heading somewhere)
  const moving = [STATES.WANDER, STATES.TO_WHEEL, STATES.TO_BOWL].includes(h.state);
  if (moving) {
    tmpVec.subVectors(h.target, m.position);
    tmpVec.y = 0;
    if (tmpVec.lengthSq() > 0.04) {
      tmpVec.normalize();
      const angle = Math.atan2(tmpVec.x, tmpVec.z);
      // Smooth turn
      let diff = angle - m.rotation.y;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      m.rotation.y += diff * Math.min(1, dt * 5);
      m.position.addScaledVector(tmpVec, h.speed * dt);
      // Walk bob
      m.position.y = 0.5 + Math.abs(Math.sin(clockTime * 10 + h.bobPhase)) * 0.05;
    }
  } else {
    m.position.y += (0.5 - m.position.y) * Math.min(1, dt * 8);
  }

  // Keep inside the cage
  m.position.x = THREE.MathUtils.clamp(m.position.x, -5.3, 5.3);
  m.position.z = THREE.MathUtils.clamp(m.position.z, -5.3, 5.3);

  // Squash & stretch while walking (cute!)
  const squash = moving ? 1 + Math.sin(clockTime * 10 + h.bobPhase) * 0.04 : 1;
  m.userData.body.scale.x = 1.15 / squash;
  m.userData.body.scale.z = 0.95 * squash;
}

/* ---------------------------------- MAIN LOOP -------------------------------- */
const clock = new THREE.Clock();
let clockTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  clockTime += dt;

  // Wheel decays toward rest
  wheelSpeed += (0 - wheelSpeed) * Math.min(1, dt * 0.8);
  wheelSpin.rotation.x += wheelSpeed * dt;

  hamsters.forEach(h => updateHamster(h, dt));

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
