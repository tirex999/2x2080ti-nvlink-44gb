<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6ff;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 14px; left: 14px; padding: 12px 16px;
    background: rgba(255,255,255,0.82); border-radius: 16px; color: #3a2a1a;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12); max-width: 280px; pointer-events: none;
  }
  #ui h1 { margin: 0 0 4px; font-size: 20px; }
  #ui p  { margin: 0 0 8px; font-size: 12px; opacity: 0.75; }
  #status { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  #status li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #3a2a1a; flex: none; }
  .name { font-weight: 700; min-width: 58px; }
</style>
</head>
<body>

<div id="ui">
  <h1>🐹 Hamster Playground</h1>
  <p>Drag to orbit · Scroll to zoom · Click a hamster to poke it</p>
  <ul id="status"></ul>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------- helpers
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const TAU = Math.PI * 2;
function angleDiff(from, to) {          // shortest signed angle from -> to
  let d = (to - from) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
const flatMat = (color, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85, ...extra });

// ---------------------------------------------------------------- constants
const CAGE = { w: 14, d: 10, h: 7 };
const GROUND_Y = 0.3;                                    // top of bedding
const BOUNDS = { minX: -CAGE.w / 2 + 0.9, maxX: CAGE.w / 2 - 0.9,
                 minZ: -CAGE.d / 2 + 0.9, maxZ: CAGE.d / 2 - 0.9 };

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe6ff);
scene.fog = new THREE.Fog(0xbfe6ff, 45, 90);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(13, 10, 17);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 45;
controls.maxPolarAngle = Math.PI * 0.48;

// lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa66, 0.8));
const sun = new THREE.DirectionalLight(0xfff2d0, 1.7);
sun.position.set(10, 18, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 12;   sun.shadow.camera.bottom = -12;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0005;
scene.add(sun);

// ---------------------------------------------------------------- room + table
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), flatMat(0xe6dccf));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -6.6; floor.receiveShadow = true;
  scene.add(floor);

  const wood = flatMat(0xc98f5a);
  const top = new THREE.Mesh(new THREE.BoxGeometry(30, 1, 22), wood);
  top.position.y = -1.1; top.receiveShadow = true; top.castShadow = true;
  scene.add(top);
  for (const [x, z] of [[-13, -9], [13, -9], [-13, 9], [13, 9]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(1.2, 5, 1.2), wood);
    leg.position.set(x, -4.1, z); leg.castShadow = true;
    scene.add(leg);
  }
}

// ---------------------------------------------------------------- cage + tray
{
  const trayMat = flatMat(0xff7eb6);
  const base = new THREE.Mesh(new THREE.BoxGeometry(CAGE.w + 0.4, 0.3, CAGE.d + 0.4), trayMat);
  base.position.y = -0.45; base.receiveShadow = true; scene.add(base);

  const wallDefs = [
    [CAGE.w + 0.4, 0.2, 0, -CAGE.d / 2 - 0.1], [CAGE.w + 0.4, 0.2, 0, CAGE.d / 2 + 0.1],
    [0.2, CAGE.d + 0.4, -CAGE.w / 2 - 0.1, 0], [0.2, CAGE.d + 0.4, CAGE.w / 2 + 0.1, 0],
  ];
  for (const [sx, sz, x, z] of wallDefs) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(sx, 1.2, sz), trayMat);
    wall.position.set(x, 0, z); wall.castShadow = true; wall.receiveShadow = true;
    scene.add(wall);
  }

  // bedding block
  const bedding = new THREE.Mesh(new THREE.BoxGeometry(CAGE.w, 0.6, CAGE.d), flatMat(0xf3dc9c));
  bedding.position.y = 0; bedding.receiveShadow = true; scene.add(bedding);

  // bedding chips (instanced, per-instance color)
  const chipCount = 240;
  const chips = new THREE.InstancedMesh(new THREE.BoxGeometry(0.36, 0.08, 0.22),
                                        flatMat(0xffffff), chipCount);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const palette = [0xf7e2a8, 0xf0d18a, 0xfff0c2, 0xe9c77f, 0xfbe7b6];
  for (let i = 0; i < chipCount; i++) {
    e.set(rand(-0.15, 0.15), rand(0, TAU), rand(-0.15, 0.15));
    q.setFromEuler(e);
    m.compose(new THREE.Vector3(rand(-CAGE.w / 2 + 0.3, CAGE.w / 2 - 0.3), GROUND_Y + 0.02,
                                rand(-CAGE.d / 2 + 0.3, CAGE.d / 2 - 0.3)), q, new THREE.Vector3(1, 1, 1));
    chips.setMatrixAt(i, m);
    chips.setColorAt(i, new THREE.Color(pick(palette)));
  }
  chips.receiveShadow = true;
  scene.add(chips);

  // bars
  const barMat = new THREE.MeshStandardMaterial({ color: 0xe3e9f0, metalness: 0.6, roughness: 0.35 });
  const barH = CAGE.h - 0.6;
  const barGeo = new THREE.CylinderGeometry(0.05, 0.05, barH, 6);
  const nx = Math.round(CAGE.w / 0.7), nz = Math.round(CAGE.d / 0.7);
  const positions = [];
  for (let i = 0; i <= nx; i++) {
    const x = -CAGE.w / 2 + (i / nx) * CAGE.w;
    positions.push([x, -CAGE.d / 2], [x, CAGE.d / 2]);
  }
  for (let i = 1; i < nz; i++) {
    const z = -CAGE.d / 2 + (i / nz) * CAGE.d;
    positions.push([-CAGE.w / 2, z], [CAGE.w / 2, z]);
  }
  const bars = new THREE.InstancedMesh(barGeo, barMat, positions.length);
  positions.forEach(([x, z], i) => {
    m.makeTranslation(x, 0.6 + barH / 2, z);
    bars.setMatrixAt(i, m);
  });
  bars.castShadow = true;
  scene.add(bars);

  // rims + corner posts
  const rimMat = flatMat(0xffffff, { metalness: 0.3, roughness: 0.5 });
  for (const y of [CAGE.h, CAGE.h * 0.55]) {
    const t = y === CAGE.h ? 0.14 : 0.08;
    for (const [sx, sz, x, z] of [
      [CAGE.w + 0.2, t, 0, -CAGE.d / 2], [CAGE.w + 0.2, t, 0, CAGE.d / 2],
      [t, CAGE.d + 0.2, -CAGE.w / 2, 0], [t, CAGE.d + 0.2, CAGE.w / 2, 0]]) {
      const rim = new THREE.Mesh(new THREE.BoxGeometry(sx, t, sz), rimMat);
      rim.position.set(x, y, z); rim.castShadow = true; scene.add(rim);
    }
  }
  for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, barH, 8), rimMat);
    post.position.set(x * CAGE.w / 2, 0.6 + barH / 2, z * CAGE.d / 2); post.castShadow = true;
    scene.add(post);
  }

  // water bottle hanging on the back wall
  const bottle = new THREE.Group();
  bottle.position.set(-3, 3.2, -CAGE.d / 2 - 0.5);
  const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 2.2, 10),
    flatMat(0x8fd3ff, { transparent: true, opacity: 0.55 }));
  const water = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.5, 10), flatMat(0x3fa9f5));
  water.position.y = -0.3;
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.24, 0.35, 10), flatMat(0xff5c5c));
  cap.position.y = -1.25;
  const spout = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.4, 6), rimMat);
  spout.position.set(0, -1.75, 0.55); spout.rotation.x = Math.PI * 0.35;
  bottle.add(glass, water, cap, spout);
  bottle.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(bottle);
}

// ---------------------------------------------------------------- running wheel
const wheel = (() => {
  const x = -4.2, z = -2.3, R = 1.6;
  const group = new THREE.Group();
  group.position.set(x, GROUND_Y, z);
  const hubY = R + 0.25;

  const mint = flatMat(0x5ee6c1), dark = flatMat(0x2fb894);
  const spin = new THREE.Group();
  spin.position.y = hubY;

  for (const sx of [-0.45, 0.45]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(R, 0.08, 6, 26), mint);
    ring.rotation.y = Math.PI / 2; ring.position.x = sx;
    spin.add(ring);
  }
  const rungGeo = new THREE.BoxGeometry(0.9, 0.06, 0.06);
  for (let i = 0; i < 22; i++) {
    const a = (i / 22) * TAU;
    const rung = new THREE.Mesh(rungGeo, dark);
    rung.position.set(0, Math.cos(a) * R, Math.sin(a) * R);
    rung.rotation.x = -a;
    spin.add(rung);
  }
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * TAU;
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.06, R, 0.08), dark);
    spoke.position.set(-0.45, Math.cos(a) * R / 2, Math.sin(a) * R / 2);
    spoke.rotation.x = -a;
    spin.add(spoke);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.1, 8), dark);
  hub.rotation.z = Math.PI / 2;
  spin.add(hub);

  const post = new THREE.Mesh(new THREE.BoxGeometry(0.25, hubY, 0.25), dark);
  post.position.set(-0.95, hubY / 2, 0);
  const foot = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 1.6), dark);
  foot.position.set(-0.95, 0.1, 0);
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.0, 6), flatMat(0xdddddd));
  axle.rotation.z = Math.PI / 2; axle.position.set(-0.5, hubY, 0);

  group.add(spin, post, foot, axle);
  group.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(group);

  return {
    group, spin, speed: 0, targetSpeed: 0, user: null,
    pos:  new THREE.Vector3(x, GROUND_Y, z),
    spot: new THREE.Vector3(x, GROUND_Y + 0.22, z),   // where the hamster stands inside
    exit: new THREE.Vector3(x + 2.0, GROUND_Y, z),    // hop-on / hop-off point
  };
})();

// ---------------------------------------------------------------- food bowl
const bowl = (() => {
  const x = 4.2, z = 3.0;
  const group = new THREE.Group();
  group.position.set(x, GROUND_Y, z);
  const outer = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 0.75, 0.5, 12), flatMat(0xffd23f));
  outer.position.y = 0.25;
  const inner = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.7, 0.3, 12), flatMat(0xe0a800));
  inner.position.y = 0.36;
  group.add(outer, inner);
  const seedGeo = new THREE.SphereGeometry(0.1, 5, 4);
  seedGeo.scale(1, 0.6, 1.6);
  const seeds = new THREE.InstancedMesh(seedGeo, flatMat(0x4a3628), 16);
  const m = new THREE.Matrix4();
  for (let i = 0; i < 16; i++) {
    const a = rand(0, TAU), r = rand(0, 0.6);
    m.makeRotationY(rand(0, TAU));
    m.setPosition(Math.cos(a) * r, 0.52, Math.sin(a) * r);
    seeds.setMatrixAt(i, m);
  }
  group.add(seeds);
  group.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(group);
  return { group, user: null, pos: new THREE.Vector3(x, GROUND_Y, z), r: 1.55 };
})();

// ---------------------------------------------------------------- tunnel
const tunnel = (() => {
  const x = 2.5, z = -2.8, len = 4, R = 0.9;
  const group = new THREE.Group();
  group.position.set(x, GROUND_Y + 0.55, z);
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(R, R, len, 10, 1, true),
    flatMat(0x7ee36b, { transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
  tube.rotation.z = Math.PI / 2;
  group.add(tube);
  for (const sx of [-len / 2, len / 2]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(R, 0.1, 6, 12), flatMat(0x3fb52d));
    ring.rotation.y = Math.PI / 2; ring.position.x = sx;
    group.add(ring);
  }
  group.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(group);
  return {
    group, user: null,
    endA: new THREE.Vector3(x - len / 2 - 0.9, GROUND_Y, z),
    endB: new THREE.Vector3(x + len / 2 + 0.9, GROUND_Y, z),
    rect: { minX: x - len / 2 - 0.2, maxX: x + len / 2 + 0.2, minZ: z - 1.1, maxZ: z + 1.1 },
  };
})();

// ---------------------------------------------------------------- obstacles
const obstacles = [
  { type: 'circle', x: wheel.pos.x, z: wheel.pos.z, r: 1.9 },
  { type: 'circle', x: bowl.pos.x, z: bowl.pos.z, r: 1.35 },
  { type: 'rect', ...tunnel.rect },
];
function isFree(x, z) {
  for (const o of obstacles) {
    if (o.type === 'circle') { if (Math.hypot(x - o.x, z - o.z) < o.r) return false; }
    else if (x > o.minX && x < o.maxX && z > o.minZ && z < o.maxZ) return false;
  }
  return true;
}
function resolveObstacles(p) {
  for (const o of obstacles) {
    if (o.type === 'circle') {
      const dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz);
      if (d < o.r) {
        if (d < 1e-4) { p.x = o.x + o.r; } else { p.x = o.x + dx / d * o.r; p.z = o.z + dz / d * o.r; }
      }
    } else if (p.x > o.minX && p.x < o.maxX && p.z > o.minZ && p.z < o.maxZ) {
      const dl = p.x - o.minX, dr = o.maxX - p.x, dn = p.z - o.minZ, df = o.maxZ - p.z;
      const mn = Math.min(dl, dr, dn, df);
      if (mn === dl) p.x = o.minX; else if (mn === dr) p.x = o.maxX;
      else if (mn === dn) p.z = o.minZ; else p.z = o.maxZ;
    }
  }
}
function randomFreePoint() {
  for (let i = 0; i < 40; i++) {
    const x = rand(BOUNDS.minX, BOUNDS.maxX), z = rand(BOUNDS.minZ, BOUNDS.maxZ);
    if (isFree(x, z)) return { x, z };
  }
  return { x: 0, z: 0 };
}
const inBounds = (x, z) => x > BOUNDS.minX && x < BOUNDS.maxX && z > BOUNDS.minZ && z < BOUNDS.maxZ;

// ---------------------------------------------------------------- speech bubbles
const bubbles = [];
function spawnBubble(text, pos) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  rr(10, 10, 236, 92, 30);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = '#3a2a1a'; ctx.stroke();
  ctx.fillStyle = '#3a2a1a'; ctx.font = 'bold 40px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 58);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(2.2, 1.1, 1);
  sp.position.copy(pos).add(new THREE.Vector3(0, 1.7, 0));
  sp.renderOrder = 10;
  scene.add(sp);
  bubbles.push({ sp, life: 1.5 });
}
function updateBubbles(dt) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.life -= dt;
    b.sp.position.y += dt * 0.6;
    b.sp.material.opacity = Math.min(1, b.life * 2);
    if (b.life <= 0) { scene.remove(b.sp); b.sp.material.map.dispose(); b.sp.material.dispose(); bubbles.splice(i, 1); }
  }
}

// ---------------------------------------------------------------- hamster model
function buildHamsterModel(def, model) {
  const fur = flatMat(def.fur), belly = flatMat(def.belly);
  const pink = flatMat(0xff9bb5), black = flatMat(0x222222, { roughness: 0.3 });

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), fur);
  body.scale.set(1, 0.85, 1.2); body.position.y = 0.45;
  const bellyM = new THREE.Mesh(new THREE.SphereGeometry(0.36, 8, 6), belly);
  bellyM.scale.set(1, 0.75, 1.1); bellyM.position.set(0, 0.36, 0.12);
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.08, 5, 4), belly);
  tail.position.set(0, 0.45, -0.62);

  // head group (pivot at neck so nodding is visible)
  const head = new THREE.Group();
  head.position.set(0, 0.62, 0.5);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.36, 8, 6), fur);
  head.add(skull);
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 5), black);
    eye.position.set(s * 0.14, 0.08, 0.31);
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.13, 6, 5), belly);
    cheek.position.set(s * 0.22, -0.1, 0.23);
    head.add(eye, cheek);
  }
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 5), pink);
  nose.position.set(0, -0.04, 0.37);
  head.add(nose);

  const ears = [];
  for (const s of [-1, 1]) {
    const ear = new THREE.Group();
    ear.position.set(s * 0.2, 0.26, -0.06);
    ear.userData.baseZ = -s * 0.35;
    ear.rotation.z = ear.userData.baseZ;
    const outer = new THREE.Mesh(new THREE.SphereGeometry(0.13, 6, 5), fur);
    outer.scale.set(1, 1.1, 0.6); outer.position.y = 0.1;
    const inner = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 5), pink);
    inner.scale.set(1, 1.1, 0.5); inner.position.set(0, 0.1, 0.05);
    ear.add(outer, inner);
    head.add(ear);
    ears.push(ear);
  }

  const paws = [[-0.25, 0.35], [0.25, 0.35], [-0.25, -0.3], [0.25, -0.3]].map(([x, z]) => {
    const paw = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 5), fur);
    paw.position.set(x, 0.1, z);
    paw.userData.baseZ = z;
    return paw;
  });

  model.add(body, bellyM, tail, head, ...paws);
  return { body, head, ears, paws };
}

// ---------------------------------------------------------------- hamster behaviour
const hamsterMeshes = [];
const SQUEAKS = ['squeak!', 'eep!', 'boing!', 'hi!', '*wiggle*', 'hehe'];

class Hamster {
  constructor(def) {
    this.name = def.name; this.color = def.fur;
    this.root = new THREE.Group();
    this.model = new THREE.Group();
    this.root.add(this.model);
    this.parts = buildHamsterModel(def, this.model);
    this.root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.userData.hamster = this; hamsterMeshes.push(o); } });

    const p = randomFreePoint();
    this.root.position.set(p.x, GROUND_Y, p.z);
    this.heading = rand(0, TAU);
    this.speed = rand(2.0, 2.9);
    this.phase = rand(0, 10);
    this.state = 'idle'; this.timer = rand(0.5, 2.5);
    this.next = null; this.target = new THREE.Vector3(); this.faceAngle = 0;
    this.anim = 'idle';
    this.jumpT = 0; this.twitch = 0; this.twitchTimer = rand(1, 4); this.twitchEar = this.parts.ears[0];
    this.idleTurn = 0;
    scene.add(this.root);
  }

  get pos() { return this.root.position; }
  get inWheel() { return this.state === 'enterWheel' || this.state === 'run' || this.state === 'exitWheel'; }

  setState(state, timer = 0) { this.state = state; this.timer = timer; }

  releaseClaims() {
    if (wheel.user === this) { wheel.user = null; wheel.targetSpeed = 0; }
    if (bowl.user === this) bowl.user = null;
    if (tunnel.user === this) tunnel.user = null;
  }

  goTo(x, z, next) {
    this.target.set(x, GROUND_Y, z);
    this.next = next;
    const d = Math.hypot(x - this.pos.x, z - this.pos.z);
    this.setState('walk', d / this.speed + 5);          // generous timeout to avoid getting stuck
  }

  chooseActivity() {
    const r = Math.random();
    if (r < 0.22 && !wheel.user) {
      wheel.user = this;
      this.goTo(wheel.exit.x, wheel.exit.z, 'wheel');
    } else if (r < 0.42 && !bowl.user) {
      let spot = null;
      for (let i = 0; i < 12 && !spot; i++) {
        const a = rand(0, TAU);
        const x = bowl.pos.x + Math.sin(a) * bowl.r, z = bowl.pos.z + Math.cos(a) * bowl.r;
        if (inBounds(x, z) && isFree(x, z)) spot = { x, z };
      }
      if (spot) { bowl.user = this; this.goTo(spot.x, spot.z, 'eat'); return; }
      this.wander();
    } else if (r < 0.58 && !tunnel.user) {
      tunnel.user = this;
      const dA = this.pos.distanceTo(tunnel.endA), dB = this.pos.distanceTo(tunnel.endB);
      const entry = dA < dB ? tunnel.endA : tunnel.endB;
      this.tunnelExit = dA < dB ? tunnel.endB : tunnel.endA;
      this.goTo(entry.x, entry.z, 'tunnel');
    } else {
      this.wander();
    }
  }

  wander() { const p = randomFreePoint(); this.goTo(p.x, p.z, 'idle'); }

  onArrive() {
    const p = this.pos;
    switch (this.next) {
      case 'wheel': this.setState('enterWheel', 0.8); break;
      case 'eat':
        this.faceAngle = Math.atan2(bowl.pos.x - p.x, bowl.pos.z - p.z);
        this.setState('eat', rand(3, 7));
        spawnBubble('*nom nom*', p);
        break;
      case 'tunnel':
        this.target.copy(this.tunnelExit);
        this.setState('tunnelWalk', 7);
        break;
      default:
        this.setState('idle', rand(1, 3.5));
        this.idleTurn = rand(-0.9, 0.9);
    }
    this.next = null;
  }

  moveToward(target, dt, ignoreObstacles) {
    const p = this.pos;
    const dx = target.x - p.x, dz = target.z - p.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.2) return true;
    const desired = Math.atan2(dx, dz);
    const diff = angleDiff(this.heading, desired);
    const maxTurn = 5 * dt;
    this.heading += THREE.MathUtils.clamp(diff, -maxTurn, maxTurn);
    const align = Math.max(0.15, Math.cos(diff));
    const step = Math.min(dist, this.speed * align * dt);
    p.x += Math.sin(this.heading) * step;
    p.z += Math.cos(this.heading) * step;
    this.phase += step * 9;
    if (!ignoreObstacles) resolveObstacles(p);
    return false;
  }

  poke() {
    if (this.jumpT <= 0) this.jumpT = 1;
    spawnBubble(pick(SQUEAKS), this.pos);
    if (this.state === 'idle') this.idleTurn = rand(-3, 3);
  }

  update(dt, t) {
    this.timer -= dt;
    this.anim = 'idle';
    const p = this.pos;

    switch (this.state) {
      case 'idle':
        this.heading += this.idleTurn * dt;
        this.idleTurn *= Math.max(0, 1 - dt * 0.8);
        if (this.timer <= 0) this.chooseActivity();
        break;

      case 'walk': {
        this.anim = 'walk';
        if (this.moveToward(this.target, dt, false)) this.onArrive();
        else if (this.timer <= 0) { this.releaseClaims(); this.setState('idle', rand(1, 2)); }
        break;
      }

      case 'enterWheel': {
        this.anim = 'walk';
        const k = 1 - Math.exp(-dt * 5);
        p.lerp(wheel.spot, k);
        this.heading += angleDiff(this.heading, 0) * k;
        if (this.timer <= 0) {
          p.copy(wheel.spot); this.heading = 0;
          this.setState('run', rand(4, 9));
          wheel.targetSpeed = 5.5;
          spawnBubble('wheee!', p);
        }
        break;
      }

      case 'run':
        this.anim = 'run';
        this.phase += dt * 20;
        if (this.timer <= 0) { wheel.targetSpeed = 0; this.setState('exitWheel', 0.8); }
        break;

      case 'exitWheel': {
        this.anim = 'walk';
        const k = 1 - Math.exp(-dt * 5);
        p.lerp(wheel.exit, k);
        this.heading += angleDiff(this.heading, Math.PI / 2) * k;
        if (this.timer <= 0) { p.copy(wheel.exit); wheel.user = null; this.setState('idle', rand(0.5, 1.5)); }
        break;
      }

      case 'eat':
        this.anim = 'eat';
        this.heading += angleDiff(this.heading, this.faceAngle) * Math.min(1, dt * 5);
        if (this.timer <= 0) { bowl.user = null; this.setState('idle', rand(0.5, 2)); }
        break;

      case 'tunnelWalk': {
        this.anim = 'walk';
        const arrived = this.moveToward(this.target, dt, true);
        if (arrived || this.timer <= 0) { tunnel.user = null; this.setState('idle', rand(0.5, 2)); this.idleTurn = rand(-1, 1); }
        break;
      }
    }

    // keep inside the tray
    if (!this.inWheel) {
      p.x = THREE.MathUtils.clamp(p.x, BOUNDS.minX, BOUNDS.maxX);
      p.z = THREE.MathUtils.clamp(p.z, BOUNDS.minZ, BOUNDS.maxZ);
      p.y = GROUND_Y;
    }

    this.root.rotation.y = this.heading;
    this.animate(dt, t);
  }

  animate(dt, t) {
    const P = this.parts, m = this.model;
    let bob = 0, roll = 0, legAmp = 0;
    if (this.anim === 'walk') { bob = Math.abs(Math.sin(this.phase)) * 0.06; roll = Math.sin(this.phase) * 0.06; legAmp = 0.14; }
    if (this.anim === 'run')  { bob = Math.abs(Math.sin(this.phase)) * 0.09; roll = Math.sin(this.phase) * 0.04; legAmp = 0.2; }

    // paws: diagonal pairs move together
    const s = Math.sin(this.phase), c = -s;
    [[0, s], [3, s], [1, c], [2, c]].forEach(([i, v]) => {
      const paw = P.paws[i];
      paw.position.z = paw.userData.baseZ + v * legAmp;
      paw.position.y = 0.1 + Math.max(0, v) * legAmp * 0.6;
    });

    // breathing when calm
    const calm = this.anim === 'idle' || this.anim === 'eat';
    const breathe = calm ? 1 + Math.sin(t * 3 + this.phase) * 0.025 : 1;
    P.body.scale.set(breathe, 0.85, 1.2 * breathe);

    // head nod while eating
    P.head.rotation.x = this.anim === 'eat' ? -0.25 + Math.sin(t * 9) * 0.2 : 0;

    // random ear twitch
    this.twitchTimer -= dt;
    if (this.twitchTimer <= 0) { this.twitch = 0.45; this.twitchTimer = rand(2, 6); this.twitchEar = pick(P.ears); }
    if (this.twitch > 0) {
      this.twitch -= dt;
      const base = this.twitchEar.userData.baseZ;
      this.twitchEar.rotation.z = base + (this.twitch > 0 ? Math.sin(this.twitch * 40) * 0.5 : 0);
    }

    // poke jump
    let jump = 0;
    if (this.jumpT > 0) { this.jumpT -= dt * 2; jump = Math.sin(Math.max(0, this.jumpT) * Math.PI) * 0.9; }

    m.position.y = bob + jump;
    m.rotation.z = roll;
  }
}

const HAMSTER_DEFS = [
  { name: 'Peanut', fur: 0xf5a54a, belly: 0xfff1dc },
  { name: 'Mochi',  fur: 0xfdf4e3, belly: 0xffffff },
  { name: 'Pebble', fur: 0x9aa3ad, belly: 0xe9edf1 },
  { name: 'Cocoa',  fur: 0x8a5a3c, belly: 0xd9b99b },
  { name: 'Butter', fur: 0xffd166, belly: 0xfff6d6 },
];
const hamsters = HAMSTER_DEFS.map(d => new Hamster(d));

// gentle separation so hamsters don't stack
function separateHamsters() {
  for (let i = 0; i < hamsters.length; i++) for (let j = i + 1; j < hamsters.length; j++) {
    const a = hamsters[i], b = hamsters[j];
    if (a.inWheel || b.inWheel) continue;
    const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z;
    const d = Math.hypot(dx, dz), minD = 1.0;
    if (d < minD && d > 1e-4) {
      const push = (minD - d) / 2, nx = dx / d, nz = dz / d;
      a.pos.x -= nx * push; a.pos.z -= nz * push;
      b.pos.x += nx * push; b.pos.z += nz * push;
    }
  }
}

// ---------------------------------------------------------------- interaction (click to poke)
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;   // it was a drag
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(hamsterMeshes, false);
  if (hits.length) hits[0].object.userData.hamster.poke();
});

// ---------------------------------------------------------------- status panel
const statusEl = document.getElementById('status');
function describe(h) {
  switch (h.state) {
    case 'idle': return 'looking around 👀';
    case 'walk': return { wheel: 'heading to the wheel', eat: 'heading to the bowl', tunnel: 'heading to the tunnel' }[h.next] || 'wandering 🚶';
    case 'enterWheel': return 'hopping on the wheel';
    case 'run': return 'running on the wheel 🌀';
    case 'exitWheel': return 'hopping off';
    case 'eat': return 'munching seeds 🌻';
    case 'tunnelWalk': return 'exploring the tunnel 🌿';
  }
  return '';
}
let statusTimer = 0;
function updateStatus() {
  statusEl.innerHTML = hamsters.map(h =>
    `<li><span class="dot" style="background:#${h.color.toString(16).padStart(6, '0')}"></span>` +
    `<span class="name">${h.name}</span><span>${describe(h)}</span></li>`).join('');
}

// ---------------------------------------------------------------- main loop
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  for (const h of hamsters) h.update(dt, t);
  separateHamsters();

  wheel.speed += (wheel.targetSpeed - wheel.speed) * Math.min(1, dt * 1.5);
  wheel.spin.rotation.x += wheel.speed * dt;

  updateBubbles(dt);
  statusTimer -= dt;
  if (statusTimer <= 0) { updateStatus(); statusTimer = 0.3; }

  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
