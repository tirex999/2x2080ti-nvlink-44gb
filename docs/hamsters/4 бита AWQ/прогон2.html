<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: rgba(255,255,255,0.75); backdrop-filter: blur(6px);
    padding: 10px 16px; border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    pointer-events: none;
  }
  #hud h1 { margin: 0; font-size: 17px; color: #5a4632; }
  #hud p  { margin: 4px 0 0; font-size: 12px; color: #8a7460; }
</style>
</head>
<body>
<div id="hud">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; The hamsters are up to something…</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   BASIC SETUP
============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe8ff);
scene.fog = new THREE.Fog(0xbfe8ff, 30, 70);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(11, 8.5, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI / 2 - 0.05;

/* Lights */
scene.add(new THREE.HemisphereLight(0xffffff, 0xffd9b3, 0.9));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.4);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 });
scene.add(sun);

/* Helpers */
const mat = (color, opts = {}) =>
  new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.9, ...opts });
const mesh = (geo, material, x = 0, y = 0, z = 0) => {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
};
const lerpAngle = (a, b, t) => {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
};

/* ============================================================
   TRAY + FLOOR
============================================================ */
const tray = new THREE.Group();
tray.add(mesh(new THREE.BoxGeometry(13, 0.8, 10), mat(0xf7c8e0), 0, -0.4, 0));      // pink plastic base
tray.add(mesh(new THREE.BoxGeometry(12.4, 0.2, 9.4), mat(0xf3e2c7), 0, 0.1, 0));     // wood-shaving bedding
tray.children.forEach(c => c.receiveShadow = true);
scene.add(tray);

// a cute round rug
const rug = mesh(new THREE.CylinderGeometry(2.2, 2.2, 0.06, 10), mat(0xa8d8ea), 1.5, 0.23, 1);
rug.castShadow = false;
scene.add(rug);

/* ============================================================
   CAGE (glass panels + metal bars)
============================================================ */
const cage = new THREE.Group();
const W = 13, D = 10, H = 5;                       // cage dimensions
const glassMat = new THREE.MeshLambertMaterial({
  color: 0xcdefff, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false
});
const barMat = mat(0x8a9bb0, { roughness: 0.4, metalness: 0.5 });

// glass panels
[[W, 0, -D/2, 0], [W, 0, D/2, 0], [D, -W/2, 0, Math.PI/2], [D, W/2, 0, Math.PI/2]]
.forEach(([size, x, z, ry]) => {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(size, H), glassMat);
  p.position.set(x, H/2, z);
  p.rotation.y = ry;
  cage.add(p);
});

// metal frame: corner posts + top/bottom rails + vertical bars
const barGeo = new THREE.CylinderGeometry(0.045, 0.045, H, 5);
for (const sx of [-1, 1]) for (const sz of [-1, 1])
  cage.add(mesh(barGeo, barMat, sx*W/2, H/2, sz*D/2));
const railX = new THREE.BoxGeometry(W + 0.2, 0.14, 0.14);
const railZ = new THREE.BoxGeometry(0.14, 0.14, D + 0.2);
for (const y of [0.07, H]) {
  for (const sz of [-1, 1]) cage.add(mesh(railX, barMat, 0, y, sz*D/2));
  for (const sx of [-1, 1]) cage.add(mesh(railZ, barMat, sx*W/2, y, 0));
}
for (let x = -W/2 + 2; x < W/2; x += 2) {          // vertical bars on front/back walls
  cage.add(mesh(barGeo, barMat, x, H/2, -D/2));
  cage.add(mesh(barGeo, barMat, x, H/2,  D/2));
}
for (let z = -D/2 + 2; z < D/2; z += 2) {          // vertical bars on side walls
  cage.add(mesh(barGeo, barMat, -W/2, H/2, z));
  cage.add(mesh(barGeo, barMat,  W/2, H/2, z));
}
scene.add(cage);

/* ============================================================
   PLAYGROUND OBJECTS
============================================================ */
// --- Exercise wheel (interactive) ---
const WHEEL_POS = new THREE.Vector3(4.6, 0, -3.2);
const WHEEL_R = 1.0;
const wheel = new THREE.Group();
const wheelSpin = new THREE.Group();
wheelSpin.add(mesh(new THREE.TorusGeometry(WHEEL_R, 0.07, 8, 22), mat(0xf78fb3), 0, 0, 0))
  .children[0].rotation.y = Math.PI / 2;                       // ring in YZ plane
for (let k = 0; k < 5; k++) {                                  // spokes
  const a = k * Math.PI * 2 / 5;
  const dir = new THREE.Vector3(0, Math.cos(a), Math.sin(a));
  const spoke = mesh(new THREE.CylinderGeometry(0.04, 0.04, WHEEL_R, 5), mat(0xf78fb3));
  spoke.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  spoke.position.copy(dir).multiplyScalar(WHEEL_R / 2);
  wheelSpin.add(spoke);
}
wheelSpin.add(mesh(new THREE.SphereGeometry(0.12, 6, 5), mat(0xf27ba0)));             // hub
wheelSpin.position.y = WHEEL_R;
wheel.add(wheelSpin);
for (const sx of [-0.35, 0.35])                                 // stand legs
  wheel.add(mesh(new THREE.CylinderGeometry(0.06, 0.06, WHEEL_R, 5), barMat, sx, WHEEL_R/2, 0));
wheel.add(mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.9, 5), barMat, 0, WHEEL_R, 0))
  .children.at(-1).rotation.z = Math.PI / 2;                    // axle
wheel.position.copy(WHEEL_POS);
scene.add(wheel);

// --- Tunnel (hamsters can waddle through it!) ---
const tunnel = mesh(new THREE.CylinderGeometry(0.65, 0.65, 2, 8, 1, true, Math.PI, Math.PI),
  mat(0x9fd67a, { side: THREE.DoubleSide }), 0, 0.65, -3);
tunnel.rotation.z = -Math.PI / 2;
scene.add(tunnel);

// --- Food bowl ---
const BOWL_POS = new THREE.Vector3(-4.5, 0, 2.6);
const bowl = new THREE.Group();
bowl.add(mesh(new THREE.CylinderGeometry(0.55, 0.4, 0.25, 9), mat(0xf7b733), 0, 0.12, 0));
for (let i = 0; i < 7; i++) {                                  // kibble
  const a = Math.random() * Math.PI * 2, r = Math.random() * 0.3;
  bowl.add(mesh(new THREE.IcosahedronGeometry(0.07, 0), mat(0x8a5a2b),
    Math.cos(a)*r, 0.26, Math.sin(a)*r));
}
bowl.position.copy(BOWL_POS);
scene.add(bowl);

// --- Water bottle on the back wall ---
const bottle = new THREE.Group();
bottle.add(mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.9, 8),
  mat(0x7ec8f7, { transparent: true, opacity: 0.7 }), 0, 0.45, 0));
bottle.add(mesh(new THREE.ConeGeometry(0.12, 0.3, 8), mat(0xcccccc), 0, -0.1, 0))
  .children.at(-1).rotation.x = Math.PI;
bottle.position.set(2.5, 2.4, -4.75);
scene.add(bottle);

// --- Scenery: balls & hay tufts ---
[0xf78fb3, 0xa8d8ea, 0xf7b733].forEach((c, i) => {
  const b = mesh(new THREE.IcosahedronGeometry(0.18, 0), mat(c),
    -1.5 + i * 1.4, 0.25, 3.2 - i * 0.8);
  b.rotation.set(Math.random(), Math.random(), Math.random());
  scene.add(b);
});
for (let i = 0; i < 8; i++) {
  const x = (Math.random() - 0.5) * 10, z = (Math.random() - 0.5) * 7;
  const tuft = new THREE.Group();
  for (let j = 0; j < 5; j++) {
    const blade = mesh(new THREE.ConeGeometry(0.03, 0.3, 4), mat(0xd9b26a));
    blade.position.set((Math.random()-0.5)*0.15, 0.15, (Math.random()-0.5)*0.15);
    blade.rotation.set((Math.random()-0.5)*0.5, 0, (Math.random()-0.5)*0.5);
    tuft.add(blade);
  }
  tuft.position.set(x, 0.2, z);
  scene.add(tuft);
}

/* ============================================================
   HAMSTERS
============================================================ */
function createHamster(bodyColor, bellyColor, cheekColor) {
  const g = new THREE.Group();

  const body = mesh(new THREE.SphereGeometry(0.5, 7, 5), mat(bodyColor));
  body.scale.set(0.9, 0.8, 1.05);
  body.position.y = 0.45;
  g.add(body);

  const belly = mesh(new THREE.SphereGeometry(0.3, 6, 5), mat(bellyColor));
  belly.scale.set(0.8, 0.7, 0.6);
  belly.position.set(0, 0.35, 0.35);
  g.add(belly);

  const head = new THREE.Group();
  head.add(mesh(new THREE.SphereGeometry(0.38, 7, 5), mat(bodyColor)));
  head.add(mesh(new THREE.SphereGeometry(0.06, 6, 5), mat(0xf27ba0), 0, -0.02, 0.36)); // nose
  const eyes = [];
  for (const s of [-1, 1]) {
    const eye = mesh(new THREE.SphereGeometry(0.05, 6, 5), mat(0x2b2b2b, { roughness: 0.3 }));
    eye.position.set(0.15 * s, 0.08, 0.32);
    head.add(eye);
    eyes.push(eye);
    const cheek = mesh(new THREE.SphereGeometry(0.09, 6, 5), mat(cheekColor));
    cheek.scale.set(1, 0.7, 0.5);
    cheek.position.set(0.22 * s, -0.08, 0.26);
    head.add(cheek);
    const ear = mesh(new THREE.ConeGeometry(0.11, 0.2, 5), mat(bodyColor));
    ear.position.set(0.18 * s, 0.34, -0.05);
    ear.rotation.z = -0.3 * s;
    head.add(ear);
  }
  head.position.set(0, 0.62, 0.42);
  g.add(head);

  return { group: g, head, eyes };
}

const HAMSTER_LOOKS = [
  [0xf5a25a, 0xfde8cf, 0xf2b8d0],   // orange
  [0xb9b2ad, 0xf0ede9, 0xe8a8c8],   // grey
  [0xf7f0e6, 0xffffff, 0xf2b8d0],   // cream
];

const hamsters = HAMSTER_LOOKS.map((look, i) => {
  const h = createHamster(...look);
  const x = (i - 1) * 3, z = i === 1 ? 1 : -1;
  h.group.position.set(x, 0.08, z);
  h.group.rotation.y = Math.random() * Math.PI * 2;
  scene.add(h.group);
  return {
    ...h,
    yaw: h.group.rotation.y,
    state: 'wander',
    target: new THREE.Vector3(x, 0, z),
    timer: 1 + Math.random() * 2,
    walkPhase: Math.random() * 10,
    wheelAngle: 0,
    nextBlink: 2 + Math.random() * 4,
    blink: 0,
    speed: 1.4 + Math.random() * 0.5,
  };
});

let wheelOwner = null, bowlOwner = null;

/* --- Behavior helpers --- */
function randomPoint() {
  return new THREE.Vector3(
    (Math.random() * 2 - 1) * 5.4,
    0,
    (Math.random() * 2 - 1) * 4.2
  );
}

function chooseNextAction(h) {
  const r = Math.random();
  if (r < 0.55) {
    h.state = 'wander';
    h.target = randomPoint();
  } else if (r < 0.75) {
    h.state = 'pause';
    h.timer = 1 + Math.random() * 2.5;
  } else if (r < 0.87 && !bowlOwner) {
    h.state = 'toBowl';
    bowlOwner = h;
    h.target = new THREE.Vector3(BOWL_POS.x, 0, BOWL_POS.z + 0.9);
  } else if (!wheelOwner) {
    h.state = 'toWheel';
    wheelOwner = h;
    h.target = new THREE.Vector3(WHEEL_POS.x, 0, WHEEL_POS.z + WHEEL_R);
  } else {
    h.state = 'wander';
    h.target = randomPoint();
  }
}

function moveTo(h, dt) {
  const v = new THREE.Vector3().subVectors(h.target, h.group.position);
  v.y = 0;
  const dist = v.length();
  if (dist < 0.15) return true;
  v.normalize();
  h.group.position.addScaledVector(v, h.speed * dt);
  h.yaw = lerpAngle(h.yaw, Math.atan2(v.x, v.z), Math.min(1, dt * 8));
  h.group.rotation.y = h.yaw;
  h.walkPhase += dt * 12;
  h.group.position.y = 0.08 + Math.abs(Math.sin(h.walkPhase)) * 0.07;
  h.group.rotation.z = Math.sin(h.walkPhase) * 0.06;
  return false;
}

function updateHamster(h, dt, t) {
  switch (h.state) {

    case 'wander':
      if (moveTo(h, dt)) chooseNextAction(h);
      break;

    case 'pause':
      h.timer -= dt;
      h.group.position.y = 0.08 + Math.sin(t * 3 + h.yaw) * 0.02;   // idle breathing
      h.group.rotation.z *= 0.9;
      if (h.timer <= 0) chooseNextAction(h);
      break;

    case 'toBowl':
      if (moveTo(h, dt)) {
        h.state = 'eat';
        h.timer = 2.5 + Math.random() * 2;
        h.yaw = Math.atan2(BOWL_POS.x - h.group.position.x, BOWL_POS.z - h.group.position.z);
      }
      break;

    case 'eat':
      h.group.rotation.y = lerpAngle(h.group.rotation.y, h.yaw, dt * 6);
      h.timer -= dt;
      const munch = Math.sin(t * 12);
      h.head.position.y = 0.62 + munch * 0.05;                       // chomp-chomp
      const s = 1 + Math.sin(t * 10) * 0.04;
      h.group.scale.set(s, s, s);                                    // chubby munch
      if (h.timer <= 0) {
        h.group.scale.set(1, 1, 1);
        h.head.position.y = 0.62;
        bowlOwner = null;
        h.state = 'wander';
        h.target = randomPoint();
      }
      break;

    case 'toWheel':
      if (moveTo(h, dt)) {
        h.state = 'wheel';
        h.wheelAngle = Math.PI / 2;                                   // start at front of wheel
        h.timer = Math.PI * (1.5 + Math.random());                    // 1–2.5 laps
      }
      break;

    case 'wheel': {
      h.wheelAngle += dt * 2.2;                                       // run around the rim
      h.timer -= dt * 2.2;
      const a = h.wheelAngle;
      h.group.position.set(
        WHEEL_POS.x,
        WHEEL_R + WHEEL_R * Math.cos(a) + Math.abs(Math.sin(t * 15)) * 0.05,  // little bounce
        WHEEL_POS.z + WHEEL_R * Math.sin(a)
      );
      h.group.rotation.y = Math.cos(a) > 0 ? 0 : Math.PI;             // face travel direction
      h.group.rotation.z = 0.15 * Math.sin(t * 15);
      wheelSpin.rotation.x = a - Math.PI / 2;                         // wheel spins with hamster
      if (h.timer <= 0) {                                             // hop back off at the front
        wheelOwner = null;
        h.state = 'wander';
        h.target = randomPoint();
      }
      break;
    }
  }

  // blinking
  if (h.blink > 0) {
    h.blink -= dt;
    h.eyes.forEach(e => e.scale.y = 0.15);
  } else if (t > h.nextBlink) {
    h.blink = 0.15;
    h.nextBlink = t + 2 + Math.random() * 4;
    h.eyes.forEach(e => e.scale.y = 1);
  }
}

/* ============================================================
   MAIN LOOP
============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  hamsters.forEach(h => updateHamster(h, dt, t));

  // wheel coasts to a stop when nobody's riding it
  if (!wheelOwner) wheelSpin.rotation.x *= 0.96;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
