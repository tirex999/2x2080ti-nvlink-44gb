<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe9f2; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
    color: #7a4a2b; user-select: none; pointer-events: none;
  }
  #hud h1 { margin: 0; font-size: 22px; text-shadow: 0 2px 0 rgba(255,255,255,.7); }
  #hud p  { margin: 4px 0 0; font-size: 13px; opacity: .85; }
</style>
</head>
<body>
<div id="hud">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; Watch them nap, wander &amp; run the wheel!</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   SETUP
============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe9f2);
scene.fog = new THREE.Fog(0xffe9f2, 30, 60);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---- Lights: warm & soft ---- */
scene.add(new THREE.HemisphereLight(0xfff3e0, 0xffc9de, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;  sun.shadow.camera.bottom = -12;
scene.add(sun);

/* ============================================================
   CAGE: tray, wood rim, glass walls
============================================================ */
const TRAY = 15;          // tray size
const HALF = TRAY / 2 - 0.6; // hamster roaming bound

function flatMat(c) { return new THREE.MeshLambertMaterial({ color: c }); }

// floor tray
const tray = new THREE.Mesh(new THREE.BoxGeometry(TRAY, 0.5, TRAY), flatMat(0xf7d9a8));
tray.position.y = -0.25;
tray.receiveShadow = true;
scene.add(tray);

// wood rim
const rimMat = flatMat(0xb07b4f);
[[0,-HALF-0.4,TRAY+0.8,0.8],[0,HALF+0.4,TRAY+0.8,0.8],
 [-HALF-0.4,0,0.8,TRAY+0.8],[HALF+0.4,0,0.8,TRAY+0.8]].forEach(([x,z,w,d])=>{
  const bar = new THREE.Mesh(new THREE.BoxGeometry(w, 0.9, d), rimMat);
  bar.position.set(x, 0.2, z);
  bar.castShadow = true; bar.receiveShadow = true;
  scene.add(bar);
});

// glass walls (subtle)
const glass = new THREE.Mesh(
  new THREE.BoxGeometry(TRAY, 4.5, TRAY),
  new THREE.MeshLambertMaterial({ color: 0xcfefff, transparent: true, opacity: 0.12, depthWrite: false })
);
glass.position.y = 2.25;
scene.add(glass);

// bedding dots for charm
for (let i = 0; i < 40; i++) {
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.08 + Math.random()*0.08, 5, 4),
    flatMat([0xffe08a, 0xffb3c6, 0xa8e6cf][i % 3]));
  dot.position.set((Math.random()-0.5)*(TRAY-1.5), 0.05, (Math.random()-0.5)*(TRAY-1.5));
  scene.add(dot);
}

/* ============================================================
   TOYS
============================================================ */
// --- Exercise wheel (interactive!) ---
const wheelGroup = new THREE.Group();
const wheelRim = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.12, 6, 18), flatMat(0x7ec8e3));
const spokes = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.2, 5), flatMat(0xffffff));
spokes.rotation.x = Math.PI / 2;
wheelGroup.add(wheelRim, spokes);
// stand
const stand = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.4, 0.4), flatMat(0xb07b4f));
stand.position.y = 0.7;
const standBase = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.25, 1.4), flatMat(0xb07b4f));
standBase.position.y = 0.12;
wheelGroup.add(stand, standBase);
wheelRim.castShadow = true;
wheelGroup.position.set(-5.2, 1.1, 0);
scene.add(wheelGroup);
const WHEEL_TARGET = new THREE.Vector3(-3.9, 0, 0); // where a hamster goes to ride

// --- Tunnel ---
const tunnel = new THREE.Mesh(
  new THREE.CylinderGeometry(0.8, 0.8, 3, 10, 1, true, 0, Math.PI),
  new THREE.MeshLambertMaterial({ color: 0xff8fab, side: THREE.DoubleSide })
);
tunnel.rotation.z = Math.PI / 2;
tunnel.position.set(3.5, 0.8, 3.5);
tunnel.rotation.y = -0.6;
tunnel.castShadow = true;
scene.add(tunnel);

// --- Food bowl + pellets ---
const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.45, 0.35, 8), flatMat(0x9b5de5));
bowl.position.set(4.5, 0.18, -3.5);
bowl.castShadow = true;
scene.add(bowl);
for (let i = 0; i < 7; i++) {
  const pellet = new THREE.Mesh(new THREE.SphereGeometry(0.12, 5, 4), flatMat(0xffd166));
  pellet.position.set(4.5 + (Math.random()-0.5)*0.6, 0.35, -3.5 + (Math.random()-0.5)*0.6);
  scene.add(pellet);
}

/* ============================================================
   HAMSTERS  (low-poly, cute, bouncy)
============================================================ */
function makeHamster(bodyColor, bellyColor) {
  const g = new THREE.Group();
  const bm = flatMat(bodyColor), pm = flatMat(bellyColor);

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 7, 6), bm);
  body.scale.set(1.15, 0.95, 1.05); body.position.y = 0.45;
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.42, 7, 6), pm);
  belly.scale.set(0.9, 0.7, 0.9); belly.position.set(0, 0.38, 0.18);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 7, 6), bm);
  head.position.set(0, 0.55, 0.55);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 4), flatMat(0xff7eb6));
  nose.position.set(0, 0.5, 0.88);
  const eyeGeo = new THREE.SphereGeometry(0.06, 5, 4), eyeMat = flatMat(0x2b2b2b);
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.16, 0.62, 0.78);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set( 0.16, 0.62, 0.78);
  const earGeo = new THREE.SphereGeometry(0.13, 5, 4);
  const earL = new THREE.Mesh(earGeo, bm); earL.position.set(-0.24, 0.86, 0.45);
  const earR = new THREE.Mesh(earGeo, bm); earR.position.set( 0.24, 0.86, 0.45);
  const cheekGeo = new THREE.SphereGeometry(0.14, 5, 4), cheekMat = flatMat(0xffc9a3);
  const cheekL = new THREE.Mesh(cheekGeo, cheekMat); cheekL.position.set(-0.26, 0.48, 0.62);
  const cheekR = new THREE.Mesh(cheekGeo, cheekMat); cheekR.position.set( 0.26, 0.48, 0.62);
  const footGeo = new THREE.SphereGeometry(0.11, 5, 4), footMat = flatMat(0xffc9a3);
  [[-0.2,0.1,0.35],[0.2,0.1,0.35],[-0.22,0.1,-0.35],[0.22,0.1,-0.35]].forEach(p=>{
    const f = new THREE.Mesh(footGeo, footMat); f.position.set(...p); g.add(f);
  });
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.08, 4, 4), bm);
  tail.position.set(0, 0.4, -0.6);

  [body, belly, head, nose, eyeL, eyeR, earL, earR, cheekL, cheekR, tail]
    .forEach(m => { m.castShadow = true; g.add(m); });

  return { group: g, body, head };
}

const hamsterDefs = [
  { body: 0xffb347, belly: 0xfff1d6 }, // golden
  { body: 0xf9f3ef, belly: 0xffe0ec }, // snow white
  { body: 0xd9a066, belly: 0xf5deb3 }, // cinnamon
];

const hamsters = hamsterDefs.map(def => {
  const { group, body, head } = makeHamster(def.body, def.belly);
  group.position.set((Math.random()-0.5)*8, 0, (Math.random()-0.5)*8);
  scene.add(group);
  return {
    group, body, head,
    heading: Math.random() * Math.PI * 2,
    speed: 1.2 + Math.random() * 0.8,
    mode: 'walk',            // walk | pause | wheel
    timer: 1 + Math.random() * 3,
    bobPhase: Math.random() * 10,
    ridingWheel: false,
  };
});

/* ============================================================
   BEHAVIOR
============================================================ */
function updateHamster(h, dt, t) {
  h.timer -= dt;
  let moving = false;

  if (h.mode === 'walk') {
    moving = true;
    h.group.position.x += Math.sin(h.heading) * h.speed * dt;
    h.group.position.z += Math.cos(h.heading) * h.speed * dt;
    // bounce off walls
    if (Math.abs(h.group.position.x) > HALF) { h.group.position.x = Math.sign(h.group.position.x)*HALF; h.heading = Math.PI - h.heading; }
    if (Math.abs(h.group.position.z) > HALF) { h.group.position.z = Math.sign(h.group.position.z)*HALF; h.heading = -h.heading; }
    if (h.timer <= 0) {
      // pick next mood
      const r = Math.random();
      if (r < 0.35)      { h.mode = 'pause'; h.timer = 1 + Math.random()*2.5; }
      else if (r < 0.55) { h.mode = 'wheel'; h.timer = 10; }
      else               { h.mode = 'walk';  h.timer = 2 + Math.random()*3;
                            h.heading += (Math.random()-0.5)*2.2; }
    }
  }
  else if (h.mode === 'pause') {
    if (h.timer <= 0) { h.mode = 'walk'; h.timer = 2 + Math.random()*3; }
  }
  else if (h.mode === 'wheel') {
    const dx = WHEEL_TARGET.x - h.group.position.x;
    const dz = WHEEL_TARGET.z - h.group.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 0.6) {
      moving = true;
      const want = Math.atan2(dx, dz);
      // smooth turn toward target
      let diff = want - h.heading;
      while (diff >  Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;
      h.heading += diff * Math.min(1, dt * 5);
      h.group.position.x += Math.sin(h.heading) * h.speed * dt;
      h.group.position.z += Math.cos(h.heading) * h.speed * dt;
    } else {
      h.ridingWheel = true;
      h.heading = Math.atan2(WHEEL_TARGET.x - h.group.position.x, WHEEL_TARGET.z - h.group.position.z);
      if (h.timer <= 0) { h.mode = 'walk'; h.ridingWheel = false; h.timer = 2 + Math.random()*3; }
    }
  }

  // face movement direction
  h.group.rotation.y = h.heading;

  // squash & stretch bob
  const bob = moving ? Math.sin(t * 12 + h.bobPhase) : Math.sin(t * 3 + h.bobPhase) * 0.05;
  h.body.scale.y = 0.95 + bob * 0.08;
  h.body.position.y = 0.45 + Math.abs(bob) * 0.06;
  h.head.rotation.z = moving ? Math.sin(t * 12 + h.bobPhase) * 0.1 : 0;
  h.head.rotation.x = h.ridingWheel ? Math.sin(t * 10) * 0.15 : 0;
}

/* ============================================================
   SIMPLE ORBIT CONTROLS (drag to rotate, scroll to zoom)
============================================================ */
let theta = 0.8, phi = 1.15, radius = 18;
let dragging = false, px = 0, py = 0;

renderer.domElement.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  theta -= (e.clientX - px) * 0.005;
  phi   -= (e.clientY - py) * 0.005;
  phi = Math.max(0.35, Math.min(1.45, phi));
  px = e.clientX; py = e.clientY;
});
addEventListener('wheel', e => {
  radius = Math.max(8, Math.min(35, radius + e.deltaY * 0.015));
}, { passive: true });

/* ============================================================
   MAIN LOOP
============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  hamsters.forEach(h => updateHamster(h, dt, t));

  // wheel spins if any hamster is riding it
  const anyoneRiding = hamsters.some(h => h.ridingWheel);
  wheelGroup.children[0].rotation.x += dt * (anyoneRiding ? 8 : 0.15); // slow idle drift
  wheelGroup.children[1].rotation.x += dt * (anyoneRiding ? 8 : 0.15);

  // camera
  camera.position.set(
    radius * Math.sin(phi) * Math.sin(theta),
    radius * Math.cos(phi) + 1,
    radius * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(0, 1, 0);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
