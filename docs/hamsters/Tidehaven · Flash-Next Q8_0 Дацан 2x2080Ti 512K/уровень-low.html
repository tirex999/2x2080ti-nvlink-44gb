<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidehaven</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; }
#canvas-container { width: 100vw; height: 100vh; }
canvas { display: block; }

/* Title */
#title-panel {
  position: fixed; top: 20px; left: 20px; z-index: 100;
  color: #fff; pointer-events: none;
}
#title-panel h1 {
  font-size: 2rem; font-weight: 300; letter-spacing: 4px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  margin-bottom: 4px;
}
#title-panel p {
  font-size: 0.85rem; opacity: 0.7; letter-spacing: 1px;
  font-weight: 300;
}

/* Control Panels */
.panel {
  position: fixed; z-index: 100;
  background: rgba(15, 20, 35, 0.75);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 14px 16px;
  color: #e0e0e0; font-size: 0.8rem;
  transition: all 0.3s ease;
}
.panel h3 {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px;
  margin-bottom: 10px; opacity: 0.6; font-weight: 500;
}

#controls-left {
  left: 20px; bottom: 20px; max-width: 220px;
}
#controls-right {
  right: 20px; bottom: 20px; max-width: 220px;
}
#controls-cam {
  right: 20px; top: 20px;
}

/* Buttons */
.btn {
  display: inline-block; padding: 7px 14px; margin: 3px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px; color: #ddd; font-size: 0.75rem;
  cursor: pointer; transition: all 0.2s ease; user-select: none;
}
.btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
.btn.active { background: rgba(100,200,255,0.2); border-color: rgba(100,200,255,0.5); color: #8df; }

/* Sliders */
.slider-row { display: flex; align-items: center; margin: 6px 0; gap: 8px; }
.slider-row label { min-width: 45px; font-size: 0.7rem; opacity: 0.7; }
.slider-row input[type="range"] {
  flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
  background: rgba(255,255,255,0.15); border-radius: 2px; outline: none;
}
.slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  background: #6cc; border-radius: 50%; cursor: pointer;
}

/* Mobile collapse */
.panel-toggle {
  display: none; position: absolute; top: 8px; right: 10px;
  background: none; border: none; color: #aaa; font-size: 1.2rem;
  cursor: pointer; padding: 4px;
}
@media (max-width: 768px) {
  .panel-toggle { display: block; }
  .panel.collapsed .panel-content { display: none; }
  .panel { padding: 10px 12px; }
  #title-panel h1 { font-size: 1.4rem; }
  #controls-left, #controls-right { max-width: 180px; }
}

/* Loading */
#loading {
  position: fixed; inset: 0; background: #1a1a2e;
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; transition: opacity 0.8s ease;
}
#loading.hidden { opacity: 0; pointer-events: none; }
#loading span { color: #6cc; font-size: 1.2rem; letter-spacing: 3px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div id="loading"><span>TIDEHAVEN</span></div>
<div id="canvas-container"></div>

<div id="title-panel">
  <h1>Tidehaven</h1>
  <p>A cozy coastal diorama</p>
</div>

<div class="panel" id="controls-left">
  <button class="panel-toggle">−</button>
  <h3>Environment</h3>
  <div class="panel-content">
    <div class="slider-row">
      <label>Tide</label>
      <input type="range" id="tide-slider" min="0" max="100" value="50">
    </div>
    <div class="slider-row">
      <label>Wind</label>
      <input type="range" id="wind-slider" min="0" max="100" value="30">
    </div>
    <div style="margin-top:8px;">
      <button class="btn active" id="btn-day">Day</button>
      <button class="btn" id="btn-sunset">Sunset</button>
      <button class="btn" id="btn-night">Night</button>
    </div>
    <div style="margin-top:8px;">
      <button class="btn" id="btn-pause">⏸ Pause</button>
      <button class="btn" id="btn-reset">↺ Reset</button>
    </div>
  </div>
</div>

<div class="panel" id="controls-right">
  <button class="panel-toggle">−</button>
  <h3>Actions</h3>
  <div class="panel-content">
    <button class="btn" id="btn-kayak">🛶 Launch Kayak</button>
    <button class="btn" id="btn-ray">🐟 Ray Leap</button>
    <div style="margin-top:10px;">
      <button class="btn" id="btn-music">♪ Music</button>
    </div>
    <div class="slider-row">
      <label>Volume</label>
      <input type="range" id="volume-slider" min="0" max="100" value="60">
    </div>
  </div>
</div>

<div class="panel" id="controls-cam">
  <button class="panel-toggle">−</button>
  <h3>Camera</h3>
  <div class="panel-content">
    <button class="btn active" id="cam-iso">Isometric</button>
    <button class="btn" id="cam-cabin">Cabin</button>
    <button class="btn" id="cam-under">Underwater</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// GLOBALS & STATE
// ============================================================
let scene, camera, renderer, controls, clock;
let paused = false;
let timeOfDay = 'day'; // 'day', 'sunset', 'night'
let tideLevel = 0.5;
let windStrength = 0.3;
let kayakState = 'moored'; // 'moored', 'launching', 'cruising', 'returning'
let kayakProgress = 0;
let rayLeaping = false;
let rayLeapTime = 0;
let musicOn = false;
let audioCtx = null;
let gainNode = null;
let musicGain = null;
let windGain = null;
let waterGain = null;
let musicStarted = false;

// Scene objects
let waterSurface, waterVolume, dioramaBase;
let kayak, kayakGroup;
let rays = [];
let fishSchools = [];
let trees = [];
let plants = [];
let lanterns = [];
let cabinWindows = [];
let bubbles = [];
let ripples = [];
let droplets = [];
let causticMesh;

// Lighting
let ambientLight, dirLight, hemiLight;
let cabinLight, lanternLights = [];

// Camera presets
const camPresets = {
  iso: { pos: new THREE.Vector3(12, 10, 12), target: new THREE.Vector3(0, 1, 0) },
  cabin: { pos: new THREE.Vector3(3, 3.5, 5), target: new THREE.Vector3(-1, 2, 0) },
  under: { pos: new THREE.Vector3(4, -1.5, 4), target: new THREE.Vector3(0, -1, 0) }
};
let currentCam = 'iso';
let camTransition = null;

// Water level
const baseWaterY = 0.3;
const tideRange = 0.4;

// ============================================================
// INITIALIZATION
// ============================================================
function init() {
  clock = new THREE.Clock();
  
  // Scene
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);
  
  // Camera
  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.copy(camPresets.iso.pos);
  
  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.getElementById('canvas-container').appendChild(renderer.domElement);
  
  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(camPresets.iso.target);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI * 0.85;
  controls.minDistance = 4;
  controls.maxDistance = 30;
  controls.update();
  
  // Build scene
  setupLighting();
  createDiorama();
  createIsland();
  createCabin();
  createPier();
  createWater();
  createUnderwaterLife();
  createDetails();
  createSkyDome();
  
  // Events
  setupUI();
  window.addEventListener('resize', onResize);
  
  // Start
  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
  }, 800);
  
  animate();
}

// ============================================================
// LIGHTING
// ============================================================
function setupLighting() {
  ambientLight = new THREE.AmbientLight(0x404060, 0.4);
  scene.add(ambientLight);
  
  hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x8B7355, 0.5);
  scene.add(hemiLight);
  
  dirLight = new THREE.DirectionalLight(0xfff5e0, 1.2);
  dirLight.position.set(8, 12, 6);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(2048, 2048);
  dirLight.shadow.camera.near = 1;
  dirLight.shadow.camera.far = 40;
  dirLight.shadow.camera.left = -12;
  dirLight.shadow.camera.right = 12;
  dirLight.shadow.camera.top = 12;
  dirLight.shadow.camera.bottom = -12;
  dirLight.shadow.bias = -0.001;
  scene.add(dirLight);
  
  // Cabin warm light
  cabinLight = new THREE.PointLight(0xffaa44, 0, 5);
  cabinLight.position.set(-1, 2.5, 0.5);
  scene.add(cabinLight);
}

// ============================================================
// SKY DOME
// ============================================================
function createSkyDome() {
  const skyGeo = new THREE.SphereGeometry(45, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.6);
  const skyMat = new THREE.MeshBasicMaterial({
    color: 0x87CEEB,
    side: THREE.BackSide,
    transparent: true,
    opacity: 0.6
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  sky.position.y = -2;
  sky.name = 'sky';
  scene.add(sky);
}

// ============================================================
// DIORAMA BASE (the "aquarium" structure)
// ============================================================
function createDiorama() {
  // Base platform - wooden display stand
  const baseGeo = new THREE.BoxGeometry(10, 0.6, 10);
  const baseMat = new THREE.MeshStandardMaterial({ color: 0x5C3A1E, roughness: 0.8 });
  dioramaBase = new THREE.Mesh(baseGeo, baseMat);
  dioramaBase.position.y = -3.3;
  dioramaBase.receiveShadow = true;
  scene.add(dioramaBase);
  
  // Glass walls (front and right side)
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.08,
    roughness: 0.05,
    metalness: 0.0,
    transmission: 0.9,
    thickness: 0.1,
    side: THREE.DoubleSide
  });
  
  // Front glass
  const frontGlass = new THREE.Mesh(new THREE.PlaneGeometry(10, 6.5), glassMat);
  frontGlass.position.set(0, -0.05, 5);
  frontGlass.receiveShadow = false;
  scene.add(frontGlass);
  
  // Right glass
  const rightGlass = new THREE.Mesh(new THREE.PlaneGeometry(10, 6.5), glassMat);
  rightGlass.position.set(5, -0.05, 0);
  rightGlass.rotation.y = -Math.PI / 2;
  scene.add(rightGlass);
  
  // Back wall (solid)
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a4a5a, roughness: 0.9 });
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(10, 6.5, 0.15), wallMat);
  backWall.position.set(0, -0.05, -5);
  scene.add(backWall);
  
  // Left wall (solid)
  const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.15, 6.5, 10), wallMat);
  leftWall.position.set(-5, -0.05, 0);
  scene.add(leftWall);
  
  // Top rim
  const rimMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.7 });
  const rimGeo = new THREE.BoxGeometry(10.2, 0.12, 0.2);
  const rim1 = new THREE.Mesh(rimGeo, rimMat);
  rim1.position.set(0, 3.15, 5);
  scene.add(rim1);
  const rim2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.12, 10.2), rimMat);
  rim2.position.set(5, 3.15, 0);
  scene.add(rim2);
}

// ============================================================
// ISLAND
// ============================================================
function createIsland() {
  // Main island body - layered terrain
  const islandGroup = new THREE.Group();
  
  // Underwater base (sandy cone)
  const baseGeo = new THREE.ConeGeometry(4.5, 5, 32, 8);
  const sandMat = new THREE.MeshStandardMaterial({ color: 0xD4B896, roughness: 0.9 });
  const base = new THREE.Mesh(baseGeo, sandMat);
  base.position.y = -2.5;
  base.receiveShadow = true;
  islandGroup.add(base);
  
  // Sandy shore ring
  const shoreGeo = new THREE.CylinderGeometry(3.8, 4.2, 0.6, 32, 1);
  const shoreMat = new THREE.MeshStandardMaterial({ color: 0xE8D5A3, roughness: 0.85 });
  const shore = new THREE.Mesh(shoreGeo, shoreMat);
  shore.position.y = 0.1;
  shore.receiveShadow = true;
  islandGroup.add(shore);
  
  // Upper island (grass)
  const grassGeo = new THREE.CylinderGeometry(2.8, 3.5, 0.8, 24, 1);
  const grassMat = new THREE.MeshStandardMaterial({ color: 0x5B8C3E, roughness: 0.8 });
  const grass = new THREE.Mesh(grassGeo, grassMat);
  grass.position.y = 0.7;
  grass.receiveShadow = true;
  grass.castShadow = true;
  islandGroup.add(grass);
  
  // Hill top
  const hillGeo = new THREE.SphereGeometry(1.8, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.4);
  const hillMat = new THREE.MeshStandardMaterial({ color: 0x4A7A32, roughness: 0.85 });
  const hill = new THREE.Mesh(hillGeo, hillMat);
  hill.position.set(-0.5, 0.9, -0.3);
  hill.scale.y = 0.6;
  hill.castShadow = true;
  islandGroup.add(hill);
  
  // Rocks
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x7A7A72, roughness: 0.95 });
  const rockGeo = new THREE.DodecahedronGeometry(0.3, 1);
  const rockPositions = [
    [2.5, 0.2, 1.5], [-2.8, 0.1, 1.2], [1.8, 0.15, -2.5],
    [-1.5, 0.2, 2.8], [3.2, -0.1, -0.5], [-3.0, 0.0, -1.8],
    [0.5, 0.1, 3.2], [-2.2, 0.15, -2.5]
  ];
  rockPositions.forEach(pos => {
    const rock = new THREE.Mesh(rockGeo, rockMat);
    rock.position.set(...pos);
    rock.scale.set(0.7 + Math.random() * 0.8, 0.5 + Math.random() * 0.6, 0.7 + Math.random() * 0.8);
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    rock.castShadow = true;
    rock.receiveShadow = true;
    islandGroup.add(rock);
  });
  
  // Trees
  createTrees(islandGroup);
  
  scene.add(islandGroup);
}

function createTrees(parent) {
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6B4226, roughness: 0.9 });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3D7A28, roughness: 0.7 });
  const leafMat2 = new THREE.MeshStandardMaterial({ color: 0x2D6A1E, roughness: 0.7 });
  
  const treeData = [
    { pos: [-2.0, 1.2, -1.5], scale: 1.2 },
    { pos: [1.5, 0.9, -2.0], scale: 0.9 },
    { pos: [-0.5, 1.4, -2.2], scale: 1.0 },
    { pos: [2.0, 0.7, 0.5], scale: 0.7 },
    { pos: [-2.5, 0.8, 0.8], scale: 0.8 },
  ];
  
  treeData.forEach(data => {
    const tree = new THREE.Group();
    
    // Trunk
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.1, 0.8, 8), trunkMat);
    trunk.position.y = 0.4;
    trunk.castShadow = true;
    tree.add(trunk);
    
    // Foliage layers (cone shape like pine)
    const layers = 3;
    for (let i = 0; i < layers; i++) {
      const size = (0.5 - i * 0.12) * data.scale;
      const leaf = new THREE.Mesh(
        new THREE.ConeGeometry(size, size * 1.2, 8),
        i % 2 === 0 ? leafMat : leafMat2
      );
      leaf.position.y = 0.8 + i * 0.35;
      leaf.castShadow = true;
      tree.add(leaf);
    }
    
    tree.position.set(...data.pos);
    tree.scale.setScalar(data.scale);
    tree.userData.originalRot = 0;
    trees.push(tree);
    parent.add(tree);
  });
}

// ============================================================
// CABIN
// ============================================================
function createCabin() {
  const cabinGroup = new THREE.Group();
  
  // A-frame structure
  const woodMat = new THREE.MeshStandardMaterial({ color: 0x8B6914, roughness: 0.8 });
  const copperMat = new THREE.MeshStandardMaterial({ color: 0xB87333, roughness: 0.4, metalness: 0.6 });
  
  // Main A-frame body (triangular prism)
  const shape = new THREE.Shape();
  shape.moveTo(-0.8, 0);
  shape.lineTo(0, 1.8);
  shape.lineTo(0.8, 0);
  shape.lineTo(-0.8, 0);
  
  const extrudeSettings = { depth: 1.4, bevelEnabled: false };
  const frameGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
  const frame = new THREE.Mesh(frameGeo, woodMat);
  frame.position.set(0, 0, -0.7);
  frame.castShadow = true;
  frame.receiveShadow = true;
  cabinGroup.add(frame);
  
  // Copper roof panels
  const roofGeo = new THREE.PlaneGeometry(1.0, 1.5);
  const roof1 = new THREE.Mesh(roofGeo, copperMat);
  roof1.position.set(-0.42, 1.05, 0);
  roof1.rotation.z = Math.atan2(1.8, 0.8);
  roof1.rotation.y = 0;
  roof1.castShadow = true;
  cabinGroup.add(roof1);
  
  const roof2 = new THREE.Mesh(roofGeo, copperMat);
  roof2.position.set(0.42, 1.05, 0);
  roof2.rotation.z = -Math.atan2(1.8, 0.8);
  roof2.castShadow = true;
  cabinGroup.add(roof2);
  
  // Windows (glowing)
  const windowMat = new THREE.MeshStandardMaterial({
    color: 0xFFDD66, emissive: 0xFFAA22, emissiveIntensity: 0, roughness: 0.3
  });
  
  // Front window
  const winGeo = new THREE.PlaneGeometry(0.35, 0.45);
  const win1 = new THREE.Mesh(winGeo, windowMat.clone());
  win1.position.set(0, 0.7, 0.71);
  cabinGroup.add(win1);
  cabinWindows.push(win1);
  
  // Side windows
  const win2 = new THREE.Mesh(winGeo, windowMat.clone());
  win2.position.set(0.81, 0.5, 0);
  win2.rotation.y = Math.PI / 2;
  cabinGroup.add(win2);
  cabinWindows.push(win2);
  
  const win3 = new THREE.Mesh(winGeo, windowMat.clone());
  win3.position.set(-0.81, 0.5, 0);
  win3.rotation.y = -Math.PI / 2;
  cabinGroup.add(win3);
  cabinWindows.push(win3);
  
  // Door
  const doorMat = new THREE.MeshStandardMaterial({ color: 0x5C3A1E, roughness: 0.9 });
  const door = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.7), doorMat);
  door.position.set(0, 0.35, 0.71);
  cabinGroup.add(door);
  
  // Deck
  const deckMat = new THREE.MeshStandardMaterial({ color: 0x9B7B3A, roughness: 0.85 });
  const deck = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 1.2), deckMat);
  deck.position.set(0, 0.02, 1.3);
  deck.receiveShadow = true;
  deck.castShadow = true;
  cabinGroup.add(deck);
  
  // Deck railing posts
  const postGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.4, 6);
  const postMat = new THREE.MeshStandardMaterial({ color: 0x7A5A2A, roughness: 0.8 });
  [[-1.0, 1.9], [1.0, 1.9], [-1.0, 0.7], [1.0, 0.7]].forEach(([x, z]) => {
    const post = new THREE.Mesh(postGeo, postMat);
    post.position.set(x, 0.22, z);
    cabinGroup.add(post);
  });
  
  // Railing bar
  const railGeo = new THREE.CylinderGeometry(0.02, 0.02, 2.0, 6);
  const rail = new THREE.Mesh(railGeo, postMat);
  rail.position.set(0, 0.4, 1.9);
  rail.rotation.z = Math.PI / 2;
  cabinGroup.add(rail);
  
  // Chimney
  const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.9 }));
  chimney.position.set(0.3, 1.6, -0.3);
  chimney.castShadow = true;
  cabinGroup.add(chimney);
  
  cabinGroup.position.set(-1, 1.1, 0.3);
  cabinGroup.rotation.y = 0.3;
  scene.add(cabinGroup);
  
  // Bench near cabin
  createBench(new THREE.Vector3(0.5, 1.1, 2.2));
  
  // Crates
  createCrate(new THREE.Vector3(1.2, 1.1, 1.5), 0.3);
  createCrate(new THREE.Vector3(1.5, 1.1, 1.8), 0.25);
  
  // Towels on deck
  createTowel(new THREE.Vector3(-0.3, 1.15, 1.8), 0x4488CC);
  createTowel(new THREE.Vector3(0.4, 1.15, 1.9), 0xCC6644);
  
  // Potted plants
  createPottedPlant(new THREE.Vector3(-1.8, 1.15, 1.5));
  createPottedPlant(new THREE.Vector3(0.8, 1.15, 2.5));
}

function createBench(pos) {
  const benchGroup = new THREE.Group();
  const woodMat = new THREE.MeshStandardMaterial({ color: 0x7A5A2A, roughness: 0.85 });
  
  // Seat
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.3), woodMat);
  seat.position.y = 0.25;
  seat.castShadow = true;
  benchGroup.add(seat);
  
  // Back
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.04), woodMat);
  back.position.set(0, 0.45, -0.13);
  back.castShadow = true;
  benchGroup.add(back);
  
  // Legs
  const legGeo = new THREE.BoxGeometry(0.04, 0.25, 0.04);
  [[-0.35, 0.12, 0.1], [0.35, 0.12, 0.1], [-0.35, 0.12, -0.1], [0.35, 0.12, -0.1]].forEach(p => {
    const leg = new THREE.Mesh(legGeo, woodMat);
    leg.position.set(...p);
    benchGroup.add(leg);
  });
  
  benchGroup.position.copy(pos);

  // Caustics on seabed (animated plane with shader)
  const causticGeo = new THREE.PlaneGeometry(9.5, 9.5, 1, 1);
  const causticMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      uTime: { value: 0 },
      uColor: { value: new THREE.Color(0x66FFEE) }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform vec3 uColor;
      varying vec2 vUv;
      
      float caustic(vec2 uv, float t) {
        vec2 p = uv * 8.0;
        float v = 0.0;
        v += sin(p.x + t) * 0.5;
        v += sin(p.y + t * 0.7) * 0.5;
        v += sin((p.x + p.y) * 0.7 + t * 1.3) * 0.3;
        v += sin(length(p - vec2(4.0, 4.0)) * 2.0 - t) * 0.4;
        return smoothstep(0.3, 1.2, v) * 0.4;
      }
      
      void main() {
        float c = caustic(vUv, uTime);
        gl_FragColor = vec4(uColor, c * 0.5);
      }
    `
  });
  causticMesh = new THREE.Mesh(causticGeo, causticMat);
  causticMesh.rotation.x = -Math.PI / 2;
  causticMesh.position.y = -2.95;
  causticMesh.renderOrder = 2;

  // Shore foam ring
  createShoreFoam();
  
  // Bubbles
  createBubbles();
}

// ============================================================
// ANIMATION LOOP
// ============================================================
let globalTime = 0;

function animate() {
  requestAnimationFrame(animate);
  
  const delta = clock.getDelta();
  if (!paused) {
    globalTime += delta;
    updateWater(delta);
    updateRays(delta);
    updateFish(delta);
    updatePlants(delta);
    updateTrees(delta);
    updateBubbles(delta);
    updateKayak(delta);
    updateRipples(delta);
    updateDroplets(delta);
    updateCaustics();
    updateTide();
  }
  
  updateCamera(delta);
  controls.update();
  renderer.render(scene, camera);
}

function updateWater(delta) {
  if (!waterSurface) return;
  
  const positions = waterSurface.geometry.attributes.position;
  const windFactor = 0.3 + windStrength * 0.7;
  
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    
    // Multi-layered wave
    let z = 0;
    z += Math.sin(x * 2 + globalTime * 1.5) * 0.04 * windFactor;
    z += Math.sin(y * 3 + globalTime * 1.2) * 0.03 * windFactor;
    z += Math.sin((x + y) * 1.5 + globalTime * 2) * 0.02 * windFactor;
    z += Math.sin(x * 4 + globalTime * 3) * 0.015 * windFactor;
    
    positions.setZ(i, z);
  }
  positions.needsUpdate = true;
  waterSurface.geometry.computeVertexNormals();
  
  // Update water level based on tide
  const waterY = baseWaterY + (tideLevel - 0.5) * tideRange;
  waterSurface.position.y = waterY;
  
  // Update foam
  const foam = scene.getObjectByName('foam');
  if (foam) {
    foam.position.y = waterY + 0.02;
    foam.material.opacity = 0.3 + Math.sin(globalTime * 2) * 0.1;
  }
}

function updateRays(delta) {
  rays.forEach((ray, idx) => {
    const data = ray.userData;
    
    if (data.isLeaping) {
      // Ray leap animation
      data.leapPhase += delta * 1.5;
      
      if (data.leapPhase < 1) {
        // Rising out of water
        const t = data.leapPhase;
        const waterY = baseWaterY + (tideLevel - 0.5) * tideRange;
        const jumpHeight = 3.5;
        ray.position.y = waterY + Math.sin(t * Math.PI) * jumpHeight;
        ray.rotation.x = -t * Math.PI * 0.8;
        
        // Wing spread during jump
        const wingL = ray.getObjectByName('wingL');
        const wingR = ray.getObjectByName('wingR');
        if (wingL) wingL.rotation.z = -Math.sin(t * Math.PI) * 0.5;
        if (wingR) wingR.rotation.z = Math.sin(t * Math.PI) * 0.5;
      } else if (data.leapPhase < 1.3) {
        // Splash down
        const t = (data.leapPhase - 1) / 0.3;
        const waterY = baseWaterY + (tideLevel - 0.5) * tideRange;
        ray.position.y = waterY + (1 - t) * 0.5;
        ray.rotation.x = 0;
        
        if (t > 0.8 && !data.hasSplashed) {
          data.hasSplashed = true;
          triggerSplash(ray.position.clone());
        }
      } else {
        // Return to swimming
        data.isLeaping = false;
        data.leapPhase = 0;
        data.hasSplashed = false;
        ray.rotation.x = 0;
      }
      return;
    }
    
    // Normal swimming - circular path
    data.angle += delta * data.speed;
    const waterY = baseWaterY + (tideLevel - 0.5) * tideRange;
    const swimY = Math.max(data.baseY, waterY - 1.5);
    
    ray.position.x = data.centerX + Math.cos(data.angle) * data.radius;
    ray.position.z = data.centerZ + Math.sin(data.angle) * data.radius;
    ray.position.y = swimY + Math.sin(globalTime * 0.5 + idx) * 0.2;
    
    // Face direction of movement
    ray.rotation.y = -data.angle + Math.PI / 2;
    
    // Wing undulation
    const wingL = ray.getObjectByName('wingL');
    const wingR = ray.getObjectByName('wingR');
    const wingAngle = Math.sin(globalTime * 3 + idx) * 0.3;
    if (wingL) wingL.rotation.x = -0.2 + wingAngle;
    if (wingR) wingR.rotation.x = 0.2 - wingAngle;
    
    // Tail sway
    const tail = ray.getObjectByName('tail');
    if (tail) tail.rotation.y = Math.sin(globalTime * 2 + idx) * 0.3;
    
    // Keep inside bounds
    const bound = 3.8;
    if (Math.abs(ray.position.x) > bound) data.centerX *= 0.95;
    if (Math.abs(ray.position.z) > bound) data.centerZ *= 0.95;
  });
}

function updateFish(delta) {
  const dummy = new THREE.Object3D();
  
  fishSchools.forEach(school => {
    school.angle += delta * school.speed;
    
    for (let i = 0; i < school.count; i++) {
      const offset = school.offsets[i];
      const a = school.angle + offset.angle;
      const r = offset.radius;
      
      dummy.position.set(
        school.center.x + Math.cos(a) * r,
        school.center.y + offset.yOffset + Math.sin(globalTime * 2 + i) * 0.05,
        school.center.z + Math.sin(a) * r
      );
      
      // Face direction
      dummy.rotation.y = -a + Math.PI / 2;
      dummy.scale.setScalar(0.8 + Math.sin(i) * 0.2);
      dummy.updateMatrix();
      school.mesh.setMatrixAt(i, dummy.matrix);
    }
    school.mesh.instanceMatrix.needsUpdate = true;
  });
}

function updatePlants(delta) {
  plants.forEach(plant => {
    if (plant.userData.swayOffset !== undefined) {
      const sway = Math.sin(globalTime * plant.userData.swaySpeed + plant.userData.swayOffset) * windStrength * 0.15;
      plant.rotation.z = sway;
      plant.rotation.x = sway * 0.5;
    }
  });
}

function updateTrees(delta) {
  trees.forEach(tree => {
    const sway = Math.sin(globalTime * 1.5 + tree.position.x) * windStrength * 0.03;
    tree.rotation.z = sway;
    tree.rotation.x = sway * 0.5;
  });
}

function updateBubbles(delta) {
  const waterY = baseWaterY + (tideLevel - 0.5) * tideRange;
  
  bubbles.forEach(bubble => {
    const data = bubble.userData;
    bubble.position.y += data.speed * delta;
    bubble.position.x += Math.sin(globalTime * 2 + data.wobble) * 0.002;
    bubble.position.z += Math.cos(globalTime * 1.5 + data.wobble) * 0.002;
    
    // Reset when reaching surface
    if (bubble.position.y > waterY - 0.1) {
      bubble.position.y = -2.5;
      bubble.position.x = (Math.random() - 0.5) * 7;
      bubble.position.z = (Math.random() - 0.5) * 7;
    }
    
    // Scale based on depth
    const depth = Math.max(0, (waterY - bubble.position.y) / 3);
    bubble.scale.setScalar(0.5 + depth * 0.5);
  });
}

function updateKayak(delta) {
  if (!kayak) return;
  
  const waterY = baseWaterY + (tideLevel - 0.5) * tideRange;
  
  if (kayakState === 'launching') {
    kayakProgress += delta * 0.5;
    if (kayakProgress >= 1) {
      kayakState = 'cruising';
      kayakProgress = 0;
    }
    // Move from pier to water
    const startPos = new THREE.Vector3(0.5, 0.45, 1.5);
    const endPos = new THREE.Vector3(0.5, waterY, 3.5);
    kayak.position.lerpVectors(startPos, endPos, kayakProgress);
    kayak.position.y = waterY + Math.sin(globalTime * 2) * 0.03;
  } else if (kayakState === 'cruising') {
    kayakProgress += delta * 0.15;
    if (kayakProgress >= Math.PI * 2) {
      kayakProgress = 0;
    }
    // Circle around island
    const radius = 4.0;
    kayak.position.x = Math.cos(kayakProgress) * radius;
    kayak.position.z = Math.sin(kayakProgress) * radius;
    kayak.position.y = waterY + Math.sin(globalTime * 2) * 0.04;
    kayak.rotation.y = -kayakProgress + Math.PI / 2;
    kayak.rotation.z = Math.sin(globalTime * 3) * 0.05;
  } else if (kayakState === 'returning') {
    kayakProgress += delta * 0.5;
    if (kayakProgress >= 1) {
      kayakState = 'moored';
      kayakProgress = 0;
    }
    const endPos = new THREE.Vector3(0.5, 0.45, 1.5);
    kayak.position.lerpVectors(kayak.position.clone(), endPos, kayakProgress * 0.05);
    kayak.position.y = waterY + (0.45 - waterY) * kayakProgress;
    kayak.rotation.z = 0;
  } else {
    // Moored - gentle bob
    kayak.position.y = waterY + Math.sin(globalTime * 1.5) * 0.02 + 0.15;
    kayak.rotation.z = Math.sin(globalTime * 1.2) * 0.03;
  }
}

function updateRipples(delta) {
  ripples.forEach(ripple => {
    if (!ripple.userData.active) return;
    ripple.userData.time += delta;
    const t = ripple.userData.time;
    
    if (t > 2) {
      ripple.userData.active = false;
      ripple.visible = false;
      return;
    }
    
    const scale = 1 + t * 3;
    ripple.scale.setScalar(scale);
    ripple.material.opacity = Math.max(0, 0.5 - t * 0.25);
    
    const waterY = baseWaterY + (tideLevel - 0.5) * tideRange;
    ripple.position.y = waterY + 0.03;
  });
}

function updateDroplets(delta) {
  droplets.forEach(drop => {
    if (!drop.userData.active) return;
    
    drop.userData.life += delta;
    if (drop.userData.life > 1.5) {
      drop.userData.active = false;
      drop.visible = false;
      return;
    }
    
    drop.userData.velocity.y -= 9.8 * delta;
    drop.position.add(drop.userData.velocity.clone().multiplyScalar(delta));
    drop.material.opacity = Math.max(0, 0.7 - drop.userData.life * 0.5);
  });
}

function updateCaustics() {
  if (causticMesh) {
    causticMesh.material.uniforms.uTime.value = globalTime;
  }
}

function updateTide() {
  const waterY = baseWaterY + (tideLevel - 0.5) * tideRange;
  waterVolume.position.y = waterY - 1.75;
}

function updateCamera(delta) {
  if (!camTransition) return;
  
  camTransition.progress += delta * 2;
  if (camTransition.progress >= 1) {
    camTransition.progress = 1;
    camTransition = null;
  }
  
  const t = smoothstep(camTransition.progress);
  camera.position.lerpVectors(camTransition.startPos, camTransition.endPos, t);
  controls.target.lerpVectors(camTransition.startTarget, camTransition.endTarget, t);
}

function smoothstep(t) {
  return t * t * (3 - 2 * t);
}

// ============================================================
// INTERACTIONS
// ============================================================
function triggerSplash(pos) {
  const waterY = baseWaterY + (tideLevel - 0.5) * tideRange;
  
  // Activate ripples
  let rippleCount = 0;
  ripples.forEach(ripple => {
    if (!ripple.userData.active && rippleCount < 3) {
      ripple.userData.active = true;
      ripple.userData.time = rippleCount * 0.2;
      ripple.position.set(pos.x, waterY + 0.03, pos.z);
      ripple.scale.setScalar(0.5);
      ripple.visible = true;
      ripple.material.opacity = 0.5;
      rippleCount++;
    }
  });
  
  // Spawn droplets
  let dropCount = 0;
  droplets.forEach(drop => {
    if (!drop.userData.active && dropCount < 12) {
      drop.userData.active = true;
      drop.userData.life = 0;
      drop.position.set(pos.x, waterY + 0.1, pos.z);
      drop.userData.velocity.set(
        (Math.random() - 0.5) * 2,
        2 + Math.random() * 3,
        (Math.random() - 0.5) * 2
      );
      drop.visible = true;
      drop.material.opacity = 0.7;
      dropCount++;
    }
  });
}

function triggerRayLeap() {
  if (rayLeaping) return;
  
  // Find a ray that's not leaping
  const ray = rays.find(r => !r.userData.isLeaping);
  if (!ray) return;
  
  rayLeaping = true;
  ray.userData.isLeaping = true;
  ray.userData.leapPhase = 0;
  ray.userData.hasSplashed = false;
  
  // Reset after animation completes
  setTimeout(() => { rayLeaping = false; }, 2500);
}

function toggleKayak() {
  if (kayakState === 'moored') {
    kayakState = 'launching';
    kayakProgress = 0;
  } else if (kayakState === 'cruising') {
    kayakState = 'returning';
    kayakProgress = 0;
  }
}

function setTimeOfDay(time) {
  timeOfDay = time;
  
  // Update button states
  document.getElementById('btn-day').classList.toggle('active', time === 'day');
  document.getElementById('btn-sunset').classList.toggle('active', time === 'sunset');
  document.getElementById('btn-night').classList.toggle('active', time === 'night');
  
  // Animate lighting
  const targets = {
    day: {
      ambient: { color: 0x404060, intensity: 0.4 },
      hemi: { sky: 0x87CEEB, ground: 0x8B7355, intensity: 0.5 },
      dir: { color: 0xfff5e0, intensity: 1.2, pos: [8, 12, 6] },
      fog: 0x87CEEB,
      sky: 0x87CEEB,
      exposure: 1.0,
      cabinGlow: 0,
      lanternGlow: 0
    },
    sunset: {
      ambient: { color: 0x553322, intensity: 0.3 },
      hemi: { sky: 0xFF8844, ground: 0x442211, intensity: 0.4 },
      dir: { color: 0xFF6633, intensity: 0.8, pos: [12, 4, 8] },
      fog: 0x553344,
      sky: 0xFF6644,
      exposure: 0.9,
      cabinGlow: 0.6,
      lanternGlow: 0.4
    },
    night: {
      ambient: { color: 0x111133, intensity: 0.2 },
      hemi: { sky: 0x112244, ground: 0x111111, intensity: 0.15 },
      dir: { color: 0x4466AA, intensity: 0.3, pos: [5, 10, -5] },
      fog: 0x0a0a1e,
      sky: 0x0a0a2e,
      exposure: 0.7,
      cabinGlow: 1.0,
      lanternGlow: 1.0
    }
  };
  
  const target = targets[time];
  animateLighting(target);
}

function animateLighting(target) {
  const duration = 2000;
  const start = Date.now();
  
  const startAmbient = { color: ambientLight.color.clone(), intensity: ambientLight.intensity };
  const startHemi = { sky: hemiLight.color.clone(), ground: hemiLight.groundColor.clone(), intensity: hemiLight.intensity };
  const startDir = { color: dirLight.color.clone(), intensity: dirLight.intensity, pos: dirLight.position.clone() };
  const startFog = scene.fog.color.clone();
  const startExposure = renderer.toneMappingExposure;
  
  const targetAmbientColor = new THREE.Color(target.ambient.color);
  const targetHemiSky = new THREE.Color(target.hemi.sky);
  const targetHemiGround = new THREE.Color(target.hemi.ground);
  const targetDirColor = new THREE.Color(target.dir.color);
  const targetFogColor = new THREE.Color(target.fog);
  const targetDirPos = new THREE.Vector3(...target.dir.pos);
  
  const skyMesh = scene.getObjectByName('sky');
  const startSkyColor = skyMesh ? skyMesh.material.color.clone() : new THREE.Color(0x87CEEB);
  const targetSkyColor = new THREE.Color(target.sky);
  
  function step() {
    const elapsed = Date.now() - start;
    const t = Math.min(1, elapsed / duration);
    const e = smoothstep(t);
    
    ambientLight.color.lerpColors(startAmbient.color, targetAmbientColor, e);
    ambientLight.intensity = startAmbient.intensity + (target.ambient.intensity - startAmbient.intensity) * e;
    
    hemiLight.color.lerpColors(startHemi.sky, targetHemiSky, e);
    hemiLight.groundColor.lerpColors(startHemi.ground, targetHemiGround, e);
    hemiLight.intensity = startHemi.intensity + (target.hemi.intensity - startHemi.intensity) * e;
    
    dirLight.color.lerpColors(startDir.color, targetDirColor, e);
    dirLight.intensity = startDir.intensity + (target.dir.intensity - startDir.intensity) * e;
    dirLight.position.lerpVectors(startDir.pos, targetDirPos, e);
    
    scene.fog.color.lerpColors(startFog, targetFogColor, e);
    renderer.toneMappingExposure = startExposure + (target.exposure - startExposure) * e;
    
    if (skyMesh) {
      skyMesh.material.color.lerpColors(startSkyColor, targetSkyColor, e);
    }
    
    // Cabin windows glow
    cabinWindows.forEach(win => {
      win.material.emissiveIntensity = target.cabinGlow * e;
    });
    cabinLight.intensity = target.cabinGlow * 2 * e;
    
    // Lanterns
    lanternLights.forEach(light => {
      light.intensity = target.lanternGlow * 1.5 * e;
    });
    lanterns.forEach(l => {
      l.body.material.emissiveIntensity = target.lanternGlow * e;
    });
    
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

function switchCamera(preset) {
  currentCam = preset;
  const p = camPresets[preset];
  
  document.getElementById('cam-iso').classList.toggle('active', preset === 'iso');
  document.getElementById('cam-cabin').classList.toggle('active', preset === 'cabin');
  document.getElementById('cam-under').classList.toggle('active', preset === 'under');
  
  camTransition = {
    startPos: camera.position.clone(),
    endPos: p.pos.clone(),
    startTarget: controls.target.clone(),
    endTarget: p.target.clone(),
    progress: 0
  };
}

function resetScene() {
  tideLevel = 0.5;
  windStrength = 0.3;
  document.getElementById('tide-slider').value = 50;
  document.getElementById('wind-slider').value = 30;
  
  setTimeOfDay('day');
  switchCamera('iso');
  
  kayakState = 'moored';
  kayakProgress = 0;
  
  rays.forEach(r => {
    r.userData.isLeaping = false;
    r.userData.leapPhase = 0;
  });
  rayLeaping = false;
  
  paused = false;
  document.getElementById('btn-pause').textContent = '⏸ Pause';
}

// ============================================================
// AUDIO (Procedural)
// ============================================================
function initAudio() {
  if (audioCtx) return;
  
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  gainNode = audioCtx.createGain();
  gainNode.gain.value = 0.6;
  gainNode.connect(audioCtx.destination);
  
  // Wind noise
  createWindSound();
  
  // Water ambient
  createWaterSound();
}

function createWindSound() {
  const bufferSize = audioCtx.sampleRate * 4;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    b0 = 0.99886 * b0 + white * 0.0555179;
    b1 = 0.99332 * b1 + white * 0.0750759;
    b2 = 0.96900 * b2 + white * 0.1538520;
    b3 = 0.86650 * b3 + white * 0.3104856;
    b4 = 0.55000 * b4 + white * 0.5329522;
    b5 = -0.7616 * b5 - white * 0.0168980;
    data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.02;
    b6 = white * 0.115926;
  }
  
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.loop = true;
  
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 400;
  
  windGain = audioCtx.createGain();
  windGain.gain.value = 0.15;
  
  source.connect(filter);
  filter.connect(windGain);
  windGain.connect(gainNode);
  source.start();
}

function createWaterSound() {
  const bufferSize = audioCtx.sampleRate * 3;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  
  for (let i = 0; i < bufferSize; i++) {
    const t = i / audioCtx.sampleRate;
    data[i] = (Math.random() * 2 - 1) * 0.02 * (0.5 + 0.5 * Math.sin(t * 0.5));
  }
  
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.loop = true;
  
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 800;
  
  waterGain = audioCtx.createGain();
  waterGain.gain.value = 0.1;
  
  source.connect(filter);
  filter.connect(waterGain);
  waterGain.connect(gainNode);
  source.start();
}

function toggleMusic() {
  initAudio();
  
  if (!musicStarted) {
    musicStarted = true;
    musicOn = true;
    startMusic();
  } else {
    musicOn = !musicOn;
    if (musicGain) {
      musicGain.gain.linearRampToValueAtTime(musicOn ? 0.3 : 0, audioCtx.currentTime + 0.5);
    }
  }
  
  document.getElementById('btn-music').classList.toggle('active', musicOn);
}

function startMusic() {
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.3;
  musicGain.connect(gainNode);
  
  // Calm ambient music using oscillators
  const notes = [
    { freq: 261.63, dur: 4 }, // C4
    { freq: 329.63, dur: 3 }, // E4
    { freq: 392.00, dur: 4 }, // G4
    { freq: 349.23, dur: 3 }, // F4
    { freq: 293.66, dur: 4 }, // D4
    { freq: 261.63, dur: 3 }, // C4
    { freq: 220.00, dur: 4 }, // A3
    { freq: 261.63, dur: 5 }, // C4
  ];
  
  function playNote(freq, duration, delay) {
    const osc = audioCtx.createOscillator();
    const oscGain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    
    osc.type = 'sine';
    osc.frequency.value = freq;
    
    filter.type = 'lowpass';
    filter.frequency.value = 1200;
    
    oscGain.gain.setValueAtTime(0, audioCtx.currentTime + delay);
    oscGain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + delay + 0.3);
    oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + delay + duration);
    
    osc.connect(filter);
    filter.connect(oscGain);
    oscGain.connect(musicGain);
    
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration + 0.1);
    
    // Add a soft harmonic
    const osc2 = audioCtx.createOscillator();
    const osc2Gain = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2;
    osc2Gain.gain.setValueAtTime(0, audioCtx.currentTime + delay);
    osc2Gain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + delay + 0.5);
    osc2Gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration * 0.7);
    osc2.connect(osc2Gain);
    osc2Gain.connect(musicGain);
    osc2.start(audioCtx.currentTime + delay);
    osc2.stop(audioCtx.currentTime + delay + duration);
  }
  
  function playSequence() {
    if (!musicOn) {
      setTimeout(playSequence, 1000);
      return;
    }
    
    let time = 0;
    notes.forEach(note => {
      playNote(note.freq, note.dur, time);
      time += note.dur * 0.7;
    });
    
    setTimeout(playSequence, time * 1000 + 2000);
  }
  
  playSequence();
}

function setVolume(val) {
  if (gainNode) {
    gainNode.gain.value = val;
  }
}

// ============================================================
// UI SETUP
// ============================================================
function setupUI() {
  // Tide slider
  document.getElementById('tide-slider').addEventListener('input', (e) => {
    tideLevel = e.target.value / 100;
  });
  
  // Wind slider
  document.getElementById('wind-slider').addEventListener('input', (e) => {
    windStrength = e.target.value / 100;
  });
  
  // Time of day
  document.getElementById('btn-day').addEventListener('click', () => setTimeOfDay('day'));
  document.getElementById('btn-sunset').addEventListener('click', () => setTimeOfDay('sunset'));
  document.getElementById('btn-night').addEventListener('click', () => setTimeOfDay('night'));
  
  // Actions
  document.getElementById('btn-kayak').addEventListener('click', toggleKayak);
  document.getElementById('btn-ray').addEventListener('click', triggerRayLeap);
  document.getElementById('btn-music').addEventListener('click', toggleMusic);
  
  // Volume
  document.getElementById('volume-slider').addEventListener('input', (e) => {
    setVolume(e.target.value / 100);
  });
  
  // Pause
  document.getElementById('btn-pause').addEventListener('click', () => {
    paused = !paused;
    document.getElementById('btn-pause').textContent = paused ? '▶ Play' : '⏸ Pause';
    document.getElementById('btn-pause').classList.toggle('active', paused);
  });
  
  // Reset
  document.getElementById('btn-reset').addEventListener('click', resetScene);
  
  // Cameras
  document.getElementById('cam-iso').addEventListener('click', () => switchCamera('iso'));
  document.getElementById('cam-cabin').addEventListener('click', () => switchCamera('cabin'));
  document.getElementById('cam-under').addEventListener('click', () => switchCamera('under'));
  
  // Mobile panel toggles
  document.querySelectorAll('.panel-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const panel = btn.closest('.panel');
      panel.classList.toggle('collapsed');
      btn.textContent = panel.classList.contains('collapsed') ? '+' : '−';
    });
  });
}

// ============================================================
// RESIZE
// ============================================================
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}

// ============================================================
// START
// ============================================================
init();

</script>
