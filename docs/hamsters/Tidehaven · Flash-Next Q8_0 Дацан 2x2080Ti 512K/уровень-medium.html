<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tidehaven — A Cozy Island Diorama</title>
<style>
  :root{
    --panel: rgba(14, 26, 32, 0.58);
    --panel-border: rgba(255,255,255,0.14);
    --ink: #eef5f6;
    --accent: #ffbe63;
    --accent-ink: #2a1c08;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0c1620;
    font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
  canvas{ display:block; }

  /* ---------- Title card ---------- */
  #titleCard{
    position:fixed; top:16px; left:16px; z-index:10;
    background:var(--panel); border:1px solid var(--panel-border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius:16px; padding:14px 18px; color:var(--ink);
    max-width: 280px; pointer-events:none;
    box-shadow: 0 8px 32px rgba(0,0,0,.25);
  }
  #titleCard h1{
    font-size:26px; font-weight:700; letter-spacing:.06em;
    background:linear-gradient(120deg,#ffe9c4,#8fe3d8 60%,#bfe0ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #titleCard p{ font-size:12px; opacity:.85; margin-top:3px; line-height:1.45; }

  /* ---------- Control panels ---------- */
  #panels{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    display:flex; gap:10px; z-index:11; align-items:flex-end;
    max-width: calc(100vw - 20px);
  }
  .panel{
    background:var(--panel); border:1px solid var(--panel-border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius:14px; padding:9px 11px 11px; color:var(--ink);
    box-shadow: 0 8px 28px rgba(0,0,0,.28);
  }
  .panel .legend{
    font-size:9.5px; text-transform:uppercase; letter-spacing:.16em;
    opacity:.62; margin-bottom:7px; font-weight:600;
  }
  .row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .btn{
    font: inherit; font-size:11.5px; padding:6px 10px; border-radius:9px;
    border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.07);
    color:var(--ink); cursor:pointer; transition: background .18s, color .18s, transform .1s;
    white-space:nowrap; user-select:none;
  }
  .btn:hover{ background:rgba(255,255,255,.16); }
  .btn:active{ transform:scale(.96); }
  .btn.active{ background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600; }
  .sliderRow{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .sliderRow label{ font-size:10.5px; opacity:.8; min-width:38px; }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:110px; height:4px; border-radius:2px;
    background:rgba(255,255,255,.25); outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent); border:2px solid #fff3; box-shadow:0 1px 6px #0006;
  }
  input[type=range]::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%; border:2px solid #fff3;
    background:var(--accent); box-shadow:0 1px 6px #0006;
  }

  /* ---------- Mobile ---------- */
  #menuBtn{
    display:none; position:fixed; right:14px; bottom:14px; z-index:13;
    width:52px; height:52px; border-radius:50%; font-size:22px;
    background:var(--panel); border:1px solid var(--panel-border); color:var(--ink);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  @media (max-width: 900px){
    #titleCard{ max-width: 200px; padding:10px 13px; }
    #titleCard h1{ font-size:19px; }
    #titleCard p{ font-size:10.5px; }
    #menuBtn{ display:block; }
    #panels{
      left:auto; right:12px; bottom:76px; transform:none;
      flex-direction:column; align-items:stretch;
      max-height:58vh; overflow-y:auto; display:none;
    }
    #panels.open{ display:flex; }
    input[type=range]{ width:130px; }
  }
  #hint{
    position:fixed; top:16px; right:16px; z-index:10; color:#dfeef0;
    font-size:10.5px; opacity:.55; letter-spacing:.05em; pointer-events:none; text-align:right;
  }
</style>
</head>
<body>

<div id="titleCard">
  <h1>Tidehaven</h1>
  <p>A cozy island in a cutaway lagoon. Drift the cameras, raise the tide, and wake the rays below.</p>
</div>
<div id="hint">drag to orbit &middot; scroll to zoom</div>

<div id="panels">
  <div class="panel"><div class="legend">Camera</div>
    <div class="row">
      <button class="btn active" id="camIso">Overview</button>
      <button class="btn" id="camCabin">Cabin</button>
      <button class="btn" id="camUnder">Underwater</button>
      <button class="btn" id="camOrbit">Free Orbit</button>
    </div>
  </div>
  <div class="panel"><div class="legend">World</div>
    <div class="row">
      <button class="btn" id="btnKayak">Launch Kayak</button>
      <button class="btn" id="btnJump">Ray Leap</button>
      <button class="btn" id="btnPause">Pause</button>
      <button class="btn" id="btnReset">Reset</button>
    </div>
    <div class="sliderRow"><label>Tide</label><input type="range" id="tide" min="-0.7" max="0.85" step="0.01" value="0"></div>
    <div class="sliderRow"><label>Wind</label><input type="range" id="wind" min="0" max="1" step="0.01" value="0.45"></div>
  </div>
  <div class="panel"><div class="legend">Time of Day</div>
    <div class="row">
      <button class="btn active" id="todDay">Day</button>
      <button class="btn" id="todSunset">Sunset</button>
      <button class="btn" id="todNight">Night</button>
    </div>
  </div>
  <div class="panel"><div class="legend">Audio</div>
    <div class="row"><button class="btn" id="btnMusic">Music&nbsp;On</button></div>
    <div class="sliderRow"><label>Volume</label><input type="range" id="vol" min="0" max="1" step="0.01" value="0.6"></div>
  </div>
  <div class="panel"><div class="legend">Quality</div>
    <div class="row">
      <button class="btn" id="qLow">Low</button>
      <button class="btn active" id="qMed">Med</button>
      <button class="btn" id="qHigh">High</button>
    </div>
  </div>
</div>
<button id="menuBtn" aria-label="Toggle controls">☰</button>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   TIDEHAVEN — a cutaway island diorama
   Sections: 0 utils · 1 core · 2 diorama block · 3 island
             4 cabin & pier · 5 water · 6 life · 7 FX
             8 time-of-day · 9 UI · 10 audio · 11 loop
   ============================================================ */

/* ---------- 0. Small utilities ---------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const smoothstep = (x)=>{ x=clamp(x,0,1); return x*x*(3-2*x); };
const easeIO = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const rnd = (a=1,b=0)=> b + Math.random()*(a-b);

/* World constants */
const BW=24, BD=18, BTOP=1.0, BBOT=-6.0;       // diorama block dims
const BED_Y=-5.45;                              // seabed height
const ICX=-3.5, ICZ=-3.0, IR=5.6, IH=3.2;       // island center / radius / height

/* Island surface height at (x,z) — dome + underwater skirt blend */
function islandH(x,z){
  const d = Math.hypot(x-ICX, z-ICZ);
  let h;
  if(d < IR) h = IH*(1-(d/IR)*(d/IR));
  else h = -5.4*smoothstep((d-IR)/2.2);
  h += Math.sin(x*1.7+1.3)*Math.cos(z*1.5+0.7)*0.12*smoothstep((d-0.8)/4);
  return h;
}

/* ---------- Global state ---------- */
const state = {
  tide:0, wind:0.45, paused:false, quality:'medium',
  tod:'day', worldTime:0,
  kayak:{ mode:'docked', t:0, angle:0.6 },
  jump:{ phase:'wander', t:0, vy:0 },
};

/* ---------- 1. Core ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 220);
camera.position.set(16,13,17);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.5,-0.5,0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 5; controls.maxDistance = 55;
controls.maxPolarAngle = 2.35;

function applyQuality(q){
  state.quality = q;
  const caps = { low:1, medium:1.5, high:2 };
  renderer.setPixelRatio(Math.min(devicePixelRatio, caps[q]));
  const sizes = { low:0, medium:1024, high:2048 };
  sun.castShadow = q!=='low';
  sun.shadow.mapSize.set(sizes[q]||1024, sizes[q]||1024);
  sun.shadow.map?.dispose(); sun.shadow.map = null;
}

/* Fog used when the camera dips below the waterline */
const waterFog = new THREE.FogExp2(0x2f9d96, 0);
let fogAmount = 0;

/* ---------- Lights ---------- */
const hemi = new THREE.HemisphereLight(0xbcd9ee, 0x9a8f6d, 0.7);
scene.add(hemi);
const amb = new THREE.AmbientLight(0xffffff, 0.18);
scene.add(amb);
const sun = new THREE.DirectionalLight(0xfff2df, 2.2);
sun.position.set(12,18,8);
sun.castShadow = true;
sun.shadow.camera.left=-14; sun.shadow.camera.right=14;
sun.shadow.camera.top=14; sun.shadow.camera.bottom=-14;
sun.shadow.camera.near=1; sun.shadow.camera.far=60;
sun.shadow.bias = -0.0015;
scene.add(sun);

/* ---------- Sky dome + stars ---------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false,
  uniforms:{ top:{value:new THREE.Color(0x6fb7e8)}, bottom:{value:new THREE.Color(0xcfeaf2)} },
  vertexShader:`varying vec3 vP; void main(){ vP=position;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform vec3 top; uniform vec3 bottom; varying vec3 vP;
    void main(){ float h=normalize(vP).y*0.5+0.5;
      gl_FragColor=vec4(mix(bottom,top,smoothstep(0.35,0.85,h)),1.0); }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(90,24,12), skyMat));

const starGeo = new THREE.BufferGeometry();
{
  const n=350, arr=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const a=rnd(Math.PI*2), e=Math.acos(rnd(1,-0.15)), r=80;
    arr[i*3]=Math.sin(e)*Math.cos(a)*r; arr[i*3+1]=Math.abs(Math.cos(e))*r*0.9+4; arr[i*3+2]=Math.sin(e)*Math.sin(a)*r;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(arr,3));
}
const starMat = new THREE.PointsMaterial({ color:0xffffff, size:0.5, transparent:true, opacity:0 });
scene.add(new THREE.Points(starGeo, starMat));

/* Shared palettes */
const MAT = {
  wood:   new THREE.MeshStandardMaterial({ color:0x8a6844, roughness:0.85 }),
  wood2:  new THREE.MeshStandardMaterial({ color:0x6f5236, roughness:0.9 }),
  copper: new THREE.MeshStandardMaterial({ color:0xb87333, metalness:0.55, roughness:0.35 }),
  rock:   new THREE.MeshStandardMaterial({ color:0x8d8779, roughness:0.95 }),
  trunk:  new THREE.MeshStandardMaterial({ color:0x6b4a30, roughness:0.9 }),
  leafA:  new THREE.MeshStandardMaterial({ color:0x5c9a4a, roughness:0.8 }),
  leafB:  new THREE.MeshStandardMaterial({ color:0x4c8a44, roughness:0.8 }),
};

/* ---------- 2. Diorama block (aquarium) ---------- */
const block = new THREE.Group(); scene.add(block);

/* Water volume tint — box with the cut faces (front +X / +Z) and caps hidden */
const invisible = new THREE.MeshBasicMaterial({ visible:false });
const tintMat = new THREE.MeshLambertMaterial({
  color:0x2fa9a2, transparent:true, opacity:0.34, side:THREE.DoubleSide, depthWrite:false
});
const volBox = new THREE.Mesh(new THREE.BoxGeometry(BW, BTOP-BBOT, BD),
  [ invisible, tintMat, invisible, invisible, invisible, tintMat ]); // +x,-x,+y,-y,+z,-z
volBox.position.y = (BTOP+BBOT)/2;
volBox.renderOrder = 4;
block.add(volBox);

/* Frosted acrylic on the two cut faces */
const glassMat = new THREE.MeshBasicMaterial({ color:0xbfeef2, transparent:true, opacity:0.06, depthWrite:false, side:THREE.DoubleSide });
const glassF = new THREE.Mesh(new THREE.PlaneGeometry(BW, BTOP-BBOT), glassMat);
glassF.position.set(0,(BTOP+BBOT)/2,BD/2); glassF.renderOrder=14; block.add(glassF);
const glassR = new THREE.Mesh(new THREE.PlaneGeometry(BD, BTOP-BBOT), glassMat);
glassR.position.set(BW/2,(BTOP+BBOT)/2,0); glassR.rotation.y=-Math.PI/2; glassR.renderOrder=14; block.add(glassR);

/* Bright acrylic rims + wooden base */
const rimMat = new THREE.MeshStandardMaterial({ color:0xf3f6f5, roughness:0.55 });
function rim(w,h,d,x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), rimMat); m.position.set(x,y,z); block.add(m); }
rim(BW+0.5,0.14,0.28, 0,BTOP, BD/2); rim(BW+0.5,0.14,0.28, 0,BTOP,-BD/2);
rim(0.28,0.14,BD+0.5,  BW/2,BTOP,0); rim(0.28,0.14,BD+0.5, -BW/2,BTOP,0);
rim(0.18,BTOP-BBOT,0.18,  BW/2,(BTOP+BBOT)/2, BD/2);
rim(0.18,BTOP-BBOT,0.18, -BW/2,(BTOP+BBOT)/2, BD/2);
rim(0.18,BTOP-BBOT,0.18,  BW/2,(BTOP+BBOT)/2,-BD/2);
rim(BW+0.5,0.16,0.3, 0,BBOT, BD/2); rim(0.3,0.16,BD+0.5, BW/2,BBOT,0);
const base = new THREE.Mesh(new THREE.BoxGeometry(BW+1.6,1.5,BD+1.6),
  new THREE.MeshStandardMaterial({ color:0x4a3626, roughness:0.9 }));
base.position.y = BBOT-0.75; base.receiveShadow = true; block.add(base);

/* Seabed */
{
  const g = new THREE.PlaneGeometry(BW, BD, 44, 34); g.rotateX(-Math.PI/2);
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), z=p.getZ(i);
    p.setY(i, BED_Y + Math.sin(x*0.7)*Math.cos(z*0.6)*0.14 + Math.sin(x*0.23+z*0.4)*0.1);
  }
  g.computeVertexNormals();
  const bed = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color:0xcbb183 }));
  bed.receiveShadow = true; block.add(bed);
}

/* Animated caustics over the seabed */
const causticMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uT:{value:0} },
  vertexShader:`varying vec2 vU; void main(){ vU=uv;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform float uT; varying vec2 vU;
    void main(){
      vec2 uv=vU*vec2(24.0,18.0);
      float c = sin(uv.x+uT)+sin(uv.y*1.3-uT*1.2)+sin((uv.x+uv.y)*0.8+uT*0.7)+sin(length(uv-12.0)*1.1-uT);
      c = pow(max(0.0, c/4.0+0.5), 4.0);
      gl_FragColor = vec4(vec3(0.45,0.9,0.85)*c*0.5, c*0.5);
    }`
});
const caustics = new THREE.Mesh(new THREE.PlaneGeometry(BW,BD), causticMat);
caustics.rotation.x = -Math.PI/2; caustics.position.y = BED_Y+0.12;
caustics.renderOrder = 3; block.add(caustics);

/* ---------- 3. Island ---------- */
{
  const g = new THREE.PlaneGeometry(17,17,60,60); g.rotateX(-Math.PI/2);
  const p = g.attributes.position;
  const col = [];
  const sand=new THREE.Color(0xe9d49c), grass=new THREE.Color(0x66a04c),
        wet=new THREE.Color(0xb59e70), deep=new THREE.Color(0x93805a), c=new THREE.Color();
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), z=p.getZ(i), d=Math.hypot(x-ICX,z-ICZ);
    let y;
    if(d<=IR+2.3){ y=islandH(x,z); }
    else y=BED_Y-0.12;
    p.setY(i,y);
    const n = Math.sin(x*9.1+z*7.7)*0.03;
    if(y>0.55){ c.copy(grass).offsetHSL(0,0,n); }
    else if(y>-0.15){ c.copy(sand).lerp(grass, smoothstep((y+0.15)/0.7)).offsetHSL(0,0,n); }
    else if(y>-1.6){ c.copy(wet); }
    else { c.copy(deep); }
    col.push(c.r,c.g,c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.computeVertexNormals();
  const island = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors:true }));
  island.receiveShadow = true; island.castShadow = true;
  scene.add(island);
}

/* Rocks — instanced, reused geometry */
{
  const geo = new THREE.DodecahedronGeometry(0.4,0);
  const rocks = new THREE.InstancedMesh(geo, MAT.rock, 30);
  const d = new THREE.Object3D(); let i=0;
  for(; i<30; i++){
    const a=rnd(Math.PI*2), r=(i<20)? rnd(6.3,5.0) : rnd(8.5,7.2);
    const x=ICX+Math.cos(a)*r, z=ICZ+Math.sin(a)*r;
    if(Math.abs(x)>BW/2-0.6||Math.abs(z)>BD/2-0.6){ i--; continue; }
    const s=rnd(1.5,0.4);
    d.position.set(x, islandH(x,z)+s*0.12, z);
    d.rotation.set(rnd(3),rnd(3),rnd(3)); d.scale.set(s,s*rnd(1.1,0.5),s);
    d.updateMatrix(); rocks.setMatrixAt(i,d.matrix);
  }
  rocks.castShadow = rocks.receiveShadow = true; scene.add(rocks);
}

/* Grass tufts — instanced */
{
  const tuft = new THREE.InstancedMesh(new THREE.ConeGeometry(0.08,0.42,5),
    new THREE.MeshLambertMaterial({ color:0x5f9b45 }), 150);
  const d=new THREE.Object3D(); let i=0, guard=0;
  while(i<150 && guard++<900){
    const x=rnd(ICX+4.6,ICX-4.6), z=rnd(ICZ+4.6,ICZ-4.6), h=islandH(x,z);
    if(h<0.6) continue;
    d.position.set(x,h+0.16,z); d.rotation.set(rnd(0.3,-0.3),rnd(3),rnd(0.3,-0.3));
    d.scale.setScalar(rnd(1.3,0.6)); d.updateMatrix(); tuft.setMatrixAt(i,d.matrix); i++;
  }
  scene.add(tuft);
}

/* Trees — swayed by wind each frame */
const swayables = []; // {obj, phase, amp}
{
  const trunkGeo = new THREE.CylinderGeometry(0.09,0.14,1,6);
  const blobGeo = new THREE.IcosahedronGeometry(0.62,0);
  const spots=[[-6,-4],[-1,-5.5],[-5.5,-0.5],[-0.5,-3.8],[-6.6,-1.5],[0.8,-2.2],[-4.4,-6.4]];
  for(const [x,z] of spots){
    const t = new THREE.Group();
    const h = islandH(x,z);
    const trunk = new THREE.Mesh(trunkGeo, MAT.trunk);
    trunk.position.y=0.5; trunk.castShadow=true; t.add(trunk);
    const s = rnd(1.15,0.8);
    for(let k=0;k<3;k++){
      const b = new THREE.Mesh(blobGeo, k%2?MAT.leafA:MAT.leafB);
      b.position.set(rnd(0.3,-0.3), 1.05+k*0.35, rnd(0.3,-0.3));
      b.scale.setScalar(s*(1-k*0.2)); b.castShadow=true; t.add(b);
    }
    t.position.set(x,h-0.05,z); t.scale.setScalar(s);
    scene.add(t);
    swayables.push({obj:t, phase:rnd(6), amp:0.045});
  }
}

/* ---------- 4. Cabin, deck, pier & lived-in details ---------- */
const lanternLights = [];   // point lights that fade in at night
let windowMat;              // emissive cabin window material

{
  const cabin = new THREE.Group();
  const cx=-2.6, cz=-2.2, gy=islandH(cx,cz);
  cabin.position.set(cx,gy,cz);
  cabin.rotation.y = Math.atan2(1.2-cx, 0.4-cz);   // face the pier

  const W=1.15, H=2.0, D=1.9, slope=Math.hypot(W,H), ang=Math.atan2(H,W);
  const roofGeo = new THREE.BoxGeometry(slope+0.22, 0.09, D+0.34);
  const rl = new THREE.Mesh(roofGeo, MAT.copper);
  rl.position.set(-W/2,H/2,0); rl.rotation.z=ang; rl.castShadow=true; cabin.add(rl);
  const rr = new THREE.Mesh(roofGeo, MAT.copper);
  rr.position.set(W/2,H/2,0); rr.rotation.z=-ang; rr.castShadow=true; cabin.add(rr);
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.12,D+0.4), MAT.copper);
  ridge.position.y=H+0.02; cabin.add(ridge);

  // gable ends (triangles)
  const tri = new THREE.Shape();
  tri.moveTo(-W,0); tri.lineTo(W,0); tri.lineTo(0,H); tri.closePath();
  const gableGeo = new THREE.ShapeGeometry(tri);
  for(const s of [1,-1]){
    const gm = new THREE.Mesh(gableGeo, MAT.wood2);
    gm.position.z = s*D/2; if(s<0) gm.rotation.y=Math.PI; gm.castShadow=true; cabin.add(gm);
  }
  // glowing triangular window on the front gable

/* ---------- 5. Water surface (waves + shoreline foam) ---------- */
const surfMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, side:THREE.DoubleSide,
  uniforms:{
    uT:{value:0}, uWind:{value:0.45}, uTide:{value:0},
    uShallow:{value:new THREE.Color(0x63d8cf)},
    uDeep:{value:new THREE.Color(0x1d8f97)},
    uFoam:{value:new THREE.Color(0xffffff)},
    uIC:{value:new THREE.Vector2(ICX,ICZ)}
  },
  vertexShader:`
    uniform float uT, uWind; varying float vY; varying vec2 vXZ;
    void main(){
      vec3 p = position;
      float w = 0.3 + uWind*1.15;
      float y = sin(p.x*0.6+uT*1.5)*0.10*w
              + sin(p.z*0.8-uT*1.1)*0.08*w
              + sin((p.x+p.z)*0.35+uT*0.7)*0.07*w;
      p.y += y; vY=y; vXZ=p.xz;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0);
    }`,
  fragmentShader:`
    uniform float uT, uTide, uWind; uniform vec3 uShallow,uDeep,uFoam;
    uniform vec2 uIC; varying float vY; varying vec2 vXZ;
    void main(){
      float d = length(vXZ-uIC);
      float rt = 5.6*sqrt(clamp(1.0-uTide/3.2, 0.0, 1.35)); // waterline radius
      rt = min(rt, 8.0);
      float body = smoothstep(rt-0.1, rt+0.4, d);
      float band = d-rt;
      float fn = 0.55+0.45*sin(vXZ.x*9.0+uT*2.3)*sin(vXZ.y*7.0-uT*1.7);
      float foam = exp(-(band-0.22)*(band-0.22)/0.16)*fn*step(0.0,band);
      float spark = pow(max(0.0, sin(vXZ.x*3.0+uT*1.6)*sin(vXZ.y*2.6-uT*1.2)), 10.0)*0.35*(0.3+uWind);
      vec3 col = mix(uDeep,uShallow, clamp(-vY*2.2+0.5,0.0,1.0));
      col = mix(col, uFoam, clamp(foam,0.0,1.0)); col += spark;
      float a = clamp(0.42*body + foam*0.55 + spark, 0.0, 0.95);
      if(a<0.02) discard;
      gl_FragColor = vec4(col, a);
    }`
});

function spawnSplash(x,z){
  let n=16;
  for(const d of droplets){
    if(n<=0) break; if(d.live) continue;
    d.live=true; d.life=rnd(1.1,0.6); d.x=x; d.y=state.tide+0.1; d.z=z;

    d.vx=Math.cos(a)*s; d.vz=Math.sin(a)*s; d.vy=rnd(5.5,2); n--;
  }
  spawnRipple(x,z);
  setTimeout(()=>spawnRipple(x,z),260);
  sfxSplash(0.5);
}

            hs:0x26325a, hg:0x223044, hi:0.32, amb:0.09, lantern:1.35, star:1 },
};
const cur = {
  top:new THREE.Color(), bottom:new THREE.Color(), sun:new THREE.Color(),
  hs:new THREE.Color(), hg:new THREE.Color(), sp:new THREE.Vector3(),
  sunI:0, hi:0, amb:0, lantern:0, star:0
};
{ const d=TOD.day;
  cur.top.setHex(d.top); cur.bottom.setHex(d.bottom); cur.sun.setHex(d.sun);
  cur.hs.setHex(d.hs); cur.hg.setHex(d.hg); cur.sp.set(...d.sp);
  cur.sunI=d.sunI; cur.hi=d.hi; cur.amb=d.amb; }
let todTarget=TOD.day;

function updateTod(dt){
  const t=todTarget, k=1-Math.pow(0.001, dt); // smooth exponential blend
  cur.top.lerp(new THREE.Color(t.top),k); cur.bottom.lerp(new THREE.Color(t.bottom),k);
  cur.sun.lerp(new THREE.Color(t.sun),k); cur.hs.lerp(new THREE.Color(t.hs),k);
  cur.hg.lerp(new THREE.Color(t.hg),k);   cur.sp.lerp(new THREE.Vector3(...t.sp),k);
  cur.sunI=lerp(cur.sunI,t.sunI,k); cur.hi=lerp(cur.hi,t.hi,k);
  cur.amb=lerp(cur.amb,t.amb,k); cur.lantern=lerp(cur.lantern,t.lantern,k);
  cur.star=lerp(cur.star,t.star,k);
  skyMat.uniforms.top.value.copy(cur.top);
  skyMat.uniforms.bottom.value.copy(cur.bottom);
  sun.color.copy(cur.sun); sun.intensity=cur.sunI; sun.position.copy(cur.sp);
  hemi.color.copy(cur.hs); hemi.groundColor.copy(cur.hg); hemi.intensity=cur.hi;
  amb.intensity=cur.amb; starMat.opacity=cur.star;
  windowMat.emissiveIntensity = 0.12 + cur.lantern*1.7;
}

  state.paused=!state.paused;

  btnPause.classList.toggle('active',state.paused);
};
$('btnReset').onclick=()=>{
  $('tide').value=0; $('wind').value=0.45;
  state.tide=0; state.wind=0.45; surfMat.uniforms.uTide.value=0;
  state.paused=false; btnPause.textContent='Pause'; btnPause.classList.remove('active');
  state.kayak.mode='docked'; btnKayak.textContent='Launch Kayak'; btnKayak.classList.remove('active');
  state.jump.phase='wander'; btnJump.classList.remove('active');
  setTod('day'); gotoCam('iso');
};
$('tide').oninput=e=>{ state.tide=parseFloat(e.target.value); surfMat.uniforms.uTide.value=state.tide; };
$('wind').oninput=e=>{ state.wind=parseFloat(e.target.value); surfMat.uniforms.uWind.value=state.wind;
  if(audio.on) audio.windGain.gain.setTargetAtTime(0.02+state.wind*0.075, audio.ctx.currentTime, 0.4); };

const todBtns={day:$('todDay'), sunset:$('todSunset'), night:$('todNight')};
function setTod(name){
  state.tod=name; todTarget=TOD[name];
  Object.entries(todBtns).forEach(([k,b])=>b.classList.toggle('active',k===name));
}
todBtns.day.onclick=()=>setTod('day');
todBtns.sunset.onclick=()=>setTod('sunset');
todBtns.night.onclick=()=>setTod('night');

const qBtns={low:$('qLow'),medium:$('qMed'),high:$('qHigh')};
Object.entries(qBtns).forEach(([k,b])=> b.onclick=()=>{
  applyQuality(k); Object.values(qBtns).forEach(x=>x.classList.remove('active')); b.classList.add('active');
});

$('menuBtn').onclick=()=>$('panels').classList.toggle('open');

/* ---------- 10. Procedural audio (starts on first gesture) ---------- */
const audio={ on:false, musicPlaying:false };
function initAudio(){
  if(audio.on) return;
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  audio.on=true; audio.ctx=ctx;
  const master=ctx.createGain(); master.gain.value=parseFloat($('vol').value)*0.9; master.connect(ctx.destination);
  audio.master=master;

  /* looping noise buffer */
  const nb=ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
  const nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  function noiseLoop(filter, gainVal, lfoHz, lfoAmt){
    const src=ctx.createBufferSource(); src.buffer=nb; src.loop=true;
    const f=ctx.createBiquadFilter(); f.type=filter.type; f.frequency.value=filter.freq; f.Q.value=filter.q||1;
    const g=ctx.createGain(); g.gain.value=gainVal;
    const lfo=ctx.createOscillator(); lfo.frequency.value=lfoHz;
    const lg=ctx.createGain(); lg.gain.value=lfoAmt;
    lfo.connect(lg); lg.connect(f.frequency);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(); lfo.start(); return g;
  }
  /* gentle breeze + lapping water */
  audio.windGain = noiseLoop({type:'lowpass',freq:420},0.05,0.07,180);
  noiseLoop({type:'bandpass',freq:760,q:0.7},0.03,0.13,320);
  noiseLoop({type:'bandpass',freq:2400,q:0.9},0.010,0.21,700);

  /* music: soft pads + occasional pentatonic bells through a delay */
  const musicGain=ctx.createGain(); musicGain.gain.value=0; musicGain.connect(master);
  audio.musicGain=musicGain;
  const delay=ctx.createDelay(1); delay.delayTime.value=0.42;
  const fb=ctx.createGain(); fb.gain.value=0.32;
  const dwet=ctx.createGain(); dwet.gain.value=0.35;
  delay.connect(fb); fb.connect(delay); delay.connect(dwet); dwet.connect(musicGain);

  const chords=[[130.8,196.0,261.6,329.6],[110.0,164.8,220.0,277.2],
                [146.8,174.6,220.0,293.7],[116.5,174.6,233.1,293.7]];
  const pent=[523.3,587.3,659.3,784.0,880.0];
  let ci=0;
  function schedule(){
    if(!audio.musicPlaying) return;
    const now=ctx.currentTime, ch=chords[ci++%chords.length];
    ch.forEach((f,i)=>{
      const o=ctx.createOscillator(); o.type=i?'triangle':'sine'; o.frequency.value=f;
      const g=ctx.createGain();
      g.gain.setValueAtTime(0,now);
      g.gain.linearRampToValueAtTime(0.055/(i+1)+0.015, now+2.2);
      g.gain.linearRampToValueAtTime(0.0001, now+8.4);
      o.connect(g); g.connect(musicGain); o.start(now); o.stop(now+8.6);
    });
    for(let n=0;n<3;n++){
      if(Math.random()<0.7){
        const t=now+1.5+Math.random()*5.5;
        const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=pent[Math.floor(Math.random()*pent.length)];
        const g=ctx.createGain();
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.05,t+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001,t+1.8);
        o.connect(g); g.connect(musicGain); g.connect(delay); o.start(t); o.stop(t+2);
      }
    }
  }
  schedule(); audio.timer=setInterval(schedule,8000);

  $('vol').oninput=e=>master.gain.setTargetAtTime(parseFloat(e.target.value)*0.9, ctx.currentTime, 0.1);
}
function sfxSplash(v){
  if(!audio.on) return;
  const ctx=audio.ctx, now=ctx.currentTime;
  const src=ctx.createBufferSource();
  const b=ctx.createBuffer(1,ctx.sampleRate*0.6,ctx.sampleRate);
  const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  src.buffer=b;
  const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(900,now);
  f.frequency.exponentialRampToValueAtTime(220,now+0.5); f.Q.value=0.8;
  const g=ctx.createGain(); g.gain.setValueAtTime(0.35*v,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.6);
  src.connect(f); f.connect(g); g.connect(audio.master); src.start(now);
}
function sfxWood(){
  if(!audio.on) return;
  const ctx=audio.ctx, now=ctx.currentTime;
  const o=ctx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(190,now);
  o.frequency.exponentialRampToValueAtTime(90,now+0.12);
  const g=ctx.createGain(); g.gain.setValueAtTime(0.12,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.18);
  o.connect(g); g.connect(audio.master); o.start(now); o.stop(now+0.2);
}
$('btnMusic').onclick=()=>{
  initAudio(); audio.ctx.resume();
  audio.musicPlaying=!audio.musicPlaying;
  audio.musicGain.gain.setTargetAtTime(audio.musicPlaying?0.9:0, audio.ctx.currentTime, 0.6);
  $('btnMusic').textContent=audio.musicPlaying?'Music Off':'Music On';
  $('btnMusic').classList.toggle('active',audio.musicPlaying);
};
addEventListener('pointerdown', ()=>{ initAudio(); audio.ctx.resume(); }, {once:true});

/* ---------- 11. Animation loop ---------- */
applyQuality('medium');
const clock=new THREE.Clock();
const dummy=new THREE.Object3D();

function tick(){
  requestAnimationFrame(tick);
  const raw=Math.min(clock.getDelta(),0.05);
  const dt=state.paused?0:raw;
  state.worldTime+=dt;
  const T=state.worldTime, tide=state.tide, wind=state.wind;

  updateTod(raw);

  /* camera tween */
  if(camTween){
    camTween.t=Math.min(1,camTween.t+raw/1.5);
    const e=easeIO(camTween.t);
    camera.position.lerpVectors(camTween.p0,camTween.p1,e);
    controls.target.lerpVectors(camTween.q0,camTween.q1,e);
    if(camTween.t>=1) camTween=null;
  }
  controls.update();

  /* underwater fog when the eye dips below the surface */
  const wantFog = camera.position.y < tide ? 1 : 0;
  fogAmount = lerp(fogAmount, wantFog, 1-Math.pow(0.01,raw));
  scene.fog = fogAmount>0.02 ? waterFog : null;
  if(scene.fog){ waterFog.color.setHex(0x2f9d96); waterFog.density=0.05*fogAmount; }

  if(!state.paused){
    /* water + caustics */
    surfMat.uniforms.uT.value=T;
    surface.position.y=tide;
    causticMat.uniforms.uT.value=T;

    /* lantern flicker */
    for(const L of lanternLights)
      L.light.intensity = cur.lantern*L.base*(1+0.12*Math.sin(T*8.5+L.phase));

    /* sway: trees + kelp follow the wind */
    for(const s of swayables){
      s.obj.rotation.z=Math.sin(T*1.4+s.phase)*s.amp*(0.25+wind*1.6);
      s.obj.rotation.x=Math.cos(T*1.1+s.phase)*s.amp*0.6*(0.25+wind*1.6);
    }
    for(const k of kelpBlades)
      k.obj.rotation.z=Math.sin(T*1.5+k.phase)*0.22*(0.3+wind*1.4);

    /* floating things ride the tide */
    for(const b of buoys){
      b.obj.position.y=tide+0.08+Math.sin(T*1.6+b.phase)*0.05*(0.4+wind);
      b.obj.rotation.z=Math.sin(T*1.2+b.phase)*0.12;
    }

    /* fish schools */
    for(const s of schools){
      const d=s.def;
      const cx=d.cx+Math.cos(T*0.07+d.d)*0.8, cz=d.cz+Math.sin(T*0.06+d.d)*0.8;
      s.fish.forEach((f,i)=>{
        const a=T*f.sp*0.5+f.a;
        const x=cx+Math.cos(a)*f.r, z=cz+Math.sin(a)*f.r;
        const y=d.y+Math.sin(T*0.9+f.ph)*0.35+Math.sin(a*3+f.ph)*0.08;
        dummy.position.set(x,clamp(y,BBOT+0.4,tide-0.35),z);
        dummy.rotation.set(0, Math.atan2(-Math.cos(a),Math.sin(a))*-1+Math.PI, Math.sin(T*6+f.ph)*0.12);
        dummy.scale.setScalar(1); dummy.updateMatrix();
        s.bodies.setMatrixAt(i,dummy.matrix); s.tails.setMatrixAt(i,dummy.matrix);
      });
      s.bodies.instanceMatrix.needsUpdate=true; s.tails.instanceMatrix.needsUpdate=true;
    }

    /* rays — graceful wandering */
    rays.forEach((r,ri)=>{
      if(ri===0) return; // jumper handled below
      const d=r.def, a=T*d.sp+d.ph;
      const x=d.cx+Math.cos(a)*d.r, z=d.cz+Math.sin(a)*d.r;
      const y=d.d+Math.sin(T*0.35+d.ph)*0.45;
      r.g.position.set(x,y,z);
      r.g.lookAt(x-Math.sin(a),y+Math.cos(T*0.5+d.ph)*0.15,z+Math.cos(a));
      const flap=Math.sin(T*2.2+r.flap);
      r.wl.rotation.x= flap*0.55; r.wr.rotation.x= flap*0.55;
      r.g.rotation.z+=flap*0.06;
    });

    /* ray leap state machine (ray 0) */
    {
      const J=state.jump, r=rays[0], d=r.def;
      const wx=d.cx+Math.cos(T*d.sp+d.ph)*d.r, wz=d.cz+Math.sin(T*d.sp+d.ph)*d.r;
      if(J.phase==='wander'){
        r.g.position.set(wx,d.d+Math.sin(T*0.4)*0.4,wz);
        r.g.lookAt(wx-Math.sin(T*d.sp+d.ph),d.d,wz+Math.cos(T*d.sp+d.ph));
        const f=Math.sin(T*2.2+r.flap); r.wl.rotation.x=f*0.55; r.wr.rotation.x=f*0.55;
        J.x=wx; J.z=wz;
      }
      else if(J.phase==='toSpot'){
        const tx=d.cx, tz=d.cz; // jump from the middle of its patrol circle
        const p=r.g.position, sp=4.5*dt;
        const dx=tx-p.x, dz=tz-p.z, dist=Math.hypot(dx,dz);
        if(dist<0.3){ J.phase='rise'; }
        else{ p.x+=dx/dist*sp; p.z+=dz/dist*sp;
          p.y=lerp(p.y,d.d,dt*2);
          r.g.lookAt(p.x+dx,p.y,p.z+dz); }
        const f=Math.sin(T*3.2); r.wl.rotation.x=f*0.6; r.wr.rotation.x=f*0.6;
      }
      else if(J.phase==='rise'){
        const p=r.g.position;
        p.y+=4.5*dt; r.g.rotation.x=lerp(r.g.rotation.x,-0.5,dt*4);
        const f=Math.sin(T*5); r.wl.rotation.x=f*0.7; r.wr.rotation.x=f*0.7;
        if(p.y>=tide+0.1){ J.phase='air'; J.vy=7.4; J.vx=Math.sin(r.g.rotation.y)*1.6; J.vz=Math.cos(r.g.rotation.y)*1.6; }
      }
      else if(J.phase==='air'){
        J.vy-=9.2*dt;
        r.g.position.x+=J.vx*dt; r.g.position.y+=J.vy*dt; r.g.position.z+=J.vz*dt;
        r.g.rotation.x=lerp(-Math.atan2(J.vy,1.8), r.g.rotation.x, 0.5);
        r.g.rotation.y=r.g.rotation.y; // hold heading
        const f=Math.sin(T*7); r.wl.rotation.x=f*0.85; r.wr.rotation.x=f*0.85;
        if(r.g.position.y<=tide){ // splashdown!
          spawnSplash(r.g.position.x, r.g.position.z);
          J.phase='dive';
        }
      }
      else if(J.phase==='dive'){
        const p=r.g.position;
        p.y-=3.2*dt; r.g.rotation.x=lerp(r.g.rotation.x,0.35,dt*3);
        const f=Math.sin(T*3); r.wl.rotation.x=f*0.6; r.wr.rotation.x=f*0.6;
        if(p.y<=d.d){ J.phase='wander'; btnJump.classList.remove('active'); }
      }
    });

    /* kayak trip */
    {
      const k=state.kayak;
      const pathPt=(a)=>new THREE.Vector3(ICX+0+Math.cos(a)*8.4+4.5-ICX*0, 0, 0); // placeholder replaced below
      const circle=(a)=>new THREE.Vector3(4.6+Math.cos(a)*5.2, 0, 1.6+Math.sin(a)*4.2);
      if(k.mode==='toPath'){
        k.t=Math.min(1,k.t+dt*0.5);
        const e=easeIO(k.t), p0=dockPos, p1=circle(k.angle);
        kayak.position.lerpVectors(p0,p1,e);
        kayak.position.y=lerp(p0.y, tide+0.16, e);
        kayak.lookAt(p1.x, kayak.position.y, p1.z);
        if(k.t>=1) k.mode='cruise';
      } else if(k.mode==='cruise'){
        k.angle+=dt*0.32;
        const p=circle(k.angle);
        kayak.position.set(p.x, tide+0.16+Math.sin(T*1.8)*0.04*(0.4+wind), p.z);
        const p2=circle(k.angle+0.05);
        kayak.lookAt(p2.x, kayak.position.y, p2.z);
        kayak.rotation.z=Math.sin(T*1.5)*0.06*(0.3+wind);
      } else if(k.mode==='toDock'){
        k.t=Math.min(1,k.t+dt*0.5);
        const e=easeIO(k.t), p1=circle(k.angle);
        kayak.position.lerpVectors(p1,dockPos,e);
        kayak.position.y=lerp(tide+0.16, dockPos.y+0.05, e);
        kayak.lookAt(lerp(p1.x,dockPos.x,e), kayak.position.y, dockPos.z);
        if(k.t>=1) k.mode='docked';
      } else { // docked — bob at the mooring
        kayak.position.set(dockPos.x-0.12, tide+0.14+Math.sin(T*1.6)*0.03*(0.4+wind), dockPos.z+0.15);
        kayak.rotation.set(0, 0.5+Math.sin(T*1.1)*0.05, Math.sin(T*1.3)*0.05*(0.3+wind));
      }
      // mooring rope with sag
      if(k.mode==='docked'||k.mode==='toDock'||k.mode==='toPath'){
        const pos=ropeGeo.attributes.position;
        for(let i=0;i<8;i++){
          const s=i/7;
          const x=lerp(PIER_X-0.95, kayak.position.x, s);
          const z=lerp(4.6, kayak.position.z, s);
          const y=lerp(0.75, kayak.position.y+0.1, s) - Math.sin(s*Math.PI)*0.22;
          pos.setXYZ(i,x,y,z);
        }
        pos.needsUpdate=true; rope.visible=true;
      } else rope.visible=false;
    }

    /* bubbles */
    {
      const arr=bubbles;
      arr.forEach((b,i)=>{
        b.y+=b.sp*dt;
        if(b.y>tide-0.05){
          b.y=BBOT+0.4; let x,z; do{ x=rnd(11,-11); z=rnd(8,-8); }while(islandH(x,z)>-1.5);
          b.x=x; b.z=z;
        }
        dummy.position.set(b.x+Math.sin(T*2+b.y*3)*0.06, b.y, b.z);
        dummy.scale.setScalar(0.5+Math.sin(i*7+b.y)*0.25+0.4);
        dummy.updateMatrix(); b.mesh.setMatrixAt(i,dummy.matrix);
      });
      arr._mesh.instanceMatrix.needsUpdate=true;
    }

    /* droplets */
    {
      droplets.forEach((d,i)=>{
        if(d.live){
          d.life-=dt; d.vy-=9.5*dt;
          d.x+=d.vx*dt; d.y+=d.vy*dt; d.z+=d.vz*dt;
          if(d.y<tide){ d.live=false; spawnRipple(d.x,d.z); }
          if(d.life<=0) d.live=false;
        }
        dummy.position.set(d.x, d.live?d.y:-99, d.z);
        dummy.scale.setScalar(d.live?0.8:0.0001);
        dummy.updateMatrix(); d.mesh.setMatrixAt(i,dummy.matrix);
      });
      droplets._mesh.instanceMatrix.needsUpdate=true;
    }

    /* ripples */
    for(const r of ripples){
      if(r.t<1){
        r.t=Math.min(1,r.t+dt*0.7);
        const s=0.4+r.t*4.5;
        r.mesh.scale.set(s,1,s);
        r.mesh.material.opacity=(1-r.t)*0.5;
        r.mesh.position.y=tide+0.03;
        if(r.t>=1) r.mesh.visible=false;
      }
    }
  }

  renderer.render(scene,camera);
}
tick();

/* ---------- Resize ---------- */
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
