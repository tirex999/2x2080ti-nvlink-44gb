<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ PAGE CHROME ============ */
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Nunito', sans-serif; color: #4a2c17; background: #bfe6ff; }

  /* Layered sky: gradient + sun + drifting clouds, behind the 3D canvas */
  .sky { position: fixed; inset: 0; z-index: 0;
         background: linear-gradient(180deg, #8fd6ff 0%, #c9ecff 42%, #ffefcf 78%, #ffe3b3 100%); }
  .sun { position: absolute; top: 9%; right: 13%; width: 130px; height: 130px; border-radius: 50%;
         background: radial-gradient(circle at 35% 35%, #fff6d8, #ffd166 55%, rgba(255,209,102,0) 74%);
         box-shadow: 0 0 70px 34px rgba(255,214,120,.5); animation: sunPulse 6s ease-in-out infinite; }
  @keyframes sunPulse { 50% { transform: scale(1.07); } }
  .cloud { position: absolute; background: rgba(255,255,255,.85); border-radius: 60px; filter: blur(1px);
           animation: drift linear infinite; }
  .c1 { top: 14%; left: -240px; width: 230px; height: 58px; animation-duration: 95s; }
  .c2 { top: 27%; left: -340px; width: 310px; height: 72px; opacity: .7; animation-duration: 135s; animation-delay: -45s; }
  .c3 { top: 6%;  left: -200px; width: 170px; height: 46px; opacity: .6; animation-duration: 75s;  animation-delay: -20s; }
  @keyframes drift { to { transform: translateX(calc(100vw + 450px)); } }

  #stage { position: fixed; inset: 0; z-index: 1; }
  #stage canvas { display: block; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }

  /* ============ HUD (sticker-cartoon style) ============ */
  .hud { position: fixed; z-index: 2; user-select: none; }

  .brand { top: 18px; left: 20px; transform: rotate(-1.2deg); }
  .brand h1 { font-family: 'Lilita One'; font-weight: 400; font-size: clamp(26px, 4.2vw, 42px);
              letter-spacing: .5px; line-height: 1.05; text-shadow: 3px 3px 0 rgba(255,255,255,.75); }
  .brand .emoji { display: inline-block; animation: bounce 2.2s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-7px) rotate(-10deg); } }
  .brand p { margin-top: 7px; display: inline-block; font-weight: 700; font-size: clamp(12px, 1.4vw, 15px);
             color: #7a4a22; background: rgba(255,253,247,.85); padding: 3px 12px; border-radius: 999px;
             border: 2px solid rgba(74,44,23,.25); }

  .controls { top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  button { font-family: 'Lilita One'; font-size: 15px; color: #4a2c17; background: #fffdf7;
           border: 3px solid #4a2c17; border-radius: 999px; padding: 9px 18px; cursor: pointer;
           box-shadow: 4px 4px 0 rgba(74,44,23,.25); transition: transform .15s, box-shadow .15s, background .2s; }
  button:hover  { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 rgba(74,44,23,.25); }
  button:active { transform: translate(1px,1px);   box-shadow: 2px 2px 0 rgba(74,44,23,.25); }
  button.on     { background: #ffd166; }

  .roster { left: 20px; bottom: 20px; min-width: 235px; transform: rotate(.6deg);
            background: rgba(255,253,247,.93); border: 3px solid #4a2c17; border-radius: 16px;
            padding: 12px 16px; box-shadow: 6px 6px 0 rgba(74,44,23,.18); }
  .roster-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
  .roster-head .label { font-family: 'Lilita One'; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: #a05a2c; }
  .laps { font-weight: 800; font-size: 12px; background: #ffd166; border: 2px solid #4a2c17; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  #crew { list-style: none; }
  #crew li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #4a2c17; flex: none; }
  .name { font-family: 'Lilita One'; font-size: 14px; width: 66px; }
  .act { font-size: 13px; font-weight: 700; color: #8a5a3b; }

  .pop { animation: pop .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

  .hint { right: 20px; bottom: 20px; background: rgba(255,253,247,.85); border: 2px solid rgba(74,44,23,.3);
          border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 700; color: #7a4a22; }

  .toast-wrap { position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%); z-index: 3;
                display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { font-family: 'Lilita One'; font-size: 15px; background: #fffdf7; border: 3px solid #4a2c17; border-radius: 999px;
           padding: 8px 22px; box-shadow: 4px 4px 0 rgba(74,44,23,.25); animation: rise .5s cubic-bezier(.34,1.56,.64,1); }
  .toast.bye { transition: all .4s; opacity: 0; transform: translateY(-14px); }
  @keyframes rise { from { transform: translateY(22px) scale(.6); opacity: 0; } }

  #boot { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
          background: linear-gradient(180deg, #8fd6ff, #ffefcf); font-family: 'Lilita One'; font-size: 22px;
          text-align: center; line-height: 1.6; transition: opacity .5s; }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .brand { top: 12px; left: 12px; }
    .controls { top: auto; bottom: 12px; right: 12px; flex-direction: row; }
    button { padding: 7px 12px; font-size: 13px; }
    .roster { left: 12px; bottom: 66px; min-width: 0; padding: 10px 12px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud, .sun, .brand .emoji { animation: none; }
  }
</style>
</head>
<body>

  <div class="sky">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
  </div>

  <div id="stage"></div>

  <header class="hud brand">
    <h1><span class="emoji">🐹</span> Hamster Playground</h1>
    <p>four very busy rodents · one very small gym</p>
  </header>

  <nav class="hud controls">
    <button id="btnFeed">🥕 Feed</button>
    <button id="btnSpin">💨 Spin wheel</button>
    <button id="btnOrbit" class="on" aria-pressed="true">🔄 Auto-orbit</button>
  </nav>

  <section class="hud roster">
    <div class="roster-head">
      <span class="label">Crew status</span>
      <span class="laps" id="laps">🏃 0 laps</span>
    </div>
    <ul id="crew"></ul>
  </section>

  <div class="hud hint">🖱️ drag to orbit · scroll to zoom</div>

  <div class="toast-wrap" id="toasts"></div>

  <div id="boot"><span class="spin">🐹</span> warming up the wheel…</div>

  <!-- Watchdog: if Three.js never loads (offline / CDN blocked), say so kindly -->
  <script>
    setTimeout(function () {
      if (!window.__hpReady) {
        var b = document.getElementById('boot');
        b.innerHTML = '😿 Couldn\u2019t load Three.js from the CDN.<br>Check your connection and refresh.';
      }
    }, 6000);
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  /* ================= UTILITIES ================= */
  const rand  = (a, b) => a + Math.random() * (b - a);
  const pick  = arr => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOutBack = x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
  function lerpAngle(a, b, k) {
    let d = (b - a) % (Math.PI * 2);
    if (d >  Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return a + d * Math.min(1, k);
  }
  const mat = (color, o = {}) =>
    new THREE.MeshStandardMaterial(Object.assign({ color, flatShading: true, roughness: .9, metalness: 0 }, o));

  /* ================= RENDERER / SCENE / CAMERA ================= */
  const G = 0.45;                       // walking surface height (top of the sand)
  const stage = document.getElementById('stage');
  const boot  = document.getElementById('boot');

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xffe9cd, 22, 46);

  const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 100);
  camera.position.set(8.5, 6, 9.5);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.1, 0);
  controls.enableDamping = true;  controls.dampingFactor = .08;
  controls.minDistance = 5;       controls.maxDistance = 20;
  controls.maxPolarAngle = 1.42;  controls.enablePan = false;
  controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  controls.autoRotateSpeed = .7;

  /* ================= LIGHTS ================= */
  scene.add(new THREE.HemisphereLight(0xbfe8ff, 0xffdcb8, .9));
  const sun = new THREE.DirectionalLight(0xfff2d9, 2.2);
  sun.position.set(6, 9, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -7;  sun.shadow.camera.right = 7;
  sun.shadow.camera.top  =  7;  sun.shadow.camera.bottom = -7;
  sun.shadow.camera.near = 1;   sun.shadow.camera.far = 25;
  sun.shadow.bias = -0.0005;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffd9c0, .5);
  fill.position.set(-6, 4, -4);
  scene.add(fill);

  /* ================= GROUND / RUG / DUST ================= */
  const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 40), mat(0xcdeab0, { roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  const rug = new THREE.Mesh(new THREE.CylinderGeometry(4.8, 4.8, .08, 36), mat(0xffcf70));
  rug.position.y = .04; rug.receiveShadow = true; scene.add(rug);
  const rugRing = new THREE.Mesh(new THREE.RingGeometry(4.15, 4.45, 36), mat(0xff9e6d));
  rugRing.rotation.x = -Math.PI / 2; rugRing.position.y = .085; scene.add(rugRing);

  const dustGeo = new THREE.BufferGeometry();
  const dp = [];
  for (let i = 0; i < 40; i++) dp.push(rand(-3, 3), rand(.6, 2.4), rand(-2.2, 2.2));
  dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3));
  const dust = new THREE.Points(dustGeo,
    new THREE.PointsMaterial({ color: 0xffffff, size: .05, transparent: true, opacity: .45 }));
  scene.add(dust);

  /* ================= CAGE (tray + sand + wire bars) ================= */
  const cage = new THREE.Group(); scene.add(cage);
  const tubMat = mat(0x8fd3e8, { roughness: .5 });
  const sandMat = mat(0xecd9a8, { roughness: 1 });

  function slab(w, h, d, x, y, z, m = tubMat) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    s.position.set(x, y, z); s.castShadow = s.receiveShadow = true;
    cage.add(s); return s;
  }
  slab(7,   .15, 5.4, 0,    .075, 0);        // base
  slab(7,   .4,  .3,  0,    .3,   2.55);     // tub walls
  slab(7,   .4,  .3,  0,    .3,  -2.55);
  slab(.3,  .4,  5.4, 3.35, .3,   0);
  slab(.3,  .4,  5.4, -3.35, .3,  0);
  slab(6.4, .3,  4.8, 0,    .3,   0, sandMat); // bedding, top = G

  // wood shavings scattered in the sand
  const shav = new THREE.InstancedMesh(new THREE.CylinderGeometry(.06, .06, .14, 5), mat(0xd9b07a), 60);
  {
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3();
    for (let i = 0; i < 60; i++) {
      e.set(rand(-.5, .5), rand(0, 6.28), rand(-.5, .5)); q.setFromEuler(e);
      v.set(rand(-3, 3), .47, rand(-2.2, 2.2));
      m4.compose(v, q, new THREE.Vector3(1, rand(.4, .8), 1));
      shav.setMatrixAt(i, m4);
    }
  }
  shav.receiveShadow = true; scene.add(shav);

  // wire bars + rails
  const barMat = mat(0xd9dee3, { metalness: .55, roughness: .35 });
  const barGeo = new THREE.CylinderGeometry(.028, .028, 2.1, 6);
  function bar(x, z) {
    const b = new THREE.Mesh(barGeo, barMat);
    b.position.set(x, 1.55, z); b.castShadow = true; cage.add(b);
  }
  for (let x = -3.2; x <= 3.21; x += .8) { bar(x,  2.4); bar(x, -2.4); }
  for (let z = -2.4; z <= 2.41; z += .8) { bar( 3.2, z); bar(-3.2, z); }
  function rail(len, x, y, z, alongX) {
    const r = new THREE.Mesh(new THREE.CylinderGeometry(.035, .035, len, 6), barMat);
    if (alongX) r.rotation.z = Math.PI / 2; else r.rotation.x = Math.PI / 2;
    r.position.set(x, y, z); r.castShadow = true; cage.add(r);
  }
  for (const y of [2.6, 1.55]) {
    rail(6.4, 0, y,  2.4, true); rail(6.4, 0, y, -2.4, true);
    rail(4.8, 3.2, y, 0, false); rail(4.8, -3.2, y, 0, false);
  }

  /* ================= EXERCISE WHEEL (the interactive object) ================= */
  const wheel = { vel: 0, runner: null };
  {
    const grp = new THREE.Group(); grp.position.set(-2.2, G, -1.0);
    const wood = mat(0xa9714b, { roughness: .7 });
    const base = new THREE.Mesh(new THREE.BoxGeometry(1.5, .12, .7), wood);
    base.position.y = .06; base.castShadow = base.receiveShadow = true;
    const post = new THREE.Mesh(new THREE.CylinderGeometry(.06, .08, .88, 8), wood);
    post.position.y = .56; post.castShadow = true;
    const spin = new THREE.Group(); spin.position.y = 1.0;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(.85, .075, 10, 28), mat(0xff6f61, { roughness: .5 }));
    ring.castShadow = true; spin.add(ring);
    const spokeGeo = new THREE.CylinderGeometry(.025, .025, .85, 5);
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      const s = new THREE.Mesh(spokeGeo, mat(0xffd166));
      s.position.set(Math.cos(a) * .425, Math.sin(a) * .425, 0);
      s.rotation.z = a - Math.PI / 2; s.castShadow = true; spin.add(s);
    }
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, .16, 10), mat(0xe05548));
    hub.rotation.x = Math.PI / 2; hub.castShadow = true; spin.add(hub);
    grp.add(base, post, spin);
    scene.add(grp);
    wheel.spin = spin;
  }
  const WHEEL_SPOT = new THREE.Vector3(-2.2, G, 0.02);   // where a hamster "runs"

  /* ================= FOOD BOWL + PLANT (props) ================= */
  const BOWL_POS = new THREE.Vector3(2.15, G, 1.15);
  {
    const bowl = new THREE.Group(); bowl.position.copy(BOWL_POS);
    const outer = new THREE.Mesh(new THREE.CylinderGeometry(.42, .3, .2, 10), mat(0x6fd08c, { roughness: .5 }));
    outer.position.y = .1; outer.castShadow = outer.receiveShadow = true;
    const rim = new THREE.Mesh(new THREE.TorusGeometry(.42, .045, 8, 14), mat(0x6fd08c, { roughness: .5 }));
    rim.rotation.x = Math.PI / 2; rim.position.y = .2; rim.castShadow = true;
    const inner = new THREE.Mesh(new THREE.CylinderGeometry(.34, .34, .03, 10), mat(0x3f9e68));
    inner.position.y = .17;
    bowl.add(outer, rim, inner); scene.add(bowl);
  }
  {
    const plant = new THREE.Group(); plant.position.set(2.55, G, -1.6);
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(.22, .18, .25, 8), mat(0xff8f6b));
    pot.position.y = .125; pot.castShadow = true;
    const leafCols = [0x5cb85c, 0x7ac74f, 0x4aa04a];
    [[0, .42, 0, .17], [.1, .32, .06, .12], [-.09, .34, -.05, .12]].forEach(([x, y, z, r], i) => {
      const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), mat(leafCols[i]));
      leaf.position.set(x, y, z); leaf.castShadow = true; plant.add(leaf);
    });
    plant.add(pot); scene.add(plant);
  }

  /* ================= HAMSTERS ================= */
  const DEFS = [
    { name: 'Mochi',   body: 0xf2b35c, cheek: 0xffb3a0, ear: 0xd98f3f, dot: '#f2b35c' },
    { name: 'Pip',     body: 0xa9a3bd, cheek: 0xf2a9c0, ear: 0x8a84a3, dot: '#a9a3bd' },
    { name: 'Biscuit', body: 0xfaf5ec, cheek: 0xffc9c9, ear: 0xe8dcc8, dot: '#faf5ec' },
    { name: 'Peanut',  body: 0xb5805a, cheek: 0xff9e8a, ear: 0x96684a, dot: '#b5805a' },
  ];
  const START_POS = [[1.5, -1], [-1, 1.2], [.5, .5], [-1.5, -.5]];
  const BX = 2.7, BZ = 1.9;                                   // wander bounds
  const AVOID = [                                             // keep wander targets clear of props
    { x: -2.2, z: -1.0, r: 1.15 }, { x: 2.15, z: 1.15, r: .75 }, { x: 2.55, z: -1.6, r: .55 }
  ];

  function makeHamster(def, i) {
    const root = new THREE.Group();
    root.position.set(START_POS[i][0], G, START_POS[i][1]);
    root.scale.setScalar(0);                                  // pops in on load
    const fur  = mat(def.body, { roughness: .9 });
    const dark = mat(new THREE.Color(def.body).multiplyScalar(.72));
    const cheekM = mat(def.cheek), earM = mat(def.ear);
    const noseM  = mat(0xff8fa3, { roughness: .5 });
    const eyeM   = mat(0x2b2320, { roughness: .3 });

    const bodyGrp = new THREE.Group(); bodyGrp.position.y = .46;
    const body = new THREE.Mesh(new THREE.SphereGeometry(.5, 8, 6), fur);
    body.scale.set(1.12, .95, 1.3); bodyGrp.add(body);

    const headGrp = new THREE.Group(); headGrp.position.set(0, .16, .52);
    const head = new THREE.Mesh(new THREE.SphereGeometry(.33, 8, 6), fur); head.scale.set(1, .95, .95);
    const snout = new THREE.Mesh(new THREE.SphereGeometry(.13, 6, 5), fur);
    snout.position.set(0, -.06, .26); snout.scale.set(1.1, .8, 1);
    const nose = new THREE.Mesh(new THREE.SphereGeometry(.05, 6, 5), noseM);
    nose.position.set(0, -.04, .4);
    headGrp.add(head, snout, nose);

    const cheeks = [], legs = [];
    for (const s of [-1, 1]) {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(.055, 6, 5), eyeM);
      eye.position.set(s * .15, .07, .24);
      const glint = new THREE.Mesh(new THREE.SphereGeometry(.018, 5, 4), mat(0xffffff, { roughness: .2 }));
      glint.position.set(s * .13, .1, .27);
      const ear = new THREE.Mesh(new THREE.SphereGeometry(.12, 6, 5), earM);
      ear.position.set(s * .19, .3, -.02); ear.scale.set(1, .7, .6);
      const inner = new THREE.Mesh(new THREE.SphereGeometry(.07, 6, 5), cheekM);
      inner.position.set(s * .19, .31, .01); inner.scale.set(1, .6, .5);
      const cheek = new THREE.Mesh(new THREE.SphereGeometry(.17, 7, 5), cheekM);
      cheek.position.set(s * .27, -.04, .16);
      headGrp.add(eye, glint, ear, inner, cheek);
      cheeks.push(cheek);
    }
    const tail = new THREE.Mesh(new THREE.SphereGeometry(.07, 6, 5), dark);
    tail.position.set(0, -.05, -.66); bodyGrp.add(tail, headGrp);

    const legGeo = new THREE.SphereGeometry(.09, 6, 5);
    [[-.24, .34], [.24, .34], [-.24, -.34], [.24, -.34]].forEach(([lx, lz]) => {
      const pivot = new THREE.Group(); pivot.position.set(lx, -.3, lz);
      const leg = new THREE.Mesh(legGeo, dark);
      leg.position.y = -.07; leg.scale.set(1, 1.25, 1);
      pivot.add(leg); bodyGrp.add(pivot); legs.push(pivot);
    });

    root.add(bodyGrp);
    root.traverse(o => { if (o.isMesh) o.castShadow = true; });
    scene.add(root);

    return {
      def, root, bodyGrp, headGrp, legs, cheeks,
      state: 'WANDER', target: new THREE.Vector3(), timer: 0,
      speed: rand(.85, 1.15), yaw: rand(0, 6.28), phase: rand(0, 6), seed: rand(0, 10),
      lookY: 0, runner: false,
      pose: { pitch: 0, head: 0, cheek: 1, amp: .5, freq: 7 },
      bowlSpot: new THREE.Vector3(2.15 + (i - 1.5) * .4, G, .35),   // personal seat at the bowl
    };
  }

  /* ---- behavior: poses + state machine ---- */
  const POSE = {
    WANDER:    { pitch: 0,    head: 0,    cheek: 1,   amp: .5,   freq: 7  },
    TO_WHEEL:  { pitch: 0,    head: 0,    cheek: 1,   amp: .55,  freq: 8  },
    TO_BOWL:   { pitch: .05,  head: .15,  cheek: 1,   amp: .5,   freq: 7  },
    PAUSE:     { pitch: 0,    head: 0,    cheek: 1,   amp: .04,  freq: 0  },
    RUNNING:   { pitch: -.22, head: -.12, cheek: 1,   amp: 1.15, freq: 26 },
    EATING:    { pitch: .2,   head: .85,  cheek: 1.6, amp: .04,  freq: 0  },
  };
  const TXT = {
    wander: ['wandering', 'exploring', 'strolling', 'sniffing around'],
    pause:  ['daydreaming', 'taking a nap', 'vibing', 'judging the camera'],
  };

  function pickTarget(h) {
    for (let i = 0; i < 10; i++) {
      const x = rand(-BX, BX), z = rand(-BZ, BZ);
      if (!AVOID.some(a => Math.hypot(a.x - x, a.z - z) < a.r)) return new THREE.Vector3(x, G, z);
    }
    return new THREE.Vector3(rand(-BX, BX), G, rand(-BZ, BZ));
  }
  function chooseNext(h) {
    const r = Math.random();
    if (r < .45)        { h.state = 'WANDER';   h.target = pickTarget(h); h.say(pick(TXT.wander)); }
    else if (r < .65)   { h.state = 'PAUSE';    h.timer = rand(1.5, 4);  h.say(pick(TXT.pause)); }
    else if (r < .82) {
      if (!wheel.runner) { h.state = 'TO_WHEEL'; h.target = WHEEL_SPOT.clone(); h.say('heading to the wheel'); }
      else               { h.state = 'WANDER';   h.target = pickTarget(h);     h.say('wandering'); }
    }
    else                { h.state = 'TO_BOWL';  h.target = h.bowlSpot.clone(); h.say('smelling snacks'); }
  }
  function arrive(h) {
    if (h.state === 'TO_WHEEL') {
      if (!wheel.runner) {
        wheel.runner = h; h.runner = true;
        h.state = 'RUNNING'; h.timer = rand(2.5, 5.5);
        h.say('sprinting on the wheel!');
      } else chooseNext(h);
    } else if (h.state === 'TO_BOWL') {
      h.state = 'EATING'; h.timer = rand(2, 4); h.say('munching seeds');
    } else chooseNext(h);
  }
  function updateHamster(h, dt, t) {
    const p = h.root.position, T = POSE[h.state] || POSE.WANDER, k = Math.min(1, dt * 6);
    h.pose.pitch += (T.pitch - h.pose.pitch) * k;
    h.pose.head  += (T.head  - h.pose.head)  * k;
    h.pose.cheek += (T.cheek - h.pose.cheek) * k;
    h.pose.amp   += (T.amp   - h.pose.amp)   * k;
    h.pose.freq  += (T.freq  - h.pose.freq)  * k;

    switch (h.state) {
      case 'WANDER': case 'TO_WHEEL': case 'TO_BOWL': {
        const dx = h.target.x - p.x, dz = h.target.z - p.z, d = Math.hypot(dx, dz);
        if (d < (h.state === 'WANDER' ? .28 : .45)) { arrive(h); break; }
        h.yaw = lerpAngle(h.yaw, Math.atan2(dx, dz), dt * 5);
        p.x += Math.sin(h.yaw) * h.speed * dt;
        p.z += Math.cos(h.yaw) * h.speed * dt;
        h.phase += dt * h.pose.freq;
        break;
      }
      case 'PAUSE':
        h.timer -= dt;
        h.yaw += Math.sin(t * .6 + h.seed) * dt * .25;
        if (h.timer <= 0) chooseNext(h);
        break;
      case 'RUNNING':
        p.lerp(WHEEL_SPOT, Math.min(1, dt * 8));
        h.yaw = lerpAngle(h.yaw, -Math.PI / 2, dt * 6);
        h.phase += dt * h.pose.freq;
        h.timer -= dt;
        if (h.timer <= 0) {
          wheel.runner = null; h.runner = false;
          addLap(); chooseNext(h);
        }
        break;
      case 'EATING':
        p.lerp(h.bowlSpot, Math.min(1, dt * 8));
        h.yaw = lerpAngle(h.yaw, Math.atan2(BOWL_POS.x - p.x, BOWL_POS.z - p.z), dt * 6);
        h.timer -= dt;
        if (h.timer <= 0) { eatPellet(t); chooseNext(h); }
        break;
    }

    p.x = clamp(p.x, -BX, BX); p.z = clamp(p.z, -BZ, BZ);
    h.root.rotation.y = h.yaw;

    const lookTarget = h.state === 'PAUSE' ? Math.sin(t * .8 + h.seed) * .45 : 0;
    h.lookY += (lookTarget - h.lookY) * Math.min(1, dt * 3);

    h.bodyGrp.rotation.x = h.pose.pitch;
    h.bodyGrp.rotation.z = Math.sin(h.phase) * .05 * h.pose.amp;
    h.bodyGrp.position.y = .46 + Math.sin(h.phase * 2) * .025 * h.pose.amp
                           + (h.state === 'RUNNING' ? Math.abs(Math.sin(h.phase)) * .04 : 0);
    h.bodyGrp.scale.y = 1 + Math.sin(t * 2.2 + h.seed) * .02;             // breathing
    h.headGrp.rotation.x = h.pose.head
                         + (h.state === 'EATING' ? Math.sin(t * 11) * .08 : 0)
                         + Math.sin(h.phase * 2 + .5) * .05 * h.pose.amp;
    h.headGrp.rotation.y = h.lookY;
    const OFF = [0, Math.PI, Math.PI, 0];                                  // diagonal gait
    h.legs.forEach((L, i) => L.rotation.x = Math.sin(h.phase + OFF[i]) * h.pose.amp);
    h.cheeks.forEach(c => c.scale.setScalar(h.pose.cheek));                // puffy cheeks when eating
  }
  function separate() {                                                    // gentle anti-crowding
    for (let i = 0; i < hamsters.length; i++)
      for (let j = i + 1; j < hamsters.length; j++) {
        const a = hamsters[i], b = hamsters[j];
        if (a.state === 'RUNNING' || b.state === 'RUNNING') continue;
        const dx = b.root.position.x - a.root.position.x,
              dz = b.root.position.z - a.root.position.z,
              d = Math.hypot(dx, dz);
        if (d < .8 && d > 1e-4) {
          const push = (.8 - d) * .5, nx = dx / d, nz = dz / d;
          a.root.position.x = clamp(a.root.position.x - nx * push, -BX, BX);
          a.root.position.z = clamp(a.root.position.z - nz * push, -BZ, BZ);
          b.root.position.x = clamp(b.root.position.x + nx * push, -BX, BX);
          b.root.position.z = clamp(b.root.position.z + nz * push, -BZ, BZ);
        }
      }
  }

  /* ================= SEED PELLETS (feed button) ================= */
  const pellets = [];
  const PELLET_COLS = [0xff9f43, 0xffd166, 0x8ac926, 0xe76f51];
  function spawnPellets(n, t) {
    while (pellets.length > 14) { const p = pellets[0]; p.dying = 1; p.d0 = t; }
    for (let i = 0; i < n; i++) {
      const aroundBowl = Math.random() < .6;
      const a = rand(0, 6.28), r = aroundBowl ? rand(.25, .6) : rand(.5, 1.4);
      const m = new THREE.Mesh(new THREE.DodecahedronGeometry(.05, 0), mat(pick(PELLET_COLS), { roughness: .6 }));
      m.position.set(BOWL_POS.x + Math.cos(a) * r, G + .05, BOWL_POS.z + Math.sin(a) * r);
      m.castShadow = true; m.scale.setScalar(0);
      scene.add(m);
      pellets.push({ m, t0: t + i * .06, dying: 0, d0: 0 });
    }
  }
  function eatPellet(t) {
    const p = pellets.find(q => !q.dying);
    if (p) { p.dying = 1; p.d0 = t; }
  }
  function updatePellets(t) {
    for (let i = pellets.length - 1; i >= 0; i--) {
      const p = pellets[i];
      let s;
      if (p.dying) {
        s = Math.max(0, 1 - (t - p.d0) / .35);
        if (s <= 0) { scene.remove(p.m); pellets.splice(i, 1); continue; }
      } else s = easeOutBack(Math.min(1, (t - p.t0) / .35));
      p.m.scale.setScalar(Math.max(.001, s));
    }
  }

  /* ================= HUD WIRING ================= */
  const crewEl = document.getElementById('crew');
  const lapsEl = document.getElementById('laps');
  const lapsBtn = document.getElementById('btnOrbit');
  const toasts = document.getElementById('toasts');
  let laps = 0;

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    toasts.appendChild(el);
    setTimeout(() => el.classList.add('bye'), 1400);
    setTimeout(() => el.remove(), 1900);
  }
  function pop(el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  function addLap() {
    laps++;
    lapsEl.textContent = `🏃 ${laps} lap${laps === 1 ? '' : 's'}`;
    pop(lapsEl);
  }
  function syncOrbitBtn() {
    lapsBtn.classList.toggle('on', controls.autoRotate);
    lapsBtn.setAttribute('aria-pressed', String(controls.autoRotate));
  }

  const hamsters = DEFS.map((def, i) => {
    const h = makeHamster(def, i);
    const li = document.createElement('li');
    li.innerHTML = `<span class="dot" style="background:${def.dot}"></span>
                    <span class="name">${def.name}</span>
                    <span class="act">waking up</span>`;
    crewEl.appendChild(li);
    h.say = txt => {
      const el = li.querySelector('.act');
      if (el.textContent !== txt) { el.textContent = txt; pop(el); }
    };
    h.state = 'WANDER'; h.target = pickTarget(h); h.say(pick(TXT.wander));
    return h;
  });

  document.getElementById('btnFeed').onclick = () => {
    spawnPellets(8, clock.elapsedTime);
    hamsters.forEach(h => {
      if (h.state !== 'RUNNING') { h.state = 'TO_BOWL'; h.target = h.bowlSpot.clone(); h.say('smelling snacks'); }
    });
    toast('🥕 Snack drop!');
  };
  document.getElementById('btnSpin').onclick = () => {
    wheel.vel += 11;
    toast('💨 Wheel boost!');
  };
  lapsBtn.onclick = () => { controls.autoRotate = !controls.autoRotate; syncOrbitBtn(); };
  renderer.domElement.addEventListener('pointerdown', () => {
    if (controls.autoRotate) { controls.autoRotate = false; syncOrbitBtn(); }
  });
  syncOrbitBtn();

  /* ================= MAIN LOOP ================= */
  const clock = new THREE.Clock();
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  function introScale(t, i) {
    const x = clamp((t - i * .22) / .55, 0, 1);
    return x <= 0 ? 0 : easeOutBack(x);
  }

  function tick() {
    requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), .05);
    const t = clock.elapsedTime;

    hamsters.forEach((h, i) => {
      h.root.scale.setScalar(introScale(t, i));   // staggered pop-in
      updateHamster(h, dt, t);
    });
    separate();

    const targetSpin = wheel.runner ? 10 : 0;      // wheel follows its rider, then coasts down
    wheel.vel += (targetSpin - wheel.vel) * Math.min(1, dt * (targetSpin ? 2 : 1.1));
    wheel.spin.rotation.z -= wheel.vel * dt;

    updatePellets(t);
    dust.rotation.y = t * .03;
    dust.position.y = Math.sin(t * .4) * .08;

    controls.update();
    renderer.render(scene, camera);

    if (!window.__hpReady) { window.__hpReady = true; boot.classList.add('done'); }
  }
  tick();
  </script>
</body>
</html>
