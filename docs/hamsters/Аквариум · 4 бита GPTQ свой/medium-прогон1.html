<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Аквариум</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }

    .glass-panel {
        position: fixed;
        background: rgba(10, 30, 60, 0.45);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(120, 190, 255, 0.25);
        border-radius: 16px;
        color: #e0f2ff;
        padding: 18px 22px;
        box-shadow: 0 8px 32px rgba(0, 20, 60, 0.4),
                    0 0 20px rgba(80, 160, 255, 0.15) inset;
        z-index: 10;
    }

    #info-panel { top: 20px; left: 20px; max-width: 300px; }
    #stats-panel { top: 20px; right: 20px; min-width: 170px; text-align: center; }

    h1 {
        font-size: 22px;
        background: linear-gradient(90deg, #4fc3f7, #81c784, #ffd54f);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
    }

    .instructions { font-size: 12.5px; line-height: 1.7; opacity: 0.85; margin-bottom: 14px; }
    .instructions b { color: #81d4fa; }

    .stat-row {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 14px; margin-bottom: 8px;
    }
    .stat-value { font-weight: bold; color: #ffd54f; font-size: 16px; }

    button {
        width: 100%;
        margin-top: 8px;
        padding: 10px 14px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    }
    button:hover { transform: translateY(-2px); filter: brightness(1.15); }
    button:active { transform: translateY(0); }

    .btn-fish {
        background: linear-gradient(135deg, #1976d2, #00bcd4);
        box-shadow: 0 4px 14px rgba(0, 188, 212, 0.4);
    }
    .btn-bubbles {
        background: linear-gradient(135deg, #00897b, #4caf50);
        box-shadow: 0 4px 14px rgba(76, 175, 80, 0.4);
    }
    .btn-light {
        background: linear-gradient(135deg, #ff8f00, #ffb300);
        box-shadow: 0 4px 14px rgba(255, 179, 0, 0.4);
    }

    #toast {
        position: fixed; bottom: 30px; left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: rgba(10, 40, 80, 0.7);
        backdrop-filter: blur(10px);
        color: #b3e5fc; padding: 12px 24px; border-radius: 12px;
        font-size: 14px; opacity: 0; transition: all 0.4s;
        border: 1px solid rgba(120, 190, 255, 0.3);
        pointer-events: none; z-index: 20;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
        #info-panel { max-width: 200px; padding: 12px; }
        .instructions { display: none; }
        #stats-panel { min-width: 130px; padding: 12px; }
    }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div class="glass-panel" id="info-panel">
    <h1>🐠 3D Аквариум</h1>
    <div class="instructions">
        <b>ЛКМ + движение</b> — вращение камеры<br>
        <b>ПКМ + движение</b> — панорама<br>
        <b>Колесо</b> — зум<br>
        <b>Клик по воде</b> — покормить рыбок
    </div>
    <button class="btn-fish" onclick="addFish()">🐟 Добавить рыбку</button>
    <button class="btn-bubbles" onclick="addBubbles()">💨 Больше пузырей</button>
    <button class="btn-light" id="lightBtn" onclick="toggleLight()">💡 Свет: ВКЛ</button>
</div>

<div class="glass-panel" id="stats-panel">
    <div class="stat-row"><span>Рыбки:</span><span class="stat-value" id="fishCount">0</span></div>
    <div class="stat-row"><span>FPS:</span><span class="stat-value" id="fpsCounter">0</span></div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
// ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ============================================================
const TANK = { w: 36, h: 24, d: 20 }; // ширина, высота, глубина
let scene, camera, renderer, controls;
let clock = new THREE.Clock();
let fishArray = [];
let bubbleArray = [];
let foodArray = [];
let seaweedArray = [];
let sunLight;
let lightOn = true;

// FPS
let frames = 0, fpsTime = 0;

// Цветовые схемы рыбок: [тело, хвост]
const FISH_COLORS = [
    [0xff8c1a, 0xff6600], // оранжевая
    [0x2196f3, 0x0d47a1], // синяя
    [0xffd54f, 0xd84315], // жёлто-красная
    [0xab47bc, 0x6a1b9a], // фиолетовая
    [0xe53935, 0xb71c1c], // красная
    [0x43a047, 0x1b5e20], // зелёная
    [0xf48fb1, 0xc2185b], // розовая
    [0xffc107, 0xff8f00]  // золотая
];

// ============================================================
// ИНИЦИАЛИЗАЦИЯ СЦЕНЫ
// ============================================================
function init() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a2a50, 0.012);

    // Градиентный фон через большую сферу с шейдером
    const bgGeo = new THREE.SphereGeometry(200, 16, 16);
    const bgMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: {
            topColor: { value: new THREE.Color(0x061830) },
            bottomColor: { value: new THREE.Color(0x1a5aa0) }
        },
        vertexShader: `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; varying vec3 vPos;
            void main(){ float h = normalize(vPos).y * 0.5 + 0.5; gl_FragColor = vec4(mix(bottomColor, topColor, h), 1.0); }`
    });
    scene.add(new THREE.Mesh(bgGeo, bgMat));

    camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
    camera.position.set(0, 12, 42);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2, 0);
    controls.minDistance = 10;
    controls.maxDistance = 60;
    controls.maxPolarAngle = Math.PI / 1.8;
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    createLights();
    createTank();
    createSand();
    createRocks();
    createSeaweed();

    for (let i = 0; i < 15; i++) addFish();
    for (let i = 0; i < 30; i++) addBubble(true);

    updateStats();

    window.addEventListener('resize', onResize);
    renderer.domElement.addEventListener('click', onClickFeed);
}

// ============================================================
// ОСВЕЩЕНИЕ
// ============================================================
function createLights() {
    scene.add(new THREE.AmbientLight(0x404040, 0.4));

    sunLight = new THREE.DirectionalLight(0xaad4ff, 1.1);
    sunLight.position.set(15, 30, 10);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -25;
    sunLight.shadow.camera.right = 25;
    sunLight.shadow.camera.top = 25;
    sunLight.shadow.camera.bottom = -25;
    scene.add(sunLight);

    const p1 = new THREE.PointLight(0x00bfff, 0.6, 60);
    p1.position.set(-15, 8, 8);
    scene.add(p1);

    const p2 = new THREE.PointLight(0x1565c0, 0.6, 60);
    p2.position.set(15, 5, -8);
    scene.add(p2);
}

// ============================================================
// АКСУМУЛЮМ
// ============================================================
function createTank() {
    const geo = new THREE.BoxGeometry(TANK.w, TANK.h, TANK.d);
    const mat = new THREE.MeshPhysicalMaterial({
        color: 0x88ccee,
        transparent: true,
        opacity: 0.08,
        transmission: 0.95,
        roughness: 0.05,
        metalness: 0,
        side: THREE.DoubleSide,
        depthWrite: false
    });
    const glass = new THREE.Mesh(geo, mat);
    glass.position.y = TANK.h / 2;
    scene.add(glass);

    // Рамка (wireframe)
    const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color: 0x66ccff, transparent: true, opacity: 0.5 })
    );
    edges.position.copy(glass.position);
    scene.add(edges);
}

function createSand() {
    const geo = new THREE.PlaneGeometry(TANK.w, TANK.d, 40, 40);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i);
        pos.setZ(i,
            Math.sin(x * 0.5) * Math.cos(y * 0.7) * 0.25 +
            Math.sin(x * 1.3 + y * 0.9) * 0.12);
    }
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ color: 0xd9c28a, roughness: 1 });
    const sand = new THREE.Mesh(geo, mat);
    sand.rotation.x = -Math.PI / 2;
    sand.receiveShadow = true;
    scene.add(sand);
}

function createRocks() {
    for (let i = 0; i < 8; i++) {
        const size = 0.8 + Math.random() * 1.5;
        const geo = new THREE.DodecahedronGeometry(size, 0);
        // Деформация вершин
        const pos = geo.attributes.position;
        for (let j = 0; j < pos.count; j++) {
            pos.setXYZ(j,
                pos.getX(j) * (0.8 + Math.random() * 0.4),
                pos.getY(j) * (0.6 + Math.random() * 0.4),
                pos.getZ(j) * (0.8 + Math.random() * 0.4));
        }
        geo.computeVertexNormals();
        const rock = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 0.15, 0.25 + Math.random() * 0.15),
            roughness: 0.95
        }));
        rock.position.set(
            (Math.random() - 0.5) * (TANK.w - 6),
            0.3 + Math.random() * 0.4,
            (Math.random() - 0.5) * (TANK.d - 6));
        rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        rock.castShadow = true;
        rock.receiveShadow = true;
        scene.add(rock);
    }
}

function createSeaweed() {
    for (let i = 0; i < 12; i++) {
        const height = 3 + Math.random() * 5;
        const points = [];
        const baseX = (Math.random() - 0.5) * (TANK.w - 8);
        const baseZ = (Math.random() - 0.5) * (TANK.d - 8);
        for (let j = 0; j <= 6; j++) {
            const t = j / 6;
            points.push(new THREE.Vector3(
                baseX + Math.sin(t * 3 + i) * 0.5,
                t * height,
                baseZ + Math.cos(t * 2.5 + i) * 0.5));
        }
        const curve = new THREE.CatmullRomCurve3(points);
        const geo = new THREE.TubeGeometry(curve, 12, 0.18 + Math.random() * 0.12, 5, false);
        const mat = new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(0.32 + Math.random() * 0.1, 0.7, 0.3 + Math.random() * 0.2),
            roughness: 0.8
        });
        const weed = new THREE.Mesh(geo, mat);
        weed.castShadow = true;
        scene.add(weed);
        seaweedArray.push({ mesh: weed, phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 0.8 });
    }
}

// ============================================================
// СОЗДАНИЕ РЫБКИ
// ============================================================
function createFishMesh(colorScheme) {
    const group = new THREE.Group();
    const bodyColor = colorScheme[0], tailColor = colorScheme[1];

    // Тело — вытянутая сфера
    const body = new THREE.Mesh(
        new THREE.SphereGeometry(1, 16, 12),
        new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.35, metalness: 0.15 }));
    body.scale.set(1.6, 1, 0.85);
    body.castShadow = true;
    group.add(body);

    // Хвост — конус, вращается по Z
    const tail = new THREE.Mesh(
        new THREE.ConeGeometry(0.55, 1.1, 8),
        new THREE.MeshStandardMaterial({ color: tailColor, roughness: 0.5, transparent: true, opacity: 0.9 }));
    tail.rotation.z = Math.PI / 2;
    tail.position.x = -1.7;
    group.add(tail);

    // Верхний плавник
    const dorsal = new THREE.Mesh(
        new THREE.ConeGeometry(0.35, 0.7, 6),
        new THREE.MeshStandardMaterial({ color: tailColor, roughness: 0.5, transparent: true, opacity: 0.85 }));
    dorsal.position.set(0.1, 1.0, 0);
    group.add(dorsal);

    // Боковые плавники
    const finGeo = new THREE.ConeGeometry(0.3, 0.6, 6);
    const finMat = new THREE.MeshStandardMaterial({ color: tailColor, roughness: 0.5, transparent: true, opacity: 0.85 });
    const leftFin = new THREE.Mesh(finGeo, finMat);
    leftFin.rotation.z = Math.PI / 2.6;
    leftFin.position.set(0.2, -0.4, 0.75);
    group.add(leftFin);
    const rightFin = new THREE.Mesh(finGeo, finMat);
    rightFin.rotation.z = -Math.PI / 2.6;
    rightFin.position.set(0.2, -0.4, -0.75);
    group.add(rightFin);

    // Глаза
    const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
    const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.3 });
    [-1, 1].forEach(side => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), eyeWhiteMat);
        eye.position.set(1.0, 0.25, side * 0.5);
        group.add(eye);
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), pupilMat);
        pupil.position.set(1.15, 0.25, side * 0.58);
        group.add(pupil);
    });

    return { group, tail, leftFin, rightFin };
}

function addFish() {
    const scheme = FISH_COLORS[Math.floor(Math.random() * FISH_COLORS.length)];
    const parts = createFishMesh(scheme);
    const scale = 0.6 + Math.random() * 0.6;
    parts.group.scale.setScalar(scale);

    parts.group.position.set(
        (Math.random() - 0.5) * (TANK.w - 8),
        2 + Math.random() * (TANK.h - 5),
        (Math.random() - 0.5) * (TANK.d - 8));

    scene.add(parts.group);

    const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
    fishArray.push({
        mesh: parts.group,
        tail: parts.tail,
        leftFin: parts.leftFin,
        rightFin: parts.rightFin,
        velocity: dir.clone().multiplyScalar(1),
        speed: 2 + Math.random() * 2.5,
        tailSpeed: 6 + Math.random() * 5,
        phase: Math.random() * Math.PI * 2,
        targetFood: null,
        avoidanceRadius: 2.5 + Math.random() * 2,
        wanderTimer: Math.random() * 4
    });
    updateStats();
    showToast('🐟 Новая рыбка в аквариуме!');
}

// ============================================================
// БУБЬРЕШКИ
// ============================================================
function addBubble(initial) {
    const geo = new THREE.SphereGeometry(0.12 + Math.random() * 0.22, 10, 8);
    const mat = new THREE.MeshPhysicalMaterial({
        color: 0xcdeeff,
        transparent: true,
        opacity: 0.35,
        transmission: 0.9,
        roughness: 0.05,
        metalness: 0,
        clearcoat: 1
    });
    const bubble = new THREE.Mesh(geo, mat);
    bubble.position.set(
        (Math.random() - 0.5) * (TANK.w - 4),
        initial ? Math.random() * TANK.h : 0.5,
        (Math.random() - 0.5) * (TANK.d - 4));
    scene.add(bubble);
    bubbleArray.push({
        mesh: bubble,
        speed: 1 + Math.random() * 2,
        phase: Math.random() * Math.PI * 2,
        swayAmp: 0.3 + Math.random() * 0.6,
        baseX: bubble.position.x,
        baseZ: bubble.position.z
    });
}

function addBubbles() {
    for (let i = 0; i < 10; i++) addBubble(false);
    showToast('💨 +10 пузырей');
}

// ============================================================
// КОРМЛЕНИЕ
// ============================================================
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();

function onClickFeed(event) {
    mouseNDC.x = (event.clientX / innerWidth) * 2 - 1;
    mouseNDC.y = -(event.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);

    // Плоскость воды (y = TANK.h/2)
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -TANK.h / 2);
    const point = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(plane, point)) {
        // Ограничиваем точкой внутри аквариума
        point.x = THREE.MathUtils.clamp(point.x, -TANK.w / 2 + 1, TANK.w / 2 - 1);
        point.z = THREE.MathUtils.clamp(point.z, -TANK.d / 2 + 1, TANK.d / 2 - 1);
        spawnFood(point);
    }
}

function spawnFood(pos) {
    for (let i = 0; i < 4; i++) {
        const pellet = new THREE.Mesh(
            new THREE.SphereGeometry(0.15, 8, 6),
            new THREE.MeshStandardMaterial({ color: 0x8d6e63, roughness: 0.9 }));
        pellet.position.copy(pos);
        pellet.position.x += (Math.random() - 0.5) * 1.5;
        pellet.position.z += (Math.random() - 0.5) * 1.5;
        pellet.position.y += Math.random() * 1;
        scene.add(pellet);
        foodArray.push({
            mesh: pellet,
            velocity: new THREE.Vector3((Math.random() - 0.5) * 0.5, -0.5, (Math.random() - 0.5) * 0.5)
        });
    }
    showToast('🍽️ Корм брошен!');
}

// ============================================================
// ЛОГИКА АНИМАЦИИ
// ============================================================
function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // --- Рыбки ---
    for (let i = fishArray.length - 1; i >= 0; i--) {
        const f = fishArray[i];
        const p = f.mesh.position;

        // Поиск корма
        if (!f.targetFood || !foodArray.includes(f.targetFood)) {
            f.targetFood = null;
            let bestDist = 15;
            for (const food of foodArray) {
                const d = p.distanceTo(food.mesh.position);
                if (d < bestDist) { bestDist = d; f.targetFood = food; }
            }
        }

        // Направление движения
        const desired = new THREE.Vector3();
        if (f.targetFood) {
            desired.subVectors(f.targetFood.mesh.position, p).normalize().multiplyScalar(f.speed * 1.5);
        } else {
            // Случайное блуждание
            f.wanderTimer -= dt;
            if (f.wanderTimer <= 0) {
                f.velocity.set(Math.random() - 0.5, (Math.random() - 0.5) * 0.4, Math.random() - 0.5)
                    .normalize().multiplyScalar(f.speed);
                f.wanderTimer = 2 + Math.random() * 4;
            }
            desired.copy(f.velocity);

            // Избегание других рыбок
            for (const other of fishArray) {
                if (other === f) continue;
                const diff = new THREE.Vector3().subVectors(p, other.mesh.position);
                const dist = diff.length();
                if (dist < f.avoidanceRadius && dist > 0.001) {
                    diff.normalize().divideScalar(dist);
                    desired.add(diff.multiplyScalar(f.speed * 0.8));
                }
            }
        }

        // Плавное обновление скорости
        f.velocity.lerp(desired, dt * 2);

        // Отражение от стен (плавный поворот)
        const margin = 1.5;
        const hw = TANK.w / 2 - margin, hh = TANK.h / 2 - margin, hd = TANK.d / 2 - margin;
        if (p.x > hw) f.velocity.x = -Math.abs(f.velocity.x);
        if (p.x < -hw) f.velocity.x = Math.abs(f.velocity.x);
        if (p.y > hh) f.velocity.y = -Math.abs(f.velocity.y);
        if (p.y < 1) f.velocity.y = Math.abs(f.velocity.y);
        if (p.z > hd) f.velocity.z = -Math.abs(f.velocity.z);
        if (p.z < -hd) f.velocity.z = Math.abs(f.velocity.z);

        p.addScaledVector(f.velocity, dt);
        p.x = THREE.MathUtils.clamp(p.x, -hw, hw);
        p.y = THREE.MathUtils.clamp(p.y, 1, hh);
        p.z = THREE.MathUtils.clamp(p.z, -hd, hd);

        // Поворот в направлении движения (плавный)
        if (f.velocity.lengthSq() > 0.01) {
            const target = new THREE.Vector3().copy(f.velocity).normalize();
            const current = new THREE.Vector3(1, 0, 0).applyQuaternion(f.mesh.quaternion);
            const angle = current.angleTo(target);
            if (angle > 0.01) {
                const axis = new THREE.Vector3().crossVectors(current, target).normalize();
                f.mesh.rotateOnAxis(axis, angle * Math.min(dt * 3, 1));
            }
        }

        // Анимация хвоста и плавников
        const tailWiggle = Math.sin(t * f.tailSpeed + f.phase) * 0.5;
        f.tail.rotation.y = tailWiggle;
        f.leftFin.rotation.y = Math.sin(t * f.tailSpeed * 0.7 + f.phase) * 0.4;
        f.rightFin.rotation.y = -Math.sin(t * f.tailSpeed * 0.7 + f.phase) * 0.4;

        // Поглощение корма
        if (f.targetFood) {
            const d = p.distanceTo(f.targetFood.mesh.position);
            if (d < 0.8) {
                scene.remove(f.targetFood.mesh);
                f.targetFood.mesh.geometry.dispose();
                f.targetFood.mesh.material.dispose();
                foodArray.splice(foodArray.indexOf(f.targetFood), 1);
                f.targetFood = null;
                // Рост на 5%
                const s = f.mesh.scale.x * 1.05;
                f.mesh.scale.setScalar(Math.min(s, 2.2));
            }
        }
    }

    // --- Корм (падение) ---
    for (let i = foodArray.length - 1; i >= 0; i--) {
        const food = foodArray[i];
        food.velocity.y -= 4 * dt; // гравитация
        food.mesh.position.addScaledVector(food.velocity, dt);
        if (food.mesh.position.y <= 0.2) {
            scene.remove(food.mesh);
            food.mesh.geometry.dispose();
            food.mesh.material.dispose();
            foodArray.splice(i, 1);
        }
    }

    // --- Пузыри ---
    for (const b of bubbleArray) {
        b.mesh.position.y += b.speed * dt;
        b.mesh.position.x = b.baseX + Math.sin(t * 1.5 + b.phase) * b.swayAmp;
        b.mesh.position.z = b.baseZ + Math.cos(t * 1.2 + b.phase) * b.swayAmp;
        if (b.mesh.position.y > TANK.h - 0.5) {
            b.mesh.position.y = 0.5;
            b.baseX = (Math.random() - 0.5) * (TANK.w - 4);
            b.baseZ = (Math.random() - 0.5) * (TANK.d - 4);
        }
    }

    // --- Водоросли ---
    for (const s of seaweedArray) {
        s.mesh.rotation.x = Math.sin(t * s.speed + s.phase) * 0.08;
        s.mesh.rotation.z = Math.cos(t * s.speed * 0.8 + s.phase) * 0.08;
    }

    controls.update();
    renderer.render(scene, camera);

    // FPS
    frames++;
    fpsTime += dt;
    if (fpsTime >= 0.5) {
        document.getElementById('fpsCounter').textContent = Math.round(frames / fpsTime);
        frames = 0; fpsTime = 0;
    }
}

// ============================================================
// UI
// ============================================================
function toggleLight() {
    lightOn = !lightOn;
    sunLight.intensity = lightOn ? 1.1 : 0.15;
    document.getElementById('lightBtn').textContent = '💡 Свет: ' + (lightOn ? 'ВКЛ' : 'ВЫКЛ');
}

function updateStats() {
    document.getElementById('fishCount').textContent = fishArray.length;
}

let toastTimeout;
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
}

function onResize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
}

// Старт
init();
animate();
</script>
