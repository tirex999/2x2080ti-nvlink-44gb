<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Аквариум — тропические рыбки</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #dff4ff;
    --dim: rgba(178, 224, 248, 0.72);
    --line: rgba(125, 215, 255, 0.16);
    --panel: rgba(4, 24, 40, 0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    overflow: hidden;
    font-family: "Manrope", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #021220 0%, #05304e 48%, #0a4a74 100%);
  }
  #scene { position: fixed; inset: 0; z-index: 1; }
  #scene canvas { display: block; cursor: crosshair; }

  /* ── лучи света в воде ── */
  .rays { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; mix-blend-mode: screen; }
  .rays i {
    position: absolute; top: -30%; left: var(--x);
    width: 15vw; height: 160vh;
    background: linear-gradient(180deg, rgba(150,225,255,.17), rgba(150,225,255,.05) 45%, transparent 75%);
    filter: blur(22px);
    transform: skewX(-14deg);
    animation: ray 13s ease-in-out infinite alternate;
  }
  .rays i:nth-child(2) { --x: 44%; width: 9vw; animation-duration: 17s; animation-delay: -6s; }
  .rays i:nth-child(3) { --x: 72%; animation-duration: 15s; animation-delay: -3s; }
  @keyframes ray {
    from { opacity: .25; transform: skewX(-14deg) translateX(-4vw); }
    to   { opacity: .7;  transform: skewX(-10deg) translateX(5vw); }
  }
  .vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(1,10,18,.55) 100%);
  }

  /* ── стеклянные панели ── */
  .panel {
    position: fixed; z-index: 10;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: 0 14px 44px rgba(0,4,10,.45), inset 0 1px 0 rgba(255,255,255,.07);
  }

  .info { top: 22px; left: 22px; width: 292px; padding: 20px 22px 18px; animation: rise .8s cubic-bezier(.2,.7,.3,1) both; }
  .info h1 {
    font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 21px; letter-spacing: .4px;
    background: linear-gradient(94deg, #8ff3ff 0%, #3ee8c6 55%, #ffd166 115%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .tagline { margin-top: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: 2.6px; text-transform: uppercase; color: var(--dim); }
  .help { list-style: none; margin-top: 14px; display: grid; gap: 7px; }
  .help li { font-size: 12.5px; color: var(--dim); }
  .help b { color: var(--ink); font-weight: 700; }
  .buttons { margin-top: 16px; display: grid; gap: 9px; }

  .btn {
    appearance: none; border: 1px solid rgba(255,255,255,.16);
    font-family: "Manrope", sans-serif; font-weight: 800; font-size: 13px;
    color: #04121c; padding: 10px 12px; border-radius: 11px; cursor: pointer;
    transition: transform .16s ease, box-shadow .22s ease, filter .16s ease;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .btn:active { transform: translateY(0) scale(.97); }
  .btn-fish   { background: linear-gradient(135deg, #ffb25e, #ff7a45); box-shadow: 0 4px 16px rgba(255,122,69,.25); }
  .btn-fish:hover { box-shadow: 0 8px 26px rgba(255,122,69,.5); }
  .btn-bubble { background: linear-gradient(135deg, #7ff3ff, #2ec5ff); box-shadow: 0 4px 16px rgba(46,197,255,.25); }
  .btn-bubble:hover { box-shadow: 0 8px 26px rgba(46,197,255,.5); }
  .btn-light  { background: linear-gradient(135deg, #ffe08a, #ffc94d); box-shadow: 0 4px 16px rgba(255,201,77,.25); }
  .btn-light:hover { box-shadow: 0 8px 26px rgba(255,201,77,.5); }

  .stats { top: 22px; right: 22px; padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; min-width: 178px; animation: rise .8s .15s cubic-bezier(.2,.7,.3,1) both; }
  .stat { display: flex; flex-direction: column; gap: 3px; }
  .label { font-size: 9.5px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); }
  .value { font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 19px; }
  .value.fps { color: #4df0c8; }

  #toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    z-index: 10; padding: 11px 22px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: 13px; font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,4,10,.4);
    animation: toastIn .7s 1s both;
    transition: opacity .7s ease, transform .7s ease;
  }
  #toast.hide { opacity: 0; transform: translate(-50%, 14px); pointer-events: none; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes rise { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }

  @media (max-width: 720px) {
    .info { left: 12px; right: 12px; top: 12px; width: auto; padding: 14px 16px; }
    .info h1 { font-size: 17px; }
    .help { display: none; }
    .buttons { grid-template-columns: 1fr 1fr; }
    .btn { font-size: 11.5px; padding: 9px 6px; }
    .stats { top: auto; bottom: 12px; right: 12px; min-width: 150px; padding: 10px 12px; gap: 8px 12px; }
    .value { font-size: 15px; }
    #toast { display: none; }
  }
</style>
</head>
<body>
  <div class="rays"><i style="--x:12%"></i><i></i><i></i></div>
  <div class="vignette"></div>
  <div id="scene"></div>

  <header class="panel info">
    <h1>3D Аквариум</h1>
    <p class="tagline">тропическая лагуна · three.js</p>
    <ul class="help">
      <li><b>ЛКМ + движение</b> — вращение камеры</li>
      <li><b>ПКМ + движение</b> — панорама</li>
      <li><b>Колесо</b> — зум</li>
      <li><b>Клик по воде</b> — бросить корм</li>
    </ul>
    <div class="buttons">
      <button id="btn-fish" class="btn btn-fish">🐠 Добавить рыбку</button>
      <button id="btn-bubble" class="btn btn-bubble">🫧 Больше пузырей</button>
      <button id="btn-light" class="btn btn-light">💡 Свет: Вкл</button>
    </div>
  </header>

  <aside class="panel stats">
    <div class="stat"><span class="label">Рыбки</span><span class="value" id="stat-fish">15</span></div>
    <div class="stat"><span class="label">FPS</span><span class="value fps" id="stat-fps">—</span></div>
    <div class="stat"><span class="label">Корм</span><span class="value" id="stat-food">0</span></div>
    <div class="stat"><span class="label">Пузыри</span><span class="value" id="stat-bubbles">30</span></div>
  </aside>

  <div id="toast">🖱️ Кликните по воде, чтобы покормить рыбок</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
  (() => {
  'use strict';

  // ═══════════════ Утилиты ═══════════════
  const rand  = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ═══════════════ Константы аквариума ═══════════════
  const TANK = { w: 36, h: 24, d: 20 };
  const HW = TANK.w / 2, HD = TANK.d / 2;
  const CENTER = new THREE.Vector3(0, TANK.h / 2, 0);

  // ═══════════════ Сцена, камера, рендер ═══════════════
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x06283f, 0.011);

  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
  camera.position.set(26, 19, 31);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.getElementById('scene').appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(CENTER);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 10;
  controls.maxDistance = 60;
  controls.maxPolarAngle = Math.PI / 1.8;

  // ═══════════════ Освещение ═══════════════
  const ambient = new THREE.AmbientLight(0x404040, 0.4);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xfff2dc, 1.15);
  sun.position.set(18, 34, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -28; sun.shadow.camera.right = 28;
  sun.shadow.camera.top  =  28; sun.shadow.camera.bottom = -28;
  sun.shadow.camera.near = 2;   sun.shadow.camera.far = 90;
  scene.add(sun);

  const glowA = new THREE.PointLight(0x35d0ff, 0.9, 45);
  glowA.position.set(-10, 17, 7);
  const glowB = new THREE.PointLight(0x2a5cff, 0.8, 45);
  glowB.position.set(11, 7, -7);
  scene.add(glowA, glowB);

  // ═══════════════ Стеклянный корпус + рамка ═══════════════
  const glassGeo = new THREE.BoxGeometry(TANK.w, TANK.h, TANK.d);
  const glass = new THREE.Mesh(glassGeo, new THREE.MeshPhysicalMaterial({
    color: 0xcfeeff, transmission: 0.95, roughness: 0.06, metalness: 0
  }));
  glass.position.copy(CENTER);
  scene.add(glass);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(glassGeo),
    new THREE.LineBasicMaterial({ color: 0x7fd4ff, transparent: true, opacity: 0.55 })
  );
  edges.position.copy(CENTER);
  scene.add(edges);

  // ═══════════════ Песчаное дно (procedural рельеф) ═══════════════
  const sandGeo = new THREE.PlaneGeometry(TANK.w - 0.4, TANK.d - 0.4, 28, 18);
  sandGeo.rotateX(-Math.PI / 2);
  {
    const p = sandGeo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i);
      p.setY(i,
        Math.sin(x * 0.42) * Math.cos(z * 0.55) * 0.22 +
        Math.sin(x * 0.9 + z * 0.6) * 0.1 +
        Math.sin(x * 2.1) * Math.cos(z * 1.7) * 0.05
      );
    }
    sandGeo.computeVertexNormals();
  }
  const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({ color: 0xd8c294, roughness: 0.95 }));
  sand.receiveShadow = true;
  scene.add(sand);

  // ═══════════════ Камни (8 деформированных додекаэдров) ═══════════════
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x7a7f88, roughness: 0.92, flatShading: true });
  for (let i = 0; i < 8; i++) {
    const r = rand(0.7, 1.8);
    const g = new THREE.DodecahedronGeometry(r, 0);
    const p = g.attributes.position;
    const seed = rand(0, 10);
    for (let j = 0; j < p.count; j++) {
      const x = p.getX(j), y = p.getY(j), z = p.getZ(j);
      const k = 1 + 0.28 * Math.sin(x * 2.3 + seed) * Math.cos(y * 2.9 + z * 1.7 + seed);
      p.setXYZ(j, x * k, y * k, z * k);
    }
    g.computeVertexNormals();
    const rock = new THREE.Mesh(g, rockMat);
    rock.position.set(rand(-HW + 3, HW - 3), r * 0.5, rand(-HD + 2.5, HD - 2.5));
    rock.rotation.set(rand(0, Math.PI), rand(0, Math.PI), rand(0, Math.PI));
    rock.castShadow = rock.receiveShadow = true;
    scene.add(rock);
  }

  // ═══════════════ Водоросли (12 кустов, TubeGeometry) ═══════════════
  const weeds = [];
  const weedColors = [0x2f9e5f, 0x3cb371, 0x1f7a4d, 0x58c98a];
  for (let i = 0; i < 12; i++) {
    const bush = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: weedColors[i % weedColors.length], roughness: 0.7 });
    const strands = Math.random() < 0.5 ? 3 : 2;
    for (let s = 0; s < strands; s++) {
      const h = rand(3.5, 8.5);
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(rand(-0.7, 0.7),  h * 0.4,  rand(-0.7, 0.7)),
        new THREE.Vector3(rand(-1.1, 1.1),  h * 0.75, rand(-1.1, 1.1)),
        new THREE.Vector3(rand(-1.4, 1.4),  h,        rand(-1.4, 1.4))
      ]);
      const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 18, rand(0.12, 0.2), 5, false), mat);
      tube.castShadow = true;
      bush.add(tube);
    }
    bush.position.set(rand(-HW + 3, HW - 3), 0.25, rand(-HD + 2.5, HD - 2.5));
    scene.add(bush);
    weeds.push({ g: bush, phase: rand(0, 6.28), speed: rand(0.5, 1.1) });
  }

  // ═══════════════ Пузыри ═══════════════
  const bubbleGeo = new THREE.SphereGeometry(1, 10, 8);
  const bubbleMat = new THREE.MeshPhysicalMaterial({
    color: 0xcfefff, transmission: 0.85, thickness: 0.3,
    transparent: true, opacity: 0.5, roughness: 0.05
  });
  const bubbles = [];

  function addBubbleAt(x, y, z, r, speed) {
    if (bubbles.length > 90) {
      const old = bubbles.shift();
      scene.remove(old.mesh);
    }
    const b = {
      mesh: new THREE.Mesh(bubbleGeo, bubbleMat),
      speed, phase: rand(0, 6.28), baseX: x, baseZ: z, r
    };
    b.mesh.position.set(x, y, z);
    b.mesh.scale.setScalar(r);
    scene.add(b.mesh);
    bubbles.push(b);
  }
  function spawnBubble(fromBottom) {
    addBubbleAt(rand(-HW + 1.5, HW - 1.5), fromBottom ? 0.4 : rand(1, TANK.h - 1.5),
                rand(-HD + 1.5, HD - 1.5), rand(0.05, 0.16), rand(1.2, 2.6));
  }
  for (let i = 0; i < 30; i++) spawnBubble(false);

  // ═══════════════ Рыбки ═══════════════
  const SCHEMES = [
    { body: 0xff8c1a, fin: 0xffc169, metal: 0.2  }, // оранжевая
    { body: 0x2e7cff, fin: 0x8fc1ff, metal: 0.2  }, // синяя
    { body: 0xffb300, fin: 0xff4d2e, metal: 0.2  }, // жёлто-красная
    { body: 0x9b5cf6, fin: 0xd0b3ff, metal: 0.2  }, // фиолетовая
    { body: 0xe63946, fin: 0xff8a8a, metal: 0.2  }, // красная
    { body: 0x2ec46b, fin: 0x8fe8ae, metal: 0.2  }, // зелёная
    { body: 0xff6fa5, fin: 0xffb9d2, metal: 0.2  }, // розовая
    { body: 0xf5b942, fin: 0xffe08a, metal: 0.65 }, // золотая
  ];

  const bodyGeo  = new THREE.SphereGeometry(1, 16, 12);
  const eyeGeo   = new THREE.SphereGeometry(1, 8, 8);
  const tailGeo  = new THREE.ConeGeometry(0.6, 1.0, 8);
  const finGeo   = new THREE.SphereGeometry(1, 8, 6);
  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 });
  const pupilMat    = new THREE.MeshStandardMaterial({ color: 0x0a0a14, roughness: 0.2 });

  const fishArray = [];

  function createFish(px, py, pz) {
    const scheme = SCHEMES[(Math.random() * SCHEMES.length) | 0];
    const bodyMat = new THREE.MeshStandardMaterial({ color: scheme.body, roughness: 0.35, metalness: scheme.metal });
    const finMat  = new THREE.MeshStandardMaterial({ color: scheme.fin, roughness: 0.5, metalness: scheme.metal * 0.5, transparent: true, opacity: 0.9 });

    const root = new THREE.Group();
    const model = new THREE.Group();
    model.rotation.y = -Math.PI / 2; // «нос» модели (+X) смотрит вдоль +Z корня → работает lookAt
    root.add(model);

    // вытянутое тело
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.scale.set(1.5, 0.95, 0.7);
    body.castShadow = true;
    model.add(body);

    // глаза со зрачками
    for (const sgn of [1, -1]) {
      const eye = new THREE.Mesh(eyeGeo, eyeWhiteMat);
      eye.scale.setScalar(0.17);
      eye.position.set(1.05, 0.28, sgn * 0.32);
      model.add(eye);
      const pupil = new THREE.Mesh(eyeGeo, pupilMat);
      pupil.scale.setScalar(0.09);
      pupil.position.set(1.18, 0.28, sgn * 0.33);
      model.add(pupil);
    }

    // хвост: крестовина (вертикальный + горизонтальный лепесток), махание — вращение по Z
    const tail = new THREE.Group();
    tail.position.set(-1.4, 0, 0);
    const tailV = new THREE.Mesh(tailGeo, finMat);
    tailV.rotation.z = -Math.PI / 2;
    tailV.position.x = -0.5;
    tailV.scale.set(1, 1, 0.35);
    tailV.castShadow = true;
    const tailH = new THREE.Mesh(tailGeo, finMat);
    tailH.rotation.z = -Math.PI / 2;
    tailH.position.x = -0.5;
    tailH.scale.set(1, 0.35, 1);
    tail.add(tailV, tailH);
    model.add(tail);

    // спинной плавник
    const dorsal = new THREE.Mesh(finGeo, finMat);
    dorsal.scale.set(0.55, 0.4, 0.12);
    dorsal.position.set(-0.2, 0.95, 0);
    model.add(dorsal);

    // грудные (боковые) плавники
    const leftFin = new THREE.Mesh(finGeo, finMat);
    leftFin.scale.set(0.5, 0.14, 0.42);
    leftFin.position.set(0.5, -0.1, 0.55);
    leftFin.rotation.x = -0.45;
    const rightFin = new THREE.Mesh(finGeo, finMat);
    rightFin.scale.set(0.5, 0.14, 0.42);
    rightFin.position.set(0.5, -0.1, -0.55);
    rightFin.rotation.x = 0.45;
    model.add(leftFin, rightFin);

    const baseScale = rand(0.6, 1.2);
    root.scale.setScalar(baseScale);
    root.position.set(
      px !== undefined ? px : rand(-HW + 4, HW - 4),
      py !== undefined ? py : rand(5, TANK.h - 5),
      pz !== undefined ? pz : rand(-HD + 3, HD - 3)
    );
    scene.add(root);

    fishArray.push({
      mesh: root, model, tail, leftFin, rightFin, dorsal,
      velocity: new THREE.Vector3(rand(-1, 1), rand(-0.5, 0.5), rand(-1, 1)).normalize().multiplyScalar(2),
      speed: rand(2.2, 4.2),
      tailSpeed: rand(6, 11),
      phase: rand(0, Math.PI * 2),
      targetFood: null,
      avoidanceRadius: rand(1.2, 2.2),
      wanderTimer: rand(1, 4),
      wanderDir: new THREE.Vector3(rand(-1, 1), rand(-0.6, 0.6), rand(-1, 1)).normalize(),
      dart: 0,
      baseScale
    });
  }
  for (let i = 0; i < 15; i++) createFish();

  // ═══════════════ Корм и рябь ═══════════════
  const foodGeo = new THREE.SphereGeometry(0.16, 10, 8);
  const foodMat = new THREE.MeshStandardMaterial({ color: 0xd9822b, emissive: 0x7a3c08, emissiveIntensity: 0.6, roughness: 0.6 });
  const foods = [];

  const rippleGeo = new THREE.RingGeometry(0.4, 0.55, 32);
  const ripples = [];
  function addRipple(p) {
    const m = new THREE.Mesh(rippleGeo, new THREE.MeshBasicMaterial({
      color: 0x9fe8ff, transparent: true, opacity: 0.7, side: THREE.DoubleSide, depthWrite: false
    }));
    m.position.copy(p);
    m.rotation.x = -Math.PI / 2;
    scene.add(m);
    ripples.push({ mesh: m, age: 0 });
  }

  function spawnFood(point) {
    for (let i = 0; i < 3; i++) {
      const m = new THREE.Mesh(foodGeo, foodMat);
      m.position.set(
        clamp(point.x + rand(-0.7, 0.7), -HW + 1, HW - 1),
        clamp(point.y + rand(0, 0.8), 1.5, TANK.h - 1.5),
        clamp(point.z + rand(-0.7, 0.7), -HD + 1, HD - 1)
      );
      scene.add(m);
      foods.push({ mesh: m, vel: new THREE.Vector3(rand(-0.4, 0.4), -rand(0.5, 1.2), rand(-0.4, 0.4)) });
    }
    addRipple(point);
  }

  // ═══════════════ Клик по воде → корм ═══════════════
  const toast = document.getElementById('toast');
  function hideToast() { toast.classList.add('hide'); }
  setTimeout(hideToast, 10000);

  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const feedPlane = new THREE.Plane();
  let downX = 0, downY = 0, isDown = false;

  renderer.domElement.addEventListener('pointerdown', e => {
    isDown = true;
    downX = e.clientX; downY = e.clientY;
  });
  addEventListener('pointerup', e => {
    if (!isDown) return;
    isDown = false;
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (dx * dx + dy * dy > 36) return; // это было вращение камеры, а не клик
    ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    feedPlane.normal.copy(camera.position).sub(CENTER).normalize();
    feedPlane.constant = -feedPlane.normal.dot(CENTER);
    const hit = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(feedPlane, hit)) {
      hit.x = clamp(hit.x, -HW + 1.5, HW - 1.5);
      hit.y = clamp(hit.y, 2, TANK.h - 2);
      hit.z = clamp(hit.z, -HD + 1.5, HD - 1.5);
      spawnFood(hit);
      hideToast();
    }
  });

  // ═══════════════ Кнопки ═══════════════
  const el = {
    fish:    document.getElementById('stat-fish'),
    fps:     document.getElementById('stat-fps'),
    food:    document.getElementById('stat-food'),
    bubbles: document.getElementById('stat-bubbles')
  };
  document.getElementById('btn-fish').addEventListener('click', () => {
    createFish();
    el.fish.textContent = fishArray.length;
  });
  document.getElementById('btn-bubble').addEventListener('click', () => {
    for (let i = 0; i < 10; i++) spawnBubble(true);
    el.bubbles.textContent = bubbles.length;
  });
  const btnLight = document.getElementById('btn-light');
  let sunOn = true;
  btnLight.addEventListener('click', () => {
    sunOn = !sunOn;
    sun.intensity = sunOn ? 1.15 : 0.06;
    ambient.intensity = sunOn ? 0.4 : 0.18;
    btnLight.textContent = sunOn ? '💡 Свет: Вкл' : '💡 Свет: Выкл';
  });

  // ═══════════════ Главный цикл ═══════════════
  const clock = new THREE.Clock();
  const tmpObj = new THREE.Object3D();
  const tmpV = new THREE.Vector3();
  const tmpF = new THREE.Vector3();
  let frames = 0, fpsAcc = 0;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // ── Рыбки: ИИ + анимация ──
    for (const fish of fishArray) {
      const p = fish.mesh.position;
      tmpF.set(0, 0, 0);

      // случайное блуждание + редкие рывки
      fish.wanderTimer -= dt;
      if (fish.wanderTimer <= 0) {
        fish.wanderTimer = rand(2, 6);
        fish.wanderDir.set(rand(-1, 1), rand(-0.6, 0.6), rand(-1, 1)).normalize();
        if (Math.random() < 0.4) fish.dart = 1;
      }
      fish.dart = Math.max(0, fish.dart - dt * 0.8);
      tmpF.addScaledVector(fish.wanderDir, 0.8);

      // избегание столкновений
      for (const other of fishArray) {
        if (other === fish) continue;
        tmpV.subVectors(p, other.mesh.position);
        const d = tmpV.length();
        const r = (fish.avoidanceRadius + other.avoidanceRadius) / 2;
        if (d < r && d > 1e-4) tmpF.addScaledVector(tmpV, ((1 - d / r) / d) * 2.5);
      }

      // преследование корма (радиус 15)
      fish.targetFood = null;
      let best = 225;
      for (const food of foods) {
        const d2 = p.distanceToSquared(food.mesh.position);
        if (d2 < best) { best = d2; fish.targetFood = food; }
      }
      if (fish.targetFood) {
        tmpV.subVectors(fish.targetFood.mesh.position, p);
        const d = tmpV.length();
        if (d > 0.01) tmpF.addScaledVector(tmpV, 3.2 / d);
        if (d < 0.9 + fish.baseScale * 0.3) {
          // съедено: удаление + рост на 5% (с потолком)
          scene.remove(fish.targetFood.mesh);
          foods.splice(foods.indexOf(fish.targetFood), 1);
          fish.mesh.scale.setScalar(Math.min(fish.mesh.scale.x * 1.05, 2.3));
          for (let i = 0; i < 2; i++)
            addBubbleAt(clamp(p.x, -HW + 1.5, HW - 1.5), p.y + 0.4,
                         clamp(p.z, -HD + 1.5, HD - 1.5), rand(0.04, 0.08), rand(2, 3.5));
          fish.targetFood = null;
        }
      }

      // плавное отражение от стенок
      const MX = HW - 2.5, MZ = HD - 2.5;
      if (p.x < -MX) tmpF.x += (-MX - p.x) * 2;
      if (p.x >  MX) tmpF.x -= ( p.x -  MX) * 2;
      if (p.z < -MZ) tmpF.z += (-MZ - p.z) * 2;
      if (p.z >  MZ) tmpF.z -= ( p.z -  MZ) * 2;
      if (p.y < 2.5) tmpF.y += (2.5 - p.y) * 2.5;
      if (p.y > TANK.h - 2.5) tmpF.y -= (p.y - (TANK.h - 2.5)) * 2.5;

      // интеграция скорости
      fish.velocity.addScaledVector(tmpF, dt * 2.2);
      const sp = fish.speed * (0.75 + 0.25 * Math.sin(t * 0.6 + fish.phase)) * (1 + fish.dart * 0.9);
      const len = fish.velocity.length();
      if (len > sp * 1.6) fish.velocity.setLength(sp * 1.6);
      else if (len > 1e-3 && len < sp * 0.55) fish.velocity.setLength(sp * 0.55);
      p.addScaledVector(fish.velocity, dt);
      p.x = clamp(p.x, -HW + 1.2, HW - 1.2);
      p.y = clamp(p.y, 1.4, TANK.h - 1.4);
      p.z = clamp(p.z, -HD + 1.2, HD - 1.2);

      // поворот в направлении движения (плавный slerp)
      if (fish.velocity.lengthSq() > 0.01) {
        tmpV.copy(p).add(fish.velocity);
        tmpObj.position.copy(p);
        tmpObj.lookAt(tmpV);
        fish.mesh.quaternion.slerp(tmpObj.quaternion, Math.min(1, dt * 3.5));
      }

      // анимация хвоста и плавников
      const wag = Math.sin(t * fish.tailSpeed + fish.phase);
      fish.tail.rotation.z = wag * 0.5;
      fish.tail.rotation.y = Math.sin(t * fish.tailSpeed * 0.5 + fish.phase) * 0.18;
      const flap = Math.sin(t * fish.tailSpeed * 0.8 + fish.phase);
      fish.leftFin.rotation.x = -0.45 + flap * 0.3;
      fish.rightFin.rotation.x =  0.45 - flap * 0.3;
      fish.dorsal.rotation.z = Math.sin(t * fish.tailSpeed * 0.4 + fish.phase) * 0.1;
    }

    // ── Корм: гравитация + вязкость ──
    for (let i = foods.length - 1; i >= 0; i--) {
      const f = foods[i];
      f.vel.y -= 4.5 * dt;
      f.vel.multiplyScalar(1 - 1.2 * dt);
      f.mesh.position.addScaledVector(f.vel, dt);
      f.mesh.position.x = clamp(f.mesh.position.x, -HW + 0.8, HW - 0.8);
      f.mesh.position.z = clamp(f.mesh.position.z, -HD + 0.8, HD - 0.8);
      if (f.mesh.position.y < 0.45) {
        scene.remove(f.mesh);
        foods.splice(i, 1);
      }
    }

    // ── Пузыри ──
    for (const b of bubbles) {
      b.mesh.position.y += b.speed * dt;
      b.mesh.position.x = b.baseX + Math.sin(t * 1.4 + b.phase) * 0.5;
      b.mesh.position.z = b.baseZ + Math.cos(t * 1.1 + b.phase) * 0.5;
      if (b.mesh.position.y > TANK.h - 0.8) {
        b.baseX = rand(-HW + 1.5, HW - 1.5);
        b.baseZ = rand(-HD + 1.5, HD - 1.5);
        b.speed = rand(1.2, 2.6);
        b.mesh.position.y = 0.4;
      }
    }

    // ── Покачивание водорослей ──
    for (const w of weeds) {
      w.g.rotation.x = Math.sin(t * w.speed + w.phase) * 0.07;
      w.g.rotation.z = Math.cos(t * w.speed * 0.8 + w.phase) * 0.07;
    }

    // ── Кольца на воде ──
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.age += dt;
      r.mesh.scale.setScalar(1 + r.age * 5);
      r.mesh.material.opacity = Math.max(0, 0.7 * (1 - r.age / 0.9));
      if (r.age > 0.9) {
        scene.remove(r.mesh);
        r.mesh.material.dispose();
        ripples.splice(i, 1);
      }
    }

    // ── Дыхание подводного света ──
    glowA.intensity = 0.9 + Math.sin(t * 0.9) * 0.18;
    glowB.intensity = 0.8 + Math.cos(t * 0.7) * 0.15;

    controls.update();
    renderer.render(scene, camera);

    // ── Статистика ──
    frames++; fpsAcc += dt;
    if (fpsAcc >= 0.5) {
      el.fps.textContent = Math.round(frames / fpsAcc);
      el.fish.textContent = fishArray.length;
      el.food.textContent = foods.length;
      el.bubbles.textContent = bubbles.length;
      frames = 0; fpsAcc = 0;
    }
  }
  animate();

  // ═══════════════ Resize ═══════════════
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  })();
  </script>
</body>
</html>
