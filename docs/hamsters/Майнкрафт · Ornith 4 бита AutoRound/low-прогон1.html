<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mc.html</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: monospace; }
  canvas { display: block; }
  
  #crosshair {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 20px; height: 20px;
    pointer-events: none;
    z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: #000;
  }
  #crosshair::before {
    left: 50%; top: 0;
    width: 2px; height: 100%;
    transform: translateX(-50%);
  }
  #crosshair::after {
    top: 50%; left: 0;
    height: 2px; width: 100%;
    transform: translateY(-50%);
  }
  
  #hotbar {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    padding: 6px;
    background: rgba(0,0,0,0.6);
    border-radius: 6px;
    z-index: 10;
  }
  .slot {
    width: 46px; height: 46px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 12px;
    text-shadow: 1px 1px 2px #000;
  }
  .slot.selected { border-color: #fff; box-shadow: 0 0 6px #fff; }
  .slot .num {
    position: absolute; top: 1px; left: 3px;
    font-size: 11px;
  }
  
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    text-align: center;
  }
  #overlay h1 { font-size: 48px; margin-bottom: 20px; letter-spacing: 3px; }
  #overlay ul { text-align: left; font-size: 16px; line-height: 1.8; margin-bottom: 24px; }
  #overlay .play {
    font-size: 22px;
    padding: 12px 28px;
    border: 2px solid #fff;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="crosshair"></div>
<div id="hotbar"></div>
<div id="overlay">
  <h1>MINECRAFT</h1>
  <ul>
    <li>WASD - Move</li>
    <li>Mouse - Look around</li>
    <li>Space - Jump</li>
    <li>Left Click - Break block</li>
    <li>Right Click - Place block</li>
    <li>Keys 1-7 / Mouse Wheel - Select block</li>
  </ul>
  <div class="play">Click to play</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ... game code
</script>
</body>
</html>
