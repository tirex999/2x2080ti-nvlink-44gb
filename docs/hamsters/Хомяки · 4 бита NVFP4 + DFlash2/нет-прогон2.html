<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Low-Poly Hamster Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4a3529; --ink-soft:#7a6353;
    --cream:#fff7ec; --paper:#ffe9cf;
    --coral:#ff6f5e; --amber:#ffb454; --teal:#33b6ad; --green:#8fd14f;
    --shadow:0 12px 30px rgba(120,70,30,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    color:var(--ink); overflow:hidden;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,.55), transparent 42%),
      linear-gradient(165deg,#ffe7c4 0%,#ffd3a6 45%,#ffc0a0 100%);
  }
  /* ambient floating dots */
  .ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .ambient span{position:absolute;border-radius:50%;filter:blur(1px);opacity:.5;
    animation:drift linear infinite}
  @keyframes drift{
    0%{transform:translateY(0) translateX(0)}
    50%{transform:translateY(-40px) translateX(20px)}
    100%{transform:translateY(0) translateX(0)}
  }
  #app{position:relative;z-index:1;height:100vh;width:100vw}
  canvas{display:block;cursor:grab}
  canvas:active{cursor:grabbing}

  /* ---------- HUD ---------- */
  .hud{position:absolute;inset:0;pointer-events:none;padding:clamp(14px,2.4vw,28px)}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .brand{display:flex;align-items:center;gap:14px;pointer-events:auto;
    background:rgba(255,247,236,.82);backdrop-filter:blur(8px);
    padding:12px 18px 12px 14px;border-radius:22px;box-shadow:var(--shadow);
    border:2px solid #fff;max-width:min(520px,72vw)}
  .logo{width:52px;height:52px;flex:none;animation:bob 3.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  .kicker{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--teal)}
  h1{font-family:'Fredoka';font-weight:700;line-height:.98;letter-spacing:-.5px;
    font-size:clamp(24px,4.4vw,40px);color:var(--ink);margin:2px 0 0}
  h1 em{font-style:normal;color:var(--coral)}
  .badge{pointer-events:auto;display:flex;align-items:center;gap:10px;
    background:rgba(255,247,236,.85);backdrop-filter:blur(8px);
    padding:10px 16px;border-radius:18px;box-shadow:var(--shadow);border:2px solid #fff}
  .badge .dot{width:10px;height:10px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(143,209,79,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(143,209,79,.55)}70%{box-shadow:0 0 0 10px rgba(143,209,79,0)}100%{box-shadow:0 0 0 0 rgba(143,209,79,0)}}
  .badge b{font-family:'Fredoka';font-weight:600;font-size:15px}
  .badge small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}

  /* controls */
  .controls{position:absolute;left:clamp(14px,2.4vw,28px);bottom:clamp(14px,2.4vw,28px);
    display:flex;flex-wrap:wrap;gap:10px;max-width:60vw;pointer-events:auto}
  .btn{pointer-events:auto;font-family:'Fredoka';font-weight:600;font-size:14px;color:var(--ink);
    background:var(--cream);border:2px solid var(--ink);border-radius:16px;
    padding:11px 16px;cursor:pointer;box-shadow:0 5px 0 var(--ink);
    transition:transform .12s ease, box-shadow .12s ease, background .2s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
  .btn.primary{background:var(--coral);color:#fff;border-color:#d8483b;box-shadow:0 5px 0 #d8483b}
  .btn.primary:hover{box-shadow:0 7px 0 #d8483b}
  .btn.primary:active{box-shadow:0 2px 0 #d8483b}
  .btn.toggle.on{background:var(--teal);color:#fff;border-color:#1f8f87;box-shadow:0 5px 0 #1f8f87}

  /* hint */
  .hint{position:absolute;right:clamp(14px,2.4vw,28px);bottom:clamp(14px,2.4vw,28px);
    pointer-events:auto;background:rgba(255,247,236,.82);backdrop-filter:blur(8px);
    padding:12px 16px;border-radius:18px;box-shadow:var(--shadow);border:2px solid #fff;
    font-size:13px;font-weight:700;color:var(--ink-soft);line-height:1.7;max-width:230px}
  .hint b{color:var(--ink)}
  .hint .ico{font-size:15px;margin-right:6px}

  /* toast */
  .toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);
    opacity:0;pointer-events:none;font-family:'Fredoka';font-weight:700;font-size:clamp(20px,4vw,34px);
    color:#fff;background:rgba(74,53,41,.82);padding:14px 26px;border-radius:20px;
    box-shadow:var(--shadow);transition:all .25s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

  /* loader */
  #loader{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;background:linear-gradient(165deg,#ffe7c4,#ffc0a0);
    transition:opacity .6s ease}
  #loader.hide{opacity:0;pointer-events:none}
  .spinner{width:64px;height:64px;border-radius:50%;border:6px solid rgba(255,255,255,.5);
    border-top-color:var(--coral);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader p{font-family:'Fredoka';font-weight:600;font-size:18px;color:var(--ink)}

  @media (max-width:640px){
    .brand{max-width:80vw}
    .hint{display:none}
    .controls{max-width:calc(100vw - 28px)}
  }
</style>
</head>
<body>
<div class="ambient" id="ambient"></div>

<div id="app">
  <div id="loader">
    <div class="spinner"></div>
    <p>Warming up the hamsters…</p>
  </div>

  <div class="hud">
    <div class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="14" cy="20" r="9" fill="#f4a95b"/><circle cx="14" cy="20" r="4.5" fill="#fff2df"/>
          <circle cx="50" cy="20" r="9" fill="#f4a95b"/><circle cx="50" cy="20" r="4.5" fill="#fff2df"/>
          <ellipse cx="32" cy="36" rx="20" ry="17" fill="#f4a95b"/>
          <ellipse cx="32" cy="43" rx="12" ry="9" fill="#fff2df"/>
          <circle cx="24" cy="33" r="3.4" fill="#3a2a20"/><circle cx="40" cy="33" r="3.4" fill="#3a2a20"/>
          <circle cx="25" cy="32" r="1.1" fill="#fff"/><circle cx="41" cy="32" r="1.1" fill="#fff"/>
          <path d="M28 40 Q32 44 36 40" stroke="#3a2a20" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <circle cx="32" cy="38" r="2.2" fill="#ff7a6b"/>
        </svg>
        <div>
          <span class="kicker">cozy corner · 3D</span>
          <h1>Hamster <em>Playground</em></h1>
        </div>
      </div>
      <div class="badge">
        <span class="dot"></span>
        <div><small>Residents</small><b id="count">5 hamsters</b></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn primary" id="feedBtn">🍎 Feed the hamsters</button>
      <button class="btn toggle" id="autoBtn">🎥 Auto-orbit · on</button>
      <button class="btn" id="resetBtn">↺ Reset view</button>
    </div>

    <div class="hint">
      <div><span class="ico">🖱️</span><b>Drag</b> to look around</div>
      <div><span class="ico">🔍</span><b>Scroll / pinch</b> to zoom</div>
      <div><span class="ico">🎡</span>Watch the wheel &amp; food bowl</div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- ambient bg dots ---------------- */
(function(){
  const amb = document.getElementById('ambient');
  const cols = ['#ff6f5e','#ffb454','#33b6ad','#8fd14f'];
  for(let i=0;i<14;i++){
    const s=document.createElement('span');
    const sz=8+Math.random()*26;
    s.style.width=s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.background=cols[i%cols.length];
    s.style.animationDuration=(14+Math.random()*16)+'s';
    s.style.animationDelay=(-Math.random()*10)+'s';
    amb.appendChild(s);
  }
})();

/* ---------------- renderer / scene / camera ---------------- */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = makeSkyTexture();
scene.fog = new THREE.Fog(0xffd9b0, 22, 46);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 7.4, 12.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 1.4, 0);
controls.minDistance = 6;
controls.maxDistance = 20;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = Math.PI*0.52;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.update();

function makeSkyTexture(){
  const c=document.createElement('canvas'); c.width=8; c.height=256;
  const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,'#ffe6c2'); grd.addColorStop(.5,'#ffd3a6'); grd.addColorStop(1,'#ffb998');
  g.fillStyle=grd; g.fillRect(0,0,8,256);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

/* ---------------- lights ---------------- */
scene.add(new THREE.HemisphereLight(0xfff2df, 0xe8a06a, 0.75));
const sun = new THREE.DirectionalLight(0xfff1dd, 1.35);
sun.position.set(7, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1; sun.shadow.camera.far=40;
sun.shadow.camera.left=-9; sun.shadow.camera.right=9;
sun.shadow.camera.top=9; sun.shadow.camera.bottom=-9;
sun.shadow.bias=-0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbfeaff, 0.35);
fill.position.set(-6,4,-4); scene.add(fill);

/* ---------------- materials ---------------- */
const mat = (c,o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:.9,metalness:0},o));
const M = {
  wood:   mat(0xb9855a,{roughness:.85}),
  woodDark:mat(0x8f5f3c,{roughness:.85}),
  glass:  mat(0xcfeaf5,{transparent:true,opacity:.16,roughness:.05,side:THREE.DoubleSide}),
  sand:   mat(0xf3e4bd,{roughness:1}),
  sandDark:mat(0xe4cfa0,{roughness:1}),
  steel:  mat(0xd7dee6,{metalness:.6,roughness:.35}),
  teal:   mat(0x33b6ad,{roughness:.5}),
  coral:  mat(0xff6f5e,{roughness:.6}),
  amber:  mat(0xffb454,{roughness:.6}),
  green:  mat(0x8fd14f,{roughness:.7}),
  pink:   mat(0xff9db6,{roughness:.6}),
  white:  mat(0xfff6ea,{roughness:.8}),
  black:  mat(0x3a2a20,{roughness:.6}),
  red:    mat(0xe23b3b,{roughness:.5}),
  seed:   mat(0x6b4a2b,{roughness:.9}),
};

function box(w,h,d,m){const g=new THREE.BoxGeometry(w,h,d);const msh=new THREE.Mesh(g,m);msh.castShadow=msh.receiveShadow=true;return msh;}
function cyl(rT,rB,h,m,seg=10){const g=new THREE.CylinderGeometry(rT,rB,h,seg);const msh=new THREE.Mesh(g,m);msh.castShadow=msh.receiveShadow=true;return msh;}

/* ================= CAGE ================= */
const cage = new THREE.Group();
scene.add(cage);

// base frame
const base = box(8.4,1.1,6.4,M.wood); base.position.y=0.55; cage.add(base);
const tray = box(7.6,0.5,5.6,M.woodDark); tray.position.y=0.95; cage.add(tray);
// sand floor
const floor = box(7.4,0.08,5.4,M.sand); floor.position.y=1.22; floor.receiveShadow=true; cage.add(floor);
// little sand mounds
[[ -2.4,1.0],[2.6,-1.2],[0.5,1.6]].forEach(p=>{
  const m=cyl(0.9,1.1,0.28,M.sandDark,8); m.position.set(p[0],1.3,p[1]); cage.add(m);
});
// legs
[[-3.9,-2.9],[3.9,-2.9],[-3.9,2.9],[3.9,2.9]].forEach(p=>{
  const l=box(0.5,0.9,0.5,M.woodDark); l.position.set(p[0],0.45,p[1]); cage.add(l);
});
// top rim
const rim=box(8.4,0.35,6.4,M.wood); rim.position.y=5.6; cage.add(rim);
// corner posts
[[-4.0,-3.0],[4.0,-3.0],[-4.0,3.0],[4.0,3.0]].forEach(p=>{
  const post=box(0.4,4.9,0.4,M.wood); post.position.set(p[0],3.2,p[1]); cage.add(post);
});
// glass walls
const gw=(w,h,x,y,z,ry)=>{const g=box(w,h,0.06,M.glass);g.position.set(x,y,z);g.rotation.y=ry;cage.add(g);};
gw(8,4.4,0,3.2,-3.0,0);
gw(8,4.4,0,3.2, 3.0,0);
gw(6,4.4,-4.0,3.2,0,Math.PI/2);
gw(6,4.4, 4.0,3.2,0,Math.PI/2);
// horizontal bars (front + back)
for(let y=2;y<=5;y+=1.1){
  const b1=box(8,0.09,0.09,M.steel); b1.position.set(0,y,-2.9); cage.add(b1);
  const b2=box(8,0.09,0.09,M.steel); b2.position.set(0,y, 2.9); cage.add(b2);
}
// vertical bars (sides)
for(let z=-2.4;z<=2.4;z+=1.2){
  const v1=box(0.09,4.4,0.09,M.steel); v1.position.set(-3.9,3.2,z); cage.add(v1);
  const v2=box(0.09,4.4,0.09,M.steel); v2.position.set( 3.9,3.2,z); cage.add(v2);
}
// hanging sign
(function(){
  const sign=box(2.4,0.9,0.12,M.coral); sign.position.set(0,4.9,2.95); cage.add(sign);
  const t=document.createElement('canvas'); t.width=512;t.height=180;
  const g=t.getContext('2d');
  g.fillStyle='#ff6f5e'; g.fillRect(0,0,512,180);
  g.fillStyle='#fff'; g.font='bold 74px Fredoka, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('HAMSTERS',256,95);
  const tx=new THREE.CanvasTexture(t); tx.colorSpace=THREE.SRGBColorSpace;
  const face=new THREE.Mesh(new THREE.PlaneGeometry(2.2,0.78),new THREE.MeshBasicMaterial({map:tx}));
  face.position.set(0,4.9,3.02); cage.add(face);
})();

/* ================= WHEEL (interactive) ================= */
const wheel = new THREE.Group();
wheel.position.set(-2.5, 1.55, -1.7);
cage.add(wheel);
let wheelSpin = 0;
(function(){
  const stand=cyl(0.12,0.14,1.0,M.teal,10); stand.position.set(0,0.5,0); wheel.add(stand);
  const foot=cyl(0.5,0.5,0.12,M.teal,12); foot.position.set(0,0.06,0); wheel.add(foot);
  const ring=cyl(1.05,1.05,0.14,M.amber,24); ring.rotation.x=Math.PI/2; ring.position.set(0,1.35,0); wheel.add(ring);
  const hub=cyl(0.16,0.16,0.2,M.white,10); hub.rotation.x=Math.PI/2; hub.position.set(0,1.35,0); wheel.add(hub);
  const spokes=new THREE.Group(); spokes.position.set(0,1.35,0); wheel.add(spokes);
  for(let i=0;i<6;i++){
    const s=cyl(0.035,0.035,1.0,M.white,6);
    s.rotation.z=i*Math.PI/3; spokes.add(s);
  }
  // pegs on rim
  for(let i=0;i<10;i++){
    const a=i/10*Math.PI*2;
    const p=box(0.1,0.1,0.14,M.coral);
    p.position.set(Math.cos(a)*1.05,1.35+Math.sin(a)*1.05,0); wheel.add(p);
  }
  wheel.userData.spokes = spokes;
  wheel.userData.ring = ring;
})();

/* ================= TUNNEL ================= */
(function(){
  const tun=new THREE.Group(); tun.position.set(2.6,1.5,1.4); tun.rotation.y=-0.5; cage.add(tun);
  const half=cyl(0.7,0.7,2.6,M.green,12,1,false,0,Math.PI); half.rotation.z=Math.PI/2;
  half.scale.y=0.9; tun.add(half);
  const cap=cyl(0.7,0.7,2.6,M.green,12,1,false,Math.PI,Math.PI); cap.rotation.z=Math.PI/2; cap.scale.y=0.9; tun.add(cap);
  const rimL=cyl(0.7,0.7,0.14,M.pink,12); rimL.rotation.z=Math.PI/2; rimL.position.x=-1.3; tun.add(rimL);
  const rimR=cyl(0.7,0.7,0.14,M.pink,12); rimR.rotation.z=Math.PI/2; rimR.position.x=1.3; tun.add(rimR);
})();

/* ================= FOOD BOWL (interactive) ================= */
const bowlPos = new THREE.Vector3(2.3, 1.24, -1.9);
const bowl = new THREE.Group(); bowl.position.copy(bowlPos); cage.add(bowl);
let foodAmount = 1;
(function(){
  const base=cyl(0.55,0.4,0.16,M.red,14); base.position.y=0.08; bowl.add(base);
  const rim=cyl(0.62,0.62,0.1,M.red,14); rim.position.y=0.2; bowl.add(rim);
  const inner=cyl(0.5,0.42,0.14,M.amber,14); inner.position.y=0.24; bowl.add(inner);
  bowl.userData.inner = inner;
})();

/* ================= TOYS / DECOR ================= */
const toys = [];
// apple
(function(){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.SphereGeometry(0.24,8,6),M.red); b.castShadow=b.receiveShadow=true; g.add(b);
  const st=cyl(0.03,0.03,0.16,M.woodDark,6); st.position.y=0.26; g.add(st);
  const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.09,6,4),M.green); leaf.scale.set(1.4,0.5,1); leaf.position.set(0.1,0.3,0); leaf.castShadow=true; g.add(leaf);
  g.position.set(-1.2,1.4,1.9); cage.add(g); toys.push(g);
})();
// wooden block
(function(){
  const b=box(0.5,0.5,0.5,M.amber); b.position.set(0.4,1.47,2.2); b.rotation.y=0.5; cage.add(b); toys.push(b);
})();
// scattered seeds
for(let i=0;i<10;i++){
  const s=new THREE.Mesh(new THREE.SphereGeometry(0.05,5,4),M.seed);
  s.scale.set(1,0.6,1.4); s.castShadow=true;
  s.position.set((Math.random()-0.5)*6,1.3,(Math.random()-0.5)*4.4);
  cage.add(s);
}

/* ================= HAMSTERS ================= */
const hamsters=[];
const HAMSTER_COLORS=[
  {body:0xf4a95b,belly:0xfff2df,cheek:0xff9db6,eye:0x3a2a20,name:'Nibbles'},
  {body:0xffffff,belly:0xfff4e6,cheek:0xffb3c1,eye:0x2b2b2b,name:'Snowball'},
  {body:0x8d5a3b,belly:0xf2dcc4,cheek:0xff9d8a,eye:0x241812,name:'Cocoa'},
  {body:0xa9c96a,belly:0xf4f9e2,cheek:0xff9d8a,eye:0x2b2b2b,name:'Pickle'},
  {body:0xf08a8a,belly:0xffe9e9,cheek:0xff7a9e,eye:0x2b2b2b,name:'Rosie'},
];
const WALK_SPEED=1.5, EAT_TIME=1.3;

function createHamster(cfg, x, z){
  const g=new THREE.Group();
  const bodyMat=mat(cfg.body), bellyMat=mat(cfg.belly), cheekMat=mat(cfg.cheek), eyeMat=mat(cfg.eye);

  const body=new THREE.Mesh(new THREE.SphereGeometry(0.42,8,7),bodyMat);
  body.scale.set(1.15,0.9,1.35); body.position.y=0.42; body.castShadow=body.receiveShadow=true; g.add(body);

  const head=new THREE.Mesh(new THREE.SphereGeometry(0.3,8,7),bodyMat);
  head.scale.set(1,0.95,1.05); head.position.set(0,0.52,0.42); head.castShadow=true; g.add(head);

  const belly=new THREE.Mesh(new THREE.SphereGeometry(0.26,8,6),bellyMat);
  belly.scale.set(1,0.8,1.1); belly.position.set(0,0.4,0.18); g.add(belly);

  const earGeo=new THREE.SphereGeometry(0.13,6,5);
  const earL=new THREE.Mesh(earGeo,bodyMat); earL.position.set(-0.17,0.78,0.34); earL.castShadow=true; g.add(earL);
  const earR=earL.clone(); earR.position.x=0.17; g.add(earR);
  const earInMat=mat(cfg.cheek);
  const eiL=new THREE.Mesh(new THREE.SphereGeometry(0.07,6,5),earInMat); eiL.position.set(-0.17,0.78,0.42); g.add(eiL);
  const eiR=eiL.clone(); eiR.position.x=0.17; g.add(eiR);

  const eyeGeo=new THREE.SphereGeometry(0.05,6,5);
  const eyeL=new THREE.Mesh(eyeGeo,eyeMat); eyeL.position.set(-0.11,0.56,0.66); g.add(eyeL);
  const eyeR=eyeL.clone(); eyeR.position.x=0.11; g.add(eyeR);
  const shineMat=mat(0xffffff);
  const shL=new THREE.Mesh(new THREE.SphereGeometry(0.018,5,4),shineMat); shL.position.set(-0.11,0.58,0.71); g.add(shL);
  const shR=shL.clone(); shR.position.x=0.11; g.add(shR);

  const nose=new THREE.Mesh(new THREE.SphereGeometry(0.035,6,5),mat(0xff6f91)); nose.position.set(0,0.5,0.72); g.add(nose);

  const cheekGeo=new THREE.SphereGeometry(0.1,6,5);
  const cheekL=new THREE.Mesh(cheekGeo,cheekMat); cheekL.position.set(-0.2,0.44,0.58); g.add(cheekL);
  const cheekR=cheekL.clone(); cheekR.position.x=0.2; g.add(cheekR);

  const legGeo=new THREE.SphereGeometry(0.09,6,5);
  const legs=[];
  [[-0.2,0.15],[0.2,0.15],[-0.2,-0.2],[0.2,-0.2]].forEach(p=>{
    const leg=new THREE.Mesh(legGeo,bodyMat); leg.position.set(p[0],0.12,p[1]); leg.castShadow=true; g.add(leg); legs.push(leg);
  });

  const tail=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,5),bodyMat); tail.position.set(0,0.3,-0.55); g.add(tail);

  g.position.set(x,1.26,z);
  g.rotation.y=Math.random()*Math.PI*2;
  cage.add(g);

  const h={
    group:g, body, head, earL, earR, cheekL, cheekR, legs,
    name:cfg.name, color:cfg.body,
    speed:WALK_SPEED*(0.85+Math.random()*0.3),
    state:'wander', timer:1+Math.random()*2,
    target:new THREE.Vector3(), wheelTimer:3+Math.random()*8,
    phase:Math.random()*10, blink:0, blinkCd:2+Math.random()*3,
    bobBase:0.12
  };
  pickTarget(h);
  hamsters.push(h);
  return h;
}

function pickTarget(h){
  // occasionally aim for the food bowl
  if(foodAmount>0.1 && Math.random()<0.35){
    h.target.set(bowlPos.x+(Math.random()-.5)*0.4, 1.26, bowlPos.z+(Math.random()-.5)*0.4);
    h.state='wander';
  } else {
    h.target.set(randIn(-3.1,3.1), 1.26, randIn(-2.3,2.3));
    h.state='wander';
  }
}
function randIn(a,b){return a+Math.random()*(b-a);}

createHamster(HAMSTER_COLORS[0], -1.5, 0.5);
createHamster(HAMSTER_COLORS[1],  1.0, -0.5);
createHamster(HAMSTER_COLORS[2],  0.2,  1.5);
createHamster(HAMSTER_COLORS[3], -0.8, -1.4);
createHamster(HAMSTER_COLORS[4],  2.0,  0.8);
document.getElementById('count').textContent = hamsters.length+' hamsters';

/* ================= FOOD PARTICLES ================= */
const food=[];
function spawnFood(){
  const n=6;
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.06,5,4),M.seed);
    m.scale.set(1,0.6,1.4); m.castShadow=true;
    m.position.set(bowlPos.x+(Math.random()-.5)*0.5, 2.6+Math.random()*1.2, bowlPos.z+(Math.random()-.5)*0.5);
    m.userData.vy=-(1.5+Math.random()); m.userData.rot=Math.random()*10;
    scene.add(m); food.push(m);
  }
}
function updateFood(dt){
  for(let i=food.length-1;i>=0;i--){
    const f=food[i];
    f.userData.vy-=9*dt; f.position.y+=f.userData.vy*dt;
    f.rotation.y+=dt*4;
    if(f.position.y<=1.3){
      f.position.y=1.3;
      f.scale.setScalar(1.6);
      f.userData.life=0.4;
    }
    if(f.userData.life!==undefined){
      f.userData.life-=dt;
      f.scale.multiplyScalar(0.9);
      if(f.userData.life<=0){ scene.remove(f); food.splice(i,1); }
    }
  }
}

/* ================= BEHAVIOR UPDATE ================= */
const _v=new THREE.Vector3();
function updateHamster(h, dt, t){
  const pos=h.group.position;
  const distToTarget=_v.subVectors(h.target,pos); distToTarget.y=0;
  const dist=distToTarget.length();

  // state machine
  h.timer-=dt;
  if(h.state==='wander'){
    if(dist<0.28){
      if(foodAmount>0.1 && Math.abs(pos.x-bowlPos.x)<0.5 && Math.abs(pos.z-bowlPos.z)<0.5){
        h.state='eat'; h.timer=EAT_TIME;
      } else {
        h.state='pause'; h.timer=0.8+Math.random()*1.8;
      }
    }
  } else if(h.state==='pause'){
    if(h.timer<=0){
      if(Math.random()<0.4){ h.state='turn'; h.timer=0.5+Math.random()*0.5; }
      else { pickTarget(h); }
    }
  } else if(h.state==='turn'){
    h.group.rotation.y += (Math.random()-0.5)*dt*6;
    if(h.timer<=0) pickTarget(h);
  } else if(h.state==='eat'){
    if(h.timer<=0){
      if(foodAmount>0) foodAmount=Math.max(0,foodAmount-0.15);
      h.state='pause'; h.timer=1+Math.random()*2;
    }
  }

  // movement
  let moving=false;
  if(h.state==='wander' && dist>0.28){
    _v.normalize();
    const desired=Math.atan2(_v.x,_v.z);
    let diff=desired-h.group.rotation.y;
    diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    h.group.rotation.y += THREE.MathUtils.clamp(diff,-dt*4,dt*4);
    const step=h.speed*dt;
    pos.x+=Math.sin(h.group.rotation.y)*step;
    pos.z+=Math.cos(h.group.rotation.y)*step;
    moving=true;
  }
  // clamp inside cage
  pos.x=THREE.MathUtils.clamp(pos.x,-3.3,3.3);
  pos.z=THREE.MathUtils.clamp(pos.z,-2.4,2.4);

  // idle breathing / bob
  h.group.position.y = 1.26 + Math.sin(t*3+h.phase)*0.02 + (moving?Math.abs(Math.sin(t*10+h.phase))*0.05:0);

  // leg scurry
  const legAmp = moving?0.28:0.05;
  const legFreq = moving?14:4;
  h.legs.forEach((leg,i)=>{
    leg.position.y = 0.12 + Math.sin(t*legFreq + h.phase + (i%2)*Math.PI)*(moving?0.05:0.02);
    leg.rotation.x = Math.sin(t*legFreq + h.phase + (i<2?0:Math.PI))*legAmp;
  });

  // ear wiggle
  const wig = moving?0.25:0.08;
  h.earL.rotation.z = 0.2 + Math.sin(t*6+h.phase)*wig;
  h.earR.rotation.z = -0.2 - Math.sin(t*6+h.phase)*wig;

  // head tilt
  h.head.rotation.z = Math.sin(t*2+h.phase)*0.08;

  // blinking
  h.blinkCd-=dt;
  if(h.blinkCd<=0){ h.blink=0.14; h.blinkCd=2+Math.random()*4; }
  if(h.blink>0){ h.blink-=dt; const s=0.15; h.cheekL.scale.y=h.cheekR.scale.y=s; }
  else { h.cheekL.scale.y=h.cheekR.scale.y=1; }

  // eating animation
  if(h.state==='eat'){
    const chomp=Math.abs(Math.sin(t*10));
    h.cheekL.scale.setScalar(1+chomp*0.5);
    h.cheekR.scale.setScalar(1+chomp*0.5);
    h.head.rotation.x = chomp*0.3;
  } else {
    h.cheekL.scale.x=h.cheekL.scale.z=h.cheekR.scale.x=h.cheekR.scale.z=1;
    h.head.rotation.x*=0.9;
  }
}

/* ================= UI ================= */
const toastEl=document.getElementById('toast');
let toastTimer=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1600);
}
document.getElementById('feedBtn').addEventListener('click',()=>{
  foodAmount=1; spawnFood();
  hamsters.forEach(h=>{ if(Math.random()<0.7){ h.target.set(bowlPos.x+(Math.random()-.5)*0.4,1.26,bowlPos.z+(Math.random()-.5)*0.4); h.state='wander'; }});
  toast('Snack time! 🍎');
});
const autoBtn=document.getElementById('autoBtn');
autoBtn.addEventListener('click',()=>{
  controls.autoRotate=!controls.autoRotate;
  autoBtn.classList.toggle('on',controls.autoRotate);
  autoBtn.textContent='🎥 Auto-orbit · '+(controls.autoRotate?'on':'off');
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  flyTo(0,7.4,12.5, 0,1.4,0);
});

// smooth camera fly-to
let camAnim=null;
function flyTo(px,py,pz,tx,ty,tz){
  camAnim={
    t:0, dur:0.9,
    fromP:camera.position.clone(), toP:new THREE.Vector3(px,py,pz),
    fromT:controls.target.clone(), toT:new THREE.Vector3(tx,ty,tz)
  };
  controls.autoRotate=false;
  autoBtn.classList.remove('on'); autoBtn.textContent='🎥 Auto-orbit · off';
}

/* ================= RESIZE ================= */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ================= LOOP ================= */
const clock=new THREE.Clock();
let running=true;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  // camera fly animation
  if(camAnim){
    camAnim.t+=dt/camAnim.dur;
    const k=camAnim.t>=1?1:(1-Math.pow(1-camAnim.t,3));
    camera.position.lerpVectors(camAnim.fromP,camAnim.toP,k);
    controls.target.lerpVectors(camAnim.fromT,camAnim.toT,k);
    if(camAnim.t>=1){ camAnim=null; }
  }
  controls.update();

  // wheel spins when a hamster is near it
  let nearWheel=false;
  hamsters.forEach(h=>{ if(h.group.position.distanceTo(wheel.position)<1.6) nearWheel=true; });
  const targetSpin = nearWheel?6:0.6;
  wheelSpin += THREE.MathUtils.lerp(0,targetSpin,0.04)*dt;
  wheel.userData.spokes.rotation.z = wheelSpin;
  wheel.userData.ring.rotation.x = wheelSpin;

  // hamsters
  hamsters.forEach(h=>updateHamster(h,dt,t));

  updateFood(dt);

  // gentle cage sway of decor (subtle life)
  toys.forEach((toy,i)=>{ toy.position.y = 1.4 + Math.sin(t*1.5+i)*0.01; });

  renderer.render(scene,camera);
}
animate();

// hide loader once first frames are up
setTimeout(()=>document.getElementById('loader').classList.add('hide'), 500);
</script>
