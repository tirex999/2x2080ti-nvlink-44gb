<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4a2c2a; --paper:#fff8ec; --coral:#ff6b57; --butter:#ffc94d; --mint:#8fd8c8;
  }
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',sans-serif;color:var(--ink)}

  /* ---- layered sky ---- */
  #sky,#skyN{position:fixed;inset:0;z-index:0}
  #sky{background:linear-gradient(180deg,#8fd4ee 0%,#cdeef7 48%,#ffe6bd 100%)}
  #skyN{background:linear-gradient(180deg,#14293f 0%,#2c5878 55%,#ff9e5e 100%);opacity:0;transition:opacity 1.4s}
  body.night #skyN{opacity:1}

  .cloud{position:fixed;z-index:1;background:#fff;border-radius:60px;opacity:.85;transition:opacity 1.4s;animation:drift linear infinite}
  .cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
  .c1{width:130px;height:36px;top:11%;left:-160px;animation-duration:95s}
  .c1::before{width:58px;height:58px;top:-30px;left:20px}
  .c1::after{width:42px;height:42px;top:-20px;left:64px}
  .c2{width:95px;height:27px;top:24%;left:-130px;animation-duration:150s;animation-delay:-70s;opacity:.6}
  .c2::before{width:44px;height:44px;top:-22px;left:14px}
  .c2::after{width:32px;height:32px;top:-14px;left:48px}
  .c3{width:110px;height:30px;top:38%;left:-140px;animation-duration:120s;animation-delay:-40s;opacity:.45}
  .c3::before{width:48px;height:48px;top:-24px;left:16px}
  .c3::after{width:36px;height:36px;top:-15px;left:54px}
  @keyframes drift{to{transform:translateX(calc(100vw + 320px))}}
  body.night .cloud{opacity:.12}

  canvas{position:fixed;inset:0;z-index:2;display:block;touch-action:none;cursor:grab}
  .vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(74,44,42,.15) 100%)}

  /* ---- HUD ---- */
  .hud{position:fixed;z-index:5;user-select:none;-webkit-user-select:none}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}
  .plate{top:18px;left:18px;background:var(--paper);border:3px solid var(--ink);
    border-radius:20px 20px 20px 6px;padding:14px 18px 13px;transform:rotate(-1.4deg);
    box-shadow:6px 6px 0 rgba(74,44,42,.85);max-width:272px;
    animation:rise .7s cubic-bezier(.34,1.56,.64,1) backwards}
  .plate .tag{display:inline-block;font:800 10px 'Nunito';letter-spacing:.14em;background:var(--butter);
    border:2px solid var(--ink);border-radius:999px;padding:3px 10px;margin-bottom:8px}
  .plate h1{font-family:'Fredoka';font-weight:700;font-size:27px;line-height:1.04}
  .plate h1 em{font-style:normal;color:var(--coral)}
  .plate p{font-size:12.5px;font-weight:700;opacity:.72;margin-top:5px}
  .crew{margin-top:9px;display:flex;gap:5px;align-items:center}
  .crew i{width:11px;height:11px;border-radius:50%;background:var(--c);border:2px solid var(--ink);display:inline-block}
  .crew span{font-size:10.5px;font-weight:800;opacity:.6;margin-left:3px}

  .toolbar{top:18px;right:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;
    animation:rise .7s .12s cubic-bezier(.34,1.56,.64,1) backwards}
  .btn{font:800 14.5px 'Nunito';color:var(--ink);padding:10px 16px;border:3px solid var(--ink);
    border-radius:999px;background:var(--paper);box-shadow:0 4px 0 var(--ink);cursor:pointer;
    display:flex;gap:8px;align-items:center;transition:transform .12s,box-shadow .12s,background .2s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .btn.hot{background:var(--coral);color:var(--paper)}
  .btn.on{background:var(--butter)}

  .hints{left:18px;bottom:16px;background:rgba(255,248,236,.92);border:2.5px solid var(--ink);
    border-radius:12px 12px 12px 4px;padding:8px 13px;font-size:12px;font-weight:800;
    box-shadow:4px 4px 0 rgba(74,44,42,.7);animation:rise .7s .28s cubic-bezier(.34,1.56,.64,1) backwards}
  .hints b{color:var(--coral)}

  .ticker{left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    border-radius:999px;padding:9px 19px;font-weight:800;font-size:13.5px;display:flex;gap:9px;
    align-items:center;max-width:min(92vw,480px);box-shadow:0 5px 0 rgba(74,44,42,.35);
    animation:rise .7s .42s cubic-bezier(.34,1.56,.64,1) backwards}
  .ticker .dot{width:9px;height:9px;border-radius:50%;background:var(--butter);flex:none;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{transform:scale(1.55);opacity:.55}}
  .ticker.pop .txt{display:inline-block;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

  #tag{position:fixed;z-index:6;pointer-events:none;font-family:'Fredoka';font-weight:700;font-size:15px;
    background:var(--butter);border:2.5px solid var(--ink);border-radius:999px;padding:4px 13px;
    transform:translate(-50%,-135%) scale(0);transition:transform .25s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
  #tag.show{transform:translate(-50%,-135%) scale(1)}
  #tag::after{content:'';position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--butter);
    border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}

  #loader{position:fixed;inset:0;z-index:10;background:linear-gradient(180deg,#8fd4ee,#ffe6bd);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    transition:opacity .6s;font-family:'Fredoka'}
  #loader .h{font-size:58px;animation:bounce 1s infinite}
  @keyframes bounce{50%{transform:translateY(-18px) rotate(-9deg)}}
  #loader p{font-weight:600;font-size:15px}
  #loader.hide{opacity:0;pointer-events:none}

  @media(max-width:640px){
    .plate{padding:10px 13px;max-width:190px}
    .plate h1{font-size:19px}
    .plate p,.crew{display:none}
    .hints{display:none}
    .toolbar{top:auto;bottom:66px;right:12px;flex-direction:row}
    .btn{padding:8px 12px;font-size:13px}
    .ticker{font-size:12px;bottom:14px}
  }
</style>
</head>
<body>
  <div id="sky"></div><div id="skyN"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="vignette"></div>

  <header class="hud plate">
    <span class="tag">LOW-POLY · THREE.JS</span>
    <h1>Hamster <em>Playground</em></h1>
    <p>five tiny friends · one very serious wheel</p>
    <div class="crew">
      <i style="--c:#f2a25c" title="Biscuit"></i><i style="--c:#fdf4e6" title="Mochi"></i>
      <i style="--c:#b7b0c6" title="Pepper"></i><i style="--c:#c97a3d" title="Cinnamon"></i>
      <i style="--c:#e8c48a" title="Peanut"></i><span>the crew</span>
    </div>
  </header>

  <div class="hud toolbar">
    <button class="btn hot" id="btnFeed">🥕 <span>Feed them</span></button>
    <button class="btn" id="btnNight">🌙 <span>Lights</span></button>
    <button class="btn" id="btnOrbit">🎥 <span>Auto-orbit</span></button>
  </div>

  <div class="hud hints"><b>drag</b> orbit · <b>scroll</b> zoom · <b>click</b> a hamster to boop</div>
  <div class="hud ticker" id="tick"><span class="dot"></span><span class="txt" id="tickTxt">Warming up the wheel…</span></div>
  <div id="tag"></div>

  <div id="loader"><div class="h">🐹</div><p>warming up the wheel…</p></div>

  <script>
    window.addEventListener('error',()=>{
      const p=document.querySelector('#loader p');
      if(p&&!window.__booted)p.textContent='Hmm, Three.js failed to load — check your connection.';
    });
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  /* ================= tiny utils ================= */
  const rand=(a,b)=>a+Math.random()*(b-a);
  const pick=a=>a[(Math.random()*a.length)|0];
  const lerp=(a,b,t)=>a+(b-a)*t;
  const damp=(a,b,l,dt)=>lerp(a,b,1-Math.exp(-l*dt));
  const easeOut=t=>1-Math.pow(1-t,3);
  const easeIn=t=>t*t;
  function angDiff(from,to){let d=(to-from)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;}
  // micro tween engine
  const tweens=[];
  function tw(dur,onU,onC,ease=t=>t){tweens.push({t:0,dur,onU,onC,ease});}
  function stepTweens(dt){
    for(let i=tweens.length-1;i>=0;i--){
      const w=tweens[i];w.t+=dt/w.dur;
      w.onU(w.ease(Math.min(1,w.t)));
      if(w.t>=1){tweens.splice(i,1);if(w.onC)w.onC();}
    }
  }

  /* ================= constants ================= */
  const FLOOR=0.6, CAGE_R=5.2, WALK_R=4.55, DOOR_AZ=0.5;
  const FEET=[[-0.2,0.42],[0.2,0.42],[-0.2,-0.42],[0.2,-0.42]];

  /* ================= renderer / scene ================= */
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;
  document.body.appendChild(renderer.domElement);
  const canvas=renderer.domElement;
  canvas.addEventListener('contextmenu',e=>e.preventDefault());

  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,100);
  camera.position.set(8.4,5.8,9.8);

  const controls=new OrbitControls(camera,canvas);
  controls.target.set(0,1.4,0);
  controls.enableDamping=true;controls.dampingFactor=0.06;
  controls.enablePan=false;
  controls.minDistance=5;controls.maxDistance=19;
  controls.minPolarAngle=0.15;controls.maxPolarAngle=1.42;
  controls.autoRotateSpeed=0.9;

  /* ================= lights ================= */
  const hemi=new THREE.HemisphereLight(0xcfeaff,0xffd9a8,0.95);scene.add(hemi);
  const sun=new THREE.DirectionalLight(0xfff1d6,1.7);
  sun.position.set(7,11,5);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:30});
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.bias=-0.0004;
  scene.add(sun);
  const lamp=new THREE.PointLight(0xffb25e,0,14,1.8);lamp.position.set(0,3.9,0);scene.add(lamp);

  const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.9,metalness:0,flatShading:true},o));

  /* ================= cage ================= */
  const cage=new THREE.Group();scene.add(cage);
  const mint=M(0x8fd8c8,{roughness:.45,metalness:.25});

  const tray=new THREE.Mesh(new THREE.CylinderGeometry(5.55,5.75,0.5,18),M(0xc98d52));
  tray.position.y=0.25;tray.receiveShadow=true;cage.add(tray);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(5.55,0.09,8,28),mint);
  rim.rotation.x=Math.PI/2;rim.position.y=0.5;cage.add(rim);
  const sand=new THREE.Mesh(new THREE.CylinderGeometry(5.1,5.1,0.2,18),M(0xf6e0ac));
  sand.position.y=0.5;sand.receiveShadow=true;cage.add(sand);

  const barGeo=new THREE.CylinderGeometry(0.05,0.05,3.2,6);
  const N_BARS=26;
  for(let i=0;i<N_BARS;i++){
    const a=i/N_BARS*Math.PI*2;
    if(Math.abs(angDiff(DOOR_AZ,a))<0.45)continue;           // door gap
    const b=new THREE.Mesh(barGeo,mint);
    b.position.set(Math.sin(a)*CAGE_R,FLOOR+1.6,Math.cos(a)*CAGE_R);
    b.castShadow=true;cage.add(b);
  }
  const ringGeo=new THREE.TorusGeometry(CAGE_R,0.07,8,30);
  [0,3.2].forEach(dy=>{
    const r=new THREE.Mesh(ringGeo,mint);
    r.rotation.x=Math.PI/2;r.position.y=FLOOR+dy;r.castShadow=true;cage.add(r);
  });

  // hanging bulb (glows at night)
  const bulbMat=M(0xfff3d6,{emissive:0xffb25e,emissiveIntensity:0});
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.16,8,6),bulbMat);
  bulb.position.set(0,FLOOR+3.0,0);cage.add(bulb);
  const cord=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.28,5),M(0x4a2c2a));
  cord.position.set(0,FLOOR+3.34,0);cage.add(cord);

  // wood chips (one instanced draw call)
  const chips=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.09,0),M(0xffffff,{roughness:1}),80);
  {
    const dm=new THREE.Object3D(),cc=new THREE.Color();
    for(let i=0;i<80;i++){
      const a=rand(0,Math.PI*2),r=Math.sqrt(Math.random())*4.7;
      dm.position.set(Math.sin(a)*r,FLOOR+0.03,Math.cos(a)*r);
      dm.rotation.set(rand(0,3),rand(0,3),rand(0,3));
      dm.scale.set(rand(.5,1.5),rand(.3,.7),rand(.5,1.5));
      dm.updateMatrix();chips.setMatrixAt(i,dm.matrix);
      chips.setColorAt(i,cc.setHSL(0.07,rand(.35,.55),rand(.45,.65)));
    }
    chips.instanceMatrix.needsUpdate=true;chips.receiveShadow=true;
  }
  scene.add(chips);

  /* ================= wheel ================= */
  const wheelPos=new THREE.Vector3(Math.sin(3.5)*3.9,0,Math.cos(3.5)*3.9);
  const wheel=new THREE.Group();wheel.position.copy(wheelPos);scene.add(wheel);
  const standMat=M(0x7a4a2b);
  const base=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.14,0.6),standMat);
  base.position.y=FLOOR+0.07;base.castShadow=true;wheel.add(base);
  [-0.6,0.6].forEach(x=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.16,1.05,0.16),standMat);
    leg.position.set(x,FLOOR+0.6,0);leg.castShadow=true;wheel.add(leg);
  });
  const WHEEL_C=new THREE.Vector3(0,FLOOR+1.12,0);
  const spin=new THREE.Group();spin.position.copy(WHEEL_C);wheel.add(spin);
  const rimMat=M(0xff6b57,{roughness:.55});
  const rimW=new THREE.Mesh(new THREE.TorusGeometry(0.95,0.09,8,20),rimMat);
  rimW.rotation.y=Math.PI/2;rimW.castShadow=true;spin.add(rimW);
  const spokeGeo=new THREE.CylinderGeometry(0.045,0.045,1.86,6),spokeMat=M(0xfff3dd);
  for(let i=0;i<3;i++){const s=new THREE.Mesh(spokeGeo,spokeMat);s.rotation.x=i*Math.PI/3;spin.add(s);}
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.28,8),rimMat);
  hub.rotation.z=Math.PI/2;spin.add(hub);
  const axle=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.5,6),M(0x4a2c2a));
  axle.rotation.z=Math.PI/2;axle.position.copy(WHEEL_C);wheel.add(axle);
  const wheelObj={spinV:0,owner:null,contact:new THREE.Vector3(wheelPos.x,WHEEL_C.y-0.82,wheelPos.z)};
  const wheelApproach=wheelPos.clone().multiplyScalar(0.5);

  /* ================= food bowl ================= */
  const bowlPos=new THREE.Vector3(Math.sin(DOOR_AZ)*3.1,0,Math.cos(DOOR_AZ)*3.1);
  const bowl=new THREE.Group();bowl.position.copy(bowlPos);scene.add(bowl);
  const bowlOuter=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.38,0.3,12),M(0xffc94d));
  bowlOuter.position.y=FLOOR+0.15;bowlOuter.castShadow=true;bowl.add(bowlOuter);
  const bowlIn=new THREE.Mesh(new THREE.CylinderGeometry(0.46,0.46,0.06,12),M(0xd98f2b));
  bowlIn.position.y=FLOOR+0.29;bowl.add(bowlIn);
  const pellets=[];
  {
    const pg=new THREE.SphereGeometry(0.085,7,5),cols=[0x8a5a2b,0xa06a30,0x6b8f3f];
    for(let i=0;i<7;i++){
      const p=new THREE.Mesh(pg,M(pick(cols)));
      const a=rand(0,Math.PI*2),r=rand(0,0.28);
      p.position.set(Math.sin(a)*r,FLOOR+0.32,Math.cos(a)*r);
      p.castShadow=true;bowl.add(p);
      pellets.push({mesh:p,alive:true});
    }
  }
  const bowlObj={owner:null,refillT:0};
  const bowlApproach=bowlPos.clone().multiplyScalar(1.25);
  const aliveCount=()=>pellets.filter(p=>p.alive).length;
  function refillPellets(instant){
    pellets.forEach(p=>{
      if(p.alive)return;
      p.alive=true;p.mesh.visible=true;
      if(instant)p.mesh.scale.setScalar(1);
      else tw(0.5,k=>p.mesh.scale.setScalar(Math.max(0.001,k)),null,easeOut);
    });
    bowlObj.refillT=0;
  }

  /* ================= tunnel + carrot ================= */
  const tunAz=1.9;
  const tunnel=new THREE.Group();
  tunnel.position.set(Math.sin(tunAz)*2.4,0,Math.cos(tunAz)*2.4);
  tunnel.rotation.y=tunAz;scene.add(tunnel);
  const shell=new THREE.Mesh(
    new THREE.CylinderGeometry(1.15,1.15,1.9,12,1,true,Math.PI/2,Math.PI),
    M(0x8fd8c8,{side:THREE.DoubleSide,roughness:.6}));
  shell.rotation.x=Math.PI/2;shell.castShadow=true;tunnel.add(shell);
  const rimT=M(0x6cc2ad);
  [-0.95,0.95].forEach(z=>{
    const r=new THREE.Mesh(new THREE.TorusGeometry(1.15,0.09,8,16),rimT);
    r.position.z=z;tunnel.add(r);
  });

  const carrot=new THREE.Group();
  carrot.position.set(Math.sin(5.2)*2.6,0,Math.cos(5.2)*2.6);scene.add(carrot);
  const root=new THREE.Mesh(new THREE.ConeGeometry(0.17,0.6,7),M(0xff8c42));
  root.rotation.z=Math.PI/2;root.position.y=FLOOR+0.14;root.castShadow=true;carrot.add(root);
  const leafMat=M(0x69b34c);
  for(let i=0;i<3;i++){
    const l=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.3,5),leafMat);
    l.position.set(-0.32,FLOOR+0.26,(i-1)*0.09);
    l.rotation.z=-Math.PI/2+(i-1)*0.55;carrot.add(l);
  }
  function wobbleCarrot(){
    const r0=carrot.rotation.y;
    tw(0.8,k=>{
      carrot.rotation.y=r0+Math.sin(k*Math.PI*3)*(1-k)*0.5;
      carrot.position.y=Math.abs(Math.sin(k*Math.PI*2))*0.15;
    },()=>{carrot.rotation.y=r0;carrot.position.y=0;});
    say('The carrot got boinged 🥕');
  }

  /* ================= hamster model ================= */
  function makeModel(c){
    const g=new THREE.Group();
    const bodyM=M(c.body),bellyM=M(c.belly),pink=M(0xffb3c0),dark=M(0x3a2626);
    const grp=new THREE.Group();g.add(grp);

    const body=new THREE.Mesh(new THREE.SphereGeometry(0.5,9,7),bodyM);
    body.scale.set(1.15,0.95,1.3);body.position.y=0.5;grp.add(body);
    const belly=new THREE.Mesh(new THREE.SphereGeometry(0.44,8,6),bellyM);
    belly.scale.set(1,0.85,1.1);belly.position.set(0,0.4,0.16);grp.add(belly);

    const head=new THREE.Group();head.position.set(0,0.72,0.42);grp.add(head);
    const skull=new THREE.Mesh(new THREE.SphereGeometry(0.32,9,7),bodyM);head.add(skull);
    const muzzle=new THREE.Mesh(new THREE.SphereGeometry(0.15,7,5),bellyM);
    muzzle.scale.set(1.2,0.8,1);muzzle.position.set(0,-0.06,0.26);head.add(muzzle);
    const nose=new THREE.Mesh(new THREE.SphereGeometry(0.05,6,5),pink);
    nose.position.set(0,0,0.4);head.add(nose);

    const eyes=[],eyeGeo=new THREE.SphereGeometry(0.045,6,5),
          glintGeo=new THREE.SphereGeometry(0.016,5,4),glintM=M(0xffffff,{roughness:.3});
    [-1,1].forEach(s=>{
      const e=new THREE.Mesh(eyeGeo,dark);e.position.set(0.14*s,0.06,0.25);head.add(e);eyes.push(e);
      const gl=new THREE.Mesh(glintGeo,glintM);gl.position.set(0.15*s,0.09,0.28);head.add(gl);
    });
    const ears=[];
    [-1,1].forEach(s=>{
      const ear=new THREE.Group();ear.position.set(0.17*s,0.24,-0.05);head.add(ear);
      const outer=new THREE.Mesh(new THREE.SphereGeometry(0.11,7,5),bodyM);
      outer.scale.set(1,1.1,0.6);ear.add(outer);
      const inner=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,4),pink);
      inner.scale.set(1,1,0.6);inner.position.z=0.05;ear.add(inner);
      ears.push(ear);
    });
    const cheeks=[];
    [-1,1].forEach(s=>{
      const ch=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,5),pink);
      ch.position.set(0.25*s,-0.05,0.15);head.add(ch);cheeks.push(ch);
    });
    const arms=[];
    [-1,1].forEach(s=>{
      const a=new THREE.Mesh(new THREE.SphereGeometry(0.07,6,4),bellyM);
      a.position.set(0.16*s,0.3,0.5);grp.add(a);arms.push(a);
    });
    const feet=[];
    FEET.forEach(([fx,fz])=>{
      const f=new THREE.Mesh(new THREE.SphereGeometry(0.075,6,4),bellyM);
      f.scale.set(1,0.7,1.3);f.position.set(fx,0.07,fz);grp.add(f);feet.push(f);
    });
    const tail=new THREE.Mesh(new THREE.SphereGeometry(0.07,6,4),bodyM);
    tail.position.set(0,0.42,-0.62);grp.add(tail);

    g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
    return {g,grp,head,ears,eyes,cheeks,arms,feet};
  }

  /* ================= behavior ================= */
  const CREW=[
    {name:'Biscuit', body:0xf2a25c,belly:0xffe6bb,likes:{wheel:.55,eat:.25,sleep:.2},speed:2.7},
    {name:'Mochi',   body:0xfdf4e6,belly:0xffffff,likes:{wheel:.20,eat:.60,sleep:.2},speed:2.2},
    {name:'Pepper',  body:0xb7b0c6,belly:0xf2eef8,likes:{wheel:.30,eat:.30,sleep:.4},speed:2.4},
    {name:'Cinnamon',body:0xc97a3d,belly:0xf6d8ae,likes:{wheel:.40,eat:.40,sleep:.2},speed:2.9},
    {name:'Peanut',  body:0xe8c48a,belly:0xfff2d6,likes:{wheel:.30,eat:.50,sleep:.2},speed:2.0},
  ];
  function randomPoint(rMin=0.5,rMax=WALK_R){
    const a=rand(0,Math.PI*2),r=rand(rMin,rMax);
    return new THREE.Vector3(Math.sin(a)*r,FLOOR,Math.cos(a)*r);
  }
  function safePoint(){
    for(let i=0;i<8;i++){
      const p=randomPoint(0.8,4.3);
      if(p.distanceTo(wheelPos)>1.6)return p;
    }
    return randomPoint(0.8,3);
  }
  function newHamster(cfg,i){
    const m=makeModel(cfg);
    const a=i/CREW.length*Math.PI*2+rand(-.4,.4),r=rand(2,4);
    const h={
      cfg,m,
      pos:new THREE.Vector3(Math.sin(a)*r,FLOOR,Math.cos(a)*r),
      yaw:rand(0,Math.PI*2),state:'wander',t:rand(2,4),target:safePoint(),
      phase:rand(0,6.28),moving:false,bobK:0,turn:0,airY:0,lean:0,
      cheekK:1,cheekTarget:1,armK:0,sleepK:0,blinkK:1,blinkT:rand(1,4),
      zzzT:0,nib:0,foodLust:false,wheelLust:false,prevState:null,
    };
    m.g.position.copy(h.pos);m.g.rotation.y=h.yaw;
    m.g.traverse(o=>{if(o.isMesh)o.userData.h=h;});
    scene.add(m.g);
    return h;
  }

  function seek(h,target,dt){
    const dx=target.x-h.pos.x,dz=target.z-h.pos.z;
    const dist=Math.hypot(dx,dz);
    if(dist<0.28)return true;
    const d=angDiff(h.yaw,Math.atan2(dx,dz));
    h.yaw+=d*Math.min(1,dt*7);
    const align=Math.max(0,Math.cos(d));
    const sp=h.cfg.speed*Math.min(1,dist/0.6)*dt;
    h.pos.x+=Math.sin(h.yaw)*sp*align;
    h.pos.z+=Math.cos(h.yaw)*sp*align;
    h.moving=align>0.3;h.turn=d;
    return false;
  }
  function faceTo(h,tx,tz,dt){
    const d=angDiff(h.yaw,Math.atan2(tx-h.pos.x,tz-h.pos.z));
    h.yaw+=d*Math.min(1,dt*6);
  }
  function contain(h){
    const r=Math.hypot(h.pos.x,h.pos.z);
    if(r>WALK_R){h.pos.x*=WALK_R/r;h.pos.z*=WALK_R/r;}
  }

  function startWheel(h){wheelObj.owner=h;h.state='toWheel';h.t=6;say(SAY.toWheel(h.cfg.name));}
  function startEat(h){bowlObj.owner=h;h.foodLust=false;h.state='toBowl';h.t=6;say(SAY.toBowl(h.cfg.name));}
  function arriveOrBail(h,target,dt,enter){
    if(seek(h,target,dt)){enter();return;}
    h.t-=dt;
    if(h.t<0){
      if(h.pos.distanceTo(target)<1.8)enter();
      else{
        if(wheelObj.owner===h)wheelObj.owner=null;
        if(bowlObj.owner===h)bowlObj.owner=null;
        think(h);
      }
    }
  }
  function think(h){
    const L=h.cfg.links||h.cfg.likes;
    if(h.wheelLust&&!wheelObj.owner){h.wheelLust=false;startWheel(h);return;}
    if(h.foodLust&&!bowlObj.owner){startEat(h);return;}
    const r=Math.random();
    if(!wheelObj.owner&&r<L.wheel*0.45){startWheel(h);return;}
    if(!bowlObj.owner&&r<L.wheel*0.45+L.eat*0.45){startEat(h);return;}
    const r2=Math.random();
    if(r2<0.42){h.state='wander';h.target=safePoint();h.t=rand(2.5,6);}
    else if(r2<0.68){h.state='pause';h.t=rand(1.2,3);say(SAY.pause(h.cfg.name));}
    else if(r2<0.86){h.state='groom';h.t=rand(1.6,3.2);say(SAY.groom(h.cfg.name));}
    else{h.state='sleep';h.t=rand(4,8);say(SAY.sleep(h.cfg.name));}
  }

  function eatPellet(h){
    let best=null,bd=1e9;const w=new THREE.Vector3();
    pellets.forEach(p=>{
      if(!p.alive)return;
      p.mesh.getWorldPosition(w);
      const d=w.distanceTo(h.pos);
      if(d<bd){bd=d;best=p;}
    });
    if(best&&bd<1.2){
      best.alive=false;
      tw(0.3,k=>best.mesh.scale.setScalar(Math.max(0.001,1-k)),()=>{best.mesh.visible=false;});
    }
  }

  function stepHamster(h,dt,time){
    h.moving=false;
    h.blinkT-=dt;
    if(h.blinkT<=0){
      h.blinkT=rand(2,5);
      tw(0.22,k=>{h.blinkK=1-Math.abs(Math.sin(k*Math.PI))*0.92;},()=>{h.blinkK=1;});
    }
    switch(h.state){
      case 'wander':
        h.t-=dt;
        if(seek(h,h.target,dt)||h.t<0)think(h);
        break;
      case 'toBowl':
        arriveOrBail(h,bowlApproach,dt,()=>{h.state='eat';h.t=rand(4,7);h.nib=0.4;say(SAY.eat(h.cfg.name));});
        break;
      case 'eat':
        h.t-=dt;
        faceTo(h,bowlPos.x,bowlPos.z,dt);
        h.nib-=dt;
        if(h.nib<=0){h.nib=0.55;eatPellet(h);}
        if(h.t<=0||aliveCount()===0){bowlObj.owner=null;think(h);}
        break;
      case 'toWheel':
        arriveOrBail(h,wheelApproach,dt,()=>{h.state='onWheel';h.t=rand(3.5,6);say(SAY.onWheel(h.cfg.name));});
        break;
      case 'onWheel':
        h.t-=dt;
        h.pos.copy(wheelObj.contact);h.yaw=Math.PI;
        if(h.t<=0){
          wheelObj.owner=null;h.state='hopOff';h.t=0.5;
          h.hopFrom=h.pos.clone();h.hopTo=safePoint();
        }
        break;
      case 'hopOff':{
        h.t-=dt;
        const k=1-Math.max(0,h.t)/0.5;
        h.pos.lerpVectors(h.hopFrom,h.hopTo,k);
        h.airY=4*0.5*k*(1-k);
        faceTo(h,h.hopTo.x,h.hopTo.z,dt);
        if(h.t<=0){h.airY=0;think(h);}
        break;}
      case 'petted':
        h.t-=dt;
        if(h.t<=0){
          h.state=h.prevState||'wander';h.prevState=null;
          if(h.state==='onWheel'){h.t=2;h.pos.copy(wheelObj.contact);h.yaw=Math.PI;}
        }
        break;
      default: // pause / groom / sleep
        h.t-=dt;
        if(h.t<=0)think(h);
    }
    // steer around the wheel unless riding it
    if(h!==wheelObj.owner&&(h.state==='wander'||h.state==='toBowl')){
      const dx=h.pos.x-wheelPos.x,dz=h.pos.z-wheelPos.z,d=Math.hypot(dx,dz);
      if(d<1.5&&d>0.01){const push=(1.5-d)/1.5*2.4*dt;h.pos.x+=dx/d*push;h.pos.z+=dz/d*push;}
    }
    contain(h);
    h.cheekTarget=(h.state==='eat')?1.45:(h.state==='petted'?1.3:1);
    h.cheekK=damp(h.cheekK,h.cheekTarget,4,dt);
    h.armK=damp(h.armK,h.state==='groom'?1:0,8,dt);
    h.sleepK=damp(h.sleepK,h.state==='sleep'?1:0,5,dt);
    h.lean=damp(h.lean,h.state==='onWheel'?-0.22:0,8,dt);
    if(!h.moving)h.turn=damp(h.turn,0,8,dt);
    if(h.state==='sleep'){
      h.zzzT-=dt;
      if(h.zzzT<=0){h.zzzT=0.85;spawnZ(h);}
    }
  }

  function drawHamster(h,dt,time){
    const p=h.m;
    p.g.position.set(h.pos.x,FLOOR+h.airY,h.pos.z);
    p.g.rotation.y=h.yaw;
    h.bobK=damp(h.bobK,h.moving?1:0,10,dt);
    h.phase+=dt*(h.state==='onWheel'?16:h.bobK*9+1.5);
    const bob=(h.state==='onWheel')
      ?Math.abs(Math.sin(h.phase))*0.07
      :Math.abs(Math.sin(h.phase))*0.05*h.bobK+(h.state==='petted'?Math.abs(Math.sin(time*14))*0.1:0);
    p.grp.position.y=bob;
    p.grp.rotation.y=Math.sin(h.phase)*0.1*h.bobK;
    p.grp.rotation.z=-h.turn*0.3*h.bobK;
    p.grp.rotation.x=h.lean;
    const breathe=1+Math.sin(time*2.2+h.phase)*0.02;
    p.grp.scale.set(1,lerp(breathe,0.62,h.sleepK)*(h.state==='eat'?1+Math.sin(time*10)*0.03:1),1);
    p.feet.forEach((f,i)=>{
      f.position.x=FEET[i][0]+Math.sin(h.phase+(i%2)*Math.PI+(i>1?1.2:0))*0.05*h.bobK;
    });
    let hx=0,hz=0;
    if(h.state==='pause')hx=0.22+Math.sin(time*5+h.phase)*0.1;
    if(h.state==='eat')hx=0.3+Math.sin(time*11)*0.14;
    if(h.state==='groom'){hx=-0.35;hz=0.25;}
    if(h.state==='petted')hz=Math.sin(time*16)*0.2;
    p.head.rotation.x=damp(p.head.rotation.x,hx,10,dt);
    p.head.rotation.z=damp(p.head.rotation.z,hz,10,dt);
    p.arms.forEach((a,i)=>{a.rotation.x=-h.armK*(1.1+Math.sin(time*13+i*2)*0.4);});
    p.cheeks.forEach(c=>c.scale.setScalar(h.cheekK));
    const es=lerp(1,0.12,h.sleepK)*h.blinkK;
    p.eyes.forEach(e=>{e.scale.y=es;});
    if(h.sleepK<0.5&&Math.random()<dt*0.35){
      const ear=pick(p.ears);
      tw(0.35,k=>{ear.rotation.z=Math.sin(k*Math.PI*2)*0.35;},()=>{ear.rotation.z=0;});
    }
  }

  /* ================= sprites: hearts & zzz ================= */
  const heartTex=(()=>{
    const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
    x.lineWidth=5;x.strokeStyle='#4a2c2a';x.fillStyle='#ff5d73';
    x.beginPath();x.moveTo(32,52);
    x.bezierCurveTo(10,36,4,20,12,11);x.bezierCurveTo(20,3,30,8,32,17);
    x.bezierCurveTo(34,8,44,3,52,11);x.bezierCurveTo(60,20,54,36,32,52);
    x.closePath();x.fill();x.stroke();
    const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
  })();
  function spawnHearts(pos){
    for(let i=0;i<4;i++){
      const s=new THREE.Sprite(new THREE.SpriteMaterial({map:heartTex,transparent:true,depthWrite:false}));
      const sy=pos.y+rand(0.7,1.1);
      s.position.set(pos.x+rand(-0.35,0.35),sy,pos.z+rand(-0.35,0.35));
      s.scale.setScalar(rand(0.22,0.4));scene.add(s);
      tw(rand(0.7,1.1),k=>{
        s.position.y=sy+k*0.9;
        s.material.opacity=1-easeIn(k);
        s.material.rotation=Math.sin(k*Math.PI*2+i)*0.4;
      },()=>{scene.remove(s);s.material.dispose();});
    }
  }
  const zTex=(()=>{
    const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
    x.font='800 46px sans-serif';x.textAlign='center';x.textBaseline='middle';
    x.lineWidth=8;x.strokeStyle='#4a2c2a';x.strokeText('Z',32,34);
    x.fillStyle='#fff';x.fillText('Z',32,34);
    const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
  })();
  const _wp=new THREE.Vector3();
  function spawnZ(h){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:zTex,transparent:true,depthWrite:false}));
    h.m.head.getWorldPosition(_wp);
    const sx=_wp.x+rand(-0.1,0.1),sy=_wp.y+0.25,sz=_wp.z+rand(-0.1,0.1);
    s.position.set(sx,sy,sz);s.scale.setScalar(0.3);scene.add(s);
    tw(1,k=>{
      s.position.y=sy+k*0.9;s.position.x=sx+k*0.3;
      s.material.opacity=1-k;
    },()=>{scene.remove(s);s.material.dispose();});
  }

  /* ================= ticker ================= */
  const clock=new THREE.Clock();
  const tickEl=document.getElementById('tick'),tickTxt=document.getElementById('tickTxt');
  let lastSay=-10,lastTick=0;
  function say(msg){
    const t=clock.elapsedTime;
    if(t-lastSay<1.5)return;
    lastSay=t;
    tickTxt.textContent=msg;
    tickEl.classList.remove('pop');void tickEl.offsetWidth;tickEl.classList.add('pop');
  }
  const SAY={
    toWheel:n=>`${n} spotted the wheel 🎡`,
    onWheel:n=>pick([`${n} is doing laps!`,`${n} found the wheel. Legend.`]),
    toBowl:n=>`${n} smells snacks 🥕`,
    eat:n=>pick([`${n} is loading those cheeks`,`${n} is on a buffet mission`]),
    pause:n=>`${n} is sniffing the vibes`,
    groom:n=>`${n} is doing a little spa ✨`,
    sleep:n=>`${n} is taking a nap 💤`,
  };
  const AMBIENT=['The crew is vibing 🎶','Someone dropped a crumb. Drama.','The wheel squeaks. It’s iconic.','Five tiny friends, one big dream.'];

  /* ================= interaction: click / hover ================= */
  const pickMeshes=[];
  const ray=new THREE.Raycaster(),mouseN=new THREE.Vector2();
  let needHover=false;
  function pet(h){
    if(h.state==='hopOff')return;
    if(h.state==='onWheel')h.prevState=h.state;
    h.state='petted';h.t=1.1;
    spawnHearts(h.m.g.position);
    showTag(h);
    say(`Booped! ${h.cfg.name} is thrilled 💛`);
  }
  const tagEl=document.getElementById('tag');
  let tagH=null,tagT=0;
  function showTag(h){
    tagH=h;tagT=1.7;
    tagEl.textContent=h.cfg.name+' 💛';
    tagEl.classList.add('show');
  }
  let downInfo=null;
  canvas.addEventListener('pointerdown',e=>{
    downInfo={x:e.clientX,y:e.clientY,t:performance.now()};
    canvas.style.cursor='grabbing';
  });
  window.addEventListener('pointerup',e=>{
    canvas.style.cursor='grab';
    if(!downInfo)return;
    const d=Math.hypot(e.clientX-downInfo.x,e.clientY-downInfo.y);
    const ok=d<7&&performance.now()-downInfo.t<450;
    downInfo=null;
    if(!ok||e.target!==canvas)return;
    mouseN.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(mouseN,camera);
    const hits=ray.intersectObjects(pickMeshes,false);
    if(!hits.length)return;
    const u=hits[0].object.userData;
    if(u.h)pet(u.h);else if(u.carrot)wobbleCarrot();
  });
  canvas.addEventListener('pointermove',e=>{
    mouseN.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
    needHover=true;
  });

  /* ================= buttons ================= */
  const btnFeed=document.getElementById('btnFeed'),
        btnNight=document.getElementById('btnNight'),
        btnOrbit=document.getElementById('btnOrbit');
  let night=false;
  btnFeed.onclick=()=>{
    refillPellets(true);
    hamsters.forEach(h=>{
      if(h.state==='onWheel'||h.state==='hopOff')return;
      if(h.state==='sleep'){h.t=Math.min(h.t,0.3);h.foodLust=true;return;}
      if(Math.random()>0.7){if(!wheelObj.owner)startWheel(h);else h.wheelLust=true;}
      else{if(!bowlObj.owner)startEat(h);else h.foodLust=true;}
    });
    say('FEEDING TIME! The bowl is restocked 🥕');
  };
  btnNight.onclick=()=>{
    night=!night;
    document.body.classList.toggle('night',night);
    btnNight.innerHTML=night?'☀️ <span>Daytime</span>':'🌙 <span>Lights</span>';
    btnNight.classList.toggle('on',night);
    say(night?'Lights out. Cozy mode 🌙':"Sun's back! ☀️");
  };
  btnOrbit.onclick=()=>{
    controls.autoRotate=!controls.autoRotate;
    btnOrbit.classList.toggle('on',controls.autoRotate);
  };

  /* ================= crew + opening cast ================= */
  const hamsters=CREW.map(newHamster);
  hamsters.forEach(h=>h.m.g.traverse(o=>{if(o.isMesh)pickMeshes.push(o);}));
  carrot.traverse(o=>{if(o.isMesh){o.userData.carrot=true;pickMeshes.push(o);}});

  const B=hamsters[0],Mo=hamsters[1];
  wheelObj.owner=B;B.state='onWheel';B.t=5;
  B.pos.copy(wheelObj.contact);B.yaw=Math.PI;wheelObj.spinV=7;
  bowlObj.owner=Mo;Mo.state='eat';Mo.t=5;
  Mo.pos.copy(bowlApproach);
  Mo.yaw=Math.atan2(bowlPos.x-Mo.pos.x,bowlPos.z-Mo.pos.z);
  hamsters[2].state='sleep';hamsters[2].t=6;
  hamsters[4].state='groom';hamsters[4].t=3;
  setTimeout(()=>say('Biscuit just woke up. Chaos incoming.'),800);

  /* ================= main loop ================= */
  let day=1,booted=false;
  const loader=document.getElementById('loader');
  function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(clock.getDelta(),0.05);
    const time=clock.elapsedTime;
    stepTweens(dt);
    controls.update();

    // day / night blend
    day=damp(day,night?0:1,1.6,dt);
    hemi.intensity=lerp(0.32,0.95,day);
    sun.intensity=lerp(0.35,1.7,day);
    lamp.intensity=lerp(2.4,0,day);
    bulbMat.emissiveIntensity=lerp(1.6,0,day);
    renderer.toneMappingExposure=lerp(1.05,1.15,day);

    // wheel physics: driven by rider, coasts down with friction
    wheelObj.spinV=damp(wheelObj.spinV,wheelObj.owner?7.5:0,wheelObj.owner?1.8:0.9,dt);
    spin.rotation.x+=wheelObj.spinV*dt;

    // bowl auto-refill
    if(aliveCount()===0){bowlObj.refillT+=dt;if(bowlObj.refillT>8)refillPellets(false);}
    else bowlObj.refillT=0;

    hamsters.forEach(h=>{stepHamster(h,dt,time);drawHamster(h,dt,time);});

    // name tag follow
    if(tagH){
      tagT-=dt;
      const v=tagH.m.g.position.clone().add(new THREE.Vector3(0,1.25,0)).project(camera);
      if(v.z>1||tagT<=0){tagH=null;tagEl.classList.remove('show');}
      else{
        tagEl.style.left=((v.x*0.5+0.5)*innerWidth)+'px';
        tagEl.style.top=((-v.y*0.5+0.5)*innerHeight)+'px';
      }
    }
    // hover cursor
    if(needHover){
      needHover=false;
      ray.setFromCamera(mouseN,camera);
      canvas.style.cursor=ray.intersectObjects(pickMeshes,false).length?'pointer':'grab';
    }
    // idle chatter
    if(time-lastTick>9){lastTick=time;say(pick(AMBIENT));}

    renderer.render(scene,camera);
    if(!booted){
      booted=true;window.__booted=true;
      loader.classList.add('hide');
      setTimeout(()=>loader.remove(),800);
    }
  }
  animate();

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  </script>
</body>
</html>
