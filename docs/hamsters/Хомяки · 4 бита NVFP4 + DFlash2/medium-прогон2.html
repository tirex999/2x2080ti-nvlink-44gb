<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
  #ui {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    font-family: "Segoe UI", Arial, sans-serif; color: #5a4632;
    background: rgba(255, 252, 240, 0.85); border-radius: 14px;
    padding: 12px 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    pointer-events: none; user-select: none;
  }
  #ui h1 { margin: 0 0 4px; font-size: 18px; }
  #ui p  { margin: 0; font-size: 13px; opacity: 0.8; line-height: 1.5; }
</style>
</head>
<body>

<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &nbsp;•&nbsp; Scroll to zoom<br>
     Click the wheel to give it a boost!</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- Renderer / Scene / Camera ---------------- */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbde0fe);
scene.fog = new THREE.Fog(0xbde0fe, 25, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(10, 8, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.49;

/* ---------------- Lights ---------------- */

scene.add(new THREE.AmbientLight(0xfff4e0, 0.75));

const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -10;  sun.shadow.camera.right = 10;
sun.shadow.camera.top  =  10;  sun.shadow.camera.bottom = -10;
scene.add(sun);

/* ---------------- Helpers ---------------- */

const mat = (color, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, flatShading: true, ...extra });

function box(w, h, d, material) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.castShadow = m.receiveShadow = true;
  return m;
}

function lerpAngle(a, b, t) {
  let d = (b - a) % (Math.PI * 2);
  if (d >  Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

/* ---------------- Ground ---------------- */

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 24),
  mat(0xcdeac0)
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.6;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------- Cage ---------------- */

const cage = new THREE.Group();
scene.add(cage);

const tray = box(11, 0.6, 11, mat(0xf7e1a0));
tray.position.y = -0.3;
cage.add(tray);

const sand = box(10.4, 0.5, 10.4, mat(0xe8c987));
sand.position.y = 0.05;
cage.add(sand);

// Wire bars around the perimeter
const barMat = mat(0xd9dee6, { metalness: 0.4, roughness: 0.5 });
const barGeo = new THREE.CylinderGeometry(0.05, 0.05, 5, 6);
const postGeo = new THREE.CylinderGeometry(0.09, 0.09, 5, 6);

function addBar(x, z, geo) {
  const b = new THREE.Mesh(geo, barMat);
  b.position.set(x, 2.5, z);
  b.castShadow = true;
  cage.add(b);
}
for (let i = -5; i <= 5; i += 1.25) {
  const corner = Math.abs(i) >= 4.9;
  addBar(i, -5, corner ? postGeo : barGeo);
  addBar(i,  5, corner ? postGeo : barGeo);
  addBar(-5, i, corner ? postGeo : barGeo);
  addBar( 5, i, corner ? postGeo : barGeo);
}

// Top frame
const frameMat = mat(0xc4cbd6, { metalness: 0.4, roughness: 0.5 });
function addFrame(x, z, rotY, len) {
  const f = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, len, 6), frameMat);
  f.rotation.z = Math.PI / 2;
  f.rotation.y = rotY;
  f.position.set(x, 5, z);
  cage.add(f);
}
addFrame(0, -5, 0, 11);
addFrame(0,  5, 0, 11);
addFrame(-5, 0, Math.PI / 2, 11);
addFrame( 5, 0, Math.PI / 2, 11);

/* ---------------- Interactive Wheel ---------------- */

const WHEEL_POS = new THREE.Vector3(3.7, 0, 0);
const wheelGroup = new THREE.Group();
wheelGroup.position.set(WHEEL_POS.x, 1.0, WHEEL_POS.z);
scene.add(wheelGroup);

const wheelMat = mat(0x7ec8e3);
const rim = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.07, 6, 14), wheelMat);
rim.castShadow = true;
wheelGroup.add(rim);

for (let i = 0; i < 4; i++) {
  const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.85, 5), wheelMat);
  spoke.rotation.z = (i / 4) * Math.PI;
  wheelGroup.add(spoke);
}
const hub = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), mat(0xffffff));
wheelGroup.add(hub);

// Stand for the wheel
const stand = box(0.2, 1.0, 0.2, mat(0xc4cbd6, { metalness: 0.4 }));
stand.position.set(WHEEL_POS.x, 0.5, WHEEL_POS.z);
scene.add(stand);

let wheelVel = 0;   // rad/s
let wheelUser = null; // hamster currently running

/* ---------------- Tunnel ---------------- */

const tunnelGeo = new THREE.CylinderGeometry(0.9, 0.9, 2.6, 8, 1, true, 0, Math.PI);
tunnelGeo.rotateZ(Math.PI / 2); // axis along X, opening faces down
const tunnel = new THREE.Mesh(tunnelGeo, mat(0xf4978e, { side: THREE.DoubleSide }));
tunnel.position.set(-3.2, 0.9, 2.6);
tunnel.rotation.y = 0.5;
tunnel.castShadow = true;
scene.add(tunnel);

/* ---------------- House ---------------- */

const house = new THREE.Group();
house.position.set(-3.8, 0, 3.4);
house.rotation.y = -0.4;
const walls = box(1.6, 1.2, 1.6, mat(0x81c784));
walls.position.y = 0.6;
house.add(walls);
const roof = new THREE.Mesh(new THREE.ConeGeometry(1.4, 0.9, 4), mat(0xe57373));
roof.position.y = 1.65;
roof.rotation.y = Math.PI / 4;
roof.castShadow = true;
house.add(roof);
const door = new THREE.Mesh(new THREE.CircleGeometry(0.35, 10), mat(0x5a4632));
door.position.set(0, 0.55, 0.81);
house.add(door);
scene.add(house);

/* ---------------- Food Bowl ---------------- */

const BOWL_POS = new THREE.Vector3(-3.5, 0, -2.8);
const bowl = new THREE.Group();
bowl.position.copy(BOWL_POS);
const dish = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.5, 0.35, 10), mat(0xef5350));
dish.position.y = 0.18;
dish.castShadow = true;
bowl.add(dish);
const seedColors = [0xf5a623, 0x8bc34a, 0xd98cb3];
for (let i = 0; i < 7; i++) {
  const seed = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 5), mat(seedColors[i % 3]));
  const a = (i / 7) * Math.PI * 2;
  seed.position.set(Math.cos(a) * 0.3, 0.36, Math.sin(a) * 0.3);
  bowl.add(seed);
}
scene.add(bowl);

/* ---------------- Hamster Builder ---------------- */

function buildHamsterMesh(fur, cheek) {
  const g = new THREE.Group();
  const furM = mat(fur), cheekM = mat(cheek);

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 7, 5), furM);
  body.scale.set(1, 0.85, 1.25);
  body.position.y = 0.55;
  body.castShadow = true;
  g.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 7, 5), furM);
  head.position.set(0, 0.68, 0.42);
  head.castShadow = true;
  g.add(head);

  for (const s of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 5), furM);
    ear.position.set(s * 0.18, 0.92, 0.32);
    g.add(ear);

    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 5), mat(0x2b2b2b));
    eye.position.set(s * 0.13, 0.74, 0.7);
    g.add(eye);

    const cheekBall = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 5), cheekM);
    cheekBall.position.set(s * 0.24, 0.55, 0.6);
    g.add(cheekBall);
  }

  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 5), mat(0xf48fb1));
  nose.position.set(0, 0.64, 0.75);
  g.add(nose);

  const feet = [];
  for (const [sx, sz] of [[-1, 1], [1, 1], [-1, -1], [1, -1]]) {
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 5), furM);
    foot.position.set(sx * 0.2, 0.09, sz * 0.3);
    g.add(foot);
    feet.push({ mesh: foot, base: foot.position.clone(), phase: Math.random() * Math.PI * 2 });
  }

  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 5), furM);
  tail.position.set(0, 0.45, -0.62);
  g.add(tail);

  return { group: g, body, head, feet, cheeks: [...g.children].filter(m => m.material === cheekM) };
}

/* ---------------- Hamster Behavior ---------------- */

const BOUNDS = 4.4;
const WHEEL_SPOT = new THREE.Vector3(3.7, 0, 0);
const BOWL_SPOT  = new THREE.Vector3(-2.9, 0, -2.1);

class Hamster {
  constructor(fur, cheek, x, z) {
    const parts = buildHamsterMesh(fur, cheek);
    this.g = parts.group;
    this.body = parts.body;
    this.head = parts.head;
    this.feet = parts.feet;
    this.cheeks = parts.cheeks;
    this.g.position.set(x, 0, z);
    this.g.rotation.y = Math.random() * Math.PI * 2;
    this.phase = Math.random() * Math.PI * 2;
    this.speed = 1.1 + Math.random() * 0.5;
    this.state = 'pause';
    this.timer = 1 + Math.random();
    this.target = new THREE.Vector3();
    scene.add(this.g);
  }

  randomTarget() {
    for (let tries = 0; tries < 10; tries++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * (BOUNDS - 0.6);
      const p = new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r);
      if (p.distanceTo(WHEEL_SPOT) > 1.7 && p.distanceTo(BOWL_SPOT) > 1.0) return p;
    }
    return new THREE.Vector3(0, 0, 0);
  }

  decide() {
    const r = Math.random();
    if (r < 0.25 && !wheelUser) {
      this.state = 'toWheel';
      this.target = WHEEL_SPOT;
    } else if (r < 0.45) {
      this.state = 'toBowl';
      this.target = BOWL_SPOT;
    } else {
      this.state = 'wander';
      this.target = this.randomTarget();
    }
  }

  moveToward(dt) {
    const p = this.g.position;
    const dir = new THREE.Vector3().subVectors(this.target, p);
    dir.y = 0;
    const dist = dir.length();
    if (dist < 0.2) return true;
    dir.normalize();
    p.addScaledVector(dir, this.speed * dt);
    p.x = THREE.MathUtils.clamp(p.x, -BOUNDS, BOUNDS);
    p.z = THREE.MathUtils.clamp(p.z, -BOUNDS, BOUNDS);
    this.g.rotation.y = lerpAngle(this.g.rotation.y, Math.atan2(dir.x, dir.z), Math.min(1, dt * 8));
    return false;
  }

  resetPose() {
    this.head.rotation.set(0, 0, 0);
    for (const c of this.cheeks) c.scale.setScalar(1);
  }

  update(dt, t) {
    const p = this.g.position;
    let running = false;

    switch (this.state) {
      case 'wander':
        if (this.moveToward(dt)) { this.state = 'pause'; this.timer = 0.5 + Math.random() * 2; }
        running = true;
        break;

      case 'pause':
        this.timer -= dt;
        this.head.rotation.y = Math.sin(t * 0.8 + this.phase) * 0.45; // look around
        if (this.timer <= 0) { this.resetPose(); this.decide(); }
        break;

      case 'toWheel':
        if (this.moveToward(dt)) {
          this.state = 'atWheel';
          this.timer = 3 + Math.random() * 2.5;
          wheelUser = this;
          this.g.rotation.y = Math.PI / 2;
        }
        running = true;
        break;

      case 'atWheel':
        this.timer -= dt;
        p.lerp(WHEEL_SPOT, Math.min(1, dt * 6));
        this.g.rotation.y = lerpAngle(this.g.rotation.y, Math.PI / 2, Math.min(1, dt * 6));
        if (this.timer <= 0) {
          wheelUser = null;
          this.state = 'pause';
          this.timer = 1 + Math.random();
        }
        running = true;
        break;

      case 'toBowl':
        if (this.moveToward(dt)) {
          this.state = 'atBowl';
          this.timer = 2.5 + Math.random() * 2;
        }
        running = true;
        break;

      case 'atBowl':
        this.timer -= dt;
        this.g.rotation.y = lerpAngle(
          this.g.rotation.y,
          Math.atan2(BOWL_POS.x - p.x, BOWL_POS.z - p.z),
          Math.min(1, dt * 6)
        );
        this.head.rotation.x = 0.55 + Math.sin(t * 9) * 0.15; // nibbling
        const puff = 1.5 + Math.sin(t * 9) * 0.3;
        for (const c of this.cheeks) c.scale.setScalar(puff);
        if (this.timer <= 0) {
          this.resetPose();
          this.state = 'pause';
          this.timer = 0.8 + Math.random();
        }
        break;
    }

    /* --- body animation --- */
    const bobFreq = this.state === 'atWheel' ? 14 : 9;
    const bobAmp  = this.state === 'atWheel' ? 0.05 : 0.03;
    this.g.position.y = Math.abs(Math.sin(t * bobFreq + this.phase)) * bobAmp;
    this.body.scale.y = 0.85 + Math.sin(t * 2.2 + this.phase) * 0.02; // breathing

    const legAmp  = running ? (this.state === 'atWheel' ? 0.14 : 0.09) : 0;
    const legFreq = this.state === 'atWheel' ? 16 : 10;
    for (const f of this.feet) {
      const s = Math.sin(t * legFreq + f.phase);
      f.mesh.position.z = f.base.z + s * legAmp;
      f.mesh.position.y = f.base.y + Math.max(0, s) * legAmp * 0.6;
    }
  }
}

/* ---------------- Create Hamsters ---------------- */

const palettes = [
  [0xf5b971, 0xffd9c0], // golden
  [0xfff3e0, 0xffcdd2], // cream
  [0xc98a5e, 0xffab91], // brown
  [0xb9bdc7, 0xf8bbd0], // gray
];
const hamsters = palettes.map((pal, i) =>
  new Hamster(pal[0], pal[1], -1.5 + i * 1.2, -1 + (i % 2) * 2)
);

/* ---------------- Click the Wheel ---------------- */

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
addEventListener('pointerdown', (e) => {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  if (raycaster.intersectObjects(wheelGroup.children).length > 0) {
    wheelVel += 12; // boost!
  }
});

/* ---------------- Resize ---------------- */

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- Main Loop ---------------- */

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  for (const h of hamsters) h.update(dt, t);

  // Wheel physics: driven by hamster, boosted by clicks, friction otherwise
  const targetVel = wheelUser ? 6 : 0;
  wheelVel += (targetVel - wheelVel) * Math.min(1, dt * 1.5);
  wheelVel *= (1 - dt * 0.4);
  wheelGroup.rotation.z -= wheelVel * dt;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
