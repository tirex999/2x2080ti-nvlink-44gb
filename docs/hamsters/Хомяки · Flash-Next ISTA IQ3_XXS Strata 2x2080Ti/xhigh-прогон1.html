<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Low-Poly Hamster Playground</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #171d26;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    canvas {
      display: block;
    }

    #ui {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(12, 18, 28, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      max-width: 300px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    #ui h1 {
      margin: 0 0 6px;
      font-size: 18px;
      color: #ffd166;
    }

    #ui p {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      opacity: 0.88;
    }

    #ui .hint {
      margin-top: 8px;
      color: #8ecae6;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Low-Poly Hamster Playground</h1>
    <p>Drag to rotate. Scroll or pinch to zoom.</p>
    <p class="hint">Click the food bowl to call the hamsters.</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x171d26);
    scene.fog = new THREE.Fog(0x171d26, 22, 48);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(9, 7, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.2, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 7;
    controls.maxDistance = 26;
    controls.maxPolarAngle = Math.PI / 2 - 0.03;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;

    controls.addEventListener("start", () => {
      controls.autoRotate = false;
    });

    function makeMat(color, opts = {}) {
      return new THREE.MeshStandardMaterial({
        color,
        flatShading: true,
        roughness: 0.78,
        metalness: 0.04,
        ...opts
      });
    }

    const bounds = { x: 4.7, z: 2.7 };
    const bowlTarget = new THREE.Vector3(2.0, 0.1, 0);

    // Tray / floor
    const tray = new THREE.Mesh(
      new THREE.BoxGeometry(12, 0.5, 8),
      makeMat(0xf2c14e)
    );
    tray.position.y = -0.25;
    tray.receiveShadow = true;
    scene.add(tray);

    const bedding = new THREE.Mesh(
      new THREE.BoxGeometry(11.4, 0.1, 7.4),
      makeMat(0xe7a93f)
    );
    bedding.position.y = 0.05;
    bedding.receiveShadow = true;
    scene.add(bedding);

    // Wood chips
    const chipGeo = new THREE.BoxGeometry(0.22, 0.06, 0.12);
    const chipMats = [
      makeMat(0xd98c3b),
      makeMat(0xc97a2f),
      makeMat(0xe8b04a)
    ];

    let chips = 0;
    while (chips < 45) {
      const x = (Math.random() - 0.5) * 10.8;
      const z = (Math.random() - 0.5) * 6.8;

      if (Math.hypot(x - bowlTarget.x, z - bowlTarget.z) < 1.2) {
        continue;
      }

      const chip = new THREE.Mesh(chipGeo, chipMats[chips % 3]);
      chip.position.set(x, 0.11, z);
      chip.rotation.set(
        Math.random() * 0.4,
        Math.random() * Math.PI * 2,
        Math.random() * 0.3
      );
      chip.castShadow = true;
      scene.add(chip);
      chips++;
    }

    // Cage bars
    const cageX = 5.8;
    const cageZ = 3.8;

    const barMat = makeMat(0x9fb0c0, { metalness: 0.35, roughness: 0.45 });
    const barGeo = new THREE.CylinderGeometry(0.065, 0.065, 3.2, 6);

    function addBar(x, z) {
      const bar = new THREE.Mesh(barGeo, barMat);
      bar.position.set(x, 1.7, z);
      bar.castShadow = true;
      scene.add(bar);
    }

    for (let i = 0; i <= 14; i++) {
      const x = -cageX + i * ((2 * cageX) / 14);
      addBar(x, -cageZ);
      addBar(x, cageZ);
    }

    for (let i = 1; i < 10; i++) {
      const z = -cageZ + i * ((2 * cageZ) / 10);
      addBar(-cageX, z);
      addBar(cageX, z);
    }

    // Top rails
    const railMat = makeMat(0x8fa0b0, { metalness: 0.35, roughness: 0.45 });
    const railX = new THREE.BoxGeometry(12, 0.12, 0.12);
    const railZ = new THREE.BoxGeometry(0.12, 0.12, 8);

    for (const z of [-cageZ, cageZ]) {
      const rail = new THREE.Mesh(railX, railMat);
      rail.position.set(0, 3.3, z);
      rail.castShadow = true;
      scene.add(rail);
    }

    for (const x of [-cageX, cageX]) {
      const rail = new THREE.Mesh(railZ, railMat);
      rail.position.set(x, 3.3, 0);
      rail.castShadow = true;
      scene.add(rail);
    }

    const crossGeo = new THREE.BoxGeometry(0.1, 0.1, 7.6);
    for (let i = 0; i <= 6; i++) {
      const x = -4.8 + i * 1.6;
      const cross = new THREE.Mesh(crossGeo, railMat);
      cross.position.set(x, 3.3, 0);
      cross.castShadow = true;
      scene.add(cross);
    }

    // Food bowl: interactive object
    const bowlGroup = new THREE.Group();

    const bowlOuter = new THREE.Mesh(
      new THREE.CylinderGeometry(0.85, 0.6, 0.45, 8),
      makeMat(0xff6b6b)
    );
    bowlOuter.position.y = 0.225;
    bowlOuter.castShadow = true;
    bowlOuter.receiveShadow = true;
    bowlGroup.add(bowlOuter);

    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(0.85, 0.07, 4, 8),
      makeMat(0xff8f8f)
    );
    rim.rotation.x = Math.PI / 2;
    rim.position.y = 0.45;
    rim.castShadow = true;
    bowlGroup.add(rim);

    const bowlInner = new THREE.Mesh(
      new THREE.CircleGeometry(0.72, 8),
      makeMat(0x8b2f2f)
    );
    bowlInner.rotation.x = -Math.PI / 2;
    bowlInner.position.y = 0.451;
    bowlInner.receiveShadow = true;
    bowlGroup.add(bowlInner);

    const pelletGeo = new THREE.IcosahedronGeometry(0.09, 0);
    for (let i = 0; i < 12; i++) {
      const pellet = new THREE.Mesh(pelletGeo, makeMat(0x7bc47f));
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * 0.5;
      pellet.position.set(
        Math.cos(angle) * radius,
        0.52,
        Math.sin(angle) * radius
      );
      pellet.rotation.set(Math.random(), Math.random(), Math.random());
      pellet.castShadow = true;
      bowlGroup.add(pellet);
    }

    bowlGroup.position.copy(bowlTarget);
    bowlGroup.userData.pulse = 0;
    scene.add(bowlGroup);

    // Lights
    const hemi = new THREE.HemisphereLight(0xfff0d8, 0x223344, 1.1);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(8, 12, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -12;
    key.shadow.camera.right = 12;
    key.shadow.camera.top = 12;
    key.shadow.camera.bottom = -12;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 40;
    key.shadow.bias = -0.0005;
    key.shadow.normalBias = 0.02;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x88bbff, 0.35);
    fill.position.set(-8, 6, -6);
    scene.add(fill);

    // Hamsters
    const hamsters = [];

    const hamsterColors = [
      0xffb347,
      0xffd166,
      0xf4a261,
      0xe07a5f,
      0x8ecae6,
      0xbde0fe,
      0xa7c95d,
      0xffc8dd
    ];

    const accentColors = [
      0xd97706,
      0xeab308,
      0xc2410c,
      0x9f1239,
      0x0284c7,
      0x0369a1,
      0x4d7c0f,
      0xdb2777
    ];

    function createHamster(color, accent) {
      const group = new THREE.Group();

      const bodyMat = makeMat(color);
      const accentMat = makeMat(accent);
      const darkMat = makeMat(0x111111, { roughness: 0.35 });
      const pinkMat = makeMat(0xff8fa3);

      const body = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.58, 0),
        bodyMat
      );
      body.scale.set(1.0, 0.82, 1.25);
      body.position.y = 0.58;
      body.castShadow = true;
      group.add(body);

      const head = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.40, 0),
        bodyMat
      );
      head.position.set(0, 0.64, 0.62);
      head.castShadow = true;
      group.add(head);

      const earGeo = new THREE.ConeGeometry(0.13, 0.24, 5);

      const leftEar = new THREE.Mesh(earGeo, accentMat);
      leftEar.position.set(-0.24, 0.94, 0.55);
      leftEar.rotation.z = 0.35;
      leftEar.castShadow = true;
      group.add(leftEar);

      const rightEar = new THREE.Mesh(earGeo, accentMat);
      rightEar.position.set(0.24, 0.94, 0.55);
      rightEar.rotation.z = -0.35;
      rightEar.castShadow = true;
      group.add(rightEar);

      const eyeGeo = new THREE.SphereGeometry(0.055, 6, 4);

      const leftEye = new THREE.Mesh(eyeGeo, darkMat);
      leftEye.position.set(-0.17, 0.70, 0.92);
      group.add(leftEye);

      const rightEye = new THREE.Mesh(eyeGeo, darkMat);
      rightEye.position.set(0.17, 0.70, 0.92);
      group.add(rightEye);

      const nose = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.075, 0),
        pinkMat
      );
      nose.position.set(0, 0.62, 0.98);
      group.add(nose);

      const cheekGeo = new THREE.IcosahedronGeometry(0.14, 0);

      const leftCheek = new THREE.Mesh(cheekGeo, bodyMat);
      leftCheek.position.set(-0.28, 0.58, 0.74);
      group.add(leftCheek);

      const rightCheek = new THREE.Mesh(cheekGeo, bodyMat);
      rightCheek.position.set(0.28, 0.58, 0.74);
      group.add(rightCheek);

      const tail = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.13, 0),
        bodyMat
      );
      tail.position.set(0, 0.48, -0.72);
      tail.castShadow = true;
      group.add(tail);

      const legGeo = new THREE.BoxGeometry(0.14, 0.24, 0.18);
      const legs = [];

      const legPositions = [
        [-0.28, 0.12, 0.45],
        [0.28, 0.12, 0.45],
        [-0.28, 0.12, -0.45],
        [0.28, 0.12, -0.45]
      ];

      for (const p of legPositions) {
        const leg = new THREE.Mesh(legGeo, accentMat);
        leg.position.set(p[0], p[1], p[2]);
        leg.castShadow = true;
        group.add(leg);
        legs.push(leg);
      }

      group.userData = {
        body,
        head,
        leftEar,
        rightEar,
        tail,
        legs,
        leftCheek,
        rightCheek
      };

      return group;
    }

    for (let i = 0; i < 6; i++) {
      const h = createHamster(
        hamsterColors[i % hamsterColors.length],
        accentColors[i % accentColors.length]
      );

      h.position.set(
        (Math.random() - 0.5) * 8,
        0.1,
        (Math.random() - 0.5) * 5
      );

      h.userData.state = "wander";
      h.userData.timer = 1 + Math.random() * 2;
      h.userData.speed = 0.7 + Math.random() * 0.7;
      h.userData.heading = Math.random() * Math.PI * 2;
      h.userData.phase = Math.random() * Math.PI * 2;

      scene.add(h);
      hamsters.push(h);
    }

    function angleLerp(a, b, t) {
      let diff = b - a;

      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;

      return a + diff * Math.min(1, t);
    }

    function applySeparation(h, dt) {
      const pos = h.position;

      for (const other of hamsters) {
        if (other === h) continue;

        const dx = pos.x - other.position.x;
        const dz = pos.z - other.position.z;
        const d = Math.hypot(dx, dz);

        if (d < 1.0 && d > 0.001) {
          const push = (1.0 - d) * 0.8 * dt;
          pos.x += (dx / d) * push;
          pos.z += (dz / d) * push;

          if (h.userData.state === "wander" || h.userData.state === "seekBowl") {
            h.userData.heading = angleLerp(
              h.userData.heading,
              Math.atan2(dx, dz),
              2 * dt
            );
          }
        }
      }
    }

    function updateHamster(h, dt, time) {
      const u = h.userData;
      const pos = h.position;

      u.timer -= dt;

      // Avoid the bowl unless actively seeking/eating.
      if (u.state !== "seekBowl") {
        const dx = pos.x - bowlTarget.x;
        const dz = pos.z - bowlTarget.z;
        const dist = Math.hypot(dx, dz);
        const minDist = u.state === "eat" ? 1.85 : 1.95;

        if (dist < minDist && dist > 0.001) {
          if (u.state !== "eat") {
            u.heading = angleLerp(
              u.heading,
              Math.atan2(dx, dz),
              4 * dt
            );
          }

          if (dist < minDist - 0.08) {
            pos.x += (dx / dist) * 0.5 * dt;
            pos.z += (dz / dist) * 0.5 * dt;
          }
        }
      }

      if (u.state === "wander") {
        const dir = new THREE.Vector3(
          Math.sin(u.heading),
          0,
          Math.cos(u.heading)
        );

        pos.addScaledVector(dir, u.speed * dt);

        if (Math.abs(pos.x) > bounds.x || Math.abs(pos.z) > bounds.z) {
          const toCenter = new THREE.Vector3(-pos.x, 0, -pos.z);
          u.heading = angleLerp(
            u.heading,
            Math.atan2(toCenter.x, toCenter.z),
            8 * dt
          );
        }

        if (u.timer <= 0) {
          const r = Math.random();

          if (r < 0.22) {
            u.state = "pause";
            u.timer = 0.7 + Math.random() * 1.4;
          } else if (r < 0.42) {
            u.heading += (Math.random() - 0.5) * 1.8;
            u.timer = 1 + Math.random() * 2;
          } else if (r < 0.62) {
            u.state = "seekBowl";
            u.timer = 10;
          } else {
            u.timer = 1 + Math.random() * 2;
          }
        }
      } else if (u.state === "pause") {
        u.heading += Math.sin(time * 0.7 + u.phase) * 0.15 * dt;

        if (u.timer <= 0) {
          u.state = "wander";
          u.timer = 1 + Math.random() * 2;
        }
      } else if (u.state === "seekBowl") {
        const to = new THREE.Vector3(
          bowlTarget.x - pos.x,
          0,
          bowlTarget.z - pos.z
        );

        const dist = to.length();

        if (dist > 0.001) {
          u.heading = angleLerp(
            u.heading,
            Math.atan2(to.x, to.z),
            4 * dt
          );

          if (dist > 1.95) {
            to.normalize();
            pos.addScaledVector(to, u.speed * 1.15 * dt);
          } else {
            u.state = "eat";
            u.timer = 2 + Math.random() * 2.5;
          }
        } else {
          u.state = "eat";
          u.timer = 2;
        }

        if (u.timer <= 0) {
          u.state = "wander";
          u.timer = 1 + Math.random() * 2;
        }
      } else if (u.state === "eat") {
        const to = new THREE.Vector3(
          bowlTarget.x - pos.x,
          0,
          bowlTarget.z - pos.z
        );

        if (to.lengthSq() > 0.01) {
          u.heading = angleLerp(
            u.heading,
            Math.atan2(to.x, to.z),
            3 * dt
          );
        }

        if (u.timer <= 0) {
          u.state = "wander";
          u.timer = 1 + Math.random() * 2;
        }
      }

      applySeparation(h, dt);

      pos.x = Math.max(-bounds.x, Math.min(bounds.x, pos.x));
      pos.z = Math.max(-bounds.z, Math.min(bounds.z, pos.z));
      pos.y = 0.1;

      h.rotation.y = angleLerp(h.rotation.y, u.heading, 6 * dt);

      const moving =
        (u.state === "wander" || u.state === "seekBowl") &&
        u.speed > 0.05;

      const walkPhase = time * (6 + u.speed * 4) + u.phase;
      const bob = moving
        ? Math.sin(walkPhase) * 0.045
        : Math.sin(time * 2.2 + u.phase) * 0.012;

      u.body.position.y = 0.58 + bob;
      u.head.position.y = 0.64 + bob * 1.15;
      u.tail.position.y = 0.48 + bob * 0.5;

      const legOffsets = [0, Math.PI, Math.PI, 0];

      for (let i = 0; i < u.legs.length; i++) {
        const leg = u.legs[i];

        if (moving) {
          leg.rotation.x = Math.sin(walkPhase + legOffsets[i]) * 0.75;
        } else {
          leg.rotation.x = Math.sin(time * 2.5 + u.phase + i) * 0.06;
        }
      }

      u.leftEar.rotation.z =
        0.35 + Math.sin(time * 3.1 + u.phase) * 0.14;

      u.rightEar.rotation.z =
        -0.35 - Math.sin(time * 3.1 + u.phase + 0.7) * 0.14;

      u.tail.rotation.y = Math.sin(time * 4.2 + u.phase) * 0.25;

      if (u.state === "eat") {
        u.head.position.y += Math.sin(time * 11 + u.phase) * 0.05;
        u.head.rotation.x = Math.sin(time * 11 + u.phase) * 0.18;

        u.leftCheek.scale.setScalar(
          1 + Math.sin(time * 8 + u.phase) * 0.08
        );

        u.rightCheek.scale.setScalar(
          1 + Math.sin(time * 8 + u.phase + 0.4) * 0.08
        );
      } else {
        u.head.rotation.x = Math.sin(time * 1.5 + u.phase) * 0.04;
        u.leftCheek.scale.setScalar(1);
        u.rightCheek.scale.setScalar(1);
      }
    }

    // Click the bowl to call hamsters.
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDown = null;

    renderer.domElement.addEventListener("pointerdown", (e) => {
      pointerDown = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener("pointerup", (e) => {
      if (!pointerDown) return;

      const moved = Math.hypot(
        e.clientX - pointerDown.x,
        e.clientY - pointerDown.y
      );

      pointerDown = null;

      if (moved > 6) return;

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObjects(bowlGroup.children, true);

      if (hits.length > 0) {
        for (const h of hamsters) {
          h.userData.state = "seekBowl";
          h.userData.timer = 10;
        }

        bowlGroup.userData.pulse = 1;
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const time = clock.elapsedTime;

      for (const h of hamsters) {
        updateHamster(h, dt, time);
      }

      if (bowlGroup.userData.pulse > 0) {
        bowlGroup.userData.pulse = Math.max(
          0,
          bowlGroup.userData.pulse - dt * 2
        );

        const s = 1 + bowlGroup.userData.pulse * 0.18;
        bowlGroup.scale.setScalar(s);
      } else if (bowlGroup.scale.x !== 1) {
        bowlGroup.scale.setScalar(1);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
