<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Аквариум</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #001a33; }
  canvas { display: block; }

  .panel {
    position: absolute;
    background: rgba(10, 30, 60, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(100, 200, 255, 0.25);
    border-radius: 14px;
    padding: 16px 18px;
    color: #cfeaff;
    box-shadow: 0 8px 32px rgba(0, 40, 90, 0.5), inset 0 0 20px rgba(80, 180, 255, 0.06);
    z-index: 10;
    user-select: none;
  }

  #infoPanel { top: 20px; left: 20px; max-width: 280px; }
  #infoPanel h1 {
    font-size: 22px;
    background: linear-gradient(90deg, #4dd0ff, #7bffb0, #ffd76e);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  #infoPanel p { font-size: 12.5px; line-height: 1.65; opacity: 0.85; margin-bottom: 12px; }
  #infoPanel .hint { color: #7fdfff; }

  #statsPanel { top: 20px; right: 20px; min-width: 160px; text-align: center; }
  #statsPanel .stat { font-size: 26px; font-weight: bold; color: #6ee7ff; text-shadow: 0 0 12px rgba(110, 231, 255, 0.6); }
  #statsPanel .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.7; margin-bottom: 4px; }
  #statsPanel .divider { height: 1px; background: rgba(100,200,255,0.25); margin: 10px 0; }

  .btn-row { display: flex; flex-direction: column; gap: 8px; }
  button {
    padding: 9px 14px;
    border: 1px solid rgba(120, 220, 255, 0.4);
    border-radius: 9px;
    background: linear-gradient(135deg, rgba(30, 90, 160, 0.7), rgba(20, 50, 110, 0.7));
    color: #dff4ff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 3px 10px rgba(0, 30, 70, 0.4);
  }
  button:hover {
    background: linear-gradient(135deg, rgba(60, 150, 230, 0.85), rgba(40, 90, 180, 0.85));
    box-shadow: 0 4px 18px rgba(80, 180, 255, 0.45);
    transform: translateY(-1px);
  }
  button:active { transform: translateY(1px); }

  @media (max-width: 640px) {
    #infoPanel { max-width: 200px; padding: 12px; }
    #infoPanel p { display: none; }
  }
</style>
</head>
<body>

<div class="panel" id="infoPanel">
  <h1>🐠 3D Аквариум</h1>
  <p>
    <span class="hint">🖱 ЛКМ + движение</span> — вращение<br>
    <span class="hint">🖱 ПКМ + движение</span> — панорама<br>
    <span class="hint">🖱 Колесо</span> — зум<br>
    <span class="hint">✋ Клик по воде</span> — покормить!
  </p>
  <div class="btn-row">
    <button id="btnFish">+ Добавить рыбку</button>
    <button id="btnBubbles">+ Больше пузырей</button>
    <button id="btnLight">💡 Свет: ВКЛ</button>
  </div>
</div>

<div class="panel" id="statsPanel">
  <div class="label">Рыбки</div>
  <div class="stat" id="fishCount">0</div>
  <div class="divider"></div>
  <div class="label">FPS</div>
  <div class="stat" id="fpsCounter">0</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
// БАЗОВАЯ СЦЕНА
// ============================================================
const TANK = { w: 36, h: 24, d: 20 }; // ширина, высота, глубина
const MARGIN = 1.5;                    // отступ рыбок от стенок

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a2a4a, 0.012);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 14, 42);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 10, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 1.8;

// Градиентный фон
(function makeGradient() {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, '#0d3b66');
  grad.addColorStop(1, '#02101f');
  g.fillStyle = grad;
  g.fillRect(0, 0, 2, 512);
  const tex = new THREE.CanvasTexture(c);
  scene.background = tex;
})();

// ============================================================
// ОСВЕЩЕНИЕ
// ============================================================
scene.add(new THREE.AmbientLight(0x404040, 0.4));

const sunLight = new THREE.DirectionalLight(0xbfe8ff, 1.1);
sunLight.position.set(15, 35, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -30;
sunLight.shadow.camera.right = 30;
sunLight.shadow.camera.top = 30;
sunLight.shadow.camera.bottom = -30;
scene.add(sunLight);

const underwater1 = new THREE.PointLight(0x33ccff, 0.6, 60);
underwater1.position.set(-12, 18, 5);
scene.add(underwater1);

const underwater2 = new THREE.PointLight(0x2266ff, 0.5, 60);
underwater2.position.set(12, 6, -5);
scene.add(underwater2);

let lightOn = true;

// ============================================================
// АКВАРИУМ: СТЕКЛО + РАМКА
// ============================================================
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xaaddff,
  transmission: 0.95,
  roughness: 0.05,
  metalness: 0,
  transparent: true,
  opacity: 0.15,
  side: THREE.DoubleSide,
  depthWrite: false
});

const tankGeo = new THREE.BoxGeometry(TANK.w, TANK.h, TANK.d);
const tank = new THREE.Mesh(tankGeo, glassMat);
tank.position.y = TANK.h / 2;
tank.renderOrder = 10;
scene.add(tank);

const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(tankGeo),
  new THREE.LineBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.5 })
);
edges.position.copy(tank.position);
scene.add(edges);

// ============================================================
// ПЕСЧАНОЕ ДНО
// ============================================================
(function makeSand() {
  const geo = new THREE.PlaneGeometry(TANK.w - 1, TANK.d - 1, 40, 40);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setZ(i, Math.random() * 0.35 + Math.sin(pos.getX(i) * 0.8) * 0.15);
  }
  geo.computeVertexNormals();
  const sand = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: 0xd9c08a, roughness: 0.95
  }));
  sand.rotation.x = -Math.PI / 2;
  sand.position.y = 0.2;
  sand.receiveShadow = true;
  scene.add(sand);
})();

// ============================================================
// КАМНИ
// ============================================================
for (let i = 0; i < 8; i++) {
  const size = 0.8 + Math.random() * 1.6;
  const geo = new THREE.DodecahedronGeometry(size, 0);
  const pos = geo.attributes.position;
  for (let v = 0; v < pos.count; v++) {
    pos.setXYZ(v,
      pos.getX(v) * (0.8 + Math.random() * 0.4),
      pos.getY(v) * (0.8 + Math.random() * 0.4),
      pos.getZ(v) * (0.8 + Math.random() * 0.4));
  }
  geo.computeVertexNormals();
  const rock = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 0.15, 0.25 + Math.random() * 0.15),
    roughness: 0.9
  }));
  rock.position.set(
    (Math.random() - 0.5) * (TANK.w - 8),
    0.4 + size * 0.4,
    (Math.random() - 0.5) * (TANK.d - 6)
  );
  rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
}

// ============================================================
// ВОДОРОСЛИ
// ============================================================
const algaeList = [];
for (let i = 0; i < 12; i++) {
  const height = 3 + Math.random() * 4;
  const baseX = (Math.random() - 0.5) * (TANK.w - 6);
  const baseZ = (Math.random() - 0.5) * (TANK.d - 6);
  const points = [];
  for (let s = 0; s <= 5; s++) {
    const t = s / 5;
    points.push(new THREE.Vector3(
      baseX + Math.sin(t * 3 + i) * 0.5 * t,
      0.5 + height * t,
      baseZ + Math.cos(t * 2.5 + i) * 0.5 * t
    ));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 12, 0.18 * (1 - 0) , 6, false),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.32 + Math.random() * 0.1, 0.7, 0.3 + Math.random() * 0.15),
      roughness: 0.8
    })
  );
  tube.castShadow = true;
  const pivot = new THREE.Group();
  pivot.position.set(baseX, 0.3, baseZ);
  tube.position.sub(pivot.position);
  pivot.add(tube);
  scene.add(pivot);
  algaeList.push({ pivot, phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 0.8 });
}

// ============================================================
// ПУЗЫРИ
// ============================================================
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transmission: 0.9,
  transparent: true,
  opacity: 0.35,
  roughness: 0,
  metalness: 0,
  clearcoat: 1
});
const bubbleGeo = new THREE.SphereGeometry(0.15, 8, 8);
const bubbles = [];

function spawnBubble(x, z) {
  const b = new THREE.Mesh(bubbleGeo, bubbleMat);
  const scale = 0.5 + Math.random() * 1.2;
  b.scale.setScalar(scale);
  b.position.set(
    x !== undefined ? x : (Math.random() - 0.5) * (TANK.w - 4),
    0.5 + Math.random() * 2,
    z !== undefined ? z : (Math.random() - 0.5) * (TANK.d - 4)
  );
  scene.add(b);
  bubbles.push({
    mesh: b,
    speed: 1.5 + Math.random() * 2.5,
    phase: Math.random() * Math.PI * 2,
    amp: 0.3 + Math.random() * 0.5
  });
}
for (let i = 0; i < 30; i++) spawnBubble();

// ============================================================
// РЫБКИ
// ============================================================
const COLOR_SCHEMES = [
  { body: 0xff8c1a, fin: 0xffb366 },   // оранжевая
  { body: 0x2277ff, fin: 0x66aaff },   // синяя
  { body: 0xffdd00, fin: 0xff4422 },   // жёлто-красная
  { body: 0xaa44ff, fin: 0xdd99ff },   // фиолетовая
  { body: 0xee2233, fin: 0xff7788 },   // красная
  { body: 0x22bb66, fin: 0x77eeaa },   // зелёная
  { body: 0xff77aa, fin: 0xffb3cc },   // розовая
  { body: 0xffcc33, fin: 0xffee99 }    // золотая
];

const fishArray = [];
const FISH_BOUNDS = {
  minX: -TANK.w / 2 + MARGIN, maxX: TANK.w / 2 - MARGIN,
  minY: 1.5,                   maxY: TANK.h - MARGIN,
  minZ: -TANK.d / 2 + MARGIN, maxZ: TANK.d / 2 - MARGIN
};

function createFish(x, y, z) {
  const scheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];
  const group = new THREE.Group();

  // Тело
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.6, 16, 12),
    new THREE.MeshStandardMaterial({ color: scheme.body, roughness: 0.4, metalness: 0.15 })
  );
  body.scale.set(1.9, 1, 1.1);
  body.castShadow = true;
  group.add(body);

  // Глаза
  const eyeWhiteGeo = new THREE.SphereGeometry(0.14, 8, 8);
  const pupilGeo = new THREE.SphereGeometry(0.07, 8, 8);
  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  [-1, 1].forEach(side => {
    const ew = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
    ew.position.set(0.75, 0.15, side * 0.35);
    group.add(ew);
    const pp = new THREE.Mesh(pupilGeo, pupilMat);
    pp.position.set(0.86, 0.15, side * 0.42);
    group.add(pp);
  });

  // Хвост
  const tail = new THREE.Mesh(
    new THREE.ConeGeometry(0.45, 0.9, 4),
    new THREE.MeshStandardMaterial({ color: scheme.fin, roughness: 0.5, side: THREE.DoubleSide })
  );
  tail.geometry.translate(0, -0.45, 0);
  tail.rotation.x = Math.PI / 2;
  tail.rotation.z = Math.PI / 2;
  tail.position.set(-1.15, 0, 0);
  group.add(tail);

  // Верхний плавник
  const topFin = new THREE.Mesh(
    new THREE.ConeGeometry(0.35, 0.6, 3),
    new THREE.MeshStandardMaterial({ color: scheme.fin, roughness: 0.5, side: THREE.DoubleSide })
  );
  topFin.position.set(0, 0.55, 0);
  topFin.rotation.z = -0.4;
  group.add(topFin);

  // Боковые плавники
  const finGeo = new THREE.ConeGeometry(0.3, 0.55, 3);
  const finMat = new THREE.MeshStandardMaterial({ color: scheme.fin, roughness: 0.5, side: THREE.DoubleSide });
  const leftFin = new THREE.Mesh(finGeo, finMat);
  leftFin.position.set(0.1, -0.1, 0.55);
  leftFin.rotation.x = Math.PI / 2 - 0.5;
  group.add(leftFin);
  const rightFin = new THREE.Mesh(finGeo, finMat);
  rightFin.position.set(0.1, -0.1, -0.55);
  rightFin.rotation.x = -(Math.PI / 2 - 0.5);
  group.add(rightFin);

  const scale = 0.6 + Math.random() * 0.6;
  group.scale.setScalar(scale);

  if (x === undefined) {
    group.position.set(
      (Math.random() - 0.5) * (TANK.w - 8),
      3 + Math.random() * (TANK.h - 8),
      (Math.random() - 0.5) * (TANK.d - 8)
    );
  } else {
    group.position.set(x, y, z);
  }

  const dir = new THREE.Vector3(Math.random() - 0.5, (Math.random() - 0.5) * 0.3, Math.random() - 0.5).normalize();
  scene.add(group);

  return {
    mesh: group,
    tail, leftFin, rightFin, topFin,
    velocity: dir.multiplyScalar(2),
    speed: 2.5 + Math.random() * 2.5,
    tailSpeed: 6 + Math.random() * 4,
    phase: Math.random() * Math.PI * 2,
    targetFood: null,
    avoidanceRadius: 2.5 + Math.random() * 1.5,
    wanderTimer: Math.random() * 3
  };
}

for (let i = 0; i < 15; i++) fishArray.push(createFish());

// ============================================================
// СИСТЕМА КОРМЛЕНИЯ
// ============================================================
const foods = [];
const foodGeo = new THREE.SphereGeometry(0.22, 8, 8);
const foodMat = new THREE.MeshStandardMaterial({ color: 0xff6644, emissive: 0x331100 });

function spawnFood(point) {
  // Ограничиваем точку внутри аквариума
  point.x = THREE.MathUtils.clamp(point.x, FISH_BOUNDS.minX, FISH_BOUNDS.maxX);
  point.y = THREE.MathUtils.clamp(point.y, 1, TANK.h - 1);
  point.z = THREE.MathUtils.clamp(point.z, FISH_BOUNDS.minZ, FISH_BOUNDS.maxZ);
  const f = new THREE.Mesh(foodGeo, foodMat);
  f.position.copy(point);
  f.castShadow = true;
  scene.add(f);
  foods.push({ mesh: f, velocity: new THREE.Vector3(0, 0, 0) });
  // Пузырьки от броска
  for (let i = 0; i < 3; i++) spawnFoodBubble(point);
}
function spawnFoodBubble(p) {
  spawnBubble(p.x + (Math.random() - 0.5) * 0.5, p.z + (Math.random() - 0.5) * 0.5);
}

// Клик -> корм
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
let downPos = null;

renderer.domElement.addEventListener('pointerdown', e => {
  downPos = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPos || e.button !== 0) return;
  const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
  downPos = null;
  if (dx * dx + dy * dy > 25) return; // это было вращение камеры

  mouseNDC.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObject(tank);
  if (hits.length > 0) {
    // Ставим корм чуть внутрь от точки попадания
    const p = hits[0].point.clone();
    const inward = p.clone().sub(new THREE.Vector3(0, TANK.h / 2, 0)).multiplyScalar(-0.15);
    spawnFood(p.add(inward));
  }
});

// ============================================================
// UI
// ============================================================
document.getElementById('btnFish').onclick = () => {
  fishArray.push(createFish());
  updateStats();
};
document.getElementById('btnBubbles').onclick = () => {
  for (let i = 0; i < 10; i++) spawnBubble();
};
document.getElementById('btnLight').onclick = function () {
  lightOn = !lightOn;
  sunLight.intensity = lightOn ? 1.1 : 0.1;
  this.textContent = lightOn ? '💡 Свет: ВКЛ' : '💡 Свет: ВЫКЛ';
};

const fishCountEl = document.getElementById('fishCount');
const fpsEl = document.getElementById('fpsCounter');
function updateStats() { fishCountEl.textContent = fishArray.length; }
updateStats();

// ============================================================
// АНИМАЦИЯ
// ============================================================
const clock = new THREE.Clock();
let frames = 0, fpsTime = 0;
const tmpVec = new THREE.Vector3();
const lookTarget = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // --- FPS ---
  frames++;
  fpsTime += dt;
  if (fpsTime >= 1) {
    fpsEl.textContent = frames;
    frames = 0; fpsTime = 0;
  }

  // --- Рыбки ---
  for (let i = 0; i < fishArray.length; i++) {
    const fish = fishArray[i];
    const p = fish.mesh.position;

    // Избегание других рыбок
    for (let j = 0; j < fishArray.length; j++) {
      if (i === j) continue;
      tmpVec.subVectors(p, fishArray[j].mesh.position);
      const dist = tmpVec.length();
      const r = fish.avoidanceRadius;
      if (dist < r && dist > 0.001) {
        tmpVec.normalize().multiplyScalar((r - dist) / r * 8 * dt);
        fish.velocity.add(tmpVec);
      }
    }

    // Поиск корма
    if (fish.targetFood) {
      if (!fish.targetFood.mesh.parent) fish.targetFood = null;
      else {
        tmpVec.subVectors(fish.targetFood.mesh.position, p).normalize();
        fish.velocity.lerp(tmpVec.multiplyScalar(fish.speed * 1.6), 3 * dt);
        // Съедание
        if (fish.targetFood.mesh.position.distanceTo(p) < 1.2) {
          scene.remove(fish.targetFood.mesh);
          const idx = foods.indexOf(fish.targetFood);
          if (idx > -1) foods.splice(idx, 1);
          // Все остальные, целившиеся на этот корм — сбрасываем
          fishArray.forEach(f => { if (f.targetFood === fish.targetFood) f.targetFood = null; });
          fish.targetFood = null;
          // Рост на 5%
          const ns = fish.mesh.scale.x * 1.05;
          fish.mesh.scale.setScalar(Math.min(ns, 2.2));
        }
      }
    } else {
      // Случайное блуждание
      fish.wanderTimer -= dt;
      if (fish.wanderTimer <= 0) {
        fish.wanderTimer = 2 + Math.random() * 4;
        fish.velocity.x += (Math.random() - 0.5) * 2;
        fish.velocity.y += (Math.random() - 0.5) * 0.8;
        fish.velocity.z += (Math.random() - 0.5) * 2;
      }
      // Нормализация скорости
      const sp = fish.velocity.length();
      if (sp > 0.001) fish.velocity.multiplyScalar(THREE.MathUtils.lerp(sp, fish.speed, 1.5 * dt) / sp);
    }

    // Проверка ближайшего корма (если не заняты)
    if (!fish.targetFood) {
      let best = null, bestD = 15;
      for (const f of foods) {
        const d = f.mesh.position.distanceTo(p);
        if (d < bestD) { bestD = d; best = f; }
      }
      fish.targetFood = best;
    }

    // Отражение от стен
    const push = 6 * dt;
    if (p.x < FISH_BOUNDS.minX) fish.velocity.x += push;
    if (p.x > FISH_BOUNDS.maxX) fish.velocity.x -= push;
    if (p.y < FISH_BOUNDS.minY) fish.velocity.y += push;
    if (p.y > FISH_BOUNDS.maxY) fish.velocity.y -= push;
    if (p.z < FISH_BOUNDS.minZ) fish.velocity.z += push;
    if (p.z > FISH_BOUNDS.maxZ) fish.velocity.z -= push;

    p.addScaledVector(fish.velocity, dt);

    // Поворот в направлении движения
    if (fish.velocity.lengthSq() > 0.01) {
      lookTarget.copy(p).add(fish.velocity);
      fish.mesh.lookAt(lookTarget);
    }

    // Анимация хвоста и плавников
    fish.phase += fish.tailSpeed * dt;
    fish.tail.rotation.y = Math.sin(fish.phase) * 0.6;
    fish.leftFin.rotation.z = Math.sin(fish.phase * 0.7) * 0.35;
    fish.rightFin.rotation.z = -Math.sin(fish.phase * 0.7 + 0.5) * 0.35;
    fish.topFin.rotation.z = -0.4 + Math.sin(fish.phase * 0.5) * 0.15;
  }

  // --- Корм ---
  for (let i = foods.length - 1; i >= 0; i--) {
    const f = foods[i];
    f.velocity.y -= 6 * dt;         // гравитация
    f.velocity.multiplyScalar(0.98); // сопротивление воды
    f.mesh.position.addScaledVector(f.velocity, dt);
    f.mesh.position.y += Math.sin(t * 3 + i) * 0.002;
    if (f.mesh.position.y < 0.5) {   // упал на дно
      scene.remove(f.mesh);
      fishArray.forEach(fi => { if (fi.targetFood === f) fi.targetFood = null; });
      foods.splice(i, 1);
    }
  }

  // --- Пузыри ---
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.mesh.position.y += b.speed * dt;
    b.mesh.position.x += Math.sin(t * 2 + b.phase) * b.amp * dt;
    b.mesh.position.z += Math.cos(t * 1.7 + b.phase) * b.amp * dt;
    if (b.mesh.position.y > TANK.h - 0.5) {
      b.mesh.position.y = 0.5;
      b.mesh.position.x = (Math.random() - 0.5) * (TANK.w - 4);
      b.mesh.position.z = (Math.random() - 0.5) * (TANK.d - 4);
    }
  }

  // --- Водоросли ---
  for (const a of algaeList) {
    a.pivot.rotation.x = Math.sin(t * a.speed + a.phase) * 0.08;
    a.pivot.rotation.z = Math.cos(t * a.speed * 0.8 + a.phase) * 0.08;
  }

  // --- Пульсация подводных огней ---
  underwater1.intensity = 0.5 + Math.sin(t * 0.8) * 0.15;
  underwater2.intensity = 0.4 + Math.cos(t * 0.6) * 0.12;

  controls.update();
  renderer.render(scene, camera);
}
animate();

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
