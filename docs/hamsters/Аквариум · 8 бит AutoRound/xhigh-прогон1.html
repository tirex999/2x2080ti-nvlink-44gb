<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Аквариум — интерактивный подводный мир</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eaf6ff; --dim:#8fb9dd; --line:rgba(125,211,252,.22);
    --glass:linear-gradient(160deg, rgba(10,32,60,.72), rgba(5,16,34,.55));
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Golos Text',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#175e93,#041226);
  }
  #app{position:fixed;inset:0}
  #app canvas{display:block;cursor:crosshair}

  /* ---- атмосферные оверлеи ---- */
  .glow-top{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:linear-gradient(180deg,rgba(140,210,255,.10),transparent 26%)}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(2,10,25,.55) 100%)}

  /* ---- стеклянные панели ---- */
  .panel{
    position:fixed;z-index:10;background:var(--glass);
    backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);
    border:1px solid var(--line);border-radius:18px;
    box-shadow:0 12px 40px rgba(0,10,30,.45), inset 0 1px 0 rgba(255,255,255,.08);
    animation:rise .7s cubic-bezier(.22,1,.36,1) backwards;
  }
  @keyframes rise{from{opacity:0;transform:translateY(-14px)}}

  .panel--info{top:18px;left:18px;width:262px;padding:18px 18px 16px}
  .panel--stats{top:18px;right:18px;padding:14px 18px 16px;animation-delay:.15s}

  h1{
    font-family:'Unbounded',sans-serif;font-weight:900;
    font-size:clamp(19px,2.2vw,25px);letter-spacing:.01em;line-height:1.1;
    background:linear-gradient(92deg,#7dd3fc 10%,#5eead4 55%,#fbbf24 110%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .logo{display:inline-block;-webkit-text-fill-color:initial;
    animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-4px) rotate(8deg)}}
  .sub{margin-top:5px;font-size:11.5px;color:var(--dim);letter-spacing:.04em}

  .help{list-style:none;margin:14px 0 14px;display:grid;gap:7px}
  .help li{display:flex;align-items:center;gap:8px;font-size:12px;color:#c4e2f7}
  .help b{
    flex:0 0 auto;font-weight:600;font-size:10.5px;color:#bfe3ff;
    background:rgba(125,211,252,.13);border:1px solid rgba(125,211,252,.28);
    padding:2px 8px;border-radius:6px;white-space:nowrap;
  }

  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    font-family:'Golos Text';font-weight:600;font-size:12.5px;letter-spacing:.02em;
    color:#f2fbff;padding:9px 13px;border-radius:11px;cursor:pointer;position:relative;overflow:hidden;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 4px 14px rgba(0,15,35,.4), inset 0 1px 0 rgba(255,255,255,.18);
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s,filter .18s;
  }
  .btn::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
    transform:skewX(-20deg);transition:left .5s ease}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.1);
    box-shadow:0 9px 24px rgba(0,15,35,.55), inset 0 1px 0 rgba(255,255,255,.25)}
  .btn:hover::after{left:130%}
  .btn:active{transform:translateY(0) scale(.95)}
  .btn:focus-visible{outline:2px solid #7dd3fc;outline-offset:2px}
  .btn--teal{background:linear-gradient(135deg,#0f766e,#0891b2)}
  .btn--sky {background:linear-gradient(135deg,#1d4ed8,#0284c7)}
  .btn--amber{background:linear-gradient(135deg,#b45309,#d97706);color:#fff7e6}
  .btn.off{filter:grayscale(.65) brightness(.72)}

  /* ---- статистика ---- */
  .stats-title{font-family:'Unbounded';font-size:9.5px;font-weight:700;
    letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(72px,1fr));gap:12px 22px}
  .stat__num{display:block;font-family:'Unbounded';font-weight:700;font-size:23px;color:#e8f6ff;
    font-variant-numeric:tabular-nums}
  .stat__label{display:block;margin-top:2px;font-size:9.5px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

  /* ---- подсказка и тост ---- */
  .hint{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:10;
    font-size:13px;font-weight:500;color:#dff2ff;padding:10px 20px;border-radius:999px;
    background:rgba(6,20,40,.62);border:1px solid var(--line);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    animation:pulse 2.4s ease-in-out infinite;transition:opacity .6s,transform .6s;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(125,211,252,.28)}50%{box-shadow:0 0 0 12px rgba(125,211,252,0)}}
  .hint.hide{opacity:0;transform:translate(-50%,12px);pointer-events:none}
  #toast{
    position:fixed;left:50%;bottom:78px;transform:translate(-50%,8px);z-index:11;
    font-size:12.5px;font-weight:600;color:#eaf6ff;padding:9px 18px;border-radius:10px;
    background:rgba(8,26,50,.85);border:1px solid rgba(125,211,252,.35);
    box-shadow:0 8px 30px rgba(0,10,30,.5);opacity:0;pointer-events:none;
    transition:opacity .3s,transform .3s;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:680px){
    .panel--info{width:210px;padding:14px}
    .help{display:none}
    .panel--stats{padding:10px 14px}
    .stat__num{font-size:18px}
    .stats{gap:8px 16px}
    .hint{font-size:12px;bottom:16px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="glow-top"></div>
<div class="vignette"></div>

<header class="panel panel--info">
  <h1><span class="logo">🐠</span> 3D Аквариум</h1>
  <p class="sub">Интерактивный подводный мир · Three.js</p>
  <ul class="help">
    <li><b>ЛКМ · тянуть</b> вращение камеры</li>
    <li><b>ПКМ · тянуть</b> панорама</li>
    <li><b>Колесо</b> приближение</li>
    <li><b>Клик по воде</b> бросить корм</li>
  </ul>
  <div class="btns">
    <button id="btnFish"    class="btn btn--teal">＋ Рыбка</button>
    <button id="btnBubbles" class="btn btn--sky">＋ Пузыри</button>
    <button id="btnLight"   class="btn btn--amber">☀ Свет</button>
  </div>
</header>

<aside class="panel panel--stats">
  <div class="stats-title">Живая метрика</div>
  <div class="stats">
    <div class="stat"><span class="stat__num" id="statFish">0</span><span class="stat__label">Рыбок</span></div>
    <div class="stat"><span class="stat__num" id="statBub">0</span><span class="stat__label">Пузырей</span></div>
    <div class="stat"><span class="stat__num" id="statFood">0</span><span class="stat__label">Корма</span></div>
    <div class="stat"><span class="stat__num" id="statFps">—</span><span class="stat__label">FPS</span></div>
  </div>
</aside>

<div id="hint" class="hint">🍤 Кликните по воде, чтобы бросить корм</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============================== БАЗА ============================== */
const TANK   = { w:36, h:24, d:20 };
const BOUNDS = { minX:-16.5, maxX:16.5, minZ:-8.5, maxZ:8.5, minY:1.4, maxY:21.5 };
const rand   = (a,b)=>a+Math.random()*(b-a);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.outputEncoding    = THREE.sRGBEncoding;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b3050, 0.012);

function gradientTexture(top,bottom){
  const c=document.createElement('canvas'); c.width=2; c.height=512;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,top); gr.addColorStop(1,bottom);
  g.fillStyle=gr; g.fillRect(0,0,2,512);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
}
scene.background = gradientTexture('#1a6398','#03101f');

(function env(){                       // IBL-окружение для бликов
  const c=document.createElement('canvas'); c.width=256; c.height=128;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,128);
  gr.addColorStop(0,'#cdeeff'); gr.addColorStop(.45,'#3f8fc4'); gr.addColorStop(1,'#062038');
  g.fillStyle=gr; g.fillRect(0,0,256,128);
  g.globalAlpha=.5; g.fillStyle='#eaffff';
  for(let i=0;i<5;i++){ g.beginPath(); g.ellipse(30+i*48,18,26,7,.3,0,Math.PI*2); g.fill(); }
  const t=new THREE.CanvasTexture(c);
  t.encoding=THREE.sRGBEncoding; t.mapping=THREE.EquirectangularReflectionMapping;
  scene.environment=t;
})();

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 300);
camera.position.set(24, 20, 34);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 11, 0);
controls.enableDamping = true;  controls.dampingFactor = .06;
controls.minDistance = 10;      controls.maxDistance   = 60;
controls.maxPolarAngle = Math.PI/1.8;

/* ============================== СВЕТ ============================== */
const ambient = new THREE.AmbientLight(0x404040, .4);
const sun = new THREE.DirectionalLight(0xcfe8ff, 1.15);
sun.position.set(16, 38, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-28; sun.shadow.camera.right=28;
sun.shadow.camera.top=28;   sun.shadow.camera.bottom=-28;
sun.shadow.camera.near=2;   sun.shadow.camera.far=90;
sun.shadow.bias=-.0004;
const pl1 = new THREE.PointLight(0x38bdf8, 1.0, 70, 1); pl1.position.set(-12,18,6);
const pl2 = new THREE.PointLight(0x2563eb, 1.0, 70, 1); pl2.position.set(12,14,-6);
scene.add(ambient, sun, pl1, pl2);

/* ============================== АКВАРИУМ ============================== */
const tank = new THREE.Group(); scene.add(tank);

const glassGeo = new THREE.BoxGeometry(TANK.w, TANK.h, TANK.d);
const glassMat = new THREE.MeshPhysicalMaterial({
  color:0xbfe6ff, metalness:0, roughness:.06,
  transmission:.95, thickness:1.2, ior:1.33,
  transparent:true, opacity:.18, depthWrite:false, envMapIntensity:1.2
});
const glass = new THREE.Mesh(glassGeo, glassMat);
glass.position.y = TANK.h/2;
tank.add(glass);

const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(glassGeo),
  new THREE.LineBasicMaterial({color:0x9fdcff, transparent:true, opacity:.55})
);
edges.position.y = TANK.h/2;
tank.add(edges);

const plinth = new THREE.Mesh(
  new THREE.BoxGeometry(TANK.w+1.6, 1.4, TANK.d+1.6),
  new THREE.MeshStandardMaterial({color:0x0d1b2e, metalness:.5, roughness:.4})
);
plinth.position.y=-.7; plinth.castShadow=plinth.receiveShadow=true;
scene.add(plinth);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(240,240),
  new THREE.MeshStandardMaterial({color:0x051325, roughness:1})
);
floor.rotation.x=-Math.PI/2; floor.position.y=-1.45; floor.receiveShadow=true;
scene.add(floor);

/* --- песчаное дно с процедурными неровностями --- */
const sandGeo = new THREE.PlaneGeometry(TANK.w-.4, TANK.d-.4, 48, 32);
sandGeo.rotateX(-Math.PI/2);
{
  const p=sandGeo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), z=p.getZ(i);
    p.setY(i,(Math.sin(x*.55)*Math.cos(z*.7)+Math.sin((x+z)*.33)+Math.cos(x*1.7+z*1.3)*.3)*.22);
  }
  sandGeo.computeVertexNormals();
}
const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({color:0xd9b98c, roughness:1}));
sand.position.y=.25; sand.receiveShadow=true;
tank.add(sand);

/* --- камни: деформированные додекаэдры --- */
const rockColors=[0x6b7280,0x57534e,0x78716c,0x4b5563,0x7c6f64];
for(let i=0;i<8;i++){
  const g=new THREE.DodecahedronGeometry(1,0);
  const p=g.attributes.position, seed=Math.random()*10;
  for(let v=0;v<p.count;v++){
    const x=p.getX(v), y=p.getY(v), z=p.getZ(v);
    const f=1+.3*Math.sin(x*3.7+y*2.1+seed)+.22*Math.cos(z*4.3+x*1.9+seed)+.18*Math.sin(y*5.1+z*2.7);
    p.setXYZ(v,x*f,y*f,z*f);
  }
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({
    color:rockColors[i%rockColors.length], roughness:.95, flatShading:true}));
  const s=rand(.8,2.4);
  m.scale.set(s, s*rand(.6,1.1), s);
  m.position.set(rand(-14,14), .3+m.scale.y*.35, rand(-7,7));
  m.rotation.set(rand(0,Math.PI),rand(0,Math.PI),rand(0,Math.PI));
  m.castShadow=m.receiveShadow=true;
  tank.add(m);
}

/* --- водоросли: TubeGeometry по CatmullRomCurve3 --- */
const weedColors=[0x1f8a5b,0x2ea86b,0x157a6e,0x3ecf8e,0x1a9e77];
const weedClusters=[];
for(let i=0;i<12;i++){
  const cluster=new THREE.Group();
  cluster.position.set(rand(-15,15), .4, rand(-8,8));
  const blades=3+Math.floor(Math.random()*3);
  for(let b=0;b<blades;b++){
    const h=rand(2.5,7), ox=rand(-.5,.5), oz=rand(-.5,.5);
    const bx=rand(-.8,.8), bz=rand(-.8,.8), pts=[];
    for(let s=0;s<=4;s++){
      const tt=s/4;
      pts.push(new THREE.Vector3(ox+Math.sin(tt*2.2+bx)*bx*tt*1.2, h*tt, oz+Math.sin(tt*1.7+bz)*bz*tt*1.2));
    }
    const tube=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 10,
      rand(.1,.22), 5, false);
    const blade=new THREE.Mesh(tube,new THREE.MeshStandardMaterial({
      color:weedColors[Math.floor(Math.random()*weedColors.length)],
      roughness:.8, side:THREE.DoubleSide}));
    blade.castShadow=true;
    cluster.add(blade);
  }
  tank.add(cluster);
  weedClusters.push({group:cluster, phase:rand(0,Math.PI*2), sp:rand(.6,1.4)});
}

/* --- живая поверхность воды --- */
const surfGeo=new THREE.PlaneGeometry(TANK.w-.6, TANK.d-.6, 30, 20);
surfGeo.rotateX(-Math.PI/2);
const surf=new THREE.Mesh(surfGeo,new THREE.MeshPhongMaterial({
  color:0x8fd4ff, transparent:true, opacity:.16, shininess:120,
  side:THREE.DoubleSide, depthWrite:false}));
surf.position.y=TANK.h-.5;
tank.add(surf);

/* --- лучи света в толще воды --- */
const rays=[];
const rayGeo=new THREE.PlaneGeometry(1.8,26);
for(let i=0;i<6;i++){
  const m=new THREE.Mesh(rayGeo,new THREE.MeshBasicMaterial({
    color:0x9fdcff, transparent:true, opacity:.06,
    blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
  m.position.set(rand(-12,12), TANK.h-12, rand(-6,6));
  m.rotation.set(0, rand(0,Math.PI), rand(-.2,.2));
  scene.add(m); rays.push(m);
}

/* ============================== РЫБКИ ============================== */
const SCHEMES=[
  {body:0xff8c1a, fin:0xffb25e},  // оранжевая
  {body:0x2f7bff, fin:0x7db4ff},  // синяя
  {body:0xffd23f, fin:0xff5a3c},  // жёлто-красная
  {body:0x9b5cff, fin:0xc9a2ff},  // фиолетовая
  {body:0xff3b3b, fin:0xff8a7a},  // красная
  {body:0x2ecc71, fin:0x8ce8b0},  // зелёная
  {body:0xff7ab8, fin:0xffb3d4},  // розовая
  {body:0xffc93c, fin:0xffe08a},  // золотая
];
const matCache={};
function schemeMats(i){
  if(matCache[i]) return matCache[i];
  const s=SCHEMES[i];
  return matCache[i]={
    body:new THREE.MeshStandardMaterial({color:s.body, roughness:.3, metalness:.25, envMapIntensity:.9}),
    fin :new THREE.MeshStandardMaterial({color:s.fin,  roughness:.5, metalness:.1,
           transparent:true, opacity:.85, side:THREE.DoubleSide}),
  };
}
const eyeWhiteMat=new THREE.MeshStandardMaterial({color:0xf4f9ff, roughness:.25});
const pupilMat   =new THREE.MeshStandardMaterial({color:0x0a0f14, roughness:.3});

/* общие геометрии (нос = +Z) */
const bodyGeo=new THREE.SphereGeometry(1,18,14);
const tailGeo=new THREE.ConeGeometry(.72,1.5,8);
tailGeo.rotateX(Math.PI/2); tailGeo.translate(0,0,-.72);
const dorsalGeo=new THREE.ConeGeometry(.5,1,4);
dorsalGeo.scale(.22,1,1);
const pectoralGeo=new THREE.ConeGeometry(.34,.7,4);
pectoralGeo.rotateX(-Math.PI/2); pectoralGeo.scale(1,.18,1); pectoralGeo.translate(0,0,-.3);
const eyeGeo=new THREE.SphereGeometry(.17,10,8);
const pupilGeo=new THREE.SphereGeometry(.085,8,6);

function createFish(schemeIdx){
  const mats=schemeMats(schemeIdx), g=new THREE.Group();
  const body=new THREE.Mesh(bodyGeo,mats.body);
  body.scale.set(.55,.68,1.75); body.castShadow=true; g.add(body);

  const tail=new THREE.Group(); tail.position.set(0,0,-1.55);
  const tailMesh=new THREE.Mesh(tailGeo,mats.fin); tailMesh.scale.set(1,.3,1);
  tail.add(tailMesh); g.add(tail);

  const dorsal=new THREE.Mesh(dorsalGeo,mats.fin);
  dorsal.position.set(0,.62,-.25); dorsal.rotation.x=-.12; g.add(dorsal);

  const leftFin=new THREE.Mesh(pectoralGeo,mats.fin);
  leftFin.position.set(-.42,-.08,.55); leftFin.rotation.set(.35,0,.55);
  const rightFin=leftFin.clone();
  rightFin.position.x=.42; rightFin.rotation.z=-.55;
  g.add(leftFin,rightFin);

  const eyeL=new THREE.Mesh(eyeGeo,eyeWhiteMat); eyeL.position.set(-.33,.16,1.05);
  const eyeR=eyeL.clone(); eyeR.position.x=.33;
  const pupL=new THREE.Mesh(pupilGeo,pupilMat); pupL.position.set(-.36,.17,1.16);
  const pupR=pupL.clone(); pupR.position.x=.36;
  g.add(eyeL,eyeR,pupL,pupR);
  return {group:g, body, tail, dorsal, leftFin, rightFin};
}

const fishArray=[];
function spawnFish(){
  const f=createFish(Math.floor(Math.random()*SCHEMES.length));
  const baseScale=rand(.6,1.2);
  f.group.position.set(rand(-12,12), rand(4,18), rand(-6,6));
  f.group.scale.setScalar(baseScale);
  const vel=new THREE.Vector3(rand(-1,1),rand(-.3,.3),rand(-1,1)).normalize().multiplyScalar(2);
  f.group.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), vel.clone().normalize());
  scene.add(f.group);
  fishArray.push({
    mesh:f.group, body:f.body, tail:f.tail, dorsal:f.dorsal,
    leftFin:f.leftFin, rightFin:f.rightFin,
    velocity:vel,
    speed:rand(2.2,4.4),
    tailSpeed:rand(6,11),
    phase:rand(0,Math.PI*2),
    targetFood:null,
    avoidanceRadius:rand(1.6,2.8),
    wanderT:rand(0,3), preferY:rand(4,19),
    scaleBase:baseScale, scaleCur:baseScale,
    bank:0, eatPulse:0, prevDir:vel.clone().normalize()
  });
}

/* ============================== КОРМ ============================== */
const foodGeo=new THREE.SphereGeometry(.34,10,8);
const foodMats=[0xf59e0b,0xdc6b1f,0xe11d48].map(c=>
  new THREE.MeshStandardMaterial({color:c, roughness:.6}));
const foods=[];
function spawnFood(p){
  const m=new THREE.Mesh(foodGeo, foodMats[Math.floor(Math.random()*foodMats.length)]);
  m.position.copy(p); scene.add(m);
  foods.push({mesh:m, velocity:new THREE.Vector3(rand(-.4,.4),-.5,rand(-.4,.4)), dead:false});
}
function removeFood(i){ scene.remove(foods[i].mesh); foods.splice(i,1); }
function updateFoods(dt){
  for(let i=foods.length-1;i>=0;i--){
    const fd=foods[i];
    fd.velocity.y-=6.5*dt;
    fd.velocity.multiplyScalar(Math.max(0,1-1.2*dt));
    fd.mesh.position.addScaledVector(fd.velocity,dt);
    fd.mesh.rotation.x+=dt*2; fd.mesh.rotation.z+=dt*1.4;
    if(fd.mesh.position.y<.95) removeFood(i);
  }
}

/* вспышки (корм / поедание) */
const flashGeo=new THREE.SphereGeometry(1,12,10);
const flashes=[];
function spawnFlash(pos,color,max){
  const m=new THREE.Mesh(flashGeo,new THREE.MeshBasicMaterial({
    color, transparent:true, opacity:.5,
    blending:THREE.AdditiveBlending, depthWrite:false}));
  m.position.copy(pos); m.scale.setScalar(.15);
  scene.add(m); flashes.push({mesh:m, age:0, life:.6, max:max||.9});
}
function updateFlashes(dt){
  for(let i=flashes.length-1;i>=0;i--){
    const fl=flashes[i]; fl.age+=dt;
    const k=fl.age/fl.life;
    if(k>=1){ scene.remove(fl.mesh); fl.mesh.material.dispose(); flashes.splice(i,1); continue; }
    fl.mesh.scale.setScalar(.15+k*fl.max);
    fl.mesh.material.opacity=.5*(1-k);
  }
}

/* ============================== ПУЗЫРИ ============================== */
const bubbleGeo=new THREE.SphereGeometry(1,10,8);
const bubbleMat=new THREE.MeshPhysicalMaterial({
  color:0xdff4ff, metalness:0, roughness:.05,
  transparent:true, opacity:.32, envMapIntensity:1.6, clearcoat:1});
const bubbles=[];
function addBubble(){
  const m=new THREE.Mesh(bubbleGeo,bubbleMat);
  m.scale.setScalar(rand(.08,.28));
  const b={mesh:m, speed:rand(1.6,4), phase:rand(0,Math.PI*2), amp:rand(.25,.85),
           baseX:rand(-15,15), baseZ:rand(-7.5,7.5)};
  m.position.set(b.baseX, rand(1,TANK.h-2), b.baseZ);
  scene.add(m); bubbles.push(b);
}
function updateBubbles(dt,t){
  for(const b of bubbles){
    b.mesh.position.y+=b.speed*dt;
    b.mesh.position.x=b.baseX+Math.sin(t*.9+b.phase)*b.amp;
    b.mesh.position.z=b.baseZ+Math.cos(t*.7+b.phase)*b.amp*.7;
    if(b.mesh.position.y>TANK.h-.8){
      b.mesh.position.y=.7;
      b.baseX=rand(-15,15); b.baseZ=rand(-7.5,7.5);
    }
  }
}

/* ============================== ИИ РЫБОК ============================== */
const _v1=new THREE.Vector3(), _v2=new THREE.Vector3();
const _m4=new THREE.Matrix4(), _q=new THREE.Quaternion();
const UP=new THREE.Vector3(0,1,0);

function updateFish(dt,t){
  const n=fishArray.length;

  /* взаимное отталкивание */
  for(let i=0;i<n;i++){
    const a=fishArray[i];
    for(let j=i+1;j<n;j++){
      const b=fishArray[j];
      _v1.subVectors(a.mesh.position,b.mesh.position);
      const d=_v1.length();
      const rr=(a.avoidanceRadius+b.avoidanceRadius)*.5*(a.scaleCur+b.scaleCur)*.5;
      if(d<rr&&d>1e-4){
        _v1.multiplyScalar(1/d);
        const push=(rr-d)/rr;
        a.velocity.addScaledVector(_v1, push*6*dt);
        b.velocity.addScaledVector(_v1,-push*6*dt);
      }
    }
  }

  for(let i=0;i<n;i++){
    const f=fishArray[i], p=f.mesh.position;

    /* поиск корма (радиус 15) */
    if(!f.targetFood||f.targetFood.dead){
      f.targetFood=null; let best=225;
      for(const fd of foods){
        const d2=p.distanceToSquared(fd.mesh.position);
        if(d2<best){ best=d2; f.targetFood=fd; }
      }
    }
    const chasing=!!f.targetFood;

    if(chasing){
      _v2.subVectors(f.targetFood.mesh.position,p).normalize().multiplyScalar(f.speed*1.9);
      f.velocity.lerp(_v2, 1-Math.exp(-dt*3.2));
    }else{
      f.wanderT-=dt;
      if(f.wanderT<=0){
        f.wanderT=rand(2,5.5);
        f.velocity.x+=rand(-1,1); f.velocity.y+=rand(-.6,.6); f.velocity.z+=rand(-1,1);
        if(Math.random()<.3) f.preferY=rand(3.5,19.5);
      }
      f.velocity.y+=(f.preferY-p.y)*.15*dt;              /* мягкая глубина */
      _v2.copy(f.velocity).normalize().multiplyScalar(f.speed);
      f.velocity.lerp(_v2, 1-Math.exp(-dt*.9));          /* блуждание */
    }

    /* плавное отражение от стенок */
    const m=3.2, k=2.2;
    if(p.x>BOUNDS.maxX-m) f.velocity.x-=(p.x-(BOUNDS.maxX-m))*k*dt;
    if(p.x<BOUNDS.minX+m) f.velocity.x+=((BOUNDS.minX+m)-p.x)*k*dt;
    if(p.z>BOUNDS.maxZ-m) f.velocity.z-=(p.z-(BOUNDS.maxZ-m))*k*dt;
    if(p.z<BOUNDS.minZ+m) f.velocity.z+=((BOUNDS.minZ+m)-p.z)*k*dt;
    if(p.y>BOUNDS.maxY-m) f.velocity.y-=(p.y-(BOUNDS.maxY-m))*k*dt;
    if(p.y<BOUNDS.minY+m) f.velocity.y+=((BOUNDS.minY+m)-p.y)*k*dt;

    /* ограничение скорости */
    const sp=f.velocity.length();
    const maxSp=f.speed*(chasing?2.1:1.4);
    if(sp>maxSp) f.velocity.multiplyScalar(maxSp/sp);
    if(sp<f.speed*.45&&sp>1e-3) f.velocity.multiplyScalar(f.speed*.45/sp);

    p.addScaledVector(f.velocity,dt);
    const pad=f.scaleCur;
    p.x=THREE.MathUtils.clamp(p.x,BOUNDS.minX-pad,BOUNDS.maxX+pad);
    p.y=THREE.MathUtils.clamp(p.y,BOUNDS.minY,BOUNDS.maxY);
    p.z=THREE.MathUtils.clamp(p.z,BOUNDS.minZ-pad,BOUNDS.maxZ+pad);

    /* ориентация + крен в повороте */
    if(f.velocity.lengthSq()>1e-3){
      const dir=_v1.copy(f.velocity).normalize();
      _v2.copy(p).add(dir);
      _m4.lookAt(p,_v2,UP);
      _q.setFromRotationMatrix(_m4);
      f.mesh.quaternion.slerp(_q, 1-Math.exp(-dt*4.5));
      const turn=_v2.crossVectors(f.prevDir,dir).y;
      f.bank+=(THREE.MathUtils.clamp(-turn*2.2,-.55,.55)-f.bank)*Math.min(1,dt*3);
      f.mesh.rotateZ(f.bank);
      f.prevDir.copy(dir);
    }

    /* поедание: рост +5% */
    if(f.targetFood&&!f.targetFood.dead){
      const ep=f.targetFood.mesh.position;
      if(p.distanceToSquared(ep)<Math.pow(f.scaleCur+ .4,2)){
        f.targetFood.dead=true;
        const idx=foods.indexOf(f.targetFood);
        if(idx>-1){ spawnFlash(ep,0xffe9b0,.7); removeFood(idx); }
        f.targetFood=null;
        f.scaleCur=Math.min(f.scaleCur*1.05, f.scaleBase*2.3);
        f.mesh.scale.setScalar(f.scaleCur);
        f.eatPulse=1;
      }
    }

    /* анимация хвоста и плавников */
    f.eatPulse=Math.max(0,f.eatPulse-dt*1.6);
    const amp=.5+f.eatPulse*.5, ts=f.tailSpeed*(1+f.eatPulse*.8);
    f.tail.rotation.z     =Math.sin(t*ts+f.phase)*amp;
    f.leftFin.rotation.z  = .55+Math.sin(t*ts*.8+f.phase+1.2)*.35;
    f.rightFin.rotation.z=-.55-Math.sin(t*ts*.8+f.phase+1.2)*.35;
    f.dorsal.rotation.x   =-.12+Math.sin(t*ts*.5+f.phase)*.12;
    f.body.rotation.z     =Math.sin(t*1.4+f.phase)*.04;
  }
}

/* ============================== КОРМЛЕНИЕ (клик) ============================== */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let downX=0,downY=0,downT=0;
renderer.domElement.addEventListener('pointerdown',e=>{
  downX=e.clientX; downY=e.clientY; downT=performance.now();
});
renderer.domElement.addEventListener('pointerup',e=>{
  if(e.button!==0) return;
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>6||performance.now()-downT>450) return;
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObject(glass);
  if(!hits.length) return;
  const pt=hits[0].point;
  pt.x=THREE.MathUtils.clamp(pt.x,BOUNDS.minX+1,BOUNDS.maxX-1);
  pt.y=THREE.MathUtils.clamp(pt.y,BOUNDS.minY+1,BOUNDS.maxY-1);
  pt.z=THREE.MathUtils.clamp(pt.z,BOUNDS.minZ+1,BOUNDS.maxZ-1);
  spawnFood(pt); spawnFlash(pt,0xbfe9ff,.8);
  hintDismiss();
});

/* ============================== UI ============================== */
const $=id=>document.getElementById(id);
const statFish=$('statFish'), statBub=$('statBub'), statFood=$('statFood'), statFps=$('statFps');
let toastTimer;
function toast(msg){
  const el=$('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
function bump(el){ el.animate([{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:300,easing:'ease-out'}); }
let hintGone=false;
function hintDismiss(){ if(hintGone)return; hintGone=true; $('hint').classList.add('hide'); }
setTimeout(hintDismiss,12000);

$('btnFish').onclick=()=>{
  if(fishArray.length>=40){ toast('Максимум 40 рыбок 🐠'); return; }
  spawnFish(); toast('Новая рыбка присоединилась к стае 🐟'); bump(statFish);
};
$('btnBubbles').onclick=()=>{
  if(bubbles.length>=140){ toast('Слишком много пузырей 🫧'); return; }
  for(let i=0;i<10;i++) addBubble();
  toast('Отпущено +10 пузырей 🫧'); bump(statBub);
};
let sunOn=true;
$('btnLight').onclick=function(){
  sunOn=!sunOn;
  sun.intensity=sunOn?1.15:.1;
  ambient.intensity=sunOn?.4:.22;
  pl1.intensity=pl2.intensity=sunOn?1:1.6;
  this.innerHTML=sunOn?'☀ Свет':'🌙 Ночь';
  this.classList.toggle('off',!sunOn);
  toast(sunOn?'Дневной свет ☀':'Ночной режим 🌙');
};

/* ============================== СТАРТ ============================== */
for(let i=0;i<15;i++) spawnFish();
for(let i=0;i<30;i++) addBubble();

/* ============================== ЦИКЛ ============================== */
const clock=new THREE.Clock();
let frames=0, fpsAcc=0, uiAcc=0;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  const t=clock.elapsedTime;

  updateFish(dt,t);
  updateFoods(dt);
  updateBubbles(dt,t);
  updateFlashes(dt);

  for(const w of weedClusters){
    w.group.rotation.x=Math.sin(t*w.sp+w.phase)*.09;
    w.group.rotation.z=Math.cos(t*w.sp*.8+w.phase)*.09;
  }

  const sp=surfGeo.attributes.position;
  for(let i=0;i<sp.count;i++){
    const x=sp.getX(i), z=sp.getZ(i);
    sp.setY(i,Math.sin(x*.45+t*1.3)*.16+Math.cos(z*.6+t*.9)*.13);
  }
  sp.needsUpdate=true;

  pl1.position.set(Math.sin(t*.22)*11, 17, Math.cos(t*.27)*6);
  pl2.position.set(-Math.cos(t*.19)*11, 13, Math.sin(t*.23)*-6);

  for(let i=0;i<rays.length;i++){
    rays[i].material.opacity=.04+.035*Math.abs(Math.sin(t*.5+i*1.7));
    rays[i].rotation.y+=dt*.03*(i%2?1:-1);
  }

  controls.update();
  renderer.render(scene,camera);

  frames++; fpsAcc+=dt;
  if(fpsAcc>=.5){
    statFps.textContent=Math.round(frames/fpsAcc);
    frames=0; fpsAcc=0;
  }
  uiAcc+=dt;
  if(uiAcc>=.25){
    uiAcc=0;
    statFish.textContent=fishArray.length;
    statBub.textContent=bubbles.length;
    statFood.textContent=foods.length;
  }
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
