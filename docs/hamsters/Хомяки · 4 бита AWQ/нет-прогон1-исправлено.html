<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3b2a1e;
    --card:#fffaf2;
    --accent:#ff7d6b;
    --teal:#2fb6a8;
    --shadow:0 14px 34px rgba(59,42,30,.20);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Nunito",system-ui,sans-serif;
    color:var(--ink);
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 8%, #ffe9c7 0%, #ffd9c4 42%, #ffcdbf 100%);
  }
  canvas#scene{position:fixed;inset:0;display:block;z-index:0;touch-action:none;background:#ffe4cd;}

  /* ---------- floating background bits ---------- */
  .bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
  .blob{position:absolute;border-radius:50%;filter:blur(26px);opacity:.5;animation:drift 16s ease-in-out infinite;}
  .b1{width:340px;height:340px;left:-70px;top:12%;background:#ffd08a;}
  .b2{width:300px;height:300px;right:-60px;bottom:6%;background:#a8e6d8;animation-delay:-6s;}
  .b3{width:220px;height:220px;left:38%;bottom:-60px;background:#ffb3a1;animation-delay:-11s;}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(26px,-30px) scale(1.12);}}

  .floaters{position:fixed;inset:0;z-index:1;pointer-events:none;}
  .fl{position:absolute;bottom:-70px;font-size:26px;opacity:.85;animation:floatUp linear infinite;will-change:transform;}
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0;}
    12%{opacity:.85;}
    88%{opacity:.85;}
    100%{transform:translateY(-115vh) translateX(var(--dx)) rotate(var(--rot));opacity:0;}
  }

  /* ---------- loading veil ---------- */
  #veil{
    position:fixed;inset:0;z-index:5;display:grid;place-items:center;
    background:radial-gradient(120% 90% at 50% 8%, #ffe9c7 0%, #ffd9c4 42%, #ffcdbf 100%);
    transition:opacity .5s ease;
  }
  #veil.hide{opacity:0;pointer-events:none;}
  .vcard{
    background:var(--card);border-radius:22px;box-shadow:var(--shadow);
    padding:22px 30px;font-weight:800;font-size:16px;color:var(--ink);
    display:flex;align-items:center;gap:12px;max-width:80vw;text-align:center;
  }
  .vcard .spin{font-size:24px;display:inline-block;animation:vspin 1.1s linear infinite;}
  @keyframes vspin{to{transform:rotate(360deg);}}
  #veil.err .vcard{color:#b23b2e;}
  #veil.err .spin{animation:none;}

  /* ---------- UI layer ---------- */
  .ui{position:fixed;inset:0;z-index:2;pointer-events:none;}

  .brand{position:absolute;top:clamp(16px,3vw,34px);left:clamp(16px,3vw,34px);display:flex;gap:14px;align-items:center;max-width:min(78vw,520px);}
  .badge{flex:0 0 auto;width:56px;height:56px;display:grid;place-items:center;font-size:30px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);transform:rotate(-6deg);transition:transform .3s cubic-bezier(.2,.8,.2,1);}
  .badge:hover{transform:rotate(6deg) scale(1.08);}
  .kicker{font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:#e0674d;margin:0 0 2px;}
  h1{font-family:"Fredoka",sans-serif;font-weight:700;line-height:.95;margin:0;font-size:clamp(30px,6.4vw,62px);color:#3b2a1e;text-shadow:0 2px 0 rgba(255,255,255,.55);}
  h1 .pop{color:var(--accent);}
  .sub{margin:8px 0 0;font-weight:700;font-size:clamp(12px,1.5vw,15px);color:#7a5c46;}

  .panel{
    position:absolute;left:clamp(16px,3vw,34px);bottom:clamp(16px,3vw,34px);
    width:min(88vw,320px);background:var(--card);border-radius:22px;padding:16px 16px 14px;
    box-shadow:var(--shadow);pointer-events:auto;
  }
  .panel h2{font-family:"Fredoka",sans-serif;font-weight:700;font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .panel h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(47,182,168,.25);}
  .row{display:flex;align-items:center;gap:12px;margin:10px 0;}
  .row label{flex:0 0 66px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#9a7c66;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:99px;background:#ffe1cf;outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .15s;}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);}
  .hint{margin:12px 0 0;font-size:12px;color:#a98a72;font-weight:700;line-height:1.5;}
  .hint b{color:#e0674d;}

  .chips{position:absolute;right:clamp(16px,3vw,34px);bottom:clamp(16px,3vw,34px);display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .chip{
    pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:none;cursor:pointer;
    padding:9px 14px;border-radius:99px;font-family:"Nunito",sans-serif;font-weight:800;font-size:13px;color:var(--ink);
    box-shadow:var(--shadow);transition:transform .18s cubic-bezier(.2,.8,.2,1),background .18s,color .18s;
  }
  .chip .ic{font-size:16px;line-height:1;}
  .chip:hover{transform:translateY(-3px) scale(1.03);}
  .chip:active{transform:scale(.97);}
  .chip.on{background:var(--teal);color:#fff;}
  .chip.on .ic{filter:grayscale(0);}
  .chip .ic.off{filter:grayscale(1) opacity(.6);}

  .toast{
    position:absolute;left:50%;bottom:clamp(18px,4vw,40px);transform:translate(-50%,20px);
    background:var(--ink);color:#fff8ef;padding:11px 20px;border-radius:99px;font-weight:800;font-size:14px;
    box-shadow:var(--shadow);opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (max-width:560px){
    .sub{display:none;}
    .panel{width:min(92vw,280px);}
    .chips{align-items:flex-start;}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>
<div class="floaters" id="floaters"></div>

<div class="ui">
  <header class="brand">
    <div class="badge">🐹</div>
    <div>
      <p class="kicker">Tiny zoo · big chaos</p>
      <h1>Low‑Poly <span class="pop">Hamster</span> Playground</h1>
      <p class="sub">Four fluffy little guys, one very busy wheel.</p>
    </div>
  </header>

  <section class="panel">
    <h2><span class="dot"></span>Playground controls</h2>
    <div class="row"><label for="speed">Speed</label><input id="speed" type="range" min="0.2" max="2" step="0.05" value="1"></div>
    <div class="row"><label for="zoom">Zoom</label><input id="zoom" type="range" min="0.5" max="1.7" step="0.01" value="1"></div>
    <p class="hint"><b>Drag</b> to orbit · <b>scroll</b> to zoom · click the <b>wheel</b> or <b>bowl</b> to poke them 🐾</p>
  </section>

  <div class="chips">
    <button class="chip" id="btnPause"><span class="ic">⏸</span><span class="tx">Pause</span></button>
    <button class="chip on" id="btnAuto"><span class="ic">🔄</span><span class="tx">Auto‑orbit</span></button>
    <button class="chip" id="btnReset"><span class="ic">🎯</span><span class="tx">Reset view</span></button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<div id="veil"><div class="vcard"><span class="spin">🐹</span><span class="vmsg">Warming up the playground…</span></div></div>

<script>
  /* Safety net: if the 3D module never reports success (e.g. the CDN import
     failed to resolve), say so instead of leaving a blank gradient. */
  window.__zooReady = false;
  (function(){
    setTimeout(function(){
      if(window.__zooReady) return;
      var v = document.getElementById('veil');
      if(v){
        v.classList.add('err');
        var m = v.querySelector('.vmsg');
        var s = v.querySelector('.spin');
        if(m) m.textContent = '⚠️ Couldn’t load Three.js from the CDN. Check your connection and reload.';
        if(s) s.textContent = '⚠️';
      }
    }, 8000);
  })();
</script>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

function fail(msg){
  const v = document.getElementById('veil');
  if(v){ v.classList.add('err'); const m=v.querySelector('.vmsg'); const s=v.querySelector('.spin'); if(m)m.textContent=msg; if(s)s.textContent='⚠️'; }
  console.error('[zoo]', msg);
}

try {

/* ============================================================
   SETUP
============================================================ */
const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
} catch(e){
  fail('WebGL isn’t available in this browser.');
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#ffe4cd');
scene.fog = new THREE.Fog('#ffe4cd', 16, 42);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
const target = new THREE.Vector3(0, 1.0, 0);

/* Orbit controls (custom, minimal) */
const ctrl = { theta: 0.72, phi: 1.05, radius: 11.5, autoRotate:true };
function applyCamera(){
  const sp = Math.sin(ctrl.phi), cp = Math.cos(ctrl.phi);
  camera.position.set(
    target.x + ctrl.radius * sp * Math.sin(ctrl.theta),
    target.y + ctrl.radius * cp,
    target.z + ctrl.radius * sp * Math.cos(ctrl.theta)
  );
  camera.lookAt(target);
}

/* ============================================================
   LIGHTS + SKY
============================================================ */
scene.add(new THREE.HemisphereLight(0xfff2df, 0xffd0b0, 0.95));
scene.add(new THREE.AmbientLight(0xffffff, 0.15));

const sun = new THREE.DirectionalLight(0xfff3e0, 1.15);
sun.position.set(6, 12, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 40;
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9; sun.shadow.camera.bottom = -9;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

// soft warm rim from behind
const rim = new THREE.DirectionalLight(0xffc9a0, 0.35);
rim.position.set(-6, 5, -7);
scene.add(rim);

/* ============================================================
   HELPERS
============================================================ */
function mat(color, o={}){
  return new THREE.MeshStandardMaterial(Object.assign({
    color, roughness:0.9, metalness:0.0, flatShading:true
  }, o));
}
function box(w,h,d,c,o){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function cyl(rt,rb,h,c,seg=10,o={}){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(c,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function sphere(r,c,ws=10,hs=8,o={}){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,ws,hs), mat(c,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function cone(h,r,c,seg=10,o={}){ const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg), mat(c,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function torus(R,r,c,ts=16,rs=8,o={}){ const m=new THREE.Mesh(new THREE.TorusGeometry(R,r,ts,rs), mat(c,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function ico(r,c,dt=0,o={}){ const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,dt), mat(c,o)); m.castShadow=true; m.receiveShadow=true; return m; }

/* ============================================================
   CAGE  (frame + glass + tray + bedding + food)
============================================================ */
const CW=6, CH=3, CD=4.2;          // cage footprint / height
const BED=0.55;                     // bedding top height
const FLOOR_Y = BED;
const FRAME='#8a5a34';
const PLAY = { minX:-2.55, maxX:2.55, minZ:-1.75, maxZ:1.75 };

const cage = new THREE.Group(); scene.add(cage);

// wooden base
const baseBox = box(CW+0.5, 0.5, CD+0.5, '#7a4f2c');
baseBox.position.y = 0.25;
cage.add(baseBox);
// bedding
const bed = box(CW-0.2, BED, CD-0.2, '#e7c489'); bed.position.y = 0.5 + BED/2; cage.add(bed);

// frame posts + rails
const post=(x,z)=>{ const p=cyl(0.13,0.15,CH,8,FRAME); p.position.set(x,0.5+CH/2,z); cage.add(p); };
[[-CW/2,-CD/2],[CW/2,-CD/2],[-CW/2,CD/2],[CW/2,CD/2]].forEach(([x,z])=>post(x,z));
const rail=(len,axis,x,y,z)=>{ const r=cyl(0.1,0.1,len,8,FRAME); if(axis==='x')r.rotation.z=Math.PI/2; else r.rotation.x=Math.PI/2; r.position.set(x,y,z); cage.add(r); };
const topY=0.5+CH;
rail(CW,'x',0,topY,-CD/2); rail(CW,'x',0,topY,CD/2); rail(CD,'z',-CW/2,topY,0); rail(CD,'z',CW/2,topY,0);
rail(CW,'x',0,0.55,-CD/2); rail(CW,'x',0,0.55,CD/2); rail(CD,'z',-CW/2,0.55,0); rail(CD,'z',CW/2,0.55,0);

// glass panels (front/back/left/right)
const glassMat = new THREE.MeshStandardMaterial({ color:'#bff0ee', transparent:true, opacity:0.16, roughness:0.08, metalness:0.0, side:THREE.DoubleSide });
function panel(w,h,x,y,z,ry){ const g=new THREE.Mesh(new THREE.PlaneGeometry(w,h), glassMat); g.position.set(x,y,z); g.rotation.y=ry; cage.add(g); }
const midY = 0.5 + CH/2;
panel(CW, CH, 0, midY, CD/2, 0);
panel(CW, CH, 0, midY, -CD/2, Math.PI);
panel(CD, CH, -CW/2, midY, 0, Math.PI/2);
panel(CD, CH, CW/2, midY, 0, -Math.PI/2);

/* ---- Food bowl ---- */
const bowl = new THREE.Group();
bowl.add(cyl(0.55,0.4,0.12,12,'#c9a06a'));
const bowlRim = torus(0.5,0.07,'#c9a06a'); bowlRim.rotation.x=Math.PI/2; bowlRim.position.y=0.06; bowl.add(bowlRim);
for(let i=0;i<9;i++){
  const k=i/9*Math.PI*2, rr=Math.random()*0.34;
  const seed = ico(0.07,'#c98a2b',0,{roughness:0.5});
  seed.position.set(Math.cos(k)*rr, 0.13, Math.sin(k)*rr);
  seed.scale.set(1,0.7,1); bowl.add(seed);
}
bowl.position.set(-1.7, FLOOR_Y, 1.1);
cage.add(bowl);

/* ---- Hidey house ---- */
const house = new THREE.Group();
house.add(box(1.0,0.8,1.0,'#8fd6b0'));
const roof = cone(0.7,0.85,'#ff9aa8',4); roof.rotation.y=Math.PI/4; roof.position.y=0.8+0.35; house.add(roof);
const door = cyl(0.28,0.28,0.12,12,'#3a2a1c'); door.rotation.x=Math.PI/2; door.position.set(0,0.28,0.52); house.add(door);
house.position.set(1.9, FLOOR_Y, -1.2);
cage.add(house);

/* ---- Tunnel (half pipe) ---- */
const tunnel = new THREE.Mesh(
  new THREE.CylinderGeometry(0.45,0.45,1.7,14,1,false,0,Math.PI),
  mat('#7cc6ff',{side:THREE.DoubleSide, roughness:0.6})
);
tunnel.rotation.z = Math.PI/2;
tunnel.castShadow = true; tunnel.receiveShadow = true;
tunnel.position.set(0.2, FLOOR_Y+0.45, -1.2);
cage.add(tunnel);

/* ---- Exercise wheel (interactive) ---- */
const wheel = new THREE.Group();
wheel.position.set(-2.15, 0.5, -0.4);
const wheelSpin = new THREE.Group(); wheel.add(wheelSpin);
const WHEEL_R = 0.85;
const rim = torus(WHEEL_R, 0.09, '#ffffff', 20, 10); rim.castShadow=true; wheelSpin.add(rim);
const hub = cyl(0.13,0.13,0.2,10,'#ff8f6b'); hub.rotation.x=Math.PI/2; wheelSpin.add(hub);
for(let i=0;i<10;i++){
  const a=i/10*Math.PI*2;
  const spoke = cyl(0.03,0.03,WHEEL_R-0.1,6,'#ff8f6b');
  spoke.position.set(Math.cos(a)*(WHEEL_R/2), Math.sin(a)*(WHEEL_R/2), 0);
  spoke.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(Math.cos(a),Math.sin(a),0));
  wheelSpin.add(spoke);
}
// stand
const leg = cyl(0.09,0.12,0.55,8,FRAME); leg.position.y=-0.27; wheel.add(leg);
const base = box(0.7,0.1,0.5,FRAME); base.position.y=-0.55; wheel.add(base);
const axle = cyl(0.05,0.05,0.5,8,'#6b4a2a'); axle.rotation.z=Math.PI/2; axle.position.y=0; wheel.add(axle);
cage.add(wheel);
const wheelCenter = wheel.position.clone();
const wheelRadius = WHEEL_R + 0.3;

/* ---- scattered seeds on bedding ---- */
for(let i=0;i<14;i++){
  const s = ico(0.05+Math.random()*0.03, Math.random()>0.5?'#c98a2b':'#e0a83e', 0, {roughness:0.5});
  s.position.set(PLAY.minX+Math.random()*(PLAY.maxX-PLAY.minX), FLOOR_Y+0.02, PLAY.minZ+Math.random()*(PLAY.maxZ-PLAY.minZ));
  s.scale.set(1,0.6,1); cage.add(s);
}

/* ---- decorative plants outside the cage ---- */
function plant(x,z,leaf){
  const g=new THREE.Group();
  const pot = cyl(0.28,0.36,0.5,8,'#c98a5a');
  pot.position.y=0.25; g.add(pot);
  for(let i=0;i<5;i++){
    const l=sphere(0.28+Math.random()*0.12, leaf, 7,6);
    l.position.set((Math.random()-0.5)*0.5, 0.7+Math.random()*0.4, (Math.random()-0.5)*0.5);
    g.add(l);
  }
  g.position.set(x,0,z); scene.add(g);
}
plant(-4.6, 2.2, '#5fc08a');
plant(4.7, -2.0, '#6fd0a0');
plant(4.3, 2.6, '#57b87f');

/* ============================================================
   HAMSTERS
============================================================ */
const PALETTES = [
  { body:'#f6c98a', belly:'#fff2dc', ear:'#e89a7a', cheek:'#ff9d8a' },
  { body:'#f4a878', belly:'#ffe6cf', ear:'#d98a63', cheek:'#ff8f7a' },
  { body:'#e8c99a', belly:'#fff6e6', ear:'#cfa06a', cheek:'#ff9d8a' },
  { body:'#d9b48f', belly:'#f6ead6', ear:'#b98a63', cheek:'#ff8f7a' },
];
const NAMES = ['Nibbles','Pip','Mochi','Biscuit'];

const hamsters = [];

function buildHamster(pal){
  const root = new THREE.Group();
  const bob = new THREE.Group(); root.add(bob);

  const body = sphere(0.42, pal.body, 9, 7); body.scale.set(1.05,0.9,1.18); body.position.y=0.42; bob.add(body);
  const belly = sphere(0.34, pal.belly, 8, 6); belly.scale.set(0.9,0.7,1.0); belly.position.set(0,0.36,0.16); bob.add(belly);

  const head = new THREE.Group(); head.position.set(0,0.56,0.4); bob.add(head);
  const skull = sphere(0.34, pal.body, 9, 7); skull.scale.set(1,0.95,1.05); head.add(skull);
  const snout = sphere(0.15, pal.belly, 7, 6); snout.scale.set(1,0.8,1.1); snout.position.set(0,-0.05,0.3); head.add(snout);
  const nose = sphere(0.05, '#ff6b6b', 6, 5); nose.position.set(0,-0.02,0.43); head.add(nose);

  const eyeGeo = new THREE.SphereGeometry(0.05,6,5);
  const eyeMat = new THREE.MeshStandardMaterial({color:'#241a12', roughness:0.3, flatShading:true});
  [-1,1].forEach(s=>{
    const e=new THREE.Mesh(eyeGeo, eyeMat); e.position.set(s*0.15,0.05,0.27); head.add(e);
    const gl=sphere(0.016,'#ffffff',4,4,{roughness:0.2}); gl.position.set(s*0.16,0.07,0.31); head.add(gl);
  });
  [-1,1].forEach(s=>{
    const cheek=sphere(0.09, pal.cheek, 7, 6); cheek.scale.set(1,0.8,0.6); cheek.position.set(s*0.24,-0.02,0.18); head.add(cheek);
  });
  [-1,1].forEach(s=>{
    const ear=sphere(0.11, pal.ear, 7, 6); ear.scale.set(1,1.2,0.5); ear.position.set(s*0.2,0.28,-0.05); ear.rotation.z=s*0.2; head.add(ear);
  });

  const tail = sphere(0.09, pal.belly, 6, 5); tail.position.set(0,0.4,-0.48); bob.add(tail);

  // legs (pivot at hip so they can swing)
  const legGeo = new THREE.CapsuleGeometry(0.09,0.16,3,6);
  const legMat = mat(pal.body);
  const legs=[];
  [[-1,1],[1,1],[-1,-1],[1,-1]].forEach(([sx,sz])=>{
    const pivot=new THREE.Group(); pivot.position.set(sx*0.18,0.34,sz*0.22);
    const leg=new THREE.Mesh(legGeo, legMat); leg.castShadow=true; leg.position.y=-0.13; pivot.add(leg);
    bob.add(pivot); legs.push(pivot);
  });

  root.userData = { bob, head, legs, phase:Math.random()*10 };
  root.traverse(o=>{ if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} });
  return root;
}

function makeHamster(i){
  const root = buildHamster(PALETTES[i]);
  const h = {
    root,
    name: NAMES[i],
    pos: new THREE.Vector3(
      PLAY.minX+Math.random()*(PLAY.maxX-PLAY.minX),
      FLOOR_Y,
      PLAY.minZ+Math.random()*(PLAY.maxZ-PLAY.minZ)
    ),
    yaw: Math.random()*Math.PI*2,
    speed: 0,
    state:'idle',
    timer: 0.5+Math.random(),
    turnTimer: 0,
    target: null,
    eating:false,
    wheeling:false,
    spin:0,
    bobPhase: Math.random()*10,
  };
  root.position.copy(h.pos);
  root.rotation.y = h.yaw;
  scene.add(root);
  hamsters.push(h);
}
for(let i=0;i<4;i++) makeHamster(i);

/* ============================================================
   BEHAVIOR
============================================================ */
function pickPoint(){ return new THREE.Vector3(
  PLAY.minX+Math.random()*(PLAY.maxX-PLAY.minX),
  FLOOR_Y,
  PLAY.minZ+Math.random()*(PLAY.maxZ-PLAY.minZ)
); }
function pickInterest(){
  const opts = [bowl.position, house.position, tunnel.position, pickPoint()];
  return opts[(Math.random()*opts.length)|0].clone();
}
function clampToPlay(v){
  v.x = THREE.MathUtils.clamp(v.x, PLAY.minX, PLAY.maxX);
  v.z = THREE.MathUtils.clamp(v.z, PLAY.minZ, PLAY.maxZ);
}
function desiredYaw(to){ return Math.atan2(to.x-h_pos_x(to), to.z-h_pos_z(to)); }
function h_pos_x(to){ return to.x; }
function h_pos_z(to){ return to.z; }
function angleDiff(a,b){ let d=a-b; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d; }

function updateHamster(h, dt){
  const u = h.root.userData;
  h.timer -= dt;

  switch(h.state){
    case 'idle':
      h.speed *= 0.8;
      if(h.timer<=0){
        if(Math.random()<0.14 && !h.wheeling){
          h.state='wheel'; h.target=wheelCenter.clone(); h.timer=2.5+Math.random()*2;
        } else {
          h.state='wander'; h.target=pickInterest(); h.timer=6+Math.random()*4;
        }
      }
      break;

    case 'wander': {
      const to=h.target;
      const dy = Math.atan2(to.x-h.pos.x, to.z-h.pos.z);
      h.yaw += angleDiff(dy, h.yaw)*Math.min(1,dt*4);
      const d = h.pos.distanceTo(to);
      if(d<0.4 || h.timer<=0){
        if(to.distanceTo(bowl.position)<0.55){ h.state='eat'; h.eating=true; h.timer=2.2+Math.random()*1.6; }
        else if(to.distanceTo(house.position)<0.7){ h.state='hide'; h.timer=1.8+Math.random()*2; }
        else { h.state='idle'; h.timer=0.6+Math.random()*1.4; }
      }
      h.speed = 1.5;
      break;
    }

    case 'eat': {
      const dy = Math.atan2(bowl.position.x-h.pos.x, bowl.position.z-h.pos.z);
      h.yaw += angleDiff(dy, h.yaw)*Math.min(1,dt*5);
      h.speed = 1.2;
      if(h.timer<=0){ h.state='idle'; h.eating=false; h.timer=0.5+Math.random(); }
      break;
    }

    case 'hide': {
      const dy = Math.atan2(house.position.x-h.pos.x, house.position.z-h.pos.z);
      h.yaw += angleDiff(dy, h.yaw)*Math.min(1,dt*4);
      h.speed = 1.0;
      if(h.timer<=0){ h.state='idle'; h.timer=0.6+Math.random(); }
      break;
    }

    case 'wheel': {
      // approach the wheel
      const to=h.target;
      const dy = Math.atan2(to.x-h.pos.x, to.z-h.pos.z);
      h.yaw += angleDiff(dy, h.yaw)*Math.min(1,dt*4);
      h.speed = 1.6;
      const dist = h.pos.distanceTo(to);
      if(dist > wheelRadius*0.7){
        // still approaching
      } else {
        // standing on the wheel: face outward & run in place
        const out = h.pos.clone().sub(wheelCenter); out.y=0;
        if(out.lengthSq()>1e-4) h.yaw += angleDiff(Math.atan2(out.x,out.z), h.yaw)*Math.min(1,dt*3);
        h.speed = 3.2;
        h.spin += dt*4.5;
      }
      if(h.timer<=0){ h.state='idle'; h.wheeling=false; h.timer=0.8+Math.random(); }
      break;
    }
  }

  // integrate movement (keep inside play area)
  const before = h.pos.clone();
  h.pos.x += Math.sin(h.yaw)*h.speed*dt;
  h.pos.z += Math.cos(h.yaw)*h.speed*dt;
  clampToPlay(h.pos);
  if(h.pos.distanceTo(before) < 1e-5 && h.speed>0.3){
    // hit a wall -> bounce direction
    h.yaw += Math.PI*(0.7+Math.random()*0.6);
  }

  // apply to mesh
  h.root.position.set(h.pos.x, h.pos.y + (h.state==='eat'?0.05:0), h.pos.z);
  h.root.rotation.y = h.yaw;

  // bob + leg swing
  const moving = h.speed>0.25;
  const bobAmp = moving ? 0.05 : 0.012;
  const rate = moving ? (h.speed*4.5) : 2.0;
  u.bobPhase += dt*rate;
  u.bob.position.y = moving ? Math.abs(Math.sin(u.bobPhase))*bobAmp : Math.sin(u.bobPhase*0.6)*bobAmp;
  const swing = moving ? Math.sin(u.bobPhase)*0.55 : 0;
  u.legs.forEach((lg,i)=>{ lg.rotation.x = ((i%2===0)?1:-1)*swing; });

  // head wobble
  u.head.rotation.z = Math.sin(u.bobPhase*0.7)*0.06;
  u.head.rotation.x = h.eating ? 0.35 + Math.sin(u.bobPhase*3)*0.06 : Math.sin(u.bobPhase*0.5)*0.04;
}

/* ============================================================
   INTERACTION
============================================================ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const toastEl = document.getElementById('toast');
let toastT;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>toastEl.classList.remove('show'), 1800);
}
function setPaused(p){
  paused = p;
  btnPause.querySelector('.tx').textContent = p ? 'Resume' : 'Pause';
  btnPause.querySelector('.ic').textContent = p ? '▶' : '⏸';
  btnPause.classList.toggle('on', p);
}
function setAuto(a){
  ctrl.autoRotate = a;
  btnAuto.classList.toggle('on', a);
  btnAuto.querySelector('.ic').classList.toggle('off', !a);
}
function resetView(){
  ctrl.theta=0.72; ctrl.phi=1.05; ctrl.radius=11.5;
  toast('View reset 🎯');
}

function pokeHamster(h){
  h.state='idle'; h.eating=false; h.wheeling=false;
  h.timer=0.3;
  h.yaw += (Math.random()-0.5)*2.4;
  toast(`You poked ${h.name}! ${['*scramble*','*squeak*','*zoomies!*','*wiggle*'][(Math.random()*4)|0]}`);
}
function pokeWheel(){
  for(const h of hamsters){
    if(!h.wheeling){
      h.state='wheel'; h.target=wheelCenter.clone(); h.timer=3.5; h.wheeling=true;
      toast(`${h.name} hopped onto the wheel! 🎡`);
      return;
    }
  }
  toast('Everyone is already running! 🎡');
}
function pokeBowl(){
  for(const h of hamsters){
    if(h.state!=='eat'){
      h.state='eat'; h.eating=true; h.target=bowl.position.clone(); h.timer=2.5;
      toast(`${h.name} found some seeds! 🌻`);
      return;
    }
  }
  toast('The bowl is full of munchers! 🌻');
}

function handlePointerDown(e){
  dragging = true; moved = false;
  lastX = e.clientX; lastY = e.clientY;
  canvas.style.cursor = 'grabbing';
}
function handlePointerMove(e){
  if(!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
  ctrl.theta -= dx*0.005;
  ctrl.phi = THREE.MathUtils.clamp(ctrl.phi - dy*0.005, 0.35, 1.45);
}
function handlePointerUp(e){
  dragging=false;
  canvas.style.cursor='grab';
  if(moved) return; // was a drag, not a click
  ndc.x = (e.clientX/innerWidth)*2-1;
  ndc.y = -(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects([wheel, bowl, ...hamsters.map(h=>h.root)], true);
  if(!hits.length) return;
  let obj = hits[0].object;
  while(obj && obj!==wheel && obj!==bowl && !hamsters.some(h=>h.root===obj)) obj = obj.parent;
  if(obj===wheel) pokeWheel();
  else if(obj===bowl) pokeBowl();
  else {
    const hh = hamsters.find(h=>h.root===obj);
    if(hh) pokeHamster(hh);
  }
}

let dragging=false, moved=false, lastX=0, lastY=0;
canvas.style.cursor='grab';
canvas.addEventListener('pointerdown', handlePointerDown);
window.addEventListener('pointermove', handlePointerMove);
window.addEventListener('pointerup', handlePointerUp);
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  ctrl.radius = THREE.MathUtils.clamp(ctrl.radius + e.deltaY*0.01, 6, 18);
}, {passive:false});

/* ============================================================
   UI WIRING
============================================================ */
let paused=false;
const btnPause=document.getElementById('btnPause');
const btnAuto=document.getElementById('btnAuto');
const btnReset=document.getElementById('btnReset');
btnPause.addEventListener('click', ()=>setPaused(!paused));
btnAuto.addEventListener('click', ()=>setAuto(!ctrl.autoRotate));
btnReset.addEventListener('click', resetView);
document.getElementById('speed').addEventListener('input', e=> timeScale=parseFloat(e.target.value));
document.getElementById('zoom').addEventListener('input', e=> ctrl.radius = 11.5*parseFloat(e.target.value));
setAuto(true);

/* floating emoji bits */
const EMOJI=['🌻','🥕','🍪','✨','🧀','🌰'];
const fl=document.getElementById('floaters');
for(let i=0;i<10;i++){
  const s=document.createElement('span');
  s.className='fl'; s.textContent=EMOJI[i%EMOJI.length];
  s.style.left=(Math.random()*100)+'%';
  s.style.fontSize=(18+Math.random()*18)+'px';
  s.style.animationDuration=(14+Math.random()*14)+'s';
  s.style.animationDelay=(-Math.random()*20)+'s';
  s.style.setProperty('--dx',(Math.random()*120-60)+'px');
  s.style.setProperty('--rot',(Math.random()*360-180)+'deg');
  fl.appendChild(s);
}

/* ============================================================
   RESIZE + LOOP
============================================================ */
function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  applyCamera();
}
addEventListener('resize', resize);
resize();

let timeScale=1, last=performance.now();
let firstFrame=true;
function animate(now){
  requestAnimationFrame(animate);
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  const sdt = paused?0:dt*timeScale;

  if(ctrl.autoRotate && !dragging) ctrl.theta += dt*0.12;
  applyCamera();

  // wheel spins when a hamster is running on it
  let running=0;
  for(const h of hamsters) if(h.wheeling && h.state==='wheel') running++;
  wheelSpin.rotation.z -= sdt*4.5*running;

  for(const h of hamsters) updateHamster(h, sdt);

  renderer.render(scene, camera);

  if(firstFrame){
    firstFrame=false;
    window.__zooReady = true;
    const v=document.getElementById('veil');
    if(v) v.classList.add('hide');
  }
}
requestAnimationFrame(animate);

} catch(err){
  fail('Something went wrong while building the scene: '+ (err && err.message ? err.message : err));
  throw err;
}
</script>
