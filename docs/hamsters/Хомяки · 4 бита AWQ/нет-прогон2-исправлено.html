<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Low-Poly Hamster Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg1:#ffe9d6; --bg2:#ffd9c2; --bg3:#fff2d6;
    --ink:#4a2f24; --ink-soft:#7a5646;
    --card:rgba(255,253,249,.84);
    --line:rgba(74,47,36,.14);
    --shadow:0 14px 34px rgba(120,70,40,.18);
    --amber:#ff9a3c; --coral:#ff6b5e; --mint:#5cc4a0; --blue:#5aa9e6; --pink:#ff8fb0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;
    background:
      radial-gradient(1100px 760px at 14% -12%, var(--bg1), transparent 62%),
      radial-gradient(1000px 720px at 102% -6%, var(--bg3), transparent 58%),
      radial-gradient(1200px 900px at 50% 128%, var(--bg2), transparent 72%),
      linear-gradient(160deg,#fff3e6 0%, #ffe6d2 55%, #ffe0cf 100%);
  }
  /* drifting ambient shapes */
  .ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55}
  .b1{width:220px;height:220px;background:radial-gradient(circle at 35% 30%,#ffd9a0,transparent 70%);top:8%;left:-60px;animation:drift1 22s ease-in-out infinite}
  .b2{width:180px;height:180px;background:radial-gradient(circle at 40% 35%,#c8ecd8,transparent 70%);bottom:6%;right:-40px;animation:drift2 26s ease-in-out infinite}
  .b3{width:120px;height:120px;background:radial-gradient(circle at 40% 35%,#ffc7d8,transparent 70%);top:40%;right:12%;animation:drift3 30s ease-in-out infinite}
  @keyframes drift1{50%{transform:translate(70px,50px) scale(1.15)}}
  @keyframes drift2{50%{transform:translate(-60px,-40px) scale(1.1)}}
  @keyframes drift3{50%{transform:translate(-40px,60px) rotate(20deg)}}

  canvas#scene{position:fixed;inset:0;z-index:1;display:block}

  .ui{position:fixed;inset:0;z-index:2;pointer-events:none}
  .panel{
    pointer-events:auto;background:var(--card);backdrop-filter:blur(9px);
    border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  }

  /* Brand */
  .brand{position:fixed;top:20px;left:22px;display:flex;gap:14px;align-items:center;padding:14px 20px 14px 14px}
  .badge{width:58px;height:58px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;
    background:linear-gradient(150deg,#fff,#ffe9d0);border:2px solid var(--line);
    animation:floaty 4s ease-in-out infinite}
  .badge svg{width:44px;height:44px}
  .brand h1{margin:0;font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(20px,2.4vw,30px);line-height:1;letter-spacing:.2px}
  .brand p{margin:5px 0 0;font-size:12.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.3px}

  /* Controls */
  .controls{position:fixed;top:20px;right:22px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;width:min(220px,42vw)}
  .row{display:flex;gap:10px;align-items:center}
  .row label{font-size:12px;font-weight:800;color:var(--ink-soft);min-width:52px}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:8px;
    background:linear-gradient(90deg,var(--amber),var(--coral));outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:#fff;border:3px solid var(--coral);box-shadow:0 3px 8px rgba(120,60,40,.3);transition:transform .15s}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18)}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--coral)}
  .toggles{display:flex;flex-wrap:wrap;gap:8px}
  .chip{pointer-events:auto;font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--ink);
    padding:8px 13px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer;
    transition:transform .15s,background .2s,color .2s,border-color .2s,box-shadow .2s}
  .chip:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(120,70,40,.16)}
  .chip.on{background:var(--coral);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(255,107,94,.4)}
  .chip.mint.on{background:var(--mint);box-shadow:0 6px 14px rgba(92,196,160,.4)}
  .chip.blue.on{background:var(--blue);box-shadow:0 6px 14px rgba(90,169,230,.4)}

  /* Log */
  .log{position:fixed;left:22px;bottom:22px;width:min(280px,72vw);padding:14px 16px}
  .log-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(92,196,160,.25);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(92,196,160,0)}}
  .log-head b{font-family:'Fredoka';font-weight:600;font-size:14px}
  .log-head span{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink-soft);letter-spacing:.5px}
  .log-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:150px;overflow:hidden}
  .log-list li{display:flex;gap:9px;align-items:center;font-size:13px;font-weight:700;animation:slideIn .35s ease both}
  @keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  .swatch{width:12px;height:12px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
  .log-list li:nth-child(n+4){opacity:.55}

  /* Hint */
  .hint{position:fixed;bottom:22px;right:22px;padding:11px 16px;font-size:12.5px;font-weight:700;color:var(--ink-soft);
    display:flex;align-items:center;gap:8px}
  .hint kbd{font-family:'Fredoka';font-weight:600;background:#fff;border:2px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--ink)}

  /* Loader */
  .loader{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:linear-gradient(160deg,#fff3e6,#ffe0cf);
    transition:opacity .5s;text-align:center}
  .loader.hide{opacity:0;pointer-events:none}
  .spin{width:52px;height:52px;margin:0 auto 16px;border-radius:50%;border:6px solid #ffd9bd;border-top-color:var(--coral);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loader p{font-family:'Fredoka';font-weight:600;color:var(--ink-soft)}

  @media (max-width:640px){
    .controls{width:auto;max-width:52vw}
    .log{width:min(240px,60vw)}
    .hint{display:none}
  }
</style>
</head>
<body>
  <div class="ambient">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  </div>

  <canvas id="scene"></canvas>

  <div class="ui">
    <header class="brand panel">
      <div class="badge">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="20" cy="18" r="9" fill="#ff9a3c"/><circle cx="44" cy="18" r="9" fill="#ff9a3c"/>
          <ellipse cx="32" cy="38" rx="22" ry="19" fill="#ffb457"/>
          <ellipse cx="32" cy="44" rx="13" ry="11" fill="#fff4ea"/>
          <circle cx="24" cy="34" r="3" fill="#4a2f24"/><circle cx="40" cy="34" r="3" fill="#4a2f24"/>
          <path d="M32 40 l-3 3 h6 z" fill="#ff6b5e"/>
        </svg>
      </div>
      <div>
        <h1>Hamster&nbsp;Playground</h1>
        <p>a tiny low‑poly world · three little lives</p>
      </div>
    </header>

    <section class="controls panel">
      <div class="row"><label for="speed">Speed</label><input id="speed" type="range" min="0.4" max="2.2" step="0.05" value="1"></div>
      <div class="toggles">
        <button class="chip on" id="auto">Auto‑orbit</button>
        <button class="chip mint on" id="sound">Sound</button>
        <button class="chip blue" id="reset">Reset view</button>
      </div>
    </section>

    <aside class="log panel">
      <div class="log-head"><span class="dot"></span><b>Activity</b><span>LIVE</span></div>
      <ul class="log-list" id="log"></ul>
    </aside>

    <div class="hint panel"><kbd>drag</kbd> orbit &nbsp;·&nbsp; <kbd>scroll</kbd> zoom &nbsp;·&nbsp; <kbd>click</kbd> a hamster</div>
  </div>

  <div class="loader" id="loader"><div><div class="spin"></div><p>warming up the cage…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  'use strict';
  const TAU = Math.PI*2;
  const rand=(a,b)=>a+Math.random()*(b-a);
  const pick=a=>a[(Math.random()*a.length)|0];
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const damp=(a,b,l,dt)=>a+(b-a)*(1-Math.exp(-l*dt));

  // ---------- palette ----------
  const FUR=[
    {name:'Butterscotch',body:0xffb457,belly:0xfff4ea,ear:0xff9a3c},
    {name:'Cocoa',       body:0xc98a5e,belly:0xf0dcc8,ear:0x9c6238},
    {name:'Snowball',    body:0xf3f0ec,belly:0xffffff,ear:0xdad3cd},
    {name:'Pebble',      body:0xb9b3ab,belly:0xe9e4dc,ear:0x8f8880},
    {name:'Berry',       body:0xff8fb0,belly:0xffe4ee,ear:0xff6f96},
  ];
  const WOOD=0xcaa06a, TRAY=0xffdca0, GLASS=0xbfeaff, MINT=0x5cc4a0, CORAL=0xff6b5e;

  // ---------- renderer / scene ----------
  const canvas=document.getElementById('scene');
  let renderer;
  try{
    renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  }catch(e){
    document.getElementById('loader').innerHTML='<div><p>😿 Your browser blocked WebGL.<br>Please try a modern browser.</p></div>';
    return;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  // No tone mapping: ACES was rolling every bright value toward a milky white,
  // washing out the hamsters and the wheel. Plain linear output keeps colors crisp.
  renderer.toneMapping=THREE.NoToneMapping;

  const scene=new THREE.Scene();
  scene.background=makeBg();
  // Gentle, far-reaching fog so it only adds a faint haze, never a white veil.
  scene.fog=new THREE.Fog(0xffe4d0,26,72);

  const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
  const HOME={pos:new THREE.Vector3(10,7,13),target:new THREE.Vector3(0,1.4,0)};
  camera.position.copy(HOME.pos);

  const controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.target.copy(HOME.target);
  controls.minDistance=7; controls.maxDistance=30;
  controls.minPolarAngle=0.15; controls.maxPolarAngle=Math.PI*0.49;
  controls.enablePan=false;
  controls.autoRotate=true; controls.autoRotateSpeed=0.55;
  controls.update();

  // ---------- lights (rebalanced so nothing blows out to white) ----------
  scene.add(new THREE.HemisphereLight(0xfff3e6,0xffcfa0,0.55));
  const sun=new THREE.DirectionalLight(0xfff0da,0.9);
  sun.position.set(8,14,7); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  const sc=sun.shadow.camera; sc.left=-10;sc.right=10;sc.top=10;sc.bottom=-10;sc.near=1;sc.far=40;
  sun.shadow.bias=-0.0004;
  scene.add(sun);
  const rim=new THREE.DirectionalLight(0xa9d8ff,0.22); rim.position.set(-8,6,-6); scene.add(rim);

  // ---------- material helpers ----------
  const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0},o));
  function box(w,h,d,c,x,y,z,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,o||{}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;}
  function cyl(rt,rb,h,c,x,y,z,seg,o){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(c,o||{}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;}
  function sphere(r,c,x,y,z,o){const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mat(c,o||{}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;}

  // ---------- cage ----------
  const cage=new THREE.Group(); scene.add(cage);
  // tray
  cage.add(box(10,0.5,7,TRAY,0,0.25,0,{roughness:0.7}));
  cage.add(box(9.4,0.12,6.4,0xffe9c2,0,0.56,0));
  // corner posts
  [[-4.6,3.4],[4.6,3.4],[-4.6,-3.4],[4.6,-3.4]].forEach(([x,z])=>cage.add(cyl(0.16,0.16,4.2,WOOD,x,2.1,z,10)));
  // rails
  cage.add(box(9.4,0.16,0.16,WOOD,0,4.2,3.4)); cage.add(box(9.4,0.16,0.16,WOOD,0,4.2,-3.4));
  cage.add(box(0.16,0.16,6.8,WOOD,-4.6,4.2,0)); cage.add(box(0.16,0.16,6.8,WOOD,4.6,4.2,0));
  cage.add(box(9.4,0.16,0.16,WOOD,0,2.5,3.4)); cage.add(box(9.4,0.16,0.16,WOOD,0,2.5,-3.4));
  cage.add(box(0.16,0.16,6.8,WOOD,-4.6,2.5,0)); cage.add(box(0.16,0.16,6.8,WOOD,4.6,2.5,0));
  // glass panels
  const glassMat=mat(GLASS,{transparent:true,opacity:0.16,roughness:0.05,side:THREE.DoubleSide});
  function glass(w,h,d,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),glassMat);m.position.set(x,y,z);m.renderOrder=2;return m;}
  cage.add(glass(9.2,3.6,0.06,0,2.3,3.35)); cage.add(glass(9.2,3.6,0.06,0,2.3,-3.35));
  cage.add(glass(0.06,3.6,6.6,-4.55,2.3,0)); cage.add(glass(0.06,3.6,6.6,4.55,2.3,0));
  // top lid frame
  cage.add(box(9.6,0.14,0.2,WOOD,0,4.35,3.4)); cage.add(box(9.6,0.14,0.2,WOOD,0,4.35,-3.4));
  cage.add(box(0.2,0.14,7,WOOD,-4.7,4.35,0)); cage.add(box(0.2,0.14,7,WOOD,4.7,4.35,0));
  // door frame + handle
  cage.add(box(0.5,1.2,0.2,WOOD,3.2,3.2,3.42));
  cage.add(box(0.16,0.16,0.3,CORAL,3.2,3.2,3.55));

  // ---------- interactive objects ----------
  // wheel
  const wheelGroup=new THREE.Group(); wheelGroup.position.set(-2.7,0,2.3); scene.add(wheelGroup);
  wheelGroup.add(cyl(0.12,0.12,0.7,MINT,0,0.35,0,10));
  wheelGroup.add(box(0.9,0.12,0.9,MINT,0,0.06,0));
  const wheelSpin=new THREE.Group(); wheelSpin.position.y=1.05; wheelGroup.add(wheelSpin);
  const RIM_R=0.95;
  for(let i=0;i<8;i++){
    const a=i/8*TAU, spoke=new THREE.Mesh(new THREE.BoxGeometry(0.09,RIM_R,0.09),mat(WOOD));
    spoke.position.set(Math.cos(a)*RIM_R*0.5,0,Math.sin(a)*RIM_R*0.5);
    spoke.quaternion.setFromAxisAngle(new THREE.Vector3(0,1,0),-a+Math.PI/2);
    spoke.castShadow=true; wheelSpin.add(spoke);
  }
  for(let i=0;i<12;i++){
    const a=i/12*TAU, hub=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.14,0.14),mat(CORAL));
    hub.position.set(Math.cos(a)*RIM_R,0,Math.sin(a)*RIM_R);
    hub.quaternion.setFromAxisAngle(new THREE.Vector3(0,1,0),-a+Math.PI/2);
    hub.castShadow=true; wheelSpin.add(hub);
  }
  wheelSpin.rotation.z=Math.PI/2; // stand upright facing +Z
  const WHEEL={x:-2.7,z:2.3,spin:wheelSpin};

  // food bowl
  const bowl=new THREE.Group(); bowl.position.set(2.6,0,-2.4); scene.add(bowl);
  bowl.add(cyl(0.55,0.4,0.14,0xe05a4e,0,0.07,0,14));
  bowl.add(cyl(0.42,0.3,0.14,0x8a3a34,0,0.16,0,14));
  const seeds=[];
  for(let i=0;i<7;i++){seeds.push(sphere(0.08,pick([0x7ec850,0xf0a83a,0xc85a4e]),rand(-0.2,0.2),0.24,rand(-0.2,0.2)));bowl.add(seeds[i]);}
  const BOWL={x:2.6,z:-2.4,seeds};

  // tunnel
  const tunnel=new THREE.Group(); tunnel.position.set(0.2,0,0.4); tunnel.rotation.y=0.5; scene.add(tunnel);
  tunnel.add(box(2.4,0.85,1.25,0x8fd0ff,0,0.42,0,{roughness:0.6}));
  tunnel.add(box(2.4,0.14,1.3,0x6fb8ef,0,0.86,0));
  tunnel.add(box(1.0,0.7,0.06,0x2f6f9c,1.15,0.4,0));   // dark opening
  const TUNNEL={x:0.2,z:0.4,angle:0.5};

  // ---------- decorations ----------
  // grass tufts
  for(let i=0;i<10;i++){
    const g=new THREE.Group(); const x=rand(-4,4),z=rand(-2.6,2.6);
    for(let j=0;j<3;j++){
      const s=new THREE.Mesh(new THREE.ConeGeometry(0.09,rand(0.5,0.9),5),mat(pick([0x6fc96a,0x8fd96a,0x57b866])));
      s.position.set(rand(-0.15,0.15),0.35,rand(-0.15,0.15)); s.rotation.set(rand(-0.2,0.2),0,rand(-0.2,0.2));
      s.castShadow=true; g.add(s);
    }
    g.position.set(x,0.6,z); scene.add(g);
  }
  // scatter pellets
  for(let i=0;i<12;i++){
    const p=sphere(0.07,pick([0x7ec850,0xf0a83a,0xc85a4e,0x9c6238]),rand(-4,4),0.63,rand(-2.6,2.6));
    scene.add(p);
  }
  // hay pile
  const hay=new THREE.Group(); hay.position.set(-3.4,0.6,-2.2);
  for(let i=0;i<6;i++)hay.add(box(rand(0.3,0.5),0.14,rand(0.3,0.5),pick([0xdcb870,0xe8c98a]),rand(-0.3,0.3),i*0.12,rand(-0.3,0.3)));
  scene.add(hay);

  // ---------- floating particles ----------
  const P=48, pPos=new Float32Array(P*3), pBase=[];
  for(let i=0;i<P;i++){
    pBase.push({x:rand(-4,4),y:rand(0.7,4),z:rand(-3,3),s:rand(0.15,0.5),ph:rand(0,TAU)});
    pPos[i*3]=pBase[i].x; pPos[i*3+1]=pBase[i].y; pPos[i*3+2]=pBase[i].z;
  }
  const pGeo=new THREE.BufferGeometry(); pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  scene.add(new THREE.Points(pGeo,new THREE.PointsMaterial({color:0xfff0d0,size:0.12,transparent:true,opacity:0.7,sizeAttenuation:true})));

  // ---------- hamsters ----------
  const hamsters=[];
  function makeHamster(fur){
    const g=new THREE.Group(); g.position.y=0.6;
    const bodyM=mat(fur.body,{roughness:0.9});
    const bellyM=mat(fur.belly,{roughness:0.9});
    const earM=mat(fur.ear,{roughness:0.9});
    const eyeM=mat(0x2a1c14,{roughness:0.4});
    const noseM=mat(0xff7d95,{roughness:0.5});

    const body=sphere(0.5,fur.body,0,0.32,0); body.scale.set(1.15,0.9,1.05); g.add(body);
    const head=sphere(0.38,fur.body,0.34,0.5,0); head.scale.set(1,0.95,0.95); g.add(head);
    const belly=sphere(0.34,fur.belly,0.18,0.16,0.16); belly.scale.set(1,0.85,1); g.add(belly);
    const eyeL=sphere(0.06,0x2a1c14,0.14,0.58,0.16); const eyeR=sphere(0.06,0x2a1c14,0.14,0.58,-0.16);
    const hl=sphere(0.025,0xffffff,0.155,0.6,0.17); const hr=sphere(0.025,0xffffff,0.155,0.6,-0.17);
    g.add(eyeL,eyeR,hl,hr);
    const nose=sphere(0.05,noseM,0.5,0.44,0); g.add(nose);
    const earL=sphere(0.14,earM,-0.1,0.85,0.2); const earR=sphere(0.14,earM,-0.1,0.85,-0.2);
    const eil=sphere(0.08,fur.belly,-0.08,0.85,0.2); const eir=sphere(0.08,fur.belly,-0.08,0.85,-0.2);
    g.add(earL,earR,eil,eir);
    const tail=cyl(0.05,0.02,0.28,fur.body,-0.55,0.3,0,6); tail.rotation.z=Math.PI/2; g.add(tail);

    const legs=[];
    [[0.34,0.2],[0.34,-0.2],[-0.34,0.2],[-0.34,-0.2]].forEach(([x,z])=>{
      const leg=sphere(0.13,fur.body,x,0.13,z); leg.scale.set(1,0.8,1); g.add(leg); legs.push(leg);
    });

    return {group:g,head,legs,name:fur.name,color:'#'+fur.body.toString(16).padStart(6,'0'),
      pos:g.position,vel:new THREE.Vector3(),state:'wander',timer:rand(1,3),
      target:new THREE.Vector3(),desired:new THREE.Vector3(),heading:0,phase:rand(0,TAU),
      bob:0,interact:null,interactTimer:0,blink:0,blinkTimer:rand(1,4)};
  }
  [FUR[0],FUR[1],FUR[4]].forEach((f,i)=>{
    const h=makeHamster(f);
    h.pos.set(rand(-2,2),0.6,rand(-1,1));
    hamsters.push(h); scene.add(h.group);
  });

  // ---------- behavior ----------
  const WALK=0.9, TURN=1.5, INTERACT=1.2;
  const BOUNDS={xMin:-4.1,xMax:4.1,zMin:-2.9,zMax:2.9};

  function randomTarget(h){
    if(Math.random()<0.4){
      const o=pick([WHEEL,BOWL,TUNNEL]);
      h.target.set(o.x+rand(-0.5,0.5),0,o.z+rand(-0.5,0.5));
    }else{
      h.target.set(rand(BOUNDS.xMin,BOUNDS.xMax),0,rand(BOUNDS.zMin,BOUNDS.zMax));
    }
  }
  function nearestObject(h){
    let best=null,bd=1e9;
    [WHEEL,BOWL,TUNNEL].forEach(o=>{const d=h.pos.distanceTo(new THREE.Vector3(o.x,0,o.z));if(d<bd){bd=d;best=o;}});
    return {obj:best,dist:bd};
  }
  function startInteract(h,obj){
    h.state='interact'; h.interact=obj; h.timer=0; h.vel.set(0,0,0);
    log(h.name+' is '+ (obj===WHEEL?'running the wheel':obj===BOWL?'snacking':'exploring the tunnel'));
  }

  function updateHamster(h,dt){
    h.phase+=dt;
    // blink
    h.blinkTimer-=dt;
    if(h.blinkTimer<=0){h.blink=0.13;h.blinkTimer=rand(2,5);}
    if(h.blink>0)h.blink-=dt;
    h.head.rotation.y=damp(h.head.rotation.y,h.blink>0?0:Math.sin(h.phase*0.6)*0.25,8,dt);

    // state machine
    h.timer-=dt;
    if(h.state==='wander'){
      if(h.timer<=0){randomTarget(h);h.timer=rand(2.5,5.5);}
      const dx=h.target.x-h.pos.x, dz=h.target.z-h.pos.z, dist=Math.hypot(dx,dz);
      if(dist<0.6){
        const {obj,dist:od}=nearestObject(h);
        if(od<1.5){startInteract(h,obj);return;}
        h.state='pause'; h.timer=rand(0.6,1.6); h.vel.set(0,0,0);
      }else{
        const want=Math.atan2(dx,dz);
        h.heading=dampAngle(h.heading,want,4,dt);
        h.vel.set(Math.sin(h.heading)*WALK,0,Math.cos(h.heading)*WALK);
      }
    }else if(h.state==='pause'){
      h.vel.multiplyScalar(Math.max(0,1-dt*6));
      if(h.timer<=0){h.state='wander';randomTarget(h);h.timer=rand(2,5);}
    }else if(h.state==='interact'){
      h.vel.multiplyScalar(Math.max(0,1-dt*8));
      const obj=h.interact;
      if(obj===WHEEL){
        // face the wheel
        const fx=WHEEL.x-h.pos.x, fz=WHEEL.z-h.pos.z;
        h.heading=dampAngle(h.heading,Math.atan2(fx,fz),6,dt);
        WHEEL.spin.rotation.z-=dt*5.5;
        h.bob=Math.abs(Math.sin(h.phase*16))*0.12;
      }else if(obj===BOWL){
        const fx=BOWL.x-h.pos.x, fz=BOWL.z-h.pos.z;
        h.heading=dampAngle(h.heading,Math.atan2(fx,fz),6,dt);
        h.bob=Math.abs(Math.sin(h.phase*10))*0.05;
        if(h.interactTimer===undefined)h.interactTimer=0;
        h.interactTimer+=dt;
        if(h.interactTimer>1.1){ // eat a seed
          h.interactTimer=0;
          const s=BOWL.seeds.find(x=>x.visible);
          if(s){s.visible=false;spawnCrumb(h.pos);log(h.name+' nibbled a seed');}
          else{ // refill
            BOWL.seeds.forEach(s=>s.visible=true);
            log(h.name+' finished the bowl');
            h.state='wander';h.timer=rand(1,3);
          }
        }
      }else{ // tunnel
        const fx=TUNNEL.x-h.pos.x, fz=TUNNEL.z-h.pos.z;
        h.heading=dampAngle(h.heading,Math.atan2(fx,fz),6,dt);
        h.bob=Math.abs(Math.sin(h.phase*6))*0.04;
      }
      if(h.timer<=0){h.state='wander';h.timer=rand(2,5);h.interact=null;randomTarget(h);}
    }

    // integrate
    h.pos.addScaledVector(h.vel,dt);
    h.pos.x=clamp(h.pos.x,BOUNDS.xMin,BOUNDS.xMax);
    h.pos.z=clamp(h.pos.z,BOUNDS.zMin,BOUNDS.zMax);
    h.group.rotation.y=damp(h.group.rotation.y,h.heading,10,dt);

    // gait / idle
    const speed=h.vel.length();
    h.bob=damp(h.bob,speed>0.1?Math.abs(Math.sin(h.phase*10))*0.06:0,10,dt);
    h.group.position.y=0.6+h.bob;
    const stride=Math.min(speed*3,1);
    h.legs.forEach((leg,i)=>{
      const off=(i%2===0)?1:-1;
      leg.position.y=0.13+Math.sin(h.phase*10+i*1.57)*0.05*stride*off;
    });
  }
  function dampAngle(a,b,l,dt){
    let d=((b-a+Math.PI)%TAU)-Math.PI; if(d<-Math.PI)d+=TAU;
    return a+d*(1-Math.exp(-l*dt));
  }
  function spawnCrumb(p){
    const c=sphere(0.05,0x7ec850,p.x,0.63,p.z); scene.add(c); crumbs.push({m:c,t:1});
  }
  const crumbs=[];
  function updateCrumbs(dt){
    for(let i=crumbs.length-1;i>=0;i--){const c=crumbs[i];c.t-=dt;if(c.t<=0){scene.remove(c.m);crumbs.splice(i,1);}}
  }

  // ---------- particles ----------
  function updateParticles(t){
    for(let i=0;i<P;i++){
      const b=pBase[i];
      pPos[i*3]=b.x+Math.sin(t*b.s+b.ph)*0.6;
      pPos[i*3+1]=b.y+Math.sin(t*0.5+b.ph)*0.4;
      pPos[i*3+2]=b.z+Math.cos(t*b.s*0.8+b.ph)*0.6;
    }
    pGeo.attributes.position.needsUpdate=true;
  }

  // ---------- background gradient texture ----------
  function makeBg(){
    const c=document.createElement('canvas');c.width=8;c.height=256;
    const ctx=c.getContext('2d');
    const g=ctx.createLinearGradient(0,0,0,256);
    g.addColorStop(0,'#ffe7d1');g.addColorStop(0.5,'#ffddc4');g.addColorStop(1,'#ffd0b6');
    ctx.fillStyle=g;ctx.fillRect(0,0,8,256);
    const tex=new THREE.CanvasTexture(c);tex.encoding=THREE.sRGBEncoding;return tex;
  }

  // ---------- sound (tiny blips) ----------
  let AC=null,muted=false;
  function blip(freq){
    if(muted)return;
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.06,AC.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.18);
      o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+0.2);
    }catch(e){}
  }

  // ---------- UI ----------
  const logEl=document.getElementById('log');
  function log(msg){
    const li=document.createElement('li');
    const sw=document.createElement('span');sw.className='swatch';
    sw.style.background=pick(['#ff9a3c','#c98a5e','#ff8fb0','#5cc4a0','#5aa9e6']);
    const tx=document.createElement('span');tx.textContent=msg;
    li.appendChild(sw);li.appendChild(tx);
    logEl.prepend(li);
    while(logEl.children.length>5)logEl.removeChild(logEl.lastChild);
  }
  const speedInput=document.getElementById('speed');
  let timeScale=1;
  speedInput.addEventListener('input',()=>timeScale=parseFloat(speedInput.value));

  const autoBtn=document.getElementById('auto');
  autoBtn.addEventListener('click',()=>{controls.autoRotate=!controls.autoRotate;autoBtn.classList.toggle('on',controls.autoRotate);});
  const soundBtn=document.getElementById('sound');
  soundBtn.classList.add('on');
  soundBtn.addEventListener('click',()=>{muted=!muted;soundBtn.classList.toggle('on',!muted);if(!muted)blip(660);});
  document.getElementById('reset').addEventListener('click',()=>{
    camera.position.copy(HOME.pos);controls.target.copy(HOME.target);controls.update();
  });
  controls.addEventListener('start',()=>{controls.autoRotate=false;autoBtn.classList.remove('on');});

  // click a hamster → hop
  const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
  let downXY=null;
  canvas.addEventListener('pointerdown',e=>{downXY=[e.clientX,e.clientY];});
  canvas.addEventListener('pointerup',e=>{
    if(!downXY)return;
    if(Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1])>6){downXY=null;return;}
    ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(ptr,camera);
    const hits=ray.intersectObjects(hamsters.map(h=>h.group),true);
    if(hits.length){
      let o=hits[0].object;
      while(o&&!hamsters.some(h=>h.group===o))o=o.parent;
      const h=hamsters.find(x=>x.group===o);
      if(h){h.bob=0.35;blip(880);log(h.name+' did a happy hop!');}
    }
    downXY=null;
  });

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  // ---------- loop ----------
  const clock=new THREE.Clock();
  let elapsed=0;
  function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(clock.getDelta(),0.05)*timeScale;
    elapsed+=dt;
    controls.update();
    hamsters.forEach(h=>updateHamster(h,dt));
    updateCrumbs(dt);
    updateParticles(elapsed);
    // gentle idle wheel drift when nobody is using it
    WHEEL.spin.rotation.z-=dt*0.05;
    renderer.render(scene,camera);
  }
  animate();

  // reveal
  setTimeout(()=>{
    document.getElementById('loader').classList.add('hide');
    log('The hamsters woke up 🐹');
  },350);
})();
</script>
</body>
</html>
