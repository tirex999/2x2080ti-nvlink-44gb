</style>

<body>
<div id="title">🐹 Low-Poly Hamster Playground</div>
<div id="info">Drag to rotate • Scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── SCENE SETUP ───────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 20, 40);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6, 5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 4;
controls.maxDistance = 20;

// ─── LIGHTING ──────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff4e0, 1.2);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -8;
dirLight.shadow.camera.right = 8;
dirLight.shadow.camera.top = 8;
dirLight.shadow.camera.bottom = -8;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xaaccff, 0.3);
fillLight.position.set(-5, 3, -5);
scene.add(fillLight);

// ─── MATERIALS HELPER ──────────────────────────────────────────
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.8, metalness: 0.1, ...opts });
}

// ─── FLOOR / TRAY ──────────────────────────────────────────────
const CAGE_W = 8, CAGE_D = 6, CAGE_H = 2.5;

// Ground plane
const groundGeo = new THREE.PlaneGeometry(30, 30);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x7ec850, flatShading: true, roughness: 1 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.5;
ground.receiveShadow = true;
scene.add(ground);

// Tray
const trayGeo = new THREE.BoxGeometry(CAGE_W, 0.3, CAGE_D);
const trayMat = mat(0xf5e6c8);
const tray = new THREE.Mesh(trayGeo, trayMat);
tray.position.y = -0.15;
tray.receiveShadow = true;
tray.castShadow = true;
scene.add(tray);

// Bedding (scattered small colored cubes)
const beddingColors = [0xf5e6c8, 0xe8d5a3, 0xf0dcc0, 0xd4b896];
for (let i = 0; i < 60; i++) {
  const s = 0.08 + Math.random() * 0.1;
  const geo = new THREE.BoxGeometry(s, s * 0.5, s);
  const m = mat(beddingColors[Math.floor(Math.random() * beddingColors.length)]);
  const piece = new THREE.Mesh(geo, m);
  piece.position.set(
    (Math.random() - 0.5) * (CAGE_W - 0.5),
    0.05,
    (Math.random() - 0.5) * (CAGE_D - 0.5)
  );
  piece.rotation.y = Math.random() * Math.PI;
  piece.receiveShadow = true;
  scene.add(piece);
}

// ─── CAGE WALLS (wire bars) ───────────────────────────────────
function createCageWalls() {
  const group = new THREE.Group();
  const barMat = mat(0xc0c0c0, { metalness: 0.6, roughness: 0.3 });
  const barRadius = 0.03;
  const spacing = 0.5;

  function addBars(length, pos, rotY) {
    const barCount = Math.floor(length / spacing);
    for (let i = 0; i <= barCount; i++) {
      const barGeo = new THREE.CylinderGeometry(barRadius, barRadius, CAGE_H, 5);
      const bar = new THREE.Mesh(barGeo, barMat);
      const offset = -length / 2 + i * spacing;
      if (rotY === 0) {
        bar.position.set(pos.x + offset, CAGE_H / 2, pos.z);
      } else {
        bar.position.set(pos.x, CAGE_H / 2, pos.z + offset);
      }
      bar.castShadow = true;
      group.add(bar);
    }
    // Top rail
    const railGeo = new THREE.CylinderGeometry(barRadius * 1.5, barRadius * 1.5, length, 5);
    const rail = new THREE.Mesh(railGeo, barMat);
    rail.rotation.z = Math.PI / 2;
    if (rotY === 0) {
      rail.position.set(pos.x, CAGE_H, pos.z);
    } else {
      rail.rotation.z = 0;
      rail.rotation.x = Math.PI / 2;
      rail.position.set(pos.x, CAGE_H, pos.z);
    }
    group.add(rail);
  }

  // Front wall (z = CAGE_D/2)
  addBars(CAGE_W, { x: 0, z: CAGE_D / 2 }, 0);
  // Back wall (z = -CAGE_D/2)
  addBars(CAGE_W, { x: 0, z: -CAGE_D / 2 }, 0);
  // Left wall (x = -CAGE_W/2)
  addBars(CAGE_D, { x: -CAGE_W / 2, z: 0 }, Math.PI / 2);
  // Right wall (x = CAGE_W/2)
  addBars(CAGE_D, { x: CAGE_W / 2, z: 0 }, Math.PI / 2);

  // Corner posts
  const postGeo = new THREE.CylinderGeometry(0.05, 0.05, CAGE_H, 6);
  [[-CAGE_W/2, -CAGE_D/2], [CAGE_W/2, -CAGE_D/2], [-CAGE_W/2, CAGE_D/2], [CAGE_W/2, CAGE_D/2]].forEach(([x, z]) => {
    const post = new THREE.Mesh(postGeo, barMat);
    post.position.set(x, CAGE_H / 2, z);
    post.castShadow = true;
    group.add(post);
  });

  return group;
}
scene.add(createCageWalls());

// ─── EXERCISE WHEEL ───────────────────────────────────────────
const wheelGroup = new THREE.Group();
wheelGroup.position.set(-2.5, 0, -1.5);

// Wheel rim
const rimGeo = new THREE.TorusGeometry(0.7, 0.06, 6, 16);
const rimMat = mat(0xff6b6b);
const rim = new THREE.Mesh(rimGeo, rimMat);
rim.castShadow = true;
wheelGroup.add(rim);

// Wheel spokes
for (let i = 0; i < 4; i++) {
  const spokeGeo = new THREE.CylinderGeometry(0.025, 0.025, 1.4, 5);
  const spoke = new THREE.Mesh(spokeGeo, mat(0xff8888));
  spoke.rotation.z = (i / 4) * Math.PI;
  wheelGroup.add(spoke);
}

// Wheel stand
const standGeo = new THREE.CylinderGeometry(0.04, 0.06, 0.8, 6);
const standMat = mat(0xaaa);
const standL = new THREE.Mesh(standGeo, standMat);
standL.position.set(-0.3, 0.4, 0);
standL.rotation.z = 0.2;
wheelGroup.add(standL);
const standR = new THREE.Mesh(standGeo, standMat);
standR.position.set(0.3, 0.4, 0);
standR.rotation.z = -0.2;
wheelGroup.add(standR);

// Base
const baseGeo = new THREE.BoxGeometry(1, 0.1, 0.5);
const base = new THREE.Mesh(baseGeo, mat(0x888));
base.position.y = 0.05;
base.castShadow = true;
wheelGroup.add(base);

scene.add(wheelGroup);

// ─── FOOD BOWL ─────────────────────────────────────────────────
const bowlGroup = new THREE.Group();
bowlGroup.position.set(2.5, 0, 1.5);

const bowlGeo = new THREE.CylinderGeometry(0.4, 0.3, 0.15, 8);
const bowl = new THREE.Mesh(bowlGeo, mat(0x4ecdc4));
bowl.position.y = 0.075;
bowl.castShadow = true;
bowlGroup.add(bowl);

// Food pellets in bowl
for (let i = 0; i < 6; i++) {
  const pelletGeo = new THREE.SphereGeometry(0.06, 5, 4);
  const pellet = new THREE.Mesh(pelletGeo, mat(0xd4a030));
  pellet.position.set((Math.random() - 0.5) * 0.4, 0.15, (Math.random() - 0.5) * 0.4);
  bowlGroup.add(pellet);
}
scene.add(bowlGroup);

// Scattered food pellets on floor
for (let i = 0; i < 10; i++) {
  const pelletGeo = new THREE.SphereGeometry(0.05, 5, 4);
  const pellet = new THREE.Mesh(pelletGeo, mat(0xd4a030));
  pellet.position.set((Math.random() - 0.5) * 5, 0.05, (Math.random() - 0.5) * 4);
  scene.add(pellet);
}

// ─── TUNNEL ────────────────────────────────────────────────────
const tunnelGroup = new THREE.Group();
tunnelGroup.position.set(1, 0, -1.5);
tunnelGroup.rotation.y = -0.3;

const tunnelGeo = new THREE.CylinderGeometry(0.35, 0.35, 1.2, 8, 1, true, 0, Math.PI);
const tunnelMat = mat(0xff9f43, { side: THREE.DoubleSide });
const tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
tunnel.rotation.z = Math.PI / 2;
tunnel.position.y = 0.35;
tunnel.castShadow = true;
tunnelGroup.add(tunnel);

// Tunnel end caps
const capGeo = new THREE.CircleGeometry(0.35, 8);
const cap1 = new THREE.Mesh(capGeo, mat(0xe8873a, { side: THREE.DoubleSide }));
cap1.position.set(-0.6, 0.35, 0);
cap1.rotation.y = Math.PI / 2;
tunnelGroup.add(cap1);
const cap2 = new THREE.Mesh(capGeo, mat(0xe8873a, { side: THREE.DoubleSide }));
cap2.position.set(0.6, 0.35, 0);
cap2.rotation.y = -Math.PI / 2;
tunnelGroup.add(cap2);

scene.add(tunnelGroup);

// ─── SMALL HOUSE ───────────────────────────────────────────────
const houseGroup = new THREE.Group();
houseGroup.position.set(-2, 0, 1.8);

const houseBodyGeo = new THREE.BoxGeometry(0.8, 0.6, 0.7);
const houseBody = new THREE.Mesh(houseBodyGeo, mat(0x74b9ff));
houseBody.position.y = 0.3;
houseBody.castShadow = true;
houseGroup.add(houseBody);

const roofGeo = new THREE.ConeGeometry(0.65, 0.4, 4);
const roof = new THREE.Mesh(roofGeo, mat(0xef476f));
roof.position.y = 0.8;
roof.rotation.y = Math.PI / 4;
roof.castShadow = true;
houseGroup.add(roof);

// Door
const doorGeo = new THREE.CircleGeometry(0.15, 6);
const door = new THREE.Mesh(doorGeo, mat(0x2d3436));
door.position.set(0, 0.2, 0.36);
houseGroup.add(door);

scene.add(houseGroup);

// ─── HAMSTER CLASS ─────────────────────────────────────────────
class Hamster {
  constructor(bodyColor, bellyColor, name) {
    this.name = name;
    this.group = new THREE.Group();
    this.heading = Math.random() * Math.PI * 2;
    this.speed = 0.015 + Math.random() * 0.01;
    this.state = 'walk';
    this.stateTimer = 0;
    this.target = this.randomTarget();
    this.wheelSpeed = 0;
    this.bobOffset = Math.random() * Math.PI * 2;
    this.legPhase = Math.random() * Math.PI * 2;

    this.buildMesh(bodyColor, bellyColor);
    this.group.position.set(
      (Math.random() - 0.5) * 5,
      0,
      (Math.random() - 0.5) * 3.5
    );
    scene.add(this.group);
  }

  buildMesh(bodyColor, bellyColor) {
    const bMat = mat(bodyColor);
    const bellyMat = mat(bellyColor);
    const eyeMat = mat(0x1a1a1a);
    const noseMat = mat(0xff69b4);
    const earMat = mat(bodyColor);
    const footMat = mat(0xffccaa);

    // Body (elongated sphere)
    const bodyGeo = new THREE.SphereGeometry(0.25, 7, 6);
    const body = new THREE.Mesh(bodyGeo, bMat);
    body.scale.set(1.3, 0.9, 1);
    body.position.y = 0.22;
    body.castShadow = true;
    this.group.add(body);

    // Belly
    const bellyGeo = new THREE.SphereGeometry(0.18, 6, 5);
    const belly = new THREE.Mesh(bellyGeo, bellyMat);
    belly.scale.set(1.1, 0.7, 0.9);
    belly.position.set(0, 0.18, 0.05);
    this.group.add(belly);

    // Head
    const headGeo = new THREE.SphereGeometry(0.18, 7, 6);
    const head = new THREE.Mesh(headGeo, bMat);
    head.position.set(0.3, 0.28, 0);
    head.castShadow = true;
    this.group.add(head);

    // Snout
    const snoutGeo = new THREE.SphereGeometry(0.08, 5, 4);
    const snout = new THREE.Mesh(snoutGeo, bellyMat);
    snout.position.set(0.42, 0.24, 0);
    this.group.add(snout);

    // Nose
    const noseGeo = new THREE.SphereGeometry(0.03, 5, 4);
    const nose = new THREE.Mesh(noseGeo, noseMat);
    nose.position.set(0.48, 0.25, 0);
    this.group.add(nose);

    // Eyes
    const eyeGeo = new THREE.SphereGeometry(0.035, 5, 4);
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(0.38, 0.33, 0.08);
    this.group.add(eyeL);
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR.position.set(0.38, 0.33, -0.08);
    this.group.add(eyeR);

    // Eye highlights
    const hlGeo = new THREE.SphereGeometry(0.012, 4, 3);
    const hlMat = mat(0xffffff);
    const hlL = new THREE.Mesh(hlGeo, hlMat);
    hlL.position.set(0.39, 0.34, 0.09);
    this.group.add(hlL);
    const hlR = new THREE.Mesh(hlGeo, hlMat);
    hlR.position.set(0.39, 0.34, -0.07);
    this.group.add(hlR);

    // Ears
    const earGeo = new THREE.SphereGeometry(0.06, 5, 4);
    const earL = new THREE.Mesh(earGeo, earMat);
    earL.position.set(0.28, 0.42, 0.1);
    earL.scale.set(0.8, 1.2, 0.8);
    this.group.add(earL);
    const earR = new THREE.Mesh(earGeo, earMat);
    earR.position.set(0.28, 0.42, -0.1);
    earR.scale.set(0.8, 1.2, 0.8);
    this.group.add(earR);

    // Inner ears
    const innerEarGeo = new THREE.SphereGeometry(0.035, 4, 3);
    const innerEarMat = mat(0xffb6c1);
    const ieL = new THREE.Mesh(innerEarGeo, innerEarMat);
    ieL.position.set(0.28, 0.43, 0.11);
    this.group.add(ieL);
    const ieR = new THREE.Mesh(innerEarGeo, innerEarMat);
    ieR.position.set(0.28, 0.43, -0.11);
    this.group.add(ieR);

    // Feet (4 small boxes)
    const footGeo = new THREE.BoxGeometry(0.08, 0.06, 0.06);
    const footPositions = [
      [0.15, 0.03, 0.1], [0.15, 0.03, -0.1],
      [-0.15, 0.03, 0.1], [-0.15, 0.03, -0.1]
    ];
    this.feet = [];
    footPositions.forEach(([x, y, z]) => {
      const foot = new THREE.Mesh(footGeo, footMat);
      foot.position.set(x, y, z);
      this.group.add(foot);
      this.feet.push(foot);
    });

    // Tiny tail
    const tailGeo = new THREE.SphereGeometry(0.04, 4, 3);
    const tail = new THREE.Mesh(tailGeo, bMat);
    tail.position.set(-0.35, 0.22, 0);
    this.group.add(tail);

    // Cheeks (fluffy puffs)
    const cheekGeo = new THREE.SphereGeometry(0.06, 5, 4);
    const cheekMat = mat(bellyColor);
    const cheekL = new THREE.Mesh(cheekGeo, cheekMat);
    cheekL.position.set(0.35, 0.2, 0.12);
    this.group.add(cheekL);
    const cheekR = new THREE.Mesh(cheekGeo, cheekMat);
    cheekR.position.set(0.35, 0.2, -0.12);
    this.group.add(cheekR);
  }

  randomTarget() {
    return new THREE.Vector3(
      (Math.random() - 0.5) * (CAGE_W - 1.5),
      0,
      (Math.random() - 0.5) * (CAGE_D - 1.5)
    );
  }

  update(dt) {
    this.stateTimer -= dt;

    switch (this.state) {
      case 'walk': {
        // Move toward target
        const dx = this.target.x - this.group.position.x;
        const dz = this.target.z - this.group.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist < 0.3) {
          this.state = 'pause';
          this.stateTimer = 0.5 + Math.random() * 2;
          break;
        }

        // Smoothly turn toward target
        const targetAngle = Math.atan2(dx, dz);
        let angleDiff = targetAngle - this.heading;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        this.heading += angleDiff * 0.05;

        // Move
        this.group.position.x += Math.sin(this.heading) * this.speed;
        this.group.position.z += Math.cos(this.heading) * this.speed;

        // Clamp to cage bounds
        this.group.position.x = THREE.MathUtils.clamp(this.group.position.x, -CAGE_W/2 + 0.5, CAGE_W/2 - 0.5);
        this.group.position.z = THREE.MathUtils.clamp(this.group.position.z, -CAGE_D/2 + 0.5, CAGE_D/2 - 0.5);

        // Check if near wheel
        const wheelDist = this.group.position.distanceTo(wheelGroup.position);
        if (wheelDist < 0.8 && Math.random() < 0.02) {
          this.state = 'wheel';
          this.stateTimer = 3 + Math.random() * 3;
          this.group.position.copy(wheelGroup.position).add(new THREE.Vector3(0.8, 0, 0));
          this.heading = Math.PI / 2;
        }

        // Animate legs
        this.legPhase += dt * 12;
        this.animateLegs(true);
        break;
      }

      case 'pause': {
        if (this.stateTimer <= 0) {
          if (Math.random() < 0.15) {
            // Turn in place
            this.state = 'turn';
            this.stateTimer = 0.5 + Math.random() * 0.5;
            this.turnDir = Math.random() > 0.5 ? 1 : -1;
          } else {
            this.target = this.randomTarget();
            this.state = 'walk';
          }
        }
        this.animateLegs(false);
        break;
      }

      case 'turn': {
        this.heading += this.turnDir * dt * 3;
        if (this.stateTimer <= 0) {
          this.target = this.randomTarget();
          this.state = 'walk';
        }
        this.animateLegs(false);
        break;
      }

      case 'wheel': {
        // Run in place at wheel position
        this.legPhase += dt * 20;
        this.animateLegs(true);
        this.wheelSpeed = 4;

        if (this.stateTimer <= 0) {
          this.state = 'walk';
          this.target = this.randomTarget();
          this.wheelSpeed = 0;
        }
        break;
      }
    }

    // Bob animation
    const bob = Math.sin(this.legPhase) * 0.02;
    this.group.position.y = bob;

    // Face heading
    this.group.rotation.y = this.heading;

    // Update wheel
    if (this.wheelSpeed > 0) {
      wheelGroup.children[0].rotation.z += this.wheelSpeed * dt; // rim
      for (let i = 1; i <= 4; i++) {
        wheelGroup.children[i].rotation.z += this.wheelSpeed * dt;
      }
      this.wheelSpeed *= 0.98;
    } else {
      // Slow decay
      wheelGroup.children[0].rotation.z += 0.5 * dt;
      for (let i = 1; i <= 4; i++) {
        wheelGroup.children[i].rotation.z += 0.5 * dt;
      }
    }
  }

  animateLegs(moving) {
    if (!moving) {
      this.feet.forEach(f => { f.position.y = 0.03; });
      return;
    }
    const t = this.legPhase;
    this.feet[0].position.y = 0.03 + Math.abs(Math.sin(t)) * 0.03;
    this.feet[1].position.y = 0.03 + Math.abs(Math.sin(t + Math.PI)) * 0.03;
    this.feet[2].position.y = 0.03 + Math.abs(Math.sin(t + Math.PI * 0.5)) * 0.03;
    this.feet[3].position.y = 0.03 + Math.abs(Math.sin(t + Math.PI * 1.5)) * 0.03;
  }
}

// ─── CREATE HAMSTERS ───────────────────────────────────────────
const hamsters = [
  new Hamster(0xf4a460, 0xffe4b5, 'Golden'),   // Golden hamster
  new Hamster(0xf5f5f5, 0xfff0e0, 'Snowy'),    // White hamster
  new Hamster(0x8B4513, 0xDEB887, 'Cocoa'),    // Brown hamster
  new Hamster(0xffd700, 0xfff8dc, 'Sunny'),    // Yellow hamster
];

// ─── DECORATIVE ELEMENTS ───────────────────────────────────────
// Small plants
function createPlant(x, z) {
  const g = new THREE.Group();
  const potGeo = new THREE.CylinderGeometry(0.15, 0.12, 0.2, 6);
  const pot = new THREE.Mesh(potGeo, mat(0xcd853f));
  pot.position.y = 0.1;
  g.add(pot);
  for (let i = 0; i < 3; i++) {
    const leafGeo = new THREE.ConeGeometry(0.08, 0.25, 4);
    const leaf = new THREE.Mesh(leafGeo, mat(0x2ecc71));
    leaf.position.set((Math.random() - 0.5) * 0.1, 0.3, (Math.random() - 0.5) * 0.1);
    leaf.rotation.z = (Math.random() - 0.5) * 0.3;
    g.add(leaf);
  }
  g.position.set(x, 0, z);
  scene.add(g);
}
createPlant(-3.2, 0.5);
createPlant(3.2, -0.5);

boneGroup.add(boneMid);

// ─── ANIMATION LOOP ────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  hamsters.forEach(h => h.update(dt));

  // Gentle wheel idle spin
  wheelGroup.children[0].rotation.z += 0.002;
  for (let i = 1; i <= 4; i++) {
    wheelGroup.children[i].rotation.z += 0.002;
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

// ─── RESIZE ────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
