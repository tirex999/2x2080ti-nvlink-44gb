<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Low-Poly Hamster Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#3a2c22; --ink-soft:#6b5a4d; --paper:#fff8ef;
    --peach:#ff9e7d; --coral:#ff7a59; --sun:#ffc94d; --mint:#7fd6b0;
    --shadow:rgba(120,72,40,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#ffd9a0}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink)}
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  .hud{position:fixed;z-index:10;pointer-events:none}
  .hud button,.hud a{pointer-events:auto}

  .brand{top:22px;left:26px;display:flex;align-items:center;gap:14px}
  .badge{width:52px;height:52px;border-radius:16px;background:var(--peach);
    display:grid;place-items:center;box-shadow:0 8px 0 rgba(255,120,90,.55),0 12px 22px var(--shadow);
    animation:bob 3.2s ease-in-out infinite}
  .badge svg{width:34px;height:34px}
  .brand h1{font-family:'Fredoka';font-weight:700;font-size:clamp(22px,3.2vw,34px);
    line-height:.95;letter-spacing:-.5px;text-shadow:0 2px 0 rgba(255,255,255,.6)}
  .brand h1 span{display:block;font-size:.5em;font-weight:600;color:var(--coral);letter-spacing:2px;text-transform:uppercase}

  .panel{background:var(--paper);border-radius:20px;box-shadow:0 10px 0 rgba(120,72,40,.12),0 16px 30px var(--shadow);
    border:2px solid rgba(255,255,255,.7)}

  .roster{top:22px;right:26px;width:236px;padding:14px 14px 10px}
  .roster h2{font-family:'Fredoka';font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .roster h2 b{color:var(--coral);font-family:'Nunito';font-weight:800}
  .chip{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:14px;cursor:pointer;transition:transform .18s,background .18s}
  .chip:hover{background:#fff0e2;transform:translateX(3px)}
  .chip.active{background:#ffe6d6;box-shadow:inset 0 0 0 2px var(--peach)}
  .dot{width:26px;height:26px;border-radius:9px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
  .chip .name{font-family:'Fredoka';font-weight:600;font-size:15px}
  .chip .act{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--ink-soft);text-transform:capitalize}
  .chip.active .act{color:var(--coral)}

  .controls{left:26px;bottom:24px;display:flex;gap:10px;flex-wrap:wrap}
  .btn{font-family:'Fredoka';font-weight:600;font-size:15px;color:var(--ink);background:var(--paper);
    border:none;border-radius:15px;padding:12px 16px;cursor:pointer;
    box-shadow:0 6px 0 var(--shadow),0 10px 18px rgba(0,0,0,.12);
    transition:transform .12s,box-shadow .12s,background .18s;display:flex;align-items:center;gap:8px}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
  .btn.primary{background:var(--sun);box-shadow:0 6px 0 #d99a2b,0 10px 18px rgba(0,0,0,.12)}
  .btn.primary:active{box-shadow:0 2px 0 #d99a2b}
  .btn .ic{font-size:17px}

  .hint{right:26px;bottom:24px;font-family:'Fredoka';font-weight:500;font-size:13px;color:var(--ink);
    background:rgba(255,248,239,.82);padding:8px 14px;border-radius:999px;box-shadow:0 6px 14px rgba(0,0,0,.1);
    display:flex;gap:9px;align-items:center}
  .hint kbd{font-family:'Nunito';font-weight:800;background:#fff;border-radius:7px;padding:2px 7px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1);font-size:11px}

  /* ---------- Toast ---------- */
  .toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);z-index:20;
    font-family:'Fredoka';font-weight:600;font-size:16px;background:var(--ink);color:#fff;
    padding:12px 20px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
    box-shadow:0 12px 26px rgba(0,0,0,.25);max-width:80vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast em{color:var(--sun);font-style:normal}

  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}

  @media (max-width:640px){
    .roster{width:180px;top:auto;bottom:96px;right:14px}
    .brand{top:14px;left:14px}.badge{width:44px;height:44px}
    .controls{left:14px;bottom:14px}.hint{display:none}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud brand">
  <div class="badge">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="9" fill="#ffd27f"/><circle cx="5" cy="6" r="3.4" fill="#ffb84d"/><circle cx="19" cy="6" r="3.4" fill="#ffb84d"/><ellipse cx="12" cy="16" rx="5" ry="3.4" fill="#fff2dd"/><circle cx="8.5" cy="12" r="1.5" fill="#3a2c22"/><circle cx="15.5" cy="12" r="1.5" fill="#3a2c22"/><path d="M12 14.6l-1.2 1.2h2.4z" fill="#ff6f61"/></svg>
  </div>
  <h1>Hamster<span>Playground</span></h1>
</div>

<div class="hud panel roster" id="roster">
  <h2>Squad <b id="count">4</b></h2>
</div>

<div class="hud controls">
  <button class="btn primary" id="pokeBtn"><span class="ic">🐾</span> Poke a hamster</button>
  <button class="btn" id="spinBtn"><span class="ic">🎡</span> Spin the wheel</button>
  <button class="btn" id="resetBtn"><span class="ic">↺</span> Reset view</button>
</div>

<div class="hud hint">Drag to orbit · Scroll to zoom · <kbd>P</kbd> poke · <kbd>W</kbd> wheel</div>

<div class="toast" id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   Setup
============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = makeBgTexture();
scene.fog = new THREE.Fog(0xffd9a0, 26, 62);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(9.5, 7, 11);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 26;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = 1.45;
controls.target.set(0, 1.4, 0);
controls.autoRotateSpeed = 0.5;

/* ============================================================
   Lights
============================================================ */
const hemi = new THREE.HemisphereLight(0xfff0dc, 0xff9e6a, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2df, 1.25);
sun.position.set(9, 14, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 50;
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
sun.shadow.bias = -0.0004;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x8fd6ff, 0.35);
rim.position.set(-8, 6, -9);
scene.add(rim);

/* ============================================================
   Helpers
============================================================ */
function makeBgTexture(){
  const c = document.createElement('canvas'); c.width = 8; c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,'#ffe9c9'); grd.addColorStop(.5,'#ffcf9c'); grd.addColorStop(1,'#ff9e7d');
  g.fillStyle = grd; g.fillRect(0,0,8,256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function mat(color, opts={}){
  return new THREE.MeshStandardMaterial(Object.assign(
    { color, roughness:0.85, metalness:0.0, flatShading:true }, opts));
}
function blob(x, z, r, color, y=0.02){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 7, 0, Math.PI*2, 0, Math.PI/2), mat(color,{roughness:0.95}));
  m.scale.y = 0.22; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m;
}
function scatter(n, fn){ for(let i=0;i<n;i++) fn(i); }

/* ============================================================
   Cage + floor
============================================================ */
const W=9, D=6.5, WALLH=3.1, FRAME=0.22, RAILY=[0.9, 1.7, 2.5];

// base tray
const base = new THREE.Mesh(new RoundedBoxGeometry(W+0.5, 0.55, D+0.5, 4, 0.16), mat(0xff8a5c,{roughness:0.6}));
base.position.y = 0.275; base.castShadow = base.receiveShadow = true; scene.add(base);
// sand
const sand = new THREE.Mesh(new RoundedBoxGeometry(W-0.15, 0.34, D-0.15, 3, 0.12), mat(0xffd98a,{roughness:1}));
sand.position.y = 0.5; sand.receiveShadow = true; scene.add(sand);

// back + side walls (open front)
function wall(w,h,d,x,y,z){
  const m = new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,0.08), mat(0xff9e7d,{roughness:0.7}));
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
wall(W, WALLH, FRAME, 0, WALLH/2, -D/2);           // back
wall(FRAME, WALLH, D, -W/2, WALLH/2, 0);           // left
wall(FRAME, WALLH, D,  W/2, WALLH/2, 0);           // right
// top frame
wall(W+FRAME, FRAME, FRAME, 0, WALLH+FRAME/2, -D/2);
wall(FRAME, FRAME, D+FRAME, -W/2, WALLH+FRAME/2, 0);
wall(FRAME, FRAME, D+FRAME,  W/2, WALLH+FRAME/2, 0);
wall(W, FRAME, FRAME, 0, WALLH+FRAME/2, D/2);      // front top rail

// vertical bars (back + sides)
const barGeo = new THREE.CylinderGeometry(0.05,0.05,WALLH,6);
const barMat = mat(0xffd7c2,{roughness:0.5});
for(let x=-W/2+0.4; x<=W/2-0.3; x+=0.7){
  const b = new THREE.Mesh(barGeo, barMat); b.position.set(x, WALLH/2, -D/2); b.castShadow=true; scene.add(b);
}
for(let z=-D/2+0.4; z<=D/2-0.3; z+=0.7){
  const b = new THREE.Mesh(barGeo, barMat); b.position.set(-W/2, WALLH/2, z); b.castShadow=true; scene.add(b);
  const b2 = new THREE.Mesh(barGeo, barMat); b2.position.set(W/2, WALLH/2, z); b2.castShadow=true; scene.add(b2);
}
// front rails
RAILY.forEach(y=>{
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,W,8), barMat);
  r.rotation.z = Math.PI/2; r.position.set(0, y, D/2); r.castShadow=true; scene.add(r);
});

// corner posts
[[-W/2,-D/2],[W/2,-D/2],[-W/2,D/2],[W/2,D/2]].forEach(([x,z])=>{
  const p = new THREE.Mesh(new RoundedBoxGeometry(0.34, WALLH+0.5, 0.34, 3, 0.1), mat(0xff7a59,{roughness:0.55}));
  p.position.set(x, (WALLH+0.5)/2, z); p.castShadow=p.receiveShadow=true; scene.add(p);
});

// ground shadow catcher
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60,60),
  new THREE.ShadowMaterial({ opacity:0.22 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.001; ground.receiveShadow = true; scene.add(ground);

// decorative blobs outside
blob(-6.5, 5.5, 2.6, 0xffb27a); blob(7, 6, 3.2, 0xff9e7d); blob(0, -8.5, 4, 0xffd0a0);

/* ============================================================
   Interactive objects
============================================================ */
// Wheel
const wheel = new THREE.Group();
const rim = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.09, 8, 22), mat(0x6fd0c0,{roughness:0.4,metalness:0.15}));
rim.castShadow = true; wheel.add(rim);
const spokes = new THREE.Group();
for(let i=0;i<8;i++){
  const s = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.9, 0.05), mat(0x8fe0d0,{roughness:0.5}));
  s.rotation.z = i*Math.PI/4; spokes.add(s);
}
wheel.add(spokes);
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.16,10), mat(0x4fb8a8,{roughness:0.4}));
hub.rotation.x = Math.PI/2; wheel.add(hub);
const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1.5,8), mat(0xff8a5c));
axle.rotation.x = Math.PI/2; axle.position.z = 0; wheel.add(axle);
const standL = new THREE.Mesh(new RoundedBoxGeometry(0.14,1.0,0.14,3,0.06), mat(0xff8a5c));
standL.position.set(0,0.5,0.72); standL.castShadow=true;
const standR = standL.clone(); standR.position.z = -0.72;
wheel.add(standL, standR);
wheel.position.set(3.0, 1.05, -1.7);
scene.add(wheel);
let wheelSpin = 0.6;

// Food bowl
const bowl = new THREE.Group();
const dish = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.38,0.28,12), mat(0x7fc8a8,{roughness:0.5}));
dish.position.y = 0.14; dish.castShadow=true; bowl.add(dish);
const food = new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.12,12), mat(0x8a5a3a,{roughness:1}));
food.position.y = 0.26; bowl.add(food);
// little seeds
scatter(9, ()=>{
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.06,5,4), mat([0xffd24d,0xff8a5c,0xe0b060][i%3]));
  s.position.set((Math.random()-0.5)*0.5, 0.32, (Math.random()-0.5)*0.5); bowl.add(s);
});
bowl.position.set(-3.1, 0.66, 1.9);
scene.add(bowl);

// Tunnel
const tunnel = new THREE.Group();
const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,2.6,10,1,true), mat(0xffb84d,{side:THREE.DoubleSide,roughness:0.7}));
tube.rotation.z = Math.PI/2; tube.castShadow=true; tunnel.add(tube);
const capGeo = new THREE.CircleGeometry(0.55,10);
const capL = new THREE.Mesh(capGeo, mat(0xffd07a)); capL.position.x=-1.3; capL.rotation.y=Math.PI/2; tunnel.add(capL);
const capR = new THREE.Mesh(capGeo, mat(0xffd07a)); capR.position.x=1.3; capR.rotation.y=-Math.PI/2; tunnel.add(capR);
tunnel.position.set(-1.2, 1.21, -2.0);
scene.add(tunnel);

// Ball toy
const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(0.32,0), mat(0xff6f91,{roughness:0.5}));
ball.position.set(1.6, 0.98, 1.4); ball.castShadow=true; scene.add(ball);
let ballVel = new THREE.Vector3(0,0,0);

// Hay pile
const hay = new THREE.Group();
scatter(14, ()=>{
  const h = new THREE.Mesh(new THREE.ConeGeometry(0.08,0.5,4), mat(0xd8b25a,{roughness:1}));
  h.position.set((Math.random()-0.5)*1.2, 0.3+(Math.random()*0.25), (Math.random()-0.5)*0.9);
  h.rotation.set((Math.random()-0.5),Math.random()*3,(Math.random()-0.5));
  h.castShadow=true; hay.add(h);
});
hay.position.set(-3.2, 0.66, -2.2); scene.add(hay);

// Little plants near cage
[[5.6,4.2,0x6fd07a],[-6,4.8,0x8fd67a],[0,7,0x5ec08a]].forEach(([x,z,c])=>{
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.3,0.5,8), mat(0xe08a5a));
  pot.position.set(x,0.25,z); pot.castShadow=true; scene.add(pot);
  const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5,0), mat(c,{roughness:0.8}));
  leaves.position.set(x,0.85,z); leaves.scale.y=1.3; leaves.castShadow=true; scene.add(leaves);
});

/* ============================================================
   Hamsters
============================================================ */
const HAMSTERS = [
  { name:'Nugget', color:0xffb84d, belly:0xffe9c9, ear:0xff8a5c, speed:0.95 },
  { name:'Mochi',  color:0xf2f0ea, belly:0xffffff, ear:0xff9e9e, speed:1.05 },
  { name:'Biscuit',color:0xc98a52, belly:0xf0d6ad, ear:0x8a5a3a, speed:0.85 },
  { name:'Peanut', color:0xff8fa3, belly:0xffe0e6, ear:0xff5f7a, speed:1.15 },
];
const hamsters = [];
const tmpV = new THREE.Vector3();
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerpAngle = (a,b,t)=>{ let d=(b-a)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return a+d*t; };

function buildHamster(def){
  const g = new THREE.Group();
  const M = (c,o)=>mat(c,o||{});
  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5,0), M(def.color,{roughness:0.7}));
  body.scale.set(1.05,0.95,1.15); body.position.y=0.5; body.castShadow=true; g.add(body);
  const belly = new THREE.Mesh(new THREE.IcosahedronGeometry(0.34,0), M(def.belly,{roughness:0.8}));
  belly.scale.set(0.85,0.7,0.9); belly.position.set(0,0.42,0.22); g.add(belly);
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.4,0), M(def.color,{roughness:0.7}));
  head.position.set(0,0.68,0.5); head.castShadow=true; g.add(head);
  const snout = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16,0), M(def.belly,{roughness:0.8}));
  snout.position.set(0,0.58,0.86); g.add(snout);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.055,6,5), M(0xff6f61));
  nose.position.set(0,0.6,0.98); g.add(nose);
  [-1,1].forEach(s=>{
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07,6,5), M(0x2a1f18,{roughness:0.3}));
    eye.position.set(0.17*s,0.74,0.82); g.add(eye);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.024,4,4), M(0xffffff,{emissive:0xffffff,emissiveIntensity:0.4}));
    glint.position.set(0.19*s,0.77,0.88); g.add(glint);
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.17,6,5), M(def.ear,{roughness:0.8}));
    ear.scale.set(0.7,1,0.6); ear.position.set(0.24*s,1.0,0.3); ear.castShadow=true; g.add(ear);
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.11,6,5), M(0xff8a9a,{roughness:0.85}));
    cheek.scale.set(1,0.7,0.5); cheek.position.set(0.3*s,0.62,0.72); g.add(cheek);
  });
  // feet
  const footGeo = new THREE.SphereGeometry(0.13,6,5);
  const feet = [];
  [[-0.22,0.18],[0.22,0.18],[-0.22,-0.18],[0.22,-0.18]].forEach(([x,z])=>{
    const f = new THREE.Mesh(footGeo, M(def.belly,{roughness:0.9}));
    f.scale.set(1,0.6,1.1); f.position.set(x,0.12,z); f.castShadow=true; g.add(f); feet.push(f);
  });
  g.traverse(o=>{ if(o.isMesh && o!==body && o!==head && o!==belly && !feet.includes(o)) o.castShadow=false; });
  g.userData = { body, head, feet, t:Math.random()*10 };
  return g;
}

HAMSTERS.forEach((def,i)=>{
  const mesh = buildHamster(def);
  const pos = new THREE.Vector3((Math.random()-0.5)*5, 0.66, (Math.random()-0.5)*3);
  mesh.position.copy(pos);
  scene.add(mesh);
  hamsters.push({
    def, mesh, pos,
    heading: Math.random()*Math.PI*2,
    speed: def.speed,
    state: 'walk',
    timer: 1 + Math.random()*2,
    target: null,
    bob: 0,
  });
});

/* ---- interaction targets ---- */
function pickTarget(h){
  const options = [
    { p: new THREE.Vector3(3.0, 0.66, -1.7), w: 1.0, act:'run' },   // wheel
    { p: new THREE.Vector3(-3.1, 0.66, 1.9), w: 1.1, act:'eat' },   // bowl
    { p: new THREE.Vector3(-1.2, 0.66, -2.0), w: 0.7, act:'peek' }, // tunnel
    { p: new THREE.Vector3(1.6, 0.66, 1.4),  w: 0.5, act:'nudge' }, // ball
  ];
  let total = 0; options.forEach(o=>total+=o.w);
  let r = Math.random()*total;
  for(const o of options){ if((r-=o.w)<=0) return o; }
  return options[0];
}
function setAction(h, act){
  if(act==='run'){ h.state='run'; h.timer = 1.5+Math.random()*2; wheelSpin = 3.5; }
  else if(act==='eat'){ h.state='eat'; h.timer = 2.5+Math.random()*2; }
  else if(act==='peek'){ h.state='peek'; h.timer = 1.2+Math.random(); }
  else if(act==='nudge'){ h.state='nudge'; h.timer = 0.8; }
  else { h.state='pause'; h.timer = 0.8+Math.random()*1.6; }
}
function updateHamster(h, dt){
  const u = h.mesh.userData;
  h.timer -= dt;

  if(h.state==='pause'){
    u.body.rotation.x = Math.sin(performance.now()*0.006 + h.pos.x)*0.04; // sniff
    if(h.timer<=0){ const t=pickTarget(h); h.target=t.p; h.heading=Math.atan2(t.p.x-h.pos.x, t.p.z-h.pos.z); h.state='go'; h.timer=10; }
    return;
  }
  if(h.state==='go'){
    if(!h.target){ setAction(h,'pause'); return; }
    tmpV.copy(h.target).sub(h.pos); tmpV.y=0;
    const dist = tmpV.length();
    const desired = Math.atan2(tmpV.x, tmpV.z);
    h.heading = lerpAngle(h.heading, desired, clamp(dt*4,0,1));
    if(dist > 0.75){
      h.pos.x += Math.sin(h.heading)*h.speed*dt;
      h.pos.z += Math.cos(h.heading)*h.speed*dt;
      h.bob += dt*h.speed*9;
    } else {
      h.pos.x = h.target.x; h.pos.z = h.target.z;
      h.heading = desired;
      setAction(h, h.targetAct || 'pause');
      h.target = null;
    }
  } else if(h.state==='run'){
    h.pos.set(3.0, 0.66, -1.7);
    h.heading = lerpAngle(h.heading, Math.PI, clamp(dt*6,0,1));
    h.bob += dt*14;
    wheelSpin = 3.5;
    u.body.rotation.x = 0;
    if(h.timer<=0){ h.target=new THREE.Vector3(0,0.66,0); h.targetAct='pause'; h.state='go'; }
  } else if(h.state==='eat'){
    h.pos.set(-3.1, 0.66, 1.9);
    h.heading = lerpAngle(h.heading, Math.atan2(bowl.position.x-h.pos.x, bowl.position.z-h.pos.z), clamp(dt*6,0,1));
    u.body.rotation.x = Math.sin(performance.now()*0.012)*0.12; // munch
    if(h.timer<=0){ h.target=new THREE.Vector3(1,0.66,0); h.targetAct='pause'; h.state='go'; }
  } else if(h.state==='peek'){
    h.pos.set(-1.2, 0.66, -2.0);
    h.heading = lerpAngle(h.heading, 0, clamp(dt*6,0,1));
    u.body.rotation.x = Math.sin(performance.now()*0.01)*0.08;
    if(h.timer<=0){ h.target=new THREE.Vector3(0,0.66,1); h.targetAct='pause'; h.state='go'; }
  } else if(h.state==='nudge'){
    h.pos.set(1.6, 0.66, 1.4);
    h.heading = lerpAngle(h.heading, Math.PI, clamp(dt*6,0,1));
    if(h.timer<=0){
      ballVel.set((Math.random()-0.5)*3, 0.6, (Math.random()-0.5)*3);
      h.target=new THREE.Vector3(-2,0.66,0); h.targetAct='pause'; h.state='go';
    }
  }

  // apply transform
  h.pos.x = clamp(h.pos.x, -W/2+0.5, W/2-0.5);
  h.pos.z = clamp(h.pos.z, -D/2+0.5, D/2-0.5);
  h.mesh.position.copy(h.pos);
  h.mesh.rotation.y = h.heading;
  const moving = (h.state==='go') ? 1 : 0.25;
  h.mesh.position.y = 0.66 + Math.abs(Math.sin(h.bob))*0.06*moving;
  // feet
  u.feet.forEach((f,i)=>{
    const ph = (i%2===0?0:Math.PI);
    f.position.y = 0.12 + Math.abs(Math.sin(h.bob+ph))*0.05*moving;
  });
  u.head.rotation.x = h.state==='eat' ? Math.sin(performance.now()*0.012)*0.12 : 0;
}

/* ============================================================
   Roster UI
============================================================ */
const rosterEl = document.getElementById('roster');
document.getElementById('count').textContent = hamsters.length;
hamsters.forEach((h,i)=>{
  const row = document.createElement('div');
  row.className = 'chip';
  row.innerHTML = `<span class="dot" style="background:#${h.def.color.toString(16).padStart(6,'0')}"></span>
    <span class="name">${h.def.name}</span><span class="act">wandering</span>`;
  row.addEventListener('click', ()=>focusHamster(i));
  rosterEl.appendChild(row);
  h.chip = row; h.actEl = row.querySelector('.act');
});
function focusHamster(i){
  const h = hamsters[i];
  hamsters.forEach(x=>x.chip.classList.remove('active'));
  h.chip.classList.add('active');
  controls.target.copy(h.pos);
  toast(`<em>${h.def.name}</em> is ${h.state==='go'?'on the move':h.state}!`);
}

/* ============================================================
   Toast + buttons
============================================================ */
const toastEl = document.getElementById('toast');
let toastT;
function toast(msg){
  toastEl.innerHTML = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}
function pokeRandom(){
  const h = hamsters[Math.floor(Math.random()*hamsters.length)];
  h.state='pause'; h.timer=1.5;
  h.mesh.position.y = 0.9; // hop
  toast(`You poked <em>${h.def.name}</em>! 🐾`);
}
document.getElementById('pokeBtn').addEventListener('click', pokeRandom);
document.getElementById('spinBtn').addEventListener('click', ()=>{ wheelSpin = 9; toast('Wheel spun up! 🎡'); });
document.getElementById('resetBtn').addEventListener('click', ()=>{
  controls.target.set(0,1.4,0); camera.position.set(9.5,7,11);
  hamsters.forEach(x=>x.chip.classList.remove('active'));
  toast('View reset.');
});
addEventListener('keydown', e=>{
  if(e.key.toLowerCase()==='p') pokeRandom();
  if(e.key.toLowerCase()==='w'){ wheelSpin=9; toast('Wheel spun up! 🎡'); }
});

/* ============================================================
   Resize + loop
============================================================ */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let last = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min((now-last)/1000, 0.05);
  last = now;

  // wheel
  wheelSpin += (0.6 - wheelSpin)*dt*0.6;
  wheel.rotation.x -= wheelSpin*dt;
  wheel.position.y = 1.05 + Math.sin(now*0.001)*0.01;

  // ball physics
  ballVel.y -= 9.8*dt;
  ball.position.addScaledVector(ballVel, dt);
  const bx = W/2-0.5, bz = D/2-0.5;
  if(ball.position.y < 0.98){ ball.position.y=0.98; ballVel.y*=-0.45; if(Math.abs(ballVel.y)<0.3) ballVel.y=0; }
  if(ball.position.x > bx){ ball.position.x=bx; ballVel.x*=-0.5; }
  if(ball.position.x < -bx){ ball.position.x=-bx; ballVel.x*=-0.5; }
  if(ball.position.z > bz){ ball.position.z=bz; ballVel.z*=-0.5; }
  if(ball.position.z < -bz){ ball.position.z=-bz; ballVel.z*=-0.5; }
  ballVel.multiplyScalar(1 - dt*1.2);
  ball.rotation.x += ballVel.z*dt*2; ball.rotation.z -= ballVel.x*dt*2;

  // hamsters
  hamsters.forEach(h=>updateHamster(h, dt));

  // sync roster actions
  hamsters.forEach(h=>{
    const label = h.state==='go' ? 'wandering' : (h.state==='run'?'running':h.state);
    if(h.actEl.textContent!==label) h.actEl.textContent = label;
  });

  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
