/* ------------------------------- FISHES ---------------------------------- */
/* The fish, built as a fish: the body is a loft through six elliptical
   sections (deep back tapering to a thin caudal peduncle — a scaled sphere
   reads as a bead), the caudal fin is a grid whose trailing edge is pinched
   into a fork, plus a dorsal sail, paired pectorals and two dark eyes.
   Colors are painted per part BEFORE merging (mergeGeos drops a color
   attribute), then concatenated in merge order. One merged geometry per
   kind, so a school is still a single InstancedMesh. */
function fishGeo(bodyLen, bodyH, bodyW, tailLen, kind){
  const parts = [], shades = [];
  const back  = new THREE.Color(kind === 0 ? 0xff8c3a : kind === 1 ? 0x3f7fd0 : 0x27384a);
  const belly = new THREE.Color(kind === 0 ? 0xffe8cc : kind === 1 ? 0xeaf4ff : 0x9fb8c6);
  const finC  = new THREE.Color(kind === 0 ? 0xe0741f : kind === 1 ? 0x2a5ea8 : 0xf0b429);
  const eyeC  = new THREE.Color(0x0d1317);
  const bandC = new THREE.Color(0xfff4e0);
  const _c = new THREE.Color();

  const bodyC = (y, z) => {
    _c.copy(back).lerp(belly, Math.pow(clamp((bodyH * 0.5 - y) / bodyH, 0, 1), 0.6));
    if (kind === 0)
      for (const zs of [0.17, -0.05, -0.27])
        if (Math.abs(z - zs * bodyLen) < bodyLen * 0.042) _c.lerp(bandC, 0.85);
    return _c;
  };
  const put = (g, fn) => {                    // attach a part with colors
    const p = g.attributes.position, n = p.count, a = new Float32Array(n * 3);
    for (let i = 0; i < n; i++){
      const col = fn(p.getX(i), p.getY(i), p.getZ(i));
      a[i * 3] = col.r; a[i * 3 + 1] = col.g; a[i * 3 + 2] = col.b;
    }
    parts.push(g); shades.push(a);
  };

  // ---- body: elliptical sections from snout to caudal peduncle
  {
    const SECS = [                            // z, halfW, halfH, centreY (fractions)
      [ 0.50, 0.12, 0.18,  0.08],
      [ 0.30, 0.48, 0.50,  0.05],
      [ 0.05, 0.50, 0.50,  0.00],
      [-0.20, 0.36, 0.42, -0.05],
      [-0.38, 0.19, 0.27, -0.06],
      [-0.50, 0.08, 0.12, -0.04],
    ];
    const NV = 8, pos = [], idx = [];
    for (const [zt, wf, hf, yf] of SECS)
      for (let j = 0; j < NV; j++){
        const a = j / NV * TAU;
        pos.push(Math.cos(a) * wf * bodyW, yf * bodyH + Math.sin(a) * hf * bodyH, zt * bodyLen);
      }
    for (let i = 0; i < SECS.length - 1; i++)
      for (let j = 0; j < NV; j++){
        const a = i * NV + j, b = i * NV + (j + 1) % NV, cc = (i + 1) * NV + j, d = (i + 1) * NV + (j + 1) % NV;
        idx.push(a, cc, b, b, cc, d);
      }
    const nose = pos.length / 3;
    pos.push(0, SECS[0][3] * bodyH * 0.6, SECS[0][0] * bodyLen * 1.12);
    const tip = pos.length / 3;
    pos.push(0, SECS[SECS.length - 1][3] * bodyH, SECS[SECS.length - 1][0] * bodyLen * 1.06);
    for (let j = 0; j < NV; j++){
      idx.push(nose, j, (j + 1) % NV);
      idx.push(tip, (SECS.length - 1) * NV + j, (SECS.length - 1) * NV + (j + 1) % NV);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    put(g, (x, y, z) => bodyC(y, z));
  }

  // ---- caudal fin: the fork is a trailing edge that reaches less in the
  //      middle than at the lobes; the grid lets the shader beat bend it
  {
    const NU = 6, NV = 5, z0 = -bodyLen * 0.44, D = tailLen, extra = tailLen * 0.42;
    const pos = [], idx = [];
    for (let i = 0; i < NU; i++){
      const u = i / (NU - 1);
      for (let j = 0; j < NV; j++){
        const r = j / (NV - 1) * 2 - 1;                     // -1 bottom .. +1 top
        const lobe = r >= 0 ? 1.06 : 0.72;                  // upper lobe reaches farther
        const h = bodyH * (0.30 + 1.25 * u) * lobe;
        pos.push(0, r * h, z0 - u * (D - extra * (1 - Math.pow(Math.abs(r), 0.6))));
      }
    }
    for (let i = 0; i < NU - 1; i++)
      for (let j = 0; j < NV - 1; j++){
        const a = i * NV + j, b = a + 1, d = a + NV, e2 = d + 1;
        idx.push(a, b, d, b, e2, d);
      }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    put(g, () => finC);
  }

  // ---- dorsal sail: rises mid-back, melts into the peduncle
  {
    const NU = 7, pos = [], idx = [];
    for (let i = 0; i < NU; i++){
      const u = i / (NU - 1);
      const z = bodyLen * (0.10 - 0.44 * u);
      const h = bodyH * (kind === 2 ? 1.05 : 0.8) * Math.sin(Math.PI * Math.pow(u, 0.75));
      pos.push(0, bodyH * 0.40, z, 0, bodyH * 0.40 + h, z);
    }
    for (let i = 0; i < NU - 1; i++){
      const a = i * 2;
      idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    put(g, () => finC);
  }

  // ---- paired pectorals + dark eyes (loop over the two sides)
  for (const s of [-1, 1]){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([
      s * bodyW * 0.40,  bodyH * 0.06,  bodyLen * 0.14,
      s * bodyW * 0.85, -bodyH * 0.30,  bodyLen * 0.02,
      s * bodyW * 0.55, -bodyH * 0.10, -bodyLen * 0.12,
    ], 3));
    g.setIndex([0, 1, 2]);
    g.computeVertexNormals();
    put(g, () => finC);

    const e = new THREE.SphereGeometry(Math.max(0.012, bodyH * 0.16), 6, 4);
    e.translate(s * bodyW * 0.34, bodyH * 0.20, bodyLen * 0.30);
    put(e, () => eyeC);
  }

  const g = mergeGeos(parts);
  const cols = new Float32Array(g.attributes.position.count * 3);
  let vo = 0;
  for (const a of shades){ cols.set(a, vo); vo += a.length; }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  return g;
}

/** Per-instance tail beat, driven by the fish's own position as the phase. */
function addSwim(mat, amp = 0.10, rate = 11.0){
  patch(mat, (sh) => {
    sh.uniforms.uTime = U.time;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      #ifdef USE_INSTANCING
        float _ph = instanceMatrix[3][0] * 0.8 + instanceMatrix[3][2] * 0.55;
        float _w = smoothstep(0.1, -0.5, transformed.z);      // strongest at the tail
        transformed.x += sin(uTime * ${rate.toFixed(1)} + _ph - transformed.z * 3.4) * ${amp.toFixed(3)} * _w;
      #endif`);
  }, 'swim' + amp.toFixed(2) + rate.toFixed(1));
  return mat;
}

/** Steering that keeps a swimmer inside the wet part of the tank. */
function confine(p, v, turn, margin = 0.9){
  const ahead = 1.5;
  const fx = p.x + v.x * ahead, fz = p.z + v.z * ahead;
  const lim = BOX.halfW - margin, limz = BOX.halfD - margin;
  let pushX = 0, pushZ = 0;
  if (fx >  lim) pushX -= (fx - lim) * 0.55;
  if (fx < -lim) pushX += (-lim - fx) * 0.55;
  if (fz >  limz) pushZ -= (fz - limz) * 0.55;
  if (fz < -limz) pushZ += (-limz - fz) * 0.55;
  // steer away from the island shelf
  const dx = fx - ISLE.cx, dz = fz - ISLE.cz;
  const d = Math.hypot(dx, dz);
  // The old multiplier (0.55) made steering ~2 units stricter than the hard
  // containment needs, parking every school against the outer glass. The
  // hard guarantee lives in containToLagoon; steering just prefers the ring.
  const R = isleRadius(Math.atan2(dz, dx)) * (1.05 + margin * 0.22);
  if (d < R){
    const k = (R - d) * 0.55;
    if (d > 0.001){ pushX += dx / d * k; pushZ += dz / d * k; }
  }
  // and away from the pier: the pile axis is a wall the ring steering knows nothing about
  const _pp = { d: 0, nx: 0, nz: 0 };
  if (pierAxisPush(fx, fz, _pp)){
    const k = (PIER_AVOID - _pp.d) * 0.9;
    pushX += _pp.nx * k; pushZ += _pp.nz * k;
  }
  const sp = Math.hypot(v.x, v.z) || 1;
  turn.x = (turn.x || 0) * 0.86 + (pushX / sp) * turnGain;
  turn.z = (turn.z || 0) * 0.86 + (pushZ / sp) * turnGain;
  return turn;
}
let turnGain = 0.35;

/** Hard containment, applied after the steering each frame. Steering alone is a
    nudge: an animal that starts inside the island (or gets pushed there by the
    tide) takes many seconds to work its way out, and in the meantime it is
    swimming inside the terrain where nothing can see it. This is the backstop
    that makes "always inside the lagoon" true by construction. */
function containToLagoon(p, margin = 1.2){
  let dx = p.x - ISLE.cx, dz = p.z - ISLE.cz;
  let d = Math.hypot(dx, dz);
  const R = isleRadius(Math.atan2(dz, dx)) + margin;
  if (d < R){
    if (d < 1e-4){ dx = 1; dz = 0; d = 1; }
    const k = R / d;
    p.x = ISLE.cx + dx * k;
    p.z = ISLE.cz + dz * k;
  }
  p.x = clamp(p.x, -(BOX.halfW - 0.9), BOX.halfW - 0.9);
  p.z = clamp(p.z, -(BOX.halfD - 0.9), BOX.halfD - 0.9);
  return p;
}

const schools = [];
{
  /* Reef-small sizes: the old 0.44-0.24 bodies at 1.3x scale swam around as
     0.8 m fish beside 0.25 m pilings — aquarium giants. Now 11-20 cm reef
     fish. Tail-beat follows the animal: small fish flick fast, big fish beat
     slow (amplitude ∝ length, frequency ∝ 1/√length). */
  const kinds = [
    { n: Q.fish,        bodyLen: 0.20, bodyH: 0.11, bodyW: 0.06,  tail: 0.11,  kind: 0, speed: 0.55, size: [0.80, 1.20] },
    { n: Math.round(Q.fish * 0.8), bodyLen: 0.15, bodyH: 0.075, bodyW: 0.042, tail: 0.08,  kind: 1, speed: 0.70, size: [0.80, 1.15] },
    { n: Math.round(Q.fish * 1.3), bodyLen: 0.11, bodyH: 0.055, bodyW: 0.030, tail: 0.055, kind: 2, speed: 0.80, size: [0.75, 1.10] },
  ];
  kinds.forEach((k, ki) => {
    const mat = addSwim(addCaustics(new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.42, metalness: 0.12, side: THREE.DoubleSide,
    }), 0.5, 5.0), 0.30 * k.bodyLen, 5.5 / Math.sqrt(k.bodyLen));
    const im = new THREE.InstancedMesh(fishGeo(k.bodyLen, k.bodyH, k.bodyW, k.tail, k.kind), mat, k.n);
    im.castShadow = true;
    im.frustumCulled = false;
    const fish = [];
    /* Schools live on the shelf hugging the island — the same additive rule
       the runtime containment uses (isleRadius + 0.9..3.9). The old sampler
       asked isWater(margin 0.5), which is MULTIPLICATIVE (needs ~1.55× the
       isle radius), so every fish was born pinned 1-1.5 m off the glass and
       the near ring the reef camera films stayed empty by construction.
       40% of samples bias into the +X/+Z corridor the Reef preset looks at. */
    const coreN = ki === 0 ? Math.round(k.n * 0.45) : 0;
    for (let i = 0; i < k.n; i++){
      let x = 0, z = 0, tries = 0;
      const core = i < coreN;
      do {
        const a = tries % 5 < 2 ? rr(-0.9, 1.1) : rnd() * TAU;   // corridor bias
        const R = isleRadius(a) + rr(0.9, 3.0);
        x = Math.cos(a) * R;
        z = ISLE.cz + Math.sin(a) * R;
        tries++;
      } while ((Math.abs(x) > BOX.halfW - 1.7 || Math.abs(z) > BOX.halfD - 1.7 ||
                pierAxisPush(x, z, { d: 0, nx: 0, nz: 0 }) < 1.4) && tries < 40);
      { // sampler budget exhausted near the pier: shove the spot clear of the axis
        const po = { d: 0, nx: 0, nz: 0 };
        if (pierAxisPush(x, z, po)){ x += po.nx * (1.7 - po.d); z += po.nz * (1.7 - po.d); }
      }
      if (core){
        // a scatter patch inside the Reef frustum (measured: the disc at
        // (6.6,-3.0) sits 100% in frame of the retargeted camera)
        const a3 = rnd() * TAU;
        const cx2 = 6.6 + Math.cos(a3) * rr(0.8, 2.6), cz2 = -3.0 + Math.sin(a3) * rr(0.8, 2.6);
        const dx3 = cx2 - ISLE.cx, dz3 = cz2 - ISLE.cz;
        if (Math.hypot(dx3, dz3) > isleRadius(Math.atan2(dz3, dx3)) + 0.9 &&
            Math.abs(cx2) < BOX.halfW - 1.7 && Math.abs(cz2) < BOX.halfD - 1.7){
          x = cx2; z = cz2;
        }
      }
      const y = clamp(terrainH(x, z) + rr(0.5, core ? 1.9 : 2.6), BOX.bedY + 0.4, U.waterY.value - 0.4);
      const dir = rnd() * TAU;
      fish.push({
        p: new THREE.Vector3(x, y, z),
        v: new THREE.Vector3(Math.cos(dir), rr(-0.05, 0.05), Math.sin(dir)).normalize().multiplyScalar(k.speed),
        turn: new THREE.Vector2(),
        scale: rr(k.size[0], k.size[1]),
        bank: 0,
        bob: rnd() * TAU,
      });
    }
    schools.push({ im, fish, cfg: k });
    scene.add(im);
  });
}

function updateSchools(dt, t){
  const dm = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0), dir = new THREE.Vector3();
  const surf = U.waterY.value;
  for (const s of schools){
    const { im, fish, cfg } = s;
    const n = Math.min(fish.length, im.count);
    /* A fish is not a helicopter. The old model springs the fish to mid-water
       and snaps its velocity to a new heading every frame, so it can sit
       nose-up in place as if gravity did not exist. This one has rules: the
       animal cruises FORWARD, vertical demand is capped by its own speed (to
       climb it must swim), velocity chases the target with inertia, a slowing
       fish sinks (buoyancy is only partial), and the school pulls its fish
       toward the school's own centre. */
    let scx = 0, scy = 0, scz = 0;
    for (let i = 0; i < n; i++){ scx += fish[i].p.x; scy += fish[i].p.y; scz += fish[i].p.z; }
    scx /= n || 1; scy /= n || 1; scz /= n || 1;
    for (let i = 0; i < n; i++){
      const f = fish[i];
      if (f.ph === undefined){                       // per-fish patrol band
        f.ph = rnd() * TAU;                          // between two heights
        f.b0 = rr(0.35, 1.1) * (1 + cfg.bodyLen);    // above the bed, on a
        f.b1 = f.b0 + rr(0.8, 2.4);                  // slow sine
      }
      const floor = terrainH(f.p.x, f.p.z) + 0.28;
      const ceil  = surf - 0.25;
      const w = 0.5 + 0.5 * Math.sin(t * 0.13 + f.ph);
      const yWant = clamp(floor + lerp(f.b0, f.b1, w), floor, ceil);

      // yaw wander + containment; the school calls its fish home
      f.turn.x += (rnd() - 0.5) * 1.9 * dt;
      confine(f.p, f.v, f.turn, 0.9);
      f.turn.multiplyScalar(Math.exp(-2.2 * dt));

      const vh = Math.hypot(f.v.x, f.v.z) || 0.35;
      const climb = clamp((yWant - f.p.y) * 0.55, -1, 1);
      const pitchWant = clamp(Math.atan2(climb, vh * 2.4), -0.40, 0.40);
      const yaw = f.turn.x * 1.9;
      const ca = Math.cos(yaw), sa = Math.sin(yaw);
      const hx = f.v.x * ca + f.v.z * sa;
      const hz = -f.v.x * sa + f.v.z * ca;
      const hL = Math.hypot(hx, hz) || 1e-3;
      const cruise = cfg.speed * (0.80 + 0.20 * Math.sin(t * 0.5 + f.ph));
      const fwd = Math.cos(pitchWant) * cruise;
      const up  = Math.sin(pitchWant) * cruise;
      const dx0 = scx - f.p.x, dz0 = scz - f.p.z;
      const dC = Math.hypot(dx0, dz0) || 1;
      const g = clamp((dC - 1.1) * 0.30, 0, 0.7);           // schooling pull: a small fish schools tight
      const tvx = hx / hL * fwd + dx0 / dC * g;
      const tvz = hz / hL * fwd + dz0 / dC * g;
      const tvy = up + clamp((scy - f.p.y) * 0.10, -0.25, 0.25);
      const k = 1 - Math.exp(-2.4 * dt);                    // inertia, not a snap
      f.v.x += (tvx - f.v.x) * k;
      f.v.y += (tvy - f.v.y) * k;
      f.v.z += (tvz - f.v.z) * k;
      // a fish that stops, sinks — gravity exists, buoyancy is only partial
      f.v.y -= 0.30 * dt * (1 - clamp(Math.hypot(f.v.x, f.v.z) / cfg.speed, 0, 1));
      f.v.y = clamp(f.v.y, -0.55, 0.55);
      f.p.addScaledVector(f.v, dt);
      // the seabed and the surface do not forgive
      const fy = terrainH(f.p.x, f.p.z) + 0.30;
      if (f.p.y < fy){ f.p.y = fy; f.v.y = Math.max(f.v.y, 0.10); }
      if (f.p.y > ceil){ f.p.y = ceil; f.v.y = Math.min(f.v.y, -0.05); }
      containToLagoon(f.p, 0.7);
      f.bank = damp(f.bank, clamp(f.turn.x * 2.6, -0.9, 0.9), 6, dt);

      dir.copy(f.v).normalize();
      const yawO = Math.atan2(dir.x, dir.z);
      const pitchO = Math.asin(clamp(dir.y, -1, 1));
      e.set(pitchO, yawO, f.bank, 'YXZ');
      q.setFromEuler(e);
      sc.setScalar(f.scale);
      dm.compose(f.p, q, sc);
      im.setMatrixAt(i, dm);
    }
    im.instanceMatrix.needsUpdate = true;
  }
}

/* ------------------------------- RAYS ------------------------------------ */
/* A ray is a flattened body, two swept wings and a whip tail. The wings and
   tail are dense grids whose vertices we rewrite every frame — that is what
   produces the smooth travelling undulation rather than a hinged flapping. */

function rayBodyGeo(len, wide, thick){
  const NU = 16, NV = 14;
  const pos = [], uv = [], idx = [];
  for (let i = 0; i < NU; i++){
    const u = i / (NU - 1);            // 0 tail … 1 snout
    const prof = Math.sin(Math.pow(u, 0.75) * Math.PI);
    const w = wide * Math.pow(prof, 0.55);
    const h = thick * Math.pow(prof, 0.5);
    for (let j = 0; j < NV; j++){
      const a = j / NV * TAU;
      const cx = Math.cos(a), cy = Math.sin(a);
      pos.push(cx * w, cy * h, (u - 0.42) * len);
      uv.push(j / NV, u);
    }
  }
  for (let i = 0; i < NU - 1; i++)
    for (let j = 0; j < NV; j++){
      const a = i * NV + j, b = i * NV + (j + 1) % NV;
      const c = (i + 1) * NV + j, d = (i + 1) * NV + (j + 1) % NV;
      idx.push(a, c, b, b, c, d);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function rayWingGeo(span, rootChord, sweep, tipChord, NU = 9, NV = 5){
  const pos = new Float32Array(NU * NV * 3);
  const uv = [], idx = [];
  for (let i = 0; i < NU; i++){
    const a = i / (NU - 1);                     // 0 root … 1 tip
    const z = a * span;
    const lead = -sweep * Math.pow(a, 1.25);
    const chord = lerp(rootChord, tipChord, Math.pow(a, 0.8));
    for (let j = 0; j < NV; j++){
      const b = j / (NV - 1);                   // 0 leading … 1 trailing
      const x = lead - chord * b;
      // swept-back tip and a little dihedral
      const y = -0.10 * Math.sin(Math.PI * b) * (1 - a * 0.35) + a * 0.05;
      const k = (i * NV + j) * 3;
      pos[k] = x; pos[k + 1] = y; pos[k + 2] = z;
      uv.push(b, a);
    }
  }
  for (let i = 0; i < NU - 1; i++)
    for (let j = 0; j < NV - 1; j++){
      const a = i * NV + j, b = a + 1, c = a + NV, d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  g.userData.NU = NU; g.userData.NV = NV;
  return g;
}

function rayTailGeo(len, rootW, NU = 14, NV = 3){
  const pos = new Float32Array(NU * NV * 3);
  const uv = [], idx = [];
  for (let i = 0; i < NU; i++){
    const t = i / (NU - 1);
    const w = lerp(rootW, 0.012, Math.pow(t, 0.75));
    const y = Math.sin(t * 2.6) * 0.04;
    for (let j = 0; j < NV; j++){
      const b = (j / (NV - 1) - 0.5) * 2;
      const k = (i * NV + j) * 3;
      pos[k] = b * w; pos[k + 1] = y - Math.abs(b) * w * 0.18; pos[k + 2] = -t * len;
      uv.push(j / (NV - 1), t);
    }
  }
  for (let i = 0; i < NU - 1; i++)
    for (let j = 0; j < NV - 1; j++){
      const a = i * NV + j, b = a + 1, c = a + NV, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  g.userData.NU = NU; g.userData.NV = NV;
  return g;
}

/** Manta colouring: dark slate above, pale cream below, like the real thing. */
function paintRay(geo, thick){
  const p = geo.attributes.position;
  const cols = new Float32Array(p.count * 3);
  const top = new THREE.Color(0x2c3d46), bot = new THREE.Color(0xdad0ba), c = new THREE.Color();
  for (let i = 0; i < p.count; i++){
    const t = clamp(0.5 - p.getY(i) / (thick * 2), 0, 1);
    c.copy(top).lerp(bot, Math.pow(t, 0.75));
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  return geo;
}

/* Reef-manta proportions, measured against the tank: a 22x18 basin with a
   3-5 m water channel cannot host a 5 m wingspan — the old scale gave the ray
   a span half the channel width. Now: nose-to-tail-tip ~2.4-2.9 m, wings ~1.8 m
   across, i.e. a real reef manta swimming through the diorama. */
const RAY_SCALE = { len: 1.5, wide: 0.38, thick: 0.12, span: 0.92, rootChord: 0.60, sweep: 0.32, tail: 1.05 };
const rayMat = addCaustics(new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.62, metalness: 0.08, side: THREE.DoubleSide,
}), 0.45, 6.0);

const rays = [];
for (let i = 0; i < Q.rays; i++){
  const g = new THREE.Group();
  const body = new THREE.Mesh(paintRay(rayBodyGeo(RAY_SCALE.len, RAY_SCALE.wide, RAY_SCALE.thick), RAY_SCALE.thick), rayMat);
  body.castShadow = true;
  g.add(body);
  const wings = [];
  [-1, 1].forEach(s => {
    const wg = rayWingGeo(RAY_SCALE.span, RAY_SCALE.rootChord, RAY_SCALE.sweep, 0.22);
    const w = new THREE.Mesh(paintRay(wg, RAY_SCALE.thick * 0.6), rayMat);
    w.scale.z = s;
    w.castShadow = true;
    g.add(w);
    wings.push(w);
  });
  const tg = rayTailGeo(RAY_SCALE.tail, 0.10);
  const tail = new THREE.Mesh(paintRay(tg, 0.05), rayMat);
  tail.position.z = -RAY_SCALE.len * 0.5;
  g.add(tail);
  scene.add(g);

  /* Spawn on a ring of open water. The tank is 22x18, so the water ring is an
     ellipse, not a circle — a circular ring of r=8.2 puts animals out at
     z=+-8.2, where the glass is too close for a leap to have anywhere to go. */
  const sa = 0.9 + (i / Math.max(1, Q.rays)) * TAU;
  // keep the spawn ring clear of the pier corridor: the +Z sector is pile country
  let rx = ISLE.cx + Math.cos(sa) * 8.4, rz = ISLE.cz + Math.sin(sa) * 6.4;
  for (let s = 0; s < 3; s++){
    const po = { d: 0, nx: 0, nz: 0 };
    if (!pierAxisPush(rx, rz, po)) break;
    rx += po.nx * (PIER_AVOID + 0.8 - po.d); rz += po.nz * (PIER_AVOID + 0.8 - po.d);
  }
  rays.push({
    g, wings, tail,
    bodyGeo: body.geometry, wingGeo: wings[0].geometry, tailGeo: tg,
    p: new THREE.Vector3(rx, -2.0 - i * 0.35, rz),
    v: new THREE.Vector3(-Math.sin(sa), 0, Math.cos(sa)).normalize().multiplyScalar(0.7),
    phase: rnd() * TAU,
    // a manta is not a metronome: burst of 2-3 strokes, then a long glide.
    // Per-ray cycle: stroke time, glide time, and the beat accumulator.
    strokeT: rr(1.7, 2.6), glideT: rr(2.2, 3.8), beatClock: rnd() * 6,
    pref: rr(0.30, 0.85),                 // the depth band this ray calls home
    size: rr(0.9, 1.15),
    bank: 0, pitch: 0,
    leap: null,
  });
}

/* ===================== 13. RAYS: CRUISE + LEAP =========================== */
/* Wings and tail are dense grids; we keep a copy of their rest positions and
   rewrite a travelling wave into them every frame. The chord foreshortens by
   the true local slope, which is what makes the stroke read as a stroke. */

for (const r of rays){
  r.wingGeo.userData.base = Float32Array.from(r.wingGeo.attributes.position.array);
  r.tailGeo.userData.base = Float32Array.from(r.tailGeo.attributes.position.array);
}

function undulate(geo, t, phase, amp, rate, spread, exponent, chordForEach){
  const arr = geo.attributes.position.array;
  const base = geo.userData.base;
  const NU = geo.userData.NU, NV = geo.userData.NV;
  for (let i = 0; i < NU; i++){
    const a = i / (NU - 1);
    const th = t * rate - a * spread + phase;
    const s = Math.sin(th), c = Math.cos(th);
    const k = Math.pow(a, exponent);
    const f = amp * s * k;
    // analytic slope -> local flap angle -> chord shortening
    const dfda = amp * (c * (-spread) * Math.pow(a, exponent) + s * exponent * Math.pow(a, exponent - 1));
    const ang = Math.atan2(dfda, chordForEach(a));
    const shrink = Math.cos(clamp(ang, -1.2, 1.2));
    for (let j = 0; j < NV; j++){
      const idx = (i * NV + j) * 3;
      arr[idx]     = base[idx]     * shrink;
      arr[idx + 1] = base[idx + 1] + f;
      arr[idx + 2] = base[idx + 2] * (1 - 0.06 * Math.abs(s) * k);
    }
  }
  geo.attributes.position.needsUpdate = true;
  geo.computeVertexNormals();
}

function updateRayMesh(r, t, beat){
  const amp = 0.30 * beat;
  undulate(r.wingGeo, t, r.phase, amp, 3.0, 3.1, 1.55, a => lerp(RAY_SCALE.rootChord, 0.22, Math.pow(a, 0.8)));
  undulate(r.tailGeo, t, r.phase + 1.7, amp * 0.72, 3.9, 2.4, 1.5, a => lerp(0.10, 0.012, Math.pow(a, 0.75)));
}

/* ---- splash: droplets + expanding ripples ---- */
const splash = (() => {
  const N = 150;
  const pos = new Float32Array(N * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false,
    uniforms: { uPix: { value: renderer.getPixelRatio() }, uNight: U.night },
    vertexShader: `
      attribute float aLife; varying float vA; uniform float uPix;
      void main(){
        vA = aLife;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = (2.0 + 9.0 * aLife) * uPix * (14.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying float vA; uniform float uNight;
      void main(){
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5 || vA <= 0.0) discard;
        float a = smoothstep(0.5, 0.15, d) * vA;
        gl_FragColor = vec4(vec3(0.92, 0.99, 1.0) * (1.0 - uNight * 0.45), a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  });
  const life = new Float32Array(N);
  g.setAttribute('aLife', new THREE.BufferAttribute(life, 1));
  const pts = new THREE.Points(g, m);
  pts.renderOrder = 7;
  pts.frustumCulled = false;
  scene.add(pts);

  const P = [], V = [], L = [];
  for (let i = 0; i < N; i++){ P.push(new THREE.Vector3()); V.push(new THREE.Vector3()); L.push(0); }

  // ripple rings
  const rings = [];
  const ringGeo = new THREE.RingGeometry(0.55, 1.0, 56);
  ringGeo.rotateX(-Math.PI / 2);
  for (let i = 0; i < 5; i++){
    const rm = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false,
      blending: THREE.AdditiveBlending,
      uniforms: { uA: { value: 0 }, uCol: { value: new THREE.Color(0xdff6f2) } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `varying vec2 vUv; uniform float uA;
        void main(){
          float d = length(vUv - 0.5) * 2.0;
          float ring = smoothstep(0.55, 0.86, d) * smoothstep(1.0, 0.88, d);
          gl_FragColor = vec4(vec3(0.85, 0.97, 1.0), ring * uA);
        }`,
    });
    const mesh = new THREE.Mesh(ringGeo, rm);
    mesh.rotation.x = -Math.PI / 2;
    mesh.renderOrder = 6;
    mesh.visible = false;
    mesh.frustumCulled = false;
    scene.add(mesh);
    rings.push({ mesh, t: 0, dur: 2.4, active: false });
  }

  return {
    burst(x, y, z, strength = 1){
      let spawned = 0;
      for (let i = 0; i < N && spawned < 90 * strength; i++){
        if (L[i] > 0) continue;
        const a = rnd() * TAU, r = Math.pow(rnd(), 0.6) * 0.5;
        P[i].set(x + Math.cos(a) * r, y + 0.05, z + Math.sin(a) * r);
        const sp = rr(1.6, 5.2) * strength;
        V[i].set(Math.cos(a) * sp * 0.55, rr(2.4, 6.4) * strength, Math.sin(a) * sp * 0.55);
        L[i] = rr(0.55, 1.25);
        spawned++;
      }
      const r = rings.find(rr2 => !rr2.active) || rings[0];
      r.active = true; r.t = 0;
      r.mesh.position.set(x, y + 0.02, z);
      r.mesh.visible = true;
      for (const rr2 of rings){
        if (!rr2.active) continue;
        rr2.mesh.scale.setScalar(0.5);
      }
    },
    update(dt){
      let any = false;
      for (let i = 0; i < N; i++){
        if (L[i] <= 0){ life[i] = 0; continue; }
        any = true;
        L[i] -= dt;
        V[i].y -= 11.5 * dt;
        P[i].addScaledVector(V[i], dt);
        const surf = U.waterY.value;
        if (P[i].y < surf){ L[i] = 0; life[i] = 0; continue; }
        pos[i * 3] = P[i].x; pos[i * 3 + 1] = P[i].y; pos[i * 3 + 2] = P[i].z;
        life[i] = clamp(L[i] * 0.9, 0, 1);
      }
      g.attributes.position.needsUpdate = true;
      g.attributes.aLife.needsUpdate = true;
      if (!any) pts.visible = true;
      for (const r of rings){
        if (!r.active) continue;
        r.t += dt;
        const k = r.t / r.dur;
        if (k >= 1){ r.active = false; r.mesh.visible = false; continue; }
        r.mesh.scale.setScalar(0.4 + k * 4.6);
        r.mesh.position.y = U.waterY.value + 0.02;
        r.mesh.material.uniforms.uA.value = (1 - k) * (1 - k) * 0.55;
      }
    },
    onWave: false,
  };
})();

/* ---- the leap itself ---- */
// scaled to the reef-manta body (2.4-2.9 m): a breach, not a missile
const LEAP_H = 2.4;
const LEAP_DUR = 1.9;
/* A ray is 4+ units long nose to tail with a 3.5 wingspan, so clamping only its
   head to the glass lets the tail poke through the bronze rail. LEAP_SAFE is the
   room the whole animal needs; every point of the arc is tested against it. */
const LEAP_SAFE = 3.1;
function insideGlass(x, z){
  return Math.abs(x) <= BOX.halfW - LEAP_SAFE && Math.abs(z) <= BOX.halfD - LEAP_SAFE;
}
/** Open water, with room for the wings: only the launch and the entry have to
    clear the beach. At the apex the animal rides 3.9 above the surface, well
    over the island's 3.45 summit, so it may cross the middle of the island. */
function leapOverWater(x, z){
  const dx = x - ISLE.cx, dz = z - ISLE.cz;
  return Math.hypot(dx, dz) > isleRadius(Math.atan2(dz, dx)) + 1.7;
}
function triggerRayLeap(){
  // pick the ray nearest the middle of the lagoon so the arc stays in frame
  let best = rays[0], bestD = 1e9;
  for (const r of rays){
    if (r.leap) continue;
    const d = Math.hypot(r.p.x - ISLE.cx, r.p.z - ISLE.cz);
    if (d < bestD){ bestD = d; best = r; }
  }
  if (best.leap) return null;
  // slide the launch point off the glass first, so even the first frames fit
  best.p.x = clamp(best.p.x, -(BOX.halfW - 1.6), BOX.halfW - 1.6);
  best.p.z = clamp(best.p.z, -(BOX.halfD - 1.6), BOX.halfD - 1.6);
  // Choose the heading and the arc length together. Searching headings for one
  // fixed length fails outright when the animal is parked near a wall — the
  // search used to collapse to a 0.45-unit hop, which reads as nothing at all.

         kinematics: a power stroke of both wings accelerates the body, then
         the wings lock and the animal GLIDES on that speed for seconds; the
         nose rises with the stroke and settles on the glide; turns are wide
         and banked; the ray holds its own depth band, not the mid-water line.
         The old model normalised velocity every frame (no inertia at all) and
         flapped a constant sine — it read as a shuddering hovering plate. */

      const cu = (r.beatClock % cyc) / cyc;
      const stF = r.strokeT / cyc;
      const stroke = cu < stF ? Math.pow(Math.sin(cu / stF * Math.PI), 0.65) : 0;
      beat = 0.14 + 0.95 * stroke;                     // wing envelope for the mesh
      r.phase += dt * (stroke > 0.05 ? TAU / r.strokeT : TAU / cyc);

      r._t = r._t || new THREE.Vector2();
      r._t.x += (rnd() - 0.5) * 1.1 * dt;
      r._t.y += (rnd() - 0.5) * 0.8 * dt;
      confine(r.p, r.v, r._t, 1.4);

      r.v.z = -r.v.x * sa + r.v.z * ca;

      const hl = Math.hypot(r.v.x, r.v.z) || 0.05;
      const thrust = stroke * 1.30 - 0.12;
      r.v.x += r.v.x / hl * thrust * dt;

  } else {

        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setTargetAtTime(vol, ctx.currentTime, 0.6);
        if (schedTimer) clearInterval(schedTimer);
        schedTimer = setInterval(schedule, 60);
        birdAt = ctx.currentTime + 6;
      } catch (e){
        console.warn('audio unavailable:', e);
        musicOn = false;
      }
      return musicOn;
    },
    stop(){
      if (!ready) { musicOn = false; return; }
      musicOn = false;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.35);
      if (schedTimer){ clearInterval(schedTimer); schedTimer = null; }
    },
    toggle(){ musicOn ? this.stop() : this.start(); return musicOn; },
    setVolume(v){
      vol = clamp(v, 0, 1);
      if (ready && musicOn) master.gain.setTargetAtTime(vol, ctx.currentTime, 0.12);
    },
    splash,
    /** Ambience follows the world: more wind, more surf, hush at night. */
    update(dt, windAmt, nightAmt, paused){
      if (!ready) return;
      const t = ctx.currentTime;
      windGain.gain.setTargetAtTime(0.006 + windAmt * windAmt * 0.075, t, 0.5);
      windFilter.frequency.setTargetAtTime(320 + windAmt * 1250, t, 0.5);
      surfGain.gain.setTargetAtTime((0.022 + windAmt * 0.075) * (1 - nightAmt * 0.42), t, 0.6);
      wet.gain.setTargetAtTime(paused ? 0.42 : 0.55, t, 0.5);
      // daytime gulls, now and then
      if (musicOn && nightAmt < 0.25 && t > birdAt){
        chirp();
        birdAt = t + 9 + Math.random() * 16;
      }
    },
  };
})();

/* ====================== 17. QUALITY TIERS AT RUNTIME ====================== */
function collectCounts(){
  scene.traverse(o => {
    if (o.isInstancedMesh && o.userData.baseCount === undefined) o.userData.baseCount = o.count;
  });
}
function applyTier(name){
  if (!TIERS[name]) return;
  tierName = name; Q = TIERS[name];
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, Q.dpr));
  sun.shadow.mapSize.set(Q.shadow, Q.shadow);
  if (sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }
  buildWaterSurface();
  const k = { lite: 0.42, balanced: 0.76, high: 1 }[name];
  scene.traverse(o => {
    if (o.isInstancedMesh && o.userData.baseCount)
      o.count = Math.max(1, Math.round(o.userData.baseCount * k));
  });
  onResize();
  document.querySelectorAll('#segQual button').forEach(b =>
    b.classList.toggle('active', b.dataset.q === name));
}
collectCounts();

/* ============================ 18. INTERFACE ============================== */
const $ = id => document.getElementById(id);

// collapsible cards
document.querySelectorAll('.card > header').forEach(h => {
  h.addEventListener('click', () => {
    const card = h.parentElement;
    card.dataset.open = card.dataset.open === '1' ? '0' : '1';
  });
});

// actions
$('btnKayak').addEventListener('click', () => {
  toggleKayak();
  $('kayakLabel').textContent = kayakState.mode === 'moored' ? 'Launch kayak' : 'Return kayak';
  $('btnKayak').classList.toggle('active', kayakState.mode !== 'moored');
});
$('btnRay').addEventListener('click', () => {
  const L = triggerRayLeap();
  $('btnRay').classList.toggle('active', !!L);
});

const icoPause = $('icoPause');
function setPaused(p){
  state.paused = p;
  icoPause.innerHTML = p ? '<path d="M7 4l13 8-13 8z"/>' : '<path d="M9 5v14M15 5v14"/>';
  $('btnPause').classList.toggle('on', p);
}
$('btnPause').addEventListener('click', () => setPaused(!state.paused));
$('btnSound').addEventListener('click', () => {
  const on = audio.toggle();
  $('btnSound').classList.toggle('on', on);
  if (on) setVolumeUI(+sVol.value / 100);
});
const sVol = $('sVol'), vVol = $('vVol');
function setVolumeUI(v){ audio.setVolume(v); vVol.textContent = Math.round(v * 100); }
sVol.addEventListener('input', () => setVolumeUI(+sVol.value / 100));

// sliders
const sTide = $('sTide'), vTide = $('vTide');
sTide.addEventListener('input', () => {
  state.tideTarget = +sTide.value;
  vTide.textContent = (state.tideTarget).toFixed(2);
});
const sWind = $('sWind'), vWind = $('vWind');
sWind.addEventListener('input', () => {
  state.windTarget = +sWind.value;
  vWind.textContent = state.windTarget.toFixed(2);
});

// time of day
$('segTime').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.tod = +b.dataset.t;
  $('segTime').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
});
// quality
$('segQual').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  applyTier(b.dataset.q);
});
// cameras
document.querySelectorAll('[data-cam]').forEach(b => {
  b.addEventListener('click', () => goToCamera(+b.dataset.cam));
});

// reset
function resetAll(){
  state.tideTarget = 0; state.windTarget = 0.35;
  sTide.value = 0; vTide.textContent = '0.00';
  sWind.value = 0.35; vWind.textContent = '0.35';
  state.tod = 0;
  $('segTime').querySelectorAll('button').forEach((x, i) => x.classList.toggle('active', i === 0));
  setPaused(false);
  if (kayakState.mode !== 'moored'){
    kayakState.mode = 'moored';
    $('kayakLabel').textContent = 'Launch kayak';
    $('btnKayak').classList.remove('active');
  }
  rays.forEach(r => { r.leap = null; });
  $('btnRay').classList.remove('active');
  goToCamera(0);
}
$('btnReset').addEventListener('click', resetAll);

// keyboard
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === ' '){ e.preventDefault(); setPaused(!state.paused); }
  else if (k === 'k'){ $('btnKayak').click(); }
  else if (k === 'l'){ $('btnRay').click(); }
  else if (k === 'r'){ resetAll(); }
  else if (k >= '1' && k <= '4'){ goToCamera(+k - 1); }
});

// mobile: the dock collapses behind a handle
const dock = $('dock'), dockToggle = $('dockToggle');
function isMobile(){ return matchMedia('(max-width:860px), (max-height:520px)').matches; }
function setDock(open){
  dock.classList.toggle('hidden', !open);
  dockToggle.classList.toggle('active', open);
}
if (isMobile()){
  document.querySelectorAll('.card').forEach(c => c.dataset.open = '0');
  document.querySelector('.card .body');      // Actions is the first card
  document.querySelectorAll('.card')[0].dataset.open = '1';
  setDock(false);
}
dockToggle.addEventListener('click', () => setDock(dock.classList.contains('hidden')));
addEventListener('resize', () => { if (!isMobile()) setDock(true); });

/* boot */
bootEl.classList.add('ready');
$('enterBtn').addEventListener('click', () => {
  bootEl.classList.add('gone');
  const on = audio.start();
  $('btnSound').classList.toggle('on', on);
  if (on) setVolumeUI(+sVol.value / 100);
});

/* ============================== 19. RESIZE =============================== */
function onResize(){
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, Q.dpr));
  renderer.setSize(w, h, false);
  // pull the camera back a little on narrow screens so the island still fits
  const fov = w / h < 0.85 ? 30 : 26;
  if (camera.fov !== fov){ camera.fov = fov; camera.updateProjectionMatrix(); }
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 120));
if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
onResize();

/* ============================= 20. MAIN LOOP ============================= */
const clock = new THREE.Clock();
let worldT = 0;
let envFrame = 0, envTod = -1;
applyTide(0);
goToCamera(0);
camAnim.active = false;                     // start already framed
refreshEnv(); envTod = state.todBlend;

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const sdt = state.paused ? 0 : dt;          // the world stops; the camera does not
  if (!state.paused) worldT += sdt;
  U.time.value = worldT;

  // --- tide & wind ease toward their targets
  state.tide = damp(state.tide, state.tideTarget, 2.2, dt);
  applyTide(state.tide);
  state.wind = damp(state.wind, state.windTarget, 2.0, dt);
  U.wind.value = state.wind;
  U.amp.value = 0.10 + state.wind * 1.05;

  // --- time of day crossfade
  state.todBlend = damp(state.todBlend, state.tod, 1.9, dt);
  const i0 = Math.min(TOD.length - 1, Math.floor(state.todBlend));
  const i1 = Math.min(TOD.length - 1, i0 + 1);
  applyTOD(TOD[i0], TOD[i1], smoother(clamp(state.todBlend - i0, 0, 1)));
  // re-prefilter the environment a few times during the crossfade, not every frame
  if (++envFrame % 8 === 0 && Math.abs(state.todBlend - envTod) > 0.012){
    refreshEnv(); envTod = state.todBlend;
  }

  // --- world
  updateSchools(sdt, worldT);
  updateRays(sdt, worldT);
  updateKayak(sdt, worldT);
  splash.update(sdt);

  updateCamera(dt);
  controls.update();
  audio.update(dt, U.wind.value, U.night.value, state.paused);

  // keep the buttons honest about what the world is actually doing
  if (!rays.some(r => r.leap)) $('btnRay').classList.remove('active');
  const out = kayakState.mode !== 'moored';
  if ($('btnKayak').classList.contains('active') !== out){
    $('btnKayak').classList.toggle('active', out);
    $('kayakLabel').textContent = out ? 'Return kayak' : 'Launch kayak';
  }

  renderer.render(scene, camera);
}
bootBar.style.width = '100%';
tick();</script>
