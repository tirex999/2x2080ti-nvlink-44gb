<!DOCTYPE html>
<html lang="en">
<head>
<!--
  ═══════════════════════════════════════════════════════════════════════
  TIDEHAVEN — an interactive 3D island diorama. Single file, no assets.
  Three.js r160 via CDN import-map; everything is built procedurally.

  Architecture map (search the banner comments in the module script):
    §1 core setup        §2 sky / lights / time-of-day
    §3 island math (single source of truth: islandR / heightAt / waveH —
       mirrored in GLSL so foam & caustics hug the real shoreline)
    §4 diorama case      §5 seabed & underwater scenery
    §6 water (surface shader + volume tint + glass walls; strict
       renderOrder layering, depthWrite off — no transparency sorting)
    §7 effects (ripples, droplets, bubbles, fireflies, fire)
    §8 fauna (rays, fish schools)   §9 scenery props (cabin, pier…)
    §10 interactions (kayak / leap / state)  §11 cameras
    §12 UI wiring        §13 procedural audio  §14 main loop
  Debug hooks (for automated screenshots): ?cam=iso|cabin|under
    &time=day|sunset|night &auto=leap|kayak &tide=-55..70
  ═══════════════════════════════════════════════════════════════════════
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidehaven — a tiny island diorama</title>
<style>
  :root{
    --ink:#f3ede1; --ink-dim:#c9c2b4;
    --panel:rgba(18,24,30,.55);
    --edge:rgba(255,255,255,.14); --accent:#7fd6c2; --accent-ink:#0c2a26;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    font-family:"Avenir Next","Segoe UI",Inter,system-ui,sans-serif;
    background:#10202a; color:var(--ink);
    -webkit-font-smoothing:antialiased; user-select:none;
  }
  canvas{ display:block; }
  #ui{ position:fixed; inset:0; pointer-events:none; z-index:5; }

  /* ---------- title ---------- */
  #hud{ position:absolute; top:18px; left:20px; max-width:44vw; text-shadow:0 2px 14px rgba(0,10,14,.55); }
  #hud h1{ font-size:30px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
           color:#fdf6e8; font-family:Georgia,"Times New Roman",serif; }
  #hud p{ margin-top:4px; font-size:12.5px; letter-spacing:.05em; color:var(--ink-dim); }

  /* ---------- panels ---------- */
  #panels{ position:absolute; top:16px; right:16px; width:236px; display:flex; flex-direction:column;
           gap:10px; pointer-events:auto; max-height:calc(100vh - 32px); overflow-y:auto;
           scrollbar-width:none; padding-bottom:4px; }
  #panels::-webkit-scrollbar{ display:none; }
  .panel{ background:var(--panel); border:1px solid var(--edge); border-radius:14px;
          backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
          box-shadow:0 8px 28px rgba(0,8,12,.35); overflow:hidden; }
  .ptoggle{ width:100%; display:flex; justify-content:space-between; align-items:center;
            background:none; border:0; color:var(--ink); font:600 11px/1 inherit;
            letter-spacing:.16em; text-transform:uppercase; padding:12px 14px; cursor:pointer; }
  .ptoggle .chev{ transition:transform .25s; font-size:10px; color:var(--ink-dim); }
  .panel.collapsed .chev{ transform:rotate(-90deg); }
  .panel.collapsed .pbody{ display:none; }
  .pbody{ padding:2px 14px 14px; display:flex; flex-direction:column; gap:10px; }

  .row{ display:flex; gap:8px; }
  .btn{ flex:1; background:rgba(255,255,255,.07); border:1px solid var(--edge); color:var(--ink);
        border-radius:10px; padding:8px 6px; font:600 11.5px/1.2 inherit; cursor:pointer;
        transition:background .15s, border-color .15s, transform .05s; white-space:nowrap; }
  .btn:hover{ background:rgba(255,255,255,.14); }
  .btn:active{ transform:scale(.97); }
  .btn.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .seg{ display:flex; gap:6px; }
  .seg .btn{ padding:7px 4px; }

  label.ctl{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim);
             display:flex; justify-content:space-between; align-items:baseline; margin-bottom:-4px; }
  label.ctl b{ color:var(--ink); font-weight:600; letter-spacing:0; }
  input[type=range]{ width:100%; appearance:none; -webkit-appearance:none; height:22px; background:none; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track{ height:4px; border-radius:2px;
       background:linear-gradient(90deg,var(--accent),rgba(255,255,255,.16)); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:15px; height:15px; margin-top:-5.5px;
       border-radius:50%; background:#fdf6e8; border:2px solid var(--accent); box-shadow:0 1px 6px rgba(0,0,0,.5); }
  input[type=range]::-moz-range-track{ height:4px; border-radius:2px; background:rgba(255,255,255,.25); }
  input[type=range]::-moz-range-thumb{ width:13px; height:13px; border-radius:50%; background:#fdf6e8; border:2px solid var(--accent); }
  select{ width:100%; background:rgba(255,255,255,.07); color:var(--ink); border:1px solid var(--edge);
          border-radius:9px; padding:6px 8px; font:500 12px inherit; }
  select option{ color:#111; }

  #hint{ position:absolute; left:50%; bottom:12px; transform:translateX(-50%);
         font-size:11px; letter-spacing:.06em; color:var(--ink-dim);
         background:var(--panel); border:1px solid var(--edge); border-radius:999px;
         padding:7px 16px; backdrop-filter:blur(8px); white-space:nowrap; pointer-events:none; }

  /* ---------- loader / error ---------- */
  #loader{ position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; gap:14px;
           align-items:center; justify-content:center; background:radial-gradient(120% 120% at 50% 30%, #17303c, #0a141b);
           transition:opacity .8s; }
  #loader.hide{ opacity:0; pointer-events:none; }
  #loader .lt{ font:600 34px Georgia,serif; letter-spacing:.22em; text-transform:uppercase; color:#fdf6e8; }
  #loader .ls{ font-size:12px; letter-spacing:.14em; color:#9fb4ad; }
  #loader .sp{ width:34px; height:34px; border-radius:50%; border:3px solid rgba(255,255,255,.15);
               border-top-color:var(--accent); animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  #errbox{ position:fixed; left:50%; top:18%; transform:translateX(-50%); z-index:30; max-width:80vw;
           background:#3a1512; border:1px solid #a05044; color:#ffd9cf; border-radius:12px;
           padding:14px 18px; font:13px/1.5 monospace; white-space:pre-wrap; }

  /* ---------- mobile ---------- */
  @media (max-width:760px){
    #hud h1{ font-size:20px; }
    #hud{ max-width:60vw; }
    #panels{ top:auto; bottom:54px; right:8px; left:8px; width:auto; flex-direction:row; flex-wrap:wrap;
             max-height:46vh; align-items:flex-start; }
    .panel{ flex:1 1 150px; }
    #hint{ bottom:8px; font-size:9.5px; padding:5px 10px; max-width:96vw; white-space:normal; text-align:center; }
  }
</style>
<script>
  /* surface any script error on screen (also captured by headless console dumps) */
  window.addEventListener('error', e => {
    const box = document.getElementById('errbox');
    if (!box) return;
    box.hidden = false;
    box.textContent = 'Tidehaven error:\n' + (e.message || e.error) + '\n' + (e.filename||'') + ':' + (e.lineno||'');
  });
</script>
</head>
<body>
<div id="ui">
  <header id="hud">
    <h1>Tidehaven</h1>
    <p>A cozy island above, a living lagoon below — drag to explore.</p>
  </header>

  <div id="panels">
    <section class="panel" id="pWorld">
      <button class="ptoggle">World <span class="chev">▾</span></button>
      <div class="pbody">
        <div class="row">
          <button class="btn" id="kayakBtn">Launch Kayak</button>
          <button class="btn" id="leapBtn">Ray Leap</button>
        </div>
        <label class="ctl">Tide <b id="tideVal">0.05</b></label>
        <input type="range" id="tide" min="-55" max="70" value="5">
        <label class="ctl">Wind <b id="windVal">0.45</b></label>
        <input type="range" id="wind" min="0" max="100" value="45">
        <div class="seg" id="tod">
          <button class="btn active" data-t="day">Day</button>
          <button class="btn" data-t="sunset">Sunset</button>
          <button class="btn" data-t="night">Night</button>
        </div>
        <div class="row">
          <button class="btn" id="pauseBtn">Pause</button>
          <button class="btn" id="resetBtn">Reset</button>
        </div>
      </div>
    </section>

    <section class="panel" id="pCam">
      <button class="ptoggle">Camera <span class="chev">▾</span></button>
      <div class="pbody">
        <div class="seg" id="camseg">
          <button class="btn active" data-c="iso">Iso</button>
          <button class="btn" data-c="cabin">Cabin</button>
          <button class="btn" data-c="under">Under</button>
        </div>
        <label class="ctl">Quality</label>
        <select id="quality">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </section>

    <section class="panel" id="pAudio">
      <button class="ptoggle">Audio <span class="chev">▾</span></button>
      <div class="pbody">
        <button class="btn" id="musicBtn" style="flex:none">♪&nbsp; Music: Off</button>
        <label class="ctl">Volume <b id="volVal">70%</b></label>
        <input type="range" id="vol" min="0" max="100" value="70">
      </div>
    </section>
  </div>

  <footer id="hint">Drag orbit · Scroll zoom · 1/2/3 cameras · Space kayak · J ray leap · P pause</footer>
</div>

<div id="loader"><div class="lt">Tidehaven</div><div class="ls">building the island…</div><div class="sp"></div></div>
<div id="errbox" hidden></div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ═════════════════ §1 CORE SETUP ═════════════════ */

const Q = new URLSearchParams(location.search);          // debug hooks (see header)
const BLOCK = 23, HALF = BLOCK / 2;                      // diorama footprint
const SEABED = -4.85, DECK_Y = 1.15;                     // key heights
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const sstep = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
function rng(seed){ let s=seed>>>0; return ()=>{ s=Math.imul(s^s>>>15,1|s); s^=s+Math.imul(s^s>>>7,61|s); return ((s^s>>>14)>>>0)/4294967296; }; }
const rand = rng(20261012);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); // capped; quality menu adjusts
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xd8e8ea, 0.0075);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 600);
camera.position.set(17, 12.5, 17);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.target.set(0, 0.3, 0);
controls.minDistance = 4; controls.maxDistance = 46;
controls.maxPolarAngle = 1.62;

/* Global uniforms shared by every custom shader & injected material. */
const SU = {
  uTime:   { value: 0 },
  uWind:   { value: 0.45 },
  uWaterY: { value: 0.05 },
  uSunDir: { value: new THREE.Vector3(0.55,0.75,0.4).normalize() },
  uSunCol: { value: new THREE.Color('#fff2df') },
  uSkyT:   { value: new THREE.Color('#cfeaf0') },  // sky tint (glass, water reflection)
  uDeep:   { value: new THREE.Color('#16728a') },
  uShallow:{ value: new THREE.Color('#3fc6c2') },
  uFoamC:  { value: new THREE.Color('#f2fbfa') },
  uTint:   { value: new THREE.Color('#2aa7a0') },
  uDay:    { value: 1 },     // sun strength 0..1
  uCaustic:{ value: 1 },
  uGlow:   { value: 0 },     // lantern/window light level
};

const clock = new THREE.Clock();
let simTime = 0;                       // frozen while paused
const state = { tide:0.05, tideSm:0.05, wind:0.45, windSm:0.45,
                tod:'day', paused:false, quality:'medium' };

/* Soft radial sprite for points (bubbles / droplets / fireflies). */
function dotTexture(soft){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32,32,2,32,32,30);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(soft, 'rgba(255,255,255,0.5)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
const dotTex = dotTexture(0.45);

/* ═════════════════ §2 SKY · LIGHTS · TIME OF DAY ═════════════════ */

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{ uTop:{value:new THREE.Color('#7fb8dd')}, uHor:{value:new THREE.Color('#e9f2ee')} },
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform vec3 uTop,uHor; varying vec3 vP;
    void main(){ float t=pow(clamp(normalize(vP).y,0.0,1.0),0.62); gl_FragColor=vec4(mix(uHor,uTop,t),1.0); }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(250, 24, 16), skyMat);
sky.renderOrder = -10; scene.add(sky);

/* stars — fade in at night, visible "through" the lagoon (water never writes depth) */
const starGeo = new THREE.BufferGeometry();
{ const N=420, p=new Float32Array(N*3);
  for(let i=0;i<N;i++){ const a=rand()*Math.PI*2, ph=Math.acos(rand()*0.95), r=150+rand()*40;
    p[i*3]=Math.sin(ph)*Math.cos(a)*r; p[i*3+1]=Math.abs(Math.cos(ph))*r*0.9+8; p[i*3+2]=Math.sin(ph)*Math.sin(a)*r; }
  starGeo.setAttribute('position', new THREE.BufferAttribute(p,3)); }
const starMat = new THREE.PointsMaterial({ color:0xffffff, size:1.3, transparent:true, opacity:0,
  depthWrite:false, blending:THREE.AdditiveBlending, fog:false });
const stars = new THREE.Points(starGeo, starMat); stars.renderOrder = 1; scene.add(stars);

const moonMat = new THREE.MeshBasicMaterial({ color:0xfff3d6, transparent:true, opacity:0, fog:false, depthWrite:false });
const moon = new THREE.Mesh(new THREE.SphereGeometry(4.5, 18, 14), moonMat);
moon.renderOrder = 1; scene.add(moon);

const hemi = new THREE.HemisphereLight(0xb8d8ec, 0xd8c298, 0.75);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2df, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-13; sun.shadow.camera.right=13;
sun.shadow.camera.top=13;  sun.shadow.camera.bottom=-13;
sun.shadow.camera.near=8;  sun.shadow.camera.far=60;
sun.shadow.bias=-0.0008; sun.shadow.normalBias=0.03;
scene.add(sun); scene.add(sun.target);

/* Time-of-day presets. Everything below is lerped toward the active one. */
const PRESET = {
  day:   { dir:[0.55,0.75,0.4], sunC:'#fff2df', sunI:2.4, hemiS:'#b8d8ec', hemiG:'#d8c298', hemiI:0.75,
           skyT:'#7fb8dd', skyH:'#e9f2ee', fog:'#d8e8ea', deep:'#16728a', shal:'#3fc6c2', tint:'#2aa7a0',
           foamC:'#f2fbfa', skyTint:'#cfeaf0', day:1, caustic:1, glow:0, star:0, expo:1.05 },
  sunset:{ dir:[-0.42,0.20,0.52], sunC:'#ff9a55', sunI:1.9, hemiS:'#7e6fa0', hemiG:'#b1805c', hemiI:0.45,
           skyT:'#3c3f6e', skyH:'#ff9e63', fog:'#e0a179', deep:'#14597a', shal:'#3f9fb0', tint:'#1f8490',
           foamC:'#ffe9d9', skyTint:'#ffb070', day:0.55, caustic:0.5, glow:0.65, star:0.18, expo:1.0 },
  night: { dir:[0.35,0.85,-0.42], sunC:'#93a7d6', sunI:0.45, hemiS:'#2a3a63', hemiG:'#1c2436', hemiI:0.3,
           skyT:'#0a1230', skyH:'#223458', fog:'#1b2a4a', deep:'#0a3550', shal:'#17607a', tint:'#0d5568',
           foamC:'#cfe6ee', skyTint:'#3a5a8a', day:0.14, caustic:0.14, glow:1, star:1, expo:0.95 },
};
const CUR = { dir:new THREE.Vector3(...PRESET.day.dir) };
for (const k of ['sunC','hemiS','hemiG','skyT','skyH','fog','deep','shal','tint','foamC','skyTint'])
  CUR[k] = new THREE.Color(PRESET.day[k]);
for (const k of ['sunI','hemiI','day','caustic','glow','star','expo']) CUR[k] = PRESET.day[k];

const _cTmp = new THREE.Color(), _vTmp = new THREE.Vector3();
function applyTOD(dt){
  const P = PRESET[state.tod];
  const k = 1 - Math.exp(-dt*1.6);
  _vTmp.set(...P.dir); CUR.dir.lerp(_vTmp, k);
  for (const c of ['sunC','hemiS','hemiG','skyT','skyH','fog','deep','shal','tint','foamC','skyTint'])
    CUR[c].lerp(_cTmp.set(P[c]), k);
  for (const n of ['sunI','hemiI','day','caustic','glow','star','expo']) CUR[n] = lerp(CUR[n], P[n], k);

  const dir = CUR.dir.clone().normalize();
  sun.position.copy(dir).multiplyScalar(26);
  sun.color.copy(CUR.sunC); sun.intensity = CUR.sunI;
  hemi.color.copy(CUR.hemiS); hemi.groundColor.copy(CUR.hemiG); hemi.intensity = CUR.hemiI;
  skyMat.uniforms.uTop.value.copy(CUR.skyT); skyMat.uniforms.uHor.value.copy(CUR.skyH);
  scene.fog.color.copy(CUR.fog);
  renderer.toneMappingExposure = CUR.expo;
  SU.uSunDir.value.copy(dir); SU.uSunCol.value.copy(CUR.sunC);
  SU.uDeep.value.copy(CUR.deep); SU.uShallow.value.copy(CUR.shal);
  SU.uTint.value.copy(CUR.tint); SU.uFoamC.value.copy(CUR.foamC); SU.uSkyT.value.copy(CUR.skyTint);
  SU.uDay.value = CUR.day; SU.uCaustic.value = CUR.caustic; SU.uGlow.value = CUR.glow;
  starMat.opacity = CUR.star;
  moonMat.opacity = CUR.star*0.95;
  moon.position.copy(dir).multiplyScalar(130);
}

/* ═════════════════ §3 ISLAND MATH (single source of truth) ═════════════════
   islandR(a): coastline radius by angle (JS; GLSL in the water shader matches).
   heightAt(x,z): terrain elevation — every prop sits on this, nothing floats.
   waveH(x,z,t): surface waves (JS mirrors the water vertex shader).         */

function islandR(a){
  let R = 5.0 + 1.0*Math.sin(a*3+1.7) + 0.6*Math.sin(a*5+4.1) + 0.45*Math.sin(a*2+0.6);
  const d = a - 0.6;                       // peninsula bulge toward the pier
  return R + 1.6*Math.exp(-d*d/0.0784);
}
function heightAt(x,z){
  const r = Math.hypot(x,z), a = Math.atan2(z,x);
  const R = islandR(a);
  let h;
  if (r > R){ h = -1.25 - Math.pow((r-R)/1.7, 1.35)*4.6; }
  else {
    const t = (R-r)/3.6, s = t*t*(3-2*t);
    h = -1.25 + s*4.5;
    h += 1.1*Math.exp(-(((x-1.9)**2+(z+1.5)**2)/2.0));           // cabin mound
    h += 1.5*Math.exp(-(((x+2.7)**2+(z+1.9)**2)/6));             // tree hill
    h += 0.22*Math.sin(x*1.9+0.5)*Math.cos(z*1.7)
       + 0.12*Math.sin(x*4.3+2.0)*Math.sin(z*3.7+1.0);
  }
  return Math.max(h, -5.5);
}
function waveH(x,z,t,wind){
  const k = 0.25 + wind*0.75;
  const d = 1 - sstep(2.5, 8.5, Math.hypot(x,z));
  return (Math.sin(x*0.55+t*1.1)*0.10 + Math.sin(z*0.47-t*0.9)*0.09 +
          Math.sin((x+z)*0.9+t*1.7)*0.05) * k * (1-d*0.85);
}

/* Shared GLSL snippets. */
const GLSL_CAUSTIC = `
float causticPat(vec2 p, float t){
  float v = sin(p.x*1.35 + t*0.9 + sin(p.y*1.1 + t*0.55)*1.5)
          + sin(p.y*1.6 - t*0.75 + sin(p.x*0.9 - t*0.6)*1.4);
  return pow(max(0.0, 1.0 - abs(v)*0.52), 3.0);
}`;

/* Inject animated caustics + depth attenuation into a Standard material. */
function makeCaustic(mat){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = SU.uTime; sh.uniforms.uWaterY = SU.uWaterY; sh.uniforms.uCaustic = SU.uCaustic;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWP=(modelMatrix*vec4(transformed,1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP;\nuniform float uTime; uniform float uWaterY; uniform float uCaustic;\n' + GLSL_CAUSTIC)
      .replace('#include <dithering_fragment>', `#include <dithering_fragment>
        float cw = smoothstep(0.15, -0.5, vWP.y - uWaterY);          // under water only
        float cd = clamp((uWaterY - vWP.y)/4.5, 0.0, 1.0);
        gl_FragColor.rgb += causticPat(vWP.xz, uTime) * (0.30*uCaustic)
                          * vec3(0.55,0.85,0.9) * cw * (1.0 - cd*0.5);`);
  };
  return mat;
}
/* Inject wind sway (instancing-aware) into Lambert/Standard foliage materials. */
function makeSway(mat, amp, speed){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = SU.uTime; sh.uniforms.uWind = SU.uWind;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime; uniform float uWind;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        #ifdef USE_INSTANCING
          vec3 iOff = instanceMatrix[3].xyz;
        #else
          vec3 iOff = modelMatrix[3].xyz;
        #endif
        float swY = max(transformed.y, 0.0);
        float ph = iOff.x*1.7 + iOff.z*2.3;
        float swayK = 0.25 + uWind;
        transformed.x += sin(uTime*${speed.toFixed(3)} + ph + transformed.y*2.0) * ${amp.toFixed(4)} * swY * swY * swayK;
        transformed.z += cos(uTime*${(speed*0.8).toFixed(3)} + ph*1.3 + transformed.y*1.6) * ${amp.toFixed(4)} * swY * swY * swayK;`);
  };
  return mat;
}

/* ═════════════════ §6 WATER — surface, volume, strict layering ═════════════════
   Transparency strategy (why there is no sorting flicker):
   every water element is transparent with depthWrite:false and a fixed
   renderOrder: volume 5 → surface 6 → fx 7-8 → glass 10 → wall caustics 11.
   Opaque geometry (island/seabed/animals) always sorts in front of them.  */

const surfMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, side:THREE.DoubleSide,
  uniforms:{ uTime:SU.uTime, uWind:SU.uWind, uSunDir:SU.uSunDir, uSunCol:SU.uSunCol,
             uSkyT:SU.uSkyT, uDeep:SU.uDeep, uShallow:SU.uShallow, uFoamC:SU.uFoamC, uDay:SU.uDay },
  vertexShader:`
    uniform float uTime, uWind;
    varying vec3 vW; varying vec3 vN; varying float vH;
    float wave(vec2 p, float w){
      float k = 0.25 + w*0.75;
      float d = 1.0 - smoothstep(2.5, 8.5, length(p));
      float h = 0.0;
      h += sin(p.x*0.55 + uTime*1.1)*0.10;
      h += sin(p.y*0.47 - uTime*0.9)*0.09;
      h += sin((p.x+p.y)*0.9 + uTime*1.7)*0.05;
      h += sin((p.x-p.y)*1.7 - uTime*2.3)*0.03*(0.4+w);
      return h * k * (1.0 - d*0.85);
    }
    void main(){
      vec3 pos = position;
      float h = wave(pos.xy, uWind);
      float e = 0.35;
      float hx = wave(pos.xy + vec2(e,0.0), uWind);
      float hy = wave(pos.xy + vec2(0.0,e), uWind);
      pos.z += h;
      vec3 n = normalize(vec3(-(hx-h)/e, -(hy-h)/e, 1.0));
      vec4 w = modelMatrix * vec4(pos,1.0);
      vW = w.xyz; vN = normalize(mat3(modelMatrix)*n); vH = h;
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader:`
    uniform vec3 uDeep,uShallow,uFoamC,uSunCol,uSkyT; uniform vec3 uSunDir;
    uniform float uTime,uWind,uDay;
    varying vec3 vW; varying vec3 vN; varying float vH;
    float islandR(float a){
      float R = 5.0 + 1.0*sin(a*3.0+1.7) + 0.6*sin(a*5.0+4.1) + 0.45*sin(a*2.0+0.6);
      float d = a - 0.6;
      return R + 1.6*exp(-d*d/0.0784);
    }
    void main(){
      vec3 N = normalize(vN) * (gl_FrontFacing ? 1.0 : -1.0);
      vec3 V = normalize(cameraPosition - vW);
      float fres = pow(1.0 - clamp(dot(N,V),0.0,1.0), 3.0);
      vec3 col = mix(uShallow, uDeep, clamp(fres*0.9,0.0,1.0));
      col = mix(col, uSkyT, fres*0.35);
      vec3 Hv = normalize(uSunDir + V);
      col += uSunCol * pow(max(dot(N,Hv),0.0), 90.0) * 0.9 * uDay;
      float ang  = atan(vW.z, vW.x);
      float dist = length(vW.xz) - islandR(ang);
      float band = exp(-max(dist,0.0)*2.0);
      float lap  = 0.55 + 0.45*sin(ang*7.0 + uTime*1.4 + dist*4.5);
      float foam = smoothstep(0.30, 0.75, band*lap*(0.75+0.25*sin(uTime*1.1)));
      float crest = smoothstep(0.5, 0.95, vH/(0.24*(0.25+uWind)+0.0001))*0.45
                  * smoothstep(1.0, 3.0, dist);
      foam = clamp(max(foam, crest), 0.0, 1.0);
      col = mix(col, uFoamC, foam);
      float alpha = 0.5 + fres*0.35 + foam*0.45;
      alpha *= mix(0.3, 1.0, smoothstep(-1.6, 0.1, dist));   // soft shore contact
      gl_FragColor = vec4(col, clamp(alpha, 0.0, 0.95));
    }`,
});

   shader (per-ray material instance so the jumper can flap harder).        */
function makeRayGeo(){
  const disc = new THREE.SphereGeometry(1, 22, 14); disc.scale(1.15, 0.15, 1.0);
  const snout = new THREE.ConeGeometry(0.55, 0.95, 12); snout.rotateX(-Math.PI/2); snout.translate(0,0,-0.88);
  const tail = new THREE.ConeGeometry(0.16, 2.4, 8); tail.rotateX(Math.PI/2); tail.translate(0,-0.02,1.5);
  return mergeGeometries([disc, snout, tail]);
}
const rayGeo = makeRayGeo();
function rayMaterial(top, bottom){
  return new THREE.ShaderMaterial({
    uniforms:{ uTime:SU.uTime, uFin:{value:1}, uTop:{value:new THREE.Color(top)}, uBottom:{value:new THREE.Color(bottom)} },
    vertexShader:`
      uniform float uTime,uFin; varying vec3 vN; varying vec3 vW;
      void main(){
        vec3 pos = position;
        float w = abs(pos.x);
        pos.y += sin(pos.z*1.8 + uTime*3.4) * w * 0.30 * uFin;      // wing undulation
        pos.y += sin(w*2.6 - uTime*3.4) * w * 0.10 * uFin;
        if (pos.z > 0.9){ float tt = pos.z-0.9;                       // tail sway
          pos.x += sin(tt*2.2 - uTime*3.4) * tt * 0.22; }
        vec4 w4 = modelMatrix*vec4(pos,1.0);
        vW = w4.xyz; vN = normalize(mat3(modelMatrix)*normal);
        gl_Position = projectionMatrix*viewMatrix*w4;
      }`,
    fragmentShader:`
      uniform vec3 uTop,uBottom; varying vec3 vN; varying vec3 vW;
      void main(){
        float up = dot(normalize(vN), vec3(0.0,1.0,0.0))*0.5+0.5;
        vec3 col = mix(uBottom, uTop, up);
        float d = clamp((0.0 - vW.y)/4.5, 0.0, 1.0);                 // depth dim
        col *= mix(1.0, 0.5, d);
        col += vec3(0.0,0.12,0.15)*(1.0-d)*0.25;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
}
const rays = [
  { cfg:{cx:-0.5, cz:0.8, rx:7.2, rz:6.4, y:-2.4, sp:0.16, ph:0},   top:'#6f6d8c', bot:'#e8e4da' },
  { cfg:{cx:1.2,  cz:-0.6,rx:5.8, rz:7.6, y:-3.2, sp:0.13, ph:2.1}, top:'#5d7a86', bot:'#dfe2d8' },
  { cfg:{cx:0.4,  cz:1.4, rx:8.2, rz:5.2, y:-1.9, sp:0.11, ph:4.2}, top:'#7c6a7e', bot:'#eae4d6' },
].map(r=>{
  const mat = rayMaterial(r.top, r.bot);
  const mesh = new THREE.Mesh(rayGeo, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);
  return { mesh, mat, a:rand()*Math.PI*2, ...r.cfg, jump:{ on:false, t:0, curve:null, prevY:0 } };
});

function rayPos(r, a){
  return new THREE.Vector3(
    r.cx + Math.cos(a)*r.rx,
    r.y + Math.sin(simTime*0.5 + r.ph)*0.45,
    r.cz + Math.sin(a)*r.rz);
}
function triggerLeap(){
  const r = rays[0];
  if (r.jump.on) return;
  const p0 = r.mesh.position.clone();
  const exit = new THREE.Vector3(p0.x*0.35, 0, 1.5);              // surface near the glass
  const dir  = new THREE.Vector3(0.25, 0, -0.9).normalize();
  const apex = exit.clone().addScaledVector(dir, 2.4); apex.y = 3.2;
  const entry= apex.clone().addScaledVector(dir, 2.8); entry.y = 0.45;
  const sink = entry.clone().addScaledVector(dir, 1.0); sink.y = -1.9;
  r.jump.curve = new THREE.CatmullRomCurve3(
    [p0, p0.clone().lerp(exit,0.7).setY(-0.4), exit, apex, entry, sink]);
  r.jump.t = 0; r.jump.on = true; r.jump.prevY = p0.y;
  SFX.whoosh();
}
const _look = new THREE.Vector3();
function updateRays(dt){
  for (const r of rays){
    if (r.jump.on){
      r.jump.t += dt/2.5;
      const t = Math.min(r.jump.t, 1);
      const p = r.jump.curve.getPointAt(t);
      const tan = r.jump.curve.getTangentAt(Math.min(t,0.999));
      r.mesh.position.copy(p);
      const wy = state.tideSm;
      if (r.jump.prevY < wy && p.y >= wy){                        // exiting the surface
        spawnRipple(p.x, p.z, 0.5, 2.6, 1.2);
        spawnSplash(p.x, wy, p.z, 8, 0.7);
      }
      if (t > 0.35 && r.jump.prevY > wy && p.y <= wy){            // re-entry splash
        spawnRipple(p.x, p.z, 1.2, 7.5, 2.2);
        spawnSplash(p.x, wy, p.z, 26, 1.15);
        SFX.splash(1);
      }
      r.jump.prevY = p.y;
      r.mesh.rotation.set(0,0,0);
      r.mesh.rotateY(Math.atan2(-tan.x, -tan.z));
      r.mesh.rotateX(Math.asin(clamp(-tan.y, -1, 1)));
      r.mat.uniforms.uFin.value = lerp(r.mat.uniforms.uFin.value, p.y > wy ? 1.8 : 1.0, dt*6);
      if (r.jump.t >= 1){                                          // hand back to orbit
        r.jump.on = false;
        r.a = Math.atan2((p.z-r.cz)/r.rz, (p.x-r.cx)/r.rx);
      }
      continue;
    }
    r.a += dt*r.sp;
    const p = rayPos(r, r.a);
    _look.copy(rayPos(r, r.a + 0.05));
    r.mesh.position.copy(p);
    r.mesh.rotation.set(0,0,0);
    r.mesh.lookAt(_look);                                        // -Z faces travel direction
    r.mesh.rotateY(Math.PI);                                     // geometry: nose is -Z
    r.mat.uniforms.uFin.value = lerp(r.mat.uniforms.uFin.value, 1.0, dt*4);
  }
}

/* kayak state machine: moored → launch → trip → return → moored */
const tripCurve = new THREE.CatmullRomCurve3([
  [7.6,4.75],[9.3,1.5],[9.0,-3.2],[6.2,-7.2],[2.2,-8.9],[-2.6,-8.7],[-6.6,-6.9],[-9.0,-2.4],
  [-9.2,2.0],[-6.9,6.2],[-3.2,8.5],[0.8,8.9],[4.6,7.7],[6.9,6.3],
].map(p=>new THREE.Vector3(p[0],0,p[1])), true, 'catmullrom', 0.5);
const kayakS = { state:'moored', t:0, p:0, from:new THREE.Vector3(), fromYaw:0 };
function kayakUpdate(dt){
  const wy = state.tideSm;
  const dockPos = new THREE.Vector3(KAYAK_DOCK.x, 0, KAYAK_DOCK.z);
  if (kayakS.state === 'moored'){
    kayak.position.set(KAYAK_DOCK.x, wy + waveH(KAYAK_DOCK.x,KAYAK_DOCK.z,simTime,state.windSm)*0.7, KAYAK_DOCK.z);
    kayak.rotation.set(0, KAYAK_DOCK.yaw, Math.sin(simTime*1.1)*0.04*(0.3+state.windSm));
  } else if (kayakS.state === 'launch'){
    kayakS.t += dt/1.6;
    const t = Math.min(kayakS.t,1), e = t*t*(3-2*t);
    const target = tripCurve.getPointAt(0); target.y = wy;
    kayak.position.lerpVectors(kayakS.from, target, e);
    kayak.rotation.y = lerp(kayakS.fromYaw, Math.atan2(tripCurve.getTangentAt(0).x, tripCurve.getTangentAt(0).z), e);
    kayak.position.y = wy + waveH(kayak.position.x,kayak.position.z,simTime,state.windSm)*0.7;
    if (t>=1) kayakS.state = 'trip';
  } else if (kayakS.state === 'trip'){
    kayakS.p = (kayakS.p + dt*0.016) % 1;
    const p = tripCurve.getPointAt(kayakS.p);
    const tan = tripCurve.getTangentAt(kayakS.p);
    kayak.position.set(p.x, wy + waveH(p.x,p.z,simTime,state.windSm)*0.7, p.z);
    kayak.rotation.set(0, Math.atan2(tan.x,tan.z), Math.cos(simTime*1.6)*0.05*(0.3+state.windSm));
    if (rand() < dt*0.5) spawnRipple(p.x - tan.x*0.5, p.z - tan.z*0.5, 0.3, 1.2, 1.0);
  } else if (kayakS.state === 'return'){
    kayakS.t += dt/2.6;
    const t = Math.min(kayakS.t,1), e = t*t*(3-2*t);
    kayak.position.lerpVectors(kayakS.from, dockPos, e);
    kayak.position.y = wy + waveH(kayak.position.x,kayak.position.z,simTime,state.windSm)*0.7*(1-e*0.4);
    kayak.rotation.y = kayakS.fromYaw + (KAYAK_DOCK.yaw - kayakS.fromYaw)*e;
    if (t>=1){ kayakS.state='moored'; kayakBtn.textContent = 'Launch Kayak'; }
  }
  /* mooring rope: taut while docked, slack-trailing during the trip */
  const rp = ropeGeo.attributes.position;
  const side = new THREE.Vector3(Math.cos(kayak.rotation.y), 0, -Math.sin(kayak.rotation.y)).multiplyScalar(0.3);
  rp.setXYZ(0, kayak.position.x+side.x, kayak.position.y+0.12, kayak.position.z+side.z);
  const mid = kayak.position.clone().lerp(ropeAnchor, 0.5);
  mid.y -= kayakS.state==='moored' ? 0.28 : 0.7;
  rp.setXYZ(1, mid.x, Math.max(mid.y, wy-0.5), mid.z);
  rp.setXYZ(2, ropeAnchor.x, ropeAnchor.y, ropeAnchor.z);
  rp.needsUpdate = true;
}
function toggleKayak(){
  if (kayakS.state === 'moored'){
    kayakS.from.copy(kayak.position); kayakS.fromYaw = kayak.rotation.y;
    kayakS.t = 0; kayakS.state = 'launch';
    kayakBtn.textContent = 'Return Kayak';
    SFX.splash(0.45);
  } else if (kayakS.state === 'trip'){
    kayakS.from.copy(kayak.position); kayakS.fromYaw = kayak.rotation.y;
    kayakS.t = 0; kayakS.state = 'return';
    kayakBtn.textContent = '…returning';
  }
}

const CAMS = {
  iso:   { pos:[17,12.5,17],    tgt:[0,0.3,0] },
  cabin: { pos:[10.5,3.6,9.5],  tgt:[4.2,1.5,1.0] },

};
const camTween = { on:false, t:0, dur:1.7, p0:new THREE.Vector3(), p1:new THREE.Vector3(), t0:new THREE.Vector3(), t1:new THREE.Vector3() };
function setCamera(name, instant){
  document.querySelectorAll('#camseg .btn').forEach(b=>b.classList.toggle('active', b.dataset.c===name));
  const c = CAMS[name];
  if (instant){
    camera.position.set(...c.pos); controls.target.set(...c.tgt); return;
  }
  camTween.p0.copy(camera.position); camTween.p1.set(...c.pos);
  camTween.t0.copy(controls.target); camTween.t1.set(...c.tgt);
  camTween.t = 0; camTween.on = true; controls.enabled = false;
}
function updateCamTween(dt){
  if (!camTween.on) return;
  camTween.t += dt/camTween.dur;
  const t = Math.min(camTween.t,1), e = t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  camera.position.lerpVectors(camTween.p0, camTween.p1, e);
  controls.target.lerpVectors(camTween.t0, camTween.t1, e);
  if (t>=1){ camTween.on=false; controls.enabled=true; }
}

/* ═════════════════ §13 PROCEDURAL AUDIO (starts on first gesture) ═════════════════ */

const SFX = {
  ctx:null, master:null, musicGain:null, ambGain:null,
  musicOn:false, vol:0.7, _timer:null, _next:0, _chord:0, _mel:0,
  _scale: [220, 261.63, 293.66, 329.63, 392, 440, 523.25, 587.33],
  _chords: [[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66],[196,246.94,293.63]],
  ensure(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain(); this.master.gain.value = this.vol; this.master.connect(ctx.destination);
    this.musicGain = ctx.createGain(); this.musicGain.gain.value = 0.0001;
    const delay = ctx.createDelay(1); delay.delayTime.value = 0.33;
    const fb = ctx.createGain(); fb.gain.value = 0.34;
    const wet = ctx.createGain(); wet.gain.value = 0.5;
    this.musicGain.connect(this.master);
    this.musicGain.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(this.master);
    this.ambGain = ctx.createGain(); this.ambGain.gain.value = 0.5; this.ambGain.connect(this.master);
    /* surf: looping noise → moving bandpass */
    const nb = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
    const surf = ctx.createBufferSource(); surf.buffer = nb; surf.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=480; bp.Q.value=0.6;
    const waveGain = ctx.createGain(); waveGain.gain.value = 0.12;
    surf.connect(bp); bp.connect(waveGain); waveGain.connect(this.ambGain); surf.start();
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.13;
    const lg = ctx.createGain(); lg.gain.value = 0.07;
    lfo.connect(lg); lg.connect(waveGain.gain); lfo.start();
    const lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.5;
    const lg2 = ctx.createGain(); lg2.gain.value = 260;
    lfo2.connect(lg2); lg2.connect(bp.frequency); lfo2.start();
    /* breeze: noise → lowpass, slow swell */
    const breeze = ctx.createBufferSource(); breeze.buffer = nb; breeze.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=300;
    const bg = ctx.createGain(); bg.gain.value = 0.05;
    breeze.connect(lp); lp.connect(bg); bg.connect(this.ambGain); breeze.start();
    const lfo3 = ctx.createOscillator(); lfo3.frequency.value = 0.07;
    const lg3 = ctx.createGain(); lg3.gain.value = 0.035;
    lfo3.connect(lg3); lg3.connect(bg.gain); lfo3.start();
    this._next = ctx.currentTime + 0.5;
    this._timer = setInterval(()=>this._schedule(), 400);
  },
  /* gentle pentatonic pickles + slow pads */
  _schedule(){
    if (!this.ctx || !this.musicOn) return;
    while (this._next < this.ctx.currentTime + 1.3){
      const t = this._next;
      if (Math.random() < 0.75){
        this._mel = clamp(this._mel + Math.floor(Math.random()*5)-2, 0, 7);
        this._pluck(this._scale[this._mel], t, 0.16);
        if (Math.random() < 0.25) this._pluck(this._scale[this._mel]*1.5, t+0.3, 0.08);
      }
      if (this._mel % 8 === 0){
        this._chord = (this._chord+1) % 4;
        for (const f of this._chords[this._chord]) this._pad(f/2, t, 6.4);
      }
      this._next += 1.15 + Math.random()*0.55;
    }
  },
  _pluck(f, t, g){
    const o = this.ctx.createOscillator(), a = this.ctx.createGain();
    o.type='triangle'; o.frequency.value=f;
    a.gain.setValueAtTime(0.0001, t); a.gain.linearRampToValueAtTime(g, t+0.03);
    a.gain.exponentialRampToValueAtTime(0.0001, t+1.6);
    o.connect(a); a.connect(this.musicGain); o.start(t); o.stop(t+1.8);
  },
  _pad(f, t, dur){
    const o = this.ctx.createOscillator(), a = this.ctx.createGain();
    o.type='sine'; o.frequency.value=f;
    a.gain.setValueAtTime(0.0001, t); a.gain.linearRampToValueAtTime(0.045, t+1.2);
    a.gain.linearRampToValueAtTime(0.0001, t+dur);
    o.connect(a); a.connect(this.musicGain); o.start(t); o.stop(t+dur+0.1);
  },
  toggleMusic(){
    this.musicOn = !this.musicOn;
    if (this.ctx){
      const t = this.ctx.currentTime;
      this.musicGain.gain.cancelScheduledValues(t);
      this.musicGain.gain.setValueAtTime(Math.max(this.musicGain.gain.value, 0.0001), t);
      this.musicGain.gain.linearRampToValueAtTime(this.musicOn?0.8:0.0001, t+1.0);
      if (this.musicOn) this._next = this.ctx.currentTime + 0.1;
    }
  },
  setVolume(v){ this.vol=v; if (this.master) this.master.gain.value=v; },
  splash(power=1){
    if (!this.ctx) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const src = ctx.createBufferSource();
    const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate*0.7), ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    src.buffer = b;
    const f = ctx.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(1400, t); f.frequency.exponentialRampToValueAtTime(220, t+0.55);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.4*power, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.65);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
  },
  whoosh(){
    if (!this.ctx) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(900, t+0.45);
    g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(0.06, t+0.25); g.gain.linearRampToValueAtTime(0.001, t+0.5);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.55);
  },
  click(){
    if (!this.ctx) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='triangle'; o.frequency.value=660;
    g.gain.setValueAtTime(0.04, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.06);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.08);
  },
};
addEventListener('pointerdown', ()=>SFX.ensure(), { once:true });

/* ═════════════════ §14 MAIN LOOP ═════════════════ */

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const sdt = state.paused ? 0 : dt;
  simTime += sdt;

  applyTOD(dt);                                   // lighting keeps easing while paused
  state.tideSm = lerp(state.tideSm, state.tide, 1-Math.exp(-dt*3));
  state.windSm = lerp(state.windSm, state.wind, 1-Math.exp(-dt*2));
  SU.uTime.value = simTime; SU.uWind.value = state.windSm; SU.uWaterY.value = state.tideSm;
  waterSurf.position.y = state.tideSm;
  waterVol.position.y = state.tideSm - VOL_H/2;

  updateRays(sdt);
  updateFish();
  kayakUpdate(sdt);

  /* bubbles rise, recycle at the seabed */
  { const p = bubGeo.attributes.position;
    for (let i=0;i<BUB_N;i++){
      const b = bubBase[i];
      b.y += sdt*b.sp;
      if (b.y > state.tideSm-0.1) b.y = SEABED+0.1;
      p.setXYZ(i, b.x + Math.sin(simTime*2+b.ph)*0.12, b.y, b.z + Math.cos(simTime*1.7+b.ph)*0.12);
    }
    p.needsUpdate = true; }

  /* droplets under gravity */
  { const p = dropGeo.attributes.position;
    for (let i=0;i<DROP_N;i++){
      if (dropLife[i] <= 0) continue;
      dropLife[i] -= sdt;
      dropVel[i].y -= 7.5*sdt;
      p.setXYZ(i, p.getX(i)+dropVel[i].x*sdt, p.getY(i)+dropVel[i].y*sdt, p.getZ(i)+dropVel[i].z*sdt);
      if (p.getY(i) < state.tideSm || dropLife[i] <= 0){ p.setXYZ(i, 999,999,999); dropLife[i]=0; }
    }
    p.needsUpdate = true; }

  /* ripples expand & fade */
  for (const r of ripples){
    if (!r.on) continue;
    r.t += sdt;
    const t = r.t/r.dur;
    if (t >= 1){ r.on=false; r.mesh.visible=false; continue; }
    const s = lerp(r.s0, r.s1, t*t*(3-2*t));
    r.mesh.scale.set(s,s,1);
    r.mesh.material.opacity = (1-t)*0.55;
    r.mesh.position.y = state.tideSm + 0.03;
  }

  /* fireflies drift at night */
  ffMat.opacity = SU.uGlow.value*0.85;
  if (SU.uGlow.value > 0.1){
    const p = ffGeo.attributes.position;
    for (let i=0;i<FF_N;i++){
      const s = ffSeed[i];
      p.setXYZ(i, s.x + Math.sin(simTime*0.6+s.ph)*0.5,
                  s.y + Math.sin(simTime*0.9+s.ph*2)*0.25,
                  s.z + Math.cos(simTime*0.5+s.ph)*0.5);
    }
    p.needsUpdate = true;
  }

  /* evening glow: lanterns, windows, string lights, campfire — all follow uGlow */
  const g = SU.uGlow.value;
  const flick = 1 + 0.08*Math.sin(simTime*7.1) + 0.05*Math.sin(simTime*11.3+2);
  for (let i=0;i<lanternLights.length;i++){
    lanternLights[i].intensity = g * 3.2 *
      (1 + 0.1*Math.sin(simTime*7.1+i*2.3) + 0.06*Math.sin(simTime*13.1+i));
  }
  lampMat.emissiveIntensity = g*1.8*flick;
  windowMat.emissiveIntensity = g*2.0;
  bulbMat.emissiveIntensity = g*2.2;
  wLight.intensity = g*4.0;
  fireLight.intensity = g*2.4*(1+0.18*Math.sin(simTime*9.7)+0.1*Math.sin(simTime*17.3));

  updateCamTween(dt);
  controls.update();
  renderer.render(scene, camera);
}

/* ---- kick off (+ debug hooks for automated screenshots) ---- */
applyTOD(1);
if (Q.get('time')) setTod(Q.get('time'));
setCamera(Q.get('cam') || 'iso', true);
if (Q.get('tide')){ tide.value = Q.get('tide'); setTide(+Q.get('tide')/100); state.tideSm = state.tide; }
if (Q.get('auto') === 'leap')  setTimeout(()=>triggerLeap(), 900);
if (Q.get('auto') === 'kayak') setTimeout(()=>toggleKayak(), 900);

animate();
requestAnimationFrame(()=>requestAnimationFrame(()=>{
  document.getElementById('loader').classList.add('hide');
}));
</script>
