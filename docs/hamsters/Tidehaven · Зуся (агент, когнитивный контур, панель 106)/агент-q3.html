<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tidehaven — a tiny lagoon world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ Tidehaven UI ============ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0e2430}
body{font-family:'Outfit',system-ui,sans-serif;color:#f4ede2;-webkit-tap-highlight-color:transparent}
canvas{display:block}
/* header */
#head{position:fixed;top:16px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:5}
#ttl{font-size:30px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 2px 20px rgba(0,0,0,.4)}
#sub{font-size:12px;font-weight:300;opacity:.8;margin-top:2px;letter-spacing:.05em}
#hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.55;pointer-events:none;z-index:5;letter-spacing:.05em;white-space:nowrap}
/* translucent panels */
.panel{position:fixed;z-index:10;width:216px;display:block;background:rgba(16,34,42,.72);border:1px solid rgba(244,237,226,.13);border-radius:14px;padding:12px 13px 13px;backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 10px 30px rgba(0,10,20,.35)}
#panel-world{top:84px;left:16px}
#panel-actions{top:268px;left:16px}
#panel-view{top:84px;right:16px}
#panel-audio{top:252px;right:16px}
.panel h3{font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;opacity:.72;margin-bottom:9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.row3{grid-template-columns:1fr 1fr 1fr}
.panel button{font-family:inherit;font-size:12px;font-weight:500;color:#f4ede2;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:7px 5px;cursor:pointer;transition:background .18s,border-color .18s,color .18s;letter-spacing:.02em;white-space:nowrap}
.panel button:hover{background:rgba(255,255,255,.13)}
.panel button:active{transform:translateY(1px)}
.panel button.active{border-color:rgba(255,184,107,.85);background:rgba(255,184,107,.18);color:#ffd9a8}
.panel button:disabled{opacity:.4;cursor:default}
.srow{margin-top:9px}
.srow label{display:flex;justify-content:space-between;font-size:11px;opacity:.85;margin-bottom:3px;letter-spacing:.03em}
.srow output{opacity:.6;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#ffb86b;height:18px;cursor:pointer}
/* mobile dock */
#dock{display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:11;gap:6px;justify-content:center}
#dock button{font-family:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#f4ede2;background:rgba(16,34,42,.82);border:1px solid rgba(244,237,226,.15);border-radius:20px;padding:7px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#dock button.active{border-color:rgba(255,184,107,.85);color:#ffd9a8}
@media (max-width:760px){
  #ttl{font-size:21px}#sub{font-size:10px}
  .panel{bottom:50px;width:auto;display:none;padding:10px 12px 12px}
  #panel-world,#panel-actions,#panel-view,#panel-audio{top:auto;bottom:50px;left:8px;right:8px;width:auto}
  .panel.open{display:block}
  #dock{display:flex}
  #hint{bottom:44px}
}
/* loader */
#loader{position:fixed;inset:0;background:#0e2430;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:50;transition:opacity .6s}
#loader.done{opacity:0;pointer-events:none}
.spin{width:34px;height:34px;border-radius:50%;border:2px solid rgba(244,237,226,.2);border-top-color:#ffb86b;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loader span{font-size:11px;letter-spacing:.14em;opacity:.7;text-transform:uppercase}
</style>
</head>
<body>

<div id="loader"><div class="spin"></div><span>Preparing the lagoon…</span></div>

<header id="head">
  <div id="ttl">Tidehaven</div>
  <div id="sub">A tiny lagoon world — drift above, dive below</div>
</header>

<aside class="panel" id="panel-world"><h3>World</h3>
  <div class="srow"><label>Tide <output id="out-tide">0.00 m</output></label><input type="range" id="slider-tide" min="-0.5" max="0.7" step="0.01" value="0"></div>
  <div class="srow"><label>Wind <output id="out-wind">50%</output></label><input type="range" id="slider-wind" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="row row3" style="margin-top:10px">
    <button id="tod-day" class="active">Day</button><button id="tod-sunset">Sunset</button><button id="tod-night">Night</button>
  </div>
</aside>

<aside class="panel" id="panel-actions"><h3>Actions</h3>
  <div class="row">
    <button id="btn-kayak">Launch Kayak</button>
    <button id="btn-leap">Ray Leap</button>
    <button id="btn-pause">Pause</button>
    <button id="btn-reset">Reset</button>
  </div>
</aside>

<aside class="panel" id="panel-view"><h3>View</h3>
  <div class="row">
    <button id="view-iso" class="active">Isometric</button>
    <button id="view-cabin">Cabin</button>
    <button id="view-under">Underwater</button>
    <button id="view-orbit">Free Orbit</button>
  </div>
  <div class="row" style="grid-template-columns:1fr;margin-top:6px">
    <button id="btn-quality">Quality: High</button>
  </div>
</aside>

<aside class="panel" id="panel-audio"><h3>Audio</h3>
  <div class="row" style="grid-template-columns:1fr">
    <button id="btn-music" class="active">♪ Music On</button>
  </div>
  <div class="srow"><label>Volume <output id="out-vol">60%</output></label><input type="range" id="slider-volume" min="0" max="1" step="0.01" value="0.6"></div>
</aside>

<div id="dock">
  <button data-tab="world">World</button>
  <button data-tab="actions">Actions</button>
  <button data-tab="view">View</button>
  <button data-tab="audio">Audio</button>
</div>

<div id="hint">Drag to orbit · Scroll to zoom · Click a view preset</div>

<div id="diag"></div>
<script>
/* boot diagnostics: surface module/import/shader errors in a bottom-left diag
   strip and in the page title (visible to headless screenshots & F12 alike). */
(function(){
  const d=document.getElementById('diag');
  const show=(msg)=>{
    msg=String(msg).slice(0,220);
    document.title=(document.title.indexOf('JSERR')===0?document.title:'JSERR: '+msg);
    d.style.cssText='position:fixed;left:6px;bottom:6px;z-index:99;font:10px monospace;color:#ff5a5a;'+
      'background:rgba(0,0,0,.85);padding:2px 6px;max-width:60vw;pointer-events:none';
    d.textContent=msg;
  };
  window.addEventListener('error',e=>{show(e.message);console.error('[tidehaven]',e.message);});
  window.addEventListener('unhandledrejection',e=>{show('promise: '+(e.reason&&e.reason.message||e.reason));});
  const ce=console.error;
  console.error=function(...a){show('console: '+a.map(String).join(' '));ce.apply(console,a);};
  window.__diagClear=()=>{document.title='Tidehaven';d.textContent='';};
})();
</script>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
/* =====================================================================
   TIDEHAVEN — single-file 3D diorama.  All geometry & textures are
   procedural.  Section map:
     core helpers → sky/lights/time-of-day → island → cabin/pier/props
     → water (cutaway lagoon + FX) → life (rays/fish/kayak)
     → camera/UI → audio → boot loop
   Conventions:
     S   = world state (t = sim time, frozen while paused)
     U   = shared uniforms reused by water/plant/wave shaders
     SYS = list of per-frame systems; fn(simDt, dt); simDt=0 while paused
   ===================================================================== */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- tiny helpers ---------------- */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=mulberry32(20261011);
function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453123;return s-Math.floor(s);}
function noise2(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u),lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u),v);}
function noise3(x,y){return noise2(x,y)*.55+noise2(x*2.3+7.1,y*2.3-3.7)*.28+noise2(x*4.7-11.3,y*4.7+5.2)*.17;}

/* ---------------- world constants ---------------- */
const TANK={hx:9,hz:9,floor:-4,rim:2.2};                 // interior half-extents, seabed, rim
const ISLE={cx:2.6,cz:2.6,peak:1.78,baseR:4.25,shelfR:5.6,skirtR:7.2};
/* analytic island height — known on CPU AND in GLSL (kept in sync by hand) */
function islandH(x,z){
  const r=Math.hypot(x-ISLE.cx,z-ISLE.cz);
  if(r<ISLE.baseR)return ISLE.peak*(1-Math.pow(r/ISLE.baseR,2.2));
  if(r<ISLE.shelfR)return -0.95*smoothstep(ISLE.baseR,ISLE.shelfR,r);
  if(r<ISLE.skirtR)return -0.95-3.05*smoothstep(ISLE.shelfR,ISLE.skirtR,r);
  return TANK.floor;
}
/* shoreline radius where islandH == level (profile is monotone: binary search) */
function shoreRadius(level){
  let lo=0,hi=ISLE.skirtR;
  for(let i=0;i<20;i++){const mid=(lo+hi)*.5;if(islandH(ISLE.cx+mid,ISLE.cz)>level)lo=mid;else hi=mid;}
  return (lo+hi)*.5;
}

/* ---------------- state & shared uniforms ---------------- */
const S={t:0,level:0,wind:.5,tod:'day',paused:false,quality:'high'};
const U={
  time:{value:0}, level:{value:0}, wind:{value:.5}, glow:{value:0},
  sunDir:{value:new THREE.Vector3(0,1,0)}, sunColor:{value:new THREE.Color('#ffd9a0')}
};
const SYS=[];   // systems: fn(simDt, dt)

/* ---------------- renderer / scene / camera ---------------- */
const isMobile=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||innerWidth<760;
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(new THREE.Color('#cfe8ee'),0.011);

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,260);
camera.position.set(15.5,11,16);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.rotateSpeed=.85;controls.zoomSpeed=.8;
controls.minDistance=4;controls.maxDistance=40;
controls.minPolarAngle=.15;controls.maxPolarAngle=1.55;
controls.target.set(0,-0.6,0);

function applyQuality(){
  const low=S.quality==='low';
  renderer.setPixelRatio(Math.min(devicePixelRatio,low?1.4:2));
  renderer.shadowMap.enabled=!low;
  scene.traverse(o=>{if(o.material)o.material.needsUpdate=true;});
  if(S.qualityChanged)S.qualityChanged.forEach(fn=>fn(low));
}
S.quality=isMobile?'low':'high';

function onResize(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
window.addEventListener('resize',onResize);

/* ============ SECTIONS (filled in below) ============ */

/* ================= SKY, SUN/MOON, LIGHTS, TIME OF DAY ================= */
/* Lighting presets blend per-channel with eased weights; U.glow drives all
   evening emitters (cabin windows, lanterns, string lights). */
const TOD={
  day:   {sun:[14,20,10],  sunColor:'#ffd9a0', sunInt:2.4,  hemiSky:'#bfe6ef', hemiGround:'#e8d5a8', hemiInt:0.85, amb:0.28, top:'#bfe6ef', hor:'#ffe9c9', fog:'#cfe8ee', fogD:0.011, glow:0.0,  disc:1.0,  star:0.0,  moon:0.0},
  sunset:{sun:[-24,5,16],  sunColor:'#ff8a4c', sunInt:1.9,  hemiSky:'#6a89b0', hemiGround:'#ff9a5c', hemiInt:0.7,  amb:0.24, top:'#4d6f9a', hor:'#ff9a5c', fog:'#e8b48f', fogD:0.014, glow:0.55, disc:1.25, star:0.18, moon:0.1},
  night: {sun:[-8,16,-14], sunColor:'#bcd2ff', sunInt:0.5,  hemiSky:'#16213e', hemiGround:'#24345c', hemiInt:0.35, amb:0.13, top:'#0b1330', hor:'#24345c', fog:'#1a2a3f', fogD:0.016, glow:1.0,  disc:0.0,  star:0.9,  moon:1.0}
};
let skyMat, sunDisc, moonDisc, starsPts, sunLight, hemiLight, ambLight;
const mixW={day:1,sunset:0,night:0};          // current blend weights
function buildSky(){
  // gradient dome
  skyMat=new THREE.ShaderMaterial({
    uniforms:{uTop:{value:new THREE.Color(TOD.day.top)},uHor:{value:new THREE.Color(TOD.day.hor)},
      uSunDir:{value:new THREE.Vector3(0,1,0)},uSunGlow:{value:new THREE.Color('#ffd9a0')},uGlowK:{value:1}},
    vertexShader:`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      varying vec3 vDir;uniform vec3 uTop,uHor,uSunDir,uSunGlow;uniform float uGlowK;
      void main(){
        vec3 d=normalize(vDir);
        float t=pow(clamp(d.y*1.15+0.02,0.0,1.0),0.55);
        vec3 c=mix(uHor,uTop,t);
        float s=max(dot(d,normalize(uSunDir)),0.0);
        c+=uSunGlow*pow(s,10)*0.55*uGlowK;
        gl_FragColor=vec4(c,1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    side:THREE.BackSide,depthWrite:false,fog:false
  });
  /* Sky is scene.background (equirect canvas strip), not a mesh dome:
     the headless-measured dome path produced a black band at the horizon
     with no occluder in the scene — background compositing can't occlude. */
  const skyCv=document.createElement('canvas');skyCv.width=64;skyCv.height=256;
  const skyCx=skyCv.getContext('2d');
  const skyTex=new THREE.CanvasTexture(skyCv);
  skyTex.mapping=THREE.EquirectangularReflectionMapping;
  skyTex.colorSpace=THREE.SRGBColorSpace;
  scene.background=skyTex;
  const cTop=new THREE.Color(),cHor=new THREE.Color(),cSun=new THREE.Color();
  const paintSky=(dirSun,glowK)=>{          // redraw background: vertical gradient + sun bloom
    cTop.copy(skyMat.uniforms.uTop.value);cHor.copy(skyMat.uniforms.uHor.value);
    cSun.copy(skyMat.uniforms.uSunGlow.value);
    const g=skyCx.createLinearGradient(0,0,0,256);
    g.addColorStop(0,'#'+cTop.getHexString());
    g.addColorStop(0.42,'#'+cHor.getHexString());
    g.addColorStop(1,'#'+cHor.getHexString());
    skyCx.fillStyle=g;skyCx.fillRect(0,0,64,256);
    const az=Math.atan2(dirSun.z,dirSun.x);            // equirect: x=azimuth, y=90°..−90°
    const sx=((az/(Math.PI*2))+0.5)*64, sy=128-dirSun.y*118;
    const rg=skyCx.createRadialGradient(sx,sy,1,sx,sy,14);
    rg.addColorStop(0,'rgba('+Math.round(cSun.r*255)+','+Math.round(cSun.g*255)+','+Math.round(cSun.b*255)+',0.9)');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    skyCx.globalAlpha=clamp(glowK,0,1.3);skyCx.fillStyle=rg;skyCx.fillRect(0,0,64,256);skyCx.globalAlpha=1;
    skyTex.needsUpdate=true;
  };
  paintSky(new THREE.Vector3(...TOD.day.sun).normalize(),TOD.day.disc);   // first paint
  // sun / moon discs (canvas radial-gradient sprites)
  function discTex(kind){
    const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
    const grd=g.createRadialGradient(64,64,4,64,64,60);
    if(kind==='sun'){grd.addColorStop(0,'rgba(255,246,214,1)');grd.addColorStop(0.25,'rgba(255,214,140,0.9)');grd.addColorStop(1,'rgba(255,170,90,0)');}
    else{grd.addColorStop(0,'rgba(232,240,255,1)');grd.addColorStop(0.3,'rgba(190,208,246,0.55)');grd.addColorStop(1,'rgba(150,180,255,0)');}
    g.fillStyle=grd;g.fillRect(0,0,128,128);
    if(kind==='moon'){g.globalCompositeOperation='destination-out';g.beginPath();g.arc(84,52,26,0,7);g.fill();}
    const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
  }
  sunDisc=new THREE.Sprite(new THREE.SpriteMaterial({map:discTex('sun'),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
  sunDisc.scale.set(11,11,1);sunDisc.position.set(0,60,30);sunDisc.renderOrder=-9;scene.add(sunDisc);
  moonDisc=new THREE.Sprite(new THREE.SpriteMaterial({map:discTex('moon'),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
  moonDisc.scale.set(7,7,1);moonDisc.position.set(-30,55,-40);moonDisc.renderOrder=-9;scene.add(moonDisc);
  // stars: dots on the upper dome
  const n=380,pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const a=rand()*Math.PI*2,ph=Math.acos(rand()*0.92);   // bias upward
    pos[i*3]=Math.sin(ph)*Math.cos(a)*70;pos[i*3+1]=Math.cos(ph)*70;pos[i*3+2]=Math.sin(ph)*Math.sin(a)*70;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const sc=document.createElement('canvas');sc.width=sc.height=32;const sg=sc.getContext('2d');
  sg.fillStyle='#fff';sg.beginPath();sg.arc(16,16,10,0,7);sg.fill();
  const st=new THREE.CanvasTexture(sc);
  starsPts=new THREE.Points(g,new THREE.PointsMaterial({map:st,size:0.85,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}));
  starsPts.renderOrder=-9;scene.add(starsPts);
  // lights
  sunLight=new THREE.DirectionalLight(new THREE.Color(TOD.day.sunColor),2.4);
  sunLight.position.set(14,20,10);sunLight.castShadow=true;
  sunLight.shadow.mapSize.set(2048,2048);
  sunLight.shadow.camera.left=-16;sunLight.shadow.camera.right=16;
  sunLight.shadow.camera.top=16;sunLight.shadow.camera.bottom=-16;
  sunLight.shadow.camera.near=1;sunLight.shadow.camera.far=70;
  sunLight.shadow.bias=-0.0005;sunLight.shadow.normalBias=0.03;
  scene.add(sunLight,sunLight.target);sunLight.target.position.set(0,-1,0);
  hemiLight=new THREE.HemisphereLight(new THREE.Color(TOD.day.hemiSky),new THREE.Color(TOD.day.hemiGround),0.85);
  ambLight=new THREE.AmbientLight(0xffffff,0.28);
  scene.add(hemiLight,ambLight);
  // time-of-day blend system
  const cScr1=new THREE.Color(),cScr2=new THREE.Color();
  SYS.push((simDt,dt)=>{
    const k=clamp(dt*0.45,0,1);           // ~2.2 s transitions
    for(const key of ['day','sunset','night'])mixW[key]=lerp(mixW[key],S.tod===key?1:0,k);
    let sum=mixW.day+mixW.sunset+mixW.night;
    for(const key of ['day','sunset','night'])mixW[key]/=sum;
    const P=key=>TOD[key];
    // blend numbers
    const num=f=>P('day')[f]*mixW.day+P('sunset')[f]*mixW.sunset+P('night')[f]*mixW.night;
    sunLight.intensity=num('sunInt');hemiLight.intensity=num('hemiInt');ambLight.intensity=num('amb');
    scene.fog.density=num('fogD');
    renderer.toneMappingExposure=lerp(1.05,1.18,mixW.sunset);
    // blend colors
    const col=(f)=>{cScr1.set(P('day')[f]).multiplyScalar(mixW.day);
      cScr2.set(P('sunset')[f]).multiplyScalar(mixW.sunset);cScr1.add(cScr2);
      cScr2.set(P('night')[f]).multiplyScalar(mixW.night);cScr1.add(cScr2);return cScr1;};
    sunLight.color.copy(col('sunColor'));
    hemiLight.color.copy(col('hemiSky'));hemiLight.groundColor.copy(col('hemiGround'));
    scene.fog.color.copy(col('fog'));
    skyMat.uniforms.uTop.value.copy(col('top'));
    skyMat.uniforms.uHor.value.copy(col('hor'));
    // sun direction & glow uniform shared with water shaders
    const sp=TOD.day.sun.map((v,i)=>v*mixW.day+TOD.sunset.sun[i]*mixW.sunset+TOD.night.sun[i]*mixW.night);
    const dir=new THREE.Vector3(sp[0],sp[1],sp[2]).normalize();
    sunLight.position.copy(dir).multiplyScalar(26);
    U.sunDir.value.copy(dir);U.sunColor.value.copy(sunLight.color);
    skyMat.uniforms.uSunDir.value.copy(dir);
    skyMat.uniforms.uSunGlow.value.copy(col('sunColor'));
    skyMat.uniforms.uGlowK.value=num('disc');
    sunDisc.position.copy(dir).multiplyScalar(70);
    sunDisc.material.opacity=clamp(num('disc'),0,1);
    moonDisc.position.set(-30,55,-40);
    moonDisc.material.opacity=num('moon');
    starsPts.material.opacity=num('star')*0.9;
    U.glow.value=num('glow');
    const gk=num('disc');
    if(Math.abs(gk-(skyMat.uniforms.uGlowK.value||0))>0.0015||Math.abs(dir.x-(skyMat.userData.dir?skyMat.userData.dir.x:9)))
      paintSky(dir,gk);                       // repaint background strip only while blending
    skyMat.userData.dir=dir;
  });
}

/* ================= ISLAND: terrain, shore rocks, pines, bushes ================= */
/* Shared injection helper: gives any MeshStandardMaterial a world-position
   varying (vWPos) so shaders can react to the tide level. */
function addWorldPos(shader){
  shader.vertexShader=shader.vertexShader
    .replace('#include <common>','#include <common>\nvarying vec3 vWPos;')
    .replace('#include <begin_vertex>','#include <begin_vertex>\nvWPos=(modelMatrix*vec4(transformed,1.0)).xyz;');
}
function makeSwayMaterial(base,amp,phase){
  const m=base.clone();
  m.userData={amp,phase};
  m.onBeforeCompile=(shader)=>{
    shader.uniforms.uTime=U.time;shader.uniforms.uWind=U.wind;
    shader.uniforms.uAmp={value:m.userData.amp};
    shader.uniforms.uPhase={value:m.userData.phase};
    shader.vertexShader=shader.vertexShader
      .replace('#include <common>','#include <common>\nuniform float uTime,uWind,uAmp,uPhase;')
      .replace('#include <begin_vertex>',`#include <begin_vertex>
        float k=clamp(transformed.y/2.4,0.0,1.0);k*=k;
        transformed.x+=sin(uTime*1.6+uPhase)*uAmp*(0.25+0.75*uWind)*k;
        transformed.z+=cos(uTime*1.15+uPhase*1.7)*uAmp*0.5*(0.25+0.75*uWind)*k;`);
  };
  m.customProgramCacheKey=()=>'sway';
  return m;
}
let terrainMat;
function buildIsland(){
  /* --- terrain: grid displaced by islandH + fractal noise, vertex colors --- */
  const N=96,geo=new THREE.PlaneGeometry(18,18,N,N);
  geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;
  const col=new Float32Array(pos.count*3);
  const cSand=new THREE.Color('#e8d5a8'),cWet=new THREE.Color('#d9c48f'),
        cGrass=new THREE.Color('#7fae5c'),cGrass2=new THREE.Color('#6b9a4f'),
        cRock=new THREE.Color('#8a8478'),cTmp=new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i);
    const r=Math.hypot(x-ISLE.cx,z-ISLE.cz);
    const falloff=1-smoothstep(5.0,6.5,r);   // analytic shoreline band stays noise-free so water meets sand exactly
    const h=islandH(x,z)+noise3(x*0.9+3.1,z*0.9-2.2)*0.42*falloff;
    pos.setY(i,h);
  }
  geo.computeVertexNormals();
  const nrm=geo.attributes.normal;
  for(let i=0;i<pos.count;i++){
    const y=pos.getY(i),x=pos.getX(i),z=pos.getZ(i);
    const slope=1-Math.abs(nrm.getY(i));
    const patch=noise3(x*1.5,z*1.5);
    // beach -> dune grass by height, patchy
    cTmp.copy(y<0.06?cWet:cSand).lerp(cGrass,smoothstep(0.18,0.55,y+patch*0.18-0.09));
    if(y<0.06)cTmp.lerp(cGrass,smoothstep(-0.35,-0.05,y+patch*0.2)*0.25);  // waterline moss hint
    cTmp.lerp(cRock,smoothstep(0.24,0.5,slope));                            // steep → rock
    cTmp.lerp(cGrass2,patch*0.28*smoothstep(0.2,0.6,y));
    col[i*3]=cTmp.r;col[i*3+1]=cTmp.g;col[i*3+2]=cTmp.b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  terrainMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,metalness:0});
  terrainMat.onBeforeCompile=(sh)=>{
    addWorldPos(sh);
    sh.uniforms.uLevel=U.level;
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nuniform float uLevel;varying vec3 vWPos;')
      .replace('#include <color_fragment>',`#include <color_fragment>
        float wet=1.0-smoothstep(uLevel-0.30,uLevel+0.07,vWPos.y);   // ordered edges (GLSL ES: edge0<=edge1)
        diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(0.74,0.70,0.56),wet*0.85);`);
  };
  terrainMat.customProgramCacheKey=()=>'wet';
  const terrain=new THREE.Mesh(geo,terrainMat);
  terrain.castShadow=true;terrain.receiveShadow=true;
  scene.add(terrain);

  /* --- shore rocks: one deformed icosahedron instanced around the beach --- */
  const rockGeo=new THREE.IcosahedronGeometry(1,1);
  const rp=rockGeo.attributes.position;
  for(let i=0;i<rp.count;i++){
    const n=noise3(rp.getX(i)*2.3+rp.getZ(i),rp.getY(i)*2.3-rp.getX(i));
    rp.setXYZ(i,rp.getX(i)*(0.75+n*0.5),rp.getY(i)*(0.55+n*0.35),rp.getZ(i)*(0.75+n*0.5));
  }
  rockGeo.computeVertexNormals();
  const rockMat=new THREE.MeshStandardMaterial({color:'#8a8478',roughness:0.9,flatShading:true});
  const rocks=new THREE.InstancedMesh(rockGeo,rockMat,isMobile?8:14);
  const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),v3=new THREE.Vector3(),sc=new THREE.Vector3();
  for(let i=0;i<rocks.count;i++){
    const a=(i/rocks.count)*Math.PI*2+rand()*0.5;
    const rr=3.55+rand()*1.9;                       // beach ring, some in surf
    const x=ISLE.cx+Math.cos(a)*rr,z=ISLE.cz+Math.sin(a)*rr;
    const s=0.22+rand()*0.55;
    const y=islandH(x,z)+s*0.28;
    e.set(rand()*0.6-0.3,rand()*Math.PI*2,rand()*0.6-0.3);q.setFromEuler(e);
    sc.set(s,s*(0.7+rand()*0.5),s*(0.85+rand()*0.4));
    m4.compose(v3.set(x,y,z),q,sc);rocks.setMatrixAt(i,m4);
  }
  rocks.castShadow=true;rocks.receiveShadow=true;scene.add(rocks);

  /* --- pines on the hill (all above the highest tide), wind sway --- */
  const trunkGeo=new THREE.CylinderGeometry(0.06,0.1,0.9,6);
  const coneGeo=new THREE.ConeGeometry(0.85,0.95,7);
  const trunkMat=new THREE.MeshStandardMaterial({color:'#6e4a2c',roughness:0.9});
  const pineMat=new THREE.MeshStandardMaterial({color:'#4e7a44',roughness:0.9,flatShading:true});
  const pineSpots=[[1.2,1.0,1.15],[3.9,0.6,0.95],[1.0,3.4,1.25],[4.3,3.3,0.8],[0.5,2.2,0.7]];
  for(const [tx,tz,scale] of pineSpots){
    const g=new THREE.Group();
    const tm=makeSwayMaterial(trunkMat,0.03,rand()*6);
    const trunk=new THREE.Mesh(trunkGeo,tm);trunk.position.y=0.45;trunk.castShadow=true;g.add(trunk);
    const fm=makeSwayMaterial(pineMat,0.11,rand()*6);
    const cs=[[0.85,1.0,0.95],[0.65,1.0,0.8],[0.45,0.95,0.7]];
    cs.forEach(([r,sc2,yy],i)=>{
      const cone=new THREE.Mesh(coneGeo,fm);
      cone.scale.set(r,sc2,r);cone.position.y=1.0+i*0.62;cone.castShadow=true;g.add(cone);
    });
    g.position.set(tx,islandH(tx,tz)-0.05,tz);
    g.scale.setScalar(scale);
    g.rotation.z=(rand()-0.5)*0.06;
    scene.add(g);
  }
  /* --- bushes --- */
  const bushGeo=new THREE.IcosahedronGeometry(0.45,1);
  const bp=bushGeo.attributes.position;
  for(let i=0;i<bp.count;i++)bp.setY(i,bp.getY(i)*0.7);
  bushGeo.computeVertexNormals();
  const bushMat=makeSwayMaterial(new THREE.MeshStandardMaterial({color:'#5d8a4a',roughness:1,flatShading:true}),0.05,2.1);
  for(const [bx,bz,s] of [[4.35,1.7,0.9],[1.7,0.2,0.75],[3.4,3.9,1.0]]){
    const b=new THREE.Mesh(bushGeo,bushMat);
    b.position.set(bx,islandH(bx,bz)+0.18,bz);b.scale.setScalar(s);
    b.castShadow=true;scene.add(b);
  }
}

/* ================= CUTAWAY LAGOON: volume, surface, foam, seabed, FX =================
   Render order ladder (all transparent layers use depthWrite:false):
     18 glass walls · 19 cross-section faces · 20 water volume · 21 surface
     22 shore foam · 23 wall contact foam · 24 bubbles · 25 ripples · 26 droplets
   The volume tints ONLY the submerged part of each view ray (analytic entry at
   the water plane) — above-water objects stay crisp, no sorting flicker. */
const SHALLOW=new THREE.Color('#4fd6c2'),DEEP=new THREE.Color('#0e6b8a'),FOAMC=new THREE.Color('#f2f7f0');
/* CPU wave function — identical formula to the surface vertex shader */
function waveY(x,z,t){
  const a=0.018+S.wind*0.075;
  return a*(0.5*Math.sin(x*0.85+t*1.15)+0.32*Math.sin(z*1.2-t*0.92+x*0.3)+0.18*Math.sin((x+z)*1.7+t*1.9)+0.25*Math.sin(x*3.7-z*2.9+t*2.6));
}
const ISLE_GLSL=`
float isleH(vec2 p){
  float r=length(p-vec2(${ISLE.cx.toFixed(2)},${ISLE.cz.toFixed(2)}));
  if(r<4.25) return ${ISLE.peak.toFixed(2)}*(1.0-pow(r/4.25,2.2));
  if(r<5.6) return -0.95*smoothstep(4.25,5.6,r);
  if(r<7.2) return -0.95-3.05*smoothstep(5.6,7.2,r);
  return -4.0;

const TONE=`#include <tonemapping_fragment>\n#include <colorspace_fragment>`;
let wallFoamA,wallFoamB,foamRing,foamRingMat;
const FX={
  ripples:[],drops:null,dropParts:[],
  spawnRipple(x,z,strength){
    let r=this.ripples.find(o=>!o.active)||this.ripples[0];
    r.active=true;r.t=0;r.life=1.1+0.9*strength;r.x=x;r.z=z;r.st=strength;
    r.mesh.visible=true;
  },
  spawnSplash(x,z){
    for(const p of this.dropParts){
      if(p.active)continue;
      p.active=true;p.t=0;p.life=0.8+rand()*0.7;
      const a=rand()*Math.PI*2,h=0.15+rand()*0.9;
      p.x=x+Math.cos(a)*h*0.35;p.z=z+Math.sin(a)*h*0.35;p.y=S.level+0.04;
      p.vx=Math.cos(a)*h;p.vz=Math.sin(a)*h;p.vy=1.7+rand()*2.1;
    }
  },
  reset(){
    for(const r of this.ripples){r.active=false;r.mesh.visible=false;}
    for(const p of this.dropParts){p.active=false;}
    if(this.drops){
      const a=this.drops.geometry.attributes.position;
      for(let i=0;i<this.dropParts.length;i++)a.setXYZ(i,-99,-99,-99);
      a.needsUpdate=true;
    }

};
function buildWater(){

  for(const [rx,rz,sx,sz] of [[0,9.05,18.5,0.22],[0,-9.05,18.5,0.22],[9.05,0,0.22,18.5],[-9.05,0,0.22,18.5]]){

  const wallGeo=new THREE.PlaneGeometry(18,hH);
  const wallX=new THREE.Mesh(wallGeo,glassMat);
  wallX.rotation.y=Math.PI/2;wallX.position.set(-TANK.hx,cyC,0);wallX.renderOrder=18;scene.add(wallX);
  const wallZ=new THREE.Mesh(wallGeo,glassMat);
  wallZ.position.set(0,cyC,-TANK.hz);wallZ.renderOrder=18;scene.add(wallZ);
  /* ---- cross-section faces on the open sides (+X, +Z): the "cut aquarium walls" ---- */
  const cutMat=new THREE.ShaderMaterial({
    uniforms:{uTime:U.time,uLevel:U.level,uShallow:{value:SHALLOW},uDeep:{value:DEEP},uFoam:{value:FOAMC}},
    vertexShader:`varying vec3 vW;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vW=wp.xyz;gl_Position=projectionMatrix*viewMatrix*wp;}`,
    fragmentShader:`

    transparent:true,depthWrite:false,side:THREE.DoubleSide
  });
  const cutGeo=new THREE.PlaneGeometry(18,hH);
  const cutX=new THREE.Mesh(cutGeo,cutMat);
  cutX.rotation.y=-Math.PI/2;cutX.position.set(TANK.hx-0.02,cyC,0);cutX.renderOrder=19;scene.add(cutX);
  const cutZ=new THREE.Mesh(cutGeo,cutMat);
  cutZ.position.set(0,cyC,TANK.hz-0.02);cutZ.renderOrder=19;scene.add(cutZ);
  /* ---- water volume: tints only the submerged length of each view ray ---- */
  const volMat=new THREE.ShaderMaterial({
    uniforms:{uLevel:U.level,uShallow:{value:SHALLOW},uDeep:{value:DEEP}},
    vertexShader:`varying vec3 vW;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vW=wp.xyz;gl_Position=projectionMatrix*viewMatrix*wp;}`,
    fragmentShader:`
      varying vec3 vW;uniform float uLevel;uniform vec3 uShallow,uDeep;
      void main(){

        if(cam.y<uLevel){
          float tS=dir.y>0.04?(uLevel-cam.y)/dir.y:1e9;   // stop counting at the surface exit
          d=min(length(vW-cam),tS);
        }

          float tE=(uLevel-cam.y)/dir.y;
          vec3 e=cam+dir*tE;

        }

      }`,
    transparent:true,depthWrite:false,side:THREE.BackSide
  });
  const volume=new THREE.Mesh(new THREE.BoxGeometry(18,hH,18),volMat);
  volume.position.y=cyC;volume.renderOrder=20;volume.frustumCulled=false;scene.add(volume);
  /* ---- animated surface plane with waves, analytic island mask, shore foam ---- */
  const surfGeo=new THREE.PlaneGeometry(17.92,17.92,96,96);
  surfGeo.rotateX(-Math.PI/2);
  const surfMat=new THREE.ShaderMaterial({
    uniforms:{uTime:U.time,uLevel:U.level,uWind:U.wind,uShallow:{value:SHALLOW},uDeep:{value:DEEP},uFoam:{value:FOAMC},uSunDir:U.sunDir,uSunColor:U.sunColor},
    vertexShader:`
      varying vec3 vW;varying float vWv;
      uniform float uTime,uLevel,uWind;
      void main(){
        vec3 tp=position;
        float A=0.018+uWind*0.075;
        float w=A*(0.5*sin(tp.x*0.85+uTime*1.15)+0.32*sin(tp.z*1.2-uTime*0.92+tp.x*0.3)
          +0.18*sin((tp.x+tp.z)*1.7+uTime*1.9)+0.25*sin(tp.x*3.7-tp.z*2.9+uTime*2.6));
        tp.y+=uLevel+w;vWv=w;
        vec4 wp=modelMatrix*vec4(tp,1.0);vW=wp.xyz;
        gl_Position=projectionMatrix*viewMatrix*wp;
      }`,
    fragmentShader:`
      varying vec3 vW;varying float vWv;
      uniform float uTime,uLevel,uWind;uniform vec3 uShallow,uDeep,uFoam,uSunDir,uSunColor;
      ${ISLE_GLSL}
      void main(){

        c+=uSunColor*spk*(0.22+uWind*0.5)*clamp(dot(V,vec3(0.0,1.0,0.0)),0.0,1.0);
        float ang=atan(vW.z-${ISLE.cz.toFixed(2)},vW.x-${ISLE.cx.toFixed(2)});
        float bb=(above+0.03)/0.14;         // manual square: pow() undefined for negative base

  });

  /* ---- shoreline foam ring, radius follows tide ---- */
  const ringGeo=new THREE.RingGeometry(0.78,1.10,64);   // geometry covers the shader's feather ramps
  ringGeo.rotateX(-Math.PI/2);

    fragmentShader:`
      varying vec3 vW;uniform float uTime,uWind,uR;uniform vec3 uFoam;

  wallFoamA=new THREE.Mesh(new THREE.PlaneGeometry(0.16,17.9),wfMat.clone());
  wallFoamA.rotation.x=-Math.PI/2;wallFoamA.position.set(-TANK.hx+0.08,0,0);wallFoamA.renderOrder=23;scene.add(wallFoamA);
  wallFoamB=new THREE.Mesh(new THREE.PlaneGeometry(17.9,0.16),wfMat.clone());

      .replace('#include <color_fragment>',`#include <color_fragment>
        float depth=uLevel-vWPos.y;

  /* ---- rising bubbles ---- */
  const bubCount=isMobile?45:90;

  bub.renderOrder=24;bub.frustumCulled=false;scene.add(bub);
  const bubbles=[];

  SYS.push((simDt,dt)=>{

/* ================= UNDERWATER LIFE: rays, fish schools, kayak, kelp =================
   Ray realism (owner's prior critique — cartoon flapping & oversized rays):
   propulsion is a traveling wave along the fin margin (snout→tips), the disc

   All creatures respect safe(): walls, surface, seabed, island, pier, kayak. */

function safe(p){
  if(p.x<-8.2||p.x>8.2||p.z<-8.2||p.z>8.2)return false;
  if(p.y>S.level-0.3)return false;      // too close to the surface
  if(p.y<-3.3)return false;             // too close to the seabed
  const h=islandH(p.x,p.z);
  if(p.y<h+0.25)return false;   // stay above the reef crust
  if(p.x>1.95&&p.x<3.25&&p.z>5.05&&p.z<8.0&&p.y>-4.2)return false;   // pier post column
  if(kayak&&kayak.sphere&&Math.hypot(p.x-kayak.sphere.x,p.z-kayak.sphere.z)<1.3&&Math.abs(p.y-kayak.sphere.y)<0.9)return false;

  g.fillStyle='#5c6b74';g.fillRect(0,0,128,128);

    const x=rand()*128,y=rand()*128,r=0.5+rand()*2.2;
    g.fillStyle=`rgba(${120+(rand()*60|0)},${140+(rand()*60|0)},${150+(rand()*50|0)},${0.18+rand()*0.4})`;
    g.beginPath();g.arc(x,y,r,0,7);g.fill();

}
function makeFlapMaterial(base,speedRef,kind){
  const m=base.clone();
  m.onBeforeCompile=(sh)=>{
    sh.uniforms.uSim=U.time;
    sh.uniforms.uSpeed=speedRef;               // shared ref: jump makes this ray flap faster
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nuniform float uSim,uSpeed;')
      .replace('#include <begin_vertex>',kind==='wing'
        ?`#include <begin_vertex>
        float ax=abs(position.x);
        float s=smoothstep(0.10,0.55,ax);
        transformed.y+=sin(uSim*uSpeed*6.28319-ax*7.0)*s*0.11;`
        :`#include <begin_vertex>
        float lag=smoothstep(0.35,1.15,max(0.30-position.z,0.0));

  const tailMat=makeFlapMaterial(new THREE.MeshStandardMaterial({map:tex,color:'#6a7a86',roughness:0.7}),speedRef,'tail');

        const rollQ=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),J.roll);
        R.group.quaternion.copy(yawQ).multiply(rollQ);
        if(J.pos.y<=S.level+0.02&&J.vel.y<0){
          FX.spawnSplash(J.pos.x,J.pos.z);
          FX.spawnRipple(J.pos.x,J.pos.z,1.0);
          J.ripple2={x:J.pos.x,z:J.pos.z,t:0};
          J.phase='dive';J.t=0;
          J.diveFrom=J.pos.clone();
        }
      }else if(J.phase==='dive'){
        const k=clamp(J.t/0.55,0,1);
        J.pos.y=lerp(J.diveFrom.y,Math.max(-1.3,J.lh+0.4),k);   // never dive through the reef crust
        R.group.position.copy(J.pos);
        vT.set(J.pos.x+J.dir.x,J.pos.y-0.4,J.pos.z+J.dir.z);
        R.group.lookAt(vT);
        if(J.ripple2){J.ripple2.t+=simDt;if(J.ripple2.t>0.35){FX.spawnRipple(J.ripple2.x,J.ripple2.z,0.6);J.ripple2=null;}}
        if(k>=1){
          J.phase='recover';J.t=0;
          let best=0,bestD=1e9;
          for(let s=0;s<1;s+=1/48){const cp=R.curve.getPointAt(s);const d=cp.distanceToSquared(J.pos);if(d<bestD){bestD=d;best=s;}}
          J.targetS=best;
        }
      }else if(J.phase==='recover'){
        const k=clamp(J.t/1.6,0,1);
        const cp=R.curve.getPointAt(J.targetS);
        J.pos.lerp(cp,clamp(simDt*3.2,0,1));
        R.group.position.copy(J.pos);
        const tan=R.curve.getTangentAt(J.targetS);
        vT.copy(cp).addScaledVector(tan,0.6);
        R.group.lookAt(vT);
        if(k>=1){R.s=J.targetS;R.jumping=false;R.speedRef.value=0.75;S.jump=null;}
      }
    }
    for(const sc of schools){
      sc.a=(sc.a+sc.speed*simDt/sc.curve.getLength())%1;
      const c=sc.curve.getPointAt(sc.a);
      const tan=sc.curve.getTangentAt(sc.a);
      for(let i=0;i<sc.fish.length;i++){
        const f=sc.fish[i];
        const orb=f.ph+t*f.om;
        let x=c.x+f.ox+Math.cos(orb)*f.amp*0.6;
        let y=c.y+f.oy*0.35+Math.sin(t*1.15+f.ph)*0.06;
        let z=c.z+f.oz+Math.sin(orb)*f.amp*0.6;
        x=clamp(x,-7.9,7.9);z=clamp(z,-7.9,7.9);   // fish stay inside the tank walls
        y=Math.min(y,S.level-0.30);
        y=Math.max(y,-3.2,islandH(x,z)+0.25);      // terrain floor: never swim through rock
        for(let k=0;k<3;k++){                       // shrink toward the school centre to clear the pier posts
          if(!(x>1.95&&x<3.25&&z>5.05&&z<8.0&&y>-4.2))break;
          x=c.x+(x-c.x)*0.8;z=c.z+(z-c.z)*0.8;
        }
        let vx=x-f.px,vy=y-f.py,vz=z-f.pz;
        if(!f.init){vx=tan.x;vy=0;vz=tan.z;f.init=true;}
        f.px=x;f.py=y;f.pz=z;
        const n=Math.hypot(vx,vy,vz)||1;vx/=n;vy/=n;vz/=n;
        mScr.lookAt(vP.set(x,y,z),vT.set(x-vx,y-vy,z-vz),up);  // Matrix4.lookAt points -Z at target, so flip: nose (+Z) rides the velocity
        qScr.setFromRotationMatrix(mScr);
        mScr.compose(vP.set(x,y,z),qScr,vS.set(f.s,f.s,f.s));
        sc.mesh.setMatrixAt(i,mScr);
      }
      sc.mesh.instanceMatrix.needsUpdate=true;
    }
    const K=kayak;
    if(K.mode==='launch'){
      K.k+=simDt/2.4;
      const e=easeInOutCubic(clamp(K.k,0,1));
      K.a+=0.09*simDt;
      vT.set(K.cc[0]+K.R*Math.cos(K.a),0,K.cc[1]+K.R*Math.sin(K.a));
      K.pos.lerpVectors(K.moor,vT,e*clamp(simDt*2.4,0,1)+e*0.04);
      if(K.k>=1){K.mode='cruise';K.pos.set(K.cc[0]+K.R*Math.cos(K.a),0,K.cc[1]+K.R*Math.sin(K.a));}
    }else if(K.mode==='cruise'){
      K.a+=(1.1/K.R)*simDt;
      K.pos.set(K.cc[0]+K.R*Math.cos(K.a),0,K.cc[1]+K.R*Math.sin(K.a));
      K.wakeT+=simDt;
      if(K.wakeT>1.3){K.wakeT=0;FX.spawnRipple(K.pos.x,K.pos.z,0.35);}
    }else if(K.mode==='ret'){
      K.k+=simDt/2.8;
      const e=easeInOutCubic(clamp(K.k,0,1));
      vT.set(K.cc[0]+K.R*Math.cos(K.a),0,K.cc[1]+K.R*Math.sin(K.a));
      K.pos.lerpVectors(vT,K.moor,e*clamp(simDt*2.2,0,1)+e*0.04);
      if(K.k>=1){
        K.mode='dock';
        const b=document.getElementById('btn-kayak');
        b.classList.remove('active');b.textContent='Launch Kayak';
      }
    }else{
      K.pos.lerp(K.moor,clamp(simDt*4,0,1));
    }
    const depth=S.level-islandH(K.pos.x,K.pos.z);
    const bobY=S.level+0.06+waveY(K.pos.x,K.pos.z,t)*0.6*smoothstep(0.25,0.9,depth);  // shallow → less rocking, no reef scrape
    K.pos.y=lerp(K.pos.y,bobY,clamp(simDt*10,0,1));
    const dx=K.pos.x-K.lastX,dz=K.pos.z-K.lastZ;
    if(Math.hypot(dx,dz)>0.0005)K.yaw=lerp(K.yaw,Math.atan2(dx,dz),clamp(simDt*6,0,1));
    K.lastX=K.pos.x;K.lastZ=K.pos.z;
    const slopeX=(waveY(K.pos.x+0.4,K.pos.z,t)-waveY(K.pos.x-0.4,K.pos.z,t))*1.4;
    const slopeZ=(waveY(K.pos.x,K.pos.z+0.4,t)-waveY(K.pos.x,K.pos.z-0.4,t))*1.4;
    K.group.position.copy(K.pos);
    K.group.rotation.y=K.yaw;
    K.group.rotation.x=-slopeZ*0.7;
    K.group.rotation.z=slopeX*0.7;
    K.sphere=K.pos;
    updateRope();
    const lb=document.getElementById('btn-leap');
    lb.disabled=!!S.jump;
  });
  /* quality hook: thin out schools + kelp on low-end devices */
  S.qualityChanged=[(low)=>{
    schools[1].mesh.visible=!low;
    schools[2].mesh.visible=!low;
    kelp.count=low?Math.min(40,placed):placed;
  }];
}

/* ================= CAMERA PRESETS, TRANSITIONS & UI WIRING ================= */
const PRESETS={
  iso:{pos:[15.5,11,16],target:[0,-0.6,0],fov:38},
  cabin:{pos:[9.2,2.4,11.8],target:[2.6,1.1,3.6],fov:40},
  under:{pos:[-4.4,-1.6,-0.6],target:[-6.6,-2.4,-4.4],fov:52}
};
let camTween=null;
function startCam(name,dur){
  const P=PRESETS[name];
  if(!P)return;
  camTween={
    fromP:camera.position.clone(),toP:new THREE.Vector3(...P.pos),
    fromT:controls.target.clone(),toT:new THREE.Vector3(...P.target),
    fromF:camera.fov,toF:P.fov,t:0,dur
  };
  controls.enabled=false;
  if(dur<=0)stepCamTween(1);
}
function stepCamTween(dt){
  if(!camTween)return;
  camTween.t+=dt;
  const k=camTween.dur>0?clamp(camTween.t/camTween.dur,0,1):1;
  const e=easeInOutCubic(k);
  camera.position.lerpVectors(camTween.fromP,camTween.toP,e);
  controls.target.lerpVectors(camTween.fromT,camTween.toT,e);
  camera.fov=lerp(camTween.fromF,camTween.toF,e);
  camera.updateProjectionMatrix();
  if(k>=1){camTween=null;controls.enabled=true;controls.update();}
}
function buildCameraUI(){
  SYS.push((simDt,dt)=>{
    stepCamTween(dt);                                   // camera transitions stay alive on pause
    controls.target.x=clamp(controls.target.x,-8.5,8.5);
    controls.target.y=clamp(controls.target.y,-3.8,2.0);
    controls.target.z=clamp(controls.target.z,-8.5,8.5);
  });
}
function setActive(id,on){document.getElementById(id).classList.toggle('active',!!on);}
function wireUI(){
  const $=id=>document.getElementById(id);
  /* ---- view presets ---- */
  const viewIds=['view-iso','view-cabin','view-under','view-orbit'];
  function pickView(id){for(const v of viewIds)setActive(v,v===id);}
  for(const [id,preset] of [['view-iso','iso'],['view-cabin','cabin'],['view-under','under']]){
    $(id).addEventListener('click',()=>{pickView(id);startCam(preset,1.4);});
  }
  $('view-orbit').addEventListener('click',()=>pickView('view-orbit'));
  controls.addEventListener('start',()=>{if(!camTween)pickView('view-orbit');});
  /* ---- world sliders ---- */
  $('slider-tide').addEventListener('input',(e)=>{
    S.level=parseFloat(e.target.value);
    $('out-tide').textContent=S.level.toFixed(2)+' m';
  });
  $('slider-wind').addEventListener('input',(e)=>{
    S.wind=parseFloat(e.target.value);
    $('out-wind').textContent=Math.round(S.wind*100)+'%';
    AUDIO.setWind(S.wind);
  });
  /* ---- time of day ---- */
  for(const id of ['tod-day','tod-sunset','tod-night']){
    $(id).addEventListener('click',()=>{
      S.tod=id.slice(4);
      for(const j of ['tod-day','tod-sunset','tod-night'])setActive(j,j===id);
    });
  }
  /* ---- actions ---- */
  $('btn-kayak').addEventListener('click',()=>kayakToggle());
  $('btn-leap').addEventListener('click',()=>triggerJump());
  $('btn-pause').addEventListener('click',()=>{
    S.paused=!S.paused;
    $('btn-pause').textContent=S.paused?'Resume':'Pause';
    setActive('btn-pause',S.paused);
  });
  $('btn-reset').addEventListener('click',()=>{
    S.level=0;$('slider-tide').value=0;$('out-tide').textContent='0.00 m';
    S.wind=0.5;$('slider-wind').value=0.5;$('out-wind').textContent='50%';
    AUDIO.setWind(0.5);
    AUDIO.setVolume(0.6);$('slider-volume').value=0.6;$('out-vol').textContent='60%';
    S.tod='day';for(const j of ['tod-day','tod-sunset','tod-night'])setActive(j,j==='tod-day');
    mixW.day=1;mixW.sunset=0;mixW.night=0;
    S.paused=false;$('btn-pause').textContent='Pause';setActive('btn-pause',false);
    kayakReset();jumpReset();fxReset();
    AUDIO.musicOn=true;AUDIO.setMusic(true);setActive('btn-music',true);$('btn-music').textContent='♪ Music On';
    startCam('iso',1.2);pickView('view-iso');
  });
  /* ---- quality toggle ---- */
  $('btn-quality').addEventListener('click',()=>{
    S.quality=S.quality==='high'?'low':'high';
    $('btn-quality').textContent='Quality: '+(S.quality==='high'?'High':'Low');
    setActive('btn-quality',S.quality==='low');
    applyQuality();
  });
  if(S.quality==='low'){$('btn-quality').textContent='Quality: Low';setActive('btn-quality',true);}
  /* ---- audio ---- */
  $('slider-volume').addEventListener('input',(e)=>{
    AUDIO.setVolume(parseFloat(e.target.value));
    $('out-vol').textContent=Math.round(parseFloat(e.target.value)*100)+'%';
  });
  $('btn-music').addEventListener('click',()=>{
    AUDIO.musicOn=!AUDIO.musicOn;
    AUDIO.setMusic(AUDIO.musicOn);
    setActive('btn-music',AUDIO.musicOn);
    $('btn-music').textContent=AUDIO.musicOn?'♪ Music On':'♪ Music Off';
  });
  /* ---- mobile dock: collapsible bottom-sheet panels ---- */
  const panels=['world','actions','view','audio'];
  for(const chip of document.querySelectorAll('#dock button')){
    chip.addEventListener('click',(e)=>{
      const tab=chip.dataset.tab;
      const p=$('panel-'+tab);
      const wasOpen=p.classList.contains('open');
      for(const pn of panels)$('panel-'+pn).classList.remove('open');
      for(const c of document.querySelectorAll('#dock button'))c.classList.remove('active');
      if(!wasOpen){p.classList.add('open');chip.classList.add('active');}
    });
  }
  /* panel headers also toggle on mobile */
  for(const pn of panels){
    $('panel-'+pn).querySelector('h3').addEventListener('click',()=>{
      const p=$('panel-'+pn);
      const wasOpen=p.classList.contains('open');
      for(const q of panels)$('panel-'+q).classList.remove('open');
      for(const c of document.querySelectorAll('#dock button'))c.classList.remove('active');
      if(!wasOpen){p.classList.add('open');
        for(const c of document.querySelectorAll('#dock button'))if(c.dataset.tab===pn)c.classList.add('active');}
    });
  }
}

/* ================= PROCEDURAL AUDIO (Web Audio API) =================
   Calm D-minor-pentatonic pad + sparse plucks, lapping-water noise,
   wind noise.  Nothing is created until the first pointerdown (AUDIO.start). */
const AUDIO={
  started:false,ctx:null,master:null,musicGain:null,waterGain:null,windGain:null,
  musicOn:true,vol:0.6,
  start(){
    if(this.started)return;
    this.started=true;
    const C=new (window.AudioContext||window.webkitAudioContext)();
    this.ctx=C;
    const T=()=>C.currentTime||0;   // AudioContext has NO `.time` — guarded clock, never NaN
    this.master=C.createGain();this.master.gain.value=this.vol;
    this.master.connect(C.destination);
    this.musicGain=C.createGain();this.musicGain.gain.value=this.musicOn?0.5:0;
    this.musicGain.connect(this.master);
    /* warm pad: three detuned saws through a lowpass, breathing LFO */
    const padGain=C.createGain();padGain.gain.value=0.14;
    const padLP=C.createBiquadFilter();padLP.type='lowpass';padLP.frequency.value=720;padLP.Q.value=0.7;
    padLP.connect(padGain);padGain.connect(this.musicGain);
    const padOscs=[];
    for(let i=0;i<3;i++){
      const o=C.createOscillator();o.type='sawtooth';o.frequency.value=[146.83,174.61,220][i];
      o.detune.value=[-6,0,7][i];
      const og=C.createGain();og.gain.value=0.33;
      o.connect(og);og.connect(padLP);o.start();
      padOscs.push(o);
    }
    const padLFO=C.createOscillator();padLFO.frequency.value=0.07;
    const padLFOg=C.createGain();padLFOg.gain.value=0.05;
    padLFO.connect(padLFOg);padLFOg.connect(padGain.gain);padLFO.start();
    /* chord progression, retuned gently every 8 s: Dm — Am — G — F feel */
    const CHORDS=[[146.83,174.61,220],[110,130.81,164.81],[98,123.47,146.83],[87.31,110,130.81]];
    let chordIdx=0,nextChord=T()+8;
    setInterval(()=>{
      if(C.state==='closed'||T()<nextChord-1.5)return;
      nextChord=T()+8;
      const ch=CHORDS[chordIdx++%CHORDS.length];
      padOscs.forEach((o,i)=>o.frequency.setTargetAtTime(ch[i],T(),1.4));
    },1200);
    /* sparse plucks from the D minor pentatonic */
    const SCALE=[293.66,329.63,349.23,440,523.25,587.33];
    let nextPluck=T()+2;
    setInterval(()=>{
      if(C.state==='closed'||T()<nextPluck)return;
      nextPluck=T()+1.4+rand()*0.5;
      const f=SCALE[(rand()*SCALE.length)|0]*(rand()<0.28?0.5:1);
      const o=C.createOscillator();o.type='triangle';o.frequency.value=f;
      const g=C.createGain();
      g.gain.setValueAtTime(0.0001,T());
      g.gain.exponentialRampToValueAtTime(0.12,T()+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,T()+1.1);
      o.connect(g);g.connect(this.musicGain);
      o.start(T());o.stop(T()+1.2);
      const sub=C.createOscillator();sub.type='sine';sub.frequency.value=f/2;
      const sg=C.createGain();
      sg.gain.setValueAtTime(0.0001,T());
      sg.gain.exponentialRampToValueAtTime(0.07,T()+0.06);
      sg.gain.exponentialRampToValueAtTime(0.0001,T()+1.6);
      sub.connect(sg);sg.connect(this.musicGain);
      sub.start(T());sub.stop(T()+1.7);
    },220);
    /* water & wind: looped filtered noise */
    const nb=C.createBuffer(1,2*C.sampleRate,C.sampleRate);
    const d=nb.getChannelData(0);let lastN=0;
    for(let i=0;i<d.length;i++){const w=rand()*2-1;lastN=0.55*lastN+0.45*w;d[i]=lastN*0.6;}
    function noiseSrc(rate){
      const s=C.createBufferSource();s.buffer=nb;s.loop=true;s.playbackRate.value=rate;return s;
    }
    const wSrc=noiseSrc(1.0);
    const wBP=C.createBiquadFilter();wBP.type='bandpass';wBP.frequency.value=460;wBP.Q.value=1.1;
    this.waterGain=C.createGain();this.waterGain.gain.value=0.12;
    wSrc.connect(wBP);wBP.connect(this.waterGain);this.waterGain.connect(this.master);
    const lapLFO=C.createOscillator();lapLFO.frequency.value=0.22;
    const lapG=C.createGain();lapG.gain.value=0.07;
    lapLFO.connect(lapG);lapG.connect(this.waterGain.gain);lapLFO.start();
    wSrc.start();
    const windSrc=noiseSrc(0.8);
    const wLP=C.createBiquadFilter();wLP.type='lowpass';wLP.frequency.value=320;wLP.Q.value=0.6;
    this.windGain=C.createGain();this.windGain.gain.value=0.02+S.wind*0.10;
    windSrc.connect(wLP);wLP.connect(this.windGain);this.windGain.connect(this.master);
    windSrc.start();
    C.resume();
  },
  setVolume(v){this.vol=v;if(this.master)this.master.gain.setTargetAtTime(v,(this.ctx.currentTime||0),0.1);},
  setMusic(on){if(this.musicGain)this.musicGain.gain.setTargetAtTime(on?0.5:0,(this.ctx.currentTime||0),0.4);},
  setWind(v){if(this.windGain)this.windGain.gain.setTargetAtTime(0.02+v*0.10,(this.ctx.currentTime||0),0.3);}
};
function buildAudio(){
  window.addEventListener('pagehide',()=>{if(AUDIO.ctx&&AUDIO.ctx.state!=='closed')AUDIO.ctx.close();});
}

/* ================= BOOT ================= */
function boot(){
  buildSky();          // sun/hemi/ambient + tod blend live here
  buildIsland();
  buildProps();
  buildWater();
  buildLife();
  buildCameraUI();
  buildAudio();
  wireUI();
  applyQuality();
  startCam('iso',0);
  let last=performance.now(),first=true,running=true;
  function frame(now){
    if(!running)return;
    requestAnimationFrame(frame);
    const dt=Math.min((now-last)/1000,0.05);last=now;
    const simDt=S.paused?0:dt;
    S.t+=simDt;                                  // CPU-side sim clock (rays/fish/kayak/foam ride S.t)
    U.time.value+=simDt;U.level.value=S.level;U.wind.value=S.wind;
    for(const f of SYS)f(simDt,dt);
    controls.update();
    renderer.render(scene,camera);
    if(first){first=false;document.getElementById('loader').classList.add('done');}
  }
  requestAnimationFrame(frame);
  // audio only after a real user gesture
  window.addEventListener('pointerdown',()=>AUDIO.start());
  // save power on hidden tab
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){running=false;}
    else if(!running){running=true;last=performance.now();requestAnimationFrame(frame);}
  });
}
boot();
