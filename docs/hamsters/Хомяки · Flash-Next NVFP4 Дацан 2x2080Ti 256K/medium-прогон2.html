<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐹 Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #ffe9f0; }
  #info {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-family: "Comic Sans MS", "Segoe UI", sans-serif; text-align: center;
    color: #7a4b2a; pointer-events: none; user-select: none;
    background: rgba(255,255,255,0.65); padding: 8px 18px; border-radius: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }
  #info h1 { margin: 0; font-size: 20px; }
  #info p { margin: 2px 0 0; font-size: 12px; opacity: 0.8; }
</style>
</head>
<body>
<div id="info">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; Watch them run the wheel!</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
//  SETUP
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe4ef);
scene.fog = new THREE.Fog(0xffe4ef, 30, 60);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(11, 9, 13);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 32;
controls.maxPolarAngle = Math.PI * 0.49;

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xfff5e6, 0xb8a0c9, 0.75));
const sun = new THREE.DirectionalLight(0xfff0d0, 0.9);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;  sun.shadow.camera.bottom = -12;
scene.add(sun);

// ============================================================
//  MATERIAL HELPER (low-poly look)
// ============================================================
const mat = (color) => new THREE.MeshLambertMaterial({ color, flatShading: true });

// ============================================================
//  ROOM FLOOR + TRAY
// ============================================================
const room = new THREE.Mesh(new THREE.CylinderGeometry(20, 20, 1, 24), mat(0xf3c9dd));
room.position.y = -0.5;
room.receiveShadow = true;
scene.add(room);

const CAGE = 6; // half-size of cage floor
const tray = new THREE.Mesh(new THREE.BoxGeometry(CAGE * 2 + 1.2, 0.9, CAGE * 2 + 1.2), mat(0x63b8e8));
tray.position.y = 0.45;
tray.receiveShadow = true;
tray.castShadow = true;
scene.add(tray);

const bedding = new THREE.Mesh(new THREE.BoxGeometry(CAGE * 2 - 0.2, 0.18, CAGE * 2 - 0.2), mat(0xe8c98f));
bedding.position.y = 0.98;
bedding.receiveShadow = true;
scene.add(bedding);

// Scatter wood-chip pebbles
const chipGeo = new THREE.IcosahedronGeometry(0.14, 0);
for (let i = 0; i < 40; i++) {
  const chip = new THREE.Mesh(chipGeo, mat(Math.random() > 0.5 ? 0xd9b877 : 0xc7a25e));
  chip.position.set((Math.random() - 0.5) * 11, 1.1, (Math.random() - 0.5) * 11);
  chip.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  chip.castShadow = true;
  scene.add(chip);
}

// ============================================================
//  CAGE BARS
// ============================================================
const cageGroup = new THREE.Group();
const barMat = mat(0xf7f3ee);
const barGeo = new THREE.CylinderGeometry(0.07, 0.07, 5, 5);
const N = 13; // bars per side
for (let side = 0; side < 4; side++) {
  for (let i = 0; i <= N; i++) {
    const t = -CAGE + (i / N) * CAGE * 2;
    const bar = new THREE.Mesh(barGeo, barMat);
    bar.position.y = 3.7;
    if (side === 0) bar.position.x = t;
    if (side === 1) bar.position.x = t;
    if (side === 2) bar.position.z = t;
    if (side === 3) bar.position.z = t;
    if (side >= 2) bar.position.x = side === 2 ? -CAGE : CAGE;
    else bar.position.z = side === 0 ? -CAGE : CAGE;
    bar.castShadow = true;
    cageGroup.add(bar);
  }
}
// Top frame + lid bars
const frameGeo = new THREE.CylinderGeometry(0.12, 0.12, CAGE * 2 + 0.4, 6);
[[0, -CAGE, 0], [0, CAGE, 0]].forEach((_, idx) => {});
for (let i = 0; i < 4; i++) {
  const f = new THREE.Mesh(frameGeo, mat(0xff8fab));
  f.position.y = 6.2;
  if (i < 2) { f.rotation.z = Math.PI / 2; f.position.z = i === 0 ? -CAGE : CAGE; }
  else { f.rotation.x = Math.PI / 2; f.position.x = i === 2 ? -CAGE : CAGE; }
  f.castShadow = true;
  cageGroup.add(f);
}
for (let i = 0; i <= 8; i++) {
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, CAGE * 2, 4), barMat);
  lid.rotation.x = Math.PI / 2;
  lid.position.set(-CAGE + (i / 8) * CAGE * 2, 6.2, 0);
  cageGroup.add(lid);
}
scene.add(cageGroup);

// ============================================================
//  EXERCISE WHEEL  (interactive object #1)
// ============================================================
const wheelAssembly = new THREE.Group();
wheelAssembly.position.set(-3.6, 0, -3.2);
const wheel = new THREE.Group();

const rim = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.28, 5, 14), mat(0xff6b9d));
rim.castShadow = true;
wheel.add(rim);
const innerRim = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.1, 4, 14), mat(0xffb3d1));
wheel.add(innerRim);
for (let i = 0; i < 8; i++) {
  const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.9, 0.12), mat(0xffd1e3));
  spoke.rotation.z = (i / 8) * Math.PI * 2;
  wheel.add(spoke);
}
wheel.position.y = 1.75;
wheelAssembly.add(wheel);
// Stand
const standMat = mat(0x9b5de5);
[-0.9, 0.9].forEach(z => {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 2.6, 0.25), standMat);
  leg.position.set(1.7 * (z > 0 ? 0.35 : -0.35) * 0 + 0, 1.3, z * 1.1);
  leg.position.x = 0;
  leg.rotation.z = 0;
  leg.castShadow = true;
  wheelAssembly.add(leg);
});
const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 2.4, 6), standMat);
axle.rotation.x = Math.PI / 2;
axle.position.y = 1.75;
wheelAssembly.add(axle);
scene.add(wheelAssembly);
const WHEEL_POS = new THREE.Vector3(-3.6, 1.1, -3.2);

// ============================================================
//  FOOD BOWL (interactive object #2) + hideout hut
// ============================================================
const bowl = new THREE.Group();
const bowlOuter = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.6, 0.55, 8, 1, true), mat(0xffb703));
bowlOuter.position.y = 0.28;
const bowlBottom = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.1, 8), mat(0xffb703));
bowlBottom.position.y = 0.05;
const food = new THREE.Group();
const pelletGeo = new THREE.IcosahedronGeometry(0.14, 0);
for (let i = 0; i < 9; i++) {
  const p = new THREE.Mesh(pelletGeo, mat([0xd68732, 0xa68c34, 0xc9a227][i % 3]));
  p.position.set((Math.random() - 0.5) * 0.9, 0.42, (Math.random() - 0.5) * 0.9);
  food.add(p);
}
bowl.add(bowlOuter, bowlBottom, food);
bowl.position.set(3.8, 1.05, -3.6);
bowl.traverse(o => { o.castShadow = true; });
scene.add(bowl);
const BOWL_POS = bowl.position.clone();

// Little hut
const hut = new THREE.Group();
const hutBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.5, 2.2), mat(0xe76f51));
hutBody.position.y = 0.75;
const hutRoof = new THREE.Mesh(new THREE.ConeGeometry(1.8, 1.2, 4), mat(0xf4a261));
hutRoof.position.y = 2.1;
hutRoof.rotation.y = Math.PI / 4;
const door = new THREE.Mesh(new THREE.CircleGeometry(0.5, 8), mat(0x5c3a21));
door.position.set(0, 0.65, 1.11);
hut.add(hutBody, hutRoof, door);
hut.position.set(3.5, 1.05, 3.2);
hut.traverse(o => { o.castShadow = true; });
scene.add(hut);

// Water bottle
const bottle = new THREE.Group();
const bottleBody = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.8, 8), 
  new THREE.MeshLambertMaterial({ color: 0x9ad6ff, transparent: true, opacity: 0.6, flatShading: true }));
const bottleTop = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.4, 0.4, 8), mat(0xc0c0c0));
bottleTop.position.y = 1.1;
const spout = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5, 5), mat(0xa0a0a0));
spout.rotation.x = Math.PI / 2; spout.position.set(0, -0.9, 0.3);
bottle.add(bottleBody, bottleTop, spout);
bottle.position.set(-CAGE + 0.4, 3.2, 2.5);
scene.add(bottle);

// ============================================================
//  HAMSTER BUILDER
// ============================================================
const FUR_COLORS = [0xf5a962, 0xe8dcc8, 0xc98a4b, 0xfad7a0, 0x9c6b3f, 0xffffff];

function makeHamster(color) {
  const h = new THREE.Group();
  const fur = mat(color);
  const cream = mat(0xfff5e0);

  // Body — squashed low-poly blob
  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.65, 1), fur);
  body.scale.set(1.25, 0.95, 1.0);
  body.position.y = 0.55;
  body.castShadow = true;
  h.add(body);

  // Belly
  const belly = new THREE.Mesh(new THREE.IcosahedronGeometry(0.45, 1), cream);
  belly.scale.set(1.0, 0.7, 0.8);
  belly.position.set(0.25, 0.4, 0);
  h.add(belly);

  // Head
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 1), fur);
  head.position.set(0.72, 0.85, 0);
  head.castShadow = true;
  h.add(head);

  // Cheeks
  [-1, 1].forEach(s => {
    const cheek = new THREE.Mesh(new THREE.IcosahedronGeometry(0.19, 1), cream);
    cheek.position.set(0.85, 0.72, s * 0.28);
    h.add(cheek);
  });

  // Snout + nose
  const snout = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.25, 5), cream);
  snout.rotation.z = -Math.PI / 2;
  snout.position.set(1.12, 0.82, 0);
  h.add(snout);
  const nose = new THREE.Mesh(new THREE.IcosahedronGeometry(0.06, 0), mat(0xff8fab));
  nose.position.set(1.26, 0.82, 0);
  h.add(nose);

  // Eyes
  [-1, 1].forEach(s => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), mat(0x222222));
    eye.position.set(0.98, 0.98, s * 0.2);
    h.add(eye);
  });

  // Ears
  [-1, 1].forEach(s => {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.22, 5), fur);
    ear.position.set(0.62, 1.22, s * 0.28);
    ear.rotation.x = s * 0.4;
    h.add(ear);
    const inner = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.14, 5), mat(0xffb3c8));
    inner.position.set(0.65, 1.2, s * 0.3);
    inner.rotation.x = s * 0.4;
    h.add(inner);
  });

  // Tail nub
  const tail = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1, 0), fur);
  tail.position.set(-0.8, 0.55, 0);
  h.add(tail);

  // Legs (animated)
  const legs = [];
  [[0.35, 0.3], [0.35, -0.3], [-0.35, 0.3], [-0.35, -0.3]].forEach(([x, z]) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.3, 0.16), fur);
    leg.position.set(x, 0.15, z);
    leg.castShadow = true;
    h.add(leg);
    legs.push(leg);
  });

  h.scale.setScalar(0.85);
  h.userData = { body, head, legs };
  return h;
}

// ============================================================
//  HAMSTER AGENTS (state machine)
// ============================================================
const hamsters = [];
const wheelUser = { id: -1 };
const BOUND = CAGE - 1.2;

function spawnHamster(x, z, color) {
  const mesh = makeHamster(color);
  mesh.position.set(x, 1.1, z);
  mesh.rotation.y = Math.random() * Math.PI * 2;
  scene.add(mesh);
  hamsters.push({
    mesh,
    state: 'idle',
    timer: Math.random() * 3,
    target: new THREE.Vector3(),
    speed: 1.1 + Math.random() * 0.7,
    phase: Math.random() * 10,
    id: hamsters.length
  });
}

spawnHamster(0, 0, FUR_COLORS[0]);
spawnHamster(-2, 2, FUR_COLORS[1]);
spawnHamster(2, -1, FUR_COLORS[2]);
spawnHamster(1, 3, FUR_COLORS[3]);
spawnHamster(-1.5, -2.5, FUR_COLORS[4]);

function pickNewAction(h) {
  const roll = Math.random();
  if (roll < 0.2 && wheelUser.id === -1) {
    // Run on the wheel!
    h.state = 'toWheel';
    h.target.copy(WHEEL_POS);
  } else if (roll < 0.38) {
    // Go eat
    h.state = 'toFood';
    h.target.set(BOWL_POS.x + (Math.random() - 0.5), 1.1, BOWL_POS.z + (Math.random() - 0.5));
  } else if (roll < 0.62) {
    // Wander to random spot
    h.state = 'walk';
    h.target.set((Math.random() - 0.5) * 2 * BOUND, 1.1, (Math.random() - 0.5) * 2 * BOUND);
  } else {
    // Just pause / groom
    h.state = 'pause';
    h.timer = 1 + Math.random() * 2.5;
  }
}

function updateHamster(h, dt, time) {
  const m = h.mesh;
  const { legs, head, body } = m.userData;
  h.phase += dt;
  let moving = false;
  let legSpeed = 6;

  switch (h.state) {
    case 'idle':
    case 'pause': {
      h.timer -= dt;
      // Cute grooming: head tilts side to side
      head.rotation.z = Math.sin(time * 4 + h.phase) * 0.15;
      body.scale.y = 0.95 + Math.sin(time * 3 + h.phase) * 0.03; // breathing
      if (h.state === 'idle' || h.timer <= 0) pickNewAction(h);
      break;
    }
    case 'walk':
    case 'toWheel':
    case 'toFood': {
      const dir = h.target.clone().sub(m.position);
      dir.y = 0;
      const dist = dir.length();
      if (dist < 0.25) {
        if (h.state === 'toWheel') {
          h.state = 'running';
          h.timer = 4 + Math.random() * 4;
          wheelUser.id = h.id;
          m.position.copy(WHEEL_POS);
          m.position.y = 1.15;
          m.rotation.y = Math.PI / 2;
        } else if (h.state === 'toFood') {
          h.state = 'eating';
          h.timer = 2.5 + Math.random() * 2;
        } else {
          h.state = 'idle';
          h.timer = 0.5 + Math.random() * 1.5;
        }
      } else {
        moving = true;
        const speed = h.speed * (h.state === 'toWheel' ? 1.5 : 1);
        dir.normalize();
        m.position.addScaledVector(dir, speed * dt);
        const targetYaw = Math.atan2(-dir.z, dir.x);
        let dy = targetYaw - m.rotation.y;
        while (dy > Math.PI) dy -= Math.PI * 2;
        while (dy < -Math.PI) dy += Math.PI * 2;
        m.rotation.y += dy * Math.min(1, dt * 8);
        m.position.y = 1.1 + Math.abs(Math.sin(h.phase * 9)) * 0.06; // waddle-hop
      }
      break;
    }
    case 'running': {
      h.timer -= dt;
      legSpeed = 24;
      moving = true;
      wheel.rotation.z -= dt * 5.5; // SPIN THE WHEEL!
      body.scale.y = 0.95 + Math.sin(time * 18) * 0.02;
      if (h.timer <= 0) {
        wheelUser.id = -1;
        h.state = 'walk';
        h.target.set((Math.random() - 0.5) * 2 * BOUND, 1.1, (Math.random() - 0.5) * 2 * BOUND);
      }
      break;
    }
    case 'eating': {
      h.timer -= dt;
      // Peck head down toward bowl
      head.rotation.x = -0.5 + Math.sin(time * 10 + h.phase) * 0.25;
      // Food pellets jiggle
      food.children.forEach((p, i) => {
        p.position.y = 0.42 + Math.abs(Math.sin(time * 8 + i)) * 0.06;
      });
      if (h.timer <= 0) {
        head.rotation.x = 0;
        h.state = 'idle';
        h.timer = 1;
      }
      break;
    }
  }

  // Leg animation
  legs.forEach((leg, i) => {
    const offset = (i < 2 ? 0 : Math.PI) + (i % 2) * Math.PI;
    leg.rotation.x = moving ? Math.sin(h.phase * legSpeed + offset) * 0.7 : 0;
  });
}

// ============================================================
//  LOOP
// ============================================================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  hamsters.forEach(h => updateHamster(h, dt, time));

  // Wheel slowly coasts to a stop when nobody runs
  if (wheelUser.id === -1) {
    wheel.rotation.z *= 1; // keep last position; add gentle friction spin if desired
  }

  // Gentle bob for the hut roof (whimsy)
  hutRoof.position.y = 2.1 + Math.sin(time * 1.5) * 0.03;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
