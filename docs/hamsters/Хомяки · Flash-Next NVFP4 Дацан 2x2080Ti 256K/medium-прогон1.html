<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bde3f0; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    color: #5b3a1e; pointer-events: none;
  }
  #ui h1 { margin: 0; font-size: 22px; text-shadow: 0 2px 0 #fff; }
  #ui p  { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  #badge {
    position: fixed; bottom: 12px; right: 16px; z-index: 10;
    font-family: sans-serif; font-size: 12px; color: #5b3a1e; opacity:.7;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; Watch them run, snack &amp; nap</p>
</div>
<div id="badge">Three.js • one file • no worries</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============ basics ============ */
const FLOOR_Y = 0.5;
const BOUND   = 4.9;          // keep hamsters inside the tray

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbde3f0);
scene.fog = new THREE.Fog(0xbde3f0, 25, 55);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(10, 8.5, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

/* lights */
scene.add(new THREE.HemisphereLight(0xfff2dc, 0x8a6f4d, 0.9));
const sun = new THREE.DirectionalLight(0xfff0cf, 1.6);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top  =  12; sun.shadow.camera.bottom = -12;
scene.add(sun);

/* helpers */
const mat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.95 });
const box = (w,h,d,c) => new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c));
function shadowed(o, cast=true, recv=true){ o.traverse(m=>{ if(m.isMesh){m.castShadow=cast;m.receiveShadow=recv;} }); return o; }
const rand = (a,b) => a + Math.random()*(b-a);
function lerpAngle(a, b, t){
  let d = (b - a) % (Math.PI*2);
  if (d >  Math.PI) d -= Math.PI*2;
  if (d < -Math.PI) d += Math.PI*2;
  return a + d * t;
}

/* ============ room floor & tray ============ */
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 24), mat(0x9fd08a));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const tray = new THREE.Group();
const base = box(12, 0.5, 12, 0xd9855c); base.position.y = 0.25; tray.add(base);
const sandFloor = box(11.2, 0.06, 11.2, 0xe8cfa0); sandFloor.position.y = 0.52; tray.add(sandFloor);
[[0,6],[0,-6]].forEach(([x,z])=>{ const w = box(12,0.7,0.5,0xc96f45); w.position.set(x,0.85,z); tray.add(w); });
[[6,0],[-6,0]].forEach(([x,z])=>{ const w = box(0.5,0.7,12,0xc96f45); w.position.set(x,0.85,z); tray.add(w); });
scene.add(shadowed(tray));

/* wood shavings */
for (let i=0;i<90;i++){
  const s = box(rand(.12,.3), .05, rand(.12,.3), [0xf0d9a8,0xe3c48a,0xf7e6c0][i%3]);
  s.position.set(rand(-5.3,5.3), FLOOR_Y+0.05, rand(-5.3,5.3));
  s.rotation.y = rand(0, Math.PI);
  scene.add(s);
}

/* ============ cage bars ============ */
const cage = new THREE.Group();
const postMat = mat(0x8a5a33);
[[-5.8,-5.8],[5.8,-5.8],[-5.8,5.8],[5.8,5.8]].forEach(([x,z])=>{
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.35,4.6,0.35), postMat);
  p.position.set(x, 2.9, z); cage.add(p);
});
[[-5.8,0],[5.8,0]].forEach(([x,z])=>{ const r = box(0.22,0.22,11.8,0x8a5a33); r.position.set(x,5.15,z); cage.add(r); });
[[0,-5.8],[0,5.8]].forEach(([x,z])=>{ const r = box(11.8,0.22,0.22,0x8a5a33); r.position.set(x,5.15,z); cage.add(r); });
const barGeo = new THREE.CylinderGeometry(0.055, 0.055, 4.3, 5);
const barMat = mat(0xf6f1e3);
for (let i=-7;i<=7;i++){
  const t = i * 0.78;
  [[ t,-5.8],[t,5.8]].forEach(([x,z])=>{ const b=new THREE.Mesh(barGeo,barMat); b.position.set(x,2.9,z); cage.add(b); });
  [[-5.8,t],[5.8,t]].forEach(([x,z])=>{ const b=new THREE.Mesh(barGeo,barMat); b.position.set(x,2.9,z); cage.add(b); });
}
scene.add(shadowed(cage));

/* ============ the wheel (interactive object #1) ============ */
const wheelGroup = new THREE.Group();
wheelGroup.position.set(-3.9, 0, 0);
wheelGroup.rotation.y = Math.PI/2;
const spinner = new THREE.Group();
spinner.position.set(0, 1.55, 0);
const rim = new THREE.Mesh(new THREE.TorusGeometry(1.45, 0.13, 6, 20), mat(0xff6f91));
spinner.add(rim);
for (let i=0;i<6;i++){
  const spoke = box(2.8, 0.09, 0.09, 0xffb4c8);
  spoke.rotation.z = i * Math.PI/6;
  spinner.add(spoke);
}
for (let i=0;i<10;i++){
  const a = i/10 * Math.PI*2;
  const rung = box(0.1, 0.1, 0.75, 0xffd1dc);
  rung.position.set(Math.cos(a)*1.35, Math.sin(a)*1.35, 0);
  rung.rotation.z = a + Math.PI/2;
  spinner.add(rung);
}
wheelGroup.add(spinner);
[[-0.45],[0.45]].forEach(([z])=>{
  const arm = box(0.16, 1.6, 0.16, 0x8a5a33);
  arm.position.set(0, 0.75, z); wheelGroup.add(arm);
});
const wheelBase = box(0.5, 0.2, 1.6, 0x8a5a33); wheelBase.position.y = 0.12; wheelGroup.add(wheelBase);
scene.add(shadowed(wheelGroup));

/* ============ food bowl (interactive object #2) + pellets ============ */
const bowl = new THREE.Group();
const bowlMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.45, 0.45, 8), mat(0x4ecdc4));
bowlMesh.position.y = 0.22; bowl.add(bowlMesh);
const food = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.15, 8), mat(0xc98f4e));
food.position.y = 0.42; bowl.add(food);
bowl.position.set(3.6, FLOOR_Y, 2.6);
scene.add(shadowed(bowl));
for (let i=0;i<10;i++){
  const p = box(0.14,0.1,0.14, [0xd9a05b,0xb5763a,0xe8b878][i%3]);
  p.position.set(3.6+rand(-1.2,1.2), FLOOR_Y+0.06, 2.6+rand(-1.2,1.2));
  p.rotation.y = rand(0,3);
  scene.add(p);
}

/* ============ tunnel + platform (decor) ============ */
const tunnel = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 2.4, 10, 1, true), mat(0x6a89cc));
tunnel.rotation.x = Math.PI/2;
tunnel.position.set(-0.5, FLOOR_Y+0.72, -3.2);
scene.add(shadowed(tunnel));
const platform = box(2.2, 0.5, 2.2, 0xd9855c);
platform.position.set(3.4, FLOOR_Y+0.25, -3.3);
scene.add(shadowed(platform));

/* ============ hamsters ============ */
const WHEEL_SPOT = new THREE.Vector3(-3.45, FLOOR_Y, 0);
const BOWL_SPOT  = new THREE.Vector3(3.6,  FLOOR_Y, 1.55);
let wheelUser = null;

class Hamster {
  constructor(palette, name){
    this.name = name;
    const g = new THREE.Group();
    const [fur, belly] = palette;

    const body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 7, 5), mat(fur));
    body.scale.set(1, 0.88, 1.15); body.position.y = 0.42; g.add(body);
    const bellyM = new THREE.Mesh(new THREE.SphereGeometry(0.3, 6, 4), mat(belly));
    bellyM.scale.set(0.9, 0.7, 0.9); bellyM.position.set(0, 0.3, 0.16); g.add(bellyM);

    const head = new THREE.Group(); head.position.set(0, 0.58, 0.38); g.add(head);
    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.26, 6, 5), mat(fur));
    head.add(skull);
    const snout = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.22, 5), mat(belly));
    snout.rotation.x = Math.PI/2; snout.position.set(0,-0.03,0.24); head.add(snout);
    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.045, 4, 4), mat(0xff9aa8));
    nose.position.set(0,-0.02,0.34); head.add(nose);
    [-1,1].forEach(s=>{
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 5, 5), mat(0x2b1d0e));
      eye.position.set(0.12*s, 0.06, 0.21); head.add(eye);
      const ear = new THREE.Mesh(new THREE.SphereGeometry(0.11, 5, 4), mat(fur));
      ear.scale.set(1, 0.55, 1); ear.position.set(0.17*s, 0.22, -0.02);
      head.add(ear); this['ear'+s] = ear;
    });
    this.head = head; g.add(head);

    this.legs = [];
    [[-0.2,0.22],[0.2,0.22],[-0.2,-0.2],[0.2,-0.2]].forEach(([x,z])=>{
      const leg = new THREE.Group(); leg.position.set(x, 0.28, z);
      const m = box(0.11, 0.24, 0.11, fur); m.position.y = -0.12; leg.add(m);
      g.add(leg); this.legs.push(leg);
    });

    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.14, 4), mat(fur));
    tail.rotation.x = -Math.PI/2.5; tail.position.set(0, 0.42, -0.5); g.add(tail);

    shadowed(g);
    g.position.set(rand(-3,3), FLOOR_Y, rand(-3,3));
    g.rotation.y = rand(0, Math.PI*2);
    scene.add(g);
    this.mesh = g;

    this.state = 'idle';
    this.timer = rand(0.5, 2.5);
    this.speed = rand(1.1, 1.8);
    this.phase = rand(0, 6);
    this.target = new THREE.Vector3();
  }

  pickAction(){
    const r = Math.random();
    if (r < 0.22 && !wheelUser){
      this.state = 'toWheel'; this.timer = 8;
    } else if (r < 0.45){
      this.state = 'toBowl'; this.timer = 8;
    } else {
      this.state = 'walk'; this.timer = 10;
      this.target.set(rand(-BOUND,BOUND), FLOOR_Y, rand(-BOUND,BOUND));
    }
  }

  goTo(dt, dest, arriveCb){
    const p = this.mesh.position;
    const dx = dest.x - p.x, dz = dest.z - p.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.22){ arriveCb(); return; }
    const wantYaw = Math.atan2(dx, dz);
    this.mesh.rotation.y = lerpAngle(this.mesh.rotation.y, wantYaw, dt*5);
    p.x += Math.sin(this.mesh.rotation.y) * this.speed * dt;
    p.z += Math.cos(this.mesh.rotation.y) * this.speed * dt;
    this.phase += dt * 11;
    this.legs.forEach((l,i)=> l.rotation.x = Math.sin(this.phase + i*Math.PI) * 0.7);
    this.mesh.position.y = FLOOR_Y + Math.abs(Math.sin(this.phase)) * 0.05;
  }

  settle(){
    this.legs.forEach(l => l.rotation.x *= 0.8);
    this.mesh.position.y = FLOOR_Y;
  }

  update(dt, t){
    this.timer -= dt;
    const p = this.mesh.position;

    switch (this.state){
      case 'idle':
        this.settle();
        this.head.rotation.x = Math.sin(t*2 + this.phase) * 0.06;
        if (Math.random() < 0.02){ // ear twitch!
          const e = Math.random()<0.5 ? this.ear1 : this.ear[-1] || this.ear1;
          e.scale.y = 0.3; setTimeout(()=> e.scale.y = 0.55, 180);
        }
        if (this.timer <= 0) this.pickAction();
        break;

      case 'walk':
        this.goTo(dt, p.distanceTo(this.target) < 0.25 && this.timer < 9 ? new THREE.Vector3(99,0,99) : this.target,
          ()=>{ this.state='idle'; this.timer=rand(1,3.5); });
        if (Math.abs(p.x)>BOUND || Math.abs(p.z)>BOUND){ // wall bonk -> repick
          p.x = THREE.MathUtils.clamp(p.x,-BOUND,BOUND);
          p.z = THREE.MathUtils.clamp(p.z,-BOUND,BOUND);
          this.target.set(rand(-BOUND,BOUND), FLOOR_Y, rand(-BOUND,BOUND));
        }
        if (this.timer <= 0){ this.state='idle'; this.timer=rand(1,3); }
        break;

      case 'toWheel':
        if (wheelUser && wheelUser !== this){ this.state='idle'; this.timer=2; break; }
        this.goTo(dt, WHEEL_SPOT, ()=>{
          this.state='wheelRun'; wheelUser=this; this.timer=rand(4,8);
          p.copy(WHEEL_SPOT); this.mesh.rotation.y = -Math.PI/2;
        });
        if (this.timer <= 0){ this.state='idle'; this.timer=2; }
        break;

      case 'wheelRun':
        this.legs.forEach((l,i)=> l.rotation.x = Math.sin(t*16 + i*Math.PI) * 0.9);
        this.mesh.position.y = FLOOR_Y + Math.abs(Math.sin(t*16)) * 0.03;
        this.head.rotation.x = -0.15;
        spinner.rotation.z -= dt * 9;
        if (this.timer <= 0){
          wheelUser = null; this.state='idle'; this.timer=rand(1,3);
          this.head.rotation.x = 0; this.settle();
          p.z += 1.2; // tumble out the front
        }
        break;

      case 'toBowl':
        this.goTo(dt, BOWL_SPOT, ()=>{ this.state='munch'; this.timer=rand(2.5,5); });
        if (this.timer <= 0){ this.state='idle'; this.timer=2; }
        break;

      case 'munch':
        this.settle();
        this.head.rotation.x = Math.abs(Math.sin(t*10)) * 0.35;
        this.mesh.scale.x = 1 + Math.sin(t*10)*0.02; // chompy squish
        if (this.timer <= 0){
          this.state='idle'; this.timer=rand(1,3);
          this.head.rotation.x = 0; this.mesh.scale.x = 1;
        }
        break;
    }

    // body breathing / running squash
    const breathe = this.state==='walk' ? 0.03 : 0.015;
    const f = 1 + Math.sin(t*6 + this.phase) * breathe;
    this.mesh.scale.z = f;
  }
}

const palettes = [
  [0xf5c46a, 0xffe9c4],  // golden
  [0xe8b878, 0xfff2dc],  // cream
  [0xa9743f, 0xf0d9b8],  // chocolate
  [0xf3ede2, 0xd9a05b],  // panda-ish white
  [0xd9915b, 0xffe3bd],  // toasted
];
const hamsters = palettes.map((p,i)=> new Hamster(p, 'H'+i));

/* ============ loop ============ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  for (const h of hamsters) h.update(dt, t);
  if (!wheelUser) spinner.rotation.z *= 0.995; // lazy slow-down when empty
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
