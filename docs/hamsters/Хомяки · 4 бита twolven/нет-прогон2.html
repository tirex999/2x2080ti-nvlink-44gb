<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff6e9; --peach:#ffd9b8; --coral:#ff7a5c; --mint:#7fd9c4;
    --sky:#9ed3f0; --lemon:#ffd23f; --ink:#4a3a34; --card:#fffdf8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;
    background:
      radial-gradient(1100px 760px at 80% -12%, #ffe3cf 0%, transparent 58%),
      radial-gradient(900px 700px at -10% 112%, #d9f0e8 0%, transparent 55%),
      linear-gradient(162deg,#fff7ec,#ffe9d6 46%,#e6f3ee);
  }
  /* floating decorative shapes */
  .bg-shapes{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .shape{position:absolute;opacity:.55;animation:float 11s ease-in-out infinite}
  .shape.s1{width:120px;height:120px;left:6%;top:16%;background:var(--lemon);border-radius:50%;filter:blur(1px)}
  .shape.s2{width:90px;height:90px;right:9%;bottom:14%;background:var(--sky);transform:rotate(20deg);border-radius:22px;animation-delay:-3s}
  .shape.s3{width:70px;height:70px;right:22%;top:12%;background:var(--coral);clip-path:polygon(50% 0,100% 100%,0 100%);animation-delay:-6s}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(8deg)}}

  canvas#scene{position:fixed;inset:0;z-index:1;display:block;touch-action:none}

  /* top bar */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px;pointer-events:none}
  .brand{display:flex;gap:14px;align-items:center}
  .logo{width:52px;height:52px;flex:none;filter:drop-shadow(0 8px 12px rgba(255,122,92,.35))}
  h1{font-family:'Fredoka';font-weight:700;font-size:clamp(24px,3.4vw,36px);line-height:.95;letter-spacing:-.5px;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.6)}
  h1 span{color:var(--coral)}
  .tag{font-size:13px;font-weight:700;opacity:.72;margin-top:3px}

  .controls{display:flex;gap:10px;pointer-events:auto}
  .btn{font-family:'Fredoka';font-weight:600;font-size:15px;border:none;cursor:pointer;color:var(--ink);
    background:var(--card);padding:11px 16px;border-radius:14px;display:flex;gap:8px;align-items:center;
    box-shadow:0 6px 0 rgba(0,0,0,.08),0 12px 20px rgba(0,0,0,.08);transition:transform .12s,box-shadow .12s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 rgba(0,0,0,.08),0 16px 24px rgba(0,0,0,.1)}
  .btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.08)}
  .btn.primary{background:var(--coral);color:#fff}
  .btn .ic{font-size:17px}

  /* bottom-left legend */
  .legend{position:fixed;left:24px;bottom:22px;z-index:5;max-width:230px;background:rgba(255,253,248,.92);
    backdrop-filter:blur(6px);padding:14px 16px;border-radius:16px;box-shadow:0 12px 26px rgba(0,0,0,.12);
    border:2px solid rgba(0,0,0,.04);font-size:13px;line-height:1.5}
  .legend h4{font-family:'Fredoka';font-size:14px;margin-bottom:6px;color:var(--coral)}
  .legend p{margin:4px 0;font-weight:600;opacity:.85}
  .legend b{color:var(--ink)}

  /* bottom-right stats */
  .stats{position:fixed;right:24px;bottom:22px;z-index:5;display:flex;gap:12px}
  .stat{background:var(--card);border-radius:16px;padding:12px 16px;text-align:center;min-width:92px;
    box-shadow:0 8px 0 rgba(0,0,0,.05),0 14px 22px rgba(0,0,0,.08);border:2px solid rgba(0,0,0,.03)}
  .stat .num{font-family:'Fredoka';font-weight:700;font-size:26px;line-height:1;color:var(--ink)}
  .stat .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;opacity:.6;margin-top:5px}
  .stat.food .num{color:var(--coral)} .stat.speed .num{color:var(--mint)}

  /* toast */
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(24px);z-index:6;
    background:var(--ink);color:#fff;font-family:'Fredoka';font-weight:600;font-size:15px;
    padding:12px 20px;border-radius:14px;opacity:0;transition:.35s cubic-bezier(.2,.8,.2,1);pointer-events:none;
    box-shadow:0 14px 28px rgba(0,0,0,.28)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* loader */
  #loader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;gap:20px;align-items:center;justify-content:center;
    background:linear-gradient(162deg,#fff7ec,#ffe9d6);transition:opacity .6s}
  #loader.hidden{opacity:0;pointer-events:none}
  .spinner{width:54px;height:54px;border-radius:50%;border:6px solid rgba(255,122,92,.2);border-top-color:var(--coral);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-txt{font-family:'Fredoka';font-weight:600;font-size:18px;color:var(--ink)}

  @media(max-width:640px){
    .legend{display:none}.tag{display:none}
    .stats{gap:8px}.stat{min-width:76px;padding:10px 12px}.stat .num{font-size:22px}
    .btn{padding:10px 12px;font-size:14px}.btn .txt{display:none}
  }
</style>
</head>
<body>
  <div class="bg-shapes"><span class="shape s1"></span><span class="shape s2"></span><span class="shape s3"></span></div>
  <canvas id="scene"></canvas>

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <ellipse cx="32" cy="46" rx="20" ry="15" fill="#ffbf87"/>
        <circle cx="15" cy="31" r="8" fill="#ffb27e"/>
        <circle cx="49" cy="31" r="8" fill="#ffb27e"/>
        <circle cx="15" cy="31" r="4" fill="#ff8fa3"/>
        <circle cx="49" cy="31" r="4" ref="#ff8fa3"/>
        <circle cx="49" cy="31" r="4" fill="#ff8fa3"/>
        <circle cx="24" cy="41" r="3.4" fill="#3a2a24"/><circle cx="40" cy="41" r="3.4" fill="#3a2a24"/>
        <path d="M32 47 l-3 3 h6 z" fill="#ff8fa3"/>
        <path d="M18 50 q-5 2 -8 6 M46 50 q5 2 8 6" stroke="#3a2a24" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Hamster<span> Playground</span></h1>
        <p class="tag">a cozy low‑poly corner of tiny busy lives</p>
      </div>
    </div>
    <div class="controls">
      <button id="btnPause" class="btn"><span class="ic">⏸</span><span class="txt">Pause</span></button>
      <button id="btnReset" class="btn"><span class="ic">↺</span><span class="txt">Reset view</span></button>
      <button id="btnSpeed" class="btn primary"><span class="ic">⚡</span><span class="txt">Speed ×1</span></button>
    </div>
  </header>

  <aside class="legend">
    <h4>How to play</h4>
    <p><b>Drag</b> to orbit the cage.</p>
    <p><b>Scroll / pinch</b> to zoom.</p>
    <p><b>Click a hamster</b> for a reaction.</p>
  </aside>

  <div class="stats">
    <div class="stat food"><div class="num" id="foodNum">0</div><div class="lbl">Seeds eaten</div></div>
    <div class="stat speed"><div class="num" id="speedNum">×1</div><div class="lbl">Tempo</div></div>
  </div>

  <div id="toast"></div>
  <div id="loader"><div class="spinner"></div><div class="load-txt">Fluffing the hamsters…</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dampAngle=(cur,target,l,dt)=>{let d=((target-cur+Math.PI*3)%(Math.PI*2))-Math.PI;return cur+d*(1-Math.exp(-l*dt));};

/* ---------- renderer / scene / camera ---------- */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xfff2e2);
scene.fog=new THREE.Fog(0xffe7cf,17,34);

const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.1,100);
camera.position.set(8.6,6.2,10.6);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.target.set(0,1.4,0);
controls.minDistance=6;controls.maxDistance=24;
controls.minPolarAngle=0.16;controls.maxPolarAngle=1.46;
controls.update();

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xfff1dd,0xf2c39a,0.55));
scene.add(new THREE.AmbientLight(0xffffff,0.12));
const dir=new THREE.DirectionalLight(0xfff0d8,1.35);
dir.position.set(7,13,5);dir.castShadow=true;
dir.shadow.mapSize.set(2048,2048);
dir.shadow.camera.near=1;dir.shadow.camera.far=40;
dir.shadow.camera.left=-11;dir.shadow.camera.right=11;
dir.shadow.camera.top=11;dir.shadow.camera.bottom=-11;
dir.shadow.bias=-0.0004;dir.shadow.normalBias=0.03;
scene.add(dir);

/* ---------- helpers ---------- */
function mat(c,o={}){return new THREE.MeshStandardMaterial({color:c,roughness:o.r??0.85,metalness:o.m??0,flatShading:o.f??true,emissive:o.e??0x000000,emissiveIntensity:o.ei??1,transparent:o.t??false,opacity:o.o??1,side:o.side??THREE.FrontSide});}
function mesh(g,m){const o=new THREE.Mesh(g,m);o.castShadow=true;o.receiveShadow=true;return o;}
function shadowOnly(){const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.ShadowMaterial({opacity:0.22}));m.rotation.x=-Math.PI/2;m.receiveShadow=true;return m;}
function roundedRect(w,h,r){const s=new THREE.Shape();const x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;}
function makeFloorTexture(){
  const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');
  g.fillStyle='#f4dcb8';g.fillRect(0,0,512,512);
  const planks=['#efd2ab','#f2d9ba','#e8caa0','#f4dcbc'];
  for(let i=0;i<16;i++){g.fillStyle=planks[i%planks.length];g.fillRect(0,i*32,512,32);
    g.strokeStyle='rgba(120,80,40,.18)';g.lineWidth=2;g.strokeRect(0,i*32,512,32);}
  for(let i=0;i<260;i++){g.fillStyle=`rgba(120,80,40,${rand(.03,.08)})`;g.beginPath();g.arc(rand(0,512),rand(0,512),rand(.5,1.6),0,7);g.fill();}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,3);return t;
}
function makeDotTexture(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const grd=g.createRadialGradient(32,32,0,32,32,32);grd.addColorStop(0,'rgba(255,255,255,1)');grd.addColorStop(.4,'rgba(255,255,255,.55)');grd.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=grd;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
const dotTex=makeDotTexture();

/* ---------- environment ---------- */
// soft ground
const ground=mesh(new THREE.CircleGeometry(40,48),mat(0xf6e2c6,{r:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;ground.receiveShadow=true;ground.castShadow=false;scene.add(ground);
// wooden base
const base=mesh(new THREE.BoxGeometry(9.4,0.5,7.4),mat(0xc98a52,{r:0.7}));base.position.y=0.25;scene.add(base);
const baseTop=mesh(new THREE.BoxGeometry(9.0,0.14,7.0),mat(0xd9a06a,{r:0.7}));baseTop.position.y=0.5;scene.add(baseTop);
// cage floor
const floorMat=mat(0xe9c48d,{r:0.6});floorMat.map=makeFloorTexture();
const floor=mesh(new THREE.BoxGeometry(8.4,0.12,6.4),floorMat);floor.position.y=0.6;scene.add(floor);
// hay
for(let i=0;i<26;i++){const h=mesh(new THREE.CapsuleGeometry(0.05,rand(0.1,0.24),3,6),mat(pick([0xe7c06a,0xd9b04f,0xf0d08a]),{r:1}));h.position.set(rand(-3.8,3.8),0.68,rand(-2.8,2.8));h.rotation.set(rand(0,3),rand(0,3),rand(0,3));scene.add(h);}

const FLOOR_Y=0.66, WALL_X=3.9, WALL_Z=2.9;
const FOOD_POS=new THREE.Vector3(-3.0,FLOOR_Y,-2.0);
const WHEEL_POS=new THREE.Vector3(3.35,0.95,-2.3);
const TUNNEL_POS=new THREE.Vector3(-2.3,0.85,1.9);

/* ---------- cage walls (glass + frame) ---------- */
const glassMat=new THREE.MeshPhysicalMaterial({color:0xbfe6f2,transmission:0.9,roughness:0.12,metalness:0,thickness:0.5,ior:1.2,transparent:true,opacity:0.5,side:THREE.DoubleSide,depthWrite:false});
const frameMat=mat(0x9c6a3c,{r:0.55});
function wall(w,h){return mesh(new THREE.BoxGeometry(w,h,0.06),glassMat);}
function post(x,z){const p=mesh(new THREE.BoxGeometry(0.14,3.1,0.14),frameMat);p.position.set(x,2.1,z);scene.add(p);}
function rail(y,w,d,x,z){const r=mesh(new THREE.BoxGeometry(w,0.14,d),frameMat);r.position.set(x,y,z);scene.add(r);}
// back & left walls
const wb=wall(8.4,3.0);wb.position.set(0,2.1,-3.2);scene.add(wb);
const wl=wall(6.4,3.0);wl.rotation.y=Math.PI/2;wl.position.set(-4.2,2.1,0);scene.add(wl);
// front & right (open, lower)
const wf=wall(8.4,1.7);wf.position.set(0,1.45,3.2);scene.add(wf);
const wr=wall(6.4,1.7);wr.rotation.y=Math.PI/2;wr.position.set(4.2,1.45,0);scene.add(wr);
// frame: posts
[[-4.2,-3.2],[4.2,-3.2],[-4.2,3.2],[4.2,3.2]].forEach(([x,z])=>post(x,z));
// top rails
rail(3.6,8.6,0.16,0,-3.2);rail(3.6,8.6,0.16,0,3.2);rail(3.6,0.16,6.6,-4.2,0);rail(3.6,0.16,6.6,4.2,0);
// mid rails (front/right at 1.7 height)
rail(1.7,8.6,0.12,0,3.2);rail(1.7,0.12,6.6,4.2,0);

/* ---------- interactive objects ---------- */
// wheel
const wheelGroup=new THREE.Group();wheelGroup.position.copy(WHEEL_POS);scene.add(wheelGroup);
const wheelStand=mesh(new THREE.CylinderGeometry(0.06,0.08,0.3,8),mat(0x8a5a34));wheelStand.position.set(0,-0.42,0);wheelGroup.add(wheelStand);
const wheelHub=mesh(new THREE.CylinderGeometry(0.12,0.12,0.12,12),mat(0xff7a5c,{m:0.1}));wheelHub.rotation.x=Math.PI/2;wheelGroup.add(wheelHub);
const wheelSpin=new THREE.Group();wheelGroup.add(wheelSpin);
const rim=mesh(new THREE.TorusGeometry(0.55,0.07,10,26),mat(0xff8a5c));rim.castShadow=true;wheelSpin.add(rim);
for(let i=0;i<10;i++){const a=i/10*Math.PI*2;const sp=mesh(new THREE.BoxGeometry(0.05,0.5,0.05),mat(0xffb08a));sp.position.set(Math.cos(a)*0.28,Math.sin(a)*0.28,0);sp.rotation.z=a-Math.PI/2;wheelSpin.add(sp);}
let wheelSpinSpeed=0.15,wheelTarget=0.15;

// food bowl
const bowlGroup=new THREE.Group();bowlGroup.position.copy(FOOD_POS);scene.add(bowlGroup);
bowlGroup.add(mesh(new THREE.CylinderGeometry(0.5,0.42,0.28,16),mat(0x7fd9c4,{r:0.4})));
const bowlInner=mesh(new THREE.CylinderGeometry(0.42,0.36,0.02,16),mat(0x5fbcae));bowlInner.position.y=0.14;bowlGroup.add(bowlInner);
let foodLevel=1;
const seedMeshes=[];
function addSeed(){const s=mesh(new THREE.SphereGeometry(0.06,6,5),mat(pick([0x6b4a2a,0x8a6a3a,0x5a3a1a])));s.scale.set(1,0.7,1);s.position.set(rand(-0.25,0.25),0.16,rand(-0.25,0.25));bowlGroup.add(s);seedMeshes.push(s);return s;}
for(let i=0;i<12;i++)addSeed();

// tunnel
const tunnelGroup=new THREE.Group();tunnelGroup.position.copy(TUNNEL_POS);scene.add(tunnelGroup);
const tunnelMat=mat(0xffd23f,{r:0.5,side:THREE.DoubleSide});
const tube=mesh(new THREE.CylinderGeometry(0.55,0.55,2.6,14,1,true),tunnelMat);tube.rotation.z=Math.PI/2;tunnelGroup.add(tube);
const cap=mesh(new THREE.TorusGeometry(0.55,0.09,10,20),mat(0xffbe1f));cap.rotation.y=Math.PI/2;cap.position.x=1.3;tunnelGroup.add(cap);
const cap2=cap.clone();cap2.position.x=-1.3;tunnelGroup.add(cap2);
// tunnel entrance posts
const tp1=mesh(new THREE.BoxGeometry(0.12,0.5,0.12),frameMat);tp1.position.set(1.3,0.28,0);tunnelGroup.add(tp1);

// water bottle (decor)
const bottle=mesh(new THREE.CylinderGeometry(0.14,0.14,0.7,10),mat(0xbfe6f2,{r:0.2,t:true,o:0.7}));bottle.position.set(3.9,1.3,-2.9);scene.add(bottle);
const nozzle=mesh(new THREE.CylinderGeometry(0.05,0.05,0.2,8),mat(0x7fd9c4));nozzle.rotation.z=Math.PI/2;nozzle.position.set(3.75,1.05,-2.9);scene.add(nozzle);

// hanging light bulb
const bulbCord=mesh(new THREE.CylinderGeometry(0.02,0.02,1.4,6),mat(0x5a4a3a));bulbCord.position.set(1.5,3.6,0.5);scene.add(bulbCord);
const bulbGlow=new THREE.PointLight(0xffd9a0,0.6,6,1.5);bulbGlow.position.set(1.5,2.8,0.5);scene.add(bulbGlow);
const bulbSphere=mesh(new THREE.SphereGeometry(0.16,12,10),mat(0xffe0a0,{e:0xffcf80,ei:1.2,r:0.3}));bulbSphere.position.copy(bulbGlow.position);scene.add(bulbSphere);

// ambient particles (dust in light)
const pCount=120;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(pCount*3);const pVel=[];
for(let i=0;i<pCount;i++){pPos[i*3]=rand(-4,4);pPos[i*3+1]=rand(0.6,3.6);pPos[i*3+2]=rand(-3,3);pVel.push({vy:rand(-0.002,0.001),vx:rand(-0.001,0.001),vz:rand(-0.001,0.001)});}
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const pMat=new THREE.PointsMaterial({size:0.06,map:dotTex,color:0xfff0d0,transparent:true,opacity:0.7,depthWrite:false,sizeAttenuation:true});
const particles=new THREE.Points(pGeo,pMat);scene.add(particles);

/* ---------- hamsters ---------- */
const HAMSTER_COLORS=[
  {body:0xffbf87,cheek:0xff8fa3,foot:0xff9a6a}, // peachy
  {body:0xf6d9a8,cheek:0xffa66b,foot:0xe8b87e}, // sandy
  {body:0xffd9b0,cheek:0xff7a8c,foot:0xffb08a}, // blush
  {body:0xecc79a,cheek:0xff9a6b,foot:0xd9a878}, // caramel
  {body:0xffc99a,cheek:0xff8fa3,foot:0xffa070}, // apricot
];
const NAMES=['Nutmeg','Biscuit','Clove','Pepper','Poppy','Cinnamon','Marmalade','Buttercup','Oat','Sesame'];

function makeHamster(color){
  const g=new THREE.Group();
  const bodyMat=mat(color.body,{r:0.7});
  // body
  const body=mesh(new THREE.SphereGeometry(0.34,10,8),bodyMat);
  body.scale.set(1.2,0.95,0.95);body.position.y=0.34;g.add(body);
  // head
  const head=mesh(new THREE.SphereGeometry(0.28,10,8),bodyMat);
  head.position.set(0.22,0.42,0);g.add(head);
  // cheeks
  const cheekMat=mat(color.cheek,{r:0.6});
  const cL=mesh(new THREE.SphereGeometry(0.08,8,6),cheekMat);cL.position.set(0.34,0.36,0.16);g.add(cL);
  const cR=cL.clone();cR.position.z=-0.16;g.add(cR);
  // eyes
  const eyeMat=mat(0x3a2a24,{r:0.4});
  const eL=mesh(new THREE.SphereGeometry(0.045,8,6),eyeMat);eL.position.set(0.44,0.44,0.1);g.add(eL);
  const eR=eL.clone();eR.position.z=-0.1;g.add(eR);
  // nose
  const nose=mesh(new THREE.SphereGeometry(0.035,8,6),mat(0xff6b6b));nose.position.set(0.5,0.4,0);g.add(nose);
  // ears
  const earMat=mat(color.foot,{r:0.6});
  const earL=mesh(new THREE.SphereGeometry(0.1,8,6),earMat);earL.scale.set(1,1,0.5);earL.position.set(0.16,0.62,0.14);g.add(earL);
  const earR=earL.clone();earR.position.z=-0.14;g.add(earR);
  // feet
  const footMat=mat(color.foot,{r:0.6});
  const fL=mesh(new THREE.SphereGeometry(0.09,8,6),footMat);fL.scale.set(1.3,0.6,1);fL.position.set(0.1,0.12,0.14);g.add(fL);
  const fR=fL.clone();fR.position.z=-0.14;g.add(fR);
  // tail
  const tail=mesh(new THREE.SphereGeometry(0.06,8,6),bodyMat);tail.position.set(-0.4,0.3,0);g.add(tail);
  // store refs
  g.userData={
    body,head,eL,eR,cL,cR,fL,fR,earL,earR,tail,nose,
    color,
    state:'idle',stateTimer:rand(0.5,1.5),
    targetAngle:rand(0,Math.PI*2),
    speed:rand(0.4,0.7),
    wobblePhase:rand(0,10),
    blinkTimer:rand(1,3),blinkState:0,
    eatTimer:0,
    wheelTimer:0,
    name:pick(NAMES),
  };
  return g;
}

const hamsters=[];
const hamsterMeshes=[]; // for raycasting
const spawnPositions=[
  new THREE.Vector3(-1.5,FLOOR_Y,-1.0),
  new THREE.Vector3(1.0,FLOOR_Y,1.2),
  new THREE.Vector3(-2.5,FLOOR_Y,1.5),
  new THREE.Vector3(2.0,FLOOR_Y,-0.5),
  new THREE.Vector3(0.0,FLOOR_Y,0.0),
];
for(let i=0;i<5;i++){
  const col=pick(HAMSTER_COLORS);
  const h=makeHamster(col);
  h.position.copy(spawnPositions[i]);
  h.rotation.y=rand(0,Math.PI*2);
  scene.add(h);
  hamsters.push(h);
  hamsterMeshes.push(h.userData.body,h.userData.head);
}

/* ---------- interaction ---------- */
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let hovered=null;
let downPos=null;

function setPointer(e){const r=canvas.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;}
function getHamsterFromHit(obj){let o=obj;while(o){if(hamsters.includes(o))return o;o=o.parent;}return null;}

canvas.addEventListener('pointermove',(e)=>{
  setPointer(e);raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(hamsterMeshes,false);
  if(hits.length){hovered=getHamsterFromHit(hits[0].object);}else hovered=null;
  canvas.style.cursor=hovered?'pointer':'grab';
});
canvas.addEventListener('pointerdown',(e)=>{downPos={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',(e)=>{
  if(!downPos)return;
  const dx=e.clientX-downPos.x,dy=e.clientY-downPos.y;
  if(dx*dx+dy*dy<25){
    setPointer(e);raycaster.setFromCamera(pointer,camera);
    const hits=raycaster.intersectObjects(hamsterMeshes,false);
    if(hits.length){const h=getHamsterFromHit(hits[0].object);if(h)react(h);}
  }
  downPos=null;
});

function react(h){
  const u=h.userData;
  u.state='hop';u.stateTimer=0.6;
  showToast(`✦ ${u.name} hops!`);
}
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------- UI ---------- */
let paused=false,speedMult=1;
const SPEED_STEPS=[{m:0.5,l:'×½'},{m:1,l:'×1'},{m:1.6,l:'×1.6'}];
let speedIdx=1;
document.getElementById('btnPause').onclick=function(){
  paused=!paused;
  this.querySelector('.ic').textContent=paused?'▶':'⏸';
  this.querySelector('.txt').textContent=paused?'Play':'Pause';
  showToast(paused?'⏸ Paused':'▶ Playing');
};
document.getElementById('btnReset').onclick=function(){
  controls.reset();
  controls.target.set(0,1.4,0);
  showToast('↺ View reset');
};
document.getElementById('btnSpeed').onclick=function(){
  speedIdx=(speedIdx+1)%SPEED_STEPS.length;
  speedMult=SPEED_STEPS[speedIdx].m;
  this.querySelector('.txt').textContent='Speed '+SPEED_STEPS[speedIdx].l;
  document.getElementById('speedNum').textContent=SPEED_STEPS[speedIdx].l;
  showToast('⚡ Tempo '+SPEED_STEPS[speedIdx].l);
};

/* ---------- hamster AI ---------- */
function updateHamster(h,dt){
  const u=h.userData;
  const t=performance.now()/1000;
  u.wobblePhase+=dt*(u.state==='walk'?8:2);

  // blink
  u.blinkTimer-=dt;
  if(u.blinkTimer<=0){u.blinkState=u.blinkState?0:1;u.blinkTimer=u.blinkState?0.12:rand(1.5,4);}
  const eyeScale=u.blinkState?0.15:1;
  u.eL.scale.y=eyeScale;u.eR.scale.y=eyeScale;

  // hover glow
  const targetGlow=hovered===h?0.5:0;
  const cur=u.glow??0;
  u.glow=cur+(targetGlow-cur)*Math.min(1,dt*8);
  u.body.material.emissive.setHex(0xffd9a0);
  u.body.material.emissiveIntensity=u.glow;
  u.head.material.emissive.setHex(0xffd9a0);
  u.head.material.emissiveIntensity=u.glow;

  // hop squash
  let hopY=0,squash=1;
  if(u.state==='hop'){
    const p=u.stateTimer/0.6;
    hopY=Math.abs(Math.sin(p*Math.PI))*0.35;
    squash=1+Math.sin(p*Math.PI)*0.12;
  }

  // state machine
  u.stateTimer-=dt;
  const distFood=h.position.distanceTo(FOOD_POS);
  const distWheel=h.position.distanceTo(WHEEL_POS);
  const distTunnel=h.position.distanceTo(TUNNEL_POS);

  switch(u.state){
    case 'idle':
      if(u.stateTimer<=0){
        // decide: go food / wheel / tunnel / wander
        const r=Math.random();
        if(distFood>1.2&&r<0.35){u.state='walk';u.targetAngle=Math.atan2(FOOD_POS.z-h.position.z,FOOD_POS.x-h.position.x);u.stateTimer=99;}
        else if(distWheel>1.0&&r<0.55){u.state='walk';u.targetAngle=Math.atan2(WHEEL_POS.z-h.position.z,WHEEL_POS.x-h.position.x);u.stateTimer=99;}
        else if(distTunnel>1.2&&r<0.75){u.state='walk';u.targetAngle=Math.atan2(TUNNEL_POS.z-h.position.z,TUNNEL_POS.x-h.position.x);u.stateTimer=99;}
        else{u.state='walk';u.targetAngle=rand(0,Math.PI*2);u.stateTimer=rand(1.5,3.5);}
      }
      break;
    case 'walk':
      // steer toward target angle
      h.rotation.y=dampAngle(h.rotation.y,u.targetAngle,3,dt);
      h.position.x+=Math.sin(h.rotation.y)*u.speed*dt;
      h.position.z+=Math.cos(h.rotation.y)*u.speed*dt;
      // wobble
      h.position.y=FLOOR_Y+Math.abs(Math.sin(u.wobblePhase))*0.06;
      // foot waddle
      u.fL.position.y=0.12+Math.sin(u.wobblePhase)*0.04;
      u.fR.position.y=0.12+Math.sin(u.wobblePhase+Math.PI)*0.04;
      // arrived at food?
      if(distFood<0.7){u.state='eat';u.stateTimer=rand(1.5,3);u.eatTimer=0;wheelTarget=Math.max(wheelTarget,0.3);}
      // arrived at wheel?
      else if(distWheel<0.8){u.state='wheel';u.stateTimer=rand(1.5,3);wheelTarget=1.2;}
      // arrived at tunnel?
      else if(distTunnel<0.9){u.state='tunnel';u.stateTimer=rand(1.5,2.5);}
      // timed out wandering
      else if(u.stateTimer<=0){u.state='idle';u.stateTimer=rand(0.8,2);}
      // hit wall → turn
      if(h.position.x>WALL_X||h.position.x<-WALL_X||h.position.z>WALL_Z||h.position.z<-WALL_Z){
        h.position.x=clamp(h.position.x,-WALL_X,WALL_X);
        h.position.z=clamp(h.position.z,-WALL_Z,WALL_Z);
        u.targetAngle=h.rotation.y+rand(1.5,3)*(Math.random()<0.5?-1:1);
      }
      break;
    case 'eat':
      // face bowl
      h.rotation.y=dampAngle(h.rotation.y,Math.atan2(FOOD_POS.z-h.position.z,FOOD_POS.x-h.position.x),4,dt);
      // nibble: head dips
      const nib=Math.sin(t*10)*0.5+0.5;
      u.head.position.y=0.42-nib*0.08;
      // eat a seed occasionally
      u.eatTimer+=dt;
      if(u.eatTimer>0.8&&seedMeshes.length){
        u.eatTimer=0;
        const idx=seedMeshes.findIndex(s=>!s.visible);
        if(idx>=0){seedMeshes[idx].visible=false;foodLevel=Math.max(0,foodLevel-0.08);updateFoodUI();}
      }
      if(u.stateTimer<=0){u.state='idle';u.stateTimer=rand(1,2.5);u.head.position.y=0.42;}
      break;
    case 'wheel':
      // face wheel
      h.rotation.y=dampAngle(h.rotation.y,Math.atan2(WHEEL_POS.z-h.position.z,WHEEL_POS.x-h.position.x),4,dt);
      // run: fast waddle
      u.wobblePhase+=dt*14;
      u.fL.position.y=0.12+Math.sin(u.wobblePhase)*0.06;
      u.fR.position.y=0.12+Math.sin(u.wobblePhase+Math.PI)*0.06;
      h.position.y=FLOOR_Y+Math.abs(Math.sin(u.wobblePhase))*0.08;
      wheelTarget=1.2;
      if(u.stateTimer<=0){u.state='idle';u.stateTimer=rand(1,2);wheelTarget=0.3;}
      break;
    case 'tunnel':
      // face tunnel
      h.rotation.y=dampAngle(h.rotation.y,Math.atan2(TUNNEL_POS.z-h.position.z,TUNNEL_POS.x-h.position.x),4,dt);
      // peek: head bobs
      u.head.position.y=0.42+Math.sin(t*4)*0.04;
      // waddle in place
      u.wobblePhase+=dt*6;
      u.fL.position.y=0.12+Math.sin(u.wobblePhase)*0.04;
      u.fR.position.y=0.12+Math.sin(u.wobblePhase+Math.PI)*0.04;
      if(u.stateTimer<=0){u.state='idle';u.stateTimer=rand(1,2);u.head.position.y=0.42;}
      break;
    case 'hop':
      // little jump
      u.stateTimer-=dt;
      if(u.stateTimer<=0){u.state='idle';u.stateTimer=rand(0.5,1.5);}
      break;
  }

  // apply hop offset + squash to whole group
  h.position.y+=hopY;
  const s=1+ (squash-1)*0.5;
  h.scale.set(1/s, s, 1/s);

  // idle breathing
  if(u.state==='idle'){
    u.body.scale.y=0.95+Math.sin(t*2)*0.02;
  }
}

/* ---------- food UI ---------- */
let foodEaten=0;
function updateFoodUI(){
  document.getElementById('foodNum').textContent=foodEaten;
}
// periodically re-add seeds so bowl doesn't empty
setInterval(()=>{
  if(seedMeshes.length<14){
    const hidden=seedMeshes.find(s=>!s.visible);
    if(hidden){hidden.visible=true;foodLevel=Math.min(1,foodLevel+0.1);}
  }
},3000);

// count food eaten when a seed is consumed
const origFind=seedMeshes;
setInterval(()=>{
  // if any seed got hidden by eating, increment counter
  const visibleCount=seedMeshes.filter(s=>s.visible).length;
  if(visibleCount<foodEatenBaseline){
    // do nothing fancy
  }
},1000);
let foodEatenBaseline=12;
// hook: wrap addSeed consumption
const _origAdd=addSeed;
window._origAdd=addSeed;
// simpler: poll every 500ms
let lastVisible=seedMeshes.filter(s=>s.visible).length;
setInterval(()=>{
  const nowVisible=seedMeshes.filter(s=>s.visible).length;
  if(nowVisible<lastVisible){
    foodEaten+=(lastVisible-nowVisible);
    updateFoodUI();
  }
  lastVisible=nowVisible;
},500);

/* ---------- animation loop ---------- */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const sdt=dt*speedMult;

  // wheel spin
  wheelSpinSpeed+=(wheelTarget-wheelSpinSpeed)*Math.min(1,dt*2);
  wheelSpin.rotation.z+=wheelSpinSpeed*sdt;

  // hamsters
  if(!paused){
    for(const h of hamsters)updateHamster(h,sdt);
  }

  // particles drift
  const pos=pGeo.attributes.position.array;
  for(let i=0;i<pCount;i++){
    const v=pVel[i];
    pos[i*3]+=v.vx*sdt*10;
    pos[i*3+1]+=v.vy*sdt*10;
    pos[i*3+2]+=v.vz*sdt*10;
    if(pos[i*3+1]<0.6)pos[i*3+1]=3.6;
    if(pos[i*3+1]>3.6)pos[i*3+1]=0.6;
  }
  pGeo.attributes.position.needsUpdate=true;

  // bulb flicker
  bulbGlow.intensity=0.55+Math.sin(performance.now()/120)*0.05;

  controls.update();
  renderer.render(scene,camera);
}

/* ---------- resize ---------- */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ---------- start ---------- */
animate();
setTimeout(()=>document.getElementById('loader').classList.add('hidden'),700);
</script>
