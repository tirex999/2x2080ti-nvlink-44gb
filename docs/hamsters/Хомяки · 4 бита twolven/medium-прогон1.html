<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 16px; left: 20px; pointer-events: none;
    font-family: "Segoe UI", system-ui, sans-serif; color: #7a4f2a;
  }
  #ui h1 {
    margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .3px;
    text-shadow: 0 2px 0 rgba(255,255,255,.55);
  }
  #ui p { margin: 6px 0 0; font-size: 13.5px; opacity: .85; }
  #badge {
    position: fixed; right: 16px; bottom: 14px;
    font: 12px "Segoe UI", system-ui, sans-serif; color: #7a4f2a; opacity: .7;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>drag to orbit · scroll to zoom · one hamster is a wheel addict</p>
</div>
<div id="badge">three.js · low-poly · r160</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const rand = (a, b) => a + Math.random() * (b - a);
const GROUND = 0.1;                       // top of the bedding pad
const BOUNDS = { x: 6.1, z: 4.1 };               // walkable cage area

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe9cf);
scene.fog = new THREE.Fog(0xffe9cf, 30, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(11, 8, 13);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 6;
controls.maxDistance = 30;

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xfff4e6, 0xcbb8ff, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(9, 14, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;  sun.shadow.camera.bottom = -12;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 40;
scene.add(sun);

/* ---------- helpers ---------- */
function mat(c) {
  return new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.95 });
}

/* ---------- table, tray, bedding ---------- */
const table = new THREE.Mesh(new THREE.BoxGeometry(20, 0.9, 15), mat(0xb08968));
table.position.y = -1.05;
table.receiveShadow = true;
scene.add(table);

const tray = new THREE.Mesh(new THREE.BoxGeometry(14, 0.6, 10), mat(0x4ecdc4));
tray.position.y = -0.3;
tray.castShadow = true;
scene.add(tray);

const pad = new THREE.Mesh(new THREE.BoxGeometry(13.4, 0.1, 9.4), mat(0xf5deb3));
pad.position.y = GROUND - 0.05;
pad.receiveShadow = true;
scene.add(pad);

/* ---------- cage bars (back + both sides, front open) ---------- */
const barGeo = new THREE.CylinderGeometry(0.055, 0.055, 3.1, 6);
const barMat = mat(0xffffff);
function addBar(x, z) {
  const m = new THREE.Mesh(barGeo, barMat);
  m.position.set(x, GROUND + 1.55, z);
  m.castShadow = true;
  scene.add(m);
}
for (let x = -7; x <= 7; x += 1) addBar(x, -5);
for (let z = -5; z <= 5; z += 1.25) { addBar(-7, z); addBar(7, z); }

function addRail(len, x, z, ry) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, len, 6), barMat);
  m.rotation.z = Math.PI / 2;
  m.rotation.y = ry;
  m.position.set(x, GROUND + 3.05, z);
  scene.add(m);
}
addRail(14, 0, -5, 0);
addRail(10, -7, 0, Math.PI / 2);
addRail(10, 7, 0, Math.PI / 2);

/* ---------- exercise wheel (interactive object) ---------- */
const wx = -4.5, wz = 0;
const wheelG = new THREE.Group();
wheelG.position.set(wx, GROUND, wz);
scene.add(wheelG);

const standMat = mat(0x8d6e63);
const rimMat = mat(0x74c0fc);
for (const lx of [-0.55, 0.55]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.6, 0.14), standMat);
  leg.position.set(lx, 0.8, 0);
  leg.castShadow = true;
  wheelG.add(leg);
}
const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.2, 6), standMat);
axle.rotation.z = Math.PI / 2;
axle.position.y = 1.6;
wheelG.add(axle);

const spinGroup = new THREE.Group();
spinGroup.position.y = 1.6;
wheelG.add(spinGroup);

const rim = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.09, 6, 14), rimMat);
rim.castShadow = true;
spinGroup.add(rim);
const spokeGeo = new THREE.CylinderGeometry(0.035, 0.035, 2.2, 5);
for (let i = 0; i < 4; i++) {
  const s = new THREE.Mesh(spokeGeo, rimMat);
  s.rotation.z = i * Math.PI / 4;
  spinGroup.add(s);
}
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.22, 8), mat(0x5f3dc4));
hub.rotation.x = Math.PI / 2;
spinGroup.add(hub);

let wheelSpin = 0, wheelSpeed = 0.7;

/* ---------- tunnel (half-pipe) ---------- */
const tunGeo = new THREE.CylinderGeometry(0.7, 0.7, 3, 8, 1, true, 0, Math.PI);
const tun = new THREE.Mesh(tunGeo, new THREE.MeshStandardMaterial({
  color: 0xa29bfe, flatShading: true, roughness: 0.9, side: THREE.DoubleSide
}));
tun.rotation.x = Math.PI / 2;
tun.rotateY(-Math.PI / 2);          // arch on top, tunnel runs along Z
tun.position.set(3.1, GROUND, -2.5);
tun.castShadow = true;
scene.add(tun);

/* ---------- food bowl + pellets ---------- */
const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.38, 0.28, 8), mat(0xff9ff3));
bowl.position.set(4.3, GROUND + 0.14, 2.6);
bowl.castShadow = true;
scene.add(bowl);
const pelletGeo = new THREE.IcosahedronGeometry(0.07, 0);
for (let i = 0; i < 12; i++) {
  const p = new THREE.Mesh(pelletGeo, mat(i % 2 ? 0xb9770e : 0xd35400));
  p.position.set(4.3 + rand(-1.4, 1.4), GROUND + 0.07, 2.6 + rand(-1.4, 1.4));
  p.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3));
  p.castShadow = true;
  scene.add(p);
}

/* ---------- low-poly hamster builder ---------- */
function makeHamster(furHex) {
  const g = new THREE.Group();
  const fur = new THREE.Color(furHex);
  const cream = fur.clone().lerp(new THREE.Color(0xfff3d6), 0.55);
  const mFur = mat(fur.getHex());
  const mCream = mat(cream.getHex());
  const mDark = mat(0x3b2f2f);
  const mPink = mat(0xff8fa3);

  function add(geo, material, x, y, z, sx = 1, sy = 1, sz = 1) {
    const m = new THREE.Mesh(geo, material);
    m.position.set(x, y, z);
    m.scale.set(sx, sy, sz);
    m.castShadow = true;
    g.add(m);
    return m;
  }

  const bodyGeo = new THREE.SphereGeometry(0.5, 8, 6);
  add(bodyGeo, mFur, 0, 0.52, 0, 1, 0.82, 1.28);            // body
  add(bodyGeo, mCream, 0, 0.5, 0.12, 0.92, 0.7, 1.1);           // belly
  add(new THREE.SphereGeometry(0.4, 8, 6), mFur, 0, 0.62, 0.48);  // head
  add(new THREE.SphereGeometry(0.15, 6, 5), mFur, 0, 0.55, 0.85); // snout
  add(new THREE.SphereGeometry(0.06, 6, 5), mPink, 0, 0.58, 1.0);  // nose
  const eyeGeo = new THREE.SphereGeometry(0.06, 6, 5);
  add(eyeGeo, mDark, -0.17, 0.72, 0.8);
  add(eyeGeo, mDark, 0.17, 0.72, 0.8);
  const cheekGeo = new THREE.SphereGeometry(0.13, 6, 5);
  add(cheekGeo, mCream, -0.3, 0.5, 0.72);              // chubby cheeks
  add(cheekGeo, mCream, 0.3, 0.5, 0.72);
  const earGeo = new THREE.SphereGeometry(0.12, 6, 5);
  add(earGeo, mFur, -0.24, 0.98, 0.4);
  add(earGeo, mFur, 0.24, 0.98, 0.4);
  const footGeo = new THREE.BoxGeometry(0.13, 0.09, 0.2);
  add(footGeo, mFur, -0.2, 0.05, 0.35);
  add(footGeo, mFur, 0.2, 0.05, 0.35);
  add(footGeo, mFur, -0.2, 0.05, -0.35);
  add(footGeo, mFur, 0.2, 0.05, -0.35);
  add(new THREE.SphereGeometry(0.08, 6, 5), mFur, 0, 0.5, -0.72);  // tail
  return g;
}

/* ---------- hamster AI (wander / pause / wheel) ---------- */
const hamsters = [];
const wheelSpot = new THREE.Vector3(wx + 1.5, 0, wz);

function spawnHamster(x, z, furHex, opts = {}) {
  const g = makeHamster(furHex);
  g.position.set(x, GROUND, z);
  const h = {
    g,
    angle: rand(0, Math.PI * 2),
    state: 'pause',
    timer: rand(0.4, 1.5),
    target: new THREE.Vector3(),
    speed: rand(1.1, 1.7),
    phase: rand(0, 10),
    wheel: !!opts.wheel
  };
  g.rotation.y = h.angle;
  scene.add(g);
  hamsters.push(h);
  return h;
}

spawnHamster(0.5, 0.5, 0xffb17a);
spawnHamster(-1.6, -1.0, 0xf9e0b7, { wheel: true });   // the wheel addict
spawnHamster(2.8, 1.6, 0xe58e66);
spawnHamster(-2.2, 2.2, 0xdfe4ea);

function updateHamsters(dt, t) {
  let anyAtWheel = false;

  for (const h of hamsters) {
    const p = h.g.position;

    if (h.state === 'pause') {
      h.timer -= dt;
      if (h.timer <= 0) {
        if (h.wheel && Math.random() < 0.55) h.target.copy(wheelSpot);
        else h.target.set(rand(-5.6, 5.6), 0, rand(-3.6, 3.6));
        h.state = 'walk';
      }
    } else if (h.state === 'walk') {
      const dx = h.target.x - p.x, dz = h.target.z - p.z;
      const dist = Math.hypot(dx, dz);
      if (dist < 0.55) {
        if (h.wheel && h.target === wheelSpot) { h.state = 'atWheel'; h.timer = rand(4, 8); }
        else { h.state = 'pause'; h.timer = rand(1, 3); }
      } else {
        const ta = Math.atan2(dx, dz);
        let da = ta - h.angle;
        while (da > Math.PI) da -= Math.PI * 2;
        while (da < -Math.PI) da += Math.PI * 2;
        h.angle += da * Math.min(1, dt * 6);
        p.x += Math.sin(h.angle) * h.speed * dt;
        p.z += Math.cos(h.angle) * h.speed * dt;
      }
    } else if (h.state === 'atWheel') {
      anyAtWheel = true;
      h.timer -= dt;
      const ta = Math.atan2(wx - p.x, wz - p.z);
      let da = ta - h.angle;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      h.angle += da * Math.min(1, dt * 4);
      p.x = wheelSpot.x + Math.sin(t * 3 + h.phase) * 0.15;   // scurry in place
      p.z = wheelSpot.z + Math.cos(t * 2.2 + h.phase) * 0.15;
      if (h.timer <= 0) {
        h.state = 'walk';
        h.target.set(rand(-5.6, 5.6), 0, rand(-3.6, 3.6));
      }
    }

    p.x = THREE.MathUtils.clamp(p.x, -BOUNDS.x, BOUNDS.x);
    p.z = THREE.MathUtils.clamp(p.z, -BOUNDS.z, BOUNDS.z);
    const moving = h.state !== 'pause';
    p.y = GROUND + (moving ? 0.035 * Math.abs(Math.sin(t * 11 + h.phase)) : 0);
    h.g.rotation.y = h.angle;
  }

  const target = anyAtWheel ? 5.5 : 0.7;
  wheelSpeed += (target - wheelSpeed) * Math.min(1, dt * 1.5);
  wheelSpin += wheelSpeed * dt;
  spinGroup.rotation.z = wheelSpin;
}

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  updateHamsters(dt, t);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
