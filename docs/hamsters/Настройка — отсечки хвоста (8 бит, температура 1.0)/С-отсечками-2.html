<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #ffe9d6; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 16px; left: 16px; pointer-events: none;
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    color: #6b4226; text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  #ui h1 { font-size: 22px; margin: 0 0 4px 0; }
  #ui p  { font-size: 13px; margin: 0; opacity: .8; }
</style>
</head>
<body>
<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &bull; Scroll to zoom &bull; Click a hamster to make it do a happy hop!</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
// ============================================================
//  LOW-POLY HAMSTER PLAYGROUND  —  single file, Three.js r128
// ============================================================

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe9d6);
scene.fog = new THREE.Fog(0xffe9d6, 22, 40);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);

// ---------- Simple custom orbit controls (no extra deps) ----------
const orbit = {
  target: new THREE.Vector3(0, 1.1, 0),
  theta: Math.PI * 0.25, phi: Math.PI * 0.34, radius: 12,
  dragging: false, px: 0, py: 0
};
function updateCamera() {
  const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
  camera.position.set(
    orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
    orbit.target.y + orbit.radius * cp,
    orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
  );
  camera.lookAt(orbit.target);
}
renderer.domElement.addEventListener('mousedown', e => { orbit.dragging = true; orbit.px = e.clientX; orbit.py = e.clientY; });
addEventListener('mouseup', () => orbit.dragging = false);
addEventListener('mousemove', e => {
  if (!orbit.dragging) return;
  orbit.theta -= (e.clientX - orbit.px) * 0.005;
  orbit.phi   -= (e.clientY - orbit.py) * 0.005;
  orbit.phi = Math.max(0.15, Math.min(1.35, orbit.phi));
  orbit.px = e.clientX; orbit.py = e.clientY;
});
addEventListener('wheel', e => {
  orbit.radius = Math.max(5, Math.min(22, orbit.radius + e.deltaY * 0.01));
}, { passive: true });
// basic touch support
renderer.domElement.addEventListener('touchstart', e => { orbit.dragging = true; orbit.px = e.touches[0].clientX; orbit.py = e.touches[0].clientY; }, { passive: true });
renderer.domElement.addEventListener('touchmove', e => {
  if (!orbit.dragging) return;
  orbit.theta -= (e.touches[0].clientX - orbit.px) * 0.005;
  orbit.phi   -= (e.touches[0].clientY - orbit.py) * 0.005;
  orbit.phi = Math.max(0.15, Math.min(1.35, orbit.phi));
  orbit.px = e.touches[0].clientX; orbit.py = e.touches[0].clientY;
}, { passive: true });
addEventListener('touchend', () => orbit.dragging = false);
updateCamera();

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xfff3e0, 0xb0886a, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(6, 10, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;   sun.shadow.camera.bottom = -8;
scene.add(sun);

// ---------- Helpers ----------
function mat(color, opts = {}) {
  return new THREE.MeshLambertMaterial({ color, flatShading: true, ...opts });
}
function mesh(geo, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  return m;
}

// ============================================================
//  THE CAGE
// ============================================================
const W = 5, D = 3.5;             // interior half-sizes
const TRAY_H = 0.5;

// room ground (outside the tray)
const ground = mesh(new THREE.BoxGeometry(30, 0.4, 30), mat(0xe8c9a0), 0, -0.2, 0);
ground.receiveShadow = true;
scene.add(ground);

// tray (plastic base)
const tray = mesh(new THREE.BoxGeometry(W * 2 + 0.5, TRAY_H, D * 2 + 0.5), mat(0x7ec8e3), 0, TRAY_H / 2 - 0.4, 0);
tray.receiveShadow = true;
scene.add(tray);

// bedding surface
const bed = mesh(new THREE.BoxGeometry(W * 2, 0.18, D * 2), mat(0xf5deb3), 0, TRAY_H - 0.38 + 0.09, 0);
bed.receiveShadow = true;
scene.add(bed);

// scattered bedding chunks (cute + low poly)
const chipColors = [0xfadfb9, 0xe6ccb2, 0xfff1c9, 0xdcc49e];
for (let i = 0; i < 40; i++) {
  const s = 0.12 + Math.random() * 0.12;
  const c = chipColors[i % chipColors.length];
  const chip = mesh(new THREE.BoxGeometry(s, s * 0.6, s * 0.8), mat(c),
    (Math.random() - 0.5) * W * 1.9, TRAY_H - 0.38 + s * 0.3,
    (Math.random() - 0.5) * D * 1.9);
  chip.rotation.y = Math.random() * Math.PI;
  scene.add(chip);
}

// glass walls (front two are faint, back two get a bar grid)
const glassMat = new THREE.MeshLambertMaterial({
  color: 0xffffff, transparent: true, opacity: 0.14,
  side: THREE.DoubleSide, depthWrite: false
});
function glassWall(x, z, ry) {
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(W * 2, 2.4), glassMat);
  wall.position.set(x, TRAY_H - 0.38 + 1.2, z);
  wall.rotation.y = ry;
  scene.add(wall);
}
glassWall(0, -D, 0);               // back
glassWall(-W, 0, Math.PI / 2);     // left
glassWall(W, 0, -Math.PI / 2);     // right
glassWall(0, D, Math.PI);          // front

// cage frame
const frameMat = mat(0xf7f7f7);
const H_WALL = 2.4, FRAME_Y0 = TRAY_H - 0.38;
function bar(len, x, y, z, axis) {
  let g;
  if (axis === 'x') g = new THREE.CylinderGeometry(0.045, 0.045, len, 6);
  else              g = new THREE.CylinderGeometry(0.045, 0.045, len, 6);
  const b = mesh(g, frameMat, x, y, z);
  if (axis === 'y') b.rotation.x = Math.PI / 2;
  else if (axis === 'z') b.rotation.z = Math.PI / 2;
  scene.add(b);
}
[[0, -D, 'x'], [0, D, 'x'], [-W, 0, 'z'], [W, 0, 'z']].forEach(([x, z, ax]) => {
  bar(ax === 'x' ? W * 2 : D * 2, x, FRAME_Y0 + H_WALL, z, ax);      // top rail
  bar(ax === 'x' ? W * 2 : D * 2, x, FRAME_Y0,        z, ax);        // bottom rail
});
// vertical corners + wire bars on the two back walls
for (let i = 0; i <= 4; i++) {
  const x = -W + (W * 2) * i / 4;
  bar(H_WALL, x, FRAME_Y0 + H_WALL / 2, -D, 'y');                    // back wall bars
  bar(0.001, x, FRAME_Y0 + H_WALL / 2, -D, 'y'); // (tiny filler keeps spacing clean)
  bar(H_WALL, -W, FRAME_Y0 + H_WALL / 2, -D + (D * 2) * i / 4, 'y'); // left wall bars
}

// ============================================================
//  PLAY OBJECTS: wheel, food bowl, tunnel
// ============================================================

// --- Exercise wheel (the star object) ---
const wheel = { group: null, spinner: null, vel: 0 };
wheel.group = new THREE.Group();
wheel.group.position.set(-W + 0.7, TRAY_H - 0.38, -D + 0.9);
wheel.spinner = new THREE.Group();
const rimGeo = new THREE.TorusGeometry(0.75, 0.07, 6, 18);
wheel.spinner.add(mesh(rimGeo, mat(0xff8fab)));
for (let i = 0; i < 4; i++) {
  const spoke = mesh(new THREE.BoxGeometry(1.46, 0.07, 0.07), mat(0xffc2d1));
  spoke.rotation.z = i * Math.PI / 4;
  wheel.spinner.add(spoke);
}
wheel.spinner.add(mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.16, 6).rotateX(Math.PI / 2), mat(0x8d5524)));
wheel.group.rotation.y = Math.PI / 2;   // wheel faces inward (+x)
wheel.group.add(wheel.spinner);
wheel.spinner.position.y = 0.8;
scene.add(wheel.group);

// --- Food bowl with pellets ---
const bowl = { group: null, pellets: [], eaten: 0 };
bowl.group = new THREE.Group();
bowl.group.position.set(W - 0.9, TRAY_H - 0.38, -D + 1.0);
bowl.group.add(mesh(new THREE.CylinderGeometry(0.42, 0.3, 0.2, 8), mat(0x9d4edd), 0, 0.1, 0));
bowl.group.add(mesh(new THREE.CylinderGeometry(0.34, 0.24, 0.05, 8), mat(0x5e548e), 0, 0.19, 0));
for (let i = 0; i < 7; i++) {
  const a = (i / 7) * Math.PI * 2;
  const p = mesh(new THREE.SphereGeometry(0.055, 5, 4), mat(0xe07a3f),
    Math.cos(a) * 0.18, 0.23, Math.sin(a) * 0.18);
  bowl.pellets.push(p);
  bowl.group.add(p);
}
scene.add(bowl.group);

// --- Wooden tunnel arch ---
const tunnelGroup = new THREE.Group();
tunnelGroup.position.set(0.6, TRAY_H - 0.38, 0.8);
const tube = new THREE.CylinderGeometry(0.45, 0.45, 1.6, 10, 1, true, 0, Math.PI);
const tunnelMesh = new THREE.Mesh(tube, new THREE.MeshLambertMaterial({
  color: 0xd4a373, side: THREE.DoubleSide, flatShading: true
}));
tunnelMesh.rotation.z = Math.PI / 2;
tunnelMesh.rotation.x = 0; // arch opening faces ±x
tunnelMesh.castShadow = true;
tunnelGroup.add(tunnelMesh);
// little door trims
[-0.8, 0.8].forEach(x => {
  const trim = mesh(new THREE.BoxGeometry(0.1, 0.08, 1.0), mat(0xbc8a5f), x, 0.42, 0);
  tunnelGroup.add(trim);
});
scene.add(tunnelGroup);

// ---------- Object registry (where a hamster should stand) ----------
const objects = [
  { name: 'wheel',  spot: new THREE.Vector3(-W + 1.35, 0, -D + 0.9), dur: [3, 6] },
  { name: 'bowl',   spot: new THREE.Vector3(W - 1.45, 0, -D + 1.0),  dur: [3, 7] },
  { name: 'tunnel', spot: new THREE.Vector3(1.7,  0, 0.8),           dur: [2, 4] },
];

// ============================================================
//  LOW-POLY HAMSTERS
// ============================================================
function makeHamster(bodyColor, bellyColor) {
  const g = new THREE.Group();
  const bodyM = mat(bodyColor);
  const bellyM = mat(bellyColor);
  const dark = mat(0x2b2118);
  const pink = mat(0xff6f91);

  // squishy body
  const body = mesh(new THREE.SphereGeometry(0.32, 9, 7), bodyM, 0, 0.34, 0);
  body.scale.set(1.25, 0.95, 1.05);
  body.name = 'body';
  g.add(body);
  // belly patch
  const belly = mesh(new THREE.SphereGeometry(0.26, 8, 6), bellyM, 0, 0.3, 0.05);
  belly.scale.set(1.0, 0.85, 0.85);
  g.add(belly);
  // ears
  g.add(mesh(new THREE.SphereGeometry(0.09, 6, 4), bodyM, -0.14, 0.58, -0.06));
  g.add(mesh(new THREE.SphereGeometry(0.09, 6, 4), bodyM,  0.14, 0.58, -0.06));
  g.add(mesh(new THREE.SphereGeometry(0.05, 5, 3), pink,  -0.14, 0.585, -0.02));
  g.add(mesh(new THREE.SphereGeometry(0.05, 5, 3), pink,   0.14, 0.585, -0.02));
  // face (faces +z)
  g.add(mesh(new THREE.SphereGeometry(0.035, 5, 4), dark, -0.085, 0.40, 0.315));
  g.add(mesh(new THREE.SphereGeometry(0.035, 5, 4), dark,  0.085, 0.40, 0.315));
  g.add(mesh(new THREE.SphereGeometry(0.04, 5, 4), pink,  0, 0.33, 0.335));
  // tiny stubby tail
  g.add(mesh(new THREE.SphereGeometry(0.05, 5, 4), bodyM, 0, 0.3, -0.33));
  // feet (animated)
  const feet = [];
  [[-0.16, 0.18], [0.16, 0.18], [-0.16, -0.18], [0.16, -0.18]].forEach(([fx, fz], i) => {
    const foot = mesh(new THREE.BoxGeometry(0.09, 0.07, 0.13), dark, fx, 0.06, fz);
    foot.userData.phase = i % 2 ? 0 : Math.PI;
    g.add(foot);
    feet.push(foot);
  });

  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { group: g, body, feet };
}

const palette = [
  [0xf2c48d, 0xfff4e0],  // classic gold
  [0xc9a227, 0xfff0c2],  // golden
  [0xd9d9e3, 0xffffff],  // syrian white
  [0xb5838d, 0xffe3e3],  // pinky fawn
];

const hamsters = [];
const startSpots = [[2, -1.5], [-1, 2], [1, 0.5], [-2, -0.5]];
for (let i = 0; i < 4; i++) {
  const h = makeHamster(palette[i][0], palette[i][1]);
  h.group.position.set(startSpots[i][0], TRAY_H - 0.38, startSpots[i][1]);
  h.group.rotation.y = Math.random() * Math.PI * 2;
  scene.add(h.group);
  hamsters.push({
    ...h,
    pos: h.group.position,
    rot: h.group.rotation.y,
    state: 'wander',
    timer: 1 + Math.random() * 3,
    target: new THREE.Vector3(),
    obj: null,
    speed: 1.1 + Math.random() * 0.7,
    walkPhase: Math.random() * 10,
    moving: false,
    eatTimer: 0,
    hop: 0,   // for the click-happy-hop
  });
  h.state = 'pause';
  h.timer = 0.5 + i * 0.4;  // stagger so they don't all decide at once
}

// ---------- Tiny AI helpers ----------
function randTarget(h) {
  h.target.set(
    (Math.random() - 0.5) * (W * 2 - 1.4),
    0,
    (Math.random() - 0.5) * (D * 2 - 1.4)
  );
}
function distTo(h, v) { return Math.hypot(h.pos.x - v.x, h.pos.z - v.z); }
function lerpAngle(a, b, t) {
  let d = (b - a + Math.PI * 3) % (Math.PI * 2) - Math.PI;
  return a + d * t;
}

function updateHamster(h, dt, time) {
  // ---- state machine ----
  h.timer -= dt;

  if (h.state === 'wander') {
    if (distTo(h, h.target) < 0.25 || h.timer < 0) {
      if (Math.random() < 0.35) {
        h.obj = objects[Math.floor(Math.random() * objects.length)];
        h.target.copy(h.obj.spot);
        h.state = 'goto';
      } else {
        randTarget(h);
        h.state = 'pause';
        h.timer = 0.6 + Math.random() * 2.2;
      }
    }
  } else if (h.state === 'pause') {
    if (h.timer <= 0) {
      if (Math.random() < 0.3) {
        h.obj = objects[Math.floor(Math.random() * objects.length)];
        h.target.copy(h.obj.spot);
        h.state = 'goto';
      } else {
        randTarget(h);
        h.state = 'wander';
        h.timer = 10;
      }
    }
  } else if (h.state === 'goto') {
    if (distTo(h, h.target) < 0.3) {
      h.state = 'interact';
      h.timer = h.obj.dur[0] + Math.random() * (h.obj.dur[1] - h.obj.dur[0]);
      h.eatTimer = 0;
    }
  } else if (h.state === 'interact') {
    if (h.timer <= 0) {
      h.state = 'wander';
      randTarget(h);
      h.timer = 10;
    }
  }

  // ---- movement ----
  const wantsToMove = (h.state === 'wander' || h.state === 'goto') && h.state !== 'pause';
  let dx = 0, dz = 0;
  if (wantsToMove) {
    dx = h.target.x - h.pos.x;
    dz = h.target.z - h.pos.z;
    const len = Math.hypot(dx, dz);
    if (len > 0.05) {
      const step = Math.min(h.speed * dt, len);
      h.pos.x += (dx / len) * step;
      h.pos.z += (dz / len) * step;
      h.moving = true;
      h.rot = lerpAngle(h.rot, Math.atan2(dx, dz), 1 - Math.pow(0.001, dt));
    } else h.moving = false;
  } else {
    h.moving = false;
  }
  // stay inside the tray
  h.pos.x = Math.max(-(W - 0.55), Math.min(W - 0.55, h.pos.x));
  h.pos.z = Math.max(-(D - 0.55), Math.min(D - 0.55, h.pos.z));
  h.group.rotation.y = h.rot;

  // ---- per-state body animation ----
  const baseY = TRAY_H - 0.38;
  if (h.moving) {
    h.walkPhase += dt * 9 * (h.speed / 1.3);
    h.group.position.y = baseY + Math.abs(Math.sin(h.walkPhase)) * 0.035;
  } else {
    h.group.position.y = baseY;
  }

  if (h.state === 'interact' && h.obj) {
    // face the object
    const ox = h.obj.spot.x - h.pos.x, oz = h.obj.spot.z - h.pos.z;
    h.rot = lerpAngle(h.rot, Math.atan2(ox, oz), 1 - Math.pow(0.001, dt));
    h.group.rotation.y = h.rot;

    if (h.obj.name === 'wheel') {
      // run in place: fast foot scurry + the wheel actually spins
      h.walkPhase += dt * 16;
      h.group.position.y = baseY + Math.abs(Math.sin(h.walkPhase)) * 0.03;
      wheel.vel = Math.min(wheel.vel + dt * 5, 9);
    } else if (h.obj.name === 'bowl') {
      // nom nom: bob downward toward the bowl, pellets disappear
      const nod = (Math.sin(time * 7) + 1) / 2;
      h.group.rotation.x = nod * 0.35;
      h.eatTimer += dt;
      if (h.eatTimer > 0.7 && bowl.pellets.length) {
        h.eatTimer = 0;
        const p = bowl.pellets.pop();
        p.visible = false;
        bowl.eaten++;
        if (bowl.eaten >= 7) {  // bowl magically refills after a moment
          setTimeout(() => {
            bowl.pellets.forEach(p => p.visible = true);
            bowl.pellets = [...bowl.pellets];
            bowl.eaten = 0;
          }, 4000);
          bowl.pellets = [];
        }
      }
    } else if (h.obj.name === 'tunnel') {
      // shy peek: wiggle sideways
      h.group.position.x += Math.sin(time * 10) * dt * 0.15;
      h.group.position.y = baseY + Math.abs(Math.sin(time * 5)) * 0.05;
    }
  } else {
    h.group.rotation.x *= (1 - Math.min(1, dt * 6)); // smooth nod back up
  }

  // click-happy-hop
  if (h.hop > 0) {
    h.hop -= dt;
    const t = 1 - Math.max(0, h.hop / 0.6);
    h.group.position.y = baseY + Math.sin(t * Math.PI) * 0.45;
    h.body.scale.y = 0.95 + Math.sin(t * Math.PI) * 0.15;
    h.body.scale.x = 1.25 * (1 - Math.sin(t * Math.PI) * 0.08);
  } else {
    h.body.scale.y += (0.95 - h.body.scale.y) * Math.min(1, dt * 8);
    h.body.scale.x += (1.25 - h.body.scale.x) * Math.min(1, dt * 8);
  }

  // feet scuttle while moving (slow idle shuffle otherwise)
  const amp = h.moving ? 0.55 : (h.state === 'interact' && h.obj && h.obj.name === 'wheel' ? 0.65 : 0.08);
  h.feet.forEach(f => {
    f.rotation.x = Math.sin(h.walkPhase + f.userData.phase) * amp;
  });
}

// ---------- Raycasting: click a hamster = happy hop ----------
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
renderer.domElement.addEventListener('click', e => {
  mouseNDC.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouseNDC, camera);
  const targets = [];
  hamsters.forEach(h => h.group.traverse(o => { if (o.isMesh) targets.push(o); }));
  const hits = raycaster.intersectObjects(targets);
  if (hits.length) {
    const hitGroup = hits[0].object.parent;
    const h = hamsters.find(hh => hh.group === hitGroup);
    if (h) { h.hop = 0.6; h.state = 'pause'; h.timer = 0.8; }
  }
});

// ============================================================
//  MAIN LOOP
// ============================================================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  hamsters.forEach(h => updateHamster(h, dt, time));

  // wheel spin decays when nobody is running
  wheel.spinner.rotation.z += wheel.vel * dt;
  wheel.vel *= Math.pow(0.55, dt);
  if (wheel.vel < 0.02) wheel.vel = 0;

  updateCamera();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
