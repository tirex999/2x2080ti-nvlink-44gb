/* ============================================================
   1. BASE SETUP
============================================================ */

const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe7ff);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);

/* ============================================================
   2. SANDBOX CAGE + ENVIRONMENT
============================================================ */
const B_R = 5;                 // cage radius
const M = {};                  // shared MeshStandardMaterials
['wood','innerWood'].forEach(k => {});
M.wood        = new THREE.MeshStandardMaterial({color:0xd8a659, flatShading:true});
M.innerWood   = new THREE.MeshStandardMaterial({color:0xeec188, flatShading:true});
M.sand        = new THREE.MeshStandardMaterial({color:0xf6d78f, flatShading:true});
M.metal       = new THREE.MeshStandardMaterial({color:0xeef2f7, metalness:0.35, roughness:0.35, flatShading:true});

const cage = new THREE.Group();
scene.add(cage);

function xMesh(geo, mat, shadow=false){
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = shadow; m.receiveShadow = shadow;
  return m;
}
// Outer wooden base ring
const base = xMesh(new THREE.CylinderGeometry(B_R+0.35, B_R+0.5, 0.5, 24, 1), M.wood, true);
base.position.y = 0.25; cage.add(base);
// Inner wooden floor rim
const rim = xMesh(new THREE.TorusGeometry(B_R+0.02, 0.18, 8, 32), M.wood, true);
rim.rotation.x = Math.PI/2; rim.position.y = 0.32; cage.add(rim);
// Sand bed
const bed = new THREE.Mesh(new THREE.CircleGeometry(B_R-0.05, 32), M.sand);
bed.rotation.x = -Math.PI/2; bed.position.y = 0.56; bed.receiveShadow = true; cage.add(bed);

// Bars + rails
const BAR_N = 18, BAR_TOP = 4.3, BAR_H = 1.5;
const barGeo = new THREE.CylinderGeometry(0.035, 0.035, BAR_H, 5);
for (let i=0;i<BAR_N;i++){
  const a = i/BAR_N * Math.PI*2;
  const b = new THREE.Mesh(barGeo, M.metal);
  b.position.set(Math.cos(a)*B_R, BAR_TOP-BAR_H/2, Math.sin(a)*B_R);
  cage.add(b);
}
function rail(y, th, mat){
  const t = new THREE.Mesh(new THREE.TorusGeometry(B_R, th, 6, 40), mat);
  t.rotation.x = Math.PI/2; t.position.y = y; cage.add(t);
}
rail(BAR_TOP-0.05, 0.09, M.wood);      // top rail
rail(BAR_TOP-0.9,  0.03, M.metal);     // mid rail
rail(0.75, 0.04, M.metal);             // low rail

const wheelPos = new THREE.Vector3(3.4, 0.55, 0);
wheelPos.clampLength(0, B_R-2.2);
const wheelGroup = new THREE.Group();
wheelGroup.position.copy(wheelPos);

const spin = new THREE.Group();          // this rotates
wheelGroup.add(spin);

const coralMat = new THREE.MeshStandardMaterial({color:0xff8057, flatShading:true});

for (let i=0;i<6;i++){
  const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03, WHEEL_R*2,4), M.metal);
  sp.rotation.x = i*Math.PI/6;
  spin.add(sp);
}
spin.add(xMesh(new THREE.SphereGeometry(0.11,6,5), coralMat));

let tunnelBusies = [];

function tunnelEnter(){ tunnelBusies.push(performance.now()/1000); tunnelMat.color.setHex(tunnelActive); }
function tunnelLeaveAllDone(){ tunnelTimers.shift(); tunnelBusies = tunnelBusies.filter(()=>true);
  if (tunnelBusies.length===0) tunnelMat.color.setHex(tunnelInactive); }
setInterval(()=>{ tunnelBusies = tunnelBusies.filter((_,i)=> true); }, 60000);
// simpler cleanup: recompute active state per frame below
function tunnelRefresh(){
  if (busiesNow === 0) tunnelMat.color.setHex(tunnelInactive); else tunnelMat.color.setHex(tunnelActive);
}

// --- Food bowl with sunflower seeds --------------------------
const bowlPos = new THREE.Vector3(-2.5, 0.58, 2.4);
bowlPos.clampLength(0, B_R-2.0);
const bowl = new THREE.Group();
const bowlBody = xMesh(new THREE.CylinderGeometry(0.52,0.32,0.32,10,1,false),

/* ============================================================
   4. HAMSTER FACTORY
============================================================ */
const PALETTE = [0xfff1d0, 0xffdf6b, 0xffb07a, 0xf2ede7, 0xa8c8ff, 0xff9ebb];
const FLAT = c => new THREE.MeshStandardMaterial({color:c, flatShading:true});
const earMat  = FLAT(0xff9db8);
const eyeMat  = new THREE.MeshStandardMaterial({color:0x2b2b33, roughness:0.4});
const noseMat = FLAT(0xff6b81);
const darkNose= FLAT(0x556270);

function makeHamster(fur){
  const g = new THREE.Group();
  const furMat = FLAT(fur);
  const blackFur = fur >= 0x999999 && fur !== 0xf2ede7 && fur !== 0xffdf6b;
  const body = xMesh(new THREE.SphereGeometry(0.42,7,6), furMat, true);
  body.scale.set(1,0.85,1.15); body.position.y = 0.4; g.add(body);
  const head = new THREE.Group();
  head.position.set(0, 0.52, 0.34); g.add(head);
  const hs = xMesh(new THREE.SphereGeometry(0.3,7,6), furMat, true);
  hs.scale.set(1,0.9,0.9); head.add(hs);
  const earG = new THREE.SphereGeometry(0.1,5,4);
  [-1,1].forEach(s=>{
    const e = xMesh(earG, earMat); e.position.set(0.17*s,0.24,-0.05); head.add(e);
  });
  const eyeG = new THREE.SphereGeometry(0.045,5,4);
  [-1,1].forEach(s=>{
    const e = new THREE.Mesh(eyeG, eyeMat); e.position.set(0.13*s,0.05,0.25); head.add(e);
  });
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.05,5,4), blackFur?darkNose:noseMat);
  mouth.position.set(0,-0.06,0.29); head.add(mouth);
  const cheekG = new THREE.SphereGeometry(0.17,6,5);
  const cheeks=[]; 
  [-1,1].forEach(s=>{
    const c = xMesh(cheekG, FLAT(0xff9db8)); c.position.set(0.16*s,-0.06,0.2); c.scale.setScalar(0);
    head.add(c); cheeks.push(c);
  });
  const tail = xMesh(new THREE.ConeGeometry(0.09,0.2,5), furMat);
  tail.rotation.z = Math.PI/2; tail.rotation.x = 0.4;
  tail.position.set(0,0.3,-0.46); g.add(tail);
  const footMat = FLAT(0xffb3c1);
  const footG = new THREE.SphereGeometry(0.09,5,4);
  const feet=[];
  [[-0.17,0.28],[0.17,0.28],[-0.17,-0.28],[0.17,-0.28]].forEach(p=>{
    const f = xMesh(footG, footMat); f.position.set(p[0],0.1,p[1]); g.add(f); feet.push(f);
  });
  return {group:g, body, head, cheeks, feet,
          anchor:new THREE.Object3D()};
}

function emojiTexture(em){
  if (LAST[em]) return LAST[em];
  const cv=document.createElement('canvas'); cv.width=cv.height=128;
  const ctx=cv.getContext('2d'); ctx.font='96px serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(em,64,72);
  const tx=new THREE.CanvasTexture(cv); return LAST[em]=tx;
}
const sparkles=[];
function spawnSparkle(pos,em,vel){
  const mat=new THREE.SpriteMaterial({map:emojiTexture(em),transparent:true,depthTest:false});
  const sp=new THREE.Sprite(mat); sp.renderOrder=10;
  sp.position.copy(pos); sp.scale.setScalar(0.55);
  sp.userData={t:0, vel: vel||new THREE.Vector3((Math.random()-0.5)*0.6, 0.9+Math.random()*0.5,(Math.random()-0.5)*0.6)};
  scene.add(sp); sparkles.push(sp);
}
function updateSparkles(dt){
  for (let i=sparkles.length-1;i>=0;i--){
    const s=sparkles[i]; s.userData.t+=dt;
    s.position.addScaledVector(s.userData.vel,dt);
    const sc=0.55+Math.sin(s.userData.t*20)*0.04; s.scale.setScalar(sc);
    if (s.userData.t>1.1){ s.material.opacity=1-(s.userData.t-0.7)/(0.4); }
    if (s.userData.t>1.15){ scene.remove(s); sparkles.splice(i,1); }
  }
}

  const tx=new THREE.CanvasTexture(cv);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true}));
  spr.scale.set(1.7,0.6,1); spr.position.y=1.25;
  return spr;
}
