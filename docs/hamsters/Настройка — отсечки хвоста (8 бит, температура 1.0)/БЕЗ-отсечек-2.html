<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #aee3ff; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 16px; left: 16px;
    font-family: 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif;
    color: #4a3728; pointer-events: none; user-select: none;
  }
  #ui h1 { margin: 0; font-size: 22px; text-shadow: 0 2px 0 rgba(255,255,255,.6); }
  #ui p  { margin: 4px 0 0; font-size: 13px; opacity: .75; }
</style>
</head>
<body>
<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to orbit &nbsp;•&nbsp; scroll to zoom — drop by the wheel!</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------- setup */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaee3ff);
scene.fog = new THREE.Fog(0xaee3ff, 22, 45);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9, 7, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI * 0.49;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* lights */
scene.add(new THREE.HemisphereLight(0xfff4d6, 0x8fb98f, 0.9));
const sun = new THREE.DirectionalLight(0xfff2cc, 1.4);
sun.position.set(8, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;   sun.shadow.camera.bottom = -10;
scene.add(sun);

/* helpers */
const mat = (color, opts = {}) =>
  new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.9, ...opts });
const mesh = (geo, material, x = 0, y = 0, z = 0) => {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  return m;
};
const rand = (a, b) => a + Math.random() * (b - a);

/* ------------------------------------------------------------- outdoor */

const ground = mesh(
  new THREE.CircleGeometry(30, 24), mat(0x8fd67e), 0, -0.01, 0);
ground.rotation.x = -Math.PI / 2;
ground.castShadow = false;
scene.add(ground);

// silly grass tufts
for (let i = 0; i < 24; i++) {
  const g = new THREE.IcosahedronGeometry(rand(0.12, 0.28), 0);
  const tuft = mesh(g, mat(0x5cb85c));
  const a = rand(0, Math.PI * 2), r = rand(7, 24);
  tuft.position.set(Math.cos(a) * r, 0.06, Math.sin(a) * r);
  tuft.scale.y = 0.6;
  scene.add(tuft);
}

// lazy drifting clouds
const clouds = [];
for (let i = 0; i < 3; i++) {
  const c = new THREE.Group();
  for (let j = 0; j < 3; j++) {
    const p = mesh(new THREE.SphereGeometry(rand(0.5, 0.8), 5, 4),
      mat(0xffffff, { flatShading: true }), j * 0.7 - 0.7, rand(-0.1, 0.1), rand(-0.2, 0.2));
    p.scale.set(1.3, 0.7, 1);
    p.castShadow = false;
    c.add(p);
  }
  c.position.set(rand(-14, 14), rand(9, 13), rand(-14, -6));
  c.userData.speed = rand(0.15, 0.4);
  scene.add(c);
  clouds.push(c);
}

/* --------------------------------------------------------------- cage */

const TRAY_W = 8, TRAY_D = 6, SAND_TOP = 1.0;
scene.add(mesh(new THREE.BoxGeometry(TRAY_W + 0.5, 0.9, TRAY_D + 0.5),
  mat(0xb07b4f), 0, 0.35, 0));                          // wooden base
scene.add(mesh(new THREE.BoxGeometry(TRAY_W, 0.5, TRAY_D),
  mat(0xefdcae), 0, SAND_TOP - 0.25, 0));               // sand

function bar(x, z, rotY) {
  const b = mesh(new THREE.BoxGeometry(0.06, 2.0, 0.06),
    new THREE.MeshStandardMaterial({
      color: 0xf5f5f5, flatShading: true, transparent: true,
      opacity: 0.35, roughness: 0.4, depthWrite: false }));
  b.position.set(x, SAND_TOP + 0.95, z);
  b.rotation.y = rotY;
  return b;
}
const cage = new THREE.Group();
const HX = TRAY_W / 2 + 0.24, HZ = TRAY_D / 2 + 0.24;
for (let i = 0; i <= 9; i++) {
  const x = -HX + (i / 9) * (2 * HX);
  cage.add(bar(x,  HZ, 0), bar(x, -HZ, 0));
}
for (let i = 0; i <= 6; i++) {
  const z = -HZ + (i / 6) * (2 * HZ);
  cage.add(bar( HX, z, Math.PI / 2), bar(-HX, z, Math.PI / 2));
}
scene.add(cage);

/* breadcrumbs on the sand */
for (let i = 0; i < 14; i++) {
  const c = mesh(new THREE.IcosahedronGeometry(rand(0.05, 0.09), 0),
    mat([0xd98f4e, 0xc96f3a, 0xe8c07a][i % 3]));
  c.position.set(rand(-TRAY_W / 2 + 0.4, TRAY_W / 2 - 0.4), SAND_TOP + 0.03,
                 rand(-TRAY_D / 2 + 0.4, TRAY_D / 2 - 0.4));
  scene.add(c);
}

/* the hamster wheel */

const wheel = { spin: new THREE.Group(), angle: 0 };
{
  const wx = 3.0, wy = SAND_TOP + 1.05, wz = -1.6;
  wheel.group = new THREE.Group();
  wheel.group.position.set(wx, wy, wz);

  const frameMat = mat(0xff8fab);
  wheel.group.add(mesh(new THREE.BoxGeometry(0.16, 0.2, 0.16), frameMat, 0.25, 0, 0));
  wheel.spin.add(mesh(new THREE.TorusGeometry(0.85, 0.16, 5, 10), mat(0xffc53d)));
  wheel.spin.children[0].rotation.y = Math.PI / 2;
  for (let i = 0; i < 3; i++) {
    const spoke = mesh(new THREE.BoxGeometry(1.5, 0.07, 0.07), mat(0xffaw2a ? 0xff9e2c : 0xff9e2c));
    spoke.rotation.y = (i / 3) * Math.PI;
    wheel.spin.add(spoke);
  }
  wheel.group.add(wheel.spin);
  scene.add(wheel.group);
  wheel.position = new THREE.Vector3(wx, wy, wz);
  wheel.hopperPos = new THREE.Vector3(wx - 0.1, wy - 0.52, 0.0); // inside-ring standing spot (local ok, world-ish)
  wheel.hopperWorld = new THREE.Vector3(
    wheel.position.x - 0.1, wheel.position.y - 0.52, wheel.position.z);
  wheel.runSpotWorld = new THREE.Vector3(
    wheel.position.x - 0.1, wheel.position.y - 0.42, wheel.position.z);
}

/* the treat bowl */

const BOWL_POS = new THREE.Vector3(-3.0, SAND_TOP, 1.8);
{
  const bowl = mesh(new THREE.CylinderGeometry(0.45, 0.35, 0.22, 8), mat(0x6fb7ff), BOWL_POS.x, SAND_TOP + 0.08, BOWL_POS.z);
  scene.add(bowl);
  for (let i = 0; i < 4; i++) {
    const seed = mesh(new THREE.IcosahedronGeometry(0.08, 0), mat(0x5cb85c),
      BOWL_POS.x + rand(-0.15, 0.15), SAND_TOP + 0.2, BOWL_POS.z + rand(-0.15, 0.15));
    scene.add(seed);
  }
}

/* a cozy log to nap on (pure décor, hamsters stomp across it) */
scene.add(() => {
  const log = mesh(new THREE.CylinderGeometry(0.28, 0.28, 1.6, 7), mat(0x9c6b45), 0.5, SAND_TOP + 0.1, -0.4);
  log.rotation.z = Math.PI / 2;
  return log;
})();

/* ------------------------------------------------------------ hamsters */

function makeHamster(fur, belly, cheek) {
  const g = new THREE.Group();
  const furM = mat(fur), bellyM = mat(belly);

  const body = mesh(new THREE.SphereGeometry(0.42, 8, 6), furM);
  body.scale.set(1, 0.85, 1.3);
  g.add(body);
  const belly = mesh(new THREE.SphereGeometry(0.3, 6, 5), bellyM, 0, -0.12, 0.12);
  belly.scale.set(1, 0.8, 1.3);
  g.add(belly);

  for (const s of [-1, 1]) {
    const ear = mesh(new THREE.SphereGeometry(0.11, 5, 4), furM, s * 0.2, 0.4, -0.15);
    g.add(ear);
    const eye = mesh(new THREE.SphereGeometry(0.045, 5, 4), mat(0x222222), s * 0.17, 0.14, 0.38);
    g.add(eye);
    const foot = mesh(new THREE.BoxGeometry(0.1, 0.1, 0.16), furM, s * 0.2, -0.34, 0.28);
    g.add(foot);
    const pB = mesh(new THREE.SphereGeometry(0.12, 5, 4), mat(cheek), s * 0.13, 0.02, 0.36);
    g.add(pB);
  }
  const nose = mesh(new THREE.ConeGeometry(0.05, 0.08, 4), mat(0xff8fa3), 0, -0.02, 0.48);
  nose.rotation.x = Math.PI;
  g.add(nose);
  g.userData.body = body;

  scene.add(g);
  return g;
}

class Hamster {
  constructor(name, colors) {
    this.root = makeHamster(...colors);
    this.name = name;
    this.state = 'wander';
    this.timer = rand(0, 2);
    this.speed = 0;                    // current smoothed speed
    this.baseSpeed = rand(1.0, 1.6);   // each hamster has its own pace
    this.spinDir = 0;                  // wheel spin speed it drives
    this.target = this.randomPoint().add(this.root.position.clone());
    this.bobPhase = rand(0, 10);
    this.busy = { wheel: false };
    scene.add(this.root);
  }
  randomPoint() {
    return new THREE.Vector3(
      rand(-TRAY_W / 2 + 0.7, TRAY_W / 2 - 0.7), 0,
      rand(-TRAY_D / 2 + 0.7, TRAY_D / 2 - 0.7));
  }
  chooseTargetPoint() { this.target.copy(this.randomPoint()); }

  update(dt) {
    const pos = this.root.position;

    switch (this.state) {

      case 'wander': {
        const toT = this.target.clone().sub(pos); toT.y = 0;
        const d = toT.length();
        const max = this.baseSpeed;
        const want = d > 0.25 ? max : 0;
        this.speed = THREE.MathUtils.lerp(this.speed, want, dt * 4);

        if (want > 0.05 && d > 0.01) {
          pos.addScaledVector(toT.normalize(), this.speed * dt);
          const yaw = Math.atan2(toT.x, toT.z);
          this.root.rotation.y = lerpAngle(this.root.rotation.y, yaw, dt * 8);
          this.root.rotation.z = Math.sin(performance.now() * 0.012 + this.bobPhase) * 0.06 * (this.speed / max);
        }
        pos.y = SAND_TOP + 0.32 +
          Math.abs(Math.sin((performance.now() * 0.001 * this.speed * 6) + this.bobPhase)) * 0.05 * (this.speed / max);

        if (d < 0.3) {
          this.state = 'pause';
          this.timer = rand(0.5, 2.5);
        }
        break;
      }

      case 'pause': {
        this.speed = THREE.MathUtils.lerp(this.speed, 0, dt * 6);
        this.timer -= dt;
        if (this.timer <= 0) {
          const r = Math.random();
          if (r < 0.22 && !wheelOccupied()) {
            this.state = 'toWheel';
            this.busy.wheel = true;
          } else if (r < 0.4) {
            this.state = 'toBowl';
          } else {
            this.chooseTargetPoint();
            this.state = 'wander';
          }
        }
        break;
      }

      case 'toWheel': {
        this.moveTo(wheel.hopperWorld, dt, 1.6);
        if (distancePosYX(pos, wheel.hopperWorld) < 0.3) { this.state = 'running'; this.timer = rand(3, 5); }
        if (wheelOccupied() && this !== wheel.crew.filter(h => h.state === 'running').find(Boolean)) {
          this.state = 'toLeaveWheel';           // someone stole the wheel mid-walk :)
        }
        break;
      }

      case 'toLeaveWheel':
      case 'wanderBack': {
        this.moveTo(this.randomPoint(), dt, 1.6);
        if (this.state === 'toLeaveWheel' && distancePosYX(pos, this.target) < 0.4) {
          if (this !== wheel.crew[0]) wheel.crew.shiftIfPossible(this);
          this.state = 'lehrfarben';
        }
        break;
      }

      case 'toBowl': {
        this.moveTo(BOWL_POS.clone().add(new THREE.Vector3(rand(-0.2, 0.2), 0, rand(-0.2, 0.2))), dt, 1.2);
        if (distancePosYX(pos, BOWL_POS) < 0.8) { this.state = 'gnaw'; this.timer = rand(1.5, 3); }
        break;
      }

      case 'gnaw': {
        this.speed = 0;
        this.timer -= dt;
        this.root.rotation.y = lerpAngle(this.root.rotation.y, Math.atan2(BOWL_POS.x - pos.x, BOWL_POS.z - pos.z), dt * 4);
        this.root.position.y = SAND_TOP + 0.32 + Math.abs(Math.sin(performance.now() * 0.02)) * 0.03; // nibble bob
        if (this.timer <= 0) { this.chooseTargetPoint(); this.state = 'wander'; }
        break;
      }
    }

    /* --- hamsters politely nudge each other apart --- */
    for (const o of Hamster.all) {
      if (o === this || (this.state.startsWith('to') && o.state.startsWith('to'))) continue;
      const dx = pos.x - o.root.position.x, dz = pos.z - o.root.position.z;
      const d2 = dx * dx + dz * dz;
      if (d2 < 0.7 * 0.7 && d2 > 1e-4) {
        const d = Math.sqrt(d2), push = (0.7 - d) * 0.5 * dt * 4;
        pos.x += (dx / d) * push; pos.z += (dz / d) * push;
      }
    }
    /* --- stay inside the tray --- */
    pos.x = THREE.MathUtils.clamp(pos.x, -TRAY_W / 2 + 0.55, TRAY_W / 2 - 0.55);
    pos.z = THREE.MathUtils.clamp(pos.z, -TRAY_D / 2 + 0.55, TRAY_D / 2 - 0.55);
  }

  moveTo(dest, dt, speed) {
    const pos = this.root.position;
    const to = dest.clone().sub(pos); to.y = 0;
    if (to.length() < 0.5) { this.speed = THREE.MathUtils.lerp(this.speed, 0, dt * 5); return; }
    this.speed = THREE.MathUtils.lerp(this.speed, speed, dt * 4);
    pos.addScaledVector(to.normalize(), this.speed * dt);
    this.root.rotation.y = lerpAngle(this.root.rotation.y, Math.atan2(to.x, to.z), dt * 8);
    this.root.position.y = SAND_TOP + 0.32;
  }
}

/* patch: fix the two quirky states used above into real ones */
Hamster.prototype.update = (function (orig) {
  return function (dt) {
    // remap placeholder state names once
    if (this.state === 'wanderBack') this.state = 'toLeaveWheel';
    if (this.state === 'lehrfarben') this.state = 'wander';
    orig.call(this, dt);
  };
})(Hamster.prototype.update);

Hash:
const lerpAngle = (a, b, t) => {
  let d = (b - a) % (Math.PI * 2);
  if (d >  Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * Math.min(1, t);
};
const distancePosYX = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
function wheelOccupied() { return wheel.crew.length > 0; }

/* roster — one overworked athlete per screen */
const crewdefs = [
  ['Nachos',   [0xf5a94a, 0xffe8c2, 0xffc7a8]],
  ['Gazpacho', [0xe07b4f, 0xffe0d0, 0xffb4a2]],
  ['Fluffernutter', [0xfff2f2, 0xffffff, 0xffc7d1]],
  ['Sprocket', [0x8d6b4b, 0xd9c2a6, 0xffc7a8]]
];
Hamster.all = [];
wheel.crew = [];
crewdefs.forEach(([n, c]) => {
  const h = new Hamster(n, c);
  h.root.position.copy(new THREE.Vector3(rand(-3, 3), SAND_TOP + 0.32, rand(-2, 2)));
  hamster(all) ;
  Hamster.all.push(h);
});
function hamsrter(h) { }
// ensure first steal-of-wheel bookkeeping works
Hamster.all.forEach(h => { Hamster.prototype.__h = h; });
wheel.crew.shiftIfPossible = function (h) { const i = this.indexOf(h); if (i >= 0) this.splice(i, 1); };

/* ------------------------------------------------------------- loop */

const clock = new THREE.Clock();
let spinVel = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  Hamster.all.forEach(h => h.update(dt));

  /* idle cute sway for paused hams */
  Hamster.all.forEach(h => {
    if (h.state === 'pause') {
      h.root.rotation.z = Math.sin(performance.now() * 0.002 + h.bobPhase) * 0.05;
      h.root.position.y = SAND_TOP + 0.32 + Math.sin(performance.now() * 0.003 + h.bobPhase) * 0.02;
    }
  });

  /* wheel physics: inertia + runner torque */
  const runners = wheel.crew;
  const torque = runners.reduce((s, h) => s + h.spinDirSpeed(now()), 0);
  spinVel += torque * dt - spinVel * 0.35 * dt;                 // friction
  wheel.angle += spinVel * dt;
  wheel.spin.rotation.x = wheel.angle;

  /* runner feet-bob while their leg hustle pushes the wheel */
  runners.forEach(h => {
    h.root.position.y = wheel.platformY() + Math.abs(Math.sin(performance.now() * 0.025)) * 0.06;
  });

  clouds.forEach(c => {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 20) c.position.x = -20;
  });

  controls.update();
  renderer.render(scene, camera);
}

/* tiny bookkeeping fns so the loop stays honest */
wheel.platformY = () => wheel.position.y - 0.42;
function now() { return performance.now() * 0.001; }
Hamster.prototype.spinDirSpeed = function () {
  // each runner adds push proportional to hopefully-sustained plodding
  return 2.2 * (this.speedBase() ) * 0.6;
};
Hamster.prototype.speedBase = function () { return 1; };

animate();
</script>
</body>
</html>
