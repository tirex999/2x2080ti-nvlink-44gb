<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe9d6; }
  #ui {
    position: absolute; top: 14px; left: 14px; z-index: 10;
    font-family: 'Segoe UI', sans-serif; color: #7a4a21;
    background: rgba(255,255,255,.75); padding: 10px 16px; border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12); pointer-events: none;
  }
  #ui h1 { margin: 0 0 4px; font-size: 18px; }
  #ui p  { margin: 0; font-size: 13px; }
</style>
</head>
<body>
<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to orbit &bull; Scroll to zoom &bull; Watch the chaos</p>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= BASIC SETUP ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe3c4);
scene.fog = new THREE.Fog(0xffe3c4, 30, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 100);
camera.position.set(11, 9, 13);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.dampingFactor = .08;
controls.minDistance = 7;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * .49;

/* LIGHTS */
scene.add(new THREE.AmbientLight(0xfff2e0, .8));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14;  sun.shadow.camera.bottom = -14;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfe8ff, 0xffcc99, .5));

/* helpers */
const mat = (color, extra={}) => new THREE.MeshStandardMaterial({ color, flatShading:true, ...extra });
function box(w,h,d,color,x=0,y=0,z=0,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color));
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}

/* ================= CAGE / ROOM ================= */
// room table + soft rug
box(36, 1, 36, 0xd9a066, 0, -.5, 0);                       // floor slab
const rug = new THREE.Mesh(new THREE.CircleGeometry(14, 10), mat(0xf7b7c8));
rug.rotation.x = -Math.PI/2; rug.position.y = .02; rug.receiveShadow = true; scene.add(rug);

// cage base tray
const TRAY_R = 7;
box(TRAY_R*2+1.6, 1.4, TRAY_R*2+1.6, 0x8c5a2b, 0, .7, 0);   // wooden base
// four legs
for (const [lx,lz] of [[-1,-1],[1,-1],[-1,1],[1,1]])
  box(1, 1, 1, 0x6e441f, lx*(TRAY_R*.8), -.5, lz*(TRAY_R*.8));
// bedding
const bed = new THREE.Mesh(new THREE.CylinderGeometry(TRAY_R, TRAY_R, .7, 10), mat(0xfce08a));
bed.position.y = 1.45; bed.receiveShadow = true; scene.add(bed);
// scattered pebbles on bedding
for (let i=0;i<14;i++){
  const p = new THREE.Mesh(new THREE.DodecahedronGeometry(.18), mat(0xf5f5dc));
  const a = Math.random()*Math.PI*2, r = Math.random()*(TRAY_R-.8);
  p.position.set(Math.cos(a)*r, 1.75, Math.sin(a)*r);
  p.castShadow = true; scene.add(p);
}
// glass dome (cage)
const glass = new THREE.Mesh(
  new THREE.SphereGeometry(TRAY_R+.3, 10, 7, 0, Math.PI*2, 0, Math.PI/2),
  new THREE.MeshStandardMaterial({ color:0xcfeeff, transparent:true, opacity:.18, flatShading:true, side:THREE.DoubleSide })
);
glass.position.y = 1.8; scene.add(glass);
// rim ring
const rim = new THREE.Mesh(new THREE.TorusGeometry(TRAY_R+.3, .22, 6, 12), mat(0x5b8db8));
rim.rotation.x = Math.PI/2; rim.position.y = 1.8; scene.add(rim);

const FLOOR_Y = 2.15;          // where hamster bodies sit
const LIMIT  = TRAY_R - 1.2;   // roaming bound

/* ================= INTERACTIVE OBJECTS ================= */
// --- WHEEL ---
const wheelGroup = new THREE.Group();
wheelGroup.position.set(4.5, 0, -4.2);
const wStand = new THREE.Mesh(new THREE.CylinderGeometry(.25,.5,2.6,6), mat(0x5b8db8));
wStand.position.y = 1.3; wStand.castShadow = true; wheelGroup.add(wStand);
const wheelSpin = new THREE.Group(); wheelSpin.position.y = 3.4; wheelGroup.add(wheelSpin);
const wRing = new THREE.Mesh(new THREE.TorusGeometry(1.5,.16,6,14), mat(0xff8fa3));
wRing.castShadow = true; wheelSpin.add(wRing);
for (let i=0;i<8;i++){
  const s = new THREE.Mesh(new THREE.BoxGeometry(2.9,.12,.12), mat(0xffd9e2));
  s.rotation.z = i*Math.PI/8; wheelSpin.add(s);
}
const hub = new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.3,6), mat(0x5b8db8));
hub.rotation.x = Math.PI/2; wheelSpin.add(hub);
scene.add(wheelGroup);
const wheelPos = new THREE.Vector3(4.5, FLOOR_Y, -4.2);

// --- TUNNEL ---
const tunnel = new THREE.Group();
const tMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(1.1,1.1,3.4,8,1,false,0,Math.PI),
  new THREE.MeshStandardMaterial({ color:0x9d7bd8, flatShading:true, side:THREE.DoubleSide })
);
tMesh.rotation.z = Math.PI/2; tMesh.rotation.y = Math.PI/2;
tMesh.position.y = 1.1; tMesh.castShadow = tMesh.receiveShadow = true;
tunnel.add(tMesh);
tunnel.position.set(-4.6, FLOOR_Y-.7, 3.2);
tunnel.rotation.y = .6;
scene.add(tunnel);

// --- FOOD BOWL (target for eating) ---
const bowl = new THREE.Group();
const bowlBody = new THREE.Mesh(new THREE.CylinderGeometry(1, .7, .5, 8), mat(0x4ecdc4));
bowlBody.position.y = .25; bowlBody.castShadow = true; bowl.add(bowlBody);
for (let i=0;i<7;i++){
  const seed = new THREE.Mesh(new THREE.SphereGeometry(.16,5,4), mat(0xe07b39));
  const a = i/7*Math.PI*2;
  seed.position.set(Math.cos(a)*.4, .55, Math.sin(a)*.4);
  seed.castShadow = true; bowl.add(seed);
}
bowl.position.set(1.8, FLOOR_Y-.7, 4.6);
scene.add(bowl);
const bowlPos = new THREE.Vector3(1.8, FLOOR_Y, 4.6);

// --- WATER BOTTLE on stand ---
const bottleG = new THREE.Group();
const bStand = new THREE.Mesh(new THREE.CylinderGeometry(.45,.55,.9,6), mat(0x6d5b8f));
bStand.position.y=.45; bStand.castShadow=true; bottleG.add(bStand);
const bWater = new THREE.Mesh(new THREE.CapsuleGeometry(.5,1.1,4,8), 
  new THREE.MeshStandardMaterial({color:0x7fd8ff, flatShading:true, transparent:true, opacity:.85}));
bWater.position.y=1.8; bWater.castShadow=true; bottleG.add(bWater);
bottleG.position.set(-2.5, FLOOR_Y-.7, -4.8);
scene.add(bottleG);

// --- HAY PILE ---
const hay = new THREE.Group();
for (let i=0;i<9;i++){
  const h = new THREE.Mesh(new THREE.BoxGeometry(.35, .15, 1.3+Math.random()), mat(0xd8b24a));
  h.position.set((Math.random()-.5)*1.6, .12+Math.random()*.4, (Math.random()-.5)*1.2);
  h.rotation.y = Math.random()*Math.PI;
  h.castShadow = true; hay.add(h);
}
hay.position.set(-5.5, FLOOR_Y-.7, -1.5);
scene.add(hay);

/* ================= HAMSTERS ================= */
const PALETTES = [
  { body:0xffa94d, belly:0xfff1dd, ear:0xff8787 },   // ginger
  { body:0xb197fc, belly:0xf3f0ff, ear:0x74b3ff },   // lilac (yes, purple hamster, why not)
  { body:0x63e6be, belly:0xeafff7, ear:0x20bf6b },   // mint
];

function makeHamster(palette){
  const g = new THREE.Group();
  const bodyMat = mat(palette.body), bellyMat = mat(palette.belly);

  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(.55, 0), bodyMat);
  body.scale.set(1.25, .9, 1.05); body.position.y = .55; body.castShadow = true; g.add(body);

  const belly = new THREE.Mesh(new THREE.IcosahedronGeometry(.42, 0), bellyMat);
  belly.scale.set(1.05, .6, .8); belly.position.set(.1, .42, 0); g.add(belly);

  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(.38, 0), bodyMat);
  head.position.set(.62, .78, 0); head.castShadow = true; g.add(head);
  const muzzle = new THREE.Mesh(new THREE.IcosahedronGeometry(.2, 0), bellyMat);
  muzzle.position.set(.92, .68, 0); g.add(muzzle);

  for (const s of [-1,1]){
    const eye = new THREE.Mesh(new THREE.SphereGeometry(.06,6,6), mat(0x2d3436));
    eye.position.set(.88, .9, s*.18); g.add(eye);
    const ear = new THREE.Mesh(new THREE.ConeGeometry(.14,.3,4), mat(palette.ear));
    ear.position.set(.55, 1.12, s*.26); ear.rotation.z = -.3; g.add(ear);
    // feet
    const foot = new THREE.Mesh(new THREE.SphereGeometry(.11,5,4), bellyMat);
    foot.scale.set(.8, .5, 1.3);
    foot.position.set(.45*s*.6 + (s<0?.3:-.3), .14, s*.24); g.add(foot);
  }
  const nose = new THREE.Mesh(new THREE.SphereGeometry(.05,5,4), mat(0xf78fb3));
  nose.position.set(1.08,.68,0); g.add(nose);

  return g;
}

class Hamster {
  constructor(palette, x, z){
    this.mesh = makeHamster(palette);
    this.mesh.position.set(x, FLOOR_Y, z);
    this.mesh.rotation.y = Math.random()*Math.PI*2;
    scene.add(this.mesh);

    this.state = 'idle';
    this.timer = 1 + Math.random()*2;
    this.speed = 1.6 + Math.random();
    this.rotSpeed = (Math.random()<.5?-1:1) * (1.5 + Math.random());
    this.walkTarget = null;
    this.wiggle = Math.random()*10;
  }

  pickRandomPoint(){
    const a = Math.random()*Math.PI*2, r = Math.random()*LIMIT;
    return new THREE.Vector3(Math.cos(a)*r, 0, Math.sin(a)*r);
  }

  decide(dt){
    this.timer -= dt;
    if (this.timer > 0) return;

    const roll = Math.random();
    if (roll < .42){                          // stroll somewhere
      this.state = 'walk';
      this.walkTarget = this.pickRandomPoint();
      this.timer = 2 + Math.random()*3;
    } else if (roll < .62){                    // snack at bowl
      this.state = 'walkToBowl';
      this.walkTarget = bowlPos.clone().add(new THREE.Vector3((Math.random()-.5)*.6, 0, (Math.random()-.5)*.6));
      this.timer = 20;                         // long leash; 'eat' handles rest
    } else if (roll < .78){                    // use the wheel
      this.state = 'walkToWheel';
      this.walkTarget = wheelPos.clone().add(new THREE.Vector3((Math.random()-.5)*.7, 0, (Math.random()-.5)*.7));
      this.timer = 20;
    } else {                                   // just stand there, be mysterious
      this.state = 'idle';
      this.timer = 1 + Math.random()*2.5;
    }
  }

  steerToward(target, dt){
    const dx = target.x - this.mesh.position.x;
    const dz = target.z - this.mesh.position.z;
    const dist = Math.hypot(dx, dz);
    const desired = Math.atan2(dx, dz);
    let diff = desired - this.mesh.rotation.y;
    while (diff >  Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    this.mesh.rotation.y += THREE.MathUtils.clamp(diff, -2.2*dt, 2.2*dt);
    if (dist > .35) {
      this.mesh.position.x += Math.sin(this.mesh.rotation.y) * this.speed * dt;
      this.mesh.position.z += Math.cos(this.mesh.rotation.y) * this.speed * dt;
    }
    return dist;
  }

  update(dt, t){
    this.decide(dt);
    const p = this.mesh.position;

    switch(this.state){
      case 'walk': {
        const d = this.steerToward(this.walkTarget, dt);
        this.wiggle += dt * 10 * this.speed;
        this.mesh.rotation.z = Math.sin(this.wiggle) * .09;
        this.mesh.position.y = FLOOR_Y + Math.abs(Math.sin(this.wiggle)) * .08;
        if (d < .5){ this.state='idle'; this.timer = .5 + Math.random()*2; }
        break;
      }
      case 'walkToBowl': {
        const d = this.steerToward(this.walkTarget, dt);
        if (d < .55){ this.state='eat'; this.timer = 2 + Math.random()*2; }
        break;
      }
      case 'eat': {
        this.timer -= 0; // already counted in decide()
        // face bowl and munch: quick head-bob scale pulse
        const desired = Math.atan2(bowlPos.x-p.x, bowlPos.z-p.z);
        p.lerp(bowlPos, dt*2);
        this.mesh.rotation.y += (desired - this.mesh.rotation.y) * Math.min(1, 6*dt);
        this.mesh.scale.setScalar(1 + Math.sin(t*14) * .05);
        if (this.timer <= 0){ this.state='idle'; this.timer = 1+Math.random(); this.mesh.scale.setScalar(1); }
        break;
      }
      case 'walkToWheel': {
        const d = this.steerToward(this.walkTarget, dt);
        if (d < .6){ this.state='runWheel'; this.timer = 2.5 + Math.random()*2; }
        break;
      }
      case 'runWheel': {
        const desired = Math.atan2(wheelPos.x-p.x, wheelPos.z-p.z);
        p.lerp(wheelPos, dt*2);
        this.mesh.rotation.y += (desired - this.mesh.rotation.y) * Math.min(1, 6*dt);
        this.wiggle += dt*22;                                   // frantic legging
        this.mesh.position.y = FLOOR_Y + Math.abs(Math.sin(this.wiggle))*.16;
        this.mesh.scale.setScalar(1 + Math.sin(t*22)*.04);
        wheelSpin.rotation.z += dt * 9;                          // WHEEL ACTIVATED
        if (this.timer <= 0){ this.state='idle'; this.timer=1.5+Math.random()*2; this.mesh.scale.setScalar(1); }
        break;
      }
      default: { // idle
        this.timer -= 0; // counted in decide()
        this.wiggle += dt*3;
        this.mesh.rotation.z *= .9;
        this.mesh.position.y = FLOOR_Y + Math.sin(t*3 + this.wiggle)*.02;
        this.mesh.scale.setScalar(1);
      }
    }

    // keep inside cage
    const r = Math.hypot(p.x, p.z);
    if (r > LIMIT){ p.x *= LIMIT/r; p.z *= LIMIT/r; }
  }
}

const hamsters = [
  new Hamster(PALETTES[0], 2, 1),
  new Hamster(PALETTES[1], -3, -1),
  new Hamster(PALETTES[2], 0, -3),
];

/* decorative clouds outside */
for (let i=0;i<3;i++){
  const c = new THREE.Group();
  for (let j=0;j<3;j++){
    const puff = new THREE.Mesh(new THREE.IcosahedronGeometry(1+Math.random(),1), 
      new THREE.MeshStandardMaterial({color:0xffffff, flatShading:true}));
    puff.position.set(j*1.4-1.4, Math.random()*.4, 0);
    c.add(puff);
  }
  const a = i/3*Math.PI*2;
  c.position.set(Math.cos(a)*22, 8+Math.random()*3, Math.sin(a)*22);
  scene.add(c);
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();
let wheelIdleSpin = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  for (const h of hamsters) h.update(dt, t);

  // gentle wheel coast-down when nobody's running
  if (!hamsters.some(h => h.state === 'runWheel')){
    wheelIdleSpin += dt * .4;
    wheelSpin.rotation.z += dt * .4;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
