<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe9d6; }
  canvas { display: block; }
  #hud {
    position: absolute; top: 14px; left: 14px;
    font-family: 'Segoe UI', sans-serif; color: #7a4a2b;
    background: rgba(255,255,255,.65); padding: 10px 16px;
    border-radius: 12px; font-size: 14px; pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  #hud b { font-size: 16px; }
</style>
</head>
<body>
<div id="hud"><b>🐹 Low-Poly Hamster Playground</b><br>Drag to orbit · Scroll to zoom<br>Watch the hamsters find the wheel!</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Setup ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe9d6);
scene.fog = new THREE.Fog(0xffe9d6, 30, 55);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(12, 10, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 6;
controls.maxDistance = 30;

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xfff2e0, 0xd8a888, 0.9));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.4);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -12;
sun.shadow.camera.right = sun.shadow.camera.top = 12;
scene.add(sun);

// ---------- Floor & Cage ----------
const CAGE_R = 7, CAGE_H = 3.6;

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 32),
  new THREE.MeshStandardMaterial({ color: 0xf5cfa0, roughness: 1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const tray = new THREE.Mesh(
  new THREE.CylinderGeometry(CAGE_R+0.6, CAGE_R+0.9, 0.8, 10),
  new THREE.MeshStandardMaterial({ color: 0x8fd3f0, roughness: .9, flatShading: true })
);
tray.position.y = 0.4;
tray.receiveShadow = true;
tray.castShadow = true;
scene.add(tray);

// straw bedding
for (let i = 0; i < 90; i++) {
  const a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random())*(CAGE_R+0.2);
  const straw = new THREE.Mesh(
    new THREE.BoxGeometry(0.28+Math.random()*0.3, 0.04, 0.1),
    new THREE.MeshStandardMaterial({ color: [0xf0d080,0xe8c060,0xd8b050][i%3], flatShading:true })
  );
  straw.position.set(Math.cos(a)*r, 0.83, Math.sin(a)*r);
  straw.rotation.y = Math.random()*Math.PI;
  scene.add(straw);
}

// cage bars (low-poly thin cylinders)
const barMat = new THREE.MeshStandardMaterial({ color: 0xcfd8dc, metalness:.6, roughness:.4, flatShading:true });
const N_BARS = 24;
for (let i = 0; i < N_BARS; i++) {
  const a = i/N_BARS*Math.PI*2;
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, CAGE_H, 5), barMat);
  bar.position.set(Math.cos(a)*(CAGE_R+0.6), 0.8+CAGE_H/2, Math.sin(a)*(CAGE_R+0.6));
  bar.castShadow = true;
  scene.add(bar);
}
// top & bottom rings
[[CAGE_H, 0xaebfc7],[0.0, 0x8fb8cc]].forEach(([y,c]) => {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(CAGE_R+0.6, 0.12, 5, 28), 
    new THREE.MeshStandardMaterial({ color: c, metalness:.5, roughness:.5, flatShading:true }));
  ring.rotation.x = Math.PI/2;
  ring.position.y = 0.8+y;
  scene.add(ring);
});

// ---------- Interactive objects ----------
const WHEEL_POS = new THREE.Vector3(-4, 0.8, -4);
const BOWL_POS  = new THREE.Vector3(4.5, 0.8, 2.5);
const TUNNEL_POS = new THREE.Vector3(1, 0.8, -4.5);

// Exercise wheel (spins!)
const wheel = new THREE.Group();
const wheelMat = new THREE.MeshStandardMaterial({ color: 0xff8a65, roughness:.7, flatShading:true });
const rim = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.12, 6, 20), wheelMat);
rim.castShadow = true;
wheel.add(rim);
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.3,6), wheelMat);
hub.rotation.x = Math.PI/2;
wheel.add(hub);
for (let i = 0; i < 6; i++) {
  const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.1,4), wheelMat);
  spoke.rotation.z = i/6*Math.PI;
  spoke.position.set(Math.cos(i/6*Math.PI)*0.55, Math.sin(i/6*Math.PI)*0.55, 0);
  wheel.add(spoke);
}
const wheelStand = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.4,1.3,6), 
  new THREE.MeshStandardMaterial({ color: 0xffb74d, flatShading:true }));
wheelStand.position.y = -1.85;
wheel.add(wheelStand);
wheel.position.copy(WHEEL_POS).add(new THREE.Vector3(0,1.9,0));
scene.add(wheel);
let wheelSpin = 0;

// Food bowl
const bowl = new THREE.Group();
const bowlBase = new THREE.Mesh(new THREE.ConeGeometry(0.9, 0.55, 8),
  new THREE.MeshStandardMaterial({ color: 0xf48fb1, roughness:.8, flatShading:true }));
bowlBase.scale.y = -1;
bowl.add(bowlBase);
const kibbleMat = new THREE.MeshStandardMaterial({ color: 0xffca28, flatShading:true });
for (let i = 0; i < 5; i++) {
  const k = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1, 0), kibbleMat);
  const a = Math.random()*Math.PI*2, r = Math.random()*0.4;
  k.position.set(Math.cos(a)*r, 0.12, Math.sin(a)*r);
  k.rotation.set(Math.random(),Math.random(),Math.random());
  bowl.add(k);
}
bowl.position.copy(BOWL_POS);
bowl.traverse(o => o.castShadow = true);
scene.add(bowl);

// Tunnel (cute arched tube)
const tunnel = new THREE.Group();
const tunMat = new THREE.MeshStandardMaterial({ color: 0x81c784, roughness:.9, flatShading:true, side:THREE.DoubleSide });
const tunShape = new THREE.CylinderGeometry(0.9, 0.9, 2.6, 8, 1, true, 0, Math.PI);
tunShape.rotateZ(Math.PI/2);
const tun = new THREE.Mesh(tunShape, tunMat);
tun.castShadow = true;
tunnel.add(tun);
tunnel.position.copy(TUNNEL_POS);
scene.add(tunnel);

// Little toy ball
const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 0),
  new THREE.MeshStandardMaterial({ color: 0xba68c8, roughness:.8, flatShading:true }));
ball.position.set(2, 1.1, 4);
ball.castShadow = true;
scene.add(ball);

// ---------- Hamster factory ----------
function makeHamster(color) {
  const g = new THREE.Group();
  const mat  = () => new THREE.MeshStandardMaterial({ color, roughness:.85, flatShading:true });
  const dark = () => new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(.7), roughness:.85, flatShading:true });

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.55, 8, 6), mat());
  body.scale.set(1.25, 0.9, 1);
  body.position.y = 0.5;
  body.castShadow = true;
  g.add(body);

  const snout = new THREE.Mesh(new THREE.SphereGeometry(0.28, 7, 5), dark());
  snout.position.set(0.55, 0.5, 0);
  g.add(snout);

  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 5),
    new THREE.MeshStandardMaterial({ color: 0xff6f91, flatShading:true }));
  nose.position.set(0.8, 0.5, 0);
  g.add(nose);

  [[-1],[1]].forEach(([s]) => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5),
      new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness:.3 }));
    eye.position.set(0.55, 0.68, s*0.26);
    g.add(eye);
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.3, 5), mat());
    ear.position.set(-0.1, 1.02, s*0.3);
    ear.rotation.z = s*0.4;
    g.add(ear);
  });

  // cheeks
  [-1,1].forEach(s => {
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 5),
      new THREE.MeshStandardMaterial({ color: 0xffb4be, flatShading:true }));
    cheek.position.set(0.5, 0.42, s*0.4);
    g.add(cheek);
  });

  // legs
  const legs = [];
  [[-0.35,-0.25],[-0.35,0.25],[0.35,-0.25],[0.35,0.25]].forEach(([x,z]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.28,5), dark());
    leg.position.set(x, 0.16, z);
    g.add(leg);
    legs.push(leg);
  });

  return { group: g, body, legs, mat };
}

// ---------- Hamster AI ----------
const HAMSTER_COLORS = [0xfff1b8, 0xffcf9e, 0xd7bde2, 0xa8e6cf, 0xffd4d4];
const hamsters = HAMSTER_COLORS.map((c,i) => {
  const h = makeHamster(c);
  const a = i/HAMSTER_COLORS.length*Math.PI*2;
  h.group.position.set(Math.cos(a)*3.5, 0.8, Math.sin(a)*3.5);
  scene.add(h.group);
  return { ...h, state:'walk', target: new THREE.Vector3(), timer: Math.random()*2, dir: a, legPhase: Math.random()*6 };
});

const randPoint = () => {
  const a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random())*(CAGE_R-1.4);
  return new THREE.Vector3(Math.cos(a)*r, 0.8, Math.sin(a)*r);
};

function updateHamster(h, dt, t) {
  const p = h.group.position;
  h.timer -= dt;

  switch (h.state) {
    case 'walk': {
      const to = h.target.clone().sub(p);
      to.y = 0;
      if (to.length() < 0.3) {
        // arrived — maybe eat / pause / try the wheel
        const roll = Math.random();
        if (h.target.distanceTo(BOWL_POS) < 0.6 && roll < 0.7) {
          h.state = 'eat'; h.timer = 1.5 + Math.random()*2;
        } else if (h.target.distanceTo(WHEEL_POS) < 1.4 && roll < 0.4) {
          h.state = 'wheel'; h.timer = 6 + Math.random()*4;
          h.target.copy(WHEEL_POS);
        } else if (roll < 0.5) {
          h.state = 'pause'; h.timer = 1 + Math.random()*2;
        } else {
          h.state = 'pause'; h.timer = 0.4;
        }
        break;
      }
      const speed = 1.6 + (h.index ?? 0)*0.15;
      h.dir = Math.atan2(to.x, to.z);
      p.addScaledVector(to.normalize(), Math.min(speed*dt, to.length()));
      animateLegs(h, dt, 10);
      bounce(h, t);
      if (h.timer <= 0 && Math.random() < 0.02) h.state = 'pause', h.timer = 1+Math.random();
      break;
    }
    case 'pause': {
      if (h.timer <= 0) {
        h.state = 'walk';
        const roll = Math.random();
        h.target = roll < 0.3 ? BOWL_POS.clone() : roll < 0.55 ? WHEEL_POS.clone() : randPoint();
        h.timer = 4 + Math.random()*4;
      }
      // idle twitch: occasional sneaky spin
      if (Math.random() < 0.005) h.dir += Math.PI * (Math.random()<.5?1:-1);
      h.group.rotation.y += (h.dir - h.group.rotation.y)*dt*3;
      // happy little hop
      h.group.position.y = 0.8 + Math.abs(Math.sin(t*6))*0.06;
      break;
    }
    case 'eat': {
      // face the bowl
      const ta = Math.atan2(BOWL_POS.x-p.x, BOWL_POS.z-p.z);
      h.dir = ta;
      h.group.rotation.y += (ta - h.group.rotation.y)*dt*5;
      // chomp: head bob
      h.body.rotation.z = Math.sin(t*14)*0.12;
      h.group.position.y = 0.8 + Math.abs(Math.sin(t*14))*0.04;
      if (h.timer <= 0) { h.state='walk'; h.body.rotation.z = 0; h.target = randPoint(); }
      break;
    }
    case 'wheel': {
      // shuffle to the front of the wheel, then ride
      const wp = WHEEL_POS;
      const dx = p.x-wp.x, dz = p.z-wp.z, d = Math.hypot(dx,dz);
      if (d > 1.45) {
        p.x -= Math.sign(dx)*Math.min(dt*2, Math.abs(dx));
        p.z -= Math.sign(dz)*Math.min(dt*2, Math.abs(dz));
        h.group.rotation.y = Math.atan2(-dx,-dz);
        animateLegs(h, dt, 16);
      } else {
        // face out and run in place — wheel spins!
        h.group.rotation.y += (0 - h.group.rotation.y)*dt*4; // face +Z... face outward instead:
        const outA = Math.atan2(p.x-wp.x, p.z-wp.z);
        h.group.rotation.y += (outA - h.group.rotation.y)*dt*5;
        animateLegs(h, dt, 22);
        h.group.position.y = 0.8 + Math.abs(Math.sin(t*18))*0.1;
        wheelSpin += dt*9;
      }
      if (h.timer <= 0 || Math.random() < 0.003) {
        h.state = 'pause'; h.timer = 1 + Math.random();
        h.target = randPoint();
      }
      break;
    }
  }

  // smooth turning while walking
  if (h.state === 'walk') h.group.rotation.y += (h.dir - h.group.rotation.y) * Math.min(dt*8, 1);
  // keep inside cage
  const cr = Math.hypot(p.x, p.z);
  if (cr > CAGE_R - 0.8) { const s = (CAGE_R-0.8)/cr; p.x*=s; p.z*=s; h.target = randPoint(); }
}

let legT = 0;
function animateLegs(h, dt, freq) {
  legT += dt*freq;
  const s = Math.sin(legT + h.legPhase)*0.6;
  h.legs[0].rotation.x = s;   h.legs[1].rotation.x = -s;
  h.legs[2].rotation.x = -s;  h.legs[3].rotation.x = s;
}
function bounce(h, t) {
  h.group.position.y = 0.8 + Math.abs(Math.sin(t*10 + h.legPhase))*0.05;
}

// ---------- Loop ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  hamsters.forEach((h,i) => { h.index = i; updateHamster(h, dt, t); });

  // wheel decelerates after riders leave
  wheelSpin *= (1 - dt*1.2);
  wheel.rotation.z = wheelSpin;

  // ball bounces gently on its own (it's a "magic" ball)
  ball.position.y = 1.1 + Math.abs(Math.sin(t*2.2))*0.4;
  ball.rotation.y += dt*1.5;

  // straws occasionally shift? no — keep it calm. Bowls wobble subtly when eaten at
  bowl.rotation.y += dt*0.2;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
