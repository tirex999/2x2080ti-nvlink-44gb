<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #ffe9f0; }
  #info {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    font-family: "Comic Sans MS", cursive, sans-serif; color: #7a4a68;
    background: rgba(255,255,255,0.7); padding: 8px 18px; border-radius: 20px;
    font-size: 14px; pointer-events: none; text-align: center;
  }
</style>
</head>
<body>
<div id="info">🐹 Low-Poly Hamster Playground — drag to rotate, scroll to zoom</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
// ============================================================
//  BASICS
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe9f0);
scene.fog = new THREE.Fog(0xffe9f0, 30, 60);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.HemisphereLight(0xfff5e6, 0xd0b0c0, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;  sun.shadow.camera.bottom = -12;
scene.add(sun);

// ============================================================
//  SIMPLE ORBIT CAMERA (custom, no extra libs)
// ============================================================
const cam = { theta: 0.6, phi: 1.05, radius: 17, target: new THREE.Vector3(0, 1.5, 0) };
let dragging = false, px = 0, py = 0;

function updateCamera() {
  cam.phi = Math.max(0.25, Math.min(1.45, cam.phi));
  cam.radius = Math.max(8, Math.min(30, cam.radius));
  camera.position.set(
    cam.target.x + cam.radius * Math.sin(cam.phi) * Math.sin(cam.theta),
    cam.target.y + cam.radius * Math.cos(cam.phi),
    cam.target.z + cam.radius * Math.sin(cam.phi) * Math.cos(cam.theta)
  );
  camera.lookAt(cam.target);
}
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  cam.theta -= (e.clientX - px) * 0.006;
  cam.phi   -= (e.clientY - py) * 0.005;
  px = e.clientX; py = e.clientY;
});
addEventListener('wheel', e => { cam.radius += e.deltaY * 0.01; }, { passive: true });
updateCamera();

// ============================================================
//  CAGE: tray, floor, bars, roof
// ============================================================
const cage = new THREE.Group();
scene.add(cage);

const CAGE_R = 7;         // cage radius (round cage!)
const CAGE_H = 5;

// Tray
const tray = new THREE.Mesh(
  new THREE.CylinderGeometry(CAGE_R + 0.5, CAGE_R + 0.2, 1.1, 24),
  new THREE.MeshStandardMaterial({ color: 0x6ec6e8, flatShading: true })
);
tray.position.y = 0.55;
tray.receiveShadow = true;
cage.add(tray);

// Sandy floor
const floor = new THREE.Mesh(
  new THREE.CylinderGeometry(CAGE_R, CAGE_R, 0.3, 24),
  new THREE.MeshStandardMaterial({ color: 0xf5deb3, flatShading: true })
);
floor.position.y = 1.15;
floor.receiveShadow = true;
cage.add(floor);

// Bars
const barMat = new THREE.MeshStandardMaterial({ color: 0xf8f8ff, flatShading: true });
const BAR_COUNT = 28;
for (let i = 0; i < BAR_COUNT; i++) {
  const a = (i / BAR_COUNT) * Math.PI * 2;
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.14, CAGE_H, 0.14), barMat);
  bar.position.set(Math.cos(a) * CAGE_R, 1 + CAGE_H / 2, Math.sin(a) * CAGE_R);
  bar.castShadow = true;
  cage.add(bar);
}
// Top ring
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(CAGE_R, 0.16, 6, 32),
  new THREE.MeshStandardMaterial({ color: 0xff8fab, flatShading: true })
);
ring.rotation.x = Math.PI / 2;
ring.position.y = 1 + CAGE_H;
ring.castShadow = true;
cage.add(ring);

// Top handle (cute)
const handle = new THREE.Mesh(
  new THREE.TorusGeometry(0.9, 0.15, 6, 16),
  new THREE.MeshStandardMaterial({ color: 0xffb347, flatShading: true })
);
handle.position.y = 1 + CAGE_H + 0.4;
cage.add(handle);

// Ground outside the cage
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(28, 32),
  new THREE.MeshStandardMaterial({ color: 0xffd6e8 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ============================================================
//  INTERACTIVE OBJECTS: wheel, food bowl, tunnel
// ============================================================

// --- Exercise wheel ---
const wheelGroup = new THREE.Group();
wheelGroup.position.set(-3.5, 2.6, -2.5);
cage.add(wheelGroup);

const wheelSpin = new THREE.Group();   // this rotates
wheelGroup.add(wheelSpin);

const wheelMat = new THREE.MeshStandardMaterial({ color: 0xff6b9d, flatShading: true });
const wheelRim = new THREE.Mesh(new THREE.TorusGeometry(1.9, 0.22, 6, 20), wheelMat);
wheelSpin.add(wheelRim);
for (let i = 0; i < 8; i++) {
  const spoke = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.12, 0.12),
    new THREE.MeshStandardMaterial({ color: 0xffd93d, flatShading: true }));
  spoke.rotation.z = (i / 8) * Math.PI;
  wheelSpin.add(spoke);
}
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.7, 8), wheelMat);
hub.rotation.x = Math.PI / 2;
wheelSpin.add(hub);
// Stand
const standMat = new THREE.MeshStandardMaterial({ color: 0xa0704a, flatShading: true });
[-1.3, 1.3].forEach(z => {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 2.6, 0.25), standMat);
  leg.position.set(1.3, -1.3, z * 0.9);
  wheelGroup.add(leg);
});
wheelSpin.castShadow = true;

// --- Food bowl ---
const bowl = new THREE.Group();
bowl.position.set(4, 1.3, 2.5);
cage.add(bowl);
const bowlMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(0.9, 0.55, 0.55, 10, 1, true),
  new THREE.MeshStandardMaterial({ color: 0x7de8a2, flatShading: true, side: THREE.DoubleSide })
);
bowlMesh.position.y = 0.28;
bowl.add(bowlMesh);
const food = new THREE.Mesh(
  new THREE.SphereGeometry(0.6, 6, 4),
  new THREE.MeshStandardMaterial({ color: 0xd2691e, flatShading: true })
);
food.scale.y = 0.5;
food.position.y = 0.4;
bowl.add(food);

// --- Tunnel (a hollow tube) ---
const tunnel = new THREE.Mesh(
  new THREE.CylinderGeometry(0.9, 0.9, 3.4, 10, 1, true),
  new THREE.MeshStandardMaterial({ color: 0xb28fff, flatShading: true, side: THREE.DoubleSide })
);
tunnel.rotation.z = Math.PI / 2;
tunnel.position.set(2.5, 2.2, -3.5);
tunnel.castShadow = true;
cage.add(tunnel);

// --- Scattered pellets & rocks (decor) ---
const pelletGeo = new THREE.DodecahedronGeometry(0.14);
const pelletMat = new THREE.MeshStandardMaterial({ color: 0xc48a4a, flatShading: true });
for (let i = 0; i < 14; i++) {
  const p = new THREE.Mesh(pelletGeo, pelletMat);
  const a = Math.random() * Math.PI * 2, r = Math.random() * 5.5;
  p.position.set(Math.cos(a) * r, 1.38, Math.sin(a) * r);
  cage.add(p);
}
const rockGeo = new THREE.DodecahedronGeometry(0.4, 0);
for (let i = 0; i < 4; i++) {
  const rock = new THREE.Mesh(rockGeo,
    new THREE.MeshStandardMaterial({ color: 0xc9c9d9, flatShading: true }));
  const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 3.5;
  rock.position.set(Math.cos(a) * r, 1.5, Math.sin(a) * r);
  rock.rotation.set(Math.random(), Math.random(), Math.random());
  rock.castShadow = true;
  cage.add(rock);
}

// ============================================================
//  HAMSTERS
// ============================================================
const HAMSTER_COLORS = [0xf4a460, 0xffe4c4, 0x8b5a2b, 0xfff8dc, 0xdaa520, 0xffdab9];

function makeHamster(color) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, flatShading: true });
  const white = new THREE.MeshStandardMaterial({ color: 0xfffaf0, flatShading: true });

  // Body (squashed low-poly sphere)
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.62, 7, 5), mat);
  body.scale.set(1.15, 0.9, 1.3);
  body.position.y = 0.55;
  body.castShadow = true;
  g.add(body);

  // Belly
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.45, 6, 5), white);
  belly.scale.set(1, 0.7, 1);
  belly.position.set(0, 0.38, 0.28);
  g.add(belly);

  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 7, 5), mat);
  head.position.set(0, 0.85, 0.68);
  head.castShadow = true;
  g.add(head);

  // Cheeks
  [-1, 1].forEach(s => {
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.17, 5, 4), white);
    cheek.position.set(0.3 * s, 0.78, 0.95);
    g.add(cheek);
  });

  // Ears
  [-1, 1].forEach(s => {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.15, 5, 4), mat);
    ear.scale.y = 0.7;
    ear.position.set(0.28 * s, 1.2, 0.55);
    g.add(ear);
  });

  // Eyes + nose
  const dotMat = new THREE.MeshBasicMaterial({ color: 0x1a1a2e });
  [-1, 1].forEach(s => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 4), dotMat);
    eye.position.set(0.17 * s, 0.95, 1.05);
    g.add(eye);
  });
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 4),
    new THREE.MeshBasicMaterial({ color: 0xff8fa3 }));
  nose.position.set(0, 0.83, 1.1);
  g.add(nose);

  // Tiny nub tail
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.1, 4, 3), mat);
  tail.position.set(0, 0.55, -0.8);
  g.add(tail);

  // Legs (front & back, L/R)
  const legGeo = new THREE.BoxGeometry(0.16, 0.28, 0.16);
  const legs = [];
  [[0.3, 0.45], [-0.3, 0.45], [0.35, -0.45], [-0.35, -0.45]].forEach(([x, z]) => {
    const leg = new THREE.Mesh(legGeo, mat);
    leg.position.set(x, 0.16, z);
    g.add(leg);
    legs.push(leg);
  });

  g.userData = { body, head, legs, tail };
  return g;
}

// ============================================================
//  HAMSTER AI
// ============================================================
const WHEEL_POINT = new THREE.Vector3(-3.5, 1.3, -2.5);
const BOWL_POINT  = new THREE.Vector3(4, 1.3, 2.5);
const TUNNEL_POINT = new THREE.Vector3(2.5, 1.3, -3.5);

const hamsters = [];
for (let i = 0; i < 6; i++) {
  const mesh = makeHamster(HAMSTER_COLORS[i % HAMSTER_COLORS.length]);
  const a = Math.random() * Math.PI * 2, r = Math.random() * 4.5;
  mesh.position.set(Math.cos(a) * r, 1.3, Math.sin(a) * r);
  cage.add(mesh);

  hamsters.push({
    mesh,
    state: 'idle',
    timer: Math.random() * 2,
    heading: Math.random() * Math.PI * 2,
    speed: 1.2 + Math.random() * 0.8,
    target: null,
    phase: Math.random() * 10,
    onWheel: false,
    wheelSide: i % 2 === 0 ? 1 : -1
  });
}
// Assign one hamster to the wheel permanently — a little gym rat
hamsters[0].state = 'wheel';
hamsters[0].onWheel = true;
hamsters[0].mesh.position.copy(WHEEL_POINT);

function pickNewAction(h) {
  const roll = Math.random();
  if (roll < 0.45) {
    // wander: choose random heading, walk a while
    h.state = 'walk';
    h.heading = Math.random() * Math.PI * 2;
    h.timer = 1.5 + Math.random() * 2.5;
  } else if (roll < 0.65) {
    // go to bowl
    h.state = 'goto';
    h.target = BOWL_POINT.clone();
    h.nextState = 'eat';
    h.timer = 8; // safety timeout
  } else if (roll < 0.8) {
    // explore tunnel
    h.state = 'goto';
    h.target = TUNNEL_POINT.clone();
    h.nextState = 'tunnel';
    h.timer = 8;
  } else {
    h.state = 'idle';
    h.timer = 1 + Math.random() * 2.5;
  }
}

function setState(h, s) {
  h.state = s;
  h.timer = s === 'eat' ? 2 + Math.random() * 2 :
            s === 'tunnel' ? 1.5 + Math.random() :
            s === 'pauseTurn' ? 0.5 + Math.random() * 0.8 : 0;
}

let wheelSpeed = 0;

function updateHamster(h, dt, t) {
  const m = h.mesh;
  const u = m.userData;

  // ---- state logic ----
  if (h.state === 'wheel') {
    // Sit inside the wheel, facing sideways; wheel spins
    const side = h.wheelSide;
    m.position.set(-3.5 + 0.55 * side, 2.0, -2.5);
    m.rotation.y = side > 0 ? Math.PI / 2 : -Math.PI / 2;
    wheelSpeed = 4.5;
    // little running bob
    u.legs.forEach((leg, i) => leg.rotation.x = Math.sin(t * 14 + i * Math.PI) * 0.7);
    m.position.y = 2.0 + Math.abs(Math.sin(t * 7)) * 0.06;
    return;
  }

  switch (h.state) {
    case 'idle':
      h.timer -= dt;
      u.legs.forEach(l => l.rotation.x *= 0.85);
      // sniff / wiggle head
      u.head.rotation.x = Math.sin(t * 6 + h.phase) * 0.12;
      if (h.timer <= 0) pickNewAction(h);
      break;

    case 'walk':
      h.timer -= dt;
      m.rotation.y += 0; // steady
      m.position.x += Math.sin(h.heading) * h.speed * dt;
      m.position.z += Math.cos(h.heading) * h.speed * dt;
      // waddle + leg cycle
      m.rotation.z = Math.sin(t * 12 + h.phase) * 0.09;
      u.legs.forEach((leg, i) => leg.rotation.x = Math.sin(t * 12 + h.phase + i * Math.PI) * 0.8);
      // keep inside cage
      const d = Math.hypot(m.position.x, m.position.z);
      if (d > CAGE_R - 1.2) {
        setState(h, 'pauseTurn');
      }
      if (h.timer <= 0) setState(h, Math.random() < 0.5 ? 'idle' : 'pauseTurn');
      break;

    case 'pauseTurn':
      h.timer -= dt;
      m.rotation.y += dt * 2.5;
      u.legs.forEach(l => l.rotation.x *= 0.85);
      if (h.timer <= 0) {
        h.state = 'walk';
        h.heading = Math.random() * Math.PI * 2;
        h.timer = 1.5 + Math.random() * 2.5;
      }
      break;

    case 'goto': {
      h.timer -= dt;
      const dx = h.target.x - m.position.x, dz = h.target.z - m.position.z;
      const dist = Math.hypot(dx, dz);
      if (dist < 0.9 || h.timer <= 0) {
        setState(h, h.nextState);
      } else {
        const want = Math.atan2(dx, dz);
        // smooth turn toward target
        let diff = want - m.rotation.y;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        m.rotation.y += diff * Math.min(1, dt * 6);
        m.position.x += Math.sin(m.rotation.y) * h.speed * 1.3 * dt;
        m.position.z += Math.cos(m.rotation.y) * h.speed * 1.3 * dt;
        m.rotation.z = Math.sin(t * 13 + h.phase) * 0.09;
        u.legs.forEach((leg, i) => leg.rotation.x = Math.sin(t * 13 + h.phase + i * Math.PI) * 0.9);
      }
      break;
    }

    case 'eat':
      h.timer -= dt;
      // face the bowl, nod head rapidly, stuff cheeks
      const toBowl = Math.atan2(BOWL_POINT.x - m.position.x, BOWL_POINT.z - m.position.z);
      m.rotation.y += (toBowl - m.rotation.y) * Math.min(1, dt * 8);
      u.head.rotation.x = Math.sin(t * 16) * 0.3;
      const chew = 1 + Math.sin(t * 18) * 0.08;
      u.body.scale.x = 1.15 * chew;
      if (h.timer <= 0) { u.body.scale.x = 1.15; u.head.rotation.x = 0; pickNewAction(h); }
      break;

    case 'tunnel':
      h.timer -= dt;
      // hide: shrink into the tunnel mouth, then pop back
      const s = 0.6 + 0.4 * Math.abs(Math.sin(t * 3));
      m.scale.setScalar(h.timer < 0.6 ? 1 : s);
      if (h.timer <= 0) { m.scale.setScalar(1); pickNewAction(h); }
      break;
  }

  // idle tail twitch for everyone
  u.tail.rotation.x = Math.sin(t * 8 + h.phase) * 0.4;
}

// ============================================================
//  MAIN LOOP
// ============================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Hamsters
  for (const h of hamsters) updateHamster(h, dt, t);

  // Wheel physics: spin if runner active, else slow down
  let runnerActive = hamsters.some(h => h.state === 'wheel');
  wheelSpeed += ((runnerActive ? 4.5 : 0) - wheelSpeed) * Math.min(1, dt * 3);
  wheelSpin.rotation.z -= wheelSpeed * dt;

  // Gentle auto camera drift when not dragging (subtle)
  if (!dragging) cam.theta += dt * 0.03;
  updateCamera();

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
