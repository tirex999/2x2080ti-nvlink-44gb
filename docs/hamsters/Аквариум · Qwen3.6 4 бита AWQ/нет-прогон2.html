<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Аквариум с Реалистичными Рыбками</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #001e36; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* UI Overlay */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Пропускаем клики сквозь контейнер */
            display: flex;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .panel {
            background: rgba(0, 20, 40, 0.6);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            pointer-events: auto; /* Включаем клики для кнопок */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 300px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        p { font-size: 14px; line-height: 1.4; color: #ccc; }

        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
        .stat-val { font-weight: bold; color: #00d2ff; }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }

        button {
            background: linear-gradient(45deg, #005c97, #363795);
            border: none;
            padding: 10px 15px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 12px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
            background: linear-gradient(45deg, #363795, #005c97);
        }

        #stats-panel { text-align: right; }
    </style>
    
    <!-- Three.js Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-container">
        <div class="panel">
            <h1>AquaWorld 3D</h1>
            <p>Интерактивный аквариум.</p>
            <ul style="padding-left: 20px; margin: 10px 0;">
                <li><b>ЛКМ + Драг:</b> Вращение</li>
                <li><b>Колесо:</b> Зум</li>
                <li><b>Клик по воде:</b> Кормление</li>
            </ul>
            <div class="btn-group">
                <button onclick="addFish()">+ Рыбка</button>
                <button onclick="addBubbles()">+ Пузыри</button>
                <button onclick="toggleLights()">💡 Свет</button>
            </div>
        </div>

        <div class="panel" id="stats-panel">
            <div class="stat-row"><span>Рыбок:</span> <span class="stat-val" id="fish-count">15</span></div>
            <div class="stat-row"><span>FPS:</span> <span class="stat-val" id="fps-counter">60</span></div>
        </div>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        const CONFIG = {
            tankWidth: 36,
            tankHeight: 24,
            tankDepth: 20,
            fishCount: 15,
            colors: [0xff6600, 0x0066ff, 0xffaa00, 0xaa00ff, 0xff0000, 0x00ff00, 0xff69b4, 0xffd700]
        };

        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let scene, camera, renderer, controls;
        let clock, delta;
        let fishArray = [];
        let bubbles = [];
        let foods = [];
        let lightsOn = true;
        
        // Raycaster для кликов
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // FPS Counter Logic
        let frames = 0;
        let lastTime = performance.now();

        init();
        animate();

        function init() {
            // 1. Сцена и Камера
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x001e36);
            scene.fog = new THREE.FogExp2(0x001e36, 0.02);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 50);

            // 2. Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // 3. Контролы
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 1.8;
            controls.minDistance = 10;
            controls.maxDistance = 80;

            // 4. Освещение
            setupLights();

            // 5. Аквариум
            createTankEnvironment();

            // 6. Создание объектов
            for(let i=0; i<CONFIG.fishCount; i++) addFish();
            for(let i=0; i<30; i++) createBubble();

            // 7. Обработчики событий
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onMouseDown);

            clock = new THREE.Clock();
        }

        function setupLights() {
            // Ambient
            const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
            scene.add(ambientLight);

            // Directional (Sun)
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.name = "mainLight";
            scene.add(dirLight);

            // Underwater Point Lights
            const pointLight1 = new THREE.PointLight(0x00aaff, 0.8, 50);
            pointLight1.position.set(-10, 5, -5);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x0055ff, 0.8, 50);
            pointLight2.position.set(10, 5, 5);
            scene.add(pointLight2);
        }

        function createTankEnvironment() {
            // Glass Container
            const glassGeo = new THREE.BoxGeometry(CONFIG.tankWidth, CONFIG.tankHeight, CONFIG.tankDepth);
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                metalness: 0.1,
                roughness: 0.05,
                transmission: 0.95, // Прозрачность
                thickness: 0.5,
                transparent: true,
                opacity: 0.3,
                side: THREE.DoubleSide
            });
            const glass = new THREE.Mesh(glassGeo, glassMat);
            glass.receiveShadow = true;
            scene.add(glass);

            // Wireframe Edges
            const edges = new THREE.EdgesGeometry(glassGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x44aaff, opacity: 0.5, transparent: true }));
            scene.add(line);

            // Sand Floor
            const floorGeo = new THREE.PlaneGeometry(CONFIG.tankWidth, CONFIG.tankDepth, 32, 32);
            
            // Procedural Bumps
            const posAttribute = floorGeo.attributes.position;
            for (let i = 0; i < posAttribute.count; i++) {
                const x = posAttribute.getX(i);
                const y = posAttribute.getY(i);
                const z = posAttribute.getZ(i);
                // Slight random height variation
                posAttribute.setZ(i, z + Math.random() * 0.3); 
            }
            floorGeo.computeVertexNormals();

            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0xd2b48c, 
                roughness: 1,
                side: THREE.DoubleSide
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -CONFIG.tankHeight / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Rocks
            const rockGeo = new THREE.DodecahedronGeometry(1, 1);
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 });
            
            for(let i=0; i<8; i++) {
                const rock = new THREE.Mesh(rockGeo, rockMat);
                rock.scale.setScalar(Math.random() * 1.5 + 0.5);
                rock.position.set(
                    (Math.random() - 0.5) * (CONFIG.tankWidth - 4),
                    -CONFIG.tankHeight/2 + 0.5,
                    (Math.random() - 0.5) * (CONFIG.tankDepth - 4)
                );
                rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                rock.castShadow = true;
                rock.receiveShadow = true;
                scene.add(rock);
            }

            // Plants (TubeGeometry along curves)
            const plantMat = new THREE.MeshLambertMaterial({ color: 0x228b22 });
            
            for(let i=0; i<12; i++) {
                const points = [];
                const baseX = (Math.random() - 0.5) * (CONFIG.tankWidth - 2);
                const baseZ = (Math.random() - 0.5) * (CONFIG.tankDepth - 2);
                const height = Math.random() * 8 + 5;
                
                points.push(new THREE.Vector3(baseX, -CONFIG.tankHeight/2, baseZ));
                points.push(new THREE.Vector3(baseX + Math.random(), -CONFIG.tankHeight/2 + height/3, baseZ));
                points.push(new THREE.Vector3(baseX + Math.random(), -CONFIG.tankHeight/2 + height*2/3, baseZ));
                points.push(new THREE.Vector3(baseX + Math.random(), -CONFIG.tankHeight/2 + height, baseZ));

                const curve = new THREE.CatmullRomCurve3(points);
                const tubeGeo = new THREE.TubeGeometry(curve, 10, 0.2, 4, false);
                const plant = new THREE.Mesh(tubeGeo, plantMat);
                plant.userData = { 
                    originalPoints: points.map(p => p.clone()),
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 2
                };
                scene.add(plant);
                // We will animate plants in the loop manually or just let them be static for perf
                // To keep it simple and performant, we'll just add them. 
                // Advanced animation requires regenerating geometry every frame which is heavy.
                // Let's rely on light caustics or just static plants for this demo to ensure high FPS.
            }
        }

        // --- СОЗДАНИЕ РЫБКИ ---
        function createFishModel(color, scale) {
            const group = new THREE.Group();

            // Materials
            const bodyMat = new THREE.MeshPhongMaterial({ color: color, shininess: 100 });
            const finMat = new THREE.MeshPhongMaterial({ color: color, opacity: 0.8, transparent: true, side: THREE.DoubleSide });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

            // Body (Scaled Sphere)
            const bodyGeo = new THREE.SphereGeometry(1, 16, 12);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.scale.set(1.8, 0.8, 0.6); // Elongated
            body.castShadow = true;
            group.add(body);

            // Tail
            const tailGeo = new THREE.BufferGeometry();
            const tailVertices = new Float32Array([
                0, 0, 0,
                -1.5, 0.8, 0,
                -1.5, -0.8, 0
            ]);
            tailGeo.setAttribute('position', new THREE.BufferAttribute(tailVertices, 3));
            tailGeo.computeVertexNormals();
            const tail = new THREE.Mesh(tailGeo, finMat);
            tail.position.set(-1.6, 0, 0);
            group.add(tail);

            // Dorsal Fin (Top)
            const dorsalGeo = new THREE.BufferGeometry();
            const dorsalVerts = new Float32Array([
                0.5, 0.3, 0,
                -0.5, 1.2, 0,
                0.5, 0.3, 0.1
            ]);
            dorsalGeo.setAttribute('position', new THREE.BufferAttribute(dorsalVerts, 3));
            const dorsalFin = new THREE.Mesh(dorsalGeo, finMat);
            group.add(dorsalFin);

            // Pectoral Fins (Sides)
            const pectoralGeo = new THREE.BufferGeometry();
            const pecVerts = new Float32Array([
                0.2, -0.2, 0.2,
                0.5, -0.5, 0.8,
                0.2, -0.2, 0.3
            ]);
            pectoralGeo.setAttribute('position', new THREE.BufferAttribute(pecVerts, 3));
            
            const leftFin = new THREE.Mesh(pectoralGeo, finMat);
            leftFin.rotation.y = Math.PI / 4;
            group.add(leftFin);

            const rightFin = new THREE.Mesh(pectoralGeo, finMat);
            rightFin.scale.z = -1; // Mirror
            rightFin.rotation.y = -Math.PI / 4;
            group.add(rightFin);

            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(0.8, 0.2, 0.4);
            group.add(leftEye);
            
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.8, 0.2, -0.4);
            group.add(rightEye);

            // Pupils
            const pupilGeo = new THREE.SphereGeometry(0.06, 4, 4);
            const lPupil = new THREE.Mesh(pupilGeo, pupilMat);
            lPupil.position.set(0.05, 0, 0.1);
            leftEye.add(lPupil);

            const rPupil = new THREE.Mesh(pupilGeo, pupilMat);
            rPupil.position.set(0.05, 0, 0.1);
            rightEye.add(rPupil);

            group.scale.setScalar(scale);
            return { mesh: group, tail: tail, leftFin: leftFin, rightFin: rightFin, dorsalFin: dorsalFin };
        }

        function addFish() {
            const color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
            const scale = 0.6 + Math.random() * 0.6;
            
            const fishObj = createFishModel(color, scale);
            
            // Random Position inside tank
            const x = (Math.random() - 0.5) * (CONFIG.tankWidth - 4);
            const y = (Math.random() - 0.5) * (CONFIG.tankHeight - 4);
            const z = (Math.random() - 0.5) * (CONFIG.tankDepth - 4);
            
            fishObj.mesh.position.set(x, y, z);
            scene.add(fishObj.mesh);

            // Logic Data
            const fishData = {
                mesh: fishObj.mesh,
                tail: fishObj.tail,
                fins: [fishObj.leftFin, fishObj.rightFin, fishObj.dorsalFin],
                velocity: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().multiplyScalar(0.05 + Math.random()*0.05),
                speed: 0.1 + Math.random() * 0.15,
                turnSpeed: 0.05 + Math.random() * 0.05,
                tailSpeed: 5 + Math.random() * 5,
                phase: Math.random() * Math.PI * 2,
                targetFood: null,
                avoidanceRadius: 3.0,
                state: 'wander' // wander, flee, chase
            };

            fishArray.push(fishData);
            updateStats();
        }

        // --- СИСТЕМА ПУЗЫРЕЙ ---
        function createBubble() {
            const geo = new THREE.SphereGeometry(0.2 + Math.random()*0.3, 8, 8);
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                metalness: 0,
                roughness: 0,
                transmission: 0.9,
                transparent: true,
                opacity: 0.4
            });
            const bubble = new THREE.Mesh(geo, mat);
            
            bubble.position.set(
                (Math.random() - 0.5) * (CONFIG.tankWidth - 2),
                -CONFIG.tankHeight/2 + 1,
                (Math.random() - 0.5) * (CONFIG.tankDepth - 2)
            );
            
            scene.add(bubble);
            bubbles.push({
                mesh: bubble,
                speed: 0.05 + Math.random() * 0.1,
                wobblePhase: Math.random() * Math.PI * 2,
                wobbleSpeed: 2 + Math.random() * 3
            });
        }

        function addBubbles() {
            for(let i=0; i<10; i++) createBubble();
        }

        // --- СИСТЕМА КОРМЛЕНИЯ ---
        function spawnFood(x, y, z) {
            const geo = new THREE.SphereGeometry(0.15, 6, 6);
            const mat = new THREE.MeshLambertMaterial({ color: 0xffaa00 });
            const food = new THREE.Mesh(geo, mat);
            food.position.set(x, y, z);
            scene.add(food);
            
            foods.push({
                mesh: food,
                velocity: new THREE.Vector3((Math.random()-0.5)*0.01, -0.05, (Math.random()-0.5)*0.01) // Falling
            });
        }

        // --- ЛОГИКА ОБНОВЛЕНИЯ ---
        function updateFishLogic(dt, time) {
            // Обновление рыбок
            fishArray.forEach(fish => {
                // 1. Проверка еды
                if (!fish.targetFood) {
                    // Поиск ближайшей еды
                    let minDist = 15; // Radius detection
                    for (let f of foods) {
                        const dist = fish.mesh.position.distanceTo(f.mesh.position);
                        if (dist < minDist) {
                            minDist = dist;
                            fish.targetFood = f;
                            fish.state = 'chase';
                        }
                    }
                } else {
                    // Если цель съедена или исчезла
                    if (!foods.includes(fish.targetFood)) {
                        fish.targetFood = null;
                        fish.state = 'wander';
                    }
                }

                // 2. Избегание других рыб
                fish.velocity.add(new THREE.Vector3(0,0,0)); // Reset force
                
                fishArray.forEach(other => {
                    if (fish === other) return;
                    const dist = fish.mesh.position.distanceTo(other.mesh.position);
                    if (dist < fish.avoidanceRadius) {
                        const pushDir = new THREE.Vector3().subVectors(fish.mesh.position, other.mesh.position).normalize();
                        fish.velocity.add(pushDir.multiplyScalar(0.02)); // Push away
                    }
                });

                // 3. Движение
                if (fish.state === 'chase' && fish.targetFood) {
                    const targetPos = fish.targetFood.mesh.position;
                    const desiredVel = new THREE.Vector3().subVectors(targetPos, fish.mesh.position).normalize().multiplyScalar(fish.speed * 2); // Faster when eating
                    fish.velocity.lerp(desiredVel, 0.05);
                    
                    // Eat check
                    if (dist < 0.5) {
                         // Eaten!
                         scene.remove(fish.targetFood.mesh);
                         foods.splice(foods.indexOf(fish.targetFood), 1);
                         fish.targetFood = null;
                         fish.state = 'wander';
                         
                         // Grow
                         fish.mesh.scale.multiplyScalar(1.05);
                    }
                } else {
                    // Wander logic (random slight changes)
                    if (Math.random() < 0.02) {
                        fish.velocity.x += (Math.random() - 0.5) * 0.05;
                        fish.velocity.y += (Math.random() - 0.5) * 0.05;
                        fish.velocity.z += (Math.random() - 0.5) * 0.05;
                    }
                    // Normalize speed to prevent stopping or speeding up infinitely
                    fish.velocity.normalize().multiplyScalar(fish.speed);
                }

                // 4. Границы (Отскок)
                const bounds = {
                    x: CONFIG.tankWidth/2 - 1,
                    y: CONFIG.tankHeight/2 - 1,
                    z: CONFIG.tankDepth/2 - 1
                };

                const pos = fish.mesh.position;
                if (pos.x > bounds.x) { fish.velocity.x -= 0.02; }
                if (pos.x < -bounds.x) { fish.velocity.x += 0.02; }
                if (pos.y > bounds.y) { fish.velocity.y -= 0.02; }
                if (pos.y < -bounds.y) { fish.velocity.y += 0.02; }
                if (pos.z > bounds.z) { fish.velocity.z -= 0.02; }
                if (pos.z < -bounds.z) { fish.velocity.z += 0.02; }

                // Apply Velocity
                fish.mesh.position.add(fish.velocity);

                // 5. Вращение (LookAt direction of movement)
                // We look slightly ahead to make turning smoother
                const lookTarget = fish.mesh.position.clone().add(fish.velocity);
                fish.mesh.lookAt(lookTarget);

                // 6. Анимация плавников
                const tailWiggle = Math.sin(time * fish.tailSpeed + fish.phase) * 0.3;
                fish.tail.rotation.y = tailWiggle;
                
                fish.fins.forEach(fin => {
                    fin.rotation.z = Math.sin(time * fish.tailSpeed * 1.5 + fish.phase) * 0.2;
                });
            });
        }

        function updateEnvironment(dt, time) {
            // Bubbles
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                b.mesh.position.y += b.speed;
                b.mesh.position.x += Math.sin(time * b.wobbleSpeed + b.wobblePhase) * 0.02;
                b.mesh.position.z += Math.cos(time * b.wobbleSpeed + b.wobblePhase) * 0.02;

                if (b.mesh.position.y > CONFIG.tankHeight/2) {
                    // Reset to bottom
                    b.mesh.position.y = -CONFIG.tankHeight/2;
                    b.mesh.position.x = (Math.random() - 0.5) * CONFIG.tankWidth;
                    b.mesh.position.z = (Math.random() - 0.5) * CONFIG.tankDepth;
                }
            }

            // Food Physics
            for (let i = foods.length - 1; i >= 0; i--) {
                const f = foods[i];
                f.mesh.position.add(f.velocity);
                
                // Hit floor
                if (f.mesh.position.y < -CONFIG.tankHeight/2 + 0.2) {
                    scene.remove(f.mesh);
                    foods.splice(i, 1);
                }
            }
        }

        // --- УПРАВЛЕНИЕ ---
        function onMouseDown(event) {
            // Only left click spawns food, distinguish from OrbitControls drag
            // Simple heuristic: if mouse moves significantly, it's a drag. 
            // For simplicity here, we just cast ray.
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // Create an invisible plane at center Y to intersect with for easier clicking
            const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0); // Not used directly, simpler logic:
            
            // Just spawn food at a point along the ray within the tank
            const distance = 40; // Arbitrary depth
            const target = new THREE.Vector3();
            raycaster.ray.at(distance, target);

            // Check if inside tank bounds roughly
            if (target.x < CONFIG.tankWidth/2 && target.x > -CONFIG.tankWidth/2 &&
                target.y < CONFIG.tankHeight/2 && target.y > -CONFIG.tankHeight/2 &&
                target.z < CONFIG.tankDepth/2 && target.z > -CONFIG.tankDepth/2) {
                
                // Spawn slightly above camera ray intersection to simulate dropping
                spawnFood(target.x, CONFIG.tankHeight/2 - 1, target.z);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function toggleLights() {
            lightsOn = !lightsOn;
            scene.getObjectByName("mainLight").intensity = lightsOn ? 1.2 : 0.0;
        }

        function updateStats() {
            document.getElementById('fish-count').innerText = fishArray.length;
        }

        // --- ГЛАВНЫЙ ЦИКЛ ---
        function animate() {
            requestAnimationFrame(animate);

            delta = clock.getDelta();
            const time = clock.getElapsedTime();

            updateFishLogic(delta, time);
            updateEnvironment(delta, time);
            
            controls.update();
            renderer.render(scene, camera);

            // FPS Calculation
            frames++;
            const currentTime = performance.now();
            if (currentTime >= lastTime + 1000) {
                document.getElementById('fps-counter').innerText = frames;
                frames = 0;
                lastTime = currentTime;
            }
        }
    </script>
</body>
</html>
