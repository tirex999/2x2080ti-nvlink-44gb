<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Аквариум</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; }
canvas { display: block; }

#ui-left {
  position: absolute; top: 20px; left: 20px;
  background: rgba(0, 20, 60, 0.55);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(100, 180, 255, 0.25);
  border-radius: 16px; padding: 20px; color: #c8e6ff;
  min-width: 240px; z-index: 10;
  box-shadow: 0 8px 32px rgba(0, 40, 100, 0.4);
}
#ui-left h1 {
  font-size: 22px; margin-bottom: 12px;
  background: linear-gradient(135deg, #00d4ff, #7b68ee, #ff6ec7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; font-weight: 800; letter-spacing: 1px;
}
#ui-left .instructions {
  font-size: 12px; line-height: 1.7; color: #8ab4d8; margin-bottom: 16px;
  border-bottom: 1px solid rgba(100,180,255,0.15); padding-bottom: 12px;
}
#ui-left .instructions span { color: #5ce0ff; font-weight: 600; }

.btn {
  display: inline-block; padding: 8px 16px; margin: 4px 4px 4px 0;
  border: none; border-radius: 10px; cursor: pointer;
  font-size: 12px; font-weight: 600; color: #fff;
  transition: all 0.3s ease; letter-spacing: 0.5px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
.btn:active { transform: translateY(0); }
.btn-fish { background: linear-gradient(135deg, #ff6b35, #f7c948); }
.btn-bubble { background: linear-gradient(135deg, #00b4d8, #0077b6); }
.btn-light { background: linear-gradient(135deg, #ffd60a, #ff9500); }

#ui-right {
  position: absolute; top: 20px; right: 20px;
  background: rgba(0, 20, 60, 0.55);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(100, 180, 255, 0.25);
  border-radius: 16px; padding: 16px 20px; color: #c8e6ff;
  min-width: 160px; z-index: 10;
  box-shadow: 0 8px 32px rgba(0, 40, 100, 0.4);
}
#ui-right .stat {
  font-size: 13px; margin: 6px 0;
  display: flex; justify-content: space-between; align-items: center;
}
#ui-right .stat-label { color: #6a9ec0; }
#ui-right .stat-value { color: #00d4ff; font-weight: 700; font-size: 15px; }

#click-hint {
  position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: rgba(0, 20, 60, 0.6);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(100, 180, 255, 0.2);
  border-radius: 30px; padding: 10px 28px;
  color: #5ce0ff; font-size: 13px; z-index: 10;
  animation: pulse-hint 2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes pulse-hint {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}
</style>
</head>
<body>

<div id="ui-left">
  <h1>🐠 3D Аквариум</h1>
  <div class="instructions">
    <span>ЛКМ + движение</span> — вращение<br>
    <span>ПКМ + движение</span> — перемещение<br>
    <span>Колёсико</span> — масштаб<br>
    <span>Клик по воде</span> — покормить рыб
  </div>
  <button class="btn btn-fish" id="btnAddFish">🐟 Добавить рыбку</button>
  <button class="btn btn-bubble" id="btnBubbles">💨 Больше пузырей</button>
  <button class="btn btn-light" id="btnLight">💡 Свет</button>
</div>

<div id="ui-right">
  <div class="stat"><span class="stat-label">Рыбок:</span><span class="stat-value" id="fishCount">0</span></div>
  <div class="stat"><span class="stat-label">Пузырей:</span><span class="stat-value" id="bubbleCount">0</span></div>
  <div class="stat"><span class="stat-label">FPS:</span><span class="stat-value" id="fpsCounter">0</span></div>
</div>

<div id="click-hint">🍽️ Кликните по аквариуму, чтобы покормить рыбок!</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
//  SCENE SETUP
// ============================================================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x001020, 0.012);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 12, 45);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 1.8;
controls.target.set(0, 4, 0);

// ============================================================
//  LIGHTING
// ============================================================
const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
dirLight.position.set(15, 30, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 1;
dirLight.shadow.camera.far = 80;
dirLight.shadow.camera.left = -25;
dirLight.shadow.camera.right = 25;
dirLight.shadow.camera.top = 25;
dirLight.shadow.camera.bottom = -25;
dirLight.shadow.bias = -0.001;
scene.add(dirLight);

const pointLight1 = new THREE.PointLight(0x0088cc, 0.8, 40);
pointLight1.position.set(-10, 15, -5);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0x0044aa, 0.6, 35);
pointLight2.position.set(10, 10, 5);
scene.add(pointLight2);

let lightOn = true;

// ============================================================
//  AQUARIUM DIMENSIONS
// ============================================================
const AW = 36, AH = 24, AD = 20;
const HW = AW / 2, HH = AH / 2, HD = AD / 2;

// ============================================================
//  BACKGROUND GRADIENT
// ============================================================
function createGradientBG() {
  const canvas = document.createElement('canvas');
  canvas.width = 2; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, '#001830');
  grad.addColorStop(0.5, '#002040');
  grad.addColorStop(1, '#001020');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 2, 512);
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.LinearFilter;
  scene.background = tex;
}
createGradientBG();

// ============================================================
//  SANDY BOTTOM
// ============================================================
function createSand() {
  const geo = new THREE.PlaneGeometry(AW + 4, AD + 4, 80, 60);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const noise = Math.sin(x * 0.3) * 0.3 + Math.cos(y * 0.4) * 0.2 +
                  Math.sin(x * 0.7 + y * 0.5) * 0.15;
    pos.setZ(i, noise);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    color: 0xd4a56a, roughness: 0.9, metalness: 0.0,
    side: THREE.DoubleSide
  });
  const sand = new THREE.Mesh(geo, mat);
  sand.rotation.x = -Math.PI / 2;
  sand.position.y = -HH + 0.5;
  sand.receiveShadow = true;
  scene.add(sand);
}
createSand();

// ============================================================
//  GLASS TANK
// ============================================================
function createTank() {
  // Glass walls
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, transparent: true, opacity: 0.12,
    transmission: 0.95, roughness: 0.05, metalness: 0.0,
    side: THREE.DoubleSide, depthWrite: false
  });

  // Back wall
  const backGeo = new THREE.PlaneGeometry(AW, AH);
  const backWall = new THREE.Mesh(backGeo, glassMat);
  backWall.position.set(0, 0, -HD);
  scene.add(backWall);

  // Front wall
  const frontWall = new THREE.Mesh(backGeo, glassMat.clone());
  frontWall.position.set(0, 0, HD);
  scene.add(frontWall);

  // Left wall
  const sideGeo = new THREE.PlaneGeometry(AD, AH);
  const leftWall = new THREE.Mesh(sideGeo, glassMat.clone());
  leftWall.position.set(-HW, 0, 0);
  leftWall.rotation.y = Math.PI / 2;
  scene.add(leftWall);

  // Right wall
  const rightWall = new THREE.Mesh(sideGeo, glassMat.clone());
  rightWall.position.set(HW, 0, 0);
  rightWall.rotation.y = Math.PI / 2;
  scene.add(rightWall);

  // Top
  const topGeo = new THREE.PlaneGeometry(AW, AD);
  const topWall = new THREE.Mesh(topGeo, glassMat.clone());
  topWall.position.set(0, HH, 0);
  topWall.rotation.x = Math.PI / 2;
  scene.add(topWall);

  // Bottom glass
  const bottomWall = new THREE.Mesh(topGeo, glassMat.clone());
  bottomWall.position.set(0, -HH, 0);
  bottomWall.rotation.x = Math.PI / 2;
  scene.add(bottomWall);

  // Wireframe edges
  const edgesGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(AW, AH, AD));
  const edgesMat = new THREE.LineBasicMaterial({ color: 0x3388bb, transparent: true, opacity: 0.4 });
  const edges = new THREE.LineSegments(edgesGeo, edgesMat);
  scene.add(edges);
}
createTank();

// ============================================================
//  ROCKS
// ============================================================
function createRocks() {
  const rockColors = [0x808080, 0x6a6a6a, 0x909090, 0x707070, 0x888888, 0x606060, 0x7a7a7a, 0x8a8a8a];
  for (let i = 0; i < 8; i++) {
    const geo = new THREE.DodecahedronGeometry(1 + Math.random() * 1.2, 1);
    const posArr = geo.attributes.position;
    for (let j = 0; j < posArr.count; j++) {
      const x = posArr.getX(j) + (Math.random() - 0.5) * 0.4;
      const y = posArr.getY(j) + (Math.random() - 0.5) * 0.4;
      const z = posArr.getZ(j) + (Math.random() - 0.5) * 0.4;
      posArr.setXYZ(j, x, y, z);
    }
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      color: rockColors[i], roughness: 0.85, metalness: 0.05
    });
    const rock = new THREE.Mesh(geo, mat);
    rock.position.set(
      (Math.random() - 0.5) * (AW - 6),
      -HH + 1 + Math.random() * 2,
      (Math.random() - 0.5) * (AD - 6)
    );
    rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    rock.scale.setScalar(0.5 + Math.random() * 0.8);
    rock.castShadow = true;
    rock.receiveShadow = true;
    scene.add(rock);
  }
}
createRocks();

// ============================================================
//  SEAWEED
// ============================================================
const seaweeds = [];
function createSeaweed() {
  for (let i = 0; i < 12; i++) {
    const height = 4 + Math.random() * 6;
    const segments = 8 + Math.floor(Math.random() * 5);
    const points = [];
    for (let j = 0; j <= segments; j++) {
      const t = j / segments;
      points.push(new THREE.Vector3(
        Math.sin(t * 3) * 0.8,
        t * height,
        Math.cos(t * 2.5) * 0.5
      ));
    }
    const curve = new THREE.CatmullRomCurve3(points);
    const tubeGeo = new THREE.TubeGeometry(curve, segments * 2, 0.15 + Math.random() * 0.1, 6, false);
    const greenShade = 0x1a6b30 + Math.floor(Math.random() * 0x204010);
    const mat = new THREE.MeshStandardMaterial({
      color: greenShade, roughness: 0.7, metalness: 0.0, side: THREE.DoubleSide
    });
    const weed = new THREE.Mesh(tubeGeo, mat);
    weed.position.set(
      (Math.random() - 0.5) * (AW - 8),
      -HH + 0.5,
      (Math.random() - 0.5) * (AD - 8)
    );
    weed.castShadow = true;
    weed.userData = { phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 0.8 };
    scene.add(weed);
    seaweeds.push(weed);
  }
}
createSeaweed();

// ============================================================
//  FISH COLORS
// ============================================================
const FISH_COLORS = [
  { body: 0xff6b35, fin: 0xff8c42 },   // orange
  { body: 0x2266dd, fin: 0x4488ee },   // blue
  { body: 0xffaa00, fin: 0xff4444 },   // yellow-red
  { body: 0x9933cc, fin: 0xbb55ee },   // purple
  { body: 0xdd2222, fin: 0xff5555 },   // red
  { body: 0x22aa44, fin: 0x44cc66 },   // green
  { body: 0xff66aa, fin: 0xff88cc },   // pink
  { body: 0xdaa520, fin: 0xf0c040 },   // gold
];

// ============================================================
//  CREATE FISH
// ============================================================
const fishArray = [];
const foodArray = [];

function createFishModel(colorScheme, scale) {
  const group = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({
    color: colorScheme.body, roughness: 0.3, metalness: 0.2
  });
  const finMat = new THREE.MeshStandardMaterial({
    color: colorScheme.fin, roughness: 0.4, metalness: 0.15,
    transparent: true, opacity: 0.85
  });
  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });

  // Body - stretched sphere
  const bodyGeo = new THREE.SphereGeometry(1, 12, 10);
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.scale.set(0.55, 0.4, 1.3);
  body.castShadow = true;
  group.add(body);

  // Head area - slightly larger front
  const headGeo = new THREE.SphereGeometry(0.55, 10, 8);
  const head = new THREE.Mesh(headGeo, bodyMat);
  head.position.set(0, 0, 0.65);
  head.scale.set(0.7, 0.65, 0.6);
  group.add(head);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.12, 8, 6);
  const pupilGeo = new THREE.SphereGeometry(0.07, 6, 4);

  const leftEye = new THREE.Mesh(eyeGeo, eyeWhiteMat);
  leftEye.position.set(0.35, 0.15, 0.75);
  group.add(leftEye);
  const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
  leftPupil.position.set(0.42, 0.15, 0.85);
  group.add(leftPupil);

  const rightEye = new THREE.Mesh(eyeGeo, eyeWhiteMat);
  rightEye.position.set(-0.35, 0.15, 0.75);
  group.add(rightEye);
  const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
  rightPupil.position.set(-0.42, 0.15, 0.85);
  group.add(rightPupil);

  // Tail
  const tailGeo = new THREE.SphereGeometry(0.5, 8, 6);
  const tailMat = new THREE.MeshStandardMaterial({
    color: colorScheme.fin, roughness: 0.35, metalness: 0.1,
    transparent: true, opacity: 0.8
  });
  const tail = new THREE.Mesh(tailGeo, tailMat);
  tail.scale.set(0.3, 0.7, 0.5);
  tail.position.set(0, 0, -1.2);
  tail.castShadow = true;
  group.add(tail);

  // Dorsal fin (top)
  const dorsalGeo = new THREE.SphereGeometry(0.35, 6, 5);
  const dorsalFin = new THREE.Mesh(dorsalGeo, finMat);
  dorsalFin.scale.set(0.15, 0.8, 0.5);
  dorsalFin.position.set(0, 0.45, -0.1);
  group.add(dorsalFin);

  // Left pectoral fin
  const leftFin = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 6, 5), finMat
  );
  leftFin.scale.set(0.12, 0.5, 0.4);
  leftFin.position.set(0.4, -0.1, 0.2);
  group.add(leftFin);

  // Right pectoral fin
  const rightFin = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 6, 5), finMat
  );
  rightFin.scale.set(0.12, 0.5, 0.4);
  rightFin.position.set(-0.4, -0.1, 0.2);
  group.add(rightFin);

  // Anal fin (bottom)
  const analFin = new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 6, 4), finMat
  );
  analFin.scale.set(0.12, 0.5, 0.35);
  analFin.position.set(0, -0.4, -0.3);
  group.add(analFin);

  group.scale.setScalar(scale);
  return { group, tail, leftFin, rightFin, dorsalFin, analFin };
}

function addFish() {
  const cs = FISH_COLORS[Math.floor(Math.random() * FISH_COLORS.length)];
  const scale = 0.6 + Math.random() * 0.6;
  const model = createFishModel(cs, scale);

  const fish = {
    mesh: model.group,
    tail: model.tail,
    leftFin: model.leftFin,
    rightFin: model.rightFin,
    dorsalFin: model.dorsalFin,
    analFin: model.analFin,
    velocity: new THREE.Vector3(
      (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * 0.5,
      (Math.random() - 0.5) * 2
    ).normalize().multiplyScalar(1.5 + Math.random()),
    speed: 1.5 + Math.random() * 1.5,
    tailSpeed: 3 + Math.random() * 4,
    phase: Math.random() * Math.PI * 2,
    targetFood: null,
    avoidanceRadius: 3 + Math.random(),
    scale: scale,
    growAmount: 0
  };

  // Random position inside tank
  fish.mesh.position.set(
    (Math.random() - 0.5) * (AW - 6),
    (Math.random() - 0.5) * (AH - 6),
    (Math.random() - 0.5) * (AD - 6)
  );

  scene.add(fish.mesh);
  fishArray.push(fish);
  updateUI();
}

// Start with 15 fish
for (let i = 0; i < 15; i++) addFish();

// ============================================================
//  BUBBLES
// ============================================================
const bubbleArray = [];

function createBubble() {
  const geo = new THREE.SphereGeometry(0.15 + Math.random() * 0.2, 8, 6);
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xaaddff, transparent: true, opacity: 0.3,
    transmission: 0.9, roughness: 0.0, metalness: 0.0,
    clearcoat: 1.0, clearcoatRoughness: 0.0
  });
  const bubble = new THREE.Mesh(geo, mat);
  resetBubble(bubble);
  scene.add(bubble);
  bubbleArray.push(bubble);
  return bubble;
}

function resetBubble(bubble) {
  bubble.position.set(
    (Math.random() - 0.5) * (AW - 4),
    -HH + 1 + Math.random() * 2,
    (Math.random() - 0.5) * (AD - 4)
  );
  bubble.userData.speed = 1.5 + Math.random() * 2;
  bubble.userData.phaseX = Math.random() * Math.PI * 2;
  bubble.userData.phaseZ = Math.random() * Math.PI * 2;
  bubble.userData.amplitudeX = 0.3 + Math.random() * 0.5;
  bubble.userData.amplitudeZ = 0.2 + Math.random() * 0.4;
}

// Start with 30 bubbles
for (let i = 0; i < 30; i++) createBubble();

// ============================================================
//  FOOD SYSTEM
// ============================================================
function createFood(x, y, z) {
  const geo = new THREE.SphereGeometry(0.2, 8, 6);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xcc6622, roughness: 0.6, metalness: 0.1,
    emissive: 0x441100, emissiveIntensity: 0.3
  });
  const food = new THREE.Mesh(geo, mat);
  food.position.set(x, y, z);
  food.userData = {
    vy: 0,
    gravity: -8,
    eaten: false
  };
  scene.add(food);
  foodArray.push(food);
}

// Raycaster for clicking
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Create a plane at the click direction to find where in the tank we clicked
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1).applyQuaternion(camera.quaternion), 0);
  const target = new THREE.Vector3();
  raycaster.ray.intersectPlane(plane, target);

  if (target) {
    // Clamp to tank bounds
    const fx = Math.max(-HW + 1, Math.min(HW - 1, target.x));
    const fy = Math.min(HH - 1, Math.max(-HH + 2, target.y));
    const fz = Math.max(-HD + 1, Math.min(HD - 1, target.z));
    createFood(fx, fy, fz);
  }
});

// ============================================================
//  ANIMATION LOOP
// ============================================================
let lastTime = performance.now();
let frameCount = 0;
let fps = 0;
let fpsTimer = 0;

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  // FPS counter
  frameCount++;
  fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    fps = Math.round(frameCount / fpsTimer);
    document.getElementById('fpsCounter').textContent = fps;
    frameCount = 0;
    fpsTimer = 0;
  }

  controls.update();

  // ---- FISH AI & ANIMATION ----
  for (let i = 0; i < fishArray.length; i++) {
    const fish = fishArray[i];
    const pos = fish.mesh.position;
    const vel = fish.velocity;

    // ---- Avoidance from other fish ----
    for (let j = 0; j < fishArray.length; j++) {
      if (i === j) continue;
      const other = fishArray[j].mesh.position;
      const diff = new THREE.Vector3().subVectors(pos, other);
      const dist = diff.length();
      if (dist < fish.avoidanceRadius && dist > 0.01) {
        const force = diff.normalize().multiplyScalar((fish.avoidanceRadius - dist) / fish.avoidanceRadius * 3);
        vel.add(force.multiplyScalar(dt));
      }
    }

    // ---- Wall avoidance ----
    const margin = 2;
    const turnStrength = 2.0;
    if (pos.x > HW - margin) vel.x -= turnStrength * dt * (pos.x - (HW - margin)) * 2;
    if (pos.x < -HW + margin) vel.x += turnStrength * dt * ((-HW + margin) - pos.x) * 2;
    if (pos.y > HH - margin) vel.y -= turnStrength * dt * (pos.y - (HH - margin)) * 2;
    if (pos.y < -HH + margin) vel.y += turnStrength * dt * ((-HH + margin) - pos.y) * 2;
    if (pos.z > HD - margin) vel.z -= turnStrength * dt * (pos.z - (HD - margin)) * 2;
    if (pos.z < -HD + margin) vel.z += turnStrength * dt * ((-HD + margin) - pos.z) * 2;

    // ---- Random wandering ----
    if (!fish.targetFood) {
      if (Math.random() < 0.01) {
        vel.x += (Math.random() - 0.5) * 2;
        vel.y += (Math.random() - 0.5) * 0.5;
        vel.z += (Math.random() - 0.5) * 2;
      }
    }

    // ---- Food chasing ----
    if (fish.targetFood && !fish.targetFood.userData.eaten) {
      const foodPos = fish.targetFood.position;
      const toFood = new THREE.Vector3().subVectors(foodPos, pos);
      const distToFood = toFood.length();
      if (distToFood < 15) {
        vel.add(toFood.normalize().multiplyScalar(3 * dt));
      } else {
        fish.targetFood = null;
      }
      // Eat food
      if (distToFood < 0.8) {
        fish.targetFood.userData.eaten = true;
        fish.growAmount += 0.05;
        fish.targetFood = null;
      }
    } else {
      fish.targetFood = null;
    }

    // Check for nearby food if no target
    if (!fish.targetFood) {
      let closestDist = 15;
      let closestFood = null;
      for (const food of foodArray) {
        if (food.userData.eaten) continue;
        const d = pos.distanceTo(food.position);
        if (d < closestDist) {
          closestDist = d;
          closestFood = food;
        }
      }
      if (closestFood) fish.targetFood = closestFood;
    }

    // ---- Normalize velocity ----
    const currentSpeed = vel.length();
    if (currentSpeed > 0.01) {
      const targetSpd = fish.targetFood ? fish.speed * 1.8 : fish.speed;
      const newSpeed = THREE.MathUtils.lerp(currentSpeed, targetSpd, dt * 2);
      vel.normalize().multiplyScalar(newSpeed);
    }

    // ---- Move ----
    pos.add(vel.clone().multiplyScalar(dt));

    // ---- Rotation towards movement ----
    if (currentSpeed > 0.05) {
      const targetDir = vel.clone().normalize();
      const currentForward = new THREE.Vector3(0, 0, 1).applyQuaternion(fish.mesh.quaternion);
      const angle = Math.acos(Math.min(1, Math.max(-1, currentForward.dot(targetDir))));
      const axis = new THREE.Vector3().crossVectors(currentForward, targetDir).normalize();
      if (axis.length() > 0.001) {
        const rotQuat = new THREE.Quaternion().setFromAxisAngle(axis, angle);
        fish.mesh.quaternion.slerp(rotQuat, dt * 5);
      }
    }

    // ---- Grow ----
    if (fish.growAmount > 0) {
      fish.scale += fish.growAmount * dt;
      fish.growAmount *= 0.95;
      if (fish.growAmount < 0.001) fish.growAmount = 0;
      fish.mesh.scale.setScalar(fish.scale);
    }

    // ---- Tail animation ----
    const tailAngle = Math.sin(now * 0.001 * fish.tailSpeed + fish.phase) * 0.4;
    fish.tail.rotation.y = tailAngle;
    fish.tail.rotation.x = Math.sin(now * 0.001 * fish.tailSpeed * 0.7 + fish.phase) * 0.15;

    // ---- Fin animation ----
    const finAngle = Math.sin(now * 0.001 * fish.tailSpeed * 1.2 + fish.phase + 1) * 0.25;
    fish.leftFin.rotation.z = finAngle;
    fish.rightFin.rotation.z = -finAngle;
    fish.dorsalFin.rotation.x = Math.sin(now * 0.001 * fish.tailSpeed * 0.8 + fish.phase) * 0.1;
    fish.analFin.rotation.x = Math.sin(now * 0.001 * fish.tailSpeed * 0.8 + fish.phase + 0.5) * 0.1;
  }

  // ---- Remove eaten food ----
  for (let i = foodArray.length - 1; i >= 0; i--) {
    const food = foodArray[i];
    if (food.userData.eaten) {
      scene.remove(food);
      food.geometry.dispose();
      food.material.dispose();
      foodArray.splice(i, 1);
      continue;
    }
    // Gravity
    food.userData.vy += food.userData.gravity * dt;
    food.position.y += food.userData.vy * dt;
    // Hit bottom
    if (food.position.y < -HH + 1) {
      food.position.y = -HH + 1;
      food.userData.vy = 0;
      // Remove after settling
      food.userData.settled = (food.userData.settled || 0) + dt;
      if (food.userData.settled > 3) {
        scene.remove(food);
        food.geometry.dispose();
        food.material.dispose();
        foodArray.splice(i, 1);
      }
    }
  }

  // ---- Bubbles ----
  for (const bubble of bubbleArray) {
    bubble.position.y += bubble.userData.speed * dt;
    bubble.position.x += Math.sin(now * 0.001 * bubble.userData.speed + bubble.userData.phaseX) * bubble.userData.amplitudeX * dt;
    bubble.position.z += Math.cos(now * 0.001 * bubble.userData.speed * 0.8 + bubble.userData.phaseZ) * bubble.userData.amplitudeZ * dt;
    if (bubble.position.y > HH - 1) {
      resetBubble(bubble);
    }
  }

  // ---- Seaweed sway ----
  for (const weed of seaweeds) {
    const p = weed.userData;
    weed.rotation.x = Math.sin(now * 0.001 * p.speed + p.phase) * 0.08;
    weed.rotation.z = Math.cos(now * 0.0008 * p.speed + p.phase) * 0.06;
  }

  // ---- Underwater light flicker ----
  pointLight1.intensity = 0.8 + Math.sin(now * 0.002) * 0.15;
  pointLight2.intensity = 0.6 + Math.cos(now * 0.0015) * 0.1;

  renderer.render(scene, camera);
}

// ============================================================
//  UI BUTTONS
// ============================================================
function updateUI() {
  document.getElementById('fishCount').textContent = fishArray.length;
  document.getElementById('bubbleCount').textContent = bubbleArray.length;
}

document.getElementById('btnAddFish').addEventListener('click', () => {
  addFish();
});

document.getElementById('btnBubbles').addEventListener('click', () => {
  for (let i = 0; i < 10; i++) createBubble();
  updateUI();
});

document.getElementById('btnLight').addEventListener('click', () => {
  lightOn = !lightOn;
  dirLight.intensity = lightOn ? 1.2 : 0.15;
  ambientLight.intensity = lightOn ? 0.4 : 0.15;
  document.getElementById('btnLight').textContent = lightOn ? '💡 Свет' : '🌙 Темнота';
});

// ============================================================
//  RESIZE
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

updateUI();
animate();
</script>
</body>
</html>
