<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Аквариум</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a1628; }
canvas { display: block; }

#ui-left {
  position: fixed; top: 20px; left: 20px; z-index: 100;
  background: rgba(10, 25, 50, 0.75);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(100, 180, 255, 0.2);
  border-radius: 16px; padding: 20px; color: #c8e6ff;
  min-width: 240px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
}
#ui-left h1 {
  font-size: 22px; margin-bottom: 4px;
  background: linear-gradient(135deg, #00d4ff, #7b68ee, #ff6ec7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
#ui-left .subtitle { font-size: 11px; color: #6a9fbb; margin-bottom: 14px; }
#ui-left .instructions { font-size: 12px; line-height: 1.7; color: #8ab8d4; margin-bottom: 16px; }
#ui-left .instructions span { color: #5ce0e0; font-weight: bold; }

.btn {
  display: inline-block; padding: 8px 16px; margin: 4px 4px 4px 0;
  border: none; border-radius: 10px; cursor: pointer;
  font-size: 12px; font-weight: 600; color: #fff;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); filter: brightness(1.2); }
.btn:active { transform: translateY(0); }
.btn-fish { background: linear-gradient(135deg, #ff6b35, #ff8c42); }
.btn-bubble { background: linear-gradient(135deg, #00b4d8, #48cae4); }
.btn-light { background: linear-gradient(135deg, #f9c74f, #f8961e); }

#ui-right {
  position: fixed; top: 20px; right: 20px; z-index: 100;
  background: rgba(10, 25, 50, 0.75);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(100, 180, 255, 0.2);
  border-radius: 16px; padding: 16px 20px; color: #c8e6ff;
  min-width: 160px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
}
#ui-right .stat { font-size: 13px; margin: 4px 0; display: flex; justify-content: space-between; }
#ui-right .stat-val { color: #5ce0e0; font-weight: bold; }
#ui-right .stat-label { color: #6a9fbb; }

#click-hint {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(10, 25, 50, 0.7);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(100, 180, 255, 0.15);
  border-radius: 12px; padding: 10px 24px;
  color: #8ab8d4; font-size: 13px; z-index: 100;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  animation: pulse-hint 3s ease-in-out infinite;
}
@keyframes pulse-hint {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}
</style>
</head>
<body>

<div id="ui-left">
  <h1>🐠 3D Аквариум</h1>
  <div class="subtitle">Интерактивная симуляция</div>
  <div class="instructions">
    <span>ЛКМ + движение</span> — вращение<br>
    <span>ПКМ + движение</span> — перемещение<br>
    <span>Колёсико</span> — зум<br>
    <span>Клик по воде</span> — кормление
  </div>
  <button class="btn btn-fish" onclick="addFish()">🐟 Добавить рыбку</button>
  <button class="btn btn-bubble" onclick="addBubbles()">💧 Больше пузырей</button>
  <button class="btn btn-light" onclick="toggleLight()">💡 Свет</button>
</div>

<div id="ui-right">
  <div class="stat"><span class="stat-label">Рыбки:</span><span class="stat-val" id="fish-count">0</span></div>
  <div class="stat"><span class="stat-label">Пузыри:</span><span class="stat-val" id="bubble-count">0</span></div>
  <div class="stat"><span class="stat-label">Корм:</span><span class="stat-val" id="food-count">0</span></div>
  <div class="stat"><span class="stat-label">FPS:</span><span class="stat-val" id="fps-display">0</span></div>
</div>

<div id="click-hint">🖱️ Кликните по аквариуму, чтобы покормить рыбок</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ===================== SCENE SETUP =====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1e3d);
scene.fog = new THREE.FogExp2(0x0a1e3d, 0.012);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 10, 45);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 1.8;
controls.target.set(0, 2, 0);

// ===================== LIGHTING =====================
const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
dirLight.position.set(15, 30, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 1;
dirLight.shadow.camera.far = 80;
dirLight.shadow.camera.left = -25;
dirLight.shadow.camera.right = 25;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -10;
dirLight.shadow.bias = -0.001;
scene.add(dirLight);

const pointLight1 = new THREE.PointLight(0x00aaff, 0.6, 50);
pointLight1.position.set(-10, 12, -5);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0x0066cc, 0.5, 50);
pointLight2.position.set(10, 8, 5);
scene.add(pointLight2);

let lightOn = true;

function toggleLight() {
  lightOn = !lightOn;
  dirLight.intensity = lightOn ? 0.8 : 0.15;
  pointLight1.intensity = lightOn ? 0.6 : 0.1;
  pointLight2.intensity = lightOn ? 0.5 : 0.1;
  ambientLight.intensity = lightOn ? 0.4 : 0.2;
}

// ===================== TANK DIMENSIONS =====================
const TW = 36, TH = 24, TD = 20;
const HW = TW / 2, HH = TH / 2, HD = TD / 2;

// ===================== GLASS TANK =====================
const glassGeo = new THREE.BoxGeometry(TW, TH, TD);
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xaaddff,
  transparent: true,
  opacity: 0.12,
  transmission: 0.95,
  roughness: 0.05,
  metalness: 0.0,
  side: THREE.DoubleSide,
  depthWrite: false
});
const glassMesh = new THREE.Mesh(glassGeo, glassMat);
glassMesh.position.y = TH / 2 - 1;
scene.add(glassMesh);

// Wireframe edges
const edgesGeo = new THREE.EdgesGeometry(glassGeo);
const edgesMat = new THREE.LineBasicMaterial({ color: 0x4488aa, transparent: true, opacity: 0.35 });
const edgesLine = new THREE.LineSegments(edgesGeo, edgesMat);
edgesLine.position.copy(glassMesh.position);
scene.add(edgesLine);

// ===================== SANDY BOTTOM =====================
const sandGeo = new THREE.PlaneGeometry(TW - 1, TD - 1, 60, 40);
const sandVerts = sandGeo.attributes.position;
for (let i = 0; i < sandVerts.count; i++) {
  const x = sandVerts.getX(i);
  const y = sandVerts.getY(i);
  const bump = Math.sin(x * 0.3) * 0.3 + Math.cos(y * 0.4) * 0.25 + Math.sin(x * 0.7 + y * 0.5) * 0.15;
  sandVerts.setZ(i, bump);
}
sandGeo.computeVertexNormals();
const sandMat = new THREE.MeshStandardMaterial({
  color: 0xd4a76a,
  roughness: 0.9,
  metalness: 0.0
});
const sandMesh = new THREE.Mesh(sandGeo, sandMat);
sandMesh.rotation.x = -Math.PI / 2;
sandMesh.position.y = -0.5;
sandMesh.receiveShadow = true;
scene.add(sandMesh);

// ===================== ROCKS =====================
const rocks = [];
const rockColors = [0x6b6b6b, 0x7a7060, 0x5a5a5a, 0x8a7a6a, 0x4a4a4a, 0x9a8a7a, 0x605050, 0x706060];
for (let i = 0; i < 8; i++) {
  const rGeo = new THREE.DodecahedronGeometry(0.8 + Math.random() * 1.2, 1);
  // Deform vertices
  const rVerts = rGeo.attributes.position;
  for (let j = 0; j < rVerts.count; j++) {
    const x = rVerts.getX(j);
    const y = rVerts.getY(j);
    const z = rVerts.getZ(j);
    const noise = 1 + (Math.sin(x * 3.7 + y * 2.1) * 0.25 + Math.cos(z * 4.3 + x * 1.7) * 0.2);
    rVerts.setX(j, x * noise);
    rVerts.setY(j, y * noise);
    rVerts.setZ(j, z * noise);
  }
  rGeo.computeVertexNormals();
  const rMat = new THREE.MeshStandardMaterial({
    color: rockColors[i],
    roughness: 0.85,
    metalness: 0.1
  });
  const rock = new THREE.Mesh(rGeo, rMat);
  rock.position.set(
    (Math.random() - 0.5) * (TW - 6),
    0.5 + Math.random() * 0.5,
    (Math.random() - 0.5) * (TD - 6)
  );
  rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
  rocks.push(rock);
}

// ===================== PLANTS =====================
const plants = [];
const plantColors = [0x2d8a4e, 0x3a9e5c, 0x1e7a3e, 0x45a864, 0x287a44, 0x358a55];

function createPlant(x, z) {
  const height = 4 + Math.random() * 6;
  const segments = 8 + Math.floor(Math.random() * 5);
  const points = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    points.push(new THREE.Vector3(
      Math.sin(t * Math.PI * (1.5 + Math.random())) * 0.8,
      t * height,
      Math.cos(t * Math.PI * (1.2 + Math.random())) * 0.5
    ));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  const tubeGeo = new THREE.TubeGeometry(curve, 20, 0.12 + Math.random() * 0.08, 6, false);
  const pColor = plantColors[Math.floor(Math.random() * plantColors.length)];
  const pMat = new THREE.MeshStandardMaterial({
    color: pColor,
    roughness: 0.7,
    metalness: 0.0,
    side: THREE.DoubleSide
  });
  const plant = new THREE.Mesh(tubeGeo, pMat);
  plant.position.set(x, -0.5, z);
  plant.castShadow = true;
  plant.userData.phase = Math.random() * Math.PI * 2;
  plant.userData.swaySpeed = 0.5 + Math.random() * 1.0;
  scene.add(plant);
  plants.push(plant);
}

for (let i = 0; i < 12; i++) {
  const px = (Math.random() - 0.5) * (TW - 4);
  const pz = (Math.random() - 0.5) * (TD - 4);
  createPlant(px, pz);
}

// ===================== FISH COLORS =====================
const fishColorSchemes = [
  { body: 0xff6b35, fin: 0xff8c42, accent: 0xffaa55 },   // orange
  { body: 0x2266dd, fin: 0x3388ff, accent: 0x55aaff },   // blue
  { body: 0xffcc00, fin: 0xff4422, accent: 0xffaa00 },   // yellow-red
  { body: 0x9933cc, fin: 0xbb55ee, accent: 0xdd77ff },   // purple
  { body: 0xdd2222, fin: 0xff4444, accent: 0xff6666 },   // red
  { body: 0x22aa44, fin: 0x33cc55, accent: 0x55ee77 },   // green
  { body: 0xff66aa, fin: 0xff88cc, accent: 0xffaaee },   // pink
  { body: 0xdaa520, fin: 0xf0c040, accent: 0xffd700 },   // gold
];

// ===================== FISH CREATION =====================
const fishArray = [];
const foodArray = [];
const bubbleArray = [];

function createFish(x, y, z) {
  const scheme = fishColorSchemes[Math.floor(Math.random() * fishColorSchemes.length)];
  const scale = 0.6 + Math.random() * 0.6;
  const group = new THREE.Group();

  // Body - elongated sphere
  const bodyGeo = new THREE.SphereGeometry(1, 16, 12);
  bodyGeo.scale(1.8, 0.85, 0.65);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: scheme.body,
    roughness: 0.3,
    metalness: 0.15,
    emissive: scheme.body,
    emissiveIntensity: 0.05
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true;
  group.add(body);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.15, 8, 8);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
  const pupilGeo = new THREE.SphereGeometry(0.08, 8, 8);
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });

  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(1.3, 0.2, 0.45);
  group.add(leftEye);
  const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
  leftPupil.position.set(1.42, 0.2, 0.48);
  group.add(leftPupil);

  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  rightEye.position.set(1.3, 0.2, -0.45);
  group.add(rightEye);
  const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
  rightPupil.position.set(1.42, 0.2, -0.48);
  group.add(rightPupil);

  // Tail
  const tailGeo = new THREE.BufferGeometry();
  const tailVerts = new Float32Array([
    0, 0, 0,
    -0.8, 0.6, 0,
    -0.8, -0.6, 0,
    -1.4, 0, 0
  ]);
  const tailIdx = new Uint16Array([0,1,2, 0,2,3]);
  tailGeo.setAttribute('position', new THREE.BufferAttribute(tailVerts, 3));
  tailGeo.setIndex(new THREE.BufferAttribute(tailIdx, 1));
  tailGeo.computeVertexNormals();
  const tailMat = new THREE.MeshStandardMaterial({
    color: scheme.fin,
    roughness: 0.4,
    metalness: 0.1,
    side: THREE.DoubleSide
  });
  const tail = new THREE.Mesh(tailGeo, tailMat);
  tail.position.set(-1.6, 0, 0);
  tail.castShadow = true;
  group.add(tail);

  // Top fin (dorsal)
  const topFinGeo = new THREE.BufferGeometry();
  const tfVerts = new Float32Array([
    -0.3, 0.5, 0,
    0.3, 0.5, 0,
    0.0, 1.4, 0,
    -0.1, 1.1, 0
  ]);
  const tfIdx = new Uint16Array([0,1,2, 0,2,3]);
  topFinGeo.setAttribute('position', new THREE.BufferAttribute(tfVerts, 3));
  topFinGeo.setIndex(new THREE.BufferAttribute(tfIdx, 1));
  topFinGeo.computeVertexNormals();
  const topFin = new THREE.Mesh(topFinGeo, tailMat.clone());
  group.add(topFin);

  // Left fin
  const lFinGeo = new THREE.BufferGeometry();
  const lfVerts = new Float32Array([
    -0.2, -0.3, 0.35,
    0.4, -0.3, 0.35,
    0.1, -0.3, 1.0,
    -0.05, -0.3, 0.7
  ]);
  const lfIdx = new Uint16Array([0,1,2, 0,2,3]);
  lFinGeo.setAttribute('position', new THREE.BufferAttribute(lfVerts, 3));
  lFinGeo.setIndex(new THREE.BufferAttribute(lfIdx, 1));
  lFinGeo.computeVertexNormals();
  const leftFin = new THREE.Mesh(lFinGeo, tailMat.clone());
  group.add(leftFin);

  // Right fin
  const rFinGeo = new THREE.BufferGeometry();
  const rfVerts = new Float32Array([
    -0.2, -0.3, -0.35,
    0.4, -0.3, -0.35,
    0.1, -0.3, -1.0,
    -0.05, -0.3, -0.7
  ]);
  const rfIdx = new Uint16Array([0,1,2, 0,2,3]);
  rFinGeo.setAttribute('position', new THREE.BufferAttribute(rfVerts, 3));
  rFinGeo.setIndex(new THREE.BufferAttribute(rfIdx, 1));
  rFinGeo.computeVertexNormals();
  const rightFin = new THREE.Mesh(rFinGeo, tailMat.clone());
  group.add(rightFin);

  group.scale.setScalar(scale);
  group.position.set(x || (Math.random()-0.5)*(TW-6), y || 2+Math.random()*14, z || (Math.random()-0.5)*(TD-6));

  scene.add(group);

  const velocity = new THREE.Vector3(
    (Math.random() - 0.5) * 2,
    (Math.random() - 0.5) * 0.5,
    (Math.random() - 0.5) * 2
  );

  fishArray.push({
    mesh: group,
    tail: tail,
    topFin: topFin,
    leftFin: leftFin,
    rightFin: rightFin,
    velocity: velocity,
    speed: 1.5 + Math.random() * 2.0,
    tailSpeed: 3 + Math.random() * 4,
    phase: Math.random() * Math.PI * 2,
    targetFood: null,
    avoidanceRadius: 3 + Math.random() * 2,
    scale: scale,
    growAmount: 0
  });
}

// Create initial 15 fish
for (let i = 0; i < 15; i++) {
  createFish();
}

// ===================== BUBBLES =====================
function createBubble(x, y, z) {
  const bGeo = new THREE.SphereGeometry(0.15 + Math.random() * 0.2, 8, 8);
  const bMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.25,
    roughness: 0.0,
    metalness: 0.0,
    transmission: 0.9,
    clearcoat: 1.0,
    clearcoatRoughness: 0.0
  });
  const bubble = new THREE.Mesh(bGeo, bMat);
  bubble.position.set(
    x !== undefined ? x : (Math.random() - 0.5) * (TW - 4),
    y !== undefined ? y : -0.5 + Math.random() * 2,
    z !== undefined ? z : (Math.random() - 0.5) * (TD - 4)
  );
  scene.add(bubble);
  bubbleArray.push({
    mesh: bubble,
    speed: 1.5 + Math.random() * 2.5,
    phaseX: Math.random() * Math.PI * 2,
    phaseZ: Math.random() * Math.PI * 2,
    amplitudeX: 0.3 + Math.random() * 0.5,
    amplitudeZ: 0.2 + Math.random() * 0.4,
    startY: bubble.position.y
  });
}

// Initial 30 bubbles
for (let i = 0; i < 30; i++) {
  createBubble();
}

function addBubbles() {
  for (let i = 0; i < 10; i++) {
    createBubble();
  }
}

// ===================== FOOD =====================
function createFood(x, y, z) {
  const fGeo = new THREE.SphereGeometry(0.2, 8, 8);
  const fMat = new THREE.MeshStandardMaterial({
    color: 0xcc6633,
    roughness: 0.6,
    metalness: 0.1,
    emissive: 0xff4400,
    emissiveIntensity: 0.3
  });
  const food = new THREE.Mesh(fGeo, fMat);
  food.position.set(x, y, z);
  food.castShadow = true;
  scene.add(food);
  foodArray.push({
    mesh: food,
    velocity: new THREE.Vector3(0, -3 - Math.random() * 2, 0),
    active: true
  });
}

// ===================== RAYCASTER FOR CLICKING =====================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Check intersection with a plane at the click direction
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1).applyQuaternion(camera.quaternion), 0);
  const target = new THREE.Vector3();
  const hit = raycaster.ray.intersectPlane(plane, target);

  if (hit) {
    // Clamp to tank bounds
    const fx = Math.max(-HW + 1, Math.min(HW - 1, target.x));
    const fy = Math.max(0.5, Math.min(TH - 1, target.y));
    const fz = Math.max(-HD + 1, Math.min(HD - 1, target.z));
    createFood(fx, fy, fz);
  }
});

// Also allow clicking on the glass to place food
renderer.domElement.addEventListener('mousedown', (event) => {
  if (event.button === 0 && !controls.mouseButtons.left) {
    // handled by click
  }
});

// ===================== FISH AI =====================
function updateFishAI(dt) {
  for (let i = 0; i < fishArray.length; i++) {
    const fish = fishArray[i];
    const pos = fish.mesh.position;
    let vel = fish.velocity;

    // Random wandering
    fish.phase += dt * (0.3 + Math.random() * 0.2);
    vel.x += Math.sin(fish.phase * 1.3) * dt * 0.8;
    vel.z += Math.cos(fish.phase * 1.7) * dt * 0.6;
    vel.y += Math.sin(fish.phase * 0.7) * dt * 0.3;

    // Avoidance from other fish
    for (let j = 0; j < fishArray.length; j++) {
      if (i === j) continue;
      const other = fishArray[j].mesh.position;
      const dx = pos.x - other.x;
      const dy = pos.y - other.y;
      const dz = pos.z - other.z;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (dist < fish.avoidanceRadius && dist > 0.01) {
        const force = (fish.avoidanceRadius - dist) / fish.avoidanceRadius * 2.0;
        vel.x += (dx / dist) * force * dt;
        vel.y += (dy / dist) * force * dt * 0.5;
        vel.z += (dz / dist) * force * dt;
      }
    }

    // Wall avoidance
    const margin = 2;
    const wallForce = 1.5;
    if (pos.x < -HW + margin) vel.x += wallForce * dt;
    if (pos.x > HW - margin) vel.x -= wallForce * dt;
    if (pos.y < 0.5) vel.y += wallForce * dt;
    if (pos.y > TH - 1.5) vel.y -= wallForce * dt;
    if (pos.z < -HD + margin) vel.z += wallForce * dt;
    if (pos.z > HD - margin) vel.z -= wallForce * dt;

    // Food chasing
    if (!fish.targetFood || !fish.targetFood.active) {
      fish.targetFood = null;
      // Find nearest food
      let minDist = 15;
      for (let f = 0; f < foodArray.length; f++) {
        if (!foodArray[f].active) continue;
        const fp = foodArray[f].mesh.position;
        const d = pos.distanceTo(fp);
        if (d < minDist) {
          minDist = d;
          fish.targetFood = foodArray[f];
        }
      }
    }

    if (fish.targetFood && fish.targetFood.active) {
      const fp = fish.targetFood.mesh.position;
      const dx = fp.x - pos.x;
      const dy = fp.y - pos.y;
      const dz = fp.z - pos.z;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (dist > 0.01) {
        const chaseForce = 1.5;
        vel.x += (dx / dist) * chaseForce * dt;
        vel.y += (dy / dist) * chaseForce * dt;
        vel.z += (dz / dist) * chaseForce * dt;
      }
      // Eat food
      if (dist < 0.8) {
        fish.targetFood.active = false;
        scene.remove(fish.targetFood.mesh);
        fish.targetFood = null;
        // Grow
        const grow = 1.05;
        fish.scale *= grow;
        fish.mesh.scale.setScalar(fish.scale);
      }
    }

    // Limit speed
    const maxSpeed = fish.speed * 2;
    const currentSpeed = vel.length();
    if (currentSpeed > maxSpeed) {
      vel.multiplyScalar(maxSpeed / currentSpeed);
    }

    // Move
    pos.addScaledVector(vel, dt);

    // Orient fish in direction of movement
    if (currentSpeed > 0.1) {
      const lookTarget = pos.clone().add(vel);
      fish.mesh.lookAt(lookTarget);
    }

    // Tail animation
    const tailAngle = Math.sin(performance.now() * 0.001 * fish.tailSpeed + fish.phase) * 0.4;
    fish.tail.rotation.y = tailAngle;
    fish.topFin.rotation.z = Math.sin(performance.now() * 0.001 * fish.tailSpeed * 1.2 + fish.phase) * 0.15;
    fish.leftFin.rotation.x = Math.sin(performance.now() * 0.001 * fish.tailSpeed * 0.8 + fish.phase) * 0.2;
    fish.rightFin.rotation.x = -Math.sin(performance.now() * 0.001 * fish.tailSpeed * 0.8 + fish.phase) * 0.2;
  }
}

// ===================== FOOD PHYSICS =====================
function updateFood(dt) {
  for (let i = foodArray.length - 1; i >= 0; i--) {
    const food = foodArray[i];
    if (!food.active) {
      foodArray.splice(i, 1);
      continue;
    }
    // Gravity
    food.velocity.y -= 5 * dt;
    food.mesh.position.addScaledVector(food.velocity, dt);

    // Hit bottom
    if (food.mesh.position.y <= -0.3) {
      food.mesh.position.y = -0.3;
      food.velocity.set(0, 0, 0);
      // Remove after a delay or immediately
      food.active = false;
      foodArray.splice(i, 1);
      scene.remove(food.mesh);
    }
  }
}

// ===================== BUBBLE ANIMATION =====================
function updateBubbles(dt) {
  for (let i = bubbleArray.length - 1; i >= 0; i--) {
    const b = bubbleArray[i];
    const t = performance.now() * 0.001;
    b.mesh.position.y += b.speed * dt;
    b.mesh.position.x += Math.sin(t * 1.5 + b.phaseX) * b.amplitudeX * dt;
    b.mesh.position.z += Math.cos(t * 1.2 + b.phaseZ) * b.amplitudeZ * dt;

    // Reset when reaching surface
    if (b.mesh.position.y > TH - 1) {
      b.mesh.position.y = -0.5 + Math.random() * 1;
      b.mesh.position.x = (Math.random() - 0.5) * (TW - 4);
      b.mesh.position.z = (Math.random() - 0.5) * (TD - 4);
    }
  }
}

// ===================== PLANT ANIMATION =====================
function updatePlants(dt) {
  const t = performance.now() * 0.001;
  for (const plant of plants) {
    const p = plant.userData;
    plant.rotation.x = Math.sin(t * p.swaySpeed + p.phase) * 0.06;
    plant.rotation.z = Math.cos(t * p.swaySpeed * 0.7 + p.phase) * 0.04;
  }
}

// ===================== FPS COUNTER =====================
let frameCount = 0;
let lastFpsTime = performance.now();
let fps = 0;

function updateFPS() {
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastFpsTime = now;
    document.getElementById('fps-display').textContent = fps;
  }
}

// ===================== UPDATE UI =====================
function updateUI() {
  document.getElementById('fish-count').textContent = fishArray.length;
  document.getElementById('bubble-count').textContent = bubbleArray.length;
  document.getElementById('food-count').textContent = foodArray.filter(f => f.active).length;
}

// ===================== ADD FISH =====================
function addFish() {
  createFish();
}

// ===================== ANIMATION LOOP =====================
let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  controls.update();

  updateFishAI(dt);
  updateFood(dt);
  updateBubbles(dt);
  updatePlants(dt);
  updateFPS();

  // Update UI every ~30 frames
  if (frameCount % 30 === 0) updateUI();

  renderer.render(scene, camera);
}

// ===================== RESIZE =====================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===================== START =====================
updateUI();
animate();
</script>
