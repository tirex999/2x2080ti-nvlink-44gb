<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
  #ui {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
    color: #5a4632; text-align: center; pointer-events: none; user-select: none;
  }
  #ui h1 { margin: 0; font-size: 26px; text-shadow: 0 2px 0 rgba(255,255,255,.7); }
  #ui p  { margin: 4px 0 0; font-size: 13px; opacity: .8; }
</style>
</head>
<body>
<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>drag to rotate &nbsp;·&nbsp; scroll to zoom</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ---------- Renderer / Scene / Camera ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe6f2);
  scene.fog = new THREE.Fog(0xbfe6f2, 25, 55);

  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);

  // ---------- Lights ----------
  scene.add(new THREE.HemisphereLight(0xfff4dd, 0xa8c8e8, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75);
  sun.position.set(8, 12, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
  sun.shadow.camera.top = 10;   sun.shadow.camera.bottom = -10;
  scene.add(sun);

  // ---------- Ground ----------
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(30, 24),
    new THREE.MeshLambertMaterial({ color: 0xcdeac0 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.62;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------- Cage ----------
  const cage = new THREE.Group();
  scene.add(cage);
  const BOUNDS = { x: 4.2, z: 3.2 }; // hamster roaming area

  // tray
  const tray = new THREE.Mesh(
    new THREE.BoxGeometry(10, 0.6, 8),
    new THREE.MeshLambertMaterial({ color: 0xfaf6ee })
  );
  tray.position.y = -0.3;
  tray.receiveShadow = true;
  cage.add(tray);

  // sand bed
  const sand = new THREE.Mesh(
    new THREE.BoxGeometry(9.4, 0.12, 7.4),
    new THREE.MeshLambertMaterial({ color: 0xe9d3a0 })
  );
  sand.position.y = 0.06;
  sand.receiveShadow = true;
  cage.add(sand);

  // solid back + left walls
  function wall(w, d, x, z, color) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(w, 2.6, d),
      new THREE.MeshLambertMaterial({ color: color })
    );
    m.position.set(x, 1.3, z);
    m.castShadow = m.receiveShadow = true;
    cage.add(m);
  }
  wall(10.4, 0.25, 0, -4.05, 0x9fd8cf);
  wall(0.25, 8.4, -5.05, 0, 0xf7b8c4);

  // wire bars (front + right)
  const barMat = new THREE.MeshLambertMaterial({ color: 0xd8dde2 });
  const barGeoV = new THREE.BoxGeometry(0.07, 2.6, 0.07);
  for (let i = 0; i <= 10; i++) {
    const bar = new THREE.Mesh(barGeoV, barMat);
    bar.position.set(-5 + i, 1.3, 4.05); // front
    cage.add(bar);
    const bar2 = bar.clone();
    bar2.position.set(5.05, 1.3, -4 + i * 0.8); // right
    cage.add(bar2);
  }
  // top rails
  const railF = new THREE.Mesh(new THREE.BoxGeometry(10.4, 0.12, 0.12), barMat);
  railF.position.set(0, 2.6, 4.05); cage.add(railF);
  const railR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 8.4), barMat);
  railR.position.set(5.05, 2.6, 0); cage.add(railR);

  // ---------- Wheel ----------
  const wheelPos = new THREE.Vector3(4.2, 0.85, -1.8);
  const wheelAnchor = new THREE.Group();
  wheelAnchor.position.copy(wheelPos);
  wheelAnchor.rotation.y = Math.PI / 2; // face inward (-x)
  cage.add(wheelAnchor);

  const wheelSpin = new THREE.Group();
  wheelAnchor.add(wheelSpin);
  const wheelMat = new THREE.MeshLambertMaterial({ color: 0xff8fab });
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.06, 6, 18), wheelMat);
  rim.castShadow = true;
  wheelSpin.add(rim);
  const innerRim = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.04, 6, 18), wheelMat);
  wheelSpin.add(innerRim);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.18, 8), wheelMat);
  hub.rotation.x = Math.PI / 2;
  wheelSpin.add(hub);
  for (let i = 0; i < 5; i++) {
    const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.4, 5), wheelMat);
    spoke.rotation.z = (i / 5) * Math.PI;
    wheelSpin.add(spoke);
  }
  // stand
  const standMat = new THREE.MeshLambertMaterial({ color: 0x8ecae6 });
  const legGeo = new THREE.BoxGeometry(0.1, 0.8, 0.1);
  const legL = new THREE.Mesh(legGeo, standMat); legL.position.set(0, -0.45, 0.5); wheelAnchor.add(legL);
  const legR = new THREE.Mesh(legGeo, standMat); legR.position.set(0, -0.45, -0.5); wheelAnchor.add(legR);
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 1.2), standMat);
  base.position.y = -0.85; wheelAnchor.add(base);

  let wheelSpeed = 0;

  // ---------- Food bowl ----------
  const bowlPos = new THREE.Vector3(-3.6, 0, 2.2);
  const bowl = new THREE.Mesh(
    new THREE.CylinderGeometry(0.45, 0.3, 0.25, 10),
    new THREE.MeshLambertMaterial({ color: 0xffd166 })
  );
  bowl.position.set(bowlPos.x, 0.15, bowlPos.z);
  bowl.castShadow = true;
  cage.add(bowl);
  const seedMat = new THREE.MeshLambertMaterial({ color: 0x8d5a2b });
  for (let i = 0; i < 6; i++) {
    const seed = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 4), seedMat);
    const a = Math.random() * Math.PI * 2, r = Math.random() * 0.2;
    seed.position.set(bowlPos.x + Math.cos(a) * r, 0.28, bowlPos.z + Math.sin(a) * r);
    cage.add(seed);
  }

  // ---------- Tunnel ----------
  const tunGeo = new THREE.CylinderGeometry(0.55, 0.55, 2.2, 12, 1, true, 0, Math.PI);
  tunGeo.rotateX(Math.PI / 2);
  tunGeo.rotateZ(Math.PI / 2);
  const tunnel = new THREE.Mesh(
    tunGeo,
    new THREE.MeshLambertMaterial({ color: 0x9b5de5, side: THREE.DoubleSide })
  );
  tunnel.position.set(0.5, 0.55, 0.5);
  tunnel.rotation.y = 0.6;
  tunnel.castShadow = true;
  cage.add(tunnel);

  // scattered seeds
  for (let i = 0; i < 10; i++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.05, 5, 4), seedMat);
    s.position.set((Math.random() - 0.5) * 8, 0.14, (Math.random() - 0.5) * 6.4);
    cage.add(s);
  }

  // ---------- Hamsters ----------
  function makeHamster(bodyColor, cheekColor) {
    const g = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: bodyColor, flatShading: true });
    const cheekMat = new THREE.MeshLambertMaterial({ color: cheekColor, flatShading: true });

    const body = new THREE.Mesh(new THREE.SphereGeometry(0.45, 8, 6), mat);
    body.scale.set(1, 0.85, 1.25);
    body.position.y = 0.45;
    body.castShadow = true;
    g.add(body);

    const snout = new THREE.Mesh(new THREE.SphereGeometry(0.2, 6, 5), mat);
    snout.position.set(0, 0.4, 0.55);
    g.add(snout);

    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 5, 4),
      new THREE.MeshLambertMaterial({ color: 0xf06292 }));
    nose.position.set(0, 0.45, 0.74);
    g.add(nose);

    const eyeGeo = new THREE.SphereGeometry(0.055, 5, 4);
    const eyeMat = new THREE.MeshLambertMaterial({ color: 0x2b2b2b });
    const eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(-0.18, 0.55, 0.58); g.add(eL);
    const eR = new THREE.Mesh(eyeGeo, eyeMat); eR.position.set(0.18, 0.55, 0.58); g.add(eR);

    const earGeo = new THREE.SphereGeometry(0.12, 5, 4);
    const earL = new THREE.Mesh(earGeo, mat); earL.position.set(-0.24, 0.85, 0.1); g.add(earL);
    const earR = new THREE.Mesh(earGeo, mat); earR.position.set(0.24, 0.85, 0.1); g.add(earR);

    const chGeo = new THREE.SphereGeometry(0.14, 6, 5);
    const cL = new THREE.Mesh(chGeo, cheekMat); cL.position.set(-0.3, 0.38, 0.45); g.add(cL);
    const cR = new THREE.Mesh(chGeo, cheekMat); cR.position.set(0.3, 0.38, 0.45); g.add(cR);

    const tail = new THREE.Mesh(new THREE.SphereGeometry(0.08, 5, 4), mat);
    tail.position.set(0, 0.4, -0.62);
    g.add(tail);

    const footMat = new THREE.MeshLambertMaterial({ color: 0xf06292 });
    const footGeo = new THREE.BoxGeometry(0.1, 0.08, 0.14);
    const feet = [];
    [[-0.18, 0.28], [0.18, 0.28], [-0.18, -0.28], [0.18, -0.28]].forEach(p => {
      const f = new THREE.Mesh(footGeo, footMat);
      f.position.set(p[0], 0.05, p[1]);
      g.add(f);
      feet.push(f);
    });

    return { group: g, body, feet, cheeks: [cL, cR] };
  }

  const palette = [
    [0xf2a65a, 0xffe3c2],
    [0xfff4e0, 0xffc4d6],
    [0x9aa5b1, 0xd7dee6],
    [0xb07a4f, 0xe8c9a8]
  ];

  const WHEEL_POINT = new THREE.Vector3(3.4, 0, -1.8);
  const BOWL_POINT  = new THREE.Vector3(-3.0, 0, 2.2);

  const hamsters = [];
  for (let i = 0; i < 4; i++) {
    const h = makeHamster(palette[i][0], palette[i][1]);
    h.group.position.set((Math.random() - 0.5) * 7, 0, (Math.random() - 0.5) * 5);
    h.state = 'wander';
    h.timer = 1 + Math.random() * 2;
    h.target = null;
    h.speed = 1.2 + Math.random() * 0.6;
    h.phase = Math.random() * 10;
    scene.add(h.group);
    hamsters.push(h);
  }

  const rand = (a, b) => a + Math.random() * (b - a);
  const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.z - b.z) ** 2;

  function pickTarget(h) {
    h.target = new THREE.Vector3(
      rand(-BOUNDS.x, BOUNDS.x), 0, rand(-BOUNDS.z, BOUNDS.z)
    );
  }

  function lerpAngle(a, b, t) {
    let d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
  }

  function updateHamster(h, dt, time) {
    h.timer -= dt;
    const pos = h.group.position;
    let moving = false;

    switch (h.state) {
      case 'wander':
        if (!h.target || dist2(pos, h.target) < 0.1 || h.timer <= 0) {
          const r = Math.random();
          if (r < 0.15 && !h.state) { /* noop */ }
          if (r < 0.12) { h.state = 'to_wheel'; h.target = WHEEL_POINT; }
          else if (r < 0.24) { h.state = 'to_bowl'; h.target = BOWL_POINT; }
          else if (r < 0.45) { h.state = 'pause'; h.timer = rand(1, 3); }
          else { pickTarget(h); h.timer = rand(2, 5); }
        }
        if (h.state === 'wander') {
          const dx = h.target.x - pos.x, dz = h.target.z - pos.z;
          const d = Math.hypot(dx, dz);
          if (d > 0.05) {
            pos.x += (dx / d) * h.speed * dt;
            pos.z += (dz / d) * h.speed * dt;
            h.group.rotation.y = lerpAngle(h.group.rotation.y, Math.atan2(dx, dz), 10 * dt);
            moving = true;
          }
        }
        break;

      case 'pause':
        if (h.timer <= 0) { h.state = 'wander'; pickTarget(h); h.timer = rand(2, 5); }
        break;

      case 'to_wheel':
      case 'to_bowl': {
        const dx = h.target.x - pos.x, dz = h.target.z - pos.z;
        const d = Math.hypot(dx, dz);
        if (d < 0.2) {
          if (h.state === 'to_wheel') { h.state = 'at_wheel'; h.timer = rand(3, 6); }
          else { h.state = 'eat'; h.timer = rand(2.5, 4.5); }
        } else {
          pos.x += (dx / d) * h.speed * 1.3 * dt;
          pos.z += (dz / d) * h.speed * 1.3 * dt;
          h.group.rotation.y = lerpAngle(h.group.rotation.y, Math.atan2(dx, dz), 10 * dt);
          moving = true;
        }
        break;
      }

      case 'at_wheel':
        h.group.rotation.y = lerpAngle(h.group.rotation.y, Math.PI / 2, 10 * dt);
        wheelSpeed = Math.max(wheelSpeed, 6);
        if (h.timer <= 0) { h.state = 'wander'; pickTarget(h); h.timer = rand(2, 5); }
        break;

      case 'eat':
        h.group.rotation.y = lerpAngle(h.group.rotation.y, Math.atan2(bowlPos.x - pos.x, bowlPos.z - pos.z), 10 * dt);
        // chomping: cheeks puff
        const puff = 1 + Math.abs(Math.sin(time * 8 + h.phase)) * 0.5;
        h.cheeks.forEach(c => c.scale.setScalar(puff));
        if (h.timer <= 0) {
          h.cheeks.forEach(c => c.scale.setScalar(1));
          h.state = 'wander'; pickTarget(h); h.timer = rand(2, 5);
        }
        break;
    }

    // clamp to cage
    pos.x = Math.max(-BOUNDS.x - 0.3, Math.min(BOUNDS.x + 0.3, pos.x));
    pos.z = Math.max(-BOUNDS.z - 0.3, Math.min(BOUNDS.z + 0.3, pos.z));

    // animation
    const t = time * (moving ? 14 : 5) + h.phase;
    const amp = moving ? 0.05 : (h.state === 'at_wheel' ? 0.09 : 0.02);
    h.group.position.y = Math.abs(Math.sin(t)) * amp;
    h.body.rotation.z = Math.sin(t * 0.5) * 0.05;
    h.feet.forEach((f, i) => {
      f.rotation.x = moving ? Math.sin(t + (i % 2) * Math.PI) * 0.7 : 0;
    });
  }

  // simple separation so hamsters don't overlap
  function separate() {
    for (let i = 0; i < hamsters.length; i++) {
      for (let j = i + 1; j < hamsters.length; j++) {
        const a = hamsters[i].group.position, b = hamsters[j].group.position;
        const dx = b.x - a.x, dz = b.z - a.z;
        const d = Math.hypot(dx, dz);
        if (d < 0.7 && d > 0.001) {
          const push = (0.7 - d) * 0.5;
          a.x -= (dx / d) * push; a.z -= (dz / d) * push;
          b.x += (dx / d) * push; b.z += (dz / d) * push;
        }
      }
    }
  }

  // ---------- Camera controls (simple orbit) ----------
  const ctrl = { theta: 0.6, phi: 1.05, radius: 13, target: new THREE.Vector3(0, 1, 0) };
  let dragging = false, lastX = 0, lastY = 0, idleTime = 0;

  function applyCamera() {
    ctrl.phi = Math.max(0.2, Math.min(1.45, ctrl.phi));
    ctrl.radius = Math.max(6, Math.min(24, ctrl.radius));
    camera.position.set(
      ctrl.target.x + ctrl.radius * Math.sin(ctrl.phi) * Math.sin(ctrl.theta),
      ctrl.target.y + ctrl.radius * Math.cos(ctrl.phi),
      ctrl.target.z + ctrl.radius * Math.sin(ctrl.phi) * Math.cos(ctrl.theta)
    );
    camera.lookAt(ctrl.target);
  }

  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; idleTime = 0; });
  window.addEventListener('pointerup', () => dragging = false);
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    ctrl.theta += (e.clientX - lastX) * 0.005;
    ctrl.phi   -= (e.clientY - lastY) * 0.005;
    lastX = e.clientX; lastY = e.clientY;
    idleTime = 0;
  });
  el.addEventListener('wheel', e => {
    ctrl.radius += e.deltaY * 0.01;
    idleTime = 0;
  }, { passive: true });

  // pinch zoom
  let pinchDist = 0;
  el.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                             e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
      ctrl.radius += (pinchDist - d) * 0.03;
      pinchDist = d;
    }
  }, { passive: true });

  // ---------- Main loop ----------
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const time = clock.elapsedTime;

    for (const h of hamsters) updateHamster(h, dt, time);
    separate();

    wheelSpeed *= Math.pow(0.3, dt); // decay
    if (wheelSpeed < 0.01) wheelSpeed = 0;
    wheelSpin.rotation.z += wheelSpeed * dt;

    idleTime += dt;
    if (idleTime > 4 && !dragging) ctrl.theta += dt * 0.08; // gentle auto-rotate
    applyCamera();

    renderer.render(scene, camera);
  }
  applyCamera();
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
