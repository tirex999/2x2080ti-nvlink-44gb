<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Low-Poly Hamster Playground</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
#info {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  color: #fff; background: rgba(0,0,0,0.5); padding: 10px 24px;
  border-radius: 20px; font-size: 14px; pointer-events: none;
  backdrop-filter: blur(4px);
}
</style>
</head>
<body>
<div id="info">🐹 Drag to rotate • Scroll to zoom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- SCENE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 15, 30);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6, 5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 4;
controls.maxDistance = 15;
controls.target.set(0, 1, 0);

// --- LIGHTS ---
const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
sunLight.position.set(5, 10, 5);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(1024, 1024);
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 25;
sunLight.shadow.camera.left = -6;
sunLight.shadow.camera.right = 6;
sunLight.shadow.camera.top = 6;
sunLight.shadow.camera.bottom = -6;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0xffd4a0, 0.3);
fillLight.position.set(-3, 4, -3);
scene.add(fillLight);

// --- MATERIALS HELPER ---
function mat(color) {
  return new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.8, metalness: 0.05 });
}

// --- CAGE ---
function createCage() {
  const group = new THREE.Group();
  const W = 7, H = 3.5, D = 5;
  const barMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, flatShading: true, roughness: 0.3, metalness: 0.6 });

  // Base tray
  const trayGeo = new THREE.BoxGeometry(W + 0.3, 0.3, D + 0.3);
  const tray = new THREE.Mesh(trayGeo, mat(0x4a90d9));
  tray.position.y = -0.15;
  tray.receiveShadow = true;
  group.add(tray);

  // Floor (bedding)
  const floorGeo = new THREE.BoxGeometry(W, 0.15, D);
  const floor = new THREE.Mesh(floorGeo, mat(0xf5deb3));
  floor.position.y = 0.075;
  floor.receiveShadow = true;
  group.add(floor);

  // Cage bars - vertical
  const barRadius = 0.03;
  const barGeoV = new THREE.CylinderGeometry(barRadius, barRadius, H, 6);
  const spacingX = W / 8;
  const spacingZ = D / 6;

  for (let i = 0; i <= 8; i++) {
    const x = -W / 2 + i * spacingX;
    const barF = new THREE.Mesh(barGeoV, barMat);
    barF.position.set(x, H / 2, D / 2);
    group.add(barF);
    const barB = new THREE.Mesh(barGeoV, barMat);
    barB.position.set(x, H / 2, -D / 2);
    group.add(barB);
  }
  for (let j = 1; j <= 5; j++) {
    const z = -D / 2 + j * spacingZ;
    const barL = new THREE.Mesh(barGeoV, barMat);
    barL.position.set(-W / 2, H / 2, z);
    group.add(barL);
    const barR = new THREE.Mesh(barGeoV, barMat);
    barR.position.set(W / 2, H / 2, z);
    group.add(barR);
  }

  // Horizontal bars
  const barGeoH = new THREE.CylinderGeometry(barRadius, barRadius, W, 6);
  barGeoH.rotateZ(Math.PI / 2);
  const hLevels = [0.5, 1.2, 1.9, 2.6, 3.3];
  for (const y of hLevels) {
    const barTop = new THREE.Mesh(barGeoH, barMat);
    barTop.position.set(0, y, D / 2);
    group.add(barTop);
    const barBot = new THREE.Mesh(barGeoH, barMat);
    barBot.position.set(0, y, -D / 2);
    group.add(barBot);
  }

  // Side horizontal bars
  const barGeoSide = new THREE.CylinderGeometry(barRadius, barRadius, D, 6);
  barGeoSide.rotateX(Math.PI / 2);
  for (const y of hLevels) {
    const barL = new THREE.Mesh(barGeoSide, barMat);
    barL.position.set(-W / 2, y, 0);
    group.add(barL);
    const barR = new THREE.Mesh(barGeoSide, barMat);
    barR.position.set(W / 2, y, 0);
    group.add(barR);
  }

  // Top frame
  const topBarGeo = new THREE.CylinderGeometry(0.05, 0.05, W, 6);
  topBarGeo.rotateZ(Math.PI / 2);
  const topF = new THREE.Mesh(topBarGeo, barMat);
  topF.position.set(0, H, D / 2);
  group.add(topF);
  const topB = new THREE.Mesh(topBarGeo, barMat);
  topB.position.set(0, H, -D / 2);
  group.add(topB);

  const topSideGeo = new THREE.CylinderGeometry(0.05, 0.05, D, 6);
  topSideGeo.rotateX(Math.PI / 2);
  const topL = new THREE.Mesh(topSideGeo, barMat);
  topL.position.set(-W / 2, H, 0);
  group.add(topL);
  const topR = new THREE.Mesh(topSideGeo, barMat);
  topR.position.set(W / 2, H, 0);
  group.add(topR);

  return group;
}

// --- BEDDING PIECES ---
function createBedding() {
  const group = new THREE.Group();
  const colors = [0xf5deb3, 0xdeb887, 0xd2b48c, 0xc4a882];
  const count = 60;
  for (let i = 0; i < count; i++) {
    const size = 0.08 + Math.random() * 0.1;
    const geo = new THREE.DodecahedronGeometry(size, 0);
    const m = new THREE.Mesh(geo, mat(colors[Math.floor(Math.random() * colors.length)]));
    m.position.set(
      (Math.random() - 0.5) * 6.5,
      0.15 + Math.random() * 0.05,
      (Math.random() - 0.5) * 4.5
    );
    m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    m.receiveShadow = true;
    group.add(m);
  }
  return group;
}

// --- EXERCISE WHEEL ---
function createWheel() {
  const group = new THREE.Group();
  const metalMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, flatShading: true, roughness: 0.3, metalness: 0.5 });

  // Ring
  const ringGeo = new THREE.TorusGeometry(0.7, 0.06, 6, 12);
  const ring = new THREE.Mesh(ringGeo, metalMat);
  ring.position.y = 0.7;
  group.add(ring);

  // Spokes
  const spokeGeo = new THREE.CylinderGeometry(0.025, 0.025, 1.3, 5);
  for (let i = 0; i < 6; i++) {
    const spoke = new THREE.Mesh(spokeGeo, metalMat);
    spoke.position.y = 0.7;
    spoke.rotation.z = (i / 6) * Math.PI;
    group.add(spoke);
  }

  // Center hub
  const hubGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.15, 8);
  hubGeo.rotateX(Math.PI / 2);
  const hub = new THREE.Mesh(hubGeo, metalMat);
  hub.position.y = 0.7;
  group.add(hub);

  // Stand
  const standGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.7, 6);
  const standL = new THREE.Mesh(standGeo, metalMat);
  standL.position.set(0, 0.35, 0.3);
  group.add(standL);
  const standR = new THREE.Mesh(standGeo, metalMat);
  standR.position.set(0, 0.35, -0.3);
  group.add(standR);

  // Base
  const baseGeo = new THREE.BoxGeometry(0.8, 0.08, 0.7);
  const base = new THREE.Mesh(baseGeo, metalMat);
  base.position.y = 0.04;
  group.add(base);

  group.position.set(2.2, 0.15, -1.5);
  group.rotation.y = Math.PI / 6;

  // Store reference for animation
  group.userData.ring = ring;
  group.userData.spokes = [];
  group.children.forEach(c => { if (c !== ring && c !== hub && c.geometry === spokeGeo) group.userData.spokes.push(c); });

  return group;
}

// --- FOOD BOWL ---
function createFoodBowl() {
  const group = new THREE.Group();

  const bowlGeo = new THREE.CylinderGeometry(0.35, 0.25, 0.2, 8, 1, false);
  const bowl = new THREE.Mesh(bowlGeo, mat(0xff6b6b));
  bowl.position.y = 0.1;
  bowl.castShadow = true;
  group.add(bowl);

  // Food pellets
  const pelletGeo = new THREE.SphereGeometry(0.05, 5, 4);
  const pelletColors = [0x8b4513, 0xdaa520, 0x228b22];
  for (let i = 0; i < 8; i++) {
    const pellet = new THREE.Mesh(pelletGeo, mat(pelletColors[i % 3]));
    const angle = (i / 8) * Math.PI * 2;
    const r = 0.12 + Math.random() * 0.08;
    pellet.position.set(Math.cos(angle) * r, 0.22, Math.sin(angle) * r);
    group.add(pellet);
  }

  group.position.set(-2, 0.15, 1.2);
  return group;
}

// --- TUNNEL ---
function createTunnel() {
  const group = new THREE.Group();

  const tunnelGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.2, 8, 1, false);
  const tunnelMat = mat(0x90ee90);
  tunnelMat.side = THREE.DoubleSide;
  const tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
  tunnel.rotation.z = Math.PI / 2;
  tunnel.position.y = 0.3;
  tunnel.castShadow = true;
  group.add(tunnel);

  // End caps (rings)
  const capGeo = new THREE.TorusGeometry(0.3, 0.04, 6, 8);
  const capL = new THREE.Mesh(capGeo, mat(0x3cb371));
  capL.position.set(-0.6, 0.3, 0);
  group.add(capL);
  const capR = new THREE.Mesh(capGeo, mat(0x3cb371));
  capR.position.set(0.6, 0.3, 0);
  group.add(capR);

  group.position.set(-0.5, 0.15, -1.8);
  group.rotation.y = -Math.PI / 5;
  return group;
}

// --- HAMSTER FACTORY ---
function createHamster(bodyColor, bellyColor) {
  const group = new THREE.Group();

  // Body
  const bodyGeo = new THREE.SphereGeometry(0.25, 7, 6);
  const body = new THREE.Mesh(bodyGeo, mat(bodyColor));
  body.scale.set(1.2, 0.9, 1);
  body.position.y = 0.25;
  body.castShadow = true;
  group.add(body);

  // Belly
  const bellyGeo = new THREE.SphereGeometry(0.18, 6, 5);
  const belly = new THREE.Mesh(bellyGeo, mat(bellyColor));
  belly.scale.set(1.1, 0.7, 0.8);
  belly.position.set(0, 0.18, 0.08);
  group.add(belly);

  // Head
  const headGeo = new THREE.SphereGeometry(0.18, 7, 6);
  const head = new THREE.Mesh(headGeo, mat(bodyColor));
  head.position.set(0, 0.35, 0.22);
  head.castShadow = true;
  group.add(head);

  // Ears
  const earGeo = new THREE.SphereGeometry(0.07, 5, 4);
  const earMat = mat(bellyColor);
  const earL = new THREE.Mesh(earGeo, earMat);
  earL.position.set(-0.1, 0.48, 0.18);
  earL.scale.set(1, 1.3, 0.6);
  group.add(earL);
  const earR = new THREE.Mesh(earGeo, earMat);
  earR.position.set(0.1, 0.48, 0.18);
  earR.scale.set(1, 1.3, 0.6);
  group.add(earR);

  // Inner ears
  const innerEarGeo = new THREE.SphereGeometry(0.04, 4, 3);
  const innerEarMat = mat(0xffb6c1);
  const innerEarL = new THREE.Mesh(innerEarGeo, innerEarMat);
  innerEarL.position.set(-0.1, 0.48, 0.2);
  group.add(innerEarL);
  const innerEarR = new THREE.Mesh(innerEarGeo, innerEarMat);
  innerEarR.position.set(0.1, 0.48, 0.2);
  group.add(innerEarR);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.035, 5, 4);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, flatShading: true });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  eyeL.position.set(-0.08, 0.38, 0.35);
  group.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  eyeR.position.set(0.08, 0.38, 0.35);
  group.add(eyeR);

  // Eye shine
  const shineGeo = new THREE.SphereGeometry(0.012, 4, 3);
  const shineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const shineL = new THREE.Mesh(shineGeo, shineMat);
  shineL.position.set(-0.07, 0.39, 0.37);
  group.add(shineL);
  const shineR = new THREE.Mesh(shineGeo, shineMat);
  shineR.position.set(0.09, 0.39, 0.37);
  group.add(shineR);

  // Nose
  const noseGeo = new THREE.SphereGeometry(0.025, 4, 3);
  const nose = new THREE.Mesh(noseGeo, mat(0xff69b4));
  nose.position.set(0, 0.33, 0.38);
  group.add(nose);

  // Whiskers
  const whiskerMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 1 });
  for (let side = -1; side <= 1; side += 2) {
    for (let w = 0; w < 3; w++) {
      const points = [
        new THREE.Vector3(side * 0.05, 0.33 + w * 0.02 - 0.02, 0.36),
        new THREE.Vector3(side * 0.2, 0.32 + w * 0.03 - 0.02, 0.42)
      ];
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geo, whiskerMat);
      group.add(line);
    }
  }

  // Feet
  const footGeo = new THREE.SphereGeometry(0.05, 5, 4);
  const footMat = mat(bellyColor);
  const footPositions = [
    [-0.1, 0.05, 0.15], [0.1, 0.05, 0.15],
    [-0.1, 0.05, -0.15], [0.1, 0.05, -0.15]
  ];
  footPositions.forEach(pos => {
    const foot = new THREE.Mesh(footGeo, footMat);
    foot.position.set(...pos);
    foot.scale.set(1, 0.7, 1.2);
    group.add(foot);
  });

  // Tiny tail
  const tailGeo = new THREE.SphereGeometry(0.04, 4, 3);
  const tail = new THREE.Mesh(tailGeo, mat(bodyColor));
  tail.position.set(0, 0.22, -0.25);
  tail.scale.set(0.8, 0.8, 1.2);
  group.add(tail);

  // Cheeks (fluffy)
  const cheekGeo = new THREE.SphereGeometry(0.08, 5, 4);
  const cheekMat = mat(bellyColor);
  const cheekL = new THREE.Mesh(cheekGeo, cheekMat);
  cheekL.position.set(-0.14, 0.3, 0.28);
  cheekL.scale.set(0.8, 1, 0.8);
  group.add(cheekL);
  const cheekR = new THREE.Mesh(cheekGeo, cheekMat);
  cheekR.position.set(0.14, 0.3, 0.28);
  cheekR.scale.set(0.8, 1, 0.8);
  group.add(cheekR);

  return group;
}

// --- BUILD SCENE ---
scene.add(createCage());
scene.add(createBedding());
const wheel = createWheel();
scene.add(wheel);
const foodBowl = createFoodBowl();
scene.add(foodBowl);
scene.add(createTunnel());

// Ground plane (outside cage)
const groundGeo = new THREE.PlaneGeometry(30, 30);
const ground = new THREE.Mesh(groundGeo, mat(0x7ec850));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.35;
ground.receiveShadow = true;
scene.add(ground);

// Decorative elements outside
function createFlower(x, z, color) {
  const g = new THREE.Group();
  const stemGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.5, 5);
  const stem = new THREE.Mesh(stemGeo, mat(0x228b22));
  stem.position.y = 0.25;
  g.add(stem);
  const petalGeo = new THREE.SphereGeometry(0.12, 5, 4);
  const petal = new THREE.Mesh(petalGeo, mat(color));
  petal.position.y = 0.55;
  petal.scale.set(1, 0.7, 1);
  g.add(petal);
  const centerGeo = new THREE.SphereGeometry(0.05, 4, 3);
  const center = new THREE.Mesh(centerGeo, mat(0xffd700));
  center.position.y = 0.58;
  g.add(center);
  g.position.set(x, -0.35, z);
  return g;
}
for (let i = 0; i < 8; i++) {
  const angle = (i / 8) * Math.PI * 2;
  const r = 6 + Math.random() * 3;
  scene.add(createFlower(Math.cos(angle) * r, Math.sin(angle) * r, [0xff69b4, 0xff6347, 0xda70d6, 0xffa07a][i % 4]));
}

// --- HAMSTERS ---
const hamsterConfigs = [
  { body: 0xf4a460, belly: 0xffe4c4, name: 'Nugget' },
  { body: 0xffffff, belly: 0xfff0f0, name: 'Snowball' },
  { body: 0x8b6914, belly: 0xdeb887, name: 'Cocoa' },
  { body: 0xffb6c1, belly: 0xfff0f5, name: 'Blush' },
];

const CAGE_BOUNDS = { minX: -3, maxX: 3, minZ: -2, maxZ: 2 };
const WHEEL_POS = new THREE.Vector3(2.2, 0.15, -1.5);
const FOOD_POS = new THREE.Vector3(-2, 0.15, 1.2);

const hamsters = [];

hamsterConfigs.forEach((cfg, i) => {
  const mesh = createHamster(cfg.body, cfg.belly);
  const startX = (Math.random() - 0.5) * 4;
  const startZ = (Math.random() - 0.5) * 3;
  mesh.position.set(startX, 0.15, startZ);
  mesh.rotation.y = Math.random() * Math.PI * 2;
  scene.add(mesh);

  const hamster = {
    mesh,
    name: cfg.name,
    state: 'wander', // wander, pause, wheel, food
    target: new THREE.Vector3(startX, 0.15, startZ),
    speed: 0.4 + Math.random() * 0.3,
    pauseTimer: 0,
    stateTimer: 0,
    bobPhase: Math.random() * Math.PI * 2,
    earWigglePhase: Math.random() * Math.PI * 2,
  };
  pickNewTarget(hamster);
  hamsters.push(hamster);
});

function pickNewTarget(h) {
  const roll = Math.random();
  if (roll < 0.2) {
    h.state = 'wheel';
    h.target.copy(WHEEL_POS).add(new THREE.Vector3((Math.random()-0.5)*0.5, 0, (Math.random()-0.5)*0.5));
  } else if (roll < 0.35) {
    h.state = 'food';
    h.target.copy(FOOD_POS).add(new THREE.Vector3((Math.random()-0.5)*0.5, 0, (Math.random()-0.5)*0.5));
  } else {
    h.state = 'wander';
    h.target.set(
      CAGE_BOUNDS.minX + Math.random() * (CAGE_BOUNDS.maxX - CAGE_BOUNDS.minX),
      0.15,
      CAGE_BOUNDS.minZ + Math.random() * (CAGE_BOUNDS.maxZ - CAGE_BOUNDS.minZ)
    );
  }
  h.stateTimer = 3 + Math.random() * 5;
}

function updateHamster(h, dt, time) {
  const pos = h.mesh.position;
  const target = h.target;
  const dist = pos.distanceTo(target);

  // State timer
  h.stateTimer -= dt;
  if (h.stateTimer <= 0) {
    if (h.state === 'pause') {
      pickNewTarget(h);
    } else {
      h.state = 'pause';
      h.pauseTimer = 1 + Math.random() * 2;
      h.stateTimer = h.pauseTimer;
    }
    return;
  }

  if (h.state === 'pause') {
    // Just wiggle ears
    return;
  }

  // Move toward target
  if (dist > 0.3) {
    const dir = new THREE.Vector3().subVectors(target, pos);
    dir.y = 0;
    dir.normalize();

    // Rotate to face direction
    const targetAngle = Math.atan2(dir.x, dir.z);
    let angleDiff = targetAngle - h.mesh.rotation.y;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    h.mesh.rotation.y += angleDiff * Math.min(dt * 5, 1);

    // Move
    pos.addScaledVector(dir, h.speed * dt);

    // Bob animation
    h.bobPhase += dt * 12;
    h.mesh.position.y = 0.15 + Math.abs(Math.sin(h.bobPhase)) * 0.03;

    // Slight tilt when moving
    h.mesh.rotation.z = Math.sin(h.bobPhase * 0.5) * 0.05;
  } else {
    // Arrived - idle bob
    h.bobPhase += dt * 4;
    h.mesh.position.y = 0.15 + Math.sin(h.bobPhase) * 0.01;
    h.mesh.rotation.z *= 0.9;
  }

  // Ear wiggle
  h.earWigglePhase += dt * 3;
  const earWiggle = Math.sin(h.earWigglePhase) * 0.05;
  h.mesh.children[3].rotation.z = earWiggle; // left ear
  h.mesh.children[4].rotation.z = -earWiggle; // right ear

  // Clamp to cage
  pos.x = Math.max(CAGE_BOUNDS.minX, Math.min(CAGE_BOUNDS.maxX, pos.x));
  pos.z = Math.max(CAGE_BOUNDS.minZ, Math.min(CAGE_BOUNDS.maxZ, pos.z));
}

// --- ANIMATE WHEEL ---
let wheelAngle = 0;

// --- ANIMATION LOOP ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  // Update hamsters
  hamsters.forEach(h => updateHamster(h, dt, time));

  // Spin wheel slowly
  wheelAngle += dt * 0.5;
  wheel.userData.ring.rotation.x = wheelAngle;
  wheel.userData.spokes.forEach(s => s.rotation.x = wheelAngle);

  // Gentle scene sway
  scene.rotation.y = Math.sin(time * 0.1) * 0.01;

  controls.update();
  renderer.render(scene, camera);
}

animate();

// --- RESIZE ---
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
