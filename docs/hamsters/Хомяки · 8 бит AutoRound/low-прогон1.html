<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Low-Poly Hamster Playground</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 16px; left: 16px;
            color: #fff; pointer-events: none;
        }
        #ui h1 { font-size: 18px; opacity: 0.9; margin-bottom: 4px; }
        #ui p { font-size: 12px; opacity: 0.6; }
        #hamster-name {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 14px; opacity: 0; transition: opacity 0.3s;
            background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 20px;
        }
    </style>
</head>
<body>
<div id="ui">
    <h1>🐹 Low-Poly Hamster Playground</h1>
    <p>Drag to rotate • Scroll to zoom</p>
</div>
<div id="hamster-name"></div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── SCENE SETUP ───────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 15, 30);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5, 4, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 3;
controls.maxDistance = 12;
controls.target.set(0, 0.5, 0);

// ─── LIGHTING ──────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
sunLight.position.set(3, 6, 2);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(1024, 1024);
sunLight.shadow.camera.left = -5;
sunLight.shadow.camera.right = 5;
sunLight.shadow.camera.top = 5;
sunLight.shadow.camera.bottom = -5;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0xb0d4ff, 0.3);
fillLight.position.set(-2, 3, -2);
scene.add(fillLight);

// ─── MATERIALS ─────────────────────────────────────────────────
const mat = {
    tray: new THREE.MeshStandardMaterial({ color: 0x4a90d9, roughness: 0.8 }),
    bedding: new THREE.MeshStandardMaterial({ color: 0xf5deb3, roughness: 1 }),
    cageWire: new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.3 }),
    cageBase: new THREE.MeshStandardMaterial({ color: 0x3a7bc8, roughness: 0.6 }),
    wheel: new THREE.MeshStandardMaterial({ color: 0xff6b6b, roughness: 0.5 }),
    wheelHub: new THREE.MeshStandardMaterial({ color: 0xaaa, metalness: 0.6 }),
    bowl: new THREE.MeshStandardMaterial({ color: 0x50fa7b, roughness: 0.4 }),
    food: new THREE.MeshStandardMaterial({ color: 0xd4a03c, roughness: 0.9 }),
    tunnel: new THREE.MeshStandardMaterial({ color: 0xa29bfe, roughness: 0.5 }),
    plant: new THREE.MeshStandardMaterial({ color: 0x2ecc71, roughness: 0.8 }),
    pot: new THREE.MeshStandardMaterial({ color: 0xe17055, roughness: 0.7 }),
};

// ─── FLOOR / TRAY ──────────────────────────────────────────────
function createTray() {
    const group = new THREE.Group();

    // Base
    const base = new THREE.Mesh(new THREE.BoxGeometry(6, 0.3, 4), mat.cageBase);
    base.position.y = -0.15;
    base.receiveShadow = true;
    group.add(base);

    // Bedding
    const bedding = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.2, 3.6), mat.bedding);
    bedding.position.y = 0.1;
    bedding.receiveShadow = true;
    group.add(bedding);

    // Bedding bumps (small random cylinders for texture)
    for (let i = 0; i < 30; i++) {
        const bump = new THREE.Mesh(
            new THREE.CylinderGeometry(0.08 + Math.random() * 0.06, 0.1, 0.05, 5),
            new THREE.MeshStandardMaterial({ color: 0xede0c8, roughness: 1 })
        );
        bump.position.set(
            (Math.random() - 0.5) * 5,
            0.22,
            (Math.random() - 0.5) * 3.2
        );
        bump.rotation.y = Math.random() * Math.PI;
        group.add(bump);
    }

    return group;
}
scene.add(createTray());

// ─── CAGE WIRES ────────────────────────────────────────────────
function createCage() {
    const group = new THREE.Group();
    const wireGeo = new THREE.CylinderGeometry(0.015, 0.015, 2.5, 4);

    // Vertical wires - front and back
    for (let x = -2.5; x <= 2.5; x += 0.5) {
        const wireF = new THREE.Mesh(wireGeo, mat.cageWire);
        wireF.position.set(x, 1.45, 1.75);
        group.add(wireF);

        const wireB = new THREE.Mesh(wireGeo, mat.cageWire);
        wireB.position.set(x, 1.45, -1.75);
        group.add(wireB);
    }

    // Vertical wires - sides
    for (let z = -1.5; z <= 1.5; z += 0.5) {
        const wireL = new THREE.Mesh(wireGeo, mat.cageWire);
        wireL.position.set(-2.75, 1.45, z);
        group.add(wireL);

        const wireR = new THREE.Mesh(wireGeo, mat.cageWire);
        wireR.position.set(2.75, 1.45, z);
        group.add(wireR);
    }

    // Horizontal wires - top frame
    const topFrame = [
        new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 5.5, 6), mat.cageWire),
        new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 5.5, 6), mat.cageWire),
        new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 3.5, 6), mat.cageWire),
        new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 3.5, 6), mat.cageWire),
    ];
    topFrame[0].position.set(0, 2.7, 1.75);
    topFrame[0].rotation.z = Math.PI / 2;
    topFrame[1].position.set(0, 2.7, -1.75);
    topFrame[1].rotation.z = Math.PI / 2;
    topFrame[2].position.set(-2.75, 2.7, 0);
    topFrame[2].rotation.x = Math.PI / 2;
    topFrame[3].position.set(2.75, 2.7, 0);
    topFrame[3].rotation.x = Math.PI / 2;
    topFrame.forEach(m => group.add(m));

    // Mid horizontal wires
    for (let y = 0.8; y < 2.7; y += 0.6) {
        const hFront = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 5.5, 4), mat.cageWire);
        hFront.position.set(0, y, 1.75);
        hFront.rotation.z = Math.PI / 2;
        group.add(hFront);

        const hBack = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 5.5, 4), mat.cageWire);
        hBack.position.set(0, y, -1.75);
        hBack.rotation.z = Math.PI / 2;
        group.add(hBack);

        const hLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 3.5, 4), mat.cageWire);
        hLeft.position.set(-2.75, y, 0);
        hLeft.rotation.x = Math.PI / 2;
        group.add(hLeft);

        const hRight = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 3.5, 4), mat.cageWire);
        hRight.position.set(2.75, y, 0);
        hRight.rotation.x = Math.PI / 2;
        group.add(hRight);
    }

    return group;
}
scene.add(createCage());

// ─── RUNNING WHEEL ─────────────────────────────────────────────
const wheelGroup = new THREE.Group();
wheelGroup.position.set(-2, 0.55, -1.2);

const wheelRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.5, 0.06, 6, 12),
    mat.wheel
);
wheelRing.castShadow = true;
wheelGroup.add(wheelRing);

// Spokes
for (let i = 0; i < 6; i++) {
    const spoke = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.02, 0.9, 4),
        mat.wheel
    );
    spoke.rotation.z = (i / 6) * Math.PI;
    wheelGroup.add(spoke);
}

const hub = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 4), mat.wheelHub);
wheelGroup.add(hub);

// Stand
const stand = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.3, 0.3), mat.wheelHub);
stand.position.y = -0.5;
wheelGroup.add(stand);

scene.add(wheelGroup);
let wheelSpeed = 0;

// ─── FOOD BOWL ─────────────────────────────────────────────────
const bowlGroup = new THREE.Group();
bowlGroup.position.set(2, 0.25, 1);

const bowl = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.2, 0.15, 8),
    mat.bowl
);
bowl.castShadow = true;
bowlGroup.add(bowl);

// Food pellets
for (let i = 0; i < 6; i++) {
    const pellet = new THREE.Mesh(
        new THREE.DodecahedronGeometry(0.05, 0),
        mat.food
    );
    pellet.position.set(
        (Math.random() - 0.5) * 0.3,
        0.1,
        (Math.random() - 0.5) * 0.3
    );
    bowlGroup.add(pellet);
}
scene.add(bowlGroup);

// ─── TUNNEL ────────────────────────────────────────────────────
const tunnelGroup = new THREE.Group();
tunnelGroup.position.set(0.5, 0.35, -1.3);
tunnelGroup.rotation.y = 0.3;

const tunnelBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.3, 1.2, 8, 1, true),
    mat.tunnel
);
tunnelBody.rotation.z = Math.PI / 2;
tunnelBody.castShadow = true;
tunnelGroup.add(tunnelBody);

// Tunnel ends
const endMat = mat.tunnel.clone();
endMat.side = THREE.DoubleSide;
const end1 = new THREE.Mesh(new THREE.CircleGeometry(0.3, 8), endMat);
end1.position.x = 0.6;
end1.rotation.y = Math.PI / 2;
tunnelGroup.add(end1);
const end2 = new THREE.Mesh(new THREE.CircleGeometry(0.3, 8), endMat);
end2.position.x = -0.6;
end2.rotation.y = -Math.PI / 2;
tunnelGroup.add(end2);

scene.add(tunnelGroup);

// ─── PLANT DECORATION ──────────────────────────────────────────
function createPlant(x, z) {
    const g = new THREE.Group();
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.2, 6), mat.pot);
    pot.position.y = 0.1;
    g.add(pot);
    for (let i = 0; i < 3; i++) {
        const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.3, 4), mat.plant);
        leaf.position.set((i - 1) * 0.06, 0.35, (i % 2) * 0.04);
        leaf.rotation.z = (i - 1) * 0.2;
        g.add(leaf);
    }
    g.position.set(x, 0.2, z);
    return g;
}
scene.add(createPlant(-1.5, 1.3));
scene.add(createPlant(1.8, -0.8));

// ─── HAMSTER FACTORY ───────────────────────────────────────────
const HAMSTER_COLORS = [
    { body: 0xf39c12, belly: 0xfdebd0, name: 'Nugget' },
    { body: 0xecf0f1, belly: 0xffffff, name: 'Snowball' },
    { body: 0x8d6e63, belly: 0xd7ccc8, name: 'Cocoa' },
    { body: 0xbdc3c7, belly: 0xecf0f1, name: 'Pebble' },
];

function createHamster(colorData, index) {
    const group = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: colorData.body, roughness: 0.8, flatShading: true });
    const bellyMat = new THREE.MeshStandardMaterial({ color: colorData.belly, roughness: 0.9, flatShading: true });

    // Body
    const body = new THREE.Mesh(new THREE.DodecahedronGeometry(0.22, 0), bodyMat);
    body.scale.set(1.3, 0.9, 1);
    body.position.y = 0.22;
    body.castShadow = true;
    group.add(body);

    // Belly patch
    const belly = new THREE.Mesh(new THREE.DodecahedronGeometry(0.15, 0), bellyMat);
    belly.scale.set(1, 0.7, 0.8);
    belly.position.set(0.05, 0.18, 0);
    group.add(belly);

    // Head
    const head = new THREE.Mesh(new THREE.DodecahedronGeometry(0.15, 0), bodyMat);
    head.position.set(0.25, 0.3, 0);
    head.castShadow = true;
    group.add(head);

    // Ears
    const earMat = new THREE.MeshStandardMaterial({ color: colorData.body, roughness: 0.9, flatShading: true });
    const earInnerMat = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.9 });
    [-1, 1].forEach(side => {
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.08, 4), earMat);
        ear.position.set(0.22, 0.44, side * 0.08);
        group.add(ear);
        const earInner = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.05, 4), earInnerMat);
        earInner.position.set(0.23, 0.43, side * 0.08);
        group.add(earInner);
    });

    // Eyes
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.3 });
    [-1, 1].forEach(side => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 4), eyeMat);
        eye.position.set(0.37, 0.32, side * 0.07);
        group.add(eye);
    });

    // Nose
    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.02, 5, 4), new THREE.MeshStandardMaterial({ color: 0xff6b81 }));
    nose.position.set(0.4, 0.27, 0);
    group.add(nose);

    // Whiskers (thin lines)
    const whiskerMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
    [-1, 1].forEach(side => {
        for (let w = 0; w < 2; w++) {
            const points = [
                new THREE.Vector3(0.38, 0.27 + w * 0.02, side * 0.06),
                new THREE.Vector3(0.5, 0.25 + w * 0.03, side * 0.12),
            ];
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            group.add(new THREE.Line(geo, whiskerMat));
        }
    });

    // Tail (tiny nub)
    const tail = new THREE.Mesh(new THREE.SphereGeometry(0.03, 4, 3), bodyMat);
    tail.position.set(-0.28, 0.22, 0);
    group.add(tail);

    // Feet (small bumps)
    const footMat = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.9 });
    [[0.15, 0.05, 0.08], [0.15, 0.05, -0.08], [-0.15, 0.05, 0.08], [-0.15, 0.05, -0.08]].forEach(pos => {
        const foot = new THREE.Mesh(new THREE.SphereGeometry(0.035, 4, 3), footMat);
        foot.position.set(...pos);
        group.add(foot);
    });

    group.position.set(
        (Math.random() - 0.5) * 3,
        0.2,
        (Math.random() - 0.5) * 2
    );
    group.rotation.y = Math.random() * Math.PI * 2;

    return group;
}

// ─── HAMSTER AI ────────────────────────────────────────────────
const hamsters = [];
const STATES = { WALKING: 0, PAUSED: 1, TURNING: 2, AT_WHEEL: 3, AT_BOWL: 4 };
const WHEEL_POS = new THREE.Vector3(-2, 0.2, -1.2);
const BOWL_POS = new THREE.Vector3(2, 0.2, 1);

HAMSTER_COLORS.forEach((colorData, i) => {
    const mesh = createHamster(colorData, i);
    scene.add(mesh);
    hamsters.push({
        mesh,
        name: colorData.name,
        state: STATES.WALKING,
        speed: 0.4 + Math.random() * 0.3,
        targetAngle: Math.random() * Math.PI * 2,
        targetPos: null,
        timer: 0,
        pauseDuration: 0,
        bobPhase: Math.random() * Math.PI * 2,
    });
});

function pickNewTarget(h) {
    const roll = Math.random();
    if (roll < 0.25) {
        h.state = STATES.AT_WHEEL;
        h.targetPos = WHEEL_POS.clone().add(new THREE.Vector3(
            (Math.random() - 0.5) * 0.3, 0, (Math.random() - 0.5) * 0.3
        ));
    } else if (roll < 0.45) {
        h.state = STATES.AT_BOWL;
        h.targetPos = BOWL_POS.clone().add(new THREE.Vector3(
            (Math.random() - 0.5) * 0.3, 0, (Math.random() - 0.5) * 0.3
        ));
    } else {
        h.state = STATES.WALKING;
        h.targetPos = new THREE.Vector3(
            (Math.random() - 0.5) * 4.5,
            0.2,
            (Math.random() - 0.5) * 3
        );
    }
}

function updateHamster(h, dt, time) {
    const pos = h.mesh.position;
    h.timer -= dt;

    switch (h.state) {
        case STATES.WALKING: {
            if (!h.targetPos || pos.distanceTo(h.targetPos) < 0.15 || h.timer <= 0) {
                if (Math.random() < 0.3) {
                    h.state = STATES.PAUSED;
                    h.pauseDuration = 0.5 + Math.random() * 1.5;
                    h.timer = h.pauseDuration;
                } else if (Math.random() < 0.4) {
                    h.state = STATES.TURNING;
                    h.targetAngle = Math.random() * Math.PI * 2;
                    h.timer = 0.5 + Math.random() * 0.5;
                } else {
                    pickNewTarget(h);
                    h.timer = 5 + Math.random() * 5;
                }
            } else {
                const dir = h.targetPos.clone().sub(pos);
                dir.y = 0;
                if (dir.length() > 0.01) {
                    dir.normalize();
                    const targetRot = Math.atan2(dir.x, dir.z);
                    let angleDiff = targetRot - h.mesh.rotation.y;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    h.mesh.rotation.y += angleDiff * 3 * dt;

                    pos.add(dir.multiplyScalar(h.speed * dt));
                }
            }
            break;
        }
        case STATES.PAUSED: {
            if (h.timer <= 0) {
                pickNewTarget(h);
                h.timer = 5 + Math.random() * 5;
            }
            break;
        }
        case STATES.TURNING: {
            const diff = h.targetAngle - h.mesh.rotation.y;
            h.mesh.rotation.y += diff * 4 * dt;
            if (h.timer <= 0) {
                pickNewTarget(h);
                h.timer = 5 + Math.random() * 5;
            }
            break;
        }
        case STATES.AT_WHEEL: {
            if (pos.distanceTo(WHEEL_POS) > 0.3) {
                const dir = WHEEL_POS.clone().sub(pos);
                dir.y = 0;
                if (dir.length() > 0.01) {
                    dir.normalize();
                    const targetRot = Math.atan2(dir.x, dir.z);
                    let angleDiff = targetRot - h.mesh.rotation.y;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    h.mesh.rotation.y += angleDiff * 4 * dt;
                    pos.add(dir.multiplyScalar(h.speed * 1.5 * dt));
                }
            } else {
                // Running in wheel!
                wheelSpeed = Math.min(wheelSpeed + dt * 2, 3);
                h.mesh.rotation.y = Math.atan2(WHEEL_POS.x - pos.x, WHEEL_POS.z - pos.z);
                // Bob animation
                h.bobPhase += dt * 12;
                h.mesh.position.y = 0.2 + Math.sin(h.bobPhase) * 0.03;
                h.timer -= dt;
                if (h.timer <= 0) {
                    h.timer = 3 + Math.random() * 4;
                    if (Math.random() < 0.3) {
                        pickNewTarget(h);
                        h.timer = 5 + Math.random() * 5;
                    }
                }
            }
            break;
        }
        case STATES.AT_BOWL: {
            if (pos.distanceTo(BOWL_POS) > 0.35) {
                const dir = BOWL_POS.clone().sub(pos);
                dir.y = 0;
                if (dir.length() > 0.01) {
                    dir.normalize();
                    const targetRot = Math.atan2(dir.x, dir.z);
                    let angleDiff = targetRot - h.mesh.rotation.y;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    h.mesh.rotation.y += angleDiff * 4 * dt;
                    pos.add(dir.multiplyScalar(h.speed * 1.5 * dt));
                }
            } else {
                // Eating!
                h.mesh.rotation.y = Math.atan2(BOWL_POS.x - pos.x, BOWL_POS.z - pos.z);
                h.bobPhase += dt * 8;
                h.mesh.position.y = 0.2 + Math.abs(Math.sin(h.bobPhase)) * 0.04;
                h.timer -= dt;
                if (h.timer <= 0) {
                    h.timer = 2 + Math.random() * 3;
                    if (Math.random() < 0.4) {
                        pickNewTarget(h);
                        h.timer = 5 + Math.random() * 5;
                    }
                }
            }
            break;
        }
    }

    // Clamp to cage bounds
    pos.x = THREE.MathUtils.clamp(pos.x, -2.4, 2.4);
    pos.z = THREE.MathUtils.clamp(pos.z, -1.5, 1.5);

    // Walking bob
    if (h.state === STATES.WALKING && h.targetPos && pos.distanceTo(h.targetPos) > 0.15) {
        h.bobPhase += dt * 10;
        h.mesh.position.y = 0.2 + Math.sin(h.bobPhase) * 0.02;
    }
}

// ─── ANIMATION LOOP ────────────────────────────────────────────
const clock = new THREE.Clock();
const nameEl = document.getElementById('hamster-name');

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const time = clock.elapsedTime;

    // Update hamsters
    hamsters.forEach(h => updateHamster(h, dt, time));

    // Wheel rotation
    wheelSpeed *= 0.98; // friction
    wheelGroup.rotation.x += wheelSpeed * dt;

    // Subtle wheel idle wobble
    wheelGroup.rotation.x += Math.sin(time * 0.5) * 0.001;

    // Gentle plant sway
    scene.traverse(obj => {
        if (obj.geometry && obj.geometry.type === 'ConeGeometry' && obj.material === mat.plant) {
            obj.rotation.z = Math.sin(time * 2 + obj.position.x * 10) * 0.05;
        }
    });

    controls.update();
    renderer.render(scene, camera);
}
animate();

// ─── RAYCASTER FOR HOVER NAMES ─────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('mousemove', (e) => {
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const allMeshes = [];
    hamsters.forEach(h => h.mesh.traverse(c => { if (c.isMesh) { c.userData.hamsterRef = h; allMeshes.push(c); } }));
    const hits = raycaster.intersectObjects(allMeshes);

    if (hits.length > 0) {
        const h = hits[0].object.userData.hamsterRef;
        if (h) {
            nameEl.textContent = `🐹 ${h.name}`;
            nameEl.style.opacity = '1';
        }
    } else {
        nameEl.style.opacity = '0';
    }
});

// ─── RESIZE ────────────────────────────────────────────────────
window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
