<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Low-Poly Hamster Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff8ef; --ink:#5a4331; --ink2:#93795f;
    --coral:#ff7a5c; --sun:#ffcf5c; --mint:#7fd6b0; --sky:#8fd0ff;
    --panel:#fffdf8;
    --shadow:0 14px 30px -14px rgba(120,70,30,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#ffe7cd;color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0;z-index:0}
  canvas{display:block;touch-action:none}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;z-index:5;pointer-events:none}

  .brand{position:absolute;top:clamp(14px,3vw,30px);left:clamp(14px,3vw,30px);
    display:flex;gap:14px;align-items:center;max-width:min(92vw,430px)}
  .logo{flex:0 0 auto;width:clamp(52px,9vw,74px);height:auto;filter:drop-shadow(0 8px 12px rgba(120,60,20,.25))}
  .eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--coral)}
  .title{font-family:'Fredoka';font-weight:700;line-height:.95;margin:2px 0 4px;
    font-size:clamp(2rem,6.4vw,3.5rem);color:var(--ink);text-shadow:0 2px 0 #fff}
  .title span{color:var(--coral)}
  .tagline{font-weight:700;color:var(--ink2);font-size:clamp(.82rem,2.4vw,1rem);margin:0}

  .panel{position:absolute;top:clamp(14px,3vw,30px);right:clamp(14px,3vw,30px);
    width:min(360px,88vw);background:var(--panel);border-radius:22px;padding:16px 16px 14px;
    box-shadow:var(--shadow);border:3px solid #fff;pointer-events:auto;
    animation:pop .5s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
  .panel h2{font-family:'Fredoka';font-weight:600;font-size:1.05rem;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
  .panel h2 small{font-family:'Nunito';font-weight:800;font-size:.62rem;letter-spacing:.14em;color:var(--ink2);text-transform:uppercase}
  .roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .roster li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:14px;transition:background .2s}
  .roster li:hover{background:#fff3e2}
  .swatch{width:20px;height:20px;border-radius:50%;flex:0 0 auto;box-shadow:inset -3px -3px 0 rgba(0,0,0,.12),inset 2px 2px 0 rgba(255,255,255,.4)}
  .name{font-family:'Fredoka';font-weight:600;font-size:1rem}
  .status{margin-left:auto;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;background:#f2ece2;color:var(--ink2);white-space:nowrap;transition:.2s}
  .status[data-s="wheel"]{background:#ffe0d6;color:#d8542f}
  .status[data-s="food"]{background:#ffeccb;color:#b8860b}
  .status[data-s="tunnel"]{background:#d9f2e7;color:#2f8f66}
  .status[data-s="walk"]{background:#e4efff;color:#2f6fd8}
  .status[data-s="idle"]{background:#efe9e0;color:#8a7a68}
  .hint{margin:12px 2px 0;font-size:.78rem;font-weight:700;color:var(--ink2);line-height:1.4}
  .hint b{color:var(--coral)}

  .dock{position:absolute;left:50%;bottom:clamp(14px,3vw,26px);transform:translateX(-50%);
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:auto;max-width:94vw}
  .btn{font-family:'Fredoka';font-weight:600;font-size:.92rem;border:none;cursor:pointer;
    padding:11px 18px;border-radius:16px;color:var(--ink);background:var(--panel);
    box-shadow:0 4px 0 #e7d6bf,var(--shadow);transition:transform .12s,box-shadow .12s,background .2s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #e7d6bf,var(--shadow)}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #e7d6bf,var(--shadow)}
  .btn.primary{background:var(--coral);color:#fff;box-shadow:0 4px 0 #d8542f,var(--shadow)}
  .btn.primary:hover{box-shadow:0 6px 0 #d8542f,var(--shadow)}
  .btn.primary:active{box-shadow:0 1px 0 #d8542f,var(--shadow)}

  /* ---------- loader ---------- */
  #loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 40%,#ffe9d2,#ffd9b8);transition:opacity .6s}
  #loader.hide{opacity:0;pointer-events:none}
  .load-inner{text-align:center}
  .spinner{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;
    border:7px solid #ffd9bd;border-top-color:var(--coral);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-inner p{font-family:'Fredoka';font-weight:600;font-size:1.1rem;color:var(--ink);margin:0}

  @media (max-width:640px){
    .panel{top:auto;bottom:96px;width:min(340px,92vw);padding:12px}
    .brand{max-width:70vw}
    .tagline{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="overlay">
  <header class="brand">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="26" cy="30" r="12" fill="#ffcf7a"/><circle cx="26" cy="30" r="6" fill="#fff2d6"/>
      <circle cx="74" cy="30" r="12" fill="#ffcf7a"/><circle cx="74" cy="30" r="6" fill="#fff2d6"/>
      <ellipse cx="50" cy="56" rx="34" ry="30" fill="#ffcf7a"/>
      <ellipse cx="50" cy="70" rx="22" ry="15" fill="#fff2d6"/>
      <circle cx="38" cy="52" r="4.5" fill="#4a3527"/><circle cx="62" cy="52" r="4.5" fill="#4a3527"/>
      <path d="M46 62 Q50 66 54 62" stroke="#4a3527" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="50" cy="58" r="3" fill="#ff8f8f"/>
    </svg>
    <div>
      <div class="eyebrow">A tiny 3D world</div>
      <h1 class="title">Hamster <span>Playground</span></h1>
      <p class="tagline">Five little guys. One very busy cage.</p>
    </div>
  </header>

  <aside class="panel">
    <h2>The Hamsters <small>live status</small></h2>
    <ul class="roster" id="roster"></ul>
    <p class="hint"><b>Drag</b> to orbit · <b>Scroll</b> to zoom · <b>Click</b> a hamster to poke it 🐹</p>
  </aside>

  <div class="dock">
    <button class="btn primary" id="pokeBtn">👉 Poke a hamster</button>
    <button class="btn" id="feedBtn">🌰 Feed everyone</button>
    <button class="btn" id="resetBtn">↺ Reset view</button>
  </div>
</div>

<div id="loader"><div class="load-inner"><div class="spinner"></div><p>warming up the cage…</p></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
const rand = (a,b)=>a+Math.random()*(b-a);
const pick = arr=>arr[(Math.random()*arr.length)|0];
const lerp = THREE.MathUtils.lerp;
const clamp = THREE.MathUtils.clamp;
const smoothstep = THREE.MathUtils.smoothstep;
const easeInOut = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------------- palette ---------------- */
const HAMSTERS = [
  { name:'Nutmeg', body:'#ffcf7a', belly:'#fff2d6' },
  { name:'Biscuit',body:'#f3b183', belly:'#ffe3c9' },
  { name:'Clover', body:'#a9d18e', belly:'#eaf6dd' },
  { name:'Pudding',body:'#c9a2e6', belly:'#f0e6fb' },
  { name:'Rusty',  body:'#e5795b', belly:'#ffd9cb' },
];
const SEEDS = [0x8a5a2b,0xb07a3a,0xd6a24a,0x6f4a24,0xc98b3f];

/* ---------------- renderer / scene ---------------- */
const app = document.getElementById('app');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true });
} catch(e){
  document.querySelector('.load-inner').innerHTML = '<p>Your browser can’t start WebGL 😢</p>';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = makeGradientTexture();
scene.fog = new THREE.Fog(0xffe6cf, 22, 48);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(12, 9, 15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.target.set(0, 1.5, 0);
controls.minDistance = 8;
controls.maxDistance = 30;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI*0.49;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.update();

/* ---------------- lights ---------------- */
scene.add(new THREE.HemisphereLight(0xfff4e2, 0xf0b98a, 0.85));
scene.add(new THREE.AmbientLight(0xffffff, 0.15));

const sun = new THREE.DirectionalLight(0xfff0d6, 1.25);
sun.position.set(9, 15, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 50;
sun.shadow.camera.left=-11; sun.shadow.camera.right=11;
sun.shadow.camera.top=11; sun.shadow.camera.bottom=-11;
sun.shadow.bias = -0.0004;
scene.add(sun);

const rim = new THREE.DirectionalLight(0xbfe0ff, 0.35);
rim.position.set(-8, 6, -9);
scene.add(rim);

/* ---------------- helpers ---------------- */
function mat(color, o={}){ return new THREE.MeshStandardMaterial({ color, roughness:o.rough??0.75, metalness:o.metal??0, flatShading:o.flat??false, emissive:o.emissive??0x000000, emissiveIntensity:o.ei??1 }); }
function box(w,h,d,color,o){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function cyl(rt,rb,h,color,o,seg=12){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function sph(r,color,o){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8), mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function cone(r,h,color,o){ const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,8), mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function torus(r,t,color,o){ const m=new THREE.Mesh(new THREE.TorusGeometry(r,t,8,22), mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function setEmissive(m,c,i){ m.material.emissive.setHex(c); m.material.emissiveIntensity=i; }
function lookTo(obj, x,z){ obj.lookAt(x, obj.position.y, z); }
function makeGradientTexture(){
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const g=c.getContext('2d'); const grd=g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,'#cdeaff'); grd.addColorStop(.55,'#ffe6cf'); grd.addColorStop(1,'#ffd7b6');
  g.fillStyle=grd; g.fillRect(0,0,4,256);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

/* ---------------- environment ---------------- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(60,48), new THREE.MeshBasicMaterial({color:0xffd7b6}));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.02; ground.receiveShadow=true;
scene.add(ground);

// soft shadow blob under the cage
const blob = new THREE.Mesh(new THREE.PlaneGeometry(17,11),
  new THREE.MeshBasicMaterial({color:0x8a5a2b,transparent:true,opacity:0.18,depthWrite:false}));
blob.rotation.x=-Math.PI/2; blob.position.y=0.01; scene.add(blob);

// wooden base + tray
const base = box(15.4,1.2,9.4,'#b5794a'); base.position.y=0.6; scene.add(base);
const tray = box(14.4,0.6,8.4,'#8a5a2b',{flat:true}); tray.position.y=1.25; scene.add(tray);
const bed = box(13.6,0.2,7.6,'#f3e2bd'); bed.position.y=1.55; scene.add(bed); // bedding top ~1.65

const FLOOR_Y = 1.65;
const BOUNDS = { x:5.9, z:3.4 };

// cage glass walls + frame
function wall(w,h,x,z,ry=0){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.12),
  new THREE.MeshPhysicalMaterial({color:0xbfe6ff,transparent:true,opacity:0.16,roughness:0.05,metalness:0}));
  m.position.set(x,z===undefined?z:z,0); m.position.z=z; m.position.x=x; m.position.y=FLOOR_Y+h/2;
  m.rotation.y=ry; m.renderOrder=2; scene.add(m); }
wall(15,4.4, 0,-4.25);        // back
wall(9.4,4.4, -7.5,0, Math.PI/2); // left
wall(9.4,4.4,  7.5,0, Math.PI/2); // right
// frame posts + top rails
const postMat='#6b4a2e';
[[-7.5,-4.25],[7.5,-4.25],[-7.5,4.25],[7.5,4.25]].forEach(([x,z])=>{
  const p=box(0.35,4.6,0.35,postMat); p.position.set(x,FLOOR_Y+2.2,z); scene.add(p);
});
const topY=FLOOR_Y+4.4;
[[-7.5,0,9.4,0],[7.5,0,9.4,0],[0,-4.25,15,0],[0,4.25,15,0]].forEach(([x,z,len,ry])=>{
  const r=box(len,0.35,0.35,postMat); r.position.set(x,topY,z); r.rotation.y=ry; scene.add(r);
});

/* ---------------- interactive objects ---------------- */
// Wheel
const wheel = { group:new THREE.Group(), spin:0, spinVel:0, speed:0, active:null, lastPush:0, lastStatus:0, status:'' };
wheel.group.position.set(-4.6,FLOOR_Y,1.6);
const wbase=cyl(1.05,1.2,0.3,'#e58a3c',{flat:true},16); wbase.position.y=0.15; wheel.group.add(wbase);
const wpost=cyl(0.16,0.22,0.8,'#b5794a',{flat:true},10); wpost.position.y=0.6; wheel.group.add(wpost);
const waxis=cyl(0.1,0.1,1.7,'#8a5a2b',{flat:true},8); waxis.rotation.x=Math.PI/2; waxis.position.y=1.1; wheel.group.add(waxis);
const wbody=new THREE.Group(); wbody.position.y=1.1;
const wring=torus(0.95,0.14,'#ff8a5c',{flat:true}); wring.material.side=THREE.DoubleSide; wbody.add(wring);
for(let i=0;i<8;i++){ const s=cyl(0.05,0.05,1.85,'#ffb98a',{flat:true},6); s.rotation.z=(i/8)*Math.PI; wbody.add(s); }
const whub=sph(0.18,'#ffd23f',{flat:true}); wbody.add(whub);
wheel.group.add(wbody); scene.add(wheel.group);
const WHEEL_POS = wheel.group.position.clone();

// Tunnel
const tunnel = { group:new THREE.Group(), occupied:null, exit:V3(-4.5,FLOOR_Y,-1.5) };
tunnel.group.position.set(-1.3,FLOOR_Y,-2.2);
const tunnelMesh=torus(0.9,0.34,'#7fd6b0',{flat:true}); tunnelMesh.material.side=THREE.DoubleSide;
tunnelMesh.rotation.x=Math.PI/2; tunnelMesh.scale.set(1,1,1.35); tunnel.group.add(tunnelMesh);
scene.add(tunnel.group);
const TUNNEL_IN=V3(-1.3,FLOOR_Y,-2.2), TUNNEL_OUT=V3(-1.3,FLOOR_Y,-0.3);

// Food bowl
const bowl = { group:new THREE.Group(), full:1, nextRefill:0, lastStatus:0, status:'' };
bowl.group.position.set(3.9,FLOOR_Y,2.0);
const bouter=cyl(0.9,0.6,0.5,'#ff6f91',{flat:true},16); bouter.position.y=0.25; bowl.group.add(bouter);
const binner=cyl(0.72,0.5,0.15,'#ffe1ec',{flat:true},16); binner.position.y=0.42; bowl.group.add(binner);
const foodGroup=new THREE.Group(); foodGroup.position.y=0.42; bowl.group.add(foodGroup);
const FOOD_SPOTS=[]; for(let i=0;i<14;i++){ const a=rand(0,Math.PI*2),r=rand(0,0.5); FOOD_SPOTS.push([Math.cos(a)*r,Math.sin(a)*r]); }
const foodMeshes=[];
FOOD_SPOTS.forEach((sp,i)=>{ const s=sph(0.11,SEEDS[i%SEEDS.length],{flat:true}); s.position.set(sp[0],0.05,sp[1]); foodGroup.add(s); foodMeshes.push(s); });
scene.add(bowl.group);
const BOWL_POS=bowl.group.position.clone();

// Toy ball
const ball = { mesh:sph(0.5,'#ffd23f',{flat:true}), vel:V3(), lastKick:0 };
ball.mesh.position.set(1.5,FLOOR_Y+0.5,0.4); scene.add(ball.mesh);
const ballRing=torus(0.5,0.06,'#ff6f91',{flat:true}); ballRing.rotation.x=Math.PI/2; ball.mesh.add(ballRing);

// Hidey house
const house = { group:new THREE.Group(), pos:V3(4.4,FLOOR_Y,-2.0) };
house.group.position.copy(house.pos);
const hw=box(2.0,1.4,1.6,'#7fb0ff',{flat:true}); hw.position.y=0.7; house.group.add(hw);
const roof=cone(1.7,1.1,'#ff8fa3',{flat:true}); roof.position.y=1.95; house.group.add(roof);
const door=new THREE.Mesh(new THREE.CircleGeometry(0.45,16),mat('#3a2c22',{flat:true})); door.position.set(0,0.55,0.81); house.group.add(door);
const flag=cyl(0.03,0.03,0.7,'#8a5a2b',{flat:true}); flag.position.set(0,2.9,0); house.group.add(flag);
const flagTop=cone(0.18,0.35,'#ffd23f',{flat:true}); flagTop.position.set(0,3.25,0); flagTop.rotation.z=0.5; house.group.add(flagTop);
scene.add(house.group);
const HOUSE_POS=house.pos.clone();

// scattered seeds
for(let i=0;i<16;i++){ const s=sph(rand(0.05,0.09),SEEDS[i%SEEDS.length],{flat:true});
  s.position.set(rand(-5,5),FLOOR_Y+0.05,rand(-2.5,2.5)); scene.add(s); }

// plants + clouds (backdrop life)
const plants=[];
function plant(x,z,scale,leaf){
  const g=new THREE.Group(); g.position.set(x,FLOOR_Y,z); g.scale.setScalar(scale);
  const pot=cyl(0.4,0.3,0.5,'#e58a3c',{flat:true},10); pot.position.y=0.25; g.add(pot);
  const stem=cyl(0.08,0.1,0.9,'#7a9a4a',{flat:true},6); stem.position.y=0.8; g.add(stem);
  for(let i=0;i<5;i++){ const l=sph(rand(0.22,0.34),leaf,{flat:true}); l.position.set(rand(-0.3,0.3),rand(1.1,1.6),rand(-0.3,0.3)); g.add(l); }
  scene.add(g); plants.push({g,phase:rand(0,6.4)});
}
plant(6.4,-3.5,1.1,'#8fce6a'); plant(-6.5,3.2,0.9,'#a9d18e'); plant(6.6,3.0,0.8,'#8fce6a');

const clouds=[];
function cloud(x,y,z,s){
  const g=new THREE.Group(); g.position.set(x,y,z); g.scale.setScalar(s);
  for(let i=0;i<4;i++){ const c=sph(rand(0.6,1.0),'#ffffff',{flat:true,rough:1}); c.position.set(i*0.9-1.3,rand(-0.2,0.2),rand(-0.3,0.3)); g.add(c); }
  scene.add(g); clouds.push({g,baseX:x,speed:rand(0.15,0.35)});
}
cloud(-14,9,-16,2.2); cloud(10,11,-18,2.8); cloud(2,7,-20,1.8);

/* ---------------- hamsters ---------------- */
class Hamster {
  constructor(cfg, idx){
    this.name=cfg.name; this.cfg=cfg; this.idx=idx;
    this.group=new THREE.Group();
    this.bodyMat=mat(cfg.body,{flat:true});
    this.bellyMat=mat(cfg.belly,{flat:true});
    this.build();
    this.group.position.set(rand(-4,4), FLOOR_Y, rand(-2.5,2.5));
    this.dir=rand(0,Math.PI*2); this.speed=0; this.baseSpeed=rand(1.2,1.9);
    this.state='walk'; this.stateTime=0; this.decideTime=rand(0.3,1.2);
    this.walkPhase=rand(0,6.4); this.bobPhase=rand(0,6.4); this.blinkTimer=rand(1,4);
    this.head=null; this.body=null; this.legs=[]; this.eyes=[]; this.cheeks=null; this.tail=null;
    this.poke=0; this.wheelTarget=null; this.tunnelT=0;
    this.status='walk';
    scene.add(this.group);
    this.buildUI();
  }
  build(){
    const g=this.group;
    const body=sph(0.62,0x000000); body.material=this.bodyMat; body.scale.set(1.05,0.92,1.2); body.position.y=0.5; g.add(body); this.body=body;
    const belly=sph(0.5,0x000000); belly.material=this.bellyMat; belly.scale.set(0.8,0.7,0.95); belly.position.set(0,0.42,0.32); g.add(belly);
    const head=sph(0.5,0x000000); head.material=this.bodyMat; head.position.set(0,0.78,0.5); g.add(head); this.head=head;
    const snout=sph(0.22,0x000000); snout.material=this.bellyMat; snout.position.set(0,0.7,0.9); g.add(snout);
    const nose=sph(0.09,0xff8f8f,{flat:true}); nose.position.set(0,0.72,1.08); g.add(nose);
    [-1,1].forEach(s=>{
      const ear=sph(0.22,0x000000); ear.material=this.bodyMat; ear.position.set(0.3*s,1.12,0.35); g.add(ear);
      const earIn=sph(0.12,0xff9db0,{flat:true}); earIn.position.set(0.3*s,1.12,0.42); g.add(earIn);
      const eye=sph(0.09,0x2b1f1a,{flat:true,rough:0.4}); eye.position.set(0.26*s,0.86,0.9); g.add(eye); this.eyes.push(eye);
      const cheek=sph(0.14,0xffb3c1,{flat:true}); cheek.position.set(0.34*s,0.66,0.82); g.add(cheek);
    });
    if(!this.cheeks){ this.cheeks=[g.children[g.children.length-2],g.children[g.children.length-1]]; }
    this.tail=sph(0.14,0x000000); this.tail.material=this.bellyMat; this.tail.position.set(0,0.5,-0.62); g.add(this.tail);
    const legPos=[[0.3,0.55],[ -0.3,0.55],[0.3,-0.55],[-0.3,-0.55]];
    legPos.forEach(([x,z])=>{ const l=sph(0.16,0x000000); l.material=this.bodyMat; l.position.set(x,0.16,z); g.add(l); this.legs.push(l); });
    g.scale.setScalar(rand(0.92,1.08));
  }
  buildUI(){
    const li=document.createElement('li');
    li.innerHTML=`<span class="swatch" style="background:${this.cfg.body}"></span>
      <span class="name">${this.name}</span><span class="status" data-s="walk">walking</span>`;
    this.statusEl=li.querySelector('.status');
    document.getElementById('roster').appendChild(li);
  }
  setStatus(s){
    if(s===this.status) return;
    this.status=s; this.statusEl.dataset.s=s;
    this.statusEl.textContent = ({wheel:'on the wheel',food:'snacking',tunnel:'in the tube',walk:'walking',idle:'napping'})[s]||s;
  }
  decide(){
    const r=Math.random();
    if(r<0.34){ this.state='walk'; this.decideTime=rand(1.6,3.6); this.dir+=rand(-1.2,1.2); this.setStatus('walk'); }
    else if(r<0.52){ this.state='idle'; this.decideTime=rand(1.2,3.0); this.setStatus('idle'); }
    else if(r<0.66 && !wheel.active && !this.wheelTarget){ this.goWheel(); }
    else if(r<0.78 && !bowl.occupied && bowl.full>0.35){ this.goFood(); }
    else if(r<0.88 && !tunnel.occupied && !this.wheelTarget){ this.goTunnel(); }
    else { this.state='walk'; this.decideTime=rand(1.6,3.6); this.dir+=rand(-1.2,1.2); this.setStatus('walk'); }
  }
  goWheel(){ wheel.active=this; this.state='goWheel'; this.decideTime=0; this.setStatus('wheel'); }
  goFood(){ bowl.occupied=this; this.state='goFood'; this.decideTime=0; this.setStatus('food'); }
  goTunnel(){ tunnel.occupied=this; this.state='goTunnel'; this.decideTime=0; this.tunnelT=0; this.setStatus('tunnel'); }
  arriveWheel(){ this.state='wheel'; this.decideTime=rand(2.5,5); this.wheelTarget=wheel.active===this?{angle:rand(0,6.28),radius:0.78}:null; }
  arriveFood(){ this.state='eat'; this.decideTime=rand(2.2,4); this.eatPhase=0; }
  arriveTunnel(){ this.state='inTunnel'; this.decideTime=0; this.tunnelT=0; }
  leaveWheel(){ if(wheel.active===this){ wheel.active=null; this.wheelTarget=null; this.state='walk'; this.decideTime=rand(1.5,3); this.dir=rand(0,6.28); this.setStatus('walk'); } }
  leaveFood(){ if(bowl.occupied===this){ bowl.occupied=null; this.state='walk'; this.decideTime=rand(1.5,3); this.dir=rand(0,6.28); this.setStatus('walk'); } }
  leaveTunnel(){ if(tunnel.occupied===this){ tunnel.occupied=null; this.state='walk'; this.decideTime=rand(1.5,3); this.dir=Math.atan2(BOUNDS.z*0.5-TUNNEL_OUT.z, 0); this.setStatus('walk'); } }

  update(dt,t){
    this.stateTime+=dt;
    if(this.poke>0){ this.poke=Math.max(0,this.poke-dt); this.group.position.y=FLOOR_Y+Math.abs(Math.sin(this.poke*14))*0.35; }
    else this.group.position.y=FLOOR_Y;

    // blink
    this.blinkTimer-=dt;
    if(this.blinkTimer<=0){ this.blinkTimer=rand(2,5); this.blinkAnim=0.16; }
    if(this.blinkAnim>0){ this.blinkAnim-=dt; const k=Math.max(0,1-this.blinkAnim/0.16); this.eyes.forEach(e=>e.scale.y=lerp(1,0.1,k)); }
    else this.eyes.forEach(e=>e.scale.y=1);

    switch(this.state){
      case 'walk': this.doWalk(dt); break;
      case 'idle': this.doIdle(dt,t); break;
      case 'goWheel': this.seek(WHEEL_POS,()=>this.arriveWheel()); break;
      case 'wheel': this.doWheel(dt); break;
      case 'goFood': this.seek(BOWL_POS,()=>this.arriveFood()); break;
      case 'eat': this.doEat(dt); break;
      case 'goTunnel': this.seek(TUNNEL_IN,()=>this.arriveTunnel()); break;
      case 'inTunnel': this.doTunnel(dt); break;
    }

    // walk cycle + bob
    this.walkPhase += dt*this.speed*6;
    const amp=clamp(this.speed/this.baseSpeed,0,1);
    this.legs.forEach((l,i)=>{ l.position.y=0.16+Math.sin(this.walkPhase+(i%2?0:Math.PI))*0.12*amp; });
    this.bobPhase+=dt*(2+this.speed*3);
    this.body.position.y=0.5+Math.sin(this.bobPhase)*0.03*amp;
    this.head.position.y=0.78+Math.sin(this.bobPhase+1)*0.03*amp;
    this.tail.scale.setScalar(1+Math.sin(this.bobPhase*2)*0.1*amp);
  }
  doWalk(dt){
    this.speed=lerp(this.speed,this.baseSpeed,0.1);
    this.group.position.x+=Math.sin(this.dir)*this.speed*dt;
    this.group.position.z+=Math.cos(this.dir)*this.speed*dt;
    if(this.group.position.x>BOUNDS.x){this.group.position.x=BOUNDS.x;this.dir=Math.PI-this.dir;}
    if(this.group.position.x<-BOUNDS.x){this.group.position.x=-BOUNDS.x;this.dir=Math.PI-this.dir;}
    if(this.group.position.z>BOUNDS.z){this.group.position.z=BOUNDS.z;this.dir=-this.dir;}
    if(this.group.position.z<-BOUNDS.z){this.group.position.z=-BOUNDS.z;this.dir=-this.dir;}
    lookTo(this.group, this.group.position.x+Math.sin(this.dir), this.group.position.z+Math.cos(this.dir));
    if(this.stateTime>this.decideTime) this.decide();
  }
  doIdle(dt,t){
    this.speed=lerp(this.speed,0,0.2);
    if(this.stateTime>this.decideTime) this.decide();
  }
  seek(target, onArrive){
    const dx=target.x-this.group.position.x, dz=target.z-this.group.position.z;
    const dist=Math.hypot(dx,dz);
    if(dist<0.55){ this.speed=0; onArrive&&onArrive(); return; }
    this.dir=Math.atan2(dx,dz);
    this.speed=lerp(this.speed,this.baseSpeed*1.15,0.15);
    this.group.position.x+=Math.sin(this.dir)*this.speed*dt;
    this.group.position.z+=Math.cos(this.dir)*this.speed*dt;
    lookTo(this.group,target.x,target.z);
  }
  doWheel(dt){
    if(!this.wheelTarget){ this.leaveWheel(); return; }
    const wp=WHEEL_POS;
    const tx=wp.x+Math.cos(this.wheelTarget.angle)*this.wheelTarget.radius;
    const tz=wp.z+Math.sin(this.wheelTarget.angle)*this.wheelTarget.radius;
    const dx=tx-this.group.position.x, dz=tz-this.group.position.z;
    this.group.position.x=lerp(this.group.position.x,tx,0.15);
    this.group.position.z=lerp(this.group.position.z,tz,0.15);
    this.dir=Math.atan2(dx,dz);
    this.speed=lerp(this.speed,2.4,0.1);
    lookTo(this.group,tx,tz);
    this.wheelTarget.angle+=dt*2.4;
    wheel.spinVel=lerp(wheel.spinVel,2.4,0.1);
    if(this.stateTime>this.decideTime) this.leaveWheel();
  }
  doEat(dt){
    const bp=BOWL_POS;
    this.group.position.x=lerp(this.group.position.x,bp.x-0.1,0.2);
    this.group.position.z=lerp(this.group.position.z,bp.z-1.0,0.2);
    lookTo(this.group,bp.x,bp.z);
    this.speed=lerp(this.speed,0,0.2);
    this.eatPhase+=dt*4;
    const chew=Math.abs(Math.sin(this.eatPhase));
    this.head.position.y=0.78+chew*0.05;
    this.cheeks.forEach(c=>c.scale.setScalar(1+chew*0.4));
    bowl.full=Math.max(0,bowl.full-dt*0.12);
    if(this.stateTime>this.decideTime) this.leaveFood();
  }
  doTunnel(dt){
    this.tunnelT+=dt/1.4;
    const tt=easeInOut(clamp(this.tunnelT,0,1));
    this.group.position.lerpVectors(TUNNEL_IN,TUNNEL_OUT,tt);
    this.group.position.y=FLOOR_Y+0.15;
    this.group.visible = tt>0.1 && tt<0.9;
    lookTo(this.group,TUNNEL_OUT.x,TUNNEL_OUT.z);
    this.speed=0;
    if(this.tunnelT>=1){ this.group.visible=true; this.group.position.copy(TUNNEL_OUT); this.leaveTunnel(); }
  }
}

const hamsters = HAMSTERS.map((c,i)=>new Hamster(c,i));

/* ---------------- poke / feed ---------------- */
function poke(h){
  h.poke=1.0; h.state='idle'; h.decideTime=rand(0.6,1.4);
  if(h.wheelTarget){ h.wheelTarget=null; if(wheel.active===h) wheel.active=null; }
  if(bowl.occupied===h) bowl.occupied=null;
  if(tunnel.occupied===h){ tunnel.occupied=null; h.group.visible=true; h.group.position.copy(TUNNEL_OUT); }
  h.setStatus('idle');
  spawnHearts(h.group.position.clone().add(V3(0,1.4,0)));
}
function feedAll(){
  bowl.full=1;
  foodMeshes.forEach(s=>s.visible=true);
  let n=0;
  hamsters.forEach(h=>{ if(h.state!=='goFood'&&h.state!=='eat'&&h.state!=='wheel'){ h.goFood(); n++; } });
  if(n===0){ bowl.full=1; }
  spawnHearts(bowl.group.position.clone().add(V3(0,1,0)));
}

/* ---------------- particles ---------------- */
const hearts=[];
const heartGeo=(()=>{ const s=0.2; const shape=new THREE.Shape();
  shape.moveTo(0,0.6*s); shape.bezierCurveTo(0,0.9*s,0.6*s,0.9*s,0.6*s,0.4*s);
  shape.bezierCurveTo(0.6*s,0.1*s,0.3*s,0,0,0.2*s); shape.bezierCurveTo(-0.3*s,0,-0.6*s,0.1*s,-0.6*s,0.4*s);
  shape.bezierCurveTo(-0.6*s,0.9*s,0,0.9*s,0,0.6*s);
  const g=new THREE.ExtrudeGeometry(shape,{depth:0.1,bevelEnabled:false}); g.center(); return g; })();
const heartColors=[0xff6f91,0xff8fab,0xffd23f,0xff9e7d];
function spawnHearts(pos){
  for(let i=0;i<6;i++){
    const m=new THREE.Mesh(heartGeo,new THREE.MeshBasicMaterial({color:pick(heartColors)}));
    m.position.copy(pos); m.position.x+=rand(-0.3,0.3); m.position.z+=rand(-0.3,0.3);
    m.scale.setScalar(rand(0.4,0.7)); m.rotation.z=rand(0,6.28);
    scene.add(m); hearts.push({m,life:1.4,max:1.4,vx:rand(-0.4,0.4),vy:rand(0.8,1.4),vz:rand(-0.4,0.4)});
  }
}
function updateParticles(dt){
  for(let i=hearts.length-1;i>=0;i--){ const h=hearts[i]; h.life-=dt;
    h.m.position.x+=h.vx*dt; h.m.position.y+=h.vy*dt; h.m.position.z+=h.vz*dt;
    h.m.rotation.z+=dt*2; const s=clamp(h.life/h.max,0,1); h.m.scale.setScalar(s*0.6);
    if(h.life<=0){ scene.remove(h.m); h.m.geometry!==heartGeo&&h.m.geometry.dispose(); h.m.material.dispose(); hearts.splice(i,1); } }
}

/* ---------------- raycast click ---------------- */
const raycaster=new THREE.Raycaster(); const pointer=new THREE.Vector2();
function pickHamster(clientX,clientY){
  pointer.x=(clientX/innerWidth)*2-1; pointer.y=-(clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(hamsters.map(h=>h.group),true);
  if(!hits.length) return null;
  let o=hits[0].object; while(o&&!hamsters.includes(o)&&o.parent) o=o.parent;
  return o||null;
}
let downX=0,downY=0;
renderer.domElement.addEventListener('pointerdown',e=>{ downX=e.clientX; downY=e.clientY; controls.autoRotate=false; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-downX,e.clientY-downY)<6){
    const h=pickHamster(e.clientX,e.clientY); if(h) poke(h);
  }
});

/* ---------------- buttons ---------------- */
document.getElementById('pokeBtn').onclick=()=>{ const h=pick(hamsters); poke(h); };
document.getElementById('feedBtn').onclick=feedAll;
document.getElementById('resetBtn').onclick=()=>{ controls.target.set(0,1.5,0); camera.position.set(12,9,15); controls.update(); };

/* ---------------- loop ---------------- */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  hamsters.forEach(h=>h.update(dt,t));

  // wheel physics
  wheel.spin+=wheel.spinVel*dt;
  wheel.spinVel*=Math.pow(0.9,dt*60);
  wheel.body.rotation.z=wheel.spin;
  wheel.speed=wheel.spinVel;
  if(t-wheel.lastStatus>0.3){ wheel.lastStatus=t; wheel.status=wheel.spinVel>0.3?'running':'idle'; }

  // ball bounce
  const bp=ball.mesh.position;
  if(t-ball.lastKick>rand(2.5,5)){ ball.vel.set(rand(-1.5,1.5),rand(2,3),rand(-1.5,1.5)); ball.lastKick=t; }
  bp.addScaledVector(ball.vel,dt); ball.vel.y-=9*dt;
  if(bp.y<FLOOR_Y+0.5){ bp.y=FLOOR_Y+0.5; ball.vel.y*=-0.6; ball.vel.x*=0.85; ball.vel.z*=0.85; }
  if(bp.x>BOUNDS.x-0.5){bp.x=BOUNDS.x-0.5;ball.vel.x*=-0.8;} if(bp.x<-BOUNDS.x+0.5){bp.x=-BOUNDS.x+0.5;ball.vel.x*=-0.8;}
  if(bp.z>BOUNDS.z-0.5){bp.z=BOUNDS.z-0.5;ball.vel.z*=-0.8;} if(bp.z<-BOUNDS.z+0.5){bp.z=-BOUNDS.z+0.5;ball.vel.z*=-0.8;}
  ball.mesh.rotation.x+=ball.vel.z*dt*2; ball.mesh.rotation.z-=ball.vel.x*dt*2;

  // food shrink
  foodMeshes.forEach((s,i)=>{ s.visible=bowl.full>(i/foodMeshes.length)*0.9; });
  if(bowl.full<=0.02 && t>bowl.nextRefill){ bowl.full=1; bowl.nextRefill=t+rand(6,10); foodMeshes.forEach(s=>s.visible=true); }

  // ambient life
  plants.forEach(p=>{ p.g.rotation.z=Math.sin(t*1.2+p.phase)*0.05; });
  clouds.forEach(c=>{ c.g.position.x+=c.speed*dt; if(c.g.position.x>22) c.g.position.x=-22; });
  updateParticles(dt);

  controls.update();
  renderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
setTimeout(()=>document.getElementById('loader').classList.add('hide'),400);
</script>
