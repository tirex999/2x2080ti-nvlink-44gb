<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Аквариум — эталон Claude</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #e6f4ff; }
  body { background: linear-gradient(180deg, #03142e 0%, #07306b 45%, #0b5aa8 100%); }
  #scene { position: fixed; inset: 0; }
  .glass {
    background: rgba(8, 30, 60, 0.42);
    border: 1px solid rgba(140, 210, 255, 0.28);
    border-radius: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0, 20, 60, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  #info { position: fixed; top: 18px; left: 18px; width: 290px; padding: 18px 20px 20px; z-index: 2; }
  #info h1 {
    font-size: 24px; font-weight: 800; letter-spacing: 0.3px; margin-bottom: 10px;
    background: linear-gradient(90deg, #7fe3ff, #6aa8ff 50%, #c49bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #info p { font-size: 13px; line-height: 1.55; color: #b8d7f0; }
  #info p b { color: #e9f7ff; }
  .buttons { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
  button {
    border: 0; border-radius: 11px; padding: 10px 14px; font-size: 14px; font-weight: 700; color: #fff;
    cursor: pointer; transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  }
  button:hover { transform: translateY(-2px); filter: brightness(1.12); box-shadow: 0 8px 22px rgba(80, 200, 255, 0.45); }
  button:active { transform: translateY(0); }
  #btnFish { background: linear-gradient(135deg, #ff8a3d, #ff4f6d); }
  #btnBubbles { background: linear-gradient(135deg, #22c1ee, #2a6cff); }
  #btnLight { background: linear-gradient(135deg, #ffcf3f, #ff9a1f); }
  #btnLight.off { background: linear-gradient(135deg, #5a6a86, #384660); }
  #stats { position: fixed; top: 18px; right: 18px; min-width: 170px; padding: 14px 18px; z-index: 2; font-size: 14px; }
  #stats .row { display: flex; justify-content: space-between; gap: 18px; padding: 3px 0; }
  #stats .row span:last-child { font-weight: 800; color: #7fe3ff; text-shadow: 0 0 10px rgba(127, 227, 255, 0.6); }
  #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); padding: 9px 18px; font-size: 13px; z-index: 2; white-space: nowrap; }
  @media (max-width: 700px) {
    #info { width: auto; right: 18px; padding: 12px 14px; }
    #info p { display: none; }
    .buttons { flex-direction: row; flex-wrap: wrap; }
    button { flex: 1 1 30%; padding: 8px 6px; font-size: 12px; }
    #stats { top: auto; bottom: 64px; }
    #hint { white-space: normal; width: 90%; text-align: center; }
  }
</style>
</head>
<body>
<div id="scene"></div>

<div id="info" class="glass">
  <h1>🐠 3D Аквариум</h1>
  <p><b>Левая кнопка + движение</b> — вращение вокруг аквариума<br>
     <b>Правая кнопка + движение</b> — панорама<br>
     <b>Колесо</b> — приближение<br>
     <b>Клик по воде</b> — насыпать корм</p>
  <div class="buttons">
    <button id="btnFish">➕ Добавить рыбку</button>
    <button id="btnBubbles">💧 Больше пузырей</button>
    <button id="btnLight">💡 Свет</button>
  </div>
</div>

<div id="stats" class="glass">
  <div class="row"><span>Рыбки</span><span id="statFish">0</span></div>
  <div class="row"><span>Пузыри</span><span id="statBubbles">0</span></div>
  <div class="row"><span>Корм</span><span id="statFood">0</span></div>
  <div class="row"><span>FPS</span><span id="statFps">0</span></div>
</div>

<div id="hint" class="glass">Кликните по аквариуму — корм пойдёт ко дну, и рыбки поплывут к нему</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';

// ─────────────────────────── константы ───────────────────────────
const TANK = { w: 36, h: 24, d: 20 };           // стеклянный контейнер 36x24x20
const HALF = { x: TANK.w / 2, y: TANK.h / 2, z: TANK.d / 2 };
const SAND_Y = -HALF.y + 0.6;                    // уровень песка
const WATER_TOP = HALF.y - 1.2;                  // поверхность воды
const FISH_COUNT = 15;                           // 15 рыбок на старте
const BUBBLE_COUNT = 30;                         // 30 пузырей на старте
const ROCK_COUNT = 8;
const WEED_COUNT = 12;
const FOOD_DETECT_RADIUS = 15;                   // рыбка замечает корм в радиусе 15
const FOOD_GRAVITY = 3.2;                        // корм тонет в воде медленно
const BOUND_MARGIN = 3.2;                        // у стен начинается плавный разворот

// 8 color schemes: оранжевая, синяя, жёлто-красная, фиолетовая, красная, зелёная, розовая, золотая
const COLOR_SCHEMES = [
  { name: 'оранжевая',    body: 0xff7a1a, belly: 0xffd9b0, fin: 0xffffff, stripe: 0xffffff },
  { name: 'синяя',        body: 0x2466ff, belly: 0x9fd0ff, fin: 0x0f2f99, stripe: 0x111111 },
  { name: 'жёлто-красная', body: 0xffd21f, belly: 0xfff1a8, fin: 0xe8302a, stripe: 0xe8302a },
  { name: 'фиолетовая',   body: 0x8a3dff, belly: 0xd9c2ff, fin: 0xffd23a, stripe: 0x4a17a8 },
  { name: 'красная',      body: 0xe3202a, belly: 0xffb3a8, fin: 0x8f0b12, stripe: 0xffffff },
  { name: 'зелёная',      body: 0x22c46a, belly: 0xc6f7d6, fin: 0x0d7a3e, stripe: 0x0a5a2c },
  { name: 'розовая',      body: 0xff6fb5, belly: 0xffe0f0, fin: 0xff2e8c, stripe: 0xffffff },
  { name: 'золотая',      body: 0xf2b51c, belly: 0xfff0b8, fin: 0xd98a00, stripe: 0x8a5a00 }
];

// ─────────────────────────── сцена ───────────────────────────
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;       // мягкие тени
renderer.outputEncoding = THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = makeGradientTexture();                // градиент от тёмно-синего к синему
scene.fog = new THREE.FogExp2(0x0a3a6e, 0.012);          // вода «съедает» дальние планы

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(8, 6, 42);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 1.8;
controls.target.set(0, -1, 0);
controls.update();

function makeGradientTexture() {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#0b62b8');
  grad.addColorStop(0.55, '#063a78');
  grad.addColorStop(1, '#021533');
  g.fillStyle = grad;
  g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}

// ─────────────────────────── свет ───────────────────────────
const ambient = new THREE.AmbientLight(0x404040, 0.4);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x9fdcff, 0x1b3a55, 0.38);   // подводный рассеянный свет
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff4de, 0.9);
sun.position.set(14, 40, 12);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;                 // теневая карта 2048x2048
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left = -24; sun.shadow.camera.right = 24;
sun.shadow.camera.top = 24;   sun.shadow.camera.bottom = -24;
sun.shadow.camera.near = 5;   sun.shadow.camera.far = 90;
sun.shadow.bias = -0.0008;
sun.shadow.radius = 4;
scene.add(sun);
const SUN_ON = 0.9, SUN_OFF = 0.15;
let lightOn = true;

const glowCyan = new THREE.PointLight(0x39e6ff, 1.1, 60, 1.6);  // подводное освещение: голубой
glowCyan.position.set(-12, 6, 6);
scene.add(glowCyan);
const glowBlue = new THREE.PointLight(0x2a5dff, 1.0, 60, 1.6);  // и синий
glowBlue.position.set(12, -2, -6);
scene.add(glowBlue);

// ─────────────────────────── стеклянный контейнер ───────────────────────────
const tankGeo = new THREE.BoxGeometry(TANK.w, TANK.h, TANK.d);
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xd8f3ff,
  metalness: 0,
  roughness: 0.04,
  transmission: 0.95,          // прозрачное стекло с преломлением
  transparent: true,
  opacity: 1,
  side: THREE.FrontSide,
  depthWrite: false
});
const glass = new THREE.Mesh(tankGeo, glassMat);
glass.renderOrder = 10;
scene.add(glass);

const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(tankGeo),
  new THREE.LineBasicMaterial({ color: 0xbfeaff, transparent: true, opacity: 0.85 })
);
scene.add(edges);                                 // видимая рамка

// чёрный металлический обод сверху и снизу — «настоящий» аквариум
const rimMat = new THREE.MeshStandardMaterial({ color: 0x1b2430, metalness: 0.6, roughness: 0.35 });
[-HALF.y - 0.25, HALF.y + 0.25].forEach(y => {
  const rim = new THREE.Mesh(new THREE.BoxGeometry(TANK.w + 0.8, 0.5, TANK.d + 0.8), rimMat);
  rim.position.y = y;
  rim.receiveShadow = true;
  scene.add(rim);
});

// поверхность воды — лёгкая рябь
const waterGeo = new THREE.PlaneGeometry(TANK.w - 0.2, TANK.d - 0.2, 36, 20);
waterGeo.rotateX(-Math.PI / 2);
const waterMat = new THREE.MeshPhongMaterial({
  color: 0x5fc8ff, transparent: true, opacity: 0.28, shininess: 90, specular: 0xffffff, side: THREE.DoubleSide, depthWrite: false
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = WATER_TOP;
scene.add(water);
const waterBase = Float32Array.from(waterGeo.attributes.position.array);

// ─────────────────────────── песок ───────────────────────────
const sandGeo = new THREE.PlaneGeometry(TANK.w - 0.3, TANK.d - 0.3, 72, 40);
sandGeo.rotateX(-Math.PI / 2);
{
  const p = sandGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    // procedural неровности: дюны + мелкая рябь
    const y = Math.sin(x * 0.28) * 0.45 + Math.cos(z * 0.35 + x * 0.12) * 0.35 + Math.sin(x * 1.3 + z * 0.9) * 0.08 + (z / TANK.d) * 0.9;
    p.setY(i, y);
  }
  sandGeo.computeVertexNormals();
}
const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({ color: 0xb8955a, roughness: 0.95, metalness: 0, flatShading: true }));
sand.position.y = SAND_Y;
sand.receiveShadow = true;                        // получает тени
scene.add(sand);

function sandHeight(x, z) {
  return SAND_Y + Math.sin(x * 0.28) * 0.45 + Math.cos(z * 0.35 + x * 0.12) * 0.35 + (z / TANK.d) * 0.9;
}

// ─────────────────────────── камни ───────────────────────────
const rockColors = [0x4f5760, 0x6a5f55, 0x3f4852, 0x747b83];
for (let i = 0; i < ROCK_COUNT; i++) {
  const r = 0.9 + Math.random() * 1.6;
  const g = new THREE.DodecahedronGeometry(r, 0);   // деформированный додекаэдр
  const pos = g.attributes.position;
  const offsets = {};
  for (let k = 0; k < pos.count; k++) {
    const key = pos.getX(k).toFixed(3) + ',' + pos.getY(k).toFixed(3) + ',' + pos.getZ(k).toFixed(3);
    if (!offsets[key]) offsets[key] = 0.75 + Math.random() * 0.5;   // одинаковый сдвиг у совпадающих вершин — без щелей
    const s = offsets[key];
    pos.setXYZ(k, pos.getX(k) * s, pos.getY(k) * s * 0.75, pos.getZ(k) * s);
  }
  g.computeVertexNormals();
  const rock = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: rockColors[i % rockColors.length], roughness: 0.9, flatShading: true }));
  const x = (Math.random() - 0.5) * (TANK.w - 6), z = (Math.random() - 0.5) * (TANK.d - 5);
  rock.position.set(x, sandHeight(x, z) + r * 0.25, z);
  rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
}

// ─────────────────────────── водоросли ───────────────────────────
const seaweed = [];
const weedPalette = [0x2e9d4f, 0x3fbf5a, 0x1f7a3f, 0x6fcf4a, 0x2a8f6a, 0x7a9f2a];
for (let i = 0; i < WEED_COUNT; i++) {
  const bush = new THREE.Group();
  const x = (Math.random() - 0.5) * (TANK.w - 4), z = (Math.random() - 0.5) * (TANK.d - 4);
  bush.position.set(x, sandHeight(x, z), z);
  const blades = 3 + Math.floor(Math.random() * 3);
  const color = weedPalette[Math.floor(Math.random() * weedPalette.length)];
  const height = 6 + Math.random() * 10;                    // случайная высота
  for (let b = 0; b < blades; b++) {
    const pts = [];
    const lean = (Math.random() - 0.5) * 2.2;
    const h = height * (0.65 + Math.random() * 0.35);
    for (let s = 0; s <= 6; s++) {
      const t = s / 6;
      pts.push(new THREE.Vector3(Math.sin(t * 3 + b) * 0.7 * t + lean * t * t, t * h, Math.cos(t * 2.4 + b) * 0.5 * t));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 20, 0.16 + Math.random() * 0.08, 6, false),
      new THREE.MeshStandardMaterial({ color, roughness: 0.6, emissive: 0x06220f, emissiveIntensity: 0.4 })
    );
    tube.position.set((Math.random() - 0.5) * 0.9, 0, (Math.random() - 0.5) * 0.9);
    tube.castShadow = true;
    bush.add(tube);
  }
  bush.userData = { phase: Math.random() * Math.PI * 2, speed: 0.6 + Math.random() * 0.7, amp: 0.07 + Math.random() * 0.06 };
  scene.add(bush);
  seaweed.push(bush);
}

// ─────────────────────────── пузыри ───────────────────────────
const bubbles = [];
const bubbleGeo = new THREE.SphereGeometry(1, 12, 10);
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color: 0xeaf8ff, metalness: 0, roughness: 0, clearcoat: 1, clearcoatRoughness: 0,
  transparent: true, opacity: 0.38, reflectivity: 0.9, depthWrite: false
});
function spawnBubble(anyHeight) {
  const b = new THREE.Mesh(bubbleGeo, bubbleMat);
  const s = 0.12 + Math.random() * 0.22;
  b.scale.setScalar(s);
  const x = (Math.random() - 0.5) * (TANK.w - 3), z = (Math.random() - 0.5) * (TANK.d - 3);
  b.position.set(x, anyHeight ? SAND_Y + Math.random() * (WATER_TOP - SAND_Y) : SAND_Y + 0.3, z);
  b.userData = { speed: 1.6 + Math.random() * 1.8, phase: Math.random() * Math.PI * 2, wobble: 0.25 + Math.random() * 0.35, base: new THREE.Vector2(x, z) };
  scene.add(b);
  bubbles.push(b);
}
for (let i = 0; i < BUBBLE_COUNT; i++) spawnBubble(true);

// ─────────────────────────── рыбки ───────────────────────────
const fishArray = [];
const bodyGeo = new THREE.SphereGeometry(1, 16, 12);
const eyeGeo = new THREE.SphereGeometry(0.2, 10, 8);
const pupilGeo = new THREE.SphereGeometry(0.11, 8, 6);
const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, metalness: 0.2 });

function finShape(len, height) {                  // плоский треугольный плавник
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.quadraticCurveTo(len * 0.55, height * 1.1, len, height * 0.2);
  s.lineTo(len * 0.9, 0);
  s.lineTo(0, 0);
  return new THREE.ShapeGeometry(s, 6);
}
function tailShape() {                            // раздвоенный хвост
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.quadraticCurveTo(-0.7, 0.35, -1.25, 0.95);
  s.quadraticCurveTo(-1.0, 0.1, -1.1, 0);
  s.quadraticCurveTo(-1.0, -0.1, -1.25, -0.95);
  s.quadraticCurveTo(-0.7, -0.35, 0, 0);
  return new THREE.ShapeGeometry(s, 8);
}
const tailGeo = tailShape();
const dorsalGeo = finShape(1.2, 0.75);
const sideFinGeo = finShape(0.75, 0.42);

function createFish(position) {
  const scheme = COLOR_SCHEMES[fishArray.length % COLOR_SCHEMES.length];
  const bodyMat = new THREE.MeshStandardMaterial({ color: scheme.body, roughness: 0.35, metalness: 0.15 });
  const finMat = new THREE.MeshStandardMaterial({ color: scheme.fin, roughness: 0.5, side: THREE.DoubleSide, transparent: true, opacity: 0.88 });

  const mesh = new THREE.Group();                 // рыбка смотрит вдоль +X
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.scale.set(1.45, 0.72, 0.46);               // вытянутое тело — масштабированная сфера
  body.castShadow = true;
  mesh.add(body);

  const belly = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color: scheme.belly, roughness: 0.5 }));
  belly.scale.set(1.18, 0.42, 0.4);
  belly.position.set(0.1, -0.26, 0);
  mesh.add(belly);

  const stripe = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color: scheme.stripe, roughness: 0.4 }));
  stripe.scale.set(0.12, 0.7, 0.47);             // поперечная полоса
  stripe.position.set(0.35, 0.02, 0);
  mesh.add(stripe);

  for (const side of [1, -1]) {                   // глаза со зрачками
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(1.02, 0.18, 0.31 * side);
    const pupil = new THREE.Mesh(pupilGeo, pupilMat);
    pupil.position.set(0.1, 0.02, 0.1 * side);
    eye.add(pupil);
    mesh.add(eye);
  }

  // хвост: шарнир развёрнут на 90° по X, поэтому вращение хвоста по его оси Z
  // даёт взмах из стороны в сторону, как у настоящей рыбы
  const tailPivot = new THREE.Group();
  tailPivot.position.set(-1.35, 0, 0);
  tailPivot.rotation.x = Math.PI / 2;
  const tail = new THREE.Mesh(tailGeo, finMat);
  tail.rotation.x = -Math.PI / 2;
  const tailHinge = new THREE.Group();
  tailHinge.add(tail);
  tailPivot.add(tailHinge);
  mesh.add(tailPivot);

  const dorsal = new THREE.Mesh(dorsalGeo, finMat);   // верхний плавник
  dorsal.position.set(-0.55, 0.55, 0);
  mesh.add(dorsal);

  const leftFin = new THREE.Mesh(sideFinGeo, finMat);  // боковые плавники
  leftFin.position.set(0.25, -0.2, 0.36);
  leftFin.rotation.set(-0.5, 0, -0.5);
  mesh.add(leftFin);
  const rightFin = new THREE.Mesh(sideFinGeo, finMat);
  rightFin.position.set(0.25, -0.2, -0.36);
  rightFin.rotation.set(0.5, 0, -0.5);
  mesh.add(rightFin);

  const scale = 0.6 + Math.random() * 0.6;        // размер 0.6 … 1.2
  mesh.scale.setScalar(scale);
  if (position) mesh.position.copy(position);
  else mesh.position.set((Math.random() - 0.5) * (TANK.w - 10), SAND_Y + 4 + Math.random() * (WATER_TOP - SAND_Y - 7), (Math.random() - 0.5) * (TANK.d - 8));

  const speed = 2.2 + Math.random() * 2.0;
  const velocity = new THREE.Vector3(Math.random() - 0.5, (Math.random() - 0.5) * 0.25, Math.random() - 0.5).normalize().multiplyScalar(speed);
  scene.add(mesh);

  const fish = {
    mesh, tail: tailHinge, leftFin, rightFin,
    velocity,
    speed,                                         // индивидуальная скорость
    tailSpeed: 7 + Math.random() * 6,              // своя частота взмахов хвоста
    phase: Math.random() * Math.PI * 2,            // своя фаза анимации
    targetFood: null,
    avoidanceRadius: 2.2 + Math.random() * 1.6,    // свой радиус избегания
    wanderTarget: randomPointInTank(),
    wanderTimer: 2 + Math.random() * 4,
    baseScale: scale
  };
  fishArray.push(fish);
  return fish;
}
function randomPointInTank() {
  return new THREE.Vector3(
    (Math.random() - 0.5) * (TANK.w - 2 * BOUND_MARGIN),
    SAND_Y + 3 + Math.random() * (WATER_TOP - SAND_Y - 6),
    (Math.random() - 0.5) * (TANK.d - 2 * BOUND_MARGIN)
  );
}
for (let i = 0; i < FISH_COUNT; i++) createFish();

// ─────────────────────────── корм ───────────────────────────
const foods = [];
const foodGeo = new THREE.DodecahedronGeometry(0.24, 0);
const foodMat = new THREE.MeshStandardMaterial({ color: 0xff9a3c, roughness: 0.7, emissive: 0x6a2c00, emissiveIntensity: 0.6 });
function dropFood(point) {
  for (let i = 0; i < 5; i++) {                    // щепотка из нескольких гранул
    const f = new THREE.Mesh(foodGeo, foodMat);
    f.position.set(
      THREE.MathUtils.clamp(point.x + (Math.random() - 0.5) * 1.2, -HALF.x + 1, HALF.x - 1),
      WATER_TOP - 0.3,
      THREE.MathUtils.clamp(point.z + (Math.random() - 0.5) * 1.2, -HALF.z + 1, HALF.z - 1)
    );
    f.castShadow = true;
    f.userData = { velocity: new THREE.Vector3((Math.random() - 0.5) * 0.4, -0.2, (Math.random() - 0.5) * 0.4), eaten: false };
    scene.add(f);
    foods.push(f);
  }
}
function removeFood(f) {
  f.userData.eaten = true;
  scene.remove(f);
  const i = foods.indexOf(f);
  if (i >= 0) foods.splice(i, 1);
  for (const fish of fishArray) if (fish.targetFood === f) fish.targetFood = null;
}

// клик по аквариуму — Raycaster по стеклу/песку; перетаскивание камеры кормом не считается
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY, button: e.button }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || downAt.button !== 0) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 5) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects([glass, sand], false);
  if (hits.length) dropFood(hits[0].point);
});

// ─────────────────────────── ИИ рыбок ───────────────────────────
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), steer = new THREE.Vector3();
const forward = new THREE.Vector3(1, 0, 0);
const qTarget = new THREE.Quaternion();
const lookM = new THREE.Matrix4();
const UP = new THREE.Vector3(0, 1, 0);

function updateFish(fish, dt, time) {
  const p = fish.mesh.position;
  steer.set(0, 0, 0);

  // 1) корм: ближайшая гранула в радиусе 15
  if (!fish.targetFood || fish.targetFood.userData.eaten) {
    fish.targetFood = null;
    let best = FOOD_DETECT_RADIUS;
    for (const f of foods) {
      const d = p.distanceTo(f.position);
      if (d < best) { best = d; fish.targetFood = f; }
    }
  }
  if (fish.targetFood) {
    tmpA.subVectors(fish.targetFood.position, p);
    const d = tmpA.length();
    if (d < 0.7 * fish.mesh.scale.x + 0.3) {        // съела: корм исчезает, рыбка растёт на 5%
      removeFood(fish.targetFood);
      fish.mesh.scale.multiplyScalar(1.05);
    } else {
      steer.addScaledVector(tmpA.normalize(), 3.2);
    }
  } else {
    // 2) случайное блуждание: цель меняется периодически
    fish.wanderTimer -= dt;
    if (fish.wanderTimer <= 0 || p.distanceTo(fish.wanderTarget) < 2) {
      fish.wanderTarget = randomPointInTank();
      fish.wanderTimer = 3 + Math.random() * 5;
    }
    tmpA.subVectors(fish.wanderTarget, p).normalize();
    steer.addScaledVector(tmpA, 1.1);
  }

  // 3) избегание столкновений: рыбки отталкиваются друг от друга
  for (const other of fishArray) {
    if (other === fish) continue;
    tmpB.subVectors(p, other.mesh.position);
    const d = tmpB.length();
    const r = fish.avoidanceRadius * (fish.mesh.scale.x + other.mesh.scale.x) * 0.6;
    if (d > 0.0001 && d < r) steer.addScaledVector(tmpB.normalize(), 2.6 * (1 - d / r) * (fish.targetFood ? 0.4 : 1));
  }

  // 4) отражение от стен: у границы плавно разворачиваем скорость внутрь
  const lim = { x: HALF.x - BOUND_MARGIN, yMin: SAND_Y + 2.2, yMax: WATER_TOP - 1.6, z: HALF.z - BOUND_MARGIN };
  if (p.x > lim.x) steer.x -= (p.x - lim.x) * 1.4;
  if (p.x < -lim.x) steer.x += (-lim.x - p.x) * 1.4;
  if (p.z > lim.z) steer.z -= (p.z - lim.z) * 1.4;
  if (p.z < -lim.z) steer.z += (-lim.z - p.z) * 1.4;
  if (p.y > lim.yMax) steer.y -= (p.y - lim.yMax) * 1.6;
  if (p.y < lim.yMin) steer.y += (lim.yMin - p.y) * 1.6;

  fish.velocity.addScaledVector(steer, dt * 2.0);
  fish.velocity.y *= 0.985;                        // рыбы плавают скорее горизонтально
  const maxSpeed = fish.speed * (fish.targetFood ? 1.7 : 1);
  const v = fish.velocity.length();
  if (v > maxSpeed) fish.velocity.multiplyScalar(maxSpeed / v);
  if (v < fish.speed * 0.35) fish.velocity.multiplyScalar(fish.speed * 0.35 / Math.max(v, 1e-4));
  p.addScaledVector(fish.velocity, dt);

  // жёсткая страховка: стекло не проходить (скорость зеркалим у самой стенки)
  const hard = { x: HALF.x - 1.2, z: HALF.z - 1.2 };
  if (p.x > hard.x) { p.x = hard.x; fish.velocity.x = -Math.abs(fish.velocity.x); }
  if (p.x < -hard.x) { p.x = -hard.x; fish.velocity.x = Math.abs(fish.velocity.x); }
  if (p.z > hard.z) { p.z = hard.z; fish.velocity.z = -Math.abs(fish.velocity.z); }
  if (p.z < -hard.z) { p.z = -hard.z; fish.velocity.z = Math.abs(fish.velocity.z); }
  p.y = THREE.MathUtils.clamp(p.y, SAND_Y + 1.2, WATER_TOP - 0.8);

  // поворот в направлении движения (плавно)
  tmpA.copy(fish.velocity).normalize();
  if (tmpA.lengthSq() > 0) {
    lookM.lookAt(new THREE.Vector3(), tmpA, UP);
    qTarget.setFromRotationMatrix(lookM);
    qTarget.multiply(new THREE.Quaternion().setFromAxisAngle(UP, -Math.PI / 2));   // модель смотрит вдоль +X
    fish.mesh.quaternion.slerp(qTarget, Math.min(1, dt * 3.5));
  }

  // хвост и плавники: частота растёт со скоростью
  const pace = 0.6 + fish.velocity.length() / fish.speed * 0.6;
  fish.phase += dt * fish.tailSpeed * pace;
  fish.tail.rotation.z = Math.sin(fish.phase) * 0.55;       // взмах хвоста — вращение по оси Z шарнира
  fish.leftFin.rotation.y = Math.sin(fish.phase * 0.7) * 0.45;
  fish.rightFin.rotation.y = -Math.sin(fish.phase * 0.7) * 0.45;
}

// ─────────────────────────── кнопки ───────────────────────────
document.getElementById('btnFish').addEventListener('click', () => {
  createFish(new THREE.Vector3((Math.random() - 0.5) * 10, WATER_TOP - 3, (Math.random() - 0.5) * 6));
});
document.getElementById('btnBubbles').addEventListener('click', () => {
  for (let i = 0; i < 10; i++) spawnBubble(false);              // +10 пузырей
});
const btnLight = document.getElementById('btnLight');
btnLight.addEventListener('click', () => {
  lightOn = !lightOn;
  sun.intensity = lightOn ? SUN_ON : SUN_OFF;
  btnLight.classList.toggle('off', !lightOn);
  btnLight.textContent = lightOn ? '💡 Свет' : '🌙 Свет выключен';
});

// ─────────────────────────── цикл ───────────────────────────
const clock = new THREE.Clock();
const statFish = document.getElementById('statFish');
const statBubbles = document.getElementById('statBubbles');
const statFood = document.getElementById('statFood');
const statFps = document.getElementById('statFps');
let fpsFrames = 0, fpsTime = 0, fps = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);     // дельта-время, без рывков после паузы вкладки
  const time = clock.elapsedTime;

  for (const fish of fishArray) updateFish(fish, dt, time);

  for (let i = foods.length - 1; i >= 0; i--) {    // корм падает с гравитацией и сопротивлением воды
    const f = foods[i];
    f.userData.velocity.y -= FOOD_GRAVITY * dt;
    f.userData.velocity.multiplyScalar(1 - 1.8 * dt);
    f.position.addScaledVector(f.userData.velocity, dt);
    f.rotation.x += dt * 2; f.rotation.y += dt * 1.3;
    if (f.position.y <= sandHeight(f.position.x, f.position.z) + 0.15) removeFood(f);   // коснулся дна — убираем
  }

  for (const b of bubbles) {                       // пузыри: вверх с покачиванием
    const u = b.userData;
    b.position.y += u.speed * dt;
    b.position.x = u.base.x + Math.sin(time * 2 + u.phase) * u.wobble;
    b.position.z = u.base.y + Math.cos(time * 1.6 + u.phase) * u.wobble;
    if (b.position.y > WATER_TOP) {                // у поверхности — сброс ко дну
      b.position.y = SAND_Y + 0.3;
      u.base.set((Math.random() - 0.5) * (TANK.w - 3), (Math.random() - 0.5) * (TANK.d - 3));
    }
  }

  for (const w of seaweed) {                       // водоросли покачиваются (вращение по X и Z)
    const u = w.userData;
    w.rotation.x = Math.sin(time * u.speed + u.phase) * u.amp;
    w.rotation.z = Math.cos(time * u.speed * 0.8 + u.phase) * u.amp;
  }

  const wp = waterGeo.attributes.position;         // рябь поверхности
  for (let i = 0; i < wp.count; i++) {
    const x = waterBase[i * 3], z = waterBase[i * 3 + 2];
    wp.setY(i, Math.sin(x * 0.45 + time * 1.4) * 0.08 + Math.cos(z * 0.6 + time * 1.1) * 0.06);
  }
  wp.needsUpdate = true;

  glowCyan.intensity = 1.0 + Math.sin(time * 0.9) * 0.2;
  glowBlue.intensity = 0.9 + Math.cos(time * 0.7) * 0.2;

  controls.update();
  renderer.render(scene, camera);

  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 0.5) {
    fps = Math.round(fpsFrames / fpsTime);
    fpsFrames = 0; fpsTime = 0;
    statFps.textContent = fps;
    statFish.textContent = fishArray.length;
    statBubbles.textContent = bubbles.length;
    statFood.textContent = foods.length;
  }
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
