<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>3D Аквариум — эталон Claude</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #06131f; font-family: "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; }

  .panel {
    position: absolute; padding: 14px 18px; border-radius: 14px;
    background: rgba(10, 30, 50, 0.55); backdrop-filter: blur(10px);
    border: 1px solid rgba(120, 200, 255, 0.25);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45); color: #dff1ff;
  }
  #info { top: 16px; left: 16px; max-width: 260px; }
  #stats { top: 16px; right: 16px; text-align: right; min-width: 150px; }

  h1 {
    font-size: 19px; margin-bottom: 8px; letter-spacing: 0.3px;
    background: linear-gradient(90deg, #7fe7ff, #4f8dff 60%, #b98bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hint { font-size: 12.5px; line-height: 1.55; color: #a8cfe6; }
  .hint b { color: #dff1ff; font-weight: 600; }

  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto; padding: 8px 12px; font-size: 12.5px; cursor: pointer;
    color: #eaf7ff; border: 1px solid rgba(140, 210, 255, 0.35); border-radius: 9px;
    background: linear-gradient(160deg, rgba(70, 140, 220, 0.55), rgba(40, 90, 160, 0.55));
    transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }
  button:hover { filter: brightness(1.25); box-shadow: 0 0 16px rgba(110, 200, 255, 0.45); }
  button:active { transform: translateY(1px); }

  .stat { font-size: 13px; line-height: 1.7; }
  .stat span { color: #7fe7ff; font-weight: 600; }
</style>
</head>
<body>

<div id="info" class="panel">
  <h1>3D Аквариум</h1>
  <div class="hint">
    <b>ЛКМ + движение</b> — поворот<br>
    <b>ПКМ + движение</b> — сдвиг<br>
    <b>Колесо</b> — приближение<br>
    <b>Клик по воде</b> — бросить корм
  </div>
  <div class="row">
    <button id="addFish">Добавить рыбку</button>
    <button id="addBubbles">Больше пузырей</button>
    <button id="toggleLight">Свет</button>
  </div>
</div>

<div id="stats" class="panel">
  <div class="stat">Рыбок: <span id="fishCount">0</span></div>
  <div class="stat">Кадров/с: <span id="fps">0</span></div>
  <div class="stat">Корма: <span id="foodCount">0</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================================
// 3D АКВАРИУМ. Эталонная реализация по тому же ТЗ, что получали модели стенда.
//
// Размеры аквариума заданы в ТЗ: 36 x 24 x 20. Всё остальное считается от них,
// чтобы ничего не пришлось подгонять на глаз: рыба не проходит сквозь стекло,
// водоросли стоят на песке, пузыри гаснут ровно у поверхности.
// ============================================================================

const W = 36, H = 24, D = 20;          // ширина, высота, глубина аквариума
const HW = W / 2, HH = H / 2, HD = D / 2;
const SAND_Y = -HH + 0.35;             // уровень песка: чуть выше дна стекла

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071a2e);
// Туман по экспоненте даёт ощущение толщи воды: дальняя стенка тонет в синеве.
scene.fog = new THREE.FogExp2(0x0a2a4a, 0.018);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 6, 46);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 1.8;
controls.target.set(0, 0, 0);

// ---------------------------------------------------------------- освещение
const ambient = new THREE.AmbientLight(0x404040, 0.4);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff4e0, 1.15);
sun.position.set(18, 34, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 90;
scene.add(sun);

// Две подводные лампы: холодная сверху и густо-синяя у дна — от них вода
// перестаёт быть плоской заливкой и получает объём.
const lampTop = new THREE.PointLight(0x67d5ff, 0.85, 60);
lampTop.position.set(-10, HH - 3, 6);
scene.add(lampTop);

const lampBottom = new THREE.PointLight(0x2f6bff, 0.6, 55);
lampBottom.position.set(12, SAND_Y + 5, -5);
scene.add(lampBottom);

// ------------------------------------------------------------------ стекло
const glass = new THREE.Mesh(
  new THREE.BoxGeometry(W, H, D),
  new THREE.MeshPhysicalMaterial({
    color: 0xbfe9ff, metalness: 0, roughness: 0.05,
    transmission: 0.95, thickness: 1.2, transparent: true,
    opacity: 0.28, side: THREE.DoubleSide, clearcoat: 1, clearcoatRoughness: 0.05
  })
);
scene.add(glass);

const frame = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(W, H, D)),
  new THREE.LineBasicMaterial({ color: 0x8fd8ff, transparent: true, opacity: 0.55 })
);
scene.add(frame);

// -------------------------------------------------------------------- песок
// Плоскость с ручными неровностями: без них дно выглядит как лист бумаги.
const sandGeo = new THREE.PlaneGeometry(W - 0.4, D - 0.4, 48, 32);
const sandPos = sandGeo.attributes.position;
for (let i = 0; i < sandPos.count; i++) {
  const x = sandPos.getX(i), y = sandPos.getY(i);
  sandPos.setZ(i, Math.sin(x * 0.55) * 0.32 + Math.cos(y * 0.7) * 0.28 + Math.random() * 0.12);
}
sandGeo.computeVertexNormals();
const sand = new THREE.Mesh(
  sandGeo,
  new THREE.MeshStandardMaterial({ color: 0xd9c08a, roughness: 0.95, metalness: 0 })
);
sand.rotation.x = -Math.PI / 2;
sand.position.y = SAND_Y;
sand.receiveShadow = true;
scene.add(sand);

// -------------------------------------------------------------------- камни
// Додекаэдр с расшатанными вершинами: восемь камней, ни один не повторяется.
for (let i = 0; i < 8; i++) {
  const geo = new THREE.DodecahedronGeometry(0.8 + Math.random() * 1.1, 0);
  const p = geo.attributes.position;
  for (let v = 0; v < p.count; v++) {
    p.setXYZ(v,
      p.getX(v) * (0.75 + Math.random() * 0.5),
      p.getY(v) * (0.6 + Math.random() * 0.5),
      p.getZ(v) * (0.75 + Math.random() * 0.5));
  }
  geo.computeVertexNormals();
  const tone = 0.35 + Math.random() * 0.25;
  const rock = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: new THREE.Color(tone * 0.9, tone * 0.87, tone * 0.82),
    roughness: 0.9, flatShading: true
  }));
  rock.position.set(
    (Math.random() - 0.5) * (W - 8),
    SAND_Y + 0.5 + Math.random() * 0.3,
    (Math.random() - 0.5) * (D - 7));
  rock.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  rock.castShadow = true; rock.receiveShadow = true;
  scene.add(rock);
}

// ---------------------------------------------------------------- водоросли
// Лента вдоль кривой: стебель растёт от песка вверх и качается у основания
// слабее, чем у верхушки, — как настоящий, а не как палка на шарнире.
const algae = [];
for (let i = 0; i < 12; i++) {
  const height = 4 + Math.random() * 6;
  const baseX = (Math.random() - 0.5) * (W - 5);
  const baseZ = (Math.random() - 0.5) * (D - 5);
  const pts = [];
  for (let s = 0; s <= 5; s++) {
    const t = s / 5;
    pts.push(new THREE.Vector3(
      Math.sin(t * 3 + i) * 0.9 * t,
      t * height,
      Math.cos(t * 2.4 + i) * 0.7 * t));
  }
  const stem = new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, 0.14, 6, false),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.28 + Math.random() * 0.1, 0.65, 0.28 + Math.random() * 0.14),
      roughness: 0.85
    })
  );
  stem.position.set(baseX, SAND_Y, baseZ);
  stem.castShadow = true;
  scene.add(stem);
  algae.push({ mesh: stem, phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 0.5 });
}

// ------------------------------------------------------------------- пузыри
const bubbles = [];
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, transmission: 0.9, thickness: 0.2, roughness: 0.05,
  transparent: true, opacity: 0.5, metalness: 0
});
function makeBubble() {
  const r = 0.08 + Math.random() * 0.16;
  const b = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), bubbleMat);
  b.position.set(
    (Math.random() - 0.5) * (W - 3),
    SAND_Y + Math.random() * H * 0.9,
    (Math.random() - 0.5) * (D - 3));
  scene.add(b);
  bubbles.push({ mesh: b, speed: 1.4 + Math.random() * 1.8, phase: Math.random() * 6.3, drift: 0.25 + Math.random() * 0.4 });
}
for (let i = 0; i < 30; i++) makeBubble();

// -------------------------------------------------------------------- рыбки
// Восемь ЦВЕТОВЫХ схем из ТЗ: тело и плавники разного тона, иначе рыба читается пятном.
const COLOR_SCHEMES = [
  { body: 0xff7a1a, fin: 0xffc46b },
  { body: 0x2f7fff, fin: 0x8ec4ff },
  { body: 0xffd633, fin: 0xff5b3c },
  { body: 0x9b5cff, fin: 0xd7b6ff },
  { body: 0xff3b3b, fin: 0xffa0a0 },
  { body: 0x35d07f, fin: 0xa6f2c9 },
  { body: 0xff7fc4, fin: 0xffd0e8 },
  { body: 0xffcb45, fin: 0xfff0b8 }
];

const fishArray = [];

function makeFish() {
  const scheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];
  const scale = 0.6 + Math.random() * 0.6;          // разброс размеров из ТЗ
  const group = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: scheme.body, roughness: 0.45, metalness: 0.15 });
  const finMat = new THREE.MeshStandardMaterial({
    color: scheme.fin, roughness: 0.6, side: THREE.DoubleSide, transparent: true, opacity: 0.92
  });

  // Тело — сфера, вытянутая по X: дешёвая геометрия, но силуэт рыбий.
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.62, 18, 14), bodyMat);
  body.scale.set(1.7, 0.85, 0.6);
  body.castShadow = true;
  group.add(body);

  // Голова чуть уже тела — переход к морде, иначе рыба выглядит обрубком.
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 12), bodyMat);
  head.position.x = 0.85; head.scale.set(1.15, 0.9, 0.72);
  head.castShadow = true;
  group.add(head);

  // Глаза: белок + зрачок, оба смещены к морде и разведены по бокам.
  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 });
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.15 });
  [-1, 1].forEach(side => {
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), eyeWhiteMat);
    white.position.set(1.02, 0.14, side * 0.26);
    group.add(white);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), pupilMat);
    pupil.position.set(1.12, 0.14, side * 0.3);
    group.add(pupil);
  });

  // Хвост на своей оси вращения: конус ставим ЛЕВЕЕ точки поворота, тогда
  // вращение оси даёт мах, а не вращение вокруг собственного центра.
  const tailPivot = new THREE.Group();
  tailPivot.position.x = -1.02;
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.9, 4), finMat);
  tail.rotation.z = Math.PI / 2;
  tail.position.x = -0.42;
  tail.scale.set(1, 1, 0.35);
  tail.castShadow = true;
  tailPivot.add(tail);
  group.add(tailPivot);

  const dorsal = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.6, 3), finMat);
  dorsal.position.set(-0.1, 0.5, 0);
  dorsal.scale.set(1, 1, 0.22);
  group.add(dorsal);

  const sideFins = [];
  [-1, 1].forEach(side => {
    const fin = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.5, 3), finMat);
    fin.position.set(0.3, -0.08, side * 0.38);
    fin.rotation.z = -Math.PI / 2.6;
    fin.rotation.x = side * 0.5;
    fin.scale.set(1, 1, 0.25);
    group.add(fin);
    sideFins.push(fin);
  });

  group.scale.setScalar(scale);
  group.position.set(
    (Math.random() - 0.5) * (W - 8),
    SAND_Y + 2 + Math.random() * (H - 6),
    (Math.random() - 0.5) * (D - 7));
  scene.add(group);

  const velocity = new THREE.Vector3(Math.random() - 0.5, (Math.random() - 0.5) * 0.3, Math.random() - 0.5).normalize();

  fishArray.push({
    mesh: group, tail: tailPivot, leftFin: sideFins[0], rightFin: sideFins[1],
    velocity, speed: 2.2 + Math.random() * 2.4, tailSpeed: 7 + Math.random() * 6,
    phase: Math.random() * Math.PI * 2, targetFood: null,
    avoidanceRadius: 2.4 + Math.random() * 1.2, scale,
    wanderTimer: Math.random() * 3
  });
}
for (let i = 0; i < 15; i++) makeFish();

// -------------------------------------------------------------------- корм
const foods = [];
const foodMat = new THREE.MeshStandardMaterial({ color: 0xc98b3f, roughness: 0.8, emissive: 0x2a1a08 });
function dropFood(x, z) {
  const f = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), foodMat);
  f.position.set(x, HH - 1.2, z);
  f.castShadow = true;
  scene.add(f);
  foods.push({ mesh: f, vy: 0 });
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('click', e => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObject(glass, false)[0];
  if (hit) {
    dropFood(
      THREE.MathUtils.clamp(hit.point.x, -HW + 1.5, HW - 1.5),
      THREE.MathUtils.clamp(hit.point.z, -HD + 1.5, HD - 1.5));
  }
});

// ------------------------------------------------------------------ кнопки
document.getElementById('addFish').onclick = () => makeFish();
document.getElementById('addBubbles').onclick = () => { for (let i = 0; i < 10; i++) makeBubble(); };
let lightOn = true;
document.getElementById('toggleLight').onclick = () => {
  lightOn = !lightOn;
  sun.intensity = lightOn ? 1.15 : 0.15;
  ambient.intensity = lightOn ? 0.4 : 0.18;
};

// -------------------------------------------------------------------- цикл
const clock = new THREE.Clock();
let fpsAccum = 0, fpsFrames = 0;
const fishCountEl = document.getElementById('fishCount');
const fpsEl = document.getElementById('fps');
const foodCountEl = document.getElementById('foodCount');

// Границы плавания: рыба разворачивается ДО стекла, с запасом на её длину.
const BOUNDS = { x: HW - 2.2, yTop: HH - 1.6, yBot: SAND_Y + 1.2, z: HD - 2.2 };

const tmp = new THREE.Vector3();
const desired = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  fishArray.forEach((f, i) => {
    desired.set(0, 0, 0);

    // 1. Корм притягивает сильнее всего: ищем ближайший в радиусе 15.
    if (!f.targetFood || !f.targetFood.mesh.parent) {
      f.targetFood = null;
      let best = 1e9;
      foods.forEach(food => {
        const d = f.mesh.position.distanceTo(food.mesh.position);
        if (d < 15 && d < best) { best = d; f.targetFood = food; }
      });
    }
    if (f.targetFood) {
      tmp.subVectors(f.targetFood.mesh.position, f.mesh.position).normalize();
      desired.addScaledVector(tmp, 1.8);
    }

    // 2. Расталкивание: чем ближе сосед, тем сильнее отход.
    fishArray.forEach((o, j) => {
      if (i === j) return;
      const d = f.mesh.position.distanceTo(o.mesh.position);
      if (d < f.avoidanceRadius && d > 0.001) {
        tmp.subVectors(f.mesh.position, o.mesh.position).normalize();
        desired.addScaledVector(tmp, (f.avoidanceRadius - d) / f.avoidanceRadius * 1.5);
      }
    });

    // 3. Блуждание: раз в пару секунд лёгкий разворот, иначе стая застывает
    // в общем строю и аквариум выглядит мёртвым.
    f.wanderTimer -= dt;
    if (f.wanderTimer <= 0) {
      f.wanderTimer = 1.5 + Math.random() * 2.5;
      desired.add(new THREE.Vector3(
        (Math.random() - 0.5) * 1.2,
        (Math.random() - 0.5) * 0.5,
        (Math.random() - 0.5) * 1.2));
    }

    // 4. Стенки: отталкивание тем сильнее, чем ближе рыба к границе.
    const p = f.mesh.position;
    if (p.x > BOUNDS.x) desired.x -= (p.x - BOUNDS.x) * 1.4;
    if (p.x < -BOUNDS.x) desired.x += (-BOUNDS.x - p.x) * 1.4;
    if (p.y > BOUNDS.yTop) desired.y -= (p.y - BOUNDS.yTop) * 1.6;
    if (p.y < BOUNDS.yBot) desired.y += (BOUNDS.yBot - p.y) * 1.6;
    if (p.z > BOUNDS.z) desired.z -= (p.z - BOUNDS.z) * 1.4;
    if (p.z < -BOUNDS.z) desired.z += (-BOUNDS.z - p.z) * 1.4;

    if (desired.lengthSq() > 0) {
      f.velocity.addScaledVector(desired, dt * 2.2).normalize();
    }

    p.addScaledVector(f.velocity, f.speed * dt);

    // Отражение от стен. Отталкивание выше делает поворот плавным, но если
    // рыба всё же дошла до стекла (например, её вытолкнули соседи), скорость
    // разворачивается наружу — знак компоненты меняется, как при отскоке.
    if (p.x > BOUNDS.x) { p.x = BOUNDS.x; f.velocity.x = -Math.abs(f.velocity.x); }
    if (p.x < -BOUNDS.x) { p.x = -BOUNDS.x; f.velocity.x = Math.abs(f.velocity.x); }
    if (p.y > BOUNDS.yTop) { p.y = BOUNDS.yTop; f.velocity.y = -Math.abs(f.velocity.y); }
    if (p.y < BOUNDS.yBot) { p.y = BOUNDS.yBot; f.velocity.y = Math.abs(f.velocity.y); }
    if (p.z > BOUNDS.z) { p.z = BOUNDS.z; f.velocity.z = -Math.abs(f.velocity.z); }
    if (p.z < -BOUNDS.z) { p.z = -BOUNDS.z; f.velocity.z = Math.abs(f.velocity.z); }

    // Разворот корпуса в сторону движения: модель смотрит по +X, поэтому
    // после lookAt доворачиваем на четверть оборота.
    tmp.copy(p).addScaledVector(f.velocity, 2);
    f.mesh.lookAt(tmp);
    f.mesh.rotateY(Math.PI / 2);

    // Хвост и плавники: частота своя у каждой рыбы, фаза сдвинута.
    f.tail.rotation.y = Math.sin(t * f.tailSpeed + f.phase) * 0.55;
    const finSwing = Math.sin(t * f.tailSpeed * 0.7 + f.phase) * 0.35;
    f.leftFin.rotation.x = 0.5 + finSwing;
    f.rightFin.rotation.x = -0.5 - finSwing;

    // Съедание: корм исчезает, рыба прибавляет 5%.
    if (f.targetFood && p.distanceTo(f.targetFood.mesh.position) < 0.9) {
      scene.remove(f.targetFood.mesh);
      const idx = foods.indexOf(f.targetFood);
      if (idx >= 0) foods.splice(idx, 1);
      f.targetFood = null;
      f.scale = Math.min(f.scale * 1.05, 2.4);
      f.mesh.scale.setScalar(f.scale);
    }
  });

  // Корм падает с ускорением и исчезает, коснувшись песка.
  for (let i = foods.length - 1; i >= 0; i--) {
    const food = foods[i];
    food.vy -= 6 * dt;
    food.mesh.position.y += food.vy * dt;
    if (food.mesh.position.y <= SAND_Y + 0.2) {
      scene.remove(food.mesh);
      foods.splice(i, 1);
    }
  }

  bubbles.forEach(b => {
    b.mesh.position.y += b.speed * dt;
    b.mesh.position.x += Math.sin(t * 1.6 + b.phase) * b.drift * dt;
    b.mesh.position.z += Math.cos(t * 1.3 + b.phase) * b.drift * dt;
    if (b.mesh.position.y > HH - 0.6) {
      b.mesh.position.y = SAND_Y + 0.4;
      b.mesh.position.x = (Math.random() - 0.5) * (W - 3);
      b.mesh.position.z = (Math.random() - 0.5) * (D - 3);
    }
  });

  algae.forEach(a => {
    a.mesh.rotation.x = Math.sin(t * a.speed + a.phase) * 0.11;
    a.mesh.rotation.z = Math.cos(t * a.speed * 0.8 + a.phase) * 0.13;
  });

  controls.update();
  renderer.render(scene, camera);

  fpsAccum += dt; fpsFrames++;
  if (fpsAccum >= 0.5) {
    fpsEl.textContent = Math.round(fpsFrames / fpsAccum);
    fpsAccum = 0; fpsFrames = 0;
    fishCountEl.textContent = fishArray.length;
    foodCountEl.textContent = foods.length;
  }
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
