<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐠 3D Аквариум</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  canvas { display: block; }

  .panel {
    position: absolute;
    background: rgba(10, 30, 60, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(120, 200, 255, 0.3);
    border-radius: 14px;
    padding: 16px 20px;
    color: #d0ecff;
    box-shadow: 0 8px 32px rgba(0, 20, 50, 0.5);
    user-select: none;
  }

  #info-panel { top: 20px; left: 20px; max-width: 280px; }
  #info-panel h1 {
    font-size: 22px;
    background: linear-gradient(90deg, #4dd0ff, #a78bfa, #ffb347);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  #info-panel p { font-size: 12px; line-height: 1.6; opacity: 0.85; margin-bottom: 12px; }

  .btn {
    display: block;
    width: 100%;
    margin: 6px 0;
    padding: 9px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
    box-shadow: 0 3px 12px rgba(14, 165, 233, 0.4);
    transition: all 0.25s ease;
  }
  .btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 6px 20px rgba(14, 165, 233, 0.7), 0 0 15px rgba(77, 208, 255, 0.4);
  }
  .btn:active { transform: translateY(0) scale(0.98); }
  .btn.green { background: linear-gradient(135deg, #10b981, #0d9488); box-shadow: 0 3px 12px rgba(16,185,129,0.4); }
  .btn.purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 0 3px 12px rgba(139,92,246,0.4); }

  #stats-panel { top: 20px; right: 20px; text-align: right; min-width: 150px; }
  #stats-panel div { font-size: 14px; margin: 4px 0; }
  #stats-panel span { color: #4dd0ff; font-weight: 700; }

  @media (max-width: 600px) {
    #info-panel { max-width: 200px; padding: 10px; }
    #info-panel h1 { font-size: 16px; }
    #info-panel p { font-size: 10px; }
  }
</style>
</head>
<body>

<div class="panel" id="info-panel">
  <h1>🐠 3D Аквариум</h1>
  <p>
    🖱️ <b>ЛКМ + движение</b> — вращение камеры<br>
    🖱️ <b>ПКМ + движение</b> — панорамирование<br>
    🖱️ <b>Колесо мыши</b> — приближение<br>
    🍽️ <b>Клик по аквариуму</b> — бросить корм!
  </p>
  <button class="btn green" id="btn-add-fish">🐟 Добавить рыбку</button>
  <button class="btn" id="btn-bubbles">💭 Больше пузырей</button>
  <button class="btn purple" id="btn-light">💡 Свет вкл/выкл</button>
</div>

<div class="panel" id="stats-panel">
  <div>Рыбки: <span id="fish-count">15</span></div>
  <div>Корм: <span id="food-count">0</span></div>
  <div>FPS: <span id="fps">60</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================
// БАЗОВАЯ СЦЕНА
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x041e3f);
scene.fog = new THREE.FogExp2(0x0a2a52, 0.012);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(28, 18, 32);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 1.8;

// Границы аквариума
const TANK = { x: 18, y: 12, z: 10 }; // полуразмеры (36x24x20)

// ============================================================
// ОСВЕЩЕНИЕ
// ============================================================
scene.add(new THREE.AmbientLight(0x404040, 0.4));

const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
sunLight.position.set(20, 35, 15);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -30;
sunLight.shadow.camera.right = 30;
sunLight.shadow.camera.top = 30;
sunLight.shadow.camera.bottom = -30;
scene.add(sunLight);

const blueLight1 = new THREE.PointLight(0x4488ff, 0.8, 50);
blueLight1.position.set(-12, 8, 0);
scene.add(blueLight1);

const blueLight2 = new THREE.PointLight(0x00ccff, 0.6, 50);
blueLight2.position.set(12, -5, 4);
scene.add(blueLight2);

// ============================================================
// АКВАРИУМ (СТЕКЛО)
// ============================================================
const glassGeo = new THREE.BoxGeometry(TANK.x * 2, TANK.y * 2, TANK.z * 2);
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x88ccff,
  transparent: true,
  opacity: 0.08,
  transmission: 0.95,
  roughness: 0.05,
  metalness: 0,
  side: THREE.BackSide
});
const tank = new THREE.Mesh(glassGeo, glassMat);
scene.add(tank);

const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(glassGeo),
  new THREE.LineBasicMaterial({ color: 0x66bbff, transparent: true, opacity: 0.6 })
);
scene.add(edges);

// ============================================================
// ПЕСЧАНОЕ ДНО (с procedural неровностями)
// ============================================================
const sandGeo = new THREE.PlaneGeometry(TANK.x * 2, TANK.z * 2, 40, 40);
sandGeo.attributes.position.array.forEach((v, i) => {
  if (i % 3 === 2) sandGeo.attributes.position.array[i] = Math.random() * 0.35;
});
sandGeo.computeVertexNormals();
const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({ color: 0xd9b97a, roughness: 1 }));
sand.rotation.x = -Math.PI / 2;
sand.position.y = -TANK.y + 0.2;
sand.receiveShadow = true;
scene.add(sand);

// ============================================================
// КАМНИ (деформированные додекаэдры)
// ============================================================
for (let i = 0; i < 8; i++) {
  const geo = new THREE.DodecahedronGeometry(0.8 + Math.random() * 1.4, 0);
  geo.attributes.position.array.forEach((v, j) => {
    geo.attributes.position.array[j] = v * (0.75 + Math.random() * 0.5);
  });
  geo.computeVertexNormals();
  const rock = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.08, 0.1, 0.25 + Math.random() * 0.2),
    roughness: 0.95
  }));
  rock.position.set(
    (Math.random() - 0.5) * (TANK.x * 1.7),
    -TANK.y + 0.6,
    (Math.random() - 0.5) * (TANK.z * 1.7)
  );
  rock.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
}

// ============================================================
// ВОДОРОСЛИ (TubeGeometry + CatmullRomCurve3)
// ============================================================
const seaweeds = [];
for (let i = 0; i < 12; i++) {
  const baseX = (Math.random() - 0.5) * (TANK.x * 1.8);
  const baseZ = (Math.random() - 0.5) * (TANK.z * 1.8);
  const height = 3 + Math.random() * 5;
  const points = [];
  for (let j = 0; j <= 5; j++) {
    points.push(new THREE.Vector3(
      Math.sin(j * 0.8) * 0.4,
      (height / 5) * j,
      Math.cos(j * 0.6) * 0.3
    ));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  const seaweed = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 12, 0.12, 6, false),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.28 + Math.random() * 0.12, 0.7, 0.3 + Math.random() * 0.15),
      roughness: 0.8
    })
  );
  seaweed.position.set(baseX, -TANK.y + 0.2, baseZ);
  seaweed.castShadow = true;
  seaweed.userData.phase = Math.random() * Math.PI * 2;
  seaweed.userData.speed = 0.5 + Math.random() * 0.8;
  scene.add(seaweed);
  seaweeds.push(seaweed);
}

// ============================================================
// ПУЗЫРИ
// ============================================================
const bubbles = [];
const bubbleGeo = new THREE.SphereGeometry(0.2, 10, 10);
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.35,
  transmission: 0.9,
  roughness: 0.1,
  metalness: 0
});

function spawnBubble() {
  const b = new THREE.Mesh(bubbleGeo, bubbleMat);
  const s = 0.5 + Math.random() * 1.2;
  b.scale.setScalar(s);
  b.position.set(
    (Math.random() - 0.5) * TANK.x * 1.8,
    -TANK.y + Math.random() * TANK.y * 2,
    (Math.random() - 0.5) * TANK.z * 1.8
  );
  b.userData = { speed: 1.5 + Math.random() * 2, phase: Math.random() * Math.PI * 2, amp: 0.3 + Math.random() * 0.6 };
  scene.add(b);
  bubbles.push(b);
}
for (let i = 0; i < 30; i++) spawnBubble();

// ============================================================
// РЫБКИ
// ============================================================
const COLOR_SCHEMES = [
  { body: 0xff7f27, fin: 0xffb347 }, // оранжевая
  { body: 0x2266ff, fin: 0x66aaff }, // синяя
  { body: 0xffdd00, fin: 0xff4422 }, // желто-красная
  { body: 0x9944ff, fin: 0xcc88ff }, // фиолетовая
  { body: 0xee2233, fin: 0xff7788 }, // красная
  { body: 0x22bb55, fin: 0x88ee99 }, // зеленая
  { body: 0xff66aa, fin: 0xffbbdd }, // розовая
  { body: 0xddaa22, fin: 0xffe066 }, // золотая
];

const fishArray = [];

function createFish() {
  const scheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];
  const group = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: scheme.body, roughness: 0.4, metalness: 0.2 });
  const finMat = new THREE.MeshStandardMaterial({ color: scheme.fin, roughness: 0.6, transparent: true, opacity: 0.85, side: THREE.DoubleSide });

  // Тело — вытянутая сфера
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 12), bodyMat);
  body.scale.set(1.6, 0.9, 0.6);
  body.castShadow = true;
  group.add(body);

  // Глаза
  const eyeGeo = new THREE.SphereGeometry(0.16, 8, 8);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const pupilGeo = new THREE.SphereGeometry(0.08, 6, 6);
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
  [1, -1].forEach(side => {
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(0.95, 0.2, side * 0.42);
    group.add(eye);
    const pupil = new THREE.Mesh(pupilGeo, pupilMat);
    pupil.position.set(1.06, 0.2, side * 0.5);
    group.add(pupil);
  });

  // Хвост (группа для вращения вокруг оси X/Z у основания)
  const tailGroup = new THREE.Group();
  tailGroup.position.set(-1.25, 0, 0);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.1, 4), finMat);
  tail.rotation.z = Math.PI / 2;
  tail.scale.set(0.15, 1, 1.4);
  tail.position.x = -0.5;
  tailGroup.add(tail);
  group.add(tailGroup);

  // Верхний плавник
  const topFin = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.8, 4), finMat);
  topFin.scale.set(0.2, 1, 1);
  topFin.position.set(0.1, 0.75, 0);
  group.add(topFin);

  // Боковые плавники
  const finGeo = new THREE.ConeGeometry(0.25, 0.6, 4);
  const leftFin = new THREE.Mesh(finGeo, finMat);
  leftFin.scale.set(0.2, 1, 1);
  leftFin.position.set(0.3, -0.25, 0.5);
  leftFin.rotation.x = 0.6;
  group.add(leftFin);

  const rightFin = new THREE.Mesh(finGeo, finMat);
  rightFin.scale.set(0.2, 1, 1);
  rightFin.position.set(0.3, -0.25, -0.5);
  rightFin.rotation.x = -0.6;
  group.add(rightFin);

  const scale = 0.6 + Math.random() * 0.6;
  group.scale.setScalar(scale);
  group.position.set(
    (Math.random() - 0.5) * TANK.x * 1.6,
    (Math.random() - 0.5) * TANK.y * 1.4,
    (Math.random() - 0.5) * TANK.z * 1.6
  );

  scene.add(group);

  fishArray.push({
    mesh: group,
    tail: tailGroup,
    leftFin, rightFin,
    velocity: new THREE.Vector3(Math.random() - 0.5, (Math.random() - 0.5) * 0.3, Math.random() - 0.5).normalize(),
    speed: 1.5 + Math.random() * 2.5,
    tailSpeed: 4 + Math.random() * 5,
    phase: Math.random() * Math.PI * 2,
    targetFood: null,
    avoidanceRadius: 2 + Math.random() * 1.5,
    wanderTimer: 0
  });
  updateFishCount();
}

const foods = [];
for (let i = 0; i < 15; i++) createFish();

// ============================================================
// КОРМ
// ============================================================
const foodGeo = new THREE.SphereGeometry(0.22, 6, 6);
const foodMat = new THREE.MeshStandardMaterial({ color: 0xcc6633, roughness: 1 });

function spawnFood(point) {
  const f = new THREE.Mesh(foodGeo, foodMat);
  f.position.copy(point);
  f.position.y = Math.min(f.position.y, TANK.y - 1);
  f.userData.velY = 0;
  scene.add(f);
  foods.push(f);
  updateFishCount();
}

// Клик по аквариуму — бросить корм
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const clickPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
let downPos = { x: 0, y: 0 };

renderer.domElement.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  // игнорируем "протяжки" камеры
  if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 6) return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  // плоскость перпендикулярна направлению камеры, через центр аквариума
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  clickPlane.normal.copy(camDir).negate();
  clickPlane.constant = 0;
  const pt = new THREE.Vector3();
  raycaster.ray.intersectPlane(clickPlane, pt);
  if (pt) {
    pt.x = THREE.MathUtils.clamp(pt.x, -TANK.x + 1, TANK.x - 1);
    pt.y = THREE.MathUtils.clamp(pt.y, -TANK.y + 2, TANK.y - 1);
    pt.z = THREE.MathUtils.clamp(pt.z, -TANK.z + 1, TANK.z - 1);
    spawnFood(pt);
  }
});

// ============================================================
// UI
// ============================================================
let mainLightOn = true;
document.getElementById('btn-add-fish').onclick = () => { if (fishArray.length < 60) createFish(); };
document.getElementById('btn-bubbles').onclick = () => { for (let i = 0; i < 10; i++) spawnBubble(); };
document.getElementById('btn-light').onclick = () => {
  mainLightOn = !mainLightOn;
  sunLight.intensity = mainLightOn ? 1.0 : 0.08;
  scene.fog.density = mainLightOn ? 0.012 : 0.025;
};

function updateFishCount() {
  document.getElementById('fish-count').textContent = fishArray.length;
  document.getElementById('food-count').textContent = foods.length;
}

// ============================================================
// ЦИКЛ АНИМАЦИИ
// ============================================================
const clock = new THREE.Clock();
let fpsTime = 0, fpsFrames = 0;
const tmpVec = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // --- Корм: физика падения ---
  for (let i = foods.length - 1; i >= 0; i--) {
    const f = foods[i];
    f.userData.velY -= 4 * dt;
    f.position.y += f.userData.velY * dt;
    f.position.x += Math.sin(t * 2 + i) * 0.3 * dt;
    if (f.position.y <= -TANK.y + 0.5) {
      scene.remove(f);
      foods.splice(i, 1);
      updateFishCount();
    }
  }

  // --- Рыбки ---
  fishArray.forEach(fish => {
    const pos = fish.mesh.position;

    // Поиск корма (радиус 15)
    if (!fish.targetFood || !foods.includes(fish.targetFood)) {
      fish.targetFood = null;
      let best = 15;
      foods.forEach(f => {
        const d = pos.distanceTo(f.position);
        if (d < best) { best = d; fish.targetFood = f; }
      });
    }

    if (fish.targetFood) {
      // Преследование корма
      tmpVec.copy(fish.targetFood.position).sub(pos).normalize();
      fish.velocity.lerp(tmpVec, 3 * dt);
      fish.speed = Math.min(fish.speed + 2 * dt, 6);

      // Съедание
      if (pos.distanceTo(fish.targetFood.position) < 0.8) {
        scene.remove(fish.targetFood);
        foods.splice(foods.indexOf(fish.targetFood), 1);
        fish.mesh.scale.multiplyScalar(1.05); // рост +5%
        fish.targetFood = null;
        updateFishCount();
      }
    } else {
      // Случайное блуждание
      fish.wanderTimer -= dt;
      if (fish.wanderTimer <= 0) {
        fish.wanderTimer = 1.5 + Math.random() * 3;
        tmpVec.set(Math.random() - 0.5, (Math.random() - 0.5) * 0.4, Math.random() - 0.5).normalize();
        fish.velocity.lerp(tmpVec, 0.6);
      }
      fish.speed = Math.max(fish.speed - 1.5 * dt, 1.0);
    }

    // Избегание столкновений
    fishArray.forEach(other => {
      if (other === fish) return;
      const d = pos.distanceTo(other.mesh.position);
      if (d < fish.avoidanceRadius && d > 0.001) {
        tmpVec.copy(pos).sub(other.mesh.position).normalize().multiplyScalar((fish.avoidanceRadius - d) * 2);
        fish.velocity.add(tmpVec.multiplyScalar(dt));
      }
    });

    fish.velocity.normalize();
    pos.addScaledVector(fish.velocity, fish.speed * dt);

    // Отражение от стен (плавное)
    const margin = 1.5;
    const steer = new THREE.Vector3();
    if (pos.x > TANK.x - margin) steer.x = -(pos.x - TANK.x + margin);
    if (pos.x < -TANK.x + margin) steer.x = -(-TANK.x + margin - pos.x);
    if (pos.y > TANK.y - margin) steer.y = -(pos.y - TANK.y + margin);
    if (pos.y < -TANK.y + margin + 0.8) steer.y = -(-TANK.y + margin + 0.8 - pos.y);
    if (pos.z > TANK.z - margin) steer.z = -(pos.z - TANK.z + margin);
    if (pos.z < -TANK.z + margin) steer.z = -(-TANK.z + margin - pos.z);
    if (steer.lengthSq() > 0) {
      fish.velocity.lerp(steer.normalize(), 4 * dt).normalize();
    }
    pos.x = THREE.MathUtils.clamp(pos.x, -TANK.x + 0.5, TANK.x - 0.5);
    pos.y = THREE.MathUtils.clamp(pos.y, -TANK.y + 1, TANK.y - 0.5);
    pos.z = THREE.MathUtils.clamp(pos.z, -TANK.z + 0.5, TANK.z - 0.5);

    // Поворот в направлении движения
    const targetYaw = Math.atan2(-fish.velocity.z, fish.velocity.x);
    let dy = targetYaw - fish.mesh.rotation.y;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    fish.mesh.rotation.y += dy * Math.min(5 * dt, 1);
    fish.mesh.rotation.z = THREE.MathUtils.lerp(fish.mesh.rotation.z, -fish.velocity.y * 0.6, 4 * dt);

    // Анимация хвоста и плавников
    const wig = Math.sin(t * fish.tailSpeed + fish.phase);
    fish.tail.rotation.y = wig * 0.6;
    fish.leftFin.rotation.z = wig * 0.4 + 0.3;
    fish.rightFin.rotation.z = -wig * 0.4 - 0.3;
  });

  // --- Пузыри ---
  bubbles.forEach(b => {
    b.position.y += b.userData.speed * dt;
    b.position.x += Math.sin(t * 2 + b.userData.phase) * b.userData.amp * dt;
    b.position.z += Math.cos(t * 1.7 + b.userData.phase) * b.userData.amp * dt;
    if (b.position.y > TANK.y - 0.5) {
      b.position.y = -TANK.y + 0.5;
      b.position.x = (Math.random() - 0.5) * TANK.x * 1.8;
      b.position.z = (Math.random() - 0.5) * TANK.z * 1.8;
    }
  });

  // --- Водоросли ---
  seaweeds.forEach(sw => {
    sw.rotation.x = Math.sin(t * sw.userData.speed + sw.userData.phase) * 0.12;
    sw.rotation.z = Math.cos(t * sw.userData.speed * 0.8 + sw.userData.phase) * 0.1;
  });

  // --- Пульсация подводного света ---
  blueLight1.intensity = 0.7 + Math.sin(t * 0.8) * 0.15;
  blueLight2.intensity = 0.5 + Math.cos(t * 0.6) * 0.12;

  // --- FPS ---
  fpsFrames++;
  fpsTime += dt;
  if (fpsTime >= 0.5) {
    document.getElementById('fps').textContent = Math.round(fpsFrames / fpsTime);
    fpsFrames = 0; fpsTime = 0;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

// Адаптивность
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
