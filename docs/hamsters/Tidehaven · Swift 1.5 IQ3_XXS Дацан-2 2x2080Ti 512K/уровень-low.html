<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Tidehaven — Coastal Island Diorama</title>
<style>
  /* ---------- Global look & typography ---------- */
  :root{
    --ink:#1c2226; --paper:#f4efe6; --glass:rgba(20,28,32,.42);
    --glass2:rgba(20,28,32,.22); --accent:#e8a24a; --accent2:#5bb8c4;
    --line:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a1418;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    color:var(--paper); user-select:none;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}

  /* ---------- Header ---------- */
  #head{position:fixed;top:14px;left:18px;z-index:10;pointer-events:none;
    text-shadow:0 2px 14px rgba(0,0,0,.55);}
  #head h1{margin:0;font-size:clamp(22px,3.4vw,34px);letter-spacing:.5px;
    font-weight:600;}
  #head h1 .t{color:var(--accent);}
  #head p{margin:2px 0 0;font-size:clamp(11px,1.3vw,14px);font-style:italic;
    opacity:.82;max-width:340px;}

  /* ---------- Panels ---------- */
  #ui{position:fixed;top:14px;right:14px;z-index:20;display:flex;flex-direction:column;
    gap:8px;max-height:calc(100% - 28px);width:248px;}
  .panel{background:var(--glass);backdrop-filter:blur(9px) saturate(1.1);
    -webkit-backdrop-filter:blur(9px) saturate(1.1);
    border:1px solid var(--line);border-radius:14px;padding:10px 12px;
    box-shadow:0 8px 28px rgba(0,0,0,.35);}
  .panel h2{margin:0 0 7px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
    opacity:.72;font-weight:600;}
  .row{display:flex;gap:6px;flex-wrap:wrap;}
  .btn{flex:1 1 auto;min-width:46px;padding:8px 9px;border:1px solid var(--line);
    border-radius:9px;background:var(--glass2);color:var(--paper);font:inherit;
    font-size:12px;cursor:pointer;transition:.18s;letter-spacing:.3px;}
  .btn:hover{background:rgba(255,255,255,.13);}
  .btn.on{background:var(--accent);color:#1a1208;border-color:transparent;
    box-shadow:0 0 16px rgba(232,162,74,.45);font-weight:600;}
  .btn.cam.on{background:var(--accent2);color:#06222a;box-shadow:0 0 16px rgba(91,184,196,.45);}
  .slider{display:flex;align-items:center;gap:8px;margin:6px 0;}
  .slider label{font-size:11px;width:42px;opacity:.85;letter-spacing:.4px;}
  .slider .val{font-size:11px;width:40px;text-align:right;opacity:.7;font-variant-numeric:tabular-nums;}
  input[type=range]{flex:1;appearance:none;-webkit-appearance:none;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));outline:none;}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--paper);border:2px solid var(--accent);cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.4);}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--paper);
    border:2px solid var(--accent);cursor:pointer;}
  select{flex:1;background:var(--glass2);color:var(--paper);border:1px solid var(--line);
    border-radius:9px;padding:7px 8px;font:inherit;font-size:12px;cursor:pointer;}
  select option{background:#162126;color:var(--paper);}

  /* ---------- Mobile collapse ---------- */
  #toggle{position:fixed;top:14px;right:14px;z-index:30;display:none;width:42px;height:42px;
    border-radius:12px;background:var(--glass);backdrop-filter:blur(9px);border:1px solid var(--line);
    color:var(--paper);font-size:20px;cursor:pointer;align-items:center;justify-content:center;}
  @media (max-width:760px){
    #ui{top:62px;right:10px;left:10px;width:auto;transform:translateY(-130%);
      transition:transform .35s cubic-bezier(.4,0,.2,1);}
    #ui.open{transform:translateY(0);}
    #toggle{display:flex;}
    .panel{padding:9px 10px;}
  }

  /* ---------- Footer hint ---------- */
  #hint{position:fixed;bottom:12px;left:18px;z-index:10;font-size:11px;opacity:.55;
    pointer-events:none;letter-spacing:.4px;text-shadow:0 1px 8px rgba(0,0,0,.6);}
  #loader{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:#0a1418;flex-direction:column;gap:14px;transition:opacity .8s;}
  #loader.hidden{opacity:0;pointer-events:none;}
  #loader .ring{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);
    border-top-color:var(--accent);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader p{font-size:13px;letter-spacing:1px;opacity:.8;}
</style>
</head>
<body>
<div id="app"></div>

<div id="head">
  <h1><span class="t">Tide</span>haven</h1>
  <p>A miniature coastal island — cozy above, alive below.</p>
</div>

<button id="toggle" aria-label="Toggle controls">☰</button>

<div id="ui">
  <div class="panel">
    <h2>Camera</h2>
    <div class="row">
      <button class="btn cam on" data-cam="0">Island</button>
      <button class="btn cam" data-cam="1">Cabin</button>
      <button class="btn cam" data-cam="2">Deep</button>
      <button class="btn cam" data-cam="3">Orbit</button>
    </div>
  </div>

  <div class="panel">
    <h2>Actions</h2>
    <div class="row">
      <button class="btn" id="bKayak">Launch Kayak</button>
      <button class="btn" id="bRay">Ray Leap</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button class="btn" id="bPause">Pause</button>
      <button class="btn" id="bReset">Reset</button>
    </div>
  </div>

  <div class="panel">
    <h2>Environment</h2>
    <div class="slider"><label>Tide</label><input type="range" id="sTide" min="0" max="100" value="50"><span class="val" id="vTide">50</span></div>
    <div class="slider"><label>Wind</label><input type="range" id="sWind" min="0" max="100" value="40"><span class="val" id="vWind">40</span></div>
    <div class="slider"><label>Time</label>
      <select id="sTime">
        <option value="0">Daytime</option>
        <option value="1" selected>Sunset</option>
        <option value="2">Night</option>
      </select>
    </div>
  </div>

  <div class="panel">
    <h2>Sound</h2>
    <div class="row"><button class="btn" id="bMusic">Music Off</button></div>
    <div class="slider"><label>Volume</label><input type="range" id="sVol" min="0" max="100" value="60"><span class="val" id="vVol">60</span></div>
  </div>
</div>

<div id="hint">Drag to orbit · Scroll to zoom · Click a camera preset to frame the scene</div>

<div id="loader"><div class="ring"></div><p>Building Tidehaven…</p></div>

<!-- Import map for Three.js ES modules from CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   TIDEHAVEN — procedural coastal island diorama
   Sections: 0 core · 1 world · 2 island · 3 cabin · 4 pier · 5 water
             6 underwater · 7 effects · 8 cameras · 9 audio · 10 UI · 11 loop
   ===================================================================== */

/* ---------- 0. CORE SETUP ---------- */
const app = document.getElementById('app');

// Quality detection for low-end devices
const lowEnd = (navigator.hardwareConcurrency || 4) <= 4 && matchMedia('(pointer:coarse)').matches;
const QUAL = lowEnd ? 0 : 1;                 // 0 = lite, 1 = full

const renderer = new THREE.WebGLRenderer({ antialias: QUAL === 1, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, QUAL === 1 ? 2 : 1.4));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9fc6cf, 0.012);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(22, 16, 22);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 2, 0);

// Global simulation clock (pausable) & shared uniforms
let simTime = 0, paused = false;
const clock = new THREE.Clock();
const uTime = { value: 0 };
const uWind = { value: 0.4 };
const uTide = { value: 0.5 };

/* ---------- 1. WORLD / LIGHTING ---------- */
const hemi = new THREE.HemisphereLight(0xbfe6ff, 0x6b5a3a, 0.7);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1d8, 1.5);
sun.position.set(18, 26, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(QUAL === 1 ? 2048 : 1024, QUAL === 1 ? 2048 : 1024);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 90;
sun.shadow.camera.left = -28; sun.shadow.camera.right = 28;
sun.shadow.camera.top = 28; sun.shadow.camera.bottom = -28;
sun.shadow.bias = -0.0008;
sun.shadow.radius = 4;
scene.add(sun);

const ambient = new THREE.AmbientLight(0xffffff, 0.25);
scene.add(ambient);

// Sky gradient background (shader on a big sphere)
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    top: { value: new THREE.Color(0x87c4e0) },
    bot: { value: new THREE.Color(0xfde6c8) },
    horizon: { value: new THREE.Color(0xffd9a8) }
  },
  vertexShader: `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vP; uniform vec3 top,bot,horizon;
    void main(){ float h=normalize(vP).y; vec3 c=mix(bot,horizon,smoothstep(-0.1,0.12,h));
    c=mix(c,top,smoothstep(0.12,0.7,h)); gl_FragColor=vec4(c,1.0);} `
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(160, 32, 16), skyMat);
scene.add(sky);

// Shared time-of-day palettes (lerped smoothly)
const TOD = [
  { // daytime
    skyTop:0x87c4e0, skyBot:0xfde6c8, skyHor:0xffd9a8, sun:0xfff1d8, sunI:1.5,
    hemiSky:0xbfe6ff, hemiGnd:0x6b5a3a, hemiI:0.7, amb:0.25, fog:0x9fc6cf, exp:1.05,
    lamp:0.0, sunPos:[18,26,12]
  },
  { // sunset
    skyTop:0x4a6fa5, skyBot:0xff9a5a, skyHor:0xff7a45, sun:0xffb070, sunI:1.25,
    hemiSky:0xffb27a, hemiGnd:0x4a3a2a, hemiI:0.55, amb:0.22, fog:0xd98a6a, exp:1.02,
    lamp:0.55, sunPos:[24,9,16]
  },
  { // night
    skyTop:0x0a1430, skyBot:0x1a2a44, skyHor:0x2a3a55, sun:0x8fa8ff, sunI:0.35,
    hemiSky:0x2a3a66, hemiGnd:0x10141c, hemiI:0.35, amb:0.16, fog:0x16243a, exp:1.12,
    lamp:1.0, sunPos:[-16,18,-10]
  }
];
let todMix = 1; // start at sunset (matches select default)
const _cA=new THREE.Color(), _cB=new THREE.Color();
function lerpColor(target, a, b, t){ _cA.setHex(a); _cB.setHex(b); target.copy(_cA).lerp(_cB, t); }

/* ---------- 2. ISLAND (terrain, sand, rocks, grass, trees) ---------- */
const islandGroup = new THREE.Group();
scene.add(islandGroup);

const WATER_BASE = 0.0;      // water surface at tide=0.5
const SEABED_Y   = -7.0;     // aquarium floor
const ISLAND_TOP = 3.2;      // peak height

// Terrain height function (procedural, smooth dome with noise)
function terrainHeight(x, z){
  const d = Math.sqrt(x*x + z*z);
  const dome = Math.max(0, 1 - d/9.2);
  const h = Math.pow(dome, 1.7) * ISLAND_TOP;
  const n = Math.sin(x*1.3+1.2)*Math.cos(z*1.1-0.4)*0.18 + Math.sin(x*3.1)*Math.sin(z*2.7)*0.07;
  return h + n*dome - 0.2;
}

// Build island terrain as a disc mesh with vertex colors (sand -> grass)
const terrainGeo = new THREE.CircleGeometry(9.2, 96);
terrainGeo.rotateX(-Math.PI/2);
{
  const pos = terrainGeo.attributes.position;
  const colors = [];
  const sand = new THREE.Color(0xe8d49a), grass = new THREE.Color(0x6fa86a), rock = new THREE.Color(0x9a938a);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    const h=terrainHeight(x,z);
    pos.setY(i, h);
    const t=THREE.MathUtils.smoothstep(h, 0.15, 1.1);   // sand near shore, grass inland
    const c = sand.clone().lerp(grass, t);
    if(Math.random()<0.04) c.lerp(rock, 0.4);
    colors.push(c.r,c.g,c.b);
  }
  terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
  terrainGeo.computeVertexNormals();
}
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({
  vertexColors:true, roughness:0.95, metalness:0.0, flatShading:false
}));
terrain.castShadow = true; terrain.receiveShadow = true;
islandGroup.add(terrain);

// Underwater base of island (sandy cone down to seabed) for cross-section depth
const baseGeo = new THREE.CylinderGeometry(9.2, 6.0, SEABED_Y*-1 - 0.2, 48, 1, true);
baseGeo.translate(0, (SEABED_Y-0.2)/2 + 0.2, 0);
const islandBase = new THREE.Mesh(baseGeo, new THREE.MeshStandardMaterial({
  color:0xc9b07a, roughness:1.0, side:THREE.DoubleSide
}));
islandBase.receiveShadow = true;
islandGroup.add(islandBase);

// Cutaway strata faces (front & right) so the cross-section reads like soil layers
function strataFace(w, h, isFront){
  const g = new THREE.PlaneGeometry(w, h, 1, 6);
  const pos=g.attributes.position, cols=[];
  const layers=[0xe8d49a,0xc9a86a,0xa87a4a,0x6e4a2e,0x4a3422];
  for(let i=0;i<pos.count;i++){
    const y=pos.getY(i); const t=(y+h/2)/h;
    const li=Math.min(layers.length-1, Math.floor((1-t)*layers.length));
    const c=new THREE.Color(layers[li]); c.offsetHSL(0,0,(Math.random()-0.5)*0.05);
    cols.push(c.r,c.g,c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols,3));
  const m=new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors:true, roughness:1}));
  m.receiveShadow=true; m.castShadow=true;
  if(isFront){ m.position.set(0, (SEABED_Y+0.2)/2, 9.2); }
  else { m.position.set(9.2, (SEABED_Y+0.2)/2, 0); m.rotation.y = -Math.PI/2; }
  return m;
}
islandGroup.add(strataFace(18.4, -SEABED_Y+0.2, true));
islandGroup.add(strataFace(18.4, -SEABED_Y+0.2, false));

// Rocks (deformed icosahedrons)
const rockGeo = new THREE.IcosahedronGeometry(1, 1);
{ // roughen
  const p=rockGeo.attributes.position;
  for(let i=0;i<p.count;i++){ p.setXYZ(i, p.getX(i)*(0.8+Math.random()*0.4), p.getY(i)*(0.7+Math.random()*0.3), p.getZ(i)*(0.8+Math.random()*0.4)); }
  rockGeo.computeVertexNormals();
}
const rockMat = new THREE.MeshStandardMaterial({ color:0x8f8a82, roughness:0.9, flatShading:true });
for(let i=0;i<10;i++){
  const r=new THREE.Mesh(rockGeo, rockMat);
  const a=Math.random()*Math.PI*2, rad=4+Math.random()*4.5;
  const x=Math.cos(a)*rad, z=Math.sin(a)*rad;
  r.position.set(x, terrainHeight(x,z)+0.1, z);
  const s=0.4+Math.random()*0.9; r.scale.set(s, s*(0.6+Math.random()*0.4), s);
  r.rotation.set(Math.random(),Math.random()*Math.PI,Math.random());
  r.castShadow=true; r.receiveShadow=true;
  islandGroup.add(r);
}

// Instanced grass blades (sway via shader)
const bladeGeo = new THREE.PlaneGeometry(0.12, 0.5, 1, 3);
bladeGeo.translate(0, 0.25, 0);
const grassCount = QUAL===1 ? 1400 : 600;
const grassMat = new THREE.ShaderMaterial({
  side:THREE.DoubleSide,
  uniforms:{ uTime, uWind, uColorA:{value:new THREE.Color(0x6fa86a)}, uColorB:{value:new THREE.Color(0x9fcf6a)} },
  vertexShader:`
    uniform float uTime; uniform float uWind;
    varying float vH; varying vec3 vCol;
    void main(){
      vec4 wp = instanceMatrix * vec4(position,1.0);
      float ph = wp.x*1.7 + wp.z*2.3;
      float sway = sin(uTime*2.2 + ph) * uWind * 0.35 * position.y*position.y;
      wp.x += sway; wp.z += sway*0.5;
      vH = position.y/0.5;
      vec4 mv = modelViewMatrix * wp;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    uniform vec3 uColorA; uniform vec3 uColorB; varying float vH;
    void main(){ vec3 c=mix(uColorA,uColorB,vH); gl_FragColor=vec4(c,1.0);} `
});
const grass = new THREE.InstancedMesh(bladeGeo, grassMat, grassCount);
{
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), s=new THREE.Vector3(), p=new THREE.Vector3();
  let placed=0, tries=0;
  while(placed<grassCount && tries<grassCount*6){
    tries++;
    const a=Math.random()*Math.PI*2, rad=2+Math.random()*6.5;
    const x=Math.cos(a)*rad, z=Math.sin(a)*rad;
    const h=terrainHeight(x,z);
    if(h<0.5) continue;                       // only on grassy inland
    p.set(x,h,z);
    q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.random()*Math.PI*2);
    s.set(1, 0.7+Math.random()*0.9, 1);
    m.compose(p,q,s);
    grass.setMatrixAt(placed++, m);
  }
  grass.count = placed;
}
grass.frustumCulled=false;
islandGroup.add(grass);

// Trees (trunk + clustered foliage), sway via shader on foliage
const trunkGeo = new THREE.CylinderGeometry(0.12,0.18,1.6,8);
const trunkMat = new THREE.MeshStandardMaterial({color:0x6e4a2e, roughness:0.9});
const foliageGeo = new THREE.IcosahedronGeometry(1, 1);
{ const p=foliageGeo.attributes.position; for(let i=0;i<p.count;i++){ p.setXYZ(i,p.getX(i)*1.1,p.getY(i)*0.9,p.getZ(i)*1.1);} foliageGeo.computeVertexNormals(); }
const foliageMat = new THREE.ShaderMaterial({
  uniforms:{ uTime, uWind, uColor:{value:new THREE.Color(0x4f8a4a)} },
  vertexShader:`
    uniform float uTime; uniform float uWind; varying float vS;
    void main(){
      vec4 wp=instanceMatrix*vec4(position,1.0);
      float ph=wp.x*1.1+wp.z*1.3;
      wp.x += sin(uTime*1.6+ph)*uWind*0.18*position.y;
      vS=position.y;
      gl_Position=projectionMatrix*modelViewMatrix*wp;
    }`,
  fragmentShader:`
    uniform vec3 uColor; varying float vS;
    void main(){ vec3 c=uColor*(0.78+0.32*vS); gl_FragColor=vec4(c,1.0);} `
});
const treePos=[[ -3.2,2.1],[2.6,2.4],[1.2,-3.0],[-2.2,-2.6],[4.4,0.6]];
treePos.forEach(([x,z])=>{
  const h=terrainHeight(x,z);
  const trunk=new THREE.Mesh(trunkGeo,trunkMat);
  trunk.position.set(x,h+0.8,z); trunk.castShadow=true; islandGroup.add(trunk);
  const fol=new THREE.InstancedMesh(foliageGeo, foliageMat, 3);
  const m=new THREE.Matrix4();
  for(let i=0;i<3;i++){
    const off=[[0,1.9,0],[0.5,1.5,0.2],[-0.4,1.6,-0.3]][i];
    const sc=0.7+Math.random()*0.35;
    m.compose(new THREE.Vector3(x+off[0], h+off[1], z+off[2]),
              new THREE.Quaternion(), new THREE.Vector3(sc,sc*0.9,sc));
    fol.setMatrixAt(i,m);
  }
  fol.castShadow=true; islandGroup.add(fol);
});

/* ---------- 3. CABIN (A-frame, copper roof, deck, glowing windows) ---------- */
const cabinGroup = new THREE.Group();
const cabX=-1.4, cabZ=0.6, cabH=terrainHeight(cabX,cabZ);
cabinGroup.position.set(cabX, cabH, cabZ);
islandGroup.add(cabinGroup);

const woodMat = new THREE.MeshStandardMaterial({color:0x9c6b3f, roughness:0.85});
const woodDark = new THREE.MeshStandardMaterial({color:0x6e4a2e, roughness:0.9});
const copperMat = new THREE.MeshStandardMaterial({color:0xb87333, roughness:0.45, metalness:0.7});

// A-frame walls: two triangular prisms (front/back gables) + sloped sides
const gableShape = new THREE.Shape();
gableShape.moveTo(-1.6,0); gableShape.lineTo(1.6,0); gableShape.lineTo(0,2.6); gableShape.lineTo(-1.6,0);
const gableGeo = new THREE.ExtrudeGeometry(gableShape,{depth:0.1,bevelEnabled:false});
const gableFront = new THREE.Mesh(gableGeo, woodMat); gableFront.position.set(0,0,1.4); gableFront.castShadow=true;
const gableBack  = new THREE.Mesh(gableGeo, woodMat); gableBack.position.set(0,0,-1.4); gableBack.castShadow=true;
cabinGroup.add(gableFront, gableBack);

// Sloped copper roof panels
const roofGeo = new THREE.BoxGeometry(3.7, 0.12, 2.1);
const roofL = new THREE.Mesh(roofGeo, copperMat);
roofL.position.set(0, 1.45, -0.85); roofL.rotation.x = -0.52; roofL.castShadow=true;
const roofR = new THREE.Mesh(roofGeo, copperMat);
roofR.position.set(0, 1.45, 0.85); roofR.rotation.x = 0.52; roofR.castShadow=true;
cabinGroup.add(roofL, roofR);

/* ---------- 9. AUDIO (procedural music, water, breeze) ---------- */
let audioCtx=null, masterGain, musicGain, envGain;
let musicOn=false, audioStarted=false, noteTimer=null;
function initAudio(){
  if(audioStarted) return; audioStarted=true;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain(); masterGain.gain.value=0.6; masterGain.connect(audioCtx.destination);
  musicGain=audioCtx.createGain(); musicGain.gain.value=0.0; musicGain.connect(masterGain);
  envGain=audioCtx.createGain(); envGain.gain.value=0.0; envGain.connect(masterGain);

  // Ambient pad: detuned triangles through lowpass with slow LFO
  const pad=audioCtx.createGain(); pad.gain.value=0.18; pad.connect(musicGain);
  const lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; lp.connect(pad);
  [110,164.8,220,277.2].forEach((f,i)=>{ const o=audioCtx.createOscillator(); o.type='triangle'; o.frequency.value=f;
    const g=audioCtx.createGain(); g.gain.value=0.25; o.connect(g); g.connect(lp); o.start();
    const lfo=audioCtx.createOscillator(); lfo.frequency.value=0.05+i*0.02; const lg=audioCtx.createGain(); lg.gain.value=0.12;
    lfo.connect(lg); lg.connect(g.gain); lfo.start(); });

  // Melody scheduler (pentatonic, gentle)
  const scale=[220,246.9,293.7,329.6,392,440,493.9];
  let step=0;
  noteTimer=setInterval(()=>{
    if(!musicOn||!audioCtx) return;
    const f=scale[Math.floor(Math.random()*scale.length)]*(Math.random()<0.3?2:1);
    const o=audioCtx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=audioCtx.createGain(); o.connect(g); g.connect(musicGain);
    const t=audioCtx.currentTime;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.18,t+0.15);
    g.gain.linearRampToValueAtTime(0,t+1.6); o.start(t); o.stop(t+1.7);
    step++;
  }, 900);

  // Water: filtered noise loop
  const nb=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
  const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*0.5;
  const waterSrc=audioCtx.createBufferSource(); waterSrc.buffer=nb; waterSrc.loop=true;
  const wbp=audioCtx.createBiquadFilter(); wbp.type='bandpass'; wbp.frequency.value=600; wbp.Q.value=0.8;
  const wg=audioCtx.createGain(); wg.gain.value=0.12;
  waterSrc.connect(wbp); wbp.connect(wg); wg.connect(envGain); waterSrc.start();
  const wlfo=audioCtx.createOscillator(); wlfo.frequency.value=0.2; const wlg=audioCtx.createGain(); wlg.gain.value=0.05;
  wlfo.connect(wlg); wlg.connect(wg.gain); wlfo.start();

  // Breeze: lowpass noise with LFO
  const breezeSrc=audioCtx.createBufferSource(); breezeSrc.buffer=nb; breezeSrc.loop=true;
  const blp=audioCtx.createBiquadFilter(); blp.type='lowpass'; blp.frequency.value=380;
  const bg=audioCtx.createGain(); bg.gain.value=0.08;
  breezeSrc.connect(blp); blp.connect(bg); bg.connect(envGain); breezeSrc.start();
  const blfo=audioCtx.createOscillator(); blfo.frequency.value=0.13; const blg=audioCtx.createGain(); blg.gain.value=0.06;
  blfo.connect(blg); blg.connect(bg.gain); blfo.start();

  envGain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime+2);
}

/* ---------- 10. UI WIRING ---------- */
const $=id=>document.getElementById(id);
const ui=$('ui');
$('toggle').onclick=()=>ui.classList.toggle('open');

document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>setCamera(+b.dataset.cam));

$('bPause').onclick=()=>{ paused=!paused; $('bPause').classList.toggle('on',paused); $('bPause').textContent=paused?'Resume':'Pause'; };
$('bReset').onclick=()=>{
  paused=false; $('bPause').classList.remove('on'); $('bPause').textContent='Pause';
  $('sTide').value=50; $('vTide').textContent='50'; uTide.value=0.5;
  $('sWind').value=40; $('vWind').textContent='40'; uWind.value=0.4;
  $('sTime').value='1'; todMix=1;
  kayakState='moored'; kayak.position.copy(kayakHome);
  rays.forEach(r=>r.userData.leap=false);
  setCamera(0);
};

$('bKayak').onclick=()=>{
  initAudio();
  if(kayakState==='moored'){ kayakState='out'; $('bKayak').textContent='Return Kayak'; $('bKayak').classList.add('on'); }
  else if(kayakState==='out'){ kayakState='returning'; }
};

let leapingRay=null, leapT=0;
$('bRay').onclick=()=>{
  initAudio();
  const r=rays.find(r=>!r.userData.leap); if(!r) return;
  leapingRay=r; r.userData.leap=true; leapT=0;
};

$('sTide').oninput=e=>{ uTide.value=e.target.value/100; $('vTide').textContent=e.target.value; };
$('sWind').oninput=e=>{ uWind.value=e.target.value/100; $('vWind').textContent=e.target.value; };
$('sTime').onchange=e=>{ todMix=+e.target.value; };

$('bMusic').onclick=()=>{ initAudio(); musicOn=!musicOn;
  $('bMusic').textContent=musicOn?'Music On':'Music Off'; $('bMusic').classList.toggle('on',musicOn);
  if(musicGain) musicGain.gain.setTargetAtTime(musicOn?0.9:0, audioCtx.currentTime, 0.4); };
$('sVol').oninput=e=>{ $('vVol').textContent=e.target.value; if(masterGain) masterGain.gain.setTargetAtTime(e.target.value/100, audioCtx.currentTime, 0.1); };

// Start audio on any first interaction
['click','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,()=>initAudio(),{once:true}));

/* ---------- helpers ---------- */
function waterLevel(){ return WATER_BASE + (uTide.value-0.5)*1.6; }

/* ---------- 11. ANIMATION LOOP ---------- */
const _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _v=new THREE.Vector3();
let todSmooth=1; // smooth current time-of-day toward todMix target

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  if(!paused) simTime+=dt;
  uTime.value=simTime;

  // ---- Time of day smooth lerp ----
  todSmooth += (todMix - todSmooth)*Math.min(1,dt*2.5);
  const a=TOD[Math.floor(todSmooth)], b=TOD[Math.min(2,Math.ceil(todSmooth))], f=todSmooth-Math.floor(todSmooth);
  lerpColor(skyMat.uniforms.top.value,a.skyTop,b.skyTop,f);
  lerpColor(skyMat.uniforms.bot.value,a.skyBot,b.skyBot,f);
  lerpColor(skyMat.uniforms.horizon.value,a.skyHor,b.skyHor,f);
  lerpColor(sun.color,a.sun,b.sun,f); sun.intensity=THREE.MathUtils.lerp(a.sunI,b.sunI,f);
  lerpColor(hemi.color,a.hemiSky,b.hemiSky,f); lerpColor(hemi.groundColor,a.hemiGnd,b.hemiGnd,f);
  hemi.intensity=THREE.MathUtils.lerp(a.hemiI,b.hemiI,f);
  ambient.intensity=THREE.MathUtils.lerp(a.amb,b.amb,f);
  lerpColor(scene.fog.color,a.fog,b.fog,f);
  renderer.toneMappingExposure=THREE.MathUtils.lerp(a.exp,b.exp,f);
  const lampI=THREE.MathUtils.lerp(a.lamp,b.lamp,f);
  sun.position.set(THREE.MathUtils.lerp(a.sunPos[0],b.sunPos[0],f),
                   THREE.MathUtils.lerp(a.sunPos[1],b.sunPos[1],f),
                   THREE.MathUtils.lerp(a.sunPos[2],b.sunPos[2],f));
  // lamps & cabin windows glow in evening/night
  windowMat.emissiveIntensity=lampI*1.4; cabinLight.intensity=lampI*8;
  lanternLights.forEach(({pl,glow})=>{ pl.intensity=lampI*7; glow.material.emissiveIntensity=lampI*1.4; });

  // ---- Water level (tide) ----
  const wl=waterLevel();
  waterSurface.position.y=wl;
  waterVolMat.opacity=0.16+uTide.value*0.12;

  // ---- Kayak trip ----
  if(kayakState==='out'){ kayakT+=dt*0.12; kayak.position.set(Math.cos(kayakT)*7, wl+0.05, Math.sin(kayakT)*7+1); kayak.rotation.y=-kayakT+Math.PI/2; }
  else if(kayakState==='returning'){ kayak.position.lerp(kayakHome,dt*1.5); kayak.position.y=THREE.MathUtils.lerp(kayak.position.y,wl+0.05,dt*2);
    if(kayak.position.distanceTo(kayakHome)<0.2){ kayakState='moored'; $('bKayak').textContent='Launch Kayak'; $('bKayak').classList.remove('on'); } }
  else { kayak.position.y=THREE.MathUtils.lerp(kayak.position.y,wl+0.05,dt*3); }

  // ---- Rays cruise (and leap) ----
  rays.forEach(r=>{
    const u=r.userData;
    if(u.leap){
      leapT+=dt; const T=2.6; const k=Math.min(1,leapT/T);
      const start=r.position.clone();
      const peak=wl+3.5;
      // rise, arc, rotate, splash
      const y=THREE.MathUtils.lerp(start.y, peak, Math.sin(k*Math.PI));
      r.position.y=y;
      r.rotation.z=Math.sin(k*Math.PI*2)*1.2;
      r.position.x+=dt*1.5;
      if(k>=1){ u.leap=false; leapT=0; r.rotation.z=0; r.position.y=THREE.MathUtils.lerp(peak,-2.5,0.3);
        spawnRipple(r.position.x,r.position.z); spawnDroplets(r.position.x,wl,r.position.z); }
    } else {
      u.phase+=dt*u.speed;
      r.position.x=Math.cos(u.phase)*u.r;
      r.position.z=Math.sin(u.phase)*u.r;
      r.position.y=u.y+Math.sin(u.phase*1.3)*0.4;
      r.rotation.y=-u.phase+Math.PI/2;
      r.rotation.z=Math.sin(u.phase*2)*0.12;
    }
    // keep rays inside lagoon
    const d=Math.hypot(r.position.x,r.position.z);
    if(d>AQUARIUM_HALF-1){ const s=(AQUARIUM_HALF-1)/d; r.position.x*=s; r.position.z*=s; }
  });

  // ---- Fish schools ----
  schools.forEach(s=>{
    s.center.x=Math.cos(simTime*0.15)*3; s.center.z=Math.sin(simTime*0.12)*3;
    s.data.forEach((d,i)=>{
      const a=simTime*s.speed+i*0.4;
      const x=s.center.x+Math.cos(a)*s.r+d.off.x;
      const z=s.center.z+Math.sin(a)*s.r+d.off.z;
      const y=s.center.y+Math.sin(a*2+d.ph)*0.4;
      _v.set(x,y,z); _q.setFromAxisAngle(new THREE.Vector3(0,1,0),-a+Math.PI/2);
      _m.compose(_v,_q,new THREE.Vector3(1,1,1)); s.im.setMatrixAt(i,_m);
    });
    s.im.instanceMatrix.needsUpdate=true;
  });

  // ---- Bubbles rise & recycle ----
  bubData.forEach((b,i)=>{
    b.y+=b.speed*dt; if(b.y>waterLevel()-0.3){ b.y=SEABED_Y+0.2; b.x=(Math.random()-0.5)*16; b.z=(Math.random()-0.5)*16; }
    _m.compose(_v.set(b.x,b.y,b.z),_q.identity(),new THREE.Vector3(1,1,1)); bubbles.setMatrixAt(i,_m);
  });
  bubbles.instanceMatrix.needsUpdate=true;

  // ---- Ripples expand & fade ----
  ripples.forEach(r=>{ if(!r.active) return; r.t+=dt;
    const s=1+r.t*5; r.mesh.scale.set(s,1,s); r.mesh.material.opacity=Math.max(0,0.6-r.t*0.6);
    r.mesh.position.y=waterLevel(); if(r.t>1){ r.active=false; r.mesh.visible=false; } });

  // ---- Droplets fall ----
  dropData.forEach((d,i)=>{
    if(!d.active){ _m.compose(_v.set(0,-100,0),_q.identity(),new THREE.Vector3(0.001,0.001,0.001)); drops.setMatrixAt(i,_m); return; }
    d.v.y-=9.8*dt; d.p.addScaledVector(d.v,dt);
    if(d.p.y<waterLevel()-0.2){ d.active=false; }
    _m.compose(_v.copy(d.p),_q.identity(),new THREE.Vector3(1,1,1)); drops.setMatrixAt(i,_m);
  });
  drops.instanceMatrix.needsUpdate=true;

  // ---- Camera transition ----
  if(!freeOrbit){
    camLerp=Math.min(1,camLerp+dt*1.4);
    const e=1-Math.pow(1-camLerp,3); // easeOutCubic
    camera.position.lerp(camPos,e*0.12);
    controls.target.lerp(camTarget,e*0.12);
  }
  controls.update();

  renderer.render(scene,camera);
}

/* ---------- resize & loader ---------- */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,QUAL===1?2:1.4));
});

// Hide loader once first frame rendered
requestAnimationFrame(()=>{ animate(); setTimeout(()=>$('loader').classList.add('hidden'),300); });
</script>
