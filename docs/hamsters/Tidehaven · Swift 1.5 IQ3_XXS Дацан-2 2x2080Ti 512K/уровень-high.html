<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidehaven — a coastal diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   UI SHELL — warm ink & copper, translucent panels
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#07110f;color:#f2e9dc;
  font-family:'Outfit',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* underwater colour wash, driven by camera depth */
#tint{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:2;
  background:radial-gradient(120% 90% at 50% 0%,rgba(120,220,210,.10),rgba(6,64,74,.62) 70%);
  transition:opacity .25s linear}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(120% 100% at 50% 45%,transparent 52%,rgba(4,10,12,.42) 100%)}

#ui{position:fixed;inset:0;z-index:6;pointer-events:none}
#ui>*{pointer-events:auto}

/* ---- brand ---- */
.brand{position:fixed;left:clamp(14px,2.4vw,30px);top:clamp(12px,2.2vw,26px);pointer-events:none;
  text-shadow:0 3px 26px rgba(0,0,0,.6)}
.brand h1{margin:0;font-family:'Fraunces',Georgia,serif;font-weight:700;
  font-size:clamp(32px,4.8vw,60px);line-height:.92;letter-spacing:-.025em;
  background:linear-gradient(175deg,#fff6e6 12%,#eec084 55%,#cf8442 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:.55em 0 0;font-size:10.5px;font-weight:500;letter-spacing:.24em;
  text-transform:uppercase;color:#8ec7b8}

/* ---- panels ---- */
#sheet{display:contents}
.grp{position:fixed;display:flex;flex-direction:column;gap:9px;width:240px}
#tr{top:clamp(12px,2.2vw,26px);right:clamp(14px,2.4vw,30px)}
#bl{bottom:clamp(14px,2.4vw,30px);left:clamp(14px,2.4vw,30px)}
#br{bottom:clamp(14px,2.4vw,30px);right:clamp(14px,2.4vw,30px)}
.panel{border-radius:15px;padding:11px 12px 13px;display:flex;flex-direction:column;gap:9px;
  background:linear-gradient(180deg,rgba(17,39,40,.80),rgba(9,23,25,.72));
  border:1px solid rgba(233,216,182,.14);
  box-shadow:0 20px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15)}
.phead{all:unset;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#7fb9ac;
  -webkit-tap-highlight-color:transparent}
.phead .chev{font-size:9px;transition:transform .25s ease;color:#5f958b}
.panel.collapsed .pbody{display:none}
.panel.collapsed .chev{transform:rotate(-90deg)}
.pbody{display:flex;flex-direction:column;gap:8px}

/* ---- controls ---- */
.btn{font:inherit;font-size:12.5px;font-weight:500;color:#e9dfcf;text-align:center;
  background:rgba(255,255,255,.055);border:1px solid rgba(233,216,182,.13);border-radius:10px;
  padding:8px 9px;cursor:pointer;transition:background .18s,transform .18s,color .18s,box-shadow .18s;
  -webkit-tap-highlight-color:transparent}
.btn:hover{background:rgba(255,255,255,.11);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn.act{background:linear-gradient(180deg,#e3a45f,#c0763a);border-color:rgba(255,222,178,.5);
  color:#231207;font-weight:600;box-shadow:0 7px 20px rgba(206,128,58,.30)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wide{width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#8ec7b8}
label output{color:#f2e6d1;font-size:11px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;
  background:linear-gradient(90deg,#2f5c58,#7fd7c4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  margin-top:-5.5px;background:#f4e6cc;border:2px solid #c0763a;box-shadow:0 2px 8px rgba(0,0,0,.45)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#2f5c58,#7fd7c4)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#f4e6cc;border:2px solid #c0763a}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;color:rgba(210,230,222,.45);white-space:nowrap;pointer-events:none}

/* ---- veil ---- */
#veil{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:#07110f;transition:opacity .9s ease}
#veil b{font-family:'Fraunces',serif;font-weight:700;font-size:34px;letter-spacing:.02em;color:#eec084}
#veil i{font-style:normal;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:#5f958b}

@media (max-width:900px){
  .brand h1{font-size:34px}.brand p{font-size:9px;letter-spacing:.18em}
  #sheet{position:fixed;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:7px;
    max-height:58vh;overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
  .grp{position:static;width:100%}
  #bl,#br,#tr{top:auto;bottom:auto;left:auto;right:auto}
  .hint{display:none}
  .panel{padding:9px 10px 11px}
  .seg{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="tint"></div>
<div id="vignette"></div>

<div id="ui">
  <header class="brand"><h1>Tidehaven</h1><p>A coastal diorama · island, lagoon &amp; rays</p></header>

  <div id="sheet">
    <div class="grp" id="tr">
      <section class="panel" data-panel>
        <button class="phead" data-collapse>View <span class="chev">▾</span></button>
        <div class="pbody">
          <div class="seg">
            <button class="btn act" data-view="iso">Isometric</button>
            <button class="btn" data-view="cabin">Cabin</button>
            <button class="btn" data-view="under">Underwater</button>
            <button class="btn" data-view="free">Free orbit</button>
          </div>
        </div>
      </section>
      <section class="panel" data-panel>
        <button class="phead" data-collapse>Time of day <span class="chev">▾</span></button>
        <div class="pbody">
          <div class="seg">
            <button class="btn act" data-time="day">Day</button>
            <button class="btn" data-time="sunset">Sunset</button>
            <button class="btn" data-time="night">Night</button>
          </div>
        </div>
      </section>
    </div>

    <div class="grp" id="bl">
      <section class="panel" data-panel>
        <button class="phead" data-collapse>Environment <span class="chev">▾</span></button>
        <div class="pbody">
          <label>Tide <output id="oTide">0.00</output></label>
          <input type="range" id="tide" min="-70" max="90" value="0">
          <label>Wind <output id="oWind">45%</output></label>
          <input type="range" id="wind" min="0" max="100" value="45">
        </div>
      </section>
      <section class="panel" data-panel>
        <button class="phead" data-collapse>Sound <span class="chev">▾</span></button>
        <div class="pbody">
          <button class="btn wide" id="btnMusic">Music on</button>
          <label>Volume <output id="oVol">55%</output></label>
          <input type="range" id="vol" min="0" max="100" value="55">
        </div>
      </section>
    </div>

    <div class="grp" id="br">
      <section class="panel" data-panel>
        <button class="phead" data-collapse>Actions <span class="chev">▾</span></button>
        <div class="pbody">
          <button class="btn wide" id="btnKayak">Launch kayak</button>
          <button class="btn wide" id="btnRay">Ray leap</button>
          <div class="row">
            <button class="btn" id="btnPause">Pause</button>
            <button class="btn" id="btnReset">Reset</button>
          </div>
        </div>
      </section>
      <section class="panel" data-panel>
        <button class="phead" data-collapse>Quality <span class="chev">▾</span></button>
        <div class="pbody">
          <div class="seg">
            <button class="btn" data-q="high">High</button>
            <button class="btn act" data-q="med">Balanced</button>
            <button class="btn" data-q="low">Lite</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div class="hint">Drag to orbit · scroll to zoom · click a ray to send it leaping</div>
</div>

<div id="veil"><b>Tidehaven</b><i>building the lagoon…</i></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================================
   0 · CONSTANTS, UTILITIES, NOISE
   ============================================================================ */
const DI = { W:26, D:22, X0:-13, X1:13, Z0:-11, Z1:11 };      // diorama footprint
const VOL  = { x0:-12.9, x1:12.9, z0:-10.9, z1:10.9, bottom:-5.6 }; // water volume bounds
const FLOOR_Y = -5.7;                                          // top of the plinth
const IX = -1.5, IZ = 1.5, IR = 7.2;                          // island centre / radius

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
let _s=1337; const rnd=()=>{const x=Math.sin(_s++*127.1)*43758.5453;return x-Math.floor(x);};
function hash2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u),lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u),v);}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5;}return s;}

/* Master terrain height — island dome over an undulating seabed */
function terrainH(x,z){
  const d=Math.hypot(x-IX,z-IZ);
  const shelf=1/(1+Math.exp((d-6.2)*1.1));            // shoreline shelf 0..1
  const dome=Math.pow(Math.max(0,1-d/IR),2.2);
  let h=-5.0+shelf*4.6+dome*5.0;
  h+=(fbm(x*.22+11,z*.22+7,4)-.5)*1.7*(.22+shelf);
  h+=(fbm(x*.11+3,z*.11+5,3)-.5)*.9;
  return Math.max(h,-5.5);
}

/* Wave field — mirrored exactly in GLSL so the cross-section caps match */
const WAVES=[[0.973,0.231,0.100,0.75,1.10],[0.621,-0.783,0.070,1.25,1.70],
             [-0.316,0.949,0.045,2.10,2.30],[0.707,0.707,0.028,3.30,3.10]];
function waveH(x,z,t,amp){let h=0;for(const w of WAVES)h+=w[2]*Math.sin((x*w[0]+z*w[1])*w[3]+t*w[4]);return h*amp;}
const ampFor=w=>0.30+w*1.15;

const CAUSTIC_GLSL=`
float caustic(vec2 p,float t){
  vec2 i=p; float c=1.0; float inten=0.0075;
  for(int n=0;n<3;n++){
    float tt=t*(1.0-(3.0/abs(float(n)+1.0)));
    i+=vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x))*inten;
  }
  return 0.5+0.5*cos(i.x+i.y*1.3);
}`;

/* ============================================================================
   1 · RENDERER, SCENE, CAMERA, CONTROLS
   ============================================================================ */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.localClippingEnabled=true;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xcfe1e4,0.010);

const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.12,400);
camera.position.set(19.5,13,-19);

const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.target.set(0,0.4,0);
controls.maxPolarAngle=1.45; controls.minDistance=14; controls.maxDistance=60;

/* shared uniforms, referenced by every custom shader */
const U={
  time:{value:0}, wind:{value:0.45}, level:{value:0}, height:{value:5.6},
  sunDir:{value:new THREE.Vector3(12,16,-8).normalize()},
  sunColor:{value:new THREE.Color(0xfff3e0)}, sunI:{value:2.4},
  skyTop:{value:new THREE.Color(0x5fa8d3)}, skyBot:{value:new THREE.Color(0xd9e8ea)},
  shallow:{value:new THREE.Color(0x4fc4bd)}, deep:{value:new THREE.Color(0x0b5f74)},
  foam:{value:new THREE.Color(0xf6f2e8)}, cam:{value:new THREE.Vector3()}
};

/* Clipping planes: the diorama is cut open at the front (z) and right (x) */
const clipZ=new THREE.Plane(new THREE.Vector3(0,0,1),11.0);
const clipX=new THREE.Plane(new THREE.Vector3(-1,0,0),13.0);
const CLIPS=[clipZ,clipX];

/* ============================================================================
   2 · LIGHTING
   ============================================================================ */
const hemi=new THREE.HemisphereLight(0x9fc9e0,0x7c6a4a,0.85); scene.add(hemi);
const amb=new THREE.AmbientLight(0xaec8d6,0.28); scene.add(amb);

const sun=new THREE.DirectionalLight(0xfff3e0,2.4);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-19; sun.shadow.camera.right=19;
sun.shadow.camera.top=19;  sun.shadow.camera.bottom=-19;
sun.shadow.camera.near=1;  sun.shadow.camera.far=70;
sun.shadow.bias=-0.0007; sun.shadow.normalBias=0.035;
scene.add(sun,sun.target);

const cabinLight=new THREE.PointLight(0xffb45e,0,14,2);
const pierLight =new THREE.PointLight(0xffc46a,0,12,2);
const fireLight =new THREE.PointLight(0xff8a3c,0,8,2);
scene.add(cabinLight,pierLight,fireLight);

/* ============================================================================
   3 · SKY DOME
   ============================================================================ */
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{uTop:U.skyTop,uBot:U.skyBot,uSunDir:U.sunDir,uSunColor:U.sunColor,uStar:{value:0}},
  vertexShader:`varying vec3 vW;void main(){vW=(modelMatrix*vec4(position,1.0)).xyz;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`uniform vec3 uTop,uBot,uSunDir,uSunColor;uniform float uStar;varying vec3 vW;
    float h3(vec3 p){p=fract(p*0.3183099+vec3(0.11,0.27,0.53));p*=17.0;
      return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
    void main(){
      vec3 dir=normalize(vW);
      float t=clamp(dir.y*0.5+0.5,0.0,1.0);
      vec3 col=mix(uBot,uTop,pow(t,0.85));
      float sd=max(dot(dir,normalize(uSunDir)),0.0);
      col+=uSunColor*pow(sd,26.0)*0.85;
      col+=uSunColor*pow(sd,3.0)*0.10;
      float st=h3(floor(dir*190.0));
      float star=smoothstep(0.9955,1.0,st)*smoothstep(0.02,0.4,dir.y)*uStar;
      col+=vec3(0.85,0.92,1.0)*star*1.4;
      gl_FragColor=vec4(col,1.0);}`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(200,32,16),skyMat));

/* ============================================================================
   4 · MATERIAL FACTORY (cached, reused everywhere)
   ============================================================================ */
const cache=new Map();
function mat(color,o={}){
  const key=color+'|'+JSON.stringify(o);
  if(cache.has(key))return cache.get(key);
  const m=new THREE.MeshStandardMaterial(Object.assign({color,roughness:.85,metalness:0},o));
  cache.set(key,m); return m;
}

/* canvas textures, all procedural */
function strataTexture(){
  const c=document.createElement('canvas'); c.width=256; c.height=512;
  const g=c.getContext('2d');
  const bands=[[0,.26,'#2f2a25','#463f36'],[.26,.46,'#5b4a34','#6f5a3e'],[.46,.60,'#8b7047','#a58a5c'],
               [.60,.72,'#c2a377','#dcc396'],[.72,.86,'#ecd9ae','#f4e8c8'],[.86,.95,'#c9b486','#a8925f'],
               [.95,1,'#6f8a4e','#547039']];
  for(const[a,b,c1,c2]of bands){
    const gr=g.createLinearGradient(0,512*(1-b),0,512*(1-a));
    gr.addColorStop(0,c2); gr.addColorStop(1,c1);
    g.fillStyle=gr; g.fillRect(0,512*(1-b),256,512*(b-a)+1);
  }
  g.globalAlpha=.20;                                   // speckle
  for(let i=0;i<5200;i++){g.fillStyle=rnd()<.5?'#000':'#fff';
    g.fillRect(rnd()*256,rnd()*512,1.4,1.4);}
  g.globalAlpha=.55;                                   // pebbles in the clay
  for(let i=0;i<130;i++){const y=512*(.28+rnd()*.22);
    g.fillStyle=rnd()<.5?'#8d8578':'#5f574c';
    g.beginPath();g.ellipse(rnd()*256,y,2+rnd()*4,1.5+rnd()*2,0,0,7);g.fill();}
  g.globalAlpha=.35; g.strokeStyle='#2b2418'; g.lineWidth=1;  // hairline strata
  for(let i=0;i<26;i++){const y=512*(.05+rnd()*.9);
    g.beginPath();g.moveTo(0,y);
    for(let x=0;x<=256;x+=32)g.lineTo(x,y+Math.sin(x*.06+i)*3);
    g.stroke();}
  g.globalAlpha=.5; g.strokeStyle='#3c4a25';            // roots from the turf
  for(let i=0;i<70;i++){const x=rnd()*256;g.beginPath();g.moveTo(x,512*.96);
    g.lineTo(x+(rnd()-.5)*10,512*(.86+rnd()*.09));g.stroke();}
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function rayTexture(){
  const c=document.createElement('canvas'); c.width=256; c.height=256;
  const g=c.getContext('2d'); g.fillStyle='#7c7466'; g.fillRect(0,0,256,256);
  for(let i=0;i<520;i++){g.fillStyle=`rgba(${180+rnd()*50},${175+rnd()*45},${160+rnd()*40},${.12+rnd()*.3})`;
    g.beginPath();g.ellipse(rnd()*256,rnd()*256,2+rnd()*7,2+rnd()*5,rnd()*3,0,7);g.fill();}
  for(let i=0;i<220;i++){g.fillStyle='rgba(40,36,32,.28)';
    g.beginPath();g.arc(rnd()*256,rnd()*256,1+rnd()*3,0,7);g.fill();}
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
function plaqueTexture(){
  const c=document.createElement('canvas'); c.width=512; c.height=110;
  const g=c.getContext('2d'); g.fillStyle='#2b211a'; g.fillRect(0,0,512,110);
  g.strokeStyle='rgba(233,216,182,.45)'; g.lineWidth=3; g.strokeRect(9,9,494,92);
  g.fillStyle='#e9d8b6'; g.textAlign='center'; g.textBaseline='middle';
  g.font='700 46px Georgia, serif'; g.fillText('TIDEHAVEN',256,56);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function softSprite(white){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d'); const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,white?'rgba(255,255,255,1)':'rgba(255,255,255,.9)');
  gr.addColorStop(.45,'rgba(255,255,255,.35)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}

/* ============================================================================
   5 · TERRAIN + GEOLOGICAL CROSS-SECTION
   ============================================================================ */
function gridGeo(w,d,nx,nz){
  const pos=[],idx=[],uv=[];
  for(let j=0;j<=nz;j++)for(let i=0;i<=nx;i++){
    pos.push(-w/2+w*i/nx,0,-d/2+d*j/nz); uv.push(i/nx,j/nz);}
  for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){
    const a=j*(nx+1)+i,b=a+1,c=a+nx+1,e=c+1; idx.push(a,c,b,b,c,e);}
  const g=new THREE.BufferGeometry();

      vec2 d2=normalize(vec2(0.62,-0.78));float a2=0.070,f2=1.25,s2=1.70;

  fragmentShader:`

function updateCap(c){

    dummy.position.set(b.x+wob,b.y,b.z+Math.cos(sim.t*1.7+b.ph)*0.13);
    dummy.scale.setScalar(b.s*(0.6+0.4*(b.y-floor)));

/* 8a · ray body: parametric lens with wings, tail and eyes */
function rayGeometry(){
  const NU=20,NV=18, pos=[],uv=[],idx=[];
  const hw=v=>1.22*Math.pow(Math.max(0,Math.sin(Math.PI*clamp(v*0.92,0,1))),0.72)+0.02;
  const arch=v=>0.62+0.38*Math.sin(Math.PI*v);
  const top=(u,v)=>{const w=hw(v);return (0.34*Math.pow(1-u*u,1.1)*arch(v))-0.15*u*u*w;};
  const bot=(u,v)=>{const w=hw(v);return -0.20*Math.pow(1-u*u,0.9)*arch(v)-0.07*u*u*w;};
  const T=(i,j)=>j*(NU+1)+i, B=(i,j)=>(NV+1)*(NU+1)+j*(NU+1)+i;
  for(let j=0;j<=NV;j++){const v=j/NV,z=(v-0.55)*2.6,w=hw(v);
    for(let i=0;i<=NU;i++){const u=-1+2*i/NU;
      pos.push(u*w,top(u,v),z); uv.push(i/NU,v);}}
  for(let j=0;j<=NV;j++){const v=j/NV,z=(v-0.55)*2.6,w=hw(v);
    for(let i=0;i<=NU;i++){const u=-1+2*i/NU;
      pos.push(u*w,bot(u,v),z); uv.push(i/NU,v);}}
  for(let j=0;j<NV;j++)for(let i=0;i<NU;i++){
    idx.push(T(i,j),T(i,j+1),T(i+1,j+1), T(i,j),T(i+1,j+1),T(i+1,j));
    idx.push(B(i,j),B(i+1,j+1),B(i,j+1), B(i,j),B(i+1,j),B(i+1,j+1));
  }
  for(let j=0;j<NV;j++)for(const i of[0,NU]){
    const s=(i===NU)?1:-1;
    idx.push(T(i,j),B(i,j),s>0?B(i,j+1):B(i,j+1));
    idx.push(T(i,j),B(i,j+1),T(i,j+1));
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
const rayGeo=rayGeometry(), rayTex=rayTexture();
const rayMeshes=[];
const rays=[];
function makeRay(i){
  const m=mat(0xffffff,{map:rayTex,roughness:.62,metalness:0,side:THREE.DoubleSide}).clone();
  const u={uTime:U.time,uAmp:{value:1},uPh:{value:i*1.7}};
  m.onBeforeCompile=s=>{
    s.uniforms.uTime=u.uTime; s.uniforms.uAmp=u.uAmp; s.uniforms.uPh=u.uPh;
    s.vertexShader='uniform float uTime;uniform float uAmp;uniform float uPh;\n'+s.vertexShader;
    s.vertexShader=s.vertexShader.replace('#include <begin_vertex>',`
      vec3 transformed=vec3(position);
      float edge=smoothstep(1.25,0.15,abs(position.x));
      float flap=sin(uTime*2.1+position.z*1.55+uPh)*0.17*edge
                +sin(uTime*4.6+position.x*2.6+uPh)*0.055*smoothstep(0.35,1.1,abs(position.x));
      transformed.y+=flap*uAmp;`);
  };
  const body=new THREE.Mesh(rayGeo,m);
  body.scale.setScalar(1.15); body.castShadow=false;
  const g=new THREE.Group(); g.add(body);
  // tail
  const tail=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.42,1.15),mat(0x6e6555,{roughness:.7}));
  tail.position.set(0,-0.02,-2.05); tail.rotation.x=0.12; g.add(tail);
  // eyes
  const eye=mat(0x17140f,{roughness:.35});
  for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(0.07,7,6),eye);
    e.position.set(0.24*s,0.17,1.02); g.add(e);}
  g.userData={body,u};
  scene.add(g); rayMeshes.push(body);
  rays.push({g,body,u,
    cx:2.6,cz:-3.2,ax:5.6,az:4.6,ay:0.85,sx:0.055,sz:0.041,ph:i*1.9,
    baseY:-2.35-i*0.35,heading:0,leap:null});
}
for(let i=0;i<4;i++) makeRay(i);

function rayPassive(r,t){
  const x=r.cx+Math.sin(t*r.sx+r.ph)*r.ax;
  const z=r.cz+Math.sin(t*r.sz+r.ph*1.7)*r.az;
  const y=r.baseY+Math.sin(t*r.sx*1.7+r.ph)*r.ay;
  const dx=Math.cos(t*r.sx+r.ph)*r.ax*r.sx, dz=Math.cos(t*r.sz+r.ph*1.7)*r.az*r.sz;
  return {x,y,z,heading:Math.atan2(dz,dx)};
}
function updateRays(dt){
  const L=U.level.value;
  rays.forEach((r,i)=>{
    if(r.leap){
      const lp=r.leap; lp.t+=dt; const k=Math.min(lp.t/lp.dur,1);
      const e=k;
      const x=lerp(lp.p0.x,lp.p1.x,e), z=lerp(lp.p0.z,lp.p1.z,e);
      const lin=lerp(lp.p0.y,lp.p1.y,e);
      const y=lin+4*(lp.apex-lin)*e*(1-e);
      r.g.position.set(x,y,z);
      r.g.rotation.y=lp.a;
      r.g.rotation.x=lerp(0.62,-0.55,Math.pow(e,0.85));
      r.g.rotation.z=Math.sin(e*Math.PI)*lp.roll;
      r.u.uAmp.value=1+Math.sin(e*Math.PI)*1.5;
      if(lp.prev>L && y<=L && !lp.splashed){ lp.splashed=true; splash(x,L,z); }
      lp.prev=y;
      if(k>=1){ r.leap=null; r.u.uAmp.value=1; r.g.rotation.set(0,0,0); }
      return;
    }
    const p=rayPassive(r,sim.t);
    const floor=Math.max(terrainH(p.x,p.z),VOL.bottom+.4);
    r.g.position.set(clamp(p.x,VOL.x0+1.2,VOL.x1-1.2),
                     Math.max(p.y,floor+1.0,L-2.6),
                     clamp(p.z,VOL.z0+1.2,VOL.z1-1.2));
    r.g.rotation.y=p.heading;
    r.g.rotation.z=Math.sin(sim.t*0.6+i)*0.12;
    r.g.rotation.x=Math.sin(sim.t*0.4+i*2)*0.05;
    r.heading=p.heading;
  });
}
function rayLeap(){
  const r=rays.find(r=>!r.leap); if(!r)return;
  const p=r.g.position.clone(), a=r.heading||r.g.rotation.y;
  const dx=Math.sin(-a+Math.PI/2), dz=Math.cos(-a+Math.PI/2);
  const dir=new THREE.Vector3(Math.cos(a),0,Math.sin(a)).normalize();
  let p1=p.clone().addScaledVector(dir,6.5);
  p1.x=clamp(p1.x,VOL.x0+2,VOL.x1-2); p1.z=clamp(p1.z,VOL.z0+2,VOL.z1-2);
  r.leap={t:0,dur:3.0,p0:p.clone(),p1,a,roll:(rnd()-.5)*1.4,
          apex:Math.max(p.y,U.level.value+3.4),prev:p.y,splashed:false};
  r.body.material=u_cacheRay(r); // ensure amplitude uniform
  Sound.splash(0.85);
}
function u_cacheRay(r){return r.body.material;}

/* 8c · kelp & seagrass — instanced, current-swayed in the vertex shader */
function swayMaterial(color,opts,amp){
  const m=mat(color,Object.assign({side:THREE.DoubleSide,roughness:.8},opts)).clone();
  m.onBeforeCompile=s=>{
    s.uniforms.uTime=U.time; s.uniforms.uWind=U.wind; s.uniforms.uAmp={value:amp};
    s.vertexShader='uniform float uTime;uniform float uWind;uniform float uAmp;attribute float aPhase;\n'+s.vertexShader;
    s.vertexShader=s.vertexShader.replace('#include <begin_vertex>',`
      vec3 transformed=vec3(position);
      float stiff=pow(clamp(transformed.y,0.0,1.4)/1.4,1.5);
      float s1=sin(uTime*1.7+aPhase*6.283+transformed.y*0.8);
      float s2=cos(uTime*1.1+aPhase*3.1);
      float w=0.25+uWind*1.1;
      transformed.x+=s1*uAmp*w*stiff;
      transformed.z+=s2*uAmp*0.65*w*stiff;`);
  };
  return m;
}

function splash(x,y,z){
  const r=ripples.find(r=>r.t>=1)||ripples[0];
  r.t=0; r.max=4.2+rnd()*2.6; r.mesh.visible=true;
  r.mesh.position.set(x,y+0.03,z); r.mesh.scale.setScalar(0.6);
  let n=0;
  for(let i=0;i<DN&&n<26;i++){
    if(dropLife[i]>0)continue;
    dropLife[i]=0.9+rnd()*0.7;
    dropPos[i*3]=x+(rnd()-.5)*0.5; dropPos[i*3+1]=y+0.15; dropPos[i*3+2]=z+(rnd()-.5)*0.5;
    dropVel[i*3]=(rnd()-.5)*2.6; dropVel[i*3+1]=2.6+rnd()*3.4; dropVel[i*3+2]=(rnd()-.5)*2.6;
    n++;
  }
  Sound.splash(0.9);
}
function updateEffects(dt){
  const L=U.level.value;
  for(const r of ripples){
    if(r.t>=1)continue;
    r.t+=dt*0.62;
    const k=clamp(r.t,0,1);
    r.u.value=k;
    r.mesh.scale.setScalar(lerp(0.6,r.max,k));
    r.mesh.position.y=L+0.03+waveH(r.mesh.position.x,r.mesh.position.z,sim.t,ampFor(state.wind));
    if(k>=1)r.mesh.visible=false;
  }
  for(let i=0;i<DN;i++){
    if(dropLife[i]<=0)continue;
    dropLife[i]-=dt;
    dropVel[i*3+1]-=9.4*dt;
    dropPos[i*3]+=dropVel[i*3]*dt; dropPos[i*3+1]+=dropVel[i*3+1]*dt; dropPos[i*3+2]+=dropVel[i*3+2]*dt;
    if(dropPos[i*3+1]<L||dropLife[i]<=0){dropLife[i]=0;dropPos[i*3+1]=-99;}
  }
  dropGeo.attributes.position.needsUpdate=true;
  // chimney smoke
  const sp=smokeGeo.attributes.position;
  for(let i=0;i<SN;i++){
    const s=smokeData[i]; s.t+=dt*s.sp;
    if(s.t>1)s.t=0;
    const k=s.t;
    sp.setXYZ(i, chimneyWorld.x+Math.sin(s.dr+k*4)*0.35*k+state.wind*1.4*k*k,
                chimneyWorld.y+k*3.2,
                chimneyWorld.z+Math.cos(s.dr+k*3)*0.32*k);
  }
  sp.needsUpdate=true;
  smoke.material.opacity=0.24;
}

  const P=PAL[timeTarget], k=1-Math.exp(-dt*2.1);

  hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGround); hemi.intensity=cur.hemiI;
  amb.color.copy(cur.ambColor); amb.intensity=cur.amb;
  skyMat.uniforms.uTop.value.copy(cur.skyTop); skyMat.uniforms.uBot.value.copy(cur.skyBot);
  skyMat.uniforms.uStar.value=cur.star;
  scene.fog.color.copy(cur.fog); scene.fog.density=cur.fogD;
  renderer.toneMappingExposure=cur.exp;
  U.shallow.value.copy(cur.shallow); U.deep.value.copy(cur.deep); U.foam.value.copy(cur.foamC);
  // lamps, windows, fire
  const flick=1+Math.sin(sim.t*7.3)*0.06+Math.sin(sim.t*11.7)*0.04;
  cabinLight.intensity=cur.lamp*7.5*flick;
  pierLight.intensity =cur.lamp*5.5*flick;
  fireLight.intensity =0.35+cur.lamp*3.2*flick;
  glowMat.emissiveIntensity=0.35+cur.lamp*2.4*flick;
  flameMat.opacity=0.55+0.35*flick*(0.5+cur.lamp*0.5);
  fire.userData.flame.scale.set(1,0.85+Math.sin(sim.t*9)*0.16+Math.sin(sim.t*13.3)*0.08,1);
  fire.userData.flame.rotation.y=sim.t*2;
  // glass waterline band follows the tide
  b1.position.y=U.level.value+0.35; b2.position.y=U.level.value+0.35;
}

/* ============================================================================
   12 · AUDIO — procedural music, surf, breeze
   ============================================================================ */
const Sound={
  ctx:null,master:null,music:null,ready:false,musicOn:false,vol:0.55,
  init(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    const ctx=new AC(); this.ctx=ctx;
    this.master=ctx.createGain(); this.master.gain.value=0; this.master.connect(ctx.destination);
    const conv=ctx.createConvolver(); conv.buffer=this.impulse(ctx,2.8,2.4);
    const wet=ctx.createGain(); wet.gain.value=.34; conv.connect(wet); wet.connect(this.master); this.conv=conv;
    this.music=ctx.createGain(); this.music.gain.value=0; this.music.connect(this.master); this.music.connect(conv);
    const pf=ctx.createBiquadFilter(); pf.type='lowpass'; pf.frequency.value=760; pf.Q.value=.6;
    const pg=ctx.createGain(); pg.gain.value=.15; pf.connect(pg); pg.connect(this.music);
    this.pad=[];
    for(let i=0;i<3;i++){const o=ctx.createOscillator(); o.type=i===0?'sawtooth':'triangle';
      o.detune.value=(i-1)*8; const g=ctx.createGain(); g.gain.value=i===0?.5:.32;
      o.connect(g); g.connect(pf); o.start(); this.pad.push(o);}
    const lfo=ctx.createOscillator(); lfo.frequency.value=.055;
    const lg=ctx.createGain(); lg.gain.value=250; lfo.connect(lg); lg.connect(pf.frequency); lfo.start();
    const mk=(freq,type,Q,gain,lp)=>{
      const s=ctx.createBufferSource(); s.buffer=this.noise(ctx,4); s.loop=true;
      const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=Q;
      const g=ctx.createGain(); g.gain.value=gain;
      s.connect(f); f.connect(g); g.connect(this.master); if(lp)g.connect(conv); s.start();
      return g;};
    this.surf=mk(620,'lowpass',.7,.09,false);
    this.breeze=mk(520,'bandpass',.7,.04,true);
    const addLfo=(target,freq,amt)=>{const o=ctx.createOscillator();o.frequency.value=freq;
      const g=ctx.createGain();g.gain.value=amt;o.connect(g);g.connect(target.gain);o.start();};
    addLfo(this.surf,.11,.045); addLfo(this.breeze,.07,.03);
    this.step=0; this.next=ctx.currentTime+.15;
    setInterval(()=>this.tick(),90);
    this.ready=true; this.setVolume(this.vol); this.setMusic(this.musicOn); this.setWind(state.wind);
  },
  noise(ctx,sec){const b=ctx.createBuffer(1,ctx.sampleRate*sec,ctx.sampleRate),d=b.getChannelData(0);
    let last=0; for(let i=0;i<d.length;i++){const w=Math.random()*2-1;
      last=(last+.02*w)/1.02; d[i]=(last*3.4+w*.32)*.5;} return b;},
  impulse(ctx,sec,dec){const b=ctx.createBuffer(2,ctx.sampleRate*sec,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);
      for(let i=0;i<d.length;i++){const t=i/d.length;d[i]=(Math.random()*2-1)*Math.pow(1-t,dec)*(1-t*.2);}}
    return b;},
  tick(){if(!this.ctx)return;const t=this.ctx.currentTime;
    while(this.next<t+0.4){this.schedule(this.next,this.step);this.step++;this.next+=.6;}},
  schedule(t,step){
    const chords=[[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66],[164.81,196,246.94]];
    const ch=chords[Math.floor(step/8)%4];
    this.pad[0].frequency.setTargetAtTime(ch[0],t,.5);
    this.pad[1].frequency.setTargetAtTime(ch[1],t,.5);
    this.pad[2].frequency.setTargetAtTime(ch[2]*2,t,.5);
    if(step%4===0)this.pluck(ch[0]/2,t,.16,'sine');
    const pent=[0,2,3,5,7].map(s=>Math.pow(2,s/12));
    if(Math.random()<.55)this.pluck(ch[0]*pent[Math.floor(rnd()*5)]*(rnd()<.3?2:1),t+rnd()*.2,.10,'triangle');
  },
  pluck(f,t,a,type){
    const o=this.ctx.createOscillator(); o.type=type; o.frequency.value=f;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(a,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+1.5);
    o.connect(g);
    if(this.ctx.createStereoPanner){const p=this.ctx.createStereoPanner();p.pan.value=rnd()*1.4-.7;
      g.connect(p);p.connect(this.music);}else g.connect(this.music);
    o.start(t); o.stop(t+1.7);},
  splash(v){if(!this.ctx)return;const t=this.ctx.currentTime;
    const s=this.ctx.createBufferSource(); s.buffer=this.noise(this.ctx,.6);
    const f=this.ctx.createBiquadFilter(); f.type='bandpass';
    f.frequency.setValueAtTime(1400,t); f.frequency.exponentialRampToValueAtTime(240,t+.55); f.Q.value=.8;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(.5*v,t); g.gain.exponentialRampToValueAtTime(.0001,t+.7);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t+.8);
    const o=this.ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(46,t+.35);
    const og=this.ctx.createGain(); og.gain.setValueAtTime(.32*v,t); og.gain.exponentialRampToValueAtTime(.0001,t+.5);
    o.connect(og); og.connect(this.master); o.start(t); o.stop(t+.6);},
  setVolume(v){this.vol=v; if(this.master)this.master.gain.setTargetAtTime(v*.9,this.ctx.currentTime,.2);},
  setMusic(on){this.musicOn=on; if(this.music)this.music.gain.setTargetAtTime(on?.85:0,this.ctx.currentTime,.6);},
  setWind(w){if(!this.surf)return;
    this.surf.gain.setTargetAtTime(.035+w*.13,this.ctx.currentTime,.6);
    this.breeze.gain.setTargetAtTime(.018+w*.07,this.ctx.currentTime,.6);}
};

/* ============================================================================
   13 · STATE, UI WIRING, CAMERA PRESETS
   ============================================================================ */
const state={paused:false,tide:0,wind:0.45,quality:'med',view:'iso'};
state.dt=0;
const sim={t:0};

const VIEWS={
  iso  :{p:[19.5,13,-19],  t:[0,0.4,0],   min:14,max:60,maxP:1.45},
  cabin:{p:[8.4,3.4,-8.6],  t:[1.3,1.6,-1.6],min:5, max:26,maxP:1.52},
  under:{p:[8.6,-2.5,-7.4], t:[0.6,-2.1,0.8],min:3, max:22,maxP:2.25},
  free :{p:[23,17,-21],     t:[0,0,0],     min:6, max:85,maxP:Math.PI-0.05}
};
const tween={active:false,t:0,dur:1.5,fromP:new THREE.Vector3(),toP:new THREE.Vector3(),
             fromT:new THREE.Vector3(),toT:new THREE.Vector3(),view:'iso'};
function goView(v){
  const V=VIEWS[v]; state.view=v;
  tween.fromP.copy(camera.position); tween.toP.set(...V.p);
  tween.fromT.copy(controls.target); tween.toT.set(...V.t);
  tween.t=0; tween.active=true; tween.view=v;
  controls.enabled=false;
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('act',b.dataset.view===v));
}
function updateTween(dt){
  if(!tween.active)return;
  tween.t=Math.min(1,tween.t+dt/tween.dur);
  const e=tween.t<.5?4*tween.t**3:1-Math.pow(-2*tween.t+2,3)/2;
  camera.position.lerpVectors(tween.fromP,tween.toP,e);
  controls.target.lerpVectors(tween.fromT,tween.toT,e);
  if(tween.t>=1){
    tween.active=false; controls.enabled=true;
    const V=VIEWS[tween.view];
    controls.minDistance=V.min; controls.maxDistance=V.max; controls.maxPolarAngle=V.maxP;
  }
}

/* --- buttons --- */
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{audioWake();goView(b.dataset.view);}));
document.querySelectorAll('[data-time]').forEach(b=>b.addEventListener('click',()=>{
  audioWake(); timeTarget=b.dataset.time;
  document.querySelectorAll('[data-time]').forEach(x=>x.classList.toggle('act',x.dataset.time===timeTarget));
}));
document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{
  state.quality=b.dataset.q;
  document.querySelectorAll('[data-q]').forEach(x=>x.classList.toggle('act',x.dataset.q===state.quality));
  applyQuality();
}));

const tideEl=document.getElementById('tide'), windEl=document.getElementById('vol')&&document.getElementById('wind');
const oTide=document.getElementById('oTide'), oWind=document.getElementById('oWind');
tideEl.addEventListener('input',()=>{state.tide=+tideEl.value/100; oTide.textContent=state.tide.toFixed(2);});
windEl.addEventListener('input',()=>{state.wind=+windEl.value/100; oWind.textContent=windEl.value+'%';
  U.wind.value=state.wind; Sound.setWind(state.wind);});

const btnPause=document.getElementById('btnPause'), btnReset=document.getElementById('btnReset');
btnPause.addEventListener('click',()=>{audioWake();
  state.paused=!state.paused; btnPause.textContent=state.paused?'Resume':'Pause';
  btnPause.classList.toggle('act',state.paused);});
btnReset.addEventListener('click',()=>{audioWake();
  state.tide=0; tideEl.value=0; oTide.textContent='0.00';
  state.wind=0.45; windEl.value=45; oWind.textContent='45%'; U.wind.value=0.45; Sound.setWind(0.45);
  timeTarget='day'; document.querySelectorAll('[data-time]').forEach(x=>x.classList.toggle('act',x.dataset.time==='day'));
  kayakState.mode='return';
  rays.forEach((r,i)=>{r.leap=null;r.g.rotation.set(0,0,0);r.u.uAmp.value=1;});
  state.paused=false; btnPause.textContent='Pause'; btnPause.classList.remove('act');
  goView('iso');
});
const btnKayak=document.getElementById('btnKayak');
btnKayak.addEventListener('click',()=>{audioWake();
  if(kayakState.mode==='moored'){kayakState.mode='out';btnKayak.textContent='Return kayak';}
  else if(kayakState.mode==='out'){kayakState.mode='return';}
  Sound.splash(0.35);
});
document.getElementById('btnRay').addEventListener('click',()=>{audioWake();rayLeap();});

const btnMusic=document.getElementById('btnMusic'), volEl=document.getElementById('vol'), oVol=document.getElementById('oVol');
btnMusic.addEventListener('click',()=>{
  audioWake(); const on=!Sound.musicOn; Sound.setMusic(on);
  btnMusic.textContent=on?'Music off':'Music on'; btnMusic.classList.toggle('act',on);});
volEl.addEventListener('input',()=>{oVol.textContent=volEl.value+'%'; Sound.setVolume(+volEl.value/100);});

function audioWake(){ if(!Sound.ctx){ Sound.init(); Sound.setVolume(+volEl.value/100);}
  if(Sound.ctx&&Sound.ctx.state==='suspended')Sound.ctx.resume(); }
['pointerdown','keydown'].forEach(e=>window.addEventListener(e,()=>audioWake(),{once:true}));

/* --- panels: collapse on mobile --- */
document.querySelectorAll('[data-collapse]').forEach(h=>{
  h.addEventListener('click',()=>h.parentElement.classList.toggle('collapsed'));
});
if(matchMedia('(max-width:900px)').matches){
  document.querySelectorAll('[data-panel]').forEach((p,i)=>{if(i>0)p.classList.add('collapsed');});
}

/* --- quality presets --- */
function applyQuality(){
  const q=state.quality;
  renderer.setPixelRatio(q==='high'?Math.min(devicePixelRatio,2):q==='med'?Math.min(devicePixelRatio,1.5):1);
  renderer.shadowMap.enabled=q!=='low';
  if(q!=='low'){ sun.shadow.mapSize.set(q==='high'?2048:1024,q==='high'?2048:1024);
    sun.shadow.map&&sun.shadow.map.dispose(); sun.shadow.map=null; }
  renderer.setSize(innerWidth,innerHeight);
  foamMat.uniforms.uT.value=q==='low'?0:1;
}

/* --- raycast: click a ray to make it leap --- */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
let downAt=0,downX=0,downY=0;
canvas.addEventListener('pointerdown',e=>{downAt=performance.now();downX=e.clientX;downY=e.clientY;});
canvas.addEventListener('pointerup',e=>{
  if(performance.now()-downAt>420)return;
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>7)return;
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  if(ray.intersectObjects(rayMeshes,false).length){audioWake();rayLeap();}
});

/* ============================================================================
   14 · MAIN LOOP
   ============================================================================ */
const clock=new THREE.Clock();
const tintEl=document.getElementById('tint');

function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05);
  state.dt=dt;
  if(!state.paused) sim.t+=dt;

  // tide → water level, volume, surface, foam
  const level=state.tide;
  U.level.value=lerp(U.level.value,level,1-Math.exp(-dt*6));
  U.height.value=U.level.value-VOL.bottom;
  waterVol.position.y=VOL.bottom;
  waterVol.scale.set(1,U.height.value,1);
  waterSurf.position.y=U.level.value;
  window.__foam.position.y=U.level.value+0.035;
  U.cam.value.copy(camera.position);
  U.time.value=sim.t;
  U.wind.value=lerp(U.wind.value,state.wind,1-Math.exp(-dt*4));

  updateTimeBlend(dt);
  updateCap(capFront); updateCap(capRight);
  trees.forEach((g,i)=>{ if(g.userData.base!==undefined)
    g.rotation.z=g.userData.base+Math.sin(sim.t*1.1+i*1.7)*0.035*(0.25+state.wind*1.4); });

  if(!state.paused){
    updateRays(dt); updateFish(dt); updateKayak(dt); updateBubbles(); updateEffects(dt);
  }else{
    updateKayak(0);
  }
  updateTween(dt);
  controls.update();

  // underwater wash on the overlay
  const d=U.level.value-camera.position.y;
  tintEl.style.opacity=clamp(smoothstep(0.2,2.2,d)*0.85,0,0.85);

  renderer.render(scene,camera);
}

function onResize(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',onResize);
window.addEventListener('visualViewport',onResize);

applyQuality();
goView('iso'); tween.active=false; controls.enabled=true;
frame();

/* fade the veil once the first frames are on screen */
setTimeout(()=>{
  const v=document.getElementById('veil');
  v.style.opacity='0'; setTimeout(()=>v.remove(),950);
},420);
</script>
