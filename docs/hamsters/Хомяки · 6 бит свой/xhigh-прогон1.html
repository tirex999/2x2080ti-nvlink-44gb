<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light"/>
<title>Low-Poly Hamster Playground</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#33261f; --paper:#fffdf6;
    --coral:#ff7a6b; --mint:#5ecfae; --sun:#ffc94d; --sky:#69b7ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:linear-gradient(180deg,#9fd9ff 0%,#dff4ff 42%,#fff3d6 78%,#ffe9b8 100%);
    user-select:none;-webkit-user-select:none;
  }
  canvas{display:block}

  /* ---------- HUD ---------- */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  .card{
    background:var(--paper);
    border:3px solid var(--ink);
    border-radius:16px;
    box-shadow:0 6px 0 rgba(51,38,31,.85);
  }
  .title-card{position:absolute;top:18px;left:18px;padding:14px 18px;max-width:min(440px,calc(100vw - 36px))}
  .title-card h1{
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:clamp(20px,3.2vw,30px);margin:0;color:var(--ink);letter-spacing:.2px;line-height:1.1;
  }
  .title-card h1 em{font-style:normal;color:var(--coral)}
  .tag{margin:4px 0 10px;font-size:13px;font-weight:600;color:#8a7563}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    background:#fff;border:2px solid var(--ink);border-radius:999px;
    padding:3px 10px;font-size:11.5px;font-weight:700;color:#5a4a3d;white-space:nowrap;
  }

  .icon-btn{
    pointer-events:auto;position:absolute;top:18px;right:18px;
    width:48px;height:48px;border-radius:50%;
    border:3px solid var(--ink);background:var(--paper);
    font-size:20px;cursor:pointer;
    box-shadow:0 5px 0 rgba(51,38,31,.85);
    transition:transform .12s,box-shadow .12s;
  }
  .icon-btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(51,38,31,.85)}
  .icon-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(51,38,31,.85)}

  .roster{position:absolute;left:18px;bottom:18px;width:252px;padding:12px 14px}
  .roster h2{
    font-family:'Fredoka',sans-serif;font-size:13px;margin:0 0 6px;
    text-transform:uppercase;letter-spacing:1.6px;color:#a08a72;
  }
  .rrow{display:flex;align-items:center;gap:8px;padding:5px 0}
  .rrow + .rrow{border-top:2px dotted #e6d9c4}
  .rdot{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);flex:none}
  .rname{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14.5px;color:var(--ink)}
  .rstat{margin-left:auto;font-size:11px;font-style:italic;color:#96826f;text-align:right;line-height:1.15;max-width:118px}
  .seedline{
    margin-top:8px;padding-top:8px;border-top:2px dotted #e6d9c4;
    font-size:12px;font-weight:700;color:#96826f;display:flex;justify-content:space-between;
  }
  .seedline b{color:var(--ink)}

  /* ---------- loader ---------- */
  #loader{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:14px;
    align-items:center;justify-content:center;
    background:linear-gradient(180deg,#9fd9ff,#fff3d6);
    transition:opacity .5s;
  }
  #loader.done{opacity:0;pointer-events:none}
  #loader .big{font-size:56px;animation:bop .8s ease-in-out infinite}
  #loader p{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;color:#5a4a3d;margin:0}
  @keyframes bop{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}

  @media (max-width:640px){
    .title-card{padding:10px 12px}
    .tag{margin-bottom:7px}
    .chip{font-size:10.5px;padding:2px 8px}
    .roster{left:12px;bottom:12px;right:12px;width:auto}
    .rstat{max-width:92px;font-size:10px}
    .icon-btn{top:12px;right:12px;width:42px;height:42px;font-size:17px}
  }
</style>
</head>
<body>

<div id="ui">
  <header class="card title-card">
    <h1>Low-Poly <em>Hamster</em> Playground</h1>
    <p class="tag">Four round citizens. One very serious wheel. Zero chill.</p>
    <div class="chips">
      <span class="chip">🖱️ drag · orbit</span>
      <span class="chip">🌰 click sand · toss a seed</span>
      <span class="chip">🎡 click wheel · boost</span>
      <span class="chip">🐹 click hamster · squeak</span>
    </div>
  </header>

  <button id="soundBtn" class="icon-btn" aria-label="toggle sound" title="toggle sound">🔊</button>

  <section class="card roster">
    <h2>Resident Roster</h2>
    <div id="rosterRows"></div>
    <div class="seedline"><span>🌰 seeds tossed</span><b id="seedCount">0</b></div>
  </section>
</div>

<div id="loader"><div class="big">🐹</div><p>warming up the wheel…</p></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   CONSTANTS
================================================================ */
const SAND_Y       = 0.46;                 // walking surface height
const CAGE_R       = 3.0;                  // cage radius
const WALK_R       = CAGE_R - 0.55;        // hamsters stay inside this radius
const WHEEL_POS    = new THREE.Vector3(-1.35, SAND_Y, -1.05);
const WHEEL_YAW    = 0.6;                  // cosmetic tilt of the wheel
const WHEEL_CENTER_Y = SAND_Y + 0.85;
const WHEEL_R      = 0.75;
const WHEEL_RUN    = new THREE.Vector3(WHEEL_POS.x, 0, WHEEL_POS.z);
const WHEEL_ENTRY  = new THREE.Vector3(WHEEL_POS.x + Math.sin(WHEEL_YAW)*1.2, 0, WHEEL_POS.z + Math.cos(WHEEL_YAW)*1.2);
const WHEEL_EXIT   = new THREE.Vector3(WHEEL_POS.x*0.4, 0, WHEEL_POS.z*0.4);
const BOWL_POS     = new THREE.Vector3(1.95, SAND_Y, 1.15);
const SOLIDS = [                            // circular obstacles hamsters avoid
  { x: BOWL_POS.x,  z: BOWL_POS.z,  r: 0.62 },
  { x: WHEEL_POS.x, z: WHEEL_POS.z, r: 1.05 },
];

/* ================================================================
   RENDERER / SCENE / CAMERA / LIGHTS
================================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfeaff, 16, 42);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(6.2, 4.6, 7.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 3.2;
controls.maxDistance = 16;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = 1.42;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
let idleTimer;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(idleTimer); });
controls.addEventListener('end',   () => { idleTimer = setTimeout(() => controls.autoRotate = true, 9000); });

scene.add(new THREE.HemisphereLight(0xbfe8ff, 0xffd9a0, 1.0));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.6);
sun.position.set(6, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -6;  sun.shadow.camera.right = 6;
sun.shadow.camera.top  =  6;  sun.shadow.camera.bottom = -6;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 25;
sun.shadow.bias = -0.0005;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd8ff, 0.35);
fill.position.set(-5, 3, -4);
scene.add(fill);

/* flat-shaded material shortcut */
const mat = (color, opts = {}) =>
  new THREE.MeshStandardMaterial({ color, flatShading:true, roughness:0.85, metalness:0, ...opts });

/* ================================================================
   STAGE — meadow, table, garden
================================================================ */
function buildStage(){
  const meadow = new THREE.Mesh(new THREE.CircleGeometry(34, 28), mat(0x8fd06e, { roughness:1 }));
  meadow.rotation.x = -Math.PI/2;
  meadow.position.y = -2.6;
  meadow.receiveShadow = true;
  scene.add(meadow);

  const top = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.45, 0.55, 24), mat(0xb98156));
  top.position.y = -0.275;
  top.castShadow = top.receiveShadow = true;
  scene.add(top);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(3.52, 0.07, 6, 28), mat(0x9a6a45));
  rim.rotation.x = Math.PI/2;
  rim.position.y = 0.02;
  scene.add(rim);

  const leg = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.5, 2.6, 10), mat(0x8a5c3d));
  leg.position.y = -1.85;
  scene.add(leg);
}

function buildGarden(){
  const cols = [0xff7a6b, 0xffc94d, 0x69b7ff, 0xff9ec4];
  for (let i = 0; i < 8; i++){
    const a = i/8 * Math.PI*2 + Math.random()*0.5, r = 5.5 + Math.random()*3.5;
    const x = Math.sin(a)*r, z = Math.cos(a)*r;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.55, 5), mat(0x5aa84e));
    stem.position.set(x, -2.6 + 0.27, z);
    scene.add(stem);
    const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.17, 0), mat(cols[i % 4]));
    head.position.set(x, -2.6 + 0.62, z);
    scene.add(head);
  }
  for (let i = 0; i < 12; i++){
    const a = Math.random()*Math.PI*2, r = 4.5 + Math.random()*6;
    const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.45, 4), mat(0x6cbf57));
    tuft.position.set(Math.sin(a)*r, -2.6 + 0.2, Math.cos(a)*r);
    tuft.rotation.y = Math.random()*3;
    scene.add(tuft);
  }
}

/* ================================================================
   CAGE — coral tray, sand, wire drum, lid
================================================================ */
let sandMesh;
function buildCage(){
  const g = new THREE.Group();
  const barMat = mat(0xfff4e2, { roughness:0.55 });

  const tray = new THREE.Mesh(
    new THREE.CylinderGeometry(CAGE_R + 0.28, CAGE_R + 0.1, 0.5, 28),
    mat(0xff7a6b, { roughness:0.5 }));
  tray.position.y = 0.25;
  tray.castShadow = tray.receiveShadow = true;
  g.add(tray);

  sandMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(CAGE_R - 0.02, CAGE_R - 0.02, 0.16, 28),
    mat(0xecc584, { roughness:1 }));
  sandMesh.position.y = SAND_Y - 0.08;
  sandMesh.receiveShadow = true;
  g.add(sandMesh);

  const BAR_R = CAGE_R + 0.16, TOP = 3.1;
  const barGeo = new THREE.CylinderGeometry(0.035, 0.035, TOP - 0.5, 5);
  for (let i = 0; i < 26; i++){
    const a = i/26 * Math.PI*2;
    const b = new THREE.Mesh(barGeo, barMat);
    b.position.set(Math.sin(a)*BAR_R, (TOP + 0.5)/2, Math.cos(a)*BAR_R);
    b.castShadow = true;
    g.add(b);
  }
  const ringGeo = new THREE.TorusGeometry(BAR_R, 0.05, 6, 40);
  for (const y of [0.95, 1.75, 2.55]){
    const r = new THREE.Mesh(ringGeo, barMat);
    r.rotation.x = Math.PI/2;
    r.position.y = y;
    r.castShadow = true;
    g.add(r);
  }
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(CAGE_R + 0.34, CAGE_R + 0.34, 0.1, 28), barMat);
  lid.position.y = TOP + 0.05;
  lid.castShadow = true;
  g.add(lid);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.17, 8, 6), mat(0xffc94d, { roughness:0.4 }));
  knob.position.y = TOP + 0.28;
  g.add(knob);

  scene.add(g);
}

/* ================================================================
   EXERCISE WHEEL — the star of the show
================================================================ */
const wheel = { spin:null, proxy:null, speed:0, occupant:null };

function buildWheel(){
  const g = new THREE.Group();
  const mint  = mat(0x5ecfae, { roughness:0.5 });
  const mintD = mat(0x3fae92, { roughness:0.6 });

  const spin = new THREE.Group();
  const rim = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R, 0.09, 8, 26), mint);
  rim.castShadow = true;
  spin.add(rim);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.18, 8), mintD);
  hub.rotation.z = Math.PI/2;
  spin.add(hub);
  for (let i = 0; i < 6; i++){
    const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, WHEEL_R - 0.12, 5), mintD);
    const a = i/6 * Math.PI*2;
    sp.position.set(0, Math.cos(a)*(WHEEL_R/2), Math.sin(a)*(WHEEL_R/2));
    sp.rotation.x = a;
    spin.add(sp);
  }
  g.add(spin);

  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.35, 8), mat(0xffc94d, { roughness:0.4 }));
  axle.rotation.z = Math.PI/2;
  g.add(axle);
  for (const s of [-1, 1]){
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.95, 0.18), mintD);
    post.position.set(s*0.62, -0.42, 0);
    post.castShadow = true;
    g.add(post);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.07, 0.62), mintD);
    foot.position.set(s*0.62, -0.85, 0);
    foot.receiveShadow = true;
    g.add(foot);
  }

  g.position.set(WHEEL_POS.x, WHEEL_CENTER_Y, WHEEL_POS.z);
  g.rotation.y = WHEEL_YAW;
  scene.add(g);
  wheel.spin = spin;

  // invisible fat cylinder = easy click target
  const proxy = new THREE.Mesh(
    new THREE.CylinderGeometry(1, 1, 1.8, 10),
    new THREE.MeshBasicMaterial({ transparent:true, opacity:0, depthWrite:false }));
  proxy.position.copy(g.position);
  scene.add(proxy);
  wheel.proxy = proxy;
}

function updateWheel(dt){
  const target = wheel.occupant ? 3.4 : 0;
  wheel.speed += (target - wheel.speed) * Math.min(1, dt * (wheel.occupant ? 1.1 : 0.55));
  if (!wheel.occupant && wheel.speed < 0.01) wheel.speed = 0;
  wheel.spin.rotation.x -= wheel.speed * dt;
}

function wheelBoost(){
  wheel.speed = Math.min(7, wheel.speed + 3);
  tone(220, 90, 0.1, 'sine', 0.15);
  const cands = hamsters.filter(h =>
    (h.state === 'wander' || h.state === 'pause') && h.desireCd <= 0 && !wheel.occupant);
  if (cands.length){
    const h = cands[(Math.random()*cands.length) | 0];
    h.desireCd = 5;
    h.target = WHEEL_ENTRY.clone();
    setState(h, 'towheel');
  }
}

/* ================================================================
   PROPS — food bowl, seed scatter, hay
================================================================ */
function buildBowl(){
  const g = new THREE.Group();
  const cup = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.28, 0.2, 10, 1, true),
    mat(0xff7a6b, { roughness:0.5, side:THREE.DoubleSide }));
  cup.position.y = 0.1;
  g.add(cup);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 0.06, 10), mat(0xff7a6b));
  base.position.y = 0.03;
  g.add(base);
  const pile = new THREE.Mesh(new THREE.SphereGeometry(0.28, 7, 5), mat(0xb0783f));
  pile.scale.set(1, 0.55, 1);
  pile.position.y = 0.17;
  g.add(pile);
  g.position.copy(BOWL_POS);
  g.rotation.y = 0.9;
  g.traverse(o => { if (o.isMesh){ o.castShadow = o.receiveShadow = true; } });
  scene.add(g);
}

const SEED_COLORS = [0xa9743c, 0xd98e3f, 0x7fae4f, 0x8a5a33];
function scatterProps(){
  for (let i = 0; i < 16; i++){
    const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.05, 0), mat(SEED_COLORS[i % 4]));
    const a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random()) * (CAGE_R - 0.6);
    m.position.set(Math.sin(a)*r, SAND_Y + 0.04, Math.cos(a)*r);
    m.rotation.set(Math.random()*3, Math.random()*3, 0);
    m.castShadow = true;
    scene.add(m);
  }
  for (let i = 0; i < 10; i++){
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.025, 0.05), mat(0xd8b45a));
    const a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random()) * (CAGE_R - 0.5);
    h.position.set(Math.sin(a)*r, SAND_Y + 0.015, Math.cos(a)*r);
    h.rotation.y = Math.random()*Math.PI;
    scene.add(h);
  }
}

/* ================================================================
   AMBIENT — drifting low-poly clouds
================================================================ */
const clouds = [];
function buildClouds(){
  const cm = mat(0xffffff, { roughness:1 });
  for (let i = 0; i < 4; i++){
    const c = new THREE.Group();
    for (let j = 0; j < 3; j++){
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.45 + Math.random()*0.4, 7, 5), cm);
      s.position.set(j*0.55 - 0.55, Math.random()*0.15, (Math.random() - 0.5)*0.3);
      s.scale.y = 0.65;
      c.add(s);
    }
    c.position.set(-16 + i*9, 4.6 + Math.random()*2, -7 - Math.random()*6);
    c.userData.v = 0.12 + Math.random()*0.15;
    scene.add(c);
    clouds.push(c);
  }
}

/* ================================================================
   HAMSTERS — model + brain
================================================================ */
const DEFS = [
  { name:'Mochi',   body:0xf7e8c8, belly:0xfff9ec, dark:0xd8bd92, start:new THREE.Vector3( 1.7, 0,  0.3) },
  { name:'Biscuit', body:0xf0a35b, belly:0xffe4bb, dark:0xc47a37, start:new THREE.Vector3(-1.8, 0,  1.2) },
  { name:'Peanut',  body:0xbab4ac, belly:0xece6dd, dark:0x8f887f, start:new THREE.Vector3( 0.4, 0, -1.7) },
  { name:'Waffles', body:0x9fc3e8, belly:0xe6f1fb, dark:0x7399bf, start:new THREE.Vector3(-0.6, 0,  0.4) },
];

function createHamster(def){
  const g = new THREE.Group();
  const mBody  = mat(def.body);
  const mBelly = mat(def.belly);
  const mDark  = mat(def.dark);
  const mPink  = mat(0xff9d9d);
  const mEye   = mat(0x2a2320, { roughness:0.35 });

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.3, 7, 5), mBody);
  body.scale.set(1, 0.82, 1.12);
  body.position.y = 0.27;
  body.castShadow = true;
  g.add(body);

  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.24, 6, 4), mBelly);
  belly.scale.set(0.8, 0.6, 0.95);
  belly.position.set(0, 0.18, 0.13);
  g.add(belly);

  const head = new THREE.Group();
  head.position.set(0, 0.3, 0.15);
  g.add(head);

  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.13, 6, 4), mBody);
  muzzle.scale.set(1.15, 0.85, 1);
  muzzle.position.set(0, -0.03, 0.15);
  muzzle.castShadow = true;
  head.add(muzzle);

  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 4), mPink);
  nose.position.set(0, 0.01, 0.28);
  head.add(nose);

  const cheeks = [], ears = [];
  for (const s of [-1, 1]){
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 5), mEye);
    e.position.set(s*0.115, 0.06, 0.16);
    head.add(e);

    const c = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 4), mBelly);
    c.scale.set(0.9, 0.8, 1);
    c.position.set(s*0.2, -0.1, 0.08);
    head.add(c);
    cheeks.push(c);

    const er = new THREE.Mesh(new THREE.SphereGeometry(0.085, 5, 4), mBody);
    er.position.set(s*0.155, 0.16, -0.02);
    er.castShadow = true;
    head.add(er);
    ears.push(er);

    const ei = new THREE.Mesh(new THREE.SphereGeometry(0.048, 5, 4), mPink);
    ei.position.set(s*0.155, 0.16, 0.028);
    head.add(ei);
  }

  const feet = [];
  for (const [x, z] of [[-0.14, 0.16], [0.14, 0.16], [-0.14, -0.14], [0.14, -0.14]]){
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 4), mDark);
    f.scale.set(1, 0.7, 1.4);
    f.position.set(x, 0.05, z);
    g.add(f);
    feet.push(f);
  }

  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.14, 5), mDark);
  tail.rotation.x = -Math.PI/2 + 0.35;
  tail.position.set(0, 0.2, -0.36);
  g.add(tail);

  g.position.set(def.start.x, SAND_Y, def.start.z);
  scene.add(g);

  const h = {
    name: def.name,
    colorHex: '#' + def.body.toString(16).padStart(6, '0'),
    group: g, body, belly, head, muzzle, nose, cheeks, ears, feet, tail,
    pos: def.start.clone(),
    heading: Math.random()*Math.PI*2,
    speed: 0,
    baseSpeed: 0.5 + Math.random()*0.18,
    state: 'wander', t: 0, target: null,
    wheelLove: 0.4 + Math.random()*0.9,
    wheelDur: 0, pauseDur: 0,
    desireCd: 1 + Math.random()*2,
    puff: 0, bounce: 0, shout: 0,
    earTimer: 1 + Math.random()*3, earTwitch: 0,
    phase: Math.random()*10,
    pitch: Math.random(),
    statusEl: null,
  };
  g.traverse(o => o.userData.hamster = h);
  return h;
}

/* ---------------- behavior helpers ---------------- */
function lerpAngle(a, b, t){
  const d = ((b - a + Math.PI*3) % (Math.PI*2)) - Math.PI;
  return a + d * t;
}
function setState(h, s){ h.state = s; h.t = 0; }

function clampOut(v){ // keep a point inside the cage & out of furniture
  for (const s of SOLIDS){
    const dx = v.x - s.x, dz = v.z - s.z, d = Math.hypot(dx, dz) || 0.001;
    if (d < s.r + 0.25){ v.x = s.x + dx/d*(s.r + 0.25); v.z = s.z + dz/d*(s.r + 0.25); }
  }
  const r = Math.hypot(v.x, v.z) || 0.001;
  if (r > WALK_R){ v.x *= WALK_R/r; v.z *= WALK_R/r; }
  return v;
}
function pickTarget(h){
  const a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random()) * WALK_R;
  h.target = clampOut(new THREE.Vector3(Math.sin(a)*r, 0, Math.cos(a)*r));
}
function maybeDesire(h, dt){
  if (h.desireCd > 0) return;
  if (!wheel.occupant && Math.random() < dt * 0.07 * (0.4 + h.wheelLove)){
    h.desireCd = 5;
    h.target = WHEEL_ENTRY.clone();
    setState(h, 'towheel');
  } else if (activePellets.some(p => p.alive) && Math.random() < dt * 0.1){
    h.desireCd = 5;
    const pool = activePellets.filter(p => p.alive);
    const p = pool[(Math.random()*pool.length) | 0];
    h.foodTarget = p;
    h.target = p.pos.clone();
    setState(h, 'tofood');
  }
}

/* ---------------- per-frame hamster update ---------------- */
function updateHamster(h, dt, time){
  h.t += dt;
  h.desireCd = Math.max(0, h.desireCd - dt);

  switch (h.state){
    case 'wander':
      maybeDesire(h, dt);
      if (h.state === 'wander' && (!h.target || h.pos.distanceTo(h.target) < 0.2 || h.t > 7)){
        if (Math.random() < 0.5){ h.pauseDur = 1 + Math.random()*1.6; setState(h, 'pause'); }
        else { pickTarget(h); setState(h, 'wander'); }
      }
      break;
    case 'pause':
      maybeDesire(h, dt);
      if (h.state === 'pause' && h.t > h.pauseDur){ pickTarget(h); setState(h, 'wander'); }
      break;
    case 'towheel':
      if (h.pos.distanceTo(h.target) < 0.28){
        if (wheel.occupant && wheel.occupant !== h){ pickTarget(h); setState(h, 'wander'); }
        else {
          wheel.occupant = h;
          h.wheelDur = 4 + Math.random()*5;
          h.pos.copy(WHEEL_RUN);
          setState(h, 'wheel');
        }
      }
      break;
    case 'wheel':
      if (h.t > h.wheelDur){
        wheel.occupant = null;
        h.pos.copy(WHEEL_EXIT);
        pickTarget(h);
        setState(h, 'wander');
      }
      break;
    case 'tofood': {
      const p = h.foodTarget;
      if (!p || !p.alive){ pickTarget(h); setState(h, 'wander'); }
      else if (h.pos.distanceTo(p.pos) < 0.35){ p.alive = false; h.eatPellet = p; setState(h, 'eat'); }
      break;
    }
    case 'eat':
      if (h.t > 3.2){
        if (h.eatPellet) removePellet(h.eatPellet);
        h.eatPellet = null;
        pickTarget(h);
        setState(h, 'wander');
      }
      break;
  }

  /* speed + movement */
  let want = 0;
  if (h.state === 'wander') want = h.baseSpeed;
  else if (h.state === 'towheel' || h.state === 'tofood') want = 1.15;
  else if (h.state === 'wheel') want = 1.4;
  h.speed += (want - h.speed) * Math.min(1, dt*4);

  if (h.state !== 'wheel' && h.target){
    const dx = h.target.x - h.pos.x, dz = h.target.z - h.pos.z, d = Math.hypot(dx, dz);
    if (d > 0.06) h.heading = lerpAngle(h.heading, Math.atan2(dx, dz), Math.min(1, dt*4));
    h.pos.x += Math.sin(h.heading) * h.speed * dt;
    h.pos.z += Math.cos(h.heading) * h.speed * dt;
  }
  if (h.state === 'wheel') h.heading = WHEEL_YAW;

  /* stay inside the cage, dodge furniture */
  const rr = Math.hypot(h.pos.x, h.pos.z) || 0.001;
  if (rr > WALK_R){ h.pos.x *= WALK_R/rr; h.pos.z *= WALK_R/rr; }
  if (h.state !== 'wheel') for (const s of SOLIDS){
    const dx = h.pos.x - s.x, dz = h.pos.z - s.z, d = Math.hypot(dx, dz) || 0.001;
    if (d < s.r){ h.pos.x = s.x + dx/d*s.r; h.pos.z = s.z + dz/d*s.r; }
  }

  /* ---------------- visuals ---------------- */
  const moving = h.speed > 0.08;
  const freq = 6 + h.speed*8;
  h.bob = moving
    ? Math.abs(Math.sin(time*freq + h.phase)) * (0.03 + 0.05*h.speed)
    : Math.sin(time*2 + h.phase) * 0.012;
  h.bounce = Math.max(0, h.bounce - dt*1.8);
  const yOff = Math.sin(h.bounce * Math.PI) * 0.28;
  const baseY = h.state === 'wheel' ? SAND_Y + 0.19 : SAND_Y;

  h.group.position.set(h.pos.x, baseY + h.bob + yOff, h.pos.z);
  h.group.rotation.y = h.heading;
  h.group.rotation.z = moving ? Math.sin(time*freq + h.phase) * 0.06 : 0;
  h.body.scale.set(1 + h.bob*0.5, 0.82 - h.bob*0.7, 1.12 + h.bob*0.4);

  h.feet.forEach((f, i) => {
    const ph = time*(8 + h.speed*9) + h.phase + ((i === 0 || i === 3) ? 0 : Math.PI);
    f.position.y = 0.05 + (moving ? Math.abs(Math.sin(ph)) * 0.05 : 0);
  });

  let hx = 0, hz = 0;
  if (h.state === 'pause'){ hx = Math.sin(time*2.3 + h.phase)*0.22; hz = Math.sin(time*1.4 + h.phase)*0.18; }
  else if (h.state === 'eat'){ hx = 0.55 + Math.sin(time*9)*0.1; }
  else if (h.state === 'wheel'){ hx = 0.12; }
  h.head.rotation.x += (hx - h.head.rotation.x) * Math.min(1, dt*6);
  h.head.rotation.z += (hz - h.head.rotation.z) * Math.min(1, dt*6);

  const puffT = h.state === 'eat' ? 1 : 0;
  h.puff += (puffT - h.puff) * Math.min(1, dt*3);
  const cs = 1 + h.puff*1.15;
  h.cheeks.forEach(c => c.scale.set(0.9*cs, 0.8*cs, cs));

  h.tail.rotation.y = Math.sin(time*5 + h.phase) * 0.5;
  h.earTimer -= dt;
  if (h.earTimer <= 0){ h.earTwitch = 1; h.earTimer = 2 + Math.random()*4; }
  h.earTwitch = Math.max(0, h.earTwitch - dt*2.5);
  h.ears[0].scale.setScalar(1 + Math.sin(h.earTwitch*Math.PI)*0.4);
  h.ears[1].scale.setScalar(1);
}

function separate(){ // gentle personal space
  for (let i = 0; i < hamsters.length; i++)
    for (let j = i+1; j < hamsters.length; j++){
      const a = hamsters[i], b = hamsters[j];
      if (a.state === 'wheel' || b.state === 'wheel') continue;
      const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz);
      if (d < 0.5 && d > 1e-4){
        const push = (0.5 - d)/2, nx = dx/d, nz = dz/d;
        a.pos.x -= nx*push; a.pos.z -= nz*push;
        b.pos.x += nx*push; b.pos.z += nz*push;
      }
    }
}

/* ================================================================
   TOSSABLE SEEDS
================================================================ */
const activePellets = [];
let seedsTossed = 0;
const seedCountEl = document.getElementById('seedCount');

function tossPellet(point){
  const p = clampOut(point.clone());
  if (activePellets.length >= 4) removePellet(activePellets[0]);
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.07, 0), mat(SEED_COLORS[(Math.random()*4) | 0]));
  m.position.set(p.x, SAND_Y + 0.06, p.z);
  m.castShadow = true;
  scene.add(m);
  const pel = { mesh:m, pos:m.position, alive:true, scale:0 };
  activePellets.push(pel);
  seedsTossed++;
  seedCountEl.textContent = seedsTossed;
  tone(500, 900, 0.07, 'square', 0.05);

  const cands = hamsters.filter(h => (h.state === 'wander' || h.state === 'pause') && h.desireCd <= 0);
  if (cands.length){
    const h = cands[(Math.random()*cands.length) | 0];
    h.desireCd = 4;
    h.foodTarget = pel;
    h.target = pel.pos.clone();
    setState(h, 'tofood');
  }
}
function removePellet(p){
  p.alive = false;
  const i = activePellets.indexOf(p);
  if (i >= 0) activePellets.splice(i, 1);
  scene.remove(p.mesh);
}

/* ================================================================
   BUILD EVERYTHING
================================================================ */
buildStage();
buildCage();
buildWheel();
buildBowl();
scatterProps();
buildGarden();
buildClouds();

const hamsters = DEFS.map(createHamster);
const hamsterGroups = hamsters.map(h => h.group);

/* roster UI */
const rosterEl = document.getElementById('rosterRows');
hamsters.forEach(h => {
  const row = document.createElement('div');
  row.className = 'rrow';
  row.innerHTML =
    `<span class="rdot" style="background:${h.colorHex}"></span>` +
    `<span class="rname">${h.name}</span><span class="rstat"></span>`;
  h.statusEl = row.querySelector('.rstat');
  rosterEl.appendChild(row);
});

/* two snacks on the floor so the food behavior shows right away */
tossPellet(new THREE.Vector3( 1.2, 0,  0.9));
tossPellet(new THREE.Vector3(-0.9, 0,  1.8));

/* ================================================================
   TINY SOUND ENGINE (WebAudio, user-gesture only)
================================================================ */
let actx = null, muted = false;
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => { muted = !muted; soundBtn.textContent = muted ? '🔇' : '🔊'; });

function ensureAudio(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f0, f1, dur, type = 'triangle', vol = 0.12){
  if (!actx || muted) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t);
  o.stop(t + dur + 0.03);
}
const squeak = h => tone(650 + h.pitch*350, 1500 + h.pitch*450, 0.13, 'triangle', 0.1);

/* ================================================================
   POINTER INTERACTION (click vs drag aware)
================================================================ */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let px = 0, py = 0;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { px = e.clientX; py = e.clientY; ensureAudio(); });
cv.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - px, e.clientY - py) > 8) return;   // it was a drag
  ndc.set((e.clientX/innerWidth)*2 - 1, -(e.clientY/innerHeight)*2 + 1);
  ray.setFromCamera(ndc, camera);

  const hh = ray.intersectObjects(hamsterGroups, true)[0];
  if (hh && hh.object.userData.hamster){
    const h = hh.object.userData.hamster;
    h.bounce = 1; h.shout = 1.2;
    squeak(h);
    return;
  }
  if (ray.intersectObject(wheel.proxy)[0]){ wheelBoost(); return; }
  const sh = ray.intersectObject(sandMesh)[0];
  if (sh && Math.hypot(sh.point.x, sh.point.z) < CAGE_R - 0.2)
    tossPellet(new THREE.Vector3(sh.point.x, 0, sh.point.z));
});

/* ================================================================
   LIVE STATUS TICKER
================================================================ */
const STATUS_TEXT = {
  wander:  'wandering',
  pause:   'sniffing around',
  towheel: 'sprinting to the wheel!',
  wheel:   'RUNNING THE WHEEL',
  tofood:  'chasing snacks',
  eat:     'munching… cheeks full',
};
setInterval(() => {
  for (const h of hamsters){
    h.shout = Math.max(0, h.shout - 0.4);
    h.statusEl.textContent = h.shout > 0 ? 'squeak!!' : STATUS_TEXT[h.state];
  }
}, 400);

/* ================================================================
   RESIZE + MAIN LOOP
================================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let started = false;

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  updateWheel(dt);
  hamsters.forEach(h => updateHamster(h, dt, time));
  separate();

  for (const p of activePellets){
    const target = p.alive ? 1 : 0;
    p.scale += (target - p.scale) * Math.min(1, dt * (p.alive ? 8 : 0.9));
    p.mesh.scale.setScalar(Math.max(0.001, p.scale));
  }
  for (const c of clouds){
    c.position.x += c.userData.v * dt;
    if (c.position.x > 18) c.position.x = -18;
  }

  controls.update();
  renderer.render(scene, camera);

  if (!started){
    started = true;
    setTimeout(() => document.getElementById('loader').classList.add('done'), 300);
  }
}
tick();
</script>
