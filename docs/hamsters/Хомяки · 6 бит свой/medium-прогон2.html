<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #bfe3f0; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    color: #4a3728; text-align: center; pointer-events: none;
    background: rgba(255, 250, 235, 0.85); padding: 8px 20px; border-radius: 14px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  }
  #ui h1 { margin: 0; font-size: 20px; }
  #ui p  { margin: 2px 0 0; font-size: 12px; opacity: 0.8; }
</style>
</head>
<body>
<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; Watch them zoom in the wheel!</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   SCENE / CAMERA / RENDERER
============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3f0);
scene.fog = new THREE.Fog(0xbfe3f0, 14, 30);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.5, 3.4, 5.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 3;
controls.maxDistance = 14;

/* ============================================================
   LIGHTS
============================================================ */
scene.add(new THREE.AmbientLight(0xfff4e0, 0.65));

const sun = new THREE.DirectionalLight(0xfff0d0, 1.4);
sun.position.set(5, 8, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6;   sun.shadow.camera.bottom = -6;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xcfe8ff, 0.35);
fill.position.set(-4, 3, -4);
scene.add(fill);

/* ============================================================
   HELPERS
============================================================ */
const mat = (color, opts = {}) =>
  new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.9, ...opts });

function box(w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.castShadow = m.receiveShadow = true;
  return m;
}
function cyl(rTop, rBot, h, color, seg = 8) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg), mat(color));
  m.castShadow = m.receiveShadow = true;
  return m;
}
function sph(r, color, w = 7, h = 5) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, w, h), mat(color));
  m.castShadow = true;
  return m;
}

/* ============================================================
   GROUND (outside the cage)
============================================================ */
const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 24), mat(0x8fd07a));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// A little table under the cage
const tableTop = box(6.4, 0.3, 4.6, 0xa06a3f);
tableTop.position.y = -0.15;
scene.add(tableTop);
[[-2.8,-1.9],[2.8,-1.9],[-2.8,1.9],[2.8,1.9]].forEach(([x,z]) => {
  const leg = cyl(0.14, 0.18, 1.0, 0x8a5a34);
  leg.position.set(x, -0.8, z);
  scene.add(leg);
});

/* ============================================================
   CAGE TRAY
============================================================ */
const TRAY_W = 5.4, TRAY_D = 3.6, TRAY_H = 0.55;
const trayOuter = box(TRAY_W, TRAY_H, TRAY_D, 0xe86a5e);
trayOuter.position.y = TRAY_H / 2;
scene.add(trayOuter);

const sand = box(TRAY_W - 0.3, 0.12, TRAY_D - 0.3, 0xf2d8a0);
sand.position.y = TRAY_H - 0.02;
scene.add(sand);

// Wood rim
const rimY = TRAY_H + 0.06;
[[0, -(TRAY_D/2 - 0.08)], [0, (TRAY_D/2 - 0.08)]].forEach(([x,z]) => {
  const r = box(TRAY_W + 0.1, 0.14, 0.16, 0xc98a4b);
  r.position.set(x, rimY, z); scene.add(r);
});
[[-(TRAY_W/2 - 0.08), 0], [(TRAY_W/2 - 0.08), 0]].forEach(([x,z]) => {
  const r = box(0.16, 0.14, TRAY_D + 0.1, 0xc98a4b);
  r.position.set(x, rimY, z); scene.add(r);
});

/* ============================================================
   CAGE BARS
============================================================ */
const barMat = mat(0xd8dde2, { metalness: 0.6, roughness: 0.4 });
const CAGE_H = 1.5;
const baseY = rimY;

function bar(len, x, y, z, axis = 'y') {
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, len, 5), barMat);
  b.position.set(x, y, z);
  if (axis === 'x') b.rotation.z = Math.PI / 2;
  if (axis === 'z') b.rotation.x = Math.PI / 2;
  scene.add(b);
}

// Vertical bars along the 4 walls
const step = 0.45;
for (let x = -TRAY_W/2 + 0.2; x <= TRAY_W/2 - 0.2 + 0.01; x += step) {
  bar(CAGE_H, x, baseY + CAGE_H/2, -(TRAY_D/2 - 0.05));
  bar(CAGE_H, x, baseY + CAGE_H/2,  (TRAY_D/2 - 0.05));
}
for (let z = -TRAY_D/2 + 0.45; z <= TRAY_D/2 - 0.45 + 0.01; z += step) {
  bar(CAGE_H, -(TRAY_W/2 - 0.05), baseY + CAGE_H/2, z);
  bar(CAGE_H,  (TRAY_W/2 - 0.05), baseY + CAGE_H/2, z);
}
// Horizontal rings
[baseY + 0.5, baseY + 1.0, baseY + CAGE_H].forEach(y => {
  bar(TRAY_W - 0.1, 0, y, -(TRAY_D/2 - 0.05), 'x');
  bar(TRAY_W - 0.1, 0, y,  (TRAY_D/2 - 0.05), 'x');
  bar(TRAY_D - 0.1, -(TRAY_W/2 - 0.05), y, 0, 'z');
  bar(TRAY_D - 0.1,  (TRAY_W/2 - 0.05), y, 0, 'z');
});
// Corner posts
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz]) => {
  const p = box(0.14, CAGE_H + 0.15, 0.14, 0xc98a4b);
  p.position.set(sx * (TRAY_W/2 - 0.05), baseY + (CAGE_H+0.15)/2, sz * (TRAY_D/2 - 0.05));
  scene.add(p);
});

/* ============================================================
   WHEEL (interactive object)
============================================================ */
const wheelGroup = new THREE.Group();
wheelGroup.position.set(-1.9, 0, -0.9);
scene.add(wheelGroup);

const wheelBase = box(0.9, 0.25, 0.9, 0x5aa9e6);
wheelBase.position.y = 0.12;
wheelGroup.add(wheelBase);

const wheelSpin = new THREE.Group(); // this part rotates
wheelSpin.position.y = 0.55;
wheelGroup.add(wheelSpin);

const rim = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.07, 6, 12), mat(0xffd166));
rim.castShadow = true;
wheelSpin.add(rim);
const hub = cyl(0.07, 0.07, 0.2, 0xff8fa3);
hub.rotation.x = Math.PI / 2;
wheelSpin.add(hub);
for (let i = 0; i < 4; i++) {
  const spoke = cyl(0.025, 0.025, 0.84, 0xff8fa3);
  spoke.rotation.z = (i / 4) * Math.PI;
  wheelSpin.add(spoke);
}
let wheelSpeed = 0;

/* ============================================================
   TUNNEL
============================================================ */
const tunnel = new THREE.Mesh(
  new THREE.CylinderGeometry(0.42, 0.42, 1.5, 8, 1, true, 0, Math.PI),
  mat(0x9b5de5, { side: THREE.DoubleSide })
);
tunnel.rotation.z = Math.PI / 2;   // axis along X
tunnel.rotation.y = Math.PI;       // arch up
tunnel.position.set(1.7, 0.42, 0.9);
tunnel.castShadow = true;
scene.add(tunnel);

/* ============================================================
   FOOD BOWL
============================================================ */
const bowl = new THREE.Group();
bowl.position.set(1.9, 0, -0.85);
scene.add(bowl);
bowl.add(cyl(0.34, 0.22, 0.18, 0x06d6a0));
const pelletColors = [0xe07a5f, 0xf2cc8f, 0x81b29a];
for (let i = 0; i < 5; i++) {
  const p = sph(0.06, pelletColors[i % 3]);
  p.position.set((Math.random()-0.5)*0.3, 0.1, (Math.random()-0.5)*0.3);
  bowl.add(p);
}

/* ============================================================
   HAY TUFTS
============================================================ */
for (let i = 0; i < 8; i++) {
  const tuft = new THREE.Group();
  for (let j = 0; j < 3; j++) {
    const blade = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.28, 4), mat(0xd9c26a));
    blade.position.y = 0.14;
    blade.rotation.z = (Math.random() - 0.5) * 0.7;
    blade.rotation.x = (Math.random() - 0.5) * 0.7;
    tuft.add(blade);
  }
  tuft.position.set(
    (Math.random() - 0.5) * (TRAY_W - 1.4),
    TRAY_H - 0.05,
    (Math.random() - 0.5) * (TRAY_D - 1.4)
  );
  scene.add(tuft);
}

/* ============================================================
   HAMSTERS
============================================================ */
const PALETTES = [
  { fur: 0xf4a261, belly: 0xfff1dc }, // orange
  { fur: 0xd9d9d9, belly: 0xffffff }, // cream
  { fur: 0x8d6e63, belly: 0xe8d5c4 }, // brown
  { fur: 0xf7c8d0, belly: 0xfff0f3 }, // pinky
];

function makeHamster(palette) {
  const g = new THREE.Group();

  const body = sph(0.34, palette.fur);
  body.scale.set(1, 0.85, 1.25);
  body.position.y = 0.34;
  g.add(body);

  const belly = sph(0.26, palette.belly);
  belly.scale.set(0.9, 0.7, 1.0);
  belly.position.set(0, 0.26, 0.12);
  g.add(belly);

  const head = sph(0.24, palette.fur);
  head.position.set(0, 0.42, 0.34);
  g.add(head);

  // Ears
  [-1, 1].forEach(s => {
    const ear = sph(0.08, palette.fur);
    ear.position.set(s * 0.14, 0.62, 0.28);
    g.add(ear);
    const inner = sph(0.045, 0xf7a8b8);
    inner.position.set(s * 0.14, 0.62, 0.33);
    g.add(inner);
  });

  // Eyes
  [-1, 1].forEach(s => {
    const eye = sph(0.045, 0x2b2b2b);
    eye.position.set(s * 0.11, 0.46, 0.52);
    g.add(eye);
  });

  // Nose + cheeks
  const nose = sph(0.035, 0xf06292);
  nose.position.set(0, 0.4, 0.575);
  g.add(nose);
  [-1, 1].forEach(s => {
    const cheek = sph(0.07, 0xffd9c0);
    cheek.position.set(s * 0.16, 0.36, 0.48);
    g.add(cheek);
  });

  // Feet
  [-1, 1].forEach(s => {
    const f = box(0.09, 0.06, 0.12, palette.belly);
    f.position.set(s * 0.14, 0.03, 0.18);
    g.add(f);
    const b = box(0.09, 0.06, 0.12, palette.belly);
    b.position.set(s * 0.14, 0.03, -0.18);
    g.add(b);
  });

  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}

/* ---------- Autonomous behavior ---------- */
const BOUNDS = { x: TRAY_W/2 - 0.55, z: TRAY_D/2 - 0.55 };
const FLOOR_Y = TRAY_H + 0.0;

// Interaction spots
const SPOTS = {
  wheel:  { pos: new THREE.Vector3(-1.9, FLOOR_Y, -0.35), dur: [3, 6] },
  tunnel: { pos: new THREE.Vector3(1.7, FLOOR_Y, 0.45),   dur: [2, 4] },
  bowl:   { pos: new THREE.Vector3(1.9, FLOOR_Y, -0.35),  dur: [2, 5] },
};

class Hamster {
  constructor(palette, x, z) {
    this.group = makeHamster(palette);
    this.group.position.set(x, FLOOR_Y, z);
    this.group.rotation.y = Math.random() * Math.PI * 2;
    scene.add(this.group);

    this.speed = 0.7 + Math.random() * 0.3;
    this.state = 'idle';
    this.timer = 1 + Math.random() * 2;
    this.target = new THREE.Vector3();
    this.spotKey = null;
    this.phase = Math.random() * 10;
    this.pickNewAction();
  }

  pickNewAction() {
    const roll = Math.random();
    if (roll < 0.35) {
      // idle / sniff around
      this.state = 'idle';
      this.timer = 1 + Math.random() * 2.5;
    } else if (roll < 0.75) {
      // wander to a random spot in the tray
      this.state = 'wander';
      this.target.set(
        (Math.random() * 2 - 1) * BOUNDS.x,
        FLOOR_Y,
        (Math.random() * 2 - 1) * BOUNDS.z
      );
    } else {
      // go interact with an object
      this.state = 'seek';
      const keys = Object.keys(SPOTS);
      this.spotKey = keys[Math.floor(Math.random() * keys.length)];
      this.target.copy(SPOTS[this.spotKey].pos);
    }
  }

  update(dt, time) {
    const p = this.group.position;

    switch (this.state) {
      case 'idle': {
        this.timer -= dt;
        // gentle sniffing wiggle
        this.group.rotation.y += Math.sin(time * 3 + this.phase) * dt * 0.6;
        this.group.position.y = FLOOR_Y + Math.abs(Math.sin(time * 6 + this.phase)) * 0.015;
        if (this.timer <= 0) this.pickNewAction();
        break;
      }
      case 'wander':
      case 'seek': {
        const dir = new THREE.Vector3().subVectors(this.target, p);
        dir.y = 0;
        const dist = dir.length();
        if (dist < 0.15) {
          if (this.state === 'wander') { this.state = 'idle'; this.timer = 0.8 + Math.random() * 1.5; }
          else {
            // arrived at object — do the thing!
            const [lo, hi] = SPOTS[this.spotKey].dur;
            this.state = 'interact';
            this.timer = lo + Math.random() * (hi - lo);
            if (this.spotKey === 'wheel') wheelSpeed = Math.max(wheelSpeed, 6);
          }
        } else {
          dir.normalize();
          p.addScaledVector(dir, this.speed * dt);
          // smooth turn to face movement direction
          const targetAngle = Math.atan2(dir.x, dir.z);
          let diff = targetAngle - this.group.rotation.y;
          while (diff >  Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          this.group.rotation.y += diff * Math.min(1, dt * 8);
          // scurry bob
          this.group.position.y = FLOOR_Y + Math.abs(Math.sin(time * 12 + this.phase)) * 0.05;
          this.group.rotation.x = Math.sin(time * 12 + this.phase) * 0.05;
        }
        break;
      }
      case 'interact': {
        this.timer -= dt;
        if (this.spotKey === 'wheel') {
          wheelSpeed = Math.max(wheelSpeed, 6);
          // running-in-place bounce
          this.group.position.y = FLOOR_Y + Math.abs(Math.sin(time * 14 + this.phase)) * 0.07;
          this.group.rotation.y = Math.sin(time * 2 + this.phase) * 0.3; // wiggly
        } else if (this.spotKey === 'bowl') {
          // munching!
          this.group.position.y = FLOOR_Y + Math.abs(Math.sin(time * 10 + this.phase)) * 0.03;
          this.group.rotation.y += Math.sin(time * 4 + this.phase) * dt * 1.2;
        } else {
          // tunnel: peek in and out
          this.group.position.y = FLOOR_Y + Math.abs(Math.sin(time * 3 + this.phase)) * 0.04;
          this.group.rotation.y += Math.sin(time * 1.5 + this.phase) * dt * 0.8;
        }
        if (this.timer <= 0) this.pickNewAction();
        break;
      }
    }

    // keep inside tray
    p.x = THREE.MathUtils.clamp(p.x, -BOUNDS.x, BOUNDS.x);
    p.z = THREE.MathUtils.clamp(p.z, -BOUNDS.z, BOUNDS.z);
  }
}

const hamsters = [
  new Hamster(PALETTES[0], -0.5,  0.5),
  new Hamster(PALETTES[1],  0.8, -0.6),
  new Hamster(PALETTES[2],  0.0,  1.0),
  new Hamster(PALETTES[3], -1.2, -0.2),
];

/* ============================================================
   ANIMATION LOOP
============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  hamsters.forEach(h => h.update(dt, t));

  // wheel spins fast while used, coasts down otherwise
  wheelSpeed *= Math.pow(0.4, dt); // exponential decay
  wheelSpin.rotation.x += wheelSpeed * dt;

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================================================
   RESIZE
============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
