<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аквариум 3D — интерактивный</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Golos Text', system-ui, sans-serif;
    color: #dff2ff;
    background: radial-gradient(120% 90% at 50% -10%, #0f5c86 0%, #0a3f63 30%, #062a46 55%, #03182b 80%, #020f1d 100%);
    user-select: none;
  }

  /* ---------- сцена и атмосферные слои ---------- */
  #app { position: fixed; inset: 0; z-index: 1; }
  #app canvas { display: block; cursor: crosshair; animation: fadein 1.4s ease both; }

  #rays {
    position: fixed; inset: -20%; z-index: 2; pointer-events: none;
    mix-blend-mode: screen; opacity: .55;
    background:
      linear-gradient(115deg, transparent 42%, rgba(140,220,255,.10) 47%, transparent 52%),
      linear-gradient(105deg, transparent 60%, rgba(120,200,255,.08) 66%, transparent 72%),
      linear-gradient(125deg, transparent 30%, rgba(150,230,255,.07) 38%, transparent 44%);
    animation: raysShift 14s ease-in-out infinite alternate;
  }
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(1,8,16,.55) 100%);
  }

  /* ---------- панели ---------- */
  .panel {
    position: fixed; z-index: 10;
    background: rgba(7,29,47,.55);
    border: 1px solid rgba(126,214,255,.22);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 18px 50px rgba(1,10,22,.55), inset 0 1px 0 rgba(180,235,255,.12);
  }
  .panel-info {
    top: 20px; left: 20px; width: 292px;
    padding: 20px 20px 18px; border-radius: 20px;
    animation: slideInR .9s cubic-bezier(.16,1,.3,1) .15s both;
  }
  .panel-stats {
    top: 20px; right: 20px; width: 208px;
    padding: 15px 18px 10px; border-radius: 16px;
    animation: slideInL .9s cubic-bezier(.16,1,.3,1) .3s both;
  }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 7px; }
  .brand-badge {
    width: 46px; height: 46px; flex: 0 0 46px;
    display: grid; place-items: center; font-size: 25px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(55,213,255,.25), rgba(47,123,255,.15));
    border: 1px solid rgba(126,214,255,.3);
    animation: bob 3.2s ease-in-out infinite;
  }
  h1 {
    font-family: 'Unbounded'; font-weight: 900; font-size: 23px; line-height: 1;
    letter-spacing: .03em;
    background: linear-gradient(92deg, #8fe8ff, #4da3ff 55%, #ffb37c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 span { font-size: .45em; letter-spacing: .18em; -webkit-text-fill-color: #ffb37c; vertical-align: super; }
  .tagline { font-size: 12.5px; color: #9fc6dd; margin-bottom: 15px; }

  .help { list-style: none; display: grid; gap: 7px; margin-bottom: 16px; }
  .help li { display: flex; align-items: center; gap: 9px; font-size: 12px; color: #bfe0f2; }
  kbd {
    font-family: inherit; font-size: 10.5px; font-weight: 600;
    letter-spacing: .05em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 6px; white-space: nowrap;
    background: rgba(126,214,255,.12); border: 1px solid rgba(126,214,255,.25); color: #cfeeff;
  }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    appearance: none; border: 1px solid rgba(255,255,255,.16); border-radius: 999px;
    padding: 9px 14px; font-family: inherit; font-size: 12.5px; font-weight: 600;
    letter-spacing: .02em; color: #fff; cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0) scale(.96); }
  .btn:focus-visible { outline: 2px solid #7fe3ff; outline-offset: 2px; }
  .btn-coral { background: linear-gradient(135deg, #ff9a5a, #ff5e62); }
  .btn-coral:hover { box-shadow: 0 10px 26px rgba(255,94,98,.45); }
  .btn-cyan { background: linear-gradient(135deg, #37d5ff, #2f7bff); }
  .btn-cyan:hover { box-shadow: 0 10px 26px rgba(47,150,255,.45); }
  .btn-amber { background: linear-gradient(135deg, #ffd76a, #ff9d3c); color: #3a2405; }
  .btn-amber:hover { box-shadow: 0 10px 26px rgba(255,180,60,.4); }
  .btn-amber.is-off { filter: grayscale(.7) brightness(.75); }

  /* ---------- статистика ---------- */
  .stats-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .stats-head h2 {
    font-family: 'Unbounded'; font-size: 10.5px; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase; color: #8fd0ef;
  }
  .live { display: flex; align-items: center; gap: 6px; font-size: 9.5px; letter-spacing: .12em; color: #7dffb0; text-transform: uppercase; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #7dffb0; animation: pulse 1.6s ease-in-out infinite; }
  .stat {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 0; border-top: 1px dashed rgba(126,214,255,.15);
  }
  .stat span { font-size: 11.5px; color: #9fc6dd; letter-spacing: .03em; }
  .stat b { font-family: 'Unbounded'; font-size: 17px; font-weight: 700; color: #eaf7ff; }
  #stat-fps.good { color: #7dffb0; }
  #stat-fps.mid  { color: #ffd76a; }
  #stat-fps.low  { color: #ff8585; }

  /* ---------- тост, рябь, подпись ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 34px; z-index: 30;
    transform: translate(-50%, 16px);
    padding: 10px 20px; border-radius: 999px;
    background: rgba(7,29,47,.82); border: 1px solid rgba(126,214,255,.35);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 13px; font-weight: 500; white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease, transform .3s cubic-bezier(.16,1,.3,1);
    box-shadow: 0 12px 30px rgba(1,10,22,.5);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  .ripple {
    position: fixed; z-index: 20; width: 14px; height: 14px;
    border: 2px solid rgba(160,230,255,.85); border-radius: 50%;
    transform: translate(-50%,-50%) scale(1); pointer-events: none;
    animation: ripple .7s ease-out forwards;
  }
  .credit {
    position: fixed; right: 18px; bottom: 14px; z-index: 10;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(159,198,221,.5);
  }

  /* ---------- анимации ---------- */
  @keyframes fadein { from { opacity: 0; } }
  @keyframes slideInR { from { opacity: 0; transform: translateX(-26px); } }
  @keyframes slideInL { from { opacity: 0; transform: translateX(26px); } }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(-6deg); } }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  @keyframes ripple { to { transform: translate(-50%,-50%) scale(6); opacity: 0; } }
  @keyframes raysShift { from { transform: translateX(-3%); } to { transform: translateX(3%); } }

  /* ---------- адаптив ---------- */
  @media (max-width: 820px) {
    .panel-info { top: 14px; left: 14px; width: calc(100vw - 28px); max-width: 330px; padding: 16px; }
    .panel-stats { top: auto; bottom: 14px; right: 14px; width: 172px; padding: 12px 14px 8px; }
    .credit { display: none; }
  }
  @media (max-width: 560px) {
    .help { display: none; }
    h1 { font-size: 20px; }
    .tagline { margin-bottom: 12px; }
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="rays"></div>
<div id="vignette"></div>

<!-- Информация и управление -->
<header class="panel panel-info">
  <div class="brand">
    <div class="brand-badge">🐠</div>
    <h1>АКВАРИУМ <span>3D</span></h1>
  </div>
  <p class="tagline">Интерактивный аквариум с живыми рыбками</p>
  <ul class="help">
    <li><kbd>ЛКМ</kbd> вращение камеры</li>
    <li><kbd>ПКМ</kbd> панорамирование</li>
    <li><kbd>Колесо</kbd> приближение</li>
    <li><kbd>Клик</kbd> бросить корм</li>
  </ul>
  <div class="actions">
    <button class="btn btn-coral"  id="btn-fish"    aria-label="Добавить рыбку">＋ Рыбка</button>
    <button class="btn btn-cyan"   id="btn-bubbles" aria-label="Добавить пузыри">Пузыри +10</button>
    <button class="btn btn-amber"  id="btn-light"   aria-label="Переключить свет">☀️ Свет</button>
  </div>
</header>

<!-- Телеметрия -->
<aside class="panel panel-stats">
  <div class="stats-head">
    <h2>Телеметрия</h2>
    <span class="live"><i></i>live</span>
  </div>
  <div class="stat"><span>Рыбки</span><b id="stat-fish">0</b></div>
  <div class="stat"><span>Пузыри</span><b id="stat-bubbles">0</b></div>
  <div class="stat"><span>Корм</span><b id="stat-food">0</b></div>
  <div class="stat"><span>FPS</span><b id="stat-fps" class="good">—</b></div>
</aside>

<div id="toast"></div>
<div class="credit">three.js r128 · webgl</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  'use strict';

  // ================= КОНСТАНТЫ АКВАРИУМА =================
  var TANK_W = 36, TANK_H = 24, TANK_D = 20;
  var FOOD_FLOOR = -11.1;
  var MAX_FISH = 40;

  var app = document.getElementById('app');

  // ================= РЕНДЕРЕР / СЦЕНА / КАМЕРА =================
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) {
    app.innerHTML = '<p style="padding:40px;font-size:15px">WebGL недоступен в этом браузере 😢</p>';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  app.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a3d5e, 0.011);

  var aspect = window.innerWidth / window.innerHeight;
  var camDist = Math.min(58, Math.max(42, 34 / Math.min(1, aspect * 1.05)));
  var camera = new THREE.PerspectiveCamera(55, aspect, 0.1, 300);
  camera.position.set(0, 5, camDist);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 10;
  controls.maxDistance = 60;
  controls.maxPolarAngle = Math.PI / 1.8;
  controls.target.set(0, 0, 0);
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.6;
  ['pointerdown', 'wheel'].forEach(function (ev) {
    renderer.domElement.addEventListener(ev, function () { controls.autoRotate = false; }, { passive: true });
  });

  // ================= ОСВЕЩЕНИЕ =================
  var ambLight = new THREE.AmbientLight(0x404040, 0.4);
  scene.add(ambLight);
  var hemi = new THREE.HemisphereLight(0x7ec8ff, 0x0a2a44, 0.35);
  scene.add(hemi);

  var sun = new THREE.DirectionalLight(0xfff2df, 1.15);
  sun.position.set(16, 30, 18);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -26; sun.shadow.camera.right = 26;
  sun.shadow.camera.top = 22;   sun.shadow.camera.bottom = -22;
  sun.shadow.camera.near = 5;   sun.shadow.camera.far = 80;
  sun.shadow.bias = -0.0004;
  scene.add(sun);

  var p1 = new THREE.PointLight(0x35d0ff, 0.7, 70);  p1.position.set(-11, 5, 4);
  var p2 = new THREE.PointLight(0x2f6bff, 0.55, 70); p2.position.set(11, -5, -5);
  scene.add(p1, p2);

  // ================= СТЕКЛЯННЫЙ КОРПУС =================
  var glassGeo = new THREE.BoxGeometry(TANK_W, TANK_H, TANK_D);
  var glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xbfe6ff, metalness: 0, roughness: 0.06,
    transmission: 0.95, ior: 1.33, thickness: 1.4,
    transparent: true, opacity: 1, side: THREE.DoubleSide, depthWrite: false
  });
  var glassMesh = new THREE.Mesh(glassGeo, glassMat);
  glassMesh.renderOrder = 3;
  scene.add(glassMesh);

  var edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(glassGeo),
    new THREE.LineBasicMaterial({ color: 0x9fdcff, transparent: true, opacity: 0.55 })
  );
  edges.renderOrder = 4;
  scene.add(edges);

  // объём воды (чтобы преломление не давало чёрный фон)
  var volume = new THREE.Mesh(
    new THREE.BoxGeometry(TANK_W - 0.8, TANK_H - 0.8, TANK_D - 0.8),
    new THREE.MeshBasicMaterial({ color: 0x146a9c, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false })
  );
  volume.renderOrder = 0;
  scene.add(volume);

  // ================= ПЕСЧАНОЕ ДНО =================
  (function createSand() {
    var geo = new THREE.PlaneGeometry(TANK_W - 0.6, TANK_D - 0.6, 44, 30);
    geo.rotateX(-Math.PI / 2);
    var pos = geo.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      var x = pos.getX(i), z = pos.getZ(i);
      pos.setY(i,
        0.26 * Math.sin(x * 0.5 + 1.3) * Math.cos(z * 0.62 + 2.1) +
        0.12 * Math.sin(x * 1.9 + z * 1.4) +
        0.08 * Math.sin(z * 2.6 + 0.5));
    }
    geo.computeVertexNormals();
    var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xd9c08a, roughness: 1 }));
    mesh.receiveShadow = true;
    mesh.position.y = -11.9;
    scene.add(mesh);
  })();

  // ================= КАМНИ (8) =================
  (function createRocks() {
    for (var i = 0; i < 8; i++) {
      var r = 0.7 + Math.random() * 1.2;
      var geo = new THREE.DodecahedronGeometry(r, 0);
      var s1 = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize();
      var s2 = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize();
      var pos = geo.attributes.position, v = new THREE.Vector3();
      for (var k = 0; k < pos.count; k++) {
        v.fromBufferAttribute(pos, k).normalize();
        var d = 1 + 0.28 * Math.sin(v.dot(s1) * 4.2) + 0.18 * Math.sin(v.dot(s2) * 6.7 + 1.7);
        pos.setXYZ(k, v.x * d, v.y * d * 0.8, v.z * d);
      }
      geo.computeVertexNormals();
      var col = new THREE.Color().setHSL(0.07 + Math.random() * 0.06, 0.07 + Math.random() * 0.1, 0.32 + Math.random() * 0.18);
      var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, roughness: 0.95, flatShading: true }));
      mesh.castShadow = true; mesh.receiveShadow = true;
      mesh.position.set((Math.random() - .5) * 30, -11.8 + r * 0.3, (Math.random() - .5) * 16);
      mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      scene.add(mesh);
    }
  })();

  // ================= ВОДОРОСЛИ (12 кустов) =================
  var weeds = [];
  (function createWeeds() {
    for (var i = 0; i < 12; i++) {
      var group = new THREE.Group();
      var blades = 1 + (Math.random() * 3 | 0);
      var seed = Math.random() * 10;
      for (var j = 0; j < blades; j++) {
        var h = 2.5 + Math.random() * 5, pts = [];
        for (var k = 0; k <= 4; k++) {
          var s = k / 4;
          pts.push(new THREE.Vector3(
            Math.sin(seed * 3.1 + j * 2.2 + k * 1.3) * 0.4 * s,
            h * s,
            Math.cos(seed * 5.7 + j * 1.7 + k * 1.1) * 0.4 * s
          ));
        }
        var curve = new THREE.CatmullRomCurve3(pts);
        var geo = new THREE.TubeGeometry(curve, 14, 0.1 + Math.random() * 0.12, 6, false);
        var col = new THREE.Color().setHSL(0.32 + Math.random() * 0.14, 0.55 + Math.random() * 0.2, 0.28 + Math.random() * 0.15);
        var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, roughness: 0.85 }));
        mesh.castShadow = true;
        group.add(mesh);
      }
      group.position.set((Math.random() - .5) * 30, -11.7, (Math.random() - .5) * 16);
      scene.add(group);
      weeds.push({ group: group, phase: Math.random() * 6.28, speed: 0.5 + Math.random() * 0.9, amp: 0.04 + Math.random() * 0.06 });
    }
  })();

  function updateWeeds(t) {
    for (var i = 0; i < weeds.length; i++) {
      var w = weeds[i];
      w.group.rotation.x = Math.sin(t * w.speed + w.phase) * w.amp;
      w.group.rotation.z = Math.cos(t * w.speed * 0.8 + w.phase) * w.amp;
    }
  }

  // ================= ПОВЕРХНОСТЬ ВОДЫ =================
  var surfGeo, surfBase;
  (function createSurface() {
    surfGeo = new THREE.PlaneGeometry(TANK_W - 0.8, TANK_D - 0.8, 26, 16);
    surfGeo.rotateX(-Math.PI / 2);
    surfBase = Float32Array.from(surfGeo.attributes.position.array);
    var mesh = new THREE.Mesh(surfGeo, new THREE.MeshPhongMaterial({
      color: 0x9fdcff, transparent: true, opacity: 0.14,
      side: THREE.DoubleSide, shininess: 120, specular: 0x9fdcff, depthWrite: false
    }));
    mesh.position.y = 11.8;
    mesh.renderOrder = 1;
    scene.add(mesh);
  })();

  function updateSurface(t) {
    var arr = surfGeo.attributes.position.array;
    for (var i = 0; i < arr.length; i += 3) {
      arr[i + 1] = 0.14 * Math.sin(surfBase[i] * 0.55 + t * 1.3) + 0.1 * Math.cos(surfBase[i + 2] * 0.75 + t * 0.9);
    }
    surfGeo.attributes.position.needsUpdate = true;
    surfGeo.computeVertexNormals();
  }

  // ================= БУБЛЬКИ (30) =================
  var bubbles = [];
  var BUBBLE_GEO = new THREE.SphereGeometry(1, 10, 8);
  var BUBBLE_MAT = new THREE.MeshPhysicalMaterial({
    color: 0xbfe8ff, roughness: 0, metalness: 0,
    transmission: 0.95, transparent: true, opacity: 0.45,
    clearcoat: 1, clearcoatRoughness: 0, depthWrite: false
  });

  function spawnBubble(scatter) {
    var m = new THREE.Mesh(BUBBLE_GEO, BUBBLE_MAT);
    m.scale.setScalar(0.1 + Math.random() * 0.28);
    var b = {
      mesh: m,
      baseX: (Math.random() - .5) * 32,
      baseZ: (Math.random() - .5) * 17,
      y: scatter ? (Math.random() - .5) * 22 : -11.2,
      speed: 1.2 + Math.random() * 2.2,
      amp: 0.15 + Math.random() * 0.45,
      freq: 0.8 + Math.random() * 1.8,
      phase: Math.random() * Math.PI * 2
    };
    m.position.set(b.baseX, b.y, b.baseZ);
    scene.add(m);
    bubbles.push(b);
  }

  function updateBubbles(dt, t) {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y += b.speed * dt;
      if (b.y > 11.2) {
        b.y = -11.3;
        b.baseX = (Math.random() - .5) * 32;
        b.baseZ = (Math.random() - .5) * 17;
      }
      b.mesh.position.set(
        b.baseX + Math.sin(t * b.freq + b.phase) * b.amp,
        b.y,
        b.baseZ + Math.cos(t * b.freq * 0.8 + b.phase) * b.amp * 0.7
      );
    }
  }

  // ================= РЫБКИ =================
  var SCHEMES = [
    { body: 0xff7a1a, fin: 0xffc46b, metal: 0.15 }, // оранжевая
    { body: 0x2f7bff, fin: 0x8fd0ff, metal: 0.15 }, // синяя
    { body: 0xffcf3f, fin: 0xff5533, metal: 0.15 }, // жёлто-красная
    { body: 0x9b4dff, fin: 0xd3a6ff, metal: 0.20 }, // фиолетовая
    { body: 0xe8352e, fin: 0xff9d8a, metal: 0.15 }, // красная
    { body: 0x2ecc71, fin: 0xa7f3c9, metal: 0.15 }, // зелёная
    { body: 0xff6fa5, fin: 0xffc2d9, metal: 0.15 }, // розовая
    { body: 0xf5b63c, fin: 0xffe9a8, metal: 0.55 }  // золотая
  ];
  var schemeCache = {};
  function getSchemeMats(s) {
    if (schemeCache[s.body]) return schemeCache[s.body];
    var m = {
      body: new THREE.MeshStandardMaterial({ color: s.body, roughness: 0.45, metalness: s.metal }),
      fin:  new THREE.MeshStandardMaterial({
        color: s.fin, roughness: 0.6, metalness: s.metal * 0.5,
        transparent: true, opacity: 0.9, side: THREE.DoubleSide
      })
    };
    schemeCache[s.body] = m;
    return m;
  }

  // общие низкополигональные геометрии (нос рыбки смотрит вдоль +Z)
  var GEO = {
    body: new THREE.SphereGeometry(1, 22, 16),
    eye:  new THREE.SphereGeometry(0.16, 12, 10),
    pupil:new THREE.SphereGeometry(0.075, 10, 8),
    tail: (function () {
      var sh = new THREE.Shape();
      sh.moveTo(0, 0); sh.lineTo(-0.95, 0.7); sh.lineTo(-0.55, 0); sh.lineTo(-0.95, -0.7); sh.closePath();
      var g = new THREE.ShapeGeometry(sh, 6);
      g.rotateY(-Math.PI / 2);
      return g;
    })(),
    dorsal: (function () {
      var sh = new THREE.Shape();
      sh.moveTo(0.45, 0); sh.quadraticCurveTo(0.1, 0.55, -0.75, 0.28); sh.lineTo(-0.75, 0); sh.closePath();
      var g = new THREE.ShapeGeometry(sh, 8);
      g.rotateY(-Math.PI / 2);
      return g;
    })(),
    fin: (function () {
      var sh = new THREE.Shape();
      sh.moveTo(0, 0); sh.lineTo(0.5, 0.12); sh.lineTo(0.18, 0.5); sh.closePath();
      var g = new THREE.ShapeGeometry(sh, 4);
      g.rotateX(-Math.PI / 2);
      return g;
    })()
  };
  var EYE_MAT   = new THREE.MeshStandardMaterial({ color: 0xf4f9ff, roughness: 0.25 });
  var PUPIL_MAT = new THREE.MeshStandardMaterial({ color: 0x0a0f14, roughness: 0.2 });

  var fishArray = [];

  function createFish() {
    var scheme = SCHEMES[(Math.random() * SCHEMES.length) | 0];
    var mats = getSchemeMats(scheme);
    var g = new THREE.Group();

    var body = new THREE.Mesh(GEO.body, mats.body);
    body.scale.set(0.72, 0.85, 1.5);
    body.castShadow = true;
    g.add(body);

    var eyeL = new THREE.Mesh(GEO.eye, EYE_MAT);   eyeL.position.set(0.34, 0.22, 1.05);
    var eyeR = new THREE.Mesh(GEO.eye, EYE_MAT);   eyeR.position.set(-0.34, 0.22, 1.05);
    var pupL = new THREE.Mesh(GEO.pupil, PUPIL_MAT); pupL.position.set(0.37, 0.22, 1.15);
    var pupR = new THREE.Mesh(GEO.pupil, PUPIL_MAT); pupR.position.set(-0.37, 0.22, 1.15);
    g.add(eyeL, eyeR, pupL, pupR);

    var tail = new THREE.Mesh(GEO.tail, mats.fin);
    tail.position.set(0, 0.05, -1.25);
    tail.castShadow = true;
    g.add(tail);

    var dorsalFin = new THREE.Mesh(GEO.dorsal, mats.fin);
    dorsalFin.position.set(0, 0.78, -0.15);
    g.add(dorsalFin);

    var leftFin = new THREE.Mesh(GEO.fin, mats.fin);
    leftFin.position.set(0.42, -0.08, 0.35);
    var rightFin = new THREE.Mesh(GEO.fin, mats.fin);
    rightFin.scale.x = -1;
    rightFin.position.set(-0.42, -0.08, 0.35);
    g.add(leftFin, rightFin);

    var baseScale = 0.6 + Math.random() * 0.6;
    g.scale.setScalar(baseScale);
    g.position.set((Math.random() - .5) * 28, (Math.random() - .5) * 14, (Math.random() - .5) * 14);
    scene.add(g);

    var speed = 2.2 + Math.random() * 2.2;
    var fish = {
      mesh: g, tail: tail, leftFin: leftFin, rightFin: rightFin, dorsalFin: dorsalFin,
      velocity: new THREE.Vector3(Math.random() - .5, (Math.random() - .5) * .4, Math.random() - .5)
                 .normalize().multiplyScalar(speed),
      speed: speed,
      tailSpeed: 6 + Math.random() * 6,
      phase: Math.random() * Math.PI * 2,
      targetFood: null,
      avoidanceRadius: 2.4 + Math.random() * 1.4,
      baseScale: baseScale,
      size: baseScale,
      wanderDir: new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize(),
      wanderT: Math.random() * 3
    };
    fishArray.push(fish);
    updateStats();
    return fish;
  }

  // ---------- ИИ рыбок ----------
  var _desired = new THREE.Vector3();
  var _diff = new THREE.Vector3();
  var _orient = new THREE.Object3D();

  function updateFish(f, dt, t) {
    var p = f.mesh.position;

    // случайное блуждание
    f.wanderT -= dt;
    if (f.wanderT <= 0) {
      f.wanderT = 2 + Math.random() * 4;
      f.wanderDir.set(Math.random() - .5, (Math.random() - .5) * .6, Math.random() - .5).normalize();
    }
    f.wanderDir.x += (Math.random() - .5) * dt * 2.5;
    f.wanderDir.y += (Math.random() - .5) * dt * 1.2;
    f.wanderDir.z += (Math.random() - .5) * dt * 2.5;
    f.wanderDir.normalize();
    _desired.copy(f.wanderDir).multiplyScalar(f.speed);

    // поиск и преследование корма (радиус 15)
    f.targetFood = null;
    var bestD = 15;
    for (var i = 0; i < foods.length; i++) {
      var d = p.distanceTo(foods[i].mesh.position);
      if (d < bestD) { bestD = d; f.targetFood = foods[i]; }
    }
    if (f.targetFood) {
      _diff.copy(f.targetFood.mesh.position).sub(p).normalize();
      _desired.copy(_diff).multiplyScalar(f.speed * 2.1);
      if (bestD < 0.95) eatFood(f, f.targetFood);
    }

    // избегание столкновений
    for (var j = 0; j < fishArray.length; j++) {
      var o = fishArray[j];
      if (o === f) continue;
      _diff.copy(p).sub(o.mesh.position);
      var dd = _diff.length();
      if (dd < f.avoidanceRadius && dd > 0.001) {
        _diff.multiplyScalar((1 - dd / f.avoidanceRadius) * f.speed * 2.6 / dd);
        _desired.add(_diff);
      }
    }

    // отражение от стенок (пружинная зона)
    var MX = 14.5, MZ = 6.5, MYT = 9, MYB = -9.5;
    if (p.x >  MX) _desired.x -= (p.x - MX) * 6;
    if (p.x < -MX) _desired.x += (-MX - p.x) * 6;
    if (p.z >  MZ) _desired.z -= (p.z - MZ) * 6;
    if (p.z < -MZ) _desired.z += (-MZ - p.z) * 6;
    if (p.y >  MYT) _desired.y -= (p.y - MYT) * 6;
    if (p.y <  MYB) _desired.y += (MYB - p.y) * 6;

    // руление + ограничение скорости
    f.velocity.lerp(_desired, 1 - Math.exp(-2.5 * dt));
    var sp = f.velocity.length() || 0.001;
    var maxS = f.speed * (f.targetFood ? 2.1 : 1.25);
    var minS = f.speed * 0.45;
    if (sp > maxS) f.velocity.multiplyScalar(maxS / sp);
    else if (sp < minS) f.velocity.multiplyScalar(minS / sp);

    p.addScaledVector(f.velocity, dt);
    p.x = THREE.MathUtils.clamp(p.x, -16.8, 16.8);
    p.y = THREE.MathUtils.clamp(p.y, -10.8, 11);
    p.z = THREE.MathUtils.clamp(p.z, -8.8, 8.8);

    // плавный поворот в сторону движения
    _orient.position.copy(p);
    _orient.lookAt(p.x + f.velocity.x, p.y + f.velocity.y * 0.6, p.z + f.velocity.z);
    f.mesh.quaternion.slerp(_orient.quaternion, Math.min(1, dt * 5));

    // анимация хвоста и плавников
    var wag  = Math.sin(t * f.tailSpeed + f.phase);
    var wag2 = Math.sin(t * f.tailSpeed * 0.5 + f.phase * 1.7);
    f.tail.rotation.z = wag * 0.55 + wag2 * 0.1;   // махание хвостом (ось Z)
    f.tail.rotation.y = wag * 0.15;
    var flap = Math.sin(t * f.tailSpeed * 0.85 + f.phase) * 0.35 + 0.25;
    f.leftFin.rotation.x = flap;
    f.rightFin.rotation.x = flap;
    f.dorsalFin.rotation.x = Math.sin(t * f.tailSpeed * 0.5 + f.phase) * 0.08;
  }

  // ================= СИСТЕМА КОРМЛЕНИЯ =================
  var foods = [];
  var FOOD_GEO = new THREE.SphereGeometry(0.28, 10, 8);
  var FOOD_MAT = new THREE.MeshStandardMaterial({ color: 0xd9832f, roughness: 0.7, emissive: 0x40200a });
  var lastEatToast = 0;

  function spawnFood(pos) {
    var m = new THREE.Mesh(FOOD_GEO, FOOD_MAT);
    m.position.copy(pos);
    m.castShadow = true;
    scene.add(m);
    foods.push({ mesh: m, vy: 0, landed: false, landT: 0 });
    updateStats();
  }

  function removeFood(idx) {
    scene.remove(foods[idx].mesh);
    foods.splice(idx, 1);
    updateStats();
  }

  function eatFood(fish, food) {
    var idx = foods.indexOf(food);
    if (idx === -1) return;
    removeFood(idx);
    fish.size = Math.min(fish.size * 1.05, fish.baseScale * 2.4); // рост на 5%
    fish.mesh.scale.setScalar(fish.size);
    if (performance.now() - lastEatToast > 1500) {
      lastEatToast = performance.now();
      showToast('🐟 Рыбка поела и подросла!');
    }
  }

  function updateFoods(dt) {
    for (var i = foods.length - 1; i >= 0; i--) {
      var f = foods[i], p = f.mesh.position;
      if (!f.landed) {
        f.vy = Math.max(f.vy - 5 * dt, -3.2); // гравитация в воде
        p.y += f.vy * dt;
        if (p.y <= FOOD_FLOOR) { p.y = FOOD_FLOOR; f.landed = true; }
      } else {
        f.landT += dt;
        f.mesh.scale.setScalar(Math.max(0.001, 1 - f.landT / 1.4));
        if (f.landT > 1.4) removeFood(i);
      }
    }
  }

  // клик по аквариуму → корм
  var raycaster = new THREE.Raycaster();
  var ndc = new THREE.Vector2();
  var downX = 0, downY = 0, downT = 0;

  renderer.domElement.addEventListener('pointerdown', function (e) {
    downX = e.clientX; downY = e.clientY; downT = performance.now();
  });
  renderer.domElement.addEventListener('pointerup', function (e) {
    if (e.button !== 0) return;
    var dx = e.clientX - downX, dy = e.clientY - downY;
    if (dx * dx + dy * dy > 36 || performance.now() - downT > 450) return; // это было вращение
    ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    var hit = raycaster.intersectObject(glassMesh, false)[0];
    if (!hit) return;
    var pt = hit.point.clone().sub(hit.face.normal.clone().multiplyScalar(1.5));
    pt.x = THREE.MathUtils.clamp(pt.x, -16.5, 16.5);
    pt.y = THREE.MathUtils.clamp(pt.y, -10.5, 11);
    pt.z = THREE.MathUtils.clamp(pt.z, -8.5, 8.5);
    spawnFood(pt);
    ripple(e.clientX, e.clientY);
    showToast('🍤 Корм брошен в воду');
  });

  // ================= UI =================
  var elFish = document.getElementById('stat-fish');
  var elBubbles = document.getElementById('stat-bubbles');
  var elFood = document.getElementById('stat-food');
  var elFps = document.getElementById('stat-fps');
  var toastEl = document.getElementById('toast');
  var toastTimer;

  function updateStats() {
    elFish.textContent = fishArray.length;
    elBubbles.textContent = bubbles.length;
    elFood.textContent = foods.length;
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  function ripple(x, y) {
    var el = document.createElement('div');
    el.className = 'ripple';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 700);
  }

  document.getElementById('btn-fish').addEventListener('click', function () {
    if (fishArray.length >= MAX_FISH) { showToast('🐠 Максимум ' + MAX_FISH + ' рыбок'); return; }
    createFish();
    showToast('🐠 Новая рыбка присоединилась к стаю');
  });

  document.getElementById('btn-bubbles').addEventListener('click', function () {
    for (var i = 0; i < 10; i++) spawnBubble(false);
    updateStats();
    showToast('💧 +10 пузырьков');
  });

  var lightOn = true;
  var btnLight = document.getElementById('btn-light');
  btnLight.addEventListener('click', function () {
    lightOn = !lightOn;
    sun.intensity  = lightOn ? 1.15 : 0.12;
    hemi.intensity = lightOn ? 0.35 : 0.18;
    p1.intensity   = lightOn ? 0.7  : 0.35;
    p2.intensity   = lightOn ? 0.55 : 0.3;
    btnLight.classList.toggle('is-off', !lightOn);
    btnLight.innerHTML = lightOn ? '☀️ Свет' : '🌙 Свет';
    showToast(lightOn ? '☀️ Основной свет включён' : '🌙 Свет приглушён');
  });

  // ================= СТАРТ И ЦИКЛ =================
  for (var fi = 0; fi < 15; fi++) createFish();
  for (var bi = 0; bi < 30; bi++) spawnBubble(true);
  updateStats();

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var clock = new THREE.Clock();
  var frames = 0, lastFpsT = performance.now();

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;

    for (var i = 0; i < fishArray.length; i++) updateFish(fishArray[i], dt, t);
    updateFoods(dt);
    updateBubbles(dt, t);
    updateWeeds(t);
    updateSurface(t);

    controls.update();
    renderer.render(scene, camera);

    frames++;
    var now = performance.now();
    if (now - lastFpsT >= 500) {
      var fps = Math.round(frames * 1000 / (now - lastFpsT));
      elFps.textContent = fps;
      elFps.className = fps >= 48 ? 'good' : (fps >= 28 ? 'mid' : 'low');
      frames = 0; lastFpsT = now;
    }
  }
  animate();
})();
</script>
</body>
</html>
