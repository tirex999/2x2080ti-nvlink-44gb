<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аквариум · живая 3D-сцена</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --aqua:#3ee6c8; --coral:#ff7a59; --gold:#ffd166; --blue:#5aa9ff;
    --ink:#eafcff; --dim:rgba(190,224,236,.62);
    --panel:linear-gradient(158deg, rgba(9,32,52,.72), rgba(4,17,30,.5));
    --line:rgba(120,205,235,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Space Grotesk',system-ui,sans-serif;
    color:var(--ink); overflow:hidden;
    background:radial-gradient(130% 120% at 50% 10%, #12406f 0%, #0a2b50 42%, #04142b 100%);
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
  .vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(120% 95% at 50% 34%, transparent 55%, rgba(1,8,18,.55) 100%)}

  /* ---- shared glass panel ---- */
  .panel{
    position:fixed;z-index:5;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;
    padding:18px 20px;backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);
    box-shadow:0 20px 55px -22px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  /* ---- brand ---- */
  .brand{top:20px;left:20px;display:flex;gap:13px;align-items:center;padding:12px 18px 12px 14px}
  .brand-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%, rgba(62,230,200,.35), rgba(90,169,255,.12));
    border:1px solid var(--line);box-shadow:0 0 22px -6px rgba(62,230,200,.6)}
  .brand-mark svg{width:26px;height:26px;animation:sway 3.4s ease-in-out infinite;transform-origin:bottom center}
  @keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  .brand-text h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:23px;line-height:.95;letter-spacing:-.02em}
  .brand-text p{font-size:10.5px;text-transform:uppercase;letter-spacing:.2em;color:var(--dim);margin-top:5px}

  /* ---- stats ---- */
  .stats{top:20px;right:20px;display:flex;gap:22px;padding:14px 22px;animation-delay:.08s}
  .stat{text-align:right}
  .stat-num{display:block;font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;line-height:1;
    font-variant-numeric:tabular-nums}
  .stat-label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--dim);margin-top:6px}
  .stat.fish .stat-num{color:var(--aqua)} .stat.feed .stat-num{color:var(--gold)} .stat.fps .stat-num{color:var(--blue)}

  /* ---- controls ---- */
  .controls{left:20px;bottom:20px;width:252px;animation-delay:.16s}
  .controls h2{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--dim);margin-bottom:14px;
    display:flex;align-items:center;gap:8px}
  .controls h2::before{content:"";width:14px;height:2px;background:var(--aqua);border-radius:2px}
  .btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;
    font-family:'Space Grotesk';font-weight:600;font-size:13.5px;color:var(--ink);
    padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
    transition:transform .18s, box-shadow .25s, border-color .25s, background .25s}
  .btn+.btn{margin-top:9px}
  .btn:hover{transform:translateY(-2px);border-color:rgba(120,205,235,.4);box-shadow:0 10px 26px -12px rgba(62,230,200,.55)}
  .btn:active{transform:translateY(0)}
  .btn .ic{font-size:18px;transition:transform .3s}
  .btn:hover .ic{transform:scale(1.25) rotate(-8deg)}
  .btn .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(62,230,200,.16);color:var(--aqua)}
  .btn.feed{background:linear-gradient(180deg, rgba(255,209,102,.16), rgba(255,122,89,.09));border-color:rgba(255,209,102,.3)}
  .btn.feed .badge{background:rgba(255,209,102,.2);color:var(--gold)}
  .btn.light .badge.on{background:rgba(62,230,200,.2);color:var(--aqua)}
  .btn.light .badge.off{background:rgba(120,160,180,.18);color:var(--dim)}

  /* ---- legend ---- */
  .legend{right:20px;bottom:20px;width:186px;animation-delay:.24s}
  .legend h2{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--dim);margin-bottom:12px}
  .legend ul{list-style:none}
  .legend li{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim);padding:3px 0}
  .legend .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}

  /* ---- hint ---- */
  .hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;
    font-size:12.5px;letter-spacing:.04em;color:var(--dim);
    background:rgba(4,17,30,.42);border:1px solid var(--line);border-radius:999px;padding:8px 18px;
    backdrop-filter:blur(8px);animation:rise .7s .3s both;transition:opacity .6s}
  .hint b{color:var(--aqua);font-weight:600}

  @media (max-width:860px){
    .legend{display:none}
    .brand-text p{display:none}
    .stats{gap:16px;padding:12px 16px}
    .stat-num{font-size:24px}
    .controls{width:auto;right:20px;left:20px}
    .btn{padding:11px 13px;font-size:12.5px}
    .hint{display:none}
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <header class="panel brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M2 12c3-6 9-6 12 0s9 6 12 0" stroke="#3ee6c8" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2.4" fill="#ff7a59"/></svg>
    </div>
    <div class="brand-text">
      <h1>Аквариум</h1>
      <p>трёхмерный · живой</p>
    </div>
  </header>

  <section class="panel stats">
    <div class="stat fish"><span class="stat-num" id="statFish">0</span><span class="stat-label">рыбок</span></div>
    <div class="stat feed"><span class="stat-num" id="statFeed">0</span><span class="stat-label">съедено</span></div>
    <div class="stat fps"><span class="stat-num" id="statFps">60</span><span class="stat-label">fps</span></div>
  </section>

  <section class="panel controls">
    <h2>Управление</h2>
    <button class="btn feed" id="btnFeed"><span>Кормить</span><span class="badge" id="feedCount">×0</span></button>
    <button class="btn" id="btnAdd"><span>Добавить рыбку</span><span class="ic">＋</span></button>
    <button class="btn" id="btnBubbles"><span>Больше пузырей</span><span class="ic">＋</span></button>
    <button class="btn light" id="btnLight"><span>Свет</span><span class="badge on" id="lightState">ВКЛ</span></button>
  </section>

  <aside class="panel legend">
    <h2>Цвета</h2>
    <ul>
      <li><span class="dot" style="color:#ff8a3d;background:#ff8a3d"></span>Оранжевая</li>
      <li><span class="dot" style="color:#3aa0ff;background:#3aa0ff"></span>Синяя</li>
      <li><span class="dot" style="color:#ffd23f;background:#ffd23f"></span>Жёлто-красная</li>
      <li><span class="dot" style="color:#b06bff;background:#b06bff"></span>Фиолетовая</li>
      <li><span class="dot" style="color:#ff5a5a;background:#ff5a5a"></span>Красная</li>
      <li><span class="dot" style="color:#5fd37a;background:#5fd37a"></span>Зелёная</li>
      <li><span class="dot" style="color:#ff8fb0;background:#ff8fb0"></span>Розовая</li>
      <li><span class="dot" style="color:#ffcf5a;background:#ffcf5a"></span>Золотая</li>
    </ul>
  </aside>

  <div class="hint">Вращайте мышью · колесо — зум · <b>клик по воде</b> — кормить рыбок</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  "use strict";
  const TAU = Math.PI*2;
  const rand = (a,b)=>a+Math.random()*(b-a);
  const clamp = (v,a,b)=>v<a?a:v>b?b:v;
  const lerpAngle = (a,b,t)=>{let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return a+d*t;};

  // ---------- Renderer / Scene / Camera ----------
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a2b50);
  scene.fog = new THREE.FogExp2(0x0a2b50, 0.010);

  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(24, 15, 34);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.06;
  controls.minDistance = 10; controls.maxDistance = 60;
  controls.maxPolarAngle = Math.PI/1.8;
  controls.target.set(0, 4, 0);
  controls.autoRotate = true; controls.autoRotateSpeed = 0.35;
  let idleTimer;
  controls.addEventListener('start', ()=>{controls.autoRotate=false; clearTimeout(idleTimer);});
  controls.addEventListener('end',   ()=>{idleTimer=setTimeout(()=>controls.autoRotate=true, 5000);});

  // ---------- Tank bounds ----------
  const W=36,H=24,D=20, HW=W/2, HH=H/2, HD=D/2;
  const BOUND={x:HW-1.6, y:[1.8,HH-1.4], z:HD-1.6};

  // ---------- Lights ----------
  scene.add(new THREE.AmbientLight(0x404040, 0.4));
  const hemi = new THREE.HemisphereLight(0x8fd0ff, 0x0a2233, 0.45); scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xbfe6ff, 1.1);
  dir.position.set(16, 34, 14); dir.castShadow = true;
  dir.shadow.mapSize.set(2048,2048);
  dir.shadow.camera.near=1; dir.shadow.camera.far=90;
  dir.shadow.camera.left=-28; dir.shadow.camera.right=28;
  dir.shadow.camera.top=28; dir.shadow.camera.bottom=-28;
  dir.shadow.bias=-0.0004; dir.shadow.radius=4;
  scene.add(dir);

  const pl1 = new THREE.PointLight(0x33ccff, 0.7, 70); pl1.position.set(-10, 16, 8); scene.add(pl1);
  const pl2 = new THREE.PointLight(0x2266ff, 0.6, 70); pl2.position.set(12, 8, -8); scene.add(pl2);

  // ---------- Glass tank ----------
  const tankGeo = new THREE.BoxGeometry(W,H,D);
  const tankMat = new THREE.MeshPhysicalMaterial({
    color:0xcfeeff, metalness:0, roughness:0.06, transmission:0.95,
    thickness:2.5, ior:1.33, clearcoat:1, clearcoatRoughness:0.12,
    transparent:true, opacity:0.28, side:THREE.DoubleSide, envMapIntensity:1.1
  });
  const tank = new THREE.Mesh(tankGeo, tankMat);
  tank.renderOrder = 10; scene.add(tank);
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(tankGeo),
    new THREE.LineBasicMaterial({color:0x8fd8ff, transparent:true, opacity:0.5})
  );
  scene.add(edges);

  // ---------- Sand floor ----------
  const sandGeo = new THREE.PlaneGeometry(W-1.5, D-1.5, 44, 34);
  {
    const p = sandGeo.attributes.position;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i), y=p.getY(i);
      p.setZ(i, Math.sin(x*0.5)*0.25 + Math.cos(y*0.7)*0.2 + Math.sin((x+y)*0.35)*0.15);
    }
    sandGeo.computeVertexNormals();
  }
  const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({color:0xd8c193, roughness:1, metalness:0}));
  sand.rotation.x = -Math.PI/2; sand.position.y = -HH+0.35; sand.receiveShadow = true; scene.add(sand);

  // ---------- Rocks ----------
  const rockColors=[0x5b6672,0x6f6a5c,0x4a5560,0x7a7466,0x54606b,0x8a7f6a];
  for(let i=0;i<8;i++){
    const g = new THREE.DodecahedronGeometry(rand(1.1,2.2),0);
    const p = g.attributes.position;
    for(let j=0;j<p.count;j++){
      const s=0.82+Math.random()*0.36;
      p.setXYZ(j, p.getX(j)*s, p.getY(j)*(s*rand(0.7,1)), p.getZ(j)*s);
    }
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:rockColors[i%rockColors.length], roughness:0.95, flatShading:true}));
    m.position.set(rand(-HW+3,HW-3), -HH+0.6+rand(0,0.6), rand(-HD+3,HD-3));
    m.rotation.set(rand(0,TAU),rand(0,TAU),rand(0,TAU));
    m.scale.y*=rand(0.7,1); m.castShadow=m.receiveShadow=true; scene.add(m);
  }

  // ---------- Seaweed ----------
  const weeds=[];
  for(let i=0;i<12;i++){
    const pts=[], n=6, hgt=rand(3.5,8);
    for(let k=0;k<=n;k++){
      const t=k/n;
      pts.push(new THREE.Vector3(
        Math.sin(t*3+i)*0.3*t, t*hgt, Math.cos(t*2.4+i)*0.3*t
      ));
    }
    const curve=new THREE.CatmullRomCurve3(pts);
    const geo=new THREE.TubeGeometry(curve, 22, 0.12+hgt*0.012, 6, false);
    const mat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.33+rand(-0.04,0.06),0.6,rand(0.3,0.45)), roughness:0.8, side:THREE.DoubleSide});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(rand(-HW+3,HW-3), -HH+0.3, rand(-HD+3,HD-3));
    mesh.castShadow=true; scene.add(mesh);
    weeds.push({mesh, baseX:mesh.rotation.x, baseZ:mesh.rotation.z, phase:rand(0,TAU), speed:rand(0.5,1.2), amp:rand(0.08,0.2)});
  }

  // ---------- Bubbles ----------
  const bubbleMat = new THREE.MeshPhysicalMaterial({color:0xffffff, metalness:0, roughness:0.02, transmission:0.9, thickness:0.6, ior:1.33, clearcoat:1, transparent:true, opacity:0.35});
  const bubbles=[];
  function addBubble(){
    const r=rand(0.12,0.4);
    const b=new THREE.Mesh(new THREE.SphereGeometry(r,10,10), bubbleMat);
    b.position.set(rand(-HW+2,HW-2), rand(-HH+1,HH-1), rand(-HD+2,HD-2));
    b.userData={speed:rand(1.2,2.6), phase:rand(0,TAU), amp:rand(0.2,0.5), baseX:b.position.x, baseZ:b.position.z, r};
    scene.add(b); bubbles.push(b);
  }
  for(let i=0;i<30;i++) addBubble();

  // ---------- Caustics (animated texture on the sand) ----------
  const causticCanvas=document.createElement('canvas'); causticCanvas.width=causticCanvas.height=256;
  const cctx=causticCanvas.getContext('2d');
  const causticTex=new THREE.CanvasTexture(causticCanvas);
  causticTex.wrapS=causticTex.wrapT=THREE.RepeatWrapping; causticTex.repeat.set(3,3);
  function drawCaustics(t){
    cctx.clearRect(0,0,256,256);
    cctx.globalCompositeOperation='lighter';
    for(let i=0;i<26;i++){
      const x=(Math.sin(t*0.6+i*1.3)*0.5+0.5)*256;
      const y=(Math.cos(t*0.5+i*0.9)*0.5+0.5)*256;
      const r=18+Math.sin(t*1.4+i)*8;
      const g=cctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(200,240,255,0.28)'); g.addColorStop(1,'rgba(200,240,255,0)');
      cctx.fillStyle=g; cctx.beginPath(); cctx.arc(x,y,r,0,TAU); cctx.fill();
    }
    cctx.globalCompositeOperation='source-over';
    causticTex.needsUpdate=true;
  }
  const causticMat=new THREE.MeshBasicMaterial({map:causticTex, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false});
  const causticPlane=new THREE.Mesh(new THREE.PlaneGeometry(W-2,D-2), causticMat);
  causticPlane.rotation.x=-Math.PI/2; causticPlane.position.y=-HH+0.5; causticPlane.renderOrder=2; scene.add(causticPlane);

  // ---------- Fish factory ----------
  const PALETTE=[
    {name:'orange',      main:0xff8a3d, fin:0xffb066},
    {name:'blue',        main:0x3aa0ff, fin:0x8fd0ff},
    {name:'yellowred',   main:0xffd23f, fin:0xff5a3c},
    {name:'purple',      main:0xb06bff, fin:0xd9b3ff},
    {name:'red',         main:0xff5a5a, fin:0xff9a8a},
    {name:'green',       main:0x5fd37a, fin:0xaef0b8},
    {name:'pink',        main:0xff8fb0, fin:0xffc2d2},
    {name:'gold',        main:0xffcf5a, fin:0xfff0b0}
  ];
  const fishArray=[];

  function createFish(palette, scale){
    palette = palette || PALETTE[Math.floor(Math.random()*PALETTE.length)];
    scale = scale || rand(0.6,1.2);
    const g = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({color:palette.main, roughness:0.4, metalness:0.15, emissive:palette.main, emissiveIntensity:0.12});
    const finMat  = new THREE.MeshStandardMaterial({color:palette.fin, roughness:0.5, metalness:0.05, transparent:true, opacity:0.85, side:THREE.DoubleSide, emissive:palette.fin, emissiveIntensity:0.08});

    const body = new THREE.Mesh(new THREE.SphereGeometry(1,20,16), bodyMat);
    body.scale.set(2.0,1.15,0.75); body.castShadow=true; g.add(body);

    const snout = new THREE.Mesh(new THREE.SphereGeometry(0.5,12,10), bodyMat);
    snout.scale.set(1.3,0.9,0.8); snout.position.set(1.85,0.05,0); g.add(snout);

    const eyeGeo=new THREE.SphereGeometry(0.24,12,12), pupilGeo=new THREE.SphereGeometry(0.12,10,10);
    const eyeMat=new THREE.MeshStandardMaterial({color:0xf5faff,roughness:0.2}), pupilMat=new THREE.MeshStandardMaterial({color:0x0a0a12,roughness:0.3});
    [-1,1].forEach(s=>{
      const e=new THREE.Mesh(eyeGeo,eyeMat); e.position.set(1.15,0.3,s*0.5); g.add(e);
      const pu=new THREE.Mesh(pupilGeo,pupilMat); pu.position.set(1.28,0.3,s*0.56); g.add(pu);
    });

    const tailPivot=new THREE.Group(); tailPivot.position.set(-1.7,0,0); g.add(tailPivot);
    const tail=new THREE.Mesh(new THREE.ConeGeometry(0.55,1.4,10), finMat);
    tail.rotation.z=Math.PI/2; tail.position.x=-0.7; tailPivot.add(tail);

    const dorsal=new THREE.Mesh(new THREE.CircleGeometry(0.6,12), finMat);
    dorsal.scale.set(1.1,0.7,1); dorsal.position.set(-0.2,0.9,0); dorsal.rotation.x=-Math.PI/2; g.add(dorsal);

    const leftFin=new THREE.Group(); leftFin.position.set(0.2,-0.1,-0.6); g.add(leftFin);
    const lf=new THREE.Mesh(new THREE.CircleGeometry(0.45,12),finMat); lf.scale.set(1.2,0.7,1); lf.rotation.x=Math.PI/2; lf.position.z=-0.35; leftFin.add(lf);
    const rightFin=new THREE.Group(); rightFin.position.set(0.2,-0.1,0.6); g.add(rightFin);
    const rf=new THREE.Mesh(new THREE.CircleGeometry(0.45,12),finMat); rf.scale.set(1.2,0.7,1); rf.rotation.x=Math.PI/2; rf.position.z=0.35; rightFin.add(rf);

    const ventral=new THREE.Mesh(new THREE.CircleGeometry(0.35,10),finMat);
    ventral.scale.set(1,0.6,1); ventral.position.set(0.6,-0.85,0); ventral.rotation.x=Math.PI/2; g.add(ventral);

    g.scale.setScalar(scale);
    g.position.set(rand(-HW+4,HW-4), rand(-HH+3,HH-3), rand(-HD+4,HD-4));
    const v=new THREE.Vector3(rand(-1,1),rand(-1,1),rand(-1,1)).normalize();
    g.lookAt(g.position.clone().add(v));
    scene.add(g);

    fishArray.push({
      mesh:g, tail:tailPivot, leftFin, rightFin,
      velocity:v, speed:rand(2.2,3.6), tailSpeed:rand(6,10),
      phase:rand(0,TAU), wanderPhase:rand(0,TAU),
      targetFood:null, avoidanceRadius:rand(2.2,3.4), scale
    });
  }
  for(let i=0;i<15;i++) createFish();

  // ---------- Food ----------
  const foodArray=[];
  const foodGeo=new THREE.IcosahedronGeometry(0.32,0);
  const foodMats=[
    new THREE.MeshStandardMaterial({color:0xff7a3c,emissive:0xff5522,emissiveIntensity:0.5,roughness:0.5}),
    new THREE.MeshStandardMaterial({color:0xffd15a,emissive:0xffb020,emissiveIntensity:0.5,roughness:0.5}),
    new THREE.MeshStandardMaterial({color:0xff5a7a,emissive:0xff2255,emissiveIntensity:0.5,roughness:0.5})
  ];
  function spawnFood(pos){
    const f=new THREE.Mesh(foodGeo, foodMats[Math.floor(Math.random()*foodMats.length)]);
    f.position.copy(pos);
    f.userData={vy:rand(-1,0), life:0, eaten:false};
    scene.add(f); foodArray.push(f);
  }

  // ---------- Interaction (raycast feeding) ----------
  const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
  let down=null;
  canvas.addEventListener('pointerdown', e=>{ down={x:e.clientX,y:e.clientY,t:performance.now()}; });
  canvas.addEventListener('pointerup', e=>{
    if(!down) return;
    const moved=Math.hypot(e.clientX-down.x, e.clientY-down.y);
    const dt=performance.now()-down.t; down=null;
    if(moved<6 && dt<400){
      pointer.x=(e.clientX/innerWidth)*2-1;
      pointer.y=-(e.clientY/innerHeight)*2+1;
      raycaster.setFromCamera(pointer,camera);
      const hits=raycaster.intersectObject(tank,false);
      if(hits.length){
        const p=hits[0].point;
        p.x=clamp(p.x,-HW+1.5,HW-1.5); p.y=clamp(p.y,-HH+1.5,HH-1.5); p.z=clamp(p.z,-HD+1.5,HD-1.5);
        spawnFood(p);
      }
    }
  });

  // ---------- UI ----------
  const el=id=>document.getElementById(id);
  let feedCount=0, lightOn=true;
  el('btnFeed').onclick=()=>{
    for(let i=0;i<5;i++){
      const p=new THREE.Vector3(rand(-HW+3,HW-3), HH-2.5, rand(-HD+3,HD-3));
      spawnFood(p);
    }
    feedCount++; el('feedCount').textContent='×'+feedCount;
  };
  el('btnAdd').onclick=()=>createFish();
  el('btnBubbles').onclick=()=>{ for(let i=0;i<10;i++) addBubble(); };
  el('btnLight').onclick=()=>{
    lightOn=!lightOn;
    dir.intensity=lightOn?1.1:0.35; hemi.intensity=lightOn?0.45:0.22;
    const b=el('lightState'); b.textContent=lightOn?'ВКЛ':'ВЫКЛ'; b.className='badge '+(lightOn?'on':'off');
  };

  // ---------- Update loops ----------
  function updateFish(dt,t){
    for(const f of fishArray){
      const pos=f.mesh.position, vel=f.velocity;

      // food seeking
      let nearest=null, nd=Infinity;
      if(foodArray.length){
        for(const fd of foodArray){
          if(fd.userData.eaten) continue;
          const d=fd.position.distanceToSquared(pos);
          if(d<225 && d<nd){ nd=d; nearest=fd; }
        }
      }
      f.targetFood=nearest;

      // wander
      f.wanderPhase+=dt*0.6;
      vel.x+=Math.sin(f.wanderPhase+f.phase)*0.6*dt;
      vel.y+=Math.cos(f.wanderPhase*0.8+f.phase)*0.4*dt;
      vel.z+=Math.sin(f.wanderPhase*1.1+f.phase*1.3)*0.6*dt;

      // avoid other fish
      for(const o of fishArray){
        if(o===f) continue;
        const dx=pos.x-o.mesh.position.x, dy=pos.y-o.mesh.position.y, dz=pos.z-o.mesh.position.z;
        const d2=dx*dx+dy*dy+dz*dz, ar=f.avoidanceRadius;
        if(d2<ar*ar && d2>1e-4){
          const d=Math.sqrt(d2), push=(ar-d)/ar*3.0;
          vel.x+=dx/d*push*dt; vel.y+=dy/d*push*dt; vel.z+=dz/d*push*dt;
        }
      }

      // walls (soft steering)
      const mx=BOUND.x, mz=BOUND.z, myLo=BOUND.y[0], myHi=BOUND.y[1];
      if(pos.x>mx-1.5) vel.x-=(pos.x-(mx-1.5))*2*dt; else if(pos.x<-(mx-1.5)) vel.x-=(pos.x+(mx-1.5))*2*dt;
      if(pos.z>mz-1.5) vel.z-=(pos.z-(mz-1.5))*2*dt; else if(pos.z<-(mz-1.5)) vel.z-=(pos.z+(mz-1.5))*2*dt;
      if(pos.y>myHi-1.5) vel.y-=(pos.y-(myHi-1.5))*2*dt; else if(pos.y<myLo+1.5) vel.y-=(pos.y-(myLo+1.5))*2*dt;

      // food attraction
      if(nearest){
        const dir=nearest.position.clone().sub(pos).normalize();
        vel.lerp(dir, 0.06);
        if(pos.distanceTo(nearest.position)<1.2){
          nearest.userData.eaten=true;
          f.scale=Math.min(f.scale*1.05, 2.2);
          feedCount++; el('statFeed').textContent=feedCount;
        }
      }

      // normalize to individual speed
      const sp=f.speed*(nearest?1.6:1);
      if(vel.lengthSq()>1e-6) vel.setLength(sp);
      pos.addScaledVector(vel, dt);

      // hard clamp
      pos.x=clamp(pos.x,-mx,mx); pos.y=clamp(pos.y,myLo,myHi); pos.z=clamp(pos.z,-mz,mz);

      // orientation
      if(vel.lengthSq()>0.0001){
        const look=pos.clone().add(vel);
        f.mesh.lookAt(look);
        f.mesh.rotateY(Math.PI); // face forward
      }
      // gentle bob
      f.mesh.position.y += Math.sin(t*2+f.phase)*0.0015;

      // tail & fins
      f.tail.rotation.y = Math.sin(t*f.tailSpeed+f.phase)*0.55;
      f.leftFin.rotation.z  = Math.sin(t*f.tailSpeed*0.9+f.phase)*0.35;
      f.rightFin.rotation.z = Math.sin(t*f.tailSpeed*0.9+f.phase+Math.PI)*0.35;

      f.mesh.scale.setScalar(f.scale);
    }
  }

  function updateFood(dt){
    for(let i=foodArray.length-1;i>=0;i--){
      const f=foodArray[i], u=f.userData;
      if(u.eaten){ scene.remove(f); foodArray.splice(i,1); continue; }
      u.vy-=9*dt; u.vy=Math.max(u.vy,-6);
      f.position.y+=u.vy*dt;
      f.position.x+=Math.sin(t*3+f.id||0)*0.002;
      u.life+=dt;
      f.rotation.y+=dt*2; f.rotation.x+=dt*1.2;
      if(f.position.y<=-HH+0.6){ scene.remove(f); foodArray.splice(i,1); }
      else if(u.life>14){ scene.remove(f); foodArray.splice(i,1); }
    }
  }

  function updateBubbles(dt,t){
    for(const b of bubbles){
      const u=b.userData;
      b.position.y+=u.speed*dt;
      b.position.x=u.baseX+Math.sin(t*1.5+u.phase)*u.amp;
      b.position.z=u.baseZ+Math.cos(t*1.2+u.phase)*u.amp;
      const s=1+((b.position.y+HH)/(2*HH))*0.35;
      b.scale.setScalar(s);
      if(b.position.y>HH-0.4){
        b.position.set(rand(-HW+2,HW-2), -HH+0.6, rand(-HD+2,HD-2));
        u.baseX=b.position.x; u.baseZ=b.position.z;
      }
    }
  }

  function updateWeeds(t){
    for(const w of weeds){
      w.mesh.rotation.x=w.baseX+Math.sin(t*w.speed+w.phase)*w.amp;
      w.mesh.rotation.z=w.baseZ+Math.cos(t*w.speed*0.8+w.phase)*w.amp;
    }
  }

  // ---------- Stats ----------
  let frames=0, lastFps=performance.now();
  function tickStats(now){
    frames++;
    if(now-lastFps>=500){
      el('statFps').textContent=Math.round(frames*1000/(now-lastFps));
      el('statFish').textContent=fishArray.length;
      frames=0; lastFps=now;
    }
  }

  // ---------- Loop ----------
  let last=performance.now();
  function animate(now){
    requestAnimationFrame(animate);
    let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05;
    const t=now/1000;
    drawCaustics(t);
    updateFish(dt,t);
    updateFood(dt);
    updateBubbles(dt,t);
    updateWeeds(t);
    controls.update();
    renderer.render(scene,camera);
    tickStats(now);
  }
  requestAnimationFrame(animate);

  // ---------- Resize ----------
  addEventListener('resize', ()=>{
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  // initial stats
  el('statFish').textContent=fishArray.length;
})();
</script>
</body>
</html>
