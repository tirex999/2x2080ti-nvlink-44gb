<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low-Poly Hamster Playground</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f6efe4;
    font:14px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;color:#3a2f26}
  #hud{position:fixed;left:14px;top:12px;z-index:10;pointer-events:none;
    background:rgba(255,252,246,.84);border:1px solid #e0d5c6;border-radius:10px;
    padding:9px 12px;box-shadow:0 6px 18px -12px rgba(0,0,0,.5)}
  #hud b{display:block;font-size:15px;margin-bottom:3px}
  #hud span{color:#7b6d5e;font-size:12.5px}
  #fps{font-variant-numeric:tabular-nums;font-style:normal}
</style>
</head>
<body>
<div id="hud">
  <b>Low-Poly Hamster Playground</b>
  <span>drag to rotate &middot; scroll to zoom &middot; <i id="fps">--</i> fps</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ============================================================ scene, camera
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6efe4);
scene.fog = new THREE.Fog(0xf6efe4, 28, 55);

const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 200);
camera.position.set(11, 8.5, 13);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 6;
controls.maxDistance = 34;

// ==================================================================== lights
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c9b4, 0.7));

const sun = new THREE.DirectionalLight(0xfff3e0, 0.95);
sun.position.set(9, 15, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -16;
sun.shadow.camera.right = 16;
sun.shadow.camera.top = 16;
sun.shadow.camera.bottom = -16;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 44;
sun.shadow.bias = -0.0012;
scene.add(sun);

const fill = new THREE.PointLight(0xffd9a8, 0.3, 30);
fill.position.set(-7, 6, -5);
scene.add(fill);

// ================================================================== helpers
function flat(color) {
  // Phong, а не Lambert: в r128 flatShading есть только у Phong/Standard,
  // и без него гранёный лоу-поли вид не получается вовсе.
  return new THREE.MeshPhongMaterial({ color: color, flatShading: true,
                                       shininess: 6, specular: 0x1a1a1a });
}
const MAT = {
  table:  new THREE.MeshLambertMaterial({ color: 0xc9b295 }),
  tray:   flat(0xe8dcc6),
  litter: flat(0xdcc79b),
  bar:    new THREE.MeshPhongMaterial({ color: 0xb9c2cc, shininess: 70, flatShading: true }),
  wheel:  flat(0xff9f68),
  spoke:  flat(0xffc79a),
  tread:  flat(0xffd9b0),
  tunnel: flat(0x7fc4d8),
  bowl:   flat(0x6fbf8e),
  seed:   flat(0xd8a24a),
  eye:    flat(0x2a211c),
  nose:   flat(0xff8fa3),
};

// The whole playground lives under one group, so it can be nudged as a unit.
const world = new THREE.Group();
scene.add(world);

// ============================================================= table + tray
const table = new THREE.Mesh(new THREE.BoxGeometry(30, 0.6, 30), MAT.table);
table.position.y = -0.3;
table.receiveShadow = true;
world.add(table);

const CAGE = { w: 13, d: 9, h: 4.4 };

const tray = new THREE.Mesh(new THREE.BoxGeometry(CAGE.w, 0.7, CAGE.d), MAT.tray);
tray.position.y = 0.35;
tray.castShadow = true;
tray.receiveShadow = true;
world.add(tray);

// Bedding: a slightly uneven litter surface, so the floor does not read as a slab.
const litter = new THREE.Mesh(
  new THREE.PlaneGeometry(CAGE.w - 0.5, CAGE.d - 0.5, 22, 16), MAT.litter);
litter.rotation.x = -Math.PI / 2;
litter.position.y = 0.71;
const lp = litter.geometry.attributes.position;
for (let i = 0; i < lp.count; i++) {
  lp.setZ(i, (Math.sin(i * 1.7) + Math.cos(i * 0.9)) * 0.045);
}
litter.geometry.computeVertexNormals();
litter.receiveShadow = true;
world.add(litter);

// Four little tray walls, so hamsters visually sit inside a container.
const WALL = 0.45;
[[0, (CAGE.d - WALL) / 2], [0, -(CAGE.d - WALL) / 2]].forEach(function (p) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(CAGE.w, 0.9, WALL), MAT.tray);
  m.position.set(p[0], 0.9, p[1]);
  m.castShadow = true; m.receiveShadow = true;
  world.add(m);
});
[[(CAGE.w - WALL) / 2, 0], [-(CAGE.w - WALL) / 2, 0]].forEach(function (p) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(WALL, 0.9, CAGE.d), MAT.tray);
  m.position.set(p[0], 0.9, p[1]);
  m.castShadow = true; m.receiveShadow = true;
  world.add(m);
});

// ================================================================== the cage
// Vertical bars on all four sides plus a lid frame — this is what makes the
// scene read as a cage rather than a sandbox.
const cage = new THREE.Group();
world.add(cage);

const barGeo = new THREE.CylinderGeometry(0.05, 0.05, CAGE.h, 6);
function bar(x, z) {
  const m = new THREE.Mesh(barGeo, MAT.bar);
  m.position.set(x, 1.3 + CAGE.h / 2, z);
  m.castShadow = true;
  cage.add(m);
}
const STEP = 0.62;
for (let x = -CAGE.w / 2 + 0.3; x <= CAGE.w / 2 - 0.3; x += STEP) {
  bar(x, CAGE.d / 2 - 0.25);
  bar(x, -CAGE.d / 2 + 0.25);
}
for (let z = -CAGE.d / 2 + 0.3; z <= CAGE.d / 2 - 0.3; z += STEP) {
  bar(CAGE.w / 2 - 0.25, z);
  bar(-CAGE.w / 2 + 0.25, z);
}

// Horizontal rails top and bottom tie the bars together.
function rail(y) {
  const g = new THREE.Group();
  const long = new THREE.BoxGeometry(CAGE.w - 0.4, 0.12, 0.12);
  const short = new THREE.BoxGeometry(0.12, 0.12, CAGE.d - 0.4);
  [CAGE.d / 2 - 0.25, -CAGE.d / 2 + 0.25].forEach(function (z) {
    const m = new THREE.Mesh(long, MAT.bar); m.position.set(0, y, z); g.add(m);
  });
  [CAGE.w / 2 - 0.25, -CAGE.w / 2 + 0.25].forEach(function (x) {
    const m = new THREE.Mesh(short, MAT.bar); m.position.set(x, y, 0); g.add(m);
  });
  return g;
}
cage.add(rail(1.4));
cage.add(rail(1.3 + CAGE.h - 0.1));

// Lid: thin bars across the top.
for (let x = -CAGE.w / 2 + 0.5; x <= CAGE.w / 2 - 0.5; x += STEP * 1.5) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, CAGE.d - 0.5), MAT.bar);
  m.position.set(x, 1.3 + CAGE.h - 0.1, 0);
  cage.add(m);
}

// ============================================================== the wheel
// Interactive object #1. Axis is horizontal (along Z), so the wheel spins the
// way a real hamster wheel does — around its own axle, not around the floor.
const wheel = new THREE.Group();
wheel.position.set(-4.1, 2.25, -1.5);
world.add(wheel);

const R = 1.55, WIDTH = 1.15;
const rimGeo = new THREE.TorusGeometry(R, 0.085, 6, 26);
[-WIDTH / 2, WIDTH / 2].forEach(function (z) {
  const rim = new THREE.Mesh(rimGeo, MAT.wheel);
  rim.position.z = z;
  rim.castShadow = true;
  wheel.add(rim);
});

// Running surface: slats around the inner circumference.
const SLATS = 20;
for (let i = 0; i < SLATS; i++) {
  const a = (i / SLATS) * Math.PI * 2;
  const slat = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.07, WIDTH), MAT.tread);
  slat.position.set(Math.cos(a) * (R - 0.12), Math.sin(a) * (R - 0.12), 0);
  slat.rotation.z = a + Math.PI / 2;
  slat.castShadow = true;
  wheel.add(slat);
}
// Spokes, so rotation is visible even head-on.
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2;
  const sp = new THREE.Mesh(new THREE.BoxGeometry(0.07, R * 2 - 0.2, 0.07), MAT.spoke);
  sp.rotation.z = a;
  sp.position.z = WIDTH / 2;
  wheel.add(sp);
}
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, WIDTH + 0.5, 8), MAT.spoke);
hub.rotation.x = Math.PI / 2;
wheel.add(hub);

// Stand holding the axle.
[-1, 1].forEach(function (s) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.16, 2.1, 0.16), MAT.spoke);
  leg.position.set(0, -R + 0.05 - 0.5, s * (WIDTH / 2 + 0.28));
  leg.castShadow = true;
  wheel.add(leg);
  const foot = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.14, 0.3), MAT.spoke);
  foot.position.set(0, -R - 1.5, s * (WIDTH / 2 + 0.28));
  foot.castShadow = true;
  wheel.add(foot);
});

// ============================================================= tunnel + bowl
const tunnel = new THREE.Group();
tunnel.position.set(3.4, 1.45, 1.9);
tunnel.rotation.y = -0.35;
world.add(tunnel);
const tube = new THREE.Mesh(
  new THREE.CylinderGeometry(0.95, 0.95, 3.4, 12, 1, true), MAT.tunnel);
tube.rotation.z = Math.PI / 2;
tube.castShadow = true;
tube.receiveShadow = true;
tube.material.side = THREE.DoubleSide;
tunnel.add(tube);
[-1.7, 1.7].forEach(function (x) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.09, 6, 14), MAT.bowl);
  ring.position.x = x;
  ring.rotation.y = Math.PI / 2;
  tunnel.add(ring);
});

const bowl = new THREE.Group();
bowl.position.set(4.9, 0.75, -2.5);
world.add(bowl);
const dish = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.62, 0.44, 12), MAT.bowl);
dish.castShadow = true;
dish.receiveShadow = true;
bowl.add(dish);
for (let i = 0; i < 16; i++) {
  const seed = new THREE.Mesh(new THREE.TetrahedronGeometry(0.13), MAT.seed);
  const a = Math.random() * Math.PI * 2, r = Math.random() * 0.6;
  seed.position.set(Math.cos(a) * r, 0.25 + Math.random() * 0.1, Math.sin(a) * r);
  seed.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  seed.castShadow = true;
  bowl.add(seed);
}

// =================================================================== hamster
// One low-poly hamster: body, head, ears, eyes, nose, cheeks, four paws, tail.
function makeHamster(color) {
  const g = new THREE.Group();
  const fur = flat(color);
  const pale = flat(new THREE.Color(color).offsetHSL(0, -0.12, 0.16).getHex());

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.52, 9, 7), fur);
  body.scale.set(1.25, 0.92, 1);
  body.position.y = 0.5;
  body.castShadow = true;
  g.add(body);

  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 6), pale);
  belly.scale.set(1.1, 0.7, 0.85);
  belly.position.set(0.05, 0.34, 0.16);
  g.add(belly);

  const head = new THREE.Group();
  head.position.set(0.62, 0.6, 0);
  g.add(head);

  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.35, 9, 7), fur);
  skull.scale.set(1, 0.94, 0.95);
  skull.castShadow = true;
  head.add(skull);

  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.19, 8, 6), pale);
  muzzle.scale.set(1.15, 0.8, 0.9);
  muzzle.position.set(0.26, -0.07, 0);
  head.add(muzzle);

  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.055, 6, 5), MAT.nose);
  nose.position.set(0.44, -0.04, 0);
  head.add(nose);

  [-1, 1].forEach(function (s) {
    const ear = new THREE.Mesh(new THREE.CircleGeometry(0.15, 7), fur);
    ear.position.set(-0.04, 0.3, s * 0.2);
    ear.rotation.set(0, s * 0.5, -s * 0.25);
    ear.material.side = THREE.DoubleSide;
    head.add(ear);
    const inner = new THREE.Mesh(new THREE.CircleGeometry(0.085, 7), MAT.nose);
    inner.position.set(-0.03, 0.3, s * 0.21);
    inner.rotation.copy(ear.rotation);
    inner.material.side = THREE.DoubleSide;
    head.add(inner);

    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.062, 7, 6), MAT.eye);
    eye.position.set(0.24, 0.06, s * 0.16);
    head.add(eye);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.022, 5, 4), flat(0xffffff));
    glint.position.set(0.285, 0.09, s * 0.175);
    head.add(glint);

    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.14, 7, 6), pale);
    cheek.position.set(0.1, -0.09, s * 0.24);
    head.add(cheek);
  });

  // Paws: front pair animates while running, back pair stays planted.
  const paws = [];
  [[0.34, 0.22], [0.34, -0.22], [-0.32, 0.24], [-0.32, -0.24]].forEach(function (p) {
    const paw = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 5), pale);
    paw.scale.set(1.2, 0.7, 1);
    paw.position.set(p[0], 0.12, p[1]);
    paw.castShadow = true;
    g.add(paw);
    paws.push(paw);
  });

  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.11, 6, 5), pale);
  tail.position.set(-0.68, 0.46, 0);
  g.add(tail);

  g.userData = { head: head, paws: paws, body: body };
  return g;
}

// ============================================================ hamster brains
// Autonomous behaviour: each hamster cycles walk -> pause -> turn, and now and
// then claims a target (wheel, tunnel, bowl). Only one may hold the wheel.
const COLORS = [0xe8a765, 0xf0d3a0, 0xb98a63, 0xf2b8c6, 0xd8d2c4];
const hamsters = [];
const BOUND = { x: CAGE.w / 2 - 1.1, z: CAGE.d / 2 - 1.1 };
let wheelHolder = null;

for (let i = 0; i < 5; i++) {
  const h = makeHamster(COLORS[i]);
  const a = (i / 5) * Math.PI * 2;
  h.position.set(Math.cos(a) * 3.2, 0.72, Math.sin(a) * 2.2);
  h.rotation.y = Math.random() * Math.PI * 2;
  h.scale.setScalar(0.78 + Math.random() * 0.16);
  world.add(h);
  hamsters.push({
    obj: h,
    state: "walk",
    timer: 1 + Math.random() * 2,
    speed: 0.9 + Math.random() * 0.5,
    turn: 0,
    phase: Math.random() * 6.28,
    inWheel: false,
  });
}

// Первый хомяк начинает ВНУТРИ колеса: иначе выбор цели случайный и на
// снимке колесо может оказаться неподвижным — а именно по нему сцену и
// читают. Замер съёмкой это и показал: wheelSpin оставался нулём.
{
  const первый = hamsters[0];
  первый.inWheel = true;
  первый.timer = 9;
  wheelHolder = первый;
}

const WHEEL_DOOR = new THREE.Vector3(-4.1, 0.72, 0.35);
const TUNNEL_AT = new THREE.Vector3(3.4, 0.72, 1.9);
const BOWL_AT = new THREE.Vector3(4.9, 0.72, -1.6);

function pickState(h) {
  const roll = Math.random();
  if (!wheelHolder && roll < 0.3) {
    h.state = "toWheel"; h.timer = 6;
  } else if (roll < 0.5) {
    h.state = "toBowl"; h.timer = 5;
  } else if (roll < 0.66) {
    h.state = "toTunnel"; h.timer = 5;
  } else if (roll < 0.82) {
    h.state = "pause"; h.timer = 0.7 + Math.random() * 1.6;
  } else {
    h.state = "turn";
    h.timer = 0.5 + Math.random() * 0.7;
    h.turn = (Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.random());
  }
}

function goTo(h, target, dt) {
  const o = h.obj;
  const dx = target.x - o.position.x, dz = target.z - o.position.z;
  const dist = Math.hypot(dx, dz);
  const want = Math.atan2(dz, dx);
  let diff = want - o.rotation.y;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  o.rotation.y += Math.max(-3 * dt, Math.min(3 * dt, diff));
  if (dist > 0.35) {
    o.position.x += Math.cos(o.rotation.y) * h.speed * dt;
    o.position.z += Math.sin(o.rotation.y) * h.speed * dt;
  }
  return dist;
}

// Начальная скорость не ноль: первый хомяк стартует внутри колеса,
// поэтому оно вертится с первого же кадра.
let wheelSpin = 0, wheelVel = 3.2;

function stepHamster(h, dt, t) {
  const o = h.obj;
  h.timer -= dt;

  if (h.inWheel) {
    // Runs inside: drives the wheel, bobs, and eventually hops out.
    wheelVel += (3.4 - wheelVel) * dt * 1.4;
    o.position.set(wheel.position.x, wheel.position.y - R + 0.62,
                   wheel.position.z + Math.sin(t * 3) * 0.04);
    // Faces along the running direction (wheel axle is Z, so it runs along X).
    o.rotation.y = 0;
    o.rotation.z = Math.sin(t * 9) * 0.06;
    o.userData.paws[0].position.y = 0.12 + Math.abs(Math.sin(t * 11)) * 0.16;
    o.userData.paws[1].position.y = 0.12 + Math.abs(Math.sin(t * 11 + 3.14)) * 0.16;
    if (h.timer <= 0) {
      h.inWheel = false;
      wheelHolder = null;
      o.rotation.z = 0;
      o.position.copy(WHEEL_DOOR);
      o.position.x += 1.2;
      pickState(h);
      h.timer = 1.2;
    }
    return;
  }

  switch (h.state) {
    case "walk": {
      o.position.x += Math.cos(o.rotation.y) * h.speed * dt;
      o.position.z += Math.sin(o.rotation.y) * h.speed * dt;
      break;
    }
    case "turn": {
      o.rotation.y += h.turn * dt;
      break;
    }
    case "pause": {
      // Sniffing: small head bob while standing still.
      o.userData.head.rotation.z = Math.sin(t * 5 + h.phase) * 0.12;
      break;
    }
    case "toWheel": {
      if (wheelHolder && wheelHolder !== h) { pickState(h); break; }
      wheelHolder = h;
      if (goTo(h, WHEEL_DOOR, dt) < 0.45) {
        h.inWheel = true;
        h.timer = 5 + Math.random() * 5;
      }
      break;
    }
    case "toBowl": {
      if (goTo(h, BOWL_AT, dt) < 0.5) {
        o.userData.head.rotation.z = -0.35 + Math.sin(t * 7) * 0.12;
      }
      break;
    }
    case "toTunnel": {
      if (goTo(h, TUNNEL_AT, dt) < 0.5) {
        o.userData.head.rotation.z = Math.sin(t * 4) * 0.1;
      }
      break;
    }
  }

  // Walking gait: gentle body bob and alternating front paws.
  if (h.state === "walk" || h.state.indexOf("to") === 0) {
    o.position.y = 0.72 + Math.abs(Math.sin(t * 7 + h.phase)) * 0.06;
    o.userData.paws[0].position.y = 0.12 + Math.abs(Math.sin(t * 8 + h.phase)) * 0.1;
    o.userData.paws[1].position.y = 0.12 + Math.abs(Math.sin(t * 8 + h.phase + 3.14)) * 0.1;
  } else {
    o.position.y += (0.72 - o.position.y) * dt * 6;
  }

  // Walls: turn away instead of sliding through the bars.
  if (Math.abs(o.position.x) > BOUND.x || Math.abs(o.position.z) > BOUND.z) {
    o.position.x = Math.max(-BOUND.x, Math.min(BOUND.x, o.position.x));
    o.position.z = Math.max(-BOUND.z, Math.min(BOUND.z, o.position.z));
    o.rotation.y += Math.PI * (0.6 + Math.random() * 0.5);
    h.state = "walk";
    h.timer = 1.2 + Math.random();
  }

  if (h.timer <= 0) {
    if (h.state === "toWheel" && wheelHolder === h) wheelHolder = null;
    pickState(h);
  }
}

// ==================================================================== loop
const clock = new THREE.Clock();
const fpsEl = document.getElementById("fps");
let acc = 0, frames = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  for (let i = 0; i < hamsters.length; i++) stepHamster(hamsters[i], dt, t);

  // Wheel keeps spinning around its own axle and coasts to a stop when empty.
  if (!wheelHolder) wheelVel *= (1 - dt * 0.9);
  wheelSpin += wheelVel * dt;
  wheel.rotation.z = -wheelSpin;

  controls.update();
  renderer.render(scene, camera);

  frames++; acc += dt;
  if (acc >= 0.5) { fpsEl.textContent = Math.round(frames / acc); frames = 0; acc = 0; }
}
animate();

addEventListener("resize", function () {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
