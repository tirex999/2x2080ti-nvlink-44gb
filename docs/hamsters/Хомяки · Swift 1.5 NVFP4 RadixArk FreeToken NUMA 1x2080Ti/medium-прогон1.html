<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe9d6; }
  #ui {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    color: #5a4632; pointer-events: none;
  }
  #ui h1 { margin: 0; font-size: 22px; text-shadow: 0 2px 0 #fff; }
  #ui p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  #fact {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-family: "Segoe UI", sans-serif; font-size: 13px; color: #7a5c42;
    background: rgba(255,255,255,.75); padding: 6px 14px; border-radius: 20px;
    z-index: 10; pointer-events: none; max-width: 80%; text-align: center;
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <h1>🐹 Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; The hamsters have plans</p>
</div>
<div id="fact"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Basics ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe3c9);
scene.fog = new THREE.Fog(0xffe3c9, 30, 70);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(13, 11, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.minDistance = 8;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.49;

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xfff2df, 0x9b86b0, 0.9));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.4);
sun.position.set(10, 16, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14;  sun.shadow.camera.bottom = -14;
scene.add(sun);

// ---------- Helpers ----------
const mat = (color, extra={}) => new THREE.MeshStandardMaterial({ color, flatShading:true, roughness:0.9, ...extra });
function mesh(geo, material, x=0, y=0, z=0, parent=scene) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- Room floor ----------
mesh(new THREE.CylinderGeometry(20, 20, 0.5, 24), mat(0xf3c9a0), 0, -0.25)
  .receiveShadow = true;

// ---------- Tray ----------
const TRAY_R = 9, TRAY_TOP = 0.6;
mesh(new THREE.CylinderGeometry(TRAY_R, TRAY_R*0.96, TRAY_TOP, 26), mat(0x6fd0bb), 0, TRAY_TOP/2);
mesh(new THREE.TorusGeometry(TRAY_R-0.1, 0.16, 5, 26), mat(0x55b9a4), 0, TRAY_TOP, 0)
  .rotation.x = Math.PI/2;

// ---------- Cage bars ----------
const cage = new THREE.Group(); scene.add(cage);
const barMat = mat(0xfff1dc);
for (let i = 0; i < 26; i++) {
  const a = (i / 26) * Math.PI * 2;
  mesh(new THREE.CylinderGeometry(0.09, 0.09, 5.4, 5), barMat,
       Math.cos(a)*(TRAY_R-0.25), TRAY_TOP + 2.7, Math.sin(a)*(TRAY_R-0.25), cage);
}
mesh(new THREE.TorusGeometry(TRAY_R-0.25, 0.18, 5, 26), mat(0xff9d7e), 0, TRAY_TOP+5.4, 0, cage)
  .rotation.x = Math.PI/2;
mesh(new THREE.CylinderGeometry(TRAY_R-0.25, TRAY_R-0.25, 0.15, 26), mat(0xff9d7e), 0, TRAY_TOP+5.55, 0, cage);

// ---------- Bedding (wood shavings) ----------
const chipGeos = [new THREE.BoxGeometry(0.35, 0.08, 0.14), new THREE.BoxGeometry(0.25, 0.08, 0.1)];
const chipMats = [mat(0xe9c98c), mat(0xd9b573), mat(0xf2d9a5)];
for (let i = 0; i < 110; i++) {
  const a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random())*(TRAY_R-0.8);
  const c = mesh(chipGeos[i%2], chipMats[i%3], Math.cos(a)*r, TRAY_TOP+0.04, Math.sin(a)*r);
  c.rotation.set(rand(-0.2,0.2), Math.random()*Math.PI, rand(-0.2,0.2));
  c.castShadow = false;
}

// ---------- Wheel ----------
const WHEEL = new THREE.Vector3(0, 2.8, -6.6);
const WHEEL_R = 2.2;
const wheelSpin = new THREE.Group();
scene.add(wheelSpin);
wheelSpin.position.copy(WHEEL);
mesh(new THREE.TorusGeometry(WHEEL_R, 0.22, 5, 18), mat(0xff7f66), 0, 0, 0, wheelSpin);
mesh(new THREE.TorusGeometry(WHEEL_R, 0.14, 4, 18), mat(0xffa58f), 0, 0, 0, wheelSpin).position.z = 0.45;
for (let i = 0; i < 8; i++) { // spokes
  const a = (i/8)*Math.PI*2;
  const s = mesh(new THREE.CylinderGeometry(0.06, 0.06, WHEEL_R-0.1, 4), mat(0xffd9a0), 0, 0, 0.22, wheelSpin);
  s.rotation.z = a; s.position.x = Math.cos(a)*(WHEEL_R/2-0.05); s.position.y = Math.sin(a)*(WHEEL_R/2-0.05);
}
for (let i = 0; i < 12; i++) { // rungs
  const a = (i/12)*Math.PI*2;
  const r = mesh(new THREE.BoxGeometry(0.14, 0.1, 0.62), mat(0xffe8c2),
                 Math.cos(a)*(WHEEL_R-0.18), Math.sin(a)*(WHEEL_R-0.18), 0.22, wheelSpin);
  r.rotation.z = a + Math.PI/2;
}
mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.2, 6), mat(0x8a6f5a), 0, 0, 0.22, wheelSpin).rotation.x = Math.PI/2;
// Stand
const standMat = mat(0x8a6f5a);
for (const s of [-1, 1]) {
  const p = mesh(new THREE.BoxGeometry(0.3, WHEEL_R+0.9, 0.3), standMat, s*0.75, -WHEEL_R/2-0.1, 0.22);
  p.castShadow = true;
}
mesh(new THREE.BoxGeometry(2.4, 0.3, 1.2), standMat, 0, -WHEEL_R-0.15, 0.22);
let wheelUser = null;

// ---------- Food bowl ----------
const BOWL = new THREE.Vector3(5.6, 0, 3.4);
const bowlG = new THREE.Group(); bowlG.position.copy(BOWL); scene.add(bowlG);
mesh(new THREE.CylinderGeometry(0.95, 0.6, 0.55, 9, 1, true), mat(0xffd166, {side:THREE.DoubleSide}), 0, 0.28, 0, bowlG);
mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.12, 9), mat(0xe8b34e), 0, 0.08, 0, bowlG);
for (let i = 0; i < 9; i++) { // food
  const a = Math.random()*Math.PI*2, r = Math.random()*0.45;
  mesh(new THREE.IcosahedronGeometry(0.14, 0),
       mat([0xc98f4e, 0x9fd06a, 0xe2704a][i%3]), Math.cos(a)*r, 0.42, Math.sin(a)*r, bowlG);
}

// ---------- Tunnel ----------
const tunnel = mesh(new THREE.CylinderGeometry(1.05, 1.05, 3.4, 10, 1, true),
                    mat(0xb79ced, {side:THREE.DoubleSide}), -5, TRAY_TOP+0.98, -2.5);
tunnel.rotation.z = Math.PI/2;
mesh(new THREE.TorusGeometry(1.05, 0.12, 5, 12), mat(0x9b7ce0), -6.7, TRAY_TOP+0.98, -2.5).rotation.y = Math.PI/2;
mesh(new THREE.TorusGeometry(1.05, 0.12, 5, 12), mat(0x9b7ce0), -3.3, TRAY_TOP+0.98, -2.5).rotation.y = Math.PI/2;
const TUNNEL_END = new THREE.Vector3(-3.2, 0, -2.5);

// ---------- Water bottle (decoration) ----------
const bottle = new THREE.Group(); bottle.position.set(6.8, 3.4, -4.6); scene.add(bottle);
mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.7, 8), mat(0xa8e0f5, {transparent:true, opacity:0.75}), 0, 0, 0, bottle);
mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.35, 6), mat(0xd94f4f), 0, 1.0, 0, bottle);
mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.7, 4), mat(0xc0c0c0), 0, -1.1, 0, bottle);

// ---------- Hamsters ----------
const FUR = [0xe8a95c, 0xf5e3c4, 0x9a8f85, 0xffffff, 0xc97e4a, 0xe0b8d8];

function createHamster(furColor, seed) {
  const g = new THREE.Group();
  const fur = mat(furColor);
  const dark = mat(0x3a2b22);

  const body = mesh(new THREE.SphereGeometry(0.55, 7, 5), fur, 0, 0.5, -0.05, g);
  body.scale.set(1.05, 0.92, 1.3);

  const head = mesh(new THREE.SphereGeometry(0.36, 7, 5), fur, 0, 0.72, 0.55, g);
  head.scale.set(1, 0.95, 1.05);
  mesh(new THREE.SphereGeometry(0.1, 5, 4), mat(0xff9e9e), 0, 0.68, 0.9, g);          // nose
  mesh(new THREE.SphereGeometry(0.07, 5, 4), dark, -0.15, 0.8, 0.83, g);              // eyes
  mesh(new THREE.SphereGeometry(0.07, 5, 4), dark,  0.15, 0.8, 0.83, g);
  const cheekL = mesh(new THREE.SphereGeometry(0.16, 5, 4), fur, -0.28, 0.62, 0.72, g); // cheeks
  const cheekR = mesh(new THREE.SphereGeometry(0.16, 5, 4), fur,  0.28, 0.62, 0.72, g);
  cheekL.scale.set(1, 0.9, 1.1); cheekR.scale.set(1, 0.9, 1.1);
  const earL = mesh(new THREE.SphereGeometry(0.14, 5, 4), mat(0xffb6b0), -0.22, 1.02, 0.45, g); // ears
  const earR = mesh(new THREE.SphereGeometry(0.14, 5, 4), mat(0xffb6b0),  0.22, 1.02, 0.45, g);
  earL.scale.set(1, 1, 0.35); earR.scale.set(1, 1, 0.35);
  mesh(new THREE.SphereGeometry(0.1, 5, 4), fur, 0, 0.42, -0.72, g).scale.set(0.7, 0.7, 1.4); // tail

  const legs = [];
  const legPos = [[-0.3, 0.32], [0.3, 0.32], [-0.3, -0.42], [0.3, -0.42]];
  for (const [x, z] of legPos) {
    const pivot = new THREE.Group(); pivot.position.set(x, 0.3, z); g.add(pivot);
    mesh(new THREE.BoxGeometry(0.15, 0.28, 0.18), fur, 0, -0.13, 0, pivot);
    legs.push(pivot);
  }
  return { group: g, legs, head, earL, earR, cheekL, cheekR, seed };
}

const hamsters = [];
const names = ['Peanut', 'Nugget', 'Waffles', 'Biscuit', 'Dumpling', 'Pickles'];
for (let i = 0; i < 6; i++) {
  const h = createHamster(FUR[i], Math.random()*100);
  const a = (i/6)*Math.PI*2, r = rand(2, 6);
  h.group.position.set(Math.cos(a)*r, TRAY_TOP, Math.sin(a)*r);
  scene.add(h.group);
  h.state = 'idle';
  h.timer = rand(0.5, 3);
  h.phase = Math.random()*10;
  h.speed = rand(1.3, 2.0);
  h.target = new THREE.Vector3();
  h.name = names[i];
  hamsters.push(h);
}

// ---------- Behavior ----------
function pickTarget(h) {
  const roll = Math.random();
  if (roll < 0.22 && !wheelUser) { h.target.copy(WHEEL); h.goal = 'wheel'; return; }
  if (roll < 0.45) { h.target.copy(BOWL); h.goal = 'bowl'; return; }
  if (roll < 0.6)  { h.target.copy(TUNNEL_END); h.goal = 'wander'; return; }
  const a = Math.random()*Math.PI*2, r = rand(1.5, 7);
  h.target.set(Math.cos(a)*r, TRAY_TOP, Math.sin(a)*r);
  h.goal = 'wander';
}

function angleLerp(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return a + d * t;
}

function steerTo(h, pos, dt) {
  const p = h.group.position;
  const desired = Math.atan2(pos.x - p.x, pos.z - p.z);
  h.group.rotation.y = angleLerp(h.group.rotation.y, desired, Math.min(1, dt*6));
}

function updateHamster(h, dt, t) {
  const p = h.group.position;
  h.timer -= dt;

  switch (h.state) {
    case 'idle':
      if (h.timer <= 0) { pickTarget(h); h.state = 'walking'; h.timer = rand(6, 14); }
      break;

    case 'walking': {
      steerTo(h, h.target, dt);
      const ry = h.group.rotation.y;
      p.x += Math.sin(ry) * h.speed * dt;
      p.z += Math.cos(ry) * h.speed * dt;
      const dist = Math.hypot(p.x, p.z);
      if (dist > TRAY_R - 1.1) { // wall bounce
        p.x = (p.x/dist)*(TRAY_R-1.1); p.z = (p.z/dist)*(TRAY_R-1.1);
        h.group.rotation.y += rand(1.5, 3.5);
      }
      const d = p.distanceTo(h.target);
      if (h.goal === 'wheel' && d < 2.6 && !wheelUser) {
        wheelUser = h; h.state = 'wheel'; h.timer = rand(6, 12);
      } else if (h.goal === 'bowl' && d < 1.5) {
        h.state = 'eating'; h.timer = rand(3, 6);
      } else if (h.timer <= 0) {
        h.state = 'idle'; h.timer = rand(1, 3);
      }
      break;
    }

    case 'eating':
      steerTo(h, BOWL, dt);
      h.head.rotation.x = Math.sin(t*12) * 0.3;
      h.cheekL.scale.x = h.cheekR.scale.x = 1 + Math.sin(t*12)*0.2;
      if (h.timer <= 0) {
        h.state = 'idle'; h.timer = rand(0.5, 2);
        h.head.rotation.x = 0; h.cheekL.scale.x = h.cheekR.scale.x = 1;
      }
      break;

    case 'wheel':
      p.set(WHEEL.x, TRAY_TOP + 0.05, WHEEL.z);
      h.group.rotation.y = Math.PI/2;
      h.legSwing = 22;
      wheelSpeed = 5.5;
      if (h.timer <= 0) {
        wheelUser = null; h.state = 'idle'; h.timer = rand(0.5, 2);
        p.z = WHEEL.z + 2.8; h.legSwing = 10;
      }
      break;
  }

  // Leg animation
  const swing = h.legSwing || 10;
  h.legSwing = undefined;
  const moving = h.state === 'walking' || h.state === 'wheel';
  if (moving) {
    h.phase += dt * (h.state === 'wheel' ? 18 : 9);
    h.legs.forEach((leg, i) => leg.rotation.x = Math.sin(h.phase + (i%2 ? Math.PI : 0)) * 0.7);
    h.group.position.y = TRAY_TOP + Math.abs(Math.sin(h.phase)) * (h.state==='wheel' ? 0.09 : 0.05);
  } else {
    h.legs.forEach(l => l.rotation.x *= 0.85);
    h.group.position.y = TRAY_TOP + Math.sin(t*2 + h.seed) * 0.015 + 0.01;
  }
  // Ear twitch
  const twitch = Math.sin(t*1.7 + h.seed*3) > 0.96 ? Math.sin(t*25)*0.5 : 0;
  h.earL.rotation.z = twitch; h.earR.rotation.z = -twitch;
}

// ---------- Wheel physics ----------
let wheelSpeed = 0;

// ---------- Fact ticker ----------
const facts = [
  "Hamsters stuff their cheeks to carry snacks home. Very professional.",
  "A hamster's teeth never stop growing. Chew responsibly.",
  "Hamsters can run several miles on a wheel in one night.",
  "The 'thumbs up' pose? That's a hamster checking for predators.",
  "Hamsters have whiskers on their backs. Yes, really.",
  "A hamster's cage should be way bigger than the pet-shop special. We agree."
];
const factEl = document.getElementById('fact');
let fi = 0;
factEl.textContent = facts[0];
setInterval(() => { fi = (fi+1) % facts.length; factEl.textContent = facts[fi]; }, 9000);

// ---------- Loop ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  for (const h of hamsters) updateHamster(h, dt, t);

  wheelSpeed *= (wheelUser ? 1 : 0.96);
  wheelSpin.rotation.z += wheelSpeed * dt;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
