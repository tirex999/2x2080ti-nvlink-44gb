<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe9f0; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 14px; left: 16px;
    font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
    color: #7a4a2b; pointer-events: none; user-select: none;
  }
  #ui h1 { margin: 0; font-size: 22px; }
  #ui p  { margin: 4px 0 0; font-size: 13px; opacity: .8; }
</style>
</head>
<body>
<div id="ui">
  <h1>Low-Poly Hamster Playground</h1>
  <p>Drag to rotate &middot; scroll to zoom &middot; the orange one loves the wheel</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================== SETUP ============================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe9f0);
scene.fog = new THREE.Fog(0xffe9f0, 18, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---------- simple orbit controls (drag + zoom, no extra files) ---------- */
const orbit = { theta: 0.7, phi: 1.05, radius: 10, target: new THREE.Vector3(0, 0.8, 0) };
let dragging = false, px = 0, py = 0;

renderer.domElement.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener('pointerup',   () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  orbit.theta -= (e.clientX - px) * 0.006;
  orbit.phi   -= (e.clientY - py) * 0.006;
  orbit.phi = Math.max(0.25, Math.min(1.45, orbit.phi));
  px = e.clientX; py = e.clientY;
});
renderer.domElement.addEventListener('wheel', e => {
  orbit.radius = Math.max(5, Math.min(16, orbit.radius + e.deltaY * 0.01));
}, { passive: true });

function updateCamera() {
  const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
  camera.position.set(
    orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
    orbit.target.y + orbit.radius * cp,
    orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
  );
  camera.lookAt(orbit.target);
}

/* ============================== LIGHTS ============================== */
scene.add(new THREE.AmbientLight(0xfff2e0, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(6, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -7; sun.shadow.camera.right = 7;
sun.shadow.camera.top = 7;   sun.shadow.camera.bottom = -7;
scene.add(sun);

/* ============================== CAGE ============================== */
const CAGE_W = 8, CAGE_D = 6, CAGE_H = 2.2;

// floor tray
const tray = new THREE.Mesh(
  new THREE.BoxGeometry(CAGE_W, 0.4, CAGE_D),
  new THREE.MeshStandardMaterial({ color: 0xd9a066, flatShading: true })
);
tray.position.y = -0.2;
tray.receiveShadow = true;
scene.add(tray);

// soft bedding mat
const mat = new THREE.Mesh(
  new THREE.BoxGeometry(CAGE_W - 0.5, 0.12, CAGE_D - 0.5),
  new THREE.MeshStandardMaterial({ color: 0xf7d9a8, flatShading: true })
);
mat.position.y = 0.06;
mat.receiveShadow = true;
scene.add(mat);

// pastel rug patch
const rug = new THREE.Mesh(
  new THREE.CylinderGeometry(1.2, 1.2, 0.06, 8),
  new THREE.MeshStandardMaterial({ color: 0xa8e6cf, flatShading: true })
);
rug.position.set(1.8, 0.15, -0.6);
rug.receiveShadow = true;
scene.add(rug);

// glass walls
const glassMat = new THREE.MeshLambertMaterial({
  color: 0xcdeaff, transparent: true, opacity: 0.16, side: THREE.DoubleSide
});
[[0, -CAGE_D/2, 0], [0, CAGE_D/2, 0]].forEach(([x, z]) => {
  const w = new THREE.Mesh(new THREE.PlaneGeometry(CAGE_W, CAGE_H), glassMat);
  w.position.set(x, CAGE_H/2 + 0.1, z);
  scene.add(w);
});
[[-CAGE_W/2, 0, Math.PI/2], [CAGE_W/2, 0, Math.PI/2]].forEach(([x, z, ry]) => {
  const w = new THREE.Mesh(new THREE.PlaneGeometry(CAGE_D, CAGE_H), glassMat);
  w.position.set(x, CAGE_H/2 + 0.1, z);
  w.rotation.y = ry;
  scene.add(w);
});

// wire frame (edges of the cage box)
const frame = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(CAGE_W, CAGE_H, CAGE_D)),
  new THREE.LineBasicMaterial({ color: 0x8899aa })
);
frame.position.y = CAGE_H/2 + 0.1;
scene.add(frame);

/* ============================== OBJECTS ============================== */
// --- food bowl ---
const BOWL_POS = new THREE.Vector3(2.7, 0, 1.7);
const bowl = new THREE.Group();
const dish = new THREE.Mesh(
  new THREE.CylinderGeometry(0.42, 0.3, 0.22, 8),
  new THREE.MeshStandardMaterial({ color: 0xe77f9f, flatShading: true })
);
dish.castShadow = true;
bowl.add(dish);
for (let i = 0; i < 5; i++) {
  const seed = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.06, 0),
    new THREE.MeshStandardMaterial({ color: i % 2 ? 0x7cb342 : 0x8d6e63, flatShading: true })
  );
  const a = i * 1.4;
  seed.position.set(Math.cos(a) * 0.18, 0.12, Math.sin(a) * 0.18);
  bowl.add(seed);
}
bowl.position.copy(BOWL_POS);
scene.add(bowl);

// --- tunnel (half pipe) ---
const TUNNEL_POS = new THREE.Vector3(0, 0, 0);
let tunnelGeo = new THREE.CylinderGeometry(0.45, 0.45, 2.2, 8, 1, true, -Math.PI/2, Math.PI);
tunnelGeo.rotateX(Math.PI / 2); // arc now points up, axis along Z
const tunnel = new THREE.Mesh(
  tunnelGeo,
  new THREE.MeshStandardMaterial({ color: 0x9ecbff, flatShading: true, side: THREE.DoubleSide })
);
tunnel.position.set(TUNNEL_POS.x, 0.45, TUNNEL_POS.z);
tunnel.castShadow = true;
scene.add(tunnel);

// --- exercise wheel ---
const WHEEL_POS = new THREE.Vector3(-2.7, 0, -1.8);
const wheelGroup = new THREE.Group();
const stand = new THREE.Mesh(
  new THREE.BoxGeometry(0.5, 0.5, 0.3),
  new THREE.MeshStandardMaterial({ color: 0xf0b27a, flatShading: true })
);
stand.position.y = 0.25;
stand.castShadow = true;
wheelGroup.add(stand);

const wheelSpin = new THREE.Group(); // this part rotates
const rim = new THREE.Mesh(
  new THREE.TorusGeometry(0.65, 0.05, 5, 14),
  new THREE.MeshStandardMaterial({ color: 0xff8fab, flatShading: true })
);
rim.castShadow = true;
wheelSpin.add(rim);
const hub = new THREE.Mesh(
  new THREE.CylinderGeometry(0.08, 0.08, 0.12, 6),
  new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true })
);
hub.rotation.x = Math.PI / 2;
wheelSpin.add(hub);
for (let i = 0; i < 6; i++) {
  const spoke = new THREE.Mesh(
    new THREE.CylinderGeometry(0.025, 0.025, 1.3, 4),
    new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true })
  );
  spoke.rotation.z = (i / 6) * Math.PI;
  wheelSpin.add(spoke);
}
wheelSpin.position.set(0, 0.95, 0.35);
wheelGroup.add(wheelSpin);
wheelGroup.position.copy(WHEEL_POS);
wheelGroup.rotation.y = 0.9; // face into the cage
scene.add(wheelGroup);

// --- a couple of decorative blocks ---
[[0x9be7ff, -1.5, 1.8], [0xffd166, 1.0, -2.0]].forEach(([c, x, z]) => {
  const b = new THREE.Mesh(
    new THREE.BoxGeometry(0.45, 0.45, 0.45),
    new THREE.MeshStandardMaterial({ color: c, flatShading: true })
  );
  b.position.set(x, 0.32, z);
  b.rotation.y = Math.random() * Math.PI;
  b.castShadow = true;
  scene.add(b);
});

/* ============================== HAMSTERS ============================== */
function makeHamster(bodyColor, bellyColor) {
  const g = new THREE.Group();
  const mat  = new THREE.MeshStandardMaterial({ color: bodyColor, flatShading: true });
  const bMat = new THREE.MeshStandardMaterial({ color: bellyColor, flatShading: true });

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.3, 7, 5), mat);
  body.scale.set(1, 0.85, 1.25);
  body.castShadow = true;
  g.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 6, 5), mat);
  head.position.set(0, 0.08, 0.34);
  head.castShadow = true;
  g.add(head);

  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 4), bMat);
  belly.position.set(0, -0.05, 0.22);
  belly.scale.set(0.9, 0.7, 0.8);
  g.add(belly);

  [[-1], [1]].forEach(([s]) => {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.12, 5), mat);
    ear.position.set(s * 0.12, 0.26, 0.3);
    g.add(ear);
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 5, 4),
      new THREE.MeshStandardMaterial({ color: 0x222222 })
    );
    eye.position.set(s * 0.14, 0.12, 0.48);
    g.add(eye);
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 4), bMat);
    foot.position.set(s * 0.12, -0.22, 0.1);
    g.add(foot);
  });

  const nose = new THREE.Mesh(
    new THREE.SphereGeometry(0.04, 5, 4),
    new THREE.MeshStandardMaterial({ color: 0xff5c8a })
  );
  nose.position.set(0, 0.05, 0.53);
  g.add(nose);

  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.1, 4), mat);
  tail.position.set(0, 0, -0.4);
  tail.rotation.x = -Math.PI / 2;
  g.add(tail);

  return { group: g, body, head };
}

const hamsters = [];
const SPAWNS = [
  { color: 0xf4a259, belly: 0xfff1dd, pos: [-2.7, -0.9], wheel: true }, // the wheel fan
  { color: 0xffffff, belly: 0xffe0e6, pos: [2.0, 1.2] },
  { color: 0xb8b8d1, belly: 0xf0f0ff, pos: [-1.0, -1.5] },
  { color: 0xffd6a5, belly: 0xfff8ef, pos: [0.5, 1.8] },
];

SPAWNS.forEach((s, i) => {
  const { group, body, head } = makeHamster(s.color, s.belly);
  group.position.set(s.pos[0], 0.3, s.pos[1]);
  scene.add(group);
  hamsters.push({
    group, body, head,
    pos: new THREE.Vector3(s.pos[0], 0, s.pos[1]),
    heading: Math.random() * Math.PI * 2,
    speed: 0.8 + Math.random() * 0.5,
    state: s.wheel ? 'wheel' : 'wander',
    timer: s.wheel ? 6 : 1,
    target: new THREE.Vector3(),
    aimingBowl: false,
    isWheelRunner: !!s.wheel,
    phase: i * 1.7 // desync animations
  });
});

/* ============================== AI ============================== */
const BOUNDS = { x: 3.35, z: 2.45 };

function lerpAngle(a, b, t) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * Math.min(1, t);
}

function pickWanderTarget(h) {
  let x, z, tries = 0;
  do {
    x = (Math.random() * 2 - 1) * BOUNDS.x;
    z = (Math.random() * 2 - 1) * BOUNDS.z;
    tries++;
  } while ((Math.hypot(x - TUNNEL_POS.x, z - TUNNEL_POS.z) < 0.8 || tries < 10));

  const roll = Math.random();
  if (h.isWheelRunner && roll < 0.35) {           // wheel runner sometimes goes back to wheel
    h.target.copy(WHEEL_POS).add(new THREE.Vector3(0.6, 0, 0.6));
    h.aimingBowl = 'wheel';
  } else if (roll < 0.55) {                        // others often aim for the bowl
    h.target.set(BOWL_POS.x - 0.55, 0, BOWL_POS.z - 0.55);
    h.aimingBowl = 'bowl';
  } else {
    h.target.set(x, 0, z);
    h.aimingBowl = false;
  }
  h.state = 'wander';
  h.timer = 8;
}

let wheelVel = 8, wheelTarget = 8;

function updateHamster(h, dt, t) {
  h.timer -= dt;
  const localT = t + h.phase;

  if (h.state === 'wander') {
    const dx = h.target.x - h.pos.x, dz = h.target.z - h.pos.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.2 || h.timer <= 0) {
      if (h.aimingBowl === 'bowl') { h.state = 'eat'; h.timer = 1.5 + Math.random() * 2; }
      else if (h.aimingBowl === 'wheel') {
        h.state = 'wheel'; h.timer = 4 + Math.random() * 4; wheelTarget = 9;
      }
      else { h.state = 'pause'; h.timer = 0.8 + Math.random() * 2.5; }
    } else {
      h.heading = lerpAngle(h.heading, Math.atan2(dx, dz), 8 * dt);
      h.pos.x += Math.sin(h.heading) * h.speed * dt;
      h.pos.z += Math.cos(h.heading) * h.speed * dt;
    }
    h.moving = true;
  }
  else if (h.state === 'pause') {
    h.moving = false;
    if (h.timer <= 0) pickWanderTarget(h);
  }
  else if (h.state === 'eat') {
    h.moving = false;
    h.heading = lerpAngle(h.heading,
      Math.atan2(BOWL_POS.x - h.pos.x, BOWL_POS.z - h.pos.z), 8 * dt);
    if (h.timer <= 0) pickWanderTarget(h);
  }
  else if (h.state === 'wheel') {
    h.moving = true;
    h.heading = lerpAngle(h.heading,
      Math.atan2(WHEEL_POS.x - h.pos.x, WHEEL_POS.z - h.pos.z), 8 * dt);
    if (h.timer <= 0) { wheelTarget = 0; pickWanderTarget(h); }
  }

  // keep inside the cage
  h.pos.x = Math.max(-BOUNDS.x, Math.min(BOUNDS.x, h.pos.x));
  h.pos.z = Math.max(-BOUNDS.z, Math.min(BOUNDS.z, h.pos.z));

  // apply transforms: bob + squash while moving, extra wiggle on the wheel
  const running = h.state === 'wheel';
  const bobFreq = running ? 16 : 9;
  const bob = h.moving ? Math.abs(Math.sin(localT * bobFreq)) * (running ? 0.09 : 0.04) : 0;
  h.group.position.set(h.pos.x, 0.3 + bob, h.pos.z);
  h.group.rotation.y = h.heading;

  const squash = h.moving ? 1 + Math.sin(localT * bobFreq) * 0.05 : 1;
  h.group.scale.set(1 / Math.sqrt(squash), squash, 1 / Math.sqrt(squash));

  // little head bob while eating
  h.head.position.y = 0.08 + (h.state === 'eat' ? Math.sin(localT * 14) * 0.05 : 0);
}

/* ============================== LOOP ============================== */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  hamsters.forEach(h => updateHamster(h, dt, t));

  wheelVel += (wheelTarget - wheelVel) * Math.min(1, dt * 3);
  wheelSpin.rotation.z -= wheelVel * dt;

  // gentle idle sway on the bowl seeds for a bit of life
  bowl.children.forEach((c, i) => { if (i > 0) c.position.y = 0.12 + Math.sin(t * 2 + i) * 0.008; });

  updateCamera();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
