<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe8f0; }
  #info {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
    background: rgba(255,255,255,0.85); padding: 8px 18px; border-radius: 20px;
    color: #7a4b2a; font-size: 15px; pointer-events: none;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
  }
</style>
</head>
<body>
<div id="info">🐹 Low-Poly Hamster Playground — drag to rotate, scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   SCENE / RENDERER / CAMERA
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe8f0);
scene.fog = new THREE.Fog(0xffe8f0, 25, 45);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9, 7, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.49;

/* ============================================================
   LIGHTS
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xfff0f5, 0xffd9a0, 0.9));

const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(8, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;   sun.shadow.camera.bottom = -10;
scene.add(sun);

/* ============================================================
   HELPERS
   ============================================================ */
function mat(color) {
  return new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.9 });
}
function mesh(geo, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
const rand = (a, b) => a + Math.random() * (b - a);

/* ============================================================
   CAGE: TRAY + WIRE WALLS
   ============================================================ */
const CAGE_R = 5.8;

// ground under everything
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 32),
  new THREE.MeshStandardMaterial({ color: 0xf7c8dc, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
ground.receiveShadow = true;
scene.add(ground);

// tray (floor of the cage)
const tray = mesh(new THREE.CylinderGeometry(CAGE_R, CAGE_R * 0.95, 0.5, 24), mat(0x8ecae6), 0, 0.25, 0);
scene.add(tray);
// bedding
const bedding = mesh(new THREE.CylinderGeometry(CAGE_R * 0.94, CAGE_R * 0.94, 0.12, 24), mat(0xffd166), 0, 0.52, 0);
scene.add(bedding);

// wire walls: vertical bars + horizontal rings
const barMat = new THREE.MeshStandardMaterial({ color: 0xadb5bd, flatShading: true, roughness: 0.4, metalness: 0.5 });
const barGeo = new THREE.CylinderGeometry(0.045, 0.045, 3.2, 5);
const BAR_COUNT = 26;
for (let i = 0; i < BAR_COUNT; i++) {
  const a = (i / BAR_COUNT) * Math.PI * 2;
  const bar = new THREE.Mesh(barGeo, barMat);
  bar.position.set(Math.cos(a) * CAGE_R, 2.05, Math.sin(a) * CAGE_R);
  scene.add(bar);
}
[1.2, 2.6].forEach(y => {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(CAGE_R, 0.05, 6, 40), barMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = y;
  scene.add(ring);
});
// top rim
const rim = new THREE.Mesh(new THREE.TorusGeometry(CAGE_R, 0.09, 6, 40), barMat);
rim.rotation.x = Math.PI / 2;
rim.position.y = 3.65;
scene.add(rim);

/* ============================================================
   WHEEL (interactive object)
   ============================================================ */
const WHEEL_POS = new THREE.Vector3(0, 0, 4.35);
const wheelGroup = new THREE.Group();
wheelGroup.position.copy(WHEEL_POS);
wheelGroup.position.y = 1.05;
scene.add(wheelGroup);

const wheelMat = mat(0xf06595);
const rimGeo = new THREE.TorusGeometry(1.0, 0.09, 6, 20);
for (let i = 0; i < 2; i++) {
  const ring = new THREE.Mesh(rimGeo, wheelMat);
  ring.position.x = i === 0 ? -0.28 : 0.28;
  ring.castShadow = true;
  wheelGroup.add(ring);
}
const spokeMat = mat(0xffd166);
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2;
  const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.56, 5), spokeMat);
  spoke.rotation.z = Math.PI / 2;
  spoke.position.set(0, Math.sin(a) * 1.0, Math.cos(a) * 1.0);
  wheelGroup.add(spoke);
}
// stand
const stand = mesh(new THREE.CylinderGeometry(0.1, 0.14, 1.05, 6), mat(0x6d597a), 0, -1.05, 0);
wheelGroup.add(stand);

let wheelSpeed = 0;
let wheelOccupied = 0;

/* ============================================================
   FOOD BOWL
   ============================================================ */
const BOWL_POS = new THREE.Vector3(-3.2, 0, -2.4);
const bowl = new THREE.Group();
const bowlBase = mesh(new THREE.CylinderGeometry(0.55, 0.4, 0.28, 10), mat(0x9b5de5));
bowl.add(bowlBase);
const pelletGeo = new THREE.IcosahedronGeometry(0.09, 0);
for (let i = 0; i < 7; i++) {
  const p = mesh(pelletGeo, mat(0xf4a261),
    rand(-0.25, 0.25), 0.28, rand(-0.25, 0.25));
  bowl.add(p);
}
bowl.position.copy(BOWL_POS);
bowl.position.y = 0.62;
scene.add(bowl);

/* ============================================================
   TUNNEL + DECOR
   ============================================================ */
const tunnel = mesh(new THREE.TorusGeometry(0.55, 0.32, 6, 12, Math.PI), mat(0x52b788), 3.2, 0.65, -2.6);
tunnel.rotation.x = 0;                 // arc opening downward
tunnel.rotation.y = Math.PI / 3;
scene.add(tunnel);

// hay tufts
for (let i = 0; i < 10; i++) {
  const hay = mesh(new THREE.ConeGeometry(0.12, 0.45, 4), mat(0xe9c46a));
  const a = rand(0, Math.PI * 2), r = rand(1, 4.6);
  hay.position.set(Math.cos(a) * r, 0.7, Math.sin(a) * r);
  hay.rotation.set(rand(-0.3, 0.3), rand(0, 3), rand(-0.3, 0.3));
  scene.add(hay);
}
// a tiny apple
const apple = mesh(new THREE.IcosahedronGeometry(0.18, 0), mat(0xe63946), -1.5, 0.72, 2.8);
scene.add(apple);

/* ============================================================
   HAMSTERS
   ============================================================ */
function createHamster(bodyColor, bellyColor) {
  const g = new THREE.Group();

  const body = mesh(new THREE.SphereGeometry(0.34, 8, 6), mat(bodyColor));
  body.scale.set(1, 0.9, 1.35);
  body.position.y = 0.34;
  g.add(body);

  const belly = mesh(new THREE.SphereGeometry(0.28, 8, 6), mat(bellyColor));
  belly.scale.set(0.85, 0.7, 1.15);
  belly.position.set(0, 0.24, 0.05);
  g.add(belly);

  const head = mesh(new THREE.SphereGeometry(0.24, 8, 6), mat(bodyColor), 0, 0.42, 0.32);
  g.add(head);

  // ears
  [-1, 1].forEach(s => {
    const ear = mesh(new THREE.ConeGeometry(0.08, 0.14, 5), mat(0xf4a0b0), s * 0.15, 0.63, 0.28);
    ear.rotation.z = s * -0.3;
    g.add(ear);
  });
  // eyes
  [-1, 1].forEach(s => {
    const eye = mesh(new THREE.SphereGeometry(0.035, 5, 4), mat(0x2b2d42), s * 0.11, 0.46, 0.52);
    g.add(eye);
  });
  // nose
  g.add(mesh(new THREE.SphereGeometry(0.04, 5, 4), mat(0xf06595), 0, 0.4, 0.55));
  // tail
  g.add(mesh(new THREE.SphereGeometry(0.07, 5, 4), mat(bellyColor), 0, 0.34, -0.45));

  // feet (animated)
  const feet = [];
  [[-0.15, 0.26], [0.15, 0.26], [-0.15, -0.26], [0.15, -0.26]].forEach(([x, z]) => {
    const f = mesh(new THREE.SphereGeometry(0.07, 5, 4), mat(bellyColor), x, 0.07, z);
    g.add(f);
    feet.push(f);
  });

  return { group: g, head, feet };
}

const HAMSTER_SPECS = [
  { body: 0xf4a261, belly: 0xfff1e6 },  // orange
  { body: 0x9b5de5, belly: 0xe9d5ff },  // purple (yes, purple hamster, it's chaotic)
  { body: 0xadb5bd, belly: 0xf1f3f5 },  // gray
  { body: 0xffd166, belly: 0xfff9e6 },  // yellow
];

const hamsters = HAMSTER_SPECS.map((spec, i) => {
  const h = createHamster(spec.body, spec.belly);
  const a = (i / HAMSTER_SPECS.length) * Math.PI * 2 + 0.5;
  h.group.position.set(Math.cos(a) * 2.5, 0.58, Math.sin(a) * 2.5);
  scene.add(h.group);

  return {
    ...h,
    heading: rand(0, Math.PI * 2),
    speed: 0,
    state: 'wander',
    timer: rand(1, 3),
    runPhase: rand(0, 10),
  };
});

/* ============================================================
   BEHAVIOR
   ============================================================ */
function steerToward(h, tx, tz) {
  const desired = Math.atan2(tx - h.group.position.x, tz - h.group.position.z);
  let diff = desired - h.heading;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  h.heading += diff * Math.min(1, 0.08);
}

function updateHamster(h, dt) {
  const p = h.group.position;
  const dist = Math.hypot(p.x, p.z);

  h.timer -= dt;
  let moving = false;

  switch (h.state) {
    case 'wander':
      moving = true;
      h.heading += rand(-1, 1) * dt * 0.8;
      if (dist > 4.4) steerToward(h, -p.x, -p.z); // stay in cage
      if (h.timer <= 0) {
        const roll = Math.random();
        if (roll < 0.4) { h.state = 'pause'; h.timer = rand(0.8, 2.5); }
        else if (roll < 0.65) { h.state = 'toWheel'; }
        else if (roll < 0.85) { h.state = 'toBowl'; }
        else { h.timer = rand(1.5, 3); }
      }
      break;

    case 'pause':
      if (h.timer <= 0) { h.state = 'wander'; h.timer = rand(1.5, 3.5); }
      break;

    case 'toWheel':
      moving = true;
      steerToward(h, WHEEL_POS.x, WHEEL_POS.z - 0.9);
      if (Math.hypot(p.x - WHEEL_POS.x, p.z - (WHEEL_POS.z - 0.3)) < 0.45) {
        h.state = 'inWheel';
        h.timer = rand(4, 8);
        wheelOccupied++;
      }
      break;

    case 'inWheel':
      moving = true; // running in place
      h.heading = Math.atan2(-p.x, -p.z); // face cage center
      p.set(WHEEL_POS.x, 0.58, WHEEL_POS.z - 0.35);
      if (h.timer <= 0) {
        h.state = 'wander';
        h.timer = rand(2, 4);
        wheelOccupied = Math.max(0, wheelOccupied - 1);
      }
      break;

    case 'toBowl':
      moving = true;
      steerToward(h, BOWL_POS.x, BOWL_POS.z);
      if (Math.hypot(p.x - BOWL_POS.x, p.z - BOWL_POS.z) < 0.9) {
        h.state = 'eat';
        h.timer = rand(2.5, 4.5);
      }
      break;

    case 'eat':
      h.heading = Math.atan2(BOWL_POS.x - p.x, BOWL_POS.z - p.z);
      if (h.timer <= 0) { h.state = 'wander'; h.timer = rand(2, 4); }
      break;
  }

  // move + soft speed ramp
  const targetSpeed = moving ? (h.state === 'inWheel' ? 0 : 1.6) : 0;
  h.speed += (targetSpeed - h.speed) * Math.min(1, dt * 5);
  if (h.state !== 'inWheel') {
    p.x += Math.sin(h.heading) * h.speed * dt;
    p.z += Math.cos(h.heading) * h.speed * dt;
    const d = Math.hypot(p.x, p.z);
    if (d > 4.9) { p.x *= 4.9 / d; p.z *= 4.9 / d; }
  }

  // orient + animate
  h.group.rotation.y = h.heading;
  h.runPhase += h.speed * dt * 8;

  // bob while walking
  h.group.position.y = 0.58 + (h.speed > 0.2 ? Math.abs(Math.sin(h.runPhase)) * 0.05 : 0);
  // eating: head bobs down
  const eating = h.state === 'eat';
  h.head.rotation.x = THREE.MathUtils.lerp(h.head.rotation.x, eating ? Math.sin(h.runPhase * 2) * 0.5 + 0.4 : 0, 0.15);
  // feet scurry
  h.feet.forEach((f, i) => {
    f.position.z = (i < 2 ? 0.26 : -0.26) + (h.speed > 0.2 ? Math.sin(h.runPhase + (i % 2) * Math.PI) * 0.06 : 0);
  });
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // wheel spins while occupied
  const target = wheelOccupied > 0 ? 6 : 0;
  wheelSpeed += (target - wheelSpeed) * Math.min(1, dt * 2);
  wheelGroup.rotation.x += wheelSpeed * dt;

  hamsters.forEach(h => updateHamster(h, dt));

  // apple wiggles a little, because why not
  apple.rotation.y += dt * 0.5;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
