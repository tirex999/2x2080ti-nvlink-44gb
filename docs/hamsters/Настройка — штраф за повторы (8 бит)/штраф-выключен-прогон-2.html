<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #ffe9d6; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 18px; left: 0; right: 0;
    text-align: center; pointer-events: none;
    font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
  }
  #title {
    font-size: 30px; font-weight: bold; color: #7a4a21;
    text-shadow: 2px 2px 0 #fff;
  }
  #hint {
    margin-top: 6px; font-size: 14px; color: #a06a3a;
    background: rgba(255,255,255,0.6);
    display: inline-block; padding: 4px 14px; border-radius: 20px;
  }
</style>
</head>
<body>
<div id="ui">
  <div id="title">🐹 Low-Poly Hamster Playground</div>
  <div id="hint">Drag to rotate &nbsp;•&nbsp; Scroll to zoom &nbsp;•&nbsp; Watch them run the wheel!</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe9d6);
scene.fog = new THREE.Fog(0xffe9d6, 18, 34);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7, 6, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.49;

/* ============================================================
   LIGHTS
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xfff4e0, 0xd9a066, 0.9));

const sun = new THREE.DirectionalLight(0xfff0d0, 1.4);
sun.position.set(6, 10, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;   sun.shadow.camera.bottom = -8;
scene.add(sun);

/* ============================================================
   HELPERS
   ============================================================ */
function mat(color) {
  return new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85 });
}
function box(w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.castShadow = m.receiveShadow = true;
  return m;
}

/* ============================================================
   ROOM FLOOR
   ============================================================ */
const roomFloor = new THREE.Mesh(
  new THREE.CircleGeometry(16, 24),
  mat(0xf7c98b)
);
roomFloor.rotation.x = -Math.PI / 2;
roomFloor.position.y = -0.6;
roomFloor.receiveShadow = true;
scene.add(roomFloor);

// rug under the cage
const rug = new THREE.Mesh(new THREE.CircleGeometry(6, 20), mat(0xf49a6a));
rug.rotation.x = -Math.PI / 2;
rug.position.y = -0.59;
rug.receiveShadow = true;
scene.add(rug);

/* ============================================================
   CAGE: TRAY + WIRE BARS
   ============================================================ */
const cage = new THREE.Group();
scene.add(cage);

const TRAY_W = 7, TRAY_D = 4.5, BARS_H = 1.7;

// base tray
const tray = box(TRAY_W + 0.3, 0.35, TRAY_D + 0.3, 0x8fd3e8);
tray.position.y = -0.22;
cage.add(tray);

// bedding
const bedding = box(TRAY_W, 0.12, TRAY_D, 0xf5d76e);
bedding.position.y = 0.02;
cage.add(bedding);

// vertical bars around the perimeter
const barMat = new THREE.MeshStandardMaterial({ color: 0xb8c4cc, flatShading: true, roughness: 0.4, metalness: 0.5 });
function bar(x, z) {
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, BARS_H, 5), barMat);
  b.position.set(x, BARS_H / 2, z);
  b.castShadow = true;
  cage.add(b);
}
const step = 0.55;
for (let x = -TRAY_W / 2; x <= TRAY_W / 2 + 0.01; x += step) {
  bar(x, -TRAY_D / 2);
  bar(x, TRAY_D / 2);
}
for (let z = -TRAY_D / 2 + step; z <= TRAY_D / 2 - step + 0.01; z += step) {
  bar(-TRAY_W / 2, z);
  bar(TRAY_W / 2, z);
}
// horizontal rails (top + middle)
[0.55, BARS_H].forEach(h => {
  const railX = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, TRAY_W, 6), barMat);
  railX.rotation.z = Math.PI / 2;
  railX.position.set(0, h, -TRAY_D / 2);
  cage.add(railX);
  const railX2 = railX.clone(); railX2.position.z = TRAY_D / 2; cage.add(railX2);
  const railZ = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, TRAY_D, 6), barMat);
  railZ.rotation.x = Math.PI / 2;
  railZ.position.set(-TRAY_W / 2, h, 0);
  cage.add(railZ);
  const railZ2 = railZ.clone(); railZ2.position.x = TRAY_W / 2; cage.add(railZ2);
});

/* ============================================================
   WHEEL  (interactive object)
   ============================================================ */
const WHEEL_POS = new THREE.Vector3(2.7, 0, 0);
const wheel = new THREE.Group();
wheel.position.copy(WHEEL_POS);
wheel.position.y = 0.62;
cage.add(wheel);

const rim = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.07, 6, 14), mat(0xff6b9d));
rim.rotation.y = Math.PI / 2;
rim.castShadow = true;
wheel.add(rim);

const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.12, 6), mat(0xffd166));
hub.rotation.z = Math.PI / 2;
wheel.add(hub);

for (let i = 0; i < 6; i++) {
  const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.55, 4), mat(0xffd166));
  const a = (i / 6) * Math.PI * 2;
  spoke.position.set(0, Math.cos(a) * 0.27, Math.sin(a) * 0.27);
  spoke.rotation.x = a;
  wheel.add(spoke);
}
// stand
const stand = box(0.12, 0.62, 0.5, 0xff8fab);
stand.position.set(0.35, -0.31, 0);
wheel.add(stand);

let wheelSpin = 0; // current angular speed

/* ============================================================
   FOOD BOWL
   ============================================================ */
const BOWL_POS = new THREE.Vector3(-2.4, 0.08, -1.2);
const bowl = new THREE.Group();
bowl.position.copy(BOWL_POS);
cage.add(bowl);
const bowlBody = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.3, 0.22, 8), mat(0x6ec6ff));
bowlBody.castShadow = true;
bowl.add(bowlBody);
for (let i = 0; i < 5; i++) {
  const pellet = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 4), mat(0xff9f43));
  pellet.position.set((Math.random() - 0.5) * 0.4, 0.12, (Math.random() - 0.5) * 0.4);
  bowl.add(pellet);
}

/* ============================================================
   TUNNEL
   ============================================================ */
const tunnel = new THREE.Mesh(
  new THREE.CylinderGeometry(0.5, 0.5, 1.7, 8, 1, true, 0, Math.PI),
  new THREE.MeshStandardMaterial({ color: 0x9be564, flatShading: true, roughness: 0.8, side: THREE.DoubleSide })
);
tunnel.rotation.z = Math.PI / 2;
tunnel.rotation.y = Math.PI / 5;
tunnel.position.set(-1.6, 0.5, 1.3);
tunnel.castShadow = true;
cage.add(tunnel);

/* ============================================================
   HAY TUFTS
   ============================================================ */
for (let i = 0; i < 10; i++) {
  const hay = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 5), mat(0xe8c34a));
  hay.position.set(
    (Math.random() - 0.5) * (TRAY_W - 1),
    0.18,
    (Math.random() - 0.5) * (TRAY_D - 1)
  );
  hay.rotation.set((Math.random() - 0.5) * 0.6, Math.random() * Math.PI, (Math.random() - 0.5) * 0.6);
  cage.add(hay);
}

/* ============================================================
   HAMSTERS
   ============================================================ */
const HAMSTER_COLORS = [
  { body: 0xf5a65b, ear: 0xf08a4b, cheek: 0xffb3b3 }, // orange
  { body: 0xf2ede4, ear: 0xe8ddd0, cheek: 0xffb3c1 }, // white
  { body: 0xb8b8c4, ear: 0xa3a3b3, cheek: 0xffc0cb }, // gray
  { body: 0xffd97a, ear: 0xf5c24e, cheek: 0xffa8a8 }, // golden
];

function makeHamster(colors) {
  const g = new THREE.Group();

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.32, 7, 5), mat(colors.body));
  body.scale.set(1.05, 0.85, 1.35);
  body.position.y = 0.3;
  body.castShadow = true;
  g.add(body);

  // face (front = +z)
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 5, 4), mat(0xff7b9c));
  nose.position.set(0, 0.32, 0.44);
  g.add(nose);

  [-1, 1].forEach(s => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 5, 4), mat(0x2b2b2b));
    eye.position.set(0.13 * s, 0.4, 0.38);
    g.add(eye);
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.09, 5, 4), mat(colors.cheek));
    cheek.scale.set(1, 0.7, 0.5);
    cheek.position.set(0.2 * s, 0.26, 0.33);
    g.add(cheek);
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.09, 5, 4), mat(colors.ear));
    ear.scale.set(1, 0.6, 0.4);
    ear.position.set(0.16 * s, 0.56, -0.05);
    g.add(ear);
  });

  // stubby feet
  [-1, 1].forEach(s => {
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 4), mat(colors.ear));
    foot.position.set(0.15 * s, 0.09, 0.15);
    g.add(foot);
    const footBack = foot.clone();
    footBack.position.z = -0.2;
    g.add(footBack);
  });

  // tiny tail
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.05, 4, 3), mat(colors.ear));
  tail.position.set(0, 0.28, -0.42);
  g.add(tail);

  g.userData.body = body;
  return g;
}

/* ---------- simple autonomous behavior ---------- */
const BOUNDS = { x: 2.9, z: 1.75 };
const WHEEL_SPOT = new THREE.Vector3(1.95, 0, 0);   // where a hamster stands to run
const BOWL_SPOT  = new THREE.Vector3(-1.7, 0, -1.0); // where a hamster stands to eat

const hamsters = [];

HAMSTER_COLORS.forEach((c, i) => {
  const h = makeHamster(c);
  h.position.set(
    (Math.random() - 0.5) * 4,
    0,
    (Math.random() - 0.5) * 2.5
  );
  h.rotation.y = Math.random() * Math.PI * 2;
  scene.add(h);

  const agent = {
    mesh: h,
    state: 'wander',
    target: new THREE.Vector3(),
    timer: 1 + Math.random() * 2,
    speed: 0.8 + Math.random() * 0.3,
    phase: Math.random() * 10,
    wheelTimer: 0,
  };
  pickNewState(agent);
  hamsters.push(agent);
});

function pickNewState(a) {
  const r = Math.random();
  if (r < 0.45) {
    a.state = 'wander';
    a.target.set(
      (Math.random() * 2 - 1) * BOUNDS.x,
      0,
      (Math.random() * 2 - 1) * BOUNDS.z
    );
    a.timer = 99; // until arrival
  } else if (r < 0.75) {
    a.state = 'pause';
    a.timer = 1 + Math.random() * 2.5;
  } else if (r < 0.9) {
    a.state = 'eat';
    a.target.copy(BOWL_SPOT);
    a.timer = 2.5 + Math.random() * 2;
  } else {
    a.state = 'wheel';
    a.target.copy(WHEEL_SPOT);
    a.timer = 3 + Math.random() * 3;
    a.wheelTimer = a.timer;
  }
}

function steerTo(a, target, dt, speed) {
  const dir = new THREE.Vector3().subVectors(target, a.mesh.position);
  dir.y = 0;
  const dist = dir.length();
  if (dist > 0.05) {
    dir.normalize();
    a.mesh.position.addScaledVector(dir, speed * dt);
    // smoothly turn toward movement direction
    const targetRot = Math.atan2(dir.x, dir.z);
    let diff = targetRot - a.mesh.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    a.mesh.rotation.y += diff * Math.min(1, dt * 8);
    return true; // still moving
  }
  return false;
}

function updateHamsters(dt, t) {
  let anyRunningWheel = false;

  for (const a of hamsters) {
    const m = a.mesh;
    a.timer -= dt;

    switch (a.state) {
      case 'wander': {
        const moving = steerTo(a, a.target, dt, a.speed);
        if (!moving || a.timer <= 0) pickNewState(a);
        break;
      }
      case 'pause': {
        // occasional wiggle while paused
        m.rotation.y += Math.sin(t * 3 + a.phase) * dt * 0.4;
        if (a.timer <= 0) pickNewState(a);
        break;
      }
      case 'eat': {
        const moving = steerTo(a, a.target, dt, a.speed);
        if (!moving) {
          // face the bowl and munch
          const toBowl = new THREE.Vector3().subVectors(BOWL_POS, m.position);
          const rot = Math.atan2(toBowl.x, toBowl.z);
          let diff = rot - m.rotation.y;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          m.rotation.y += diff * Math.min(1, dt * 8);
          if (a.timer <= 0) pickNewState(a);
        }
        break;
      }
      case 'wheel': {
        const moving = steerTo(a, a.target, dt, a.speed);
        if (!moving) {
          // face the wheel (+x) and run!
          let diff = Math.PI / 2 - m.rotation.y;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          m.rotation.y += diff * Math.min(1, dt * 8);
          anyRunningWheel = true;
          if (a.timer <= 0) pickNewState(a);
        }
        break;
      }
    }

    /* ---- bobbing animation ---- */
    const body = m.userData.body;
    let bobAmp = 0.02, bobFreq = 6;
    if (a.state === 'wander' || a.state === 'eat' || a.state === 'wheel') {
      bobAmp = (a.state === 'wheel') ? 0.06 : 0.035;
      bobFreq = (a.state === 'wheel') ? 18 : 10;
    }
    body.position.y = 0.3 + Math.sin(t * bobFreq + a.phase) * bobAmp;
    // slight squash & stretch
    const s = 1 + Math.sin(t * bobFreq + a.phase) * 0.03;
    body.scale.set(1.05 / s, 0.85 * s, 1.35);
  }

  /* ---- wheel physics: spins up while used, coasts down ---- */
  const targetSpin = anyRunningWheel ? 9 : 0;
  wheelSpin += (targetSpin - wheelSpin) * Math.min(1, dt * 2.5);
  wheel.rotation.x -= wheelSpin * dt;
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  updateHamsters(dt, t);

  // gentle idle wobble on the tunnel (fun detail)
  tunnel.rotation.y = Math.PI / 5 + Math.sin(t * 0.7) * 0.05;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
