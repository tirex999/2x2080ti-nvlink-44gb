<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Hamster Playground</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #ffe9f0; }
  canvas { display: block; }
  #info {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    color: #7a4b2d; background: rgba(255,255,255,0.75);
    padding: 8px 18px; border-radius: 20px; font-size: 15px;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="info">🐹 Low-Poly Hamster Playground — drag to rotate, scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------
//  Basic setup
// ---------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffe9f0);
scene.fog = new THREE.Fog(0xffe9f0, 20, 45);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9, 7, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.49;

// ---------------------------------------------------------------
//  Lights
// ---------------------------------------------------------------
scene.add(new THREE.AmbientLight(0xfff0e0, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(6, 10, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;   sun.shadow.camera.bottom = -10;
scene.add(sun);

// ---------------------------------------------------------------
//  Helpers
// ---------------------------------------------------------------
function mat(color) {
  return new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.9 });
}
function mesh(geo, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// ---------------------------------------------------------------
//  Cage & tray
// ---------------------------------------------------------------
const TRAY_R = 5;

// Tray
const tray = new THREE.Group();
tray.add(mesh(new THREE.CylinderGeometry(TRAY_R, TRAY_R - 0.3, 0.5, 10), mat(0xf7b7d3), 0, 0.25, 0));
tray.add(mesh(new THREE.CylinderGeometry(TRAY_R - 0.25, TRAY_R - 0.25, 0.08, 10), mat(0xffe3a3), 0, 0.52, 0)); // bedding
scene.add(tray);

// Wire cage: vertical bars + top/bottom rings
const cage = new THREE.Group();
const barMat = new THREE.MeshStandardMaterial({ color: 0x9aa5b1, metalness: 0.6, roughness: 0.4, flatShading: true });
const CAGE_R = TRAY_R + 0.15;
const CAGE_H = 4.2;
const BAR_COUNT = 24;
for (let i = 0; i < BAR_COUNT; i++) {
  const a = (i / BAR_COUNT) * Math.PI * 2;
  const bar = mesh(new THREE.BoxGeometry(0.07, CAGE_H, 0.07), barMat);
  bar.position.set(Math.cos(a) * CAGE_R, 0.5 + CAGE_H / 2, Math.sin(a) * CAGE_R);
  cage.add(bar);
}
const ringGeo = new THREE.TorusGeometry(CAGE_R, 0.09, 6, 24);
[[0.55], [0.5 + CAGE_H]].forEach(([y]) => {
  const ring = mesh(ringGeo, barMat, 0, y, 0);
  ring.rotation.x = Math.PI / 2;
  ring.castShadow = false;
  cage.add(ring);
});
scene.add(cage);

// ---------------------------------------------------------------
//  Interactive objects
// ---------------------------------------------------------------

// --- Exercise wheel ---
const wheelGroup = new THREE.Group();
const wheelSpin = new THREE.Group(); // the part that actually spins
const wheelMat = mat(0x6ec6ff);
const rim = mesh(new THREE.TorusGeometry(0.9, 0.12, 6, 12), wheelMat);
wheelSpin.add(rim);
for (let i = 0; i < 4; i++) {
  const spoke = mesh(new THREE.BoxGeometry(1.7, 0.09, 0.09), wheelMat);
  spoke.rotation.z = (i / 4) * Math.PI;
  wheelSpin.add(spoke);
}
const hub = mesh(new THREE.SphereGeometry(0.16, 6, 5), mat(0xff6b9d));
wheelSpin.add(hub);
// stand
const legL = mesh(new THREE.BoxGeometry(0.1, 1.1, 0.1), mat(0xffd166), -0.55, 0.55, 0);
const legR = mesh(new THREE.BoxGeometry(0.1, 1.1, 0.1), mat(0xffd166), 0.55, 0.55, 0);
wheelGroup.add(legL, legR, wheelSpin);
wheelGroup.position.set(3.4, 0.56, -2.6);
wheelGroup.rotation.y = -Math.PI / 5;
scene.add(wheelGroup);
const wheelPos = wheelGroup.position.clone();

// --- Food bowl ---
const foodBowl = new THREE.Group();
foodBowl.add(mesh(new THREE.CylinderGeometry(0.55, 0.4, 0.28, 8), mat(0xff8fab), 0, 0.14, 0));
foodBowl.add(mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.1, 8), mat(0xc98a4b), 0, 0.28, 0));
for (let i = 0; i < 7; i++) {
  const seed = mesh(new THREE.IcosahedronGeometry(0.07, 0), mat([0xffd166, 0xef8354, 0xa8e063][i % 3]),
    (Math.random() - 0.5) * 0.5, 0.34, (Math.random() - 0.5) * 0.5);
  foodBowl.add(seed);
}
foodBowl.position.set(-3.4, 0.56, 2.4);
scene.add(foodBowl);
const bowlPos = foodBowl.position.clone();

// --- Tunnel ---
const tunnel = new THREE.Group();
const tunnelMat = mat(0xb5e48c);
const half = new THREE.Mesh(
  new THREE.CylinderGeometry(0.55, 0.55, 1.8, 10, 1, true, 0, Math.PI),
  new THREE.MeshStandardMaterial({ color: 0xb5e48c, flatShading: true, roughness: 0.9, side: THREE.DoubleSide })
);
half.rotation.z = Math.PI / 2;
half.rotation.y = Math.PI / 2;
half.position.y = 0.55;
half.castShadow = true;
tunnel.add(half);
[-0.9, 0.9].forEach(x => {
  const cap = mesh(new THREE.CircleGeometry(0.55, 10), mat(0x8fc96b), x, 0.55, 0);
  cap.rotation.y = x > 0 ? -Math.PI / 2 : Math.PI / 2;
  tunnel.add(cap);
});
tunnel.position.set(-1.5, 0.56, -3.2);
tunnel.rotation.y = 0.5;
scene.add(tunnel);

// --- Little toy blocks (set dressing) ---
[[-2, 0.85, 0.5, 0xff6b6b, 0.6], [1.8, 0.85, 3.3, 0xa8e063, 0.5], [0.5, 0.8, -1.5, 0xffd166, 0.45]]
.forEach(([x, y, z, c, s]) => {
  const b = mesh(new THREE.BoxGeometry(s, s, s), mat(c), x, y, z);
  b.rotation.y = Math.random() * Math.PI;
  scene.add(b);
});

// ---------------------------------------------------------------
//  Hamster factory
// ---------------------------------------------------------------
function makeHamster(bodyColor, cheekColor) {
  const g = new THREE.Group();
  const bodyMat = mat(bodyColor);
  const cheekMat = mat(cheekColor);

  const body = mesh(new THREE.SphereGeometry(0.42, 7, 6), bodyMat, 0, 0.42, 0);
  body.scale.set(1, 0.9, 1.15);
  g.add(body);

  const head = mesh(new THREE.SphereGeometry(0.3, 7, 6), bodyMat, 0, 0.55, 0.42);
  g.add(head);

  // Cheeks (the classic hamster bulge)
  const cheekL = mesh(new THREE.SphereGeometry(0.14, 6, 5), cheekMat, -0.18, 0.45, 0.55);
  const cheekR = mesh(new THREE.SphereGeometry(0.14, 6, 5), cheekMat, 0.18, 0.45, 0.55);
  g.add(cheekL, cheekR);

  // Ears
  const earGeo = new THREE.ConeGeometry(0.12, 0.22, 5);
  const earL = mesh(earGeo, bodyMat, -0.18, 0.82, 0.3);
  const earR = mesh(earGeo, bodyMat, 0.18, 0.82, 0.3);
  earL.rotation.z = 0.25; earR.rotation.z = -0.25;
  g.add(earL, earR);

  // Eyes
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.3 });
  const eyeGeo = new THREE.SphereGeometry(0.05, 5, 4);
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.12, 0.6, 0.68);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.12, 0.6, 0.68);
  g.add(eyeL, eyeR);

  // Nose
  const nose = mesh(new THREE.SphereGeometry(0.05, 5, 4), mat(0xff7eb6), 0, 0.5, 0.71);
  g.add(nose);

  // Feet (little nubs)
  const footGeo = new THREE.SphereGeometry(0.09, 5, 4);
  [[-0.2, 0.68], [0.2, 0.68], [-0.2, -0.5], [0.2, -0.5]].forEach(([x, z]) => {
    const f = mesh(footGeo, cheekMat, x, 0.09, z);
    f.scale.set(1, 0.6, 1.4);
    g.add(f);
  });

  // Tiny tail
  const tail = mesh(new THREE.SphereGeometry(0.07, 5, 4), cheekMat, 0, 0.4, -0.5);
  g.add(tail);

  g.userData = { body, head, cheekL, cheekR };
  return g;
}

// ---------------------------------------------------------------
//  Hamster AI  (simple state machine: WALK / PAUSE / WHEEL / EAT)
// ---------------------------------------------------------------
const HAMSTER_DATA = [
  { body: 0xf5a25d, cheek: 0xffe0b3, name: 'Nugget' },
  { body: 0xd9c2a9, cheek: 0xfff5e6, name: 'Mochi'  },
  { body: 0xf78fb3, cheek: 0xffd9e4, name: 'Bubble' },
];

const hamsters = HAMSTER_DATA.map(d => {
  const h = makeHamster(d.body, d.cheek);
  const a = Math.random() * Math.PI * 2;
  const r = Math.random() * (TRAY_R - 1.5);
  h.position.set(Math.cos(a) * r, 0.56, Math.sin(a) * r);
  scene.add(h);
  return {
    group: h,
    state: 'PAUSE',
    timer: 1 + Math.random() * 2,
    target: new THREE.Vector3(),
    speed: 0.9 + Math.random() * 0.5,
    phase: Math.random() * 10,
  };
});

function randomPointInTray() {
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * (TRAY_R - 1.2);
  return new THREE.Vector3(Math.cos(a) * r, 0.56, Math.sin(a) * r);
}

function updateHamster(h, dt, t) {
  const g = h.group;
  const pos = g.position;

  h.timer -= dt;

  switch (h.state) {
    case 'PAUSE':
      // Idle wiggle + occasional cheek puff
      g.rotation.z = Math.sin(t * 6 + h.phase) * 0.04;
      if (h.timer <= 0) pickNextAction(h);
      break;

    case 'WALK': {
      const dir = h.target.clone().sub(pos);
      dir.y = 0;
      const dist = dir.length();
      if (dist < 0.15) {
        h.state = 'PAUSE';
        h.timer = 1 + Math.random() * 3;
      } else {
        dir.normalize();
        pos.addScaledVector(dir, h.speed * dt);
        g.rotation.y = Math.atan2(dir.x, dir.z);
        // Walk bob
        g.position.y = 0.56 + Math.abs(Math.sin(t * 10 + h.phase)) * 0.06;
        g.rotation.z = Math.sin(t * 10 + h.phase) * 0.08;
      }
      if (h.timer <= 0) { h.state = 'PAUSE'; h.timer = 0.5 + Math.random(); }
      break;
    }

    case 'TO_WHEEL': {
      const dir = wheelPos.clone().sub(pos);
      dir.y = 0;
      const dist = dir.length();
      if (dist < 1.1) {
        h.state = 'WHEEL';
        h.timer = 3 + Math.random() * 3;
      } else {
        dir.normalize();
        pos.addScaledVector(dir, h.speed * 1.4 * dt);
        g.rotation.y = Math.atan2(dir.x, dir.z);
        g.position.y = 0.56 + Math.abs(Math.sin(t * 14 + h.phase)) * 0.08;
      }
      break;
    }

    case 'WHEEL': {
      // Face the wheel and scurry in place
      g.rotation.y = Math.atan2(wheelPos.x - pos.x, wheelPos.z - pos.z);
      g.position.y = 0.56 + Math.abs(Math.sin(t * 22 + h.phase)) * 0.1;
      g.rotation.z = Math.sin(t * 22 + h.phase) * 0.12;
      wheelSpinSpeed += dt * 4;
      if (h.timer <= 0) {
        h.state = 'PAUSE';
        h.timer = 1.5 + Math.random() * 2;
        // Step off the wheel
        pos.add(new THREE.Vector3((Math.random() - 0.5) * 1.5, 0, (Math.random() - 0.5) * 1.5));
      }
      break;
    }

    case 'TO_BOWL': {
      const approach = bowlPos.clone().add(new THREE.Vector3(0.8, 0, 0.9));
      const dir = approach.clone().sub(pos);
      dir.y = 0;
      const dist = dir.length();
      if (dist < 0.2) {
        h.state = 'EAT';
        h.timer = 2 + Math.random() * 2;
      } else {
        dir.normalize();
        pos.addScaledVector(dir, h.speed * dt);
        g.rotation.y = Math.atan2(dir.x, dir.z);
        g.position.y = 0.56 + Math.abs(Math.sin(t * 10 + h.phase)) * 0.06;
      }
      break;
    }

    case 'EAT': {
      g.rotation.y = Math.atan2(bowlPos.x - pos.x, bowlPos.z - pos.z);
      // Munch: head dips, cheeks puff
      const munch = Math.sin(t * 16) * 0.5 + 0.5;
      g.userData.head.position.y = 0.55 - munch * 0.12;
      const puff = 1 + munch * 0.4;
      g.userData.cheekL.scale.setScalar(puff);
      g.userData.cheekR.scale.setScalar(puff);
      if (h.timer <= 0) {
        h.state = 'PAUSE';
        h.timer = 1 + Math.random() * 3;
        g.userData.head.position.y = 0.55;
        g.userData.cheekL.scale.setScalar(1);
        g.userData.cheekR.scale.setScalar(1);
      }
      break;
    }
  }

  // Keep inside the tray
  const rr = Math.hypot(pos.x, pos.z);
  const maxR = TRAY_R - 0.7;
  if (rr > maxR) { pos.x *= maxR / rr; pos.z *= maxR / rr; }
}

function pickNextAction(h) {
  const roll = Math.random();
  if (roll < 0.4) {
    // Just wander
    h.target = randomPointInTray();
    h.state = 'WALK';
    h.timer = 8;
  } else if (roll < 0.65) {
    h.state = 'TO_WHEEL';
  } else if (roll < 0.85) {
    h.state = 'TO_BOWL';
  } else {
    h.state = 'PAUSE';
    h.timer = 1 + Math.random() * 3;
  }
}

// ---------------------------------------------------------------
//  Animation loop
// ---------------------------------------------------------------
let wheelSpinSpeed = 0;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  hamsters.forEach(h => updateHamster(h, dt, t));

  // Wheel spins fast while used, then coasts to a stop
  wheelSpinSpeed *= Math.pow(0.35, dt); // friction
  if (wheelSpinSpeed < 0.01) wheelSpinSpeed = 0;
  wheelSpin.rotation.x -= wheelSpinSpeed * dt * 3;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
